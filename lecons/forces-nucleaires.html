<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/lecons/forces-nucleaires.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MEV = v => F.qty(F.num(v, 3), "MeV"), FM = v => F.qty(F.num(v, 3), "fm");
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m);
const EL = t("el"), nameOf = id => t("nuc.nom", { el: EL[id.replace(/\d+$/, "")], A: Noyau.MESURES[id].A });

/* ---------- §1 : une attraction plus forte que Coulomb, et courte ---------- */
(() => {
  $("vcoul").textContent = MEV(Noyau.coulombPP(1));
  $("fcoul").textContent = t("s1.f.coul", { j: F.qty(F.sci(Noyau.coulombPP(1) * Noyau.MEV, 3), "J") });
  $("vlien").textContent = MEV(Noyau.MESURES.He4.BA);
  const R = Noyau.PORTEE;
  $("yuk").innerHTML = [1, 2, 5, 10].map(r => { const y = Noyau.yukawa(r, R);
    return `<div><span class="k">${FM(r)}</span><span>${t("yuk.row", { y: y < 0.01 ? F.sci(y, 2) : F.num(y, 2), c: F.num(r, 2) })}</span></div>`; }).join("");
})();

/* ---------- §2 : la courbe d'Aston, modèle et mesures ---------- */
(() => {
  const svg = $("bchart"), Asl = $("Asl"), ids = Object.keys(Noyau.MESURES);
  function draw() {
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, 250], label: t("ba.x") }, y: { domain: [0, 10], label: t("ba.y") } });
    let d = ""; for (let A = 8; A <= 250; A++) d += (A > 8 ? "L" : "M") + x(A).toFixed(1) + " " + y(Math.max(0, Noyau.courbe(A))).toFixed(1);
    Plot.el("path", { d, class: "curve" }, g);
    ids.forEach(id => { const m = Noyau.MESURES[id]; Plot.el("circle", { cx: x(m.A), cy: y(m.BA), r: 4, class: "ref" }, g); });
    ["He4", "Fe56", "U238"].forEach(id => { const m = Noyau.MESURES[id];
      Plot.el("text", { x: x(m.A) + (m.A > 200 ? -6 : 6), y: y(m.BA) - 10, "text-anchor": m.A > 200 ? "end" : "start", class: "note" }, g).textContent = nameOf(id); });
    const A = +Asl.value, Z = Noyau.zStable(A), b = Noyau.liaison(A, Z);
    Plot.el("line", { x1: x(A), x2: x(A), y1: y(0), y2: y(10), class: "zero" }, g);
    Plot.el("circle", { cx: x(A), cy: y(Math.max(0, b.BA)), r: 6, class: "dot" }, g);
    const near = ids.reduce((best, id) => Math.abs(Noyau.MESURES[id].A - A) < Math.abs(Noyau.MESURES[best].A - A) ? id : best, ids[0]);
    const mn = Noyau.MESURES[near];
    $("Aread").textContent = String(A);
    $("vba").textContent = MEV(b.BA);
    $("fba").textContent = t("ba.f.mes", { nuc: nameOf(near), v: MEV(mn.BA), e: F.num(Math.abs(Noyau.liaison(mn.A, mn.Z).BA / mn.BA - 1) * 100, 2) });
    $("vz").textContent = String(Z);
    $("fz").textContent = t("ba.f.n", { n: A - Z });
    $("vr").textContent = FM(Noyau.rayon(A));
    const TERMS = ["volume", "surface", "coulomb", "asymetrie", "appariement"], tk = textOf("ba.terms", TERMS);
    $("terms").innerHTML = TERMS.map(k => `<div><span class="k">${F.qty(F.num(b.termes[k] / A, 3), "MeV")}</span><span>${tk[k]}</span></div>`).join("");
  }
  Asl.oninput = draw; draw();
})();

/* ---------- §3 : ce que la courbe permet ---------- */
(() => {
  const R = [["fusion", ["H2", "H3"], ["He4", "n"], 5], ["fission", ["U235", "n"], ["Ba141", "Kr92", "n", "n", "n"], 236]];
  const txt = textOf("reac.items", R.map(r => r[0]));
  $("reac").innerHTML = R.map(([id, a, b, n]) => { const Q = Noyau.reaction(a, b);
    return `<div><span class="k">${MEV(Q)}</span><span><strong>${txt[id].k}.</strong> ${fill(txt[id].text, { q: MEV(Q / n) })}</span></div>`; }).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rutherford", 1911, "experiment"], ["chadwick", 1932, "experiment"], ["yukawa", 1935, "idea"], ["weizsacker", 1935, "idea"], ["fission", 1938, "experiment"], ["pion", 1947, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["reacteurs", "fusion"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["portee", "a"], ["neutrons", "a"], ["saturation", "a"], ["fer", "a"], ["surface", "a"], ["densite", "a"], ["helium", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 126 });
})();
</script>
