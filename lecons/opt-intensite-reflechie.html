<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptOnd, DEG = Math.PI / 180;
const deg = (x, n) => F.qty(F.num(x, n || 3), "°"), pct = x => F.qty(F.num(100 * x, 3), "%");

/* ---------- R_s et R_p selon l'incidence, des deux côtés d'une face ---------- */
(() => {
  const schema = $("schema"), trace = $("trace"), sn = $("sn"), si = $("si"), sens = $("sens"), milieu = $("milieu");
  let cote = "entre";
  function draw() {
    const n = +sn.value, i = +si.value * DEG, [n1, n2] = cote === "entre" ? [1, n] : [n, 1];
    const x = O.reflexion(n1, n2, i), iB = O.brewster(n1, n2), ic = O.angleCritique(n1, n2);
    /* the rays at the face, seen in the plane of incidence; the s field as a dot (out of the plane), the p field as an arrow */
    schema.innerHTML = "";
    const ox = 320, oy = 115, L = 105;
    Plot.el("line", { x1: 40, x2: 600, y1: oy, y2: oy, class: "stroke c-label-2" }, schema);
    Plot.el("line", { x1: ox, x2: ox, y1: oy - 110, y2: oy + 110, class: "stroke thin dash c-label-2" }, schema);
    if (cote === "entre") Plot.el("rect", { x: 40, y: oy, width: 560, height: 4, class: "fill c-label-2" }, schema);
    else Plot.el("rect", { x: 40, y: oy - 4, width: 560, height: 4, class: "fill c-label-2" }, schema);
    const champs = (P, Q, s, p) => {                                             // field markers at the middle of the ray P → Q
      const mx = (P[0] + Q[0]) / 2, my = (P[1] + Q[1]) / 2, d = Math.hypot(Q[0] - P[0], Q[1] - P[1]), ux = (Q[0] - P[0]) / d, uy = (Q[1] - P[1]) / d;
      if (Math.abs(s) > 1e-3) Plot.el("circle", { cx: mx - 26 * ux, cy: my - 26 * uy, r: 2 + 9 * Math.abs(s), class: "fill c-warn" }, schema);
      const l = 34 * Math.abs(p);                                                 // sizes only: the signs depend on conventions
      Plot.fleche(schema, [mx + 14 * ux, my + 14 * uy], [mx + 14 * ux - l * uy, my + 14 * uy + l * ux], { cls: "c-tint", trait: "stroke bold", min: 2 });
    };
    const S = [ox - L * Math.sin(i), oy - L * Math.cos(i)], Rf = [ox + L * Math.sin(i), oy - L * Math.cos(i)];
    Plot.fleche(schema, S, [ox, oy], { cls: "c-label" }); champs(S, [ox, oy], 1, 1);
    Plot.fleche(schema, [ox, oy], Rf, { cls: "c-label" }); champs([ox, oy], Rf, x.totale ? 1 : x.b, x.totale ? 1 : x.B);
    if (!x.totale) { const T = [ox + L * Math.sin(x.r), oy + L * Math.cos(x.r)];
      Plot.fleche(schema, [ox, oy], T, { cls: "c-label" }); champs([ox, oy], T, x.a, x.A); }
    /* R against i */
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 44 }, x: { domain: [0, 90], label: t("fig.xaxis") }, y: { domain: [0, 1], label: t("fig.yaxis") } });
    const is = Array.from({ length: 901 }, (_, k) => k * 0.1), rs = is.map(d => O.reflexion(n1, n2, Math.min(d, 89.999) * DEG));
    Plot.el("path", { d: Plot.path(is.map((d, k) => [P.x(d), P.y(rs[k].Rs)])), class: "stroke c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(is.map((d, k) => [P.x(d), P.y(rs[k].Rp)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(is.map((d, k) => [P.x(d), P.y(rs[k].R)])), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("line", { x1: P.x(iB / DEG), x2: P.x(iB / DEG), y1: P.y(0), y2: P.y(1), class: "stroke thin dash c-tint" }, P.g);
    if (ic) Plot.el("line", { x1: P.x(ic / DEG), x2: P.x(ic / DEG), y1: P.y(0), y2: P.y(1), class: "stroke thin dash c-warn" }, P.g);
    Plot.el("circle", { cx: P.x(+si.value), cy: P.y(x.Rs), r: 4, class: "fill c-warn" }, P.g);
    Plot.el("circle", { cx: P.x(+si.value), cy: P.y(x.Rp), r: 5, class: "dot" }, P.g);
    $("snr").textContent = F.num(n, 4); $("sir").textContent = deg(+si.value);
    $("vs").textContent = pct(x.Rs); $("vp").textContent = pct(x.Rp); $("vn").textContent = pct(x.R);
    if (x.totale) {
      $("fs").textContent = $("fp").textContent = t("fig.f.totale", { v: deg(ic / DEG) });
      $("fn").textContent = t("fig.f.brewster", { v: deg(iB / DEG) }); $("vb").textContent = "–"; $("fb").textContent = t("fig.f.sansr");
    } else {
      $("fs").textContent = t("fig.f.s", { b: F.num(x.b, 3), r: deg(x.r / DEG) });
      $("fp").textContent = t("fig.f.p", { B: F.num(x.B, 3), s: deg((i + x.r) / DEG) });
      $("fn").textContent = t("fig.f.nat", { P: pct(x.P), v: deg(iB / DEG) });
      $("vb").textContent = Math.abs(1 - x.Rs) > 1e-12 ? F.num((1 - x.Rp) / (1 - x.Rs), 5) : "–";
      $("fb").textContent = t("fig.f.bilan", { v: F.num(x.A ** 2 / x.a ** 2, 5) });
    }
    sens.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === cote)));
    milieu.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(Math.abs(+b.dataset.n - n) < 1e-9)));
  }
  sens.querySelectorAll("button").forEach(b => b.onclick = () => { cote = b.dataset.s; draw(); });
  milieu.querySelectorAll("button").forEach(b => b.onclick = () => { sn.value = b.dataset.n; draw(); });
  sn.oninput = si.oninput = draw; draw();
})();

/* ---------- le système décrit : une vitre, de l'eau au soleil couchant ---------- */
(() => {
  const n = 1.5, R0 = O.reflexionNormale(1, n), iB = O.brewster(1, n), w = O.reflexion(1, 1.333, O.brewster(1, 1.333));
  const dB = O.reflexion(1, n, iB + 1e-3);
  $("sys1").innerHTML = t("sys1.body", { R0: pct(R0), deux: pct(2 * R0 / (1 + R0)), iB: deg(iB / DEG), Rs: pct(O.reflexion(1, n, iB).Rs),
    div: F.sci(dB.Rp / dB.Rs, 1), eauB: deg(O.brewster(1, 1.333) / DEG), eauS: pct(w.Rs), rug: pct((4 * Math.PI * 5 / 500) ** 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["malus", 1808, "experiment"], ["brewster", 1815, "experiment"], ["fresnel", 1823, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["laser", "lunettes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["moins1", "b"], ["composante", "d"], ["brewster", "a"], ["energie", "c"], ["normale", "b"], ["rasant", "a"], ["interne", "d"], ["vitre", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 336 });
})();
</script>
