<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const vec = (v, unit, sig) => F.qty("(" + v.map(c => F.num(Math.abs(c) < 1e-30 ? 0 : c, sig || 3)).join(" ; ") + ")", unit);

/* ---------- la force magnétique selon l'angle entre v et B ---------- */
(() => {
  const svg = $("angle"), sl = $("thsl"), seg = $("signe"), P = Plot.el;
  let q = 1;
  const press = () => seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.q === q)));
  seg.onclick = e => { const b = e.target.closest("button"); if (!b) return; q = +b.dataset.q; press(); draw(); };
  function draw() {
    const th = +sl.value * Math.PI / 180;
    svg.innerHTML = "";
    // left: the vectors in the plane of v and B; F is normal to that plane, drawn as ⊙ (towards the reader) or ⊗
    const O = [150, 170], L = 110;
    Plot.fleche(svg, O, [O[0] + L, O[1]], { cls: "c-label-2" });
    P("text", { x: O[0] + L + 8, y: O[1] + 5, class: "label" }, svg).textContent = "B";
    const V = [O[0] + L * Math.cos(th), O[1] - L * Math.sin(th)];
    Plot.fleche(svg, O, V, { cls: "c-tint" });
    P("text", { x: V[0] + 6, y: V[1] - 6, class: "label" }, svg).textContent = "v";
    const f = Charge.force(q, [0, 0, 0], [1, 0, 0], [Math.cos(th), Math.sin(th), 0]).magnetique;   // in units of |q| v B
    const r = 4 + 22 * Math.abs(f[2]), g = P("g", { class: "c-warn" }, svg);
    if (r > 4.5) {
      P("circle", { cx: O[0], cy: O[1], r, class: "stroke" }, g);
      if (f[2] > 0) P("circle", { cx: O[0], cy: O[1], r: Math.max(2, r / 5), class: "fill" }, g);
      else { const d = r * 0.7; P("path", { d: `M${O[0] - d} ${O[1] - d}L${O[0] + d} ${O[1] + d}M${O[0] - d} ${O[1] + d}L${O[0] + d} ${O[1] - d}`, class: "stroke" }, g); }
    }
    // right: |F|/(|q| v B) against θ
    const { x, y, g: gp } = Plot.axes(P("g", { transform: "translate(300 0)" }, svg), { fmt: F, w: 340, h: 300, pad: { b: 44, l: 48 },
      x: { domain: [0, 180], label: t("an.x") }, y: { domain: [0, 1.1], label: t("an.y") } });
    const pts = Array.from({ length: 91 }, (_, i) => [x(2 * i), y(Math.sin(2 * i * Math.PI / 180))]);
    P("path", { d: Plot.path(pts), class: "stroke" }, P("g", { class: "c-tint" }, gp));
    P("circle", { cx: x(+sl.value), cy: y(Math.abs(f[2])), r: 5, class: "fill" }, P("g", { class: "c-warn" }, gp));
    $("thread").textContent = F.qty(sl.value, "°");
    $("vf").textContent = F.fix(Math.abs(f[2]), 3);
    $("vsens").textContent = t(Math.abs(f[2]) < 1e-9 ? "an.nul" : f[2] > 0 ? "an.sortant" : "an.entrant");
  }
  sl.oninput = draw; press(); draw();
})();

/* ---------- mesurer un champ inconnu avec une charge d'essai ---------- */
(() => {
  const q = 1e-9, v0 = 1e3, rnd = Quiz.rng(13);
  const AXES = { x: [v0, 0, 0], y: [0, v0, 0], z: [0, 0, v0] };
  let E, B, log;
  const tirage = () => { E = [0, 1, 2].map(() => Math.round(400 * (rnd() - 0.5))); B = [0, 1, 2].map(() => Math.round(1000 * (rnd() - 0.5)) / 1000); log = []; show(); };
  const mesure = v => Charge.force(q, E, B, v).totale;
  function add(id, v) { log = log.filter(m => m.id !== id).concat([{ id, v, f: mesure(v) }]); show(); }
  function show() {
    $("mlog").innerHTML = log.map(m => `<tr><td>${m.id === "0" ? t("me.repos") : vec(m.v, "m·s⁻¹")}</td><td>${vec(m.f.map(c => c * 1e9), "nN")}</td></tr>`).join("");
    const r0 = log.find(m => m.id === "0"), lancers = log.filter(m => m.id !== "0");
    $("ve").textContent = r0 ? vec(r0.f.map(c => c / q), "V·m⁻¹") : "–";
    if (!r0 || lancers.length < 2) { $("vb").textContent = $("vpred").textContent = "–"; $("fpred").textContent = t("me.f.attente"); return; }
    const [a, b] = lancers, r = MagInd.champsDepuisForces(q, r0.f, a.v, a.f, b.v, b.f);
    $("vb").textContent = vec(r.B, "T");
    const reste = Object.keys(AXES).find(k => !lancers.some(m => m.id === k));
    if (reste) {
      const pred = Charge.force(q, r.E, r.B, AXES[reste]).totale, vrai = mesure(AXES[reste]);
      $("vpred").textContent = vec(pred.map(c => c * 1e9), "nN");
      $("fpred").textContent = t("me.f.pred", { axe: reste, ecart: F.si(Math.hypot(...pred.map((c, i) => c - vrai[i])), "N", { sig: 2 }) });
    } else { $("vpred").textContent = vec(B, "T"); $("fpred").textContent = t("me.f.vrai"); }
  }
  $("m0").onclick = () => add("0", [0, 0, 0]);
  Object.keys(AXES).forEach(k => $("m" + k).onclick = () => add(k, AXES[k]));
  $("mnew").onclick = tirage;
  tirage();
})();

/* ---------- échelle des champs ---------- */
(() => {
  const ROWS = [["terre", 2.5e-5, 6.5e-5], ["irm", 1.5, 3], ["iseult", 11.7, 11.7]], txt = textOf("ech.items", ROWS.map(r => r[0]));
  $("echelle").innerHTML = ROWS.map(([id, a, b]) => `<div><span class="k">${a === b ? F.si(a, "T") : F.si(a, "T") + " – " + F.si(b, "T")}</span><span>${txt[id]}</span></div>`).join("");
})();

/* ---------- le système décrit : un faisceau d'électrons dans le champ terrestre ---------- */
(() => {
  const U = 2e3, B = 5e-5, L = 0.2, e = Charge.particule("electron"), a = Charge.accelere(e.q, e.m, -U);
  const h = Charge.helice(e.q, e.m, B, [a.vRelativiste, 0, 0], { rel: true }), R = h.R, y = R - Math.sqrt(R * R - L * L);
  const n = Charge.negligeables({ q: e.q, m: e.m, v: a.vRelativiste, B });
  $("sys").innerHTML = t("sys.body", { v: F.si(a.vRelativiste, "m·s⁻¹"), rel: F.sci(n.rel, 2), R: F.si(R, "m"), y: F.si(y, "m"), lr: F.num(L / R, 2), poids: F.sci(n.poidsB, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gauss", 1832, "experiment"], ["cgpm", 1960, "idea"], ["swarm", 2013, "use"], ["iseult", 2024, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm", "geomag"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["paralleles", "c"], ["travail", "a"], ["angle", "b"], ["signe", "d"], ["deux", "a"], ["unite", "c"], ["terre", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 131 });
})();
</script>
