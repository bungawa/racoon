    <div class="eq"><math display="block"><msub><mi>J</mi><mi>z</mi></msub><mo>∈</mo><mo>{</mo><mi>j</mi><mo>,</mo><mi>j</mi><mo>−</mo><mn>1</mn><mo>,</mo><mo>…</mo><mo>,</mo><mo>−</mo><mi>j</mi><mo>+</mo><mn>1</mn><mo>,</mo><mo>−</mo><mi>j</mi><mo>}</mo><mo>·</mo><mi>ħ</mi></math><span class="n">(35.1)</span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/lecons/champs-em.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes;
const spin = j => Number.isInteger(j) ? F.num(j, 3) : F.num(2 * j, 3) + "/2";

/* ---------- le système décrit, et les fréquences de (35.4) ---------- */
(() => {
  const g = M.PARTICULES.electron.g;
  $("sys1").innerHTML = t("sys1.body", { dU: F.si(g * Cst.mu_B / Cst.e, "eV", { sig: 2 }), kT: F.si(Cst.k_B * 300 / Cst.e, "eV", { sig: 2 }),
    T: F.kelvin(300), r: F.sci(M.rapportThermique(g, 1, 300), 1) });
  const f = p => F.si(M.frequencePrecession(p, 1).f, "Hz", { sig: 4 });
  $("freqs").innerHTML = t("freqs.body", { e: f("electron"), p: f("proton"), n: f("neutron"), o: f("orbite") });
})();

/* ---------- répartition de μ_z : peigne quantique contre bande classique ---------- */
(() => {
  const svg = $("repartition"), sj = $("sj");
  function draw() {
    const j = +sj.value / 2, o = M.orientations(j), X = Math.max(o.a, 0.5) * 1.15;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-X, X], label: t("fig.ax.x") }, y: { domain: [0, 1], label: t("fig.ax.y") } });
    /* the classical band: a straight ramp from −a to a (a step at 0 when j = 0) */
    const cl = o.a === 0 ? [[-X, 0], [0, 0], [0, 1], [X, 1]] : [[-X, 0], [-o.a, 0], [o.a, 1], [X, 1]];
    Plot.el("path", { d: Plot.path(cl.map(([x, y]) => [P.x(x), P.y(y)])), class: "stroke bold dash c-warn" }, svg);
    /* the quantum comb: a staircase, one step of 1/(2j + 1) at each value */
    const pts = [[-X, 0]]; o.valeurs.forEach((x, k) => { pts.push([x, k * o.poids], [x, (k + 1) * o.poids]); }); pts.push([X, 1]);
    Plot.el("path", { d: Plot.path(pts.map(([x, y]) => [P.x(x), P.y(y)])), class: "stroke bold c-tint" }, svg);
    $("sjr").textContent = spin(j);
    $("vn").textContent = F.num(o.valeurs.length, 3);
    $("fn").textContent = t("fig.f.valeurs");
    $("vm").textContent = F.num(o.max.quantique, 3) + " / " + F.num(o.max.classique, 3);
    $("fm").textContent = t("fig.f.max", { r: F.num(o.a === 0 ? 1 : o.max.quantique / o.max.classique, 3) });
    $("vc").textContent = F.num(o.carreMoyen.quantique, 4) + " / " + F.num(o.carreMoyen.classique, 4);
    $("fc").textContent = t("fig.f.carre");
    $("ve").textContent = F.num(o.ecart, 2);
    $("fe").textContent = t(j === 0 ? "fig.f.zero" : "fig.f.ecart", { n: F.num(o.ecart * (2 * j + 1), 2) });
  }
  sj.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["stern", 1921, "idea"], ["spin", 1925, "idea"], ["zavoisky", 1944, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rpe"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["nombre", "c"], ["centre", "a"], ["signe", "d"], ["frequence", "b"], ["classique", "c"], ["grand", "a"], ["entier", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 351 });
})();
</script>
