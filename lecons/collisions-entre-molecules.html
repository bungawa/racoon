    <p class="validite" data-i18n-html="val.43.3"></p>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique;

/* ---------- des chocs tirés au hasard, pas de durée dt = pτ ---------- */
(() => {
  const svg = $("courbe"), sp = $("p"), N = 400, DUREE = 60, TMAX = 4;     // τ = 1: times in units of τ
  let seed = 431;
  const mean = a => { let s = 0, n = 0; for (const x of a) if (isFinite(x)) { s += x; n++; } return s / n; };
  const tauUnits = x => F.num(x, 3) + "\u00a0τ";
  function draw() {
    const p = +sp.value, v = S.vols({ N, tau: 1, p, duree: DUREE }, Quiz.rng(seed)), th = S.attente(p, 1);
    const prem = Array.from(v.premier).sort((a, b) => a - b);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { domain: [0, TMAX], label: t("sim.x") }, y: { domain: [0, 1], label: t("sim.y") } });
    const loi = []; for (let x = 0; x <= TMAX; x += 0.02) loi.push([o.x(x), o.y(S.survie(x, 1))]);
    Plot.el("path", { d: Plot.path(loi), class: "stroke dash c-label-2" }, o.g);
    const pts = [[o.x(0), o.y(1)]]; let k = 0;                        // survival: a staircase, one step per first collision
    for (const ti of prem) { if (ti > TMAX) break; k++; pts.push([o.x(ti), pts[pts.length - 1][1]], [o.x(ti), o.y(1 - k / N)]); }
    pts.push([o.x(TMAX), pts[pts.length - 1][1]]);
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold c-tint" }, o.g);
    $("pv").textContent = F.fix(p, 2);
    $("vlibre").textContent = tauUnits(mean(v.libres));
    $("vtau").textContent = F.qty(F.num(100 * prem.filter(x => x > 1).length / N, 3), "%");
    $("ftau").textContent = t("sim.f.tau", { e: F.qty(F.num(100 * Math.exp(-1), 3), "%"), d: F.qty(F.num(100 * Math.pow(1 - p, Math.floor(1 / p + 1e-9)), 3), "%") });
    $("vjus").textContent = tauUnits(mean(v.jusqua));
    $("fjus").textContent = t("sim.f.theorie", { v: tauUnits(th.jusqua) });
    $("vcont").textContent = tauUnits(mean(Array.from(v.jusqua, (x, i) => x + v.depuis[i])));
    $("fcont").textContent = t("sim.f.theorie", { v: tauUnits(th.contenant) });
  }
  sp.oninput = draw; $("refaire").onclick = () => { seed++; draw(); }; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["poisson", 1837, "idea"], ["erlang", 1909, "idea"], ["rutherford", 1910, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["geant4"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["fraction", "a"], ["survie", "b"], ["memoire", "c"], ["paradoxe", "d"], ["regulier", "a"], ["vitesse", "b"], ["compter", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 431 });
})();
</script>
