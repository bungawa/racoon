<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, CLAQUAGE = 3e6;          // V·m⁻¹, the field at which air breaks down, order of magnitude

/* ---------- le système décrit : une sphère de cuivre de 10 cm portée à 30 kV ---------- */
(() => {
  const R = 0.1, V = 3e4, sigma = ES.EPS0 * V / R, n = 8.47e28, couche = Math.pow(n, 2 / 3);   // free electrons of copper, m⁻³; one atomic layer, m⁻²
  const exces = sigma / ES.E;
  $("sys1").innerHTML = t("sys1.body", { sigma: F.si(sigma, "C·m⁻²"), exces: F.sci(exces, 2), couche: F.sci(couche, 2), frac: F.sci(exces / couche, 1) });
})();

/* ---------- deux sphères reliées : le champ à leur surface ---------- */
(() => {
  const svg = $("sph"), asl = $("asl"), gsl = $("gsl"), B = 0.1, V = 3e4, N = 91;
  function draw() {
    const a = +asl.value / 1000, gap = +gsl.value / 100, s = ES.spheresReliees(a, B, a + B + gap, V);
    const th = Array.from({ length: N }, (_, i) => Math.PI * i / (N - 1));
    const ea = th.map(u => s.surface(1, u)[0] * a / V), eb = th.map(u => s.surface(2, u)[0] * B / V);
    const all = ea.concat(eb), lo = Math.min(0, ...all), hi = 1.1 * Math.max(...all);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, 180], label: t("sp.x"), fmt: v => F.num(v, 3) }, y: { domain: [lo, hi], label: t("sp.y"), fmt: v => F.num(v, 2) } });
    const curve = (v, cls) => Plot.el("path", { d: Plot.path(th.map((u, i) => [x(u * 180 / Math.PI), y(v[i])])), class: "stroke" }, Plot.el("g", { class: cls }, g));
    Plot.el("line", { x1: x(0), x2: x(180), y1: y(1), y2: y(1), class: "stroke thin dash" }, Plot.el("g", { class: "c-label-2" }, g));
    curve(eb, "c-ok"); curve(ea, "c-tint");
    const sa = s.Q1 / (a * a), sb = s.Q2 / (B * B), emax = Math.max(...th.map(u => s.surface(1, u)[0]), ...th.map(u => s.surface(2, u)[0]));
    $("aread").textContent = F.si(a, "m", { prefix: "m" });
    $("gread").textContent = F.si(gap, "m", { prefix: "" });
    $("vrap").textContent = F.num(sa / sb, 3);
    $("frap").textContent = t("sp.f.rap", { r: F.num(B / a, 3) });
    $("vemax").textContent = F.si(emax, "V·m⁻¹");
    $("femax").textContent = t("sp.f.emax", { e: F.si(V / B, "V·m⁻¹") });
    $("vvmax").textContent = F.si(V * CLAQUAGE / emax, "V");
    $("fvmax").textContent = t("sp.f.vmax", { v: F.si(CLAQUAGE * B, "V") });
  }
  asl.oninput = gsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["franklin", 1747, "experiment"], ["poisson", 1812, "idea"], ["norme", 2006, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["paratonnerre", "terminal"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dedans", "c"], ["surface", "a"], ["normal", "d"], ["double", "b"], ["pointes", "c"], ["couche", "a"], ["mesure", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 59 });
})();
</script>
