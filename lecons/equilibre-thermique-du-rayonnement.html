<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, { k_B, hbar, c } = Constantes;

/* ---------- la loi de Rayleigh contre la mesure ---------- */
(() => {
  const svg = $("spec"), sT = $("rT"), sW = $("rW"), XMAX = 12;
  const lg = (s, a, b) => a * Math.pow(b / a, +s.value);
  function draw() {
    const T = lg(sT, 300, 6000), xc = lg(sW, 0.5, 20), wT = k_B * T / hbar, wc = xc * wT;
    const u0 = hbar * wT ** 3 / (Math.PI ** 2 * c ** 3);           // u(ω) unit: ħ(k_BT/ħ)³/(π²c³)
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { domain: [0, XMAX], label: t("sim.x"), fmt: v => F.num(v, 3) }, y: { domain: [0, 2], label: t("sim.y"), fmt: v => F.fix(v, 1) } });
    const ray = [], mes = [];
    for (let i = 1; i <= 240; i++) { const x = XMAX * i / 240, w = x * wT;
      const yr = S.rayleigh(w, T) / c / u0; if (yr <= 2) ray.push([o.x(x), o.y(yr)]); mes.push([o.x(x), o.y(S.planck(w, T) / c / u0)]); }
    Plot.el("path", { d: Plot.path(ray), class: "stroke bold c-warn" }, o.g);
    Plot.el("path", { d: Plot.path(mes), class: "stroke bold c-tint" }, o.g);
    const xl = Math.min(xc, XMAX);
    Plot.el("line", { x1: o.x(xl), x2: o.x(xl), y1: o.y(0), y2: o.y(2), class: "stroke thin dash c-label" }, o.g);
    const eR = S.energieJusqua(wc, T), eP = S.energieJusqua(wc, T, "planck"), tot = S.A_RAD * T ** 4;
    const b = S.bilan(wc, T, w => S.rayleigh(w, T));
    $("rTv").innerHTML = F.kelvin(T);
    $("rWv").textContent = t("sim.wv", { x: F.num(xc, 3), l: F.si(2 * Math.PI * c / wc, "m", { sig: 3 }) });
    $("vray").textContent = F.qty(F.sci(eR, 3), "J·m⁻³");
    $("vmes").textContent = F.qty(F.sci(eP, 3), "J·m⁻³");
    $("fmes").textContent = t("sim.f.mes", { tot: F.qty(F.sci(tot, 3), "J·m⁻³") });
    $("vrap").textContent = F.num(eR / eP, 3);
    $("vq").textContent = F.sci(b.Q, 2);
    $("fq").textContent = t("sim.f.q", { g: F.qty(F.sci(b.gamma, 2), "s⁻¹") });
    $("vbil").textContent = F.fix(b.absorbe / b.emis, 4);
    $("sys").innerHTML = t("sys.inner", { T: F.kelvin(T), l: F.si(2 * Math.PI * c / wc, "m", { sig: 2 }), tau: F.si(1 / b.gamma, "s", { sig: 2 }),
      larg: F.sci(b.gamma / wc, 1) });
  }
  sT.oninput = sW.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kirchhoff", 1860, "idea"], ["rayleigh", 1900, "idea"], ["jeans", 1905, "idea"], ["ehrenfest", 1911, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["radio"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["boite", "b"], ["charge", "d"], ["pic", "a"], ["diverge", "c"], ["deux", "b"], ["radio", "a"], ["q", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 412 });
})();
</script>
