<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, D = 180 / Math.PI;

/* ---------- le système décrit : deux cellules RC à la suite ---------- */
(() => {
  const d = M.deuxCellules(1), db = z => 20 * Math.log10(Cx.abs(z));
  $("sys1").innerHTML = t("sys1.body", { l: F.num(Cx.abs(d.libre), 3), ldb: F.num(db(d.libre), 3), b: F.num(Cx.abs(d.tampon), 3), bdb: F.num(db(d.tampon), 3) });
})();

/* ---------- le diagramme de Bode d'un filtre actif, avec un amplificateur idéal ou réel ---------- */
(() => {
  const st = { type: "passeBas1", puce: "tl081" }, segs = { type: $("type"), puce: $("puce") };
  const FMIN = 1, FMAX = 1e7, N = 400, fs = Array.from({ length: N + 1 }, (_, j) => FMIN * Math.pow(FMAX / FMIN, j / N));
  /* components for the chosen f0 and the second knob: gain |H0| from 1 to 100 (first order), Q from 0,5 to 10 (second) */
  function composants(type, f0, k) {
    if (type === "passeBas1") { const C = 1e-8, R2 = 1 / (2 * Math.PI * f0 * C), G = Math.pow(100, k); return { o: { R1: R2 / G, R2, C }, val: G }; }
    if (type === "passeHaut1") { const C = 1e-7, R1 = 1 / (2 * Math.PI * f0 * C), G = Math.pow(100, k); return { o: { R1, R2: G * R1, C }, val: G }; }
    const Q = 0.5 * Math.pow(20, k), C2 = 1e-8, C1 = 4 * Q * Q * C2, R = 1 / (2 * Math.PI * f0 * 2 * Q * C2);
    return { o: { R1: R, R2: R, C1, C2 }, val: Q };
  }
  function draw() {
    const f0 = Math.pow(10, +$("sf").value), k = +$("sp").value, { o, val } = composants(st.type, f0, k);
    const Fi = M.filtreActif(st.type, o), ao = st.puce === "ideal" ? null : M.AO[st.puce];
    const id = fs.map(f => M.bodeH(Fi.H(f))), re = fs.map(f => M.bodeH(Fi.H(f, ao || undefined)));
    /* gain */
    let svg = $("gain"); svg.innerHTML = "";
    let P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 44 }, x: { scale: "log", domain: [FMIN, FMAX], label: t("fig.xaxis") }, y: { domain: [-80, 50], label: t("fig.yaxis.g") } });
    const cy = v => P.y(Math.max(-80, Math.min(50, v)));
    Plot.el("line", { x1: P.x(f0), x2: P.x(f0), y1: P.y(-80), y2: P.y(50), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(fs.map(f => [P.x(f), cy(M.asymptote(Fi, f))])), class: "stroke dash c-label-2" }, P.g);
    if (ao) Plot.el("path", { d: Plot.path(fs.map((f, j) => [P.x(f), cy(id[j].gainDb)])), class: "stroke thin c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(fs.map((f, j) => [P.x(f), cy(re[j].gainDb)])), class: "curve" }, P.g);
    /* phase in degrees, unwrapped from low to high frequency */
    const unwrap = a => { const out = [a[0] * D]; for (let j = 1; j < a.length; j++) { let d = a[j] * D - out[j - 1]; while (d > 180) d -= 360; while (d < -180) d += 360; out.push(out[j - 1] + d); } return out; };
    const pr = unwrap(re.map(x => x.phase)), pi = unwrap(id.map(x => x.phase));
    svg = $("phase"); svg.innerHTML = "";
    const lo = Math.floor(Math.min(...pr, ...pi) / 90) * 90, hi = Math.ceil(Math.max(...pr, ...pi) / 90) * 90;
    P = Plot.axes(svg, { fmt: F, w: 640, h: 200, pad: { l: 56, b: 44 }, x: { scale: "log", domain: [FMIN, FMAX], label: t("fig.xaxis") }, y: { domain: [lo, Math.max(hi, lo + 90)], label: t("fig.yaxis.p"), ticks: 4 } });
    Plot.el("line", { x1: P.x(f0), x2: P.x(f0), y1: P.y(lo), y2: P.y(Math.max(hi, lo + 90)), class: "stroke thin dash c-label-2" }, P.g);
    if (ao) Plot.el("path", { d: Plot.path(fs.map((f, j) => [P.x(f), P.y(pi[j])])), class: "stroke thin c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(fs.map((f, j) => [P.x(f), P.y(pr[j])])), class: "curve" }, P.g);
    /* readouts */
    $("spl").textContent = t(Fi.ordre === 2 ? "fig.q" : "fig.h0");
    $("spr").textContent = F.num(val, 3);
    $("sfr").textContent = F.si(f0, "Hz");
    const g0 = M.bodeH(Fi.H(f0, ao || undefined)).gainDb;
    $("vf").textContent = t("fig.v.db", { g: F.num(g0, 3) });
    $("ff").textContent = t("fig.f.f0", { a: F.num(M.asymptote(Fi, f0), 3) });
    /* the −3 dB frequency below the plateau, by bisection on the curve with the chosen op amp */
    const ref = 20 * Math.log10(Math.abs(Fi.H0)) - 3.0103, g = f => M.bodeH(Fi.H(f, ao || undefined)).gainDb - ref;
    let a = Fi.type === "passeHaut1" ? f0 / 1e3 : f0 / 1e3, b = Fi.type === "passeHaut1" ? f0 : f0 * 1e3, fc = null;
    if (Fi.type === "passeHaut1") { b = Math.min(FMAX, f0 * 10); if (g(a) < 0 && g(b) > 0) { for (let j = 0; j < 80; j++) { const m = Math.sqrt(a * b); if (g(m) < 0) a = m; else b = m; } fc = a; } }
    else { a = f0 / 1e3; b = Math.min(FMAX, f0 * 1e3); if (g(a) > 0 && g(b) < 0) { for (let j = 0; j < 80; j++) { const m = Math.sqrt(a * b); if (g(m) > 0) a = m; else b = m; } fc = a; } }
    $("vc").textContent = fc ? F.si(fc, "Hz") : "–";
    $("fc").textContent = t("fig.f.coupure", { r: fc ? F.num(fc / f0, 3) : "–" });
    /* where the real op amp departs from the ideal one by 1 dB */
    let fd = null;
    if (ao) for (let j = 0; j <= N; j++) if (Math.abs(re[j].gainDb - id[j].gainDb) > 1) { fd = fs[j]; break; }
    $("vi").textContent = !ao ? t("fig.v.ideal") : fd ? F.si(fd, "Hz") : t("fig.v.partout");
    $("fi").textContent = t(Fi.ordre === 2 ? "fig.f.sk" : "fig.f.pb", { r1: F.si(o.R1, "Ω"), r2: F.si(o.R2, "Ω"), c: F.si(o.C || o.C1, "F", { prefix: "n" }), c2: F.si(o.C2 || 0, "F", { prefix: "n" }) });
    for (const kk in segs) segs[kk].querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === st[kk])));
  }
  for (const kk in segs) segs[kk].querySelectorAll("button").forEach(x => x.onclick = () => { st[kk] = x.dataset.m; draw(); });
  ["sf", "sp"].forEach(i => $(i).oninput = draw); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["nyquist", 1932, "idea"], ["bode", 1940, "idea"], ["sallen", 1955, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ecg"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["charge", "b"], ["pente", "d"], ["reglage", "a"], ["trois", "c"], ["q", "b"], ["butter", "a"], ["limite", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 702 });
})();
</script>
