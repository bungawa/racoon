    <div class="eq"><math display="block"><msub><mi>E</mi><mi>x</mi></msub><mo>=</mo><msub><mi>E</mi><mn>0</mn></msub><msup><mi>e</mi><mrow><mo>−</mo><mi>ω</mi><msub><mi>n</mi><mi>I</mi></msub><mi>z</mi><mo>/</mo><mi>c</mi></mrow></msup><msup><mi>e</mi><mrow><mi>i</mi><mi>ω</mi><mo>(</mo><mi>t</mi><mo>−</mo><msub><mi>n</mi><mi>R</mi></msub><mi>z</mi><mo>/</mo><mi>c</mi><mo>)</mo></mrow></msup></math><span class="n">(32.36)</span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/quiz.js"></script>

<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/ondes-milieux.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux, K = Constantes;

/* the medium: the model glass of « Équations de Maxwell dans un diélectrique » (resonance 100 nm, χ0 = 1,25), local field included */
const W0 = 2 * Math.PI * K.c / 100e-9, N = 1.25 * K.eps0 * K.m_e * W0 * W0 / (K.e * K.e);

/* ---------- n(ω) et l'onde dans le milieu ---------- */
(() => {
  const gI = $("indice"), gO = $("onde"), sw = $("sw"), sg = $("sg");
  const xs = Array.from({ length: 561 }, (_, i) => 0.2 + i * 2.8 / 560);
  function draw() {
    const r = +sw.value / 100, g = Math.pow(10, +sg.value / 100), mode = [{ w0: W0, gamma: g * W0 }];
    const ns = xs.map(x => OM.indices(x * W0, N, mode).n.local);
    const top = Math.min(8, 1.1 * Math.max(...ns.map(n => Math.max(n.nR, n.nI))));
    gI.innerHTML = "";
    const P = Plot.axes(gI, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 44 }, x: { domain: [0.2, 3], label: t("fig.xaxis") }, y: { domain: [0, top], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0.2), x2: P.x(3), y1: P.y(1), y2: P.y(1), class: "zero" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x), P.y(Math.min(top, ns[i].nR))])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x), P.y(Math.min(top, ns[i].nI))])), class: "stroke c-warn" }, P.g);
    const n = OM.indices(r * W0, N, mode).n.local, o = OM.onde(r * W0, n), lam = 2 * Math.PI * K.c / (r * W0);
    Plot.el("line", { x1: P.x(r), x2: P.x(r), y1: P.y(0), y2: P.y(top), class: "ref" }, P.g);
    Plot.el("circle", { cx: P.x(r), cy: P.y(Math.min(top, n.nR)), r: 5, class: "dot" }, P.g);
    /* the field at t = 0 over three vacuum wavelengths */
    gO.innerHTML = "";
    const Q = Plot.axes(gO, { fmt: F, w: 640, h: 200, pad: { l: 56, b: 44 }, x: { domain: [0, 3], label: t("fig.zaxis") }, y: { domain: [-1.1, 1.1], label: t("fig.eaxis") } });
    const zs = Array.from({ length: 901 }, (_, i) => i * 3 / 900);
    Plot.el("line", { x1: Q.x(0), x2: Q.x(3), y1: Q.y(0), y2: Q.y(0), class: "zero" }, Q.g);
    for (const s of [1, -1]) Plot.el("path", { d: Plot.path(zs.map(z => [Q.x(z), Q.y(s * o.enveloppe(z * lam))])), class: "stroke dash c-label-2" }, Q.g);
    Plot.el("path", { d: Plot.path(zs.map(z => [Q.x(z), Q.y(o.Ex(z * lam, 0))])), class: "curve" }, Q.g);
    $("swr").textContent = F.num(r, 3);
    $("sgr").textContent = F.num(g, 2);
    $("vn").textContent = F.num(n.nR, 3) + " − " + F.num(n.nI, 3) + " i";
    $("fn").textContent = t("fig.f.n", { l: F.si(lam, "m", { prefix: "n" }), lm: F.si(o.lambda, "m", { prefix: "n" }) });
    $("vlong").textContent = F.si(o.longueur, "m");
    $("flong").textContent = t("fig.f.long", { b: F.qty(F.sci(o.beta, 2), "m⁻¹") });
    $("vtrans").textContent = F.sci(o.transmission(1e-6), 2);
    $("ftrans").textContent = t("fig.f.trans", { d: F.num(o.dB(1e-6), 3) });
  }
  sw.oninput = sg.oninput = draw; draw();
})();

/* ---------- le système décrit : une fibre de silice ---------- */
(() => {
  const lam = 1550e-9, a = 0.2e-3, nI = OM.nIDepuisDB(a, lam), o = OM.onde(2 * Math.PI * K.c / lam, { re: 1.45, im: -nI });
  $("sys1").innerHTML = t("sys1.body", { a: F.qty(F.num(a * 1e3, 2), "dB·km⁻¹"), nI: F.sci(nI, 2), L: F.si(o.longueur, "m"), Li: F.si(1 / o.beta, "m"),
    T: F.num(100 * o.transmission(100e3), 2), lam: F.si(lam, "m", { prefix: "n" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bouguer", 1729, "experiment"], ["beer", 1852, "experiment"], ["kao", 1966, "idea"], ["corning", 1970, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["fibre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signe", "b"], ["vitesse", "a"], ["deux", "c"], ["fibre", "d"], ["transparent", "a"], ["bande", "c"], ["longueur", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 324 });
})();
</script>
