<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes;

/* ---------- the ampere, 1948 and 2019 ---------- */
(() => {
  /* two wires 1 m apart, 1 A each: the force per metre on one is 1 A × the field of the other, (13.17) */
  $("amp").innerHTML = t("amp.body", { f: F.qty(F.sci(M.filEpais(1, 1e-3, 1), 6), "N·m⁻¹"), d: F.sci(Cst.mu0 / (4e-7 * Math.PI) - 1, 2) });
})();

/* ---------- a solenoid of radius R and length L: B on the axis (13.19a), and across the middle (N exact turns) ---------- */
(() => {
  const LR = i => Math.pow(10, -0.3 + 1.6 * i / 100);            // L/R from 0,5 to 20
  const n = 1, I = 1, R = 1, B0 = M.solenoideInfini(n, I);
  function draw() {
    const lr = LR(+$("lsl").value), L = lr * R, N = Math.max(40, Math.round(40 * lr));
    $("lread").textContent = F.num(lr, 2);
    /* axis */
    const a = $("axe"); a.innerHTML = "";
    let ax = Plot.axes(a, { fmt: F, w: 640, h: 260, pad: { b: 44 }, x: { domain: [-2, 2], label: t("so.x.axe") }, y: { domain: [0, 1.1], label: t("so.y") } });
    const zs = Array.from({ length: 241 }, (_, i) => -2 + 4 * i / 240);
    Plot.el("line", { x1: ax.x(-2), x2: ax.x(2), y1: ax.y(1), y2: ax.y(1), class: "ref" }, ax.g);
    Plot.el("path", { d: Plot.path(zs.map(s => [ax.x(s), ax.y(M.solenoideAxe(n, I, R, L, s * L / 2) / B0)])), class: "curve" }, ax.g);
    [-1, 1].forEach(s => Plot.el("line", { x1: ax.x(s), x2: ax.x(s), y1: ax.y(0), y2: ax.y(1.1), class: "ref" }, ax.g));
    /* across the middle: B_z(ρ) at z = 0, from N turns */
    const r = $("rayon"); r.innerHTML = "";
    const ar = Plot.axes(r, { fmt: F, w: 640, h: 260, pad: { b: 44 }, x: { domain: [0, 3], label: t("so.x.rayon") }, y: { domain: [-0.2, 1.1], label: t("so.y") } });
    const rs = Array.from({ length: 151 }, (_, i) => 3 * i / 150).filter(p => Math.abs(p - 1) > 0.02);
    const bz = p => M.solenoideSpires(N, n * L / N, R, L, p * R, 0).Bz / B0;
    Plot.el("line", { x1: ar.x(0), x2: ar.x(3), y1: ar.y(1), y2: ar.y(1), class: "ref" }, ar.g);
    Plot.el("line", { x1: ar.x(0), x2: ar.x(3), y1: ar.y(0), y2: ar.y(0), class: "ref" }, ar.g);
    const inn = rs.filter(p => p < 1), out = rs.filter(p => p > 1);
    [inn, out].forEach(set => Plot.el("path", { d: Plot.path(set.map(p => [ar.x(p), ar.y(Math.max(-0.2, Math.min(1.1, bz(p))))])), class: "curve" }, ar.g));
    $("vcentre").textContent = F.num(M.solenoideAxe(n, I, R, L, 0) / B0, 3);
    $("vbout").textContent = F.num(M.solenoideAxe(n, I, R, L, L / 2) / B0, 3);
    $("vdehors").textContent = F.num(bz(2), 2);
  }
  $("lsl").oninput = draw; draw();
})();

/* ---------- the system: the solenoid of CMS, 12,5 m long, 6 m across ---------- */
(() => {
  const r = M.solenoideAxe(1, 1, 3, 12.5, 0) / M.solenoideInfini(1, 1), bout = M.solenoideAxe(1, 1, 3, 12.5, 6.25) / M.solenoideInfini(1, 1);
  $("sys").innerHTML = t("sys.body", { r: F.qty(F.num(100 * r, 2), "%"), b: F.qty(F.num(100 * bout, 2), "%") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ampere", 1820, "idea"], ["sturgeon", 1825, "experiment"], ["spin", 1925, "idea"], ["cgpm", 1948, "use"], ["si2019", 2019, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm", "cms"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["distance", "b"], ["dedans", "c"], ["paralleles", "a"], ["centre", "d"], ["bout", "b"], ["dehors", "c"], ["aimant", "a"], ["ampere", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 135 });
})();
</script>
