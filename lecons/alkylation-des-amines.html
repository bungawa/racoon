<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, $ = id => document.getElementById(id), P = Plot.el;
const sym = s => s;                                                // symboles chimiques : identiques dans toutes les langues
const peindre = (svg, d) => { svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };

/* ---------- pKa des ions ammonium (eau, 298 K) ---------- */
(() => {
  const PKA = [["ammonium", 9.25], ["methyl", 10.64], ["ethyl", 10.75], ["diethyl", 10.98], ["triethyl", 10.76], ["anilinium", 4.63]];
  const txt = textOf("pka.items", PKA.map(p => p[0]));
  $("pka").innerHTML = PKA.map(([id, pk]) => `<div><span class="k">${F.fix(pk, 2)}</span><span><strong>${txt[id].f}</strong> ${txt[id].text}</span></div>`).join("");
})();

/* ---------- SN2 : l'ammoniac sur l'iodométhane ---------- */
peindre($("sn2"), O.schema(O.mol("N 0 0 h3; C 1.7 0 h3; I 2.7 0 | 1-2"), { texte: sym, carbones: true, doublets: [0, 2], fleches: [{ de: 0, vers: 1 }, { de: [1, 2], vers: 2 }], marques: { 1: "δ+" } }));

/* ---------- alkylations successives ---------- */
(() => {
  const EXCES = [0.25, 0.5, 1, 1.5, 2, 3, 4, 5, 7, 10, 15, 20, 30, 50];   // n(amine)/n(R–X)
  const IDS = ["a0", "a1", "a2", "a3", "a4"], noms = textOf("bil.noms", IDS), NOMS = IDS.map(id => noms[id]);
  const { x, y, g } = Plot.axes($("bilan"), { fmt: F, w: 560, h: 250, pad: { b: 44 }, x: { domain: [0, 5], label: t("bil.x"), ticks: 1, fmt: () => "" }, y: { domain: [0, 1], label: t("bil.y") } });
  const barres = NOMS.map((n, i) => {
    P("text", { x: x(i + 0.5), y: y(0) + 16, "text-anchor": "middle", class: "tick" }, g).textContent = n;
    return { r: P("rect", { x: x(i + 0.15), width: x(0.7) - x(0), class: "area" }, g), l: P("line", { x1: x(i + 0.15), x2: x(i + 0.85), class: "curve" }, g),
      v: P("text", { x: x(i + 0.5), "text-anchor": "middle", class: "note" }, g) };
  });
  const ex = $("exces"), rap = $("rap");
  function maj() {
    const e = EXCES[+ex.value], r = Math.pow(10, +rap.value), s = O.successives([1, r, r * r, r * r * r], 1 / e);
    s.A.forEach((a, i) => { const b = barres[i], top = y(a);
      b.r.setAttribute("y", top); b.r.setAttribute("height", y(0) - top); b.l.setAttribute("y1", top); b.l.setAttribute("y2", top);
      b.v.setAttribute("y", top - 6); b.v.textContent = F.qty(F.fix(100 * a, 0), "%"); });
    $("excesread").textContent = F.num(e, 3);
    $("rapread").textContent = F.num(r, 2);
    $("rdt").textContent = F.qty(F.fix(Math.min(100, 100 * s.A[1] * e), 0), "%");
    $("reste").textContent = F.qty(F.fix(100 * s.A[0], 0), "%");
  }
  ex.oninput = rap.oninput = maj; maj();
})();

/* ---------- trois façons d'orienter la réaction ---------- */
(() => {
  const IDS = ["exces", "quaternaire", "acylation"], txt = textOf("voies.items", IDS);
  $("voies").innerHTML = IDS.map(id => `<div><span class="k">${txt[id].k}</span><span><strong>${txt[id].name}.</strong> ${txt[id].text}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hofmann", 1851, "experiment"], ["menshutkin", 1890, "experiment"], ["henkel", 1984, "experiment"], ["covid", 2020, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["desinfectant", "transfert"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["doublet", "b"], ["aniline", "d"], ["melange", "a"], ["exces", "c"], ["rapport", "b"], ["quaternaire", "d"], ["amide", "a"], ["iodure", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
