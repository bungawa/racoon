<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, c = Constantes.c;
/* the cable of the page: inner radius 0,45 mm, polyethylene εr = 2,25, outer radius chosen for 50 Ω; copper walls */
const A = 0.45e-3, ER = 2.25, B = A * Math.exp(50 * 2 * Math.PI * Constantes.eps0 * c * Math.sqrt(ER)), CABLE = M.ligneCoaxiale(A, B, { epsr: ER });

/* ---------- le système décrit : 20 m de câble à 100 MHz ---------- */
(() => {
  const f = 1e8, l = 20, p = M.pertesCoaxiale(CABLE, f, 5.8e7);
  $("sys1").innerHTML = t("sys1.body", { a: F.si(2 * A, "m", { prefix: "m" }), b: F.si(2 * B, "m", { prefix: "m" }), z0: F.si(CABLE.z0, "Ω"),
    lambda: F.si(p.lambda, "m"), n: F.num(l / p.lambda, 2), fc: F.si(CABLE.fcTE11, "Hz"), r: F.sci(p.rapport, 2),
    delta: F.si(p.delta, "m", { prefix: "µ" }), att: F.qty(F.num(p.dBparMetre * l, 2), "dB") });
})();

/* ---------- z0 et v d'un câble coaxial ---------- */
(() => {
  const sba = $("sba"), ser = $("ser");
  function draw() {
    const ba = Math.exp(+sba.value), er = +ser.value, L = M.ligneCoaxiale(1e-3, ba * 1e-3, { epsr: er });
    $("sbar").textContent = F.num(ba, 3); $("serr").textContent = F.num(er, 3);
    $("vz0").textContent = F.si(L.z0, "Ω");
    $("fz0").textContent = t("calc.f.z0", { v: F.si(L.z0 * Math.sqrt(er), "Ω") });
    $("vv").textContent = F.si(L.v, "m·s⁻¹");
    $("fv").textContent = t("calc.f.v", { v: F.num(L.facteurVitesse, 3) });
    $("vlc").textContent = F.qty(F.num(L.L0 * 1e9, 3), "nH·m⁻¹") + " · " + F.qty(F.num(L.C0 * 1e12, 3), "pF·m⁻¹");
    $("flc").textContent = t("calc.f.lc", { v: F.num(L.L0 * L.C0 * c * c, 4) });
  }
  sba.oninput = ser.oninput = draw; draw();
})();

/* ---------- une impulsion de 8 ns sur 20 m de câble ---------- */
(() => {
  const l = 20, T = l / CABLE.v, tau = 8e-9, t0 = 3 * tau, N = 261, xs = 5;
  const CHARGES = { adaptee: CABLE.z0, ouverte: Infinity, court: 0, triple: 3 * CABLE.z0 }, cache = {};
  const sim = id => cache[id] || (cache[id] = M.ligneEchelle({ L0: CABLE.L0, C0: CABLE.C0, l, n: 400, Rg: CABLE.z0, RL: CHARGES[id],
    e: u => 2 * Math.exp(-(((u - t0) / tau) ** 2)), duree: 2.6 * T, images: N }));
  const trace = $("trace"), st = $("st"), seg = $("charge"), play = $("play");
  let mode = "adaptee", timer = null;
  function draw() {
    const s = sim(mode), img = s.images[+st.value], ks = Math.round(xs / s.dx);
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, l], label: t("fig.xaxis") }, y: { domain: [-1.2, 2.2], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(l), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("line", { x1: P.x(xs), x2: P.x(xs), y1: P.y(-1.2), y2: P.y(2.2), class: "stroke thin dash c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(s.x.map((x, k) => [P.x(x), P.y(img.V[k])])), class: "curve" }, P.g);
    const echo = s.images.filter(i => i.t > 1.1 * T).reduce((m, i) => Math.abs(i.V[ks]) > Math.abs(m) ? i.V[ks] : m, 0);
    $("str").textContent = F.si(img.t, "s", { prefix: "n" });
    $("vg").textContent = F.num(s.gamma, 3);
    $("fg").textContent = mode === "ouverte" ? t("fig.f.infini") : t("fig.f.rl", { v: F.si(CHARGES[mode], "Ω") });
    $("ve").textContent = F.si(echo, "V");
    $("fe").textContent = t("fig.f.echo", { v: F.si(1, "V") });
    $("vt").textContent = F.si(2 * T, "s", { prefix: "n" });
    $("ft").textContent = t("fig.f.trajet", { v: F.si(CABLE.v, "m·s⁻¹") });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  const stop = () => { clearInterval(timer); timer = null; play.textContent = t("fig.play"); };
  play.onclick = () => {
    if (timer) return stop();
    if (+st.value >= N - 1) st.value = 0;
    play.textContent = t("fig.pause");
    timer = setInterval(() => { st.value = Math.min(N - 1, +st.value + 1); draw(); if (+st.value >= N - 1) stop(); }, 40);
  };
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; draw(); });
  st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kelvin", 1855, "idea"], ["heaviside", 1876, "idea"], ["brevet", 1880, "use"], ["affel", 1931, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tdr"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["vitesse", "c"], ["ouverte", "a"], ["court", "d"], ["log", "b"], ["forme", "c"], ["adaptee", "a"], ["echelle", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 241 });
})();
</script>
