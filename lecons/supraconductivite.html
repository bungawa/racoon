<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro;
const MAT = [["hg", 1911, 4.2], ["sn", 1913, 3.8], ["pb", 1913, 7], ["nbn", 1941, 16], ["lbco", 1986, 35], ["ybco", 1987, 92]];
const NOMS = textOf("fig.mat", MAT.map(m => m[0]));
$("sys1").innerHTML = t("sys.body", { kT: F.qty(F.num(Constantes.k_B * 4.2 / Constantes.e * 1e3, 2), "meV"), f: F.sci(Q.quantumFlux(), 3) });
(() => {
  const svg = $("tc"), sb = $("sb");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 64 }, x: { domain: [1900, 2000], label: t("fig.x"), fmt: v => String(v) }, y: { domain: [1, 150], scale: "log", label: t("fig.y") } });
  for (const [k, T] of [["he", 4.2], ["n2", 77]]) { Plot.el("line", { x1: x(1900), x2: x(2000), y1: y(T), y2: y(T), class: "stroke thin dash c-label-2" }, g);
    const tx = Plot.el("text", { x: x(1902), y: y(T) - 4, class: "tick" }, g); tx.textContent = t("fig.bath." + k); }
  const dots = MAT.map(([k, yr, T]) => { const c = Plot.el("circle", { cx: x(yr), cy: y(T), r: 6, class: "dot c-tint" }, g);
    const tx = Plot.el("text", { x: x(yr) + 9, y: y(T) + 4, class: "tick" }, g); tx.textContent = NOMS[k]; return c; });
  const bath = Plot.el("line", { x1: x(1900), x2: x(2000), class: "stroke c-warn" }, g);
  function draw() {
    const T = +sb.value, ok = MAT.filter(m => m[2] > T);
    bath.setAttribute("y1", y(T)); bath.setAttribute("y2", y(T));
    dots.forEach((c, i) => c.setAttribute("class", "dot " + (MAT[i][2] > T ? "c-tint" : "c-label-2")));
    $("sbr").innerHTML = F.kelvin(T);
    $("vn").textContent = ok.length + " / " + MAT.length;
    $("fn").textContent = ok.length ? ok.map(m => NOMS[m[0]]).join(", ") : t("fig.f.aucun");
    $("vk").textContent = F.qty(F.num(Constantes.k_B * T / Constantes.e * 1e3, 3), "meV");
    $("fk").textContent = t("fig.f.kt");
    $("vf").textContent = F.si(Q.quantumFlux(), "Wb");
    $("ff").textContent = t("fig.f.flux");
  }
  sb.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["onnes", 1911, "experiment"], ["bcs", 1957, "idea"], ["cuprates", 1986, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["anneau", "c"], ["bosons", "b"], ["charge", "d"], ["dissipation", "a"], ["azote", "b"], ["taille", "b"], ["temperature", "c"], ["phase", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 215 });
})();
</script>
