<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, HB = Constantes.hbar, N = 1200, L = 8e-9, dx = L / N, X0 = -L / 2, UP = 1e-25;   // p in units of 10⁻²⁵ kg·m·s⁻¹
$("sys1").innerHTML = t("sys.body", { v: F.si(10 * UP / Constantes.m_e, "m·s⁻¹"), b: F.sci((10 * UP / Constantes.m_e / Constantes.c) ** 2, 1), l: F.si(Constantes.h / (10 * UP), "m") });
(() => {
  const svg = $("onde"), sp = $("sp"), ss = $("ss");
  let mode = "prog";
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [-4, 4], label: t("fig.x") }, y: { domain: [-1.1, 1.1], label: t("fig.y") } });
  const pr = Plot.el("path", { class: "stroke thin c-tint" }, g), pi = Plot.el("path", { class: "stroke thin c-ok" }, g), pm = Plot.el("path", { class: "stroke c-label-2" }, g);
  function draw() {
    const p0 = +sp.value * UP, s = +ss.value * 1e-11, psi = [];
    for (let i = 0; i < N; i++) { const xx = X0 + i * dx;
      if (mode === "prog") { const z = Q.paquetGaussien(xx, { sigma: s, p0 }); psi.push({ re: z.re, im: z.im }); }
      else { const z = Q.paquetGaussien(xx, { sigma: s }); psi.push({ re: z.re * Math.cos(p0 * xx / HB), im: 0 }); } }
    const top = Math.max(...psi.map(z => Math.hypot(z.re, z.im)));
    const pts = f => Plot.path(psi.map((z, i) => [x((X0 + i * dx) * 1e9), y(f(z) / top)]));
    pr.setAttribute("d", pts(z => z.re)); pi.setAttribute("d", pts(z => z.im)); pm.setAttribute("d", pts(z => Math.hypot(z.re, z.im)));
    const m = Q.moyennesImpulsion(psi, dx), sx = Q.grilleStats(psi, dx, X0).ecart;
    $("spr").textContent = F.si(p0, "kg·m·s⁻¹"); $("ssr").textContent = F.si(s, "m");
    $("vp").textContent = F.si(Math.abs(m.p) < 1e-30 ? 0 : m.p, "kg·m·s⁻¹");
    $("fp").textContent = mode === "prog" ? t("fig.f.p.prog", { p0: F.si(p0, "kg·m·s⁻¹") }) : t("fig.f.p.stat");
    $("vd").textContent = F.si(m.ecart, "kg·m·s⁻¹");
    $("fd").textContent = t("fig.f.dp", { a: F.si(Math.sqrt(m.p2), "kg·m·s⁻¹") });
    $("vh").textContent = F.num(sx * m.ecart / (HB / 2), 3);
    $("fh").textContent = mode === "prog" ? t("fig.f.h.prog") : t("fig.f.h.stat");
    $("mode").querySelectorAll("button").forEach(e => e.setAttribute("aria-pressed", String(e.dataset.m === mode)));
  }
  $("mode").querySelectorAll("button").forEach(e => e.onclick = () => { mode = e.dataset.m; draw(); });
  sp.oninput = ss.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["broglie", 1924, "idea"], ["schrodinger", 1926, "idea"], ["davisson", 1927, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["met"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["derivee", "b"], ["reelle", "d"], ["parties", "a"], ["gauss", "c"], ["hamilt", "b"], ["stationnaire", "c"], ["deplacement", "d"], ["polaire", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 205 });
})();
</script>
