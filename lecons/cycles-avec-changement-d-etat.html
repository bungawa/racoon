<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const P = Plot.el, path = Plot.path;

/* ---------- §2 : un cycle dans les diagrammes (T, s) et (log p, h) ---------- */
(() => {
  const DEF = {
    rankine: { f: "eau", th: [400, 620, 553], tl: [290, 350, 308], eta: 0.85, s: [0, 9.5], T: [270, 660], h: [0, 3000], p: [300, 3e7] },
    pac: { f: "propane", th: [300, 340, 313], tl: [245, 290, 273], eta: 0.7, s: [0.5, 2.7], T: [230, 400], h: [50, 750], p: [5e4, 6e6] },
  };
  const SURCHAUFFE = 5, K = v => v + 0.15;                  // whole-kelvin sliders on the usual Celsius points
  let mode = "rankine";
  const set = m => { mode = m; const d = DEF[m];
    [["th", d.th], ["tl", d.tl]].forEach(([id, [a, b, v]]) => { $(id).min = a; $(id).max = b; $(id).value = v; });
    $("eta").value = d.eta; draw(); };
  function frames(d) {
    const ts = $("ts"), ph = $("ph"); ts.innerHTML = ""; ph.innerHTML = "";
    const A = Plot.axes(ts, { fmt: F, w: 320, h: 280, pad: { b: 44, l: 48 }, x: { domain: d.s, label: t("ts.x") }, y: { domain: d.T, label: t("ts.y") } });
    const B = Plot.axes(ph, { fmt: F, w: 320, h: 280, pad: { b: 44, l: 48 }, x: { domain: d.h, label: t("ph.x") }, y: { scale: "log", domain: d.p, label: t("ph.y") } });
    /* the saturation dome, liquid branch up to the critical point, vapour branch down */
    const rows = Thermo.FLUIDES[d.f].sat.filter(r => r[0] >= d.T[0] && r[1] >= d.p[0]);
    const dome = (o, X, Y) => P("path", { d: path(rows.map(r => [o.x(X(r, 0)), o.y(Y(r))]).concat(rows.slice().reverse().map(r => [o.x(X(r, 1)), o.y(Y(r))]))), class: "stroke thin c-label-2" }, o.g);
    dome(A, (r, v) => r[v ? 5 : 4] / 1e3, r => r[0]); dome(B, (r, v) => r[v ? 3 : 2] / 1e3, r => r[1]);
    return { A, B };
  }
  const seg = (o, pts, dash) => P("path", { d: path(pts.map(([x, y]) => [o.x(x), o.y(y)])), class: dash ? "stroke dash c-warn" : "curve" }, o.g);
  const dots = (o, pts) => pts.forEach(([x, y], i) => { P("circle", { cx: o.x(x), cy: o.y(y), r: 4.5, class: "dot" }, o.g);
    const near = i > 0 && Math.hypot(o.x(x) - o.x(pts[i - 1][0]), o.y(y) - o.y(pts[i - 1][1])) < 12;   // 1 and 2 nearly coincide
    P("text", { x: o.x(x) + (near ? -16 : 7), y: o.y(y) - 7, class: "note" }, o.g).textContent = String(i + 1); });
  function draw() {
    const d = DEF[mode], f = d.f, Th = K(+$("th").value), Tl = K(+$("tl").value), eta = +$("eta").value;
    const { A, B } = frames(d), kJ = v => v / 1e3;
    const satRows = (a, b) => Thermo.FLUIDES[f].sat.filter(r => r[0] > a && r[0] < b);
    let E, ve, fe, vx, fx, vw, fw, vsc, fsc;
    if (mode === "rankine") {
      const c = Thermo.rankine({ Tc: Th, Tf: Tl, etaT: eta }); E = c.etats;
      const sh = Thermo.saturation(f, Th);
      /* 1 → 2 → heating along the liquid line → boiling → 3, then 3 → 4 and condensation 4 → 1 */
      seg(A, [[kJ(E[1].s), Tl], [kJ(E[2].s), Tl]].concat(satRows(Tl, Th).map(r => [kJ(r[4]), r[0]]), [[kJ(sh.sl), Th], [kJ(E[3].s), Th]]));
      seg(A, [[kJ(E[3].s), Th], [kJ(E[4].s), Tl]], eta < 1); seg(A, [[kJ(E[4].s), Tl], [kJ(E[1].s), Tl]]);
      seg(B, [[kJ(E[1].h), E[1].p], [kJ(E[2].h), E[2].p], [kJ(E[3].h), E[3].p]]);
      const exp = eta < 1 ? [[kJ(E[3].h), E[3].p], [kJ(E[4].h), E[4].p]]               // isentropic expansion: the true curve, x(T) at s = s3
        : Array.from({ length: 21 }, (_, i) => { const T = Th - (Th - Tl) * i / 20, s = Thermo.saturation(f, T), x = (E[3].s - s.sl) / (s.sv - s.sl);
            return [kJ(s.hl + x * s.L), s.p]; });
      seg(B, exp, eta < 1); seg(B, [[kJ(E[4].h), E[4].p], [kJ(E[1].h), E[1].p]]);
      ve = F.qty(F.num(100 * c.eta, 3), "%"); fe = t("cy.f.carnot", { c: F.qty(F.num(100 * c.carnot, 3), "%") });
      vx = F.fix(E[4].x, 2); fx = t("cy.f.x4.rankine");
      vw = F.si(c.wT - c.wP, "J·kg⁻¹"); fw = t("cy.f.w.rankine", { t: F.si(c.wT, "J·kg⁻¹"), p: F.si(c.wP, "J·kg⁻¹", { sig: 2 }) });
      vsc = F.si(Math.max(c.sc.turbine, 0), "J·kg⁻¹·K⁻¹"); fsc = t("cy.f.sc.rankine");
    } else {
      const c = Thermo.compressionVapeur({ Te: Tl, Tc: Th, etaC: eta, surchauffe: SURCHAUFFE }); E = c.etats;
      const se = Thermo.saturation(f, Tl), sc = Thermo.saturation(f, Th);
      const iso = (Ts, d0, d1) => Array.from({ length: 13 }, (_, i) => Thermo.vapeur(f, Ts, { dT: d0 + (d1 - d0) * i / 12 }));
      seg(A, [[kJ(E[1].s), E[1].T], [kJ(E[2].s), E[2].T]], eta < 1);
      seg(A, iso(Th, E[2].dT, 0).map(v => [kJ(v.s), v.T]).concat([[kJ(sc.sl), Th]]));
      seg(A, [[kJ(E[3].s), Th], [kJ(E[4].s), Tl]], true);
      seg(A, [[kJ(E[4].s), Tl], [kJ(se.sv), Tl]].concat(iso(Tl, 0, SURCHAUFFE).map(v => [kJ(v.s), v.T])));
      seg(B, [[kJ(E[1].h), E[1].p], [kJ(E[2].h), E[2].p]], eta < 1);
      seg(B, [[kJ(E[2].h), E[2].p], [kJ(E[3].h), E[3].p]]); seg(B, [[kJ(E[3].h), E[3].p], [kJ(E[4].h), E[4].p]], true);
      seg(B, [[kJ(E[4].h), E[4].p], [kJ(E[1].h), E[1].p]]);
      ve = F.fix(c.cop.pac, 2); fe = t("cy.f.carnot", { c: F.fix(c.carnot.pac, 1) });
      vx = F.fix(E[4].x, 2); fx = t("cy.f.x4.pac");
      vw = F.si(c.w, "J·kg⁻¹"); fw = t("cy.f.w.pac", { t: F.kelvin(E[2].T) });
      vsc = F.si(Math.max(c.sc.compresseur, 0) + c.sc.detendeur, "J·kg⁻¹·K⁻¹");
      fsc = t("cy.f.sc.pac", { c: F.si(Math.max(c.sc.compresseur, 0), "J·kg⁻¹·K⁻¹", { sig: 2 }), d: F.si(c.sc.detendeur, "J·kg⁻¹·K⁻¹", { sig: 2 }) });
    }
    dots(A, [1, 2, 3, 4].map(k => [kJ(E[k].s), E[k].T])); dots(B, [1, 2, 3, 4].map(k => [kJ(E[k].h), E[k].p]));
    $("thv").innerHTML = F.kelvin(Th); $("tlv").innerHTML = F.kelvin(Tl); $("etav").textContent = F.fix(eta, 2);
    $("etal").textContent = t("cy.eta." + mode); $("ke").textContent = t("cy.k.e." + mode);
    $("ve").textContent = ve; $("fe").textContent = fe; $("vx").textContent = vx; $("fx").textContent = fx;
    $("vw").textContent = vw; $("fw").innerHTML = fw; $("vsc").textContent = vsc; $("fsc").textContent = fsc;
    $("cyseg").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
  }
  $("cyseg").querySelectorAll("button").forEach(b => b.onclick = () => set(b.dataset.m));
  ["th", "tl", "eta"].forEach(id => $(id).oninput = draw);
  set("rankine");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["perkins1834", 1834, "experiment"], ["rankine1859", 1859, "idea"], ["mollier1904", 1904, "idea"], ["midgley1930", 1930, "experiment"],
    ["montreal1987", 1987, "idea"], ["fgaz2024", 2024, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rep", "propane", "frigo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["isotherme", "b"], ["titre", "c"], ["pompe", "b"], ["carnot", "c"], ["detendeur", "a"], ["cop", "b"], ["titre4", "d"], ["reference", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 7103 });
})();
</script>
