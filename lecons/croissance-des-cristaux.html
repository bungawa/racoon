<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, X = Cristaux, Cst = Constantes;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- croissance à partir d'un germe ---------- */
(() => {
  const N = 1600, EPS = 0.1 * Cst.e, svg = $("germe");          // ε = 0,1 eV per bond: the scale of the temperature shown
  const rng = seed => { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; };
  let seed = 1;
  function upd() {
    const T = Math.pow(10, +$("lt").value), J = X.couplage(EPS, T), { sites } = X.croissance(N, J, rng(seed));
    const is = sites.map(s => s[0]), js = sites.map(s => s[1]);
    const i0 = Math.min(...is), i1 = Math.max(...is), j0 = Math.min(...js), j1 = Math.max(...js);
    const u = Math.min(600 / (i1 - i0 + 1), 360 / (j1 - j0 + 1), 14), ox = 320 - u * (i0 + i1 + 1) / 2, oy = 200 + u * (j0 + j1 + 1) / 2;
    svg.innerHTML = "";
    P("rect", { x: ox + u * i0, y: oy - u * (j1 + 1), width: u * (i1 - i0 + 1), height: u * (j1 - j0 + 1), class: "stroke thin dash c-label-2" }, svg);
    sites.forEach(([i, j], n) => P("rect", { x: ox + u * i + 0.5, y: oy - u * (j + 1) + 0.5, width: Math.max(u - 1, 0.5), height: Math.max(u - 1, 0.5),
      class: "fill " + (n >= 0.9 * N ? "el-o" : "c-tint") }, svg));
    $("ltv").innerHTML = F.kelvin(T);
    $("vj").textContent = F.fix(J, 2);
    $("vremp").textContent = F.qty(F.num(100 * X.remplissage(sites), 2), "%");
    const p1 = Math.exp(-3 * J);
    $("vp1").textContent = F.sci(p1, 2);
    $("fp1").textContent = t("cr.f.p1", { p3: F.sci(Math.exp(-J), 2) });
  }
  $("lt").oninput = upd;
  $("tirage").onclick = () => { seed++; upd(); };
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["verneuil", 1902, "experiment"], ["czochralski", 1916, "experiment"], ["teal", 1948, "experiment"], ["plaquettes", 1999, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["silicium"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["essais", "b"], ["faces", "d"], ["j", "a"], ["coin", "c"], ["trempe", "b"], ["germe", "a"], ["equilibre", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
