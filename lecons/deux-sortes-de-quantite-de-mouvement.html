<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, q = -Constantes.e, m = Constantes.m_e, R = 1e-3, TAU = 1e-7;   // solenoid of radius 1 mm, flux set up in 0,1 µs
$("sys1").innerHTML = t("sys.body", { R: F.si(R, "m"), tau: F.si(TAU, "s") });
(() => {
  const svg = $("imp"), sf = $("sf"), sr = $("sr");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [-0.5, 2], label: t("fig.x") }, y: { domain: [-1.2, 1.2], label: t("fig.y") } });
  const pmv = Plot.el("path", { class: "stroke c-tint" }, g), pqa = Plot.el("path", { class: "stroke dash c-warn" }, g), pp = Plot.el("path", { class: "stroke thin c-label-2" }, g);
  function draw() {
    const Phi = +sf.value * 1e-11, r = +sr.value * 1e-3, A = Q.potentielVecteurSolenoide(Phi, r, R), v = Q.vitesseSolenoide(q, m, Phi, r, R);
    const s = Math.abs(q * A) || 1, f = tt => Math.min(1, Math.max(0, tt));             // flux ramp: 0 before t = 0, linear up to τ
    const P = k => Array.from({ length: 201 }, (_, i) => { const u = -0.5 + 2.5 * i / 200; return [x(u), y(k(f(u)) / s)]; });
    pmv.setAttribute("d", Plot.path(P(a => -q * A * a)));
    pqa.setAttribute("d", Plot.path(P(a => q * A * a)));
    pp.setAttribute("d", Plot.path(P(a => 0)));
    $("sfr").textContent = F.si(Phi, "Wb"); $("srr").textContent = F.si(r, "m");
    $("vv").textContent = F.si(Math.abs(v), "m·s⁻¹");
    $("fv").textContent = t(v === 0 ? "fig.f.v0" : v > 0 ? "fig.f.vplus" : "fig.f.vmoins");
    $("vp").textContent = F.si(m * v + q * A + 0, "kg·m·s⁻¹");
    $("fp").textContent = t("fig.f.p", { mv: F.si(m * Math.abs(v), "kg·m·s⁻¹") });
    $("vd").textContent = F.si(Math.abs(v) * TAU / 2, "m");
    $("fd").textContent = t("fig.f.d", { r: F.num(Math.abs(v) * TAU / 2 / r, 2) });
  }
  sf.oninput = sr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1831, "experiment"], ["maxwell", 1865, "idea"], ["tonomura", 1986, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rf"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["operateur", "b"], ["solenoide", "c"], ["conserve", "a"], ["jauge", "d"], ["sens", "a"], ["distance", "b"], ["condition", "c"], ["onde", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 213 });
})();
</script>
