<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, FM = 1e-15;
const pct = e => F.qty(F.num(100 * e, 2), "%");

/* ---------- le système décrit : le noyau de plomb 208 comme boule uniforme ---------- */
(() => {
  const Z = 82, A = 208, R = 1.25 * FM * Math.cbrt(A), Q = Z * ES.E, rho = 3 * Q / (4 * Math.PI * R ** 3);
  $("sys1").innerHTML = t("sys1.body", { r: F.si(R, "m", { prefix: "f" }), e: F.si(ES.K * Q / (R * R), "V·m⁻¹"), rho: F.si(rho, "C·m⁻³"), err: pct(4 * Math.log(3) * 0.53 * FM / R) });   // 90 %–10 % thickness t = 4 a ln 3 of a Woods–Saxon profile, a ≈ 0,53 fm
})();

/* ---------- E(r) of a shell uniform between R1 and R2, against the thin shell and the full ball ---------- */
(() => {
  const svg = $("coq"), esl = $("esl"), Q = 1e-9, R2 = 0.1, E2 = ES.K * Q / (R2 * R2);
  const er = (B, u) => ES.champRadial(B.charge, [u * R2, 0, 0])[0] / E2;
  const ball = ES.BOULES.coquille(Q, 0, R2);
  /* the discrete thin shell: 2 000 charges, the field at a point off centre at R/2, against E(R) */
  const pts = ES.coquilleDiscrete(Q, R2, 2000), pin = [0.03, 0.03, 0.02];
  $("vdiscret").textContent = F.sci(Math.hypot(...ES.champ(pts, pin)) / E2, 2);
  function draw() {
    const k = +esl.value / 100, R1 = k * R2, B = ES.BOULES.coquille(Q, R1, R2);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44 }, x: { domain: [0, 2.5], label: t("co.x"), fmt: v => F.num(v, 2) }, y: { domain: [0, 1.1], label: t("co.y"), fmt: v => F.num(v, 2) } });
    const us = Array.from({ length: 501 }, (_, i) => 2.5 * i / 500);
    const curve = (pts, cls, kl) => Plot.el("path", { d: Plot.path(pts.map(([u, v]) => [x(u), y(v)])), class: kl }, Plot.el("g", { class: cls }, g));
    curve(us.map(u => [u, er(ball, u)]), "c-label-2", "stroke dash");
    curve([[0, 0], [1, 0], [1, 1]].concat(us.filter(u => u > 1).map(u => [u, 1 / (u * u)])), "c-ok", "stroke");
    curve(us.map(u => [u, er(B, u)]), "c-tint", "stroke");
    const gl = Plot.el("g", { class: "c-label-2" }, g);
    [k, 1].forEach(u => Plot.el("line", { x1: x(u), x2: x(u), y1: y(0), y2: y(1.1), class: "stroke thin dash" }, gl));
    $("eread").textContent = F.num(k, 2);
    $("vsubi").textContent = F.num(ES.champSubi(B, R2, 4000) / E2, 3);
    $("vmontee").textContent = F.num(1 - k, 2) + " R";
  }
  esl.oninput = draw; draw();
})();

/* ---------- le système décrit : une sphère conductrice de 10 cm portée à 30 kV ---------- */
(() => {
  const R = 0.1, V = 3e4, E = V / R, s = ES.EPS0 * E, P = ES.pressionElectrostatique(s);
  $("sys2").innerHTML = t("sys2.body", { e: F.si(E, "V·m⁻¹"), sigma: F.si(s, "C·m⁻²"), p: F.si(P, "Pa"), rap: F.sci(P / 101325, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cage", 1836, "experiment"], ["seau", 1843, "experiment"], ["rutherford", 1911, "idea"], ["weizsacker", 1935, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm", "noyaux"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["lineaire", "b"], ["dedans", "a"], ["decentre", "d"], ["epaisse", "c"], ["subi", "a"], ["pression", "b"], ["noyau", "c"], ["deux", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 57 });
})();
</script>
