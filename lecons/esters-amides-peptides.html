    <figure>
      <div class="panel">
        <div class="seg" role="group" id="mecas"><button type="button" data-m="saponification" data-i18n="meca.saponification"></button><button type="button" data-m="chlorureAcyle" data-i18n="meca.chlorureAcyle"></button></div>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><msup><mi>K</mi><mo>°</mo></msup><mo>=</mo><mfrac><mrow><msub><mi>x</mi><mtext data-i18n="eq.ester"></mtext></msub><mspace width="0.1em"/><msub><mi>x</mi><mtext data-i18n="eq.eau"></mtext></msub></mrow><mrow><msub><mi>x</mi><mtext data-i18n="eq.acide"></mtext></msub><mspace width="0.1em"/><msub><mi>x</mi><mtext data-i18n="eq.alcool"></mtext></msub></mrow></mfrac><mo>≈</mo><mn>4</mn></math></div>
    <p class="validite" data-i18n-html="s2.validite"></p>
    <figure>
      <div class="chart"><svg id="courbe" role="img" data-i18n-attr="aria-label:est.aria"></svg></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="ratio" data-i18n="est.ratio"></label><output id="ratior" for="ratio"></output></div>
          <input id="ratio" type="range" min="0.5" max="5" step="0.1" value="1"></div>
        <div class="ctl"><div class="row"><label for="retrait" data-i18n="est.retrait"></label><output id="retraitr" for="retrait"></output></div>
          <input id="retrait" type="range" min="0" max="0.99" step="0.01" value="0"></div>
        <div class="ctl"><div class="row"><label for="kk" data-i18n="est.k"></label><output id="kkr" for="kk"></output></div>
          <input id="kk" type="range" min="2" max="6" step="0.1" value="4"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="est.k.rdt"></span><span class="v" id="vrdt"></span><span class="f" data-i18n="est.f.rdt"></span></div>
          <div class="stat"><span class="k" data-i18n="est.k.reste"></span><span class="v" id="vreste"></span><span class="f" data-i18n="est.f.reste"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="est.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
    <p data-i18n-html="s2.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><msub><mover><mi>X</mi><mo>‾</mo></mover><mi mathvariant="normal">n</mi></msub><mo>=</mo><mfrac><mrow><mn>1</mn><mo>+</mo><mi>r</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>r</mi><mo>−</mo><mn>2</mn><mi>r</mi><mi>p</mi></mrow></mfrac><mspace width="1em"/><mo stretchy="false">(</mo><mi>r</mi><mo>=</mo><mn>1</mn><mo>:</mo><mspace width="0.3em"/><msub><mover><mi>X</mi><mo>‾</mo></mover><mi mathvariant="normal">n</mi></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>−</mo><mi>p</mi></mrow></mfrac><mo stretchy="false">)</mo></math></div>
    <p class="validite" data-i18n-html="s3.validite"></p>
    <div class="panel">
      <div class="ctl"><div class="row"><label for="pp" data-i18n="car.p"></label><output id="ppr" for="pp"></output></div>
        <input id="pp" type="range" min="1" max="4" step="0.05" value="2"></div>
      <div class="ctl"><div class="row"><label for="rr" data-i18n="car.r"></label><output id="rrr" for="rr"></output></div>
        <input id="rr" type="range" min="0.95" max="1" step="0.001" value="1"></div>
      <div class="stats">
        <div class="stat"><span class="k" data-i18n="car.k.xn"></span><span class="v" id="vxn"></span><span class="f" id="fxn"></span></div>
        <div class="stat"><span class="k" data-i18n="car.k.plafond"></span><span class="v" id="vpl"></span><span class="f" data-i18n="car.f.plafond"></span></div>
      </div>

    <p data-i18n-html="s3.p2"></p>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>

    <figure>
      <svg class="fig no-sigle" id="pep" role="img" data-i18n-attr="aria-label:pep.aria"></svg>

    <span class="sec" data-i18n="hist.sec"></span>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/plot.js"></script>

<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/esters-amides-peptides.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/thermo.js"></script>
<script src="/racoon/statistique.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = ChimOrga, sym = s => t("chim.sym", { s });

/* ---------- addition puis élimination : deux mécanismes, acte par acte ---------- */
(() => {
  const mecas = $("mecas"), TXT = textOf("meca.actes", ["saponification", "chlorureAcyle"]);
  let id = "saponification";
  function choisit(m) {
    id = m;
    ActesMecanisme.monter({ vues: O.actesMecanisme(id, { texte: sym, echelle: 40 }), textes: TXT[id], svg: $("meca"), boutons: $("actes"), texte: $("actetxt") });
    mecas.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === id)));
  }
  mecas.onclick = e => { const b = e.target.closest("button"); if (b) choisit(b.dataset.m); };
  choisit(id);
})();

/* ---------- groupes partants ---------- */
(() => {
  const ROWS = ["chlorure", "anhydride", "ester", "amide"], txt = textOf("partants.rows", ROWS);
  $("partants").innerHTML = ROWS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text}</span><span class="v">${txt[id].pka}</span></div>`).join("");
})();

/* ---------- rendement de l'estérification ---------- */
(() => {
  const svg = $("courbe"), ratio = $("ratio"), retrait = $("retrait"), kk = $("kk");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 260, x: { domain: [0.5, 5], label: t("est.x") }, y: { domain: [0, 100], label: t("est.y") } });
  const ref = Plot.el("path", { class: "ref" }, g), courbe = Plot.el("path", { class: "curve" }, g), dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  const rdt = (K, b, f) => 100 * O.esterification({ K, acide: 1, alcool: b, retrait: f }).x;   // rapporté à l'acide, 1 mol
  function upd() {
    const b = +ratio.value, f = +retrait.value, K = +kk.value, xs = Array.from({ length: 91 }, (_, i) => 0.5 + 0.05 * i);
    ref.setAttribute("d", Plot.path(xs.map(u => [x(u), y(rdt(4, u, 0))])));
    courbe.setAttribute("d", Plot.path(xs.map(u => [x(u), y(rdt(K, u, f))])));
    const r = rdt(K, b, f);
    dot.setAttribute("cx", x(b)); dot.setAttribute("cy", y(r));
    $("ratior").textContent = F.num(b, 2); $("retraitr").textContent = F.qty(F.fix(100 * f, 0), "%"); $("kkr").textContent = F.num(K, 2);
    $("vrdt").textContent = F.qty(F.fix(r, 1), "%");
    $("vreste").textContent = F.qty(F.fix(100 - r, 1), "%");
  }
  ratio.oninput = retrait.oninput = kk.oninput = upd; upd();
})();

/* ---------- polycondensation : Carothers ---------- */
(() => {
  const pp = $("pp"), rr = $("rr"), M0 = O.masseMolaire({ C: 12, H: 22, N: 2, O: 2 }) / 2;   // nylon 6,6 : motif C₁₂H₂₂N₂O₂, deux monomères
  function upd() {
    const p = 1 - Math.pow(10, -(+pp.value)), r = +rr.value, xn = O.carothers(p, r);
    $("ppr").textContent = F.qty(F.fix(100 * p, p > 0.999 ? 3 : 2), "%");
    $("rrr").textContent = F.num(r, 4);
    $("vxn").textContent = F.num(xn, 3);
    $("fxn").textContent = t("car.f.xn", { m: F.si(xn * M0, "kg·mol⁻¹", { sig: 2 }) });
    $("vpl").textContent = r < 1 ? F.num((1 + r) / (1 - r), 3) : t("car.infini");
  }
  pp.oninput = rr.oninput = upd; upd();
})();

/* ---------- un dipeptide : liaison peptidique et chaîne latérale ---------- */
(() => {
  const m = O.molecule("cgGlycylserine"), am = O.familles(m).find(f => f.famille === "amide").atomes;
  const d = O.dessin(m, { texte: sym, echelle: 40, surligne: am.concat([9, 10]) });
  $("pep").setAttribute("viewBox", d.viewBox); $("pep").innerHTML = d.html;
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["berthelot", 1862, "experiment"], ["speier", 1895, "experiment"], ["fourneau", 1901, "experiment"], ["carothers", 1935, "experiment"], ["pet", 1941, "experiment"], ["merrifield", 1963, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pet", "peptides"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ordre", "b"], ["amide", "d"], ["rendement", "a"], ["deplacer", "c"], ["saponification", "b"], ["sel", "a"], ["carothers", "d"], ["tripeptide", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 3103 });
})();
</script>
