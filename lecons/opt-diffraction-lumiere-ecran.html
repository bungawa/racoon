<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd;

/* ---------- un trou et son bouchon : la figure sur un écran à la distance z ---------- */
(() => {
  const L = 500e-9, svg = $("profil"), sa = $("sa"), sz = $("sz");
  function draw() {
    const a = +sa.value * 1e-3, z = 10 ** +sz.value, N = a * a / (L * z);
    const rmax = Math.max(1.8 * a, 2.5 * L * z / a), xs = Array.from({ length: 161 }, (_, i) => i * rmax / 160);
    const E = xs.map(rho => O.trou({ lambda: L, z, a, rho, pas: 8 }).E);
    const It = E.map(e => e.re * e.re + e.im * e.im), Id = E.map(e => (1 - e.re) ** 2 + e.im * e.im);   // Babinet: disk = free − hole
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 }, x: { domain: [0, 1000 * rmax], label: t("fig.xaxis") }, y: { domain: [0, 4.2], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(1000 * a), x2: P.x(1000 * a), y1: P.y(0), y2: P.y(4.2), class: "zero" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((r, i) => [P.x(1000 * r), P.y(It[i])])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((r, i) => [P.x(1000 * r), P.y(Id[i])])), class: "ref" }, P.g);
    $("sar").textContent = F.qty(F.num(1000 * a, 3), "mm");
    $("szr").textContent = F.si(z, "m");
    $("vn").textContent = F.num(N, 3);
    $("fn").textContent = t("fig.f.n", { r: F.si(Math.sqrt(L * z), "m", { prefix: "m" }), q: F.sci(a / L, 2) });
    const I3 = v => F.num(v < 5e-4 ? 0 : v, 3);                               // three figures; below 5 × 10⁻⁴ it reads 0
    $("vt").textContent = I3(It[0]);
    $("ft").textContent = t("fig.f.trou", { v: I3(4 * Math.sin(Math.PI * N / 2) ** 2) });
    $("vd").textContent = I3(Id[0]);
    $("fd").textContent = t("fig.f.disque");
  }
  sa.oninput = sz.oninput = draw; draw();
})();

/* ---------- le système décrit : une feuille d'or, et un écran vraiment opaque ---------- */
(() => {
  const L = 500e-9, n2 = 2, e = O.ecranAbsorbant(n2, L, L / 7);
  $("sys1").innerHTML = t("sys1.body", { d: F.si(L / 7, "m", { prefix: "n" }), T: F.num(100 * e.T, 2), p: F.si(e.penetration, "m", { prefix: "n" }),
    e6: F.si(e.epaisseur(1e-6), "m", { prefix: "n" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fresnel", 1818, "idea"], ["arago", 1819, "experiment"], ["babinet", 1837, "idea"], ["faraday", 1857, "experiment"], ["bethe", 1944, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["granulo", "four"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["opaque", "b"], ["or", "c"], ["signe", "a"], ["petit", "d"], ["axe", "c"], ["deux", "a"], ["disque", "d"], ["four", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 316 });
})();
</script>
