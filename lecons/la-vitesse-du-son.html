<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["isotherme", "adiabatique"]; keyed($("deux"), t("deux.tag"), IDS, textOf("deux.items", IDS)); })();

/* ---------- c(T) : Laplace contre Newton, et les mesures ---------- */
(() => {
  const O = self.Ondes, TS = Array.from({ length: 181 }, (_, i) => 150 + 450 * i / 180);
  let gaz = "air";
  function upd() {
    const T = +$("tk").value, cl = O.celerite(gaz, T), cn = O.celeriteNewton(gaz, T), vq = O.vitesseQuadratique(gaz, T), g = O.GAZ_SON[gaz].gamma;
    const ymax = 1.15 * O.celerite(gaz, 600), mes = O.MESURES_SON.filter(m => m.gaz === gaz);
    const svg = $("cT"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 }, x: { domain: [150, 600], label: t("ct.xaxis") }, y: { domain: [0, ymax], label: t("ct.yaxis") } });
    Plot.el("path", { d: Plot.path(TS.map(x => [P.x(x), P.y(O.celeriteNewton(gaz, x))])), class: "stroke dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(TS.map(x => [P.x(x), P.y(O.celerite(gaz, x))])), class: "curve" }, P.g);
    mes.forEach(m => Plot.el("circle", { cx: P.x(m.T), cy: P.y(m.c), r: 5, class: "fill c-warn" }, P.g));
    Plot.el("line", { x1: P.x(T), x2: P.x(T), y1: P.y(0), y2: P.y(ymax), class: "stroke thin c-label" }, P.g);
    Plot.el("circle", { cx: P.x(T), cy: P.y(cl), r: 4, class: "dot" }, P.g);
    $("tkv").innerHTML = F.kelvin(T);
    $("vlap").textContent = F.si(cl, "m·s⁻¹"); $("flap").textContent = t("ct.f.lap", { g: F.num(g, 4), l: F.si(cl / 1000, "m") });
    $("vnew").textContent = F.si(cn, "m·s⁻¹"); $("fnew").textContent = t("ct.f.new", { r: F.num(cl / cn, 4) });
    $("vvq").textContent = F.si(vq, "m·s⁻¹"); $("fvq").textContent = t("ct.f.vq", { r: F.num(cl / vq, 3) });
    const near = mes.reduce((b, m) => !b || Math.abs(m.T - T) < Math.abs(b.T - T) ? m : b, null);
    $("vmes").textContent = F.si(near.c, "m·s⁻¹");
    $("fmes").innerHTML = t("ct.f.mes", { T: F.kelvin(near.T), e: F.num(100 * (O.celerite(gaz, near.T) / near.c - 1), 2), n: F.num(100 * (O.celeriteNewton(gaz, near.T) / near.c - 1), 2) });
    $("gaz").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.g === gaz)));
  }
  $("gaz").querySelectorAll("button").forEach(b => b.onclick = () => { gaz = b.dataset.g; upd(); });
  $("tk").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1687, "idea"], ["laplace", 1816, "idea"], ["colladon", 1826, "experiment"], ["boltzmann", 2017, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["thermometrie", "anemometre"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["newton", "d"], ["pression", "a"], ["temperature", "c"], ["helium", "b"], ["molecules", "a"], ["adiabatique", "d"], ["eau", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 475 });
})();
</script>
