<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const $ = id => document.getElementById(id);
const M = MagInd, C = Constantes.c;

/* ---------- le tableau : faux en général, toujours vrai ---------- */
(() => {
  const FAUX = ["coulomb", "rotE", "gradient", "conducteur", "ampere", "poisson", "divA", "instantane", "energie"];
  const VRAI = ["lorentz", "gauss", "divB", "faraday", "maxwell", "champE", "ondes", "retardes", "densite"];
  const rows = (id, ids, k) => { const txt = textOf(k, ids);
    $(id).innerHTML = ids.map(i => `<div><span class="k">${txt[i].nom}</span><span>${txt[i].loi}</span></div>`).join(""); };
  rows("faux", FAUX, "tab.items.faux"); rows("vrai", VRAI, "tab.items.vrai");
})();
F.autoTypo(document.querySelector("main"));

/* ---------- un dipôle qui oscille : potentiel retardé contre potentiel statique ---------- */
(() => {
  const svg = $("retard"), sf = $("sf"), sr = $("sr"), p0 = 1e-12, th = 0;              // C·m, rad
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44 },
    x: { domain: [0, 2], label: t("fig.x") }, y: { domain: [-1.1, 1.1], label: t("fig.y") } });
  const ps = Plot.el("path", { class: "stroke c-label-2 dash" }, g), pr = Plot.el("path", { class: "stroke c-tint" }, g);
  function draw() {
    const f = 10 ** +sf.value, r = 10 ** +sr.value, T = 1 / f, d0 = M.dipoleOscillant(p0, f, r, th, 0);
    const As = Math.abs(p0 / (4 * Math.PI * Constantes.eps0 * r * r)), Ar = As * d0.rapport;
    let a = "", b = "";
    for (let i = 0; i <= 300; i++) { const u = 2 * i / 300, d = M.dipoleOscillant(p0, f, r, th, u * T);
      a += (i ? "L" : "M") + x(u).toFixed(1) + " " + y(d.statique / As).toFixed(1); b += (i ? "L" : "M") + x(u).toFixed(1) + " " + y(d.retarde / Ar).toFixed(1); }
    ps.setAttribute("d", a); pr.setAttribute("d", b);
    $("sfr").textContent = F.si(f, "Hz"); $("srr").textContent = F.si(r, "m");
    $("vk").textContent = F.sci(d0.kr, 2);
    $("fk").textContent = t("fig.f.kr", { l: F.si(C / f, "m") });
    $("va").textContent = F.num(d0.rapport, 5);
    $("fa").textContent = d0.kr > 1 ? t("fig.f.amp.loin") : t("fig.f.amp.pres");
    $("vr").textContent = t("fig.v.ret", { n: F.sci(d0.retard / (2 * Math.PI), 2) });
    $("fr").textContent = t("fig.f.ret", { t: F.si(d0.retard / (2 * Math.PI * f), "s") });
  }
  sf.oninput = sr.oninput = draw; draw();
})();

/* ---------- le système décrit : le réseau à 50 Hz, un téléphone à 2 GHz ---------- */
(() => {
  const k = (f, L) => 2 * Math.PI * f * L / C;
  $("sys1").innerHTML = t("sys1.body", { l50: F.si(C / 50, "m"), m: F.si(100, "m"), k1: F.sci(k(50, 100), 1), km: F.si(1e6, "m"), k2: F.num(k(50, 1e6), 2),
    l2: F.si(C / 2e9, "m"), cm: F.si(0.15, "m"), k3: F.num(k(2e9, 0.15), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1861, "idea"], ["lorenz", 1867, "idea"], ["hertz", 1888, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["kirchhoff"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["rotE", "c"], ["conducteur", "a"], ["coulomb", "d"], ["energie", "b"], ["kr", "c"], ["deplacement", "a"], ["divB", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 156 });
})();
</script>
