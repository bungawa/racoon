<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
const sci = (x, n) => Math.abs(x) >= 1e-2 && Math.abs(x) < 1e4 ? F.num(x, n) : F.sci(x, n);
const DEG = Math.PI / 180, JOUR = 86400;

/* ---------- secteurs de même durée, pour une force en 1/rⁿ, avec ou sans champ uniforme ---------- */
(() => {
  const MODES = ["centrale", "champ"], NAMES = textOf("sim.modes", MODES), P = Plot.el, NS = 8, PAS = 100, H = 0.008;
  let mode = "centrale";
  function upd() {
    MODES.forEach(id => $("m-" + id).setAttribute("aria-pressed", String(id === mode)));
    const n = +$("n").value;
    $("nv").textContent = F.num(n, 2);
    const A = FC.aires("mixte", { k: 1, n, g: mode === "champ" ? [0, -0.3] : [0, 0] }, { t: 0, x: [1, 0], v: [0, 0.8] }, NS, PAS, H);
    const svg = $("are"), W = 640, HT = 360, all = A.points.flat().concat([[0, 0]]);
    const x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0])), y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
    const k = Math.min((W - 40) / (x1 - x0), (HT - 40) / (y1 - y0)), X = x => W / 2 + k * (x - (x0 + x1) / 2), Y = y => HT / 2 - k * (y - (y0 + y1) / 2);
    svg.innerHTML = "";
    A.points.forEach((pts, i) => P("path", { d: "M" + X(0) + " " + Y(0) + pts.filter((_, j) => j % 4 === 0 || j === pts.length - 1).map(p => "L" + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("") + "Z", class: "fill c-tint", opacity: i % 2 ? "0.12" : "0.32" }, svg));
    P("path", { d: A.points.flat().map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(""), class: "stroke c-tint" }, svg);
    P("circle", { cx: X(0), cy: Y(0), r: 6, class: "fill c-warn" }, svg);
    const moy = A.aires.reduce((s, a) => s + a, 0) / NS;
    $("vc").textContent = F.qty(F.num(A.C0, 3), "m²·s⁻¹");
    $("vaire").textContent = F.qty(F.num(moy, 4), "m²");
    $("faire").textContent = t("sim.f.aire", { a: F.qty(F.num(A.vitesseAreolaire * A.duree, 4), "m²") });
    $("vecart").textContent = sci(A.ecart, 2);
    $("fecart").textContent = t(A.ecart < 1e-9 ? "sim.f.ok" : "sim.f.ko");
  }
  MODES.forEach(id => { $("m-" + id).textContent = NAMES[id]; $("m-" + id).onclick = () => { mode = id; upd(); }; });
  $("n").oninput = upd; upd();
})();

/* ---------- Molniya : a = 26 600 km, e = 0,74 (orbite type publiée) ---------- */
(() => {
  const a = 26600e3, e = 0.74, T = FC.periode(Constantes.GM_E, a), f = FC.fractionApogee(e);
  $("molT").textContent = t("mol.min", { n: F.num(T / 60, 3) });
  $("molF").textContent = F.qty(F.num(f * 100, 3), "%");
  $("molFh").textContent = t("mol.f.frac", { h: F.qty(F.num(f * T / 3600, 3), "h") });
  $("molV").textContent = F.num((1 + e) / (1 - e), 3);
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["centre", "satellite", "soleil", "forme"], items = textOf("sys.items", IDS);
  const q = Kepler.LUNE.masse, L = Kepler.testLune(), J = FC.precessionJ2(Constantes.R_E_eq + 400e3, 0, 51.6 * DEG);
  const v = { q: F.sci(q, 2), bary: F.qty(F.num(Kepler.LUNE.a * q / (1 + q) / 1e3, 3), "km"), mu: F.num((1 - FC.deuxCorps(q).reduite) * 100, 2),
    sat: F.sci(1000 * Constantes.G / Constantes.GM_E, 1), soleil: F.sci(Math.abs(L.soleil / L.mesure), 1), tangent: F.sci(FC.mareeSolaire().tangentielle, 1),
    j2: F.sci(J.relatif, 1), noeud: F.num(J.noeud * JOUR / DEG, 2) };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["nova", 1609, "idea"], ["epitome", 1621, "idea"], ["principia", 1687, "idea"], ["molniya", 1965, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["plan", "a"], ["toute", "a"], ["vitesse", "a"], ["radial", "a"], ["champ", "a"], ["molniya", "a"], ["deux", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 182 });
})();
</script>
