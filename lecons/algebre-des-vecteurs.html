<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹", deg = Math.PI / 180;

/* ---------- le système décrit, chiffré ---------- */
(() => {
  const n = AlgVec.negligeables("avion");
  $("sys").innerHTML = t("sys.body", { rel: F.sci(n.rel, 1), cor: F.sci(n.coriolis, 1), point: F.sci(n.point, 1) });
})();

/* ---------- triangle des vitesses : somme, multiple, différence ---------- */
(() => {
  const svg = $("nav"), P = Plot.el, O = [250, 200], K = 1.6;            // 1 m·s⁻¹ = 1,6 px
  const scr = p => [O[0] + K * p[0], O[1] - K * p[1]];
  const arrow = (A, B, cls, parent) => Plot.fleche(parent, A, B, { cls, tete: 10 });
  const label = (p, text, parent) => { const e = P("text", { x: p[0], y: p[1], "text-anchor": "middle" }, parent); e.textContent = text; return e; };
  const S = ["ansl", "aasl", "bnsl", "basl", "ksl"].map($);
  const pair = v => "(" + F.fix(v[0], 1) + " ; " + F.fix(v[1], 1) + ")";
  function draw() {
    svg.innerHTML = "";
    const [an, aa, bn, ba, k] = S.map(s => +s.value), a = [an * Math.cos(aa * deg), an * Math.sin(aa * deg)], b = [bn * Math.cos(ba * deg), bn * Math.sin(ba * deg)];
    const kb = Dyna.fois(k, b), c = AlgVec.combinaison(a, k, b);
    /* axes: east along x, north along y */
    P("line", { x1: O[0] - 180, y1: O[1], x2: O[0] + 180, y2: O[1], class: "stroke thin c-label-2" }, svg);
    P("line", { x1: O[0], y1: O[1] - 180, x2: O[0], y2: O[1] + 180, class: "stroke thin c-label-2" }, svg);
    label([O[0] + 200, O[1] + 4], t("nav.est"), svg); label([O[0], O[1] - 186], t("nav.nord"), svg);
    /* parallelogram: k b from O and a from the tip of k b, dashed */
    const A = scr(a), KB = scr(kb), C = scr(c);
    P("polyline", { points: [O, KB, C].map(p => p.map(q => q.toFixed(1)).join(",")).join(" "), class: "stroke thin dash c-label-2" }, svg);
    arrow(O, A, "c-tint", svg); arrow(A, C, "c-warn", svg); arrow(O, C, "c-label", svg);
    /* a label beside the middle of an arrow, on its right (s = 1) or left (s = −1) */
    const mid = (A, B, s, key) => { const d = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1; label([(A[0] + B[0]) / 2 - s * 14 * (B[1] - A[1]) / d, (A[1] + B[1]) / 2 + s * 14 * (B[0] - A[0]) / d + 4], t(key), svg); };
    mid(O, A, 1, "nav.a"); mid(A, C, 1, "nav.kb"); mid(O, C, -1, "nav.c");
    /* the same sum, by components */
    label([540, 50], t("nav.side"), svg);
    [["nav.side.a", a], ["nav.side.kb", kb], ["nav.side.c", c]].forEach(([key, v], i) => label([540, 80 + 24 * i], t(key, { v: pair(v) }), svg));
    $("anread").textContent = F.qty(S[0].value, MS); $("aaread").textContent = F.qty(S[1].value, "°");
    $("bnread").textContent = F.qty(S[2].value, MS); $("baread").textContent = F.qty(S[3].value, "°");
    $("kread").textContent = F.fix(k, 1);
    $("va").textContent = F.qty(F.fix(an, 1), MS); $("fa").textContent = t("nav.f.comp", { v: pair(a) });
    $("vkb").textContent = F.qty(F.fix(Dyna.norme(kb), 1), MS); $("fkb").textContent = t("nav.f.comp", { v: pair(kb) });
    $("vc").textContent = F.qty(F.fix(Dyna.norme(c), 1), MS); $("fc").textContent = t("nav.f.comp", { v: pair(c) });
    $("vtri").textContent = F.qty(F.fix(an + Dyna.norme(kb), 1), MS); $("ftri").textContent = t("nav.f.tri", { c: F.fix(Dyna.norme(c), 1) });
  }
  S.forEach(s => s.oninput = draw); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["stevin", 1586, "idea"], ["grassmann", 1844, "idea"], ["heaviside", 1893, "idea"], ["wilson", 1901, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["navigation", "statique"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["normes", "a"], ["vent", "a"], ["difference", "a"], ["ordre", "a"], ["multiple", "a"], ["derivee", "a"], ["polaire", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 115 });
})();
</script>
