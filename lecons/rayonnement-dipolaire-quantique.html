<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, DEG = Math.PI / 180;

/* ---------- the angular pattern of an m = +1 → 0 decay, and the polarization ellipse at θ ---------- */
(() => {
  const svg = $("polaire"), ell = $("ellipse"), sth = $("sth");
  const c0 = 160, R = 130, pt = (r, th) => [c0 + R * r * Math.sin(th), c0 - R * r * Math.cos(th)];   // z up
  function courbe(f, cls) {
    const p = []; for (let i = 0; i <= 360; i++) { const th = i * DEG; p.push(pt(f(Q.emissionDipolaire(th)), th)); }
    Plot.el("path", { d: Plot.path(p) + "Z", class: cls }, svg);
  }
  function draw() {
    const th = +sth.value * DEG, e = Q.emissionDipolaire(th);
    svg.innerHTML = "";
    Plot.el("line", { x1: c0, x2: c0, y1: 10, y2: 310, class: "stroke thin c-label-2" }, svg);
    Plot.el("line", { x1: 10, x2: 310, y1: c0, y2: c0, class: "stroke thin c-label-2" }, svg);
    const z = Plot.el("text", { x: c0 + 6, y: 20, class: "c-label-2" }, svg); z.textContent = t("fig.z");
    courbe(r => r.total, "stroke bold c-ok"); courbe(r => r.IR, "stroke c-tint"); courbe(r => r.IL, "stroke c-warn");
    Plot.fleche(svg, [c0, c0], pt(1.1, th), { cls: "c-label", tete: 8 });
    Plot.el("circle", { cx: c0, cy: c0, r: 5, class: "fill c-label" }, svg);
    /* the ellipse seen by an observer looking back at the atom: axes ratio |cos θ| */
    ell.innerHTML = "";
    const b = 60 * Math.abs(Math.cos(th));
    Plot.el("ellipse", { cx: 100, cy: 70, rx: 60, ry: Math.max(b, 0.6), class: "stroke bold c-tint" }, ell);
    $("sthr").textContent = F.num(+sth.value, 3) + "°";
    $("vr").textContent = F.fix(e.IR, 3); $("fr").textContent = t("fig.f.amp", { v: F.fix(e.R, 3) });
    $("vl").textContent = F.fix(e.IL, 3); $("fl").textContent = t("fig.f.amp", { v: F.fix(e.L, 3) });
    $("ve").textContent = F.fix(Math.abs(Math.cos(th)), 3);
    const c = Math.cos(th);
    $("fe").textContent = t(Math.abs(c) > 0.999 ? (c > 0 ? "fig.f.droite" : "fig.f.gauche") : Math.abs(c) < 0.001 ? "fig.f.lineaire" : "fig.f.elliptique");
  }
  sth.oninput = draw; draw();
})();

/* ---------- the system described: an atom small against the wavelength ---------- */
(() => {
  const ka = 2 * Math.PI * 0.1e-9 / 589e-9;
  $("sys1").innerHTML = t("sys1.body", { ka: F.sci(ka, 2), ka2: F.sci(ka * ka, 2) });
  $("sys2").innerHTML = t("sys2.body");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["zeeman", 1896, "experiment"], ["nobel", 1902, "idea"], ["mot", 1987, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["piege"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["axe", "b"], ["bas", "d"], ["quatrevingtdix", "a"], ["parite", "c"], ["somme", "b"], ["taille", "a"], ["conservation", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1801 });
})();
</script>
