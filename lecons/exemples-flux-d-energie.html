<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux, c = Constantes.c, SOLEIL = 1361;                    // W·m⁻², total solar irradiance at 1 au (Kopp and Lean 2011)

/* ---------- le système décrit : la lumière du Soleil ---------- */
(() => {
  const o = OM.ondePlaneFlux(SOLEIL);
  $("sys1").innerHTML = t("sys1.body", { S: F.si(SOLEIL, "W·m⁻²", { sig: 4 }), E: F.si(o.Eeff, "V·m⁻¹"), B: F.si(o.Beff, "T", { prefix: "µ" }), u: F.si(o.u, "J·m⁻³", { prefix: "µ" }) });
})();

/* ---------- quatre cartes du vecteur de Poynting ---------- */
(() => {
  const svg = $("carte"), sx = $("sx"), seg = $("mode");
  const CAP = { a: 0.05, h: 1e-3, V: 100, I: 0.01 };                          // plates of 5 cm radius, 1 mm apart, 100 V, 10 mA
  const FIL = { I: 10, a: 0.5e-3, rho: 1e-6, longueur: 1 };                    // 10 A in a wire 1 mm across, 1 m long
  const AIM = { q: 1e-8, m: 1 };                                               // 10 nC beside a magnet of 1 A·m², in vacuum
  /* each mode: the slider's value from its position s ∈ [0, 100], the drawing, and three stats */
  const MODES = {
    onde: { pre: "fig.onde.", def: 75, val: s => 10 ** (s / 25), out: v => F.si(v, "V·m⁻¹"), draw: onde },
    condensateur: { pre: "fig.condensateur.", def: 70, val: s => 0.05 + 0.95 * s / 100, out: v => F.qty(F.num(100 * v, 2), "%"), draw: condensateur },
    fil: { pre: "fig.fil.", def: 25, val: s => 0.1 + 4.9 * s / 100, out: v => F.si(v * FIL.a, "m", { prefix: "m" }), draw: fil },
    aimant: { pre: "fig.aimant.", def: 40, val: s => 0.02 + 0.08 * s / 100, out: v => F.qty(F.num(100 * v, 2), "cm"), draw: aimant },
  };
  let mode = "onde";
  const fl = (A, B, cls) => Plot.fleche(svg, A, B, { cls, tete: 7 });
  const stat = (i, v, f) => { $("v" + i).textContent = v; $("f" + i).textContent = f || ""; };

  function onde(E0) {
    const lam = 280, x0 = 40, x1 = 600, y0 = 120;
    Plot.el("line", { x1: x0, x2: x1, y1: y0, y2: y0, class: "stroke thin c-label-2" }, svg);
    for (let x = x0 + 10; x < x1; x += 20) {
      const cs = Math.cos(2 * Math.PI * (x - x0) / lam);
      fl([x, y0], [x, y0 - 80 * cs], "c-tint");
      fl([x - 12 * cs * cs, 250], [x + 12 * cs * cs, 250], "c-warn");
    }
    const w = OM.ondeMixte({ E0, lambda: 5e-7 });
    stat(1, F.si(w.SMoy, "W·m⁻²"), t("fig.f.soleil", { k: F.num(w.SMoy / SOLEIL, 2) }));
    stat(2, F.si(w.uMoy, "J·m⁻³"), t("fig.f.cu", { v: F.si(c * w.uMoy, "W·m⁻²") }));
    stat(3, F.si(E0 / c, "T"));
  }

  function condensateur(x) {
    const X = 320, A = 260, yt = 90, yb = 210;                                 // plates of radius a drawn 260 px, gap 120 px
    for (const y of [yt - 8, yb]) Plot.el("rect", { x: X - A, y, width: 2 * A, height: 8, class: "fill c-label-2" }, svg);
    Plot.el("line", { x1: X, x2: X, y1: 10, y2: yt - 8, class: "stroke bold c-label-2" }, svg);
    Plot.el("line", { x1: X, x2: X, y1: yb + 8, y2: 290, class: "stroke bold c-label-2" }, svg);
    for (let k = -4; k <= 4; k++) if (k) fl([X + k * 60, yb - 6], [X + k * 60, yt + 6], "c-tint");
    for (const y of [120, 150, 180]) for (const sgn of [-1, 1]) for (const r of [0.25, 0.5, 0.75, 1]) {
      const px = X + sgn * A * r;                                              // at radius r, toward the axis, length ∝ S ∝ r
      fl([px, y], [px - sgn * 40 * r, y], "c-warn");
    }
    for (const sgn of [-1, 1]) Plot.el("line", { x1: X + sgn * A * x, x2: X + sgn * A * x, y1: yt, y2: yb, class: "stroke dash c-label" }, svg);
    const f = OM.condensateurFlux(Object.assign({ r: CAP.a * x }, CAP));
    stat(1, F.si(f.cote, "W"), t("fig.f.S", { v: F.si(f.S, "W·m⁻²") }));
    stat(2, F.si(f.dUdt, "W"), t("fig.f.part", { v: F.qty(F.num(100 * f.dUdt / f.dUdtTotal, 3), "%") }));
    stat(3, F.si(f.puissance, "W"), t("fig.f.U", { v: F.si(f.U, "J", { prefix: "n" }) }));
  }

  function fil(x) {
    const yc = 150, A = 20, x0 = 30, x1 = 610;                                 // wire radius a drawn 20 px
    Plot.el("rect", { x: x0, y: yc - A, width: x1 - x0, height: 2 * A, class: "stroke c-label-2" }, svg);
    for (let px = 60; px < x1; px += 110) fl([px, yc], [px + 40, yc], "c-tint");
    const w = MagInd.poyntingFil(FIL);
    for (let px = 115; px < x1; px += 110) for (const r of [0.6, 2, 3.5, 5]) for (const sgn of [-1, 1]) {
      const len = r < 1 ? 0.8 * r * A : 16, y = yc + sgn * r * A;              // the direction of S, toward the axis
      fl([px, y], [px, y - sgn * len], "c-warn");
    }
    for (const sgn of [-1, 1]) Plot.el("line", { x1: x0, x2: x1, y1: yc + sgn * A * x, y2: yc + sgn * A * x, class: "stroke dash c-label" }, svg);
    stat(1, F.si(w.entrant(x * FIL.a), "W"), t("fig.f.S", { v: F.si(w.S(x * FIL.a), "W·m⁻²") }));
    stat(2, F.si(w.joule(x * FIL.a), "W"), t("fig.f.E", { v: F.si(w.E, "V·m⁻¹") }));
    stat(3, F.si(w.R * FIL.I * FIL.I, "W"), t("fig.f.R", { v: F.si(w.R, "Ω") }));
  }

  function aimant(d) {
    const sc = 3000, X0 = 200, Y0 = 150, ch = OM.chargeAimant(Object.assign({ d }, AIM));   // 1 cm = 30 px
    const P = (x, y) => [X0 + sc * x, Y0 - sc * y];
    const pts = [];
    for (let px = 20; px <= 620; px += 30) for (let py = 15; py <= 285; py += 30) {
      const x = (px - X0) / sc, y = (Y0 - py) / sc;
      if (Math.hypot(x, y) < 0.006 || Math.hypot(x - d, y) < 0.006) continue;
      const s = ch.plan(x, y), n = Math.hypot(s[0], s[1]);
      if (n > 0) pts.push([px, py, s[0] / n, s[1] / n, Math.log10(n)]);
    }
    const lo = Math.min(...pts.map(p => p[4])), hi = Math.max(...pts.map(p => p[4]));
    for (const [px, py, ux, uy, l] of pts) { const len = 6 + 18 * (l - lo) / (hi - lo || 1); fl([px - ux * len / 2, py + uy * len / 2], [px + ux * len / 2, py - uy * len / 2], "c-warn"); }
    Plot.el("rect", { x: X0 - 9, y: Y0 - 9, width: 18, height: 18, class: "fill c-label-2" }, svg);
    const [qx, qy] = P(d, 0);
    Plot.el("circle", { cx: qx, cy: qy, r: 7, class: "fill c-tint" }, svg);
    const mid = ch.S([d / 2, 0, 0]), f = ch.fluxSphere([0, 0, 0], d / 2, 40);
    stat(1, F.si(Math.hypot(...mid), "W·m⁻²"), t("fig.f.soleil", { k: F.sci(Math.hypot(...mid) / SOLEIL, 2) }));
    stat(2, F.sci(Math.abs(f.net) / f.absolu, 1), t("fig.f.abs", { v: F.si(f.absolu, "W") }));
    stat(3, F.qty(F.sci(ch.Lz, 2), "kg·m²·s⁻¹"));
  }

  function draw() {
    const M = MODES[mode], v = M.val(+sx.value);
    svg.innerHTML = "";
    M.draw(v);
    $("sxl").textContent = t(M.pre + "x"); $("sxr").textContent = M.out(v);
    for (const i of [1, 2, 3]) $("k" + i).innerHTML = t(M.pre + "k" + i);
    $("cap").innerHTML = t(M.pre + "cap");
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { mode = b.dataset.m; sx.value = MODES[mode].def; draw(); });
  sx.oninput = draw; sx.value = MODES[mode].def; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["poynting", 1884, "idea"], ["hertz", 1888, "experiment"], ["tsi", 2011, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["coax", "solaire"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["lumiere", "b"], ["moyenne", "d"], ["condo", "a"], ["fils", "c"], ["fil", "b"], ["statique", "a"], ["aimant", "d"], ["soleil", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 275 });
})();
</script>
