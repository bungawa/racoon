<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, B = ChimSolutions.Binaires;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- courbe de refroidissement et diagramme bismuth-cadmium ---------- */
(() => {
  const A = "Bi", Bb = "Cd", PW = 2.5, CP = 30, TT = [330, 620], E = B.eutectique(A, Bb), sx = $("arx"), st = $("art");
  const cr = Plot.axes($("cr"), { fmt: F, w: 640, h: 300, pad: { b: 44, l: 60 }, x: { domain: [0, 150], label: t("cr.x") }, y: { domain: TT, label: t("cr.y") } });
  const dg = Plot.axes($("dg"), { fmt: F, w: 640, h: 300, pad: { b: 44, l: 60 }, x: { domain: [0, 1], label: t("dg.x"), fmt: v => F.num(v, 2) }, y: { domain: TT, label: t("cr.y") } });
  const c = B.courbesSL(A, Bb, 120);
  P("path", { d: Plot.path(c.a.concat(c.b).map(([xa, T]) => [dg.x(1 - xa), dg.y(T)])), class: "stroke c-tint" }, dg.g);
  P("path", { d: Plot.path([[dg.x(0), dg.y(E.T)], [dg.x(1), dg.y(E.T)]]), class: "stroke thin c-tint" }, dg.g);
  const verticale = P("path", { class: "stroke thin dash c-label-2" }, dg.g), conode = P("path", { class: "stroke thin dash c-warn" }, dg.g), dot = P("circle", { r: 6, class: "dot" }, dg.g);
  const courbe = P("path", { class: "stroke c-tint" }, cr.g), repL = P("path", { class: "stroke thin dash c-warn" }, cr.g), repE = P("path", { class: "stroke thin dash c-warn" }, cr.g);
  const cur = P("circle", { r: 6, class: "dot" }, cr.g);
  const DOM = textOf("ar.dom", ["L", "L+a", "L+b", "a+b", "a", "b", "E"]);
  const PHI = { L: 1, "L+a": 2, "L+b": 2, "a+b": 2, a: 1, b: 1, E: 3 };
  let r;
  const calc = () => { const xb = +sx.value / 1000; r = B.refroidissement(A, Bb, 1 - xb, { P: PW, cp: CP, T0: 600, T1: 340, n: 600 }); return xb; };
  function upd(recalc) {
    const xb = recalc ? calc() : +sx.value / 1000, min = s => s / 60;
    if (recalc) {
      courbe.setAttribute("d", Plot.path(r.t.map((ti, i) => [cr.x(Math.min(min(ti), 150)), cr.y(r.T[i])])));
      repL.setAttribute("d", Plot.path([[cr.x(0), cr.y(r.TL)], [cr.x(150), cr.y(r.TL)]]));
      repE.setAttribute("d", Plot.path([[cr.x(0), cr.y(r.TE)], [cr.x(150), cr.y(r.TE)]]));
      verticale.setAttribute("d", Plot.path([[dg.x(xb), dg.y(TT[0])], [dg.x(xb), dg.y(TT[1])]]));
    }
    const k = Math.round(+st.value / 1000 * (r.t.length - 1)), ti = r.t[k], T = r.T[k], fL = r.fL[k];
    cur.setAttribute("cx", cr.x(Math.min(min(ti), 150))); cur.setAttribute("cy", cr.y(T));
    dot.setAttribute("cx", dg.x(xb)); dot.setAttribute("cy", dg.y(T));
    const surPalier = ti > r.palier[0] + 1e-6 && ti < r.palier[1] - 1e-6;
    const e = B.etatSL(A, Bb, 1 - xb, T + (surPalier ? 1e-9 : 0)), dom = surPalier ? (xb === 0 || xb === 1 ? (xb === 0 ? "L+a" : "L+b") : "E") : e.domaine;
    if ((dom === "L+a" || dom === "L+b") && e.xL !== null && !surPalier) conode.setAttribute("d", Plot.path([[dg.x(dom === "L+a" ? 0 : 1), dg.y(T)], [dg.x(1 - e.xL), dg.y(T)]]));
    else conode.setAttribute("d", "");
    $("artv").textContent = t("ar.tread", { t: F.num(min(ti), 3) }); $("arxv").textContent = F.fix(xb, 3);
    $("arT").innerHTML = F.kelvin(T); $("arTf").textContent = DOM[dom];
    $("arfl").textContent = F.qty(F.num(100 * fL, 3), "%");
    $("arflf").textContent = dom === "L+a" || dom === "L+b" ? t("ar.f.xl", { x: F.fix(1 - e.xL, 3) }) : dom === "E" ? t("ar.f.e", { x: F.fix(1 - E.x, 3) }) : "–";
    const pur = xb === 0 || xb === 1, cc = pur ? 1 : 2, phi = surPalier && pur ? 2 : PHI[dom];
    $("arv").textContent = String(cc + 1 - phi); $("arvf").textContent = t("ar.f.v", { c: cc, phi });
    $("arp").innerHTML = F.kelvin(r.TE); $("arpf").textContent = t("ar.f.palier", { d: F.num(min(r.palier[1] - r.palier[0]), 3), L: pur ? "–" : F.num(r.TL, 4) });
  }
  sx.oninput = () => upd(true); st.oninput = () => upd(false);
  const go = xb => { sx.value = Math.round(1000 * xb); upd(true); };
  $("b-pur").onclick = () => go(0); $("b-eut").onclick = () => go(1 - E.x); $("b-hypo").onclick = () => go(0.3);
  upd(true);
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lechatelier", 1886, "experiment"], ["tammann", 1903, "experiment"], ["watson", 1964, "experiment"], ["moon", 2000, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["calorimetrie", "etain", "soudure"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pente", "b"], ["palier", "d"], ["pur", "a"], ["moments", "c"], ["duree", "b"], ["construire", "a"], ["surfusion", "d"], ["alliage", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
