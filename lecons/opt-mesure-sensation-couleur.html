<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, nm = x => x * 1e-9;
const rgb = c => "rgb(" + c.map(v => Math.round(255 * O.gammaSRGB(v))).join(" ") + ")";

/* ---------- égalisation d'une raie par les trois primaires de la CIE, (35.4) ---------- */
(() => {
  const svg = $("egal"), W = 640, H = 300, XP = 440, P = Plot.el, M = O.PRIMAIRES_1931.M;
  const ls = $("lsl"), cs = ["rsl", "gsl", "bsl"].map($), NOMS = ["r", "g", "b"], CLS = ["c-ko", "c-ok", "c-tint"];
  const col = j => M.map(r => r[j]), add = (u, v, k) => u.map((x, i) => x + k * v[i]);
  const lam = Array.from({ length: 81 }, (_, k) => 380 + 5 * k), courbes = lam.map(l => O.rgb1931(nm(l)));
  function draw() {
    svg.innerHTML = "";
    const l = +ls.value, test = O.cmf(nm(l)), sol = O.rgb1931(nm(l)), c = cs.map(s => +s.value);
    const ax = Plot.axes(svg, { fmt: F, w: W, h: H, pad: { r: W - XP }, x: { domain: [380, 780], label: t("eg.ax.x") }, y: { domain: [-0.1, 0.4], label: t("eg.ax.y") } });
    P("line", { x1: ax.x(380), x2: ax.x(780), y1: ax.y(0), y2: ax.y(0), class: "stroke thin c-label-2" }, svg);
    [0, 1, 2].forEach(j => P("path", { d: Plot.path(lam.map((x, k) => [ax.x(x), ax.y(courbes[k][j])])), class: "stroke " + CLS[j] }, svg));
    P("line", { x1: ax.x(l), x2: ax.x(l), y1: ax.y(-0.1), y2: ax.y(0.4), class: "stroke thin dash c-warn" }, svg);
    /* deux demi-champs : à gauche la raie, plus les primaires de quantité négative ; à droite les primaires positives */
    const side = (q, base) => q.reduce((s, x, j) => add(s, col(j), Math.abs(x)), base);
    const gauche = side(c.map(x => Math.min(0, x)), test), droite = side(c.map(x => Math.max(0, x)), [0, 0, 0]);
    const ref = O.versSRGB(side(sol.map(x => Math.min(0, x)), test)).map(v => Math.max(0, v)), k = 0.95 / Math.max(...ref);
    const show = xyz => rgb(O.versSRGB(xyz).map(v => Math.max(0, v * k)));
    const cx = XP + 100, cy = 135, R = 78;
    P("path", { d: `M${cx} ${cy - R} A${R} ${R} 0 0 0 ${cx} ${cy + R} Z`, fill: show(gauche) }, svg);
    P("path", { d: `M${cx} ${cy - R} A${R} ${R} 0 0 1 ${cx} ${cy + R} Z`, fill: show(droite) }, svg);
    P("circle", { cx, cy, r: R, class: "stroke thin c-label-2" }, svg);
    P("text", { x: cx - R / 2, y: cy + R + 20, "text-anchor": "middle", class: "tick" }, svg).textContent = t("eg.gauche");
    P("text", { x: cx + R / 2, y: cy + R + 20, "text-anchor": "middle", class: "tick" }, svg).textContent = t("eg.droite");
    const ecart = Math.hypot(...sol.map((x, j) => x - c[j])) / Math.hypot(...sol);            // gauche − droite, en quantités de primaires
    $("lread").textContent = F.si(nm(l), "m", { prefix: "n", sig: 4 });
    cs.forEach((s, j) => { $(NOMS[j] + "read").textContent = F.num(c[j], 3); });
    $("vq").textContent = sol.map(x => F.num(x, 2)).join(" ; ");
    $("fq").textContent = t(sol.some(x => x < -5e-4) ? "eg.f.neg" : "eg.f.pos");
    $("ve").textContent = F.qty(F.num(100 * ecart, 2), "%");
    $("fe").textContent = t(ecart < 0.02 ? "eg.f.egal" : "eg.f.diff");
    const negs = NOMS.filter((_, j) => c[j] < 0).map(n => t("eg.nom." + n));
    $("vt").textContent = negs.length ? negs.join(", ") : t("eg.rien");
    $("ft").textContent = t(negs.length ? "eg.f.ajout" : "eg.f.seule");
  }
  ls.oninput = draw; cs.forEach(s => s.oninput = draw);
  $("sol").onclick = () => { O.rgb1931(nm(+ls.value)).forEach((x, j) => { cs[j].value = x.toFixed(3); }); draw(); };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["young", 1802, "idea"], ["grassmann", 1853, "idea"], ["maxwell", 1860, "experiment"], ["wright", 1928, "experiment"], ["cie", 1931, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ecran", "observateur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["zero", "b"], ["metamere", "d"], ["grassmann", "a"], ["negatif", "c"], ["vecteur", "b"], ["nuit", "a"], ["ecran", "d"], ["cinq", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 353 });
})();
</script>
