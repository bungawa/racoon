          <div class="ctl"><div class="row"><label for="vsl" data-i18n="pl.v0"></label><output id="vread" for="vsl"></output></div>

          <div class="ctl"><div class="row"><label for="dsl" data-i18n="pl.d"></label><output id="dread" for="dsl"></output></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/constantes.js"></script>
<script src="/racoon/fluides.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹", PAS = "Pa·s", M2S = "m²·s⁻¹";
const etat = (f, T) => f === "eau" ? Fluides.eau(T) : Fluides.air(T, Fluides.ISO2533.p0);

/* ---------- plaques : profil linéaire, contrainte, nombre de Reynolds ; courbe η(T) ---------- */
(() => {
  let fluid = "eau";
  const svg = $("plaques"), chart = $("etachart"), P = Plot.el;
  const tsl = $("tsl"), vsl = $("vsl"), dsl = $("dsl");
  function drawPlates() {
    svg.innerHTML = "";
    const X0 = 60, X1 = 600, Y0 = 190, Y1 = 50, N = 7;
    P("rect", { x: X0, y: Y0, width: X1 - X0, height: 12, class: "fill c-label-2" }, svg);
    P("rect", { x: X0, y: Y1 - 12, width: X1 - X0, height: 12, class: "fill c-label-2" }, svg);
    Plot.fleche(svg, [X1 - 120, Y1 - 24], [X1 - 20, Y1 - 24], { cls: "c-label", tete: 9 });
    const lab = P("text", { x: X1 - 120, y: Y1 - 30 }, svg); lab.textContent = "v₀";
    for (let i = 0; i <= N; i++) {
      const y = Y0 - (Y0 - Y1) * i / N, L = 240 * i / N;
      Plot.fleche(svg, [150, y], [150 + L, y], { cls: "c-tint", tete: 8, min: 2 });
    }
    P("line", { x1: 150, y1: Y0, x2: 390, y2: Y1, class: "stroke thin dash c-tint" }, svg);
    const ld = P("text", { x: 70, y: (Y0 + Y1) / 2 + 4 }, svg); ld.textContent = "d";
    P("line", { x1: 92, y1: Y0, x2: 92, y2: Y1, class: "stroke thin c-label-2" }, svg);
  }
  function drawChart(T) {
    chart.innerHTML = "";
    const { x, y, g } = Plot.axes(chart, { fmt: F, w: 640, h: 280,
      x: { domain: Fluides.EAU_T, label: t("ch.x") }, y: { scale: "log", domain: [1e-5, 1e-2], label: t("ch.y") } });
    const curve = (f, cls) => {
      const pts = []; for (let i = 0; i <= 80; i++) { const TT = Fluides.EAU_T[0] + i * (Fluides.EAU_T[1] - Fluides.EAU_T[0]) / 80; pts.push([x(TT), y(etat(f, TT).eta)]); }
      P("path", { d: Plot.path(pts), class: cls }, g);
    };
    curve("eau", "curve"); curve("air", "stroke c-warn");
    P("circle", { cx: x(T), cy: y(etat(fluid, T).eta), r: 6, class: "dot" }, g);
  }
  function draw() {
    const T = +tsl.value, v0 = Math.pow(10, +vsl.value), d = Math.pow(10, +dsl.value), s = etat(fluid, T);
    const tau = Fluides.cisaillement(s.eta, v0, d), re = Fluides.reynolds(v0, d, s.nu);
    $("tread").innerHTML = F.kelvin(T); $("vread").textContent = F.si(v0, MS); $("dread").textContent = F.si(d, "m");
    $("veta").textContent = F.qty(F.sci(s.eta, 3), PAS); $("fnu").textContent = t("pl.f.nu", { nu: F.qty(F.sci(s.nu, 3), M2S) });
    $("vtau").textContent = F.si(tau, "Pa"); $("fforce").textContent = t("pl.f.force", { f: F.si(tau, "N") });
    $("vre").textContent = F.num(re, 3);
    $("fre").textContent = t(re < Fluides.RE_COUETTE ? "pl.f.laminaire" : "pl.f.turbulent", { s: F.num(Fluides.RE_COUETTE, 4) });
    drawChart(T);
  }
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { fluid = b.dataset.f;
    document.querySelectorAll("[data-f]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  tsl.oninput = vsl.oninput = dsl.oninput = draw;
  drawPlates(); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1687, "idea"], ["maxwell", 1860, "idea"], ["maxwell66", 1866, "experiment"], ["couette", 1890, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rheometre", "coussin"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["paroi", "a"], ["epaisseur", "b"], ["pression", "c"], ["chauffe", "d"], ["nu", "a"], ["couette", "b"], ["rotation", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 411 });
})();
</script>
