<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
const pct = e => F.qty(F.num(100 * e, 2), "%");

/* ---------- |E| of a rod of length L at the distance r = uL from its axis, at the abscissa sL from its middle ---------- */
(() => {
  const svg = $("fil"), dsl = $("dsl"), psl = $("psl"), L = 1, lam = 1e-9, E0 = 2 * ES.K * lam / L;   // (5.2) at r = L
  const U = i => Math.pow(10, -2 + 3 * i / 120), YD = [1e-3, 1e2];
  const rod = (u, s) => { const e = ES.baguetteExacte(lam * L, L, [s * L, u * L]).E; return { n: Math.hypot(e[0], e[1]) / E0, e }; };
  const clip = v => Math.min(YD[1], Math.max(YD[0], v));
  function draw() {
    const u = U(+dsl.value), s = +psl.value / 20;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { b: 44 }, x: { scale: "log", domain: [0.01, 10], label: t("fi.x") }, y: { scale: "log", domain: YD, label: t("fi.y") } });
    const us = Array.from({ length: 241 }, (_, i) => Math.pow(10, -2 + 3 * i / 240));
    const curve = (f, cls, k) => Plot.el("path", { d: Plot.path(us.filter(v => f(v) <= YD[1]).map(v => [x(v), y(clip(f(v)))])), class: k }, Plot.el("g", { class: cls }, g));
    curve(v => 1 / (2 * v * v), "c-label-2", "stroke dash");
    curve(v => 1 / v, "c-ok", "stroke");
    curve(v => rod(v, s).n, "c-tint", "stroke");
    const here = rod(u, s), gw = Plot.el("g", { class: "c-warn" }, g);
    Plot.el("circle", { cx: x(u), cy: y(clip(here.n)), r: 5, class: "fill" }, gw);
    const rc2 = (u * u + s * s) * L * L, point = ES.K * lam * L / rc2 / E0;
    $("dread").textContent = F.num(u, 2) + " L";
    $("pread").textContent = F.num(s, 2) + " L";
    $("vligne").textContent = F.num(here.n * u, 3);
    $("vangle").textContent = F.qty(F.num(Math.atan2(Math.abs(here.e[0]), Math.abs(here.e[1])) * 180 / Math.PI, 2), "°");
    $("vpoint").textContent = F.num(here.n / point, 3);
  }
  dsl.oninput = draw; psl.oninput = draw; draw();
})();

/* ---------- le système décrit : un tube compteur de Geiger–Müller ---------- */
(() => {
  const U = 500, a = 25e-6, b = 0.01, L = 0.1, c = ES.coaxial(U, a, b);
  const gap = 1 - ES.filFini(c.lambda, L, b) / ES.champFil(c.lambda, b);
  $("sys").innerHTML = t("sys.body", { lam: F.si(c.lambda, "C·m⁻¹"), ea: F.si(c.champ(a), "V·m⁻¹"), eb: F.si(c.champ(b), "V·m⁻¹"), err: pct(gap) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["heaviside", 1880, "idea"], ["cottrell", 1908, "use"], ["geiger", 1928, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["electrofiltre", "compteur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["loi", "b"], ["double", "a"], ["symetrie", "d"], ["bouchons", "c"], ["fini", "a"], ["bout", "b"], ["geiger", "d"], ["loin", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 52 });
})();
</script>
