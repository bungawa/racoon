<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd;

/* ---------- l'anneau de Thomson, sans noyau : force moyenne contre poids, selon la hauteur, le métal, la fréquence ---------- */
(() => {
  /* coil: 400 turns, radius 3 cm, 20 A rms; ring: radius 3,5 cm, round wire of radius 3 mm. Densities (kg·m⁻³): see the footer. */
  const METAUX = { aluminium: { rho: M.RESISTIVITES.aluminium, masse: 2700 }, cuivre: { rho: M.RESISTIVITES.cuivre, masse: 8940 } };
  const base = { N: 400, I1: 20, R1: 0.03, R2: 0.035, a: 0.003 }, svg = $("saut"), sz = $("sz"), sf = $("sf"), seg = $("metal");
  let metal = "aluminium";
  function draw() {
    const z = +sz.value / 1000, f = +sf.value, coupe = metal === "coupe", m = METAUX[coupe ? "aluminium" : metal];
    const at = zz => M.anneauSauteur(Object.assign({ z: zz, f }, m, base)), r = at(z);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 60, b: 44 }, x: { domain: [0, 50], label: t("fig.xaxis") }, y: { scale: "log", domain: [0.01, 100], label: t("fig.yaxis") } });
    if (!coupe) { const zs = Array.from({ length: 97 }, (_, i) => 2 + i / 2);
      Plot.el("path", { d: Plot.path(zs.map(x => [P.x(x), P.y(Math.max(0.01, at(x / 1000).F))])), class: "curve" }, P.g);
      Plot.el("circle", { cx: P.x(z * 1000), cy: P.y(Math.max(0.01, r.F)), r: 5, class: "dot" }, P.g); }
    Plot.el("line", { x1: P.x(0), x2: P.x(50), y1: P.y(r.poids), y2: P.y(r.poids), class: "ref" }, P.g);
    $("szr").textContent = F.si(z, "m", { prefix: "m" });
    $("sfr").textContent = F.si(f, "Hz");
    $("vf").textContent = coupe ? t("fig.zero") : F.si(r.F, "N");
    $("ff").textContent = coupe ? t("fig.f.coupe", { p: F.si(r.poids, "N") }) : t(r.saute ? "fig.f.saute" : "fig.f.reste", { p: F.si(r.poids, "N"), x: F.num(r.F / r.poids, 2) });
    $("vphi").textContent = coupe ? t("fig.sans") : F.qty(F.num(r.phi * 180 / Math.PI, 3), "°");
    $("fphi").textContent = coupe ? t("fig.f.sans") : t("fig.f.phi", { x: F.num(r.wLsurR, 2), s: F.si(r.Fsupra, "N") });
    $("vi").textContent = coupe ? F.si(0, "A") : F.si(r.I2eff, "A");
    $("fi").textContent = coupe ? t("fig.f.sans") : t("fig.f.i", { q: F.si(r.chaleur, "W") });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === metal)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { metal = x.dataset.m; draw(); });
  sz.oninput = sf.oninput = draw; draw();
})();

/* ---------- couple d'un anneau dans un champ tournant, selon sa vitesse ; la résistance déplace le maximum ---------- */
(() => {
  /* field 3B0/2 = 15 mT turning at 50 Hz; ring of radius 3 cm, aluminium wire of radius 3 mm, its resistance scaled */
  const w = 2 * Math.PI * 50, S = Math.PI * 0.03 ** 2, Phi0 = 0.015 * S, L = M.inductanceAnneau(0.03, 0.003);
  const R0 = M.RESISTIVITES.aluminium * 2 * Math.PI * 0.03 / (Math.PI * 0.003 ** 2), svg = $("couple"), sr = $("sr");
  function draw() {
    const R = R0 * Math.pow(10, +sr.value), C = x => M.coupleAsynchrone({ Phi0, R, L, omegaG: w * (1 - x) });
    const ref = M.coupleAsynchrone({ Phi0, R, L, omegaG: 1 }).Cmax;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 60, b: 44 }, x: { domain: [-0.5, 1.5], label: t("cg.xaxis") }, y: { domain: [-1.05, 1.05], label: t("cg.yaxis") } });
    const xs = Array.from({ length: 401 }, (_, i) => -0.5 + i / 200);
    Plot.el("path", { d: Plot.path(xs.map(x => [P.x(x), P.y(C(x).C / ref)])), class: "curve" }, P.g);
    Plot.el("line", { x1: P.x(-0.5), x2: P.x(1.5), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("line", { x1: P.x(1), x2: P.x(1), y1: P.y(-1.05), y2: P.y(1.05), class: "ref" }, P.g);
    const xm = 1 - R / L / w;
    if (xm >= -0.5) Plot.el("circle", { cx: P.x(xm), cy: P.y(1), r: 5, class: "dot" }, P.g);
    $("srr").textContent = F.si(R, "Ω");
    $("vmax").textContent = F.si(ref, "N·m");
    $("fmax").textContent = t("cg.f.max", { x: F.num(xm, 2) });
    $("vdem").textContent = F.si(C(0).C, "N·m");
    $("fdem").textContent = t("cg.f.dem", { r: F.num(R / (L * w), 2) });
  }
  sr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["arago", 1824, "experiment"], ["foucault", 1855, "experiment"], ["thomson", 1887, "experiment"], ["ferraris", 1888, "use"], ["meissner", 1933, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["frein"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["coupe", "b"], ["dephasage", "d"], ["supra", "a"], ["fentes", "c"], ["tournant", "b"], ["inverse", "a"], ["synchrone", "d"], ["metal", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 163 });
})();
</script>
