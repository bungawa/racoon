<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, C = Constantes.c, W = f => 2 * Math.PI * f;

/* ---------- le système décrit : le cuivre à 50 Hz et à 10 GHz, l'eau de mer à 10 kHz ---------- */
(() => {
  const Cu = M.drude("cuivre"), mer = 4.8;                                // sea water, S·m⁻¹
  $("sys1").innerHTML = t("sys1.body", { d50: F.si(M.peau(Cu.sigma, W(50)), "m", { prefix: "m" }), d10: F.si(M.peau(Cu.sigma, W(1e10)), "m", { prefix: "µ" }),
    wt: F.sci(W(1e10) * Cu.tau, 1), ws: F.sci(W(1e10) / Cu.sigmaSurEps0, 1), dmer: F.si(M.peau(mer, W(1e4)), "m"), wm: F.sci(W(1e4) * 80 * Constantes.eps0 / mer, 1) });
})();

/* ---------- l'onde dans le métal et la longueur sur laquelle elle s'éteint ---------- */
(() => {
  const prof = $("profil"), lon = $("longueur"), sf = $("sf"), seg = $("metal");
  let metal = "cuivre";
  function draw() {
    const d = M.drude(metal), f = 10 ** +sf.value, w = W(f), p = M.penetration(w, metal), o = M.ondeDansMetal(w, metal);
    /* top: Re E(z, t)/E0 at four instants over the first five attenuation lengths, z in units of that length */
    prof.innerHTML = "";
    const L = isFinite(p.exacte) ? p.exacte : 1, zmax = 5;
    const P = Plot.axes(prof, { fmt: F, w: 640, h: 200, pad: { l: 56, b: 44 }, x: { domain: [0, zmax], label: t("fig.xaxis.z") }, y: { domain: [-1.05, 1.05], label: t("fig.yaxis.e") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(zmax), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const zs = Array.from({ length: 401 }, (_, i) => zmax * i / 400);
    for (const s of [1, -1]) Plot.el("path", { d: Plot.path(zs.map(z => [P.x(z), P.y(s * o.enveloppe(z * L))])), class: "stroke thin dash c-label-2" }, P.g);
    for (const ph of [0, 0.25, 0.5, 0.75]) Plot.el("path", { d: Plot.path(zs.map(z => [P.x(z), P.y(o.champ(z * L, ph / f))])), class: ph ? "stroke thin c-tint" : "stroke bold c-tint" }, P.g);
    /* bottom: attenuation length against frequency */
    lon.innerHTML = "";
    const Q = Plot.axes(lon, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { scale: "log", domain: [1, 1e17], label: t("fig.xaxis.f") }, y: { scale: "log", domain: [1e-9, 1], label: t("fig.yaxis.l") } });
    const ls = Array.from({ length: 341 }, (_, i) => i * 0.05), cl = v => Math.min(1, Math.max(1e-9, v));
    const ex = ls.map(l => [10 ** l, M.penetration(W(10 ** l), metal)]);
    Plot.el("path", { d: Plot.path(ex.map(([F0, x]) => [Q.x(F0), Q.y(cl(x.exacte))])), class: "stroke bold c-tint" }, Q.g);
    Plot.el("path", { d: Plot.path(ex.map(([F0, x]) => [Q.x(F0), Q.y(cl(x.basseFrequence))])), class: "stroke dash c-warn" }, Q.g);
    Plot.el("line", { x1: Q.x(1), x2: Q.x(1e17), y1: Q.y(C / d.wp), y2: Q.y(C / d.wp), class: "stroke thin dash c-label-2" }, Q.g);
    for (const fm of [d.ftau, d.fp]) Plot.el("line", { x1: Q.x(fm), x2: Q.x(fm), y1: Q.y(1e-9), y2: Q.y(1), class: "stroke thin dash c-label-2" }, Q.g);
    Plot.el("circle", { cx: Q.x(f), cy: Q.y(cl(p.exacte)), r: 5, class: "dot" }, Q.g);
    $("sfr").textContent = F.si(f, "Hz");
    $("vex").textContent = isFinite(p.exacte) ? F.si(p.exacte, "m") : "∞";
    $("fex").textContent = t("fig.f.exacte", { wt: F.sci(w * d.tau, 2), wp: F.sci(w / d.wp, 2) });
    $("vpe").textContent = F.si(p.basseFrequence, "m");
    $("fpe").textContent = t("fig.f.peau", { e: Math.abs(p.ecart) < 1e-3 ? F.sci(100 * p.ecart, 2) : F.num(100 * p.ecart, 3) });
    $("vla").textContent = isFinite(o.longueurOnde) ? F.si(o.longueurOnde, "m") : "∞";
    $("fla").textContent = t("fig.f.lambda", { l0: F.si(C / f, "m") });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === metal)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { metal = b.dataset.m; draw(); });
  sf.oninput = draw; draw();
  const d1 = M.domainePeau("cuivre"), d10 = M.domainePeau("cuivre", 0.1);
  $("s2p2").innerHTML = t("s2.p2", { f1: F.si(d1.f, "Hz"), l1: F.si(d1.lambda0, "m", { prefix: "m" }), f10: F.si(d10.f, "Hz"), pl: F.si(C / M.drude("cuivre").wp, "m", { prefix: "n" }) });
})();

/* ---------- les alcalins : longueur d'onde plasma des électrons libres contre le seuil observé par Wood ---------- */
(() => {
  const ALC = [["lithium", null], ["sodium", 210e-9], ["potassium", 315e-9], ["rubidium", null]];
  const txt = textOf("alc.items", ALC.map(a => a[0]));
  $("alcalins").innerHTML = ALC.map(([id, obs]) => {
    const lp = M.drude({ sigma: 1, N: M.METAUX_LIBRES[id].N }).lambdaP;
    const body = t(obs ? "alc.obs" : "alc.calc", { N: F.qty(F.sci(M.METAUX_LIBRES[id].N, 3), "m⁻³"), lp: F.si(lp, "m", { prefix: "n" }), obs: obs && F.si(obs, "m", { prefix: "n" }) });
    return `<div><span class="k">${txt[id]}</span><span>${body}</span></div>`;
  }).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lamb", 1883, "idea"], ["heaviside", 1885, "idea"], ["wood", 1933, "experiment"], ["zener", 1933, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["foucault"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["phase", "c"], ["racine", "a"], ["cavite", "d"], ["domaine", "b"], ["transparent", "a"], ["coincidence", "c"], ["mer", "b"], ["plateau", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 327 });
})();
</script>
