<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>

<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/energie-potentielle-pesanteur.js"></script>

<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/energie.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- le cycle de Feynman : une machine meilleure que la réversible ferait un mouvement perpétuel ---------- */
(() => {
  const M1 = 1, H1 = 1, msl = $("msl"), esl = $("esl");
  const { x, y, g } = Plot.axes($("cchart"), { fmt: F, w: 640, h: 280,
    x: { domain: [50, 120], label: t("cyc.x") }, y: { domain: [-0.5, 0.2], label: t("cyc.y") } });
  Plot.el("rect", { x: x(100), y: y(0.2), width: x(120) - x(100), height: y(0) - y(0.2), class: "area" }, g);
  Plot.el("line", { x1: x(50), x2: x(120), y1: y(0), y2: y(0), class: "zero" }, g);
  Plot.el("path", { d: `M${x(50)} ${y(Energie.cycle(M1, H1, 3, 0.5).gain)}L${x(120)} ${y(Energie.cycle(M1, H1, 3, 1.2).gain)}`, class: "curve" }, g);
  const note = Plot.el("text", { x: x(110), y: y(0.12), "text-anchor": "middle", class: "note" }, g); note.textContent = t("cyc.impossible");
  const dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  function upd() {
    const m2 = +msl.value, eta = esl.value / 100, c = Energie.cycle(M1, H1, m2, eta);
    $("mread").textContent = F.qty(m2, "kg");
    $("eread").textContent = F.qty(esl.value, "%");
    $("vx").textContent = F.si(Energie.lift(M1, H1, m2, 1), "m", { prefix: "" });
    $("vy").textContent = F.si(c.y, "m", { prefix: "" });
    $("vgain").textContent = (c.gain > 0 ? "+" : "") + F.qty(F.fix(c.gain, 2), "m");
    $("fgain").textContent = t(c.perpetuel ? "cyc.f.perpetuel" : Math.abs(c.gain) < 1e-12 ? "cyc.f.rev" : "cyc.f.perte");
    dot.setAttribute("cx", x(eta * 100)); dot.setAttribute("cy", y(c.gain));
  }
  msl.oninput = esl.oninput = upd; upd();
})();

/* ---------- machines simples : moins de force, plus de chemin ---------- */
(() => {
  let kind = "levier";
  const chsl = $("chsl"), rsl = $("rsl");
  function upd() {
    const m = +chsl.value, r = +rsl.value, o = Energie.machine(kind, m, r);
    $("machread").innerHTML = t("mach.law." + kind);
    $("chread").textContent = F.qty(m, "kg");
    $("rread").textContent = t("mach.rread." + kind, { r });
    $("vf").textContent = F.si(o.force, "N");
    $("ff").textContent = t("mach.f.force", { m: F.num(o.force / Energie.G, 3) });
    $("vc").textContent = F.si(o.course, "m", { prefix: "" });
    $("vw").textContent = F.si(o.force * o.course, "J");
  }
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { kind = b.dataset.k;
    document.querySelectorAll("[data-k]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); upd(); });
  chsl.oninput = rsl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["stevin", 1586, "idea"], ["huygens", 1673, "idea"], ["academie", 1775, "use"], ["carnot", 1824, "idea"], ["grandmaison", 1985, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["step", "ascenseur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["meilleure", "a"], ["origine", "a"], ["palan", "a"], ["plan", "a"], ["chemin", "a"], ["step", "a"], ["barre", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 42 });
})();
</script>
