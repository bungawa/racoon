<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, TAU = 2 * Math.PI, DEG = Math.PI / 180;

/* ---------- two antennas on one generator, seen from above; the detector on a circle of radius R ---------- */
(() => {
  const lambda = 1, R = 50, vue = $("vue"), trace = $("trace"), sd = $("sd"), sp = $("sp"), sa = $("sa"), seg = $("mode");
  let mode = "paralleles";
  const sources = (d, ph) => [{ pos: [0, -d / 2, 0], axe: mode === "croisees" ? [0, 1, 0] : [0, 0, 1], phase: 0 }, { pos: [0, d / 2, 0], axe: [0, 0, 1], phase: ph }];
  const at = a => [R * Math.cos(a), R * Math.sin(a), 0];
  function draw() {
    const d = +sd.value, ph = +sp.value * DEG, a = +sa.value * DEG, S = sources(d, ph);
    const one = O.sommeDipoles([S[1]], [R, 0, 0], lambda).max;               // one vertical source, seen broadside, at R
    const x = O.sommeDipoles(S, at(a), lambda);
    /* top view: the two sources, the direction of the detector */
    vue.innerHTML = "";
    const cx = 120, cy = 75, s = 20;
    Plot.el("line", { x1: cx, y1: cy, x2: cx + 480 * Math.cos(a), y2: cy - 480 * Math.sin(a), class: "stroke thin dash c-label-2" }, vue);
    S.forEach((src, i) => {
      const y = cy - s * src.pos[1];
      if (src.axe[2]) Plot.el("circle", { cx, cy: y, r: 6, class: "fill c-tint" }, vue);
      else Plot.el("line", { x1: cx, x2: cx, y1: y - 10, y2: y + 10, class: "stroke bold c-tint" }, vue);
      const e = Plot.el("text", { x: cx - 18, y: y + 5, "text-anchor": "end" }, vue); e.textContent = t("fig.S" + (i + 1));
    });
    const D = [cx + 440 * Math.cos(a), cy - 440 * Math.sin(a)];
    Plot.el("circle", { cx: D[0], cy: D[1], r: 5, class: "fill c-warn" }, vue);
    /* amplitude around the circle, in units of one source */
    trace.innerHTML = "";
    const angs = Array.from({ length: 361 }, (_, i) => -90 + i * 0.5), amp = angs.map(g => O.sommeDipoles(S, at(g * DEG), lambda).max / one);
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 40 }, x: { domain: [-90, 90], label: t("fig.xaxis") }, y: { domain: [0, 2.2], ticks: 4, label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(-90), x2: P.x(90), y1: P.y(1), y2: P.y(1), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(angs.map((g, i) => [P.x(g), P.y(Math.min(2.2, amp[i]))])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(+sa.value), cy: P.y(Math.min(2.2, x.max / one)), r: 5, class: "dot" }, P.g);
    /* stats */
    $("sdr").textContent = F.num(d, 2) + F.NB + "λ";
    $("spr").textContent = F.num(+sp.value, 3) + "°";
    $("sar").textContent = F.num(+sa.value, 3) + "°";
    $("vdelta").textContent = F.num(-x.delta / lambda, 3) + F.NB + "λ";
    $("fdelta").textContent = t("fig.f.delta", { v: F.num(((-x.delta / lambda * 360 + +sp.value) % 360 + 360) % 360, 3) + "°" });
    $("vamp").textContent = F.num(x.max / one, 3);
    $("famp").textContent = t("fig.f.amp");
    const vert = x.axe ? Math.acos(Math.min(1, Math.abs(x.axe[2]))) / DEG : 0;
    $("vpol").textContent = x.max / one < 1e-3 ? t("fig.rien") : F.num(vert, 2) + "°";
    $("fpol").textContent = t("fig.f.pol", { e: F.num(x.mineur, 2) });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
  sd.oninput = sp.oninput = sa.oninput = draw; draw();
})();

/* ---------- the system described: the bench at 3 GHz ---------- */
(() => {
  const f = 3e9, lambda = O.c / f, d = 3 * lambda, R = 3;
  const S = [{ pos: [0, -d / 2, 0], axe: [0, 0, 1] }, { pos: [0, d / 2, 0], axe: [0, 0, 1] }];
  /* the first zero of the in-phase pair, found on the circle of radius R, and what remains there */
  const amp = g => O.sommeDipoles(S, [R * Math.cos(g), R * Math.sin(g), 0], lambda).max;
  let best = { g: 0, a: Infinity };
  for (let g = 0; g < 0.5; g += 1e-5) { const v = amp(g); if (v < best.a) best = { g, a: v }; }
  const lointain = Math.asin(lambda / (2 * d));                          // parallel rays: d sin θ = λ/2
  $("sys1").innerHTML = t("sys1.body", { l: F.qty(F.num(100 * lambda, 3), "cm"), d: F.qty(F.num(100 * d, 3), "cm"), rd: F.num(R / d, 2),
    th: F.num(best.g / DEG, 3) + "°", thl: F.num(lointain / DEG, 3) + "°", res: F.num(100 * best.a / (amp(0) / 2), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["braun", 1905, "experiment"], ["nobel", 1909, "idea"], ["yagi", 1926, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["reseau"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["phase", "b"], ["opposition", "d"], ["preuve", "a"], ["vecteur", "c"], ["demi", "b"], ["onde", "a"], ["tuyau", "c"], ["quadrature", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 284 });
})();
</script>
