<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, D = Math.PI / 180;

/* ---------- a source, then two ideal polaroids: probabilities from amplitudes ---------- */
(() => {
  const svg = $("courbe"), sA = $("sA"), sB = $("sB"), src = $("src");
  let s = "lin";
  const depart = () => s === "lin" ? Q.polarLineaire(0) : [Cx.c(Math.SQRT1_2, 0), Cx.c(0, Math.SQRT1_2)];   // |x⟩ or |R⟩
  function draw() {
    const a = +sA.value * D, b = +sB.value * D, psi = depart(), [p1, p2] = Q.chainePolariseurs(psi, [a, b]);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 }, x: { domain: [0, 180], label: t("fig.x") }, y: { domain: [0, 1], label: t("fig.y") } });
    const c2 = [], c1 = [];
    for (let k = 0; k <= 180; k++) { c2.push([o.x(k), o.y(Q.chainePolariseurs(psi, [a, k * D])[1])]); c1.push([o.x(k), o.y(Q.chainePolariseurs(psi, [k * D])[0])]); }
    Plot.el("path", { d: Plot.path(c1), class: "stroke dash c-tint" }, o.g);
    Plot.el("path", { d: Plot.path(c2), class: "stroke bold c-ok" }, o.g);
    Plot.el("circle", { cx: o.x(+sB.value), cy: o.y(p2), r: 5, class: "fill c-ok" }, o.g);
    $("sAr").textContent = F.num(+sA.value, 3) + "°"; $("sBr").textContent = F.num(+sB.value, 3) + "°";
    $("v1").textContent = F.fix(p1, 3); $("f1").textContent = t("fig.f.un", { n: F.num(Math.round(p1 * 1e4), 5) });
    $("v2").textContent = F.fix(p2, 3); $("f2").textContent = t("fig.f.deux", { n: F.num(Math.round(p2 * 1e4), 5) });
    const [cr, cl] = Q.versCirculaire(psi);
    $("vc").textContent = F.fix(Cx.abs2(cr), 2) + " ; " + F.fix(Cx.abs2(cl), 2);
    $("fc").textContent = t("fig.f.circ");
    src.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.s === s)));
  }
  src.querySelectorAll("button").forEach(x => x.onclick = () => { s = x.dataset.s; draw(); });
  sA.oninput = sB.oninput = draw; draw();
})();

/* ---------- the system described: a laser beam is a great many photons ---------- */
(() => {
  const P = 1e-3, lam = 633e-9, E = K.h * K.c / lam, N = P / E;
  $("sys1").innerHTML = t("sys1.body", { P: F.si(P, "W"), l: F.si(lam, "m"), E: F.si(E, "J"), N: F.sci(N, 2), s: F.sci(1 / Math.sqrt(N * 1e-6), 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["malus", 1809, "experiment"], ["beth", 1936, "experiment"], ["cf", 1972, "experiment"], ["aspect", 1982, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lcd", "cinema"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["trente", "c"], ["croises", "a"], ["milieu", "d"], ["circ", "b"], ["un", "c"], ["rotation", "a"], ["classique", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1104 });
})();
</script>
