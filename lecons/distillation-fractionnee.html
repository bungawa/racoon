    <div class="eq"><math display="block"><msub><mi>x</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mi>y</mi><mi>k</mi></msub><mo>=</mo><mi>y</mi><mo>(</mo><msub><mi>x</mi><mi>k</mi></msub><mo>)</mo></math></div>

        <div class="seg" role="group" id="sys">

          <div class="ctl"><div class="row"><label for="colx" data-i18n="col.x"></label><output id="colxv" for="colx"></output></div>
            <input id="colx" type="range" min="10" max="800" step="1" value="200"></div>
          <div class="ctl"><div class="row"><label for="coln" data-i18n="col.n"></label><output id="colnv" for="coln"></output></div>
            <input id="coln" type="range" min="0" max="15" step="1" value="3"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="col.k.tete"></span><span class="v" id="colt"></span><span class="f" id="coltf"></span></div>

          <div class="stat"><span class="k" data-i18n="col.k.but"></span><span class="v" id="colb"></span><span class="f" id="colbf"></span></div>

      </div>
      <div class="legend"><span class="c-tint" data-i18n="col.leg.bulle"></span><span class="c-warn" data-i18n="col.leg.rosee"></span><span class="c-label-2" data-i18n="col.leg.etages"></span></div>

  <section class="card">

    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi>p</mi><mo>=</mo><msubsup><mi>p</mi><mi mathvariant="normal">E</mi><mo>*</mo></msubsup><mo>(</mo><msub><mi>T</mi><mi mathvariant="normal">h</mi></msub><mo>)</mo><mo>+</mo><msubsup><mi>p</mi><mi mathvariant="normal">B</mi><mo>*</mo></msubsup><mo>(</mo><msub><mi>T</mi><mi mathvariant="normal">h</mi></msub><mo>)</mo></math></div>
    <p class="validite" data-i18n-html="val.hetero"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="eq"><math display="block"><mfrac><msub><mi>m</mi><mi mathvariant="normal">B</mi></msub><msub><mi>m</mi><mi mathvariant="normal">E</mi></msub></mfrac><mo>=</mo><mfrac><mrow><msubsup><mi>p</mi><mi mathvariant="normal">B</mi><mo>*</mo></msubsup><msub><mi>M</mi><mi mathvariant="normal">B</mi></msub></mrow><mrow><msubsup><mi>p</mi><mi mathvariant="normal">E</mi><mo>*</mo></msubsup><msub><mi>M</mi><mi mathvariant="normal">E</mi></msub></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.masse"></p>

      <svg class="fig" id="het" role="img" data-i18n-attr="aria-label:het.aria"></svg>

        <div class="ctl"><div class="row"><label for="hetp" data-i18n="het.p"></label><output id="hetpv" for="hetp"></output></div>
          <input id="hetp" type="range" min="70000" max="101325" step="25" value="101325"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="het.k.T"></span><span class="v" id="hetT"></span><span class="f" id="hetTf"></span></div>
          <div class="stat"><span class="k" data-i18n="het.k.y"></span><span class="v" id="hety"></span><span class="f" id="hetyf"></span></div>
          <div class="stat"><span class="k" data-i18n="het.k.m"></span><span class="v" id="hetm"></span><span class="f" id="hetmf"></span></div>
        </div>
      </div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>

<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/chim-solutions.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, B = ChimSolutions.Binaires;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- colonne à reflux total : les étages sur le diagramme isobare ---------- */
(() => {
  const svg = $("col"), sx = $("colx"), sn = $("coln"), BUT = 0.95;
  const SYS = { "benzene-toluene": { T: [350, 388], p: B.P_ATM }, "ethanol-eau": { T: [349, 376], p: 101300 } };
  let cur = "benzene-toluene", ax;
  function dessiner() {
    const S = SYS[cur];
    svg.textContent = "";
    ax = Plot.axes(svg, { fmt: F, w: 640, h: 380, pad: { b: 44, l: 60 },
      x: { domain: [0, 1], label: t(cur === "benzene-toluene" ? "col.xlab.bt" : "col.xlab.ee"), fmt: v => F.num(v, 2) }, y: { domain: S.T, label: t("col.ylab") } });
    const { x, y, g } = ax, c = B.courbes(cur, S.p, 200);
    P("path", { d: Plot.path(c.map(q => [x(q.x), y(q.T)])), class: "stroke c-tint" }, g);
    P("path", { d: Plot.path(c.map(q => [x(q.y), y(q.T)])), class: "stroke c-warn" }, g);
    ax.marches = P("path", { class: "stroke c-label-2" }, g);
    ax.bouilleur = P("circle", { r: 6, class: "dot" }, g);
    ax.tete = P("circle", { r: 5, class: "fill c-warn" }, g);
  }
  function upd() {
    const S = SYS[cur], x0 = +sx.value / 1000, N = +sn.value, e = B.etages(cur, x0, N, S.p), { x, y } = ax;
    let d = [];
    e.forEach((q, k) => { d.push([x(q.x), y(q.T)], [x(q.y), y(q.T)]); if (k < e.length - 1) d.push([x(q.y), y(e[k + 1].T)]); });
    ax.marches.setAttribute("d", Plot.path(d));
    ax.bouilleur.setAttribute("cx", x(x0)); ax.bouilleur.setAttribute("cy", y(e[0].T));
    const fin = e[e.length - 1];
    ax.tete.setAttribute("cx", x(fin.y)); ax.tete.setAttribute("cy", y(fin.T));
    $("colxv").textContent = F.fix(x0, 3); $("colnv").textContent = String(N);
    $("colt").textContent = F.fix(fin.y, 3); $("coltf").textContent = t("col.f.tete", { n: e.length });
    $("colT").innerHTML = F.kelvin(fin.T); $("colTf").innerHTML = t("col.f.bouilleur", { T: F.kelvin(e[0].T) });
    let n = null;                                            // plates needed for a distillate at 0,95
    for (let k = 0; k <= 40 && n === null; k++) { const f = B.etages(cur, x0, k, S.p); if (f[f.length - 1].y >= BUT) n = k; }
    const az = B.azeotrope(cur, S.p);
    $("colb").textContent = n === null ? "–" : String(n);
    $("colbf").textContent = n === null ? t("col.f.jamais", { az: F.fix(az ? az.x : 1, 3) }) : t("col.f.plateaux");
  }
  const segs = $("sys").querySelectorAll("button");
  const choisir = m => { cur = m; segs.forEach(bt => bt.setAttribute("aria-pressed", String(bt.dataset.m === m))); dessiner(); upd(); };
  segs.forEach(bt => bt.onclick = () => choisir(bt.dataset.m));
  sx.oninput = sn.oninput = upd;
  choisir(cur);
})();

/* ---------- hétéroazéotrope eau-toluène ---------- */
(() => {
  const svg = $("het"), sp = $("hetp"), TT = [340, 386];
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { b: 44, l: 60 },
    x: { domain: [0, 1], label: t("het.x"), fmt: v => F.num(v, 2) }, y: { domain: TT, label: t("het.y") } });
  const rosee = P("path", { class: "stroke c-warn" }, g), palier = P("path", { class: "stroke c-tint" }, g), dot = P("circle", { r: 5, class: "fill c-warn" }, g);
  const ZONES = textOf("het.zones", ["V", "LV1", "LV2", "LL"]), lab = {};
  for (const k of ["V", "LV1", "LV2", "LL"]) lab[k] = P("text", { "text-anchor": "middle" }, g);
  function upd() {
    const p = +sp.value, h = B.nonMiscibles("eau", "toluene", p), pts = [];
    for (let i = 0; i <= 200; i++) { const ya = i / 200, r = B.roseeNM("eau", "toluene", ya, p); if (r.T <= TT[1]) pts.push([x(ya), y(r.T)]); }
    rosee.setAttribute("d", Plot.path(pts));
    palier.setAttribute("d", Plot.path([[x(0), y(h.T)], [x(1), y(h.T)]]));
    dot.setAttribute("cx", x(h.ya)); dot.setAttribute("cy", y(h.T));
    const pos = { V: [0.5, TT[1] - 3], LV1: [0.18, h.T + 4], LV2: [0.82, h.T + 2.5], LL: [0.5, h.T - 8] };
    for (const k in pos) { lab[k].setAttribute("x", x(pos[k][0])); lab[k].setAttribute("y", y(pos[k][1])); lab[k].textContent = ZONES[k]; }
    $("hetpv").textContent = F.si(p, "Pa");
    $("hetT").innerHTML = F.kelvin(h.T); $("hetTf").innerHTML = t("het.f.T", { e: F.kelvin(B.Teb("eau", p)), b: F.kelvin(B.Teb("toluene", p)) });
    $("hety").textContent = F.fix(h.ya, 3); $("hetyf").textContent = t("het.f.y");
    $("hetm").textContent = F.qty(F.num(100 * h.rapportMasse / (1 + h.rapportMasse), 3), "%"); $("hetmf").textContent = t("het.f.m", { r: F.num(h.rapportMasse, 3) });
  }
  sp.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cellier", 1813, "experiment"], ["coffey", 1830, "use"], ["mccabe", 1925, "idea"], ["clevenger", 1928, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["raffinerie", "huiles", "ethanol"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["simple", "b"], ["plateau", "d"], ["reflux", "a"], ["azeo", "c"], ["hetero", "b"], ["masse", "a"], ["limonene", "d"], ["variance", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
