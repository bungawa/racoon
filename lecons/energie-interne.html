<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- la pression interne (∂U/∂V)_T, calculée par (45.7) à partir de P(V, T) seule ---------- */
(() => {
  const svg = $("pint"), sg = $("gaz"), sv = $("vm"), st = $("tk"), VMIN = 1e-4, VMAX = 0.025;
  const vol = s => VMIN * Math.pow(VMAX / VMIN, s / 100);         // one mole, 0,1 L to 25 L
  const loi = id => id === "parfait" ? Thermo.pression : Thermo.vdw(id);
  function draw() {
    const id = sg.value, P = loi(id), V = vol(+sv.value), T = +st.value;
    const Y = (v, TT) => P(1, v, TT), du = Thermo.dUdX(Y, V, T), tdp = du + Y(V, T);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44, l: 56 },
      x: { scale: "log", domain: [0.1, 25], label: t("pi.x"), fmt: v => F.num(v, 3) },
      y: { scale: "log", domain: [1, 1e8], label: t("pi.y") } });
    const pts = f => { const out = []; for (let i = 0; i <= 120; i++) { const v = VMIN * Math.pow(VMAX / VMIN, i / 120), y = f(v);
      if (y >= 1 && y <= 1e8) out.push([o.x(v * 1e3), o.y(y)]); } return out; };
    Plot.el("path", { d: Plot.path(pts(v => Y(v, T))), class: "ref" }, o.g);
    if (id !== "parfait") {
      Plot.el("path", { d: Plot.path(pts(v => Thermo.dUdX(Y, v, T))), class: "curve" }, o.g);
      if (du >= 1) Plot.el("circle", { cx: o.x(V * 1e3), cy: o.y(du), r: 6, class: "dot" }, o.g);
    }
    $("vmv").textContent = F.qty(F.num(V * 1e3, 2), "L");
    $("tkv").innerHTML = F.kelvin(T);
    $("vp").textContent = F.si(Y(V, T), "Pa", { sig: 3 });
    $("vtdp").textContent = F.si(tdp, "Pa", { sig: 3 });
    $("vdu").textContent = id === "parfait" ? "0" : F.si(du, "Pa", { sig: 3 });
    $("vdt").textContent = id === "parfait" ? "0" : F.si(Thermo.joulevdw(id, 1, V, 2 * V, T) - T, "K", { sig: 2 });
    const e = id === "parfait" ? null : Thermo.ecarts(id, 1, V, T);
    $("sys").innerHTML = id === "parfait" ? t("sys.parfait") : t("sys.inner", { gaz: t("pi.opt." + id), V: F.qty(F.num(V * 1e3, 2), "L"), T: F.kelvin(T),
      a: F.num(e.a, 2), b: F.num(e.b, 2), avis: t(Math.max(e.a, e.b) < 0.01 ? "sys.ok" : Math.max(e.a, e.b) < 0.3 ? "sys.moyen" : "sys.ko") });
  }
  sg.onchange = sv.oninput = st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gaylussac", 1807, "experiment"], ["joule", 1845, "experiment"], ["clausius", 1850, "idea"], ["joulethomson", 1852, "experiment"], ["vdw", 1873, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["linde", "tables"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["parfait", "a"], ["chaleur", "c"], ["attraction", "b"], ["joule", "d"], ["joule1845", "a"], ["cv", "c"], ["cycle", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 451 });
})();
</script>
