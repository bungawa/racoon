<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
/* ---------- du gaz au liquide : quatre corps du tableau de Feynman ---------- */
(() => {
  const svg = $("cm"), XM = 2, YM = 6;
  let id = "CS2";
  function draw() {
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, XM], label: t("fig.x") }, y: { domain: [1, YM], label: t("fig.y") } });
    const xs = Array.from({ length: 201 }, (_, i) => i * XM / 200);
    Plot.el("path", { d: Plot.path(xs.map(x => [A.x(x), A.y(1 + x)])), class: "stroke dash c-label" }, A.g);
    Plot.el("path", { d: Plot.path(xs.filter(x => ES.clausiusMossotti(x) <= YM).map(x => [A.x(x), A.y(ES.clausiusMossotti(x))])), class: "stroke bold c-tint" }, A.g);
    ES.LIQUIDES_CM.forEach(l => { const r = ES.liquideDepuisGaz(l);
      Plot.el("circle", { cx: A.x(r.Na), cy: A.y(l.kLiq), r: l.id === id ? 6 : 3.5, class: "fill c-warn" }, A.g); });
    const l = ES.LIQUIDES_CM.find(z => z.id === id), r = ES.liquideDepuisGaz(l);
    Plot.el("line", { x1: A.x(r.Na), x2: A.x(r.Na), y1: A.y(1), y2: A.y(Math.max(r.kappa, l.kLiq)), class: "stroke thin dash c-warn" }, A.g);
    $("vg").textContent = F.num(r.NaGaz, 3);
    $("fg").textContent = t("f.gaz", { k: F.num(l.kGaz, 7), r: F.num(r.rapport, 3) });
    $("vn").textContent = F.num(r.Na, 3);
    $("fn").textContent = t("f.na", { t: F.num(r.Na / 3, 2) });
    $("vp").textContent = F.num(r.kappa, 4);
    $("fp").textContent = t("f.pred", { m: F.num(l.kLiq, 4), e: F.num(100 * Math.abs(r.kappa - l.kLiq) / l.kLiq, 2), s: F.num(r.sansVoisins, 4) });
  }
  document.querySelectorAll("#liq button").forEach(bt => bt.onclick = () => {
    id = bt.dataset.l; document.querySelectorAll("#liq button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  draw();
  $("eau").innerHTML = t("eau.body", { k: F.num(ES.clausiusMossotti(13.2), 2), n: F.num(ES.alphaDeKappa(80), 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["clausius", 1879, "idea"], ["debye", 1912, "idea"], ["onsager", 1936, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["jauge"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["retro", "b"], ["oxygene", "c"], ["gaz", "a"], ["hypothese", "d"], ["tiers", "a"], ["eau", "c"], ["inverse", "b"], ["trois", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1105 });
})();
</script>
