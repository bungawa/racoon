<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9;

/* ---------- le système décrit : 1 nC sur une bille de 1 mm, dans un cube de 10 cm ---------- */
(() => {
  const q = NC, a = 0.1;
  $("sys").innerHTML = t("sys.body", { qe: F.si(q / ES.EPS0, "V·m"), e: F.si(ES.K * q / (a / 2) ** 2, "V·m⁻¹") });
})();

/* ---------- une charge dans un cube : le flux de chaque face, et le total (cube de côté 10 cm centré à l'origine) ---------- */
(() => {
  const svg = $("cube"), bars = $("faces"), zsl = $("zsl"), nsl = $("nsl"), A = 0.1, H = A / 2;
  const O = { W: 640, H: 360, x0: -0.1, x1: 0.1, y0: -0.05625, y1: 0.05625 }, FACES = ["px", "mx", "py", "my", "pz", "mz"];
  const noms = textOf("cube.faces", FACES), QE = NC / ES.EPS0;
  let s = [0.02, 0.015], c;
  function flux(n, p) {
    if (n === 2) return ES.fluxCubeExact(NC, p, [0, 0, 0], A);
    return AnaVec.fluxCube(r => ES.champPuissance([{ q: NC, x: p[0], y: p[1], z: p[2] }], r, n, H), [0, 0, 0], A, 32);
  }
  function draw() {
    const z = zsl.value / 1000, n = +nsl.value, p = [s[0], s[1], z], f = flux(n, p);
    const dedans = p.every(x => Math.abs(x) < H), sur = p.every(x => Math.abs(x) <= H) && p.some(x => Math.abs(x) === H);
    c = CarteChamp.carte(svg, O);
    const q3 = [{ q: NC, x: p[0], y: p[1], z }];
    CarteChamp.fleches(c, r => (Math.hypot(r[0] - p[0], r[1] - p[1]) < 0.006 ? [NaN, NaN] : ES.champ(q3, [r[0], r[1], 0]).slice(0, 2)), 24, 14, { cls: "c-label-2", unitaire: true, lmax: 10 });
    const g = c.layer("c-tint");
    Plot.el("rect", { x: c.sx(-H), y: c.sy(H), width: c.sx(H) - c.sx(-H), height: c.sy(-H) - c.sy(H), class: "stroke bold" }, g);
    CarteChamp.point(c, [p[0], p[1]], 6, "c-warn", "q", -12);
    /* bars: the share of q/ε0 through each face */
    bars.innerHTML = "";
    const { x, y, g: gb } = Plot.axes(bars, { fmt: F, w: 640, h: 220, pad: { b: 30 }, x: { domain: [0, 6], fmt: () => "" }, y: { domain: [-0.6, 1], label: t("faces.y"), fmt: v => F.num(v, 1) } });
    f.faces.forEach((v, i) => {
      const u = v / QE, cls = u >= 0 ? "c-ok" : "c-label", y0 = y(0), y1 = y(Math.max(-0.6, Math.min(1, Number.isFinite(u) ? u : 0)));
      const gg = Plot.el("g", { class: cls }, gb);
      Plot.el("rect", { x: x(i + 0.2), width: x(i + 0.8) - x(i + 0.2), y: Math.min(y0, y1), height: Math.abs(y1 - y0), class: "fill" }, gg);
      Plot.el("text", { x: x(i + 0.5), y: 220 - 10, "text-anchor": "middle", class: "tick" }, gb).textContent = noms[FACES[i]];
    });
    Plot.el("line", { x1: x(0), x2: x(6), y1: y(0), y2: y(0), class: "axis" }, gb);
    const tot = f.total / QE, k = f.faces.reduce((m, v, i) => (Math.abs(v) > Math.abs(f.faces[m]) ? i : m), 0);
    $("zread").textContent = F.si(z, "m");
    $("nread").textContent = F.num(n, 2);
    $("vtotal").textContent = Number.isFinite(tot) ? F.si(f.total, "V·m") : "–";
    $("ftotal").textContent = Number.isFinite(tot) ? t("cube.f.total", { k: F.num(tot, 3) }) : t("cube.f.sur");
    $("vqint").textContent = F.si(dedans ? QE : 0, "V·m");
    $("fqint").textContent = t(sur ? "cube.f.sur" : dedans ? "cube.f.dedans" : "cube.f.dehors");
    $("vface").textContent = Number.isFinite(tot) ? F.num(f.faces[k] / QE, 3) : "–";
    $("fface").textContent = t("cube.f.face", { f: noms[FACES[k]] });
  }
  CarteChamp.survol(svg, () => c, r => { s = [Math.max(-0.095, Math.min(0.095, r[0])), Math.max(-0.055, Math.min(0.055, r[1]))]; draw(); });
  zsl.oninput = nsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lagrange", 1762, "idea"], ["gauss", 1813, "idea"], ["faraday", 1843, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cage", "sonde"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dehors", "b"], ["taille", "d"], ["incline", "a"], ["face", "c"], ["deux", "b"], ["exposant", "d"], ["sur", "a"], ["unite", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 45 });
})();
</script>
