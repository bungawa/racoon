<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const El = Elasticite, T = Tenseurs;

/* ---------- un carré déformé : u = G r, puis ses deux parts ---------- */
(() => {
  const svg = $("carre"), O = [250, 180], K = 100, IDS = ["g11", "g12", "g21", "g22"];
  const PRESETS = { "p-traction": [0.2, 0, 0, 0], "p-pur": [0, 0.15, 0.15, 0], "p-simple": [0, 0.3, 0, 0], "p-rot": [0, 0.15, -0.15, 0] };
  const px = ([x, y]) => [O[0] + K * x, O[1] - K * y];
  const line = (a, b, cls) => { const A = px(a), B = px(b); P("line", { x1: A[0].toFixed(1), y1: A[1].toFixed(1), x2: B[0].toFixed(1), y2: B[1].toFixed(1), class: cls }, svg); };
  function upd() {
    const g = IDS.map(id => +$(id).value);
    IDS.forEach((id, k) => { $(id + "v").textContent = F.fix(g[k], 2); });
    const G = [[g[0], g[1], 0], [g[2], g[3], 0], [0, 0, 0]], dc = El.decomposer(G);
    const vue = $("vue").value, M = vue === "sym" ? dc.e : vue === "rot" ? T.somme(G, dc.e, -1) : G;     // rotation part: G − e = −ω
    const mv = ([x, y]) => { const r = El.deformer(M, [x, y, 0]); return [r[0], r[1]]; };
    svg.innerHTML = "";
    for (const v of [-1, -0.5, 0, 0.5, 1]) {
      line([-1, v], [1, v], "stroke thin dash c-label-2"); line([v, -1], [v, 1], "stroke thin dash c-label-2");
      line(mv([-1, v]), mv([1, v]), v === -1 || v === 1 ? "stroke c-tint" : "stroke thin c-tint");
      line(mv([v, -1]), mv([v, 1]), v === -1 || v === 1 ? "stroke c-tint" : "stroke thin c-tint");
    }
    const ax = dc.principales.axes.map((a, k) => [a, dc.principales.valeurs[k]]).filter(([a]) => Math.abs(a[2]) < 0.5);
    if (vue !== "rot") ax.forEach(([a, l]) => {
      if (Math.abs(l) < 1e-9) return;
      const s = 1.45;
      Plot.fleche(svg, px([0, 0]), px([s * a[0] * (1 + l), s * a[1] * (1 + l)]), { cls: "c-warn" });
      Plot.fleche(svg, px([0, 0]), px([-s * a[0] * (1 + l), -s * a[1] * (1 + l)]), { cls: "c-warn" });
      const E = px([1.6 * a[0], 1.6 * a[1]]);
      P("text", { x: E[0].toFixed(1), y: E[1].toFixed(1), "text-anchor": "middle", class: "c-warn" }, svg).textContent = F.fix(l, 3);
    });
    const e = dc.e, deg = dc.angle * 180 / Math.PI;
    $("ve").textContent = t("ca.v.e", { xx: F.fix(e[0][0], 3), yy: F.fix(e[1][1], 3), xy: F.fix(e[0][1], 3) });
    $("fe").textContent = t("ca.f.e");
    $("vrot").textContent = F.qty(F.fix(dc.angle, 3), "rad");
    $("frot").textContent = t("ca.f.rot", { deg: F.qty(F.fix(deg, 1), "°") });
    $("vdil").textContent = F.fix(dc.dilatation, 3);
    const [l1, l2] = ax.map(x => x[1]).sort((a, b) => b - a), a1 = ax.find(x => x[1] === l1)[0];
    let th = Math.atan2(a1[1], a1[0]) * 180 / Math.PI; if (th > 90) th -= 180; if (th <= -90) th += 180;
    $("vprinc").textContent = t("ca.v.princ", { a: F.fix(l1, 3), b: F.fix(l2, 3) });
    $("fprinc").textContent = t("ca.f.princ", { th: F.qty(F.fix(th, 0), "°") });
    const GL = El.greenLagrange(M), lin = vue === "rot" ? [[0, 0, 0], [0, 0, 0], [0, 0, 0]] : vue === "sym" ? dc.e : dc.e;
    const neg = Math.max(...GL.flat().map((x, k) => Math.abs(x - lin.flat()[k])));
    $("vneg").textContent = F.fix(neg, 3);
    $("fneg").textContent = t("ca.f.neglige");
  }
  IDS.forEach(id => $(id).oninput = upd); $("vue").onchange = upd;
  Object.keys(PRESETS).forEach(id => $(id).onclick = () => { PRESETS[id].forEach((v, k) => { $(IDS[k]).value = v; }); upd(); });
  upd();
})();

const EVENTS = [["cauchy", 1822, "idea"], ["saintvenant", 1864, "idea"], ["simmons", 1936, "experiment"], ["ruge", 1938, "use"], ["sutton", 1983, "experiment"]];
const USES = ["jauges", "rosettes", "images"];
const QS = [["rot", "b"], ["six", "d"], ["pur", "a"], ["dil", "c"], ["fausse", "b"], ["rosette", "a"], ["compat", "c"]];

/* ---------- histoire ---------- */
(() => {
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
