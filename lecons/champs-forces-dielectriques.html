<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;

/* ---------- le système décrit : un bout de papier sous un peigne chargé ---------- */
(() => {
  const Q = 10e-9, kp = 3, rho = 800, Vp = 2e-3 * 2e-3 * 1e-4, m = rho * Vp, poids = m * Constantes.g0;
  const R = Math.cbrt(3 * Vp / (4 * Math.PI)), al = ES.polarisabiliteSphere(R, kp), f = ES.forceInduite(al, Q, 0.01);
  const r = Math.pow(2 * al * ES.EPS0 * ES.K * ES.K * Q * Q / poids, 0.2);
  $("sys1").innerHTML = t("sys1.body", { R: F.num(R * 1e3, 2), E: F.sci(f.E, 2), F: F.sci(-f.F, 2), P: F.sci(poids, 2),
    r: F.num(r * 1e3, 2), Rr: F.num(R / r, 2), Er: F.sci(ES.K * Q / (r * r), 2) });
})();

/* ---------- une lame tirée entre les armatures ---------- */
(() => {
  const L = 0.1, W = 0.1, d = 1e-3, V0 = 1e3, xs = $("xs"), ks = $("ks"), sl = $("lame"), sf = $("forces");
  let mode = "V";
  function schema(u, k) {
    sl.innerHTML = "";
    const P = (tag, a, g) => Plot.el(tag, a, g || sl), x0 = 120, x1 = 520, y0 = 45, y1 = 105, xl = x0 + u * (x1 - x0);
    const gl = P("g", { class: "c-label" });
    P("rect", { x: x0, y: y0 - 8, width: x1 - x0, height: 8, class: "fill" }, gl);
    P("rect", { x: x0, y: y1, width: x1 - x0, height: 8, class: "fill" }, gl);
    const gt = P("g", { class: "c-tint" });
    P("rect", { x: (xl - (x1 - x0)).toFixed(1), y: y0 + 2, width: x1 - x0, height: y1 - y0 - 4, class: "fill", opacity: Math.min(0.75, 0.15 + 0.06 * k) }, gt);
    Plot.fleche(P("g", { class: "c-warn" }), [Math.max(xl - 60, 20), 75], [Math.max(xl - 10, 70), 75]);
    P("text", { x: x0 - 8, y: y0 - 14, "text-anchor": "start", class: "label" }, gl).textContent = t("fig.plaque");
    P("text", { x: (x0 + x1) / 2, y: 140, "text-anchor": "middle", class: "label" }, gl).textContent = t("fig.x", { x: F.num(u * L * 100, 2) });
  }
  function draw() {
    const u = +xs.value, k = +ks.value, l = ES.lameInseree({ L, W, d, kappa: k }), x = u * L, C0 = l.C(0), Q = C0 * V0;
    schema(u, k);
    const fV = l.forceV(V0), fQ = y => l.forceQ(Q, y * L), top = Math.max(fV, 1e-12) * 1.15;
    sf.innerHTML = "";
    const A = Plot.axes(sf, { fmt: F, w: 640, h: 240, x: { domain: [0, 1], label: t("fig.ax.x") }, y: { domain: [0, top * 1e3], label: t("fig.ax.F") } });
    const us = Array.from({ length: 101 }, (_, i) => i / 100);
    Plot.el("path", { d: Plot.path(us.map(v => [A.x(v), A.y(fV * 1e3)])), class: "stroke c-label" }, A.g);
    Plot.el("path", { d: Plot.path(us.map(v => [A.x(v), A.y(fQ(v) * 1e3)])), class: "stroke c-warn" }, A.g);
    const fx = mode === "V" ? fV : fQ(u);
    Plot.el("circle", { cx: A.x(u), cy: A.y(fx * 1e3), r: 5, class: "fill " + (mode === "V" ? "c-label" : "c-warn") }, A.g);
    $("xr").textContent = F.num(u, 2); $("kr").textContent = F.num(k, 2);
    $("vC").textContent = F.num(l.C(x) / C0, 3);
    $("fC").textContent = t("f.C", { C: F.si(l.C(x), "F") });
    $("vF").textContent = F.si(fx, "N");
    $("fF").textContent = t(mode === "V" ? "f.F.V" : "f.F.Q");
    const Vx = mode === "V" ? V0 : Q / l.C(x);
    $("vV").textContent = F.si(Vx, "V");
    $("fV").textContent = mode === "V" ? t("f.V.V", { W: F.si(V0 * V0 * l.dC * 0.01 * L, "J"), U: F.si(V0 * V0 * l.dC * 0.01 * L / 2, "J") })
      : t("f.V.Q", { U: F.si(l.energieQ(x, Q), "J") });
  }
  document.querySelectorAll("#modes button").forEach(bt => bt.onclick = () => {
    mode = bt.dataset.m; document.querySelectorAll("#modes button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  xs.oninput = draw; ks.oninput = draw; draw();
})();

/* ---------- le système décrit : une huile qui monte entre deux plaques verticales ---------- */
(() => {
  const k = 2.3, rho = 900, gap = 2e-3, U = 2e3, E0 = U / gap, gam = 0.03, g = Constantes.g0;
  const h = ES.remontee(k, E0, rho), hc = 2 * gam / (rho * g * gap);
  $("sys2").innerHTML = t("sys2.body", { E: F.sci(E0, 1), h: F.num(h * 1e3, 2), hc: F.num(hc * 1e3, 2), rap: F.num(hc / h, 2),
    p: F.num(ES.EPS0 * (k - 1) * E0 * E0 / 2, 2), cl: F.num(E0 / 3e6, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gilbert", 1600, "experiment"], ["faraday", 1837, "experiment"], ["pohl", 1951, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tri", "niveau"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["liquide", "b"], ["charge", "d"], ["uniforme", "a"], ["papier", "c"], ["lame", "b"], ["isole", "d"], ["solide", "a"], ["huile", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1005 });
})();
</script>
