<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, R = Math.PI / 180;
$("sys1").innerHTML = t("sys.body");
(() => {
  const svg = $("phas"), st = $("st"), sp = $("sp"), sr = $("sr");
  let op = "sx";
  const DIAL = [[120, "+"], [360, "−"]], g = Plot.el("g", {}, svg), dyn = Plot.el("g", {}, svg), RAY = 90;
  for (const [cx, s] of DIAL) {
    Plot.el("circle", { cx, cy: 120, r: RAY, class: "stroke thin c-label-2", fill: "none" }, g);
    Plot.el("line", { x1: cx - RAY - 6, x2: cx + RAY + 6, y1: 120, y2: 120, class: "axis" }, g);
    Plot.el("line", { x1: cx, x2: cx, y1: 120 - RAY - 6, y2: 120 + RAY + 6, class: "axis" }, g);
    const tx = Plot.el("text", { x: cx, y: 232, "text-anchor": "middle", class: "label" }, g); tx.textContent = t("fig.dial." + (s === "+" ? "p" : "m"));
  }
  const tm = Plot.el("text", { x: 560, y: 60, "text-anchor": "middle", class: "label" }, g); tm.textContent = t("fig.re");
  function mat() { return op === "rz" ? Q.rotationZSpin(+sr.value * R) : Q.PAULI[op.slice(1)]; }
  function draw() {
    const C = Q.etatSpin(+st.value * R, +sp.value * R), M = mat(), D = Q.appliquer(M, C);
    dyn.replaceChildren();
    DIAL.forEach(([cx], i) => {
      Plot.fleche(dyn, [cx, 120], [cx + RAY * C[i].re, 120 - RAY * C[i].im], { cls: "c-label-2" });
      Plot.fleche(dyn, [cx, 120], [cx + RAY * D[i].re, 120 - RAY * D[i].im], { cls: "c-tint" });
    });
    const z = Q.produitScalaire(C, D), fid = z.re * z.re + z.im * z.im;
    const cplx = w => F.num(w.re, 3) + (w.im < 0 ? " − " : " + ") + F.num(Math.abs(w.im), 3) + "i";
    $("str").textContent = F.num(+st.value, 3) + "°"; $("spr").textContent = F.num(+sp.value, 3) + "°"; $("srr").textContent = F.num(+sr.value, 3) + "°";
    sr.disabled = op !== "rz";
    $("vc").textContent = "(" + cplx(D[0]) + " ; " + cplx(D[1]) + ")";
    $("fc").textContent = t("fig.f.c", { a: cplx(C[0]), b: cplx(C[1]) });
    $("vm").textContent = cplx(z);
    $("fm").textContent = Q.estHermitien(M) ? t("fig.f.herm") : t("fig.f.nonherm");
    $("vf").textContent = F.num(fid, 3);
    $("ff").textContent = fid > 1 - 1e-9 ? t("fig.f.meme") : t("fig.f.autre");
    $("op").querySelectorAll("button").forEach(e => e.setAttribute("aria-pressed", String(e.dataset.o === op)));
  }
  $("op").querySelectorAll("button").forEach(e => e.onclick = () => { op = e.dataset.o; draw(); });
  st.oninput = sp.oninput = sr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["umdeutung", 1925, "idea"], ["bornjordan", 1925, "idea"], ["dirac", 1939, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["portes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["base", "b"], ["calcul", "a"], ["adjoint", "c"], ["hermitien", "d"], ["rotation", "b"], ["infinitesimal", "a"], ["etatpropre", "c"], ["differentiel", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 201 });
})();
</script>
