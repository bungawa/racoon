<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd;
const QE = Constantes.e, ME = Constantes.m_e, LAMBDA = 589e-9, W0 = 2 * Math.PI * O.c / LAMBDA;   // an electron bound at 589 nm

/* ---------- le diagramme en sin²θ : la part de la puissance dans une bande autour du plan équatorial ---------- */
(() => {
  const svg = $("lobe"), sa = $("sa"), sx = $("sx"), W = 640, H = 300, cx = W / 2, cy = H / 2, R = 250;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  /* a point at the angle θ from the acceleration (vertical, upwards) at the distance ρ, on the right (s = 1) or the left (s = −1) */
  const pt = (th, rho, s) => [cx + s * rho * Math.sin(th), cy - rho * Math.cos(th)];
  function draw() {
    const al = +sa.value * Math.PI / 180, x0 = 10 ** +sx.value;
    svg.innerHTML = "";
    for (const s of [1, -1]) {
      /* the band ±α around the equator, inside the lobe */
      const ths = Array.from({ length: 61 }, (_, i) => Math.PI / 2 - al + i * 2 * al / 60);
      if (al > 0) Plot.el("path", { d: "M" + cx + " " + cy + Plot.path(ths.map(th => pt(th, R * Math.sin(th) ** 2, s))).replace(/^M/, "L") + "Z", class: "area" }, svg);
      const all = Array.from({ length: 181 }, (_, i) => i * Math.PI / 180);
      Plot.el("path", { d: Plot.path(all.map(th => pt(th, R * Math.sin(th) ** 2, s))), class: "curve" }, svg);
      for (const th of [Math.PI / 2 - al, Math.PI / 2 + al]) Plot.el("line", { x1: cx, y1: cy, x2: pt(th, 0.6 * R, s)[0], y2: pt(th, 0.6 * R, s)[1], class: "grid" }, svg);
    }
    Plot.el("line", { x1: cx, y1: 6, x2: cx, y2: H - 6, class: "ref" }, svg);
    Plot.fleche(svg, [cx, cy + 22], [cx, cy - 34], { cls: "c-warn" });
    const part = O.bande(al), P = O.puissanceOscillante(QE, W0, x0), Wosc = O.energieOscillateur(ME, W0, x0), Tp = 2 * Math.PI / W0;
    $("sar").textContent = F.num(+sa.value, 3) + "°";
    $("sxr").textContent = F.si(x0, "m");
    $("vpart").textContent = F.num(100 * part, 3) + " %";
    $("fpart").textContent = t("fig.f.part", { s: F.num(100 * Math.sin(al), 3) });
    $("vp").textContent = F.qty(F.sci(P, 3), "W");
    $("fp").textContent = t("fig.f.p", { v: F.sci(W0 * x0 / O.c, 2), x: F.sci(x0 / LAMBDA, 2) });
    $("vratio").textContent = F.sci(P * Tp / Wosc, 3);
    $("fratio").textContent = t("fig.f.ratio", { W: F.qty(F.sci(Wosc, 3), "J") });
  }
  sa.oninput = sx.oninput = draw; draw();
})();

/* ---------- le système décrit : un électron lié qui oscille à 589 nm ---------- */
(() => {
  const x0 = 1e-11, P = O.puissanceOscillante(QE, W0, x0), r = 1;
  $("sys1").innerHTML = t("sys1.body", { w: F.sci(W0, 3), v: F.sci(W0 * x0 / O.c, 2), x: F.sci(x0 / LAMBDA, 2), P: F.qty(F.sci(P, 2), "W"),
    S: F.qty(F.sci(O.fluxLarmor(QE, W0 * W0 * x0, r, Math.PI / 2) / 2, 2), "W·m⁻²"), kr: F.num(2 * Math.PI * r / LAMBDA, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["planck", 1897, "idea"], ["larmor", 1897, "idea"], ["lienard", 1898, "idea"], ["ge", 1947, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["soleil", "tube"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["distance", "b"], ["axe", "d"], ["bande", "c"], ["frequence", "a"], ["instant", "b"], ["ancien", "d"], ["vitesse", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 322 });
})();
</script>
