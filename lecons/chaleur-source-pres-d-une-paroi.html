    <p class="validite" data-i18n-html="val.12.13"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="eq"><math display="block"><mi>T</mi><mo>=</mo><mfrac><mi>G</mi><mrow><mn>4</mn><mi>π</mi><mi>K</mi><msub><mi>r</mi><mn>1</mn></msub></mrow></mfrac><mo>+</mo><mfrac><mi>G</mi><mrow><mn>4</mn><mi>π</mi><mi>K</mi><msub><mi>r</mi><mn>2</mn></msub></mrow></mfrac></math><span class="n">(12.14)</span></div>
    <p class="validite" data-i18n-html="val.12.14"></p>
    <div class="eq"><math display="block"><mi>T</mi><mo stretchy="false">(</mo><mtext data-i18n="eq.surface"></mtext><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mn>4</mn><mi>π</mi><mi>K</mi></mrow></mfrac><mfrac><mrow><mn>2</mn><mi>G</mi></mrow><msqrt><mrow><msup><mi>ρ</mi><mn>2</mn></msup><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup></mrow></msqrt></mfrac></math><span class="n">(12.15)</span></div>

    <figure>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
const metres = v => F.si(v, "m", { prefix: "" }), pct = v => F.qty(F.num(100 * v, 2), "%");
/* Described values: mineral wool 0,038 W·m⁻¹·K⁻¹, limestone 1,30 W·m⁻¹·K⁻¹ (designingbuildings.co.uk), air at a still surface
   h ≈ 10 W·m⁻²·K⁻¹ (order of magnitude, as in « Moteurs, pompes à chaleur et réfrigérateurs »). */
const K_LAINE = 0.038, K_CALCAIRE = 1.3, H_AIR = 10;

/* ---------- le tuyau calorifugé et son jumeau, le câble coaxial ---------- */
(() => {
  const A = 0.05, DT = 100, b = $("bsl");
  function draw() {
    const B = +b.value, G = ES.conductionCylindre(K_LAINE, 1, A, B, DT), G2 = ES.conductionCylindre(K_LAINE, 1, A, Math.min(2 * B - A, 1), DT);
    const bi = ES.biot(H_AIR, B, K_LAINE);
    $("bread").textContent = metres(B);
    $("vG").textContent = F.si(G, "W");
    $("fG").textContent = t("tu.f.G", { G2: F.si(G2, "W") });
    $("vC").textContent = F.si(ES.coaxial(1, A, B).lambda, "F", { prefix: "p" });
    $("vbi").textContent = F.num(bi, 2);
    $("fbi").textContent = t("tu.f.bi", { e: pct(1 / (bi * Math.log(B / A))) });
  }
  b.oninput = draw; draw();
  $("sys1").innerHTML = t("sys1.body", { a: metres(A), K: F.si(K_LAINE, "W·m⁻¹·K⁻¹"), dT: F.si(DT, "K"), h: F.si(H_AIR, "W·m⁻²·K⁻¹") });
})();

/* ---------- une source sous une surface ---------- */
(() => {
  const svg = $("carte"), seg = $("paroi"), asl = $("asl"), G = 10;
  let paroi = "isolante";
  const LAINE = 0.1;                                                     // 10 cm of mineral wool on top: h_eff = K/e
  function draw() {
    const a = +asl.value, S = ES.sourceParoi(G, K_CALCAIRE, a, paroi), U = ES.sourceParoi(1, 1, 1, paroi);   // U: in units of a and G/(4πKa)
    const c = CarteChamp.carte(svg, { W: 640, H: 360, x0: -4, x1: 4, y0: -4.1, y1: 0.4 });
    const f = ([x, y]) => (y > 0 || Math.hypot(x, y + 1) < 0.08 ? NaN : U.T(x, y) * 4 * Math.PI);
    CarteChamp.fond(c, ([x, y]) => (y > 0 ? 0 : Math.hypot(x, y + 1) < 0.08 ? 2 : f([x, y])), 128, 72, { lo: 0, hi: 2 });
    const sol = Object.assign({}, c, { o: Object.assign({}, c.o, { y1: 0 }) });                // the ground only
    CarteChamp.niveaux(sol, f, [0.25, 0.5, 1, 2], { n: [160, 82] });
    const H = ([x, y]) => (y > 0 ? [NaN, NaN] : U.h(x, y));
    const departs = Array.from({ length: 16 }, (_, k) => { const th = (k + 0.5) * Math.PI / 8; return [0.12 * Math.cos(th), -1 + 0.12 * Math.sin(th)]; });
    CarteChamp.lignes(sol, H, departs, { ds: 0.03, n: 600 });
    CarteChamp.point(c, [0, -1], 4, "c-warn");
    Plot.el("line", { x1: 0, x2: 640, y1: c.sy(0), y2: c.sy(0), class: "stroke bold" }, c.layer(paroi === "isolante" ? "c-label" : "c-tint"));
    const unite = G / (4 * Math.PI * K_CALCAIRE * a);
    const biLaine = ES.biot(K_LAINE / LAINE, a, K_CALCAIRE), biAir = ES.biot(H_AIR, a, K_CALCAIRE);
    $("aread").textContent = metres(a);
    $("vbi2").textContent = F.num(paroi === "isolante" ? biLaine : biAir, 2);
    $("fbi2").textContent = t(paroi === "isolante" ? "fig.f.bi.isolante" : "fig.f.bi.fixe");
    $("vdessus").textContent = F.si(S.surface(0), "K");
    $("fdessus").innerHTML = t(paroi === "isolante" ? "fig.f.dessus.isolante" : "fig.f.dessus.fixe", { u: F.si(2 * unite, "K") });
    $("vmi").textContent = F.si(S.T(0, -a / 2), "K");
    $("vsortie").textContent = pct(paroi === "isolante" ? 0 : 1);
    $("fsortie").textContent = t(paroi === "isolante" ? "fig.f.sortie.isolante" : "fig.f.sortie.fixe");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.p === paroi)));
  }
  seg.querySelectorAll("button").forEach(x => { x.onclick = () => { paroi = x.dataset.p; draw(); }; });
  asl.oninput = draw; draw();
  $("sys2").innerHTML = t("sys2.body", { G: F.si(G, "W"), K: F.si(K_CALCAIRE, "W·m⁻¹·K⁻¹"), e: metres(LAINE), Kl: F.si(K_LAINE, "W·m⁻¹·K⁻¹"),
    h: F.si(H_AIR, "W·m⁻²·K⁻¹"), bil: F.num(ES.biot(K_LAINE / LAINE, 0.5, K_CALCAIRE), 2), bia: F.num(ES.biot(H_AIR, 0.5, K_CALCAIRE), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fourier", 1822, "idea"], ["kennelly", 1893, "use"], ["cei", 1969, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cables"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["image", "c"], ["signe", "a"], ["dessus", "d"], ["epaisseur", "b"], ["biot", "c"], ["flux", "a"], ["coaxial", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 122 });
})();
</script>
