<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- une colonne isotherme, gaz par gaz, contre l'atmosphère type ---------- */
(() => {
  const S = Statistique, Fl = Fluides, svg = $("atm"), st = $("tk"), sz = $("zk"), ZMAX = 150e3, YMIN = 1e-12;
  const GAZ = [["H2", "c-tint"], ["He", "c-ok"], ["N2", "c-warn"], ["O2", "c-ko"]];
  const iso = [];                                                  // ISO 2533 number density n ∝ p/T, up to 80 km geometric
  for (let z = 0; z <= 80e3; z += 1e3) { const a = Fl.atmStandard(Fl.geopotentielle(z)); iso.push([z, (a.p / a.T) / (Fl.ISO2533.p0 / Fl.ISO2533.T0)]); }
  function draw() {
    const T = +st.value, z = 1e3 * +sz.value;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44, l: 56 },
      x: { domain: [0, ZMAX / 1e3], label: t("atm.x") }, y: { scale: "log", domain: [YMIN, 1], label: t("atm.y") } });
    for (const [g, cls] of GAZ) {
      const pts = []; for (let i = 0; i <= 150; i++) { const zz = ZMAX * i / 150, n = S.nSurN0(zz, S.M[g], T); if (n < YMIN) break; pts.push([o.x(zz / 1e3), o.y(n)]); }
      Plot.el("path", { d: Plot.path(pts), class: "stroke " + cls }, o.g);
    }
    Plot.el("path", { d: Plot.path(iso.map(([zz, n]) => [o.x(zz / 1e3), o.y(n)])), class: "ref" }, o.g);
    Plot.el("line", { x1: o.x(z / 1e3), x2: o.x(z / 1e3), y1: o.y(YMIN), y2: o.y(1), class: "grid" }, o.g);
    const H = Fl.hauteurEchelle(T, { M: S.M.N2 }), sep = S.separation(z, T), n = S.nSurN0(z, S.M.N2, T);
    $("tkv").innerHTML = F.kelvin(T);
    $("zkv").textContent = F.si(z, "m", { sig: 3 });
    $("vhn2").textContent = F.si(H, "m", { sig: 3 });
    $("fhn2").textContent = t("atm.f.hn2", { h: F.si(Fl.hauteurEchelle(T, { M: S.M.H2 }), "m", { sig: 3 }) });
    $("vn").textContent = F.sci(n, 2);
    $("fn").textContent = t("atm.f.n", { e: F.num(z / H, 3) });
    $("vo2").textContent = F.qty(F.num(100 * sep.x.O2, 3), "%");
    $("var").textContent = F.qty(F.num(100 * sep.x.Ar, 2), "%");
    const zt = Math.min(z, 80e3), Tiso = Fl.atmStandard(Fl.geopotentielle(zt)).T, R_T = Fl.ISO2533.r;
    $("sys").innerHTML = t("sys.inner", { z: F.si(z, "m", { sig: 3 }), T: F.kelvin(T), g: F.num(100 * (1 - (R_T / (R_T + z)) ** 2), 2),
      zt: F.si(zt, "m", { sig: 3 }), Tiso: F.kelvin(Tiso), dT: F.num(100 * Math.abs(Tiso - T) / T, 2),
      avis: t(z <= 90e3 ? "sys.melange" : "sys.diffusion") });
  }
  st.oninput = sz.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["perier", 1648, "experiment"], ["halley", 1686, "idea"], ["perrin", 1909, "experiment"], ["iso", 1975, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["altimetre", "atmtype"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["isotherme", "c"], ["hauteur", "a"], ["lourd", "d"], ["melange", "b"], ["chaud", "a"], ["tranche", "c"], ["g", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 401 });
})();
</script>
