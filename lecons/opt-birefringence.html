    <div class="eq"><math display="block"><mi>φ</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi><mo>(</mo><msub><mi>n</mi><mo>∥</mo></msub><mo>−</mo><msub><mi>n</mi><mo>⊥</mo></msub><mo>)</mo><mi>e</mi></mrow><mi>λ</mi></mfrac></math></div>

    <div class="eq"><math display="block"><mfrac><msub><mi>I</mi><mi data-i18n="eq.sortie"></mi></msub><msub><mi>I</mi><mn>0</mn></msub></mfrac><mo>=</mo><msup><mi data-i18n="eq.sin"></mi><mn>2</mn></msup><mo>(</mo><mn>2</mn><mi>α</mi><mo>)</mo><mspace width="0.1em"/><msup><mi data-i18n="eq.sin"></mi><mn>2</mn></msup><mo>(</mo><mfrac><mi>φ</mi><mn>2</mn></mfrac><mo>)</mo></math></div>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>

    <p data-i18n-html="s3.p1"></p>
    <figure class="chart">
      <svg class="fig" id="profondeur" viewBox="0 0 640 150" role="img" data-i18n-attr="aria-label:fig.aria.profondeur"></svg>
      <svg class="fig" id="bande" viewBox="0 0 640 96" role="img" data-i18n-attr="aria-label:fig.aria.bande"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.etat"></span><span class="c-warn" data-i18n="fig.legend.axe"></span><span class="c-label" data-i18n="fig.legend.analyseur"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" role="group" id="mat">
            <button type="button" data-m="quartz" data-i18n="fig.quartz"></button>
            <button type="button" data-m="calcite" data-i18n="fig.calcite"></button>
          </div>
          <div class="seg" role="group" id="ana">
            <button type="button" data-m="croises" data-i18n="fig.croises"></button>

          </div>

            <input id="se" type="range" min="0" max="60" step="0.01" value="15.11"></div>
          <div class="ctl"><div class="row"><label for="sa" data-i18n="fig.alpha"></label><output id="sar" for="sa"></output></div>
            <input id="sa" type="range" min="0" max="90" step="1" value="45"></div>
          <div class="ctl"><div class="row"><label for="sl" data-i18n="fig.lambda"></label><output id="slr" for="sl"></output></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/opt-birefringence.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/optique-geometrique.js"></script>
<script src="/racoon/optique-ondulatoire.js"></script>
<script src="/racoon/couleurs-optiques.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptOnd, DEG = Math.PI / 180, nm = 1e-9, um = 1e-6;
/* n∥ − n⊥ at 589 nm for a plate cut parallel to the optic axis: E along the axis sees n_e, across it n_o */
const MAT = { quartz: 1.5534 - 1.5443, calcite: 1.4864 - 1.6584 };
const pct = x => F.qty(F.num(100 * x, 3), "%");

/* ---------- une lame entre deux polariseurs : l'état le long de la lame, la teinte en lumière blanche ---------- */
(() => {
  const prof = $("profondeur"), bande = $("bande"), se = $("se"), sa = $("sa"), sl = $("sl"), mat = $("mat"), ana = $("ana");
  let m = "quartz", an = "croises", cache = "", gain = 1;
  const rgb = lin => "rgb(" + lin.map(v => Math.round(255 * OptiqueGeometrique.gammaSRGB(Math.max(0, v * gain)))).join(" ") + ")";
  const EMAX = 60;
  function echelle(dn, alpha) {                                     // the tints of thicknesses 0 to 60 µm, for this material and analyser
    const key = m + an + alpha;
    if (key === cache) return;
    cache = key; bande.innerHTML = "";
    const N = 160, W = 520;
    const cs = Array.from({ length: N }, (_, i) => CouleursOptiques.couleurLame(dn, (i + 0.5) * EMAX * um / N, { alpha, analyseur: an }));
    gain = 1 / Math.max(1e-9, ...cs.map(c => Math.max(...c.lin)));
    cs.forEach((c, i) => Plot.el("rect", { x: 56 + i * W / N, y: 8, width: W / N + 0.6, height: 44, fill: rgb(c.lin) }, bande));
    [0, 15, 30, 45, 60].forEach(e => { Plot.el("text", { x: 56 + e / EMAX * W, y: 70, "text-anchor": "middle", class: "tick" }, bande).textContent = F.num(e, 3); });
    Plot.el("text", { x: 56 + W / 2, y: 90, "text-anchor": "middle", class: "label" }, bande).textContent = t("fig.bande.x");
    Plot.el("g", { id: "curseur" }, bande);
  }
  /* one ellipse of E, centred at (x, y), radius r for unit amplitude */
  const dessine = (J, x, y, r, cls) => {
    const e = O.versEllipse(J, 1e-3), pts = Array.from({ length: 73 }, (_, k) => e.point(2 * Math.PI * k / 72));
    Plot.el("path", { d: Plot.path(pts.map(([a, b]) => [x + r * a, y - r * b])), class: cls }, prof);
    if (e.sens !== 0) { const [a, b] = e.point(0), [c, d] = e.point(0.35);
      Plot.fleche(prof, [x + r * a, y - r * b], [x + r * c, y - r * d], { cls: "c-tint", tete: 7 }); }
    return e;
  };
  function draw() {
    const dn = MAT[m], e = +se.value * um, alpha = +sa.value * DEG, lambda = +sl.value * nm;
    echelle(dn, alpha);
    const J0 = O.rectiligne(0), phi = O.dephasageLame(dn, e, lambda);
    prof.innerHTML = "";
    /* nine depths, from the entrance face to the exit face, like a cut along the beam */
    for (let k = 0; k <= 8; k++) {
      const x = 44 + k * 69, y = 70, J = O.lame(J0, alpha, phi * k / 8);
      Plot.el("line", { x1: x - 30 * Math.cos(alpha), y1: y + 30 * Math.sin(alpha), x2: x + 30 * Math.cos(alpha), y2: y - 30 * Math.sin(alpha), class: "stroke thin dash c-warn" }, prof);
      dessine(J, x, y, 26, "stroke c-tint");
      Plot.el("text", { x, y: 122, "text-anchor": "middle", class: "tick" }, prof).textContent = F.num(+se.value * k / 8, 3);
    }
    Plot.el("text", { x: 320, y: 142, "text-anchor": "middle", class: "label" }, prof).textContent = t("fig.prof.x");
    /* the exit state against the analyser */
    const Js = O.lame(J0, alpha, phi), es = O.versEllipse(Js, 1e-3);
    const ta = an === "croises" ? Math.PI / 2 : 0, out = O.polariseur(Js, ta), T = Cx.abs2(out.x) + Cx.abs2(out.y);
    Plot.el("line", { x1: 596 - 34 * Math.cos(ta), y1: 70 + 34 * Math.sin(ta), x2: 596 + 34 * Math.cos(ta), y2: 70 - 34 * Math.sin(ta), class: "stroke bold c-label" }, prof);
    const cur = $("curseur"); cur.innerHTML = "";
    const xc = 56 + Math.min(e / um, EMAX) / EMAX * 520, c = CouleursOptiques.couleurLame(dn, e, { alpha, analyseur: an });
    Plot.el("line", { x1: xc, x2: xc, y1: 4, y2: 56, class: "stroke bold c-label" }, cur);
    Plot.el("rect", { x: 592, y: 8, width: 44, height: 44, rx: 6, fill: rgb(c.lin) }, cur);
    Plot.el("rect", { x: 592, y: 8, width: 44, height: 44, rx: 6, class: "stroke thin c-label-2" }, cur);
    $("ser").textContent = F.si(e, "m", { prefix: "µ", sig: 3 });
    se.setAttribute("aria-valuetext", F.si(e, "m", { prefix: "µ", sig: 3 }));
    $("sar").textContent = F.qty(F.num(alpha / DEG, 3), "°");
    $("slr").textContent = F.si(lambda, "m", { prefix: "n", sig: 3 });
    const tours = Math.abs(phi) / (2 * Math.PI);
    $("vphi").textContent = F.qty(F.num(Math.abs(phi) / DEG, 4), "°");
    $("fphi").textContent = t("fig.f.phi", { n: F.num(tours, 3), dn: F.num(dn, 3) });
    $("vetat").textContent = t("fig.etat." + es.nature);
    $("fetat").textContent = t("fig.f.etat", { r: F.num(es.rapport, 2) });
    $("vT").textContent = pct(T);
    $("fT").textContent = t("fig.f.T", { Y: pct(c.Y) });
    mat.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === m)));
    ana.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === an)));
  }
  mat.querySelectorAll("button").forEach(x => x.onclick = () => { m = x.dataset.m; draw(); });
  ana.querySelectorAll("button").forEach(x => x.onclick = () => { an = x.dataset.m; draw(); });
  se.oninput = sa.oninput = sl.oninput = draw; draw();
})();

/* ---------- le système décrit : une lame de quartz quart d'onde ---------- */
(() => {
  const dn = MAT.quartz, e4 = O.epaisseurLame(dn, 550 * nm, 0.25), phi450 = O.dephasageLame(dn, e4, 450 * nm), phi650 = O.dephasageLame(dn, e4, 650 * nm);
  const coh = (550 * nm) ** 2 / (300 * nm), Gc = Math.abs(MAT.calcite) * 200 * um;
  $("sys1").innerHTML = t("sys1.body", { rel: pct(dn / 1.5443), e4: F.si(e4, "m", { prefix: "µ", sig: 3 }), p450: F.qty(F.num(phi450 / DEG, 3), "°"),
    p650: F.qty(F.num(phi650 / DEG, 3), "°"), coh: F.si(coh, "m", { prefix: "µ", sig: 2 }), G: F.si(dn * 30 * um, "m", { prefix: "µ", sig: 2 }),
    Gc: F.si(Gc, "m", { prefix: "µ", sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bartholin", 1669, "experiment"], ["huygens", 1690, "idea"], ["malus", 1808, "experiment"], ["brewster", 1816, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lcd", "photoelasticite"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cubique", "d"], ["quart", "a"], ["deuxquarts", "c"], ["eteint", "b"], ["couleur", "d"], ["complementaire", "a"], ["epais", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 333 });
})();
</script>
