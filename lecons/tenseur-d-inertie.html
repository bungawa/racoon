<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const deg = Math.PI / 180, T = Tenseurs;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const onTheme = f => { f(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", f); new MutationObserver(f).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] }); };

/* ---------- un pavé d'acier qui tourne autour d'un axe imposé ---------- */
(() => {
  const RHO = 7850, W = 10;                                                 // kg·m⁻³, rad·s⁻¹
  const SOLIDS = { brique: [0.20, 0.10, 0.05], cube: [0.10, 0.10, 0.10], plaque: [0.20, 0.20, 0.02] };   // edges a, b, c along x, y, z (m)
  let solid = "brique", pivot = "centre", view = null;
  const fmt = x => (Math.abs(x) < 5e-7 ? "0" : (x < 0 ? F.MINUS : "") + F.fix(Math.abs(x) * 1e3, 2));
  const mat = M => `<math display="block"><msub><mi>I</mi><mi>O</mi></msub><mo>=</mo><mrow><mo>(</mo><mtable>${M.map(r => `<mtr>${r.map(x => `<mtd><mn>${fmt(x)}</mn></mtd>`).join("")}</mtr>`).join("")}</mtable><mo>)</mo></mrow><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>3</mn></mrow></msup><mspace width="0.3em"/><mtext>${t("bx.unite")}</mtext></math>`;

  function state() {
    const [a, b, c] = SOLIDS[solid], m = RHO * a * b * c;
    const IG = T.inertiePave(m, a, b, c), d = pivot === "centre" ? [0, 0, 0] : [a / 2, b / 2, c / 2];   // G seen from the pivot O
    const IO = T.huygens(IG, m, d);
    const th = +$("wt").value * deg, ph = +$("wp").value * deg;
    const w = [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)].map(x => x * W);
    const L = T.appliquer(IO, w);
    return { a, b, c, m, d, IO, w, L, p: T.propres(IO) };
  }
  function upd() {
    Object.keys(SOLIDS).forEach(s => $("s-" + s).setAttribute("aria-pressed", String(s === solid)));
    ["centre", "coin"].forEach(p => $("p-" + p).setAttribute("aria-pressed", String(p === pivot)));
    const s = state();
    $("wtv").textContent = F.fix(+$("wt").value, 1) + "°";
    $("wpv").textContent = (+$("wp").value < 0 ? F.MINUS : "") + F.fix(Math.abs(+$("wp").value), 1) + "°";
    $("mat").innerHTML = mat(s.IO);
    $("vprop").textContent = s.p.valeurs.map(x => F.fix(x * 1e3, 2)).join(" ; ");
    $("vang").textContent = F.fix(T.angle(s.w, s.L) / deg, 1) + "°";
    $("vec").textContent = F.si(T.energieRotation(s.IO, s.w), "J", { sig: 3 });
    const G = Math.hypot(...T.vectoriel(s.w, s.L));
    $("vcouple").textContent = G < 1e-9 ? F.qty("0", "N·m") : F.qty(F.num(G, 3), "N·m");
    if (view) view(s);
  }
  Object.keys(SOLIDS).forEach(s => $("s-" + s).onclick = () => { solid = s; upd(); });
  ["centre", "coin"].forEach(p => $("p-" + p).onclick = () => { pivot = p; upd(); });
  [0, 1, 2].forEach(k => $("al-" + k).onclick = () => {
    let u = state().p.axes[k]; if (u[2] < 0) u = u.map(x => -x);            // the same axis, pointing up
    $("wt").value = Math.acos(Math.max(-1, Math.min(1, u[2]))) / deg;
    $("wp").value = Math.atan2(u[1], u[0]) / deg;
    upd();
  });
  $("wt").oninput = $("wp").oninput = upd;

  const canvas = $("box"), read = $("boxread");
  if (!self.THREE) { read.textContent = t("bx.offline"); upd(); return; }
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, 4 / 3, 0.01, 10);
  cam.up.set(0, 0, 1); cam.position.set(0.55, 0.42, 0.35);
  const ctl = new THREE.OrbitControls(cam, canvas); ctl.enableDamping = true;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(1, 0.6, 1.4); scene.add(sun);
  const body = new THREE.Group(); scene.add(body);                          // turns about ω; its origin is the pivot O
  const boxMat = new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.3, transparent: true, opacity: 0.85 });
  const box = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), boxMat); body.add(box);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), new THREE.LineBasicMaterial()); box.add(edges);
  const axMat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.7 });
  const principal = new THREE.LineSegments(new THREE.BufferGeometry(), axMat); body.add(principal);
  const arrW = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(), 0.25, 0x007aff, 0.03, 0.018);
  const arrL = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(), 0.25, 0xff9500, 0.03, 0.018);
  scene.add(arrW, arrL);
  const axisLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineDashedMaterial({ dashSize: 0.01, gapSize: 0.008 })); scene.add(axisLine);
  onTheme(() => { boxMat.color.set(css("--t-solide")); edges.material.color.set(css("--label").slice(0, 7)); axMat.color.set(css("--label").slice(0, 7));
    axisLine.material.color.set(css("--tint")); arrW.setColor(new THREE.Color(css("--tint"))); arrL.setColor(new THREE.Color(css("--warn"))); });
  let S = null, phase = 0, Lmax = 1;
  const wHat = new THREE.Vector3(), q = new THREE.Quaternion();
  view = s => {
    S = s;
    box.scale.set(s.a, s.b, s.c); box.position.set(...s.d);
    const pts = []; s.p.axes.forEach(u => { const v = new THREE.Vector3(...u).multiplyScalar(0.16); pts.push(v.clone().negate(), v); });
    principal.geometry.setFromPoints(pts);
    wHat.set(...s.w).normalize();
    axisLine.geometry.setFromPoints([wHat.clone().multiplyScalar(-0.3), wHat.clone().multiplyScalar(0.3)]); axisLine.computeLineDistances();
    arrW.setDirection(wHat); arrW.setLength(0.25, 0.03, 0.018);
    Lmax = Math.max(...s.p.valeurs) * 10;
    read.textContent = t("bx.read", { m: F.si(s.m, "kg", { sig: 3 }) });
  };
  function resize() { const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); cam.aspect = r.width / r.height; cam.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(canvas); resize();
  let visible = true, last = performance.now(); new IntersectionObserver(e => visible = e[0].isIntersecting).observe(canvas);
  (function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min(0.05, ((now || last) - last) / 1000); last = now || last;
    if (!visible || !S) return;
    if (!reduce) phase += dt * 0.8;                                          // shown slowed down: 0,8 rad·s⁻¹ instead of 10
    q.setFromAxisAngle(wHat, phase); body.quaternion.copy(q);
    /* L in the lab: the body turned by the phase carries its tensor, L = Q I Qᵀ ω (it sweeps a cone about ω) */
    const L = new THREE.Vector3(...S.L).applyQuaternion(q);
    arrL.setDirection(L.clone().normalize()); arrL.setLength(0.25 * L.length() / Lmax, 0.03, 0.018);
    ctl.update(); renderer.render(scene, cam);
  })();
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["huygens", 1673, "idea"], ["euler", 1765, "idea"], ["poinsot", 1834, "idea"], ["explorer", 1958, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["roue", "satellite", "cao"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["plus", "a"], ["parallele", "c"], ["energie", "b"], ["cube", "d"], ["coin", "a"], ["roue", "b"], ["explorer", "d"], ["haltere", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 314 });
})();
