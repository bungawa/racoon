<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synthèse de l'ammoniac</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-solutions" data-i18n="monde.chim-solutions"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-industrie-minerale" data-i18n="etape.chim-industrie-minerale"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n-html="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/deplacement-d-equilibre" data-i18n="tag.prereq"></a>
      <a class="chip plain" href="/racoon/lecons/loi-d-arrhenius" data-i18n="tag.prereq2"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq" data-i18n-html="eq.bilan"></div>
    <p class="validite" data-i18n-html="val.bilan"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="list keyed" id="nombres"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq" data-i18n-html="eq.quotient"></div>
    <p class="validite" data-i18n-html="val.quotient"></p>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq" data-i18n-html="eq.vitesse"></div>
    <p class="validite" data-i18n-html="val.vitesse"></p>
    <p data-i18n-html="s3.p2"></p>
    <figure class="chart">
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="pres" data-i18n="fig.p"></label><output id="presv" for="pres"></output></div>
            <input id="pres" type="range" min="50" max="300" step="10" value="200"></div>
          <div class="ctl"><div class="row"><label for="da" data-i18n="fig.da"></label><output id="dav" for="da"></output></div>
            <input id="da" type="range" min="-1" max="1" step="0.05" value="0"></div>
        </div>
      </div>
      <svg class="fig" id="passe" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.leg.passe"></span><span class="c-label" data-i18n="fig.leg.eq"></span><span class="c-warn" data-i18n="fig.leg.opt"></span></div>
      <div class="stats">
        <div class="stat"><span class="k" data-i18n="fig.k.T"></span><span class="v" id="vT"></span><span class="f" id="fT"></span></div>
        <div class="stat"><span class="k" data-i18n="fig.k.X"></span><span class="v" id="vX"></span><span class="f" id="fX"></span></div>
        <div class="stat"><span class="k" data-i18n="fig.k.nh3"></span><span class="v" id="vN"></span><span class="f" data-i18n="fig.f.nh3"></span></div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="list keyed" id="choix"></div>
    <div class="box rem"><b data-i18n="s4.rem.title"></b>
      <p data-i18n-html="s4.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n-html="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/synthese-de-l-ammoniac.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/chim-solutions.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions, H = C.Industrie, BAR = 1e5;
const keyed = (id, k, ids) => { const txt = textOf(k, ids); $(id).innerHTML = ids.map(i => `<div><span class="k">${txt[i].k}</span><span>${txt[i].v}</span></div>`).join(""); };
keyed("nombres", "s1.nombres", ["gaz", "da", "qk"]);
keyed("choix", "s4.choix", ["T", "p", "boucle", "lits"]);

/* ---------- §3 : un passage dans le réacteur ---------- */
(() => {
  const T1 = 550, T2 = 900, pct = v => F.qty(F.fix(100 * v, 1), "%");
  function draw() {
    const p = +$("pres").value * BAR, Da = Math.pow(10, +$("da").value), o = { Da }, svg = $("passe");
    $("presv").textContent = F.si(p, "Pa");
    $("dav").textContent = t("fig.daV", { k: F.num(Da, 2) });
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, x: { domain: [T1, T2], label: t("fig.ax.x") },
      y: { domain: [0, 100], label: t("fig.ax.y"), fmt: v => F.fix(v, 0) } });
    const Ts = Array.from({ length: 71 }, (_, k) => T1 + (T2 - T1) * k / 70), s = Ts.map(T => H.passage(T, p, o));
    Plot.el("path", { d: Plot.path(Ts.map((T, k) => [x(T), y(100 * s[k].Xeq)])), class: "stroke dash c-label" }, g);
    Plot.el("path", { d: Plot.path(Ts.map((T, k) => [x(T), y(100 * s[k].X)])), class: "stroke bold c-tint" }, g);
    const op = H.optimum(p, o, [T1, T2]);
    Plot.el("line", { x1: x(op.T), x2: x(op.T), y1: y(0), y2: y(100), class: "ref" }, g);
    Plot.el("circle", { cx: x(op.T), cy: y(100 * op.X), r: 5, class: "fill c-warn" }, g);
    $("vT").innerHTML = F.kelvin(op.T);
    $("fT").textContent = t("fig.f.T");
    $("vX").textContent = pct(op.X);
    $("fX").textContent = t("fig.f.X", { e: pct(op.Xeq) });
    $("vN").textContent = pct(2 * op.X / (4 - 2 * op.X));
  }
  $("pres").oninput = $("da").oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["haber", 1909, "experiment"], ["oppau", 1913, "use"], ["nobelHaber", 1918, "idea"], ["nobelBosch", 1931, "idea"], ["ruthenium", 1992, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["engrais", "energie", "usine"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["froid", "c"], ["chaud", "a"], ["optimum", "d"], ["catalyseur", "b"], ["pression", "a"], ["recyclage", "c"], ["lits", "d"], ["purge", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1913 });
})();
</script>
</body>
</html>
