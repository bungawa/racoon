<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptOnd, nm = 1e-9, mm = 1e-3;

/* ---------- le bord d'un écran : spirale de Cornu et profil d'intensité ---------- */
(() => {
  const cornu = $("cornu"), profil = $("profil"), sx = $("sx"), ss = $("ss"), sl = $("sl");
  const spirale = O.cornu(-8, 8, 1600);
  function draw() {
    const x = +sx.value * mm, s = +ss.value, l = +sl.value * nm, b = O.bordEcran({ x, lambda: l, s });
    /* the spiral, square scales: the point of the edge is (C(−u), S(−u)) = (−C(u), −S(u)); the sum runs to (½, ½) */
    cornu.innerHTML = "";
    const P = Plot.axes(cornu, { fmt: F, w: 640, h: 360, pad: { l: 166, r: 166 }, x: { domain: [-0.9, 0.9], label: t("fig.cornu.x") }, y: { domain: [-0.9, 0.9], label: t("fig.cornu.y") } });
    Plot.el("path", { d: Plot.path(spirale.map(([c, v]) => [P.x(c), P.y(v)])), class: "stroke thin c-label-2" }, P.g);
    const utile = O.cornu(-b.u, 8, 800);
    Plot.el("path", { d: Plot.path(utile.map(([c, v]) => [P.x(c), P.y(v)])), class: "curve" }, P.g);
    Plot.fleche(P.g, [P.x(-b.C), P.y(-b.S)], [P.x(0.5), P.y(0.5)], { cls: "c-warn" });
    Plot.el("circle", { cx: P.x(0), cy: P.y(0), r: 3, class: "dot" }, P.g);
    Plot.el("text", { x: P.x(0) + 8, y: P.y(0) + 16, class: "tick" }, P.g).textContent = t("fig.pt.d");
    Plot.el("text", { x: P.x(0.5) + 42, y: P.y(0.5) + 4, class: "tick" }, P.g).textContent = t("fig.pt.zp");
    Plot.el("text", { x: P.x(-0.5) - 52, y: P.y(-0.5) + 4, class: "tick" }, P.g).textContent = t("fig.pt.zm");
    Plot.el("text", { x: P.x(-b.C) - 18, y: P.y(-b.S) + 4, class: "tick" }, P.g).textContent = t("fig.pt.b");
    /* the intensity across the edge of the shadow */
    profil.innerHTML = "";
    const xs = Array.from({ length: 451 }, (_, i) => -1.5 + i * 0.01);
    const Q = Plot.axes(profil, { fmt: F, w: 640, h: 240, pad: { l: 56 }, x: { domain: [-1.5, 3], label: t("fig.xaxis") }, y: { domain: [0, 1.5], label: t("fig.yaxis") } });
    Plot.el("line", { x1: Q.x(0), x2: Q.x(0), y1: Q.y(0), y2: Q.y(1.5), class: "stroke thin dash c-label-2" }, Q.g);
    Plot.el("path", { d: Plot.path([[Q.x(-1.5), Q.y(0)], [Q.x(0), Q.y(0)], [Q.x(0), Q.y(1)], [Q.x(3), Q.y(1)]]), class: "stroke thin dash c-warn" }, Q.g);
    Plot.el("path", { d: Plot.path(xs.map(v => [Q.x(v), Q.y(O.bordEcran({ x: v * mm, lambda: l, s }).I)])), class: "curve" }, Q.g);
    Plot.el("circle", { cx: Q.x(+sx.value), cy: Q.y(b.I), r: 5, class: "dot" }, Q.g);
    $("sxr").textContent = F.si(x, "m", { prefix: "m", sig: 3 });
    $("ssr").textContent = F.si(s, "m", { sig: 3 });
    $("slr").textContent = F.si(l, "m", { prefix: "n", sig: 3 });
    $("vu").textContent = F.num(b.u, 3);
    $("fu").textContent = t(b.u < 0 ? "fig.f.ombre" : "fig.f.lumiere");
    $("vi").textContent = F.num(b.I, 3);
    $("fi").textContent = t("fig.f.i", { a: F.num(Math.sqrt(2 * b.I), 3) });
    $("ve").textContent = F.si(b.echelle, "m", { prefix: "m", sig: 3 });
    $("fe").textContent = t("fig.f.e", { x: F.si(1.2172 * b.echelle, "m", { prefix: "m", sig: 3 }) });
  }
  sx.oninput = ss.oninput = sl.oninput = draw; draw();
})();

/* ---------- le système décrit : un bord de lame de rasoir éclairé par un laser, puis par une lampe ---------- */
(() => {
  const l = 633 * nm, s = 1, b = O.bordEcran({ x: 0, lambda: l, s }), lampe = 0.01 / 2;
  $("sys1").innerHTML = t("sys1.body", { l: F.si(l, "m", { prefix: "n", sig: 3 }), s: F.si(s, "m"), e: F.si(b.echelle, "m", { prefix: "m", sig: 2 }),
    xm: F.si(1.2172 * b.echelle, "m", { prefix: "m", sig: 2 }), a: F.si(1.2172 * b.echelle / s, "rad", { prefix: "m", sig: 2 }),
    al: F.si(lampe, "rad", { prefix: "m", sig: 2 }), fl: F.si(lampe * s, "m", { prefix: "m", sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["grimaldi", 1665, "experiment"], ["fresnel", 1818, "idea"], ["cornu", 1874, "idea"], ["kirchhoff", 1882, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["faisceau"], uses = textOf("uses.items", USES);
  const u = 0.6 * Math.SQRT2, I = O.bord(u).I;
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${t("uses.items")[id].text.replace("{u}", F.num(u, 2)).replace("{I}", F.num(I, 3)).replace("{dB}", F.num(10 * Math.log10(I), 1))}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["sources", "b"], ["quart", "c"], ["depasse", "a"], ["echelle", "d"], ["ombre", "b"], ["lampe", "a"], ["radio", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 306 });
})();
</script>
