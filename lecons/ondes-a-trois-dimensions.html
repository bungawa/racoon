<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §48-6 : une onde plane sonore arrive sur cinq microphones alignés (air à 293,15 K) ---------- */
(() => {
  const O = self.Ondes, c = O.celerite("air", 293.15), XS = [0, 0.1, 0.2, 0.3, 0.4];
  const X0 = -0.2, X1 = 0.6, Y1 = 0.5, W = 640, H = 412;
  /* la normale k̂ = (sin θ, −cos θ) : l'onde descend vers la ligne y = 0 ; une crête est la droite k̂·r = ct − nλ */
  const segment = (nx, ny, s) => {
    const pts = [];
    const add = (x, y) => { if (x >= X0 - 1e-9 && x <= X1 + 1e-9 && y >= -1e-9 && y <= Y1 + 1e-9) pts.push([x, y]); };
    if (Math.abs(ny) > 1e-12) { add(X0, (s - nx * X0) / ny); add(X1, (s - nx * X1) / ny); }
    if (Math.abs(nx) > 1e-12) { add((s - ny * 0) / nx, 0); add((s - ny * Y1) / nx, Y1); }
    return pts.length >= 2 ? [pts[0], pts.reduce((b, p) => Math.hypot(p[0] - pts[0][0], p[1] - pts[0][1]) > Math.hypot(b[0] - pts[0][0], b[1] - pts[0][1]) ? p : b, pts[1])] : null;
  };
  function upd() {
    const th = +$("th").value * Math.PI / 180, f = +$("fq").value, w = 2 * Math.PI * f, lam = c / f, kk = w / c;
    const nx = Math.sin(th), ny = -Math.cos(th);
    const tt = +$("ph").value / f, T = O.retards(c, th, XS);
    const svg = $("fr"); svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: W, h: H, pad: { l: 56, r: 16, t: 12, b: 40 }, x: { domain: [X0, X1], label: t("fr.xaxis") }, y: { domain: [0, Y1], label: t("fr.yaxis") } });
    const sMin = Math.min(nx * X0, nx * X1) + Math.min(0, ny * Y1), sMax = Math.max(nx * X0, nx * X1) + Math.max(0, ny * Y1);
    for (let n = Math.floor((c * tt - sMax) / lam); n <= Math.ceil((c * tt - sMin) / lam); n++) {
      const sg = segment(nx, ny, c * tt - n * lam); if (!sg) continue;
      Plot.el("line", { x1: A.x(sg[0][0]), y1: A.y(sg[0][1]), x2: A.x(sg[1][0]), y2: A.y(sg[1][1]), class: "stroke c-tint" }, A.g);
      if (Math.abs(nx) > 1e-9) { const xc = (c * tt - n * lam) / nx; if (xc >= X0 && xc <= X1) Plot.el("circle", { cx: A.x(xc), cy: A.y(0), r: 5, class: "fill c-warn" }, A.g); }
    }
    XS.forEach(x => Plot.el("rect", { x: A.x(x) - 4, y: A.y(0) - 4, width: 8, height: 8, class: "fill c-label-2" }, A.g));
    const C0 = [0.2, 0.36], L0 = 0.1;
    Plot.fleche(A.g, [A.x(C0[0]), A.y(C0[1])], [A.x(C0[0] + L0 * nx), A.y(C0[1] + L0 * ny)], { cls: "c-label-2" });
    $("thv").textContent = F.num(+$("th").value, 3) + " °"; $("fqv").textContent = F.si(f, "Hz");
    $("phv").textContent = F.si(tt, "s");
    $("vla").textContent = F.si(lam, "m"); $("fla").textContent = t("fr.f.lambda", { c: F.si(c, "m·s⁻¹"), k: F.si(kk, "m⁻¹") });
    const s = Math.abs(nx);
    $("vtr").textContent = s > 1e-9 ? F.si(c / s, "m·s⁻¹") : t("fr.inf");
    $("ftr").textContent = s > 1e-9 ? t("fr.f.trace", { l: F.si(lam / s, "m") }) : t("fr.f.trace.inf");
    $("vdt").textContent = F.si(T[1] - T[0], "s"); $("fdt").textContent = t("fr.f.dt", { a: F.num(O.directionArrivee(c, 0.1, T[1] - T[0]) * 180 / Math.PI, 3) });
    /* les cinq signaux : une impulsion (enveloppe gaussienne, quatre périodes environ) arrive à x sin θ/c */
    const mv = $("mi"); mv.innerHTML = "";
    const tl = -4 / f + Math.min(...T), tr = 4 / f + Math.max(...T), ts = Array.from({ length: 801 }, (_, i) => tl + (tr - tl) * i / 800);
    const B = Plot.axes(mv, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [1e3 * tl, 1e3 * tr], label: t("mi.xaxis") }, y: { domain: [-1, 9], label: t("mi.yaxis"), fmt: v => Number.isInteger(v / 2) && v >= 0 && v <= 8 ? F.num(v / 2 + 1, 1) : "" } });
    XS.forEach((x, i) => {
      const sig = u => Math.cos(w * u) * Math.exp(-((u * f / 1.5) ** 2)), y0 = 2 * i;
      Plot.el("path", { d: Plot.path(ts.map(u => [B.x(1e3 * u), B.y(y0 + 0.8 * sig(u - T[i]))])), class: "stroke thin c-tint" }, B.g);
      Plot.el("line", { x1: B.x(1e3 * T[i]), x2: B.x(1e3 * T[i]), y1: B.y(y0 - 0.9), y2: B.y(y0 + 0.9), class: "ref" }, B.g);
    });
  }
  ["th", "fq", "ph"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["euler", 1759, "idea"], ["klein", 1926, "idea"], ["higgs", 2012, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["infrasons", "barrette"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["scalaire", "c"], ["dispersion", "a"], ["trace", "d"], ["retard", "b"], ["normale", "a"], ["kg", "c"], ["masse", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 486 });
})();
