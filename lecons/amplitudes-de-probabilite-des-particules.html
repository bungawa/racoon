<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §48-5 : le paquet d'un électron libre ; l'énergie comptée avec ou sans mc² ---------- */
(() => {
  const O = self.Ondes, c = Constantes.c, me = Constantes.m_e, R = O.relationParticule(me);
  const REL = { totale: R.omega, cinetique: R.cinetique };
  let zero = "totale", cache = {};
  const paquetDe = (b, z) => { const key = b + z; if (!cache[key]) { const P = O.particule(me, { v: b * c }); cache = { [key]: { P, Q: O.paquet(P.k, P.k / 20, REL[z]) } }; } return cache[key]; };
  function upd() {
    const b = +$("bv").value, { P, Q } = paquetDe(b, zero), L = P.lambda;
    const tt = +$("tk").value * 50 * L / P.v, x0 = -10 * L, x1 = 60 * L, pm = 1e12;
    const xs = Array.from({ length: 1401 }, (_, i) => x0 + (x1 - x0) * i / 1400);
    const svg = $("pk"); svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 250, pad: { l: 52, b: 44 }, x: { domain: [x0 * pm, x1 * pm], label: t("pk.xaxis") }, y: { domain: [-1.2, 1.2], label: t("pk.yaxis") } });
    Plot.el("path", { d: Plot.path(xs.map(x => [A.x(x * pm), A.y(Q.enveloppe(x, tt))])), class: "stroke thin dash c-label-2" }, A.g);
    Plot.el("path", { d: Plot.path(xs.map(x => [A.x(x * pm), A.y(Q.chi(x, tt))])), class: "curve" }, A.g);
    const xg = P.v * tt, xp = Q.vphase * tt;
    Plot.el("line", { x1: A.x(xg * pm), x2: A.x(xg * pm), y1: A.y(-1.2), y2: A.y(1.2), class: "ref" }, A.g);
    if (xp >= x0 && xp <= x1) Plot.el("circle", { cx: A.x(xp * pm), cy: A.y(Q.chi(xp, tt)), r: 6, class: "fill c-label-2" }, A.g);
    $("bvv").textContent = t("pk.enc", { r: F.num(b, 2) }); $("tkv").textContent = F.si(tt, "s");
    $("vla").textContent = F.si(L, "m"); $("fla").textContent = t("pk.f.lambda", { T: F.si(P.T / Constantes.e, "eV") });
    $("vvp").textContent = t("pk.enc", { r: F.num(Q.vphase / c, 3) }); $("fvp").textContent = t(zero === "totale" ? "pk.f.vp.totale" : "pk.f.vp.cinetique");
    $("vvg").textContent = t("pk.enc", { r: F.num(Q.vgroupe / c, 3) }); $("fvg").textContent = t("pk.f.vg", { v: F.num(b, 2) });
    $("zero").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.z === zero)));
  }
  $("zero").querySelectorAll("button").forEach(x => x.onclick = () => { zero = x.dataset.z; upd(); });
  $("bv").oninput = upd; $("tk").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["broglie", 1924, "idea"], ["davisson", 1927, "experiment"], ["thomson", 1927, "experiment"], ["ruska", 1933, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["microscope", "neutrons"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["onde", "b"], ["groupe", "d"], ["phase", "a"], ["zero", "c"], ["lambda", "b"], ["invariant", "a"], ["lent", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 485 });
})();
