<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux;
const pct = (x, s) => F.qty(F.num(100 * x, s || 3), "%");

/* ---------- le système décrit : un transformateur de table, 230 V → 12 V, 50 VA ---------- */
(() => {
  const core = { N1: 800, U1: 230, f: 50, S: 1e-3, l: 0.2 }, N2 = 42, Sn = 50;
  const fer = OM.noyau(Object.assign({ mur: 5000 }, core)), air = OM.noyau(Object.assign({ mur: 1 }, core));
  const m = N2 / core.N1, I1n = Sn / core.U1;
  $("sys1").innerHTML = t("sys1.body", { U2: F.si(m * core.U1, "V"), m: F.num(m, 3), B: F.si(fer.Bmax, "T"), Imu: F.si(fer.Imu, "A"),
    I1: F.si(I1n, "A"), part: pct(fer.Imu / I1n, 2), air: F.si(air.Imu, "A") });
})();

/* ---------- rendement d'un transformateur de distribution de 400 kVA ---------- */
(() => {
  const Sn = 400e3, T2 = { P0: 387, Pk: 3250 }, T1 = { P0: 430, Pk: 4600 };
  const svg = $("trend"), sx = $("sx"), sk = $("sk");
  function draw() {
    const x = +sx.value / 100, k = +sk.value / 100;
    const r = OM.rendementTransfo(Object.assign({ Sn, x, cosphi: k }, T2)), r1 = OM.rendementTransfo(Object.assign({ Sn, x, cosphi: k }, T1));
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 64, b: 44 }, x: { domain: [0, 150], label: t("fig1.xaxis") }, y: { domain: [97, 100], label: t("fig1.yaxis") } });
    const xs = Array.from({ length: 150 }, (_, i) => (i + 1) / 100);
    for (const [L, cls] of [[T2, "curve"], [T1, "stroke c-warn"]]) {
      const pts = xs.map(v => [P.x(100 * v), P.y(Math.max(97, 100 * OM.rendementTransfo(Object.assign({ Sn, x: v, cosphi: k }, L)).eta))]);
      Plot.el("path", { d: Plot.path(pts), class: cls }, P.g);
    }
    if (x > 0) Plot.el("circle", { cx: P.x(100 * x), cy: P.y(Math.max(97, 100 * r.eta)), r: 5, class: "dot" }, P.g);
    $("sxr").textContent = pct(x, 3); $("skr").textContent = F.num(k, 2);
    $("veta").textContent = pct(r.eta, 4);
    $("feta").textContent = t("fig1.f.eta", { v: pct(r1.eta, 4) });
    $("vpertes").textContent = F.si(r.Pfer + r.Pcu, "W");
    $("fpertes").textContent = t("fig1.f.pertes", { fer: F.si(r.Pfer, "W"), cu: F.si(r.Pcu, "W") });
    $("vopt").textContent = pct(r.xOpt, 3);
    $("fopt").textContent = t("fig1.f.opt", { v: pct(r.etaMax, 4) });
  }
  sx.oninput = sk.oninput = draw; draw();
})();

/* ---------- transporter 10 MW sur une ligne de 5 Ω ---------- */
(() => {
  const P = 10e6, R = 5, svg = $("tline"), su = $("su"), sc = $("sc");
  const TENSIONS = [0.4e3, 1e3, 3e3, 10e3, 20e3, 63e3, 90e3, 150e3, 225e3, 400e3], Uof = s => TENSIONS[s];   // usual network voltages
  function draw() {
    const U = Uof(+su.value), k = +sc.value / 100, l = OM.ligne({ P, U, R, cosphi: k });
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 64, b: 44 }, x: { scale: "log", domain: [0.1, 1000], label: t("fig2.xaxis") }, y: { scale: "log", domain: [1e-4, 100], label: t("fig2.yaxis") } });
    /* drawn only where the drop R I/U stays under 20 %: beyond, the model no longer gives the loss */
    const us = Array.from({ length: 161 }, (_, i) => Math.pow(10, 4 * i / 160 - 1)).filter(u => OM.ligne({ P, U: 1e3 * u, R, cosphi: k }).chute <= 0.2);
    Plot.el("path", { d: Plot.path(us.map(u => [A.x(u), A.y(Math.max(1e-4, 100 * OM.ligne({ P, U: 1e3 * u, R, cosphi: k }).part))])), class: "curve" }, A.g);
    if (l.chute <= 0.2) Plot.el("circle", { cx: A.x(U / 1e3), cy: A.y(Math.max(1e-4, 100 * l.part)), r: 5, class: "dot" }, A.g);
    $("sur").textContent = F.si(U, "V"); $("scr").textContent = F.num(k, 2);
    $("vi").textContent = F.si(l.I, "A");
    $("fi").textContent = t("fig2.f.i", { P: F.si(P, "W"), R: F.si(R, "Ω") });
    $("vp").textContent = l.chute <= 0.2 ? pct(l.part, 3) : "–";
    $("fp").textContent = l.chute <= 0.2 ? t("fig2.f.p", { v: F.si(l.pertes, "W") }) : t("fig2.f.hors");
    $("vc").textContent = pct(l.chute, 3);
    $("fc").textContent = t("fig2.f.chute");
  }
  su.oninput = sc.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1831, "experiment"], ["zbd", 1885, "experiment"], ["stanley", 1886, "experiment"], ["goss", 1934, "idea"], ["ecoconception", 2015, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["reseau", "isolement"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["courant", "b"], ["vide", "c"], ["impedance", "a"], ["lamelles", "d"], ["optimum", "b"], ["tension", "a"], ["facteur", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 521 });
})();
</script>
