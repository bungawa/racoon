<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesurer le mouvement : temps et distance</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-mesurer" data-i18n="monde.mesurer"></a><span class="aux">›</span><a href="/racoon/etape?id=le-temps" data-i18n="etape.le-temps"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <span class="chip plain" data-i18n="tag.prereq"></span>
      <span class="chip plain" data-i18n="tag.duree"></span>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n="s1.p1"></p>
    <p data-i18n="s1.p2"></p>
    <blockquote class="thesis" data-i18n="s1.thesis"></blockquote>
    <p data-i18n="s1.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n="s2.p1"></p>
    <figure>
      <svg class="fig" id="ramp" viewBox="0 0 640 170" role="img" data-i18n-attr="aria-label:ramp.aria"></svg>
      <div class="panel">
        <label class="field"><span data-i18n="ramp.clock"></span>
          <select id="clock">
            <option value="pouls" data-i18n="ramp.opt.pouls"></option>
            <option value="eau" data-i18n="ramp.opt.eau"></option>
            <option value="pendule" data-i18n="ramp.opt.pendule"></option>
            <option value="parfaite" data-i18n="ramp.opt.parfaite"></option>
          </select></label>
        <div class="controls">
          <div class="ctl"><div class="row"><label for="alpha" data-i18n="ramp.alpha"></label><output id="alphav" for="alpha"></output></div>
            <input id="alpha" type="range" min="1" max="10" step="0.5" value="2"></div>
          <div class="ctl"><div class="row"><label for="irr" data-i18n="ramp.irr"></label><output id="irrv" for="irr"></output></div>
            <input id="irr" type="range" min="0" max="20" step="0.5" value="5"></div>
        </div>
        <div class="controls"><button class="btn tinted" type="button" id="go" data-i18n="ramp.go"></button></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="ramp.marks"></span><span class="v" id="nmarks"></span><span class="f" id="period"></span></div>
          <div class="stat"><span class="k" data-i18n="ramp.p"></span><span class="v" id="pfit"></span><span class="f" data-i18n="ramp.p.f"></span></div>
        </div>
        <p class="readout" id="ratios"></p>
      </div>
    </figure>
    <figure class="chart">
      <svg id="dk" role="img" data-i18n-attr="aria-label:chart.aria"></svg>
      <figcaption data-i18n="chart.caption"></figcaption>
    </figure>
    <div class="eq">
      <math display="block"><mi>d</mi><mo>∝</mo><msup><mi>t</mi><mn>2</mn></msup><mspace width="2em"></mspace><mfrac><msub><mi>d</mi><mi>k</mi></msub><msub><mi>d</mi><mn>1</mn></msub></mfrac><mo>=</mo><msup><mi>k</mi><mn>2</mn></msup></math>
      
    </div>
    <p class="validite" data-i18n="eq1.validite"></p>
    <p data-i18n="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n="s3.p1"></p>
    <div class="box def"><b data-i18n="s3.def.title"></b>
      <p data-i18n-html="s3.def.body"></p>
    </div>
    <p data-i18n="s3.p2"></p>
    <div class="list keyed" id="clocks"></div>
    <div class="box rem"><b data-i18n="s3.rem.title"></b>
      <p data-i18n="s3.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/temps-distance-mouvement.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/temps-distance-mouvement.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
/* typographie française partout, sauf le <h1> : il reste identique au titre de lecons/index.json */
const main = document.querySelector("main");
F.autoTypo(main);
document.title = t("title");
const $ = id => document.getElementById(id);
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- la rigole de Galilée ---------- */
(() => {
  const LEN = 5;                                                     // m : longueur de la rigole
  /* horloges : période (s) et irrégularité (fraction) — valeurs d'illustration */
  const CLOCKS = { pouls: [0.8, 0.05], eau: [0.5, 0.02], pendule: [0.5, 0.002], parfaite: [0.5, 0] };
  const sel = $("clock"), al = $("alpha"), irr = $("irr"), svg = $("ramp"), chart = $("dk");
  const X0 = 30, Y0 = 30, X1 = 610, Y1 = 140;                       // dessin : pente exagérée pour la lisibilité
  const at = d => [X0 + (X1 - X0) * d / LEN, Y0 + (Y1 - Y0) * d / LEN];
  let seed = 1, exp = null, anim = 0;

  function run() {
    const [period] = CLOCKS[sel.value];
    exp = Mouv.experiment(+al.value, LEN, period, irr.value / 100, Quiz.rng(seed));
    $("alphav").textContent = F.num(+al.value, 3) + "°"; $("irrv").textContent = F.qty(F.num(+irr.value, 3), "%");
    $("period").textContent = t("ramp.period", { T: F.si(period, "s") });
    $("nmarks").textContent = F.num(exp.ds.length, 3);
    const fit = Mouv.powerFit(exp.ds);
    $("pfit").textContent = isFinite(fit.p) ? F.fix(fit.p, 2) : "–";
    $("ratios").textContent = t("ramp.ratios", { r: Mouv.ratios(exp.ds).map(r => F.fix(r, 1)).join(" : ") });
    drawChart(); animate();
  }
  function drawRamp(tNow) {
    svg.innerHTML = "";
    Plot.el("line", { x1: X0, y1: Y0, x2: X1, y2: Y1, class: "stroke bold c-label-2" }, svg);
    Plot.el("line", { x1: X0, y1: Y1, x2: X1, y2: Y1, class: "stroke thin dash c-label-2" }, svg);
    exp.ts.forEach((ti, k) => { if (ti > tNow) return; const [x, y] = at(exp.ds[k]);
      Plot.el("line", { x1: x, y1: y - 12, x2: x, y2: y + 12, class: "stroke c-tint" }, svg);
      Plot.el("text", { x, y: y - 16, "text-anchor": "middle" }, svg).textContent = String(k + 1); });
    const [bx, by] = at(Math.min(LEN, Mouv.distance(exp.a, Math.min(tNow, exp.tEnd))));
    Plot.el("circle", { cx: bx, cy: by - 9, r: 8, class: "fill c-warn" }, svg);
  }
  function animate() {
    cancelAnimationFrame(anim);
    if (reduce) { drawRamp(Infinity); return; }
    const t0 = performance.now();
    const step = now => { const tt = (now - t0) / 1000; drawRamp(tt); if (tt < exp.tEnd + 0.3) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step);
  }
  function drawChart() {
    chart.innerHTML = "";
    const n = Math.max(exp.ds.length, 1), ymax = Math.max(LEN, exp.ds.length ? exp.ds[0] * n * n : 0) * 1.05;
    const { x, y, g } = Plot.axes(chart, { fmt: F, w: 640, h: 260, pad: { b: 44 },
      x: { domain: [0, n + 0.5], label: t("chart.x"), ticks: Math.min(n + 1, 10) }, y: { domain: [0, ymax], label: t("chart.y") } });
    if (exp.ds.length) {
      const d1 = exp.ds[0]; let p = "";
      for (let i = 0; i <= 100; i++) { const k = (n + 0.5) * i / 100; p += (i ? "L" : "M") + x(k).toFixed(1) + " " + y(Math.min(ymax, d1 * k * k)).toFixed(1); }
      Plot.el("path", { d: p, class: "ref" }, g);
    }
    exp.ds.forEach((d, k) => Plot.el("circle", { cx: x(k + 1), cy: y(d), r: 5, class: "dot" }, g));
  }
  sel.onchange = () => { irr.value = 100 * CLOCKS[sel.value][1]; run(); };
  al.oninput = irr.oninput = run;
  $("go").onclick = () => { seed++; run(); };
  run();
})();

/* ---------- horloges : des phénomènes qui se répètent ---------- */
(() => {
  const CLOCKS = [["jour", 86400], ["pendule", 2 * Math.PI * Math.sqrt(1 / Mouv.G)], ["coeur", 0.8], ["diapason", 1 / 440], ["quartz", 1 / 32768], ["cesium", 1 / Constantes.dnu_Cs]];
  const names = textOf("clocks.items", CLOCKS.map(c => c[0]));
  $("clocks").innerHTML = CLOCKS.map(([id, T]) => `<div><span class="k">${T >= 1 ? F.qty(F.num(T, 4), "s") : F.si(T, "s")}</span><span>${names[id]}</span><span class="v">${F.si(1 / T, "Hz")}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["pendule", 1602, "experiment"], ["discorsi", 1638, "experiment"], ["huygens", 1656, "use"], ["metre", 1791, "idea"], ["marey", 1882, "experiment"],
    ["cesium", 1967, "idea"], ["lune", 1969, "experiment"], ["c", 1983, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gps", "lune", "video"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cinq", "a"], ["impairs", "a"], ["pente", "a"], ["horloge", "a"], ["regularite", "a"], ["operationnel", "a"], ["aristote", "a"], ["gps", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => { const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) }; }), { t, seed: 11 });
})();
</script>
</body>
</html>
