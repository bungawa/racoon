<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd;

/* ---------- l'alternateur en charge : puissance mécanique et effet Joule sur une période ---------- */
(() => {
  /* the coil of « Moteurs et générateurs »: 200 turns of 10 cm × 8 cm in 80 mT at 50 Hz; its own inductance estimated as a ring
     of the same area made of a bundle of 5 mm radius, times N² */
  const base = { N: 200, B: 0.08, S: 0.008, omega: 2 * Math.PI * 50 };
  base.L = base.N * base.N * M.inductanceAnneau(Math.sqrt(base.S / Math.PI), 0.005);
  const svg = $("pw"), sr = $("sr"), seg = $("phases"), T = 0.02;
  let ph = 1;
  function draw() {
    const R = Math.pow(10, +sr.value), a = M.alternateurCharge(Object.assign({ R, phases: ph }, base));
    const Z = Cx.c(R, base.omega * base.L), Iph = Cx.div(Cx.c(a.femMax), Z);         // s = iω
    const ts = Array.from({ length: 201 }, (_, k) => k * T / 200), pm = ts.map(a.pMeca), pj = ts.map(a.pJoule);
    const ymax = 1.1 * Math.max(...pm, ...pj, 1e-9), ymin = Math.min(0, 1.1 * Math.min(...pm));
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 60, b: 44 }, x: { domain: [0, 20], label: t("fig.xaxis") }, y: { domain: [ymin, ymax], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(20), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("line", { x1: P.x(0), x2: P.x(20), y1: P.y(a.pMoy), y2: P.y(a.pMoy), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(ts.map((s, k) => [P.x(1000 * s), P.y(pj[k])])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(ts.map((s, k) => [P.x(1000 * s), P.y(pm[k])])), class: "curve" }, P.g);
    $("srr").textContent = F.si(R, "Ω");
    $("vi").textContent = F.si(a.I0 / Math.SQRT2, "A");
    $("fi").textContent = t("fig.f.i", { phi: F.qty(F.num(-Cx.arg(Iph) * 180 / Math.PI, 2), "°"), z: F.si(Cx.abs(Z), "Ω") });
    $("vp").textContent = F.si(a.pMoy, "W");
    $("fp").textContent = t("fig.f.p", { lw: F.si(base.omega * base.L, "Ω") });
    $("vc").textContent = F.si(a.coupleMoy, "N·m");
    $("fc").textContent = t(ph === 3 ? "fig.f.c3" : "fig.f.c1", { min: F.si(a.coupleMin, "N·m"), max: F.si(a.coupleMax, "N·m") });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.p === ph)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { ph = +x.dataset.p; draw(); });
  sr.oninput = draw; draw();
})();

/* ---------- la barre lancée sur les rails : vitesse et chaleur ---------- */
(() => {
  const o = { m: 0.1, B: 1, w: 0.1, v0: 2 }, svg = $("rail"), rr = $("rr");
  function draw() {
    const R = Math.pow(10, +rr.value), b = M.barreRails(Object.assign({ R }, o)), tmax = 1, ec0 = b.ec(0);
    const ts = Array.from({ length: 201 }, (_, k) => k * tmax / 200);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 60, b: 44 }, x: { domain: [0, 1000 * tmax], label: t("rail.xaxis") }, y: { domain: [0, 1.05], label: t("rail.yaxis") } });
    Plot.el("path", { d: Plot.path(ts.map(s => [P.x(1000 * s), P.y(b.v(s) / o.v0)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(ts.map(s => [P.x(1000 * s), P.y(b.joule(s) / ec0)])), class: "ref" }, P.g);
    $("rrr").textContent = F.si(R, "Ω");
    $("vtau").textContent = F.si(b.tau, "s");
    $("ftau").textContent = t("rail.f.tau", { i: F.si(b.courant(o.v0), "A"), f: F.si(-b.force(o.v0), "N") });
    $("vx").textContent = F.si(b.x(50 * b.tau), "m");
    $("fx").textContent = t("rail.f.x");
    $("vq").textContent = F.si(b.joule(50 * b.tau), "J");
    $("fq").textContent = t("rail.f.q", { e: F.si(ec0, "J") });
  }
  rr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["blathy", 1889, "use"], ["shallenberger", 1894, "use"], ["adams", 1895, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["frein", "compteur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["origine", "c"], ["couple", "a"], ["adapte", "d"], ["retard", "b"], ["tri", "c"], ["barre", "a"], ["resistance", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 175 });
})();
</script>
