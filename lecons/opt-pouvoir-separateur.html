<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique;
const rad = v => F.si(v, "rad", { sig: 3 });

/* ---------- deux étoiles incohérentes vues par une pupille circulaire, (27.17), tache d'Airy, (27.17c) ---------- */
(() => {
  const svg = $("profil"), ss = $("ssl"), ds = $("dsl"), ls = $("lsl"), W = 640, H = 300, XM = 3;    // abscisse en unités de λ/D
  const DS = [0.005, 0.1, 1, 8, 39];                                                                  // diamètres (m) : pupille de l'œil … 39 m
  function draw() {
    svg.innerHTML = "";
    const r = +ss.value, D = DS[+ds.value], lam = +ls.value * 1e-9, s = Math.PI * r;
    const p = O.deuxSources(s, { vmax: Math.PI * XM, N: 301 });
    const ax = Plot.axes(svg, { fmt: F, w: W, h: H, x: { domain: [-XM, XM], label: t("ps.ax.x") }, y: { domain: [0, 1.6], label: t("ps.ax.y") } });
    const P = (u, i) => [ax.x(u), ax.y(i)], vs = p.v.map(v => v / Math.PI);
    [-1, 1].forEach(sg => Plot.el("path", { d: Plot.path(vs.map(u => P(u, O.airy(Math.PI * u - sg * s / 2)))), class: "stroke thin dash c-label-2" }, svg));
    Plot.el("path", { d: Plot.path(vs.map((u, k) => P(u, p.I[k]))), class: "stroke c-tint" }, svg);
    [-0.61, 0.61].forEach(u => Plot.el("line", { x1: ax.x(u), x2: ax.x(u), y1: ax.y(0), y2: ax.y(1.6), class: "stroke thin dash c-warn" }, svg));
    const R = O.resolution({ lambda: lam, D }), sep = r * lam / D;
    $("sread").textContent = t("ps.s.read", { r: F.num(r, 3), q: F.num(r / 1.2197, 2) });
    $("dread").textContent = F.si(D, "m", { sig: 2 });
    $("lread").textContent = F.si(lam, "m", { prefix: "n", sig: 3 });
    $("vc").textContent = p.creux < 1 - 1e-6 ? F.qty(F.num(100 * p.creux, 3), "%") : "–";
    $("fc").textContent = t(p.creux > 1 - 1e-6 ? "ps.f.une" : p.creux > 0.735 + 1e-3 ? "ps.f.sparrow" : "ps.f.separees");
    $("va").textContent = rad(sep);
    $("fa").textContent = t("ps.f.angle", { R: rad(R.rayleigh), arc: F.num(sep / (Math.PI / 180 / 3600), 3) });
    $("vr").textContent = t("ps.r.v", { n: F.num(r, 3) });
    $("fr").textContent = t(r >= 1 ? "ps.f.retard.oui" : "ps.f.retard.non");
  }
  [ss, ds, ls].forEach(c => c.oninput = draw); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["airy", 1835, "idea"], ["abbe", 1873, "idea"], ["rayleigh", 1879, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["immersion", "elt"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["grossir", "c"], ["retard", "a"], ["immersion", "d"], ["oeil", "b"], ["bleu", "a"], ["rayleigh", "c"], ["fermat", "b"], ["miroir", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 277 });
})();
</script>
