<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const deg = Math.PI / 180, T = Tenseurs;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const onTheme = f => { f(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", f); new MutationObserver(f).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] }); };
const signed = (x, d) => (x < 0 ? F.MINUS : "") + F.fix(Math.abs(x), d);

/* ---------- §31-3 : le cycle x, y, −x, −y ---------- */
(() => {
  /* α/ε₀ of a calcite seen 30° off its axes: α_xy = α_yx = 0,234 ; the slider adds an asymmetry δ = α_xy − α_yx */
  const svg = $("cycle"), X = 1, Y = 1, S = 110;
  const corners = [[0, 0], [X, 0], [X, Y], [0, Y], [0, 0]];
  function upd() {
    const d = +$("asym").value / 100;
    svg.innerHTML = "";
    Plot.el("line", { x1: -20, y1: 0, x2: 150, y2: 0, class: "stroke thin c-label-2" }, svg);
    Plot.el("line", { x1: 0, y1: 20, x2: 0, y2: -140, class: "stroke thin c-label-2" }, svg);
    Plot.el("text", { x: 150, y: 14, "text-anchor": "end" }, svg).textContent = t("cy.fig.Ex");
    Plot.el("text", { x: 6, y: -136 }, svg).textContent = t("cy.fig.Ey");
    Plot.el("path", { d: corners.map(([a, b], i) => (i ? "L" : "M") + a * S + " " + -b * S).join(""), class: "stroke c-tint" }, svg);
    /* step number outside the square, and an arrowhead along the direction of travel */
    [[0.5, 0, "1", 0, 16, 1, 0], [1, 0.5, "2", 14, 4, 0, 1], [0.5, 1, "3", 0, -8, -1, 0], [0, 0.5, "4", -14, 4, 0, -1]].forEach(([a, b, n, ox, oy, dx, dy]) => {
      const x = a * S, y = -b * S, h = 7;
      Plot.el("polygon", { points: [[x + dx * h, y - dy * h], [x - dx * h - dy * h * 0.6, y + dy * h - dx * h * 0.6], [x - dx * h + dy * h * 0.6, y + dy * h + dx * h * 0.6]].map(q => q.join(",")).join(" "), class: "fill c-tint" }, svg);
      Plot.el("text", { x: x + ox, y: y + oy, "text-anchor": "middle" }, svg).textContent = n;
    });
    $("asymv").textContent = signed(d, 2);
    const W = d * X * Y;                                        // per unit volume, in units of ε₀ E₁E₂
    $("vw").textContent = Math.abs(W) < 1e-12 ? "0" : signed(W, 2);
    $("fw").textContent = t(Math.abs(W) < 1e-12 ? "cy.f.nul" : W > 0 ? "cy.f.fourni" : "cy.f.gagne");
  }
  $("asym").oninput = upd; upd();
})();

/* ---------- §31-3 : l'ellipsoïde dans l'espace ---------- */
(() => {
  /* principal values of α/ε₀ = χ: cubic glass-like 1,25 ; calcite (axis along a) 1,208 / 1,749 / 1,749 ; orthorhombic 0,8 / 1,5 / 2,6 */
  const CRYSTALS = { cubique: [1.25, 1.25, 1.25], calcite: [1.208, 1.749, 1.749], ortho: [0.8, 1.5, 2.6] };
  let crystal = "calcite";
  const fmt = x => (Math.abs(x) < 5e-4 ? "0" : (x < 0 ? F.MINUS : "") + F.fix(Math.abs(x), 3));
  const mat = M => `<math display="block"><mi>α</mi><mo>/</mo><msub><mi>ε</mi><mn>0</mn></msub><mo>=</mo><mrow><mo>(</mo><mtable>${M.map(r => `<mtr>${r.map(x => `<mtd><mn>${fmt(x)}</mn></mtd>`).join("")}</mtr>`).join("")}</mtable><mo>)</mo></mrow></math>`;
  let view = null;

  function state() {
    const v = CRYSTALS[crystal];
    const Rc = T.produit(T.rotation([0, 0, 1], +$("rz").value * deg), T.rotation([1, 0, 0], +$("rx").value * deg));   // crystal orientation in the lab
    const S = T.produit(T.produit(Rc, T.diag(v[0], v[1], v[2])), T.transposee(Rc));                                 // α/ε₀ in the lab axes
    const th = +$("et").value * deg, ph = +$("ep").value * deg;
    const dir = [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)];
    const E = dir.map(x => x / Math.sqrt(T.quadratique(S, dir)));      // on the surface Eᵀ S E = 1 (2u₀/ε₀ = 1)
    const P = T.appliquer(S, E);
    return { S, E, P, el: T.ellipsoide(S), Rc };
  }
  function upd() {
    Object.keys(CRYSTALS).forEach(c => $("c-" + c).setAttribute("aria-pressed", String(c === crystal)));
    ["rz", "rx", "et", "ep"].forEach(id => $(id + "v").textContent = signed(+$(id).value, 0) + "°");
    const s = state();
    $("mat").innerHTML = mat(s.S);
    $("vprop").textContent = s.el.valeurs.map(x => F.fix(x, 3)).join(" ; ");
    $("vep").textContent = F.fix(T.angle(s.E, s.P) / deg, 1) + "°";
    /* P against the outward normal of the surface at E: the normal is the gradient of Eᵀ S E, 2 S E */
    $("vnorm").textContent = F.fix(T.angle(s.P, T.appliquer(s.S, s.E)) / deg, 1) + "°";
    if (view) view(s);
  }
  Object.keys(CRYSTALS).forEach(c => $("c-" + c).onclick = () => { crystal = c; upd(); });
  ["rz", "rx", "et", "ep"].forEach(id => $(id).oninput = upd);

  const canvas = $("ell"), read = $("ellread");
  if (!self.THREE) { read.textContent = t("el.offline"); upd(); return; }
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, 4 / 3, 0.1, 50);
  cam.up.set(0, 0, 1); cam.position.set(3.2, 2.4, 2.0);
  const ctl = new THREE.OrbitControls(cam, canvas); ctl.enableDamping = true; ctl.autoRotate = !reduce; ctl.autoRotateSpeed = 0.5;
  canvas.addEventListener("pointerdown", () => ctl.autoRotate = false);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(3, 2, 4); scene.add(sun);
  const ellMat = new THREE.MeshStandardMaterial({ transparent: true, opacity: 0.35, roughness: 0.6, depthWrite: false });
  const ell = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 40), ellMat); scene.add(ell);
  const wire = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(1, 24, 12)), new THREE.LineBasicMaterial({ transparent: true, opacity: 0.25 }));
  ell.add(wire);
  const axMat = new THREE.LineBasicMaterial();
  const labMat = new THREE.LineDashedMaterial({ dashSize: 0.05, gapSize: 0.04, transparent: true, opacity: 0.6 });
  const lab = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints([[1.4, 0, 0], [0, 1.4, 0], [0, 0, 1.4]].flatMap(v => [new THREE.Vector3(), new THREE.Vector3(...v)])), labMat);
  lab.computeLineDistances(); scene.add(lab);                                   // lab axes x, y, z, dashed
  const principal = new THREE.LineSegments(new THREE.BufferGeometry(), axMat); scene.add(principal);
  const arrE = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, 0x007aff, 0.1, 0.06);
  const arrP = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 0.6, 0xff9500, 0.1, 0.06);
  scene.add(arrE, arrP);
  onTheme(() => { ellMat.color.set(css("--label-2").slice(0, 7)); wire.material.color.set(css("--label").slice(0, 7)); axMat.color.set(css("--label").slice(0, 7)); labMat.color.set(css("--label-2").slice(0, 7));
    arrE.setColor(new THREE.Color(css("--tint"))); arrP.setColor(new THREE.Color(css("--warn"))); });
  view = s => {
    const [u1, u2, u3] = s.el.axes.map(u => new THREE.Vector3(...u)), [a, b, c] = s.el.demiAxes;
    ell.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(u1, u2, u3)); ell.scale.set(a, b, c);
    const pts = []; [[u1, a], [u2, b], [u3, c]].forEach(([u, r]) => { pts.push(u.clone().multiplyScalar(-r * 1.25), u.clone().multiplyScalar(r * 1.25)); });
    principal.geometry.setFromPoints(pts);
    const E = new THREE.Vector3(...s.E), P = new THREE.Vector3(...s.P);
    arrE.setDirection(E.clone().normalize()); arrE.setLength(E.length(), 0.1, 0.06);
    arrP.position.copy(E); arrP.setDirection(P.clone().normalize()); arrP.setLength(0.5, 0.1, 0.06);
    read.textContent = t("el.read", { a: F.fix(a, 2), b: F.fix(b, 2), c: F.fix(c, 2) });
  };
  function resize() { const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); cam.aspect = r.width / r.height; cam.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(canvas); resize();
  let visible = true; new IntersectionObserver(e => visible = e[0].isIntersecting).observe(canvas);
  (function tick() { requestAnimationFrame(tick); if (!visible) return; ctl.update(); renderer.render(scene, cam); })();
  upd();
})();

/* ---------- classes de cristaux ---------- */
(() => {
  const CLASSES = ["triclinique", "monoclinique", "orthorhombique", "uniaxe", "cubique"], txt = textOf("classes.items", CLASSES);

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fresnel", 1822, "idea"], ["hamilton", 1832, "idea"], ["lloyd", 1832, "experiment"], ["jacobi", 1846, "idea"], ["sylvester", 1852, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));

  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
