<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OndesMilieux, C = Constantes.c, q = Constantes.e;

/* ---------- une charge qui freine : le jeu de la position projetée contre Liénard–Wiechert ---------- */
(() => {
  const tau = 10e-9, P = [2, 1, 0];                       // braking over 10 ns; the observer 2 m ahead, 1 m aside
  const schema = $("schema"), trace = $("trace"), sb = $("sb"), st = $("st");
  const T0 = -15e-9, T1 = 40e-9, ts = Array.from({ length: 221 }, (_, i) => T0 + i * (T1 - T0) / 220);
  /* (26.1) from the present position and present velocity: what one would write if nothing were retarded */
  const actuel = (f, t) => {
    const x = f.pos(t), v = f.vit(t)[0], b2 = (v / C) ** 2, X = P[0] - x[0];
    return q / (4 * Math.PI * Constantes.eps0) / Math.sqrt(X * X + (1 - b2) * (P[1] ** 2 + P[2] ** 2));
  };
  const nV = 1e9;
  function draw() {
    const beta = +sb.value / 100, f = O.freinage(beta * C, tau), tc = +st.value * 1e-9;
    const proj = ts.map(s => O.potentielsProjetes(q, f.pos, f.vit, P, s).phi), act = ts.map(s => actuel(f, s));
    const ymax = 1.1 * Math.max(...proj, ...act) * nV;
    trace.innerHTML = "";
    const A = Plot.axes(trace, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 44 }, x: { domain: [-15, 40], label: t("fig.xaxis") }, y: { domain: [0, ymax], label: t("fig.yaxis") } });
    Plot.el("path", { d: Plot.path(ts.map((s, i) => [A.x(s * 1e9), A.y(act[i] * nV)])), class: "ref" }, A.g);
    Plot.el("path", { d: Plot.path(ts.map((s, i) => [A.x(s * 1e9), A.y(proj[i] * nV)])), class: "curve" }, A.g);
    for (let i = 0; i < ts.length; i += 11) {
      const lw = O.lienardWiechert(q, f.pos, f.vit, P, ts[i]).phi;
      Plot.el("circle", { cx: A.x(ts[i] * 1e9), cy: A.y(lw * nV), r: 2.5, class: "fill c-label-2" }, A.g);
    }
    const p = O.potentielsProjetes(q, f.pos, f.vit, P, tc), lw = O.lienardWiechert(q, f.pos, f.vit, P, tc);
    Plot.el("line", { x1: A.x(tc * 1e9), x2: A.x(tc * 1e9), y1: A.y(0), y2: A.y(ymax), class: "zero" }, A.g);
    Plot.el("circle", { cx: A.x(tc * 1e9), cy: A.y(p.phi * nV), r: 5, class: "dot" }, A.g);
    /* schematic: the line of motion, same scale on both axes, from just behind the retarded position to past P */
    schema.innerHTML = "";
    const x0 = Math.min(-1, p.retardee[0]) - 0.3, x1 = 2.6, k = Math.min(110, 600 / (x1 - x0));
    const X = x => 20 + k * (x - x0), Y = y => 130 - k * y;
    Plot.el("line", { x1: X(x0), x2: X(x1), y1: Y(0), y2: Y(0), class: "stroke thin c-label-2" }, schema);
    Plot.el("line", { x1: X(0), x2: X(f.arret), y1: Y(0) + 6, y2: Y(0) + 6, class: "stroke bold c-warn" }, schema);
    Plot.el("line", { x1: X(p.retardee[0]), x2: X(P[0]), y1: Y(0), y2: Y(P[1]), class: "stroke dash c-label-2" }, schema);
    const mark = (x, y, cls, key, dy) => {
      Plot.el("circle", { cx: X(x), cy: Y(y), r: 5, class: "fill " + cls }, schema);
      Plot.el("text", { x: X(x), y: Y(y) + dy, "text-anchor": "middle" }, schema).textContent = t(key);
    };
    const pres = f.pos(tc)[0], prj = p.projetee[0];
    mark(P[0], P[1], "c-label", "fig.m.obs", -10);
    mark(p.retardee[0], 0, "c-label-2", "fig.m.ret", 22);
    mark(pres, 0, "c-warn", "fig.m.act", Math.abs(pres - prj) * k < 40 ? 38 : 22);
    mark(prj, 0, "c-tint", "fig.m.proj", -10);
    $("sbr").textContent = F.num(beta, 2);
    $("str").textContent = F.si(tc, "s", { prefix: "n" });
    $("vphi").textContent = F.si(p.phi, "V", { prefix: "n" });
    $("fphi").textContent = t("fig.f.phi", { v: F.si(lw.phi, "V", { prefix: "n" }) });
    $("vact").textContent = F.si(actuel(f, tc), "V", { prefix: "n" });
    $("fact").textContent = t("fig.f.act", { v: F.num(actuel(f, tc) / p.phi, 3) });
    const Ev = O.champCharge(f.pos, P, tc, { q, h: 1e-12 }).E, Ep = O.champProjete(q, f.pos, f.vit, P, tc).E;
    const n = a => Math.hypot(...a), ecart = n(Ev.map((x, i) => x - Ep[i])) / n(Ev);
    $("ve").textContent = F.qty(F.num(100 * ecart, 2), "%");
    $("fe").textContent = t("fig.f.e", { v: F.si(n(Ev), "V·m⁻¹", { prefix: "n" }), p: F.si(n(Ep), "V·m⁻¹", { prefix: "n" }) });
  }
  sb.oninput = st.oninput = draw; draw();
})();

/* ---------- le système décrit : la part de l'accélération ---------- */
(() => {
  const beta = 0.9, tau = 10e-9, a = beta * C / tau, r = 1;
  const ar = a * r / (C * C);
  const a50 = 2 * Math.PI * 50 * 1e-4, ar50 = a50 * 1 / (C * C);  // a drift of 0,1 mm·s⁻¹ in a 50 Hz wire
  $("sys1").innerHTML = t("sys1.body", { a: F.sci(a, 2), ar: F.num(ar, 2), a50: F.sci(a50, 2), ar50: F.sci(ar50, 1), wr: F.sci(2 * Math.PI * 50 * 1 / C, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lienard", 1898, "idea"], ["wiechert", 1900, "idea"], ["minkowski", 1908, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["synchrotron"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["actuelle", "c"], ["retard", "a"], ["projetee", "d"], ["meme", "b"], ["champ", "a"], ["ile", "c"], ["ordre", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 261 });
})();
</script>
