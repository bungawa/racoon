<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions, P = Plot.el;
const conc = x => F.qty(F.sci(x, 3), "mol·L⁻¹");
const LIG = { "NH3": "NH3", "HO^-": "OH", "SCN^-": "SCN", "Y^4-": "Y" };
/* name of ML_i, built from the metal and the ligand: Cu(NH3)4^2+, Zn(OH)4^2-, Fe(SCN)^2+ */
function espece(cle, i) {
  const cx = C.FORMATION[cle], met = cx.M.split("^")[0], l = LIG[cx.L], z = C.formule(cx.M).charge + i * C.formule(cx.L).charge;
  const corps = met + (i ? (l.length > 1 ? "(" + l + ")" : l) + (i > 1 ? i : "") : "");
  return C.texte(corps + (z ? "^" + (Math.abs(z) > 1 ? Math.abs(z) : "") + (z > 0 ? "+" : "-") : ""));
}

/* ---------- constantes et milieu : l'EDTA à I = 0,1 mol·L⁻¹ ---------- */
(() => {
  const I0 = 0.1, d = z => Math.log10(C.davies(z, I0)), corr = d(2) + d(4) - d(2);   // Ca²⁺ + Y⁴⁻ = CaY²⁻
  $("milieu").innerHTML = ["Ca-EDTA", "Mg-EDTA"].map(k => `<div><span class="k">${t("milieu.k", { sp: espece(k, 1) })}</span><span>${t("milieu.ligne", {
    lk: F.fix(C.FORMATION[k].lgK[0], 2), l0: F.fix(C.FORMATION[k].lgK[0] - corr, 2) })}</span></div>`).join("");
})();

/* ---------- courbes de distribution ---------- */
(() => {
  const svg = $("dist"), ss = $("sys"), sl = $("pl"), CLS = ["c-label-2", "c-tint", "c-ok", "c-warn", "c-ko"];
  function draw() {
    const k = ss.value, lgK = C.FORMATION[k].lgK, n = lgK.length, pL = +sl.value, A = -1, B = 8;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 330, pad: { b: 44, l: 52, t: 40 },
      x: { scale: "lin", domain: [A, B], label: t("dist.x") }, y: { scale: "lin", domain: [0, 1], label: t("dist.y") } });
    for (let i = 0; i <= n; i++) {
      const pts = [];
      for (let j = 0; j <= 360; j++) { const p = A + j * (B - A) / 360; pts.push([o.x(p), o.y(C.distributionComplexes(lgK, p)[i])]); }
      P("path", { d: Plot.path(pts), class: "stroke " + CLS[i] }, o.g);
    }
    for (const iv of C.predominance(lgK, A, B)) {                       // predominance band above the plot
      P("rect", { x: o.x(iv.de), y: o.y(1) - 30, width: o.x(iv.a) - o.x(iv.de), height: 18, class: "fill " + CLS[iv.i], "fill-opacity": 0.25 }, o.g);
      if (o.x(iv.a) - o.x(iv.de) > 46) P("text", { x: (o.x(iv.de) + o.x(iv.a)) / 2, y: o.y(1) - 17, "text-anchor": "middle", class: "tick" }, o.g).textContent = t("dist.sp", { sp: espece(k, iv.i) });
    }
    P("line", { x1: o.x(pL), x2: o.x(pL), y1: o.y(0), y2: o.y(1), class: "stroke thin c-label" }, o.g);
    $("leg").innerHTML = Array.from({ length: n + 1 }, (_, i) => `<span class="${CLS[i]}">${t("dist.sp", { sp: espece(k, i) })}</span>`).join("");
    const f = C.distributionComplexes(lgK, pL);
    $("plv").textContent = F.fix(pL, 2);
    $("fr").innerHTML = f.map((v, i) => `<div><span class="k">${t("dist.sp", { sp: espece(k, i) })}</span><span>${t("dist.frac", { a: F.qty(F.fix(100 * v, 1), "%") })}</span></div>`).join("");
  }
  ss.onchange = sl.oninput = draw; draw();
})();

/* ---------- dissoudre un halogénure d'argent dans l'ammoniac ---------- */
(() => {
  $("halo").innerHTML = ["AgCl", "AgBr", "AgI"].map(s => `<div><span class="k">${t("halo.k", { sel: C.texte(s) })}</span><span>${t("halo.ligne", {
    lk: F.fix(C.lgBeta(C.FORMATION["Ag-NH3"].lgK)[2] - C.SELS[s].pKs, 2),
    s1: conc(C.solubiliteComplexant(s, "Ag-NH3", 0.1).s), s2: conc(C.solubiliteComplexant(s, "Ag-NH3", 1).s), s0: conc(C.solubiliteEau(s)) })}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["werner", 1893, "idea"], ["nobel", 1913, "idea"], ["bjerrum", 1941, "experiment"], ["schwarzenbach", 1945, "experiment"], ["durete", 1948, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["durete", "fixage"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["beta", "b"], ["frontiere", "c"], ["argent", "a"], ["lecture", "d"], ["dissoudre", "b"], ["iodure", "c"], ["milieu", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1941 });
})();
</script>
