<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); };

(() => { const IDS = ["espace", "temps", "rotation", "phase"]; keyed($("tab"), t("tab.tag"), IDS, textOf("tab.items", IDS)); })();

/* ---------- deux masses, un ressort, une symétrie cassée à la fois ---------- */
(() => {
  const S0 = { t: 0, x: [0, 0, 1.3, 0.2], v: [0.1, 0.4, -0.2, 0.3] }, H = 1e-3, N = 8000, Q = ["px", "py", "Lz", "E"];
  const COUL = { px: "c-tint", py: "c-warn", Lz: "t-thermo", E: "t-chim" };
  const detail = textOf("sim.detail", Principes.CAS);
  const { x: X, y: Y, g: G } = Plot.axes($("bilan"), { fmt: F, w: 640, h: 260, pad: { b: 44 },
    x: { domain: [0, H * N], label: t("ch.x") }, y: { domain: [-2, 2], label: t("ch.y") } });
  const courbes = P("g", {}, G), plan = $("plan");
  const cache = {};
  function upd(cas) {
    const r = cache[cas] || (cache[cas] = Principes.conservation(cas, {}, S0, H, N));
    courbes.innerHTML = "";
    Q.forEach(q => P("path", { d: r.serie.filter((b, i) => i % 20 === 0).map((b, i) => (i ? "L" : "M") + X(b.t).toFixed(1) + " " + Y((b[q] - r.serie[0][q]) / r.echelles[q]).toFixed(1)).join(""), class: "stroke " + COUL[q] }, courbes));
    /* the plane: both masses' paths, the same scale on both axes */
    plan.innerHTML = "";
    const pts = r.x.filter((p, i) => i % 10 === 0);
    const xs = pts.flatMap(p => [p[0], p[2]]), ys = pts.flatMap(p => [p[1], p[3]]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const k = Math.min(600 / (x1 - x0 || 1), 260 / (y1 - y0 || 1)), cx = 320 - k * (x0 + x1) / 2, cy = 150 + k * (y0 + y1) / 2;
    const px = (a, b) => (cx + k * a).toFixed(1) + " " + (cy - k * b).toFixed(1);
    if (cas !== "isole" && cas !== "pulsation") {                 // what breaks the symmetry
      if (cas === "rainure") P("line", { x1: cx, x2: cx, y1: 10, y2: 290, class: "stroke thin dash c-label-2" }, plan);
      else P("circle", { cx, cy, r: 5, class: "fill c-label-2" }, plan);
    }
    P("path", { d: pts.map((p, i) => (i ? "L" : "M") + px(p[0], p[1])).join(""), class: "stroke thin c-tint" }, plan);
    P("path", { d: pts.map((p, i) => (i ? "L" : "M") + px(p[2], p[3])).join(""), class: "stroke thin c-warn" }, plan);
    const last = pts[pts.length - 1];
    P("circle", { cx: cx + k * last[0], cy: cy - k * last[1], r: 6, class: "fill c-tint" }, plan);
    P("circle", { cx: cx + k * last[2], cy: cy - k * last[3], r: 8, class: "fill c-warn" }, plan);
    Q.forEach(q => {
      const rel = r.ecarts[q] / r.echelles[q], garde = rel < 1e-4;
      $("v-" + q).textContent = t(garde ? "sim.conserve" : "sim.varie");
      $("f-" + q).textContent = t("sim.f", { v: F.sci(rel, 2) });
    });
    $("detail").textContent = detail[cas];
  }
  seg($("cas"), "c", upd);
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lagrange", 1788, "idea"], ["noether", 1918, "idea"], ["weyl", 1929, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["w"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["rainure", "b"], ["centre", "a"], ["pulsation", "d"], ["calcul", "b"], ["phase", "b"], ["charge", "c"], ["frottement", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 5203 });
})();
</script>
