<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹", MS2 = "m·s⁻²";

/* ---------- le système décrit, chiffré ---------- */
$("sys").innerHTML = t("sys.body", Dyna.chiffres("palet", F));

/* ---------- palet sur table inclinée : chaque axe vit sa vie ---------- */
(() => {
  const svg = $("tbl"), P = Plot.el, M = 0.1, deg = Math.PI / 180;
  const arrow = (x1, y1, x2, y2, cls, parent) => Plot.fleche(parent, [x1, y1], [x2, y2], { cls });
  const label = (x, y, key, parent, anchor, v) => { const e = P("text", { x, y, "text-anchor": anchor || "middle" }, parent); e.textContent = t(key, v); return e; };
  const asl = $("asl"), vsl = $("vsl"), psl = $("psl");
  function draw() {
    svg.innerHTML = "";
    const alpha = asl.value * deg, T = Dyna.table({ m: M, alpha, v0: +vsl.value, phi: psl.value * deg });
    /* top view of the table plane: x along the lower edge, y up the slope; scaled to hold the whole path */
    const X0 = 30, Y0 = 250, W = 340, H = 200, xr = T.pos(T.retour)[0], k = Math.min(W / Math.max(xr, 0.05), H / Math.max(T.hauteur, 0.05));
    P("rect", { x: X0, y: Y0 - H - 10, width: W + 10, height: H + 10, class: "stroke thin c-label-2" }, svg);
    arrow(X0, Y0, X0 + 60, Y0, "c-label-2", svg); label(X0 + 64, Y0 + 4, "tbl.x", svg, "start");
    arrow(X0, Y0, X0, Y0 - 60, "c-label-2", svg); label(X0 + 8, Y0 - 56, "tbl.y", svg, "start");
    let d = ""; for (let i = 0; i <= 80; i++) { const p = T.pos(T.retour * i / 80); d += (i ? "L" : "M") + (X0 + k * p[0]).toFixed(1) + " " + (Y0 - k * p[1]).toFixed(1); }
    P("path", { d, class: "stroke bold c-tint" }, svg);
    const mid = T.pos(T.retour / 2), Mx = X0 + k * mid[0], My = Y0 - k * mid[1];
    P("circle", { cx: Mx, cy: My, r: 6, class: "fill c-label" }, svg);
    arrow(Mx, My, Mx, My + 50, "c-warn", svg); label(Mx + 8, My + 44, "tbl.py", svg, "start");
    label(X0 + W / 2, 290, "tbl.top", svg);
    /* side view across the slope: the weight, its two components, the cushion */
    const S = [520, 140], L = 110, u = [Math.cos(alpha), -Math.sin(alpha)], n = [Math.sin(alpha), Math.cos(alpha)];   // up-slope; normal pointing into the table (screen axes)
    P("line", { x1: S[0] - L * u[0], y1: S[1] - L * u[1], x2: S[0] + L * u[0], y2: S[1] + L * u[1], class: "stroke c-label-2" }, svg);
    P("line", { x1: S[0] - L * u[0], y1: S[1] - L * u[1], x2: S[0] + L * u[0], y2: S[1] - L * u[1], class: "stroke thin dash c-label-2" }, svg);
    label(S[0] - L * u[0] + 46, S[1] - L * u[1] - 6, "tbl.alphal", svg, "start");
    const G0 = [S[0] - 10 * n[0], S[1] - 10 * n[1]], pw = 100;
    P("circle", { cx: G0[0], cy: G0[1], r: 6, class: "fill c-label" }, svg);
    arrow(G0[0], G0[1], G0[0], G0[1] + pw, "c-warn bold", svg); label(G0[0] + 6, G0[1] + pw + 14, "tbl.p", svg, "start");
    const ps = pw * Math.sin(alpha), pc = pw * Math.cos(alpha);
    arrow(G0[0], G0[1], G0[0] - ps * u[0], G0[1] - ps * u[1], "c-warn dash", svg);
    arrow(G0[0], G0[1], G0[0] + pc * n[0], G0[1] + pc * n[1], "c-warn dash", svg);
    arrow(G0[0], G0[1], G0[0] - pc * n[0], G0[1] - pc * n[1], "c-label", svg); label(G0[0] - pc * n[0] - 6, G0[1] - pc * n[1] - 6, "tbl.n", svg, "end");
    label(520, 290, "tbl.side", svg);
    /* numbers */
    $("aread").textContent = asl.value + "°";
    $("vread").textContent = F.qty(F.num(+vsl.value, 2), MS);
    $("pread").textContent = psl.value + "°";
    $("vpy").textContent = F.si(T.P[1], "N", { prefix: "m" });
    $("fpz").textContent = t("tbl.f.pz", { pz: F.si(T.P[2], "N", { prefix: "m" }) });
    $("vay").textContent = F.qty(F.num(T.a[1], 3), MS2);
    $("fax").textContent = t("tbl.f.ax");
    $("vt").textContent = F.si(T.retour, "s", { prefix: "" });
    $("fx").textContent = t("tbl.f.x", { x: F.si(xr, "m", { prefix: "" }) });
    $("vh").textContent = F.si(T.hauteur, "m", { prefix: "" });
  }
  asl.oninput = vsl.oninput = psl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["descartes", 1637, "idea"], ["bernoulli", 1728, "idea"], ["euler", 1752, "idea"], ["lagrange", 1788, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["telephone", "pente"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["palet", "a"], ["projection", "a"], ["angles", "a"], ["lacher", "a"], ["norme", "a"], ["coussin", "a"], ["polaire", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 93 });
})();
</script>
