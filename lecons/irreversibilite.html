<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique;

/* ---------- deux gaz qui se mélangent, puis le retournement ---------- */
(() => {
  const N = 100, L = 20, TMAX = 50, PAS = 100, svg = $("boite"), sc = $("courbe"), k = 320 / L;
  let g, hist, sens, tour, horloge, enCours = false;
  const cercles = [];
  for (let i = 0; i < N; i++) cercles.push(Plot.el("circle", { r: 0.5 * k }, svg));
  Plot.el("rect", { x: 0, y: 0, width: 320, height: 320, class: "stroke thin c-label" }, svg);
  Plot.el("line", { x1: 160, x2: 160, y1: 0, y2: 320, class: "stroke thin dash c-label-2" }, svg);
  function start() { g = S.gaz({ N, L, T: 2, entier: true }, Quiz.rng(4640)); hist = []; sens = 1; tour = null; horloge = 0; mesure(); }
  function mesure() { const m = S.melangeGaz(g, 2); hist.push([horloge, m.S / m.Smax, m.gauche]); return m; }
  function show() {
    const p = S.positionsGaz(g), m = hist[hist.length - 1];
    cercles.forEach((c, i) => { c.setAttribute("cx", p.x[i] * k); c.setAttribute("cy", 320 - p.y[i] * k); c.setAttribute("class", "fill " + (g.couleur[i] ? "c-warn" : "c-tint")); });
    sc.innerHTML = "";
    const ax = Plot.axes(sc, { fmt: F, w: 640, h: 220, pad: { b: 44, l: 56 }, x: { domain: [0, 2 * TMAX], label: t("sim.x") }, y: { domain: [0, 1.05], label: t("sim.y") } });
    if (tour !== null) Plot.el("line", { x1: ax.x(tour), x2: ax.x(tour), y1: ax.y(0), y2: ax.y(1.05), class: "stroke thin dash c-label" }, ax.g);
    Plot.el("path", { d: Plot.path(hist.map(h => [ax.x(h[0]), ax.y(h[2])])), class: "stroke thin c-label-2" }, ax.g);
    Plot.el("path", { d: Plot.path(hist.map(h => [ax.x(h[0]), ax.y(h[1])])), class: "stroke bold c-tint" }, ax.g);
    $("vs").textContent = F.num(m[1], 2); $("vg").textContent = F.num(m[2], 2);
    $("vt").textContent = F.num(horloge, 3);
    $("ft").textContent = t(sens > 0 ? "sim.f.aller" : "sim.f.retour");
    $("renverser").disabled = sens < 0;
  }
  function tick() {
    const fin = sens > 0 ? TMAX : 2 * tour;
    if (horloge >= fin - 1e-9) { enCours = false; return; }
    S.evoluer(g, PAS); horloge += PAS * g.dt; mesure(); show();
    requestAnimationFrame(tick);
  }
  const lance = () => { if (!enCours) { enCours = true; requestAnimationFrame(tick); } };
  $("relancer").onclick = () => { start(); show(); lance(); };
  $("renverser").onclick = () => { if (sens < 0) return; S.renverser(g); if ($("bit").checked) g.X[0] += 1; sens = -1; tour = horloge; show(); lance(); };
  start(); show(); lance();
})();

/* ---------- la probabilité de se démélanger seul ---------- */
(() => {
  const CAS = [["dix", 10], ["cent", 100], ["boite", 2.4e22]];
  const txt = textOf("proba.items", CAS.map(c => c[0]));
  $("proba").innerHTML = CAS.map(([id, n]) => {
    const l10 = -n * Math.log10(2);
    const val = n < 1e6 ? F.sci(Math.pow(2, -n), 2) : t("proba.puissance", { e: F.sci(l10, 2) });
    return `<div><span class="k">${txt[id].k}</span><span>${txt[id].text}</span><span class="v">${val}</span></div>`;
  }).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["clausius", 1865, "idea"], ["boltzmann", 1872, "idea"], ["gibbs", 1876, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["dessalement"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["detente", "b"], ["joule", "a"], ["neon", "d"], ["memes", "c"], ["collision", "a"], ["retour", "b"], ["proba", "d"], ["dessal", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 464 });
})();
</script>
