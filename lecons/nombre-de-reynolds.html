<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹", FL = Fluides, A11 = FL.atmStandard(11000);
/* fluid states: water at 293 K; air at sea level and at 11 km (standard atmosphere); tunnel gases */
const ETAT = {
  eau: FL.eau(293.15), sol: FL.air(FL.ISO2533.T0, FL.ISO2533.p0), alt: FL.air(A11.T, A11.p),
  vdt: FL.air(FL.ISO2533.T0, 20 * FL.ISO2533.p0), froid: FL.air(110, 4.5e5, 0.0280134),
};
const pow10 = re => { const e = Math.floor(Math.log10(re) + 1e-9); return "10" + F.sup(e); };

/* ---------- échelle des nombres de Reynolds, et calculatrice ---------- */
(() => {
  /* [id, L (m), v (m·s⁻¹), fluid]: sizes and speeds stated in the table text */
  const ROWS = [["bacterie", 2e-6, 30e-6, "eau"], ["brouillard", 1e-5, 3e-3, "sol"], ["poisson", 0.3, 1, "eau"],
    ["nageur", 2, 1, "eau"], ["voiture", 4.5, 36, "sol"], ["avion", 5, 250, "alt"]];
  const words = textOf("ladder.rows", ROWS.map(r => r[0])), lo = 1e-6, hi = 1e9;
  const pos = re => Math.max(0, Math.min(1, Math.log10(re / lo) / Math.log10(hi / lo)));
  $("ladder").innerHTML = ROWS.map(([id, L, v, f]) => { const re = FL.reynolds(v, L, ETAT[f].nu);
    return `<div><span>${words[id]}</span><span class="track" aria-hidden="true"><i style="left:${(100 * pos(re)).toFixed(1)}%"></i></span><span class="v">${pow10(re)}</span></div>`; }).join("");
  let fluid = "eau";
  const lsl = $("lsl"), vsl = $("vsl");
  function draw() {
    const L = Math.pow(10, +lsl.value), v = Math.pow(10, +vsl.value), s = ETAT[fluid], re = FL.reynolds(v, L, s.nu);
    $("lread").textContent = F.si(L, "m"); $("vread").textContent = F.si(v, MS);
    $("vnu").textContent = F.qty(F.sci(s.nu, 2), "m²·s⁻¹"); $("fnu").innerHTML = t("calc.f." + fluid, { T: F.kelvin(s.T) });
    $("vre").textContent = re < 0.01 || re >= 1e5 ? F.sci(re, 2) : F.num(re, 2);
    $("fre").textContent = t("regime." + FL.regime(re));
  }
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { fluid = b.dataset.f;
    document.querySelectorAll("[data-f]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  lsl.oninput = vsl.oninput = draw; draw();
})();

/* ---------- similitude : vitesse de la maquette, nombre de Mach ---------- */
(() => {
  const REEL = { voiture: { L: 4.5, V: 36, etat: ETAT.sol }, avion: { L: 5, V: 250, etat: ETAT.alt } };
  const MACH_INC = 0.3;
  let souffl = "air";
  const ksl = $("ksl"), sel = $("objet");
  const TUNNEL = { air: ETAT.sol, vdt: ETAT.vdt, froid: ETAT.froid, eau: Object.assign({ c: FL.CSON_EAU }, ETAT.eau) };
  function draw() {
    const r = REEL[sel.value], k = Math.pow(10, +ksl.value), m = TUNNEL[souffl];
    const s = FL.similitude({ L: r.L, V: r.V, nu: r.etat.nu, c: r.etat.c }, k, m);
    $("kread").textContent = t("sim.f.k", { k: F.num(k, 3) });
    $("sre").textContent = F.sci(s.re, 2); $("sl").textContent = t("sim.f.l", { l: F.si(s.L, "m") });
    $("sv").textContent = F.si(s.V, MS);
    $("sm").textContent = t("sim.f.mach", { m: F.fix(s.mach, 2), r: F.fix(s.machReel, 2) });
    let v;
    if (s.mach >= 1) v = "super";
    else if (s.mach >= MACH_INC) v = Math.abs(s.mach - s.machReel) < 0.05 ? "deux" : "compressible";
    else v = s.machReel >= MACH_INC ? "machReel" : "ok";
    $("sverdict").textContent = t("sim.v." + v); $("sraison").textContent = t("sim.r." + v);
  }
  document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { souffl = b.dataset.s;
    document.querySelectorAll("[data-s]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  sel.onchange = ksl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["stokes", 1851, "idea"], ["reynolds", 1883, "experiment"], ["wright", 1901, "experiment"], ["sommerfeld", 1908, "idea"], ["vdt", 1923, "experiment"], ["purcell", 1977, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["etw", "micro"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["sens", "a"], ["parametres", "b"], ["maquette", "c"], ["pression", "d"], ["froid", "a"], ["cylindre", "b"], ["bacterie", "c"], ["mach", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 413 });
})();
</script>
