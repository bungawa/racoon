<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const DEG = Math.PI / 180, M = 1;
const deg = a => F.num(a / DEG, 3) + "°";
const pct = r => F.qty(F.num(r * 100, 3), "%");

/* ---------- §3 : rouler ou glisser, et où part l'énergie ---------- */
(() => {
  const svg = $("bilan"), P = Plot.el;
  function draw() {
    const th = +$("th").value * DEG, p = Forces.PAIRS[$("pair").value], k = $("forme").value;
    const r = Contact.planIncline({ theta: th, k, mus: p.mus, muk: p.muk }), b = Forces.incline(th, p.mus, p.muk);
    svg.innerHTML = "";
    /* one bar: where the lost potential energy goes, in proportions */
    const X0 = 20, W = 600, Y = 40, H = 46, parts = [["translation", "c-tint"], ["rotation", "c-ok"], ["chaleur", "c-warn"]];
    let x = X0;
    parts.forEach(([id, cls]) => {
      const w = W * r.fractions[id];
      if (w > 0.5) P("rect", { x: x.toFixed(1), y: Y, width: w.toFixed(1), height: H, class: "fill " + cls }, svg);
      if (w > 60) { const tx = P("text", { x: (x + w / 2).toFixed(1), y: Y + H + 22, "text-anchor": "middle" }, svg); tx.textContent = pct(r.fractions[id]); }
      x += w;
    });
    P("rect", { x: X0, y: Y, width: W, height: H, class: "stroke thin c-label-2" }, svg);
    $("thv").textContent = deg(th);
    $("vetat").textContent = t(r.roule ? "pl.roule" : "pl.glisse");
    $("flim").textContent = t("pl.f.lim", { a: deg(r.thetaMax), b: deg(Forces.angleLimite(p.mus)), bloc: t(b.glisse ? "pl.bloc.glisse" : "pl.bloc.adhere") });
    $("va").textContent = F.si(r.a, "m·s⁻²", { sig: 3 });
    $("fa").textContent = t("pl.f.a", { a: F.si(Forces.G0 * Math.sin(th), "m·s⁻²", { sig: 3 }) });
    $("vp").textContent = r.roule ? F.si(0, "W", { sig: 1 }) : (F.MINUS + F.si(-M * r.puissance(1), "W", { sig: 3 }));
  }
  ["forme", "pair"].forEach(id => { $(id).onchange = draw; }); $("th").oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lagrange1788", 1788, "idea"], ["coriolis1829", 1829, "idea"], ["reuleaux1875", 1875, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["roulement", "frein"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["referentiel", "a"], ["roule", "c"], ["vitesse", "b"], ["angle", "d"], ["pivot", "a"], ["chaleur", "c"], ["roulement", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 4301 });
})();
</script>
