<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
/* ---------- la forme du trou fixe le champ qu'on y trouve ---------- */
(() => {
  const svg = $("cav"), sm = $("sm"), sk = $("sk");
  function draw() {
    const m = Math.pow(10, +sm.value), k = 1 + Math.pow(10, +sk.value), L = ES.depolarisation(m);
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-1.5, 1.5], ticks: 6, label: t("fig.x"), fmt: v => F.num(Math.pow(10, v), 2) }, y: { domain: [0, 1], label: t("fig.y") } });
    Plot.el("line", { x1: A.x(-1.5), x2: A.x(1.5), y1: A.y(1 / 3), y2: A.y(1 / 3), class: "stroke thin dash c-label" }, A.g);
    Plot.el("path", { d: Plot.path(Array.from({ length: 151 }, (_, i) => -1.5 + i / 50).map(u => [A.x(u), A.y(ES.depolarisation(Math.pow(10, u)))])), class: "stroke bold c-tint" }, A.g);
    Plot.el("circle", { cx: A.x(+sm.value), cy: A.y(L), r: 5, class: "fill c-tint" }, A.g);
    /* the hole, drawn to shape (same area), the field along the vertical */
    const cx = 540, cy = 80, R = 26, ry = Math.min(60, R * Math.pow(m, 0.5)), rx = Math.min(60, R / Math.pow(m, 0.5));
    Plot.el("ellipse", { cx, cy, rx, ry, class: "stroke c-warn", fill: "none" }, svg);
    Plot.fleche(svg, [cx - 78, cy + 40], [cx - 78, cy - 40], { cls: "c-label" });
    Plot.el("text", { x: cx - 72, y: cy + 4, class: "tick" }, svg).textContent = t("fig.E");
    $("rm").textContent = F.num(m, 2); $("rk").textContent = F.num(k, k < 1.1 ? 5 : 3);
    $("vL").textContent = F.num(L, 3);
    $("fL").textContent = t(L < 0.05 ? "f.L.aiguille" : L > 0.9 ? "f.L.fente" : Math.abs(L - 1 / 3) < 0.02 ? "f.L.sphere" : "f.L.entre");
    $("vr").textContent = F.num(1 + L * (k - 1), 4);
    $("fr").textContent = t("f.rap", { s: F.num((k + 2) / 3, 4), n: F.num(k, 4) });
    $("vc").textContent = F.sci((k - 1) / 3, 2);
  }
  sm.oninput = sk.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mossotti", 1850, "idea"], ["lorenz", 1869, "idea"], ["lorentz", 1878, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["indice"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["moyen", "b"], ["parallele", "a"], ["normale", "d"], ["sphere", "c"], ["tiers", "b"], ["gaz", "a"], ["signe", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1104 });
})();
</script>
