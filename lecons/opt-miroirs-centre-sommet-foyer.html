<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique;
const cm = v => F.si(v, "m", { prefix: "m", sig: 3 }), mm = v => F.si(v, "m", { prefix: "m", sig: 2 });

/* ---------- faisceau parallèle sur une calotte de rayon 0,6 m, tracé exactement, contre f = R/2 et l'aberration −h²/(4R) ---------- */
(() => {
  const svg = $("vue"), hs = $("hsl"), nat = $("nature"), RA = 0.6, N = 15;
  const W = 640, H = 288, X = [-1.2, 0.8], Y = [-0.45, 0.45], x = Plot.linScale(X[0], X[1], 0, W), y = Plot.linScale(Y[0], Y[1], H, 0);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  let nature = "concave";
  const line = (g, pts, cls) => Plot.el("path", { d: Plot.path(pts.map(([a, b]) => [x(a), y(b)])), class: cls }, g);
  function draw() {
    svg.innerHTML = "";
    const clip = Plot.el("clipPath", { id: "cadre" }, Plot.el("defs", {}, svg));
    Plot.el("rect", { x: 0, y: 0, width: W, height: H }, clip);
    const g = Plot.el("g", { "clip-path": "url(#cadre)" }, svg);
    const R = nature === "concave" ? -RA : RA, hmax = +hs.value / 100 * RA, f = R / 2;
    line(g, [[X[0], 0], [X[1], 0]], "stroke thin rim");
    const arc = [];
    for (let k = -40; k <= 40; k++) { const yy = 1.04 * hmax * k / 40; arc.push([R - Math.sign(R) * Math.sqrt(R * R - yy * yy), yy]); }
    line(g, arc, "stroke bold c-label");
    for (let k = 0; k < N; k++) {
      const h = -hmax + 2 * hmax * k / (N - 1);
      if (Math.abs(h) < 1e-9) continue;
      const r = O.reflexion({ x: X[0], y: h, u: 0 }, R);
      if (!r) continue;
      const tEnd = (X[0] - r.x) / r.dx;                                                    // jusqu'au bord gauche
      line(g, [[X[0], h], [r.x, r.y], [r.x + tEnd * r.dx, r.y + tEnd * r.dy]], "stroke thin c-tint");
      if (R > 0) { const xa = O.coupeAxe(r); line(g, [[r.x, r.y], [xa, 0]], "stroke thin dash c-label-2"); }
    }
    [[R, "mi.C"], [f, "mi.F"], [0, "mi.S"]].forEach(([xv, k]) => {
      line(g, [[xv, -0.012], [xv, 0.012]], "stroke c-label-2");
      Plot.el("text", { x: x(xv) + 4, y: y(0) + 16, class: "label" }, g).textContent = t(k);
    });
    line(g, [[f, -0.03], [f, 0.03]], "stroke c-warn");
    const xb = O.foyerExact(R, hmax), i = Math.asin(hmax / RA);
    $("hread").textContent = t("mi.h.read", { h: cm(hmax), r: F.num(hmax / RA, 2) });
    $("vf").textContent = cm(f); $("ff").textContent = t(R < 0 ? "mi.f.reel" : "mi.f.virtuel");
    $("vb").textContent = cm(xb); $("fb").textContent = t("mi.f.bord", { i: F.num(i * 180 / Math.PI, 2) });
    $("ve").textContent = mm(xb - f); $("fe").textContent = t("mi.f.ecart", { a: mm(-hmax * hmax / (4 * R)) });
  }
  nat.querySelectorAll("button").forEach(b => b.onclick = () => {
    nature = b.dataset.v; nat.querySelectorAll("button").forEach(c => c.setAttribute("aria-pressed", String(c === b))); draw(); });
  hs.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kepler", 1604, "idea"], ["foucault", 1858, "experiment"], ["arecibo", 1963, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["odeillo", "atelier"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signe", "b"], ["foyer", "d"], ["convexe", "a"], ["vergence", "c"], ["bord", "b"], ["plan", "a"], ["gauss", "d"], ["arecibo", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 321 });
})();
