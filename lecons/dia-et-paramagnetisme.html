    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-magnetisme-induction" data-i18n="monde.magnetisme-induction"></a><span class="aux">›</span><a href="/racoon/etape?id=moments-magnetiques" data-i18n="etape.moments-magnetiques"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mover><mi>M</mi><mo>→</mo></mover><mo>≈</mo><mi>χ</mi><mfrac><mover><mi>B</mi><mo>→</mo></mover><msub><mi>μ</mi><mn>0</mn></msub></mfrac></math></div>
    <p class="validite" data-i18n-html="val.aimantation"></p>
    <p data-i18n-html="s1.p3"></p>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><msub><mi>F</mi><mi>x</mi></msub><mo>=</mo><mfrac><mrow><mi>χ</mi><mi>V</mi></mrow><msub><mi>μ</mi><mn>0</mn></msub></mfrac><mspace width="0.1em"/><mi>B</mi><mfrac><mrow><mi>d</mi><mi>B</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.force"></p>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <p data-i18n-html="s3.p2"></p>
    <p data-i18n-html="s3.p3"></p>
    <div class="box rem"><b data-i18n="ferro.title"></b>
      <p id="ferro"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <figure>
      <div class="panel">
        <div class="seg" role="group" id="mats" data-i18n-attr="aria-label:fig.choix">
          <button type="button" data-m="bismuth" aria-pressed="true" data-i18n="mat.bismuth"></button>
          <button type="button" data-m="eau" data-i18n="mat.eau"></button>
          <button type="button" data-m="cuivre" data-i18n="mat.cuivre"></button>
          <button type="button" data-m="aluminium" data-i18n="mat.aluminium"></button>
        </div>
        <div class="controls">
          <div class="ctl"><div class="row"><label for="sb" data-i18n="fig.b"></label><output id="sbr" for="sb"></output></div>
            <input id="sb" type="range" min="-1" max="1.3" step="0.01" value="0"></div>
          <div class="ctl"><div class="row"><label for="sl" data-i18n="fig.l"></label><output id="slr" for="sl"></output></div>
            <input id="sl" type="range" min="-3" max="-1" step="0.01" value="-2"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.f"></span><span class="v" id="vf"></span><span class="f" id="ff"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.p"></span><span class="v" id="vp"></span><span class="f" id="fp"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.lev"></span><span class="v" id="vl"></span><span class="f" id="fl"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="sys.title"></b>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>

    <div class="list keyed" id="uses"></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/dia-et-paramagnetisme.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/physique-fondamentale.js"></script>
<script src="/racoon/lecons/champs-em.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/magnetisme-induction.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes;

/* ---------- ferromagnétisme : l'interaction dipolaire seule n'ordonnerait qu'en dessous de quelques centièmes de kelvin ---------- */
(() => {
  const d = 0.25e-9, U = Cst.mu0 * Cst.mu_B ** 2 / (4 * Math.PI * d ** 3), T = U / Cst.k_B, Tc = 1043;
  $("ferro").innerHTML = t("ferro.body", { d: F.si(d, "m", { prefix: "n" }), U: F.si(U, "J"), T: F.si(T, "K", { sig: 2 }), Tc: F.kelvin(Tc), r: F.sci(Tc / T, 1) });
})();

/* ---------- un échantillon de 1 cm³ dans un champ qui décroît sur la longueur L ---------- */
(() => {
  const sb = $("sb"), sl = $("sl"), V = 1e-6; let nom = "bismuth";
  function draw() {
    const m = M.SUSCEPTIBILITES[nom], B = Math.pow(10, +sb.value), L = Math.pow(10, +sl.value), grad = -B / L;   // B falls along +x
    const Fx = M.forceSusceptible(m.chi, V, B, grad), P = m.rho * V * Cst.g0, BdB = Math.abs(M.levitation(m.chi, m.rho));
    $("sbr").textContent = F.si(B, "T", { sig: 2 });
    $("slr").textContent = F.si(L, "m", { prefix: "m", sig: 2 });
    $("vf").textContent = F.si(Math.abs(Fx), "N", { sig: 2 });
    $("ff").textContent = t(Fx > 0 ? "fig.f.loin" : "fig.f.vers", { chi: F.sci(m.chi, 3) });
    $("vp").textContent = F.si(P, "N", { sig: 3 });
    $("fp").textContent = t("fig.f.p", { r: F.sci(Math.abs(Fx) / P, 2) });
    $("vl").textContent = t("fig.lev", { v: F.sci(BdB, 2) });
    $("fl").textContent = t("fig.f.lev", { v: F.sci(B * B / L, 2) });
  }
  document.querySelectorAll("#mats button").forEach(b => b.onclick = () => {
    nom = b.dataset.m; document.querySelectorAll("#mats button").forEach(z => z.setAttribute("aria-pressed", z === b)); draw(); });
  sb.oninput = sl.oninput = draw; draw();
})();

/* ---------- le système décrit : la grenouille de Nijmegen ---------- */
(() => {
  const w = M.SUSCEPTIBILITES.eau, BdB = Math.abs(M.levitation(w.chi, w.rho)), B = 10, G = BdB / B;
  $("sys1").innerHTML = t("sys1.body", { chi: F.sci(w.chi, 3), BdB: F.sci(BdB, 2), B: F.si(B, "T"), G: F.si(G, "T·m⁻¹", { sig: 2 }), L: F.si(B / G, "m", { prefix: "m", sig: 2 }),
    M: F.si(Math.abs(w.chi) * B / Cst.mu0, "A·m⁻¹", { sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["brugmans", 1778, "experiment"], ["faraday", 1845, "experiment"], ["curie", 1895, "experiment"], ["geim", 1997, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["balance"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signe", "b"], ["lenz", "a"], ["temperature", "d"], ["uniforme", "c"], ["ordre", "b"], ["para", "a"], ["ferro", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 341 });
})();
</script>
</body>
</html>
