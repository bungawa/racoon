          <div class="ctl"><div class="row"><label for="pi" data-i18n="co.p"></label><output id="piv" for="pi"></output></div>

<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, R = Constantes.R;

/* ---------- l'eau liquide chauffée à volume constant ---------- */
(() => {
  const W = S.EAU_293, dpdt = W.alpha / W.chiT;
  $("eau").innerHTML = t("eau.inner", { T: F.kelvin(W.T), alpha: F.qty(F.sci(W.alpha, 3), "K⁻¹"), chi: F.qty(F.sci(W.chiT, 3), "Pa⁻¹"),
    dpdt: F.qty(F.num(dpdt / 1e6, 2), "MPa·K⁻¹"), dv: F.num(100 * W.alpha * 10, 2), p10: F.si(10 * dpdt, "Pa", { sig: 2 }),
    gaz: F.qty(F.num(1e5 / W.T / 1e3, 2), "kPa·K⁻¹") });
})();

/* ---------- α T et χ_T P mesurés contre Van der Waals ---------- */
(() => {
  const svg = $("coef"), sg = $("gaz"), st = $("ti"), sp = $("pi"), YMIN = 0.1, YMAX = 50;
  const temps = g => Object.keys(S.ISO[g]).map(Number).sort((a, b) => a - b);
  const dans = y => y >= YMIN && y <= YMAX;
  function draw() {
    const g = sg.value, T = temps(g)[+st.value], i = +sp.value, Iso = S.isotherme(g, T), G = S.vdwCritique(g);
    const vdw = Iso.P.map(P => { const V = S.racinesVdw(G, P, T).pop(); return S.coeffsVdw(G, V, T); });
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44, l: 56 },
      x: { domain: [0, 30], label: t("co.x") }, y: { scale: "log", domain: [YMIN, YMAX], label: t("co.y"), fmt: v => F.num(v, 2) } });
    Plot.el("line", { x1: o.x(0), x2: o.x(30), y1: o.y(1), y2: o.y(1), class: "ref" }, o.g);
    const courbe = (ys, cls) => Plot.el("path", { d: Plot.path(Iso.P.map((P, k) => [P / 1e6, ys[k]]).filter(p => dans(p[1])).map(([x, y]) => [o.x(x), o.y(y)])), class: cls }, o.g);
    courbe(vdw.map(c => c.alpha * T), "stroke dash c-tint");
    courbe(vdw.map((c, k) => c.chiT * Iso.P[k]), "stroke dash c-ok");
    courbe(Iso.alpha.map(a => a * T), "stroke c-tint");
    courbe(Iso.chiT.map((c, k) => c * Iso.P[k]), "stroke c-ok");
    const P = Iso.P[i], a = Iso.alpha[i], c = Iso.chiT[i], cv = vdw[i];
    for (const [y, cls] of [[a * T, "c-tint"], [c * P, "c-ok"]]) if (dans(y)) Plot.el("circle", { cx: o.x(P / 1e6), cy: o.y(y), r: 5, class: "fill " + cls }, o.g);
    const ident = T * Iso.Vm[i] * a * a / c;
    $("tiv").innerHTML = F.kelvin(T);
    $("piv").textContent = F.si(P, "Pa", { sig: 3 });
    $("valpha").textContent = F.qty(F.sci(a, 3), "K⁻¹"); $("falpha").textContent = t("co.f.parfait", { x: F.num(a * T, 3) });
    $("vchi").textContent = F.qty(F.sci(c, 3), "Pa⁻¹"); $("fchi").textContent = t("co.f.parfait", { x: F.num(c * P, 3) });
    $("vdpdt").textContent = F.si(a / c, "Pa·K⁻¹", { sig: 3 });
    $("vcpcv").textContent = F.qty(F.num(Iso.cpcv[i], 4), "J·mol⁻¹·K⁻¹"); $("fcpcv").textContent = t("co.f.cpcv", { x: F.num(Iso.cpcv[i] / R, 3) });
    $("vident").textContent = F.qty(F.num(ident, 4), "J·mol⁻¹·K⁻¹");
    $("vvdw").textContent = F.qty(F.num(cv.cpcv, 3), "J·mol⁻¹·K⁻¹");
    const C = S.CRITIQUE[g], r = Iso.cpcv[i] / R;
    $("sys").innerHTML = t("sys.inner", { gaz: t("gaz." + g), T: F.kelvin(T), P: F.si(P, "Pa", { sig: 3 }), tr: F.fix(T / C.Tc, 2),
      pr: F.fix(P / C.Pc, 2), z: F.fix(Iso.Z[i], 3), r: F.num(r, 3), avis: t(Math.abs(r - 1) < 0.05 ? "sys.ok" : r < 3 ? "sys.moyen" : "sys.ko") });
  }
  sg.onchange = st.oninput = sp.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["canton", 1762, "experiment"], ["mayer", 1842, "idea"], ["zosel", 1970, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["vase", "cafe"], uses = textOf("uses.items", USES);
  const I350 = S.isotherme("CO2", 350), k = S.ISO_P.indexOf(16), chi = I350.chiT[k];
  const extra = { chi: F.qty(F.sci(chi, 2), "Pa⁻¹"), fois: F.num(chi / S.EAU_293.chiT, 2), dr: F.num(100 * chi * 1e6, 2), T: F.kelvin(350) };
  const TEXTE = { vase: "uses.vase.text", cafe: "uses.cafe.text" };
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${t(TEXTE[id], extra)}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["parfait", "b"], ["eau", "d"], ["cyclique", "a"], ["l", "c"], ["mayer", "b"], ["critique", "a"], ["signe", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 4104 });
})();
</script>
