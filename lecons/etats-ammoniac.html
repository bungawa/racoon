<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, A = Q.aDepuisFrequence(23.87e9), T = Q.periodeAmmoniac(A), PS = 1e-12, H = [[0, -A], [-A, 0]];
const p = z => { const c = Q.cx(z); return c.re * c.re + c.im * c.im; };

/* ---------- a state chosen by its amplitudes in the base 1, 2, read in the base I, II ---------- */
(() => {
  const svg = $("fig"), sth = $("sth"), sph = $("sph"), DUREE = 2 * T, N = 300;
  function draw() {
    const th = +sth.value * Math.PI / 180, ph = +sph.value * Math.PI / 180;
    const v = [Math.cos(th), { re: Math.sin(th) * Math.cos(ph), im: Math.sin(th) * Math.sin(ph) }], [cI, cII] = Q.baseIII(v), PI = p(cI), PII = p(cII);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, DUREE / PS], label: t("fig.x"), fmt: u => F.num(u, 0) },
      y: { domain: [0, 1], label: t("fig.y"), fmt: u => F.num(u, 1) } });
    const pts = Array.from({ length: N + 1 }, (_, k) => [x(DUREE * k / N / PS), y(p(Q.evolutionExacte(H, v, DUREE * k / N)[0]))]);
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold" }, Plot.el("g", { class: "c-tint" }, g));
    const ligne = (u, cls) => Plot.el("line", { x1: x(0), x2: x(DUREE / PS), y1: y(u), y2: y(u), class: "stroke dash" }, Plot.el("g", { class: cls }, g));
    ligne(PI, "c-warn"); ligne(PII, "c-label-2");
    let lo = 1, hi = 0; for (const q of pts) { const u = 1 - (q[1] - y(1)) / (y(0) - y(1)); lo = Math.min(lo, u); hi = Math.max(hi, u); }
    $("sthr").textContent = F.num(+sth.value, 0) + "°";
    $("sphr").textContent = F.num(+sph.value, 0) + "°";
    $("vpI").textContent = t("fig.v.pI", { a: F.num(PI, 3), b: F.num(PII, 3) });
    $("fpI").textContent = t("fig.f.pI");
    $("vE").textContent = t("fig.v.E", { e: F.num((PI - PII) * A / K.e * 1e6, 1) });
    $("fE").textContent = t("fig.f.E", { A: F.num(A / K.e * 1e6, 1) });
    $("vosc").textContent = F.num(hi - lo, 3);
    $("fosc").textContent = t(hi - lo < 1e-3 ? "fig.f.stat" : "fig.f.osc", { d: F.num(2 * Math.sqrt(PI * PII), 3) });
  }
  sth.oninput = sph.oninput = draw; draw();
})();

/* ---------- the system described: one molecule, many molecules ---------- */
(() => {
  $("sys").innerHTML = t("sys.body", { deuxA: F.si(2 * A / K.e, "eV", { prefix: "µ" }), kT: F.si(K.k_B * 300 / K.e, "eV", { prefix: "m" }),
    f: F.num(100 * (1 - Math.exp(-2 * A / (K.k_B * 300))) / (1 + Math.exp(-2 * A / (K.k_B * 300))), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hund", 1926, "idea"], ["chiral", 1927, "idea"], ["cleeton", 1934, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["spectro"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["base", "c"], ["stat", "a"], ["un", "d"], ["energie", "b"], ["moyenne", "c"], ["phase", "a"], ["gaz", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 911 });
})();
</script>
