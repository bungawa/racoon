<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lames minces colorées et cristaux</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-optique-ondulatoire" data-i18n="monde.optique-ondulatoire"></a><span class="aux">›</span><a href="/racoon/etape?id=opt-diffraction" data-i18n="etape.opt-diffraction"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-optique" href="/racoon/atlas?piste=optique" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/etape?id=opt-reseau" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>Δ</mi><mo>=</mo><mn>2</mn><mi>n</mi><mi>e</mi><mi data-i18n="eq.cos"></mi><msub><mi>θ</mi><mn>1</mn></msub></math></div>
    <p class="validite" data-i18n-html="val.marche"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mi>R</mi><mo>≈</mo><mn>4</mn><msup><mi>r</mi><mn>2</mn></msup><msup><mi data-i18n="eq.sin"></mi><mn>2</mn></msup><mo>(</mo><mfrac><mrow><mn>2</mn><mi>π</mi><mi>n</mi><mi>e</mi><mi data-i18n="eq.cos"></mi><msub><mi>θ</mi><mn>1</mn></msub></mrow><mi>λ</mi></mfrac><mo>)</mo><mo>,</mo><mspace width="1em"/><mi>r</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.bulle"></p>
    <p data-i18n-html="s1.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure class="chart">
      <svg class="fig" id="spectre" role="img" data-i18n-attr="aria-label:fig.aria.spectre"></svg>
      <svg class="fig" id="bande" viewBox="0 0 640 96" role="img" data-i18n-attr="aria-label:fig.aria.bande"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.exacte"></span><span class="c-warn" data-i18n="fig.legend.deux"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" role="group" id="mode">
            <button type="button" data-m="bulle" data-i18n="fig.bulle"></button>
            <button type="button" data-m="ar" data-i18n="fig.ar"></button>
          </div>
          <div class="ctl"><div class="row"><label for="se" data-i18n="fig.e"></label><output id="ser" for="se"></output></div>
            <input id="se" type="range" min="0" max="1500" step="5" value="300"></div>
          <div class="ctl"><div class="row"><label for="st" data-i18n="fig.theta"></label><output id="str" for="st"></output></div>
            <input id="st" type="range" min="0" max="80" step="1" value="0"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.marche"></span><span class="v" id="vmarche"></span><span class="f" id="fmarche"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.y"></span><span class="v" id="vy"></span><span class="f" id="fy"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.trous"></span><span class="v" id="vtrous"></span><span class="f" id="ftrous"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mn>2</mn><mi>d</mi><mi data-i18n="eq.sin"></mi><mi>θ</mi><mo>=</mo><mi>p</mi><mi>λ</mi><mo>,</mo><mspace width="1em"/><mi>p</mi><mo>=</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mo>…</mo></math></div>
    <p class="validite" data-i18n-html="val.bragg"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys1"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/opt-lames-minces-cristaux.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/optique-geometrique.js"></script>
<script src="/racoon/optique-ondulatoire.js"></script>
<script src="/racoon/couleurs-optiques.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptOnd, nm = 1e-9, DEG = Math.PI / 180;

/* ---------- la couleur d'une lame : spectre réfléchi, teinte, échelle des teintes ---------- */
(() => {
  const MODES = { bulle: { n: 1.333, n2: 1 }, ar: { n: 1.38, n2: 1.52 } };
  const spectre = $("spectre"), bande = $("bande"), se = $("se"), st = $("st"), seg = $("mode");
  const L = Array.from({ length: 201 }, (_, k) => (380 + 2 * k) * nm);
  let mode = "bulle", cache = "", gain = 1;
  /* real brightness: one gain for the whole scale, the brightest thickness at full scale; a black film stays black */
  const rgb = lin => "rgb(" + lin.map(v => Math.round(255 * OptiqueGeometrique.gammaSRGB(Math.max(0, v * gain)))).join(" ") + ")";
  function echelle(o) {                                      // the colours of thicknesses 0 to 1500 nm, at this angle
    const key = mode + o.theta;
    if (key === cache) return;
    cache = key;
    bande.innerHTML = "";
    const N = 150, W = 520;
    const cs = Array.from({ length: N }, (_, i) => CouleursOptiques.couleurFilm(Object.assign({}, o, { e: (i + 0.5) * 1500 * nm / N })));
    gain = 1 / Math.max(...cs.map(c => Math.max(...c.lin)));
    cs.forEach((c, i) => Plot.el("rect", { x: 56 + i * W / N, y: 8, width: W / N + 0.6, height: 44, fill: rgb(c.lin) }, bande));
    [0, 500, 1000, 1500].forEach(e => {
      Plot.el("text", { x: 56 + e / 1500 * W, y: 70, "text-anchor": "middle", class: "tick" }, bande).textContent = F.num(e, 4);
    });
    Plot.el("text", { x: 56 + W / 2, y: 90, "text-anchor": "middle", class: "label" }, bande).textContent = t("fig.bande.x");
    Plot.el("g", { id: "curseur" }, bande);
  }
  function draw() {
    const m = MODES[mode], theta = +st.value * DEG, e = +se.value * nm;
    const o = { n: m.n, n2: m.n2, theta, e };
    echelle(o);
    const ex = L.map(l => O.film(Object.assign({}, o, { lambda: l }))), c = CouleursOptiques.couleurFilm(o);
    const ymax = mode === "bulle" ? 20 : 6;
    spectre.innerHTML = "";
    const P = Plot.axes(spectre, { fmt: F, w: 640, h: 240, pad: { l: 56 }, x: { domain: [380, 780], label: t("fig.xaxis") }, y: { domain: [0, ymax], label: t("fig.yaxis") } });
    Plot.el("path", { d: Plot.path(L.map((l, i) => [P.x(l / nm), P.y(100 * ex[i].R2)])), class: "stroke thin dash c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(L.map((l, i) => [P.x(l / nm), P.y(Math.min(ymax, 100 * ex[i].R))])), class: "curve" }, P.g);
    /* the minima of R in the visible: the wavelengths the film does not reflect */
    const trous = [];
    for (let i = 1; i < L.length - 1; i++) if (ex[i].R < ex[i - 1].R && ex[i].R <= ex[i + 1].R) trous.push(L[i]);
    trous.forEach(l => Plot.el("line", { x1: P.x(l / nm), x2: P.x(l / nm), y1: P.y(0), y2: P.y(ymax), class: "stroke thin dash c-label-2" }, P.g));
    const cur = $("curseur"); cur.innerHTML = "";
    const xc = 56 + e / (1500 * nm) * 520;
    Plot.el("line", { x1: xc, x2: xc, y1: 4, y2: 56, class: "stroke bold c-label" }, cur);
    Plot.el("rect", { x: 592, y: 8, width: 44, height: 44, rx: 6, fill: rgb(c.lin) }, cur);
    Plot.el("rect", { x: 592, y: 8, width: 44, height: 44, rx: 6, class: "stroke thin c-label-2" }, cur);
    se.setAttribute("aria-valuetext", F.si(e, "m", { prefix: "n", sig: 4 }));
    $("ser").textContent = F.si(e, "m", { prefix: "n", sig: 4 });
    $("str").textContent = F.qty(F.num(+st.value, 2), "°");
    const f = O.film(Object.assign({ lambda: 550 * nm }, o));
    $("vmarche").textContent = F.si(f.difference, "m", { prefix: "n", sig: 3 });
    $("fmarche").textContent = t("fig.f.marche", { th: F.qty(F.num(f.theta1 / DEG, 3), "°") });
    $("vy").textContent = F.qty(F.num(100 * c.Y, 2), "%");
    $("fy").textContent = t(c.saturation < 0.1 ? "fig.f.blanc" : "fig.f.colore");
    $("vtrous").textContent = trous.length ? F.qty(trous.slice(0, 4).map(l => F.num(l / nm, 3)).join(" ; "), "nm") : t("fig.aucun");
    $("ftrous").textContent = t(trous.length > 4 ? "fig.f.nombreux" : "fig.f.trous", { n: trous.length });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { mode = b.dataset.m; if (mode === "ar") se.value = 100; draw(); });
  se.oninput = st.oninput = draw; draw();
})();

/* ---------- le système décrit : sel gemme et rayons X du cuivre ---------- */
(() => {
  const d = 282e-12, lX = 154.06e-12, lV = 500 * nm, os = O.ordresBragg(d, lX), N = 1e-6 / d;
  $("sys1").innerHTML = t("sys1.body", { d: F.si(d, "m", { prefix: "p", sig: 3 }), l: F.si(lX, "m", { prefix: "p", sig: 5 }),
    th: os.map(o => F.qty(F.num(o.theta / DEG, 4), "°")).join(" ; "), n: os.length, lv: F.si(lV, "m", { prefix: "n", sig: 3 }),
    r: F.num(lV / (2 * d), 3), N: F.sci(N, 2), w: F.sci(1 / N, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hooke", 1665, "experiment"], ["newton", 1704, "experiment"], ["young", 1802, "idea"], ["laue", 1912, "experiment"], ["bragg", 1912, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ar", "rx"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["epaisse", "b"], ["noir", "d"], ["angle", "a"], ["pourpre", "c"], ["ar", "b"], ["rx", "a"], ["intensites", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 305 });
})();
</script>
</body>
</html>
