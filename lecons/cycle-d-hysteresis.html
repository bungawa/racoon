<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, C = Constantes;
const MS = M.FER_MS, W = M.paroi(M.FER_PAROI.A, M.FER_PAROI.K);

/* ---------- le système décrit : énergie de champ contre énergie de paroi ---------- */
(() => {
  $("sys1").innerHTML = t("sys1.body", { u: F.si(C.mu0 * MS * MS / 2, "J·m⁻³", { sig: 2 }), s: F.si(W.sigma, "J·m⁻²", { sig: 1 }),
    d: F.si(W.delta, "m", { sig: 2 }), L: F.si(W.sigma / (C.mu0 * MS * MS / 2), "m", { sig: 2 }) });
})();

/* ---------- domaines en bandes ---------- */
(() => {
  const sl = $("sl");
  function draw() {
    const L = Math.pow(10, +sl.value), d = M.domainesBandes(W.sigma, MS, L), svg = $("bandes"); svg.innerHTML = "";
    const D0 = d.D / 100, D1 = Math.min(d.D * 100, 1e-1), ds = Array.from({ length: 160 }, (_, i) => D0 * Math.pow(D1 / D0, i / 159));
    const ys = ds.map(D => d.energie(D)), y0 = Math.min(d.E, d.Eun) / 3, y1 = Math.max(...ys, d.Eun) * 1.5;
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [D0, D1], scale: "log", label: t("fig1.ax.x") },
      y: { domain: [y0, y1], scale: "log", label: t("fig1.ax.y") } });
    /* only the part of each curve inside the frame (monotonic pieces: the kept points are contiguous) */
    const trace = (f, cls) => { const pts = ds.map(D => [D, f(D)]).filter(q => q[1] >= y0 && q[1] <= y1);
      if (pts.length > 1) Plot.el("path", { d: Plot.path(pts.map(q => [P.x(q[0]), P.y(q[1])])), class: cls }, P.g); };
    trace(D => W.sigma * L / D, "stroke thin dash c-label-2");
    trace(D => 2 * d.kappa * C.mu0 * MS * MS * D, "stroke thin dash c-label-2");
    trace(D => d.energie(D), "curve");
    if (d.Eun <= y1) Plot.el("line", { x1: P.x(D0), x2: P.x(D1), y1: P.y(d.Eun), y2: P.y(d.Eun), class: "ref" }, P.g);
    Plot.el("circle", { cx: P.x(d.D), cy: P.y(d.E), r: 5, class: "dot" }, P.g);
    $("slr").innerHTML = F.si(L, "m", { sig: 2 });
    $("vd").innerHTML = F.si(d.D, "m", { sig: 2 });
    $("fd").innerHTML = t("fig1.f.d", { n: F.num(Math.max(1, d.domaines), 2) });
    $("vg").textContent = F.num(d.Eun / d.E, 2);
    $("fg").innerHTML = t(d.E < d.Eun ? "fig1.f.gain" : "fig1.f.perte");
    $("vlc").innerHTML = F.si(d.Lc, "m", { sig: 2 });
    $("flc").innerHTML = t("fig1.f.lc");
  }
  sl.oninput = draw; draw();
})();

/* ---------- une paroi accrochée : le cycle et ses sauts ---------- */
(() => {
  const sa = $("sa"), sn = $("sn"); let graine = 7;
  function draw() {
    const amax = +sa.value * 1e-6, Nd = +sn.value * 1e-5;
    const pa = M.paroiAccrochee({ amax, Nd, graine }), Hmax = 1.5 * pa.Hp + 1.2 * Nd * MS, c = pa.cycle(Hmax, 400);
    let svg = $("cycle"); svg.innerHTML = "";
    let P = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-Hmax, Hmax], label: t("fig2.ax.x") }, y: { domain: [-1.1, 1.1], label: t("fig2.ax.y") } });
    Plot.el("line", { x1: P.x(-Hmax), x2: P.x(Hmax), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("line", { x1: P.x(0), x2: P.x(0), y1: P.y(-1.1), y2: P.y(1.1), class: "zero" }, P.g);
    /* a branch is drawn as a staircase: M holds, then jumps at the field where the wall breaks free */
    const marches = br => { const out = []; br.forEach((p, i) => { if (i) out.push([p.H, br[i - 1].M]); out.push([p.H, p.M]); }); return out; };
    Plot.el("path", { d: Plot.path(marches(c.descente).map(q => [P.x(q[0]), P.y(q[1] / MS)])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(marches(c.montee).map(q => [P.x(q[0]), P.y(q[1] / MS)])), class: "curve" }, P.g);
    svg = $("clics"); svg.innerHTML = "";
    const smax = Math.max(1e-3, ...c.sauts.map(s => s / MS));
    P = Plot.axes(svg, { fmt: F, w: 640, h: 130, x: { domain: [-Hmax, Hmax], label: t("fig2.ax.x") }, y: { domain: [0, smax * 1.1], label: t("fig2.ax.y2") } });
    for (const p of c.montee.concat(c.descente)) if (p.saut > 0)
      Plot.el("line", { x1: P.x(p.H), x2: P.x(p.H), y1: P.y(0), y2: P.y(p.saut / MS), class: "stroke c-label-2" }, P.g);
    $("sar").innerHTML = F.si(amax, "J·m⁻²", { sig: 2 });
    $("snr").textContent = Nd === 0 ? "0" : F.sci(Nd, 2);
    $("vhc").innerHTML = F.si(c.Hc, "A·m⁻¹", { sig: 2 });
    $("fhc").innerHTML = t("fig2.f.hc", { hp: F.si(pa.Hp, "A·m⁻¹", { sig: 2 }) });
    $("vmr").textContent = F.num(c.Mr / MS, 2);
    $("fmr").innerHTML = t("fig2.f.mr", { nm: F.si(Nd * MS, "A·m⁻¹", { sig: 2 }) });
    $("vsauts").textContent = String(c.sauts.length);
    $("fsauts").innerHTML = t("fig2.f.sauts", { s: F.num(50 * smax, 2) });
  }
  sa.oninput = sn.oninput = draw;
  $("tirage").onclick = () => { graine = graine * 31 % 9973 + 1; draw(); };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["barkhausen", 1919, "experiment"], ["landau", 1935, "idea"], ["kittel", 1946, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rectification"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pourquoi", "c"], ["echelle", "a"], ["racine", "d"], ["direction", "b"], ["sauts", "a"], ["cisaille", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 373 });
})();
</script>
