<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §49-2 : corde d'acier de 65 cm, f₁ = 330 Hz (c = 429 m·s⁻¹), pincée de 2 mm ---------- */
(() => {
  const O = self.Ondes, L = 0.65, C = 429, H = 0.002, NB = 12, XS = Array.from({ length: 521 }, (_, i) => L * i / 520);
  function upd() {
    const pr = +$("pp").value, N = +$("nn").value, P = O.pincee(L, C, pr * L, H), per = 2 * L / C, tt = +$("tt").value * per;
    const svg = $("co"); svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 220, pad: { l: 52, b: 44 }, x: { domain: [0, L], label: t("co.xaxis") }, y: { domain: [-2.4, 2.4], label: t("co.yaxis") } });
    Plot.el("path", { d: Plot.path(XS.map(x => [A.x(x), A.y(1000 * P.exacte(x, tt))])), class: "stroke thin c-warn" }, A.g);
    Plot.el("path", { d: Plot.path(XS.map(x => [A.x(x), A.y(1000 * P.somme(x, tt, N))])), class: "stroke c-tint" }, A.g);
    /* la part de l'énergie dans chacun des douze premiers modes */
    const bs = $("ba"); bs.innerHTML = "";
    const B = Plot.axes(bs, { fmt: F, w: 640, h: 180, pad: { l: 52, b: 44 }, x: { domain: [0.4, NB + 0.6], label: t("ba.xaxis"), ticks: NB }, y: { domain: [0, 100], label: t("ba.yaxis") } });
    for (let n = 1; n <= NB; n++) { const v = 100 * P.fraction(n), w = (B.x(1) - B.x(0)) * 0.6;
      Plot.el("rect", { x: B.x(n) - w / 2, y: B.y(v), width: w, height: Math.max(0, B.y(0) - B.y(v)), class: "fill " + (n <= N ? "c-tint" : "c-label-2") }, B.g); }
    let kept = 0; for (let n = 1; n <= N; n++) kept += P.fraction(n);
    const absents = []; for (let n = 1; n <= NB; n++) if (P.fraction(n) < 1e-6) absents.push(n);
    $("ppv").textContent = F.num(pr, 3) + " L"; $("nnv").textContent = String(N); $("ttv").textContent = F.si(tt, "s");
    $("vf1").textContent = F.si(P.f1, "Hz", { prefix: "" }); $("ff1").textContent = t("co.f.per", { T: F.si(per, "s") });
    $("vfo").textContent = F.num(100 * P.fraction(1), 3) + " %"; $("ffo").textContent = t("co.f.kept", { N, e: F.num(100 * kept, 4) + " %" });
    $("vab").textContent = absents.length ? absents.join(", ") : t("co.f.aucun"); $("fab").textContent = t("co.f.noeud");
  }
  ["pp", "nn", "tt"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mersenne", 1636, "idea"], ["sauveur", 1701, "experiment"], ["taylor", 1713, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["laser", "piano"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["discret", "b"], ["octave", "c"], ["milieu", "a"], ["tiers", "d"], ["somme", "b"], ["tension", "a"], ["laser", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 492 });
})();
</script>
