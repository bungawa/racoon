<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- carte des régimes : σ/d (dilué ?) et λ/d (classique ?) dans le plan (T, P) ---------- */
(() => {
  const svg = $("carte"), sg = $("gaz"), st = $("tk"), sp = $("pk"), { k_B, N_A } = Constantes;
  const TMIN = 1, TMAX = 1e4, PMIN = 1e2, PMAX = 1e9, SEUIL = 0.3;
  const T_ = s => TMIN * Math.pow(TMAX / TMIN, s / 100), P_ = s => PMIN * Math.pow(PMAX / PMIN, s / 100);
  const s_ = (v, a, b) => Math.round(100 * Math.log(v / a) / Math.log(b / a));
  function draw() {
    const g = sg.value, T = T_(+st.value), P = P_(+sp.value), r = Statistique.regime(g, T, P);
    const sigma = r.sigma, m = Statistique.M[g] / N_A;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { b: 44, l: 56 },
      x: { scale: "log", domain: [TMIN, TMAX], label: t("carte.x") }, y: { scale: "log", domain: [PMIN, PMAX], label: t("carte.y") } });
    const line = f => { const pts = []; for (let i = 0; i <= 160; i++) { const TT = TMIN * Math.pow(TMAX / TMIN, i / 160), PP = f(TT);
      if (PP >= PMIN && PP <= PMAX) pts.push([o.x(TT), o.y(PP)]); } return Plot.path(pts); };
    // σ/d = SEUIL  ⇔  n* = (SEUIL/σ)³ ;  λ/d = SEUIL  ⇔  n* = (SEUIL/λ)³ ; P = n* k_B T
    Plot.el("path", { d: line(TT => Math.pow(SEUIL / sigma, 3) * k_B * TT), class: "stroke c-tint" }, o.g);
    Plot.el("path", { d: line(TT => Math.pow(SEUIL / Statistique.lambdaTh(m, TT), 3) * k_B * TT), class: "stroke c-warn" }, o.g);
    Plot.el("text", { x: o.x(3e3), y: o.y(1e3), class: "note" }, o.g).textContent = t("carte.zone");
    Plot.el("circle", { cx: o.x(T), cy: o.y(P), r: 6, class: "dot" }, o.g);
    $("tkv").innerHTML = F.kelvin(T);
    $("pkv").textContent = F.si(P, "Pa", { sig: 2 });
    $("vn").textContent = F.qty(F.sci(r.n, 2), "m⁻³");
    $("vd").textContent = F.si(r.d, "m", { sig: 2 });
    $("vsd").textContent = F.num(r.sd, 2);
    $("vld").textContent = F.num(r.ld, 2);
    const avis = r.sd > SEUIL ? "sys.dense" : r.ld > SEUIL ? "sys.quant" : Math.max(r.a, r.b) > 0.01 ? "sys.moyen" : "sys.ok";
    $("sys").innerHTML = t("sys.inner", { gaz: t("gaz." + g), T: F.kelvin(T), P: F.si(P, "Pa", { sig: 2 }),
      sigma: F.si(sigma, "m", { sig: 2 }), d: F.si(r.d, "m", { sig: 2 }), sd: F.num(r.sd, 2), ld: F.num(r.ld, 2),
      a: F.num(r.a, 2), b: F.num(r.b, 2), avis: t(avis) });
  }
  const set = (T, P) => { st.value = s_(T, TMIN, TMAX); sp.value = s_(P, PMIN, PMAX); draw(); };
  $("air").onclick = () => { sg.value = "N2"; set(293.15, 101325); };
  $("froid").onclick = () => { sg.value = "He"; set(4.2, 101325); };
  sg.onchange = st.oninput = sp.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dalton", 1808, "idea"], ["avogadro", 1811, "idea"], ["loschmidt", 1865, "experiment"], ["perrin", 1908, "experiment"], ["si", 2019, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sphere", "gaz"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pourquoi", "b"], ["distance", "c"], ["avogadro", "a"], ["helium", "d"], ["covolume", "b"], ["classique", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 391 });
})();
</script>
