<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acte élémentaire, intermédiaire et complexe activé</title>
<link rel="stylesheet" href="/racoon/ds.css">
<style>
  .actes { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .actes figure { flex: 1 1 200px; min-width: 0; margin: 0; }
  .actes svg { width: auto; max-width: 100%; height: auto; }
  .ctls { display: flex; flex-wrap: wrap; gap: 14px; }
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-organique" data-i18n="monde.chim-organique"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-mecanismes" data-i18n="etape.chim-mecanismes"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n-html="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/etape-cinetiquement-determinante" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="box def"><b data-i18n="s1.def.titre"></b>
      <p data-i18n-html="s1.def.corps"></p>
    </div>
    <div class="actes">
      <figure><svg class="fig no-sigle" id="sn2" role="img" data-i18n-attr="aria-label:s1.aria.sn2"></svg><figcaption data-i18n-html="s1.cap.sn2"></figcaption></figure>
      <figure><svg class="fig no-sigle" id="sn1a" role="img" data-i18n-attr="aria-label:s1.aria.sn1a"></svg><figcaption data-i18n-html="s1.cap.sn1a"></figcaption></figure>
      <figure><svg class="fig no-sigle" id="sn1b" role="img" data-i18n-attr="aria-label:s1.aria.sn1b"></svg><figcaption data-i18n-html="s1.cap.sn1b"></figcaption></figure>
    </div>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>v</mi><mo>=</mo><mi>k</mi><mspace width="0.1em"/><mo stretchy="false">[</mo><mi mathvariant="normal">A</mi><msup><mo stretchy="false">]</mo><mi>a</mi></msup><mspace width="0.1em"/><mo stretchy="false">[</mo><mi mathvariant="normal">B</mi><msup><mo stretchy="false">]</mo><mi>b</mi></msup></math></div>
    <p class="validite" data-i18n-html="s2.validite"></p>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure>
      <div class="chart"><svg id="profil" role="img" data-i18n-attr="aria-label:fig.aria"></svg></div>
      <div class="panel">
        <div class="seg" role="group" id="mode"><button type="button" data-m="1" aria-pressed="true" data-i18n="fig.un"></button><button type="button" data-m="2" aria-pressed="false" data-i18n="fig.deux"></button></div>
        <div class="ctls">
          <div class="ctl"><div class="row"><label for="ga" data-i18n="fig.ga"></label><output id="garead" for="ga"></output></div>
            <input id="ga" type="range" min="10" max="150" step="1" value="90"></div>
          <div class="ctl" id="cgi"><div class="row"><label for="gi" data-i18n="fig.gi"></label><output id="giread" for="gi"></output></div>
            <input id="gi" type="range" min="5" max="120" step="1" value="70"></div>
          <div class="ctl" id="cgb"><div class="row"><label for="gb" data-i18n="fig.gb"></label><output id="gbread" for="gb"></output></div>
            <input id="gb" type="range" min="2" max="120" step="1" value="15"></div>
          <div class="ctl"><div class="row"><label for="gp" data-i18n="fig.gp"></label><output id="gpread" for="gp"></output></div>
            <input id="gp" type="range" min="-120" max="60" step="1" value="-30"></div>
          <div class="ctl"><div class="row"><label for="temp" data-i18n="fig.temp"></label><output id="tread" for="temp"></output></div>
            <input id="temp" type="range" min="250" max="450" step="5" value="300"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="fig.det"></span><span class="v" id="det"></span><span class="f" id="detf"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.kapp"></span><span class="v" id="kapp"></span><span class="f" id="kappf"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.vie"></span><span class="v" id="vie"></span><span class="f" id="vief"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.ts"></span><span class="v" id="ts"></span><span class="f" id="tsf"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="eq"><math display="block"><mi>k</mi><mo>=</mo><mfrac><mrow><msub><mi>k</mi><mi mathvariant="normal">B</mi></msub><mi>T</mi></mrow><mi>h</mi></mfrac><mspace width="0.1em"/><mi data-i18n="eq.exp"></mi><mo>⁡</mo><mo>(</mo><mo>−</mo><mfrac><mrow><mi mathvariant="normal">Δ</mi><msup><mi>G</mi><mo>‡</mo></msup></mrow><mrow><mi>R</mi><mi>T</mi></mrow></mfrac><mo>)</mo></math></div>
    <p class="validite" data-i18n-html="s4.validite1"></p>
    <p data-i18n-html="s4.p2"></p>
    <div class="eq"><math display="block"><msub><mi>k</mi><mi data-i18n="eq.app"></mi></msub><mo>=</mo><mfrac><mrow><msub><mi>k</mi><mi mathvariant="normal">B</mi></msub><mi>T</mi><mo>/</mo><mi>h</mi></mrow><mrow><munder><mo>∑</mo><mi>i</mi></munder><mi data-i18n="eq.exp"></mi><mo>⁡</mo><mo>(</mo><mi mathvariant="normal">Δ</mi><msubsup><mi>G</mi><mi>i</mi><mo>‡</mo></msubsup><mo>/</mo><mi>R</mi><mi>T</mi><mo>)</mo></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="s4.validite2"></p>
    <div class="box prop"><b data-i18n="s4.hammond.titre"></b>
      <p data-i18n-html="s4.hammond.corps"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/acte-elementaire-intermediaire.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/thermo.js"></script>
<script src="/racoon/statistique.js"></script>
<script src="/racoon/chim-organique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, sym = s => t("chim.sym", { s });

/* ---------- actes élémentaires dessinés ---------- */
(() => {
  const ACTES = {
    sn2: ["H -0.8 0.5; O 0 0 q-1; C 1.5 0; Br 2.6 0 | 0-1 2-3", [{ de: 1, vers: 2 }, { de: [2, 3], vers: 3 }], true],
    sn1a: ["C 0 0; C -0.866 0.5; C -0.866 -0.5; C 0 1; Br 1.1 0 | 0-1 0-2 0-3 0-4", [{ de: [0, 4], vers: 4 }], false],
    sn1b: ["C 0 0 q+1; C -1 0; C 0.5 0.866; C 0.5 -0.866; O 1.7 0 | 0-1 0-2 0-3", [{ de: 4, vers: 0 }], false],
  };
  for (const [id, [spec, fleches, carbones]] of Object.entries(ACTES)) {
    const s = O.schema(O.mol(spec), { texte: sym, fleches, carbones, echelle: 36 }), svg = document.getElementById(id), vb = s.viewBox.split(" ").map(Number);
    svg.setAttribute("viewBox", s.viewBox); svg.setAttribute("width", Math.round(vb[2] * 1.5)); svg.setAttribute("height", Math.round(vb[3] * 1.5)); svg.innerHTML = s.html;
  }
})();

/* ---------- profil énergétique ---------- */
(() => {
  const kJ = 1000, $ = id => document.getElementById(id), svg = $("profil");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 560, h: 300, pad: { b: 44 },
    x: { domain: [0, 1], label: t("fig.x") }, y: { domain: [-120, 160], label: t("fig.y") } });
  Plot.el("line", { x1: x(0), x2: x(1), y1: y(0), y2: y(0), class: "zero" }, g);
  const courbe = Plot.el("path", { class: "curve" }, g), marques = Plot.el("g", {}, g);
  let n = 1;
  function maj() {
    const T = +$("temp").value, ga = +$("ga").value;
    let gi = Math.min(+$("gi").value, ga - 2), gb = +$("gb").value;
    const ts2 = gi + gb, gp = Math.min(+$("gp").value, (n === 1 ? ga : ts2) - 2);
    const G = (n === 1 ? [0, ga, gp] : [0, ga, gi, ts2, gp]).map(v => v * kJ);
    const p = O.profil(G, 40), c = O.cinetiqueProfil(G, T);
    courbe.setAttribute("d", p.points.map((q, k) => (k ? "L" : "M") + x(q[0]).toFixed(1) + " " + y(q[1] / kJ).toFixed(1)).join(""));
    marques.innerHTML = "";
    const noms = n === 1 ? ["R", "ts", "P"] : ["R", "ts", "I", "ts", "P"];
    p.extremums.forEach((e, k) => {
      Plot.el("circle", { cx: x(e.x), cy: y(e.G / kJ), r: 5, class: "dot" }, marques);
      Plot.el("text", { x: x(e.x), y: y(e.G / kJ) + (e.type === "max" ? -12 : 20), "text-anchor": "middle", class: "note" }, marques).textContent = t("fig.n." + noms[k]);
    });
    $("garead").textContent = F.qty(F.fix(ga, 0), "kJ·mol⁻¹");
    $("giread").textContent = F.qty(F.fix(gi, 0), "kJ·mol⁻¹");
    $("gbread").textContent = F.qty(F.fix(gb, 0), "kJ·mol⁻¹");
    $("gpread").textContent = F.qty(F.fix(gp, 0), "kJ·mol⁻¹");
    $("tread").innerHTML = F.kelvin(T);
    $("det").textContent = n === 1 ? t("fig.seul") : t("fig.acte", { k: c.determinante + 1 });
    $("detf").textContent = t("fig.part", { p: F.qty(F.fix(100 * c.parts[c.determinante], 1), "%") });
    $("kapp").textContent = F.qty(F.sci(c.kapp, 2), "s⁻¹");
    $("kappf").textContent = t("fig.demi", { t: F.qty(F.sci(Math.LN2 / c.kapp, 2), "s") });
    if (n === 2) {
      $("vie").textContent = F.qty(F.sci(1 / (c.kb[0] + c.kf[1]), 2), "s");
      $("vief").textContent = t(c.ecartAeqs <= 0.05 ? "fig.aeqsok" : "fig.aeqsko", { p: F.qty(F.sci(100 * c.ecartAeqs, 1), "%") });
    } else { $("vie").textContent = "—"; $("vief").textContent = t("fig.sansI"); }
    const e = p.extremums, f = (e[1].x - e[0].x) / (e[2].x - e[0].x);
    $("ts").textContent = F.qty(F.fix(100 * f, 0), "%");
    $("tsf").textContent = t(f < 0.4 ? "fig.tot" : f > 0.6 ? "fig.tard" : "fig.milieu");
    $("cgi").hidden = $("cgb").hidden = n === 1;
    document.querySelectorAll("#mode button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.m === n)));
  }
  $("mode").onclick = e => { const b = e.target.closest("button"); if (!b) return; n = +b.dataset.m;
    if (n === 1) { $("ga").value = 90; $("gp").value = -30; } else { $("ga").value = 95; $("gi").value = 70; $("gb").value = 15; $("gp").value = -30; }
    maj(); };
  ["ga", "gi", "gb", "gp", "temp"].forEach(id => $(id).oninput = maj);
  maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["vanthoff", 1884, "idea"], ["arrhenius", 1889, "idea"], ["bodenstein", 1913, "idea"], ["eyring", 1935, "idea"], ["hammond", 1955, "idea"], ["zewail", 1999, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount(document.getElementById("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["calcul", "femto"], uses = textOf("uses.items", USES);
  document.getElementById("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["acte", "b"], ["molecularite", "d"], ["vanthoff", "a"], ["complexe", "c"], ["intermediaire", "b"], ["determinant", "a"], ["hammond", "d"], ["eyring", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount(document.getElementById("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
</html>
