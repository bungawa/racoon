<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, { k_B, hbar } = Constantes;

/* ---------- le miroir sur son fil : dynamique de Langevin ---------- */
(() => {
  const svg = $("trace"), sT = $("tT"), sC = $("tC"), sG = $("tG");
  const I0 = 4e-15, BRAS = 1;                                     // kg·m², m (mirror to scale)
  const lg = (s, a, b) => a * Math.pow(b / a, +s.value);
  let graine = 1;
  function draw() {
    const T = lg(sT, 3, 600), C = lg(sC, 1e-16, 1e-13), q = lg(sG, 0.02, 5);
    const w0 = Math.sqrt(C / I0), g = q * w0, P = 2 * Math.PI / w0, dt = P / 60;
    const r = Quiz.rng(graine), s = S.oscillateurs({ N: 1, m: I0, w0, gamma: g, T }, r);
    s.x[0] = Math.sqrt(k_B * T / C) * Incert.gauss(r);             // start in equilibrium
    const nTrace = 40 * 60, nTot = Math.ceil(60 * Math.max(400, 200 / q));
    const pts = []; let x2 = 0, v2 = 0;
    for (let i = 0; i < nTot; i++) {
      S.langevin(s, dt, r);
      x2 += s.x[0] ** 2; v2 += s.v[0] ** 2;
      if (i < nTrace) pts.push([s.t, s.x[0]]);
    }
    x2 /= nTot; v2 /= nTot;
    const th = Math.sqrt(S.thetaQuadratique(I0, w0, T));
    const ym = Math.max(4 * th, 1e-9), unit = ym > 3e-3 ? 1e-3 : 1e-6, ul = unit === 1e-3 ? "mrad" : "µrad";
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 64 },
      x: { domain: [0, pts[pts.length - 1][0]], label: t("sim.x"), fmt: v => F.num(v, 3) },
      y: { domain: [-ym / unit, ym / unit], label: t("sim.y", { u: ul }), fmt: v => F.num(v, 3) } });
    for (const sgn of [1, -1]) Plot.el("line", { x1: o.x(0), x2: o.x(pts[pts.length - 1][0]), y1: o.y(sgn * th / unit), y2: o.y(sgn * th / unit), class: "ref" }, o.g);
    Plot.el("path", { d: Plot.path(pts.map(([a, b]) => [o.x(a), o.y(Math.max(-ym, Math.min(ym, b)) / unit)])), class: "stroke c-tint" }, o.g);
    $("tTv").innerHTML = F.kelvin(T);
    $("tCv").textContent = F.qty(F.sci(C, 2), "N·m·rad⁻¹");
    $("tGv").textContent = F.num(q, 2);
    const f = v => F.si(v, "rad", { sig: 3 });
    $("vmes").textContent = f(Math.sqrt(x2));
    $("vth").textContent = f(th);
    $("vspot").textContent = F.si(2 * BRAS * th, "m", { sig: 2 });
    $("vcin").textContent = F.fix(I0 * v2 / (k_B * T), 2);
    $("vq").textContent = F.sci(hbar * w0 / (k_B * T), 2);
    $("sys").innerHTML = t("sys.inner", { T: F.kelvin(T), P: F.si(P, "s", { sig: 2 }), tau: F.si(1 / g, "s", { sig: 2 }),
      duree: F.si(nTot * dt, "s", { sig: 2 }), q: F.sci(hbar * w0 / (k_B * T), 1) });
  }
  sT.oninput = sC.oninput = sG.oninput = draw;
  $("tirage").onclick = () => { graine++; draw(); };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["brown", 1827, "experiment"], ["ising", 1926, "experiment"], ["johnson", 1928, "experiment"], ["kappler", 1931, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["afm", "ligo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["gaz", "c"], ["froid", "a"], ["amorti", "d"], ["grain", "b"], ["fil", "c"], ["johnson", "a"], ["r", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 411 });
})();
</script>
