<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, EV = Constantes.e, ER = Q.echellesHydrogenoide(1, Infinity).ER;

/* ---------- the power series (19.22) for any α: it stops only at α = 1/n ---------- */
(() => {
  const svg = $("serie"), sa = $("sa"), seg = $("etats");
  let exact = null;
  function draw() {
    const alpha = exact != null ? 1 / exact : +sa.value, R = 50, pts = [];
    const L = Math.min(40, 2 / (alpha * alpha)); let A = 0;
    for (let i = 1; i <= 250; i++) A = Math.max(A, Math.abs(Q.fonctionS(alpha, L * i / 250)));
    for (let i = 1; i <= 500; i++) { const r = R * i / 500; pts.push([r, Q.fonctionS(alpha, r) / A]); }
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { domain: [0, R], label: t("fig.x"), fmt: v => F.num(v, 3) }, y: { domain: [-1.5, 1.5], label: t("fig.y") } });
    Plot.el("line", { x1: ax.x(0), x2: ax.x(R), y1: ax.y(0), y2: ax.y(0), class: "stroke thin c-label-2" }, ax.g);
    Plot.el("path", { d: Plot.path(pts.map(([r, v]) => [ax.x(r), ax.y(Math.max(-1.5, Math.min(1.5, v)))])), class: "stroke bold c-tint" }, ax.g);
    const a = Q.coefficientsSerieS(alpha), arret = a[a.length - 1] === 0, fin = Q.fonctionS(alpha, R) / A;
    $("sar").textContent = F.fix(alpha, exact != null ? 4 : 3);
    $("ve").textContent = F.qty(F.fix(-alpha * alpha * ER / EV, 3), "eV");
    $("fe").textContent = t("fig.f.e", { v: F.fix(-alpha * alpha, 4) });
    $("vs").textContent = t(arret ? "fig.v.arret" : "fig.v.infinie", { k: a.length - 2 });
    $("fs").textContent = t(Math.abs(fin) < 1e-3 ? "fig.f.lie" : "fig.f.diverge", { v: F.sci(fin, 1) });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(exact === +b.dataset.n)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { exact = +b.dataset.n; sa.value = String(1 / exact); draw(); });
  sa.oninput = () => { exact = null; draw(); }; draw();
})();

/* ---------- the system described: sizes and the density at the nucleus ---------- */
(() => {
  const a0 = Q.a0, rp = 0.8418e-15;
  /* ψ₁ normed: |ψ(0)|² = 1/(π a0³) ; probability inside a sphere of radius r_p ≈ (4/3) r_p³/a0³ */
  $("sys1").innerHTML = t("sys1.body", { r1: F.si(a0, "m"), r2: F.si(4 * a0, "m"), r3: F.si(9 * a0, "m") });
  $("sys2").innerHTML = t("sys2.body", { p: F.sci(4 / 3 * (rp / a0) ** 3, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lamb", 1947, "experiment"], ["bethe", 1947, "idea"], ["nobel", 1955, "idea"], ["pohl", 2010, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rydberg"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["unites", "b"], ["fonction", "c"], ["serie", "a"], ["arret", "d"], ["niveaux", "b"], ["noeuds", "c"], ["noyau", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1902 });
})();
</script>
