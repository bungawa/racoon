    <div class="eq"><math display="block"><msub><mover accent="true"><mi>T</mi><mo>→</mo></mover><mi>A</mi></msub><mo>=</mo><mo>−</mo><msub><mover accent="true"><mi>T</mi><mo>→</mo></mover><mi>B</mi></msub><mo>,</mo><mspace width="1em"/><mo>‖</mo><msub><mover accent="true"><mi>T</mi><mo>→</mo></mover><mi>A</mi></msub><mo>‖</mo><mo>=</mo><mo>‖</mo><msub><mover accent="true"><mi>T</mi><mo>→</mo></mover><mi>B</mi></msub><mo>‖</mo><mo>=</mo><mi>T</mi></math></div>

    <h3 data-i18n="s2.reaction.h3"></h3>
    <p data-i18n-html="s2.reaction.p"></p>
    <div class="eq"><math display="block"><mover accent="true"><mi>R</mi><mo>→</mo></mover><mo>=</mo><msub><mi>R</mi><mi>N</mi></msub><mspace width="0.1em"/><mover accent="true"><mi>n</mi><mo>→</mo></mover><mo>+</mo><msub><mover accent="true"><mi>R</mi><mo>→</mo></mover><mi>T</mi></msub><mo>,</mo><mspace width="1em"/><msub><mi>R</mi><mi>N</mi></msub><mo>≥</mo><mn>0</mn></math></div>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure class="chart">
      <svg id="bchart" role="img" data-i18n-attr="aria-label:bil.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="bil.legend.d"></span><span class="c-warn" data-i18n="bil.legend.a"></span><span class="c-label-2" data-i18n="bil.legend.seuil"></span></div>
      <div class="panel">
        <div class="seg" role="group" data-i18n-attr="aria-label:bil.choice">
          <button type="button" data-o="bille" aria-pressed="true" data-i18n="obj.bille"></button>
          <button type="button" data-o="goutte" aria-pressed="false" data-i18n="obj.goutte"></button>
          <button type="button" data-o="pingpong" aria-pressed="false" data-i18n="obj.pingpong"></button>
          <button type="button" data-o="tennis" aria-pressed="false" data-i18n="obj.tennis"></button>
        </div>
        <p class="caption" id="objread"></p>
        <div class="controls">
          <div class="ctl"><div class="row"><label for="vsl" data-i18n="bil.v"></label><output id="vread" for="vsl"></output></div>
            <input id="vsl" type="range" min="-2" max="1.7" step="0.01" value="0"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="bil.k.p"></span><span class="v" id="vp"></span></div>
          <div class="stat"><span class="k" data-i18n="bil.k.a"></span><span class="v" id="va"></span><span class="f" id="fa"></span></div>

        <div class="list keyed" id="verdict"></div>
      </div>
      <figcaption data-i18n-html="bil.caption"></figcaption>
    </figure>
    <div class="eq"><math display="block"><mfrac><mi>D</mi><mi>P</mi></mfrac><mo>≪</mo><mfrac><mrow><mi>Δ</mi><mi>a</mi></mrow><mi>a</mi></mfrac><mspace width="0.6em"/><mo>⟹</mo><mspace width="0.6em"/><mi>m</mi><mover accent="true"><mi>a</mi><mo>→</mo></mover><mo>≈</mo><mover accent="true"><mi>P</mi><mo>→</mo></mover></math></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>

<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/caracteriser-une-force.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹", SEUIL = 0.01;

/* ---------- bilan des forces sur une sphère qui tombe dans l'air ---------- */
(() => {
  let obj = "bille";
  const vsl = $("vsl"), svg = $("bchart");
  const pct = r => F.qty(r * 100 < 1e-3 ? F.sci(r * 100, 2) : F.num(r * 100, 2), "%");
  function draw() {
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300,
      x: { scale: "log", domain: [0.01, 50], label: t("bil.x") }, y: { scale: "log", domain: [1e-8, 10], label: t("bil.y") } });
    const clip = r => Math.min(10, Math.max(1e-8, r));
    let d = "", pen = false;
    for (let i = 0; i <= 240; i++) {
      const v = Math.pow(10, -2 + i * Math.log10(5000) / 240), r = Forces.bilan(obj, "air", v).rD;
      if (!isFinite(r)) { pen = false; continue; }
      d += (pen ? "L" : "M") + x(v).toFixed(1) + " " + y(clip(r)).toFixed(1); pen = true;
    }
    Plot.el("line", { x1: x(0.01), x2: x(50), y1: y(SEUIL), y2: y(SEUIL), class: "zero" }, g);
    const rA = Forces.bilan(obj, "air", 0).rA;
    Plot.el("line", { x1: x(0.01), x2: x(50), y1: y(rA), y2: y(rA), class: "ref" }, g);
    Plot.el("path", { d, class: "curve" }, g);
    const tv = Forces.terminal(obj, "air").corr;
    if (isFinite(tv) && tv < 50) { const n = Plot.el("text", { x: x(tv), y: y(1) - 8, "text-anchor": "end", class: "note" }, g); n.textContent = t("bil.note.vl"); }
    const v = Math.pow(10, +vsl.value), b = Forces.bilan(obj, "air", v);
    if (isFinite(b.rD)) Plot.el("circle", { cx: x(v), cy: y(clip(b.rD)), r: 6, class: "dot" }, g);
    const o = Forces.OBJETS[obj];
    $("objread").innerHTML = t("obj.desc." + obj, { d: F.qty(F.num(o.d * 1000, 3), "mm"), m: F.qty(F.num(o.m * 1000, 3), "g"), vl: F.qty(F.num(tv, 2), MS) });
    $("vread").textContent = F.qty(F.num(v, 3), MS);
    $("vp").textContent = F.si(b.P, "N");
    $("va").textContent = F.si(b.A, "N"); $("fa").textContent = t("bil.f.ratio", { r: pct(b.rA) });
    $("vd").textContent = isFinite(b.D) ? F.si(b.D, "N") : "–";
    $("fd").textContent = isFinite(b.rD) ? t("bil.f.ratio", { r: pct(b.rD) }) : t("bil.f.crise");
    $("vre").textContent = F.num(b.re, 3); $("fre").textContent = t("regime." + b.regime);
    const v1 = Forces.speedAtRatio(obj, "air", SEUIL);
    const rows = [["poids", 1], ["archimede", b.rA], ["trainee", b.rD]];
    $("verdict").innerHTML = rows.map(([id, r]) => `<div><span class="k">${t(id === "poids" || r >= SEUIL || !isFinite(r) ? "bil.garde" : "bil.neglige")}</span><span>${t("bil.row." + id, { v1: F.qty(F.num(v1, 2), MS), h: F.si(v1 * v1 / (2 * Forces.G0), "m", { prefix: "" }) })}</span></div>`).join("");
  }
  document.querySelectorAll("[data-o]").forEach(btn => btn.onclick = () => { obj = btn.dataset.o;
    document.querySelectorAll("[data-o]").forEach(o => o.setAttribute("aria-pressed", String(o === btn))); draw(); });
  vsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hooke", 1678, "idea"], ["principia", 1687, "idea"], ["cavendish", 1798, "experiment"], ["cgpm", 1948, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["eurocode", "balance"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["circulaire", "a"], ["origine", "a"], ["fil", "a"], ["normale", "a"], ["ressort", "a"], ["pingpong", "a"], ["bille", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 121 });
})();
</script>
