  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>τ</mi><mo stretchy="false">(</mo><mi>r</mi><mo stretchy="false">)</mo><mo>=</mo><mi>μ</mi><mfrac><mrow><mi>r</mi><mi>φ</mi></mrow><mi>L</mi></mfrac></math><span class="n">(38.21)</span></div>
    <p class="validite" data-i18n-html="val.tau"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mi>C</mi><mo>=</mo><mi>μ</mi><mfrac><mrow><mi>π</mi><msup><mi>a</mi><mn>4</mn></msup></mrow><mn>2</mn></mfrac><mfrac><mi>φ</mi><mi>L</mi></mfrac></math><span class="n">(38.25)</span></div>
    <p class="validite" data-i18n-html="val.C"></p>
    <figure>
      <div class="seg" role="group" data-i18n-attr="aria-label:tor.mat">
        <button type="button" id="m-acier" aria-pressed="true"></button>
        <button type="button" id="m-aluminium" aria-pressed="false"></button>
      </div>
      <svg class="fig" id="tor" viewBox="0 0 640 230" role="img" data-i18n-attr="aria-label:tor.aria"></svg>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="C" data-i18n="tor.C"></label><output id="Cv" for="C"></output></div>
            <input id="C" type="range" min="0" max="3000" step="10" value="500"></div>
          <div class="ctl"><div class="row"><label for="d" data-i18n="tor.d"></label><output id="dv" for="d"></output></div>
            <input id="d" type="range" min="10" max="100" step="1" value="40"></div>
          <div class="ctl"><div class="row"><label for="b" data-i18n="tor.b"></label><output id="bv" for="b"></output></div>
            <input id="b" type="range" min="0" max="0.95" step="0.01" value="0"></div>
          <div class="ctl"><div class="row"><label for="L" data-i18n="tor.L"></label><output id="Lv" for="L"></output></div>
            <input id="L" type="range" min="0.2" max="5" step="0.1" value="1"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="tor.k.phi"></span><span class="v" id="vphi"></span><span class="f" id="fphi"></span></div>
          <div class="stat"><span class="k" data-i18n="tor.k.tau"></span><span class="v" id="vtau"></span><span class="f" id="ftau"></span></div>
          <div class="stat"><span class="k" data-i18n="tor.k.k"></span><span class="v" id="vk"></span></div>
          <div class="stat"><span class="k" data-i18n="tor.k.masse"></span><span class="v" id="vm"></span><span class="f" data-i18n="tor.f.masse"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="tor.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="s1.sys.title"></b>
      <p data-i18n-html="s1.sys.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mfrac><mrow><msup><mo>∂</mo><mn>2</mn></msup><mi>φ</mi></mrow><mrow><mo>∂</mo><msup><mi>z</mi><mn>2</mn></msup></mrow></mfrac><mo>−</mo><mfrac><mi>ρ</mi><mi>μ</mi></mfrac><mfrac><mrow><msup><mo>∂</mo><mn>2</mn></msup><mi>φ</mi></mrow><mrow><mo>∂</mo><msup><mi>t</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>0</mn></math><span class="n">(38.31)</span></div>
    <p class="validite" data-i18n-html="val.onde"></p>
    <div class="eq"><math display="block"><msub><mi>v</mi><mi mathvariant="normal">S</mi></msub><mo>=</mo><msqrt><mfrac><mi>μ</mi><mi>ρ</mi></mfrac></msqrt></math><span class="n">(38.32)</span></div>
    <p class="validite" data-i18n-html="val.vS"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><msub><mi>v</mi><mi mathvariant="normal">P</mi></msub><mo>=</mo><msqrt><mfrac><mi>M</mi><mi>ρ</mi></mfrac></msqrt><mo>,</mo><mspace width="1em"></mspace><mi>M</mi><mo>=</mo><mfrac><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>ν</mi><mo stretchy="false">)</mo><mi>E</mi></mrow><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>ν</mi><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mn>2</mn><mi>ν</mi><mo stretchy="false">)</mo></mrow></mfrac></math><span class="n">(38.33)</span></div>
    <p class="validite" data-i18n-html="val.vP"></p>
    <p data-i18n-html="s2.p3"></p>
    <figure>
      <div class="seg" role="group" data-i18n-attr="aria-label:ond.mat">
        <button type="button" id="o-acier" aria-pressed="true"></button>
        <button type="button" id="o-aluminium" aria-pressed="false"></button>
        <button type="button" id="o-beton" aria-pressed="false"></button>
      </div>
      <div class="stats">
        <div class="stat"><span class="k" data-i18n="ond.k.vP"></span><span class="v" id="vvP"></span></div>
        <div class="stat"><span class="k" data-i18n="ond.k.vB"></span><span class="v" id="vvB"></span></div>
        <div class="stat"><span class="k" data-i18n="ond.k.vS"></span><span class="v" id="vvS"></span></div>
        <div class="stat"><span class="k" data-i18n="ond.k.r"></span><span class="v" id="vr"></span></div>
      </div>
    </figure>
    <p data-i18n-html="s2.p4"></p>
    <figure class="chart">
      <svg class="fig" id="seisme" role="img" data-i18n-attr="aria-label:sei.aria"></svg>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="dt" data-i18n="sei.dt"></label><output id="dtv" for="dt"></output></div>
            <input id="dt" type="range" min="1" max="60" step="0.5" value="12"></div>
          <div class="ctl"><div class="row"><label for="vp" data-i18n="sei.vp"></label><output id="vpv" for="vp"></output></div>
            <input id="vp" type="range" min="4.9" max="5.9" step="0.05" value="5.5"></div>
          <div class="ctl"><div class="row"><label for="vs" data-i18n="sei.vs"></label><output id="vsv" for="vs"></output></div>
            <input id="vs" type="range" min="3" max="3.7" step="0.05" value="3.3"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="sei.k.d"></span><span class="v" id="vd"></span><span class="f" id="fd"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="sei.caption"></figcaption>
    </figure>

  <section class="card">

    <h2 data-i18n="hist.h2"></h2>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/torsion-et-ondes-de-cisaillement.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/oscillateur.js"></script>
<script src="/racoon/lecons/elasticite.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, El = Elasticite;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const MATS = textOf("mats", ["acier", "aluminium", "beton"]);

/* ---------- the twisted rod: section with τ ∝ r, readouts ---------- */
(() => {
  const IDS = ["acier", "aluminium"], svg = $("tor");
  let mat = "acier";
  const text = (x, y, s, anchor) => { P("text", { x, y, "text-anchor": anchor || "middle" }, svg).textContent = s; };
  function upd() {
    const m = El.MATERIAUX[mat], c = El.constantesIsotropes(m.E, m.nu), C = +$("C").value, d = +$("d").value / 1000, a = d / 2, b = +$("b").value * a, L = +$("L").value;
    const r = El.torsion({ mu: c.mu, a, b, L, C });
    IDS.forEach(id => $("m-" + id).setAttribute("aria-pressed", String(id === mat)));
    $("Cv").textContent = F.si(C, "N·m"); $("dv").textContent = F.qty(F.num(d * 1000, 3), "mm"); $("bv").textContent = F.fix(b / a, 2); $("Lv").textContent = F.qty(F.num(L, 3), "m");
    $("vphi").textContent = F.qty(F.num(r.phi * 180 / Math.PI, 3), "°"); $("fphi").textContent = t("tor.f.phi", { p: F.sci(r.phi, 2), g: F.sci(r.gammaMax, 2) });
    $("vtau").textContent = F.si(r.tauMax, "Pa");
    $("ftau").textContent = m.lim == null ? t("tor.f.alliage") : t(r.tauMax <= m.lim / Math.sqrt(3) ? "tor.f.ok" : "tor.f.ko", { r: F.fix(r.tauMax / (m.lim / Math.sqrt(3)), 2) });
    $("vk").textContent = F.si(r.raideur, "N·m·rad⁻¹");
    $("vm").textContent = "× " + F.fix((a * a + b * b) / (a * a - b * b), 2);
    /* drawing: the cross-section (outer and inner circle), the shear stress along a radius, and the rod from the side */
    svg.innerHTML = "";
    const R = 90, cx = 130, cy = 115, Ri = R * b / a;
    P("circle", { cx, cy, r: R, class: "stroke c-label" }, svg);
    if (Ri > 0) P("circle", { cx, cy, r: Ri, class: "stroke c-label" }, svg);
    for (let k = 1; k <= 6; k++) {
      const rr = R * k / 6; if (rr < Ri - 1e-9) continue;
      const len = 60 * rr / R * (C > 0 ? 1 : 0);
      Plot.fleche(svg, [cx + rr, cy], [cx + rr, cy - len], { cls: "c-warn" });
    }
    text(cx, 222, t("tor.sec"));
    /* side view: a generator line, straight at rest, twisted into a helix of angle aφ/L (magnified) */
    const x0 = 290, x1 = 610, hh = 70, yc = 115, k = r.phi > 0 ? Math.max(1, Math.pow(10, Math.floor(Math.log10(0.8 / r.phi)))) : 1;
    P("rect", { x: x0, y: yc - hh, width: x1 - x0, height: 2 * hh, class: "stroke c-label" }, svg);
    P("line", { x1: x0, y1: yc - hh, x2: x0, y2: yc + hh, class: "stroke bold c-label" }, svg);
    P("line", { x1: x0, y1: yc, x2: x1, y2: yc, class: "stroke thin dash c-label-2" }, svg);
    /* the generator on the axis plane, seen from the side, ends at height a sin(kφ): the end section turned by kφ */
    const tw = Math.min(Math.PI / 2 - 0.01, k * r.phi);
    P("line", { x1: x0, y1: yc, x2: x1, y2: yc - hh * Math.sin(tw), class: "stroke bold c-tint" }, svg);
    text((x0 + x1) / 2, 222, t("tor.side", { k: F.num(k, 1) }));
  }
  ["C", "d", "b", "L"].forEach(id => $(id).oninput = upd);
  IDS.forEach(id => { $("m-" + id).textContent = MATS[id]; $("m-" + id).onclick = () => { mat = id; upd(); }; });
  upd();
})();

/* ---------- wave speeds of the three Eurocode materials ---------- */
(() => {
  const IDS = ["acier", "aluminium", "beton"];
  let mat = "acier";
  function upd() {
    const m = El.MATERIAUX[mat], v = El.vitessesIsotropes(m.E, m.nu, m.rho);
    IDS.forEach(id => $("o-" + id).setAttribute("aria-pressed", String(id === mat)));
    $("vvP").textContent = F.si(v.vP, "m·s⁻¹"); $("vvB").textContent = F.si(v.vBarre, "m·s⁻¹"); $("vvS").textContent = F.si(v.vS, "m·s⁻¹");
    $("vr").textContent = F.fix(v.rapport, 2);
  }
  IDS.forEach(id => { $("o-" + id).textContent = MATS[id]; $("o-" + id).onclick = () => { mat = id; upd(); }; });
  upd();
})();

/* ---------- locating an earthquake from the S − P delay: travel-time chart ---------- */
(() => {
  const svg = $("seisme");
  function upd() {
    const dt = +$("dt").value, vp = +$("vp").value * 1e3, vs = +$("vs").value * 1e3, d = El.distanceSeisme(dt, vp, vs);
    $("dtv").textContent = F.si(dt, "s"); $("vpv").textContent = F.si(vp, "m·s⁻¹"); $("vsv").textContent = F.si(vs, "m·s⁻¹");
    $("vd").textContent = F.si(d, "m"); $("fd").textContent = t("sei.f.d", { k: F.num(El.distanceSeisme(1, vp, vs) / 1e3, 3) });
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 52 }, x: { domain: [0, 500], label: t("sei.x") }, y: { domain: [0, 170], label: t("sei.y") } });
    const D = [0, 500];
    P("path", { d: Plot.path(D.map(x => [o.x(x), o.y(x * 1e3 / vp)])), class: "stroke c-tint" }, o.g);
    P("path", { d: Plot.path(D.map(x => [o.x(x), o.y(Math.min(170, x * 1e3 / vs))])), class: "stroke c-warn" }, o.g);
    const dk = d / 1e3;
    if (dk <= 500) {
      P("line", { x1: o.x(dk), y1: o.y(d / vp), x2: o.x(dk), y2: o.y(Math.min(170, d / vs)), class: "stroke bold c-label" }, o.g);
      P("circle", { cx: o.x(dk), cy: o.y(d / vp), r: 5, class: "fill c-tint" }, o.g);
      if (d / vs <= 170) P("circle", { cx: o.x(dk), cy: o.y(d / vs), r: 5, class: "fill c-warn" }, o.g);
    }
    P("text", { x: o.x(440), y: o.y(440e3 / vp) + 18, "text-anchor": "middle" }, o.g).textContent = t("sei.l.P");
    P("text", { x: o.x(400), y: o.y(Math.min(160, 400e3 / vs)) - 8, "text-anchor": "middle" }, o.g).textContent = t("sei.l.S");
  }
  ["dt", "vp", "vs"].forEach(id => $(id).oninput = upd);
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["coulomb", 1784, "experiment"], ["oldham", 1906, "idea"], ["lehmann", 1936, "idea"], ["ultrasons", 2014, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["seisme", "ultrasons", "arbre"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["diametre", "d"], ["tube", "a"], ["coquille", "c"], ["vitesse", "b"], ["ordre", "a"], ["distance", "c"], ["liquide", "d"], ["craie", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
