<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, C = Constantes.c, ARCSEC = Math.PI / 648000;

/* ---------- le ciel vu en mouvement : 36 étoiles régulières dans S, les mêmes vues par l'observateur ---------- */
(() => {
  const ciel = $("ciel"), ecart = $("ecart"), sb = $("sb"), N = 36;
  const betaOf = s => Math.min(0.99, 10 ** (-5 + 5 * s / 1000));                 // 10⁻⁵ (a satellite in low orbit is 2,6 × 10⁻⁵) to 0,99
  const angle = (x, small) => small ? F.num(x / ARCSEC, 3) + "″" : F.num(x * 180 / Math.PI, 3) + "°";
  function disque(cx, cy, r, pts, title, fleche) {
    Plot.el("circle", { cx, cy, r, class: "stroke thin c-label-2" }, ciel);
    Plot.el("text", { x: cx, y: 20, "text-anchor": "middle" }, ciel).textContent = title;
    pts.forEach(th => Plot.el("circle", { cx: cx + r * Math.cos(th), cy: cy - r * Math.sin(th), r: 3.5, class: "fill c-tint" }, ciel));
    Plot.el("circle", { cx, cy, r: 3, class: "fill c-label" }, ciel);
    if (fleche) Plot.fleche(ciel, [cx - 30, cy], [cx + 30, cy], { cls: "c-warn", trait: "stroke bold" });
  }
  function draw() {
    const b = betaOf(+sb.value), small = b < 0.01;
    const th0 = Array.from({ length: N }, (_, i) => -Math.PI + (i + 0.5) * 2 * Math.PI / N);
    ciel.innerHTML = "";
    disque(160, 140, 105, th0, t("fig.S"), false);
    disque(480, 140, 105, th0.map(th => O.aberration(th, b).theta), t("fig.Sp"), true);
    /* tilt against the direction in S, relativistic and Galilean */
    ecart.innerHTML = "";
    const xs = Array.from({ length: 181 }, (_, i) => i * Math.PI / 180), unit = small ? ARCSEC : Math.PI / 180;
    const rel = xs.map(th => O.aberration(th, b).ecart / unit), gal = xs.map(th => O.aberration(th, b).ecartGalilee / unit);
    const ymax = 1.1 * Math.max(...rel, ...gal);
    const P = Plot.axes(ecart, { fmt: F, w: 640, h: 230, pad: { l: 64, b: 44 }, x: { domain: [0, 180], label: t("fig.xaxis") },
      y: { domain: [0, ymax], label: t(small ? "fig.yaxis.s" : "fig.yaxis.d") } });
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x * 180 / Math.PI), P.y(gal[i])])), class: "stroke dash c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x * 180 / Math.PI), P.y(rel[i])])), class: "curve" }, P.g);
    const a = O.aberration(Math.PI / 2, b);
    $("sbr").textContent = b < 0.01 ? F.sci(b, 2) : F.num(b, 3);
    $("vd").textContent = angle(a.ecart, small);
    $("fd").textContent = t("fig.f.delta", { g: angle(a.ecartGalilee, small), d: small ? F.sci((a.ecart - a.ecartGalilee) / ARCSEC, 2) + "″" : angle(a.ecart - a.ecartGalilee, false) });
    $("vf").textContent = F.qty(F.num(100 * O.devant(b), 3), "%");
    $("ff").textContent = t("fig.f.devant");
    $("vdop").textContent = F.num(O.aberration(0, b).doppler, small ? 7 : 4);
    $("fdop").textContent = t("fig.f.doppler", { d: F.num(O.aberration(Math.PI, b).doppler, small ? 7 : 4) });
  }
  sb.oninput = draw; draw();
})();

/* ---------- le système décrit : un télescope sur la Terre ---------- */
(() => {
  const au = Constantes.au, T = 365.256363 * 86400, e = 0.0167086;
  const k = O.aberrationAnnuelle(au, T, e), v = k * C, vd = Constantes.Omega_E * Constantes.R_E_eq;
  const a = O.aberration(Math.PI / 2, k);
  $("sys1").innerHTML = t("sys1.body", { v: F.si(v, "m·s⁻¹", { sig: 4 }), k: F.num(k / ARCSEC, 6) + "″", b: F.sci(k, 3),
    deux: F.num(2 * k / ARCSEC, 3) + "″", k2: F.sci(k * k / 4 / ARCSEC, 1) + "″",
    gal: F.sci((a.ecart - a.ecartGalilee) / ARCSEC, 1) + "″", vd: F.si(vd, "m·s⁻¹"), kd: F.num(vd / C / ARCSEC, 2) + "″" });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kew", 1725, "experiment"], ["bradley", 1729, "idea"], ["airy", 1871, "experiment"], ["einstein", 1905, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gaia", "pointage"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pluie", "b"], ["six", "d"], ["pole", "a"], ["galilee", "c"], ["devant", "b"], ["eau", "a"], ["moitie", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 348 });
})();
</script>
