<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes;

/* ---------- deux électrons qui tournent en sens contraires, pendant qu'on établit le champ ---------- */
(() => {
  const svg = $("courbe"), sb = $("sb"), st = $("st"), h = Cst.hbar, w0 = h / (Cst.m_e * Cst.a0 ** 2), T0 = 2 * Math.PI / w0;
  let forme = "doux";
  function draw() {
    const B1 = +sb.value, tau = +st.value * T0;
    const o = { B1, tau, forme, apres: 2, pas: 128, every: 4 }, a = M.orbiteDiamagnetique(Object.assign({ sens: 1 }, o)), b = M.orbiteDiamagnetique(Object.assign({ sens: -1 }, o));
    const k = 1e5 / h, ymax = 1.15 * a.predit.dJ * k, tmax = (tau + 2 * T0) * 1e15;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 64 },
      x: { domain: [0, tmax], label: t("fig.ax.t") }, y: { domain: [-0.08 * ymax, ymax], label: t("fig.ax.j") } });
    const ligne = (r, cls) => Plot.el("path", { d: Plot.path(r.courbe.t.map((tt, i) => [P.x(tt * 1e15), P.y(r.courbe.dJ[i] * k)])), class: "stroke " + cls }, svg);
    Plot.el("path", { d: Plot.path(a.courbe.t.map((tt, i) => [P.x(tt * 1e15), P.y(Cst.e * Cst.a0 ** 2 * a.courbe.B[i] / 2 * k)])), class: "stroke thin dash c-label-2" }, svg);
    ligne(a, "bold c-tint"); ligne(b, "c-warn");
    $("sbr").textContent = F.si(B1, "T", { sig: 3 });
    $("str").textContent = t("fig.periodes", { n: F.num(+st.value, 2), s: F.si(tau, "s", { sig: 2 }) });
    $("vm").textContent = F.si(a.dmu, "J·T⁻¹", { sig: 4 });
    $("fm").textContent = t("fig.f.mu", { b: F.si(b.dmu, "J·T⁻¹", { sig: 4 }), p: F.si(a.predit.dmu, "J·T⁻¹", { sig: 4 }) });
    $("ve").textContent = F.sci(Math.abs(a.dmu / a.predit.dmu - 1), 1);
    $("fe").innerHTML = t("fig.f.ecart", { r: F.sci(a.omegaL / a.omega0, 2) });
    $("vr").textContent = F.sci(Math.abs(a.dmu / a.mu0), 2);
    $("fr").textContent = t("fig.f.rel", { mu: F.si(Math.abs(a.mu0), "J·T⁻¹", { sig: 3 }) });
  }
  document.querySelectorAll("#formes button").forEach(bt => bt.onclick = () => {
    forme = bt.dataset.f; document.querySelectorAll("#formes button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  sb.oninput = st.oninput = draw; draw();
})();

/* ---------- le système décrit : l'hélium, de χ mesuré à la taille de l'atome ---------- */
(() => {
  const a0 = Cst.a0, chi = M.CHI_MOLAIRE_HELIUM, r2 = M.r2DepuisChi(chi, Cst.N_A, 2), dmu = Cst.e ** 2 * r2 * 10 / (6 * Cst.m_e);
  $("sys1").innerHTML = t("sys1.body", { chi: F.sci(chi, 3), r2: F.num(r2 / a0 ** 2, 3), r: F.si(Math.sqrt(r2), "m", { prefix: "p", sig: 2 }),
    z2: F.num(M.r2Hydrogenoide(2) / a0 ** 2, 2), z1: F.num(M.r2Hydrogenoide(27 / 16) / a0 ** 2, 3), dmu: F.sci(dmu / Cst.mu_B, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["langevin", 1905, "idea"], ["meissner", 1933, "experiment"], ["souris", 2009, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["microgravite"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["sens", "b"], ["vitesse", "a"], ["signe", "c"], ["ordre", "d"], ["moyenne", "a"], ["helium", "b"], ["temperature", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 344 });
})();
</script>
