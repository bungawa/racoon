<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const LAMBDA = 589e-9;                                                         // the sodium D line, in vacuum

/* ---------- une lame : le retard de phase, et sa forme au premier ordre Es + Ea ---------- */
(() => {
  const ph = $("phaseurs"), trace = $("trace"), sn = $("sn"), sz = $("sz");
  const nOf = v => Math.pow(10, -5 + 5 * v / 100), dzOf = v => Math.pow(10, -8 + 5 * v / 100);   // n − 1 from 10⁻⁵ to 1, Δz from 10 nm to 1 mm
  function draw() {
    const nm1 = nOf(+sn.value), dz = dzOf(+sz.value), L = OptOnd.lameIndice(nm1, dz, LAMBDA), phi = L.phi;
    /* phasors: Es along the real axis, exact e^(−iφ) on the unit circle, first order 1 − iφ, Im drawn upwards */
    ph.innerHTML = "";
    const O = [200, 115], R = 90, P = z => [O[0] + R * z.re, O[1] - R * Math.max(-1.2, Math.min(1.2, z.im))];
    Plot.el("circle", { cx: O[0], cy: O[1], r: R, class: "stroke thin dash c-label-2" }, ph);
    Plot.el("line", { x1: O[0] - R - 20, x2: O[0] + R + 40, y1: O[1], y2: O[1], class: "stroke thin c-label-2" }, ph);
    Plot.el("line", { x1: O[0], x2: O[0], y1: O[1] - R - 10, y2: O[1] + R + 10, class: "stroke thin c-label-2" }, ph);
    Plot.fleche(ph, O, P({ re: 1, im: 0 }), { cls: "c-label-2" });
    Plot.fleche(ph, P({ re: 1, im: 0 }), P(L.approx), { cls: "c-ok" });
    Plot.fleche(ph, O, P(L.approx), { cls: "c-warn", trait: "stroke dash" });
    Plot.fleche(ph, O, P(L.exact), { cls: "c-tint", trait: "stroke bold" });
    Plot.el("text", { x: O[0] + R + 8, y: O[1] - 6 }, ph).textContent = t("fig.re");
    Plot.el("text", { x: O[0] + 6, y: O[1] - R - 2 }, ph).textContent = t("fig.im");
    Plot.el("text", { x: 340, y: 60 }, ph).textContent = t("fig.ph.s");
    Plot.el("text", { x: 340, y: 84 }, ph).textContent = t("fig.ph.a", { v: F.num(phi, 3) });
    Plot.el("text", { x: 340, y: 108 }, ph).textContent = t("fig.ph.exact", { v: F.num(phi, 3) });
    /* the field at P against time, over two periods */
    trace.innerHTML = "";
    const P2 = Plot.axes(trace, { fmt: F, w: 640, h: 220, pad: { l: 48, b: 40 }, x: { domain: [0, 2], label: t("fig.xaxis") }, y: { domain: [-2, 2], label: t("fig.yaxis") } });
    const ts = Array.from({ length: 241 }, (_, i) => i / 120), clip = v => Math.max(-2, Math.min(2, v));
    const TAU = 2 * Math.PI, curve = (f, cls) => Plot.el("path", { d: Plot.path(ts.map(u => [P2.x(u), P2.y(clip(f(TAU * u)))])), class: cls }, P2.g);
    Plot.el("line", { x1: P2.x(0), x2: P2.x(2), y1: P2.y(0), y2: P2.y(0), class: "zero" }, P2.g);
    curve(a => Math.cos(a), "stroke thin c-label-2");
    curve(a => phi * Math.sin(a), "stroke c-ok");
    curve(a => Math.cos(a) + phi * Math.sin(a), "stroke dash c-warn");
    curve(a => Math.cos(a - phi), "curve");
    $("snr").textContent = F.sci(nm1, 2);
    $("szr").textContent = F.si(dz, "m", { sig: 2 });
    $("vphi").textContent = F.qty(F.num(phi, 3), "rad");
    $("fphi").textContent = t("fig.f.phi", { v: F.si(L.retard, "s", { sig: 2 }) });
    const mince = LAMBDA / (2 * Math.PI * nm1);
    $("vmince").textContent = F.si(mince, "m", { sig: 2 });
    $("fmince").textContent = t(dz < 0.1 * mince ? "fig.f.mince" : dz < mince ? "fig.f.limite" : "fig.f.epaisse", { r: F.num(dz / mince, 2) });
    $("vecart").textContent = F.qty(F.num(100 * L.ecartModule, 2), "%");
    $("fecart").textContent = t("fig.f.ecart", { v: F.qty(F.num(L.ecartPhase, 2), "rad") });
  }
  sn.oninput = sz.oninput = draw; draw();
})();

/* ---------- le système décrit : une lame d'air de 1 mm, puis une lame de verre de 1 µm ---------- */
(() => {
  const nAir = 2.93e-4, a = OptOnd.lameIndice(nAir, 1e-3, LAMBDA), v = OptOnd.lameIndice(0.5168, 1e-6, LAMBDA);
  $("sys1").innerHTML = t("sys1.body", { n: F.sci(nAir, 3), phi: F.qty(F.num(a.phi, 2), "rad"), mince: F.si(LAMBDA / (2 * Math.PI * nAir), "m", { sig: 2 }),
    r: F.sci((nAir / 2) ** 2, 1), phiv: F.qty(F.num(v.phi, 2), "rad"), rv: F.num(100 * (0.5168 / 2.5168) ** 2, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["snell", 1621, "idea"], ["descartes", 1637, "idea"], ["foucault", 1850, "experiment"], ["ewald", 1912, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["interferometre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["vitesse", "c"], ["somme", "a"], ["snell", "d"], ["phase", "b"], ["angle", "c"], ["mince", "a"], ["reflexion", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 311 });
})();
</script>
