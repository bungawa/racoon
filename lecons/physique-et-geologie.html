<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const $ = id => document.getElementById(id);
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));

/* ---------- §3-5 : localiser un séisme par trois retards S − P ---------- */
(() => {
  const V = Voisines, VP = 6000, VS = 3500;                          // vitesses vraies dans la croûte, m·s⁻¹
  const W = 200e3, H = 125e3, S = 640 / W;                           // carte de 200 km × 125 km
  const STATIONS = [["a", 20e3, 20e3], ["b", 180e3, 30e3], ["c", 90e3, 110e3]];
  const QUAKES = [[70e3, 55e3], [150e3, 90e3], [40e3, 100e3], [125e3, 18e3]];
  const svg = $("map"), px = v => (v * S).toFixed(1), py = v => (400 - v * S).toFixed(1);
  Plot.el("rect", { x: 0, y: 0, width: 640, height: 400, class: "stroke thin c-label-2" }, svg);
  Plot.el("line", { x1: 20, x2: 20 + 50e3 * S, y1: 385, y2: 385, class: "stroke bold c-label-2" }, svg);
  Plot.el("text", { x: 20 + 25e3 * S, y: 378, "text-anchor": "middle" }, svg).textContent = F.si(50e3, "m");
  const clip = Plot.el("clipPath", { id: "mapclip" }, Plot.el("defs", {}, svg));
  Plot.el("rect", { x: 0, y: 0, width: 640, height: 400 }, clip);
  const inside = Plot.el("g", { "clip-path": "url(#mapclip)" }, svg);
  const circles = STATIONS.map(() => Plot.el("circle", { class: "stroke c-tint" }, inside));
  STATIONS.forEach(([id, x, y]) => {
    Plot.el("path", { d: `M${px(x)} ${+py(y) - 9} l8 14 h-16 z`, class: "fill c-label" }, svg);
    const right = x > W / 2;
    Plot.el("text", { x: +px(x) + (right ? -12 : 12), y: +py(y) + 4, "text-anchor": right ? "end" : "start" }, svg).textContent = t("map.st." + id);
  });
  const star = Plot.el("circle", { r: 7, class: "fill c-warn" }, svg), guess = Plot.el("circle", { r: 4, class: "fill c-tint" }, svg);
  const lstar = Plot.el("text", {}, svg);
  let q = 0;
  const sl = $("vsl");
  const upd = () => {
    const vs = +sl.value, [ex, ey] = QUAKES[q];
    $("vread").textContent = F.si(vs, "m·s⁻¹");
    const lags = STATIONS.map(([, x, y]) => V.lagOf(Math.hypot(ex - x, ey - y), VP, VS));
    const radii = lags.map(l => V.distanceOf(l, VP, vs));
    STATIONS.forEach(([id, x, y], i) => {
      circles[i].setAttribute("cx", px(x)); circles[i].setAttribute("cy", py(y)); circles[i].setAttribute("r", (radii[i] * S).toFixed(1));
      $("l" + id).textContent = F.si(lags[i], "s", { prefix: "" });
      $("d" + id).textContent = t("stat.dist", { d: F.si(radii[i], "m") });
    });
    const p = V.locate(STATIONS.map(s => [s[1], s[2]]), radii, [0, 0, W, H]);
    star.setAttribute("cx", px(ex)); star.setAttribute("cy", py(ey));
    guess.setAttribute("cx", px(p.x)); guess.setAttribute("cy", py(p.y));
    lstar.setAttribute("x", +px(ex) + 12); lstar.setAttribute("y", +py(ey) - 10); lstar.textContent = t("map.epi");
    $("rms").textContent = F.si(p.rms, "m");
    $("frms").textContent = t(p.rms < 500 ? "stat.rms.ok" : "stat.rms.ko", { e: F.si(Math.hypot(p.x - ex, p.y - ey), "m") });
  };
  $("autre").onclick = () => { q = (q + 1) % QUAKES.length; upd(); };
  sl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["oldham", 1906, "experiment"], ["moho", 1909, "experiment"], ["wegener", 1912, "idea"], ["gutenberg", 1914, "experiment"],
    ["richardson", 1922, "idea"], ["lehmann", 1936, "experiment"], ["charney", 1950, "use"], ["vine", 1963, "experiment"], ["lorenz", 1963, "idea"], ["plaques", 1967, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["alerte", "geodesie", "ensemble"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["equations", "a"], ["retard", "a"], ["vitesse", "a"], ["ombre", "a"], ["forage", "a"], ["montagnes", "a"], ["moteur", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
