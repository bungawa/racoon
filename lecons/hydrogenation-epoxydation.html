    <figure>
      <div class="chart"><svg id="courbe" role="img" data-i18n-attr="aria-label:epo.aria"></svg></div>
      <div class="legend"><span class="c-tint" data-i18n="epo.leg.a"></span><span class="c-warn" data-i18n="epo.leg.b"></span><span class="c-label-2" data-i18n="epo.leg.di"></span></div>
      <div class="panel">

        <div class="ctl"><div class="row"><label for="sb" data-i18n="epo.sb"></label></div><select id="sb"></select></div>

          <div class="stat"><span class="k" data-i18n="epo.k.autres"></span><span class="v" id="vau"></span><span class="f" data-i18n="epo.f.autres"></span></div>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/plot.js"></script>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>

<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>

<script src="/racoon/locales/fr/lecons/hydrogenation-epoxydation.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/thermo.js"></script>
<script src="/racoon/statistique.js"></script>
<script src="/racoon/chim-organique.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = ChimOrga, sym = s => t("chim.sym", { s });

/* ---------- interactions avec le catalyseur ---------- */
(() => {
  const ROWS = ["physi", "chimi", "h2", "alcene"], txt = textOf("ads.rows", ROWS);
  $("adsorption").innerHTML = ROWS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text}</span></div>`).join("");
})();

/* ---------- vitesses relatives d'époxydation, et compétition dans un diène ---------- */
(() => {
  const SITES = [["mono", 24], ["di", 500], ["tri", 6500]], ROWS = [["ethene", 1], ["propene", 24], ["butene", 500], ["methylbutene", 6500]];
  const vit = textOf("vit.rows", ROWS.map(r => r[0]));
  $("vitesses").innerHTML = ROWS.map(([id, k]) => `<div><span class="k">${F.num(k, 4)}</span><span>${vit[id]}</span></div>`).join("");
  const noms = textOf("epo.sites", SITES.map(s => s[0])), sa = $("sa"), sb = $("sb"), eq = $("eq");
  sa.innerHTML = sb.innerHTML = SITES.map(([id]) => `<option value="${id}">${noms[id]}</option>`).join("");
  sa.value = "tri"; sb.value = "di";
  const svg = $("courbe"), { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 260, x: { domain: [0, 2], label: t("epo.x") }, y: { domain: [0, 1], label: t("epo.y") } });
  const cA = Plot.el("path", { class: "curve" }, g), cB = Plot.el("path", { class: "ref" }, g), cD = Plot.el("path", { class: "axis" }, g);
  const ligne = Plot.el("line", { class: "grid" }, g);
  const k = id => SITES.find(s => s[0] === id)[1];
  function upd() {
    const kappa = k(sa.value) / k(sb.value), e = +eq.value, xs = Array.from({ length: 101 }, (_, i) => 0.02 * i), R = xs.map(u => O.epoxydationCompetitive(kappa, u));
    [[cA, "monoA"], [cB, "monoB"], [cD, "di"]].forEach(([c, f]) => c.setAttribute("d", Plot.path(xs.map((u, i) => [x(u), y(R[i][f])]))));
    ligne.setAttribute("x1", x(e)); ligne.setAttribute("x2", x(e)); ligne.setAttribute("y1", y(0)); ligne.setAttribute("y2", y(1));
    const r = O.epoxydationCompetitive(kappa, e);
    $("eqr").textContent = F.num(e, 3);
    $("vk").textContent = F.num(kappa, 3);
    $("vma").textContent = F.qty(F.fix(100 * r.monoA, 1), "%");
    $("fma").textContent = t("epo.f.monoa", { b: F.qty(F.fix(100 * r.monoB, 1), "%") });
    $("vau").textContent = t("epo.v.autres", { i: F.qty(F.fix(100 * r.intact, 1), "%"), d: F.qty(F.fix(100 * r.di, 1), "%") });
  }
  sa.onchange = sb.onchange = eq.oninput = upd; upd();
})();

/* ---------- mécanismes : ouverture d'un époxyde, réduction d'un ester ---------- */
const MECAS = textOf("meca.actes", ["epoxyde", "reductionEster"]);
["epoxyde", "reductionEster"].forEach(id => {
  ActesMecanisme.monter({ vues: O.actesMecanisme(id, { texte: sym, echelle: 40 }), textes: MECAS[id], svg: $("meca-" + id), boutons: $("actes-" + id), texte: $("txt-" + id) });
});

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["sabatier", 1897, "experiment"], ["normann", 1902, "experiment"], ["prilezhaev", 1909, "experiment"], ["horiuti", 1934, "idea"], ["nystrom", 1947, "experiment"], ["sharpless", 1980, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["graisses", "synthese"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["syn", "c"], ["h2", "a"], ["limonene", "b"], ["stereo", "d"], ["ouverture", "a"], ["trans", "c"], ["reduction", "b"], ["quantite", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 3104 });
})();
</script>
</body>
</html>
