<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;

/* ---------- un dipôle, un point, deux repères ---------- */
(() => {
  const svg = $("axes"), al = $("al"), be = $("be"), P0 = 1e-11, R = [0.03, 0.04, 0];   // C·m, m: the point of observation
  const O = [200, 190], S = 2600;                                                    // px, px per m
  const px = v => [O[0] + S * v[0], O[1] - S * v[1]];
  const deg = v => t("fig.deg", { a: F.num(v, 3) });
  const c3 = v => t("fig.trio", { a: F.num(v[0], 3), b: F.num(v[1], 3) });
  function axe(u, cls, nom) {
    const g = Plot.el("g", { class: cls }, svg), A = [O[0] - 150 * u[0], O[1] + 150 * u[1]], B = [O[0] + 160 * u[0], O[1] - 160 * u[1]];
    Plot.fleche(g, A, B, { trait: "stroke thin" });
    Plot.el("text", { x: B[0] + 8 * u[0], y: B[1] - 8 * u[1] + 4, "text-anchor": "middle" }, g).textContent = nom;
  }
  function draw() {
    const a = +al.value * Math.PI / 180, b = +be.value * Math.PI / 180, p = [P0 * Math.cos(b), P0 * Math.sin(b), 0];
    const B = ES.baseTournee(a), pp = ES.changerBase(p, B), rp = ES.changerBase(R, B);
    svg.innerHTML = "";
    axe([1, 0], "c-label", "x"); axe([0, 1], "c-label", "y");
    axe([B[0][0], B[0][1]], "c-tint", "x′"); axe([B[1][0], B[1][1]], "c-tint", "y′");
    Plot.fleche(svg, O, [O[0] + 70 * Math.cos(b), O[1] - 70 * Math.sin(b)], { cls: "c-warn", trait: "stroke bold" });
    Plot.fleche(svg, O, px(R), { cls: "c-ok" });
    Plot.el("circle", { cx: px(R)[0], cy: px(R)[1], r: 4, class: "fill c-ok" }, svg);
    const lab = (x, y, s) => { Plot.el("text", { x, y }, svg).textContent = s; };
    lab(px(R)[0] + 8, px(R)[1] - 6, "P");
    lab(420, 60, t("fig.l.p", { c: c3(pp.map(v => v / P0)) }));
    lab(420, 84, t("fig.l.r", { c: c3(rp.map(v => v * 100)) }));
    lab(420, 108, t("fig.l.pxy", { c: c3(p.map(v => v / P0)) }));
    lab(420, 132, t("fig.l.rxy", { c: c3(R.map(v => v * 100)) }));
    const phi = ES.potentielDipole(p, R), phiP = ES.potentielDipole(pp, rp), r = Math.hypot(...R);
    const naif = ES.K * P0 * rp[1] / r ** 3;                     // §6-2's formula, with y′ taken as the axis of the dipole
    $("alr").textContent = deg(+al.value); $("ber").textContent = deg(+be.value);
    $("vc").textContent = F.si(pp[0] * rp[0] + pp[1] * rp[1] + pp[2] * rp[2], "C·m²", { sig: 4 });
    $("fc").textContent = t("fig.f.comp", { v: F.si(p[0] * R[0] + p[1] * R[1] + p[2] * R[2], "C·m²", { sig: 4 }) });
    $("vv").textContent = F.si(phiP, "V", { sig: 4 });
    $("fv").textContent = t("fig.f.vect", { v: F.si(phi, "V", { sig: 4 }) });
    $("vn").textContent = F.si(naif, "V", { sig: 4 });
    $("fn").textContent = Math.abs(naif - phi) <= 1e-9 * Math.abs(phi) + 1e-12 ? t("fig.f.naif.ok") : t("fig.f.naif.ko", { e: F.si(naif - phi, "V", { sig: 3 }) });
  }
  al.oninput = be.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hamilton", 1843, "idea"], ["gibbs", 1881, "idea"], ["norme", 2019, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["structures", "notation"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["invariant", "b"], ["composantes", "c"], ["choix", "a"], ["piege", "d"], ["tourner", "b"], ["cartesien", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 63 });
})();
</script>
