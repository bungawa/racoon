<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, X = Cristaux, EV = ES.E;
const pct = e => F.qty(F.num(100 * e, 2), "%");
const MADELUNG = ES.madelungLignes(12).total;

/* ---------- le système décrit : le sel, ions ponctuels au repos ---------- */
(() => {
  const a = X.STRUCTURES.NaCl.a / 2, u = ES.K * ES.E * ES.E / a, U = MADELUNG * u, kT = Constantes.k_B * 300, n = 9.4;
  const BH = 787e3 / Constantes.N_A;                                              // J per ion pair, Born–Haber (« Les liaisons chimiques dans les cristaux »)
  $("sys1").innerHTML = t("sys1.body", { a: F.si(a, "m", { prefix: "p" }), u: F.qty(F.num(u / EV, 3), "eV"), U: F.qty(F.num(U / EV, 3), "eV"),
    kt: pct(kT / U), rep: F.qty(F.num(U * (1 - 1 / n) / EV, 3), "eV"), bh: F.qty(F.num(BH / EV, 3), "eV"), ecart: pct(1 - U * (1 - 1 / n) / BH) });
})();

/* ---------- le potentiel d'une rangée alternée, vu de côté ---------- */
(() => {
  const sl = $("rhosl");
  function draw() {
    const rho = +sl.value / 100, phi = ES.ligneAlternee(rho, 0), N = 20000;
    const direct = (ES.ligneDirecte(rho, 0, N) + ES.ligneDirecte(rho, 0, N + 1)) / 2;
    $("rhoread").textContent = F.num(rho, 3);
    $("vrang").textContent = F.sci(phi, 3);
    $("vdirect").textContent = F.sci(direct, 3);
    $("vseule").textContent = F.sci(phi * rho, 2);
  }
  sl.oninput = draw; draw();
})();

/* ---------- trois ordres de sommation pour la même somme ---------- */
(() => {
  const svg = $("sommes"), Rsl = $("Rsl"), RMAX = 12;
  const L = ES.madelungLignes(RMAX), S = ES.madelungSpheres(RMAX);
  const C = Array.from({ length: RMAX }, (_, i) => [i + 1, X.madelungNaCl(i + 1)]);
  const lignes = [[0, L.propre]].concat(L.couches.map(c => [c.rho, c.cumul]));     // the value once every row closer than ρ is in
  const marche = (pts, r) => { let v = NaN; for (const [x, y] of pts) if (x <= r + 1e-9) v = y; return v; };
  const Y0 = 1e-10, Y1 = 30, clip = v => Math.max(Y0, Math.min(Y1, Math.abs(v - MADELUNG)));   // the distance to the limit, log scale
  function draw() {
    const R = +Rsl.value / 2;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44 }, x: { domain: [0, RMAX], label: t("so.x"), fmt: v => F.num(v, 2) },
      y: { scale: "log", domain: [Y0, Y1], label: t("so.y") } });
    const stairs = pts => { const out = []; pts.forEach(([px, py], i) => { if (i) out.push([x(px), y(clip(pts[i - 1][1]))]); out.push([x(px), y(clip(py))]); });
      out.push([x(RMAX), y(clip(pts[pts.length - 1][1]))]); return out; };
    Plot.el("path", { d: Plot.path(stairs(S.map(s => [s.r, s.M]))), class: "stroke thin" }, Plot.el("g", { class: "c-warn" }, g));
    const gc = Plot.el("g", { class: "c-ok" }, g);
    Plot.el("path", { d: Plot.path(C.map(([n, m]) => [x(n), y(clip(m))])), class: "stroke" }, gc);
    C.forEach(([n, m]) => Plot.el("circle", { cx: x(n), cy: y(clip(m)), r: 3.5, class: "fill" }, gc));
    Plot.el("path", { d: Plot.path(stairs(lignes)), class: "stroke bold" }, Plot.el("g", { class: "c-tint" }, g));
    Plot.el("line", { x1: x(R), x2: x(R), y1: y(Y0), y2: y(Y1), class: "stroke thin" }, Plot.el("g", { class: "c-label-2" }, g));
    const vl = marche(lignes, R), n = Math.floor(R), vc = n >= 1 ? X.madelungNaCl(n) : NaN, vs = marche(S.map(s => [s.r, s.M]), R);
    $("Rread").textContent = F.num(R, 3);
    $("vrangees").textContent = F.fix(vl, 7);
    $("frangees").textContent = t("so.f.ecart", { e: F.sci(Math.abs(vl - MADELUNG), 1) });
    $("vcubes").textContent = F.fix(vc, 7);
    $("fcubes").textContent = t("so.f.cube", { n: F.num(n, 2), e: F.sci(Math.abs(vc - MADELUNG), 1) });
    $("vspheres").textContent = F.fix(vs, 3);
  }
  Rsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bornlande", 1918, "idea"], ["evjen", 1932, "idea"], ["emersleben", 1951, "idea"], ["borwein", 1985, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ordres"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["compter", "c"], ["moities", "a"], ["voisine", "d"], ["distance", "b"], ["spheres", "c"], ["points", "a"], ["thermique", "d"], ["ecart", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 83 });
})();
</script>
