<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd;

/* ---------- deux spires quelconques : le flux de l'une dans l'autre, dans les deux sens ---------- */
(() => {
  const R1 = 0.05, schema = $("schema"), courbe = $("courbe"), S = ["sr2", "sh", "sd", "sa"].map($);
  const X = x => 200 + 2000 * x, Z = z => 220 - 2000 * z;                       // side view: 1 cm = 20 px
  const nH = v => F.si(v, "H", { prefix: "n" });
  function draw() {
    const R2 = +S[0].value / 1000, h = +S[1].value / 1000, d = +S[2].value / 1000, al = +S[3].value * Math.PI / 180;
    const r = M.mutuelleInclinee({ R1, R2, d, h, alpha: al, n: 40, np: 240 });
    /* schematic: both loops seen edge on, each with its normal */
    schema.innerHTML = "";
    Plot.el("line", { x1: X(-R1), x2: X(R1), y1: Z(0), y2: Z(0), class: "stroke bold c-tint" }, schema);
    Plot.fleche(schema, [X(0), Z(0)], [X(0), Z(0) - 40], { cls: "c-tint" });
    const c = Math.cos(al), s = Math.sin(al);
    Plot.el("line", { x1: X(d - R2 * c), x2: X(d + R2 * c), y1: Z(h + R2 * s), y2: Z(h - R2 * s), class: "stroke bold c-warn" }, schema);
    Plot.fleche(schema, [X(d), Z(h)], [X(d) + 40 * s, Z(h) - 40 * c], { cls: "c-warn" });
    Plot.el("line", { x1: X(-0.09), x2: X(0.21), y1: Z(0), y2: Z(0), class: "stroke thin dash c-label-2" }, schema);
    /* M against the tilt, by the circulation of A (cheap and exact) */
    courbe.innerHTML = "";
    const as = Array.from({ length: 61 }, (_, k) => k * 3), ms = as.map(a => M.mutuelleInclinee({ R1, R2, d, h, alpha: a * Math.PI / 180, n: 2, np: 90 }).circulation * 1e9);
    const ds = as.map(a => M.mutuelleInclinee({ R1, R2, d, h, alpha: a * Math.PI / 180, n: 2, np: 8 }).dipole * 1e9);
    const top = 1.1 * Math.max(...ms.map(Math.abs), 1e-3), lim = Math.min(top * 1.6, 1.1 * Math.max(...ds.map(Math.abs), ...ms.map(Math.abs)));
    const P = Plot.axes(courbe, { fmt: F, w: 640, h: 230, pad: { l: 64, b: 44 }, x: { domain: [0, 180], label: t("fig.xaxis") }, y: { domain: [-lim, lim], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(180), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const clip = v => Math.max(-lim, Math.min(lim, v));
    Plot.el("path", { d: Plot.path(as.map((a, k) => [P.x(a), P.y(clip(ds[k]))])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(as.map((a, k) => [P.x(a), P.y(ms[k])])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(+S[3].value), cy: P.y(r.circulation * 1e9), r: 5, class: "dot" }, P.g);
    $("sr2r").textContent = F.qty(F.num(R2 * 100, 3), "cm");
    $("shr").textContent = F.qty(F.num(h * 100, 3), "cm");
    $("sdr").textContent = F.qty(F.num(d * 100, 3), "cm");
    $("sar").textContent = F.qty(F.num(+S[3].value, 3), "°");
    $("v21").textContent = nH(r.M21);
    $("f21").textContent = t("fig.f.m21");
    $("v12").textContent = nH(r.M12);
    $("f12").textContent = t("fig.f.m12", { e: F.qty(F.num(100 * Math.abs(r.M12 - r.M21) / Math.max(Math.abs(r.M21), 1e-30), 2), "%") });
    $("vn").textContent = nH(r.neumann);
    $("fn").textContent = t("fig.f.n", { d: nH(r.dipole) });
  }
  S.forEach(x => x.oninput = draw); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["neumann", 1845, "idea"], ["qi", 2010, "use"], ["qi2", 2023, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["recharge", "pince"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["solenoide", "b"], ["forme", "a"], ["symetrie", "d"], ["signe", "c"], ["perpendiculaire", "a"], ["decalage", "b"], ["unite", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 176 });
})();
</script>
