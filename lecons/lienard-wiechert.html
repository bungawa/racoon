<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, c = Constantes.c;

/* ---------- le cube lu tranche par tranche : (21.30) à la main ---------- */
(() => {
  const a = 1e-3, R = 10, w = a / 10;                                          // a 1 mm cube at 10 m, slices of 0,1 mm
  const svg = $("cube"), sb = $("sb"), sa = $("sa");
  const S = 70 / a, X = x => 300 + (x + R) * S, Xc = dx => 300 + dx * S, Y = y => 95 - y * S;   // the cube's retarded centre at (300, 95)
  const base = 225, haut = 40;                                                 // the bars: a full slice (w of charge) is 40 px
  function draw() {
    const beta = +sb.value, th = +sa.value * Math.PI / 180, vr = beta * Math.cos(th) * c, vt = beta * Math.sin(th);
    const s = M.balayage({ a, R, w, vr });
    svg.innerHTML = "";
    /* every slice that holds charge: the cube where it was at that slice's retarded time (above), and the charge the
       slice holds (a bar on the base line, full height for a slice filled over its whole thickness w) */
    s.tranches.forEach(tr => {
      const yc = vt * c * tr.t;                                                // the transverse drift during the sweep
      Plot.el("rect", { x: X(tr.xc - a / 2), y: Y(yc + a / 2), width: a * S, height: a * S, class: "stroke thin c-label-2" }, svg);
      const h = haut * tr.part * a / w;
      Plot.el("rect", { x: X(tr.x - w / 2), y: base - h, width: w * S, height: h, class: "fill c-tint" }, svg);
    });
    Plot.el("rect", { x: Xc(-a / 2), y: Y(a / 2), width: a * S, height: a * S, class: "stroke bold c-label" }, svg);
    Plot.el("line", { x1: 20, x2: 620, y1: base, y2: base, class: "stroke thin c-label-2" }, svg);
    /* the swept length b, and the way to the observer */
    const y0 = 243, x1 = Xc(-s.b / 2), x2 = Xc(s.b / 2);
    Plot.el("line", { x1, x2, y1: y0, y2: y0, class: "stroke bold c-warn" }, svg);
    [x1, x2].forEach(x => Plot.el("line", { x1: x, x2: x, y1: y0 - 6, y2: y0 + 6, class: "stroke bold c-warn" }, svg));
    Plot.fleche(svg, [560, 30], [630, 30], { cls: "c-label-2" });
    Plot.el("text", { x: 595, y: 20, "text-anchor": "middle" }, svg).textContent = t("fig.observateur");
    if (beta > 0) Plot.fleche(svg, [Xc(0), Y(0)], [Xc(0) + 60 * beta * Math.cos(th), Y(0) - 60 * beta * Math.sin(th)], { cls: "c-warn" });
    $("sbr").textContent = F.num(beta, 2);
    $("sar").textContent = F.qty(F.num(+sa.value, 3), "°");
    $("vb").textContent = F.num(s.b / a, 3);
    $("fb").textContent = t("fig.f.b", { n: s.N, ex: F.num(s.bExact / a, 3) });
    $("vphi").textContent = F.num(s.somme, 4);
    $("fphi").textContent = t("fig.f.phi", { v: F.num(1 / (1 - vr / c), 4) });
    $("vvr").textContent = F.num(vr / c, 3);
    $("fvr").textContent = t("fig.f.vr", { v: F.num(vt, 3) });
  }
  sb.oninput = sa.oninput = draw; draw();
})();

/* ---------- le système décrit : un électron de 6 GeV ---------- */
(() => {
  const E = 6e9 * Constantes.e, mc2 = Constantes.m_e * c * c, g = E / mc2, unMoinsBeta = 1 / (g * g * (1 + Math.sqrt(1 - 1 / (g * g))));
  $("sys1").innerHTML = t("sys1.body", { g: F.num(g, 3), b: F.sci(unMoinsBeta, 2), f: F.sci(1 / unMoinsBeta, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lorenz", 1867, "idea"], ["lienard", 1898, "idea"], ["wiechert", 1900, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["esrf"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "b"], ["travers", "c"], ["taille", "a"], ["fuite", "d"], ["ret", "a"], ["relat", "b"], ["vecteur", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 215 });
})();
</script>
