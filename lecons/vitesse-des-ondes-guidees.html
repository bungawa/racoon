<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, c = Constantes.c, A = 22.86e-3, B = 10.16e-3, FC = M.guideRect(A, B, 1e9).fc;   // the guide of « Le guide d'onde rectangulaire »

/* ---------- le système décrit : une impulsion de 1 ns dans 10 m de guide ---------- */
(() => {
  const f = 10e9, L = 10, df = 1e9, g = M.guideRect(A, B, f), tau = x => L / M.guideRect(A, B, x).vGroupe;
  $("sys1").innerHTML = t("sys1.body", { L: F.si(L, "m"), f: F.si(f, "Hz"), r: F.num(f / FC, 3), vg: F.num(g.vGroupe / c, 3), vp: F.num(g.vPhase / c, 3),
    tg: F.si(tau(f), "s", { prefix: "n" }), tc: F.si(L / c, "s", { prefix: "n" }), dt: F.si(tau(f - df / 2) - tau(f + df / 2), "s", { prefix: "n" }) });
})();

/* ---------- deux ondes voisines : les crêtes et l'enveloppe ---------- */
(() => {
  const paquet = $("paquet"), disp = $("disp"), sr = $("sr"), st = $("st"), play = $("play"), Lz = 0.8, d = 0.03;
  let timer = null;
  function draw() {
    const r = +sr.value, f = r * FC, p = M.paquetGuide(A, B, f * (1 - d), f * (1 + d)), g = M.guideRect(A, B, f);
    const pas = 2 * Math.PI / Math.abs(p.g2.kz - p.g1.kz), tmax = pas / p.vEnveloppe, tt = +st.value * tmax;
    paquet.innerHTML = "";
    const P = Plot.axes(paquet, { fmt: F, w: 640, h: 220, pad: { l: 48, b: 44 }, x: { domain: [0, 100 * Lz], label: t("fig.xaxis") }, y: { domain: [-2.2, 2.2], label: t("fig.yaxis") } });
    const zs = Array.from({ length: 1201 }, (_, i) => i * Lz / 1200);
    Plot.el("path", { d: Plot.path(zs.map(z => [P.x(100 * z), P.y(p.E(z, tt))])), class: "curve" }, P.g);
    [1, -1].forEach(s => Plot.el("path", { d: Plot.path(zs.map(z => [P.x(100 * z), P.y(s * p.enveloppe(z, tt))])), class: "stroke dash c-warn" }, P.g));
    const ze = (p.vEnveloppe * tt) % pas, zc = (p.vPhase * tt) % pas;
    Plot.el("circle", { cx: P.x(100 * ze), cy: P.y(2), r: 5, class: "fill c-warn" }, P.g);
    Plot.el("circle", { cx: P.x(100 * zc), cy: P.y(p.E(zc, tt)), r: 5, class: "fill c-ok" }, P.g);
    /* dispersion: ω/ωc against kz a/π, the light line, the chord (phase) and the tangent (group) */
    disp.innerHTML = "";
    const D = Plot.axes(disp, { fmt: F, w: 640, h: 240, pad: { l: 48, b: 44 }, x: { domain: [0, 3], label: t("fig.kaxis") }, y: { domain: [0, 3.2], label: t("fig.waxis") } });
    const X = Array.from({ length: 151 }, (_, i) => i * 3 / 150);
    Plot.el("path", { d: Plot.path(X.map(x => [D.x(x), D.y(M.pulsationGuide(x * Math.PI / A, A) / g.omegaC)])), class: "curve" }, D.g);
    Plot.el("line", { x1: D.x(0), y1: D.y(0), x2: D.x(3), y2: D.y(3), class: "stroke thin dash c-label-2" }, D.g);
    const x0 = g.kz * A / Math.PI, s = g.vGroupe / c;
    Plot.el("line", { x1: D.x(0), y1: D.y(0), x2: D.x(x0), y2: D.y(r), class: "stroke c-ok" }, D.g);
    Plot.el("line", { x1: D.x(Math.max(0, x0 - 0.8)), y1: D.y(r - s * (x0 - Math.max(0, x0 - 0.8))), x2: D.x(Math.min(3, x0 + 0.8)), y2: D.y(r + s * (Math.min(3, x0 + 0.8) - x0)), class: "stroke c-warn" }, D.g);
    Plot.el("circle", { cx: D.x(x0), cy: D.y(r), r: 5, class: "dot" }, D.g);
    $("srr").textContent = F.num(r, 3) + " · " + F.si(f, "Hz");
    $("str").textContent = F.si(tt, "s", { prefix: "n" });
    $("vvp").textContent = t("fig.v.c", { v: F.num(g.vPhase / c, 3) });
    $("fvp").textContent = t("fig.f.vp", { v: F.num(p.vPhase / c, 3) });
    $("vvg").textContent = t("fig.v.c", { v: F.num(g.vGroupe / c, 3) });
    $("fvg").textContent = t("fig.f.vg", { v: F.num(p.vEnveloppe / c, 3) });
    $("vpr").textContent = F.num(g.vPhase * g.vGroupe / (c * c), 4);
    $("fpr").textContent = t("fig.f.prod");
  }
  const stop = () => { clearInterval(timer); timer = null; play.textContent = t("fig.play"); };
  play.onclick = () => {
    if (timer) return stop();
    play.textContent = t("fig.pause");
    timer = setInterval(() => { st.value = ((+st.value + 0.005) % 1).toFixed(3); draw(); }, 40);
  };
  sr.oninput = st.oninput = draw; draw();
})();

/* ---------- la masse du guide ; la puissance transportée ---------- */
(() => {
  const g = M.guideRect(A, B, 10e9), Eeff = 1e5, P = g.puissance(2 * Eeff);     // (24.32) with E0 the rms over time and section = amplitude/2
  $("masse").innerHTML = t("masse.body", { m: F.sci(g.masse, 2), me: F.sci(g.masse / Constantes.m_e, 2) });
  $("puiss").innerHTML = t("puiss.body", { e: F.si(Eeff, "V·m⁻¹"), vg: F.num(g.vGroupe / c, 3), P: F.si(P, "W"), crete: F.si(2 * Eeff, "V·m⁻¹") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["sommerfeld", 1914, "idea"], ["debroglie", 1924, "idea"], ["precurseurs", 1969, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["linac"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["plusvite", "b"], ["signal", "d"], ["produit", "a"], ["coupure", "c"], ["masse", "a"], ["energie", "c"], ["etale", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 244 });
})();
</script>
