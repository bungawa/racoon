<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), Gr = Gravitation, Cst = Constantes, C98 = Gr.CAVENDISH_1798;
const GU = "m³·kg⁻¹·s⁻²", RHO = "kg·m⁻³";
const minutes = s => s < 120 ? F.qty(F.num(s, 3), "s") : F.qty(F.num(s / 60, 3), "min");

/* ---------- la balance : vue de dessus, oscillation, parasites, masse de la Terre ---------- */
(() => {
  const svg = $("balance"), sw = $("swing"), P = Plot.el, S = { g: $("gsl"), M: $("msl"), m: $("psl"), d: $("dsl"), k: $("ksl") };
  const PX = 150, O = [320, 130];                                   // px per metre (top view), centre of the wire
  const PAR = ["air", "charge", "autre"], par = textOf("par.rows", PAR);
  function state() {
    const o = { G: Cst.G * (1 + S.g.value / 100), M: +S.M.value, m: +S.m.value, d: +S.d.value, kappa: Math.pow(10, +S.k.value) };
    return { o, c: Gr.cavendish(o) };
  }
  function drawTop(o, c) {
    svg.innerHTML = "";
    const L = C98.l * PX, ex = Math.min(0.35, c.theta * 60);       // rotation exaggerated ×60, capped
    const big = (sgn, ang) => { const bx = O[0] + sgn * L * Math.cos(ang), by = O[1] + sgn * L * Math.sin(ang); return [bx, by]; };
    /* the large balls: beside each small ball at rest, at distance d, on opposite sides (torques add) */
    const rb = 0.5 * C98.D * PX * Math.cbrt(o.M / C98.M);
    [[1, -1], [-1, 1]].forEach(([sx, sy]) => P("circle", { cx: O[0] + sx * L, cy: O[1] + sy * o.d * PX, r: Math.max(4, rb), class: "fill c-warn" }, svg));
    /* rest position, dashed; deflected position, plain */
    P("line", { x1: O[0] - L, y1: O[1], x2: O[0] + L, y2: O[1], class: "stroke thin dash c-label-2" }, svg);
    const a = big(1, -ex), b = big(-1, -ex);
    P("line", { x1: b[0], y1: b[1], x2: a[0], y2: a[1], class: "stroke c-tint" }, svg);
    const rs = Math.max(4, 0.5 * C98.dm * PX * 2 * Math.cbrt(o.m / C98.m));
    [a, b].forEach(p => P("circle", { cx: p[0], cy: p[1], r: rs, class: "fill c-tint" }, svg));
    P("circle", { cx: O[0], cy: O[1], r: 4, class: "fill c-label" }, svg);
    const n = P("text", { x: O[0], y: O[1] + 24, "text-anchor": "middle" }, svg); n.textContent = t("bal.lab.fil");
    const e = P("text", { x: 20, y: 248 }, svg); e.textContent = t("bal.lab.echelle", { x: F.num(60, 2) });
  }
  function drawSwing(c) {
    sw.innerHTML = "";
    const smm = c.s * 1000, top = Math.max(1e-6, 2.2 * smm), tmax = 2 * c.T / 60;
    const { x, y, g } = Plot.axes(sw, { fmt: F, w: 640, h: 220, x: { scale: "lin", domain: [0, tmax], label: t("sw.x") }, y: { scale: "lin", domain: [0, top], label: t("sw.y") } });
    let d = "";
    for (let i = 0; i <= 200; i++) { const tt = i * 2 * c.T / 200; d += (i ? "L" : "M") + x(tt / 60).toFixed(1) + " " + y(C98.l * Gr.swing(c.theta, c.T, tt) * 1000).toFixed(1); }
    P("line", { x1: x(0), x2: x(tmax), y1: y(smm), y2: y(smm), class: "ref" }, g);
    P("path", { d, class: "curve" }, g);
    P("text", { x: x(tmax) - 4, y: y(smm) - 6, "text-anchor": "end", class: "note" }, g).textContent = t("sw.note", { s: F.qty(F.num(smm, 3), "mm") });
  }
  function draw() {
    const { o, c } = state();
    $("gread").textContent = F.qty(F.sci(o.G, 4), GU);
    $("mread").textContent = F.qty(F.num(o.M, 3), "kg");
    $("pread").textContent = F.qty(F.num(o.m, 3), "kg");
    $("dread").textContent = F.si(o.d, "m");
    $("kread").textContent = F.qty(F.sci(o.kappa, 2), "N·m·rad⁻¹");
    $("vf").textContent = F.si(c.F, "N");
    $("ff").textContent = t("bal.f.poids", { r: F.sci(1 / c.weightRatio, 2) });
    $("vt").textContent = minutes(c.T);
    $("vth").textContent = F.qty(F.sci(c.theta, 3), "rad");
    $("fth").textContent = t("bal.f.s", { s: F.qty(F.num(c.s * 1000, 3), "mm") });
    const terre = Gr.peserTerre(o.G);
    $("vterre").textContent = F.qty(F.sci(terre.M, 4), "kg");
    $("fterre").textContent = t("bal.f.rho", { rho: F.qty(F.num(terre.rho, 4), RHO) });
    const V = {
      air: { v: F.qty(F.num(c.air * 1000, 2), "mm·s⁻¹") },
      charge: { v: F.si(c.q, "C", { sig: 2 }), u: F.si(c.V, "V", { sig: 2 }) },
      autre: { v: F.qty(F.num(c.farFrac * 100, 2), "%") },
    };
    $("parasites").innerHTML = PAR.map(id => `<div><span class="k">${par[id].k}</span><span>${par[id].text.replace("{v}", V[id].v).replace("{u}", V[id].u || "")}</span></div>`).join("");
    drawTop(o, c); drawSwing(c);
  }
  Object.values(S).forEach(s => s.oninput = draw);
  S.k.value = Math.log10(C98.kappa).toFixed(2); draw();
})();

/* ---------- 1798 : densité de la Terre et G ---------- */
(() => {
  const ROWS = ["publie", "moyenne", "actuel"], txt = textOf("c98.rows", ROWS);
  const D = Gr.densite1798(), rho = { publie: 5480, moyenne: D.mean, actuel: Gr.peserTerre().rho };
  const pc = x => F.qty(F.num(x * 100, 2), "%"), dens = x => F.qty(F.num(x, 3), RHO);
  const stats = { min: dens(D.min), max: dens(D.max), sd: dens(D.sd), sdr: pc(D.sd / D.mean), u: dens(D.u), ur: pc(D.u / D.mean) };
  const fillS = s => s.replace(/\{(\w+)\}/g, (m, k) => k in stats ? stats[k] : m);
  const V = id => ({ rho: F.qty(F.num(rho[id], 4), RHO), g: F.qty(F.sci(Gr.gFromDensity(rho[id]), 4), GU), e: F.qty(F.num((Gr.gFromDensity(rho[id]) / Cst.G - 1) * 100, 2), "%") });
  $("cav1798").innerHTML = ROWS.map(id => { const v = V(id); return `<div><span class="k">${txt[id].k}</span><span>${t("c98.line", v)} ${fillS(txt[id].text)}</span></div>`; }).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["michell", 1793, "idea"], ["cavendish", 1798, "experiment"], ["boys", 1895, "experiment"], ["heyl", 1930, "experiment"], ["hust", 2018, "experiment"], ["codata", 2024, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gm", "torsion"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["masse", "a"], ["periode", "a"], ["air", "a"], ["peser", "a"], ["autre", "a"], ["incertitude", "a"], ["torsion", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 76 });
})();
</script>
