<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- T turned α about x (6.34) or about y; probabilities of +T for the states +S and +x (spin up along x) ---------- */
(() => {
  const sa = $("sa"), r = Math.SQRT1_2, PZ = Q.etatBase(2, 0), PX = [Cx.c(r, 0), Cx.c(r, 0)];
  const P = (R, v) => Cx.abs2(Q.appliquer(R, v)[0]);
  function draw() {
    const d = +sa.value, a = d * Math.PI / 180, svg = $("courbes"); svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 260, x: { domain: [0, 360], label: t("fig.ax.alpha") }, y: { domain: [0, 1], label: t("fig.ax.p") } });
    const ds = Array.from({ length: 145 }, (_, k) => k * 2.5);
    Plot.el("path", { d: Plot.path(ds.map(x => [ax.x(x), ax.y(P(Q.demiX(x * Math.PI / 180), PX))])), class: "stroke c-tint", fill: "none" }, svg);
    Plot.el("path", { d: Plot.path(ds.map(x => [ax.x(x), ax.y(P(Q.demiY(x * Math.PI / 180), PX))])), class: "stroke dash c-warn", fill: "none" }, svg);
    Plot.el("line", { x1: ax.x(d), x2: ax.x(d), y1: ax.y(0), y2: ax.y(1), class: "stroke thin dash c-label" }, svg);
    $("sar").textContent = F.num(d, 3) + "\u00a0°";
    $("vz").textContent = F.num(P(Q.demiX(a), PZ), 3) + " ; " + F.num(P(Q.demiY(a), PZ), 3); $("fz").textContent = t("fig.f.z");
    $("vx").textContent = F.num(P(Q.demiX(a), PX), 3) + " ; " + F.num(P(Q.demiY(a), PX), 3); $("fx").textContent = t("fig.f.x");
    const c = Q.appliquer(Q.demiX(a), PZ);
    $("vamp").textContent = c.map(z => Cx.text(z, x => F.num(Math.abs(x) < 5e-13 ? 0 : x, 3))).join(" ; ");
  }
  sa.oninput = draw; draw();
  const A = Q.produitMatrices(Q.demiX(Math.PI / 2), Q.demiY(Math.PI / 2)), B = Q.produitMatrices(Q.demiY(Math.PI / 2), Q.demiX(Math.PI / 2));
  $("sys1").innerHTML = t("sys1.body", { a: F.num(Cx.abs2(Q.appliquer(A, PZ)[0]), 2), b: F.num(Cx.abs2(Q.appliquer(B, PZ)[0]), 2),
    pa: F.num(Cx.arg(Q.appliquer(A, PZ)[0]) * 180 / Math.PI, 3), pb: F.num(Cx.arg(Q.appliquer(B, PZ)[0]) * 180 / Math.PI, 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cirac", 1995, "idea"], ["nist", 1995, "experiment"], ["innsbruck", 2021, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["qubits"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["compose", "c"], ["phase", "a"], ["meme", "d"], ["diff", "b"], ["ordre", "c"], ["tour", "a"], ["axe", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 605 });
})();
</script>
