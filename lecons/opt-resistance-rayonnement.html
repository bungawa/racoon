<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd;
const A = 1e-3, XMAX = 0.75;                                   // copper wire of radius 1 mm; the sinusoidal model up to 0,75 λ

/* ---------- rayonner ou chauffer : un dipôle de cuivre alimenté au centre ---------- */
(() => {
  const svg = $("resist"), sf = $("sf"), sl = $("sl");
  function draw() {
    const f = 10 ** +sf.value, L = 10 ** +sl.value, lambda = O.c / f, x = L / lambda;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 40 }, x: { scale: "log", domain: [1e-3, XMAX], label: t("fig.xaxis") }, y: { scale: "log", domain: [1e-5, 1e3], label: t("fig.yaxis") } });
    const xs = Array.from({ length: 161 }, (_, i) => 10 ** (-3 + i * Math.log10(XMAX * 1e3) / 160));
    const clip = v => Math.min(1e3, Math.max(1e-5, v));
    Plot.el("path", { d: Plot.path(xs.map(u => [P.x(u), P.y(clip(O.dipoleMince(u * lambda, lambda).R))])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map(u => [P.x(u), P.y(clip(O.resistanceDipoleCourt(u * lambda, lambda)))])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map(u => [P.x(u), P.y(clip(O.pertesOhmiques({ L: u * lambda, lambda, a: A }).R))])), class: "stroke c-ko" }, P.g);
    $("sfr").textContent = F.si(f, "Hz");
    $("slr").textContent = F.si(L, "m");
    $("vx").textContent = F.num(x, 3);
    $("fx").textContent = t("fig.f.x", { l: F.si(lambda, "m") });
    if (x > XMAX || x < 1e-3) {
      $("vr").textContent = "–"; $("fr").textContent = t(x > XMAX ? "fig.f.long" : "fig.f.court");
      $("veta").textContent = "–"; $("feta").textContent = "";
      return;
    }
    const R = O.dipoleMince(L, lambda).R, p = O.pertesOhmiques({ L, lambda, a: A }), eta = O.rendement(R, p.R);
    Plot.el("circle", { cx: P.x(x), cy: P.y(clip(R)), r: 5, class: "dot" }, P.g);
    $("vr").textContent = F.si(R, "Ω");
    $("fr").textContent = t("fig.f.r", { c: F.si(O.resistanceDipoleCourt(L, lambda), "Ω"), p: F.si(p.R, "Ω") });
    $("veta").textContent = F.num(100 * eta, 3) + " %";
    $("feta").textContent = t("fig.f.eta", { d: F.si(p.delta, "m"), r: F.num(p.delta / A, 2) });
  }
  sf.oninput = sl.oninput = draw; draw();
})();

/* ---------- le système décrit : un dipôle de 10 m à 1 MHz ---------- */
(() => {
  const f = 1e6, L = 10, lambda = O.c / f, R = O.dipoleMince(L, lambda).R, p = O.pertesOhmiques({ L, lambda, a: A });
  $("sys1").innerHTML = t("sys1.body", { l: F.si(lambda, "m"), x: F.num(L / lambda, 2), R: F.si(R, "Ω"), Rp: F.si(p.R, "Ω"),
    eta: F.num(100 * O.rendement(R, p.R), 2), d: F.si(p.delta, "m"), r: F.num(p.delta / A, 2), rr: F.num(1e3 / lambda, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hertz", 1887, "experiment"], ["abraham", 1898, "idea"], ["marconi", 1901, "experiment"], ["carter", 1932, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["vlf", "demi"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["chaleur", "b"], ["double", "c"], ["courant", "a"], ["court", "d"], ["pertes", "b"], ["force", "c"], ["demi", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 321 });
})();
</script>
