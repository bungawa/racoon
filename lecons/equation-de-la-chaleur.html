<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'équation de la chaleur</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-outils" data-i18n="monde.outils"></a><span class="aux">›</span><a href="/racoon/etape?id=operateur-nabla" data-i18n="etape.operateur-nabla"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/gradient" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>J</mi><mo>=</mo><mi>κ</mi><mspace width="0.1em"/><mfrac><mrow><mo stretchy="false">(</mo><msub><mi>T</mi><mn>2</mn></msub><mo>−</mo><msub><mi>T</mi><mn>1</mn></msub><mo stretchy="false">)</mo><mspace width="0.1em"/><mi>A</mi></mrow><mi>d</mi></mfrac></math><span class="n">(2.42)</span></div>
    <p class="validite" data-i18n-html="val.2.42"></p>
    <p id="vitre"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mover accent="true"><mi>h</mi><mo>→</mo></mover><mo>=</mo><mo>−</mo><mi>κ</mi><mspace width="0.1em"/><mo>∇</mo><mi>T</mi></math><span class="n">(2.44)</span></div>
    <p class="validite" data-i18n-html="val.2.44"></p>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi>ρ</mi><mi>c</mi><mspace width="0.1em"/><mfrac><mrow><mo>∂</mo><mi>T</mi></mrow><mrow><mo>∂</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mo>−</mo><mfrac><mrow><mo>∂</mo><msub><mi>h</mi><mi>x</mi></msub></mrow><mrow><mo>∂</mo><mi>x</mi></mrow></mfrac><mspace width="1.2em"/><mo>⟹</mo><mspace width="1.2em"/><mfrac><mrow><mo>∂</mo><mi>T</mi></mrow><mrow><mo>∂</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mi>D</mi><mspace width="0.1em"/><mfrac><mrow><msup><mo>∂</mo><mn>2</mn></msup><mi>T</mi></mrow><mrow><mo>∂</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfrac><mo>,</mo><mspace width="1em"/><mi>D</mi><mo>=</mo><mfrac><mi>κ</mi><mrow><mi>ρ</mi><mi>c</mi></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.chaleur"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="box prop"><b data-i18n="s3.prop.title"></b>
      <p data-i18n-html="s3.prop.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys"></p>
    </div>
    <figure class="chart">
      <svg id="profil" role="img" data-i18n-attr="aria-label:barre.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="barre.legend.t"></span><span class="c-warn" data-i18n="barre.legend.lin"></span></div>
      <div class="panel">
        <div class="controls">
          <label class="field"><span data-i18n="barre.mat"></span>
            <select id="mat">
              <option value="cuivre" data-i18n="barre.opt.cuivre"></option>
              <option value="inox" data-i18n="barre.opt.inox"></option>
              <option value="verre" data-i18n="barre.opt.verre"></option>
            </select></label>
          <div class="ctl"><div class="row"><label for="tsl" data-i18n="barre.t"></label><output id="tread" for="tsl"></output></div>
            <input id="tsl" type="range" min="0" max="100" step="1" value="20"></div>
          <div class="seg" role="group" data-i18n-attr="aria-label:barre.bord"><button type="button" id="fixe" aria-pressed="true" data-i18n="barre.fixe"></button><button type="button" id="isole" aria-pressed="false" data-i18n="barre.isole"></button></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="barre.k.hg"></span><span class="v" id="vhg"></span><span class="f" data-i18n="barre.f.hg"></span></div>
          <div class="stat"><span class="k" data-i18n-html="barre.k.hd"></span><span class="v" id="vhd"></span><span class="f" data-i18n="barre.f.hd"></span></div>
          <div class="stat"><span class="k" data-i18n-html="barre.k.perm"></span><span class="v" id="vperm"></span><span class="f" data-i18n="barre.f.perm"></span></div>
          <div class="stat"><span class="k" data-i18n-html="barre.k.l"></span><span class="v" id="vl"></span><span class="f" data-i18n="barre.f.l"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="barre.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/equation-de-la-chaleur.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/lecons/chaleur.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Chaleur.SYSTEMES.barre;

/* ---------- la vitre : la loi de la plaque appliquée sans réfléchir ---------- */
(() => {
  const k = Chaleur.MATERIAUX.verre.kappa, J = Chaleur.plaque(k, 1, 0.004, 273.15, 293.15);
  $("vitre").innerHTML = t("s1.vitre", { k: F.num(k, 2), J: F.si(J, "W", { sig: 2 }) });
})();

/* ---------- la barre : profil T(x, t), flux aux bouts ---------- */
(() => {
  const svg = $("profil"), mat = $("mat"), ts = $("tsl"), fixe = $("fixe"), isole = $("isole");
  let bout = "fixe";
  const path = Plot.path;
  function draw() {
    const m = Chaleur.MATERIAUX[mat.value], L = S.L, tmax = L * L / m.a, s = +ts.value / 100, t1 = s * s * tmax;
    const b = Chaleur.barre({ L, a: m.a, kappa: m.kappa, T0: S.Tf, g: S.Tc, d: bout === "fixe" ? S.Tf : null, t: t1 });
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 }, x: { domain: [0, L], label: t("barre.xaxis") }, y: { domain: [280, 380], label: t("barre.yaxis") } });
    const ref = bout === "fixe" ? [[0, S.Tc], [L, S.Tf]] : [[0, S.Tc], [L, S.Tc]];
    Plot.el("path", { d: path(ref.map(([x, T]) => [o.x(x), o.y(T)])), class: "ref" }, o.g);
    Plot.el("path", { d: path(b.x.map((x, i) => [o.x(x), o.y(b.T[i])])), class: "curve" }, o.g);
    $("tread").textContent = F.qty(F.num(t1, 2), "s");
    $("vhg").textContent = F.si(b.hG, "W·m⁻²", { sig: 2 });
    $("vhd").textContent = bout === "fixe" ? F.si(b.hD, "W·m⁻²", { sig: 2 }) : "0";
    $("vperm").textContent = bout === "fixe" ? F.si(m.kappa * (S.Tc - S.Tf) / L, "W·m⁻²", { sig: 2 }) : "0";
    $("vl").textContent = F.si(Math.sqrt(m.a * t1), "m", { sig: 2 });
    const n = Chaleur.negligeables(mat.value);
    $("sys").innerHTML = t("sys.body", { L: F.num(L * 100, 2), D: F.num(S.D * 100, 2), Tc: F.kelvin(S.Tc), Tf: F.kelvin(S.Tf), h: F.num(S.hLat, 1), fuite: F.num(n.fuite, 2), mat: t("barre.opt." + mat.value), tau: F.qty(F.num(Chaleur.tau(L, m.a), 2), "s"), avis: t(n.fuite < 0.1 ? "sys.ok" : "sys.ko") });
  }
  const set = v => { bout = v; fixe.setAttribute("aria-pressed", v === "fixe"); isole.setAttribute("aria-pressed", v === "isole"); draw(); };
  fixe.onclick = () => set("fixe"); isole.onclick = () => set("isole");
  [mat, ts].forEach(e => { e.oninput = draw; e.onchange = draw; }); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["biot", 1804, "idea"], ["fourier", 1807, "idea"], ["prix", 1811, "idea"], ["theorie", 1822, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["batiment", "dissipateur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signe", "a"], ["isothermes", "b"], ["vitre", "c"], ["diffusion", "d"], ["temps", "a"], ["permanent", "b"], ["isole", "c"], ["bois", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 206 });
})();
</script>
</body>
</html>
