<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, PS = 1e-12;
/* the measured inversion lines (J, K), rest frequencies in Hz */
const RAIES = { "11": 23694.495e6, "22": 23722.633e6, "33": 23870.129e6 };

/* ---------- the probabilities of nitrogen up and down, from a chosen start ---------- */
(() => {
  const svg = $("fig"), mol = $("mol"), st = $("st"), segD = $("depart"), segR = $("raie"), N = 300;
  let depart = "1", raie = "33";
  function draw() {
    const A = Q.aDepuisFrequence(RAIES[raie]), T = Q.periodeAmmoniac(A), DUREE = 2 * T, t0 = +st.value * DUREE, r = Q.ammoniac(0, A, t0, depart);
    svg.innerHTML = ""; mol.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 480, h: 300, x: { domain: [0, DUREE / PS], label: t("fig.x"), fmt: v => F.num(v, 0) },
      y: { domain: [0, 1], label: t("fig.y"), fmt: v => F.num(v, 1) } });
    for (const [k, cls, sty] of [["P1", "c-tint", "stroke bold"], ["P2", "c-warn", "stroke dash"]]) {
      const pts = Array.from({ length: N + 1 }, (_, i) => [x(DUREE * i / N / PS), y(Q.ammoniac(0, A, DUREE * i / N, depart)[k])]);
      Plot.el("path", { d: Plot.path(pts), class: sty }, Plot.el("g", { class: cls }, g));
    }
    Plot.el("line", { x1: x(t0 / PS), x2: x(t0 / PS), y1: y(0), y2: y(1), class: "stroke thin dash" }, Plot.el("g", { class: "c-label-2" }, g));
    /* the molecule: the plane of the hydrogens, and the nitrogen above (state 1) and below (state 2), drawn as dark as it is probable */
    const gm = Plot.el("g", { class: "c-label-2" }, mol);
    Plot.el("line", { x1: 15, x2: 145, y1: 150, y2: 150, class: "stroke thin dash" }, gm);
    for (const hx of [35, 80, 125]) Plot.el("circle", { cx: hx, cy: 150, r: 9, class: "stroke thin", fill: "none" }, gm);
    Plot.el("circle", { cx: 80, cy: 70, r: 18, class: "fill c-tint", "fill-opacity": Math.max(0.04, r.P1).toFixed(3) }, mol);
    Plot.el("circle", { cx: 80, cy: 230, r: 18, class: "fill c-warn", "fill-opacity": Math.max(0.04, r.P2).toFixed(3) }, mol);
    const lab = (yy, s) => { const e = Plot.el("text", { x: 80, y: yy, "text-anchor": "middle" }, mol); e.textContent = s; };
    lab(36, t("fig.n1")); lab(282, t("fig.n2"));
    $("str").textContent = F.si(t0, "s", { prefix: "p" });
    $("vp2").textContent = F.num(r.P2, 3);
    $("fp2").textContent = t(depart === "1" ? "fig.f.p2" : "fig.f.stat", { p1: F.num(r.P1, 3) });
    $("vT").textContent = F.si(T, "s", { prefix: "p" });
    $("fT").textContent = t("fig.f.T", { A: F.si(A / K.e, "eV", { prefix: "µ" }), nu: F.num(RAIES[raie] / 1e9, 3) });
    segD.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.d === depart)));
    segR.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.r === raie)));
  }
  segD.querySelectorAll("button").forEach(b => b.onclick = () => { depart = b.dataset.d; draw(); });
  segR.querySelectorAll("button").forEach(b => b.onclick = () => { raie = b.dataset.r; draw(); });
  st.oninput = draw; draw();
})();

/* ---------- the system described: the barrier, the doublet, the temperature ---------- */
(() => {
  const A = Q.aDepuisFrequence(RAIES["33"]), barriere = 24.7e3 / K.N_A;
  $("sys").innerHTML = t("sys.body", { b: F.si(barriere / K.e, "eV", { prefix: "m" }), deuxA: F.si(2 * A / K.e, "eV", { prefix: "µ" }), r: F.num(barriere / (2 * A), 0),
    l: F.si(K.c / RAIES["33"], "m", { prefix: "m" }), kT: F.si(K.k_B * 300 / K.e, "eV", { prefix: "m" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dennison", 1932, "idea"], ["cleeton", 1934, "experiment"], ["townes", 1953, "experiment"], ["espace", 1968, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["thermometre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "a"], ["signe", "c"], ["stationnaire", "b"], ["echange", "d"], ["periode", "a"], ["symetrie", "b"], ["miroir", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 886 });
})();
</script>
