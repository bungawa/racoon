<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes, B = 3e-10, M = 15;

/* ---------- the trapped state ---------- */
(() => {
  const svg = $("fig"), sf = $("sf");
  function draw() {
    let Fe = +sf.value; if (Math.abs(Fe) < 0.05) Fe = Fe < 0 ? -0.05 : 0.05;
    const o = { E0: 0, A: K.e, F: Fe * K.e, b: B }, l = Q.etatLie(o);
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [-M, M], label: t("fig.xaxis") }, y: { domain: [-1, 1], label: t("fig.yaxis"), ticks: 4 } });
    const g = Plot.el("g", { class: "c-label" }, G.g);
    for (let n = -M; n <= M; n++) { const x = G.x(n); Plot.el("line", { x1: x, x2: x, y1: G.y(0), y2: G.y(Q.amplitudeLiee(n, o)), class: "stroke bold" }, g); }
    const a0 = Q.amplitudeLiee(0, o);
    for (const s of [1, -1]) {
      const env = [];
      for (let i = 0; i <= 300; i++) { const x = -M + 2 * M * i / 300; env.push([G.x(x), G.y(s * a0 * Math.exp(-l.kappa * B * Math.abs(x)))]); }
      Plot.el("path", { d: Plot.path(env), class: "stroke thin dash c-tint" }, G.g);
    }
    $("sfr").textContent = F.si(Fe, "eV");
    $("ve").textContent = F.si(l.E / K.e, "eV");
    $("fe").textContent = t(Fe < 0 ? "fig.f.e.sous" : "fig.f.e.sur", { d: F.si((Math.abs(l.E) - 2 * K.e) / K.e, "eV") });
    $("vl").textContent = t("fig.v.l", { n: F.num(1 / (l.kappa * B), 3) });
    $("fl").textContent = t("fig.f.l", { d: F.si(1 / l.kappa, "m") });
    $("vp").textContent = F.num(a0 * a0, 3);
    $("fp").textContent = t("fig.f.p");
  }
  sf.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const o = { E0: 0, A: K.e, F: -0.1 * K.e, b: B }, l = Q.etatLie(o), dE = (2 * K.e - Math.abs(l.E));
  $("sys1").innerHTML = t("sys1.body", { d: F.si(-dE / K.e, "eV"), n: F.num(1 / (l.kappa * B), 2), kT: F.si(K.k_B * 300 / K.e, "eV"), T: F.kelvin(300) });
  const o2 = { E0: 0, A: K.e, F: -3 * K.e, b: B }, l2 = Q.etatLie(o2);
  $("sys2").innerHTML = t("sys2.body", { d: F.si((Math.abs(l2.E) - 2 * K.e) / K.e, "eV"), p: F.num(Q.amplitudeLiee(0, o2) ** 2, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mollwo", 1933, "experiment"], ["pohl", 1937, "idea"], ["mott", 1940, "idea"], ["rpe", 1957, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["laser"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["imaginaire", "c"], ["toujours", "a"], ["profond", "b"], ["tunnel", "d"], ["bosse", "b"], ["thermique", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1307 });
})();
</script>
