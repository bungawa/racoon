<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux;
const dB = x => 20 * Math.log10(x);

/* ---------- facteur de propagation : |α|, |α|ᴺ, et l'échelle finie fermée sur √(L/C) ---------- */
(() => {
  const L = 1e-3, C = 1e-6, sn = $("sn"), sw = $("sw"), seg = $("type"), svg = $("alpha");
  let type = "bas";
  const w0 = () => OM.echelleLC(L, C, 1, type).w0;
  function draw() {
    const N = +sn.value, x = +sw.value, W0 = w0();
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === type)));
    $("snv").textContent = F.num(N, 3); $("swv").textContent = F.num(x, 3);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, 3], label: t("fig.xaxis") }, y: { domain: [0, 1.5], ticks: 5, label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(1), x2: P.x(1), y1: P.y(0), y2: P.y(1.5), class: "stroke thin dash c-label-2" }, P.g);
    const xs = Array.from({ length: 600 }, (_, i) => 0.005 + i * 2.995 / 599);
    const e = xs.map(v => OM.echelleLC(L, C, v * W0, type));
    const fini = xs.map((v, i) => Cx.abs(OM.tensions(e[i].z1, e[i].z2, N, e[i].Rc, 1).V[N]));
    Plot.el("path", { d: Plot.path(xs.map((v, i) => [P.x(v), P.y(e[i].module)])), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((v, i) => [P.x(v), P.y(e[i].module ** N)])), class: "stroke bold c-tint" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((v, i) => [P.x(v), P.y(Math.min(1.5, fini[i]))])), class: "stroke c-warn" }, P.g);
    Plot.el("line", { x1: P.x(x), x2: P.x(x), y1: P.y(0), y2: P.y(1.5), class: "stroke thin c-label" }, P.g);
    const a = OM.echelleLC(L, C, x * W0, type), vf = Cx.abs(OM.tensions(a.z1, a.z2, N, a.Rc, 1).V[N]);
    $("va").textContent = F.num(a.module, 3);
    $("fa").textContent = t("fig.f.alpha", { d: F.qty(F.num(a.dephasage * 180 / Math.PI, 3), "°") });
    $("vn").textContent = t("fig.db", { g: F.num(dB(a.module ** N), 3) });
    $("fn").textContent = t("fig.f.n", { n: F.num(N, 3) });
    $("vf").textContent = t("fig.db", { g: F.num(dB(vf), 3) });
    $("ff").textContent = t("fig.f.fini", { f0: F.si(W0 / (2 * Math.PI), "Hz") });
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { type = b.dataset.t; draw(); });
  sn.oninput = sw.oninput = draw; draw();
})();

/* ---------- lisser une tension redressée ---------- */
(() => {
  const base = { U0: 12, f: 50, L: 0.1, C: 1e-3, R: 10 }, sk = $("sk"), svg = $("lisse");
  function draw() {
    const N = +sk.value, s = OM.lissage(Object.assign({ N }, base));
    $("skv").textContent = F.num(N, 3);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 44 }, x: { domain: [0, 40], label: t("fig2.xaxis") }, y: { domain: [0, 14], ticks: 7, label: t("fig2.yaxis") } });
    const ts = Array.from({ length: 801 }, (_, i) => 0.04 * i / 800);
    Plot.el("path", { d: Plot.path(ts.map(x => [P.x(1000 * x), P.y(s.entree(x))])), class: "stroke thin c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(ts.map(x => [P.x(1000 * x), P.y(Math.max(0, Math.min(14, s.sortie(x))))])), class: "stroke bold c-tint" }, P.g);
    $("vdc").textContent = F.si(s.continu, "V");
    $("fdc").textContent = t("fig2.f.dc");
    $("vond").textContent = F.si(s.ondulation, "V");
    $("fond").textContent = t("fig2.f.ond", { r: F.num(100 * s.ondulation / s.continu, 2) });
    $("vh1").textContent = F.num(s.H[0].module, 2);
    $("fh1").textContent = N ? t("fig2.f.h1", { f0: F.si(s.f0, "Hz") }) : t("fig2.f.h0");
  }
  sk.oninput = draw; draw();
})();

/* ---------- le système décrit : un câble coaxial à air, découpé en cellules ---------- */
(() => {
  const ln = Math.log(2.3), mu0 = 1 / (Constantes.eps0 * Constantes.c ** 2), eps0 = Constantes.eps0;
  const L0 = mu0 / (2 * Math.PI) * ln, C0 = 2 * Math.PI * eps0 / ln, dl = 0.01, w0 = 2 / Math.sqrt(L0 * dl * C0 * dl);
  $("sys1").innerHTML = t("sys1.body", { L0: F.si(L0, "H/m"), C0: F.si(C0, "F/m"), z0: F.qty(F.num(Math.sqrt(L0 / C0), 3), "Ω"),
    v: F.sci(1 / Math.sqrt(L0 * C0), 4), c: F.sci(Constantes.c, 4), f0: F.si(w0 / (2 * Math.PI), "Hz") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["campbell", 1915, "idea"], ["zobel", 1923, "idea"], ["butterworth", 1930, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["alim", "bande"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["module", "c"], ["signe", "a"], ["n754", "d"], ["haut", "b"], ["lisse", "a"], ["fermer", "c"], ["bande", "d"], ["ligne", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 227 });
})();
</script>
