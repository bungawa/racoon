<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9, V = x => F.si(x, "V");

/* ---------- quatre chemins de a à b dans le champ de deux charges (positions en m) ---------- */
(() => {
  const svg = $("chem"), O = { W: 640, H: 400, x0: -0.08, x1: 0.08, y0: -0.05, y1: 0.05 }, N = 20000;
  const Q = [{ q: 2 * NC, x: -0.03, y: 0 }, { q: -1 * NC, x: 0.035, y: 0.012 }], A = [-0.065, 0.03];
  const phi = p => ES.potentiel(Q, p), C = ES.CHEMINS;
  let b = [0.06, -0.03], choix = "droit", c;
  const chemin = () => ({
    droit: C.droit(A, b),
    arc: C.arcRayon(A, b, [Q[0].x, Q[0].y]),
    detour: C.detour(A, b, [0, -0.11]),
    boucle: C.boucle(C.droit(A, b), C.detour(A, b, [0.01, 0.1])),
  })[choix];
  function draw() {
    const ch = chemin(), pts = Array.from({ length: 401 }, (_, i) => ch(i / 400));
    c = CarteChamp.carte(svg, O);
    CarteChamp.fond(c, phi, 64, 40, { cls: "c-warn", lo: -300, hi: 900 });
    CarteChamp.niveaux(c, phi, [-200, -100, -50, 0, 50, 100, 200, 400, 800]);
    Plot.el("polyline", { points: pts.map(p => c.sx(p[0]).toFixed(1) + "," + c.sy(p[1]).toFixed(1)).join(" "), class: "stroke bold" }, c.layer("c-tint"));
    Q.forEach(s => CarteChamp.point(c, [s.x, s.y], 6, s.q > 0 ? "c-warn" : "c-label", s.q > 0 ? "+" : "−", -12));
    CarteChamp.point(c, A, 4, "c-ok", "a"); CarteChamp.point(c, choix === "boucle" ? A : b, 4, "c-ok", choix === "boucle" ? "" : "b");
    const W = ES.travail(Q, ch, N), d = choix === "boucle" ? 0 : phi(b) - phi(A);
    let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    $("vtravail").textContent = V(W);
    $("vdiff").textContent = V(d);
    $("fdiff").textContent = t(choix === "boucle" ? "ch.f.boucle" : "ch.f.diff", { e: F.sci(Math.abs(W - d), 1) });
    $("vlong").textContent = F.si(len, "m");
    $("chread").innerHTML = t("ch.read." + choix);
  }
  document.querySelectorAll("[data-c]").forEach(x => x.onclick = () => { choix = x.dataset.c;
    document.querySelectorAll("[data-c]").forEach(o => o.setAttribute("aria-pressed", String(o === x))); draw(); });
  CarteChamp.survol(svg, () => c, p => { if (Q.every(s => Math.hypot(p[0] - s.x, p[1] - s.y) > 0.006) && Math.hypot(p[0] - A[0], p[1] - A[1]) > 0.005) { b = [Math.max(O.x0, Math.min(O.x1, p[0])), Math.max(O.y0, Math.min(O.y1, p[1]))]; draw(); } });
  draw();
})();

/* ---------- ordres de grandeur ---------- */
(() => {
  const Cst = Constantes, h = ES.potentiel([{ q: Cst.e, x: 0, y: 0 }], [Cst.a0, 0]), s = ES.potentiel([{ q: NC, x: 0, y: 0 }], [0.1, 0]);
  const lam = 1e-8, dec = 2 * ES.K * lam * Math.log(10);
  $("ordres").innerHTML = t("ordres.body", { h: V(h), s: V(s), dec: V(dec) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lagrange", 1773, "idea"], ["volta", 1800, "experiment"], ["green", 1828, "idea"], ["gauss", 1840, "idea"], ["congres", 1881, "use"], ["einthoven", 1903, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cardio", "ev"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["chemin", "b"], ["arc", "a"], ["reference", "d"], ["hydrogene", "c"], ["milieu", "a"], ["fil", "b"], ["scalaire", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 43 });
})();
</script>
