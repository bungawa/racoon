<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physique et chimie</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-panorama" data-i18n="monde.panorama"></a><span class="aux">›</span><a href="/racoon/etape?id=physique-et-sciences" data-i18n="etape.physique-et-sciences"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/reactions-chimiques" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="box prop"><b data-i18n="s1.prop.title"></b>
      <p data-i18n-html="s1.prop.body"></p>
    </div>
    <figure class="chart">
      <svg id="table" class="fig" role="img" data-i18n-attr="aria-label:pt.aria"></svg>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="zsl" data-i18n="pt.z"></label><output id="zread" for="zsl"></output></div>
          <input id="zsl" type="range" min="1" max="36" step="1" value="11"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="pt.k.el"></span><span class="v" id="vel"></span></div>
          <div class="stat"><span class="k" data-i18n="pt.k.place"></span><span class="v" id="vplace"></span><span class="f" id="fblock"></span></div>
          <div class="stat"><span class="k" data-i18n="pt.k.outer"></span><span class="v" id="vouter"></span></div>
        </div>
        <p id="config"></p>
      </div>
      <figcaption data-i18n-html="pt.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="s1.rem.title"></b>
      <p data-i18n-html="s1.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n="s2.p1"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq">
      <math display="block"><mi>k</mi><mo>=</mo><mi>A</mi><mspace width="0.2em"></mspace><msup><mi mathvariant="normal">e</mi><mrow><mo>−</mo><msub><mi>E</mi><mi mathvariant="normal">a</mi></msub><mo>/</mo><mo>(</mo><mi>R</mi><mi>T</mi><mo>)</mo></mrow></msup></math>
    </div>
    <p class="validite" data-i18n="eq1.validite"></p>
    <p data-i18n-html="s2.p3"></p>
    <figure class="chart">
      <svg id="arr" role="img" data-i18n-attr="aria-label:arr.aria"></svg>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="esl" data-i18n="arr.ea"></label><output id="eread" for="esl"></output></div>
            <input id="esl" type="range" min="10" max="150" step="1" value="53"></div>
          <div class="ctl"><div class="row"><label for="tsl" data-i18n="arr.t"></label><output id="tread" for="tsl"></output></div>
            <input id="tsl" type="range" min="250" max="400" step="1" value="310"></div>
        </div>
        <div class="controls">
          <div class="seg" role="group" data-i18n-attr="aria-label:arr.presets"><button type="button" id="frigo" aria-pressed="false" data-i18n="arr.frigo"></button><button type="button" id="corps" aria-pressed="true" data-i18n="arr.corps"></button><button type="button" id="etuve" aria-pressed="false" data-i18n="arr.etuve"></button></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="arr.k.ratio"></span><span class="v" id="vratio"></span></div>
          <div class="stat"><span class="k" data-i18n="arr.k.dix"></span><span class="v" id="vdix"></span></div>
          <div class="stat"><span class="k" data-i18n="arr.k.boltz"></span><span class="v" id="vboltz"></span><span class="f" data-i18n="arr.k.boltz.f"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="arr.caption"></figcaption>
    </figure>
    <div class="box warn"><b data-i18n="s2.warn.title"></b>
      <p data-i18n-html="s2.warn.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n="s3.p1"></p>
    <p data-i18n="s3.p2"></p>
    <h3 data-i18n="s3.h3"></h3>
    <div class="list keyed" id="notions"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/physique-et-chimie.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/physique-sciences.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const $ = id => document.getElementById(id);
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));

/* ---------- §3-2 : le tableau périodique sort des configurations ---------- */
(() => {
  const SYM = t("pt.symbols"), NAME = t("pt.names"), BLOCK = textOf("pt.blocks", ["s", "p", "d"]);
  if (SYM.length !== Sciences.ZMAX || NAME.length !== Sciences.ZMAX) throw new Error("pt: " + Sciences.ZMAX + " symboles et noms attendus");
  const svg = $("table"), C = 34, W = 18 * C + 8, H = 4 * C + 8;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  const cells = [], zsl = $("zsl");
  for (let Z = 1; Z <= Sciences.ZMAX; Z++) {
    const p = Sciences.place(Z), x0 = 4 + (p.column - 1) * C, y0 = 4 + (p.period - 1) * C;
    const r = Plot.el("rect", { x: x0 + 1, y: y0 + 1, width: C - 2, height: C - 2, rx: 5, class: "area" }, svg);
    const tx = Plot.el("text", { x: x0 + C / 2, y: y0 + C / 2 + 4, "text-anchor": "middle" }, svg); tx.textContent = SYM[Z - 1];
    r.addEventListener("click", () => { zsl.value = Z; upd(); }); tx.addEventListener("click", () => { zsl.value = Z; upd(); });
    cells.push(r);
  }
  const conf = c => c.filter(s => s.e).map(s => Sciences.label(s) + F.sup(s.e)).join(" ");
  function upd() {
    const Z = +zsl.value, p = Sciences.place(Z);
    cells.forEach((r, i) => r.setAttribute("class", i === Z - 1 ? "dot" : "area"));
    $("zread").textContent = String(Z);
    $("vel").textContent = t("pt.el", { name: NAME[Z - 1], sym: SYM[Z - 1] });
    $("vplace").textContent = t("pt.place", { p: p.period, c: p.column });
    $("fblock").textContent = BLOCK[p.block];
    $("vouter").textContent = String(p.outer);
    $("config").textContent = t("pt.config", { c: conf(p.config) }) + (Z === 24 || Z === 29 ? " " + t("pt.exception") : "");
  }
  zsl.oninput = upd; upd();
})();

/* ---------- §3-2 : Arrhenius ---------- */
(() => {
  const T0 = 298;
  const { x, y, g } = Plot.axes($("arr"), { fmt: F, w: 640, h: 300,
    x: { domain: [250, 400], label: t("arr.x") }, y: { scale: "log", domain: [1e-6, 1e6], label: t("arr.y") } });
  Plot.el("line", { x1: x(250), x2: x(400), y1: y(1), y2: y(1), class: "zero" }, g);
  const curve = Plot.el("path", { class: "curve" }, g), dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  const esl = $("esl"), tsl = $("tsl");
  const clip = v => Math.min(1e6, Math.max(1e-6, v));
  const PRESET = { frigo: 277, corps: 310, etuve: 333 };
  function upd() {
    const Ea = esl.value * 1e3, T = +tsl.value;
    let d = ""; for (let K = 250; K <= 400; K += 2) d += (d ? "L" : "M") + x(K).toFixed(1) + " " + y(clip(Sciences.arrhenius(Ea, T0, K))).toFixed(1);
    curve.setAttribute("d", d);
    dot.setAttribute("cx", x(T)); dot.setAttribute("cy", y(clip(Sciences.arrhenius(Ea, T0, T))));
    $("eread").textContent = F.qty(F.num(+esl.value, 3), t("unit.kjmol"));
    $("tread").innerHTML = F.kelvin(T);
    const r = Sciences.arrhenius(Ea, T0, T);
    $("vratio").textContent = r >= 0.01 && r < 1000 ? F.num(r, 2) : F.sci(r, 2);
    $("vdix").textContent = F.num(Sciences.arrhenius(Ea, T, T + 10), 3);
    $("vboltz").textContent = F.sci(Sciences.boltzmann(Ea, T), 2);
    Object.keys(PRESET).forEach(id => $(id).setAttribute("aria-pressed", String(PRESET[id] === T)));
  }
  Object.keys(PRESET).forEach(id => $(id).onclick = () => { tsl.value = PRESET[id]; upd(); });
  esl.oninput = tsl.oninput = upd; upd();
})();

/* ---------- §3-2 : vers les notions de chimie du cours ---------- */
(() => {
  const IDS = ["chim_structure", "chim_orbitales", "chim_cinetique", "chim_orga_base"], txt = textOf("s3.notions", IDS);
  $("notions").innerHTML = IDS.map(id => `<div><a class="k" href="/racoon/atlas?notion=${id}">${txt[id].name}</a><span>${txt[id].text}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mendeleiev", 1869, "idea"], ["gallium", 1875, "experiment"], ["vanthoff", 1884, "idea"], ["arrhenius", 1889, "idea"],
    ["pauli", 1925, "idea"], ["heitler", 1927, "idea"], ["madelung", 1936, "idea"], ["kohn", 1998, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["numerique", "vieillissement"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["colonne", "b"], ["potassium", "a"], ["dix", "c"], ["frigo", "d"], ["q10", "a"], ["statistique", "b"], ["uree", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 5 });
})();
</script>
</body>
</html>
