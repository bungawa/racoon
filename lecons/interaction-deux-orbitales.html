    <div class="eq"><math display="block"><mi>φ</mi><mo>=</mo><msub><mi>c</mi><mn>1</mn></msub><msub><mi>χ</mi><mn>1</mn></msub><mo>+</mo><msub><mi>c</mi><mn>2</mn></msub><msub><mi>χ</mi><mn>2</mn></msub></math></div>

    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><msub><mi>E</mi><mo>±</mo></msub><mo>=</mo><mfrac><mrow><mi>α</mi><mo>±</mo><mi>β</mi></mrow><mrow><mn>1</mn><mo>±</mo><mi>S</mi></mrow></mfrac><mo>,</mo><mspace width="1em"/><msub><mi>φ</mi><mo>±</mo></msub><mo>=</mo><mfrac><mrow><msub><mi>χ</mi><mn>1</mn></msub><mo>±</mo><msub><mi>χ</mi><mn>2</mn></msub></mrow><msqrt><mrow><mn>2</mn><mo>(</mo><mn>1</mn><mo>±</mo><mi>S</mi><mo>)</mo></mrow></msqrt></mfrac></math></div>
    <p class="validite" data-i18n-html="val.identiques"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><mi>Δ</mi><mi>E</mi><mo>≈</mo><mfrac><msup><mrow><mo>(</mo><mi>β</mi><mo>−</mo><mi>α</mi><mi>S</mi><mo>)</mo></mrow><mn>2</mn></msup><mrow><mo>|</mo><msub><mi>α</mi><mn>1</mn></msub><mo>−</mo><msub><mi>α</mi><mn>2</mn></msub><mo>|</mo></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.differentes"></p>
    <p data-i18n-html="s2.p3"></p>
    <div class="eq"><math display="block"><mi>β</mi><mo>≈</mo><mi>K</mi><mspace width="0.15em"/><mi>S</mi><mspace width="0.15em"/><mfrac><mrow><msub><mi>α</mi><mn>1</mn></msub><mo>+</mo><msub><mi>α</mi><mn>2</mn></msub></mrow><mn>2</mn></mfrac><mo>,</mo><mspace width="1em"/><mi>K</mi><mo>=</mo><mn>1,75</mn></math></div>
    <p class="validite" data-i18n-html="val.wh"></p>
    <figure class="chart">
      <svg class="fig" id="dia" viewBox="0 0 640 360" role="img" data-i18n-attr="aria-label:dia.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="dia.legend.plus"></span><span class="el-o" data-i18n="dia.legend.moins"></span></div>
      <div class="panel">
        <div class="seg" role="group" id="presets">
          <button type="button" data-p="h2" data-i18n="dia.p.h2"></button>
          <button type="button" data-p="hf" data-i18n="dia.p.hf"></button>
          <button type="button" data-p="co" data-i18n="dia.p.co"></button>
          <button type="button" data-p="orth" data-i18n="dia.p.orth"></button>
        </div>
        <div class="controls">
          <div class="ctl"><div class="row"><label for="a1" data-i18n-html="dia.a1"></label><output id="a1r" for="a1"></output></div>
            <input id="a1" type="range" min="-25" max="-5" step="0.1" value="-13.6"></div>
          <div class="ctl"><div class="row"><label for="a2" data-i18n-html="dia.a2"></label><output id="a2r" for="a2"></output></div>
            <input id="a2" type="range" min="-25" max="-5" step="0.1" value="-18.7"></div>
          <div class="ctl"><div class="row"><label for="ss" data-i18n-html="dia.s"></label><output id="ssr" for="ss"></output></div>
            <input id="ss" type="range" min="0" max="0.4" step="0.01" value="0.25"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="dia.k.beta"></span><span class="v" id="vb"></span></div>
          <div class="stat"><span class="k" data-i18n="dia.k.stab"></span><span class="v" id="vs"></span><span class="f" id="fs"></span></div>
          <div class="stat"><span class="k" data-i18n="dia.k.destab"></span><span class="v" id="vd"></span></div>
          <div class="stat"><span class="k" data-i18n="dia.k.coef"></span><span class="v" id="vc"></span><span class="f" id="fc"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="dia.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sysb"></p>
    </div>

  <section class="card">

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/quantique-amplitudes.js"></script>
<script src="/racoon/quantique-schrodinger.js"></script>
<script src="/racoon/lecons/tableau-periodique-quantique.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>

<script src="/racoon/lecons/diagramme-orbitales-moleculaires.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), CA = ChimArchi;

/* ---------- diagramme d'interaction de deux orbitales ---------- */
(() => {
  const PRESETS = { h2: [-13.6, -13.6, 0.25, true], hf: [CA.ORBITALES_EV.H["1s"], CA.ORBITALES_EV.F["2p"], 0.25, true],
    co: [CA.ORBITALES_EV.C["2p"], CA.ORBITALES_EV.O["2p"], 0.2, true], orth: [-13.6, -18.7, 0.25, false] };
  const svg = $("dia"), a1 = $("a1"), a2 = $("a2"), ss = $("ss"), seg = $("presets");
  let sym = true, cur = "hf";
  function draw() {
    const A1 = +a1.value, A2 = +a2.value, S = sym ? +ss.value : 0, b = sym ? CA.wolfsbergHelmholz(A1, A2, S) : 0;
    const r = CA.interactionDeux(A1, A2, b, S);
    svg.innerHTML = "";
    DiagOrb.rendre(DiagOrb.deuxNiveaux({ a1: A1, a2: A2, r, E: [-36, 0], fmt: e => F.si(e, "eV", { sig: 3 }),
      noms: [t("dia.chi1"), t("dia.chi2"), t("dia.liante"), t("dia.antiliante")] }), Plot.el, svg);
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.p === cur)));
    $("a1r").textContent = F.si(A1, "eV"); $("a2r").textContent = F.si(A2, "eV");
    $("ssr").textContent = sym ? F.fix(S, 2) : t("dia.s0");
    $("vb").textContent = F.si(b, "eV", { sig: 3 });
    $("vs").textContent = F.si(r.stabilisation, "eV", { sig: 3 });
    const D = Math.abs(A1 - A2);
    $("fs").textContent = D > 0.5 && b !== 0 ? t("dia.f.pert", { e: F.si(Math.min(A1, A2) - CA.interactionPerturbative(A1, A2, b, S).liante, "eV", { sig: 3 }) }) : "";
    $("vd").textContent = F.si(r.destabilisation, "eV", { sig: 3 });
    $("vc").textContent = t("dia.v.coef", { c1: F.fix(r.liante.c[0], 2), c2: F.fix(r.liante.c[1], 2) });
    $("fc").textContent = t("dia.f.coef", { c1: F.fix(r.antiliante.c[0], 2), c2: F.fix(r.antiliante.c[1], 2) });
  }
  const set = p => { const [x1, x2, s, y] = PRESETS[p]; cur = p; a1.value = x1; a2.value = x2; ss.value = s; sym = y; draw(); };
  seg.querySelectorAll("button").forEach(x => x.onclick = () => set(x.dataset.p));
  a1.oninput = a2.oninput = ss.oninput = () => { cur = ""; if (!sym) sym = true; draw(); };
  set("hf");

  /* the system described: H₂ by the extended Hückel model, S of two 1s orbitals 1,40 a₀ apart */
  const R = 1.4, S = Math.exp(-R) * (1 + R + R * R / 3), a = CA.ORBITALES_EV.H["1s"], h = CA.interactionDeux(a, a, CA.wolfsbergHelmholz(a, a, S), S);
  $("sysb").innerHTML = t("sys.body", { s: F.fix(S, 2), st: F.si(h.stabilisation, "eV", { sig: 2 }), de: F.si(h.destabilisation, "eV", { sig: 2 }),
    deux: F.si(2 * h.stabilisation, "eV", { sig: 2 }), r: F.fix((1 + 0.25) / (1 - 0.25), 2) });
})();

/* ---------- orbitales de fragments : l'eau ---------- */
(() => {
  const ROWS = ["s1", "s2", "pz", "py", "px"], txt = textOf("frag.rows", ROWS);
  $("frag").innerHTML = ROWS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["heitler", 1927, "idea"], ["lennardjones", 1929, "idea"], ["wolfsberg", 1952, "idea"], ["hoffmann", 1963, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["qualitatif", "complexes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["nombre", "c"], ["destab", "a"], ["coef", "d"], ["ecart", "b"], ["orth", "c"], ["he2", "a"], ["fragment", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2102 });
})();
</script>
