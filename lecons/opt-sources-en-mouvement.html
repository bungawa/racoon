<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- une charge qui oscille sur une droite inclinée : position vraie, position vue, champ ---------- */
(() => {
  const sb = $("sb"), sa = $("sa"), svgP = $("pos"), svgE = $("champ"), N = 721, TAU = 2 * Math.PI;
  function draw() {
    const b0 = +sb.value, al = +sa.value * Math.PI / 180, o = OptOnd.oscillationOblique(b0, al);
    const pts = Array.from({ length: N }, (_, i) => o.point(-0.5 * TAU + 3 * TAU * i / (N - 1)));
    const inWin = p => p.t >= 0 && p.t <= 2 * TAU;
    /* positions, in units of the amplitude a; time in periods T0 */
    svgP.innerHTML = "";
    const P = Plot.axes(svgP, { fmt: F, w: 640, h: 190, pad: { l: 56, b: 40 }, x: { domain: [0, 2], label: t("fig.taxis") }, y: { domain: [-1.1, 1.1], label: t("fig.ypos") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(2), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const vraie = Array.from({ length: 401 }, (_, i) => 2 * TAU * i / 400);
    Plot.el("path", { d: Plot.path(vraie.map(s => [P.x(s / TAU), P.y(Math.sin(al) * Math.sin(s))])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(pts.filter(inWin).map(p => [P.x(p.t / TAU), P.y(p.x)])), class: "curve" }, P.g);
    /* field, in units of a ω0² sin α when α > 0 (the amplitude (28.6) gives), else of a ω0² */
    svgE.innerHTML = "";
    const u = Math.sin(al) > 1e-9 ? Math.sin(al) : 1, top = 1.1 * Math.max(1, o.pic / u);
    const Q = Plot.axes(svgE, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 40 }, x: { domain: [0, 2], label: t("fig.taxis") }, y: { domain: [-top, top], label: t("fig.ychamp") } });
    Plot.el("line", { x1: Q.x(0), x2: Q.x(2), y1: Q.y(0), y2: Q.y(0), class: "zero" }, Q.g);
    Plot.el("path", { d: Plot.path(vraie.map(s => [Q.x(s / TAU), Q.y(-Math.sin(al) * Math.sin(s) / u)])), class: "ref" }, Q.g);
    Plot.el("path", { d: Plot.path(pts.filter(inWin).map(p => [Q.x(p.t / TAU), Q.y(-p.a / u)])), class: "curve" }, Q.g);
    $("sbr").textContent = F.num(b0, 2);
    $("sar").textContent = F.num(+sa.value, 2) + "°";
    $("vcomp").textContent = F.num(o.compressionMax, 3);
    $("fcomp").textContent = t("fig.f.comp", { b: F.num(o.b, 3) });
    $("vpic").textContent = o.rapport === null ? "–" : F.num(o.rapport, 3);
    $("fpic").textContent = o.rapport === null ? t("fig.f.face") : t("fig.f.pic");
    $("vfond").textContent = o.fondamental === null ? "–" : F.qty(F.num(100 * o.fondamental, 3), "%");
    $("ffond").textContent = o.fondamental === null ? t("fig.f.face") : t("fig.f.fond", { h: F.qty(F.num(100 * (o.harmoniques[1] ** 2 / 2) / o.carreMoyen, 2), "%") });
  }
  sb.oninput = sa.oninput = draw; draw();
})();

/* ---------- le système décrit : Io vue de la Terre ---------- */
(() => {
  const C = Constantes.c, au = 149597870700, T = 1.769 * 86400, v = 2 * Math.PI * au / (365.25 * 86400);   // Io's period; Earth's mean orbital speed
  $("sys1").innerHTML = t("sys1.body", { T: F.si(T, "s"), v: F.si(v, "m·s⁻¹", { prefix: "k" }), b: F.sci(v / C, 2), dT: F.si(T * v / C, "s"), D: F.si(2 * au / C, "s"), b2: F.sci((v / C) ** 2, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["romer", 1676, "experiment"], ["lienard", 1898, "idea"], ["hulse", 1974, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pulsars"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["direction", "c"], ["transverse", "a"], ["retard", "d"], ["profil", "b"], ["face", "a"], ["compression", "c"], ["romer", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 341 });
})();
</script>
