<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, X = Cristaux, CA = ChimArchi;
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); };
const pm = x => F.qty(F.num(x * 1e12, 4), "pm"), kj = x => F.qty(F.num(x / 1e3, 4), "kJ·mol⁻¹"), pct = x => F.qty(F.fix(100 * x, 1), "%");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const S = CA.STRUCTURES_IONIQUES, zz = id => Math.abs(CA.RAYONS[S[id].cation].z * CA.RAYONS[S[id].anion].z);
const M = Object.fromEntries(Object.keys(S).map(id => [id, CA.madelung(id)]));          // sommation d'Ewald, une fois
const NOMS = { Na: "--tint", Cs: "--tint", Ca: "--tint", Zn: "--tint", Cl: "--el-o", F: "--el-o", S: "--el-o" };
const RAY = { NaCl: [0.33, 0.5], CsCl: [0.42, 0.45], CaF2: [0.4, 0.4], ZnS: [0.25, 0.5] };
let courant = "NaCl", tracer = () => {};

/* ---------- quatre structures en 3D ---------- */
(() => {
  const vue = VueCristal.monter($("vue"), $("vueinfo"), { hors: t("v3.hors"), reduit: reduce });
  seg($("structures"), "s", id => {
    courant = id;
    const s = S[id], [c, a] = [...new Set(s.motif.map(m => m.e))], d = CA.distanceIons(id);
    if (vue) vue.montrer(X.atomes(s, id === "CsCl" ? 3 : 2), { dLiaison: d, maille: s.a, rayons: { [c]: RAY[id][0], [a]: RAY[id][1] }, couleurs: NOMS });
    $("vM").textContent = F.fix(M[id], 6);
    $("vM1").textContent = String(s.coord[0]);
    $("fM1").textContent = t("v3.f.M1", { r: F.fix(M[id] / s.coord[0], 2) });
    $("vd").textContent = pm(d);
    $("fd").textContent = t("v3.f.d." + id);
    $("legende").innerHTML = `<span class="c-tint">${t("ion." + c)}</span><span class="el-o">${t("ion." + a)}</span>`;
    tracer();
  });
})();

/* ---------- Born–Landé : la courbe E(r) ---------- */
(() => {
  const svg = $("courbe"), sl = $("nsl");
  const ions = { NaCl: ["Na+", "Cl-"], CsCl: ["Cs+", "Cl-"], CaF2: ["Ca2+", "F-"], ZnS: ["Zn2+", "S2-"] };
  tracer = () => {
    const id = courant, n = +sl.value, d0 = CA.distanceIons(id), m = M[id], z = zz(id);
    const bh = CA.BH[id] ? CA.bornHaber(id).dH : null, bl = CA.bornLande(m, z, d0, n);
    const E0 = CA.KC * m * z / d0, lo = -1.25 * E0 / 1e3, hi = 0.6 * E0 / 1e3;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [0.6, 2.2], label: t("bl.x"), fmt: v => F.num(v, 2) },
      y: { domain: [lo, hi], label: t("bl.y") } });
    const rs = Array.from({ length: 200 }, (_, i) => 0.6 + i * 1.6 / 199), clip = v => Math.max(lo, Math.min(hi, v));
    const tot = rs.map(r => [x(r), y(clip(CA.energieModele(r * d0, m, z, d0, n) / 1e3))]);
    const coul = rs.map(r => [x(r), y(clip(-CA.KC * m * z / (r * d0) / 1e3))]);
    P("path", { d: Plot.path(coul), class: "stroke dash" }, P("g", { class: "c-label-2" }, g));
    P("path", { d: Plot.path(tot), class: "stroke bold" }, P("g", { class: "c-tint" }, g));
    if (bh) P("line", { x1: x(0.6), x2: x(2.2), y1: y(-bh / 1e3), y2: y(-bh / 1e3), class: "stroke dash" }, P("g", { class: "c-warn" }, g));
    P("circle", { cx: x(1), cy: y(-bl / 1e3), r: 5, class: "fill" }, P("g", { class: "c-tint" }, g));
    $("nread").textContent = F.num(n, 3);
    $("vbl").textContent = kj(bl);
    $("fbl").textContent = t("bl.f.bl", { id: t("nom." + id), r: pct(1 / n) });
    $("vbh").textContent = bh ? kj(bh) : "–";
    $("fbh").textContent = bh ? t("bl.f.bh", { e: (bl >= bh ? "+" : "") + pct(bl / bh - 1) }) : t("bl.f.sans");
    $("vnp").textContent = F.num(CA.nPauling(...ions[id]), 3);
  };
  sl.oninput = tracer; tracer();
})();

/* ---------- l'exposant tiré de la compressibilité du sel ---------- */
(() => {
  const Kv = 24.4e9, n = CA.exposantBorn("NaCl", Kv);      // module d'incompressibilité de NaCl à 298 K (fiches Korth et Crystran)
  $("ncomp").innerHTML = t("ncomp", { k: F.qty(F.num(Kv / 1e9, 3), "GPa"), n: F.num(n, 2), e: kj(CA.bornLande(M.NaCl, 1, CA.distanceIons("NaCl"), n)) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["madelung", 1918, "idea"], ["ewald", 1921, "idea"], ["pme", 1993, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["simulation", "oxydes"], u = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${u[id].name}.</strong> ${u[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["geometrie", "b"], ["voisins", "d"], ["cscl", "a"], ["repulsion", "c"], ["exposant", "b"], ["zns", "a"], ["compress", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 79 });
})();
</script>
