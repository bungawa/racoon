<!doctype html>

<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-mecanique" data-i18n="monde.mecanique"></a><span class="aux">›</span><a href="/racoon/etape?id=decrire-mouvement" data-i18n="etape.decrire-mouvement"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-meca" href="/racoon/atlas?piste=meca" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/vitesse-derivee" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="list" id="vtab" role="table" data-i18n-attr="aria-label:vtab.aria"></div>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block" data-i18n-html="s1.eq.sum"></math><span class="n">(8.6)</span></div>
    <p class="validite" data-i18n="eq1.validite"></p>
    <p data-i18n-html="s1.p3"></p>
    <div class="eq"><math display="block"><mi>x</mi><mo stretchy="false">(</mo><mi>T</mi><mo stretchy="false">)</mo><mo>−</mo><mi>x</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><munder><mo movablelimits="true" data-i18n="eq.lim"></mo><mrow><mi mathvariant="normal">Δ</mi><mi>t</mi><mo>→</mo><mn>0</mn></mrow></munder><munder><mo>∑</mo><mi>i</mi></munder><mi>v</mi><mo stretchy="false">(</mo><msub><mi>t</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mspace width="0.1em"/><mi mathvariant="normal">Δ</mi><mi>t</mi><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mi>T</mi></msubsup><mi>v</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mspace width="0.2em"/><mi mathvariant="normal">d</mi><mi>t</mi></math><span class="n">(8.7–8.8)</span></div>
    <p class="validite" data-i18n="eq2.validite"></p>
    <div class="box def"><b data-i18n="s1.def.title"></b>
      <p data-i18n-html="s1.def.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure class="chart">
      <div class="seg" role="group" data-i18n-attr="aria-label:rs.choice">
        <button type="button" data-p="chute" aria-pressed="true" data-i18n="rs.chute"></button>
        <button type="button" data-p="demarrage" aria-pressed="false" data-i18n="rs.demarrage"></button>
        <button type="button" data-p="vaetvient" aria-pressed="false" data-i18n="rs.vaetvient"></button>
      </div>
      <p class="caption" id="lawread"></p>
      <svg id="rs" role="img" data-i18n-attr="aria-label:rs.aria"></svg>
      <div class="panel">
        <div class="seg" role="group" data-i18n-attr="aria-label:rs.rule">
          <button type="button" data-r="gauche" aria-pressed="true" data-i18n="rs.gauche"></button>
          <button type="button" data-r="droite" aria-pressed="false" data-i18n="rs.droite"></button>
          <button type="button" data-r="milieu" aria-pressed="false" data-i18n="rs.milieu"></button>
          <button type="button" data-r="trapezes" aria-pressed="false" data-i18n="rs.trapezes"></button>
        </div>
        <div class="ctl"><div class="row"><label for="nsl" data-i18n="rs.n"></label><output id="nread" for="nsl"></output></div>
          <input id="nsl" type="range" min="1" max="200" step="1" value="6"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="rs.k.sum"></span><span class="v" id="sumread"></span><span class="f" id="dtread"></span></div>
          <div class="stat"><span class="k" data-i18n-html="rs.k.exact"></span><span class="v" id="exread"></span><span class="f" id="errread"></span></div>
          <div class="stat"><span class="k" data-i18n-html="rs.k.dist"></span><span class="v" id="distread"></span><span class="f" data-i18n="rs.f.dist"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="rs.caption"></figcaption>
    </figure>
    <h3 data-i18n="conv.h3"></h3>
    <p class="caption" data-i18n="conv.intro"></p>
    <div class="list" id="conv" role="table" data-i18n-attr="aria-label:conv.aria"></div>
    <div class="box rem"><b data-i18n="s2.rem.title"></b>
      <p data-i18n-html="s2.rem.body"></p>
    </div>
    <div class="box warn"><b data-i18n="s2.warn.title"></b>
      <p data-i18n-html="s2.warn.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="box prop"><b data-i18n="s3.prop.title"></b>
      <p data-i18n-html="s3.prop.body"></p>
    </div>
    <div class="eq"><math display="block" data-i18n-html="s3.eq.acc"></math><span class="n">(8.10)</span></div>
    <p class="validite" data-i18n="eq3.validite"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="box warn"><b data-i18n="s3.warn.title"></b>
      <p data-i18n-html="s3.warn.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/distance-integrale.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/cinematique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹", met = v => F.qty(F.fix(v, 4), "m");
const small = v => Math.abs(v) < 1e-12 ? "0" : Math.abs(v) >= 0.01 ? F.num(v, 3) : F.sci(v, 2);

/* ---------- table des vitesses de la bille ---------- */
(() => {
  const P = Cine.PROFILES.chute;
  $("vtab").innerHTML = `<div role="row"><span role="columnheader">${t("vtab.t")}</span><span class="v" role="columnheader">${t("vtab.v")}</span></div>` +
    [0, 1, 2, 3].map(s => `<div role="row"><span role="cell">${F.qty(F.num(s), "s")}</span><span class="v" role="cell">${F.qty(F.fix(P.v(s), 2), MS)}</span></div>`).join("");
})();

/* ---------- sommes de Riemann ---------- */
(() => {
  const svg = $("rs"), nsl = $("nsl");
  const DOM = { chute: [0, 30], demarrage: [0, 32], vaetvient: [-2.4, 2.4] };
  let key = "chute", rule = "gauche", ax, area, curve;
  function frame() {
    const p = Cine.PROFILES[key];
    svg.textContent = "";
    ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [p.a, p.b], label: t("rs.x") }, y: { domain: DOM[key], label: t("rs.y") } });
    area = Plot.el("path", { class: "area" }, ax.g);
    Plot.el("line", { x1: ax.x(p.a), x2: ax.x(p.b), y1: ax.y(0), y2: ax.y(0), class: "zero" }, ax.g);
    let d = ""; for (let i = 0; i <= 300; i++) { const s = p.a + (p.b - p.a) * i / 300; d += (i ? "L" : "M") + ax.x(s).toFixed(1) + " " + ax.y(p.v(s)).toFixed(1); }
    curve = Plot.el("path", { d, class: "curve" }, ax.g);
    $("lawread").innerHTML = t("rs.law." + key);
    upd();
  }
  function upd() {
    const p = Cine.PROFILES[key], n = +nsl.value, { x, y } = ax, y0 = y(0);
    const cells = Cine.cells(p.v, p.a, p.b, n, rule);
    area.setAttribute("d", cells.map(c => `M${x(c.t0).toFixed(1)} ${y0.toFixed(1)}L${x(c.t0).toFixed(1)} ${y(c.y0).toFixed(1)}L${x(c.t1).toFixed(1)} ${y(c.y1).toFixed(1)}L${x(c.t1).toFixed(1)} ${y0.toFixed(1)}Z`).join(""));
    const S = Cine.riemann(p.v, p.a, p.b, n, rule), ex = p.X(p.b) - p.X(p.a);
    $("nread").textContent = n;
    $("sumread").textContent = met(S);
    $("dtread").textContent = t("rs.f.dt", { dt: F.qty(F.num((p.b - p.a) / n, 3), "s") });
    $("exread").textContent = met(ex);
    $("errread").textContent = t("rs.f.err", { e: F.qty(small(S - ex), "m") });
    $("distread").textContent = met(p.dist);
    /* convergence: halve the step, watch the error */
    let prev = null;
    $("conv").innerHTML = `<div role="row"><span role="columnheader">${t("conv.n")}</span><span class="v" role="columnheader">${t("conv.cols")}</span></div>` +
      [4, 8, 16, 32, 64, 128, 256].map(k => { const e = Cine.riemann(p.v, p.a, p.b, k, rule) - ex;
        const r = prev != null && Math.abs(e) > 1e-12 && Math.abs(prev) > 1e-12 ? F.fix(prev / e, 2) : "–"; prev = e;
        return `<div role="row"><span role="cell">${k}</span><span class="v" role="cell">${t("conv.row", { e: F.qty(small(e), "m"), r })}</span></div>`; }).join("");
  }
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { key = b.dataset.p;
    document.querySelectorAll("[data-p]").forEach(o => o.setAttribute("aria-pressed", o === b)); frame(); });
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { rule = b.dataset.r;
    document.querySelectorAll("[data-r]").forEach(o => o.setAttribute("aria-pressed", o === b)); upd(); });
  nsl.oninput = upd; frame();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["archimede", -250, "idea"], ["oresme", 1350, "idea"], ["leibniz", 1675, "idea"], ["cauchy", 1823, "idea"], ["riemann", 1854, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["inertiel", "odo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["aire", "a"], ["gauche", "a"], ["doubler", "a"], ["compteur", "a"], ["constante", "a"], ["chute", "a"], ["derive", "a"], ["milieu", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 84 });
})();
</script>
</body>
</html>
