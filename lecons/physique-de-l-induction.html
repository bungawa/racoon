<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd;

/* ---------- trois façons de changer le flux : la même ℰ, deux lois différentes ---------- */
(() => {
  const B0 = 0.5, L = 0.05, w = 0.01, a = 0.04, b = 0.03;                     // a 10 cm gap with 1 cm edges; a 4 cm × 3 cm loop
  const schema = $("schema"), trace = $("trace"), sx = $("sx"), sv = $("sv"), seg = $("mode");
  let mode = "spire";
  const X = x => 320 + x * 2000;                                               // schematic: 1 cm = 20 px, magnet centred
  function draw() {
    const xg = +sx.value / 1000, r = +sv.value, v = r / 10, dB0 = r;            // v in m·s⁻¹ (0,1 to 5), dB0 in T·s⁻¹ (1 to 50)
    /* the loop's left edge at xg relative to the magnet, at t = 0: x0 = xg in every mode */
    const s = M.troisInductions({ mode, B0, L, w, a, b, x0: xg, v, dB0 });
    const fem = s.fem(0), fE = s.femE(0), fV = s.femVB(0), num = M.femLorentz(s.coins(0), { E: p => s.E(p, 0), vitesse: p => s.vitesse(p, 0), B: p => s.B(p, 0) }, 100);
    /* schematic: the field strength as a profile, the loop seen from above */
    schema.innerHTML = "";
    const xs = Array.from({ length: 321 }, (_, i) => -0.16 + i * 0.001);
    Plot.el("path", { d: Plot.path(xs.map(x => [X(x), 120 - 90 * s.bande.g(x)])), class: "stroke c-warn" }, schema);
    Plot.el("line", { x1: X(-0.16), x2: X(0.16), y1: 120, y2: 120, class: "stroke thin c-label-2" }, schema);
    Plot.el("rect", { x: X(xg), y: 40, width: a * 2000, height: 70, class: "stroke bold c-tint" }, schema);
    const arrow = (x0, x1, y, cls) => Plot.fleche(schema, [x0, y], [x1, y], { cls });
    if (mode === "spire") arrow(X(xg + a / 2) - 30, X(xg + a / 2) + 30, 140, "c-tint");
    if (mode === "aimant") arrow(X(0) + 30, X(0) - 30, 140, "c-warn");
    /* EMF against the position of the loop, for the chosen speed or rate */
    trace.innerHTML = "";
    const pos = Array.from({ length: 261 }, (_, i) => -0.15 + i * 0.001);
    const curve = pos.map(x => M.troisInductions({ mode, B0, L, w, a, b, x0: x, v, dB0 }).fem(0));
    const ymax = 1.15 * Math.max(0.01, ...curve.map(Math.abs));
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 240, pad: { l: 64, b: 44 }, x: { domain: [-15, 11], label: t("fig.xaxis") }, y: { domain: [-1000 * ymax, 1000 * ymax], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(-15), x2: P.x(11), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("path", { d: Plot.path(pos.map((x, i) => [P.x(100 * x), P.y(1000 * curve[i])])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(100 * xg), cy: P.y(1000 * fem), r: 5, class: "dot" }, P.g);
    $("svl").textContent = t(mode === "champ" ? "fig.dB" : "fig.v");
    $("svr").textContent = mode === "champ" ? F.qty(F.num(dB0, 3), "T·s⁻¹") : F.si(v, "m·s⁻¹");
    $("sxr").textContent = F.qty(F.num(100 * xg, 3), "cm");
    $("vflux").textContent = F.si(fem, "V", { prefix: "m" });
    $("fflux").textContent = t("fig.f.flux", { v: F.si(s.flux(0), "Wb", { prefix: "m" }) });
    $("ve").textContent = F.si(fE, "V", { prefix: "m" });
    $("fe").textContent = t("fig.f.num", { v: F.si(num.electrique, "V", { prefix: "m" }) });
    $("vvb").textContent = F.si(fV, "V", { prefix: "m" });
    $("fvb").textContent = t("fig.f.num", { v: F.si(num.magnetique, "V", { prefix: "m" }) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; draw(); });
  sx.oninput = sv.oninput = draw; draw();
})();

/* ---------- le système décrit : un aimant qui passe à 2 m·s⁻¹, vu de la spire et vu de l'aimant ---------- */
(() => {
  const v = 2, B0 = 0.5, c = Constantes.c;
  $("sys1").innerHTML = t("sys1.body", { v: F.si(v, "m·s⁻¹"), B: F.si(B0, "T"), E: F.si(v * B0, "V·m⁻¹"), b2: F.sci((v / c) ** 2, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1831, "experiment"], ["maxwell", 1861, "idea"], ["einstein", 1905, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["plaque"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "b"], ["repos", "d"], ["meme", "a"], ["fixe", "c"], ["dehors", "b"], ["sanscircuit", "a"], ["ordre", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 171 });
})();
</script>
