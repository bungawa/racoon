<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const pct = r => F.qty(F.num(r * 100, 3), "%");
const signed = (x, u, sig) => (x < 0 ? F.MINUS : "") + F.si(Math.abs(x), u, { sig });

/* ---------- §2 : la boule lancée, v(t) et Rω(t) jusqu'au roulement ---------- */
(() => {
  const svg = $("lancer");
  function upd() {
    const v0 = +$("v0").value, Rw0 = +$("w0").value, mu = +$("mu").value, k = $("forme").value;
    const r = Contact.lancer({ v0, Rw0, mu, k }), tEnd = Math.max(2 * r.tRoule, 0.2), N = 200;
    const lo = Math.min(0, v0, Rw0, r.vf), hi = Math.max(v0, Rw0, r.vf, 0.5), pad = 0.08 * (hi - lo);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 48 }, x: { domain: [0, tEnd], label: t("lan.xaxis") }, y: { domain: [lo - pad, hi + pad], label: t("lan.yaxis") } });
    if (lo < 0) Plot.el("line", { x1: o.x(0), x2: o.x(tEnd), y1: o.y(0), y2: o.y(0), class: "stroke thin c-label-2" }, o.g);
    const pts = Array.from({ length: N + 1 }, (_, i) => { const tt = tEnd * i / N; return [tt, r.at(tt)]; });
    Plot.el("path", { d: path(pts.map(([tt, s]) => [o.x(tt), o.y(s.Rw)])), class: "ref" }, o.g);
    Plot.el("path", { d: path(pts.map(([tt, s]) => [o.x(tt), o.y(s.v)])), class: "curve" }, o.g);
    Plot.el("circle", { cx: o.x(r.tRoule), cy: o.y(r.vf), r: 5, class: "dot" }, o.g);
    $("v0v").textContent = F.si(v0, "m·s⁻¹", { sig: 2 });
    $("w0v").textContent = signed(Rw0, "m·s⁻¹", 2);
    $("muv").textContent = F.num(mu, 2);
    $("vt").textContent = F.si(r.tRoule, "s", { sig: 3 });
    $("fx").textContent = t("lan.f.x", { x: signed(r.xRoule, "m", 3) });
    $("vvf").textContent = signed(r.vf, "m·s⁻¹", 3);
    $("fvf").textContent = t(r.vf < -1e-9 ? "lan.f.retour" : r.vf > 1e-9 ? "lan.f.avance" : "lan.f.arret");
    $("ve").textContent = pct(r.fraction);
  }
  ["v0", "w0", "mu"].forEach(id => { $(id).oninput = upd; }); $("forme").onchange = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["euler1758", 1758, "idea"], ["coriolis1835", 1835, "idea"], ["abs1978", 1978, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["abs", "billard"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["vg", "b"], ["point", "d"], ["final", "a"], ["mu", "c"], ["energie", "b"], ["retro", "a"], ["anneau", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 4101 });
})();
</script>
