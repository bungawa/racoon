<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
const HAUT = 6500, BAS = 3500, POCHE = 2000, DQ = 20;       /* m, m, m, C: Feynman's heights (6–7 km, 3–4 km) and 20 C per flash */
const kV = v => F.qty(F.num(v / 1e3, 3), "kV·m⁻¹");

/* ---------- le champ au sol, du pied du nuage à 20 km ---------- */
(() => {
  const svg = $("sol"), sQ = $("sQ"), sq = $("sq"), YM = [-50, 10];
  function draw() {
    const Q = +sQ.value, q = +sq.value, ch = [{ q: Q, h: HAUT }, { q: -Q, h: BAS }].concat(q > 0 ? [{ q, h: POCHE }] : []);
    const inv = ES.inversions(ch, 20000);
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, 20], label: t("sol.x") }, y: { domain: YM, label: t("sol.y") } });
    Plot.el("line", { x1: A.x(0), x2: A.x(20), y1: A.y(0), y2: A.y(0), class: "stroke thin c-label" }, A.g);
    const pts = Array.from({ length: 401 }, (_, i) => i * 50).map(D => [A.x(D / 1e3), A.y(Math.max(YM[0], Math.min(YM[1], ES.champSousNuage(ch, D) / 1e3)))]);
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold c-tint" }, A.g);
    inv.forEach(D => Plot.el("circle", { cx: A.x(D / 1e3), cy: A.y(0), r: 4, class: "fill c-warn" }, A.g));
    $("rQ").textContent = F.si(Q, "C"); $("rq").textContent = F.si(q, "C");
    $("v0").textContent = kV(ES.champSousNuage(ch, 0));
    $("vi").textContent = inv.length ? inv.map(D => F.si(D, "m", { prefix: "k", sig: 2 })).join(" ; ") : t("inv.aucune");
    $("vl").textContent = F.si(ES.champSousNuage(ch, 20000), "V·m⁻¹", { sig: 2 });
  }
  sQ.oninput = sq.oninput = draw; draw();
})();

/* ---------- le saut de champ d'un éclair, puis le retour ---------- */
(() => {
  const svg = $("saut"), sD = $("sD"), st = $("st");
  let type = "sol";
  function draw() {
    const D = +sD.value * 1e3, tau = +st.value, Q = 40;
    const E0 = ES.champSousNuage([{ q: Q, h: HAUT }, { q: -Q, h: BAS }], D);
    /* what the flash removes: its field is taken away at t = 0 and comes back with the time constant tau */
    const ote = type === "sol" ? [{ q: -DQ, h: BAS }] : [{ q: DQ, h: HAUT }, { q: -DQ, h: BAS }], dE = -ES.champSousNuage(ote, D);
    const E = x => (x < 0 ? E0 : E0 + dE * Math.exp(-x / tau)), lo = Math.min(E0, E0 + dE), hi = Math.max(E0, E0 + dE), m = 0.15 * (hi - lo) + 1;
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 260, x: { domain: [-2, 20], label: t("saut.x") }, y: { domain: [(lo - m) / 1e3, (hi + m) / 1e3], ticks: 4, label: t("sol.y") } });
    const ts = [-2, -1e-9].concat(Array.from({ length: 201 }, (_, i) => i / 10));
    Plot.el("path", { d: Plot.path(ts.map(x => [A.x(Math.max(x, 0) === 0 && x < 0 && x > -1 ? 0 : x), A.y(E(x) / 1e3)])), class: "stroke bold c-tint" }, A.g);
    $("rD").textContent = F.si(D, "m", { prefix: "k", sig: 3 }); $("rt").textContent = F.si(tau, "s");
    $("vs").textContent = (dE > 0 ? "+" : "") + kV(dE);
    $("fs").textContent = t(dE > 0 ? "f.saut.pos" : "f.saut.neg");
    $("vI").textContent = F.si(DQ / tau, "A", { sig: 2 });
  }
  document.querySelectorAll("#types button").forEach(bt => bt.onclick = () => {
    type = bt.dataset.k; document.querySelectorAll("#types button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  sD.oninput = st.oninput = draw; draw();
})();

/* ---------- la charge qu'une goutte peut prendre, et ce qu'il en faut pour 20 C ---------- */
(() => {
  const sR = $("sR"), sE = $("sE"), VOL = 1e10;              /* m³: a cell 3 km × 3 km × 1 km of falling drops, order of magnitude */
  function draw() {
    const R = Math.pow(10, +sR.value), E0 = Math.pow(10, +sE.value), q = ES.chargeSaturation(R, E0), n = DQ / q / VOL, eau = n * 4 / 3 * Math.PI * R ** 3 * 1000;
    $("rR").textContent = F.si(R, "m", { sig: 2 }); $("rE").textContent = F.si(E0, "V·m⁻¹", { sig: 2 });
    $("vq").textContent = F.qty(F.sci(q, 2), "C");
    $("fq").textContent = t("f.qmax", { n: F.sci(q / Constantes.e, 1) });
    $("vn").textContent = F.qty(F.sci(n, 1), "m⁻³");
    $("ve").textContent = F.qty(F.sci(eau * 1e3, 1), "g·m⁻³");
    $("fe").textContent = t(eau * 1e3 > 4 ? "f.eau.trop" : "f.eau.ok");
  }
  sR.oninput = sE.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["simpson", 1937, "experiment"], ["reynolds", 1957, "experiment"], ["takahashi", 1978, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["filtre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signe", "b"], ["courant", "c"], ["retour", "a"], ["distance", "d"], ["brisee", "b"], ["wilson", "a"], ["rayon", "c"], ["glace", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 905 });
})();
</script>
