<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/navigation.js"></script>

<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes, B = 3e-10;

/* ---------- the band E(k), and the amplitudes on the atoms ---------- */
(() => {
  const svg = $("fig"), svg2 = $("fig2"), sk = $("sk"), sa = $("sa"), PI = Math.PI;
  function draw() {
    const kb = +sk.value, AeV = +sa.value, o = { E0: 0, A: AeV * K.e, b: B }, eV = E => E / K.e;
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 }, x: { domain: [-PI, PI], label: t("fig.xaxis"), ticks: 6 }, y: { domain: [-4, 4], label: t("fig.yaxis") } });
    const pts = [], par = [];
    for (let i = 0; i <= 200; i++) { const u = -PI + 2 * PI * i / 200; pts.push([G.x(u), G.y(eV(Q.bandeChaine(u / B, o)))]);
      const ep = -2 * AeV + AeV * u * u; if (ep <= 4) par.push([G.x(u), G.y(ep)]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke c-label" }, G.g);
    Plot.el("path", { d: Plot.path(par), class: "stroke thin dash c-tint" }, G.g);
    for (const E of [-2 * AeV, 2 * AeV]) Plot.el("line", { x1: G.x(-PI), x2: G.x(PI), y1: G.y(E), y2: G.y(E), class: "stroke thin dash c-label-2" }, G.g);
    const E = Q.bandeChaine(kb / B, o);
    Plot.el("circle", { cx: G.x(kb), cy: G.y(eV(E)), r: 5, class: "fill c-warn" }, G.g);
    /* the amplitudes on the atoms: Re a_n = cos(k x_n); the same values come from k + 2π/b */
    svg2.innerHTML = "";
    const H = Plot.axes(svg2, { fmt: F, w: 640, h: 180, pad: { l: 56, b: 40 }, x: { domain: [0, 12], label: t("fig2.xaxis") }, y: { domain: [-1.2, 1.2], label: t("fig2.yaxis"), ticks: 4 } });
    const c1 = [], c2 = [];
    for (let i = 0; i <= 600; i++) { const x = 12 * i / 600; c1.push([H.x(x), H.y(Math.cos(kb * x))]); c2.push([H.x(x), H.y(Math.cos((kb + 2 * PI) * x))]); }
    Plot.el("path", { d: Plot.path(c2), class: "stroke thin c-tint" }, H.g);
    Plot.el("path", { d: Plot.path(c1), class: "stroke thin dash c-label-2" }, H.g);
    const gp = Plot.el("g", { class: "c-label" }, H.g);
    for (let n = 0; n <= 12; n++) Plot.el("circle", { cx: H.x(n), cy: H.y(Math.cos(kb * n)), r: 4, class: "fill" }, gp);
    $("skr").textContent = F.num(kb, 3);
    $("sar").textContent = F.si(AeV, "eV");
    $("ve").textContent = F.si(eV(E), "eV");
    $("fe").textContent = t("fig.f.e", { w: F.si(4 * AeV, "eV") });
    const ep = -2 * AeV + AeV * kb * kb, ecart = Math.abs(ep - eV(E)) / Math.max(1e-12, eV(E) + 2 * AeV);
    $("vp").textContent = F.si(ep, "eV");
    $("fp").textContent = Math.abs(kb) < 1e-9 ? t("fig.f.para0") : t("fig.f.para", { p: F.num(100 * ecart, 2) });
    $("vl").textContent = Math.abs(kb) < 1e-9 ? "∞" : F.si(2 * PI * B / Math.abs(kb), "m");
    $("fl").textContent = t("fig.f.lambda", { n: F.num(2 * PI / Math.max(1e-9, Math.abs(kb)), 3) });
  }
  sk.oninput = draw; sa.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const o = { E0: 0, A: K.e, b: B };
  $("sys1").innerHTML = t("sys1.body", { m: F.num(Q.masseEffectiveChaine(0, o) / K.m_e, 2) });
  $("sys2").innerHTML = t("sys2.body", { u: F.num(Math.sqrt(0.12), 2) });
  $("sys3").innerHTML = t("sys3.body", { dk: F.sci(2 * Math.PI / (1e-2), 2), kmax: F.sci(Math.PI / B, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bloch", 1929, "idea"], ["brillouin", 1930, "idea"], ["kronig", 1931, "idea"], ["wallace", 1947, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["graphene"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["essai", "b"], ["bande", "d"], ["alias", "a"], ["reel", "c"], ["parabole", "b"], ["largeur", "a"], ["sens", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1302 });
})();
</script>
