<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes;
/* The apparatus of this page: water at 300 K in 0,5 T, a pick-up coil of 20 turns of 0,5 cm² filled with water, a 60 Hz sweep. */
const G = M.rapportGyromagnetique("proton"), B0 = 0.5, TEMP = 300, BOBINE = { N: 20, S: 0.5e-4 }, FM = 60;
const EAU = M.aimantationNucleaire(M.PROTONS_EAU, G, B0, TEMP);

/* ---------- le système décrit ---------- */
(() => {
  const f = G * B0 / (2 * Math.PI);
  $("sys1").innerHTML = t("sys1.body", { B: F.si(B0, "T", { sig: 1 }), T: F.kelvin(TEMP), f: F.si(f, "Hz", { sig: 3 }), N: F.sci(M.PROTONS_EAU, 3),
    ex: F.sci(EAU.exces, 2), M0: F.si(EAU.M, "A·m⁻¹", { sig: 2 }), chi: F.sci(EAU.chi, 2), r: F.num(Math.abs(M.SUSCEPTIBILITES.eau.chi) / EAU.chi, 2),
    e: F.si(M.femBobine(BOBINE.N, BOBINE.S, G * B0, EAU.M), "V", { sig: 2 }) });
})();

/* ---------- le balayage du champ : absorption, dispersion, ondulations ---------- */
(() => {
  const svg = $("signal"), sm = $("sm"), s2 = $("s2"), s1 = $("s1");
  function draw() {
    const Bm = Math.pow(10, +sm.value), T2 = Math.pow(10, +s2.value), B1 = Math.pow(10, +s1.value), T1 = T2, w1 = G * B1;
    const a = G * Bm * 2 * Math.PI * FM, win = Math.min(1 / (4 * FM), Math.max(6 * T2, 8 / Math.sqrt(a)));
    const dt = Math.min(T2 / 20, 0.1 / (G * Bm), win / 400), garde = Math.max(1, Math.round(win / 300 / dt));
    /* start at the bottom of the sweep in the steady state there: what is left of the previous passage is neglected (T2 ≪ 1/(2 fm)) */
    const s0 = M.blochStationnaire(-G * Bm, w1, T1, T2);
    const r = M.balayageRMN({ gamma: G, B0, Bm, fm: FM, B1, T1, T2, dt, duree: 1 / (4 * FM) + win, garde, M: [s0.Mx, s0.My, s0.Mz] });
    const pts = r.t.map((tt, k) => [tt, r.M[k]]).filter(p => p[0] >= -win);
    const ymax = Math.max(0.05, ...pts.map(p => Math.max(Math.hypot(p[1][0], p[1][1]), M.blochStationnaire(r.offset(p[0]), w1, T1, T2).My))) * 1.1;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-win * 1e3, win * 1e3], label: t("fig.ax.x") }, y: { domain: [-ymax, ymax], label: t("fig.ax.y") } });
    const st = pts.map(p => [P.x(p[0] * 1e3), P.y(M.blochStationnaire(r.offset(p[0]), w1, T1, T2).My)]);
    Plot.el("path", { d: Plot.path(st), class: "stroke thin dash c-label-2" }, svg);
    Plot.el("path", { d: Plot.path(pts.map(p => [P.x(p[0] * 1e3), P.y(p[1][0])])), class: "stroke thin c-warn" }, svg);
    Plot.el("path", { d: Plot.path(pts.map(p => [P.x(p[0] * 1e3), P.y(p[1][1])])), class: "stroke bold c-tint" }, svg);
    const perp = Math.max(...pts.map(p => Math.hypot(p[1][0], p[1][1])));
    $("smr").textContent = F.si(Bm, "T", { sig: 2 });
    $("s2r").textContent = F.si(T2, "s", { sig: 2 });
    $("s1r").textContent = F.si(B1, "T", { sig: 2 });
    $("vv").textContent = F.si(a / (2 * Math.PI), "Hz·s⁻¹", { sig: 2 });
    $("fv").innerHTML = t("fig.f.vitesse");
    $("vo").textContent = F.num(r.ondulations, 2);
    $("fo").innerHTML = t(r.ondulations < 0.3 ? "fig.f.lent" : "fig.f.rapide");
    $("vs").textContent = F.num(w1 * w1 * T1 * T2, 2);
    $("fs").innerHTML = t(w1 * w1 * T1 * T2 > 1 ? "fig.f.sature" : "fig.f.lineaire");
    $("ve").textContent = F.si(M.femBobine(BOBINE.N, BOBINE.S, G * B0, perp * EAU.M), "V", { sig: 2 });
    $("fe").innerHTML = t("fig.f.fem");
  }
  sm.oninput = s2.oninput = s1.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["purcell", 1946, "experiment"], ["bloch", 1946, "experiment"], ["bpp", 1948, "idea"], ["hahn", 1950, "experiment"], ["nobel", 1952, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gadolinium"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["exces", "b"], ["fer", "d"], ["saturation", "a"], ["ondulations", "c"], ["largeur", "b"], ["champ", "d"], ["contraste", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 356 });
})();
</script>
