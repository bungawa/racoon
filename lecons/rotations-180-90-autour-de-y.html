<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- the state +S seen by T turned φ about y: C′₊ = cos(φ/2), C′₋ = −sin(φ/2); two half turns compose ---------- */
(() => {
  const sf = $("sf"), p = Q.etatBase(2, 0);
  function draw() {
    const d = +sf.value, f = d * Math.PI / 180, svg = $("courbes"); svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 260, x: { domain: [0, 720], label: t("fig.ax.phi") }, y: { domain: [-1, 1], label: t("fig.ax.c") } });
    const ds = Array.from({ length: 289 }, (_, k) => k * 2.5), c = x => Q.appliquer(Q.demiY(x * Math.PI / 180), p);
    Plot.el("path", { d: Plot.path(ds.map(x => [ax.x(x), ax.y(c(x)[0].re)])), class: "stroke c-tint", fill: "none" }, svg);
    Plot.el("path", { d: Plot.path(ds.map(x => [ax.x(x), ax.y(c(x)[1].re)])), class: "stroke c-warn", fill: "none" }, svg);
    Plot.el("path", { d: Plot.path(ds.map(x => [ax.x(x), ax.y(Cx.abs2(c(x)[0]))])), class: "stroke dash c-label", fill: "none" }, svg);
    Plot.el("line", { x1: ax.x(d), x2: ax.x(d), y1: ax.y(-1), y2: ax.y(1), class: "stroke thin dash c-label" }, svg);
    $("sfr").textContent = F.num(d, 4) + "\u00a0°";
    const v = c(d);
    $("vc").textContent = v.map(z => F.num(Math.abs(z.re) < 5e-13 ? 0 : z.re, 3)).join(" ; ");
    $("vp").textContent = F.num(Cx.abs2(v[0]), 3); $("fp").textContent = t("fig.f.p", { v: F.num((1 + Math.cos(f)) / 2, 3) });
    const h = Q.appliquer(Q.produitMatrices(Q.demiY(f / 2), Q.demiY(f / 2)), p);
    $("vdeux").textContent = h.map(z => F.num(Math.abs(z.re) < 5e-13 ? 0 : z.re, 3)).join(" ; "); $("fdeux").textContent = t("fig.f.deux");
  }
  sf.oninput = draw; draw();
  const x = Q.appliquer(Q.demiY(Math.PI / 2), [Cx.c(Math.SQRT1_2, 0), Cx.c(Math.SQRT1_2, 0)]).map(Cx.abs2);
  $("sys1").innerHTML = t("sys1.body", { p: x.map(v => F.num(v, 2)).join(" ; ") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rabi", 1938, "experiment"], ["hahn", 1950, "experiment"], ["carr", 1954, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["echange", "b"], ["signe", "d"], ["deux", "a"], ["quatre", "c"], ["quart", "b"], ["proba", "a"], ["convention", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 604 });
})();
</script>
