<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- an electron (μ ≈ μ_B) prepared along +x, field B along z: P(+x), P(+y) against time (7.36), (7.37); t in ps ---------- */
(() => {
  const sB = $("sB"), st = $("st"), MU = Q.mu_B;
  function draw() {
    const B = +sB.value, t0 = +st.value * 1e-12, svg = $("courbes"); svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 250, x: { domain: [0, 100], label: t("fig.ax.t") }, y: { domain: [0, 1], label: t("fig.ax.p") } });
    const ts = Array.from({ length: 501 }, (_, k) => k * 0.2), P = x => Q.precessionSpinDemi(MU * B, x * 1e-12);
    Plot.el("path", { d: Plot.path(ts.map(x => [ax.x(x), ax.y(P(x).Px)])), class: "stroke c-tint", fill: "none" }, svg);
    Plot.el("path", { d: Plot.path(ts.map(x => [ax.x(x), ax.y(P(x).Py)])), class: "stroke dash c-warn", fill: "none" }, svg);
    Plot.el("line", { x1: ax.x(+st.value), x2: ax.x(+st.value), y1: ax.y(0), y2: ax.y(1), class: "stroke thin dash c-label" }, svg);
    const r = Q.precessionSpinDemi(MU * B, t0);
    $("sBr").textContent = F.si(B, "T"); $("str").textContent = F.si(t0, "s");
    $("vf").textContent = F.si(r.wp / (2 * Math.PI), "Hz"); $("ff").textContent = t("fig.f.f", { w: F.si(r.wp, "rad·s⁻¹") });
    $("vp").textContent = F.num(r.Px, 3) + " ; " + F.num(r.Py, 3);
    $("vangle").textContent = F.num(((r.wp * t0 * 180 / Math.PI) % 360 + 360) % 360, 3) + "\u00a0°"; $("fangle").textContent = t("fig.f.angle");
  }
  sB.oninput = st.oninput = draw; draw();
  const w = Q.precessionSpinDemi(MU, 0).wp;
  $("sys1").innerHTML = t("sys1.body", { f: F.si(w / (2 * Math.PI), "Hz"), T: F.si(2 * Math.PI / w, "s") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cern", 1959, "experiment"], ["bnl", 2006, "experiment"], ["fnal", 2025, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["phases", "c"], ["px", "a"], ["periode", "d"], ["vitesse", "b"], ["py", "c"], ["classique", "d"], ["mesure", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 705 });
})();
</script>
