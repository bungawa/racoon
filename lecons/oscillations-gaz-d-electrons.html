<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, C = Constantes;

/* Aluminium: 3 valence electrons per atom, 2 700 kg·m⁻³, 26,98 g·mol⁻¹. The measured bulk plasmon: 15,1 eV (electron energy-loss spectroscopy). */
const N_AL = 3 * 2700 / 0.02698 * C.N_A, AL_MESURE = 15.1;
const N_IONO = 1e12, T_IONO = 1000;

/* ---------- le système décrit : la couche F de l'ionosphère ---------- */
(() => {
  const D = ES.longueurDebye(T_IONO, N_IONO, { especes: 1 }), mi = 16e-3 / C.N_A;   // O⁺, the main ion of the F layer
  $("sys1").innerHTML = t("sys1.body", { n: F.sci(N_IONO, 1), T: F.kelvin(T_IONO), D: F.si(D, "m", { prefix: "m" }),
    f: F.si(Ondes.pulsationPlasma(N_IONO) / (2 * Math.PI), "Hz"), ions: F.num(mi / C.m_e, 3) });
})();

/* ---------- 64 feuillets d'électrons, le champ par Gauss ---------- */
(() => {
  const ka = $("ka"), dens = $("dens"), sv = $("lignes");
  const DUREE = 6 * Math.PI, MONTRE = 32;
  let cache = {};
  const sim = k => cache[k] || (cache[k] = ES.feuillets({ kA: +k, duree: DUREE, N: 64, echantillon: 0.05 }));
  function draw() {
    const k = +ka.value, n0 = Math.pow(10, +dens.value), f = sim(k.toFixed(2)), wp = Ondes.pulsationPlasma(n0);
    sv.innerHTML = "";
    const A = Plot.axes(sv, { fmt: F, w: 640, h: 300, x: { domain: [0, 3], label: t("fig.x") }, y: { domain: [0, 1], label: t("fig.y") } });
    const tc = f.croisement;
    for (let j = 0; j < 64; j += 64 / MONTRE) {                         // one sheet in two
      const pts = f.t.map((tt, i) => [A.x(tt / (2 * Math.PI)), A.y(Math.max(0, Math.min(1, f.x0[j] + f.s[i][j])))]);
      Plot.el("path", { d: Plot.path(pts), class: "stroke thin c-tint" }, A.g);
    }
    if (Number.isFinite(tc)) Plot.el("line", { x1: A.x(tc / (2 * Math.PI)), x2: A.x(tc / (2 * Math.PI)), y1: A.y(0), y2: A.y(1), class: "stroke dash c-warn" }, A.g);
    const eV = C.hbar * wp / C.e;
    $("kar").textContent = F.num(k, 2);
    $("densr").textContent = F.sci(n0, 2) + " m⁻³";
    $("vf").textContent = F.si(wp / (2 * Math.PI), "Hz");
    $("ff").textContent = t("fig.f.f", { w: F.si(wp, "rad·s⁻¹") });
    $("vev").textContent = F.si(eV, "eV");
    $("fev").textContent = t("fig.f.ev", { m: F.num(AL_MESURE, 3) });
    if (Number.isFinite(tc)) {
      $("vp").textContent = t("fig.v.croise", { t: F.num(tc / (2 * Math.PI), 2) });
      $("fp").textContent = t("fig.f.croise", { d: F.si(tc / wp, "s") });
    } else {
      $("vp").textContent = t("fig.v.periode", { r: F.num(f.periode / (2 * Math.PI), 5) });
      $("fp").textContent = t("fig.f.periode", { T: F.si(2 * Math.PI / wp, "s") });
    }
  }
  ka.oninput = dens.oninput = draw;
  $("iono").onclick = () => { dens.value = Math.log10(N_IONO); draw(); };
  $("alu").onclick = () => { dens.value = Math.log10(N_AL).toFixed(1); draw(); };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["breit", 1925, "experiment"], ["tonks", 1929, "experiment"], ["pines", 1952, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ionosonde", "pertes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["rappel", "c"], ["masse", "a"], ["longueur", "d"], ["densite", "b"], ["radio", "a"], ["metal", "c"], ["croisement", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 73 });
})();
</script>
