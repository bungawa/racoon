<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹", T0 = 293.15;
const ETATS = { eau: Fluides.eau(T0), air: Fluides.air(T0, Fluides.ISO2533.p0) };

/* ---------- tube de Poiseuille : profil parabolique, débit en R⁴, validité par Re ---------- */
(() => {
  let fluid = "eau";
  const svg = $("tube"), P = Plot.el, rsl = $("rsl"), gsl = $("gsl");
  function draw() {
    svg.innerHTML = "";
    const s = ETATS[fluid], R = Math.pow(10, +rsl.value), G = Math.pow(10, +gsl.value), p = Fluides.poiseuille(R, G, s.eta);
    const re = Fluides.reynolds(p.vmoy, 2 * R, s.nu);
    /* the drawing: wall half-height fixed, arrows scaled to vmax */
    const X0 = 70, X1 = 600, YC = 130, H = 95, XA = 130, LMAX = 320, N = 9;
    P("rect", { x: X0, y: YC - H - 10, width: X1 - X0, height: 10, class: "fill c-label-2" }, svg);
    P("rect", { x: X0, y: YC + H, width: X1 - X0, height: 10, class: "fill c-label-2" }, svg);
    P("line", { x1: X0, y1: YC, x2: X1, y2: YC, class: "stroke thin dash c-label-2" }, svg);
    const pts = [];
    for (let i = -N; i <= N; i++) {
      const r = R * i / N, y = YC - H * i / N, L = LMAX * p.v(r) / p.vmax;
      Plot.fleche(svg, [XA, y], [XA + L, y], { cls: "c-tint", tete: 8, min: 2 });
    }
    for (let i = 0; i <= 60; i++) { const u = -1 + i / 30; pts.push([XA + LMAX * (1 - u * u), YC - H * u]); }
    P("path", { d: Plot.path(pts), class: "stroke thin c-tint" }, svg);
    const lab = P("text", { x: X1 - 30, y: YC - H + 20, "text-anchor": "end" }, svg); lab.textContent = "R = " + F.si(R, "m", { sig: 2 });
    $("rread").textContent = F.si(R, "m", { sig: 2 }); $("gread").textContent = F.si(G, "Pa·m⁻¹");
    $("vvmax").textContent = F.si(p.vmax, MS); $("fvmoy").textContent = t("tb.f.vmoy", { v: F.si(p.vmoy, MS) });
    $("vq").textContent = F.qty(F.sci(p.Q, 3), "m³·s⁻¹"); $("fq").textContent = t("tb.f.q", { q: F.qty(F.sci(16 * p.Q, 3), "m³·s⁻¹") });
    $("vre").textContent = F.num(re, 3);
    $("fre").textContent = t(re < Fluides.RE_TUBE ? "tb.f.laminaire" : "tb.f.turbulent", { s: F.num(Fluides.RE_TUBE, 4) });
  }
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { fluid = b.dataset.f;
    document.querySelectorAll("[data-f]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  rsl.oninput = gsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["navier", 1822, "idea"], ["hagen", 1839, "experiment"], ["poiseuille", 1840, "experiment"], ["stokes", 1845, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["capillaire", "perfusion"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["r4", "a"], ["longueur", "b"], ["vmax", "c"], ["inertie", "d"], ["laplacien", "a"], ["diffusion", "b"], ["turbulent", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 412 });
})();
</script>
