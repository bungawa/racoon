<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes, KB = Cst.k_B, MUB = Cst.mu_B;

/* ---------- le système décrit : un spin d'électron à 300 K sous 1 T ; deux moments voisins ---------- */
(() => {
  const B = 1, T = 300, d = 0.5e-9, U = Cst.mu0 * MUB * MUB / (4 * Math.PI * d * d * d);
  $("sys1").innerHTML = t("sys1.body", { B: F.si(B, "T", { sig: 1 }), T: F.kelvin(T), x: F.sci(M.rapportThermique(2, B, T), 2),
    d: F.si(d, "m", { sig: 1 }), U: F.si(U, "J", { sig: 2 }), Ur: F.sci(U / (KB * T), 1), Tint: F.si(U / KB, "K", { sig: 1 }) });
})();

/* ---------- le dioxygène : (35.24a) avec j = 1, g = 2 ---------- */
(() => {
  const T = 293.15, chiM = M.constanteCurie(Cst.N_A, 1, 2) / T, Vm = Cst.R * T / 101325;
  $("oxygene").innerHTML = t("oxygene.body", { T: F.kelvin(T), chi: F.sci(chiM, 3), chiv: F.sci(chiM / Vm, 2) });
})();

/* ---------- courbes de Brillouin : moment moyen par ion contre B/T ---------- */
(() => {
  const svg = $("courbes"), sj = $("sj"), sb = $("sb"), st = $("st"), g = 2, X = 4, n = 161;
  const moyen = (j, bt) => g * j * M.brillouin(j, g * MUB * j * bt / KB);           // ⟨μ_z⟩/μ_B at B/T = bt (T·K⁻¹)
  const lang = (j, bt) => { const a = g * Math.sqrt(j * (j + 1)); return a * M.langevinL(a * MUB * bt / KB); };
  function draw() {
    const j = +sj.value / 2, B = +sb.value, T = Math.pow(10, +st.value), bt = B / T;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, X], label: t("fig.ax.x") }, y: { domain: [0, 8], label: t("fig.ax.y") } });
    const curve = (f, cls) => { const pts = []; for (let k = 0; k < n; k++) { const x = X * k / (n - 1); pts.push([P.x(x), P.y(Math.min(8, f(x)))]); }
      Plot.el("path", { d: Plot.path(pts), class: cls }, svg); };
    for (const jj of [0.5, 1.5, 2.5, 3.5]) if (jj !== j) curve(x => moyen(jj, x), "stroke thin c-label-2");
    curve(x => lang(j, x), "stroke thin dash c-warn");
    curve(x => moyen(j, x), "stroke bold c-tint");
    if (bt <= X) Plot.el("circle", { cx: P.x(bt), cy: P.y(moyen(j, bt)), r: 5, class: "fill c-tint" }, svg);
    const a = M.aimantationParamagnetique({ N: 1, j, g, B, T });
    $("sjr").textContent = F.num(j * 2, 1) + "/2";
    $("sbr").textContent = F.si(B, "T", { sig: 3 });
    $("str").innerHTML = T >= 10 ? F.kelvin(T) : F.si(T, "K", { sig: 2 });
    $("vx").textContent = F.num(a.xj, 3);
    $("fx").innerHTML = t("fig.f.x");
    $("vr").textContent = F.qty(F.num(100 * a.relatif, 3), "%");
    $("fr").innerHTML = t(a.relatif > 0.9 ? "fig.f.sature" : a.xj < 0.1 ? "fig.f.lineaire" : "fig.f.coude");
    $("vc").textContent = B > 0 ? F.num(a.curie / a.M, 3) : "–";
    $("fc").innerHTML = t("fig.f.curie");
    $("vl").textContent = B > 0 ? F.num(a.classique / a.M, 3) : "–";
    $("fl").innerHTML = t("fig.f.classique");
  }
  sj.oninput = sb.oninput = st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["langevin", 1905, "idea"], ["brillouin", 1927, "idea"], ["pauling", 1946, "use"], ["henry", 1952, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["oxygene"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["curie", "b"], ["ambiante", "c"], ["tiers", "a"], ["saturation", "d"], ["classique", "b"], ["oxygene", "c"], ["interactions", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 354 });
})();
</script>
