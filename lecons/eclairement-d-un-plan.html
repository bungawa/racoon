<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
const Z = 2;                                                   /* m: height of the ceiling over the table */

/* ---------- une lampe seule ---------- */
(() => {
  const flux = 1000, I = flux / (4 * Math.PI);
  $("lampe").innerHTML = t("lampe.body", { I: F.num(I, 3), E0: F.num(ES.eclairementPoint(I, Z, 0), 3), E1: F.num(ES.eclairementPoint(I, Z, Z), 3), c: F.num(Math.pow(Math.cos(Math.PI / 4), 3), 2) });
})();

/* ---------- des tubes au plafond : l'éclairement de la table ---------- */
(() => {
  const svg = $("tubes"), sb = $("sb"), sf = $("sf"), XM = 3;
  function draw() {
    const b = +sb.value * Z, phi = +sf.value, T = ES.eclairementTubes(phi, b, Z), e = ES.espacementTubes(1e-3, Z);
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-XM, XM], label: t("fig.x") }, y: { domain: [0, 2.5], label: t("fig.y") } });
    Plot.el("line", { x1: A.x(-XM), x2: A.x(XM), y1: A.y(1), y2: A.y(1), class: "stroke thin dash c-label" }, A.g);
    Plot.el("path", { d: Plot.path(Array.from({ length: 481 }, (_, i) => -XM + i * XM / 240).map(x => [A.x(x), A.y(Math.min(2.5, T.en(x * Z) / T.moyen))])), class: "stroke bold c-tint" }, A.g);
    for (let n = Math.ceil(-XM * Z / b); n * b <= XM * Z; n++) Plot.el("circle", { cx: A.x(n * b / Z), cy: A.y(2.4), r: 4, class: "fill c-warn" }, A.g);
    $("rb").textContent = t("b.val", { r: F.num(+sb.value, 3), b: F.si(b, "m", { sig: 3 }) }); $("rf").textContent = F.qty(F.num(phi, 4), "lm·m⁻¹");
    const pct = v => (v >= 0.01 ? F.num(v, 2) : F.sci(v, 2));
    $("vo").textContent = "±" + F.qty(pct(100 * T.ondulation), "%");
    $("fo").textContent = t(T.ondulation <= 1e-3 ? "f.ond.ok" : "f.ond.non", { h: pct(100 * T.harmonique), b: F.si(e.exact, "m", { sig: 3 }) });
    const U = T.en(b / 2) / T.moyen;
    $("vu").textContent = F.num(U, 3);
    $("fu").textContent = t(U >= 0.6 ? "f.unif.ok" : "f.unif.non");
    $("vm").textContent = F.si(T.moyen, "lx", { sig: 3 });
    $("fm").textContent = t(T.moyen >= 500 ? "f.moy.ok" : "f.moy.non");
  }
  sb.oninput = sf.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lambert", 1760, "idea"], ["candela", 1979, "idea"], ["si", 2019, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["norme"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cosinus", "a"], ["lampe", "c"], ["analogue", "b"], ["moyenne", "d"], ["ondulation", "a"], ["harmoniques", "b"], ["plafond", "c"], ["limites", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1206 });
})();
</script>
