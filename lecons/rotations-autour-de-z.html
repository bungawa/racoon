<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- a two-path interferometer, one path turned by φ about z: counts |1 + e^{imφ}|²/4, spin 1/2 (6.19) against spin 1 (5.39) ---------- */
(() => {
  const sf = $("sf");
  const demi = f => Cx.abs2(Cx.add(Cx.c(1, 0), Q.demiZ(f)[0][0])) / 4;          // the same for C₋: e^{−iφ/2}
  const un = f => Cx.abs2(Cx.add(Cx.c(1, 0), Q.spin1Z(f)[0][0])) / 4;
  function draw() {
    const d = +sf.value, f = d * Math.PI / 180, svg = $("franges"); svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 240, x: { domain: [0, 1080], label: t("fig.ax.phi") }, y: { domain: [0, 1], label: t("fig.ax.n") } });
    const ds = Array.from({ length: 433 }, (_, k) => k * 2.5);
    Plot.el("path", { d: Plot.path(ds.map(x => [ax.x(x), ax.y(demi(x * Math.PI / 180))])), class: "stroke c-tint", fill: "none" }, svg);
    Plot.el("path", { d: Plot.path(ds.map(x => [ax.x(x), ax.y(un(x * Math.PI / 180))])), class: "stroke dash c-warn", fill: "none" }, svg);
    Plot.el("line", { x1: ax.x(d), x2: ax.x(d), y1: ax.y(0), y2: ax.y(1), class: "stroke thin dash c-label" }, svg);
    $("sfr").textContent = F.num(d, 4) + "\u00a0°";
    const z = Q.demiZ(f)[0][0];
    $("vamp").textContent = Cx.text(z, x => F.num(Math.abs(x) < 5e-13 ? 0 : x, 3));
    $("vdemi").textContent = F.num(demi(f), 3); $("fdemi").textContent = t("fig.f.demi");
    $("vun").textContent = F.num(un(f), 3);
  }
  sf.oninput = draw; draw();
  $("sys1").innerHTML = t("sys1.body", { z: F.num((720 - 704) / 38, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["pauli", 1927, "idea"], ["rauch", 1975, "experiment"], ["werner", 1975, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["echo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["module", "a"], ["lineaire", "c"], ["demi", "b"], ["tour", "d"], ["mesure", "a"], ["un", "c"], ["deux", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 603 });
})();
</script>
