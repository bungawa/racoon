<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, K = Constantes, c = K.c;
const mp = K.m_p * c * c / K.e / 1e9;                                    // proton rest energy, GeV
const gev = x => F.si(x * 1e9, "eV");

/* ---------- le système décrit : deux photons d'un boson de 125 GeV, vus dans le laboratoire ---------- */
(() => {
  const E1 = 80, E2 = 60, M = 125, cth = 1 - M * M / (2 * E1 * E2), th = Math.acos(cth);
  const L = [R.photon(E1, [1, 0, 0]), R.photon(E2, [cth, Math.sin(th), 0])];
  const P = R.sommeQuadri(L), b = R.vitesseQuadri(P);
  $("sys1").innerHTML = t("sys1.body", { E1: gev(E1), E2: gev(E2), th: t("deg", { v: F.num(th * 180 / Math.PI, 3) }),
    M: gev(R.masseInvariante(L)), S: gev(E1 + E2), b: F.num(Math.hypot(...b), 2) });
})();

/* ---------- cible fixe ou collisionneur : l'énergie disponible ---------- */
(() => {
  const svg = $("trace"), sk = $("sk");
  const Kth = R.seuilCibleFixe([mp, mp, mp, mp], mp, mp);                 // p + p → p + p + p + p̄
  const Kof = v => 10 ** (-1 + v / 100);                                  // 0,1 GeV to 10 TeV
  function draw() {
    const Kb = Kof(+sk.value), sF = R.sCibleFixe(Kb, mp, mp), sC = R.sCollisionneur(Kb, mp, Kb, mp);
    /* the same √s from the four-momenta, in the lab and in the centre-of-momentum frame */
    const g = 1 + Kb / mp, beta = Math.sqrt((1 - 1 / g) * (1 + 1 / g));
    const lab = [R.quadriImpulsion(mp, beta), R.quadriImpulsion(mp, 0)], P = R.sommeQuadri(lab), bcm = R.vitesseQuadri(P);
    const Pcm = R.boostQuadriVecteur(P, bcm);
    const Keq = (sC * sC - 4 * mp * mp) / (2 * mp);                       // fixed-target beam that gives the collider's √s
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { l: 60, b: 44 },
      x: { scale: "log", domain: [0.1, 1e4], label: t("fig.xaxis") }, y: { scale: "log", domain: [1, 1e5], label: t("fig.yaxis") } });
    const ks = Array.from({ length: 201 }, (_, i) => 10 ** (-1 + 5 * i / 200));
    Plot.el("path", { d: Plot.path(ks.map(k => [A.x(k), A.y(R.sCibleFixe(k, mp, mp))])), class: "curve" }, A.g);
    Plot.el("path", { d: Plot.path(ks.map(k => [A.x(k), A.y(R.sCollisionneur(k, mp, k, mp))])), class: "stroke" }, Plot.el("g", { class: "c-ok" }, A.g));
    Plot.el("line", { x1: A.x(0.1), x2: A.x(1e4), y1: A.y(4 * mp), y2: A.y(4 * mp), class: "ref" }, A.g);
    Plot.el("line", { x1: A.x(Kth), x2: A.x(Kth), y1: A.y(1), y2: A.y(4 * mp), class: "ref" }, A.g);
    Plot.el("circle", { cx: A.x(Kb), cy: A.y(sF), r: 5, class: "dot" }, A.g);
    Plot.el("circle", { cx: A.x(Kb), cy: A.y(sC), r: 5, class: "fill" }, Plot.el("g", { class: "c-ok" }, A.g));
    $("skr").textContent = gev(Kb);
    $("vfixe").textContent = gev(sF);
    $("ffixe").textContent = t(Kb >= Kth ? "fig.f.oui" : "fig.f.non", { K: gev(Kth) });
    $("vcm").textContent = t("fig.cm", { E: gev(Pcm[0]), p: gev(Math.hypot(Pcm[1], Pcm[2], Pcm[3]) < 1e-9 * Pcm[0] ? 0 : Math.hypot(Pcm[1], Pcm[2], Pcm[3])) });
    $("fcm").textContent = t("fig.f.cm", { b: F.num(bcm[0], 3), s: gev(Math.sqrt(R.carre(P))) });
    $("vcoll").textContent = gev(sC);
    $("fcoll").textContent = t("fig.f.coll", { r: F.num(sC / sF, 3) });
    $("vequiv").textContent = gev(Keq);
    $("fequiv").textContent = t("fig.f.equiv");
  }
  sk.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["compton", 1923, "experiment"], ["cockcroft", 1932, "experiment"], ["bevatron", 1955, "experiment"], ["higgs", 2012, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["masse"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["conserv", "b"], ["deuxphotons", "c"], ["meme", "d"], ["scalaire", "a"], ["seuil", "b"], ["lhc", "c"], ["doppler", "d"], ["gaz", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 175 });
})();
</script>
