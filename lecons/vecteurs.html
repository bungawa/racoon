<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const deg = Math.PI / 180;

/* ---------- le système décrit, chiffré ---------- */
(() => {
  const s = AlgVec.SYSTEMES.telephone, n = AlgVec.negligeables("telephone");
  $("sys").innerHTML = t("sys.body", { g: F.num(s.a, 3), ent: F.num(n.entrainement * 100, 2), rot: F.sci(n.rotation, 1), duree: F.num(s.duree, 1) });
})();

/* ---------- tourner les axes, pas la flèche ---------- */
(() => {
  const svg = $("rot"), P = Plot.el, O = [230, 160], K = 32, L = 4, AX = 140;     // 1 m = 32 px; the step is 4 m long
  const scr = p => [O[0] + K * p[0], O[1] - K * p[1]];
  const arrow = (x1, y1, x2, y2, cls, parent) => Plot.fleche(parent, [x1, y1], [x2, y2], { cls, tete: 10 });
  const label = (x, y, text, parent, cls) => { const e = P("text", { x, y, "text-anchor": "middle", class: cls || "" }, parent); e.textContent = text; return e; };
  const phisl = $("phisl"), alsl = $("alsl");
  function draw() {
    svg.innerHTML = "";
    const phi = +phisl.value * deg, al = +alsl.value * deg, a = [L * Math.cos(al), L * Math.sin(al)];
    const c = AlgVec.composantes(a, phi), ex = [Math.cos(phi), Math.sin(phi)], ey = [-Math.sin(phi), Math.cos(phi)];
    /* the old axes, faint; the new ones, turned by φ */
    [[1, 0, "rot.x"], [0, 1, "rot.y"]].forEach(([ux, uy, k]) => { const g = arrow(O[0] - 0.4 * AX * ux, O[1] + 0.4 * AX * uy, O[0] + AX * ux, O[1] - AX * uy, "c-label-2", svg); g.firstChild.setAttribute("class", "stroke thin dash"); label(O[0] + (AX + 14) * ux, O[1] - (AX + 14) * uy + 4, t(k), svg, "c-label-2"); });
    [[ex, "rot.xp"], [ey, "rot.yp"]].forEach(([u, k]) => { arrow(O[0] - 0.4 * AX * u[0], O[1] + 0.4 * AX * u[1], O[0] + AX * u[0], O[1] - AX * u[1], "c-tint", svg); label(O[0] + (AX + 16) * u[0], O[1] - (AX + 16) * u[1] + 4, t(k), svg); });
    /* projections of the tip on the new axes */
    const T = scr(a), Px = scr([c[0] * ex[0], c[0] * ex[1]]), Py = scr([c[1] * ey[0], c[1] * ey[1]]);
    P("line", { x1: T[0], y1: T[1], x2: Px[0], y2: Px[1], class: "stroke thin dash c-tint" }, svg);
    P("line", { x1: T[0], y1: T[1], x2: Py[0], y2: Py[1], class: "stroke thin dash c-tint" }, svg);
    arrow(O[0], O[1], T[0], T[1], "c-warn", svg);
    label(T[0] + 14 * Math.cos(al), T[1] - 14 * Math.sin(al), t("rot.a"), svg);
    /* side panel: the same arrow, two descriptions */
    label(520, 60, t("rot.side"), svg);
    [["rot.side.old", AlgVec.composantes(a, 0)], ["rot.side.new", c]].forEach(([k, v], i) => label(520, 92 + 26 * i, t(k, { x: F.num(v[0], 3), y: F.num(v[1], 3) }), svg));
    label(520, 150, t("rot.side.n", { n: F.num(Dyna.norme(c), 3) }), svg);
    const sq = AlgVec.ecartCovariance(AlgVec.carres, a, AlgVec.rotationPlan(phi));
    $("phiread").textContent = F.qty(phisl.value, "°");
    $("alread").textContent = F.qty(alsl.value, "°");
    $("vax").textContent = F.qty(F.fix(c[0], 2), "m"); $("fax").textContent = t("rot.f.old", { v: F.fix(a[0], 2) });
    $("vay").textContent = F.qty(F.fix(c[1], 2), "m"); $("fay").textContent = t("rot.f.old", { v: F.fix(a[1], 2) });
    $("vn").textContent = F.qty(F.fix(Dyna.norme(c), 2), "m");
    $("vsq").textContent = F.qty(F.fix(sq, 2), "m²");
  }
  phisl.oninput = alsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["stevin", 1586, "idea"], ["hamilton", 1843, "idea"], ["grassmann", 1844, "idea"], ["gibbs", 1881, "idea"], ["wilson", 1901, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["telephone", "image"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["definition", "a"], ["longueur", "a"], ["carres", "a"], ["temperature", "a"], ["rotation", "a"], ["loi", "a"], ["referentiel", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 114 });
})();
</script>
