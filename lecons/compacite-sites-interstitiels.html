<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-architecture" data-i18n="monde.chim-architecture"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-cristal-parfait" data-i18n="etape.chim-cristal-parfait"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/empilements-compacts" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>C</mi><mo>=</mo><mfrac><mrow><mi>N</mi><mo>·</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mi>π</mi><msup><mi>r</mi><mn>3</mn></msup></mrow><msup><mi>a</mi><mn>3</mn></msup></mfrac></math></div>
    <p class="validite" data-i18n-html="val.compacite"></p>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi>ρ</mi><mo>=</mo><mfrac><mrow><mi>N</mi><mi>M</mi></mrow><mrow><msub><mi>N</mi><mi mathvariant="normal">A</mi></msub><msup><mi>a</mi><mn>3</mn></msup></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.rho"></p>
    <figure>
      <div class="panel">
        <div class="controls">
          <div class="seg" id="metaux" role="group" data-i18n-attr="aria-label:m.metal">
            <button type="button" data-m="Cu" data-i18n="m.Cu"></button><button type="button" data-m="Al" data-i18n="m.Al"></button><button type="button" data-m="Ag" data-i18n="m.Ag"></button><button type="button" data-m="Au" data-i18n="m.Au"></button><button type="button" data-m="Ni" data-i18n="m.Ni"></button>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="m.k.a"></span><span class="v" id="va"></span><span class="f" id="fa"></span></div>
          <div class="stat"><span class="k" data-i18n="m.k.modele"></span><span class="v" id="vmod"></span><span class="f" data-i18n="m.f.modele"></span></div>
          <div class="stat"><span class="k" data-i18n="m.k.mesure"></span><span class="v" id="vmes"></span><span class="f" data-i18n="m.f.mesure"></span></div>
          <div class="stat"><span class="k" data-i18n="m.k.ecart"></span><span class="v" id="vecart"></span><span class="f" data-i18n="m.f.ecart"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="m.caption"></figcaption>
    </figure>
    <p data-i18n-html="s3.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <figure>
      <div class="stage"><canvas id="vue"></canvas><div class="overlay" id="vueinfo"></div></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" id="voir" role="group" data-i18n-attr="aria-label:v3.voir">
            <button type="button" data-v="T" data-i18n="v3.v.T"></button><button type="button" data-v="O" data-i18n="v3.v.O"></button><button type="button" data-v="TO" data-i18n="v3.v.TO"></button>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="v3.k.T"></span><span class="v" id="vpT"></span><span class="f" id="fpT"></span></div>
          <div class="stat"><span class="k" data-i18n="v3.k.O"></span><span class="v" id="vpO"></span><span class="f" id="fpO"></span></div>
        </div>
      </div>
      <div class="legend"><span class="el-c" data-i18n="v3.e.X"></span><span class="c-warn" data-i18n="v3.e.T"></span><span class="c-ok" data-i18n="v3.e.O"></span></div>
      <figcaption data-i18n-html="v3.caption"></figcaption>
    </figure>
    <p data-i18n-html="s4.p2"></p>
    <div class="eq"><math display="block"><msub><mi>r</mi><mi mathvariant="normal">O</mi></msub><mo>=</mo><mfrac><mi>a</mi><mn>2</mn></mfrac><mo>−</mo><mi>r</mi><mo>=</mo><mrow><mo>(</mo><msqrt><mn>2</mn></msqrt><mo>−</mo><mn>1</mn><mo>)</mo></mrow><mi>r</mi><mo>≈</mo><mn>0,414</mn><mspace width="0.2em"></mspace><mi>r</mi></math></div>
    <p class="validite" data-i18n-html="val.rO"></p>
    <div class="eq"><math display="block"><msub><mi>r</mi><mi mathvariant="normal">T</mi></msub><mo>=</mo><mfrac><mrow><mi>a</mi><msqrt><mn>3</mn></msqrt></mrow><mn>4</mn></mfrac><mo>−</mo><mi>r</mi><mo>=</mo><mrow><mo>(</mo><msqrt><mfrac><mn>3</mn><mn>2</mn></mfrac></msqrt><mo>−</mo><mn>1</mn><mo>)</mo></mrow><mi>r</mi><mo>≈</mo><mn>0,225</mn><mspace width="0.2em"></mspace><mi>r</mi></math></div>
    <p class="validite" data-i18n-html="val.rT"></p>
    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="rsl" data-i18n="ins.r"></label><output id="rread" for="rsl"></output></div>
          <input id="rsl" type="range" min="10" max="150" step="1" value="77"></div>
        <p class="caption" id="inslecture"></p>
        <div class="meter" id="jauge"><i id="jaugei"></i></div>
      </div>
      <figcaption data-i18n-html="ins.caption"></figcaption>
    </figure>
    <p data-i18n-html="s4.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/compacite-sites-interstitiels.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/cristaux.js"></script>
<script src="/racoon/lecons/reseau-motif-maille.js"></script>
<script src="/racoon/vue-cristal.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), X = Cristaux, P = CristalParfait;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const pm = x => F.si(x, "m", { prefix: "p" });
let metal = "Cu", majInsertion = () => {};

/* ---------- masse volumique : le modèle contre la mesure ---------- */
(() => {
  seg($("metaux"), "m", m => {
    metal = m; const d = P.METAUX_CFC[m], rho = P.masseVolumique(4, d.M, d.a);
    $("va").textContent = F.si(d.a, "m", { prefix: "p", sig: 5 });
    $("fa").textContent = t("m.f.a", { r: pm(P.rayonContactCFC(d.a)) });
    $("vmod").textContent = F.qty(F.num(rho, 4), "kg·m⁻³");
    $("vmes").textContent = F.qty(F.num(d.rho, 4), "kg·m⁻³");
    $("vecart").textContent = F.qty(F.fix(100 * (rho / d.rho - 1), 2), "%");
    majInsertion();
  });
})();

/* ---------- les sites de la maille, en 3D ---------- */
(() => {
  const a = P.METAUX_CFC.Cu.a, s = X.cubique("cfc", a, "X");
  const vue = VueCristal.monter($("vue"), $("vueinfo"), { hors: t("v3.hors"), reduit: reduce });
  const hote = X.atomes(s, 1), sites = k => P.SITES_CFC[k].map(f => ({ e: k, r: f.map(x => x * a) }));
  const pop = k => P.SITES_CFC[k].reduce((n, f) => n + P.poids(f), 0);
  const r = P.rayonContactCFC(a);
  seg($("voir"), "v", v => {
    const at = hote.concat(v.includes("T") ? sites("T") : [], v.includes("O") ? sites("O") : []);
    // host atoms at half their contact radius, sites at the radius of the largest sphere that fits (VueCristal: fraction of 2,5 Å)
    if (vue) vue.montrer(at, { dLiaison: 0, maille: a, couleurs: { X: "--el-c", T: "--warn", O: "--ok" },
      rayons: { X: 0.5 * r / 2.5e-10, T: P.habitabilite("T", r) / 2.5e-10, O: P.habitabilite("O", r) / 2.5e-10 } });
  });
  $("vpT").textContent = F.num(pop("T")); $("fpT").textContent = t("v3.f.T", { n: F.num(pop("T") / 4) });
  $("vpO").textContent = F.num(pop("O")); $("fpO").textContent = t("v3.f.O", { n: F.num(pop("O") / 4) });
})();

/* ---------- un atome inséré : dans quel site tient-il ? ---------- */
(() => {
  const sl = $("rsl");
  majInsertion = () => {
    const ri = +sl.value * 1e-12, r = P.rayonContactCFC(P.METAUX_CFC[metal].a);
    const rT = P.habitabilite("T", r), rO = P.habitabilite("O", r);
    const cas = ri <= rT ? "deux" : ri <= rO ? "octa" : "deforme";
    $("rread").textContent = pm(ri);
    $("inslecture").textContent = t("ins.lecture." + cas, { metal: t("m." + metal).toLowerCase(), rT: pm(rT), rO: pm(rO), r: pm(r), k: F.fix(ri / rO, 2) });
    $("jaugei").style.width = Math.min(100, 100 * ri / rO).toFixed(1) + "%";
    $("jauge").classList.toggle("over", ri > rO);
  };
  sl.oninput = majInsertion; majInsertion();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["graham", 1866, "experiment"], ["goldschmidt", 1926, "idea"], ["avogadro", 2011, "experiment"], ["si", 2019, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["silicium", "hydrogene", "acier"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["compacite", "d"], ["vide", "b"], ["rho", "a"], ["ecart", "c"], ["octa", "b"], ["tetra", "d"], ["carbone", "c"], ["avogadro", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
</html>
