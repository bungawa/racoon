<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = ChimOrga.Polymeres, F_AIBN = P.AMORCEURS.aibn.f;
const molL = c => F.qty(F.sci(c / P.MOL_L, 2), "mol·L⁻¹");

/* ---------- elementary steps ---------- */
(() => {
  const IDS = ["decomposition", "amorcage", "propagation", "combinaison", "dismutation"], txt = textOf("actes", IDS);
  $("actes").innerHTML = IDS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].eq}</span><span class="v">${txt[id].v}</span></div>`).join("");
})();

/* ---------- steady state: rate against chain length ---------- */
(() => {
  const svg = $("compromis"), sel = $("mono"), sT = $("temp"), sI = $("ini"), sM = $("mon");
  const etat = (id, T, I, M) => { const d = P.RADICALAIRE[id];
    return P.radicalaire({ kd: P.kd("aibn", T), f: F_AIBN, kp: P.kp(id, T), kt: d.kt, M, I, lambda: d.lambda }); };
  function draw() {
    const id = sel.value, T = +sT.value, I = Math.pow(10, +sI.value) * P.MOL_L, M = +sM.value * P.MOL_L, r = etat(id, T, I, M);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 60 },
      x: { scale: "log", domain: [1e-6, 1e-2], label: t("cin.x") }, y: { scale: "log", domain: [10, 1e5], label: t("cin.y") } });
    /* the curve swept by [I] at this T and [M]: X̄n ∝ 1/v_p, slope −1 */
    const pts = [];
    for (let e = -5; e <= -0.5; e += 0.05) { const q = etat(id, T, Math.pow(10, e) * P.MOL_L, M); pts.push([o.x(q.Rp / P.MOL_L), o.y(q.Xn)]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold c-tint" }, o.g);
    Plot.el("circle", { cx: o.x(r.Rp / P.MOL_L), cy: o.y(r.Xn), r: 5, class: "fill c-label" }, o.g);
    Plot.el("text", { x: o.x(r.Rp / P.MOL_L) + 8, y: o.y(r.Xn) - 8, class: "note" }, o.g).textContent = t("cin.point");
    $("tempv").innerHTML = F.kelvin(T);
    $("iniv").textContent = molL(I); $("monv").textContent = F.qty(F.num(M / P.MOL_L, 2), "mol·L⁻¹");
    $("vr").textContent = molL(r.R);
    $("ftau").textContent = t("cin.f.tau", { tau: F.si(r.tau, "s", { sig: 2 }) });
    $("vvp").textContent = F.qty(F.sci(r.Rp / P.MOL_L, 2), "mol·L⁻¹·s⁻¹");
    $("fvp").textContent = t("cin.f.vp", { p: F.qty(F.num(100 * 3600 * r.Rp / M, 2), "%") });
    $("vxn").textContent = F.num(r.Xn, 3);
    $("fxn").textContent = t("cin.f.xn", { nu: F.num(r.nu, 3), mn: F.qty(F.num(r.Xn * P.motif(id).M0, 3), "kg·mol⁻¹") });
    $("vd").textContent = F.num(r.D, 3);
    $("fd").textContent = t("cin.f.d", { l: F.qty(F.num(100 * P.RADICALAIRE[id].lambda, 2), "%") });
  }
  [sT, sI, sM].forEach(s => s.oninput = draw); sel.onchange = draw; draw();
})();

/* ---------- where the model stops ---------- */
(() => {
  const IDS = ["transfert", "gel", "inhibiteur", "chaleur"], txt = textOf("limites", IDS);
  $("limites").innerHTML = IDS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["polystyrene", 1931, "use"], ["polyethylene", 1933, "experiment"], ["plexiglas", 1933, "use"], ["reference", 1995, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  /* PlasticsEurope, « Plastics – the fast Facts 2024 » : production mondiale de 2023 et parts de chaque famille */
  const TOTAL = 413.8e9, PART = { ps: 0.052, pvc: 0.128, pebd: 0.140 };
  const USES = ["volumes", "emulsion"], uses = textOf("uses.items", USES);
  const kg = m => F.qty(F.sci(m, 2), "kg");
  const v = { tot: kg(TOTAL), ps: kg(TOTAL * PART.ps), pvc: kg(TOTAL * PART.pvc), pebd: kg(TOTAL * PART.pebd) };
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${id === "volumes" ? t("uses.volumes", v) : uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["radical", "c"], ["regio", "a"], ["aeqs", "d"], ["amorceur", "b"], ["chaine", "c"], ["temperature", "a"], ["terminaison", "d"], ["transfert", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1933 });
})();
</script>
