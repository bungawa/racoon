    <div class="box rem"><b data-i18n="cube.title"></b>
      <p id="cube"></p>
    </div>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><mi>f</mi><mo>=</mo><mfrac><mi>c</mi><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><msqrt><msup><mrow><mo>(</mo><mfrac><msub><mi>j</mi><mrow><mi>m</mi><mi>n</mi></mrow></msub><mi>a</mi></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mo>+</mo><msup><mrow><mo>(</mo><mfrac><mrow><mi>p</mi><mi>π</mi></mrow><mi>h</mi></mfrac><mo>)</mo></mrow><mn>2</mn></msup></msqrt></math></div>

    <figure class="chart">
      <svg class="fig" id="carte" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.tm"></span><span class="c-warn" data-i18n="fig.legend.te"></span><span class="c-label-2" data-i18n="fig.legend.mesure"></span></div>
      <div class="panel">

          <div class="ctl"><div class="row"><label for="sh" data-i18n="fig.h"></label><output id="shr" for="sh"></output></div>

        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.m1"></span><span class="v" id="vm1"></span><span class="f" id="fm1"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.m2"></span><span class="v" id="vm2"></span><span class="f" id="fm2"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.m3"></span><span class="v" id="vm3"></span><span class="f" id="fm3"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/modes-d-une-cavite.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/ondes-milieux.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, C = Constantes.c, TAU = 2 * Math.PI;
const nom = m => t("mode." + m.type) + m.m + m.n + m.p;

/* ---------- le cube : trois modes à la même fréquence ---------- */
(() => {
  const L = 0.0762, b = M.modesBoite(L, L, L, 1.001 * C / (Math.SQRT2 * L)), cyl = M.modesCylindre(L / 2, L, 4e9);
  $("cube").innerHTML = t("cube.body", { L: F.qty(F.num(100 * L, 3), "cm"), n: F.num(b.length, 1), f: F.si(b[0].f, "Hz"),
    f1: F.si(cyl[0].f, "Hz"), n1: nom(cyl[0]), f2: F.si(cyl[1].f, "Hz"), n2: nom(cyl[1]) });
})();

/* ---------- la carte des modes : fréquence en fonction de la hauteur ---------- */
(() => {
  const svg = $("carte"), sd = $("sd"), sh = $("sh"), hs = Array.from({ length: 281 }, (_, i) => 0.01 + 0.14 * i / 280);
  const LISTE = [["TM", 0, 1, 0], ["TE", 1, 1, 1], ["TM", 0, 1, 1], ["TE", 2, 1, 1], ["TM", 1, 1, 0], ["TE", 0, 1, 1], ["TE", 1, 1, 2], ["TM", 0, 1, 2], ["TM", 0, 2, 0], ["TE", 3, 1, 1], ["TM", 2, 1, 0], ["TE", 1, 2, 1]];
  const J = LISTE.map(([type, m, n]) => M.zeroBessel(m, n, type === "TE"));
  const freq = (j, p, a, h) => C / TAU * Math.hypot(j / a, p * Math.PI / h);
  const MESURES = [3.05e9, 3.3e9, 3.82e9];                                  // the resonances observed in the 7,6 cm can, 6,35 cm high
  function draw() {
    const a = +sd.value / 200, h = +sh.value / 100;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 56, b: 44 }, x: { domain: [1, 15], label: t("fig.xaxis") }, y: { domain: [1, 8], label: t("fig.yaxis") } });
    LISTE.forEach(([type, , , p], i) => {
      const pts = hs.map(x => [P.x(100 * x), P.y(Math.min(8, freq(J[i], p, a, x) / 1e9))]);
      Plot.el("path", { d: Plot.path(pts), class: type === "TM" ? "curve" : "stroke c-warn" }, P.g);
    });
    MESURES.forEach(f => Plot.el("circle", { cx: P.x(6.35), cy: P.y(f / 1e9), r: 4, class: "stroke bold c-label-2" }, P.g));
    Plot.el("line", { x1: P.x(100 * h), x2: P.x(100 * h), y1: P.y(1), y2: P.y(8), class: "stroke thin c-label-2" }, P.g);
    const modes = M.modesCylindre(a, h, 1.2e10).slice(0, 3);
    modes.forEach(m => Plot.el("circle", { cx: P.x(100 * h), cy: P.y(Math.min(8, m.f / 1e9)), r: 5, class: "dot" }, P.g));
    $("sdr").textContent = F.qty(F.num(2 * 100 * a, 3), "cm");
    $("shr").textContent = F.qty(F.num(100 * h, 3), "cm");
    modes.forEach((m, i) => {
      $("vm" + (i + 1)).textContent = F.si(m.f, "Hz");
      $("fm" + (i + 1)).textContent = t(m.polarisations === 2 ? "fig.f.double" : "fig.f.simple", { nom: nom(m) });
    });
  }
  sd.oninput = sh.oninput = draw; draw();
})();

/* ---------- le système décrit : compter les modes de la boîte ---------- */
(() => {
  const a = 0.0381, h = 0.0635, V = Math.PI * a * a * h, n = f => M.modesCylindre(a, h, f).reduce((s, m) => s + m.polarisations, 0);
  $("sys1").innerHTML = t("sys1.body", { V: F.qty(F.num(1e6 * V, 3), "cm³"), n5: F.num(n(5e9), 3), w5: F.num(M.weyl(V, 5e9), 2), n10: F.num(n(1e10), 3), w10: F.num(M.weyl(V, 1e10), 2),
    n20: F.num(n(2e10), 3), w20: F.num(M.weyl(V, 2e10), 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rayleigh", 1897, "idea"], ["weyl", 1911, "idea"], ["slater", 1952, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["four", "chambre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ecart", "b"], ["second", "d"], ["conditions", "a"], ["cube", "c"], ["transverse", "b"], ["fil", "a"], ["compte", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 234 });
})();
</script>
</body>
</html>
