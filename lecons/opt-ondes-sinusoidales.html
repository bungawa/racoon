    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>ω</mi><msub><mi>t</mi><mn>0</mn></msub><mo>=</mo><mn>2</mn><mi>π</mi><mo>,</mo><mspace width="2em"/><mi>k</mi><mi>λ</mi><mo>=</mo><mn>2</mn><mi>π</mi></math></div>

    <div class="eq"><math display="block"><mi>E</mi><mo>(</mo><mi>x</mi><mo>,</mo><mi>t</mi><mo>)</mo><mo>=</mo><msub><mi>E</mi><mn>0</mn></msub><mi data-i18n="eq.cos"></mi><mo>(</mo><mi>ω</mi><mi>t</mi><mo>−</mo><mi>k</mi><mi>x</mi><mo>)</mo></math></div>

    <figure class="chart">
      <svg class="fig" id="espace" role="img" data-i18n-attr="aria-label:fig.aria.espace"></svg>
      <svg class="fig" id="temps" role="img" data-i18n-attr="aria-label:fig.aria.temps"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.onde"></span><span class="c-warn" data-i18n="fig.legend.crete"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="sf" data-i18n="fig.f"></label><output id="sfr" for="sf"></output></div>
            <input id="sf" type="range" min="3" max="18" step="0.05" value="8"></div>
          <div class="ctl"><div class="row"><label for="st" data-i18n="fig.t"></label><output id="str" for="st"></output></div>
            <input id="st" type="range" min="0" max="2" step="0.01" value="0.25"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.lambda"></span><span class="v" id="vl"></span><span class="f" id="fl"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.T"></span><span class="v" id="vT"></span><span class="f" id="fT"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.crete"></span><span class="v" id="vc"></span><span class="f" id="fc"></span></div>
        </div>

    <p data-i18n-html="s2.p2"></p>

  <section class="card">

    <div class="eq"><math display="block"><mfrac><mrow><mo>|</mo><msub><mi>E</mi><mi data-i18n="eq.proche"></mi></msub><mo>|</mo></mrow><mrow><mo>|</mo><msub><mi>E</mi><mi data-i18n="eq.rayonne"></mi></msub><mo>|</mo></mrow></mfrac><mo>=</mo><msqrt><msup><mrow><mo>(</mo><mfrac><mi>λ</mi><mrow><mn>2</mn><mi>π</mi><mi>r</mi></mrow></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mo>+</mo><msup><mrow><mo>(</mo><mfrac><mi>λ</mi><mrow><mn>2</mn><mi>π</mi><mi>r</mi></mrow></mfrac><mo>)</mo></mrow><mn>4</mn></msup></msqrt></math></div>

            <input id="sz" type="range" min="-2" max="2" step="0.01" value="0.48"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.rapport"></span><span class="v" id="vz"></span><span class="f" id="fz"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/quiz.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, c = Constantes.c;

/* ---------- one wave, two pictures: in space at time t, in time at x = 0 ---------- */
(() => {
  const esp = $("espace"), tps = $("temps"), sf = $("sf"), st = $("st");
  function draw() {
    const f = 10 ** +sf.value, s = O.sinusoide(f), u = +st.value, tt = u * s.T;   // u = t/T
    /* space, in wavelengths: cos(ωt − kx) at the chosen instant; the crest that was at x = 0 at t = 0 */
    esp.innerHTML = "";
    const xs = Array.from({ length: 301 }, (_, i) => i / 100);
    const A = Plot.axes(esp, { fmt: F, w: 640, h: 200, pad: { l: 64, b: 44 }, x: { domain: [0, 3], label: t("fig.xesp") }, y: { domain: [-1.2, 1.2], label: t("fig.ye") } });
    Plot.el("line", { x1: A.x(0), x2: A.x(3), y1: A.y(0), y2: A.y(0), class: "zero" }, A.g);
    Plot.el("path", { d: Plot.path(xs.map(x => [A.x(x), A.y(Math.cos(O.phase(s.omega, s.k, x * s.lambda, tt)))])), class: "curve" }, A.g);
    const xc = s.v * tt / s.lambda;                                               // the crest, in wavelengths
    if (xc <= 3) Plot.el("circle", { cx: A.x(xc), cy: A.y(1), r: 5, class: "fill c-warn" }, A.g);
    /* time, in periods: the field at x = 0 */
    tps.innerHTML = "";
    const ts = Array.from({ length: 301 }, (_, i) => i / 100);
    const B = Plot.axes(tps, { fmt: F, w: 640, h: 200, pad: { l: 64, b: 44 }, x: { domain: [0, 3], label: t("fig.xtps") }, y: { domain: [-1.2, 1.2], label: t("fig.ye") } });
    Plot.el("line", { x1: B.x(0), x2: B.x(3), y1: B.y(0), y2: B.y(0), class: "zero" }, B.g);
    Plot.el("path", { d: Plot.path(ts.map(v => [B.x(v), B.y(Math.cos(O.phase(s.omega, s.k, 0, v * s.T)))])), class: "curve" }, B.g);
    Plot.el("circle", { cx: B.x(u), cy: B.y(Math.cos(O.phase(s.omega, s.k, 0, tt))), r: 5, class: "dot" }, B.g);
    $("sfr").textContent = F.si(f, "Hz");
    $("str").textContent = t("fig.tval", { u: F.num(u, 3) });
    $("vl").textContent = F.si(s.lambda, "m");
    $("fl").innerHTML = t("fig.f.lambda", { k: F.si(s.k, "rad·m⁻¹"), b: t("bande." + Fondamentale.band(f)) });
    $("vT").textContent = F.si(s.T, "s");
    $("fT").innerHTML = t("fig.f.T", { w: F.si(s.omega, "rad·s⁻¹") });
    $("vc").textContent = F.si(s.v * tt, "m");
    $("fc").innerHTML = t("fig.f.crete", { t: F.si(tt, "s") });
  }
  sf.oninput = st.oninput = draw; draw();
})();

/* ---------- how far is far: the near terms of a dipole against the radiated one ---------- */
(() => {
  const z = $("zone"), sz = $("sz");
  function draw() {
    const q = 10 ** +sz.value, R = O.zoneOnde(q, 1);
    z.innerHTML = "";
    const P = Plot.axes(z, { fmt: F, w: 640, h: 240, pad: { l: 64, b: 44 }, x: { scale: "log", domain: [0.01, 100], label: t("fig.xzone") }, y: { scale: "log", domain: [1e-3, 1e4], label: t("fig.yzone") } });
    const qs = Array.from({ length: 81 }, (_, i) => 10 ** (-2 + i / 20));
    Plot.el("path", { d: Plot.path(qs.map(v => [P.x(v), P.y(O.zoneOnde(v, 1).rapport)])), class: "curve" }, P.g);
    Plot.el("line", { x1: P.x(0.01), x2: P.x(100), y1: P.y(1), y2: P.y(1), class: "zero" }, P.g);
    Plot.el("circle", { cx: P.x(q), cy: P.y(R.rapport), r: 5, class: "dot" }, P.g);
    $("szr").textContent = F.num(q, 3);
    $("vz").textContent = R.rapport >= 1 ? F.num(R.rapport, 3) : F.qty(F.num(100 * R.rapport, 2), "%");
    $("fz").innerHTML = t(R.rapport > 1 ? "fig.f.proche" : R.rapport > 0.1 ? "fig.f.entre" : "fig.f.onde", { kr: F.num(R.kr, 3) });
  }
  sz.oninput = draw; draw();
})();

/* ---------- the system described: a card reader and a radio set ---------- */
(() => {
  const nfc = O.sinusoide(13.56e6), rc = 0.04, fm = O.sinusoide(1e8), rf = 1e4;
  $("sys1").innerHTML = t("sys1.body", { l1: F.si(nfc.lambda, "m"), r1: F.si(rc, "m"), q1: F.sci(rc / nfc.lambda, 2), z1: F.sci(O.zoneOnde(rc, nfc.lambda).rapport, 2),
    l2: F.si(fm.lambda, "m"), r2: F.si(rf, "m"), q2: F.sci(rf / fm.lambda, 2), z2: F.sci(O.zoneOnde(rf, fm.lambda).rapport, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hertz", 1888, "experiment"], ["krypton", 1960, "use"], ["metre", 1983, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["carte"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["k", "c"], ["periode", "a"], ["fm", "b"], ["vitesse", "d"], ["sens", "a"], ["dispersion", "c"], ["loin", "b"], ["proche", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 293 });
})();
</script>
