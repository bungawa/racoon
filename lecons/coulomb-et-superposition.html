<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9;
const Vm = x => F.si(x, "V·m⁻¹");

/* ---------- le système décrit, chiffré : deux sphères de 1 mm à 5 cm, chargées à 1 nC ---------- */
(() => {
  const a = 1e-3, r = 0.05, q = NC, f = ES.K * q * q / (r * r);
  $("sys").innerHTML = t("sys.body", { f: F.si(f, "N"), ar: F.num(a / r, 2), err: F.sci(4 * (a / r) ** 3, 1) });
})();

/* ---------- superposition : trois charges, une sonde que l'on déplace (positions en m) ---------- */
(() => {
  const svg = $("sup"), O = { W: 640, H: 400, x0: -0.08, x1: 0.08, y0: -0.05, y1: 0.05 }, q2sl = $("q2sl");
  const PLACES = [[-0.035, -0.005], [0.025, 0.015], [0.015, -0.025]], BASE = [2, -1, 1];
  let probe = [-0.005, 0.02], c;
  const charges = () => PLACES.map((p, i) => ({ q: (i === 1 ? +q2sl.value : BASE[i]) * NC, x: p[0], y: p[1] }));
  function draw() {
    const Q = charges(), E = p => ES.champ(Q, p);
    c = CarteChamp.carte(svg, O);
    CarteChamp.fleches(c, p => (Q.some(s => Math.hypot(p[0] - s.x, p[1] - s.y) < 0.006) ? [NaN, NaN] : E(p)), 20, 12, { cls: "c-label-2", unitaire: true, lmax: 11 });
    Q.forEach((s, i) => { if (s.q !== 0) CarteChamp.point(c, [s.x, s.y], 4 + 2.5 * Math.abs(s.q) / NC, s.q > 0 ? "c-warn" : "c-label", t("sup.nom", { i: i + 1 }), -14); });
    const parts = ES.contributions(Q, probe), sum = ES.champ(Q, probe), norms = parts.map(v => Math.hypot(v[0], v[1]));
    const big = Math.max(...norms, Math.hypot(...sum)), L = n => 110 * n / big;
    const g = c.layer("c-tint");
    parts.forEach((v, i) => { if (norms[i] > 0) CarteChamp.fleche(c, probe, v, L(norms[i]), "", g); });
    CarteChamp.fleche(c, probe, sum, L(Math.hypot(...sum)), "c-ok");
    CarteChamp.point(c, probe, 3.5, "c-ok");
    $("q2read").textContent = F.si(+q2sl.value * NC, "C", { prefix: "n" });
    $("vsomme").textContent = Vm(Math.hypot(...sum));
    $("vnormes").textContent = Vm(norms.reduce((s, x) => s + x, 0));
    $("vforce").textContent = F.si(NC * Math.hypot(...sum), "N");
  }
  CarteChamp.survol(svg, () => c, p => { if (!PLACES.some(q => Math.hypot(p[0] - q[0], p[1] - q[1]) < 0.004)) { probe = [Math.max(O.x0, Math.min(O.x1, p[0])), Math.max(O.y0, Math.min(O.y1, p[1]))]; draw(); } });
  q2sl.oninput = draw; draw();
})();

/* ---------- une baguette chargée : n points, puis l'intégrale ---------- */
(() => {
  const svg = $("bag"), O = { W: 640, H: 320, x0: -0.12, x1: 0.12, y0: -0.06, y1: 0.06 }, nsl = $("nsl"), Q = NC, L = 0.1;
  let probe = [0.07, 0.03], c;
  function draw() {
    const n = 1 << +nsl.value, pts = ES.baguette(Q, L, n), ex = ES.baguetteExacte(Q, L, probe).E, en = ES.champ(pts, probe);
    const r = Math.hypot(...probe), pt = ES.K * Q / (r * r), nex = Math.hypot(...ex);
    c = CarteChamp.carte(svg, O);
    const rod = c.layer("c-label-2");
    Plot.el("line", { x1: c.sx(-L / 2), x2: c.sx(L / 2), y1: c.sy(0), y2: c.sy(0), class: "stroke bold" }, rod);
    const dots = c.layer("c-warn");
    pts.forEach(s => Plot.el("circle", { cx: c.sx(s.x).toFixed(1), cy: c.sy(0), r: n > 32 ? 1.6 : 3, class: "fill" }, dots));
    const big = Math.max(nex, Math.hypot(...en)), len = v => 120 * Math.hypot(...v) / big;
    CarteChamp.fleche(c, probe, ex, len(ex), "c-ok");
    CarteChamp.fleche(c, probe, en, len(en), "c-tint");
    CarteChamp.point(c, probe, 3.5, "c-ok");
    const gap = Math.hypot(en[0] - ex[0], en[1] - ex[1]) / nex;
    $("nread").textContent = String(n);
    $("vexact").textContent = Vm(nex);
    $("fexact").textContent = t("bag.f.exact", { r: F.num(r / L, 2) });
    $("vbsomme").textContent = Vm(Math.hypot(...en));
    $("fbsomme").textContent = t("bag.f.somme", { e: gap < 1e-4 ? F.sci(gap, 1) : F.qty(F.num(100 * gap, 2), "%") });
    $("vpoint").textContent = F.qty(F.num(100 * Math.abs(pt - nex) / nex, 2), "%");
  }
  CarteChamp.survol(svg, () => c, p => { if (Math.abs(p[1]) > 0.004 || Math.abs(p[0]) > L / 2 + 0.004) { probe = [Math.max(O.x0, Math.min(O.x1, p[0])), Math.max(O.y0, Math.min(O.y1, p[1]))]; draw(); } });
  nsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["priestley", 1767, "idea"], ["cavendish", 1773, "experiment"], ["coulomb", 1785, "experiment"], ["maxwell", 1879, "experiment"],
    ["ewald", 1921, "idea"], ["williams", 1971, "experiment"], ["greengard", 1987, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["simulation", "constante"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["double", "c"], ["troisieme", "a"], ["normes", "d"], ["test", "b"], ["baguette", "a"], ["points", "c"], ["exposant", "b"], ["neutre", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 42 });
})();
</script>
