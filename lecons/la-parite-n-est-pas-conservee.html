<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Principes, C = Constantes;
const KEV = 1e3 * C.e, MC2 = C.m_e * C.c * C.c, A_CO = -1;          // ⁶⁰Co → ⁶⁰Ni* : pure Gamow-Teller, A = −1 (V − A)
const pct = x => F.qty(F.num(100 * x, 3), "%");

/* ---------- l'expérience de Wu et son image ---------- */
(() => {
  const svg = $("vue"), sp = $("sp"), st = $("st"), seg = $("champ");
  let sens = 1;                                                // +1: field, hence nuclear spin, upwards
  const Y = 165, CX = [160, 480], R = 100, N = [1, 0, 0];
  /* a polar curve r(θ) = R W(θ)/2 around the source, θ measured from the vector J (drawn up or down) */
  const courbe = (cx, W, haut, cls) => {
    const pts = []; for (let k = 0; k <= 180; k++) { const th = 2 * Math.PI * k / 180, r = R * W(th) / 2;
      pts.push([cx + r * Math.sin(th), Y - haut * r * Math.cos(th)]); }
    Plot.el("path", { d: Plot.path(pts) + "Z", class: cls }, svg);
  };
  function scene(cx, J, W, loi, titre) {
    const haut = Math.sign(J[2]);
    Plot.el("ellipse", { cx, cy: Y + 125, rx: 58, ry: 10, class: "stroke c-label-2" }, svg);           // the coil below the source
    const s = haut;                                             // front of the coil: current to the right when J is up (right hand)
    Plot.fleche(svg, [cx - 14 * s, Y + 135], [cx + 14 * s, Y + 135], { cls: "c-label-2", trait: "stroke" });
    courbe(cx, W, haut, "stroke bold c-tint");
    if (loi) courbe(cx, loi, haut, "stroke dash c-warn");
    Plot.fleche(svg, [cx, Y], [cx, Y - haut * 75], { cls: "c-label-2", trait: "stroke bold" });
    Plot.el("circle", { cx, cy: Y, r: 5, class: "fill c-label" }, svg);
    Plot.el("text", { x: cx + 8, y: Y - haut * 68 }, svg).textContent = t("fig.j");
    Plot.el("text", { x: cx, y: 24, "text-anchor": "middle" }, svg).textContent = t(titre);
  }
  function draw() {
    const Pn = +sp.value, T = +st.value * KEV, beta = P.betaCinetique(T, MC2), a = P.coefficientWu(A_CO, Pn, beta);
    const J = [0, 0, sens], W = P.distributionBeta(a);
    /* the mirror (normal x) keeps the vertical; J is axial, it turns over; the electrons' momenta are polar */
    const Jm = P.transformer(P.miroir(N), J, "axial");
    const loiMiroir = P.distributionBeta(a);                                           // what the law gives around Jm
    svg.innerHTML = "";
    Plot.el("line", { x1: 320, y1: 36, x2: 320, y2: 300, class: "stroke dash c-label-2" }, svg);
    scene(CX[0], J, W, null, "fig.t.reel");
    /* right: the picture of the left scene, plus (dashes) what the same law predicts for the turned-over J */
    scene(CX[1], Jm, th => W(Math.PI - th), loiMiroir, "fig.t.miroir");
    const fh = P.fractionAvant(a);                                   // share emitted along J
    $("spr").textContent = pct(Pn); $("str").textContent = t("fig.tread", { T: F.si(T / C.e, "eV", { prefix: "k" }), b: F.num(beta, 3) });
    $("va").textContent = F.num(a, 3); $("fa").textContent = t(a < 0 ? "fig.f.a" : "fig.f.a0");
    const enHaut = sens > 0 ? fh : 1 - fh;
    $("vh").textContent = pct(enHaut); $("fh").textContent = t("fig.f.haut", { bas: pct(1 - enHaut) });
    $("vm").textContent = pct(1 - fh); $("fm").textContent = t("fig.f.miroir", { loi: pct(fh) });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === sens)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { sens = +b.dataset.v; draw(); });
  sp.oninput = st.oninput = draw; draw();
})();

/* ---------- le système décrit ---------- */
(() => {
  const T = 317 * KEV, beta = P.betaCinetique(T, MC2), Pn = 0.6, a = P.coefficientWu(A_CO, Pn, beta);
  const bWu = 0.6, aWu = 0.4, PWu = 0.6;                              // Wu et al. 1957: |a| ≈ 0,4 at v/c ≈ 0,6, ⟨Iz⟩/I ≈ 0,6
  $("sys").innerHTML = t("sys.body", { T: F.si(T / C.e, "eV", { prefix: "k" }), beta: F.num(beta, 2), P: F.num(Pn, 2), a: F.num(a, 2),
    bas: pct(1 - P.fractionAvant(a)), bWu: F.num(bWu, 2), aWu: F.num(aWu, 2), PWu: F.num(PWu, 2),
    aMod: F.num(Math.abs(P.coefficientWu(A_CO, PWu, bWu)), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["leeyang", 1956, "idea"], ["wu", 1957, "experiment"], ["garwin", 1957, "experiment"], ["nobel", 1957, "idea"], ["goldhaber", 1958, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["qweak"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tau", "b"], ["miroir", "d"], ["champ", "a"], ["froid", "c"], ["vitesse", "b"], ["main", "a"], ["neutrino", "d"], ["image", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 527 });
})();
</script>
