<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions;
const V = (x, d = 2) => F.qty(F.fix(x, d), "V");

/* ---------- diagramme du fer, calculé ---------- */
(() => {
  const svg = $("diag"), PH = [0, 14], EV = [-1, 1.5];
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 420, pad: { b: 44 },
    x: { domain: PH, label: t("diag.x"), ticks: 7 }, y: { domain: EV, label: t("diag.y") } });
  const layer = Plot.el("g", {}, g), eauG = Plot.el("g", {}, g), dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  const csl = $("csl"), btn = $("eau");
  let d, point = [8, 0.1], eauOn = true;
  /* the two water lines, fixed */
  [0, 1].forEach(k => { const w = pH => k ? C.eau(pH).O2 : C.eau(pH).H2;
    Plot.el("path", { d: Plot.path(PH.map(pH => [x(pH), y(w(pH))])), class: "ref" }, eauG);
    Plot.el("text", { x: x(12.2), y: y(w(12.2)) - 6, class: "note" }, eauG).textContent = t(k ? "diag.o2" : "diag.h2"); });
  const lire = () => {
    const [pH, E] = point, s = C.especeStable(d, pH, E), w = C.eau(pH);
    dot.setAttribute("cx", x(pH)); dot.setAttribute("cy", y(E));
    $("pt").textContent = t("diag.ptv", { pH: F.fix(pH, 1) }); $("ptf").textContent = V(E);
    $("esp").textContent = t("diag.label", { s: C.texte(s.s) }); $("espf").textContent = t(s.phase === "solide" ? "diag.solide" : "diag.dissous", { n: s.n ? "+" + s.n : "0" });
    const etat = E > w.O2 ? "ox" : E < w.H2 ? "red" : "stable";
    $("weau").textContent = t("diag.eau." + etat); $("weauf").textContent = t("diag.eauf", { o: V(w.O2), h: V(w.H2) });
  };
  const draw = () => {
    const lc = +csl.value;
    d = C.diagrammeEpH(C.FER, { c: Math.pow(10, lc), pH: PH, E: EV });
    $("cread").textContent = t("diag.cv", { c: F.qty(F.sci(Math.pow(10, lc), 2), "mol·L⁻¹") });
    layer.textContent = "";
    for (const e of d.especes) {
      if (!e.poly.length) continue;
      const pts = e.poly.map(([a, b]) => [x(a), y(b)]);
      if (e.phase === "solide") Plot.el("path", { d: Plot.path(pts) + "Z", class: "area" }, layer);
      const cx = pts.reduce((s, q) => s + q[0], 0) / pts.length, cy = pts.reduce((s, q) => s + q[1], 0) / pts.length;
      Plot.el("text", { x: cx, y: cy, "text-anchor": "middle", class: "note" }, layer).textContent = t("diag.label", { s: C.texte(e.s) });
    }
    for (const f of d.frontieres) Plot.el("path", { d: Plot.path(f.seg.map(([a, b]) => [x(a), y(b)])), class: "curve" }, layer);
    $("frontieres").innerHTML = d.frontieres.map(f => {
      const nom = t("diag.couple", { a: C.texte(f.s1), b: C.texte(f.s2) });
      const v = f.verticale ? t("diag.fv", { pH: F.fix(f.pH, 2) })
        : Math.abs(f.pente) < 1e-9 ? t("diag.fh", { E: V(f.E0) })
        : t("diag.fo", { E: F.fix(f.E0, 2), p: F.fix(-f.pente, 3) });
      return `<div><span class="k">${nom}</span><span>${v}</span></div>`;
    }).join("");
    lire();
  };
  csl.oninput = draw;
  btn.onclick = () => { eauOn = !eauOn; btn.setAttribute("aria-pressed", eauOn); eauG.setAttribute("display", eauOn ? "inline" : "none"); };
  svg.addEventListener("pointerdown", ev => {
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    const px = (ev.clientX - r.left) * vb.width / r.width, py = (ev.clientY - r.top) * vb.height / r.height;
    point = [Math.min(Math.max(x.inv(px), PH[0]), PH[1]), Math.min(Math.max(y.inv(py), EV[0]), EV[1])]; lire();
  });
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["nernst", 1889, "idea"], ["sorensen", 1909, "idea"], ["pourbaix", 1945, "idea"], ["cebelcor", 1951, "use"], ["atlas", 1963, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["corrosion", "zinc", "eaux"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pente", "b"], ["vertical", "c"], ["conc", "a"], ["horiz", "d"], ["eau", "b"], ["clou", "a"], ["dism", "c"], ["cinetique", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
