<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const deg = Math.PI / 180, T = Tenseurs;

/* ---------- §31-2 : tourner les axes, ou le cristal ---------- */
(() => {
  /* calcite at 590 nm, crystal axes: x along the optic axis. α/ε₀ = χ = n² − 1 */
  const ALPHA = T.diag(1.486 ** 2 - 1, 1.658 ** 2 - 1, 1.658 ** 2 - 1);
  const E0 = [Math.cos(25 * deg), Math.sin(25 * deg), 0];            // a fixed field, in the crystal axes
  let quoi = "axes", autour = "z";
  const svg = $("axes"), S = 110;
  const fmt = x => (Math.abs(x) < 5e-4 ? "0" : F.fix(x, 3));
  const mat = M => `<math display="block"><msup><mi>α</mi><mo>′</mo></msup><mo>/</mo><msub><mi>ε</mi><mn>0</mn></msub><mo>=</mo><mrow><mo>(</mo><mtable>${M.map(r => `<mtr>${r.map(x => `<mtd><mn>${fmt(x)}</mn></mtd>`).join("")}</mtr>`).join("")}</mtable><mo>)</mo></mrow></math>`;
  const line = (u, cls, label) => {
    Plot.el("line", { x1: -u[0] * S, y1: u[1] * S, x2: u[0] * S, y2: -u[1] * S, class: cls }, svg);
    if (label) Plot.el("text", { x: u[0] * (S + 6), y: -u[1] * (S + 6) - 6, "text-anchor": u[0] < -0.2 ? "end" : "start" }, svg).textContent = label;
  };
  function upd() {
    ["axes", "cristal"].forEach(q => $("q-" + q).setAttribute("aria-pressed", String(q === quoi)));
    ["z", "d"].forEach(a => $("a-" + a).setAttribute("aria-pressed", String(a === autour)));
    const phi = +$("phi").value * deg, axe = autour === "z" ? [0, 0, 1] : [1, 1, 1];
    /* turning the axes by φ: rows of R are the new axes, R = rotation(φ)ᵀ. Turning the crystal by φ, axes fixed: the same as turning the axes by −φ */
    const R = T.transposee(T.rotation(axe, quoi === "axes" ? phi : -phi));
    const A = T.changementBase(ALPHA, R);
    const Ep = T.appliquer(R, E0), Pp = T.appliquer(R, T.appliquer(ALPHA, E0));
    const ecart = Math.hypot(...T.appliquer(A, Ep).map((x, i) => x - Pp[i]));
    $("mat").innerHTML = mat(A);
    $("phiv").textContent = (phi < 0 ? F.MINUS : "") + F.num(Math.abs(+$("phi").value), 3) + "°";
    $("vtr").textContent = F.fix(T.trace(A), 4);
    $("vdet").textContent = F.fix(T.det(A), 4);
    $("vecart").textContent = ecart < 1e-12 ? "< 10⁻¹²" : F.sci(ecart, 2);
    /* drawing, seen along z: the crystal and its field are fixed when the axes turn, and turn when the crystal turns */
    svg.innerHTML = "";
    const Rc = quoi === "axes" ? T.identite() : T.rotation(axe, phi);          // where the crystal is, in the page
    const Ra = quoi === "axes" ? T.rotation(axe, phi) : T.identite();          // where the axes are, in the page
    const col = (M, k) => [M[0][k], M[1][k], M[2][k]];
    line(col(Rc, 0), "stroke thin dash c-label-2", t("ax.fig.optique"));
    const e = T.appliquer(Rc, E0);
    Plot.el("line", { x1: 0, y1: 0, x2: e[0] * S * 0.8, y2: -e[1] * S * 0.8, class: "stroke bold c-warn" }, svg);
    Plot.el("circle", { cx: e[0] * S * 0.8, cy: -e[1] * S * 0.8, r: 4, class: "fill c-warn" }, svg);
    line(col(Ra, 0), "stroke c-tint", t("ax.fig.x"));
    line(col(Ra, 1), "stroke c-tint", t("ax.fig.y"));
  }
  [["q-axes", () => quoi = "axes"], ["q-cristal", () => quoi = "cristal"], ["a-z", () => autour = "z"], ["a-d", () => autour = "d"]]
    .forEach(([id, f]) => $(id).onclick = () => { f(); upd(); });
  $("phi").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gibbs", 1884, "idea"], ["voigt", 1898, "idea"], ["ricci", 1901, "idea"], ["einstein", 1916, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["composite", "logiciel"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["quart", "b"], ["trace", "d"], ["croise", "a"], ["deuxR", "c"], ["cristal", "b"], ["partout", "d"], ["pli", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 312 });
})();
</script>
