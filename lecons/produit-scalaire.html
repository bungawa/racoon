    <div class="eq"><math display="block"><mfrac><mrow><mi mathvariant="normal">d</mi><msub><mi>E</mi><mi mathvariant="normal">c</mi></msub></mrow><mrow><mi mathvariant="normal">d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>m</mi><mspace width="0.1em"/><mover accent="true"><mi>v</mi><mo>→</mo></mover><mo>·</mo><mfrac><mrow><mi mathvariant="normal">d</mi><mover accent="true"><mi>v</mi><mo>→</mo></mover></mrow><mrow><mi mathvariant="normal">d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mover accent="true"><mi>F</mi><mo>→</mo></mover><mo>·</mo><mover accent="true"><mi>v</mi><mo>→</mo></mover></math></div>

<script src="/racoon/i18n.js"></script>

<script src="/racoon/lecons/dynamique.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/integration.js"></script>

<script src="/racoon/lecons/algebre-vectorielle.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const deg = Math.PI / 180;

/* ---------- le système décrit, chiffré ---------- */
(() => {
  const s = AlgVec.SYSTEMES.luge, n = AlgVec.negligeables("luge");
  $("sys").innerHTML = t("sys.body", { F: F.num(s.F, 2), d: F.num(s.d, 2), v: F.num(s.v, 1), rel: F.sci(n.rel, 1), point: F.num(n.point, 1) });
})();

/* ---------- la luge : F·d par composantes, dans des axes qu'on tourne ---------- */
(() => {
  const svg = $("luge"), P = Plot.el, O = [250, 190], KF = 1.6, KD = 16, AX = 170, D = AlgVec.SYSTEMES.luge.d, V = AlgVec.SYSTEMES.luge.v;
  const arrow = (A, B, cls, parent) => Plot.fleche(parent, A, B, { cls, tete: 10 });
  const label = (p, text, parent) => { const e = P("text", { x: p[0], y: p[1], "text-anchor": "middle" }, parent); e.textContent = text; return e; };
  const S = ["thsl", "fsl", "phisl"].map($);
  const pair = v => "(" + F.fix(v[0], 1) + " ; " + F.fix(v[1], 1) + ")";
  function draw() {
    svg.innerHTML = "";
    const [th, f, phi] = [+S[0].value * deg, +S[1].value, +S[2].value * deg];
    const Fv = [f * Math.cos(th), f * Math.sin(th)], d = [D, 0];
    const Fc = AlgVec.composantes(Fv, phi), dc = AlgVec.composantes(d, phi), W = Travail.scalaire(Fc, dc);
    const ex = [Math.cos(phi), Math.sin(phi)], ey = [-Math.sin(phi), Math.cos(phi)];
    /* the ground, the turned axes */
    P("line", { x1: 20, y1: O[1], x2: 620, y2: O[1], class: "stroke thin c-label-2" }, svg);
    [[ex, "luge.xp"], [ey, "luge.yp"]].forEach(([u, k]) => {
      const g = arrow([O[0] - 0.5 * AX * u[0], O[1] + 0.5 * AX * u[1]], [O[0] + AX * u[0], O[1] - AX * u[1]], "c-label-2", svg); g.firstChild.setAttribute("class", "stroke thin dash");
      label([O[0] + (AX + 14) * u[0], O[1] - (AX + 14) * u[1] + 4], t(k), svg);
    });
    /* the displacement and the pull, from the same point */
    arrow(O, [O[0] + KD * D, O[1]], "c-warn", svg);
    const Ft = [O[0] + KF * Fv[0], O[1] - KF * Fv[1]];
    arrow(O, Ft, "c-tint", svg);
    /* the projection of F on the displacement: F cos θ */
    P("line", { x1: Ft[0], y1: Ft[1], x2: Ft[0], y2: O[1], class: "stroke thin dash c-tint" }, svg);
    label([O[0] + KD * D + 4, O[1] + 20], t("luge.d"), svg);
    label([Ft[0] + 10 * Math.cos(th), Ft[1] - 10 * Math.sin(th) - 4], t("luge.F"), svg);
    label([O[0] - 30, O[1] + 20], t("luge.luge"), svg);
    $("thread").textContent = F.qty(S[0].value, "°");
    $("fread").textContent = F.qty(S[1].value, "N");
    $("phiread").textContent = F.qty(S[2].value, "°");
    $("vcomp").textContent = F.qty(F.fix(W, 0), "J");
    $("fcomp").textContent = t("luge.f.comp", { F: pair(Fc), d: pair(dc) });
    $("vcos").textContent = F.qty(F.fix(f * D * Math.cos(th), 0), "J");
    $("vp").textContent = F.qty(F.fix(Travail.puissance(Fv, [V, 0]), 0), "W");
    $("vx").textContent = F.qty(F.fix(Dyna.norme(AlgVec.vectoriel([Fv[0], Fv[1], 0], [D, 0, 0])), 0), "N·m");
  }
  S.forEach(s => s.oninput = draw); draw();
})();

/* ---------- la clé : un moment chiffré ---------- */
(() => {
  const r = [0.25, 0, 0], f = 40, a = 30 * deg, M = AlgVec.vectoriel(r, [f * Math.cos(a), f * Math.sin(a), 0]), M90 = AlgVec.vectoriel(r, [0, f, 0]);
  $("cle").innerHTML = t("s4.cle", { r: F.num(r[0], 2), f: F.num(f, 2), m90: F.num(M90[2], 2), m30: F.num(M[2], 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hamilton", 1843, "idea"], ["grassmann", 1844, "idea"], ["gibbs", 1881, "idea"], ["heaviside", 1893, "idea"], ["wilson", 1901, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["solaire", "cle"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["invariant", "a"], ["perpendiculaire", "a"], ["luge", "a"], ["retenir", "a"], ["energie", "a"], ["puissance", "a"], ["vectoriel", "a"], ["base", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 117 });
})();
</script>
