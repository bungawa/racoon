<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, MU0 = Constantes.mu0;
/* the ring of the figure: 200 turns on a torus of radii 4,5 cm and 5 cm */
const NT = 200, RA = 0.045, RB = 0.05;

/* ---------- le système décrit : un tore épais, un tore mince ---------- */
(() => {
  const e = M.toreRowland(200, 1, 0.04, 0.05), m = M.toreRowland(NT, 1, RA, RB);
  $("sys1").innerHTML = t("sys1.body", { H: F.si(e.H, "A·m⁻¹", { sig: 3 }), Hi: F.si(e.Hint, "A·m⁻¹", { sig: 3 }), He: F.si(e.Hext, "A·m⁻¹", { sig: 3 }),
    ec: F.qty(F.num(100 * e.ecart, 2), "%"), ecm: F.qty(F.num(100 * m.ecart, 2), "%") });
})();

/* ---------- le cycle d'hystérésis du modèle de Jiles et Atherton ---------- */
(() => {
  const svg = $("cycle"), sh = $("sh"), sk = $("sk"), l = M.toreRowland(NT, 1, RA, RB).l;
  function draw() {
    const Hm = Math.pow(10, +sh.value), k = Math.pow(10, +sk.value), p = Object.assign({}, M.ACIER_JA, { k });
    const c = M.cycleHysteresis(p, Hm, { n: 300 }), X = Hm / 1e3;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 360, x: { domain: [-X, X], label: t("fig.ax.x") }, y: { domain: [-2.2, 2.2], label: t("fig.ax.y") } });
    const trace = (pts, cls) => Plot.el("path", { d: Plot.path(pts.map(q => [P.x(q[0] / 1e3), P.y(Math.max(-2.2, Math.min(2.2, q[1])))])), class: cls }, svg);
    const anh = []; for (let i = 0; i <= 200; i++) { const h = -Hm + 2 * Hm * i / 200; anh.push([h, MU0 * (h + c.anh(h))]); }
    trace([[-Hm, -MU0 * Hm], [Hm, MU0 * Hm]], "stroke thin c-ok");
    trace(anh, "stroke thin dash c-warn");
    trace(c.premiere, "stroke c-label-2");
    trace(c.descendante, "stroke bold c-tint"); trace(c.montante, "stroke bold c-tint");
    $("shr").innerHTML = F.si(Hm, "A·m⁻¹", { sig: 2 });
    $("skr").innerHTML = F.si(k, "A·m⁻¹", { sig: 2 });
    $("vbr").innerHTML = F.si(c.Br, "T", { sig: 3 });
    $("fbr").innerHTML = t("fig.f.br");
    $("vhc").innerHTML = F.si(c.Hc, "A·m⁻¹", { sig: 3 });
    $("fhc").innerHTML = t("fig.f.hc", { I: F.si(c.Hc * l / NT, "A", { sig: 2 }) });
    $("vmu").textContent = F.num(c.muApp, 3);
    $("fmu").innerHTML = t("fig.f.mu", { B: F.si(c.Bmax, "T", { sig: 3 }) });
    $("vi").innerHTML = F.si(Hm * l / NT, "A", { sig: 2 });
    $("fi").innerHTML = t("fig.f.i", { N: F.num(NT, 3), l: F.si(l, "m", { sig: 3 }) });
  }
  sh.oninput = sk.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rowland", 1873, "experiment"], ["warburg", 1881, "experiment"], ["ewing", 1885, "idea"], ["jiles", 1986, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["epstein"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tore", "c"], ["double", "a"], ["remanence", "b"], ["coercitif", "d"], ["anneau", "c"], ["pente", "a"], ["mur", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 363 });
})();
</script>
