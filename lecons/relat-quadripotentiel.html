<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, E4 = Electro4D, R = Relativite, K = Constantes, c = K.c, KC = 1 / (4 * Math.PI * K.eps0);

/* ---------- une charge qui passe : φ, cA_x et l'invariant, contre le temps ---------- */
(() => {
  const svg = $("trace"), sp = $("sp"), q = 1e-9, b = 0.01;
  /* abscissa s = vt/b, sampled densely near the passage (sinh spacing) */
  const S = Array.from({ length: 401 }, (_, i) => 6 * Math.sinh(6 * (i / 200 - 1)) / Math.sinh(6));
  function draw() {
    const p = 10 ** (+sp.value / 100), v = R.deCelerite(p), beta = v / c, P = E4.passageCharge(q, v, b), co = P.coulomb;
    const pts = S.map(s => { const tt = s * b / v, A = P.A(tt); return { s, phi: c * A[0] / co, ax: c * A[1] / co, inv: P.invariant(tt) / co }; });
    svg.innerHTML = "";
    const top = 10 ** Math.ceil(Math.log10(Math.max(2, P.gamma * 1.5)));
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { l: 60, b: 44 }, x: { domain: [-6, 6], label: t("fig.xaxis") }, y: { scale: "log", domain: [0.1, top], label: t("fig.yaxis") } });
    const clip = y => Math.max(0.1, Math.min(top, y));
    Plot.el("path", { d: Plot.path(pts.map(o => [A.x(o.s), A.y(clip(o.phi))])), class: "curve" }, A.g);
    Plot.el("path", { d: Plot.path(pts.map(o => [A.x(o.s), A.y(clip(o.ax))])), class: "stroke" }, Plot.el("g", { class: "c-warn" }, A.g));
    Plot.el("path", { d: Plot.path(pts.map(o => [A.x(o.s), A.y(clip(o.inv))])), class: "stroke" }, Plot.el("g", { class: "c-ok" }, A.g));
    Plot.el("line", { x1: A.x(-6), x2: A.x(6), y1: A.y(1), y2: A.y(1), class: "ref" }, A.g);
    /* the same φ at the closest approach by Liénard–Wiechert, retarded time searched numerically */
    const lw = M.lienardWiechert(q, tt => [v * tt, 0, 0], () => [v, 0, 0], [0, b, 0], 0).phi;
    const ecart = Math.abs(lw - P.phi(0)) / P.phi(0);
    $("spr").textContent = t("fig.pv", { b: F.num(beta, beta > 0.999 ? 7 : 3), g: F.num(P.gamma, 4) });
    $("vpic").textContent = t("fig.pic", { r: F.num(P.pic / co, 4) });
    $("fpic").textContent = t("fig.f.pic");
    $("vdur").textContent = t("fig.dur", { d: F.num(P.largeur * c / b, 3) });
    $("fdur").textContent = t("fig.f.duree", { s: F.si(P.largeur, "s", { sig: 2 }) });
    $("vax").textContent = F.num(pts[200].ax / pts[200].phi, 4);
    $("fax").textContent = t("fig.f.ax", { i: F.num(pts[200].inv, 6) });
    $("vlw").textContent = ecart === 0 ? "0" : F.sci(ecart, 1);
    $("flw").textContent = t("fig.f.lw");
  }
  sp.oninput = draw; draw();
})();

/* ---------- le système décrit : deux noyaux de plomb qui se frôlent au LHC ---------- */
(() => {
  const Z = 82, Epn = 2.51e12 * K.e, mN = K.u * c * c, g = Epn / mN, b = 20e-15, beta = Math.sqrt((1 - 1 / g) * (1 + 1 / g));
  const P = E4.passageCharge(Z * K.e, beta * c, b);
  const Ech = g * KC * Z * K.e / (b * b), Es = K.m_e ** 2 * c ** 3 / (K.e * K.hbar);
  const Eph = K.hbar * c * g / b / K.e;                                    // ħγc/b, eV
  $("sys1").innerHTML = t("sys1.body", { g: F.num(g, 3), pic: F.si(P.pic, "V", { sig: 2 }), dt: F.sci(P.largeur, 2), E: F.sci(Ech, 1), Es: F.sci(Es, 2), Eph: F.si(Eph, "eV", { sig: 1 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fermi", 1924, "idea"], ["weizsacker", 1934, "idea"], ["atlas", 2017, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["upc"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["regle", "b"], ["repos", "a"], ["gamma", "d"], ["vecteur", "c"], ["largeur", "a"], ["loin", "b"], ["invariant", "c"], ["retard", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 255 });
})();
</script>
