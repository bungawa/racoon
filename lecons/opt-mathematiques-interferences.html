<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const DEG = Math.PI / 180;

/* ---------- deux flèches qui tournent ensemble, et les deux signaux qu'elles projettent ---------- */
(() => {
  const fl = $("fleches"), sg = $("signaux"), s1 = $("s1"), s2 = $("s2"), sp = $("sp"), st = $("st");
  const cx = 320, cy = 150;
  function draw() {
    const A1 = +s1.value, A2 = +s2.value, dphi = +sp.value * DEG, wt = +st.value * DEG;
    const src = [{ A: A1, phi: 0 }, { A: A2, phi: dphi }];
    const z = OptOnd.somme(src), two = OptOnd.deuxOndes(A1, A2, dphi), U = Math.min(90, 130 / Math.max(0.1, A1 + A2));   // px per unit of amplitude
    /* the rigid diagram, turned by ωt: A₁, then A₂ from its tip (parallelogram rule), the resultant from the origin */
    fl.innerHTML = "";
    Plot.el("line", { x1: 20, x2: 620, y1: cy, y2: cy, class: "stroke thin c-label" }, fl);
    Plot.el("line", { x1: cx, x2: cx, y1: 10, y2: 290, class: "stroke thin c-label" }, fl);
    Plot.el("circle", { cx, cy, r: U * (A1 + A2), class: "stroke thin dash c-label" }, fl);
    const P = (a, ph) => [U * a * Math.cos(ph + wt), -U * a * Math.sin(ph + wt)];
    const p1 = P(A1, 0), p2 = P(A2, dphi), pr = P(z.A, z.phi);
    Plot.fleche(fl, [cx, cy], [cx + p1[0], cy + p1[1]], { cls: "c-tint" });
    Plot.fleche(fl, [cx + p1[0], cy + p1[1]], [cx + p1[0] + p2[0], cy + p1[1] + p2[1]], { cls: "c-warn" });
    Plot.fleche(fl, [cx, cy], [cx + pr[0], cy + pr[1]], { cls: "c-label", trait: "stroke bold" });
    /* the projection on the horizontal axis is the signal at this instant */
    Plot.el("line", { x1: cx + pr[0], x2: cx + pr[0], y1: cy + pr[1], y2: cy, class: "stroke thin dash c-label" }, fl);
    Plot.el("circle", { cx: cx + pr[0], cy, r: 4, class: "dot" }, fl);
    /* the three signals over one period, the instant marked */
    sg.innerHTML = "";
    const amp = Math.max(0.5, A1 + A2) * 1.1;
    const G = Plot.axes(sg, { fmt: F, w: 640, h: 230, pad: { l: 56, b: 44 }, x: { domain: [0, 360], label: t("fig.xaxis") }, y: { domain: [-amp, amp], label: t("fig.yaxis") } });
    Plot.el("line", { x1: G.x(0), x2: G.x(360), y1: G.y(0), y2: G.y(0), class: "zero" }, G.g);
    const xs = Array.from({ length: 181 }, (_, k) => 2 * k);
    const curve = (f, cls) => Plot.el("path", { d: Plot.path(xs.map(x => [G.x(x), G.y(f(x * DEG))])), class: cls }, G.g);
    curve(u => OptOnd.signal([src[0]], 1, u), "stroke c-tint");
    curve(u => OptOnd.signal([src[1]], 1, u), "stroke c-warn");
    curve(u => OptOnd.signal(src, 1, u), "stroke bold c-label");
    Plot.el("line", { x1: G.x(+st.value), x2: G.x(+st.value), y1: G.y(-amp), y2: G.y(amp), class: "stroke thin dash c-label" }, G.g);
    $("s1r").textContent = F.num(A1, 3); $("s2r").textContent = F.num(A2, 3);
    $("spr").textContent = F.qty(F.num(+sp.value, 3), "°"); $("str").textContent = F.qty(F.num(+st.value, 3), "°");
    $("vfl").textContent = F.num(z.A, 3);
    $("ffl").innerHTML = t("fig.f.phase", { p: F.qty(F.num(z.phi / DEG, 3), "°") });
    $("vfo").textContent = F.num(two.A, 3);
    $("ffo").innerHTML = t("fig.f.i", { i: F.num(two.I, 3), s: F.num(A1 * A1 + A2 * A2, 3) });
    $("vin").textContent = F.num(Math.abs(two.interference) < 1e-12 ? 0 : two.interference, 3);
    $("fin").textContent = t(two.interference > 1e-12 ? "fig.f.constructive" : two.interference < -1e-12 ? "fig.f.destructive" : "fig.f.nulle");
  }
  s1.oninput = s2.oninput = sp.oninput = st.oninput = draw;
  draw();
})();

/* ---------- le système décrit : deux émetteurs presque à la même fréquence ---------- */
(() => {
  const df = 0.1, Ts = [0.1, 100];
  const moy = T => Math.abs(Math.sin(Math.PI * df * T) / (Math.PI * df * T));   // mean of cos(2π δf t + φ) over T: sinc(π δf T) cos(φ + π δf T); its envelope is 1/(π δf T)
  $("sys1").innerHTML = t("sys1.body", { df: F.si(df, "Hz"), T1: F.si(Ts[0], "s"), T2: F.si(Ts[1], "s"),
    x1: F.num(df * Ts[0], 2), x2: F.num(df * Ts[1], 2), m1: F.num(100 * moy(Ts[0]), 4) + F.NB + "%", m2: F.num(100 / (Math.PI * df * Ts[1]), 2) + F.NB + "%" });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["euler", 1748, "idea"], ["young", 1801, "experiment"], ["steinmetz", 1893, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ligo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["quadrature", "b"], ["soixante", "d"], ["inegales", "a"], ["phase", "c"], ["conjugue", "b"], ["lampes", "d"], ["trente", "a"], ["rigide", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 295 });
})();
</script>
