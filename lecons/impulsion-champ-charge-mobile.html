<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/quiz.js"></script>

<script src="/racoon/lecons/complexes.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux, K = Constantes, EL = OM.electronClassique();

/* ---------- le système décrit : ce que coûte v ≪ c, et le temps que met le champ à suivre ---------- */
(() => {
  const a = EL.r0, b1 = 0.01, b2 = 0.1, g = b => 1 / Math.sqrt(1 - b * b) - 1;
  $("sys1").innerHTML = t("sys1.body", { a: F.si(a, "m", { prefix: "f" }), e1: F.sci(g(b1), 1), e2: F.qty(F.num(100 * g(b2), 2), "%"),
    t: F.qty(F.sci(10 * a / K.c, 1), "s") });
})();

/* ---------- la carte de g autour de la sphère, et la quantité de mouvement intégrée ---------- */
(() => {
  const svg = $("carte"), sb = $("sb"), seg = $("forme"), q = K.e, a = EL.r0;
  const X0 = 320, Y0 = 180, S = 46;                                            // pixels per a
  let forme = "coquille";
  function draw() {
    const beta = +sb.value / 100, v = beta * K.c, s = OM.sphereMobile({ q, a, v, forme });
    const r = OM.impulsionChamp({ q, a, v, forme, n: 120 }), lent = OM.chargeEtendue({ q, a, forme }).mElec * v;
    svg.innerHTML = "";
    Plot.el("line", { x1: 20, x2: 620, y1: Y0, y2: Y0, class: "stroke thin dash c-label-2" }, svg);
    Plot.el("ellipse", { cx: X0, cy: Y0, rx: S / s.gamma, ry: S, class: "stroke c-label-2" }, svg);
    /* arrows of g, lengths multiplied by (ρ/a)⁴ (ρ the distance in units of a) so that the far ones still show */
    const pts = [];
    for (let i = -11; i <= 11; i++) for (let j = -6; j <= 6; j++) {
      if (j === 0) continue;
      const x = i * a / 1.8, y = j * a / 1.8, rr = Math.hypot(x, y) / a;
      if (rr < 1.4 || rr > 6.2) continue;
      const gv = s.g([x, y, 0]); pts.push([x, y, gv, rr]);
    }
    const ref = Math.max(...pts.map(([, , gv, rr]) => Math.hypot(gv[0], gv[1]) * rr ** 4));
    for (const [x, y, gv, rr] of pts) {
      const k = 24 * rr ** 4 / ref, px = X0 + x / a * S, py = Y0 - y / a * S;
      Plot.fleche(svg, [px, py], [px + k * gv[0], py - k * gv[1]], { cls: "c-tint", tete: 6 });
    }
    Plot.fleche(svg, [X0 - 40, 372], [X0 + 40, 372], { cls: "c-warn" });
    $("sbr").textContent = F.num(beta, 2);
    $("vp").textContent = F.qty(F.sci(r.p, 3), "kg·m·s⁻¹"); $("fp").textContent = t("fig.f.p", { v: F.qty(F.sci(r.pFormule, 3), "kg·m·s⁻¹") });
    $("vr").textContent = F.num(r.p / lent, 4); $("fr").textContent = t("fig.f.rapport", { g: F.num(r.gamma, 4) });
    $("vm").textContent = F.num(r.mElec / K.m_e, 3); $("fm").textContent = t("fig.f.m", { v: F.qty(F.sci(r.mElec, 3), "kg") });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === forme)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { forme = b.dataset.m; draw(); });
  sb.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["thomson", 1881, "idea"], ["poynting", 1884, "idea"], ["heaviside", 1889, "idea"], ["searle", 1897, "idea"], ["atlas", 2017, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["photons"], uses = textOf("uses.items", USES);
  const g = 2.51e12 / (K.u * K.c ** 2 / K.e);                                  // 2,51 TeV per nucleon over the atomic mass unit
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace("{g}", F.num(Math.round(g / 100) * 100, 2))}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["direction", "b"], ["signe", "d"], ["facteur", "a"], ["masse", "c"], ["rayon", "b"], ["lent", "a"], ["point", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 282 });
})();
</script>
