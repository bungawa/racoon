    <span class="sec" data-i18n="s1.sec"></span>

    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq">
      <math display="block"><mo stretchy="false">⟨</mo><msubsup><mi>D</mi><mi>N</mi><mn>2</mn></msubsup><mo stretchy="false">⟩</mo><mo>=</mo><mo stretchy="false">⟨</mo><msubsup><mi>D</mi><mrow><mi>N</mi><mo>−</mo><mn>1</mn></mrow><mn>2</mn></msubsup><mo stretchy="false">⟩</mo><mo>+</mo><mn>1</mn></math>
      <span class="n">(6.8)</span>
    </div>
    <p class="validite" data-i18n="eq68.validite"></p>
    <div class="eq">
      <math display="block"><mo stretchy="false">⟨</mo><msubsup><mi>D</mi><mi>N</mi><mn>2</mn></msubsup><mo stretchy="false">⟩</mo><mo>=</mo><mi>N</mi></math>
      <span class="n">(6.9)</span>
    </div>
    <p class="validite" data-i18n="eq69.validite"></p>
    <div class="eq">
      <math display="block"><msub><mi>D</mi><mi mathvariant="normal" data-i18n="eq.rms"></mi></msub><mo>=</mo><msqrt><mo stretchy="false">⟨</mo><msubsup><mi>D</mi><mi>N</mi><mn>2</mn></msubsup><mo stretchy="false">⟩</mo></msqrt><mo>=</mo><msqrt><mi>N</mi></msqrt></math>
      <span class="n">(6.10)</span>
    </div>
    <p class="validite" data-i18n-html="eq610.validite"></p>
    <figure class="chart">
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="wn" data-i18n="walk.n"></label><output id="wnv" for="wn"></output></div>
            <input id="wn" type="range" min="10" max="1000" step="10" value="100"></div>
        </div>
        <div class="controls">
          <button class="btn tinted" type="button" id="w1" data-i18n="walk.one"></button>
          <button class="btn tinted" type="button" id="w100" data-i18n="walk.hundred"></button>
          <button class="btn tinted" type="button" id="w0" data-i18n="walk.clear"></button>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="walk.m"></span><span class="v" id="wm"></span></div>
          <div class="stat"><span class="k" data-i18n-html="walk.msd"></span><span class="v" id="wmsd"></span><span class="f" id="wmsdf"></span></div>
          <div class="stat"><span class="k" data-i18n="walk.out"></span><span class="v" id="wout"></span><span class="f" data-i18n="walk.out.f"></span></div>
        </div>
      </div>
      <svg id="wchart" role="img" data-i18n-attr="aria-label:walk.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="walk.legend.last"></span><span class="c-label-2" data-i18n="walk.legend.others"></span><span class="c-warn" data-i18n="walk.legend.env"></span></div>
      <figcaption data-i18n="walk.caption"></figcaption>
    </figure>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq">
      <math display="block"><mi>P</mi><mo stretchy="false">(</mo><mi>H</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><msub><mi>N</mi><mi>H</mi></msub><mi>N</mi></mfrac><mo>±</mo><mfrac><mn>1</mn><mrow><mn>2</mn><msqrt><mi>N</mi></msqrt></mrow></mfrac></math>
      <span class="n">(6.14)</span>
    </div>
    <p class="validite" data-i18n="eq614.validite"></p>
    <figure class="chart">
      <div class="panel">
        <div class="controls">
          <button class="btn tinted" type="button" id="c1" data-i18n="coin.go"></button>
          <button class="btn tinted" type="button" id="c0" data-i18n="coin.clear"></button>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="coin.nh"></span><span class="v" id="cnh"></span><span class="f" id="cnhf"></span></div>
          <div class="stat"><span class="k" data-i18n="coin.frac"></span><span class="v" id="cfr"></span><span class="f" id="cfrf"></span></div>
          <div class="stat"><span class="k" data-i18n="coin.z"></span><span class="v" id="cz"></span><span class="f" data-i18n="coin.z.f"></span></div>
        </div>
      </div>
      <svg id="cchart" role="img" data-i18n-attr="aria-label:coin.aria"></svg>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/marche-au-hasard.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>

<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
const main = document.querySelector("main");
F.autoTypo(main);
document.title = t("title");
const $ = id => document.getElementById(id);
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const pathOf = (pts, x, y) => { let d = ""; for (let i = 0; i < pts.length; i++) d += (i ? "L" : "M") + x(i).toFixed(1) + " " + y(pts[i]).toFixed(1); return d; };

/* ---------- marcheurs : trajectoires, ⟨D_N²⟩ contre N ---------- */
(() => {
  const SHOWN = 40, rand = Quiz.rng(63);
  let walks = [];
  const add = k => { const N = +$("wn").value; for (let i = 0; i < k; i++) walks.push(Proba.walk(N, rand)); draw(); };
  function draw() {
    const N = +$("wn").value, M = walks.length, ends = walks.map(w => w[N]);
    $("wnv").textContent = F.num(N, 4); $("wm").textContent = F.num(M, 6);
    const ms = Proba.meanSquare(ends);
    $("wmsd").textContent = M ? F.num(ms, 3) : "–";
    $("wmsdf").textContent = M > 1 ? t("walk.msd.f", { N: F.num(N, 4), r: F.num(100 * Math.sqrt(2 / M), 2) }) : t("walk.msd.f1", { N: F.num(N, 4) });
    $("wout").textContent = M ? F.qty(F.num(100 * ends.filter(d => Math.abs(d) > Math.sqrt(N)).length / M, 3), "%") : "–";
    const svg = $("wchart"), lim = Math.max(3 * Math.sqrt(N), ...walks.slice(-SHOWN).map(w => Math.max(...w.map(Math.abs)))) * 1.05;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [0, N], label: t("walk.x") }, y: { domain: [-lim, lim], label: t("walk.y") } });
    const shown = walks.slice(-SHOWN);
    shown.forEach((w, i) => Plot.el("path", { d: pathOf(w, x, y), class: i === shown.length - 1 ? "curve" : "zero", fill: "none" }, g));
    [1, -1].forEach(s => { let d = ""; for (let i = 0; i <= 100; i++) { const n = N * i / 100; d += (i ? "L" : "M") + x(n).toFixed(1) + " " + y(s * Math.sqrt(n)).toFixed(1); } Plot.el("path", { d, class: "ref" }, g); });
  }
  $("wn").oninput = () => { walks = []; add(1); };
  $("w1").onclick = () => add(1); $("w100").onclick = () => add(100); $("w0").onclick = () => { walks = []; draw(); };
  add(5);
})();

/* ---------- 10 000 lancers : fraction de pile contre N ---------- */
(() => {
  const N = 10000, KEEP = 4, rand = Quiz.rng(1946);
  let runs = [];
  function draw() {
    const svg = $("cchart"); svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44 }, x: { domain: [1, N], scale: "log", label: t("coin.x") }, y: { domain: [0, 1], label: t("coin.y") } });
    Plot.el("line", { x1: x(1), x2: x(N), y1: y(0.5), y2: y(0.5), class: "zero" }, g);
    const grid = []; for (let n = 1; n <= N; n = Math.max(n + 1, Math.round(n * 1.03))) grid.push(n); grid.push(N);
    [1, -1].forEach(s => Plot.el("path", { d: grid.map((n, i) => (i ? "L" : "M") + x(n).toFixed(1) + " " + y(Math.max(0, Math.min(1, 0.5 + s * Proba.fractionSpread(n)))).toFixed(1)).join(""), class: "ref" }, g));
    runs.forEach((f, j) => Plot.el("path", { d: grid.map((n, i) => (i ? "L" : "M") + x(n).toFixed(1) + " " + y(f[n - 1]).toFixed(1)).join(""), class: j === runs.length - 1 ? "curve" : "zero", fill: "none" }, g));
    const f = runs[runs.length - 1];
    if (!f) { ["cnh", "cfr", "cz"].forEach(id => { $(id).textContent = "–"; }); $("cnhf").textContent = $("cfrf").textContent = ""; return; }
    const nh = Math.round(f[N - 1] * N);
    $("cnh").textContent = F.num(nh, 6); $("cnhf").textContent = t("coin.nh.f", { d: F.num(nh - N / 2, 4), s: F.num(Math.sqrt(N) / 2, 3) });
    $("cfr").textContent = F.fix(f[N - 1], 4); $("cfrf").textContent = t("coin.frac.f", { s: F.fix(Proba.fractionSpread(N), 3) });
    $("cz").textContent = F.fix((nh - N / 2) / (Math.sqrt(N) / 2), 2);
  }
  $("c1").onclick = () => { runs.push(Proba.runningFraction(N, 0.5, rand)); runs = runs.slice(-KEEP); draw(); };
  $("c0").onclick = () => { runs = []; draw(); };
  $("c1").onclick();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["brown", 1827, "experiment"], ["pearson", 1905, "idea"], ["einstein", 1905, "idea"], ["perrin", 1908, "experiment"], ["irm", 1985, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cent", "b"], ["double", "c"], ["moyenne", "a"], ["mille", "d"], ["suspecte", "b"], ["memoire", "a"], ["encre", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => { const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) }; }), { t, seed: 63 });
})();
</script>
