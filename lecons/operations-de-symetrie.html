    <div class="eq"><math display="block"><msup><mi>t</mi><mo>′</mo></msup><mo>=</mo><mi>t</mi><mo>+</mo><mi>s</mi><mo>,</mo><mspace width="1em"/><msup><mover accent="true"><mi>r</mi><mo>→</mo></mover><mo>′</mo></msup><mo>=</mo><mi>R</mi><mspace width="0.1em"/><mover accent="true"><mi>r</mi><mo>→</mo></mover><mo>+</mo><mover accent="true"><mi>a</mi><mo>→</mo></mover></math></div>

    <div class="list keyed" id="ops"></div>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mfrac><mrow><mi mathvariant="normal">d</mi><mover accent="true"><mi>v</mi><mo>→</mo></mover></mrow><mrow><mi mathvariant="normal">d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mover accent="true"><mi>g</mi><mo>→</mo></mover><mo>−</mo><mfrac><mrow><mover accent="true"><mi>v</mi><mo>→</mo></mover><mo>−</mo><msub><mover accent="true"><mi>v</mi><mo>→</mo></mover><mi data-i18n="eq.air"></mi></msub></mrow><mi>τ</mi></mfrac></math></div>

    <figure class="chart">

      <div class="legend"><span class="c-label-2" data-i18n="sim.legend.ref"></span><span class="c-tint" data-i18n="sim.legend.image"></span><span class="c-warn ring" data-i18n="sim.legend.loi"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" id="ops-seg" role="group" data-i18n-attr="aria-label:sim.ops">
            <button type="button" data-o="translation" data-i18n="sim.op.translation"></button><button type="button" data-o="temps" data-i18n="sim.op.temps"></button><button type="button" data-o="rotation" data-i18n="sim.op.rotation"></button><button type="button" data-o="miroirV" data-i18n="sim.op.miroirV"></button><button type="button" data-o="miroirH" data-i18n="sim.op.miroirH"></button><button type="button" data-o="vitesse" data-i18n="sim.op.vitesse"></button><button type="button" data-o="renversement" data-i18n="sim.op.renversement"></button>

        </div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/principes.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); };

/* ---------- le tableau des opérations ---------- */
(() => { const IDS = ["translation", "temps", "rotation", "vitesse", "renversement", "reflexion", "echange", "phase", "antimatiere"];
  keyed($("ops"), t("ops.tag"), IDS, textOf("ops.items", IDS)); })();

/* ---------- une balle, six opérations ---------- */
(() => {
  const E0 = { t: 0, r: [0, 0, 0], v: [6, 0, 8] }, DUREE = 1.6, TAU = 2;
  const OPS = { translation: ["translation", [-8, 0, 3]], temps: ["temps", 5], rotation: ["rotation", 0.6], miroirV: ["reflexion", [1, 0, 0]],
    miroirH: ["reflexion", [0, 0, 1]], vitesse: ["vitesse", [-4, 0, 0]], renversement: ["renversement"] };
  const detail = textOf("sim.detail", Object.keys(OPS));
  const { x, y, g } = Plot.axes($("traj"), { fmt: F, w: 640, h: 380, pad: { b: 44 },
    x: { domain: [-16, 16], label: t("sim.x") }, y: { domain: [-10, 8], label: t("sim.z") } });
  const cp = P("clipPath", { id: "cadre" }, P("defs", {}, $("traj")));
  P("rect", { x: x(-16), y: y(8), width: x(16) - x(-16), height: y(-10) - y(8) }, cp);
  const layer = P("g", { "clip-path": "url(#cadre)" }, g);
  let op = "translation";
  const d = pts => pts.map((e, i) => (i ? "L" : "M") + x(e.r[0]).toFixed(1) + " " + y(e.r[2]).toFixed(1)).join("");
  function upd() {
    const [nom, p] = OPS[op], frott = $("frott").checked;
    const r = Principes.epreuveSymetrie(Principes.operation(nom, p), E0, frott ? { tau: TAU } : {},
      { duree: DUREE, n: 80, entrainer: $("entr").checked, ancre: nom === "renversement" ? "fin" : "debut" });
    layer.innerHTML = "";
    P("path", { d: d(r.ref), class: "stroke thin c-label-2" }, layer);
    P("path", { d: d(r.image), class: "curve" }, layer);
    P("path", { d: d(r.loi), class: "ref" }, layer);
    P("circle", { cx: x(0), cy: y(0), r: 4, class: "fill c-label-2" }, layer);
    const sym = r.relatif < 1e-9;
    $("vecart").textContent = F.qty(sym ? "0" : F.num(r.ecart, 3), "m");
    $("fecart").textContent = t("sim.f.ecart", { r: sym ? "0" : F.num(r.relatif, 2) });
    $("vverdict").textContent = t(sym ? "sim.v.oui" : "sim.v.non");
    $("fverdict").textContent = t(sym ? "sim.f.oui" : "sim.f.non");
    $("detail").textContent = detail[op];
  }
  $("frott").onchange = $("entr").onchange = upd;
  seg($("ops-seg"), "o", o => { op = o; upd(); });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["groupes", 1891, "idea"], ["curie", 1894, "idea"], ["weyl", 1952, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cristallo"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["loi", "a"], ["rotation", "c"], ["miroir", "b"], ["temps", "a"], ["echelle", "d"], ["vitesse", "b"], ["curie", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 5201 });
})();
</script>
