<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, MM = 1e-3, NM = 1e-9;
/* the bench: 600 eV electrons, slits 62 nm wide and 272 nm apart, screen 1 m behind */
const EC = 600 * Q.e, LAM = Q.broglie(Q.impulsion(Q.m_e, EC));
const BANC = { lambda: LAM, d: 272 * NM, a: 62 * NM, L: 1 };

/* ---------- two complex numbers per point: the curves, the arrows, closing a slit ---------- */
(() => {
  const g = $("graphe"), fl = $("fleches"), sx = $("sx"), seta = $("seta");
  /* slit 2 partly masked: its amplitude times √η */
  const at = (x, eta) => { const r = Q.amplitudesDeuxFentes(x, BANC), k = Math.sqrt(eta);
    const p1 = r.phi1, p2 = { re: k * r.phi2.re, im: k * r.phi2.im };
    const P1 = p1.re ** 2 + p1.im ** 2, P2 = p2.re ** 2 + p2.im ** 2, P12 = (p1.re + p2.re) ** 2 + (p1.im + p2.im) ** 2;
    return { p1, p2, P1, P2, P12 }; };
  function draw() {
    const x = +sx.value * MM, eta = +seta.value, X = 0.6 * MM;
    g.innerHTML = "";
    const G = Plot.axes(g, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [-0.6, 0.6], label: t("fig.xaxis") }, y: { domain: [0, 4.2], label: t("fig.yaxis") } });
    const xs = Array.from({ length: 801 }, (_, j) => -X + j * 2 * X / 800), pts = xs.map(u => at(u, eta));
    const courbe = (f, cls) => Plot.el("path", { d: Plot.path(xs.map((u, j) => [G.x(u / MM), G.y(f(pts[j]))])), class: cls }, G.g);
    courbe(p => p.P1, "stroke thin c-tint");
    if (eta > 0) courbe(p => p.P2, "stroke thin c-warn");
    courbe(p => p.P1 + p.P2, "stroke thin dash c-label-2");
    courbe(p => p.P12, "stroke bold c-label");
    /* where closing either slit raises the count: P12 < min(P1, P2) */
    let debut = null;
    pts.forEach((p, j) => { const ici = eta > 0 && p.P12 < Math.min(p.P1, p.P2);
      if (ici && debut === null) debut = j;
      if ((!ici || j === pts.length - 1) && debut !== null) { Plot.el("line", { x1: G.x(xs[debut] / MM), x2: G.x(xs[j] / MM), y1: G.y(0.08), y2: G.y(0.08), class: "stroke bold c-ok" }, G.g); debut = null; } });
    const p = at(x, eta);
    Plot.el("line", { x1: G.x(x / MM), x2: G.x(x / MM), y1: G.y(0), y2: G.y(4.2), class: "stroke thin dash c-label" }, G.g);
    Plot.el("circle", { cx: G.x(x / MM), cy: G.y(p.P12), r: 5, class: "dot" }, G.g);
    /* the arrows, φ1 turned to point to the right */
    fl.innerHTML = "";
    const n1 = Math.hypot(p.p1.re, p.p1.im) || 1, c = p.p1.re / n1, s = -p.p1.im / n1, rot = z => [z.re * c - z.im * s, z.re * s + z.im * c];
    const U = 52, O = [250, 110], a1 = rot(p.p1), a2 = rot(p.p2), A = [O[0] + U * a1[0], O[1] - U * a1[1]], B = [A[0] + U * a2[0], A[1] - U * a2[1]];
    Plot.el("circle", { cx: O[0], cy: O[1], r: U * 2, class: "stroke thin dash c-label-2" }, fl);
    Plot.fleche(fl, O, A, { cls: "c-tint", min: 2 });
    Plot.fleche(fl, A, B, { cls: "c-warn", min: 2 });
    Plot.fleche(fl, O, B, { cls: "c-label", min: 2, trait: "stroke bold" });
    const lab = (xx, yy, k) => { const e = Plot.el("text", { x: xx, y: yy }, fl); e.textContent = t(k); };
    lab(470, 70, "fig.fl.phi1"); lab(470, 100, "fig.fl.phi2"); lab(470, 130, "fig.fl.somme");
    $("sxr").textContent = F.si(x, "m");
    $("setar").textContent = F.num(100 * eta, 3) + " %";
    $("vp12").textContent = F.num(p.P12, 3);
    $("fp12").textContent = t("fig.f.p12", { s: F.num(p.P1 + p.P2, 3), r: p.P1 + p.P2 > 1e-9 ? F.num(p.P12 / (p.P1 + p.P2), 2) : "—" });
    $("vfer").textContent = p.P12 > 1e-6 ? "× " + F.num(p.P1 / p.P12, 2) : "—";
    $("ffer").textContent = t(p.P12 > 1e-6 && p.P1 > p.P12 ? "fig.f.plus" : "fig.f.moins");
    $("vvis").textContent = p.P1 + p.P2 > 0 ? F.num(Q.visibiliteFranges(p.P1, p.P2), 2) : "—";
    $("fvis").textContent = t("fig.f.visi");
  }
  sx.oninput = seta.oninput = draw; draw();
})();

/* ---------- the system described: 600 eV electrons through two slits 272 nm apart ---------- */
(() => {
  const i = Q.interfrangeFentes(LAM, BANC.L, BANC.d);
  $("sys1").innerHTML = t("sys1.body", { l: F.si(LAM, "m"), dl: F.num(BANC.d / LAM, 2), al: F.num(BANC.a / LAM, 2), f: F.si(BANC.d ** 2 / LAM, "m"), i: F.si(i, "m"), e: F.si(BANC.L * LAM / BANC.a, "m") });
  const w1 = 20e-6, w2 = 100e-6;
  $("sys2").innerHTML = t("sys2.body", { c1: F.num(Q.contrasteDetecteur(w1, i), 2), c2: F.num(Q.contrasteDetecteur(w2, i), 2), b: F.num(Q.broglie(Q.impulsion(Q.m_e, 2 * EC)) / LAM, 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["thomson", 1927, "experiment"], ["biprisme", 1955, "experiment"], ["fullerene", 1999, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cristallo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["propA", "b"], ["fermer", "a"], ["centre", "c"], ["delta", "d"], ["masque", "a"], ["sens", "b"], ["energie", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 375 });
})();
</script>
