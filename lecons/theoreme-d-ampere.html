<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, MU0 = Constantes.mu0;

/* ---------- three wires along z and a closed contour of the plane: ∮ B·ds against μ0 I_enlacé ---------- */
(() => {
  const svg = $("carte"), W = 640, H = 400, S = 100, O = [200, 200];          // 100 px per metre, origin at (200, 200)
  const fils = [{ I: 3, x: -0.4, y: 0.1 }, { I: -1, x: 0.5, y: 0.35 }, { I: 2, x: 2.6, y: -0.3 }];
  const px = p => [O[0] + S * p[0], O[1] - S * p[1]];
  let forme = "cercle";
  const btns = [...$("formes").querySelectorAll("button")];
  btns.forEach(b => b.onclick = () => { forme = b.dataset.forme; draw(); });
  function draw() {
    const cx = +$("xsl").value / 100, a = +$("tsl").value / 100, c = [cx, 0];
    const ch = forme === "carre" ? M.contoursAmpere.carre(c, 2 * a) : M.contoursAmpere[forme](c, a);
    btns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.forme === forme)));
    svg.innerHTML = "";
    /* the field: arrows of fixed length on a grid, their direction only; the strength in the opacity class is not used */
    const gc = Plot.el("g", { class: "c-label-2" }, svg);
    for (let gx = 20; gx < W; gx += 40) for (let gy = 20; gy < H; gy += 40) {
      const p = [(gx - O[0]) / S, (O[1] - gy) / S], b = M.champFils(fils, [p[0], p[1], 0]), n = Math.hypot(b[0], b[1]);
      if (!(n > 0) || fils.some(w => Math.hypot(w.x - p[0], w.y - p[1]) < 0.15)) continue;
      const u = [b[0] / n, -b[1] / n], L = 7 + 6 * Math.min(1, Math.max(0, Math.log10(n / 1e-7) / 1.5));
      Plot.fleche(gc, [gx - u[0] * L, gy - u[1] * L], [gx + u[0] * L, gy + u[1] * L], { cls: "c-label-2", tete: 5, trait: "stroke thin" });
    }
    const pts = Array.from({ length: 401 }, (_, i) => px(ch(i / 400)));
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold" }, Plot.el("g", { class: "c-ok" }, svg));
    for (const f of [0.1, 0.35, 0.6, 0.85]) {                                     // the sense of the contour
      const A = px(ch(f)), B = px(ch(f + 0.004)), d = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1;
      Plot.fleche(svg, A, [A[0] + 14 * (B[0] - A[0]) / d, A[1] + 14 * (B[1] - A[1]) / d], { cls: "c-ok", tete: 10 });
    }
    fils.forEach(w => {
      const [x, y] = px([w.x, w.y]), g = Plot.el("g", { class: w.I > 0 ? "c-tint" : "c-warn" }, svg);
      Plot.el("circle", { cx: x, cy: y, r: 9, class: "stroke" }, g);
      if (w.I > 0) Plot.el("circle", { cx: x, cy: y, r: 2.5, class: "fill" }, g);
      else { Plot.el("line", { x1: x - 5, y1: y - 5, x2: x + 5, y2: y + 5, class: "stroke" }, g); Plot.el("line", { x1: x - 5, y1: y + 5, x2: x + 5, y2: y - 5, class: "stroke" }, g); }
      Plot.el("text", { x: x + 12, y: y - 10 }, svg).textContent = F.si(w.I, "A");
    });
    const circ = M.circulationFils(fils, ch), Ienl = M.courantEnlaceContour(fils, ch);
    $("xread").textContent = F.si(cx, "m");
    $("tread").textContent = F.si(a, "m");
    $("vcirc").textContent = F.si(circ, "T·m");
    $("venl").textContent = F.si(Ienl, "A");
    $("vrap").textContent = Ienl === 0 ? F.si(circ, "T·m") : F.num(circ / (MU0 * Ienl), 6);
  }
  $("xsl").oninput = draw; $("tsl").oninput = draw; draw();
})();

/* ---------- the system: a 50 Hz circuit of one metre, against the quasi-static limit ---------- */
(() => {
  const f = 50, L = 1, x = (2 * Math.PI * f * L / Constantes.c) ** 2, lam = Constantes.c / f;
  $("sys").innerHTML = t("sys.body", { lam: F.si(lam, "m", { prefix: "k" }), x: F.sci(x, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["oersted", 1820, "experiment"], ["ampere", 1820, "experiment"], ["maxwell55", 1855, "idea"], ["maxwell61", 1861, "idea"], ["rogowski", 1912, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rogowski", "pince"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["forme", "c"], ["dehors", "a"], ["double", "d"], ["condo", "b"], ["seul", "a"], ["div", "c"], ["sens", "b"], ["quasi", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 134 });
})();
</script>
