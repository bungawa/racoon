<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["I", "II", "III"]; keyed($("liens"), t("liens.tag"), IDS, textOf("liens.items", IDS)); })();

/* ---------- l'air en tranches, sans linéariser ---------- */
(() => {
  const O = self.Ondes, T0 = 293.15, P0 = Constantes.atm, M = O.milieu("air", T0, P0), W = 0.1, X0 = 0.4, G = M.gaz.gamma;
  const XS = Array.from({ length: 401 }, (_, i) => 3 * i / 400);
  let run = null, epsRun = null;
  /* peak of an image: parabola through the three highest slices */
  const pic = im => { let j = 1; for (let i = 1; i < im.s.length - 1; i++) if (im.s[i] > im.s[j]) j = i;
    const a = im.s[j - 1], b = im.s[j], c = im.s[j + 1], d = 0.5 * (a - c) / (a - 2 * b + c); return im.x[j] + d * (im.x[j + 1] - im.x[j]); };
  function upd() {
    const eps = Math.pow(10, +$("eps").value), d = +$("dist").value;
    if (eps !== epsRun) { run = O.tranches({ eps, w: W, x0: X0, duree: 2.4 / M.c, images: 120 }); epsRun = eps; }
    const want = d / M.c, ims = run.images, im = ims.reduce((b, x) => Math.abs(x.t - want) < Math.abs(b.t - want) ? x : b, ims[0]);
    const svg = $("tr"); svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 52, b: 44 }, x: { domain: [0, 3], label: t("tr.xaxis") }, y: { domain: [-0.3, 1.6], label: t("tr.yaxis") } });
    const lin = XS.map(x => [A.x(x), A.y(Math.exp(-(((x - X0 - M.c * im.t) / W) ** 2)))]);
    Plot.el("path", { d: Plot.path(lin), class: "stroke dash c-label-2" }, A.g);
    const pts = []; for (let j = 0; j < im.s.length; j++) pts.push([A.x(im.x[j]), A.y(Math.max(-0.3, Math.min(1.6, im.s[j] / eps)))]);
    Plot.el("path", { d: Plot.path(pts), class: "curve" }, A.g);
    /* readouts */
    const p0 = G * P0 * eps, xs = O.distanceChoc(eps, W, G), trav = M.c * im.t;
    $("epsv").textContent = F.sci(eps, 2); $("distv").textContent = F.si(trav, "m");
    $("vniv").textContent = F.qty(F.num(O.niveau(p0 / Math.SQRT2), 3), t("tr.u.dB")); $("fniv").textContent = t("tr.f.niveau", { p: F.si(p0, "Pa") });
    if (trav > 0.2) { const r = (pic(im) - pic(ims[0])) / im.t / M.c - 1; $("vvit").textContent = F.sci(r, 2); }
    else $("vvit").textContent = "–";
    $("fvit").textContent = t("tr.f.vitesse", { th: F.sci((G + 1) / 2 * eps, 2) });
    $("vchoc").textContent = F.si(xs, "m");
    $("fchoc").textContent = t(run.ecrase != null && im === ims[ims.length - 1] && want > im.t ? "tr.f.arret" : trav < xs ? "tr.f.avant" : "tr.f.apres");
  }
  $("eps").oninput = upd; $("dist").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1687, "idea"], ["alembert", 1747, "idea"], ["laplace", 1816, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["simulation", "tuyau"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["trois", "b"], ["signe", "a"], ["ordre", "d"], ["newton", "c"], ["kappa", "a"], ["dimension", "c"], ["choc", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 473 });
})();
</script>
