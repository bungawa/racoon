<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes, MU0 = Cst.mu0;

/* ---------- un aimant cylindrique aimanté uniformément : B/μ0, M, H sur l'axe ---------- */
(() => {
  const svg = $("barreau"), sa = $("sa"), R = 5e-3, Mag = 1.0e6;
  function draw() {
    const m = Math.pow(10, +sa.value), L = 2 * R * m, b = M.barreauAimante(Mag, R, L), Z = L / 2 + 4 * R;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-Z / L, Z / L], label: t("fig.ax.x") }, y: { domain: [-1.1, 1.1], label: t("fig.ax.y") } });
    const n = 600, courbe = (f, cls) => { const pts = []; for (let k = 0; k <= n; k++) { const z = -Z + 2 * Z * k / n; pts.push([P.x(z / L), P.y(f(z) / Mag)]); }
      Plot.el("path", { d: Plot.path(pts), class: cls }, svg); };
    Plot.el("rect", { x: P.x(-0.5), y: P.y(1.1), width: P.x(0.5) - P.x(-0.5), height: P.y(-1.1) - P.y(1.1), class: "stroke thin dash c-label-2" }, svg);
    /* M and H jump at the faces: draw each side separately, so that no false vertical joins them */
    const cote = (f, cls) => { for (const [a, c] of [[-Z, -L / 2], [-L / 2, L / 2], [L / 2, Z]]) { const pts = [];
      for (let k = 0; k <= n / 3; k++) { const z = a + (c - a) * (k + 1e-6) / (n / 3 + 2e-6); pts.push([P.x(z / L), P.y(f(z) / Mag)]); }
      Plot.el("path", { d: Plot.path(pts), class: cls }, svg); } };
    cote(b.M, "stroke c-label-2");
    courbe(z => b.B(z) / MU0, "stroke bold c-tint");
    cote(b.H, "stroke bold c-warn");
    const Ld = Electrostatique.depolarisation(m);
    $("sar").textContent = F.num(m, 2);
    $("vb").innerHTML = F.si(b.B(0), "T", { sig: 3 });
    $("fb").innerHTML = t("fig.f.b", { mu: F.si(MU0 * Mag, "T", { sig: 3 }) });
    $("vh").innerHTML = F.si(b.H(0), "A·m⁻¹", { sig: 3 });
    $("fh").innerHTML = t("fig.f.h");
    $("vn").textContent = F.num(b.Nd, 3);
    $("fn").innerHTML = t("fig.f.nd", { L: F.num(Ld, 3) });
    $("vc").innerHTML = F.qty(F.num(100 * b.circulation(Z) / (Mag * L), 2), "%");
    $("fc").innerHTML = t("fig.f.circ", { loin: F.sci(b.circulation(1000 * L) / (Mag * L), 1) });
  }
  sa.oninput = draw; draw();
})();

/* ---------- matériaux linéaires : H contre B/μ0 ---------- */
(() => {
  const bi = M.materiauLineaire(M.SUSCEPTIBILITES.bismuth.chi, 1), al = M.materiauLineaire(M.SUSCEPTIBILITES.aluminium.chi, 1);
  $("lineaire").innerHTML = t("lineaire.body", { Hbi: F.si(bi.H, "A·m⁻¹", { sig: 6 }), H0: F.si(1 / MU0, "A·m⁻¹", { sig: 6 }), Mbi: F.si(bi.M, "A·m⁻¹", { sig: 3 }),
    Mal: F.si(al.M, "A·m⁻¹", { sig: 2 }), chi: F.sci(M.SUSCEPTIBILITES.bismuth.chi, 3), ecart: F.sci(Math.abs(bi.chiB - M.SUSCEPTIBILITES.bismuth.chi), 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["thomson", 1872, "idea"], ["maxwell", 1873, "idea"], ["oersted", 1930, "use"], ["si2019", 2019, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["fiches"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["definition", "b"], ["libre", "d"], ["aimant", "a"], ["source", "c"], ["vide", "b"], ["parallele", "a"], ["unites", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 362 });
})();
</script>
