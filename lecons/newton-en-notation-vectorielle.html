<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹", MS2 = "m·s⁻²";

/* ---------- le système décrit, chiffré ---------- */
(() => {
  const s = AlgVec.SYSTEMES.rondPoint, n = AlgVec.negligeables("rondPoint");
  $("sys").innerHTML = t("sys.body", { R: F.num(s.R, 2), v: F.num(s.v, 2), a: F.num(s.a, 2), rel: F.sci(n.rel, 1), cor: F.sci(n.coriolis, 1), taille: F.num(s.taille, 1), point: F.num(s.taille / s.R, 1) });
})();

/* ---------- rond-point : Δv entre deux instants, puis Δv/Δt ---------- */
(() => {
  const svg = $("rp"), P = Plot.el, R = AlgVec.SYSTEMES.rondPoint.R, C0 = [170, 160], K = 6, KV = 6, KH = 10, H = [490, 165];   // 1 m = 6 px ; 1 m·s⁻¹ = 6 px, 10 px on the right
  const arrow = (A, B, cls, parent) => Plot.fleche(parent, A, B, { cls });
  const label = (p, text, parent, anchor) => { const e = P("text", { x: p[0], y: p[1], "text-anchor": anchor || "middle" }, parent); e.textContent = text; return e; };
  const S = ["dtsl", "vsl", "atsl"].map($);
  function draw() {
    svg.innerHTML = "";
    const [dt, v0, at0] = S.map(s => +s.value), at = Math.max(at0, -v0 / dt + 1e-9);   // braking never reverses the car
    const r = AlgVec.virage(R, v0, at, dt), th = r.angle, mpos = r.centre.map(q => -R * q);
    const scr = p => [C0[0] + K * p[0], C0[1] - K * p[1]], vs = v => [KV * v[0], -KV * v[1]];
    const P1 = scr([R, 0]), P2 = scr([R * Math.cos(th), R * Math.sin(th)]), M = scr(mpos);
    /* the roundabout and the arc travelled */
    P("circle", { cx: C0[0], cy: C0[1], r: K * R, class: "stroke thin dash c-label-2" }, svg);
    P("circle", { cx: C0[0], cy: C0[1], r: 3, class: "fill c-label-2" }, svg);
    label([C0[0], C0[1] + 16], t("rp.centre"), svg);
    if (th < 2 * Math.PI) P("path", { d: `M${P1[0]} ${P1[1]} A${K * R} ${K * R} 0 ${th > Math.PI ? 1 : 0} 0 ${P2[0].toFixed(1)} ${P2[1].toFixed(1)}`, class: "stroke bold c-label-2" }, svg);
    /* the two velocities where they are */
    arrow(P1, [P1[0] + vs(r.v1)[0], P1[1] + vs(r.v1)[1]], "c-tint", svg);
    arrow(P2, [P2[0] + vs(r.v2)[0], P2[1] + vs(r.v2)[1]], "c-label", svg);
    /* the average acceleration Δv/Δt, drawn at the middle of the arc: it points (nearly) to the centre */
    arrow(M, [M[0] + 3 * KV * r.moy[0], M[1] - 3 * KV * r.moy[1]], "c-warn", svg);
    /* the same two velocities, tail to tail: only there can they be subtracted */
    label([H[0], 14], t("rp.side"), svg);
    const T1 = [H[0] + KH * r.v1[0], H[1] - KH * r.v1[1]], T2 = [H[0] + KH * r.v2[0], H[1] - KH * r.v2[1]];
    arrow(H, T1, "c-tint", svg); arrow(H, T2, "c-label", svg); arrow(T1, T2, "c-warn", svg);
    P("circle", { cx: H[0], cy: H[1], r: 3, class: "fill c-label-2" }, svg);
    label([(T1[0] + T2[0]) / 2 + 22, (T1[1] + T2[1]) / 2 + 4], t("rp.dv"), svg);
    label([H[0], 316], t("rp.side.dv", { dv: F.num(Dyna.norme(r.dv), 3) }), svg);
    const amoy = Dyna.norme(r.moy), aexp = Math.hypot(r.attendu.par, r.attendu.perp);
    $("dtread").textContent = F.qty(F.fix(dt, 1), "s");
    $("vread").textContent = F.qty(S[1].value, MS);
    $("atread").textContent = F.qty(F.fix(at0, 1), MS2);
    $("vmoy").textContent = F.qty(F.num(amoy, 3), MS2); $("fmoy").textContent = t("rp.f.moy", { a: F.num(aexp, 3) });
    $("vperp").textContent = F.qty(F.num(r.perp, 3), MS2); $("fperp").textContent = t("rp.f.perp", { a: F.num(r.attendu.perp, 3) });
    $("vpar").textContent = F.qty(F.num(r.par, 3), MS2); $("fpar").textContent = t("rp.f.par", { a: F.num(r.attendu.par, 2) });
    $("vecart").textContent = F.qty(F.num(Math.abs(amoy / aexp - 1) * 100, 2), "%");
  }
  S.forEach(s => s.oninput = draw); draw();
})();

/* ---------- la station spatiale : v²/R contre le poids à son altitude ---------- */
(() => {
  const h = 420e3, v = 7.67e3, o = AlgVec.orbite(h, v);                // published altitude and speed of the station
  $("iss").innerHTML = t("s3.iss", { h: F.num(h / 1000, 3), R: F.num(o.R / 1000, 4), v: F.num(v, 3), a: F.num(o.a, 3), g: F.num(o.g, 3), T: F.num(o.T / 60, 3), e: F.num(Math.abs(o.ecart) * 100, 1), vc: F.num(o.vc, 4) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["huygens", 1659, "idea"], ["horologium", 1673, "idea"], ["newton", 1684, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["station", "centrifugeuse"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["trois", "a"], ["virage", "a"], ["rayon", "a"], ["freine", "a"], ["queues", "a"], ["galileen", "a"], ["station", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 116 });
})();
</script>
