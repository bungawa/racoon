<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const L = 1, U_MIN = 0.1, U_MAX = 100, uOf = s => U_MIN * Math.pow(U_MAX / U_MIN, s / 100);   // a plate 1 m long; U from 0,1 to 100 m·s⁻¹

/* ---------- §2 : épaisseur le long de la plaque, et le profil de vitesse ---------- */
(() => {
  const P = Plot.el, path = Plot.path, B = Fluides.blasius();
  function draw() {
    const f = Fluides.DYN[$("fl").value], U = uOf(+$("u").value), x = L * +$("x").value / 100;
    const r = Fluides.coucheLimite(x, U, f.nu), xc = Fluides.DYN.reCouche * f.nu / U;
    /* δ(x) on the plate, in mm */
    const xs = Array.from({ length: 201 }, (_, i) => L * (i + 0.5) / 201), ds = xs.map(s => 1000 * Fluides.coucheLimite(s, U, f.nu).delta);
    const top = Math.max(...ds) * 1.15, svg = $("ep"); svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 52 }, x: { domain: [0, L], label: t("ep.x") }, y: { domain: [0, top], label: t("ep.y") } });
    P("path", { d: path([[o.x(0), o.y(0)], ...xs.map((s, i) => [o.x(s), o.y(ds[i])]), [o.x(L), o.y(0)]]), class: "area" }, o.g);
    P("path", { d: path(xs.map((s, i) => [o.x(s), o.y(ds[i])])), class: "curve" }, o.g);
    if (xc < L) P("line", { x1: o.x(xc), x2: o.x(xc), y1: o.y(0), y2: o.y(top), class: "stroke thin dash c-warn" }, o.g);
    P("circle", { cx: o.x(x), cy: o.y(1000 * r.delta), r: 6, class: "dot" }, o.g);
    /* the velocity profile, y/δ against u/U: Blasius, and the 1/7 law of the turbulent layer */
    const g = $("profil"); g.innerHTML = "";
    const q = Plot.axes(g, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 52 }, x: { domain: [0, 1.05], label: t("profil.x") }, y: { domain: [0, 1.5], label: t("profil.y") } });
    const lam = B.profil.filter(([e]) => e / B.eta99 <= 1.5).map(([e, fp]) => [q.x(fp), q.y(e / B.eta99)]);
    const tur = Array.from({ length: 151 }, (_, i) => i / 100).map(s => [q.x(s < 1 ? Math.pow(s, 1 / 7) : 1), q.y(s)]);
    const cur = r.regime === "laminaire";
    P("path", { d: path(cur ? tur : lam), class: "stroke thin dash c-label-2" }, q.g);
    P("path", { d: path(cur ? lam : tur), class: "curve" }, q.g);
    P("line", { x1: q.x(0), x2: q.x(1.05), y1: q.y(1), y2: q.y(1), class: "stroke thin c-label-2" }, q.g);
    /* readouts */
    $("uv").textContent = F.si(U, "m·s⁻¹"); $("xv").textContent = F.si(x, "m", { prefix: x < 1 ? "m" : "" });
    $("vre").textContent = F.sci(r.Rex, 2); $("fre").textContent = t("cl.f.re." + r.regime, { xc: xc < L ? F.si(xc, "m", { prefix: xc < 1 ? "m" : "" }) : t("cl.horsplaque") });
    $("vd").textContent = F.si(r.delta, "m"); $("fd").textContent = t("cl.f.d", { r: F.sci(r.delta / x, 2) });
    $("vt").textContent = F.si(r.tau * f.rho * U * U, "Pa"); $("ft").textContent = t("cl.f.t", { c: F.sci(r.cf, 2) });
  }
  $("fl").onchange = draw; $("u").oninput = draw; $("x").oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["prandtl1904", 1904, "idea"], ["blasius1908", 1908, "idea"], ["karman1921", 1921, "idea"], ["aeroshark2022", 2022, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["riblets", "avion", "maquette"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["distance", "a"], ["vitesse", "b"], ["fluides", "c"], ["parfait", "d"], ["transition", "a"], ["frottement", "b"], ["turbulente", "c"], ["decollement", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 6103 });
})();
</script>
