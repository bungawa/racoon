<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/fmt.js"></script>

<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/relativite.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, K = Constantes, g = K.g_CPGE, T = 100;

/* ---------- the system described: a clock thrown up, back after 100 s ---------- */
(() => {
  const h = g * T * T / 8, v0 = g * T / 2, best = R.excesTempsPropre(R.trajet("parabole", { T, g }), g).exces;
  $("sys1").innerHTML = t("sys1.body", { T: F.si(T, "s"), g: F.si(g, "m·s⁻²"), h: F.si(h, "m"), v: F.si(v0, "m·s⁻¹"),
    gh: F.sci(g * h / K.c ** 2, 2), b2: F.sci((v0 / K.c) ** 2, 2), ex: F.si(best, "s") });
})();

/* ---------- the 100-second game: which way up and down gives the latest reading? ---------- */
(() => {
  const seg = $("forme"), sa = $("sa"), sD = $("sD"), FORMES = ["parabole", "triangle", "palier"];
  const CLS = { parabole: "c-tint", triangle: "c-warn", palier: "c-ok" };
  let forme = "parabole";
  const PS = 1e-12, A = Array.from({ length: 121 }, (_, i) => i * 0.025);
  const libre = R.excesTempsPropre(R.trajet("parabole", { T, g }), g).exces;
  function draw() {
    const alpha = +sa.value / 100, D = +sD.value * 100, tr = R.trajet(forme, { T, g, alpha, D });
    const r = R.excesTempsPropre(tr, g);
    /* height against time: the chosen trajectory, the free fall dashed */
    const traj = $("traj"); traj.innerHTML = "";
    const hmax = 3 * g * T * T / 8 / 1000;
    const P = Plot.axes(traj, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 42 }, x: { domain: [0, T], label: t("fig.xaxis") }, y: { domain: [0, hmax], label: t("fig.yaxis") } });
    const ts = Array.from({ length: 201 }, (_, i) => i * T / 200);
    const ff = R.trajet("parabole", { T, g });
    Plot.el("path", { d: Plot.path(ts.map(s => [P.x(s), P.y(ff.H(s) / 1000)])), class: "stroke dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(ts.map(s => [P.x(s), P.y(tr.H(s) / 1000)])), class: "stroke bold " + CLS[forme] }, P.g);
    /* the excess of proper time against the peak height, for the three shapes */
    const gain = $("gain"); gain.innerHTML = "";
    const courbes = FORMES.map(f => A.map(a => R.excesTempsPropre(R.trajet(f, { T, g, alpha: a, D }), g, 20).exces / PS));
    const top = 1.15 * libre / PS, bas = Math.max(-3 * top, Math.min(-top, ...courbes.flat()));
    const Q = Plot.axes(gain, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 42 }, x: { domain: [0, 3], label: t("fig.xaxis2") }, y: { domain: [bas, top], label: t("fig.yaxis2") } });
    Plot.el("line", { x1: Q.x(0), x2: Q.x(3), y1: Q.y(0), y2: Q.y(0), class: "zero" }, Q.g);
    /* each curve rises then falls: the part above the frame is one piece */
    FORMES.forEach((f, k) => Plot.el("path", { d: Plot.path(A.map((a, i) => [a, courbes[k][i]]).filter(p => p[1] >= bas).map(([a, y]) => [Q.x(a), Q.y(y)])), class: "stroke " + (f === forme ? "bold " : "thin ") + CLS[f] }, Q.g));
    if (r.exces / PS >= bas) Plot.el("circle", { cx: Q.x(alpha), cy: Q.y(r.exces / PS), r: 5, class: "dot" }, Q.g);
    $("sar").textContent = t("fig.alpha.v", { a: F.num(alpha, 3), h: F.si(tr.h, "m") });
    $("sDr").textContent = F.si(D, "m");
    $("vex").textContent = F.si(r.exces, "s");
    $("fex").textContent = t("fig.f.exces", { p: F.num(100 * r.exces / libre, 3) });
    $("vparts").textContent = t("fig.v.parts", { g: F.si(r.gravite, "s"), v: F.si(r.vitesse, "s") });
    $("fparts").textContent = t("fig.f.parts");
    $("vact").textContent = F.qty(F.sci(r.action, 3), "m²·s⁻¹");
    $("fact").textContent = t("fig.f.action");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === forme)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { forme = x.dataset.m; draw(); });
  sa.oninput = sD.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maupertuis", 1744, "idea"], ["cooper", 1963, "experiment"], ["hafele", 1971, "experiment"], ["gpa", 1976, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gps"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["haut", "b"], ["balle", "d"], ["chiffre", "a"], ["signe", "c"], ["action", "a"], ["horizontal", "b"], ["local", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 428 });
})();
</script>
