<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd;

/* ---------- la spire qui tourne : flux, fem, bagues ou collecteur, et la fem recalculée par ∮ (v ∧ B)·ds ---------- */
(() => {
  const N = 200, a = 0.1, b = 0.08, S = a * b;                                   // 200 turns of 10 cm × 8 cm
  const svg = $("trace"), sf = $("sf"), sb = $("sb"), st = $("st"), seg = $("contact");
  let mode = "bagues";
  function draw() {
    const f = +sf.value, B = +sb.value / 1000, w = 2 * Math.PI * f, T = 1 / f, tt = +st.value / 100 * 2 * T;
    const s = M.spireTournante({ N, B, S, omega: w }), e = mode === "bagues" ? s.fem : s.redressee;
    svg.innerHTML = "";
    const Emax = M.spireTournante({ N, B: 0.15, S, omega: 2 * Math.PI * 100 }).femMax;
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 60, b: 44 }, x: { domain: [0, 2], label: t("fig.xaxis") }, y: { domain: [-1.05 * Emax, 1.05 * Emax], label: t("fig.yaxis") } });
    const xs = Array.from({ length: 401 }, (_, i) => i / 200);
    Plot.el("path", { d: Plot.path(xs.map(x => [P.x(x), P.y(e(x * T))])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map(x => [P.x(x), P.y(s.flux(x * T) / (N * 0.15 * S) * Emax)])), class: "ref" }, P.g);
    Plot.el("line", { x1: P.x(0), x2: P.x(2), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("circle", { cx: P.x(tt / T), cy: P.y(e(tt)), r: 5, class: "dot" }, P.g);
    /* the same EMF from the forces on the carriers: one turn, sides a along the axis y, b across, normal at ωt from B ∥ z */
    const th = w * tt, u = [Math.cos(th), 0, -Math.sin(th)], Pt = (p, q) => [p * u[0] * b / 2, q * a / 2, p * u[2] * b / 2];
    const ev = N * M.femMotionnelle([Pt(-1, -1), Pt(1, -1), Pt(1, 1), Pt(-1, 1)], p => [w * p[2], 0, -w * p[0]], [0, 0, B], 10);
    const ec = mode === "bagues" ? ev : Math.abs(ev);
    $("sfr").textContent = F.si(f, "Hz");
    $("sbr").textContent = F.si(B, "T", { prefix: "m" });
    $("str").textContent = F.si(tt, "s", { prefix: "m" });
    $("vmax").textContent = F.si(s.femMax, "V");
    $("fmax").textContent = mode === "bagues" ? t("fig.f.eff", { v: F.si(s.efficace, "V") }) : t("fig.f.moy", { v: F.si(s.moyenneRedressee, "V") });
    $("vflux").textContent = F.si(e(tt), "V");
    $("fflux").textContent = t("fig.f.flux", { v: F.si(s.flux(tt), "Wb", { prefix: "m" }) });
    $("vvb").textContent = F.si(ec, "V");
    $("fvb").textContent = t("fig.f.vb", { e: F.sci(Math.abs(ec - e(tt)) / s.femMax, 1) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; draw(); });
  sf.oninput = sb.oninput = st.oninput = draw; draw();
})();

/* ---------- une machine à courant continu : la même, moteur ou générateur, selon le couple sur l'arbre ---------- */
(() => {
  const o = { k: 0.05, R: 0.5, U: 12 }, sc = $("sc");
  function draw() {
    const Cr = +sc.value / 100, m = M.machineCC(Object.assign({ Cr }, o));
    $("scr").textContent = F.si(Cr, "N·m");
    $("vmode").textContent = t("mc.mode." + m.mode);
    $("fmode").textContent = t("mc.f.mode", { w: F.qty(F.num(m.omega, 3), "rad·s⁻¹"), n: F.num(m.omega * 60 / (2 * Math.PI), 3), e: F.si(m.E, "V") });
    $("vi").textContent = F.si(m.I, "A");
    $("fi").textContent = t("mc.f.i", { c: F.si(m.C, "N·m") });
    $("vp").textContent = F.si(m.Pel, "W");
    $("fp").textContent = t("mc.f.p", { m: F.si(m.Pmeca, "W"), j: F.si(m.Pjoule, "W"), r: m.rendement == null ? t("mc.sans") : F.qty(F.num(100 * m.rendement, 3), "%") });
  }
  sc.oninput = draw; draw();
  const J = 1e-4, L = 1e-3, m = M.machineCC(Object.assign({ Cr: 0.1, J }, o));
  $("sys1").innerHTML = t("sys1.body", { k: F.qty(F.num(o.k, 3), "N·m·A⁻¹"), R: F.si(o.R, "Ω"), U: F.si(o.U, "V"), J: F.qty(F.sci(J, 2), "kg·m²"), tau: F.si(m.tau, "s", { prefix: "m" }),
    L: F.si(L, "H", { prefix: "m" }), te: F.si(L / o.R, "s", { prefix: "m" }), x: F.num(L / o.R / m.tau, 2), Id: F.si(o.U / o.R, "A"), w0: F.qty(F.num(m.omegaVide, 3), "rad·s⁻¹") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rotation", 1821, "experiment"], ["induction", 1831, "experiment"], ["pixii", 1832, "use"], ["gramme", 1873, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["recuperation"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["regle", "c"], ["spire", "a"], ["double", "d"], ["collecteur", "b"], ["contre", "a"], ["k", "c"], ["generateur", "d"], ["demarrage", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 161 });
})();
</script>
