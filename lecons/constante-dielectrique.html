<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;

/* Relative permittivities at 293 K (20 °C), HyperPhysics table « Dielectric Constants at 20°C »; a metal is κ → ∞. */
const KAPPA = { ptfe: 2.1, plexi: 3.4, eau: 80.4, srtio3: 310, metal: Infinity };

/* ---------- le système décrit : 100 V sur 1 mm de PTFE, disques de 10 cm de rayon ---------- */
(() => {
  const a = 0.1, d = 1e-3, U = 100, E0 = U / d, Ea = ES.atomeNuage(0, Constantes.a0).Eatome;
  const bord = ES.kirchhoff(a, d) / ES.capacitePlan(Math.PI * a * a, d) - 1;
  $("sys1").innerHTML = t("sys1.body", { E: F.si(E0, "V·m⁻¹", { prefix: "k" }), Ea: F.sci(Ea, 2), r: F.sci(E0 / Ea, 1),
    da: F.num(d / a, 2), b: F.num(100 * bord, 2), C: F.si(2.1 * ES.capacitePlan(Math.PI * a * a, d), "F", { prefix: "n" }) });
})();

/* ---------- la lame dans l'intervalle ---------- */
(() => {
  const svg = $("cond"), bsl = $("bsl"), d = 1e-3, sigma = 1e-6;
  let mat = "ptfe";
  const W = 640, H = 260, xa = 120, xb = 520, top = 30, bot = 230;   // plates at xa (+) and xb (−)
  function dessin(c, b) {
    svg.innerHTML = "";
    const P = (tag, a, g) => Plot.el(tag, a, g || svg), sx = x => xa + (xb - xa) * x / d;
    const l = c.couches[1], g0 = P("g", { class: "c-tint" });
    if (b > 0) P("rect", { x: sx(l.x0).toFixed(1), y: top, width: (sx(l.x1) - sx(l.x0)).toFixed(1), height: bot - top, class: "fill", opacity: 0.25 }, g0);
    const gw = P("g", { class: "c-warn" });
    [xa - 8, xb].forEach(x => P("rect", { x, y: top - 6, width: 8, height: bot - top + 12, class: "fill" }, gw));
    const n = 9, ys = Array.from({ length: n }, (_, i) => top + (bot - top) * (i + 0.5) / n);
    ys.forEach(y => { P("text", { x: xa - 22, y: y + 5, "text-anchor": "middle", class: "label" }, gw).textContent = "+";
      P("text", { x: xb + 22, y: y + 5, "text-anchor": "middle", class: "label" }, gw).textContent = F.MINUS; });
    if (b > 0) {
      const m = Math.round(n * l.P / sigma), gt = P("g", { class: "c-tint" });
      ys.slice(0, m).forEach((y, i) => { const yy = top + (bot - top) * (i + 0.5) / Math.max(m, 1);
        P("text", { x: sx(l.x0) + 9, y: yy + 5, "text-anchor": "middle", class: "label" }, gt).textContent = F.MINUS;
        P("text", { x: sx(l.x1) - 9, y: yy + 5, "text-anchor": "middle", class: "label" }, gt).textContent = "+"; });
    }
    const gl = P("g", { class: "c-label" }), Emax = sigma / ES.EPS0;
    c.couches.forEach(s => {
      const L = 46 * s.E / Emax, xm = (sx(s.x0) + sx(s.x1)) / 2;
      if (sx(s.x1) - sx(s.x0) < 30) return;
      [ys[1], ys[4], ys[7]].forEach(y => Plot.fleche(gl, [xm - L / 2, y], [xm + L / 2, y], { min: 3 }));
    });
  }
  function draw() {
    const f = +bsl.value, b = f * d, k = KAPPA[mat];
    const c = ES.couches(sigma, [{ e: (d - b) / 2, kappa: 1 }, { e: Math.max(b, 1e-12), kappa: b > 0 ? k : 1 }, { e: (d - b) / 2, kappa: 1 }]);
    dessin(c, b);
    $("bread").textContent = t("ctl.bv", { f: F.num(f, 2) });
    $("vr").textContent = F.num(c.rapport, 3);
    $("fr").textContent = t(k === Infinity ? "f.rapport.metal" : "f.rapport", { k: F.num(k, 3) });
    $("ve").textContent = k === Infinity ? "0" : F.num(1 / k, 3);
    $("fe").textContent = t("f.champ");
    $("vl").textContent = F.num(c.couches[1].P / sigma, 3);
    $("fl").textContent = t("f.liee");
  }
  document.querySelectorAll("#mats button").forEach(bt => bt.onclick = () => {
    mat = bt.dataset.k; document.querySelectorAll("#mats button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  bsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1837, "experiment"], ["cavendish", 1879, "idea"], ["intel", 2007, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["mlcc", "grille"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tension", "c"], ["champ", "a"], ["lame", "d"], ["position", "b"], ["metal", "a"], ["eau", "c"], ["lineaire", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1001 });
})();
</script>
