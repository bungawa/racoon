<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, DEG = Math.PI / 180;

/* ---------- a row of N nuclei, neutrons at normal incidence, d = 2.5 λ (orders 0, ±1, ±2) ---------- */
(() => {
  const D = 2.5, LAM = 1, A = 1, N0 = 501, TH = Array.from({ length: N0 }, (_, i) => -80 + 160 * i / (N0 - 1));
  const sN = $("sN"), sb = $("sb"), seg = $("noyaux");
  let spin = 1;
  function draw() {
    const N = +sN.value, b = spin ? +sb.value : 0;
    const R = TH.map(th => Q.diffusionCristalSpin({ N, phi: OptOnd.phaseReseau(D, LAM, 0, th * DEG), a: A, b }));
    const svg = $("courbe"); svg.innerHTML = "";
    const lo = 1e-4, unite = N * N;                                          // unit: the height of a coherent peak
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-80, 80], label: t("fig.ax.x") },
      y: { scale: "log", domain: [lo, 2], label: t("fig.ax.p") } });
    const ligne = (ys, cls) => Plot.el("path", { d: Plot.path(TH.map((u, i) => [ax.x(u), ax.y(Math.min(2, Math.max(lo, ys[i] / unite)))])), class: cls, fill: "none" }, svg);
    ligne(R.map(r => r.coherent), "stroke thin c-tint");
    if (b > 0) ligne(R.map(r => r.incoherent), "stroke thin dash c-warn");
    ligne(R.map(r => r.total), "stroke c-label");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.n === spin)));
    sb.disabled = !spin;
    $("sNr").textContent = String(N); $("sbr").textContent = F.num(b, 2);
    const pic = Q.diffusionCristalSpin({ N, phi: 0, a: A, b });
    $("vpic").textContent = F.num(pic.coherent, 3);
    $("fpic").textContent = t("fig.f.pic", { n2: F.num(N * N, 4) });
    $("vfond").textContent = F.num(pic.incoherent, 3);
    $("ffond").textContent = t("fig.f.fond", { n: String(N) });
    /* the areas over the angles, in φ: coherent and incoherent both grow as N */
    const n = 2000; let s = 0;
    for (let i = 0; i < n; i++) s += Q.diffusionCristalSpin({ N, phi: 2 * Math.PI * (i + 0.5) / n, a: A }).coherent;
    $("vaires").textContent = F.num(s / n / N, 3) + " ; " + F.num(pic.incoherent / N, 3);
    $("faires").textContent = t("fig.f.aires");
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { spin = +x.dataset.n; draw(); });
  sN.oninput = sb.oninput = draw; draw();
})();

/* ---------- the system described: thermal neutrons on a crystal ---------- */
(() => {
  const v = 2200, p = Q.impulsion(Constantes.m_n, Constantes.m_n * v * v / 2), lam = Q.broglie(p), Ec = Constantes.m_n * v * v / 2;
  const Eco = 3.49 * Q.e;                                              // cohesive energy of copper, per atom
  const kT = Constantes.k_B * 300;                                     // a lattice vibration quantum near the Debye temperature
  $("sys1").innerHTML = t("sys1.body", { lam: F.si(lam, "m"), E: F.si(Ec, "J"), meV: F.num(Ec / Q.e * 1000, 2), Eco: F.si(Eco, "J"),
    r: F.num(Eco / Ec, 2), kT: F.si(kT, "J"), rH: F.num(80.26 / 1.7568, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["chadwick", 1932, "experiment"], ["diffraction", 1936, "experiment"], ["nobel", 1994, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["deuterium", "vanadium"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["trace", "b"], ["n2", "c"], ["fond", "a"], ["sansspin", "d"], ["egal", "b"], ["onde", "c"], ["hydrogene", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 333 });
})();
</script>
