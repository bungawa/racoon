<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, P = Plot.el, DEG = Math.PI / 180;
const deg = r => F.num(r / DEG, 3) + "°";
const dot = (svg, [x, y], cls, lab, dx) => { P("circle", { cx: x, cy: y, r: 5, class: "fill " + cls }, svg);
  if (lab) P("text", { x: x + (dx || 8), y: y - 8 }, svg).textContent = lab; };

/* ---------- Héron : le miroir ---------- */
(() => {
  const svg = $("mir"), A = [0, 3], B = [10, 2], K = 44, X0 = 100, Y0 = 170, px = ([x, y]) => [X0 + K * x, Y0 - K * y];
  function draw() {
    svg.innerHTML = "";
    const x = +$("csl").value, m = O.miroir(A, B, x), Cp = px([x, 0]);
    P("line", { x1: 20, x2: 620, y1: Y0, y2: Y0, class: "stroke bold c-label-2" }, svg);
    P("line", { x1: Cp[0], x2: Cp[0], y1: Y0 - 120, y2: Y0 + 6, class: "stroke thin dash c-label-2" }, svg);
    P("polyline", { points: [px(A), Cp, px(B)].map(p => p.join(",")).join(" "), class: "stroke c-tint" }, svg);
    P("line", { x1: Cp[0], y1: Cp[1], x2: px(m.image)[0], y2: px(m.image)[1], class: "stroke thin dash c-warn" }, svg);
    P("line", { x1: px(A)[0], y1: px(A)[1], x2: px(m.image)[0], y2: px(m.image)[1], class: "stroke thin dash c-label-2" }, svg);
    dot(svg, px(A), "c-label", "A"); dot(svg, px(B), "c-label", "B"); dot(svg, px(m.image), "c-warn", "B′"); dot(svg, Cp, "c-tint", "C", -18);
    $("cread").textContent = F.si(x, "m");
    $("vl").textContent = F.qty(F.fix(m.L, 3), "m");
    $("fl").textContent = Math.abs(x - m.xMin) < 0.026 ? t("mi.f.min", { l: F.fix(m.Lmin, 3) }) : t("mi.f.plus", { e: F.qty(F.fix(m.L - m.Lmin, 3), "m"), x: F.si(m.xMin, "m") });
    $("vang").textContent = deg(m.thetaI) + " ; " + deg(m.thetaR);
    $("fang").textContent = t(Math.abs(m.thetaI - m.thetaR) < 0.3 * DEG ? "mi.f.egal" : "mi.f.inegal");
  }
  $("csl").oninput = draw; draw();
})();

/* ---------- le sauveteur, puis la lumière ---------- */
(() => {
  const c = Constantes.c, N = O.INDICE, GEOM = { a: 20, b: 10, d: 40 };
  const MODES = { sauveteur: { v1: 6, v2: 1.5, u: 1, unit: "s" }, lumiere: { v1: c / N.air, v2: c / N.eau, u: 1e9, unit: "ns" } };
  const LAMBDA = 550e-9;
  let mode = "sauveteur";
  const svg = $("plage"), K = 13, X0 = 50, Y0 = 115, px = ([x, y]) => [X0 + K * x, Y0 - 4.5 * y];
  function draw() {
    const M = MODES[mode], g = Object.assign({ v1: M.v1, v2: M.v2 }, GEOM), best = O.fermat(g), x = +$("xsl").value, T = O.tempsTrajet(x, g);
    svg.innerHTML = "";
    P("rect", { x: 0, y: Y0, width: 640, height: 115, class: "fill c-tint", "fill-opacity": 0.12 }, svg);
    P("line", { x1: 0, x2: 640, y1: Y0, y2: Y0, class: "stroke thin c-label-2" }, svg);
    P("text", { x: 600, y: Y0 - 8, "text-anchor": "end" }, svg).textContent = t("pl.m1." + mode);
    P("text", { x: 600, y: Y0 + 20, "text-anchor": "end" }, svg).textContent = t("pl.m2." + mode);
    const A = px([0, g.a]), B = px([g.d, -g.b]), C = px([x, 0]), Cb = px([best.x, 0]);
    P("polyline", { points: [A, Cb, B].map(p => p.join(",")).join(" "), class: "stroke thin dash c-warn" }, svg);
    P("polyline", { points: [A, C, B].map(p => p.join(",")).join(" "), class: "stroke c-tint" }, svg);
    dot(svg, A, "c-label", "A"); dot(svg, B, "c-label", "B"); dot(svg, C, "c-tint", "C", -18);

    const ch = $("tchart"); ch.innerHTML = "";
    const xs = [], ys = [];
    for (let i = 0; i <= 200; i++) { const u = g.d * i / 200; xs.push(u); ys.push(O.tempsTrajet(u, g) * M.u); }
    const lo = best.T * M.u, hi = Math.max(...ys);
    const { x: X, y: Y, g: G } = Plot.axes(ch, { fmt: F, w: 640, h: 220, x: { domain: [0, g.d], label: t("tc.x") }, y: { domain: [lo - 0.05 * (hi - lo), hi], label: t("tc.y." + mode) } });
    Plot.el("path", { d: xs.map((u, i) => (i ? "L" : "M") + X(u).toFixed(1) + " " + Y(ys[i]).toFixed(1)).join(""), class: "curve" }, G);
    Plot.el("line", { x1: X(best.x), x2: X(best.x), y1: Y(hi), y2: Y(lo - 0.05 * (hi - lo)), class: "ref" }, G);
    Plot.el("circle", { cx: X(x), cy: Y(T * M.u), r: 6, class: "dot" }, G);

    const th1 = Math.atan2(x, g.a), th2 = Math.atan2(g.d - x, g.b);
    $("xread").textContent = F.si(x, "m");
    $("vt").textContent = F.qty(F.fix(T * M.u, mode === "lumiere" ? 3 : 2), M.unit);
    const ex = T - best.T;
    $("ft").textContent = mode === "lumiere" ? t("pl.f.per", { p: F.num(ex * c / LAMBDA, 3) }) : t("pl.f.plus", { e: F.qty(F.fix(ex, 2), "s") });
    $("vmin").textContent = F.qty(F.fix(best.T * M.u, mode === "lumiere" ? 3 : 2), M.unit);
    $("fmin").textContent = t("pl.f.min", { x: F.si(best.x, "m"), a: deg(best.theta1), b: deg(best.theta2) });
    $("vsin").textContent = F.fix(Math.sin(th1) / Math.sin(th2), 3);
    $("fsin").textContent = t("pl.f.sin", { r: F.fix(g.v1 / g.v2, 3) });
  }
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m;
    document.querySelectorAll("[data-m]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  $("xsl").oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["heron", 60, "idea"], ["chambre", 1657, "idea"], ["fermat", 1662, "idea"], ["huygens", 1690, "idea"], ["foucault", 1850, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sismo", "trace"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["image", "a"], ["sauveteur", "b"], ["vitesse", "c"], ["descartes", "d"], ["plat", "a"], ["retour", "b"], ["homogene", "c"], ["mirage", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 263 });
})();
</script>
