<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const DEG = Math.PI / 180, W = Pendule.pulsation(1), T0 = 2 * Math.PI / W;

/* ---------- §2 : le portrait, ses courbes de niveau, une trajectoire calculée ---------- */
(() => {
  const svg = $("portrait"), svgT = $("temps"), XM = 360, YM = 3, QS = { "0": Infinity, "20": 20, "5": 5 };
  let q = "0", o = null;
  /* a curve in (θ in rad, θ̇) → screen; copies shifted by ±2π so both wells show; cut where θ jumps */
  const draw = (pts, cls, shifts) => (shifts || [0]).forEach(s =>
    Plot.el("path", { d: path(pts.map(([th, om]) => [o.x(th / DEG + s), o.y(om / W)])), class: cls }, o.g));
  function wrapped(th, om) {                                   // a long trajectory folded into [−360°, 360°[
    const segs = [[]];
    th.forEach((a, i) => {
      const d = a / DEG, x = d - 720 * Math.floor((d + 360) / 720), last = segs[segs.length - 1];
      if (last.length && Math.abs(x - last[last.length - 1][0]) > 360) segs.push([]);
      segs[segs.length - 1].push([x, om[i] / W]);
    });
    return segs;
  }
  function upd() {
    ["0", "20", "5"].forEach(k => $("q-" + k).setAttribute("aria-pressed", String(k === q)));
    const th0 = +$("pth").value * DEG, om0 = +$("pom").value / 100 * W, Q = QS[q];
    svg.innerHTML = "";
    o = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { b: 44, l: 48 }, x: { domain: [-XM, XM], label: t("pp.xaxis") }, y: { domain: [-YM, YM], label: t("pp.yaxis") } });
    /* the copies shifted by ±360° stop at the frame */
    const clip = Plot.el("clipPath", { id: "pp-clip" }, Plot.el("defs", {}, svg));
    Plot.el("rect", { x: o.x(-XM), y: o.y(YM), width: o.x(XM) - o.x(-XM), height: o.y(-YM) - o.y(YM) }, clip);
    o.g = Plot.el("g", { "clip-path": "url(#pp-clip)" }, svg);
    [0.05, 0.2, 0.4, 0.6, 0.8, 0.95].forEach(k2 => draw(Pendule.courbe(W, k2)[0], "grid", [-360, 0, 360]));
    [1.2, 1.6].forEach(k2 => Pendule.courbe(W, k2).forEach(c => draw(c, "grid", [-360, 0, 360])));
    Pendule.courbe(W, 1).forEach(c => draw(c, "ref", [-360, 0, 360]));
    const k2 = Pendule.kappa2(W, th0, om0), nat = Pendule.nature(W, th0, om0, 1e-3);
    const dur = Q === Infinity ? Math.min(Math.max(1.05 * (nat === "oscillation" || nat === "revolution" ? Pendule.periodeEnergie(W, k2) : 0), 2 * T0), 8 * T0) : 12 * T0;
    const run = Pendule.trajectoire(W, th0, om0, { Q, h: T0 / 400, duree: dur });
    wrapped(run.th, run.om).forEach(s => Plot.el("path", { d: path(s.map(([x, y]) => [o.x(x), o.y(Math.max(-YM, Math.min(YM, y)))])), class: "curve" }, o.g));
    Plot.el("circle", { cx: o.x(th0 / DEG), cy: o.y(om0 / W), r: 5, class: "dot" }, o.g);
    /* θ(t), in degrees */
    svgT.innerHTML = "";
    const lo = Math.min(-200, ...run.th.map(a => a / DEG)), hi = Math.max(200, ...run.th.map(a => a / DEG));
    const ot = Plot.axes(svgT, { fmt: F, w: 640, h: 200, pad: { b: 44, l: 56 }, x: { domain: [0, dur], label: t("pp.taxis") }, y: { domain: [lo, hi], label: t("pp.thaxis") } });
    Plot.el("path", { d: path(run.t.map((tt, i) => [ot.x(tt), ot.y(run.th[i] / DEG)])), class: "curve" }, ot.g);
    /* readouts */
    $("pthv").textContent = F.num(th0 / DEG, 3) + "°";
    $("pomv").textContent = t("pp.om0v", { r: F.num(om0 / W, 3) });
    $("vk2").textContent = F.num(k2, 3);
    $("vnat").textContent = t("pp.nature." + nat);
    $("fnat").textContent = Q === Infinity ? t("pp.f.nature." + nat) : t("pp.f.amorti", { Q: F.num(Q, 2) });
    const T = nat === "oscillation" || nat === "revolution" ? Pendule.periodeEnergie(W, k2) : nat === "separatrice" ? Infinity : NaN;
    $("vT").textContent = isFinite(T) ? F.si(T, "s", { sig: 3 }) : nat === "separatrice" ? "∞" : F.MINUS;
    $("fT").textContent = t("pp.f.T." + nat, { r: isFinite(T) ? F.num(T / T0, 3) : "" });
  }
  ["0", "20", "5"].forEach(k => $("q-" + k).onclick = () => { q = k; upd(); });
  $("pth").oninput = $("pom").oninput = upd;
  /* a click on the portrait starts the motion there */
  svg.addEventListener("pointerdown", e => {
    if (!o) return;
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const c = p.matrixTransform(svg.getScreenCTM().inverse());
    let d = o.x.inv(c.x); d = d - 360 * Math.round(d / 360);
    $("pth").value = Math.round(Math.max(-180, Math.min(180, d)));
    $("pom").value = Math.round(Math.max(-YM, Math.min(YM, o.y.inv(c.y))) * 100);
    upd();
  });
  upd();
})();

/* ---------- §4 : la séparatrice, période qui diverge ---------- */
(() => {
  const ROWS = [["e2", 1e-2], ["e4", 1e-4], ["e8", 1e-8]];
  const txt = textOf("sep.items", ROWS.map(r => r[0]));
  $("sep").innerHTML = ROWS.map(([id, e]) => `<div><span class="k">${F.num(Pendule.periodeEnergie(W, 1 - e) / T0, 3)} <var>T</var>₀</span><span>${txt[id]}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["poincare1881", 1881, "idea"], ["stephenson1908", 1908, "idea"], ["kapitza1951", 1951, "experiment"], ["paul1989", 1989, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["piege", "gyropode"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["fermee", "b"], ["ouverte", "c"], ["col", "a"], ["periode", "d"], ["spirale", "b"], ["fil", "c"], ["sommet", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1102 });
})();
</script>
