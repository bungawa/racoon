<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions, p = C.pente();
const V = (x, d = 2) => F.qty(F.fix(x, d), "V"), J = j => F.si(j, "A·m⁻²", { sig: 2 });
const AN = 365.25 * 86400;
/* a segmented control: buttons carry data-v, the chosen one is aria-pressed */
const seg = (id, v, f) => { const bs = [...$(id).querySelectorAll("button")], set = w => { v = w; bs.forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); f(v); };
  bs.forEach(b => b.onclick = () => set(b.dataset.v)); set(v); };
/* draws a summed i-E curve in the frame (pixels), the parts outside the j range left out */
const tracer = (path, bs, X, Y, x, y) => {
  const pts = C.courbeIE(bs, X, 500).filter(([, j], k, a) => [a[k - 1], a[k], a[k + 1]].some(q => q && q[1] >= Y[0] && q[1] <= Y[1]));
  path.setAttribute("d", Plot.path(pts.map(([E, j]) => [x(E), y(Math.max(Y[0], Math.min(Y[1], j)))])));
};

/* ---------- corrosion uniforme : potentiel mixte ---------- */
(() => {
  const svg = $("corr"), METAUX = { zn: { E0: -0.76, M: 0.06538, rho: 7140 }, fe: { E0: -0.44, M: 0.055845, rho: 7874 } };
  const O2 = 2.6e-4;                                           // dioxygen of water saturated with air at 298 K, mol·L⁻¹
  let metal = "zn", milieu = "acide";
  const khsl = $("khsl"), kdsl = $("kdsl");
  function draw() {
    const m = METAUX[metal], kH = Math.pow(10, +khsl.value), kd = Math.pow(10, +kdsl.value), pH = milieu === "acide" ? 0 : 7;
    $("khread").textContent = F.qty(F.sci(kH, 2), "m·s⁻¹"); $("kdread").textContent = F.qty(F.sci(kd, 2), "m·s⁻¹");
    /* the metal dissolves into M²⁺ (10⁻⁶ mol·L⁻¹ in the solution, the convention of corrosion); the oxidants: H⁺ or water, and O₂ when aerated */
    const anode = [{ E0: m.E0, n: 2, k0: 1e-10, cox: 1e-6, cred: 1 }];
    const cathode = [Object.assign(C.brancheH2(pH, kH), { kdC: milieu === "acide" ? kd : Infinity })].concat(milieu === "neutre" ? [C.brancheO2red(pH, O2, kd)] : []);
    const r = C.potentielMixte(anode.concat(cathode), [-2, 1.5]);
    $("ecorr").textContent = V(r.E); $("jcorr").textContent = J(r.j);
    $("vcorr").textContent = F.si(C.vitesseCorrosion(r.j, m.M, 2, m.rho) * AN, "m", { sig: 2 });
    /* frame: ± 0,3 V around the mixed potential, ± 2,5 corrosion currents */
    svg.textContent = "";
    const X = [Math.round((r.E - 0.3) * 20) / 20, Math.round((r.E + 0.3) * 20) / 20], jm = 2.5 * r.j, Y = [-jm, jm];
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { b: 44, l: 64 }, x: { domain: X, label: t("corr.x") },
      y: { domain: Y, label: t("corr.y"), fmt: v => F.num(v, 2) } });
    Plot.el("line", { x1: x(X[0]), x2: x(X[1]), y1: y(0), y2: y(0), class: "zero" }, g);
    tracer(Plot.el("path", { class: "curve" }, g), anode, X, Y, x, y);
    tracer(Plot.el("path", { class: "ref" }, g), cathode, X, Y, x, y);
    Plot.el("line", { x1: x(r.E), x2: x(r.E), y1: y(r.j), y2: y(-r.j), class: "zero" }, g);
    [r.j, -r.j].forEach(j => Plot.el("circle", { cx: x(r.E), cy: y(j), r: 6, class: "dot" }, g));
    Plot.el("text", { x: x(r.E) + 8, y: y(-0.5 * r.j), class: "note" }, g).textContent = t("corr.ecorr");
  }
  seg("metal", metal, v => { metal = v; draw(); });
  seg("milieu", milieu, v => { milieu = v; draw(); });
  khsl.oninput = kdsl.oninput = draw;
})();

/* ---------- protections ---------- */
(() => {
  const P = ["revetement", "zinc", "anode", "courant", "passivation"], txt = textOf("s2.protections", P);
  $("protections").innerHTML = P.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].v}</span></div>`).join("");
})();

/* ---------- électrolyse de l'eau, recharge de l'accumulateur au plomb ---------- */
(() => {
  const svg = $("elec"), X = [-1.6, 2.4], Y = [-250, 250], R = 2e-4;          // R: area resistance of the cell, Ω·m² (model)
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 360, pad: { b: 44 }, x: { domain: X, label: t("corr.x") }, y: { domain: Y, label: t("corr.y") } });
  Plot.el("line", { x1: x(X[0]), x2: x(X[1]), y1: y(0), y2: y(0), class: "zero" }, g);
  const ca = Plot.el("path", { class: "curve" }, g), cc = Plot.el("path", { class: "curve" }, g);
  const pa = Plot.el("circle", { r: 6, class: "dot" }, g), pc = Plot.el("circle", { r: 6, class: "dot" }, g);
  const jsl = $("jsl"), socsl = $("socsl");
  let mode = "eau";
  function draw() {
    const j = +jsl.value, soc = +socsl.value / 100;
    $("jread").textContent = J(j); $("socread").textContent = F.qty(F.num(+socsl.value, 3), "%");
    socsl.disabled = mode === "eau";
    let anode, cathode, e;
    if (mode === "eau") { anode = [Object.assign(C.brancheO2(0), { cox: 1 })]; cathode = [Object.assign(C.brancheH2(0, C.K_H2.pt), { cred: 1 })]; e = 1.23; }   // the gases formed, at 1 bar on each electrode: no current below the Nernst potentials
    else {
      /* PbSO₄ left on each plate: a limiting current proportional to it, 250 A·m⁻² when fully discharged (model) */
      const kd = 250 * (1 - soc) / (2 * C.F * 1000);
      anode = [{ E0: 1.69, n: 2, k0: 1e-7, cox: 1, cred: 1, kdA: kd }, C.brancheO2(0, 1e-19)];        // O₂ is slow on PbO₂
      cathode = [{ E0: -0.36, n: 2, k0: 1e-7, cox: 1, cred: 1, kdC: kd }, C.brancheH2(0, C.K_H2.pb)];
      e = 1.69 + 0.36;
    }
    tracer(ca, anode, X, Y, x, y); tracer(cc, cathode, X, Y, x, y);
    const r = C.electrolyse(anode, cathode, j, R, [-3, 4]);
    pa.setAttribute("cx", x(r.Ea)); pa.setAttribute("cy", y(j)); pc.setAttribute("cx", x(r.Ec)); pc.setAttribute("cy", y(-j));
    $("u").textContent = V(r.U); $("uf").textContent = t("elec.uf", { e: V(e) });
    $("parts").textContent = t("elec.partsv", { a: V(r.Ea), c: V(r.Ec), r: V(R * j, 3) });
    const utile = (bs, E) => Math.abs(C.courant(E, bs[0])) / Math.abs(bs.reduce((q, b) => q + C.courant(E, b), 0));
    $("rf").textContent = mode === "eau" ? t("elec.rf1") : t("elec.rfv", { a: F.qty(F.fix(100 * utile(anode, r.Ea), 0), "%"), c: F.qty(F.fix(100 * utile(cathode, r.Ec), 0), "%") });
  }
  seg("mode", mode, v => { mode = v; draw(); });
  jsl.oninput = socsl.oninput = draw;
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["volta", 1800, "experiment"], ["nicholson", 1800, "experiment"], ["davy", 1824, "use"], ["plante", 1859, "use"], ["wagner", 1938, "idea"], ["liion", 1991, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["galva", "navires", "batterie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["mixte", "b"], ["contact", "a"], ["oxygene", "d"], ["etain", "c"], ["sacrif", "a"], ["seuil", "b"], ["masse", "d"], ["recharge", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
