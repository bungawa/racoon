<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimArchi;

/* ---------- où s'arrête la réaction : Q(ξ) contre K ---------- */
(() => {
  const ESP = ["acide", "alcool", "ester", "eau", "CH3COOH", "H2O", "CH3COO-", "H3O+", "N2O4", "NO2"], nom = textOf("esp", ESP);
  /* one setting per system: the slider (0…1000) maps to a log scale; n0 and ctx follow from it */
  const SYS = {
    ester: { lo: 0.25, hi: 4, n0: v => [1, v, 0, 0], ctx: () => ({}), lab: v => F.fix(v, 2) },
    ethanoique: { lo: 1e-4, hi: 1, n0: v => [v, 55.5, 0, 0], ctx: () => ({ V: 1 }), lab: v => F.qty(F.sci(v, 2), "mol·L⁻¹") },
    n2o4: { lo: 0.1, hi: 10, n0: () => [1, 0], ctx: v => ({ p: v }), lab: v => F.qty(F.num(v, 2), t("eq.bar")) },
  };
  const seg = $("sseg"), par = $("par"), svg = $("graphe");
  let s = "ester";
  function draw() {
    const S = SYS[s], R = C.REACTIONS[s], esp = R.esp, nu = esp.map(e => e.nu);
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === s)));
    const v = S.lo * Math.pow(S.hi / S.lo, par.value / 1000), n0 = S.n0(v), ctx = S.ctx(v);
    $("parLab").textContent = t("sim.par." + s); $("parv").textContent = S.lab(v);
    const terme = e => (Math.abs(e.nu) === 1 ? "" : Math.abs(e.nu) + " ") + nom[e.id];
    $("equation").textContent = esp.filter(e => e.nu < 0).map(terme).join(" + ") + " ⇌ " + esp.filter(e => e.nu > 0).map(terme).join(" + ");
    const f = C.etatFinal(esp, n0, R.K, ctx), xm = f.bornes.xiMax, lgK = Math.log10(R.K);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { domain: [0, 1], label: t("sim.ax.x") }, y: { domain: [lgK - 6, lgK + 6], label: t("sim.ax.y") } });
    const clip = u => Math.min(Math.max(u, lgK - 6), lgK + 6), pts = [];
    for (let k = 1; k < 400; k++) { const tau = k / 400; pts.push([x(tau), y(clip(C.lnQ(esp, C.quantites(n0, nu, tau * xm), ctx) / Math.LN10))]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold c-tint" }, g);
    Plot.el("line", { x1: x(0), x2: x(1), y1: y(lgK), y2: y(lgK), class: "stroke dash c-warn" }, g);
    Plot.el("circle", { cx: x(f.tau), cy: y(lgK), r: 6, class: "fill c-warn" }, g);
    Plot.el("line", { x1: x(f.tau), x2: x(f.tau), y1: y(lgK), y2: y(lgK - 6), class: "ref" }, g);
    $("vk").textContent = Math.abs(lgK) < 2 ? F.num(R.K, 2) : F.sci(R.K, 2);
    $("vtau").textContent = F.qty(F.fix(100 * f.tau, f.tau > 0.995 ? 2 : 1), "%");
    /* a third number, the one that tells whether the model holds */
    if (s === "ester") { $("kx").textContent = t("sim.k.ester"); $("vx").textContent = F.qty(F.fix(f.n[2], 2), "mol"); $("fx").textContent = t("sim.f.ester"); }
    if (s === "ethanoique") { const h = f.n[3], gam = C.gammaDH(1, h);
      $("kx").textContent = t("sim.k.ph"); $("vx").textContent = F.fix(-Math.log10(h), 2);
      $("fx").textContent = t("sim.f.ph", { e: F.qty(F.num(100 * (1 - gam), 2), "%") }); }
    if (s === "n2o4") { const pNO2 = f.n[1] / (f.n[0] + f.n[1]) * v;
      $("kx").textContent = t("sim.k.no2"); $("vx").textContent = F.qty(F.num(pNO2, 3), t("eq.bar")); $("fx").textContent = t("sim.f.no2"); }
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { s = b.dataset.s; draw(); });
  par.oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["berthollet", 1803, "idea"], ["berthelot", 1862, "experiment"], ["guldberg", 1864, "idea"], ["lewis", 1907, "idea"], ["sorensen", 1924, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ph"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pur", "c"], ["solvant", "a"], ["dim", "d"], ["deuxsens", "b"], ["dilution", "c"], ["pression", "a"], ["ester", "d"], ["ideal", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
