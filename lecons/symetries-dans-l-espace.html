<main class="page">

    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-solide" href="/racoon/atlas?piste=solide" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/symetries-dans-le-plan" data-i18n="tag.prereq"></a>
    </div>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi mathvariant="bold">r</mi><mo>=</mo><msub><mi>n</mi><mn>1</mn></msub><mi mathvariant="bold">a</mi><mo>+</mo><msub><mi>n</mi><mn>2</mn></msub><mi mathvariant="bold">b</mi><mo>+</mo><msub><mi>n</mi><mn>3</mn></msub><mi mathvariant="bold">c</mi><mo>,</mo><mspace width="1em"></mspace><msub><mi>n</mi><mi>i</mi></msub><mo>∈</mo><mi>ℤ</mi></math></div>
    <p class="validite" data-i18n-html="val.reseau"></p>
    <p data-i18n-html="s1.p2"></p>

    <p data-i18n-html="s1.p3"></p>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure>
      <div class="stage"><canvas id="vue"></canvas><div class="overlay" id="vueinfo"></div></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" id="sys" role="group" data-i18n-attr="aria-label:v3.systeme">
            <button type="button" data-s="triclinique" data-i18n="sys.court.triclinique"></button><button type="button" data-s="monoclinique" data-i18n="sys.court.monoclinique"></button><button type="button" data-s="orthorhombique" data-i18n="sys.court.orthorhombique"></button><button type="button" data-s="tetragonal" data-i18n="sys.court.tetragonal"></button><button type="button" data-s="trigonal" data-i18n="sys.court.trigonal"></button><button type="button" data-s="hexagonal" data-i18n="sys.court.hexagonal"></button><button type="button" data-s="cubique" data-i18n="sys.court.cubique"></button>
          </div>
          <div class="seg" id="cen" role="group" data-i18n-attr="aria-label:v3.centrage">
            <button type="button" data-c="P" data-i18n="cen.P"></button><button type="button" data-c="C" data-i18n="cen.C"></button><button type="button" data-c="I" data-i18n="cen.I"></button><button type="button" data-c="F" data-i18n="cen.F"></button>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="v3.k.type"></span><span class="v" id="vtype"></span><span class="f" id="ftype"></span></div>
          <div class="stat"><span class="k" data-i18n="v3.k.noeuds"></span><span class="v" id="vnoeuds"></span><span class="f" data-i18n="v3.f.noeuds"></span></div>
          <div class="stat"><span class="k" data-i18n="v3.k.ordre"></span><span class="v" id="vordre"></span><span class="f" data-i18n="v3.f.ordre"></span></div>
          <div class="stat"><span class="k" data-i18n="v3.k.libres"></span><span class="v" id="vlibres"></span><span class="f" data-i18n="v3.f.libres"></span></div>
        </div>
      </div>
      <div class="legend"><span class="c-tint" data-i18n="v3.leg.coin"></span><span class="el-o" data-i18n="v3.leg.centre"></span></div>
      <figcaption data-i18n-html="v3.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mo>(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo>,</mo><mi>z</mi><mo>)</mo><mo>↦</mo><mo>(</mo><mo>−</mo><mi>x</mi><mo>,</mo><mo>−</mo><mi>y</mi><mo>,</mo><mo>−</mo><mi>z</mi><mo>)</mo><mo>,</mo><mspace width="1em"></mspace><mi data-i18n="eq.det"></mi><mo>=</mo><mo>−</mo><mn>1</mn></math></div>
    <p class="validite" data-i18n-html="val.inversion"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="eq"><math display="block"><mi>R</mi><mspace width="0.2em"></mspace><mi>α</mi><mspace width="0.2em"></mspace><msup><mi>R</mi><mi mathvariant="normal">T</mi></msup><mo>=</mo><mi>α</mi><mspace width="1em"></mspace><mtext data-i18n="eq.pour"></mtext><mspace width="0.5em"></mspace><mi>R</mi></math></div>
    <p class="validite" data-i18n-html="val.neumann"></p>
    <div class="list keyed" id="ellipsoides"></div>
    <p data-i18n-html="s3.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/symetries-dans-l-espace.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/cristaux.js"></script>
<script src="/racoon/vue-cristal.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), X = Cristaux;
const keyed = (el, tag, ids, items, sub) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text.replace(/\{(\w+)\}/g, (m, k) => (sub && sub[id] && k in sub[id] ? sub[id][k] : m))}</span></div>`).join(""); };
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); return pick; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SYS = X.SYSTEMES.map(s => s.id);
/* generic cell: no accidental equality of lengths or angles, so each system shows only its own symmetry */
const PARAM = { a: 300e-12, b: 370e-12, c: 460e-12, alpha: 78, beta: 104, gamma: 69 }, RHOMBO = { a: 300e-12, alpha: 75 };
const conv = s => X.maille3D(s, s === "trigonal" ? RHOMBO : PARAM);
const groupes = {};   // holohedry of each system, computed once
const groupe = s => groupes[s] || (groupes[s] = X.holoedrie(conv(s)));

/* ---------- les sept systèmes ---------- */
(() => {
  const items = textOf("sys.items", SYS), sub = {};
  SYS.forEach(s => { sub[s] = { n: groupe(s).length }; });
  keyed($("systemes"), t("sys.tag"), SYS, items, sub);
})();

/* ---------- les quatorze réseaux en 3D ---------- */
(() => {
  const vue = VueCristal.monter($("vue"), $("vueinfo"), { hors: t("v3.hors"), reduit: reduce });
  const nom = L => t("bravais." + L.id);
  let sys = SYS[0], cen = "P";
  const cache = {};
  function upd() {
    const B = conv(sys), key = sys + cen;
    const r = cache[key] || (cache[key] = (() => { const P = X.primitifs(B, cen), ty = X.typeBravais(P), H = X.holoedrie(P);
      return { ty, H, l2: X.composantesInvariantes(H, 2), l4: X.composantesInvariantes(H, 4) }; })());
    const nds = X.noeuds3D(B, cen, 2);
    if (vue) vue.montrer(nds.map(q => ({ e: q.centre ? "centre" : "coin", r: q.r })), { dLiaison: 0, cellule: B,
      rayons: { coin: 0.07, centre: 0.07 }, couleurs: { coin: "--tint", centre: "--el-o" } });
    $("vnoeuds").textContent = String(X.CENTRAGES[cen].length);
    $("vordre").textContent = String(r.H.length);
    $("vlibres").textContent = t("v3.v.libres", { p: r.l2, e: r.l4 });
    const L = X.BRAVAIS3D.find(x => x.id === r.ty.id);
    $("vtype").textContent = L ? nom(L) : "";
    const demande = X.BRAVAIS3D.find(x => x.systeme === sys && x.centrage === cen);
    $("ftype").textContent = demande ? t("v3.f.liste", { n: X.BRAVAIS3D.indexOf(demande) + 1 })
      : L.systeme === sys ? t("v3.f.deja") : t("v3.f.perdu", { s: t("sys.adj." + sys) });
  }
  seg($("sys"), "s", s => { sys = s; upd(); });
  seg($("cen"), "c", c => { cen = c; upd(); });
})();

/* ---------- ellipsoïdes de polarisabilité ---------- */
(() => {
  const items = textOf("ell.items", SYS), sub = {};
  SYS.forEach(s => { sub[s] = { p: X.composantesInvariantes(groupe(s), 2) }; });
  keyed($("ellipsoides"), t("ell.tag"), SYS, items, sub);
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hessel", 1830, "idea"], ["frankenheim", 1842, "idea"], ["bravais", 1850, "idea"], ["curie", 1880, "experiment"], ["fedorov", 1891, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["quartz", "tables"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["trois", "b"], ["quatorze", "d"], ["cubiqueC", "a"], ["ordre", "c"], ["inversion", "b"], ["sphere", "a"], ["quartz", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
</html>
