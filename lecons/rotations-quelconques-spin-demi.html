<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- a state along (θ, φ) by (6.36), an apparatus T by (6.35) with γ = 0; P(+T) from the amplitudes and from the angle ---------- */
(() => {
  const ids = ["sth", "sph", "sa", "sb"], deg = id => +$(id).value * Math.PI / 180;
  /* the axis of T: the mean spin of its state +T, written in the base S (R† applied to (1, 0)) */
  const axeT = R => Q.moyenneSigma(Q.appliquer(Q.adjointe(R), Q.etatBase(2, 0)));
  const proj = v => [320 + 110 * (v[1] - 0.45 * v[0]), 140 - 110 * (v[2] - 0.3 * v[0])];   // oblique view: y right, z up, x towards us
  function draw() {
    const th = deg("sth"), f = deg("sph"), R = Q.demiEuler(deg("sa"), deg("sb"), 0), psi = Q.amplitudesAxe(th, f);
    const n = [Math.sin(th) * Math.cos(f), Math.sin(th) * Math.sin(f), Math.cos(th)], m = axeT(R);
    const cosT = Math.max(-1, Math.min(1, n[0] * m[0] + n[1] * m[1] + n[2] * m[2]));
    const svg = $("sphere"); svg.innerHTML = "";
    Plot.el("circle", { cx: 320, cy: 140, r: 110, class: "stroke thin c-label-2", fill: "none" }, svg);
    [[[1, 0, 0], "fig.x"], [[0, 1, 0], "fig.y"], [[0, 0, 1], "fig.z"]].forEach(([v, k]) => {
      Plot.fleche(svg, proj([0, 0, 0]), proj(v), { cls: "c-label-2", tete: 6 });
      const p = proj(v.map(x => x * 1.12)); Plot.el("text", { x: p[0], y: p[1] + 4, "text-anchor": "middle" }, svg).textContent = t(k);
    });
    Plot.fleche(svg, proj([0, 0, 0]), proj(n), { cls: "c-tint", tete: 10, trait: "stroke bold" });
    Plot.fleche(svg, proj([0, 0, 0]), proj(m), { cls: "c-warn", tete: 10, trait: "stroke bold" });
    ids.forEach(id => { $(id + "r").textContent = F.num(+$(id).value, 3) + "\u00a0°"; });
    const c = Q.appliquer(R, psi);
    $("vp").textContent = F.num(Cx.abs2(c[0]), 3); $("fp").textContent = t("fig.f.p", { v: F.num((1 + cosT) / 2, 3) });
    $("vangle").textContent = F.num(Math.acos(cosT) * 180 / Math.PI, 3) + "\u00a0°"; $("fangle").textContent = t("fig.f.angle");
    $("vc").textContent = c.map(z => Cx.text(z, x => F.num(Math.abs(x) < 5e-13 ? 0 : x, 3))).join(" ; ");
  }
  ids.forEach(id => { $(id).oninput = draw; }); draw();
  const p = Cx.abs2(Q.appliquer(Q.demiEuler(Math.PI / 3, 0, 0), Q.amplitudesAxe(0, 0))[0]);
  $("sys1").innerHTML = t("sys1.body", { p: F.num(p, 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["euler", 1776, "idea"], ["rodrigues", 1840, "idea"], ["pauli", 1927, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sphere"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["trois", "b"], ["proba", "d"], ["oppose", "a"], ["direction", "c"], ["phase", "b"], ["vecteur", "a"], ["mesure", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 606 });
})();
</script>
