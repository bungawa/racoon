<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analyse rétrosynthétique</title>
<link rel="stylesheet" href="/racoon/ds.css">
<style>
  #cible { width: 100%; max-width: 360px; height: 170px; }
  .deux { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .deux svg { width: 100%; height: 140px; }
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-organique" data-i18n="monde.chim-organique"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-activation-protection" data-i18n="etape.chim-activation-protection"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/protection-deprotection" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="box def"><b data-i18n="s1.def.titre"></b>
      <p data-i18n-html="s1.def.corps"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="tgt" data-i18n="retro.cible"></label></div><select id="tgt"></select></div>
        <div class="seg" role="group" id="coupures"></div>
      </div>
      <svg class="fig no-sigle" id="cible" role="img" data-i18n-attr="aria-label:retro.ariaCible"></svg>
      <div class="deux">
        <div><svg class="fig no-sigle" id="nuc" role="img" data-i18n-attr="aria-label:retro.ariaNuc"></svg><p class="readout" id="tnuc"></p></div>
        <div><svg class="fig no-sigle" id="elec" role="img" data-i18n-attr="aria-label:retro.ariaElec"></svg><p class="readout" id="telec"></p></div>
      </div>
      <p class="readout" id="verdict" aria-live="polite"></p>
      <figcaption data-i18n-html="retro.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><msub><mi>η</mi><mtext data-i18n="eq.lin"></mtext></msub><mo>=</mo><msup><mi>η</mi><mrow><mn>2</mn><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msup><mspace width="1em"></mspace><msub><mi>η</mi><mtext data-i18n="eq.conv"></mtext></msub><mo>=</mo><msup><mi>η</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msup></math></div>
    <p class="validite" data-i18n-html="s3.validite"></p>
    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="eta" data-i18n="rdt.eta"></label><output id="etav" for="eta"></output></div>
          <input id="eta" type="range" min="0.5" max="0.99" step="0.01" value="0.8"></div>
        <div class="ctl"><div class="row"><label for="k" data-i18n="rdt.k"></label><output id="kv" for="k"></output></div>
          <input id="k" type="range" min="1" max="8" step="1" value="3"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="rdt.k.lin"></span><span class="v" id="vlin"></span><span class="f" id="flin"></span></div>
          <div class="stat"><span class="k" data-i18n="rdt.k.conv"></span><span class="v" id="vconv"></span><span class="f" id="fconv"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="rdt.caption"></figcaption>
    </figure>
    <p data-i18n-html="s3.p2"></p>
    <div class="list keyed" id="economie"></div>
    <p data-i18n-html="s3.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/analyse-retrosynthetique.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/chim-organique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = ChimOrga, sym = s => t("chim.sym", { s });
const peindre = (svg, d) => { svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };
const pct = x => F.qty(F.fix(100 * x, 1), "%");

/* ---------- choisir une déconnexion ---------- */
(() => {
  const IDS = Object.keys(O.CIBLES_RETRO), noms = textOf("retro.cibles", IDS);
  const cles = IDS.flatMap(id => O.CIBLES_RETRO[id].coupures.map((_, k) => id + k)), liaisons = textOf("retro.coupures", cles);
  $("tgt").innerHTML = IDS.map(id => `<option value="${id}">${noms[id]}</option>`).join("");
  let k = 0;
  function maj() {
    const id = $("tgt").value, c = O.CIBLES_RETRO[id], m = O.mol(c.spec), [a, b] = c.coupures[k], d = O.deconnecter(m, a, b);
    $("coupures").innerHTML = c.coupures.map((_, j) => `<button type="button" data-k="${j}" aria-pressed="${j === k}">${liaisons[id + j]}</button>`).join("");
    peindre($("cible"), O.dessin(m, { texte: sym, echelle: 36, surligne: [a, b] }));
    const etq = d.type === "organomagnesien" ? { [d.nucleophile.m.atomes.length - 1]: "MgBr" } : {};
    peindre($("nuc"), O.schema(d.nucleophile.m, { texte: sym, echelle: 30, doublets: false, etiquettes: etq, surligne: [d.nucleophile.atome] }));
    peindre($("elec"), O.schema(d.electrophile.m, { texte: sym, echelle: 30, doublets: false, surligne: [d.electrophile.atome] }));
    $("tnuc").textContent = t("retro.nuc", { s: d.nucleophile.synthon, e: t("retro.eq." + d.nucleophile.equivalent) });
    $("telec").textContent = t("retro.elec", { s: d.electrophile.synthon, e: t("retro.eq." + d.electrophile.equivalent) });
    $("verdict").textContent = t("retro.v." + d.verdict, { c: d.electrophile.classe ? t("retro.classe." + d.electrophile.classe) : "" });
  }
  $("coupures").onclick = e => { const btn = e.target.closest("button"); if (!btn) return; k = +btn.dataset.k; maj(); };
  $("tgt").oninput = () => { k = 0; maj(); };
  maj();
})();

/* ---------- linéaire ou convergente ---------- */
(() => {
  const maj = () => { const eta = +$("eta").value, k = +$("k").value;
    $("etav").textContent = pct(eta); $("kv").textContent = String(k);
    $("vlin").textContent = pct(O.rendementGlobal(Array(2 * k + 1).fill(eta))); $("flin").textContent = t("rdt.f.lin", { n: 2 * k + 1 });
    $("vconv").textContent = pct(O.rendementConvergent(Array(k).fill(eta), Array(k).fill(eta), eta)); $("fconv").textContent = t("rdt.f.conv", { k }); };
  $("eta").oninput = $("k").oninput = maj; maj();
})();

/* ---------- économie d'atomes : deux voies vers le même éther ---------- */
(() => {
  const etbe = O.formuleBrute(O.mol(O.CIBLES_RETRO.etbe.spec));
  const VOIES = { williamson: [{ C: 4, H: 9, O: 1, Na: 1 }, { C: 2, H: 5, Br: 1 }], addition: [{ C: 4, H: 8 }, { C: 2, H: 6, O: 1 }] };
  const txt = textOf("eco.items", Object.keys(VOIES));
  $("economie").innerHTML = Object.entries(VOIES).map(([id, r]) => `<div><span class="k">${pct(O.economieAtomes(etbe, r))}</span><span>${txt[id]}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["robinson", 1917, "experiment"], ["synthon", 1967, "idea"], ["ordinateur", 1969, "idea"], ["nobel", 1990, "idea"], ["chematica", 2017, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["logiciels", "carburant"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["fleche", "b"], ["synthon", "d"], ["ether", "a"], ["alcool", "c"], ["proteger", "b"], ["convergent", "a"], ["economie", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1967 });
})();
</script>
</body>
</html>
