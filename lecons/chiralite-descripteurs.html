<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chiralité et descripteurs stéréochimiques</title>
<link rel="stylesheet" href="/racoon/ds.css">
<style>
  .paire { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .paire svg { width: 230px; max-width: 100%; height: 170px; flex: none; }
  .paire > div { flex: 1 1 240px; min-width: 0; }
  .deux { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .deux svg { width: 100%; height: 150px; }
  .trois { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .trois svg { width: 100%; height: 110px; }
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-organique" data-i18n="monde.chim-organique"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-stereochimie" data-i18n="etape.chim-stereochimie"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/conformations-newman" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <figure>
      <div class="stage"><canvas id="vue"></canvas><div class="overlay" id="vueinfo"></div></div>
      <div class="panel">
        <div class="controls"><button class="btn tinted" type="button" id="cote" data-i18n="vue.cote"></button><button class="btn tinted" type="button" id="superpose" data-i18n="vue.superpose"></button></div>
        <p class="readout" id="vuetexte" aria-live="polite"></p>
      </div>
      <div class="legend"><span class="el-c" data-i18n="vue.C"></span><span class="el-h" data-i18n="vue.H"></span><span class="c-ok" data-i18n="vue.F"></span><span class="c-warn" data-i18n="vue.Cl"></span><span class="el-o" data-i18n="vue.Br"></span></div>
      <figcaption data-i18n-html="vue.caption"></figcaption>
    </figure>
    <div class="box def"><b data-i18n="s1.def.titre"></b>
      <p data-i18n-html="s1.def.corps"></p>
    </div>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="box prop"><b data-i18n="s2.regles.titre"></b>
      <p data-i18n-html="s2.regles.corps"></p>
    </div>
    <p data-i18n-html="s2.p2"></p>
    <figure>
      <div class="paire">
        <svg class="fig no-sigle" id="cip" role="img" data-i18n-attr="aria-label:cip.aria"></svg>
        <div><p id="cipnom"></p><p class="readout" id="cipverdict" aria-live="polite"></p></div>
      </div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="molsel" data-i18n="cip.molecule"></label></div><select id="molsel"></select></div>
        <div class="controls"><button class="btn tinted" type="button" id="direR" data-i18n="cip.direR"></button><button class="btn tinted" type="button" id="direS" data-i18n="cip.direS"></button><button class="btn tinted" type="button" id="montrer" data-i18n="cip.montrer"></button></div>
        <div class="controls"><button class="btn tinted" type="button" id="inverser" data-i18n="cip.inverser"></button><button class="btn tinted" type="button" id="miroir" data-i18n="cip.miroir"></button></div>
      </div>
      <figcaption data-i18n-html="cip.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure>
      <div class="seg" role="group" id="paire"><button type="button" data-m="chlorobutanol" aria-pressed="true" data-i18n="duo.chlorobutanol"></button><button type="button" data-m="butanediol" aria-pressed="false" data-i18n="duo.butanediol"></button></div>
      <div class="deux">
        <div><svg class="fig no-sigle" id="molA" role="img" data-i18n-attr="aria-label:duo.ariaA"></svg><p class="readout" id="descA"></p>
          <div class="controls"><button class="btn tinted" type="button" data-cote="A" data-c="1" data-i18n="duo.inv2"></button><button class="btn tinted" type="button" data-cote="A" data-c="2" data-i18n="duo.inv3"></button></div></div>
        <div><svg class="fig no-sigle" id="molB" role="img" data-i18n-attr="aria-label:duo.ariaB"></svg><p class="readout" id="descB"></p>
          <div class="controls"><button class="btn tinted" type="button" data-cote="B" data-c="1" data-i18n="duo.inv2"></button><button class="btn tinted" type="button" data-cote="B" data-c="2" data-i18n="duo.inv3"></button></div></div>
      </div>
      <p class="readout" id="relation" aria-live="polite"></p>
      <figcaption data-i18n-html="duo.caption"></figcaption>
    </figure>
    <div class="box def"><b data-i18n="s3.def.titre"></b>
      <p data-i18n-html="s3.def.corps"></p>
    </div>
    <div class="eq"><math display="block"><msub><mi>N</mi><mtext data-i18n="eq.stereo"></mtext></msub><mo>≤</mo><msup><mn>2</mn><mi>n</mi></msup></math></div>
    <p class="validite" data-i18n-html="s3.validite"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="trois" id="doubles"></div>
    <p data-i18n-html="s4.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/chiralite-descripteurs.js"></script>
<script src="/racoon/vue-cristal.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/chim-organique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, sym = s => t("chim.sym", { s }), $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const peindre = (svg, m, o) => { const d = O.dessin(m, Object.assign({ texte: sym }, o)); svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };

/* ---------- 3D : CHFClBr et son image ---------- */
(() => {
  const pm = 1e-12, A = O.tetraedre("C", [{ e: "H", d: 109 * pm }, { e: "F", d: 135 * pm }, { e: "Cl", d: 177 * pm }, { e: "Br", d: 193 * pm }]);
  const vue = VueCristal.monter($("vue"), $("vueinfo"), { hors: t("vue.hors"), reduit: reduce });
  const decale = (at, dx) => at.map(a => ({ e: a.e, r: [a.r[0] + dx, a.r[1], a.r[2]] }));
  const o2 = { dLiaison: 194 * pm, couleurs: { C: "--el-c", H: "--el-h", F: "--ok", Cl: "--warn", Br: "--el-o" }, rayons: { C: 0.2, H: 0.13, F: 0.2, Cl: 0.25, Br: 0.27 } };
  const montrer = mode => {
    const B = O.miroir3D(A);
    const at = mode === "cote" ? decale(A, -260 * pm).concat(decale(B, 260 * pm)) : A.concat(O.superposer(A, B, 1, 4));
    if (vue) vue.montrer(at, o2);
    $("vuetexte").textContent = t(mode === "cote" ? "vue.texte.cote" : "vue.texte.superpose");
  };
  $("cote").onclick = () => montrer("cote");
  $("superpose").onclick = () => montrer("superpose");
  montrer("cote");
})();

/* ---------- attribuer R ou S ---------- */
(() => {
  const IDS = ["bromochlorofluoromethane", "butan2olR", "alanine", "acideLactique", "glyceraldehyde", "butenol"], noms = textOf("cip.molecules", IDS);
  const sel = $("molsel");
  sel.innerHTML = IDS.map(id => `<option value="${id}">${noms[id]}</option>`).join("");
  let m, centre, montre = false, pari = null;
  const charger = () => { m = O.molecule(sel.value); centre = O.centres(m)[0]; montre = false; pari = null; maj(); };
  function maj() {
    const p = O.priorites(m, centre), d = O.descripteurRS(m, centre), marques = {};
    if (montre) p.forEach(q => { if (q.atome !== null) marques[q.atome] = String(q.rang); });
    peindre($("cip"), m, { marques, surligne: [centre], echelle: 48 });
    $("cipnom").innerHTML = t("cip.nom", { n: noms[sel.value] });
    let v = t("cip.attente");
    if (pari) v = t(pari === d ? "cip.juste" : "cip.faux", { d });
    if (montre) v += " " + t("cip.ordre", { d, l: p.map(q => sym(q.atome === null ? "H" : m.atomes[q.atome].e)).join(" > ") });
    $("cipverdict").textContent = v;
  }
  sel.onchange = charger;
  $("direR").onclick = () => { pari = "R"; maj(); };
  $("direS").onclick = () => { pari = "S"; maj(); };
  $("montrer").onclick = () => { montre = true; maj(); };
  $("inverser").onclick = () => { m = O.inverser(m, centre); pari = null; maj(); };
  $("miroir").onclick = () => { m = O.miroir(m); pari = null; maj(); };
  charger();
})();

/* ---------- deux centres : relation entre deux stéréoisomères ---------- */
(() => {
  let id = "chlorobutanol";
  const etat = { A: [], B: [2] };                                // centres inversés par rapport au dessin de base
  const construire = cote => etat[cote].reduce((m, c) => O.inverser(m, c), O.molecule(id));
  const nomD = m => { const d = O.descripteurs(m).centres; return "(2" + d[1] + ",3" + d[2] + ")"; };
  function maj() {
    const A = construire("A"), B = construire("B");
    peindre($("molA"), A, { surligne: [1, 2], echelle: 40 }); peindre($("molB"), B, { surligne: [1, 2], echelle: 40 });
    $("descA").textContent = t("duo.desc", { d: nomD(A), n: t("duo.nom." + id) });
    $("descB").textContent = t("duo.desc", { d: nomD(B), n: t("duo.nom." + id) });
    const r = O.relationStereo(A, B), achiral = O.relationStereo(A, O.miroir(A)) === "identiques";
    $("relation").textContent = t("duo.rel." + r) + (achiral ? " " + t("duo.meso") : "");
    document.querySelectorAll("#paire button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === id)));
  }
  document.querySelectorAll("[data-cote]").forEach(b => b.onclick = () => {
    const s = etat[b.dataset.cote], c = +b.dataset.c;
    etat[b.dataset.cote] = s.includes(c) ? s.filter(x => x !== c) : s.concat(c); maj(); });
  $("paire").onclick = e => { const b = e.target.closest("button"); if (!b) return; id = b.dataset.m; maj(); };
  maj();
})();

/* ---------- liaisons doubles ---------- */
(() => {
  const IDS = ["but2eneE", "but2eneZ", "bromochloropropene"], noms = textOf("ze.molecules", IDS);
  $("doubles").innerHTML = IDS.map(id => `<div><svg class="fig no-sigle" role="img" aria-label="${noms[id]}"></svg><p class="readout"></p></div>`).join("");
  [...$("doubles").children].forEach((div, k) => {
    const m = O.molecule(IDS[k]), [a, b] = O.doublesStereogenes(m)[0];
    peindre(div.querySelector("svg"), m, { echelle: 40 });
    div.querySelector("p").textContent = t("ze.nom", { d: O.descripteurZE(m, a, b), n: noms[IDS[k]] });
  });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["pasteur", 1848, "experiment"], ["vanthoff", 1874, "idea"], ["kelvin", 1893, "idea"], ["bijvoet", 1951, "experiment"], ["cip", 1956, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["medicaments", "odeurs"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["chiral", "b"], ["asym", "d"], ["prio", "a"], ["double", "c"], ["vue", "b"], ["miroir", "c"], ["meso", "a"], ["ze", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
</html>
