<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9;

/* ---------- le système décrit : le terminal d'un générateur de Van de Graaff ---------- */
(() => {
  const R = 1, V = 1e6, a = 0.025, L = 0.5, E = V / R;      // hole of radius a; on the axis, E (2/3π) (a/L)³ far from it (dipole)
  $("sys1").innerHTML = t("sys1.body", { e: F.si(E, "V·m⁻¹"), rap: F.num(a / L, 2), fuite: F.si(E * 2 / (3 * Math.PI) * (a / L) ** 3, "V·m⁻¹") });
})();

/* ---------- une coquille conductrice, une charge dans la cavité, une charge dehors (positions en m) ---------- */
(() => {
  const svg = $("cav"), ssl = $("ssl"), qsl = $("qsl"), A = 0.04, B = 0.06, Q0 = NC, D = 0.11, P = [0, -0.02];
  const O = { W: 640, H: 341, x0: -0.15, x1: 0.15, y0: -0.08, y1: 0.08 }, OPT = { r0: 1.5e-3, ds: 1e-3, n: 700, loin: 0.4 };
  function trace(c, g, pts, garde) {
    const out = [];
    for (const p of pts) { if (!garde(p)) break; out.push(p); }
    if (out.length > 1) Plot.el("polyline", { points: out.map(p => c.sx(p[0]).toFixed(1) + "," + c.sy(p[1]).toFixed(1)).join(" "), class: "stroke thin" }, g);
  }
  /* lines that leave charge i of the list, at equal flux, cut where they leave the region */
  function faisceau(c, g, liste, i, n, garde) {
    ES.anglesEgalFlux(n).forEach(al => [1, -1].forEach(sg => trace(c, g, ES.suivreLigne(liste, i, sg * al, OPT).points, garde)));
  }
  function draw() {
    const s = +ssl.value / 1000, Qx = +qsl.value * 0.5 * NC, o = { a: A, b: B, Qc: 0, q: Q0, s, Q: Qx, D }, k = ES.coquilleCavite(o);
    const c = CarteChamp.carte(svg, O), r = p => Math.hypot(p[0], p[1]);
    const metal = c.layer("c-label-2"), ring = R => `M ${c.sx(-R)} ${c.sy(0)} A ${c.sx(R) - c.sx(0)} ${c.sx(R) - c.sx(0)} 0 1 0 ${c.sx(R)} ${c.sy(0)} A ${c.sx(R) - c.sx(0)} ${c.sx(R) - c.sx(0)} 0 1 0 ${c.sx(-R)} ${c.sy(0)} Z`;
    Plot.el("path", { d: ring(B) + " " + ring(A), "fill-rule": "evenodd", class: "fill", opacity: "0.25" }, metal);
    faisceau(c, c.layer("c-ok"), k.dedans, 0, 8, p => r(p) < A);
    const dehors = c.layer("c-tint"), dans = p => r(p) > B && p[0] > O.x0 && p[0] < O.x1 && p[1] > O.y0 && p[1] < O.y1;
    const nc = Math.round(6 * Math.abs(k.Qcentre) / NC);
    if (nc > 0) faisceau(c, dehors, k.dehors, 0, nc, dans);
    if (Qx !== 0) faisceau(c, dehors, k.dehors, 1, Math.max(1, Math.round(6 * Math.abs(Qx) / NC)), dans);
    CarteChamp.point(c, [s, 0], 4, "c-warn", t("ca.nom.q"));
    if (Qx !== 0) CarteChamp.point(c, [D, 0], 4, Qx > 0 ? "c-warn" : "c-label", t("ca.nom.Q"));
    CarteChamp.point(c, P, 2.5, "c-label", t("ca.nom.p"), 14);
    const ext = [0, 0.5, 1, 1.5, 2, 2.5, 3, Math.PI].map(k.sigmaExt), lo = Math.min(...ext), hi = Math.max(...ext);
    $("sread").textContent = F.si(s, "m", { prefix: "m" });
    $("qread").textContent = F.si(Qx, "C", { prefix: "n" });
    $("vint").textContent = F.si(ES.chargeSurface(k.sigmaInt, A, 4000), "C", { prefix: "n" });
    $("vext").textContent = lo > 0 ? F.num(hi / lo, 3) : t("ca.v.signes");
    $("vchamp").textContent = F.si(Math.hypot(...k.champ(P)), "V·m⁻¹");
    $("vv0").textContent = F.si(k.V0, "V");
  }
  ssl.oninput = qsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cage", 1836, "experiment"], ["seau", 1843, "experiment"], ["vdg29", 1929, "experiment"], ["vdg31", 1931, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sousTension", "blindage"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["vide", "b"], ["paroi", "d"], ["circulation", "a"], ["position", "c"], ["dehors", "b"], ["forme", "a"], ["terre", "d"], ["trou", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 60 });
})();
</script>
