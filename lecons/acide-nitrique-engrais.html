<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-solutions" data-i18n="monde.chim-solutions"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-industrie-minerale" data-i18n="etape.chim-industrie-minerale"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n-html="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/synthese-de-l-ammoniac" data-i18n="tag.prereq"></a>
    </div>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq" data-i18n-html="eq.global"></div>
    <p class="validite" data-i18n-html="val.global"></p>
    <p data-i18n-html="s1.p2"></p>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq" data-i18n-html="eq.no"></div>
    <p class="validite" data-i18n-html="val.no"></p>
    <div class="eq" data-i18n-html="eq.n2"></div>
    <p class="validite" data-i18n-html="val.n2"></p>
    <p data-i18n-html="s2.p2"></p>
    <figure class="chart">
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="temp" data-i18n="fig.T"></label><output id="tempv" for="temp"></output></div>
            <input id="temp" type="range" min="300" max="1300" step="10" value="1173"></div>
        </div>
      </div>
      <svg class="fig" id="lgk" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.leg.no"></span><span class="c-warn" data-i18n="fig.leg.n2"></span><span class="c-label" data-i18n="fig.leg.no2"></span></div>
      <div class="stats">
        <div class="stat"><span class="k" data-i18n="fig.k.no"></span><span class="v" id="vno"></span><span class="f" data-i18n="fig.f.par"></span></div>
        <div class="stat"><span class="k" data-i18n="fig.k.n2"></span><span class="v" id="vn2"></span><span class="f" data-i18n="fig.f.par"></span></div>
        <div class="stat"><span class="k" data-i18n="fig.k.r"></span><span class="v" id="vr"></span><span class="f" id="fr"></span></div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>

    <p class="validite" data-i18n-html="val.fraction"></p>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/acide-nitrique-engrais.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/chim-solutions.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions, H = C.Industrie;
const keyed = (id, k, ids, vars = {}) => { const txt = textOf(k, ids);
  const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, n) => { if (!(n in v)) throw new Error(k + ": no value for {" + n + "}"); return v[n]; });
  $(id).innerHTML = ids.map(i => `<div><span class="k">${txt[i].k}</span><span>${fill(txt[i].v, vars[i] || {})}</span></div>`).join(""); };
keyed("conditions", "s2.conditions", ["toile", "T", "p", "air"]);
/* nitrogen mass fraction of each fertiliser, computed from the IUPAC atomic weights */
const pctN = s => F.qty(F.fix(100 * H.fraction(s, "N"), 1), "%");
keyed("engrais", "s4.engrais", ["nitrate", "uree", "sulfate", "ammoniac"],
  { nitrate: { w: pctN("NH4NO3") }, uree: { w: pctN("CO(NH2)2") }, sulfate: { w: pctN("(NH4)2SO4") }, ammoniac: { w: pctN("NH3") } });

/* ---------- §2 : deux oxydations totales, une seule voulue ---------- */
(() => {
  const T1 = 300, T2 = 1300, PO2 = 1e4, lg = (nu, T, k = 1) => C.lnK(nu, T) / Math.LN10 / k;
  function draw() {
    const T = +$("temp").value, svg = $("lgk");
    $("tempv").innerHTML = F.kelvin(T);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, x: { domain: [T1, T2], label: t("fig.ax.x") },
      y: { domain: [-10, 60], label: t("fig.ax.y"), fmt: v => F.fix(v, 0) } });
    const Ts = Array.from({ length: 51 }, (_, k) => T1 + (T2 - T1) * k / 50);
    const courbe = (f, cls) => Plot.el("path", { d: Plot.path(Ts.map(T => [x(T), y(f(T))])), class: cls }, g);
    Plot.el("line", { x1: x(T1), x2: x(T2), y1: y(0), y2: y(0), class: "axis" }, g);
    courbe(T => lg(H.OSTWALD.n2, T, 4), "stroke bold c-warn");
    courbe(T => lg(H.OSTWALD.no, T, 4), "stroke bold c-tint");
    courbe(T => lg(H.OSTWALD.no2, T), "stroke dash c-label");
    Plot.el("line", { x1: x(T), x2: x(T), y1: y(-10), y2: y(60), class: "ref" }, g);
    $("vno").textContent = F.fix(lg(H.OSTWALD.no, T, 4), 1);
    $("vn2").textContent = F.fix(lg(H.OSTWALD.n2, T, 4), 1);
    const r = H.rapportNO2(T, PO2);
    $("vr").textContent = r > 1e3 || r < 1e-2 ? F.sci(r, 2) : F.num(r, 2);
    $("fr").textContent = t(r > 1 ? "fig.f.no2" : "fig.f.nores");
  }
  $("temp").oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ostwald", 1902, "idea"], ["birkeland", 1903, "use"], ["gerthe", 1906, "use"], ["basf", 1914, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["europe", "protoxyde", "nitrate"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["selectivite", "b"], ["temps", "d"], ["no2", "a"], ["refroidir", "c"], ["bilan", "b"], ["part", "a"], ["azote", "d"], ["pression", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1902 });
})();
</script>
</body>
</html>
