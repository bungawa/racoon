<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹";

/* ---------- le système décrit, chiffré (le même que dans « Qu'est-ce que la force ? ») ---------- */
$("sys").innerHTML = t("sys.body", Object.assign(Dyna.chiffres("chute", F), { gh: F.sci(Dyna.ecartUniforme(Dyna.SYSTEMES.chute.echelle), 1) }));

/* ---------- une bille sur trois rails, de A à B ---------- */
(() => {
  const A = [0, 2], B = [Math.PI, 0], H = A[1] - B[1];
  const PATHS = { droite: Travail.chemin.droite(A, B), cycloide: Travail.chemin.cycloide(A, B), creux: Travail.chemin.arc(A, B, -1.5) };
  const bille = Forces.OBJETS.bille, ping = Forces.OBJETS.pingpong;
  const OBJ = { vide: { m: bille.m, k: 0 }, bille: { m: bille.m, k: Travail.kAir(bille.d, bille.m) }, pingpong: { m: ping.m, k: Travail.kAir(ping.d, ping.m) } };
  const cache = {}, runOf = (p, o) => cache[p + o] || (cache[p + o] = Travail.glissade(PATHS[p], { m: OBJ[o].m, k: OBJ[o].k }));
  let path = "droite", obj = "vide", anim = 0;
  const tsl = $("tsl"), svg = $("track"), chart = $("echart"), P = Plot.el;
  const S = 110, X = x => 40 + S * x, Y = z => 20 + S * (H - z);
  const label = (x, y, key, anchor) => { P("text", { x, y, "text-anchor": anchor || "middle" }, svg).textContent = t(key); };
  function draw() {
    const r = runOf(path, obj), n = r.t.length - 1, i = Math.round(+tsl.value / 1000 * n), m = OBJ[obj].m;
    /* the three wires; the chosen one bold */
    svg.innerHTML = "";
    P("line", { x1: X(-0.2), x2: X(3.6), y1: Y(B[1]), y2: Y(B[1]), class: "stroke thin dash c-label-2" }, svg);
    Object.keys(PATHS).forEach(k => {
      const pts = Travail.points(PATHS[k], 200).map(q => X(q[0]).toFixed(1) + " " + Y(q[1]).toFixed(1));
      P("path", { d: "M" + pts.join(" L"), class: k === path ? "stroke bold c-tint" : "stroke thin dash c-label-2" }, svg);
    });
    P("line", { x1: X(3.9), x2: X(3.9), y1: Y(A[1]), y2: Y(B[1]), class: "stroke thin c-label-2" }, svg);
    label(X(3.9) + 8, (Y(A[1]) + Y(B[1])) / 2, "tr.H", "start");
    label(X(A[0]) - 12, Y(A[1]) + 4, "tr.A"); label(X(B[0]) + 14, Y(B[1]) - 6, "tr.B");
    P("circle", { cx: X(r.x[i]), cy: Y(r.z[i]), r: 9, class: "fill c-warn" }, svg);
    /* energies against time: Ec, and the work of the weight up to t */
    chart.innerHTML = "";
    const E0 = m * Travail.G * H, tf = r.t[n], top = 1.08 * Math.max(E0, ...r.wPoids, ...r.ec) * 1000;
    const { x, y, g } = Plot.axes(chart, { fmt: F, w: 640, h: 260, x: { domain: [0, tf], label: t("en.x") }, y: { domain: [0, top], label: t("en.y") } });
    const line = (arr, cls) => { let d = ""; for (let j = 0; j <= n; j += Math.max(1, Math.floor(n / 300))) d += (d ? "L" : "M") + x(r.t[j]).toFixed(1) + " " + y(arr[j] * 1000).toFixed(1); P("path", { d, class: cls }, g); };
    line(r.wPoids, "ref"); line(r.ec, "curve");
    P("line", { x1: x(r.t[i]), x2: x(r.t[i]), y1: y(0), y2: y(top), class: "zero" }, g);
    P("circle", { cx: x(r.t[i]), cy: y(r.ec[i] * 1000), r: 6, class: "dot" }, g);
    /* numbers at t */
    const v = Math.abs(r.v[i]);
    $("tread").textContent = F.si(r.t[i], "s", { prefix: "" });
    $("vv").textContent = F.qty(F.num(v, 3), MS);
    $("fv").textContent = t("tr.f.z", { z: F.qty(F.num(r.z[i], 2), "m") });
    $("vp").textContent = F.si(r.pPoids[i], "W");
    $("fp").textContent = t("tr.f.p", { pa: F.si(r.pAir[i], "W") });
    $("vec").textContent = F.si(r.ec[i], "J");
    $("fec").textContent = t("tr.f.ec", { w: F.si(r.wPoids[i] + r.wAir[i], "J"), wp: F.si(r.wPoids[i], "J"), wa: F.si(r.wAir[i], "J") });
    $("varr").textContent = F.si(r.arrivee, "s", { prefix: "" });
    $("farr").textContent = t("tr.f.arr", { v: F.qty(F.num(r.vB, 3), MS), v0: F.qty(F.num(Math.sqrt(2 * Travail.G * H), 3), MS) });
  }
  const pick = (attr, set) => document.querySelectorAll("[data-" + attr + "]").forEach(btn => btn.onclick = () => {
    set(btn.dataset[attr]); document.querySelectorAll("[data-" + attr + "]").forEach(b => b.setAttribute("aria-pressed", String(b === btn))); cancelAnimationFrame(anim); draw(); });
  pick("p", v => path = v); pick("o", v => obj = v);
  $("drop").onclick = () => { cancelAnimationFrame(anim); const r = runOf(path, obj), dur = r.arrivee * 1000, t0 = performance.now();
    const step = now => { const u = Math.min(1, (now - t0) / dur); tsl.value = Math.round(1000 * u); draw(); if (u < 1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step); };
  tsl.oninput = () => { cancelAnimationFrame(anim); draw(); };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["leibniz", 1686, "idea"], ["chatelet", 1740, "experiment"], ["young", 1807, "idea"], ["coriolis", 1829, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["capteur", "toboggan"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["reaction", "a"], ["forme", "a"], ["signe", "a"], ["air", "a"], ["satellite", "a"], ["calcul", "a"], ["pendule", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 131 });
})();
</script>
