<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- flux et circulation d'un champ modèle à travers un cercle (unités arbitraires, sans dimension) ---------- */
(() => {
  const svg = $("champ"), P = Plot.el, Rsl = $("Rsl"), BOX = [-4, 4, -2.5, 2.5], EPS = 1e-6;
  const X = Plot.linScale(BOX[0], BOX[1], 0, 640), Y = Plot.linScale(BOX[2], BOX[3], 400, 0), S = 80;    // 80 px per unit
  let kind = "uniforme", centre = [0, 0];
  const sign = (v, k) => t(k + (Math.abs(v) < EPS ? "nul" : v > 0 ? "pos" : "neg"));
  function draw() {
    const Fv = ChampsEM.CHAMPS_PLAN[kind], R = Rsl.value / 4;
    svg.innerHTML = "";
    const pts = []; for (let i = 0; i < 17; i++) for (let j = 0; j < 11; j++) pts.push([-3.75 + i * 0.47, -2.3 + j * 0.46]);
    const mags = pts.map(p => Math.hypot(...Fv(p))).filter(Number.isFinite).sort((a, b) => a - b), ref = mags[mags.length >> 1] || 1;
    pts.forEach(p => {
      const v = Fv(p), m = Math.hypot(v[0], v[1]); if (!(m > 0)) return;
      const L = 22 * m / (m + ref), ux = v[0] / m, uy = v[1] / m, x0 = X(p[0]), y0 = Y(p[1]), x1 = x0 + L * ux, y1 = y0 - L * uy;
      P("line", { x1: x0, y1: y0, x2: x1, y2: y1, class: "stroke thin c-label-2" }, svg);
      P("circle", { cx: x1, cy: y1, r: 1.8, class: "fill c-label-2" }, svg);
    });
    P("circle", { cx: X(centre[0]), cy: Y(centre[1]), r: R * S, class: "stroke bold c-tint" }, svg);
    P("circle", { cx: X(centre[0]), cy: Y(centre[1]), r: 3, class: "fill c-tint" }, svg);
    const fl = ChampsEM.fluxCercle(Fv, centre, R), ci = ChampsEM.circulationCercle(Fv, centre, R);
    $("fcread").innerHTML = t("fc.read." + kind);
    $("Rread").textContent = F.num(R, 3);
    $("vflux").textContent = Math.abs(fl) < EPS ? "0" : F.num(fl, 3);
    $("vcirc").textContent = Math.abs(ci) < EPS ? "0" : F.num(ci, 3);
    $("fflux").textContent = sign(fl, "fc.f.flux.");
    $("fcirc").textContent = sign(ci, "fc.f.circ.");
  }
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { kind = b.dataset.k;
    document.querySelectorAll("[data-k]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  svg.addEventListener("pointerdown", e => { const r = svg.getBoundingClientRect();
    centre = [X.inv((e.clientX - r.left) * 640 / r.width), Y.inv((e.clientY - r.top) * 400 / r.height)]; draw(); });
  Rsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ostrogradsky", 1826, "idea"], ["kelvin", 1850, "idea"], ["stokes", 1854, "idea"], ["helmholtz", 1858, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["debit", "meteo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["flux", "a"], ["ferme", "d"], ["uniforme", "b"], ["cisaillement", "c"], ["ecoule", "a"], ["gel", "b"], ["deux", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 13 });
})();
</script>
