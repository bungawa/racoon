    <figure class="chart">

      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="ptT" data-i18n="pt.T"></label><output id="ptTv" for="ptT"></output></div>
            <input id="ptT" type="range" min="200" max="700" step="0.5" value="373"></div>
          <div class="ctl"><div class="row"><label for="ptp" data-i18n="pt.p"></label><output id="ptpv" for="ptp"></output></div>
            <input id="ptp" type="range" min="-1" max="8.3" step="0.005" value="5.006"></div>
        </div>
        <div class="controls"><button class="btn tinted" type="button" id="b-triple" data-i18n="pt.b.triple"></button><button class="btn tinted" type="button" id="b-critique" data-i18n="pt.b.critique"></button><button class="btn tinted" type="button" id="b-ebullition" data-i18n="pt.b.ebullition"></button></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="pt.k.phase"></span><span class="v" id="ptph"></span><span class="f" id="ptphf"></span></div>
          <div class="stat"><span class="k" data-i18n="pt.k.eq"></span><span class="v" id="pteq"></span><span class="f" id="pteqf"></span></div>
        </div>
      </div>
      <div class="legend"><span class="c-tint" data-i18n="pt.leg.courbes"></span><span class="c-warn" data-i18n="pt.leg.points"></span></div>

    </figure>
    <p data-i18n-html="s2.p2"></p>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <p data-i18n-html="s3.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="eq"><math display="block"><mi>v</mi><mo>=</mo><mo>(</mo><mn>1</mn><mo>−</mo><mi>x</mi><mo>)</mo><msub><mi>v</mi><mi mathvariant="normal">ℓ</mi></msub><mo>+</mo><mi>x</mi><msub><mi>v</mi><mi mathvariant="normal">g</mi></msub><mspace width="1em"></mspace><mo>⟺</mo><mspace width="1em"></mspace><mi>x</mi><mo>=</mo><mfrac><mrow><mi>v</mi><mo>−</mo><msub><mi>v</mi><mi mathvariant="normal">ℓ</mi></msub></mrow><mrow><msub><mi>v</mi><mi mathvariant="normal">g</mi></msub><mo>−</mo><msub><mi>v</mi><mi mathvariant="normal">ℓ</mi></msub></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.titre"></p>
    <p data-i18n-html="s4.p2"></p>
    <div class="eq"><math display="block"><msub><mi>p</mi><mi mathvariant="normal">r</mi></msub><mo>=</mo><mfrac><mrow><mn>8</mn><msub><mi>T</mi><mi mathvariant="normal">r</mi></msub></mrow><mrow><mn>3</mn><msub><mi>v</mi><mi mathvariant="normal">r</mi></msub><mo>−</mo><mn>1</mn></mrow></mfrac><mo>−</mo><mfrac><mn>3</mn><msubsup><mi>v</mi><mi mathvariant="normal">r</mi><mn>2</mn></msubsup></mfrac></math></div>
    <p class="validite" data-i18n-html="val.vdw"></p>
    <figure class="chart">
      <svg class="fig" id="pv" role="img" data-i18n-attr="aria-label:pv.aria"></svg>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="pvT" data-i18n="pv.T"></label><output id="pvTv" for="pvT"></output></div>
            <input id="pvT" type="range" min="0.6" max="1.2" step="0.005" value="0.9"></div>
          <div class="ctl"><div class="row"><label for="pvv" data-i18n="pv.v"></label><output id="pvvv" for="pvv"></output></div>
            <input id="pvv" type="range" min="0" max="1000" step="1" value="500"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="pv.k.p"></span><span class="v" id="pvp"></span><span class="f" id="pvpf"></span></div>
          <div class="stat"><span class="k" data-i18n="pv.k.etat"></span><span class="v" id="pve"></span><span class="f" id="pvef"></span></div>
          <div class="stat"><span class="k" data-i18n="pv.k.x"></span><span class="v" id="pvx"></span><span class="f" id="pvxf"></span></div>
        </div>
      </div>
      <div class="legend"><span class="c-tint" data-i18n="pv.leg.iso"></span><span class="c-warn" data-i18n="pv.leg.boucle"></span><span class="c-label-2" data-i18n="pv.leg.cloche"></span></div>
      <figcaption data-i18n-html="pv.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="s4.sys.title"></b>
      <p data-i18n-html="s4.sys.body"></p>
    </div>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/diagrammes-p-t-et-p-v.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/thermo.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, Th = Thermo, E = Th.EAU;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
/* a path through pixel points, broken where the value leaves [lo, hi] */
const clipped = (pts, lo, hi, y) => { let d = "", on = false;
  for (const [px, v] of pts) { if (v < lo || v > hi || !isFinite(v)) { on = false; continue; } d += (on ? "L" : "M") + px.toFixed(1) + " " + y(v).toFixed(1); on = true; }
  return d; };

/* ---------- diagramme (P, T) de l'eau ---------- */
(() => {
  const svg = $("pt"), T0 = 200, T1 = 700, P0 = 0.1, P1 = 1e9;
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 380, pad: { b: 44, l: 60 },
    x: { domain: [T0, T1], label: t("pt.x") }, y: { scale: "log", domain: [P0, P1], label: t("pt.y") } });
  const courbe = (f, a, b, n = 240) => Plot.path(Array.from({ length: n + 1 }, (_, i) => { const T = a + (b - a) * i / n; return [x(T), y(f(T))]; }));
  P("path", { d: Plot.path([[x(E.Tc), y(E.pc)], [x(T1), y(E.pc)]]), class: "stroke thin dash c-label-2" }, g);
  P("path", { d: Plot.path([[x(E.Tc), y(E.pc)], [x(E.Tc), y(P1)]]), class: "stroke thin dash c-label-2" }, g);
  P("path", { d: courbe(Th.pSublimation, T0, E.Tt), class: "stroke c-tint" }, g);
  P("path", { d: courbe(Th.pFusion, 251.165, E.Tt), class: "stroke c-tint" }, g);
  P("path", { d: courbe(Th.psat, E.Tt, E.Tc), class: "stroke c-tint" }, g);
  P("path", { d: Plot.path([[x(251.165), y(E.pFusionMax)], [x(T0), y(E.pFusionMax)]]), class: "stroke thin dash c-label-2" }, g);
  const ZONES = textOf("pt.zones", ["solide", "liquide", "gaz", "super", "autres"]);
  [["solide", 225, 1e3], ["liquide", 420, 3e7], ["gaz", 480, 30], ["super", 675, 1e8], ["autres", 225, 5e8]]
    .forEach(([id, T, p]) => { P("text", { x: x(T), y: y(p), "text-anchor": "middle" }, g).textContent = ZONES[id]; });
  [[E.Tt, E.pt, "pt.triple", -8], [E.Tc, E.pc, "pt.critique", 8]].forEach(([T, p, k, dx]) => {
    P("circle", { cx: x(T), cy: y(p), r: 5, class: "fill c-warn" }, g);
    P("text", { x: x(T) + dx, y: y(p) + 18, "text-anchor": dx < 0 ? "end" : "start" }, g).textContent = t(k);
  });
  const dot = P("circle", { r: 6, class: "dot" }, g);
  const sT = $("ptT"), sp = $("ptp");
  const PHASES = textOf("pt.phases", ["solide", "liquide", "gaz", "supercritique", "hors", "triple", "critique"]);
  function upd() {
    const T = +sT.value, p = Math.pow(10, +sp.value);
    dot.setAttribute("cx", x(T)); dot.setAttribute("cy", y(p));
    $("ptTv").innerHTML = F.kelvin(T); $("ptpv").textContent = F.si(p, "Pa");
    const pres = (T0, p0) => Math.abs(T - T0) < 1 && Math.abs(Math.log10(p / p0)) < 0.03;
    const ph = pres(E.Tt, E.pt) ? "triple" : pres(E.Tc, E.pc) ? "critique" : Th.phaseEau(T, p) || "hors";
    $("ptph").textContent = PHASES[ph].name; $("ptphf").textContent = PHASES[ph].text;
    if (T < E.Tt) { $("pteq").textContent = F.si(Th.pSublimation(T), "Pa"); $("pteqf").textContent = t("pt.f.sub"); }
    else if (T <= E.Tc) { $("pteq").textContent = F.si(Th.psat(T), "Pa"); $("pteqf").textContent = t("pt.f.vap"); }
    else { $("pteq").textContent = "–"; $("pteqf").textContent = t("pt.f.aucune"); }
  }
  const go = (T, p) => { sT.value = T; sp.value = Math.log10(p); upd(); };
  sT.oninput = sp.oninput = upd;
  $("b-triple").onclick = () => go(E.Tt, E.pt);
  $("b-critique").onclick = () => go(E.Tc, E.pc);
  $("b-ebullition").onclick = () => go(E.Teb, 101325);
  upd();
})();

/* ---------- diagramme (P, v) de Van der Waals, variables réduites ---------- */
(() => {
  const svg = $("pv"), V0 = 0.4, V1 = 20, PMAX = 2;
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 360, pad: { b: 44, l: 56 },
    x: { scale: "log", domain: [V0, V1], label: t("pv.x"), fmt: v => F.num(v, 2) }, y: { domain: [0, PMAX], label: t("pv.y") } });
  [0.5, 2, 5].forEach(v => P("text", { x: x(v), y: y(0) + 16, "text-anchor": "middle", class: "tick" }, g).textContent = F.num(v, 2));
  const liq = [], gaz = [];
  for (let i = 0; i <= 120; i++) { const Tr = 0.6 + 0.3999 * i / 120, m = Th.maxwell(Tr); liq.push([x(m.vl), y(m.p)]); gaz.push([x(m.vg), y(m.p)]); }
  const cloche = liq.concat([[x(1), y(1)]], gaz.reverse());
  P("path", { d: Plot.path(cloche) + "Z", class: "area" }, g);
  P("path", { d: Plot.path(cloche), class: "stroke thin c-label-2" }, g);
  const vs = Array.from({ length: 401 }, (_, i) => V0 * Math.pow(V1 / V0, i / 400));
  P("path", { d: clipped(vs.map(v => [x(v), Th.vdwReduit(1, v)]), 0, PMAX, y), class: "stroke thin dash c-label-2" }, g);
  const boucle = P("path", { class: "ref" }, g), iso = P("path", { class: "curve" }, g), dot = P("circle", { r: 6, class: "dot" }, g);
  const sT = $("pvT"), sv = $("pvv"), ETATS = textOf("pv.etats", ["liquide", "melange", "vapeur", "super", "critique"]);
  const vOf = s => V0 * Math.pow(V1 / V0, s / 1000);
  function upd() {
    const Tr = +sT.value, vr = vOf(+sv.value), m = Th.maxwell(Tr), f = Th.isothermeReduite(Tr), p = f(vr);
    iso.setAttribute("d", clipped(vs.map(v => [x(v), f(v)]), 0, PMAX, y));
    boucle.setAttribute("d", m ? clipped(vs.filter(v => v > m.vl && v < m.vg).map(v => [x(v), Th.vdwReduit(Tr, v)]), 0, PMAX, y) : "");
    dot.setAttribute("cx", x(vr)); dot.setAttribute("cy", y(Math.min(Math.max(p, 0), PMAX)));
    $("pvTv").innerHTML = t("pv.Tread", { r: F.fix(Tr, 3), T: F.kelvin(Tr * E.Tc) });
    $("pvvv").textContent = F.num(vr, 3);
    $("pvp").textContent = F.num(p, 3); $("pvpf").textContent = t("pv.f.p", { p: F.si(p * E.pc, "Pa") });
    const etat = Tr > 1 ? "super" : !m ? "critique" : vr < m.vl ? "liquide" : vr > m.vg ? "vapeur" : "melange";
    $("pve").textContent = ETATS[etat];
    $("pvef").textContent = m ? t("pv.f.bornes", { l: F.num(m.vl, 3), g: F.num(m.vg, 3) }) : t("pv.f.sans");
    if (etat === "melange") { const xv = Th.titre(vr, m.vl, m.vg); $("pvx").textContent = F.fix(xv, 3); $("pvxf").textContent = t("pv.f.x", { l: F.num(100 * (1 - xv), 3) }); }
    else { $("pvx").textContent = "–"; $("pvxf").textContent = t("pv.f.mono"); }
  }
  sT.oninput = sv.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cagniard", 1822, "experiment"], ["andrews", 1869, "experiment"], ["cgpm", 1954, "use"], ["kelvin", 2019, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cellule", "lyophilisation", "cocotte"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["variance", "b"], ["triple", "c"], ["pente", "a"], ["contourner", "d"], ["titre", "b"], ["sublimer", "c"], ["vdw", "a"], ["fond", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
