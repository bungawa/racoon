    <div class="eq"><math display="block"><mi>m</mi><mspace width="0.1em"/><mover><mi>x</mi><mo>¨</mo></mover><mo>+</mo><mi>c</mi><mspace width="0.1em"/><mover><mi>x</mi><mo>˙</mo></mover><mo>+</mo><mi>k</mi><mi>x</mi><mo>=</mo><mi>F</mi><mo>,</mo><mspace width="1.4em"/><mi>L</mi><mspace width="0.1em"/><mover><mi>q</mi><mo>¨</mo></mover><mo>+</mo><mi>R</mi><mspace width="0.1em"/><mover><mi>q</mi><mo>˙</mo></mover><mo>+</mo><mfrac><mi>q</mi><mi>C</mi></mfrac><mo>=</mo><mi>u</mi></math><span class="n">(25.14–15)</span></div>

    <div class="eq"><math display="block"><mi>L</mi><mo>=</mo><mfrac><mrow><mi>ζ</mi><mi>m</mi></mrow><msup><mi>α</mi><mn>2</mn></msup></mfrac><mo>,</mo><mspace width="1em"/><mi>R</mi><mo>=</mo><mfrac><mrow><mi>ζ</mi><mi>c</mi></mrow><mi>α</mi></mfrac><mo>,</mo><mspace width="1em"/><mi>C</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mi>ζ</mi><mi>k</mi></mrow></mfrac><mo>,</mo><mspace width="1.4em"/><mi>Q</mi><mo>=</mo><mfrac><mn>1</mn><mi>R</mi></mfrac><msqrt><mfrac><mi>L</mi><mi>C</mi></mfrac></msqrt><mo>=</mo><mfrac><msqrt><mrow><mi>m</mi><mi>k</mi></mrow></msqrt><mi>c</mi></mfrac></math><span class="n">(25.15a)</span></div>
    <p class="validite" data-i18n-html="val.25.15a"></p>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="list keyed" id="voiture"></div>
    <p data-i18n-html="s3.p2"></p>
    <figure class="chart">
      <svg class="fig" id="trace" role="img" data-i18n-attr="aria-label:an.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="an.legend.meca"></span><span class="c-warn" data-i18n="an.legend.elec"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="c" data-i18n="an.c"></label><output id="cv" for="c"></output></div>

          <div class="ctl"><div class="row"><label for="al" data-i18n="an.alpha"></label><output id="alv" for="al"></output></div>

          <div class="ctl"><div class="row"><label for="ze" data-i18n="an.zeta"></label><output id="zev" for="ze"></output></div>

        </div>
        <div class="stats">

          <div class="stat"><span class="k" data-i18n="an.k.r"></span><span class="v" id="vr"></span><span class="f" id="fr"></span></div>
          <div class="stat"><span class="k" data-i18n="an.k.c"></span><span class="v" id="vc"></span><span class="f" id="fc"></span></div>
          <div class="stat"><span class="k" data-i18n="an.k.q"></span><span class="v" id="vq"></span><span class="f" id="fq"></span></div>
        </div>

      <figcaption data-i18n-html="an.caption"></figcaption>

    <div class="box warn"><b data-i18n="s3.warn.title"></b>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>

<script src="/racoon/constantes.js"></script>

<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/oscillateur.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/lecons/resonance.js"></script>
<script src="/racoon/lecons/amortissement.js"></script>
<script src="/racoon/ondes.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["caisse", "ressort", "amortisseur", "route"]; keyed($("voiture"), t("voiture.tag"), IDS, textOf("voiture.items", IDS)); })();

/* ---------- §25-4 : le quart de voiture et son circuit analogue ---------- */
(() => {
  const M = 300, K = 3e4, X0 = 0.05, TMAX = 3;                       // f₀ = 1,59 Hz ; écart initial 5 cm
  const TT = Array.from({ length: 601 }, (_, i) => TMAX * i / 600), DOTS = TT.filter((_, i) => i % 15 === 0);
  function upd() {
    const c = 1e3 * +$("c").value, al = 10 ** +$("al").value, ze = 10 ** +$("ze").value, E = Ondes.analogue(M, c, K, al, ze);
    const mec = Amort.libre(Math.sqrt(K / M), Math.sqrt(M * K) / c, X0, 0);
    /* the circuit, from its own L, R, C: capacitor charged to u₀ at s = 0, then closed on the coil and the resistor */
    const ele = Amort.libre(1 / Math.sqrt(E.L * E.C), Math.sqrt(E.L / E.C) / E.R, 1, 0);
    const svg = $("trace"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 60, b: 44 }, x: { domain: [0, TMAX], label: t("an.xaxis") }, y: { domain: [-1.05, 1.05], label: t("an.yaxis") } });
    Plot.el("path", { d: Plot.path(TT.map(tt => [P.x(tt), P.y(mec.x(tt) / X0)])), class: "curve" }, P.g);
    DOTS.forEach(tt => Plot.el("circle", { cx: P.x(tt), cy: P.y(ele.x(tt / al)), r: 3, class: "fill c-warn" }, P.g));
    $("cv").textContent = F.qty(F.num(c, 2), "N·s·m⁻¹"); $("alv").textContent = F.num(al, 2); $("zev").textContent = F.qty(F.num(ze, 2), "Ω·m·N⁻¹·s⁻¹");
    $("vl").textContent = F.si(E.L, "H"); $("fl").textContent = t("an.f.l");
    $("vr").textContent = F.si(E.R, "Ω"); $("fr").textContent = t("an.f.r");
    $("vc").textContent = F.si(E.C, "F"); $("fc").textContent = t("an.f.c");
    $("vq").textContent = F.num(E.Q, 3); $("fq").textContent = t("an.f.q", { f: F.si(E.w0e / (2 * Math.PI), "Hz"), d: F.si(TMAX / al, "s") });
  }
  ["c", "al", "ze"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maree", 1872, "experiment"], ["thomson", 1876, "idea"], ["bush", 1931, "experiment"], ["firestone", 1933, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["hautparleur", "windkessel"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["masse", "b"], ["ressort", "d"], ["q", "a"], ["vite", "c"], ["impedance", "b"], ["limite", "a"], ["mobilite", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 254 });
})();
</script>
