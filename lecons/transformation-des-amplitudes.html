<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- a spin 1/2 state C₊ = e^{iδ} cos(θ/2), C₋ = e^{iδ} e^{iη} sin(θ/2), seen by S and by T turned 90° about y ---------- */
(() => {
  const st = $("st"), se = $("se"), sd = $("sd"), r = Math.SQRT1_2;
  const R90 = [[Cx.c(r, 0), Cx.c(r, 0)], [Cx.c(-r, 0), Cx.c(r, 0)]];   // matrix of « Les rotations de 180° et de 90° autour de y »
  const deg = el => +el.value * Math.PI / 180;
  function draw() {
    const th = deg(st), eta = deg(se), d = deg(sd);
    const c = [Cx.polar(Math.cos(th / 2), d), Cx.polar(Math.sin(th / 2), d + eta)], cT = Q.appliquer(R90, c);
    const svg = $("cercles"); svg.innerHTML = "";
    [[c, 110, ["fig.lab.s.0", "fig.lab.s.1"]], [cT, 430, ["fig.lab.t.0", "fig.lab.t.1"]]].forEach(([v, x0, k]) => {
      v.forEach((z, i) => {
        const cx0 = x0 + i * 120, cy0 = 110, R = 70;
        Plot.el("circle", { cx: cx0, cy: cy0, r: R, class: "stroke thin c-label-2", fill: "none" }, svg);
        Plot.fleche(svg, [cx0, cy0], [cx0 + R * z.re, cy0 - R * z.im], { cls: i ? "c-warn" : "c-tint", tete: 8, min: 2, trait: "stroke bold" });
        Plot.el("text", { x: cx0, y: cy0 + R + 20, "text-anchor": "middle" }, svg).textContent = t(k[i]);
      });
    });
    ["st", "se", "sd"].forEach(id => { $(id + "r").textContent = F.num(+$(id).value, 3) + "\u00a0°"; });
    $("vs").textContent = c.map(z => F.num(Cx.abs2(z), 3)).join(" ; "); $("fs").textContent = t("fig.f.s");
    $("vt").textContent = cT.map(z => F.num(Cx.abs2(z), 3)).join(" ; "); $("ft").textContent = t("fig.f.t");
  }
  st.oninput = se.oninput = sd.oninput = draw; draw();
  const c = [Cx.c(r, 0), Cx.c(r, 0)], p = Q.appliquer(R90, c).map(Cx.abs2), q = Q.appliquer(R90, [c[0], Cx.c(-r, 0)]).map(Cx.abs2);
  $("sys1").innerHTML = t("sys1.body", { p: p.map(x => F.num(x, 2)).join(" ; "), q: q.map(x => F.num(x, 2)).join(" ; ") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["pauli", 1924, "idea"], ["spin", 1925, "idea"], ["dirac", 1928, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "b"], ["globale", "d"], ["relative", "a"], ["geometrie", "c"], ["matrice", "b"], ["unique", "a"], ["tous", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 601 });
})();
</script>
