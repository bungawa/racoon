<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- potentiel de Lennard-Jones de l'argon et son approximation harmonique ---------- */
(() => {
  let vue = "U";
  const A = Forces.ARGON, r0 = Forces.ljR0(A.sig), k = Forces.ljK(A.eps, A.sig), w = Forces.omegaPair(k, A.m);
  const svg = $("ljchart"), xsl = $("xsl");
  $("vr0").textContent = F.si(r0, "m");
  $("vk").textContent = F.qty(F.num(k, 2), "N·m⁻¹");
  $("vw").textContent = F.qty(F.sci(w, 2), "rad·s⁻¹");
  $("ffreq").textContent = t("lj.f.w", { f: F.si(w / (2 * Math.PI), "Hz"), q: F.num(Forces.HBAR * w / A.eps, 2) });
  /* reduced units: r/σ, U/ε, F σ/ε */
  const u = s => Forces.ljU(s * A.sig, A.eps, A.sig) / A.eps, f = s => Forces.ljF(s * A.sig, A.eps, A.sig) * A.sig / A.eps;
  const s0 = r0 / A.sig, kr = k * A.sig * A.sig / A.eps;
  function draw() {
    svg.innerHTML = "";
    const dom = vue === "U" ? [-1.2, 1.5] : [-3, 6];
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300,
      x: { domain: [0.9, 2.5], label: t("lj.xlab") }, y: { domain: dom, label: t(vue === "U" ? "lj.ylab.u" : "lj.ylab.f") } });
    const path = (fn, cls) => {
      let d = "", pen = false;
      for (let i = 0; i <= 320; i++) {
        const s = 0.9 + i * 1.6 / 320, v = fn(s);
        if (!(v >= dom[0] && v <= dom[1])) { pen = false; continue; }
        d += (pen ? "L" : "M") + x(s).toFixed(1) + " " + y(v).toFixed(1); pen = true;
      }
      Plot.el("path", { d, class: cls }, g);
    };
    Plot.el("line", { x1: x(0.9), x2: x(2.5), y1: y(0), y2: y(0), class: "zero" }, g);
    if (vue === "U") { path(s => -1 + kr * (s - s0) * (s - s0) / 2, "stroke thin dash c-warn"); path(u, "curve"); }
    else { path(s => -kr * (s - s0), "stroke thin dash c-warn"); path(f, "curve"); }
    const xr = +xsl.value / 100, s = s0 * (1 + xr), v = vue === "U" ? u(s) : f(s);
    if (v >= dom[0] && v <= dom[1]) Plot.el("circle", { cx: x(s), cy: y(v), r: 6, class: "dot" }, g);
    Plot.el("line", { x1: x(s0), x2: x(s0), y1: y(dom[0]), y2: y(dom[1]), class: "zero" }, g);
    const n = Plot.el("text", { x: x(s0) + 6, y: y(dom[1]) + 14, class: "note" }, g); n.textContent = t("lj.note.r0");
    const X = xr * r0, Fv = Forces.ljF(r0 + X, A.eps, A.sig), Fh = -k * X;
    $("xread").textContent = t("lj.xread", { p: F.num(+xsl.value, 3), x: F.si(X, "m", { prefix: "p" }) });
    $("vfv").textContent = F.si(Fv, "N"); $("ffv").textContent = t(Fv > 0 ? "lj.f.rep" : Fv < 0 ? "lj.f.att" : "lj.f.zero");
    $("vfh").textContent = F.si(Fh, "N"); $("ffh").textContent = t("lj.f.hooke");
    const e = Forces.hookeError(X, A.eps, A.sig);
    $("verr").textContent = X === 0 ? "0" : F.qty(F.num(e * 100, 2), "%");
    $("ferr").textContent = t("lj.f.err", { p: F.num(-10.5 * xr * 100, 2) });
  }
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { vue = b.dataset.v;
    document.querySelectorAll("[data-v]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  xsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hooke", 1678, "idea"], ["vdw", 1873, "idea"], ["jones", 1924, "idea"], ["london", 1930, "idea"], ["afm", 1986, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["afm", "simulation"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["equilibre", "a"], ["signe", "a"], ["parabole", "a"], ["raideur", "a"], ["dilatation", "a"], ["rupture", "a"], ["quantique", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 123 });
})();
</script>
