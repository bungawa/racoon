<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, { k_B, N_A } = Constantes;

/* ---------- D et μ k_B T mesurés séparément, pour plusieurs rapports de masses ---------- */
(() => {
  const svg = $("courbe"), sv = $("vols"), sa = $("apres"), TAU = 1e-10, T = 293.15, m = S.M.N2 / N_A, K = 100000;
  const RS = [0.01, 0.03, 0.1, 0.3, 1, 3, 10];
  let seed = 435;
  function draw() {
    const reg = sv.value === "reg", neuf = sa.value === "neuf", rand = Quiz.rng(seed);
    const res = RS.map(r => S.einsteinSim({ M: r * m, m, T, tau: TAU, chocs: K, regulier: reg, neuf }, rand));
    svg.innerHTML = "";
    const g = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { scale: "log", domain: [0.005, 20], label: t("sim.x"), fmt: v => F.num(v, 2) }, y: { scale: "log", domain: [0.1, 30], label: t("sim.y"), fmt: v => F.num(v, 2) } });
    const curve = [];
    for (let k = 0; k <= 120; k++) { const r = 0.005 * Math.pow(4000, k / 120); curve.push([g.x(r), g.y(neuf ? (reg ? 0.5 : 1) : S.deriveTheorie(r * m, m, reg))]); }
    Plot.el("path", { d: Plot.path(curve), class: "stroke thin c-label" }, g.g);
    Plot.el("line", { x1: g.x(0.005), x2: g.x(20), y1: g.y(res[0].lv3), y2: g.y(res[0].lv3), class: "stroke thin dash c-label-2" }, g.g);
    res.forEach((x, i) => {
      const X = g.x(RS[i]);
      Plot.el("circle", { cx: X - 4, cy: g.y(x.D / x.unite), r: 4.5, class: "fill c-tint" }, g.g);
      Plot.el("rect", { x: X + 0.5, y: g.y(x.mu * k_B * T / x.unite) - 3.5, width: 7, height: 7, class: "fill c-warn" }, g.g);
    });
    let w = 0, s = 0; res.forEach(x => { const q = 1 / x.errRapport ** 2; w += q; s += q * x.rapport; });
    $("vrap").textContent = F.num(s / w, 3);
    $("frap").textContent = t("sim.f.rapport", { e: F.num(1 / Math.sqrt(w), 1), n: RS.length, k: F.sci(2 * K, 1) });
    $("vlv").textContent = F.num(res[0].lv3 / (res[0].D / res[0].unite), 2);
    const last = res[res.length - 1];
    $("vlourd").textContent = F.num(last.D / last.unite, 3);
  }
  const later = () => setTimeout(draw, 0);
  sv.onchange = later; sa.onchange = later;
  $("refaire").onclick = () => { seed++; later(); }; draw();
})();

/* ---------- ordres de grandeur ---------- */
(() => {
  const ROWS = ["o2", "ion", "silicium"], rows = textOf("ordres.items", ROWS);
  $("ordres").innerHTML = ROWS.map(id => `<div><span class="k">${rows[id].k}</span><span>${rows[id].text}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["graham", 1833, "experiment"], ["fick", 1855, "idea"], ["einstein", 1905, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["silicium", "dls"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["sens", "a"], ["tiers", "b"], ["exacte", "c"], ["temps", "d"], ["pression", "a"], ["silicium", "b"], ["reguliers", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 435 });
})();
</script>
