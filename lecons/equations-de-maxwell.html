<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux;

/* ---------- une tranche de charge qui avance : le courant et le courant de déplacement se compensent ---------- */
const TR = { Q: 1e-6, v: 1e-3, D: 1e-7, s0: 1e-3 };                            // 1 µC per m², 1 mm thick, 1 mm·s⁻¹, D = 10⁻⁷ m²·s⁻¹
(() => {
  const T = OM.tranche(TR.Q, TR.v, TR.D, TR.s0), trace = $("trace"), st = $("st"), sx = $("sx");
  const xs = Array.from({ length: 141 }, (_, i) => (-4 + i * 0.1) / 1000);
  function draw() {
    const tt = +st.value, x0 = +sx.value / 1000;
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 64, b: 44 }, x: { domain: [-4, 10], label: t("fig.xaxis") }, y: { domain: [-0.5, 0.5], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(-4), x2: P.x(10), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const rmax = TR.Q / (Math.sqrt(2 * Math.PI) * TR.s0);                          // ρ drawn to scale: its peak at t = 0 reaches 0,45
    const line = (f, cls) => Plot.el("path", { d: Plot.path(xs.map(x => [P.x(1000 * x), P.y(f(x))])), class: cls }, P.g);
    line(x => 0.45 * T.rho(x, tt) / rmax, "stroke thin dash c-label-2");
    line(x => 1e6 * T.j(x, tt), "curve");
    line(x => 1e6 * T.deplacement(x, tt), "stroke c-warn");
    line(x => 1e6 * T.total(x, tt), "stroke bold c-ok");
    Plot.el("line", { x1: P.x(1000 * x0), x2: P.x(1000 * x0), y1: P.y(-0.5), y2: P.y(0.5), class: "stroke thin c-label-2" }, P.g);
    const j = T.j(x0, tt), d = T.deplacement(x0, tt), s = j + d;
    $("str").textContent = F.si(tt, "s");
    $("sxr").textContent = F.qty(F.num(1000 * x0, 3), "mm");
    $("vj").textContent = F.qty(F.num(1e6 * j, 3), "µA·m⁻²");
    $("fj").textContent = t("fig.f.j", { v: F.si(T.divJ(x0, tt), "A·m⁻³", { prefix: "m" }) });
    $("vd").textContent = F.qty(F.num(1e6 * d, 3), "µA·m⁻²");
    $("fd").textContent = t("fig.f.d", { E: F.si(T.E(x0, tt), "V·m⁻¹", { prefix: "k" }) });
    $("vs").textContent = F.qty(F.sci(1e6 * s, 1), "µA·m⁻²");
    $("fs").textContent = t("fig.f.s", { r: F.sci(Math.abs(s) / Math.max(Math.abs(j), 1e-30), 1) });
  }
  st.oninput = sx.oninput = draw; draw();
})();

/* ---------- le système décrit : la tranche, ses plaques, ses temps ---------- */
(() => {
  const c = Constantes.c, L = 1, d = 0.01, tau = TR.s0 / TR.v;               // plates 1 m wide, the slab watched within 1 cm
  $("sys1").innerHTML = t("sys1.body", { Q: F.si(TR.Q, "C·m⁻²", { prefix: "µ" }), s0: F.si(TR.s0, "m", { prefix: "m" }), v: F.si(TR.v, "m·s⁻¹", { prefix: "m" }),
    D: F.qty(F.sci(TR.D, 1), "m²·s⁻¹"), dL: F.num(d / L, 2), tau: F.si(tau, "s"), Lc: F.si(L / c, "s", { prefix: "n" }), b2: F.sci((TR.v / c) ** 2, 1),
    E: F.si(TR.Q / (2 * Constantes.eps0), "V·m⁻¹", { prefix: "k" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lignes", 1862, "idea"], ["dynamique", 1865, "idea"], ["heaviside", 1885, "idea"], ["hertz", 1887, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["radio"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["divrot", "c"], ["conserv", "a"], ["tranche", "d"], ["permanent", "b"], ["cuivre", "a"], ["creation", "c"], ["monopole", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 181 });
})();
</script>
