<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp;

/* the system: a slow electron of 0,1 eV, wavelength about 3,9 nm */
const M = Q.m_e, P0 = Q.impulsion(M, 0.1 * Q.e), K0 = P0 / Q.hbar, VIT = Q.vitessesOnde(M, P0);

/* ---------- a free packet: its width, its time, the zero of the energies ---------- */
(() => {
  const svg = $("paquet"), ssig = $("ssig"), st = $("st"), seg = $("zero");
  let repos = false;
  const X0 = -30e-9, X1 = 150e-9, xs = Array.from({ length: 1201 }, (_, i) => X0 + i * (X1 - X0) / 1200);
  function draw() {
    const sigma = +ssig.value * 1e-9, tt = +st.value * 1e-15, o = { m: M, k0: K0, sigma, repos };
    const pts = xs.map(x => Q.paquetLibre(x, tt, o));
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 40 }, x: { domain: [X0 * 1e9, X1 * 1e9], label: t("fig.xaxis") }, y: { domain: [-1.05, 1.05], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(X0 * 1e9), x2: P.x(X1 * 1e9), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x * 1e9), P.y(pts[i].re)])), class: "stroke thin c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x * 1e9), P.y(Math.hypot(pts[i].re, pts[i].im))])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x * 1e9), P.y(-Math.hypot(pts[i].re, pts[i].im))])), class: "curve" }, P.g);
    const xg = VIT.groupe * tt * 1e9;
    if (xg <= X1 * 1e9) Plot.el("line", { x1: P.x(xg), x2: P.x(xg), y1: P.y(-1.05), y2: P.y(1.05), class: "stroke thin dash c-warn" }, P.g);
    const sx = Q.largeurPaquet(sigma, M, tt), sp = Q.hbar / (2 * sigma);
    $("ssigr").textContent = t("fig.f.sigma", { s: F.si(sigma, "m"), n: F.num(sigma * K0 / (2 * Math.PI), 2) });
    $("str").textContent = F.si(tt, "s");
    $("vsx").textContent = F.si(sx, "m");
    $("fsx").textContent = t("fig.f.sx", { r: F.num(Q.hbar * tt / (2 * M * sigma * sigma), 2) });
    $("vpr").textContent = F.num(sx * sp / (Q.hbar / 2), 3);
    $("fpr").textContent = t("fig.f.prod", { sp: F.qty(F.sci(sp, 2), "kg·m·s⁻¹") });
    $("vvg").textContent = F.qty(F.sci(VIT.groupe, 2), "m·s⁻¹");
    $("fvg").textContent = t("fig.f.vit", { vp: F.qty(F.sci(repos ? VIT.phase : VIT.phaseCinetique, 2), "m·s⁻¹") });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.z === "repos") === repos)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { repos = b.dataset.z === "repos"; draw(); });
  ssig.oninput = st.oninput = draw; draw();
})();

/* ---------- the system described: a slow electron, a fast one ---------- */
(() => {
  const sigma = 5e-9, tau = 2 * M * sigma * sigma / Q.hbar;
  $("sys1").innerHTML = t("sys1.body", { l: F.si(Q.broglie(P0), "m"), v: F.qty(F.sci(VIT.groupe, 2), "m·s⁻¹"), n: F.num(sigma * K0 / (2 * Math.PI), 2),
    tau: F.si(tau, "s"), d: F.si(VIT.groupe * tau, "m") });
  const P5 = Q.impulsion(M, 50e3 * Q.e), V5 = Q.vitessesOnde(M, P5);
  $("sys2").innerHTML = t("sys2.body", { v: F.num(V5.groupe / Q.c, 2), vp: F.num(V5.phase / Q.c, 2), vc: F.num(V5.phaseCinetique / Q.c, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["einstein", 1905, "idea"], ["broglie", 1924, "idea"], ["schrodinger", 1926, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ptycho"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["plane", "d"], ["energie", "a"], ["train", "c"], ["etale", "b"], ["groupe", "a"], ["zero", "c"], ["approx", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 381 });
})();
</script>
