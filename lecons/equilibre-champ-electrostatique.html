<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9, A = 0.03, Q = -NC;          // sources : −1 nC à 3 cm du centre
const Nm = x => F.si(x, "N·m⁻¹");

/* ---------- le système décrit, chiffré : une bille de 1 mg portant 1 nC ---------- */
(() => {
  const k = ES.K * NC * NC / A ** 3, m = 1e-6, d = 1e-3;
  $("sys").innerHTML = t("sys.body", { k: Nm(k), f: F.si(k * d, "N"), p: F.si(m * 9.81, "N") });
})();

/* ---------- raideurs principales au centre de quatre arrangements ---------- */
(() => {
  const svg = $("pot"), arr = $("arr"), qsl = $("qsl"), S = 0.015, N = 121, O = [0, 0, 0];
  const CUBE = [[1, 0, 0], [1, 1, 0].map(x => x / Math.SQRT2), [1, 1, 1].map(x => x / Math.sqrt(3))];   // second order is zero: edge, face and body diagonals
  const dir = u => (Math.abs(u[2]) > 0.999 ? t("dir.z") : Math.abs(u[2]) < 1e-3 ? t("dir.plan") : t("dir.oblique"));
  function draw() {
    const id = arr.value, q = +qsl.value * NC, ch = ES.ARRANGEMENTS[id](Q, A), sc = ES.K * NC * NC / A ** 3;
    const r = q === 0 ? { valeurs: [0, 0, 0], axes: [[1, 0, 0], [0, 1, 0], [0, 0, 1]], trace: 0 } : ES.raideurs(ch, q, O);
    const k = r.valeurs.map(v => (Math.abs(v) < 1e-9 * sc ? 0 : v)), plat = k.every(v => v === 0);
    const dirs = plat ? CUBE : r.axes, phi0 = ES.potentiel(ch, O);
    const curves = dirs.map(u => Array.from({ length: N }, (_, i) => { const s = -S + 2 * S * i / (N - 1); return [s, q * (ES.potentiel(ch, u.map(x => x * s)) - phi0) / 1e-9]; }));
    const top = Math.max(1e-6, ...curves.flat().map(p => Math.abs(p[1])));
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-S, S], label: t("pot.x"), fmt: v => F.num(100 * v, 2) }, y: { domain: [-top, top], label: t("pot.y") } });
    Plot.el("line", { x1: x(-S), x2: x(S), y1: y(0), y2: y(0), class: "zero" }, g);
    ["c-ko", "c-tint", "c-ok"].forEach((cls, i) => Plot.el("path", { d: Plot.path(curves[i].map(([s, u]) => [x(s), y(u)])), class: "stroke" }, Plot.el("g", { class: cls }, g)));
    $("qread").textContent = F.si(q, "C", { prefix: "n" });
    $("vmin").textContent = Nm(k[0]);
    $("fmin").textContent = plat ? t("pot.f.plat") : t(k[0] < 0 ? "pot.f.instable" : "pot.f.stable", { d: dir(r.axes[0]) });
    $("vmax").textContent = Nm(k[2]);
    $("fmax").textContent = plat ? t("pot.f.plat") : t(k[2] < 0 ? "pot.f.instable" : "pot.f.stable", { d: dir(r.axes[2]) });
    $("vsomme").textContent = Nm(k[0] + k[1] + k[2]);
  }
  arr.onchange = qsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["earnshaw", 1842, "idea"], ["braunbek", 1939, "idea"], ["paul", 1953, "experiment"], ["nobel", 1989, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pieges", "masse"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["triangle", "c"], ["flux", "a"], ["signe", "d"], ["somme", "b"], ["pesanteur", "a"], ["rigide", "c"], ["tube", "d"], ["piege", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 52 });
})();
</script>
