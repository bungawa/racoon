<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, NM = 1e-9;

/* ---------- |ψ|² of a Gaussian packet: the exact probability in [x − Δx/2, x + Δx/2] against |ψ(x)|² Δx ---------- */
(() => {
  const svg = $("dens"), ssig = $("ssig"), sxc = $("sxc"), sdx = $("sdx");
  function draw() {
    const s = +ssig.value * NM, xc = +sxc.value * NM, dx = +sdx.value * NM, o = { sigma: s };
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { domain: [-0.6, 0.6], label: t("fig.x"), fmt: v => F.num(v, 2) }, y: { domain: [0, 14], label: t("fig.y") } });
    const dens = x => Q.paquetGaussien(x * NM, o).P / 1e9;           // nm⁻¹
    const zone = [[ax.x(xc / NM - dx / 2 / NM), ax.y(0)]];
    for (let i = 0; i <= 60; i++) { const x = xc / NM - dx / 2 / NM + dx / NM * i / 60; zone.push([ax.x(x), ax.y(Math.min(dens(x), 14))]); }
    zone.push([ax.x(xc / NM + dx / 2 / NM), ax.y(0)]);
    Plot.el("path", { d: Plot.path(zone) + "Z", class: "fill c-tint", opacity: 0.25 }, ax.g);
    const c = [];
    for (let i = 0; i <= 300; i++) { const x = -0.6 + 1.2 * i / 300; c.push([ax.x(x), ax.y(Math.min(dens(x), 14))]); }
    Plot.el("path", { d: Plot.path(c), class: "stroke bold c-tint" }, ax.g);
    const h = Math.min(dens(xc / NM), 14);
    Plot.el("rect", { x: ax.x(xc / NM - dx / 2 / NM), y: ax.y(h), width: ax.x(dx / NM) - ax.x(0), height: ax.y(0) - ax.y(h), class: "stroke c-warn" }, ax.g);
    const ex = Q.probaIntervalle(xc - dx / 2, xc + dx / 2, o), ap = Q.paquetGaussien(xc, o).P * dx;
    $("ssigr").textContent = F.qty(F.fix(+ssig.value, 3), "nm");
    $("sxcr").textContent = F.qty(F.fix(+sxc.value, 3), "nm");
    $("sdxr").textContent = F.qty(F.fix(+sdx.value, 3), "nm");
    $("vex").textContent = F.num(100 * ex, 3) + " %";
    $("fex").textContent = t("fig.f.exacte", { r: F.num(dx / s, 2) });
    $("vap").textContent = F.num(100 * ap, 3) + " %";
    $("fap").textContent = t("fig.f.ecart", { v: F.num(100 * (ap / ex - 1), 2) });
  }
  ssig.oninput = sxc.oninput = sdx.oninput = draw; draw();
})();

/* ---------- ⟨φ|ψ⟩ as an integral: two packets apart in x and in p ---------- */
(() => {
  const svg = $("recouv"), sd = $("sd"), sp = $("sp"), s = 0.1 * NM, HB = Q.hbar;
  function draw() {
    const d = +sd.value * s, dp = +sp.value * HB / s;
    const phi = { sigma: s, x0: -d / 2, p0: -dp / 2 }, psi = { sigma: s, x0: d / 2, p0: dp / 2 };
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 56 },
      x: { domain: [-0.6, 0.6], label: t("fig.x"), fmt: v => F.num(v, 2) }, y: { domain: [-2.5, 2.5], label: t("rec.y") } });
    for (const [o, cls] of [[psi, "stroke bold c-tint"], [phi, "stroke c-warn"]]) {
      const c = [];
      for (let i = 0; i <= 400; i++) { const x = -0.6 + 1.2 * i / 400; c.push([ax.x(x), ax.y(Q.paquetGaussien(x * NM, o).re / Math.sqrt(1e9))]); }
      Plot.el("path", { d: Plot.path(c), class: cls }, ax.g);
    }
    Plot.el("line", { x1: ax.x(-0.6), x2: ax.x(0.6), y1: ax.y(0), y2: ax.y(0), class: "stroke thin c-label-2" }, ax.g);
    /* (16.20) by Simpson: Re and Im of ∫ φ* ψ dx */
    const L = 3 * NM, prod = part => x => { const u = Q.paquetGaussien(x, phi), v = Q.paquetGaussien(x, psi); return part ? u.re * v.im - u.im * v.re : u.re * v.re + u.im * v.im; };
    const re = Q.simpson(prod(0), -L, L, 3000), im = Q.simpson(prod(1), -L, L, 3000), r = Q.recouvrementGaussiennes(d, dp, s);
    $("sdr").textContent = F.fix(+sd.value, 2) + " σ";
    $("spr").textContent = t("rec.v.dp", { v: F.fix(+sp.value, 2) });
    $("vn").textContent = F.fix(re * re + im * im, 4);
    $("fn").textContent = t("rec.f.num", { re: F.fix(re, 3), im: F.fix(im, 3) });
    $("vf").textContent = F.fix(r.P, 4);
    $("ff").textContent = t("rec.f.formule");
  }
  sd.oninput = sp.oninput = draw; draw();
})();

/* ---------- the system described: a detector of width Δx ---------- */
(() => {
  const o = { sigma: 0.1 * NM }, ecart = r => Q.paquetGaussien(0, o).P * r * o.sigma / Q.probaIntervalle(-r * o.sigma / 2, r * o.sigma / 2, o) - 1;
  $("sys1").innerHTML = t("sys1.body", { e1: F.num(100 * ecart(0.5), 2), e2: F.num(100 * ecart(1), 2), e3: F.num(100 * ecart(2), 2) });
  $("sys2").innerHTML = t("sys2.body", { s: F.qty(F.fix(0.1, 1), "nm") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["born", 1926, "idea"], ["davisson", 1927, "experiment"], ["nobel", 1954, "idea"], ["gleason", 1957, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cristallo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["densite", "b"], ["unite", "d"], ["intervalle", "a"], ["somme", "c"], ["conjugue", "b"], ["orthogonal", "d"], ["phase", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1602 });
})();
</script>
