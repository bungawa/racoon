<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, R = Constantes.R, kB = Constantes.k_B;

/* ---------- B(T) : mesure, Lennard-Jones ajusté, Van der Waals ---------- */
(() => {
  const svg = $("bt"), sg = $("gaz"), st = $("tk"), fits = {};
  const fit = g => fits[g] || (fits[g] = S.ajusteLJ(g));             // about 0,15 s per gas, once
  const cm = x => x * 1e6;                                           // m³·mol⁻¹ → cm³·mol⁻¹ for the axis and the readings
  function draw() {
    const g = sg.value, tab = S.B_MES[g], T0 = tab[0][0], T1 = tab[tab.length - 1][0], f = fit(g), G = S.vdwCritique(g);
    const T = T0 * Math.pow(T1 / T0, +st.value / 100), p = { eps: f.eps, sigma: f.sigma };
    const lo = Math.min(-260, Math.floor(cm(S.bVdw(G, T0)) / 50) * 50), hi = 60;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44, l: 56 },
      x: { domain: [0, 1100], label: t("bt.x") }, y: { domain: [lo, hi], label: t("bt.y") } });
    Plot.el("line", { x1: o.x(0), x2: o.x(1100), y1: o.y(0), y2: o.y(0), class: "stroke thin c-label-2" }, o.g);
    const lj = [], vw = [];
    for (let i = 0; i <= 120; i++) {
      const x = 0.8 * T0 + (1100 - 0.8 * T0) * i / 120, bl = cm(S.bLJ(x, p)), bv = cm(S.bVdw(G, x));
      if (bl >= lo) lj.push([o.x(x), o.y(bl)]); if (bv >= lo) vw.push([o.x(x), o.y(bv)]);
    }
    Plot.el("path", { d: Plot.path(vw), class: "stroke dash c-warn" }, o.g);
    Plot.el("path", { d: Plot.path(lj), class: "stroke c-tint" }, o.g);
    tab.forEach(([x, b]) => Plot.el("circle", { cx: o.x(x), cy: o.y(b), r: 4, class: "fill c-ok" }, o.g));
    Plot.el("line", { x1: o.x(T), x2: o.x(T), y1: o.y(lo), y2: o.y(hi), class: "stroke thin c-label" }, o.g);
    const bm = S.bMesure(g, T), bl = S.bLJ(T, p), bv = S.bVdw(G, T), TB = S.boyle(g), TBv = S.boyleVdw(G);
    $("tkv").innerHTML = F.kelvin(T);
    $("vmes").textContent = F.num(cm(bm), 3);
    $("vlj").textContent = F.num(cm(bl), 3);
    $("vvdw").textContent = F.num(cm(bv), 3);
    $("veps").innerHTML = F.kelvin(f.eps / kB);
    $("vsig").textContent = F.qty(F.num(f.sigma * 1e9, 3), "nm");
    $("frms").textContent = t("bt.f.rms", { e: F.num(cm(f.rms), 2) });
    $("vtb").innerHTML = F.kelvin(TB);
    $("ftb").textContent = t("bt.f.tb", { tv: F.qty(F.num(TBv, 3), "K") });
    $("sys").innerHTML = t("sys.inner", { gaz: t("gaz." + g), T: F.kelvin(T), ekt: F.fix(f.eps / (kB * T), 2),
      bp: F.sci(bm * 101325 / (R * T), 2), avis: t(T < TB ? "sys.attraction" : "sys.repulsion") });
  }
  sg.onchange = st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["onnes", 1901, "idea"], ["jones", 1924, "idea"], ["cohesion", 1931, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gaz"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["paires", "c"], ["signe", "a"], ["vdw", "d"], ["ajuste", "b"], ["troncature", "c"], ["cdeux", "a"], ["boyle", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 4103 });
})();
</script>
