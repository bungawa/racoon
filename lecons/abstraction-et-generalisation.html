<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
/* typographie française partout, sauf le <h1> : il reste identique au titre de lecons/index.json */
const main = document.querySelector("main");
F.autoTypo(main);
document.title = t("title");
const $ = id => document.getElementById(id);
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };

/* ---------- prolonger a^x : des entiers naturels (comptage) aux négatifs, aux fractions, puis à √2 ---------- */
(() => {
  const xa = $("xa"), xx = $("xx"), svg = $("xplot"), P = Plot.el, M = F.MINUS;
  const gcd = (p, q) => q ? gcd(q, p % q) : Math.abs(p);
  const APPROX = [1, 1.4, 1.41, 1.414, 1.4142, 1.41421, 1.414214];
  let irr = false;
  /* écriture de a^x avec la règle qui lui donne un sens ; x = k/4 */
  function form(a, k) {
    const g = gcd(k, 4) || 4, p = k / g, q = 4 / g, A = F.num(a, 2), ap = n => n === 1 ? A : A + F.sup(n);
    const root = s => (q === 2 ? "" : F.sup(q)) + "√" + (Math.abs(p) === 1 ? s : "(" + s + ")");
    if (k === 0) return ["zero", A + "⁰ = 1"];
    if (q === 1) return p > 0 ? ["nat", ap(p) + " = " + Array(p).fill(A).join(" × ")] : ["neg", A + F.sup(p) + " = 1/" + ap(-p)];
    const x = (p < 0 ? M : "") + Math.abs(p) + "/" + q;
    return p > 0 ? ["frac", A + "^(" + x + ") = " + root(ap(p))] : ["negfrac", A + "^(" + x + ") = 1/" + root(ap(-p))];
  }
  function draw(a, x) {
    svg.innerHTML = "";
    const top = Math.pow(a, 3) * 1.05;
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-3, 3], label: t("ext.xlabel") }, y: { domain: [0, top], label: t("ext.ylabel") } });
    const pts = []; for (let u = -3; u <= 3.0001; u += 0.05) pts.push(ax.x(u).toFixed(1) + "," + ax.y(Math.pow(a, u)).toFixed(1));
    P("polyline", { points: pts.join(" "), class: "curve" }, svg);
    for (let n = 0; n <= 3; n++) P("circle", { cx: ax.x(n), cy: ax.y(Math.pow(a, n)), r: 4, class: "dot" }, svg);
    P("line", { x1: ax.x(x), x2: ax.x(x), y1: ax.y(0), y2: ax.y(Math.pow(a, x)), class: "ref" }, svg);
    P("circle", { cx: ax.x(x), cy: ax.y(Math.pow(a, x)), r: 6, class: "dot" }, svg);
  }
  function upd() {
    const a = +xa.value, k = Math.round(+xx.value * 4), x = irr ? Math.SQRT2 : k / 4, v = Math.pow(a, x);
    $("xav").textContent = F.num(a, 2); $("xxv").textContent = irr ? "√2" : F.num(x, 3);
    $("xval").textContent = F.num(v, 6);
    if (irr) {
      $("xform").textContent = t("ext.f.irr", { a: F.num(a, 2) }); $("xrule").textContent = t("ext.irr");
      $("xlist").innerHTML = APPROX.map(r => `<div><span>${F.num(a, 2)}^${F.num(r, 7)}</span><span class="v">${F.num(Math.pow(a, r), 7)}</span></div>`).join("")
        + `<div><span>${t("ext.limit")}</span><span class="v">${F.num(v, 7)}</span></div>`;
    } else { const [kind, f] = form(a, k); $("xform").textContent = f; $("xrule").textContent = t("ext." + kind); }
    $("xlist").hidden = !irr;
    $("xirr").setAttribute("aria-pressed", String(irr));
    draw(a, x);
  }
  $("xirr").onclick = () => { irr = !irr; upd(); };
  xx.oninput = () => { irr = false; upd(); };
  xa.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["brahmagupta", 628, "idea"], ["stevin", 1585, "idea"], ["dedekind", 1872, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["flottant", "echelle", "signe"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["moinsmoins", "a"], ["negpow", "a"], ["frac", "a"], ["negbase", "a"], ["irr", "a"], ["machine", "a"], ["methode", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => { const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) }; }), { t, seed: 24 });
})();
</script>
