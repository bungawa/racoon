<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, P0 = Q.quantumFlux();
$("sys1").innerHTML = t("sys.body", { kj: F.num(Q.frequenceJosephson(1e-6) / 1e6, 10), kt: F.qty(F.num(Constantes.k_B * 4.2 / Constantes.e * 1e6, 3), "µeV") });
(() => {
  const svg = $("squid"), sf = $("sf"), sv = $("sv"), sr = $("sr");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [-3, 3], label: t("fig.x") }, y: { domain: [0, 2.1], label: t("fig.y") } });
  Plot.el("path", { d: Plot.path(Array.from({ length: 601 }, (_, i) => { const u = -3 + 6 * i / 600; return [x(u), y(Q.courantSquid(u * P0, 1))]; })), class: "stroke c-tint" }, g);
  const mk = Plot.el("line", { y1: y(0), y2: y(2.1), class: "stroke c-warn" }, g);
  function draw() {
    const phi = +sf.value / 100, V = +sv.value * 1e-6, f = +sr.value * 1e9, I = Q.courantSquid(phi * P0, 1);
    mk.setAttribute("x1", x(phi)); mk.setAttribute("x2", x(phi));
    $("sfr").textContent = t("fig.v.phi", { p: F.num(phi, 3) }); $("svr").textContent = F.si(V, "V"); $("srr").textContent = F.si(f, "Hz");
    $("vi").textContent = t("fig.v.i", { i: F.num(I, 3) });
    $("fi").textContent = t("fig.f.i");
    $("va").textContent = F.si(Q.frequenceJosephson(V), "Hz");
    $("fa").textContent = V === 0 ? t("fig.f.dc") : t("fig.f.ac");
    $("vs").textContent = F.si(Q.tensionShapiro(1, f), "V");
    $("fs").textContent = t("fig.f.s", { n: Q.tensionShapiro(1, f) > 0 ? F.num(V / Q.tensionShapiro(1, f), 3) : "—" });
  }
  sf.oninput = sv.oninput = sr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["josephson", 1962, "idea"], ["anderson", 1963, "experiment"], ["squid", 1964, "experiment"], ["volt", 1990, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["volt", "qubit"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dc", "b"], ["ac", "a"], ["moyenne", "c"], ["marches", "a"], ["squid", "d"], ["charge", "a"], ["deuxfentes", "d"], ["volt", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 219 });
})();
</script>
