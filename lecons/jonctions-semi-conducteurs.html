<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes, Si = Q.SEMI.Si;

/* ---------- the densities across a p-n junction ---------- */
(() => {
  const svg = $("fig"), sa = $("sa"), sd = $("sd"), st = $("st");
  function draw() {
    const NA = Math.pow(10, +sa.value), ND = Math.pow(10, +sd.value), T = +st.value, ni = Q.densiteIntrinseque(Si, T);
    const V = Q.barriereJonction(ND, NA, ni, T);
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 64, b: 44 }, x: { domain: [-1, 1], label: t("fig.xaxis"), ticks: 4 }, y: { scale: "log", domain: [1e8, 1e25], label: t("fig.yaxis") } });
    /* a schematic profile: the potential goes from 0 (p side) to V (n side) along a smooth step, and each density
       follows its Boltzmann factor, e^(+eφ/kT) for electrons, e^(−eφ/kT) for holes: their product stays ni² */
    const kT = K.k_B * T / K.e, nP = ni * ni / NA, cn = [], cp = [];
    for (let i = 0; i <= 200; i++) {
      const x = -1 + 2 * i / 200, phi = V * (1 + Math.tanh(x / 0.15)) / 2;
      const n = nP * Math.exp(phi / kT), p = NA * Math.exp(-phi / kT), clip = v => Math.min(1e25, Math.max(1e8, v));
      cn.push([G.x(x), G.y(clip(n))]); cp.push([G.x(x), G.y(clip(p))]);
    }
    Plot.el("path", { d: Plot.path(cn), class: "stroke c-label" }, G.g);
    Plot.el("path", { d: Plot.path(cp), class: "stroke c-warn" }, G.g);
    Plot.el("line", { x1: G.x(0), x2: G.x(0), y1: G.y(1e8), y2: G.y(1e25), class: "stroke thin dash c-label-2" }, G.g);
    $("sar").textContent = F.qty(F.sci(NA, 2), "m⁻³");
    $("sdr").textContent = F.qty(F.sci(ND, 2), "m⁻³");
    $("str").innerHTML = F.kelvin(T);
    $("vv").textContent = F.si(V, "V");
    $("fv").textContent = t("fig.f.v", { g: F.si(Si.Eg / K.e, "V") });
    $("vr").textContent = F.sci(Q.rapportJonction(V, T), 2);
    $("fr").textContent = t("fig.f.r");
  }
  sa.oninput = draw; sd.oninput = draw; st.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const ni = Q.densiteIntrinseque(Si, 300);
  $("sys1").innerHTML = t("sys1.body", { kT: F.si(K.k_B * 300 / K.e, "V"), V: F.si(Q.barriereJonction(1e22, 1e23, ni, 300), "V") });
  $("sys2").innerHTML = t("sys2.body");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["redresseur", 1874, "experiment"], ["schottky", 1938, "idea"], ["ohl", 1940, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["solaire"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["diffusion", "b"], ["equilibre", "d"], ["fils", "a"], ["valeur", "c"], ["lumiere", "a"], ["dopage", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1404 });
})();
</script>
