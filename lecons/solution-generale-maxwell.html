<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OndesMilieux;

/* ---------- une antenne droite à 300 MHz (λ = 1 m) : (21.16) sommée élément par élément ---------- */
(() => {
  const lambda = 1, w = 2 * Math.PI * Constantes.c / lambda, TH = Array.from({ length: 181 }, (_, i) => i);
  const sL = $("sL"), sr = $("sr"), sth = $("sth");
  function draw() {
    const L = +sL.value * lambda, r = 10 ** +sr.value * lambda, th = +sth.value, rad = th * Math.PI / 180;
    const pts = TH.map(d => O.amplitudeAntenne(L, lambda, r, d * Math.PI / 180, 300));
    const svg = $("diagramme"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, 180], label: t("fig.xaxis") }, y: { domain: [0, 1.2], label: t("fig.yaxis") } });
    const path = (k, cls) => Plot.el("path", { d: Plot.path(TH.map((d, i) => [P.x(d), P.y(Math.min(1.2, pts[i][k]))])), class: cls }, P.g);
    path("instantane", "stroke c-label-2 dash"); path("lointain", "ref"); path("retarde", "curve");
    const a = pts[th];
    Plot.el("circle", { cx: P.x(th), cy: P.y(Math.min(1.2, a.retarde)), r: 5, class: "dot" }, P.g);
    $("sLr").textContent = t("fig.Lval", { L: F.si(L, "m"), x: F.num(L / lambda, 3) });
    $("srr").textContent = t("fig.rval", { r: F.si(r, "m"), f: F.num(r * lambda / (L * L), 2) });
    $("sthr").textContent = F.qty(F.num(th, 3), "°");
    $("vret").textContent = F.num(a.retarde, 3);
    $("fret").textContent = t("fig.f.ret", { v: F.num(a.lointain, 3), i: F.num(a.instantane, 3) });
    $("vph").textContent = F.qty(F.num(2 * Math.PI * L * Math.abs(Math.cos(rad)) / lambda, 3), "rad");
    $("fph").textContent = t("fig.f.phase");
    const ant = O.antenne({ L, w, n: 300 }), p = [r * Math.sin(rad), 0, r * Math.cos(rad)];
    const l = O.lorenz3D(ant, p, 1.1e-9, { dx: 1e-4 * lambda, dt: 1e-12 });
    $("vlor").textContent = l.echelle > 0 ? F.sci(Math.abs(l.residu) / l.echelle, 1) : "0";
    $("flor").textContent = t("fig.f.lorenz");
  }
  sL.oninput = sr.oninput = sth.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lorenz", 1867, "idea"], ["maxwell", 1868, "idea"], ["wiechert", 1900, "idea"], ["nec", 1981, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["antennes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["lineaire", "c"], ["source", "a"], ["champs", "d"], ["petite", "b"], ["zero", "a"], ["instant", "c"], ["jauge", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 213 });
})();
</script>
