<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, MU0 = Constantes.mu0;
/* the magnet of the page: an iron yoke of mean length 50 cm, pole faces of 10 cm², the steel of « Courbe d'aimantation »,
   cycled between ±50 kA·m⁻¹ (well into saturation) for the branches "coming down" and "coming up" */
const L2 = 0.5, S = 1e-3, HM = 5e4;
const C = M.cycleHysteresis(M.ACIER_JA, HM, { n: 500 });

/* ---------- le système décrit : où vont les ampères-tours ---------- */
(() => {
  const r = M.electroaimantLineaire(1000, 0.002, L2, 1000);
  $("sys1").innerHTML = t("sys1.body", { x: F.num(L2 / (1000 * 0.002), 2), e: F.qty(F.num(100 * r.entrefer, 2), "%") });
})();

/* ---------- la droite de l'entrefer et la courbe du fer ---------- */
(() => {
  const svg = $("aimant"), sni = $("sni"), sl = $("sl"), seg = $("histoire");
  let br = "premiere";
  function draw() {
    const NI = +sni.value, l1 = +sl.value / 1000, p = M.pointFonctionnement(C[br], NI, l1, L2);
    const X0 = -3, X1 = Math.max(6, Math.min(HM, 1.15 * NI / L2) / 1e3), Y0 = -0.6, Y1 = 2.3;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 360, x: { domain: [X0, X1], label: t("fig.ax.x") }, y: { domain: [Y0, Y1], label: t("fig.ax.y") } });
    const keep = q => q[0] / 1e3 >= X0 && q[0] / 1e3 <= X1 && q[1] >= Y0 && q[1] <= Y1;
    const xy = q => [P.x(q[0] / 1e3), P.y(Math.max(Y0, Math.min(Y1, q[1])))];
    Plot.el("line", { x1: P.x(X0), x2: P.x(X1), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("line", { x1: P.x(0), x2: P.x(0), y1: P.y(Y0), y2: P.y(Y1), class: "zero" }, P.g);
    Plot.el("path", { d: Plot.path(C.descendante.filter(keep).map(xy)), class: br === "descendante" ? "curve" : "stroke thin c-tint" }, P.g);
    Plot.el("path", { d: Plot.path(C.montante.filter(keep).map(xy)), class: br === "montante" ? "curve" : "stroke thin c-tint" }, P.g);
    Plot.el("path", { d: Plot.path(C.premiere.filter(keep).map(xy)), class: br === "premiere" ? "stroke bold c-label-2" : "stroke thin c-label-2" }, P.g);
    /* the line (36.27), clipped to the frame */
    const pts = [];
    if (l1 === 0) pts.push([NI / L2, Y0], [NI / L2, Y1]);
    else { const d = M.droiteCharge(NI, l1, L2); for (let i = 0; i <= 200; i++) { const H = 1e3 * (X0 + (X1 - X0) * i / 200), B = d.B(H); if (B >= Y0 && B <= Y1) pts.push([H, B]); } }
    if (pts.length > 1) Plot.el("path", { d: Plot.path(pts.map(xy)), class: "ref" }, P.g);
    if (p) Plot.el("circle", { cx: P.x(p.H / 1e3), cy: P.y(p.B), r: 5, class: "dot" }, P.g);
    $("snir").innerHTML = t("fig.f.ni", { NI: F.si(NI, "A", { sig: 3 }), I: F.si(NI / 500, "A", { sig: 3 }) });
    $("slr").innerHTML = F.si(l1, "m", { sig: 2 });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.b === br)));
    if (!p) { ["vb", "fb", "vpart", "fpart", "vf", "ff"].forEach(id => $(id).innerHTML = ""); $("vb").textContent = t("fig.aucun"); return; }
    $("vb").innerHTML = F.si(p.B, "T", { sig: 3 });
    $("fb").innerHTML = l1 > 0 ? t("fig.f.b", { B: F.si(MU0 * NI / l1, "T", { sig: 3 }) }) : t("fig.f.b0");
    $("vpart").innerHTML = NI > 0 ? F.qty(F.num(100 * (1 - p.fer), 3), "%") : "—";
    $("fpart").innerHTML = t("fig.f.part", { H: F.si(p.H, "A·m⁻¹", { sig: 3 }) });
    $("vf").innerHTML = l1 > 0 ? F.si(M.forcePole(p.B, S), "N", { sig: 3 }) : "—";
    $("ff").innerHTML = t("fig.f.f", { m: F.si(M.forcePole(p.B, S) / Constantes.g0, "kg", { sig: 2 }) });
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { br = x.dataset.b; draw(); });
  sni.oninput = sl.oninput = draw; draw();
})();

/* ---------- l'aimant permanent : courant nul après saturation ---------- */
(() => {
  const d = M.pointFonctionnement(C.descendante, 0, 0.002, L2), ferme = M.pointFonctionnement(C.descendante, 0, 0, L2);
  $("perm").innerHTML = t("perm.body", { B: F.si(d.B, "T", { sig: 2 }), H: F.si(-d.H, "A·m⁻¹", { sig: 2 }), Br: F.si(ferme.B, "T", { sig: 2 }),
    Hc: F.si(C.Hc, "A·m⁻¹", { sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["sturgeon", 1825, "experiment"], ["henry", 1831, "experiment"], ["hopkinson", 1886, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["levage"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["entrefer", "c"], ["pourquoi", "a"], ["histoire", "d"], ["aimant", "b"], ["force", "c"], ["double", "a"], ["sature", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 365 });
})();
</script>
