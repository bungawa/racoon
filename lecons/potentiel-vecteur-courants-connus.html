<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MI = MagInd, AV = AnaVec;
const R = 0.05, IC = 10;                                 // la spire : rayon 5 cm, courant 10 A
const exact = (x, z) => MI.spireExacte(IC, R, Math.abs(x), z);

/* ---------- la spire, coupée dans le plan y = 0 (x horizontal, z vertical, en m) ---------- */
(() => {
  const svg = $("spire"), O = { W: 640, H: 400, x0: -3 * R, x1: 3 * R, y0: -1.875 * R, y1: 1.875 * R };
  const LIGNES = [0.2, 0.4, 0.6, 0.75, 0.85, 0.93].map(f => f * R * exact(f * R, 0).Aphi);   // ρ A_φ constant le long d'une ligne de B
  let c, p = [0.6 * R, 0.7 * R];
  function fond() {
    c = CarteChamp.carte(svg, O);
    CarteChamp.fond(c, q => { const a = exact(q[0], q[1]).Aphi; return Number.isFinite(a) ? a : NaN; }, 64, 40, { cls: "c-tint", lo: 0, hi: 6e-6 });
    CarteChamp.niveaux(c, q => Math.abs(q[0]) * exact(q[0], q[1]).Aphi, LIGNES);
    CarteChamp.point(c, [R, 0], 6, "c-warn", "⊗", -12); CarteChamp.point(c, [-R, 0], 6, "c-warn", "⊙", -12);
    Plot.el("line", { x1: c.sx(0), y1: 0, x2: c.sx(0), y2: O.H, class: "stroke thin" }, c.layer("c-label"));
  }
  let sonde;
  function draw() {
    if (!c) fond();
    if (sonde) sonde.remove();
    const N = +$("nel").value, els = MI.spireElements(IC, R, N), P = [p[0], 0, p[1]], s = Math.sign(p[0]) || 1;
    const A = MI.potentielElements(els, P), aphi = s * A[1], ex = exact(p[0], p[1]);
    const rot = AV.rotationnel(q => MI.potentielElements(els, q), P, 1e-6), bs = MI.champElements(els, P);
    const naif = MI.aphiNaif(els, P);
    CarteChamp.point(c, p, 4, "c-ok", "P", -10);
    sonde = svg.lastChild;
    $("nelv").textContent = String(N);
    $("va").textContent = F.si(aphi, "T·m");
    $("fa").textContent = t("sp.f.a", { ex: F.si(ex.Aphi, "T·m"), e: F.sci(Math.abs(aphi - ex.Aphi) / Math.abs(ex.Aphi || 1e-300), 1) });
    $("vb").textContent = F.si(Math.hypot(...rot), "T");
    $("fb").textContent = t("sp.f.b", { bs: F.si(Math.hypot(...bs), "T"), ex: F.si(Math.hypot(ex.Brho, ex.Bz), "T") });
    $("vn").textContent = F.si(naif, "T·m");
    $("fn").textContent = t("sp.f.naif", { ex: F.si(ex.Aphi, "T·m") });
    $("spread").innerHTML = t(Math.abs(p[0]) < 0.02 * R ? "sp.read.axe" : Math.hypot(Math.abs(p[0]) - R, p[1]) < 0.3 * R ? "sp.read.pres" : "sp.read.loin");
  }
  $("nel").oninput = draw;
  CarteChamp.survol(svg, () => c, q => { if (Math.hypot(Math.abs(q[0]) - R, q[1]) > 0.04 * R) { p = [Math.max(O.x0, Math.min(O.x1, q[0])), Math.max(O.y0, Math.min(O.y1, q[1]))]; draw(); } });
  draw();
})();

/* ---------- ordres de grandeur ---------- */
(() => {
  const b0 = exact(0, 0).Bz, a = exact(R / 2, 0).Aphi, loin = exact(10 * R, 0).Aphi;
  $("ordres").innerHTML = t("ordres.body", { b: F.si(b0, "T"), a: F.si(a, "T·m"), loin: F.si(loin, "T·m") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["poisson", 1813, "idea"], ["biot", 1820, "experiment"], ["neumann", 1845, "idea"], ["ruehli", 1972, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["inductance"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["poisson", "b"], ["composante", "d"], ["axe", "a"], ["jauge", "c"], ["fil", "b"], ["elements", "c"], ["centre", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 142 });
})();
</script>
