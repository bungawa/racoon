<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La loi de Hooke</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-solide" data-i18n="monde.solide"></a><span class="aux">›</span><a href="/racoon/etape?id=elasticite-1" data-i18n="etape.elasticite-1"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/tenseur-des-contraintes" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mi>F</mi><mo>=</mo><mi>E</mi><mi>A</mi><mfrac><mrow><mi mathvariant="normal">Δ</mi><mi>L</mi></mrow><mi>L</mi></mfrac></math><span class="n">(38.3)</span></div>
    <p class="validite" data-i18n-html="val.hooke"></p>
    <p data-i18n-html="s1.p3"></p>
    <div class="eq"><math display="block"><mi>σ</mi><mo>=</mo><mfrac><mi>F</mi><mi>A</mi></mfrac><mo>=</mo><mi>E</mi><mspace width="0.2em"></mspace><mi>ε</mi><mo>,</mo><mspace width="1em"></mspace><mi>ε</mi><mo>=</mo><mfrac><mrow><mi mathvariant="normal">Δ</mi><mi>L</mi></mrow><mi>L</mi></mfrac></math><span class="n">(38.4)</span></div>
    <p class="validite" data-i18n-html="val.sigma"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mfrac><mrow><mi mathvariant="normal">Δ</mi><mi>d</mi></mrow><mi>d</mi></mfrac><mo>=</mo><mo>−</mo><mi>ν</mi><mfrac><mrow><mi mathvariant="normal">Δ</mi><mi>L</mi></mrow><mi>L</mi></mfrac></math><span class="n">(38.5)</span></div>
    <p class="validite" data-i18n-html="val.poisson"></p>
    <p data-i18n-html="s2.p2"></p>
    <figure>
      <div class="seg" role="group" data-i18n-attr="aria-label:bar.mat">
        <button type="button" id="m-acier" aria-pressed="true"></button>
        <button type="button" id="m-aluminium" aria-pressed="false"></button>
        <button type="button" id="m-beton" aria-pressed="false"></button>
      </div>
      <svg class="fig" id="bar" viewBox="0 0 640 200" role="img" data-i18n-attr="aria-label:bar.aria"></svg>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="F" data-i18n="bar.F"></label><output id="Fv" for="F"></output></div>
            <input id="F" type="range" min="-200" max="200" step="1" value="50"></div>
          <div class="ctl"><div class="row"><label for="d" data-i18n="bar.d"></label><output id="dv" for="d"></output></div>
            <input id="d" type="range" min="5" max="60" step="1" value="20"></div>
          <div class="ctl"><div class="row"><label for="L" data-i18n="bar.L"></label><output id="Lv" for="L"></output></div>
            <input id="L" type="range" min="0.5" max="5" step="0.1" value="2"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="bar.k.sigma"></span><span class="v" id="vs"></span><span class="f" id="fs"></span></div>
          <div class="stat"><span class="k" data-i18n="bar.k.dL"></span><span class="v" id="vdL"></span><span class="f" id="feps"></span></div>
          <div class="stat"><span class="k" data-i18n="bar.k.dd"></span><span class="v" id="vdd"></span><span class="f" id="fdv"></span></div>
          <div class="stat"><span class="k" data-i18n="bar.k.k"></span><span class="v" id="vk"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="bar.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="s2.sys.title"></b>
      <p data-i18n-html="s2.sys.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/loi-de-hooke.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/oscillateur.js"></script>
<script src="/racoon/lecons/elasticite.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- la barre tirée ---------- */
(() => {
  const MATS = ["acier", "aluminium", "beton"], NAMES = textOf("bar.mats", MATS), svg = $("bar");
  let mat = "acier";
  const text = (x, y, s, anchor) => { P("text", { x, y, "text-anchor": anchor || "middle" }, svg).textContent = s; };
  function upd() {
    const m = Elasticite.MATERIAUX[mat], Fk = +$("F").value, d = +$("d").value / 1000, L = +$("L").value, A = Math.PI * d * d / 4;
    const r = Elasticite.traction({ E: m.E, nu: m.nu, A, L, F: Fk * 1e3 });
    MATS.forEach(id => $("m-" + id).setAttribute("aria-pressed", String(id === mat)));
    $("Fv").textContent = F.si(Fk * 1e3, "N"); $("dv").textContent = F.qty(F.num(d * 1000, 3), "mm"); $("Lv").textContent = F.qty(F.num(L, 3), "m");
    $("vs").textContent = F.si(r.sigma, "Pa");
    const lim = r.sigma >= 0 ? m.lim : m.limC;
    $("fs").textContent = lim == null ? t("bar.f.alliage") : t(Math.abs(r.sigma) <= lim ? "bar.f.ok" : "bar.f.ko", { r: F.fix(Math.abs(r.sigma) / lim, 2) });
    $("vdL").textContent = F.si(r.dL, "m"); $("feps").textContent = t("bar.f.eps", { e: F.sci(r.eps, 2) });
    $("vdd").textContent = F.si(r.epsLat * d, "m"); $("fdv").textContent = t("bar.f.dv", { v: F.sci(r.dVsurV, 2) });
    $("vk").textContent = F.si(r.k, "N·m⁻¹");
    /* drawing: the bar at rest (dashed) and stretched, strains magnified so that the largest shows */
    svg.innerHTML = "";
    const amp = Math.abs(r.eps) > 0 ? Math.min(1e5, 0.25 / Math.abs(r.eps)) : 1, k = amp >= 10 ? Math.pow(10, Math.floor(Math.log10(amp))) : 1;
    const x0 = 60, len = 400 * L / 5, h = 20 + 60 * (d / 0.06), y0 = 100;
    P("rect", { x: x0, y: y0 - h / 2, width: len, height: h, class: "stroke thin dash c-label-2" }, svg);
    const len2 = len * (1 + k * r.eps), h2 = h * (1 + k * r.epsLat);
    P("rect", { x: x0, y: y0 - h2 / 2, width: Math.max(len2, 1), height: Math.max(h2, 1), class: "stroke bold c-tint" }, svg);
    P("line", { x1: x0, y1: 30, x2: x0, y2: 170, class: "stroke bold c-label" }, svg);
    if (Fk) Plot.fleche(svg, [x0 + len2 + (Fk > 0 ? 6 : 76), y0], [x0 + len2 + (Fk > 0 ? 76 : 6), y0], { cls: "c-warn" });
    text(x0 + len2 + 41, y0 - 12, t("bar.Fl"));
    text(320, 190, t("bar.ampli", { k: F.num(k, 1) }));
  }
  ["F", "d", "L"].forEach(id => $(id).oninput = upd);
  MATS.forEach(id => { $("m-" + id).textContent = NAMES[id]; $("m-" + id).onclick = () => { mat = id; upd(); }; });
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["anagramme", 1676, "idea"], ["ressort", 1678, "experiment"], ["young", 1807, "idea"], ["essai", 2019, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["essai", "charpente", "peson"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["longueur", "b"], ["section", "d"], ["module", "a"], ["poisson", "c"], ["volume", "b"], ["domaine", "a"], ["fil", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
</html>
