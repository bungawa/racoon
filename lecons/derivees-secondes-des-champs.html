    <div class="eq"><math display="block"><mo>∇</mo><mo>·</mo><mo stretchy="false">(</mo><mo>∇</mo><mi>T</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mo>∇</mo><mn>2</mn></msup><mi>T</mi><mo>=</mo><mfrac><mrow><msup><mo>∂</mo><mn>2</mn></msup><mi>T</mi></mrow><mrow><mo>∂</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mo>∂</mo><mn>2</mn></msup><mi>T</mi></mrow><mrow><mo>∂</mo><msup><mi>y</mi><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mo>∂</mo><mn>2</mn></msup><mi>T</mi></mrow><mrow><mo>∂</mo><msup><mi>z</mi><mn>2</mn></msup></mrow></mfrac></math><span class="n">(2.53)</span></div>

    <figure class="chart">

      <div class="legend"><span class="c-tint" data-i18n="lap.legend.t"></span><span class="c-warn" data-i18n="lap.legend.m"></span></div>
      <div class="panel">
        <div class="controls">
          <label class="field"><span data-i18n="lap.pick"></span>
            <select id="scal">
              <option value="bol" data-i18n="lap.opt.bol"></option>
              <option value="selle" data-i18n="lap.opt.selle"></option>
              <option value="coulomb" data-i18n="lap.opt.coulomb"></option>
              <option value="onde" data-i18n="lap.opt.onde"></option>

          <div class="ctl"><div class="row"><label for="xsl" data-i18n="lap.x"></label><output id="xread" for="xsl"></output></div>
            <input id="xsl" type="range" min="-1" max="1" step="0.05" value="0.3"></div>
          <div class="ctl"><div class="row"><label for="asl" data-i18n="lap.a"></label><output id="aread" for="asl"></output></div>

          <div class="stat"><span class="k" data-i18n-html="lap.k.e"></span><span class="v" id="ve"></span><span class="f" data-i18n="lap.f.e"></span></div>

        </div>
      </div>
      <figcaption data-i18n-html="lap.caption"></figcaption>
    </figure>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mo>∇</mo><mo>∧</mo><mo stretchy="false">(</mo><mo>∇</mo><mo>∧</mo><mover accent="true"><mi>h</mi><mo>→</mo></mover><mo stretchy="false">)</mo><mo>=</mo><mo>∇</mo><mo stretchy="false">(</mo><mo>∇</mo><mo>·</mo><mover accent="true"><mi>h</mi><mo>→</mo></mover><mo stretchy="false">)</mo><mo>−</mo><msup><mo>∇</mo><mn>2</mn></msup><mover accent="true"><mi>h</mi><mo>→</mo></mover></math><span class="n">(2.58)</span></div>

          <select id="vect">

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Y0 = 0.1, Z0 = 0.25;                                                       // m: the line y = 0,1 m, z = 0,25 m

/* ---------- le laplacien, écart à la moyenne des voisins ---------- */
(() => {
  const svg = $("lap"), sel = $("scal"), xs = $("xsl"), as = $("asl");
  const path = Plot.path;
  function draw() {
    const s = Nabla.scalaire(sel.value), x = +xs.value, a = +as.value, p = [x, Y0, Z0], T0 = s.T(p);
    const e = Nabla.ecartMoyenne(s.T, p, a), est = 6 * e / (a * a), ex = s.lap(p);
    const xsAll = Array.from({ length: 201 }, (_, i) => -1.4 + 2.8 * i / 200), Ts = xsAll.map(u => s.T([u, Y0, Z0]));
    const lo = Math.min(...Ts), hi = Math.max(...Ts), m = Math.max(1, 0.1 * (hi - lo));
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 }, x: { domain: [-1.4, 1.4], label: t("lap.xaxis") }, y: { domain: [Math.floor(lo - m), Math.ceil(hi + m)], label: t("lap.yaxis") } });
    Plot.el("path", { d: path(xsAll.map((u, i) => [o.x(u), o.y(Ts[i])])), class: "curve" }, o.g);
    const mean = T0 + e;
    Plot.el("path", { d: path([[o.x(x - a), o.y(mean)], [o.x(x + a), o.y(mean)]]), class: "ref" }, o.g);
    [x - a, x + a].forEach(u => Plot.el("circle", { cx: o.x(u), cy: o.y(s.T([u, Y0, Z0])), r: 3.5, class: "dot" }, o.g));
    Plot.el("circle", { cx: o.x(x), cy: o.y(T0), r: 5, class: "dot" }, o.g);
    $("xread").textContent = F.qty(F.fix(x, 2), "m");
    $("aread").textContent = F.qty(F.fix(a, 2), "m");
    $("vt").textContent = F.qty(F.num(T0, 4), "K");
    $("ve").textContent = F.qty(F.fix(e, 3), "K");
    $("vest").textContent = F.qty(F.num(est, 3), "K·m⁻²");
    $("fest").textContent = t("lap.f.est", { v: F.num(ex, 3) });
  }
  [sel, xs, as].forEach(e => { e.oninput = draw; e.onchange = draw; }); draw();
})();

/* ---------- la table (2.59), vérifiée en un point ---------- */
(() => {
  const sel = $("vect"), zs = $("zsl");
  const vec = v => "(" + v.map(c => F.fix(Math.abs(c) < 5e-6 ? 0 : c, 3)).join(" ; ") + ")";
  function draw() {
    const p = [0.3, -0.2, +zs.value], r = Nabla.identites(Nabla.VECTORIELS[sel.value], Nabla.scalaire("gauss").T, p);
    $("zread").textContent = F.qty(F.fix(p[2], 1), "m");
    $("vrr").textContent = vec(r.rotRot);
    $("vgd").textContent = vec(r.gradDiv.map((g, i) => g - r.lap[i]));
    $("fgd").textContent = t("id.f.ecart", { e: F.sci(Math.max(r.ecart, 1e-12), 1) });
    $("vdr").textContent = F.fix(Math.abs(r.divRot) < 5e-6 ? 0 : r.divRot, 3);
    $("vrg").textContent = vec(r.rotGrad);
  }
  [sel, zs].forEach(e => { e.oninput = draw; e.onchange = draw; }); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["poisson", 1813, "idea"], ["green", 1828, "idea"], ["maxwell", 1871, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["images", "electrostatique"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["zero", "a"], ["calcul", "b"], ["moyenne", "c"], ["harmonique", "d"], ["tourbillon", "a"], ["vecteur", "b"], ["rotrot", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 207 });
})();
</script>
