<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, C = Constantes.c, W = lam => 2 * Math.PI * C / lam;

/* ---------- R selon la longueur d'onde : trois métaux de Drude et un absorbeur fort ---------- */
(() => {
  /* the model absorber: one resonance at 570 nm, strength wp = w0, damping 5 %, background index 1,5 */
  const W0 = W(570e-9), ABS = { w0: W0, wp: W0, gamma: 0.05 * W0, nInf: 1.5 };
  const etat = (m, lam) => {
    if (m === "absorbeur") { const x = M.indiceLorentz(W(lam), ABS), R = M.fresnelInterface(1, x.n, 0).s.R;
      return { R, nR: x.nR, nI: x.nI, profondeur: x.nI > 0 ? C / (W(lam) * x.nI) : Infinity, hr: null }; }
    const x = M.reflectanceMetal(W(lam), m);
    return { R: x.R, nR: x.nR, nI: x.nI, profondeur: x.profondeur, hr: x.hagenRubens, wtau: x.wtau, lambdaP: x.drude.lambdaP };
  };
  const trace = $("trace"), sl = $("sl"), seg = $("mat");
  let mat = "argent";
  function draw() {
    const lam = Math.pow(10, +sl.value / 100), e = etat(mat, lam);
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 280, pad: { l: 52, b: 44 }, x: { scale: "log", domain: [3e-8, 1e-3], label: t("fig.xaxis") }, y: { domain: [0, 1], label: t("fig.yaxis") } });
    const ls = Array.from({ length: 451 }, (_, i) => Math.pow(10, -7.5 + i / 100)), es = ls.map(l => etat(mat, l));
    Plot.el("path", { d: Plot.path(ls.map((l, i) => [P.x(l), P.y(es[i].R)])), class: "stroke c-tint" }, P.g);
    if (mat !== "absorbeur") {
      Plot.el("path", { d: Plot.path(ls.map((l, i) => [P.x(l), P.y(Math.max(0, es[i].hr))])), class: "stroke dash c-warn" }, P.g);
      Plot.el("line", { x1: P.x(e.lambdaP), x2: P.x(e.lambdaP), y1: P.y(0), y2: P.y(1), class: "ref" }, P.g);
      Plot.el("text", { x: P.x(e.lambdaP) + 4, y: P.y(0.08), class: "note" }, P.g).textContent = t("fig.mark.p");
    }
    Plot.el("circle", { cx: P.x(lam), cy: P.y(e.R), r: 5, class: "dot" }, P.g);
    $("slr").textContent = F.si(lam, "m");
    $("vn").textContent = t("fig.v.n", { r: F.num(e.nR, 3), i: F.num(e.nI, 3) });
    $("fn").textContent = e.hr == null ? t("fig.f.lorentz") : t("fig.f.drude", { wt: F.num(e.wtau, 2), lp: F.si(e.lambdaP, "m") });
    $("vR").textContent = F.fix(e.R, 4);
    $("fR").textContent = e.hr == null ? t("fig.f.absorbe", { a: F.fix(1 - e.R, 4) }) : t("fig.f.hr", { a: F.fix(1 - e.R, 4), h: F.fix(e.hr, 4) });
    $("vd").textContent = isFinite(e.profondeur) && e.profondeur < 1 ? F.si(e.profondeur, "m") : t("fig.v.infini");
    $("fd").textContent = t("fig.f.d", { r: F.num(e.profondeur / lam, 2) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mat)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mat = x.dataset.m; draw(); });
  sl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["foucault", 1857, "use"], ["hagen", 1903, "experiment"], ["strong", 1934, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["webb"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["imaginaire", "c"], ["brillant", "a"], ["absorbe", "d"], ["uv", "b"], ["hr", "c"], ["encre", "a"], ["epaisseur", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 3351 });
})();
</script>
