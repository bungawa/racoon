<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = QuantSchro, K = Constantes, B = 2e-10;                       // site spacing of the model ring, 0,2 nm

/* ---------- a ring of N sites: the states of definite k are those a shift by one site only multiplies by a phase ---------- */
(() => {
  const svg = $("courbe"), sN = $("sN"), sK = $("sK"), sS = $("sS");
  function draw() {
    const n = +sN.value; sK.max = String(n - 1); if (+sK.value > n - 1) sK.value = String(n - 1);
    const k = +sK.value, s = +sS.value, a = S.etatAnneau(n, k), b = S.etatAnneau(n, (k + 1) % n);
    const C = a.map((u, j) => ({ re: Math.sqrt(1 - s) * u.re + Math.sqrt(s) * b[j].re, im: Math.sqrt(1 - s) * u.im + Math.sqrt(s) * b[j].im }));
    const r = S.rapportPropre(C, S.decalerAnneau(C)), kk = ((k + n / 2) % n) - n / 2;      // k folded to −n/2 … n/2
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 }, x: { domain: [-Math.PI, Math.PI], label: t("fig.x") }, y: { domain: [-2.2, 2.2], label: t("fig.y") } });
    const p = [];
    for (let i = 0; i <= 200; i++) { const x = -Math.PI + 2 * Math.PI * i / 200; p.push([o.x(x), o.y(-2 * Math.cos(x))]); }
    Plot.el("path", { d: Plot.path(p), class: "stroke thin dash c-label-2" }, o.g);
    for (let j = 0; j < n; j++) { const q = 2 * Math.PI * (((j + n / 2) % n) - n / 2) / n; Plot.el("circle", { cx: o.x(q), cy: o.y(-2 * Math.cos(q)), r: 4, class: "fill c-ok" }, o.g); }
    const q0 = 2 * Math.PI * kk / n;
    Plot.el("circle", { cx: o.x(q0), cy: o.y(-2 * Math.cos(q0)), r: 7, class: "stroke bold c-warn" }, o.g);
    $("sNr").textContent = F.num(n, 2); $("sKr").textContent = F.num(kk, 2); $("sSr").textContent = F.fix(s, 2);
    $("vf").textContent = F.num(r.phase * 180 / Math.PI, 4) + "°"; $("ff").textContent = t("fig.f.phase", { a: F.num(-360 * kk / n, 4) });
    $("ve").textContent = F.sci(Math.max(r.ecart, 1e-17), 1); $("fe").textContent = t(r.ecart < 1e-9 ? "fig.f.propre" : "fig.f.non");
    $("vp").textContent = F.si(K.hbar * q0 / B, "kg·m·s⁻¹"); $("fp").textContent = t("fig.f.p", { b: F.si(B, "m") });
  }
  sN.oninput = sK.oninput = sS.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["noether", 1918, "idea"], ["beth", 1936, "experiment"], ["wu", 1957, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cristal", "particules"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["phase", "b"], ["energie", "d"], ["m", "a"], ["sup", "c"], ["cristal", "b"], ["signe", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1703 });
})();
</script>
