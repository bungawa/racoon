      <div class="legend"><span class="c-ok" data-i18n="fig.legend.diag"></span><span class="c-warn" data-i18n="fig.legend.signe"></span></div>
      <div class="panel">
        <div class="controls">

          <div class="ctl"><div class="row"><label for="sT" data-i18n="fig.t"></label><output id="sTr" for="sT"></output></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>

<script src="/racoon/navigation.js"></script>

<script src="/racoon/quiz.js"></script>

<script src="/racoon/constantes.js"></script>

<script src="/racoon/quantique-deux-etats.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, D = Math.PI / 180;
/* R_y(θ) for spin 1/2 (rows T, columns S: a, c / b, d of (12.54)) and spin 1 (5.38) */
const ry = (s, th) => {
  if (s === "d") { const { a, b, c, d } = Q.demiRotationY(th); return [[a, c], [b, d]]; }
  return Q.spin1Y(th).map(l => l.map(z => z.re));
};
const LAB = { d: ["+", "−"], u: ["+", "0", "−"] };

/* ---------- R_y(θ) up to two turns: diagonal element and the sign after 2π ---------- */
(() => {
  const svg = $("courbe"), sT = $("sT"), spin = $("spin"), tab = $("matrice");
  let s = "d";
  function draw() {
    const th = +sT.value * D, ss = s;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 }, x: { domain: [0, 720], label: t("fig.x") }, y: { domain: [-1.05, 1.05], label: t("fig.y") } });
    const p = [];
    for (let k = 0; k <= 720; k += 3) p.push([o.x(k), o.y(ry(ss, k * D)[0][0])]);
    Plot.el("line", { x1: o.x(0), x2: o.x(720), y1: o.y(0), y2: o.y(0), class: "stroke thin c-label-2" }, o.g);
    Plot.el("line", { x1: o.x(360), x2: o.x(360), y1: o.y(-1.05), y2: o.y(1.05), class: "stroke thin dash c-warn" }, o.g);
    Plot.el("path", { d: Plot.path(p), class: "stroke bold c-ok" }, o.g);
    const R = ry(ss, th);
    Plot.el("circle", { cx: o.x(+sT.value), cy: o.y(R[0][0]), r: 5, class: "fill c-ok" }, o.g);
    $("sTr").textContent = F.num(+sT.value, 3) + "°";
    const idx = R.map((_, i) => i);
    $("vp").textContent = idx.map(i => F.fix(R[i][0] ** 2, 3)).join(" ; "); $("fp").textContent = t("fig.f.p");
    let u = 0; R.forEach((l, i) => R.forEach((m, j) => { u = Math.max(u, Math.abs(l.reduce((a, x, k) => a + x * m[k], 0) - (i === j ? 1 : 0))); }));
    $("vu").textContent = F.sci(Math.max(u, 1e-17), 1); $("fu").textContent = t("fig.f.u");
    const lab = s === "d" ? LAB.d : LAB.u, m = x => "<math><mo>" + x + "</mo></math>", nb = x => F.fix(Math.abs(x) < 5e-13 ? 0 : x, 3);
    tab.innerHTML = "<tr><th>" + t("tab.coin") + "</th>" + idx.map(j => "<th>" + m(lab[j]) + "</th>").join("") + "</tr>" +
      idx.map(i => "<tr><th>" + m(lab[i]) + "</th>" + idx.map(j => "<td>" + nb(R[i][j]) + "</td>").join("") + "</tr>").join("");
    spin.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.s === s)));
  }
  spin.querySelectorAll("button").forEach(x => x.onclick = () => { s = x.dataset.s; draw(); });
  sT.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ug", 1925, "idea"], ["wigner", 1927, "idea"], ["beth", 1936, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rmn", "particules"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tour", "a"], ["photon", "c"], ["z", "b"], ["prob", "d"], ["deux", "c"], ["unit", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1706 });
})();
</script>
