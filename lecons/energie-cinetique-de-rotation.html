<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Solide, g = Constantes.g_CPGE;

/* ---------- course de roulement sur un plan incliné, (19.8c) ---------- */
(() => {
  const LONG = 2, LANES = ["glissement", "sphere", "cylindre", "sphereCreuse", "creux", "cerceau"], svg = $("course");
  const X0 = 22, X1 = 282, H = 36, R = 10;
  svg.setAttribute("viewBox", "0 0 340 " + (LANES.length * H + 8));
  let run = null, raf = 0;
  const k = id => id === "creux" ? S.kappaCylindreCreux(+$("rho").value / 100) : S.KAPPA[id];
  const res = () => { const th = +$("theta").value * Math.PI / 180; return LANES.map(id => S.roulement(k(id), th, LONG, g)); };
  const sec = x => F.qty(F.num(x, 3), "s");
  function draw(tau) {
    const R_ = res(); svg.innerHTML = "";
    LANES.forEach((id, i) => {
      const y = 8 + i * H + 24, r = R_[i], s = Math.min(LONG, 0.5 * r.a * tau * tau), x = X0 + (X1 - X0) * s / LONG;
      Plot.el("line", { x1: X0 - R, x2: X1 + R, y1: y + R, y2: y + R, class: "stroke thin c-label-2" }, svg);
      Plot.el("line", { x1: X1, x2: X1, y1: y - R - 4, y2: y + R, class: "stroke thin dash c-label-2" }, svg);
      Plot.el("text", { x: X0 - R, y: y - R - 4 }, svg).textContent = t("co.lane", { nom: t("co.l." + id), k: F.num(r.partRotation / (1 - r.partRotation), 3) });
      if (id === "glissement") Plot.el("rect", { x: x - R, y: y - R, width: 2 * R, height: 2 * R, class: "fill c-label-2" }, svg);
      else {
        const plein = id === "sphere" || id === "cylindre", ang = s / LONG * (X1 - X0) / R;
        Plot.el("circle", { cx: x, cy: y, r: R, class: plein ? "fill c-tint" : "stroke c-tint" }, svg);
        Plot.el("line", { x1: x, y1: y, x2: x + R * Math.sin(ang), y2: y - R * Math.cos(ang), class: "stroke " + (plein ? "c-label" : "c-tint") }, svg);
      }
      if (s >= LONG) Plot.el("text", { x: X1 + R + 4, y: y + 4 }, svg).textContent = sec(r.t);
    });
    return R_;
  }
  function frame(now) {
    const tau = (now - run) / 1000, R_ = draw(tau);
    if (R_.every(r => 0.5 * r.a * tau * tau >= LONG)) { run = null; return; }
    raf = requestAnimationFrame(frame);
  }
  function upd() {
    cancelAnimationFrame(raf); run = null;
    const th = +$("theta").value, R_ = draw(0);
    $("thetav").textContent = th + "°";
    $("rhov").textContent = F.qty(F.num(+$("rho").value, 3), "%");
    $("vts").textContent = sec(R_[1].t);
    $("vtc").textContent = sec(R_[5].t);
    $("vmu").textContent = F.num(R_[5].muMin, 2);
  }
  $("go").onclick = () => { upd(); run = performance.now(); raf = requestAnimationFrame(frame); };
  $("theta").oninput = upd; $("rho").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["galilee", 1638, "experiment"], ["coriolis1829", 1829, "idea"], ["coriolis1835", 1835, "idea"], ["stephentown", 2011, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["volant"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["double", "d"], ["tabouret", "b"], ["premier", "a"], ["plomb", "c"], ["part", "b"], ["glace", "a"], ["volant", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 194 });
})();
</script>
