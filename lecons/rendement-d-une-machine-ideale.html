    <div class="eq"><math display="block"><msub><mi>W</mi><mn>13</mn></msub><mo>−</mo><msub><mi>W</mi><mn>32</mn></msub><mo>=</mo><mo stretchy="false">(</mo><msub><mi>Q</mi><mn>1</mn></msub><mo>−</mo><msub><mi>Q</mi><mn>3</mn></msub><mo stretchy="false">)</mo><mo>−</mo><mo stretchy="false">(</mo><msub><mi>Q</mi><mn>2</mn></msub><mo>−</mo><msub><mi>Q</mi><mn>3</mn></msub><mo stretchy="false">)</mo><mo>=</mo><msub><mi>Q</mi><mn>1</mn></msub><mo>−</mo><msub><mi>Q</mi><mn>2</mn></msub><mo>=</mo><msub><mi>W</mi><mn>12</mn></msub></math><span class="n">(44.8)</span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/constantes.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, Th = Thermo;
const J = v => F.si(v, "J"), signe = v => (v > 0 ? "+" : "") + J(v), pct = x => F.qty(F.fix(100 * x, 1), "%"), K = T => F.qty(F.fix(T, 0), "K");
const BOUCHAIN = 0.6222;                          // net efficiency of the Bouchain combined cycle, 2016 (Guinness World Records)

/* ---------- rendement de Carnot en fonction de T1 ---------- */
(() => {
  const svg = $("eta"), T1MAX = 2000;
  function upd() {
    let T2 = +$("t2").value, T1 = +$("t1").value;
    if (T1 <= T2 + 5) { T1 = T2 + 10; $("t1").value = T1; }
    const c = Th.carnot(T1, T2), e = Th.efficacites(T1, T2), Tmin = T2 / (1 - BOUCHAIN);
    $("t2v").innerHTML = F.kelvin(T2); $("t1v").innerHTML = F.kelvin(T1);
    $("em").textContent = pct(c.eta); $("emf").textContent = t("eta.f.moteur", { w: J(1000 * c.eta), q: J(1000 * c.q2q1) });
    $("ep").textContent = F.fix(e.pompe, 2); $("epf").textContent = t("eta.f.pompe", { w: J(1000 / e.pompe) });
    $("ef").textContent = F.fix(e.frigo, 2);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 },
      x: { domain: [0, T1MAX], label: t("eta.x") }, y: { domain: [0, 100], label: t("eta.y") } });
    const pts = [];
    for (let i = 0; i <= 300; i++) { const T = T2 + (T1MAX - T2) * i / 300; pts.push([x(T), y(100 * (1 - T2 / T))]); }
    P("path", { d: Plot.path(pts), class: "curve" }, g);
    P("line", { x1: x(0), x2: x(T1MAX), y1: y(100 * BOUCHAIN), y2: y(100 * BOUCHAIN), class: "ref" }, g);
    P("line", { x1: x(Tmin), x2: x(Tmin), y1: y(0), y2: y(100 * BOUCHAIN), class: "ref" }, g);
    P("text", { x: x(Tmin) + 6, y: y(100 * BOUCHAIN) + 16, class: "note" }, g).textContent = t("eta.note", { T: K(Tmin) });
    P("circle", { cx: x(T1), cy: y(100 * c.eta), r: 6, class: "dot" }, g);
  }
  $("t1").oninput = $("t2").oninput = upd; upd();
})();

/* ---------- trois machines, trois températures (44.8) ---------- */
(() => {
  const T1 = 800, T2 = 300, Q1 = 1000;
  const upd = () => {
    const T3 = +$("t3").value, r = Th.trois(T1, T2, T3, Q1);
    $("t3v").innerHTML = F.kelvin(T3);
    $("w13").textContent = signe(r.W13); $("w13f").textContent = t("tr.f.w13", { q: J(r.Q3) });
    $("w32").textContent = signe(r.W32); $("w32f").textContent = t(r.W32 >= 0 ? "tr.f.w32.pos" : "tr.f.w32.neg");
    $("w12").textContent = signe(r.W13 - r.W32); $("w12f").textContent = t("tr.f.w12", { q: J(r.Q2) });
  };
  $("t3").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["carnot", 1824, "idea"], ["kelvin", 1848, "idea"], ["diesel", 1893, "idea"], ["bouchain", 2016, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["centrale", "pompe"], uses = textOf("uses.items", USES);
  const fill = s => s.replace("{T}", K(300 / (1 - BOUCHAIN))).replace("{e}", F.fix(Th.efficacites(293, 273).pompe, 1));
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${fill(uses[id].text)}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["borne", "a"], ["chaud", "a"], ["froid", "a"], ["gaz", "a"], ["pompe", "a"], ["trois", "a"], ["centrale", "a"], ["zero", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
