<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
/* ---------- l'emballement : du diélectrique ordinaire au cycle d'hystérésis ---------- */
(() => {
  const svg = $("cycle"), sN = $("sN"), EM = 0.1, n = 200;
  function draw() {
    const Na = +sN.value, c = ES.cycleFerro(Na, EM, n);
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-EM, EM], label: t("cyc.x") }, y: { domain: [-3, 3], ticks: 6, label: t("cyc.y") } });
    Plot.el("line", { x1: A.x(-EM), x2: A.x(EM), y1: A.y(0), y2: A.y(0), class: "stroke thin c-label" }, A.g);
    Plot.el("line", { x1: A.x(0), x2: A.x(0), y1: A.y(-3), y2: A.y(3), class: "stroke thin c-label" }, A.g);
    const pts = (i0, i1) => c.e.slice(i0, i1).map((e, i) => [A.x(e), A.y(Math.max(-3, Math.min(3, c.p[i0 + i])))]);
    Plot.el("path", { d: Plot.path(pts(0, n + 1)), class: "stroke bold c-tint" }, A.g);
    Plot.el("path", { d: Plot.path(pts(n, 2 * n + 1)), class: "stroke c-warn" }, A.g);
    $("rN").textContent = F.num(Na, 3);
    $("vps").textContent = F.num(c.ps, 3);
    $("vec").textContent = F.num(c.ec, 2);
    $("vk").textContent = Na < 3 ? F.num(ES.clausiusMossotti(Na), 3) : "−";
    $("fk").textContent = t(Na < 3 ? "f.kappa.para" : "f.kappa.ferro");
  }
  sN.oninput = draw; draw();
})();

/* ---------- au-dessus de la température critique : la loi de Curie-Weiss ---------- */
(() => {
  const svg = $("cw"), sb = $("sb"), TC = 393;
  function draw() {
    const beta = Math.pow(10, +sb.value), k = dT => ES.curieWeiss(TC + dT, TC, beta);
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { domain: [0, 60], label: t("cw.x") }, y: { domain: [1e2, 1e8], scale: "log", label: t("cw.y") } });
    const xs = Array.from({ length: 240 }, (_, i) => 0.25 * (i + 1));
    Plot.el("path", { d: Plot.path(xs.map(x => [x, k(x).kappa]).filter(p => p[1] <= 1e8 && p[1] >= 1e2).map(p => [A.x(p[0]), A.y(p[1])])), class: "stroke bold c-tint" }, A.g);
    $("rb").textContent = F.qty(F.sci(beta, 2), "K⁻¹");
    $("vk1").textContent = F.sci(k(1).kappa, 2);
    $("vk10").textContent = F.sci(k(10).kappa, 2);
    $("fk10").textContent = t("f.k10", { n: F.num(k(10).Na, 6) });
    $("vk50").textContent = F.sci(k(50).kappa, 2);
  }
  sb.oninput = draw; draw();
  const a = 2e-10, S = ES.sommeChaine(), ac = ES.alphaCritique(a) * 1e30, O = 30.2, Ti = 2.4, moy = (O + Ti) / 2;
  $("nombres").innerHTML = t("nombres.body", { S: F.num(S, 3), ac: F.num(ac, 3), O: F.num(O, 3), Ti: F.num(Ti, 2), moy: F.num(moy, 3), manque: F.num(ac - moy, 2), ion: F.num(2 * (ac - moy), 2) });   // l'ion titane compte pour moitié dans la moyenne
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["valasek", 1920, "experiment"], ["batio3", 1944, "experiment"], ["slater", 1950, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["condensateur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["seuil", "b"], ["fini", "c"], ["temperature", "a"], ["curie", "d"], ["gaz", "b"], ["chaine", "a"], ["anti", "c"], ["cycle", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1107 });
})();
</script>
