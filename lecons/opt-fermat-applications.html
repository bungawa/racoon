<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, DEG = Math.PI / 180;

/* ---------- mirage : rayons tracés depuis l'œil, au-dessus d'une route chaude ---------- */
(() => {
  const svg = $("mirage"), dt = $("dtsl"), hs = $("hsl"), XMAX = 600, ZMAX = 3.2;
  const DEPR = Array.from({ length: 12 }, (_, k) => (0.05 + 0.05 * k) * DEG);   // dépressions des rayons, 0,05° à 0,6°
  function draw() {
    svg.innerHTML = "";
    const dT = +dt.value, h = +hs.value, m = O.route({ dT }), dc = O.depressionLimite(m, h);
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, XMAX], label: t("mi.x") }, y: { domain: [0, ZMAX], label: t("mi.y") } });
    DEPR.forEach(d => {
      const r = O.rayonStratifie(m, h, -d, { xmax: XMAX, h: 1 });
      const pts = r.x.map((xv, i) => [x(xv), y(Math.min(r.z[i], ZMAX))]);
      Plot.el("path", { d: Plot.path(pts), class: "stroke thin " + (r.sol ? "c-label-2" : "c-tint") }, g);
    });
    Plot.el("circle", { cx: x(0), cy: y(h), r: 5, class: "dot" }, g);
    $("dtread").innerHTML = t("mi.dt.read", { dt: F.qty(F.num(dT, 2), "K") });
    $("hread").textContent = F.si(h, "m", { prefix: "" });
    $("vdn").textContent = F.sci(m.n(h) - m.n(0), 3);
    if (dc === null) {
      $("vdc").textContent = "–"; $("fdc").textContent = t("mi.f.aucun"); $("vx").textContent = "–"; $("fx").textContent = t("mi.f.aucun");
      return;
    }
    $("vdc").textContent = F.qty(F.num(dc / DEG, 2), "°"); $("fdc").textContent = t("mi.f.dc", { mrad: F.si(dc, "rad", { prefix: "m", sig: 2 }) });
    const lim = O.rayonStratifie(m, h, -dc * 1.001, { xmax: 5000, h: 1 });
    $("vx").textContent = lim.sol ? F.si(lim.xSol, "m", { prefix: "", sig: 2 }) : "–";
    $("fx").textContent = t("mi.f.x", { droite: F.si(h / Math.tan(dc), "m", { prefix: "", sig: 2 }) });
  }
  dt.oninput = draw; hs.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["monge", 1798, "idea"], ["foucault", 1850, "experiment"], ["hale", 1949, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lithotripsie", "ephemerides"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["retour", "b"], ["lame", "c"], ["mirage", "a"], ["froid", "d"], ["soleil", "b"], ["ellipse", "c"], ["indices", "a"], ["eau", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 264 });
})();
</script>
