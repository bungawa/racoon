<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹";

/* ---------- le système décrit, chiffré ---------- */
$("sys").innerHTML = t("sys.body", Dyna.chiffres("piste", F));

/* ---------- un tour de piste : chemin et déplacement, vitesse et vecteur vitesse ---------- */
(() => {
  const svg = $("lap"), P = Plot.el, R = 50, C0 = [200, 160], K = 2.4, VL = 70;     // 1 m = 2,4 px
  const arrow = (x1, y1, x2, y2, cls, parent) => Plot.fleche(parent, [x1, y1], [x2, y2], { cls, tete: 10 });
  const label = (x, y, key, parent, anchor) => { const e = P("text", { x, y, "text-anchor": anchor || "middle" }, parent); e.textContent = t(key); return e; };
  const scr = p => [C0[0] + K * p[0], C0[1] - K * p[1]];
  const fsl = $("fsl"), vsl = $("vsl");
  function draw() {
    svg.innerHTML = "";
    const frac = fsl.value / 100, v = +vsl.value, r = Dyna.tour(R, v, frac), c = Cine.circle(R, v);
    P("circle", { cx: C0[0], cy: C0[1], r: K * R, class: "stroke thin dash c-label-2" }, svg);
    P("circle", { cx: C0[0], cy: C0[1], r: 3, class: "fill c-label-2" }, svg);
    const M0 = scr(c.pos(0)), M1 = scr(c.pos(r.t));
    /* the path travelled */
    if (frac >= 1) P("circle", { cx: C0[0], cy: C0[1], r: K * R, class: "stroke bold c-tint" }, svg);
    else if (frac > 0) P("path", { d: `M${M0[0].toFixed(1)} ${M0[1].toFixed(1)} A${K * R} ${K * R} 0 ${frac > 0.5 ? 1 : 0} 0 ${M1[0].toFixed(1)} ${M1[1].toFixed(1)}`, class: "stroke bold c-tint" }, svg);
    /* the displacement and its components */
    if (r.dist > 1e-9) {
      P("line", { x1: M0[0], y1: M0[1], x2: M1[0], y2: M0[1], class: "stroke thin dash c-label-2" }, svg);
      P("line", { x1: M1[0], y1: M0[1], x2: M1[0], y2: M1[1], class: "stroke thin dash c-label-2" }, svg);
      arrow(M0[0], M0[1], M1[0], M1[1], "c-warn", svg);
      label((M0[0] + M1[0]) / 2, M0[1] + 16, "lap.dx", svg); label(M1[0] + 8, (M0[1] + M1[1]) / 2, "lap.dy", svg, "start");
    }
    /* the two velocities: same length, other direction */
    [[M0, r.v0, "lap.v0"], [M1, r.v1, "lap.v1"]].forEach(([M, u, key], i) => {
      const e = [u[0] / v, -u[1] / v];
      P("circle", { cx: M[0], cy: M[1], r: 5, class: "fill c-label" }, svg);
      arrow(M[0], M[1], M[0] + VL * e[0], M[1] + VL * e[1], "c-label", svg);
      label(M[0] + VL * e[0] + 12 * e[0], M[1] + VL * e[1] + 12 * e[1] + (i ? 0 : -4), key, svg, e[0] < -0.3 ? "end" : e[0] > 0.3 ? "start" : "middle");
    });
    label(C0[0], C0[1] + 18, "lap.centre", svg);
    label(500, 40, "lap.side", svg);
    const lines = [["lap.side.t", F.si(r.t, "s", { prefix: "" })], ["lap.side.s", F.si(r.s, "m", { prefix: "" })], ["lap.side.d", F.si(r.dist, "m", { prefix: "" })]];
    lines.forEach(([k, val], i) => { const e = P("text", { x: 500, y: 76 + 26 * i, "text-anchor": "middle" }, svg); e.textContent = t(k, { x: val }); });
    $("fread").textContent = F.qty(fsl.value, "%");
    $("vread").textContent = F.qty(vsl.value, MS);
    $("vs").textContent = F.si(r.s, "m", { prefix: "" });
    $("fdr").textContent = t("lap.f.dr", { d: F.si(r.dist, "m", { prefix: "" }) });
    $("vvs").textContent = F.qty(F.num(r.vitesse, 3), MS);
    $("vvv").textContent = F.qty(F.num(r.vmoy, 3), MS);
    $("fratio").textContent = t("lap.f.ratio", { p: F.num(r.vmoy / r.vitesse * 100, 3) });
    $("vdv").textContent = F.qty(F.num(r.dv, 3), MS);
  }
  fsl.oninput = vsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["galilee", 1624, "idea"], ["hamilton", 1843, "idea"], ["gibbs", 1881, "idea"], ["wilson", 1901, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["compteur", "radar"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["compteur", "a"], ["tour", "a"], ["rondpoint", "a"], ["pluie", "a"], ["composantes", "a"], ["inegalite", "a"], ["tapis", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 92 });
})();
</script>
