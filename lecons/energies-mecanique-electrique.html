<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd;
const O = { Iw: 20, I: 1, a: 0.02, b: 0.03 };                                            // A, A, m, m

/* ---------- le cadre poussé vers le fil : qui fournit, qui reçoit ---------- */
(() => {
  const svg = $("bilan"), sx0 = $("sx0"), sx1 = $("sx1"), sv = $("sv");
  const BARS = ["op", "cadre", "fil", "champ"], X0 = 150, W = 90, GAP = 30, Y0 = 150, H = 110;
  Plot.el("line", { x1: 120, x2: 620, y1: Y0, y2: Y0, class: "stroke thin" }, svg);
  const rects = BARS.map((id, i) => {
    const x = X0 + i * (W + GAP);
    const lab = Plot.el("text", { x: x + W / 2, y: 292, "text-anchor": "middle", class: "label" }, svg); lab.textContent = t("fig.bar." + id);
    return { r: Plot.el("rect", { x, width: W, y: Y0, height: 0 }, svg), v: Plot.el("text", { x: x + W / 2, "text-anchor": "middle", class: "tick" }, svg) };
  });
  const yl = Plot.el("text", { x: 20, y: 20, class: "label" }, svg); yl.textContent = t("fig.y");
  function draw() {
    const x0 = +sx0.value / 1000, x1 = +sx1.value / 1000, v = 10 ** +sv.value;
    const r = M.bilanCadreFil(Object.assign({ x0, x1, v }, O)), vals = [r.Wop, r.Wcadre, r.Wfil, r.dUtot];
    const m = Math.max(...vals.map(Math.abs)) || 1;
    vals.forEach((w, i) => {
      const h = H * Math.abs(w) / m, up = w >= 0, b = rects[i];
      b.r.setAttribute("y", up ? Y0 - h : Y0); b.r.setAttribute("height", Math.max(h, 0.5));
      b.r.setAttribute("class", "fill " + (i === 3 ? (up ? "c-warn" : "c-tint") : (up ? "c-tint" : "c-warn")));
      b.v.setAttribute("y", up ? Y0 - h - 6 : Y0 + h + 16); b.v.textContent = F.si(w, "J");
    });
    $("sx0r").textContent = F.si(x0, "m", { prefix: "m" });
    $("sx1r").textContent = F.si(x1, "m", { prefix: "m" });
    $("svr").textContent = F.si(v, "m·s⁻¹");
    $("vw").textContent = F.si(r.Wcadre, "J");
    $("fw").innerHTML = t("fig.f.w", { u: F.si(r.dUtot, "J"), m: F.si(r.Umeca1 - r.Umeca0, "J") });
    $("vfem").textContent = F.si(Math.abs(r.fem), "V");
    $("ffem").textContent = t("fig.f.fem", { p: F.si(Math.abs(r.Psource), "W"), f: F.si(Math.abs(r.Fx), "N") });
    $("vd").textContent = F.si(r.duree, "s");
    $("fd").textContent = t("fig.f.duree");
  }
  sx0.oninput = sx1.oninput = sv.oninput = draw; draw();
})();

/* ---------- le système décrit : la source chauffe le cadre bien plus qu'elle ne nourrit le champ ---------- */
(() => {
  const rho = 1.7e-8, S = 1e-6, Lc = 2 * (O.a + O.b), R = rho * Lc / S, x0 = 0.1, x1 = 0.03, v = 0.01;
  const r = M.bilanCadreFil(Object.assign({ x0, x1, v }, O)), Q = R * O.I * O.I * r.duree;
  $("sys1").innerHTML = t("sys1.body", { a: F.si(O.a, "m", { prefix: "m" }), b: F.si(O.b, "m", { prefix: "m" }), I: F.si(O.I, "A"), Iw: F.si(O.Iw, "A"),
    x0: F.si(x0, "m", { prefix: "m" }), x1: F.si(x1, "m", { prefix: "m" }), v: F.si(v, "m·s⁻¹"), R: F.si(R, "Ω"), U: F.si(R * O.I, "V"),
    fem: F.si(Math.abs(r.fem), "V"), rap: F.sci(Math.abs(r.fem) / (R * O.I), 1), W: F.si(r.Wcadre, "J"), Q: F.si(Q, "J"), rq: F.sci(r.Wcadre / Q, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1831, "experiment"], ["lenz", 1834, "idea"], ["helmholtz", 1847, "idea"], ["kibble", 1975, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["kilogramme"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["lorentz", "c"], ["paie", "a"], ["vitesse", "d"], ["total", "b"], ["signe", "a"], ["condo", "c"], ["kibble", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 152 });
})();
</script>
