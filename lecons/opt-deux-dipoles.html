<!doctype html>
<html lang="fr">
<head>

<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-optique-ondulatoire" data-i18n="monde.optique-ondulatoire"></a><span class="aux">›</span><a href="/racoon/etape?id=opt-interferences" data-i18n="etape.opt-interferences"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-optique" href="/racoon/atlas?piste=optique" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/opt-ondes-sinusoidales" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>I</mi><mo>=</mo><msub><mi>ε</mi><mn>0</mn></msub><mi>c</mi><mo>⟨</mo><msup><mi>E</mi><mn>2</mn></msup><mo>⟩</mo></math></div>
    <p class="validite" data-i18n-html="val.intensite"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mi>δ</mi><mo>=</mo><mi>d</mi><mspace width="0.1em"/><mi data-i18n="eq.sin"></mi><mi>θ</mi></math></div>
    <p class="validite" data-i18n-html="val.marche"></p>
    <p data-i18n-html="s1.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure class="chart">
      <svg class="fig" id="polaire" viewBox="0 0 640 420" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.i"></span><span class="c-label" data-i18n="fig.legend.cercles"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" role="group" id="presets">
            <button type="button" data-p="demi" data-i18n="fig.p.demi"></button>
            <button type="button" data-p="opposition" data-i18n="fig.p.opposition"></button>
            <button type="button" data-p="quart" data-i18n="fig.p.quart"></button>
            <button type="button" data-p="dix" data-i18n="fig.p.dix"></button>
            <button type="button" data-p="six" data-i18n="fig.p.six"></button>
          </div>
          <div class="ctl"><div class="row"><label for="sd" data-i18n-html="fig.d"></label><output id="sdr" for="sd"></output></div>
            <input id="sd" type="range" min="0.05" max="10" step="0.05" value="0.5"></div>
          <div class="ctl"><div class="row"><label for="sa" data-i18n-html="fig.alpha"></label><output id="sar" for="sa"></output></div>
            <input id="sa" type="range" min="-180" max="180" step="5" value="0"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.ouest"></span><span class="v" id="vouest"></span><span class="f" id="fouest"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.nord"></span><span class="v" id="vnord"></span><span class="f" id="fnord"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.sud"></span><span class="v" id="vsud"></span><span class="f" id="fsud"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <p data-i18n-html="s3.p2"></p>
    <p data-i18n-html="s3.p3"></p>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys1"></p>

  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>

    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/opt-deux-dipoles.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/optique-ondulatoire.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const DEG = Math.PI / 180;

/* ---------- diagramme de rayonnement dans le plan horizontal : sources sur l'axe nord-sud ---------- */
(() => {
  const svg = $("polaire"), sd = $("sd"), sa = $("sa"), seg = $("presets");
  const PRESETS = { demi: [2, 0.5, 0], opposition: [2, 0.5, 180], quart: [2, 0.25, -90], dix: [2, 10, 0], six: [6, 2, 0] };
  let n = 2, preset = "demi";
  const cx = 320, cy = 210, R = 180;
  function draw() {
    const d = +sd.value, alpha = +sa.value * DEG;
    const r = OptOnd.reseau({ n, d, lambda: 1, alpha });
    svg.innerHTML = "";
    /* rings at a quarter, half, three quarters and all of n² (the maximum possible) */
    for (const f of [0.25, 0.5, 0.75, 1]) Plot.el("circle", { cx, cy, r: R * f, class: "stroke thin dash c-label" }, svg);
    Plot.el("line", { x1: cx - R - 10, x2: cx + R + 10, y1: cy, y2: cy, class: "stroke thin c-label" }, svg);
    Plot.el("line", { x1: cx, x2: cx, y1: cy - R - 10, y2: cy + R + 10, class: "stroke thin c-label" }, svg);
    const lab = (x, y, k) => { Plot.el("text", { x, y, "text-anchor": "middle", class: "label" }, svg).textContent = t(k); };
    lab(cx, cy - R - 14, "fig.n"); lab(cx, cy + R + 26, "fig.s"); lab(cx + R + 26, cy + 5, "fig.e"); lab(cx - R - 26, cy + 5, "fig.o");
    /* azimuth ψ from east, counter-clockwise; the line of the sources is north-south, so sin θ = sin ψ */
    const pts = [];
    for (let k = 0; k <= 720; k++) { const psi = k * Math.PI / 360, q = R * r.I(psi) / (n * n); pts.push([cx + q * Math.cos(psi), cy - q * Math.sin(psi)]); }
    Plot.el("path", { d: Plot.path(pts) + "Z", class: "stroke bold c-tint" }, svg);
    /* the antennas, drawn schematically along the north-south axis (not to scale) */
    for (let j = 0; j < n; j++) Plot.el("circle", { cx, cy: cy + 8 * ((n - 1) / 2 - j), r: 3.5, class: "fill c-warn" }, svg);
    $("sdr").textContent = F.qty(F.num(d, 3), "λ");
    $("sar").textContent = F.qty(F.num(+sa.value, 3), "°");
    const val = th => F.num(Math.abs(r.I(th)) < 1e-9 ? 0 : r.I(th), 3);
    $("vouest").textContent = val(0); $("fouest").textContent = t("fig.f.unite", { n2: n * n });
    $("vnord").textContent = val(90 * DEG); $("fnord").textContent = t("fig.f.phase", { p: F.qty(F.num(((r.phi(90 * DEG) / DEG) % 360 + 540) % 360 - 180, 3), "°") });
    $("vsud").textContent = val(-90 * DEG); $("fsud").textContent = t("fig.f.phase", { p: F.qty(F.num(((r.phi(-90 * DEG) / DEG) % 360 + 540) % 360 - 180, 3), "°") });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.p === preset)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => {
    preset = x.dataset.p; const [nn, d, a] = PRESETS[preset]; n = nn; sd.value = d; sa.value = a; draw();
  });
  sd.oninput = sa.oninput = () => { preset = null; draw(); };
  draw();
})();

/* ---------- le système décrit : deux mâts d'ondes moyennes vus de 30 km ---------- */
(() => {
  const f = 1e6, lambda = OptOnd.c / f, d = 150, R = 30e3;
  const e = OptOnd.champExact({ n: 2, d, lambda, R, theta: 30 * DEG });
  $("sys1").innerHTML = t("sys1.body", { f: F.si(f, "Hz", { prefix: "M" }), lambda: F.si(lambda, "m"), d: F.si(d, "m"), R: F.si(R, "m", { prefix: "k" }),
    dl: F.num(d / lambda, 3), Rl: F.num(R / lambda, 2), fres: F.sci(d ** 3 / (8 * lambda * R * R), 1), dR: F.num(d / R, 2), ecart: F.sci(100 * Math.abs(e.ecart), 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["braun", 1905, "experiment"], ["wfla", 1932, "experiment"], ["brown", 1937, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ondesmoyennes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["quatre", "c"], ["ligne", "a"], ["inverser", "d"], ["cardioide", "b"], ["dix", "c"], ["moyenne", "a"], ["loin", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 294 });
})();
</script>
</body>
</html>
