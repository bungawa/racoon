<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les petites distances</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-mesurer" data-i18n="monde.mesurer"></a><span class="aux">›</span><a href="/racoon/etape?id=les-distances" data-i18n="etape.les-distances"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/grandes-distances" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq">
      <math display="block"><msub><mi>d</mi><mi data-i18n="sub.min"></mi></msub><mo>=</mo><mfrac><mi>λ</mi><mrow><mn>2</mn><mi>n</mi><mspace width="0.15em"></mspace><mi data-i18n="fn.sin"></mi><mi>α</mi></mrow></mfrac></math>
      
    </div>
    <p class="validite" data-i18n="eq1.validite"></p>
    <figure class="chart">
      <svg id="reschart" role="img" data-i18n-attr="aria-label:res.aria"></svg>
      <div class="panel">
        <div class="seg" id="probe" role="group" data-i18n-attr="aria-label:res.probe"></div>
        <div class="ctl"><div class="row"><label for="lsl" data-i18n="res.lambda"></label><output id="lread" for="lsl"></output></div>
          <input id="lsl" type="range" min="-12" max="-5.5" step="0.01" value="-6.26"></div>
        <div class="ctl"><div class="row"><label for="nasl" data-i18n="res.na"></label><output id="naread" for="nasl"></output></div>
          <input id="nasl" type="range" min="0.005" max="1.4" step="0.005" value="1.4"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="res.k.d"></span><span class="v" id="rd"></span><span class="f" id="rf"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="res.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="s1.rem.title"></b>
      <p data-i18n-html="s1.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq">
      <math display="block"><mn>2</mn><mi>d</mi><mspace width="0.15em"></mspace><mi data-i18n="fn.sin"></mi><mi>θ</mi><mo>=</mo><mi>p</mi><mspace width="0.1em"></mspace><mi>λ</mi></math>
      
    </div>
    <p class="validite" data-i18n="eq2.validite"></p>
    <figure>
      <svg class="fig" id="crystal" viewBox="0 0 640 260" role="img" data-i18n-attr="aria-label:bragg.aria"></svg>
      <div class="legend"><span class="el-n" data-i18n="bragg.legend.na"></span><span class="el-c" data-i18n="bragg.legend.cl"></span></div>
      <div class="chart"><svg id="braggchart" role="img" data-i18n-attr="aria-label:bragg.chart"></svg></div>
      <div class="panel">
        <div class="seg" id="anode" role="group" data-i18n-attr="aria-label:bragg.source"></div>
        <div class="ctl"><div class="row"><label for="thsl" data-i18n="bragg.theta"></label><output id="thread" for="thsl"></output></div>
          <input id="thsl" type="range" min="3" max="87" step="0.05" value="12"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="bragg.k.path"></span><span class="v" id="bp"></span><span class="f" id="bf"></span></div>
          <div class="stat"><span class="k" data-i18n="bragg.k.int"></span><span class="v" id="bi"></span><div class="meter"><i id="bm"></i></div></div>
        </div>
      </div>
      <figcaption data-i18n-html="bragg.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq">
      <math display="block"><mfrac><mrow><msub><mi>N</mi><mn>1</mn></msub><mo>−</mo><msub><mi>N</mi><mn>2</mn></msub></mrow><msub><mi>N</mi><mn>1</mn></msub></mfrac><mo>≈</mo><mi>n</mi><mspace width="0.1em"></mspace><mi>σ</mi><mspace width="0.1em"></mspace><mi>e</mi><mspace width="1.5em"></mspace><mi>σ</mi><mo>=</mo><mi>π</mi><msup><mi>r</mi><mn>2</mn></msup></math>
      
    </div>
    <p class="validite" data-i18n="eq3.validite"></p>
    <figure class="chart">
      <svg id="slabchart" role="img" data-i18n-attr="aria-label:slab.aria"></svg>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="esl" data-i18n="slab.e"></label><output id="eread" for="esl"></output></div>
          <input id="esl" type="range" min="-4" max="1" step="0.01" value="-2"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="slab.k.thin"></span><span class="v" id="st"></span></div>
          <div class="stat"><span class="k" data-i18n="slab.k.exact"></span><span class="v" id="sx"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="slab.caption"></figcaption>
    </figure>
    <p data-i18n="nuclei.intro"></p>
    <div class="list keyed" id="nuclei"></div>
    <div class="box rem"><b data-i18n="s3.rem.title"></b>
      <p data-i18n-html="s3.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/petites-distances.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/petites-distances.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const DEG = Math.PI / 180;
const segOf = (el, items, names, pick, start) => {
  el.innerHTML = items.map(() => '<button type="button"></button>').join("");
  [...el.children].forEach((b, i) => { b.textContent = names[items[i][0]];
    b.onclick = () => { [...el.children].forEach(x => x.setAttribute("aria-pressed", x === b)); pick(items[i]); }; });
  el.children[start].setAttribute("aria-pressed", "true");
};

/* ---------- §5-7 : limite de diffraction ---------- */
(() => {
  /* probe presets: [id, λ (m), numerical aperture]. Electron lenses are poor: NA ≈ 0,02 even when corrected. */
  const PROBES = [["vert", 550e-9, 1.4], ["uv", 250e-9, 1.2], ["rx", 2.4e-9, 0.05], ["e300", Petit.electronWavelength(3e5), 0.02]];
  const OBJECTS = [["bacterie", 1e-6], ["virus", 1e-7], ["proteine", 5e-9], ["atomes", 2e-10]];
  const objs = textOf("res.objects", OBJECTS.map(o => o[0]));
  const lsl = $("lsl"), nasl = $("nasl");
  segOf($("probe"), PROBES, textOf("res.probes", PROBES.map(p => p[0])), ([, l, na]) => { lsl.value = Math.log10(l); nasl.value = na; upd(); }, 0);
  const { x, y, g } = Plot.axes($("reschart"), { fmt: F, w: 640, h: 300, pad: { b: 44 },
    x: { scale: "log", domain: [1e-12, 1e-5], label: t("res.x") }, y: { scale: "log", domain: [1e-12, 1e-4], label: t("res.y") } });
  OBJECTS.forEach(([id, s]) => { Plot.el("line", { x1: x(1e-12), x2: x(1e-5), y1: y(s), y2: y(s), class: "ref" }, g);
    Plot.el("text", { x: x(1e-12) + 6, y: y(s) - 5, class: "note" }, g).textContent = objs[id]; });
  const curve = Plot.el("path", { class: "curve" }, g), dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  function upd() {
    const l = Math.pow(10, +lsl.value), na = +nasl.value, d = Petit.abbe(l, na);
    $("lread").textContent = F.si(l, "m"); $("naread").textContent = F.fix(na, 3);
    $("rd").textContent = F.si(d, "m");
    const seen = OBJECTS.filter(o => o[1] >= d);
    $("rf").textContent = seen.length ? t("res.seen", { what: objs[seen[seen.length - 1][0]] }) : t("res.none");
    curve.setAttribute("d", "M" + x(1e-12) + " " + y(Petit.abbe(1e-12, na)) + "L" + x(1e-5) + " " + y(Math.min(Petit.abbe(1e-5, na), 1e-4)));
    dot.setAttribute("cx", x(l)); dot.setAttribute("cy", y(Math.min(Math.max(d, 1e-12), 1e-4)));
  }
  lsl.oninput = nasl.oninput = upd; upd();
})();

/* ---------- §5-7 : diffraction des rayons X, loi de Bragg ---------- */
(() => {
  const D = 282e-12, NPL = 12;                                 // NaCl (200) planes, as in Bragg's 1913 work; 12 planes drawn into the sum
  const SOURCES = [["cu", 154.06e-12], ["mo", 71.07e-12]];
  let lam = SOURCES[0][1];
  const thsl = $("thsl");
  segOf($("anode"), SOURCES, textOf("bragg.sources", SOURCES.map(s => s[0])), s => { lam = s[1]; draw(); upd(); }, 0);

  /* crystal sketch: planes of atoms, an incident and a reflected ray at the glancing angle θ */
  const svg = $("crystal"), X0 = 320, Y0 = 70, DY = 46;
  for (let k = 0; k < 4; k++) for (let i = 0; i < 13; i++)
    Plot.el("circle", { cx: 32 + i * 48, cy: Y0 + k * DY, r: 6, class: "fill " + ((i + k) % 2 ? "el-c" : "el-n") }, svg);
  const rays = [0, 1].map(k => [Plot.el("line", { class: "stroke c-tint" }, svg), Plot.el("line", { class: "stroke c-tint" }, svg)]);
  const extra = Plot.el("path", { class: "stroke bold c-warn" }, svg);
  Plot.el("text", { x: 620, y: Y0 + DY / 2 + 4, "text-anchor": "end" }, svg).textContent = t("bragg.lab.d");
  const lab = Plot.el("text", { x: 20, y: 250 }, svg);

  const { x, y, g } = Plot.axes($("braggchart"), { fmt: F, w: 640, h: 220, pad: { b: 40 },
    x: { domain: [0, 90], label: t("bragg.x") }, y: { domain: [0, 1], label: t("bragg.y") } });
  const curve = Plot.el("path", { class: "curve" }, g), dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  function draw() {
    let d = "";
    for (let i = 0; i <= 1800; i++) { const a = 3 + 84 * i / 1800; d += (d ? "L" : "M") + x(a).toFixed(1) + " " + y(Petit.braggIntensity(D, lam, a * DEG, NPL)).toFixed(1); }
    curve.setAttribute("d", d);
  }
  function upd() {
    const th = +thsl.value * DEG, r = Petit.pathRatio(D, lam, th), I0 = Petit.braggIntensity(D, lam, th, NPL);
    $("thread").textContent = F.fix(+thsl.value, 2) + "°";
    $("bp").textContent = t("bragg.ratio", { r: F.fix(r, 2) });
    const n = Math.round(r);
    $("bf").textContent = n >= 1 && Math.abs(r - n) < 0.03 ? t("bragg.inphase", { n }) : t("bragg.outphase");
    $("bi").textContent = F.qty(F.fix(100 * I0, 0), "%");
    $("bm").style.width = (100 * I0).toFixed(1) + "%";
    dot.setAttribute("cx", x(+thsl.value)); dot.setAttribute("cy", y(I0));
    const L = 300, c = Math.cos(th), s = Math.sin(th);
    rays.forEach(([inc, out], k) => { const py = Y0 + k * DY, px = X0;
      inc.setAttribute("x1", px - L * c); inc.setAttribute("y1", py - L * s); inc.setAttribute("x2", px); inc.setAttribute("y2", py);
      out.setAttribute("x1", px); out.setAttribute("y1", py); out.setAttribute("x2", px + L * c); out.setAttribute("y2", py - L * s); });
    /* the extra path of the lower ray: from the foot of the perpendiculars to the lower plane and back (2 d sin θ) */
    const px = X0, py = Y0 + DY, a = DY * s;
    extra.setAttribute("d", `M${px - a * c} ${py - a * s}L${px} ${py}L${px + a * c} ${py - a * s}`);
    lab.textContent = t("bragg.lab.extra");
  }
  thsl.oninput = upd; draw(); upd();
})();

/* ---------- §5-7 : section efficace d'un noyau ---------- */
(() => {
  const n = Petit.numberDensity(2.2e3, 12.011e-3), sigma = Petit.geometric(Petit.nuclearRadius(12));   // graphite, carbon-12
  const esl = $("esl");
  const { x, y, g } = Plot.axes($("slabchart"), { fmt: F, w: 640, h: 260, pad: { b: 44 },
    x: { scale: "log", domain: [1e-4, 10], label: t("slab.x") }, y: { domain: [0, 1], label: t("slab.y") } });
  let thin = "", exact = "";
  for (let i = 0; i <= 200; i++) { const e = Math.pow(10, -4 + 5 * i / 200);
    thin += (thin ? "L" : "M") + x(e).toFixed(1) + " " + y(Math.min(Petit.blockedThin(n, sigma, e), 1)).toFixed(1);
    exact += (exact ? "L" : "M") + x(e).toFixed(1) + " " + y(Petit.blocked(n, sigma, e)).toFixed(1); }
  Plot.el("path", { d: thin, class: "ref" }, g); Plot.el("path", { d: exact, class: "curve" }, g);
  Plot.el("text", { x: x(0.05), y: y(0.9), class: "note" }, g).textContent = t("slab.lab.thin");
  Plot.el("text", { x: x(1.2), y: y(0.55), class: "note" }, g).textContent = t("slab.lab.exact");
  const dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  const upd = () => {
    const e = Math.pow(10, +esl.value), b = Petit.blocked(n, sigma, e);
    $("eread").textContent = F.si(e, "m");
    $("st").textContent = F.qty(F.num(100 * Petit.blockedThin(n, sigma, e), 3), "%");
    $("sx").textContent = F.qty(F.num(100 * b, 3), "%");
    dot.setAttribute("cx", x(e)); dot.setAttribute("cy", y(b));
  };
  esl.oninput = upd; upd();

  const NUC = [["h", 1], ["c", 12], ["fe", 56], ["au", 197], ["u", 238]], names = textOf("nuclei.names", NUC.map(z => z[0]));
  $("nuclei").innerHTML = NUC.map(([id, A]) => `<div><span class="k">${F.qty(F.sci(Petit.nuclearRadius(A), 2), "m")}</span><span>${t("nuclei.row", { name: names[id], A })}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["abbe", 1873, "idea"], ["rontgen", 1895, "experiment"], ["rutherford", 1911, "experiment"], ["laue", 1912, "experiment"], ["bragg", 1913, "experiment"],
    ["ruska", 1931, "experiment"], ["hofstadter", 1956, "experiment"], ["cryo", 2017, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["esrf", "euv", "cryo", "pdb"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["blue", "b"], ["electron", "a"], ["lens", "c"], ["bragg", "a"], ["light", "d"], ["chem", "a"], ["thick", "b"], ["empty", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 7 });
})();
</script>
</body>
</html>
