<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- trois équations pour un même pendule ---------- */
(() => {
  const O = self.Ondes, MODELES = ["lineaire", "sinus", "quadratique"], txt = textOf("modeles.items", MODELES);
  keyed($("modeles"), t("modeles.tag"), MODELES, txt);
  /* pendule de période propre 1 s, Q = 5, forcé à 0,8 Hz ; a = 1 donne une amplitude de 0,03 rad */
  const W0 = 2 * Math.PI, Q = 5, W = 0.8 * W0, F1 = 0.01 * W0 * W0, KAPPA = 0.2, D = 20, N = 2000;
  const f1 = tt => F1 * Math.cos(W * tt);
  let modele = 0;
  $("choix").innerHTML = MODELES.map((id, i) => `<button type="button" data-i="${i}" aria-pressed="${i === 0}">${txt[id].name}</button>`).join("");
  function upd() {
    const a = 10 ** +$("fa").value, o = { w0: W0, Q, modele: MODELES[modele], kappa: KAPPA };
    [...$("choix").children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === modele)));
    const E = O.ecartLinearite(o, f1, null, a, 0, D, N), x1 = E.r1.x, xa = E.r12.x.map(x => x / a);
    const ymax = 1.15 * Math.max(...x1.map(Math.abs), ...xa.map(Math.abs));
    const svg = $("trace"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 60, b: 44 }, x: { domain: [0, D], label: t("li.xaxis") }, y: { domain: [-ymax, ymax], label: t("li.yaxis") } });
    const pts = xs => Plot.path(xs.map((x, j) => [P.x(E.r1.t[j]), P.y(x)]));
    Plot.el("path", { d: pts(x1), class: "curve" }, P.g);
    Plot.el("path", { d: pts(xa), class: "stroke c-warn dash" }, P.g);
    const amp = Math.max(...E.r12.x.map(Math.abs)), vmax = Math.max(...E.r12.v.map(Math.abs));
    $("fav").textContent = F.num(a, 2);
    $("ve").textContent = F.qty(F.num(100 * E.ecart, 2), "%"); $("fe").textContent = t("li.f.ecart");
    $("vamp").textContent = F.qty(F.num(amp, 2), "rad"); $("famp").textContent = t("li.f.amp", { deg: F.qty(F.num(amp * 180 / Math.PI, 2), "°") });
    const nb = modele === 1 ? amp * amp / 6 : modele === 2 ? KAPPA * vmax / (W0 / Q) : 0;
    $("vn").textContent = modele === 0 ? "0" : F.num(nb, 2); $("fn").textContent = t("li.f.n." + MODELES[modele]);
  }
  $("fa").oninput = upd; $("choix").onclick = e => { const b = e.target.closest("button"); if (b) { modele = +b.dataset.i; upd(); } };
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["euler", 1743, "idea"], ["lagrange", 1766, "idea"], ["spice", 1973, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["petitsignal", "automatique"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["definition", "c"], ["affine", "b"], ["pendule", "a"], ["general", "d"], ["transitoire", "b"], ["force", "c"], ["test", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 251 });
})();
</script>
