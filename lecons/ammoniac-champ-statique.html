<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, A = Q.aDepuisFrequence(23.87e9), MU = 1.47e-21 / K.c, D = 1e-3, M = 17 * K.u, UE = 1e-6 * K.e;

/* ---------- the two levels against the field between plates 1 mm apart ---------- */
(() => {
  const svg = $("fig"), su = $("su"), N = 200, EMAX = 5e6, YMAX = 4.5 * A / UE;
  function draw() {
    const champ = +su.value / D, ex = Q.niveauxChamp(0, A, MU, champ), ap = Q.niveauxChampFaible(0, A, MU, champ);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, x: { domain: [0, EMAX / 1e6], label: t("fig.x"), fmt: v => F.num(v, 0) },
      y: { domain: [-YMAX, YMAX], label: t("fig.y"), fmt: v => F.num(v, 0) } });
    const courbe = (f, cls, sty) => { const pts = Array.from({ length: N + 1 }, (_, k) => { const e = EMAX * k / N; return [x(e / 1e6), y(Math.max(-YMAX, Math.min(YMAX, f(e) / UE)))]; });
      Plot.el("path", { d: Plot.path(pts), class: sty }, Plot.el("g", { class: cls }, g)); };
    for (const s of [1, -1]) {
      courbe(e => s * (Q.niveauxChamp(0, A, MU, e).EI), "c-tint", "stroke bold");
      courbe(e => s * (Q.niveauxChampFaible(0, A, MU, e).EI), "c-warn", "stroke dash");
      courbe(e => s * MU * e, "c-label-2", "stroke thin dash");
    }
    Plot.el("line", { x1: x(champ / 1e6), x2: x(champ / 1e6), y1: y(-YMAX), y2: y(YMAX), class: "stroke thin dash" }, Plot.el("g", { class: "c-label-2" }, g));
    const dEx = ex.EI - A, dAp = ap.EI - A, grad = champ * champ / D, acc = Q.forceFaisceau(MU, A, grad) / M;
    $("sur").textContent = F.si(+su.value, "V");
    $("vecart").textContent = F.si((ex.EI - ex.EII) / K.e, "eV", { prefix: "µ" });
    $("fecart").textContent = t("fig.f.ecart", { E: F.si(champ, "V·m⁻¹"), nu: F.num((ex.EI - ex.EII) / K.h / 1e9, 3), r: F.num(MU * champ / A, 2) });
    $("vquad").textContent = champ ? F.num(100 * (dAp - dEx) / dEx, 1) + " %" : "—";
    $("fquad").textContent = t(MU * champ < 0.3 * A ? "fig.f.quad.bon" : "fig.f.quad.mauvais");
    $("vacc").textContent = F.si(acc, "m·s⁻²");
    $("facc").textContent = t("fig.f.acc", { g: F.num(acc / K.g0, 0) });
  }
  su.oninput = draw; draw();
})();

/* ---------- the system described: the polarizability and the scale of the field ---------- */
(() => {
  $("sys").innerHTML = t("sys.body", { mu: F.qty(F.sci(MU, 3), "C·m"), A: F.si(A / K.e, "eV", { prefix: "µ" }), ec: F.si(A / MU, "V·m⁻¹"),
    alpha: F.qty(F.sci(MU * MU / A, 2), "C·m²·V⁻¹"), v: F.si(Math.sqrt(3 * K.k_B * 300 / M), "m·s⁻¹") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["stark", 1913, "experiment"], ["nobel", 1919, "idea"], ["maser", 1953, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ralentir"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["diag", "b"], ["fort", "d"], ["faible", "a"], ["quad", "c"], ["force", "b"], ["tri", "a"], ["polar", "d"], ["deux", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 922 });
})();
</script>
