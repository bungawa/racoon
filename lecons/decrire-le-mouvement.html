<script src="/racoon/i18n.js"></script>

<script src="/racoon/quiz.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const sec = v => F.qty(F.num(v, 3), "s"), met = v => F.qty(F.num(v, 4), "m");

/* ---------- §8-1 : tables et graphe x(t), curseur de temps ---------- */
(() => {
  const svg = $("xt"), sl = $("tsl");
  const MODES = {
    car: { tab: Cine.CAR, law: null, ymax: 1200, cap: "xt.cap.car" },
    ball: { tab: Cine.BALL, law: Cine.fall, ymax: 50, cap: "xt.cap.ball" },
  };
  let mode = "car", ax, cur, dot, hline;
  function draw() {
    const m = MODES[mode], T = m.tab.t[m.tab.t.length - 1];
    svg.textContent = "";
    ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [0, T], label: t("xt.x") }, y: { domain: [0, m.ymax], label: t("xt.y") } });
    const { x, y, g } = ax;
    if (m.law) {                       // the law, known everywhere
      let d = ""; for (let i = 0; i <= 200; i++) { const s = T * i / 200; d += (i ? "L" : "M") + x(s).toFixed(1) + " " + y(m.law(s)).toFixed(1); }
      Plot.el("path", { d, class: "curve" }, g);
    } else {                           // the table only: straight segments are a guess
      Plot.el("path", { d: m.tab.t.map((s, i) => (i ? "L" : "M") + x(s).toFixed(1) + " " + y(m.tab.x[i]).toFixed(1)).join(""), class: "ref" }, g);
    }
    m.tab.t.forEach((s, i) => Plot.el("circle", { cx: x(s), cy: y(m.tab.x[i]), r: 4, class: "dot" }, g));
    cur = Plot.el("line", { y1: y(0), y2: y(m.ymax), class: "zero" }, g);
    hline = Plot.el("line", { x1: x(0), class: "zero" }, g);
    dot = Plot.el("circle", { r: 7, class: "dot" }, g);
    $("xtcap").textContent = t(m.cap);
    $("tab").innerHTML = `<div role="row"><span role="columnheader">${t("tab.t")}</span><span class="v" role="columnheader">${t("tab.x")}</span></div>` +
      m.tab.t.map((s, i) => `<div role="row" data-i="${i}"><span role="cell">${sec(s)}</span><span class="v" role="cell">${met(m.tab.x[i])}</span></div>`).join("");
    upd();
  }
  function upd() {
    const m = MODES[mode], ts = m.tab.t, xs = m.tab.x, T = ts[ts.length - 1], s = sl.value / 1000 * T;
    const pos = m.law ? m.law(s) : Cine.interp(ts, xs, s);
    let i = 0; while (i < ts.length - 2 && ts[i + 1] <= s) i++;
    const { x, y } = ax;
    cur.setAttribute("x1", x(s)); cur.setAttribute("x2", x(s));
    hline.setAttribute("x2", x(s)); hline.setAttribute("y1", y(pos)); hline.setAttribute("y2", y(pos));
    dot.setAttribute("cx", x(s)); dot.setAttribute("cy", y(pos));
    $("tread").textContent = sec(s);
    $("xread").textContent = met(pos);
    $("xsrc").textContent = t(m.law ? "xt.f.law" : "xt.f.interp");
    $("rowread").textContent = t("xt.v.row", { a: sec(ts[i]), b: sec(ts[i + 1]) });
    $("dxread").textContent = met(xs[i + 1] - xs[i]);
    document.querySelectorAll("#tab [data-i]").forEach(r => r.classList.toggle("done", +r.dataset.i > i + 1));
  }
  const pick = k => { mode = k; $("m-car").setAttribute("aria-pressed", k === "car"); $("m-ball").setAttribute("aria-pressed", k === "ball"); draw(); };
  $("m-car").onclick = () => pick("car"); $("m-ball").onclick = () => pick("ball");
  sl.oninput = upd;
  /* drag the cursor on the graph itself */
  const fromPointer = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(svg.getScreenCTM().inverse()), T = MODES[mode].tab.t.at(-1);
    sl.value = Math.round(Math.min(1, Math.max(0, ax.x.inv(q.x) / T)) * 1000); upd(); };
  svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); fromPointer(e); });
  svg.addEventListener("pointermove", e => { if (svg.hasPointerCapture(e.pointerId)) fromPointer(e); });
  draw();
})();

/* ---------- Zénon : somme d'une infinité de durées ---------- */
(() => {
  const sl = $("nsl");
  const upd = () => { const z = Cine.zeno(90, 10, 1, +sl.value);
    $("nread").textContent = sl.value;
    $("ztime").textContent = F.qty(F.fix(z.time, Math.min(+sl.value + 1, 12)), "s");
    $("zgap").textContent = F.qty(z.gap < 1e-3 ? F.sci(z.gap, 2) : F.num(z.gap, 3), "m"); };
  sl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["zenon", -450, "idea"], ["oresme", 1350, "idea"], ["descartes", 1637, "idea"], ["galilee", 1638, "experiment"],
    ["muybridge", 1878, "experiment"], ["marey", 1882, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gnss", "video", "odo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["feu", "a"], ["courbe", "a"], ["entre", "a"], ["valise", "a"], ["impairs", "b"], ["achille", "a"], ["origine", "a"], ["point", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 81 });
})();
</script>
