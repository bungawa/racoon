<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OndesMilieux, DEG = Math.PI / 180;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- le graphe de l'aveugle : spectre reçu à l'angle θ de l'arc primaire, longueur d'onde par longueur d'onde ---------- */
(() => {
  const L = Array.from({ length: 61 }, (_, i) => (400 + 5 * i) * 1e-9);
  const P = L.map(l => O.profilArc(O.indiceEau(l), { N: 8000 }));        // un profil par longueur d'onde, calculé une fois
  const spectre = th => L.map((_, j) => P[j].at(th));
  const REF = [40, 41, 42].map(a => spectre(a * DEG));
  const ymax = 1.1 * Math.max(...REF.flat(), ...spectre(40.65 * DEG));
  function draw() {
    const a = +$("ath").value, S = spectre(a * DEG), svg = $("spectre");
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 }, x: { domain: [400, 700], label: t("arc.xaxis") }, y: { domain: [0, ymax], label: t("arc.yaxis"), fmt: () => "" } });
    REF.forEach((R, k) => {
      Plot.el("path", { d: Plot.path(L.map((l, j) => [A.x(l * 1e9), A.y(R[j])])), class: "stroke thin c-label-2 dash" }, A.g);
      const j = R.indexOf(Math.max(...R));
      Plot.el("text", { x: A.x(L[j] * 1e9) + 4, y: A.y(R[j]) - 6 }, A.g).textContent = F.num(40 + k, 2) + " °";
    });
    Plot.el("path", { d: Plot.path(L.map((l, j) => [A.x(l * 1e9), A.y(S[j])])), class: "curve" }, A.g);
    let k = 0; S.forEach((v, j) => { if (v > S[k]) k = j; });
    if (S[k] > 0) Plot.el("circle", { cx: A.x(L[k] * 1e9), cy: A.y(S[k]), r: 5, class: "dot" }, A.g);
    $("athv").textContent = F.num(a, 4) + " °";
    $("vpic").textContent = S[k] > 0 ? F.si(L[k], "m", { prefix: "n" }) : t("arc.rien");
    $("fpic").textContent = S[k] > 0 ? t("arc.f.pic") : t("arc.f.rien");
    const ab = O.arcPrimaire(O.indiceEau(450e-9)), ar = O.arcPrimaire(O.indiceEau(650e-9));
    $("vbleu").textContent = F.num(ab.theta / DEG, 3) + " °"; $("fbleu").textContent = t("arc.f.n", { n: F.num(O.indiceEau(450e-9), 5) });
    $("vrouge").textContent = F.num(ar.theta / DEG, 3) + " °"; $("frouge").textContent = t("arc.f.n", { n: F.num(O.indiceEau(650e-9), 5) });
  }
  $("ath").oninput = draw; draw();
})();

/* ---------- le système décrit : une goutte de pluie de 0,5 mm sous le Soleil ---------- */
(() => {
  const a = 0.5e-3, lam = 550e-9, sol = 0.53 * DEG, ecart = O.arcPrimaire(O.indiceEau(650e-9)).theta - O.arcPrimaire(O.indiceEau(450e-9)).theta;
  $("sys1").innerHTML = t("sys1.body", { a: F.si(a, "m", { prefix: "m" }), l: F.si(lam, "m", { prefix: "n" }), r: F.num(a / lam, 2), airy: F.num(Math.pow(lam / a, 2 / 3) / DEG, 2), sol: F.num(sol / DEG, 2), ecart: F.num(ecart / DEG, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["descartes", 1637, "idea"], ["maxwell", 1861, "idea"], ["michelson", 1887, "experiment"], ["einstein", 1905, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["thermique"], items = textOf("uses.items", USES);
  items.thermique = Object.assign({}, items.thermique, { text: items.thermique.text.replace("{l}", F.si(O.wien(310), "m", { prefix: "µ" })) });
  keyed($("uses"), t("uses.tag"), USES, items);
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["six", "c"], ["ether", "a"], ["camisole", "d"], ["rouge", "b"], ["angle", "a"], ["soleil", "c"], ["symetrie", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 203 });
})();
</script>
