<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, K = Constantes, c = K.c, me = K.m_e, qe = K.e;

/* ---------- un électron dans un champ uniforme : p = Ft, v plafonne à c ---------- */
(() => {
  const trace = $("trace"), sE = $("sE"), st = $("st"), TMAX = 10;              // time axis in ns
  function draw() {
    const E = 1e6 * Math.pow(10, +sE.value), Fo = qe * E, tn = +st.value, ts = tn * 1e-9;
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 52, b: 44 }, x: { domain: [0, TMAX], label: t("fig.xaxis") }, y: { domain: [0, 2], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(TMAX), y1: P.y(1), y2: P.y(1), class: "zero" }, P.g);
    const ns = Array.from({ length: 201 }, (_, i) => i * TMAX / 200);
    const rel = ns.map(x => [P.x(x), P.y(R.forceConstante(me, Fo, x * 1e-9).v / c)]);
    const tN = Math.min(TMAX, 2 * me * c / Fo * 1e9);                           // Newton reaches 2c at this time
    Plot.el("path", { d: Plot.path([[P.x(0), P.y(0)], [P.x(tN), P.y(R.forceConstante(me, Fo, tN * 1e-9).vNewton / c)]]), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(rel), class: "curve" }, P.g);
    const s = R.forceConstante(me, Fo, ts), b = s.v / c;
    Plot.el("circle", { cx: P.x(tn), cy: P.y(b), r: 5, class: "dot" }, P.g);
    $("sEr").textContent = F.si(E, "V·m⁻¹");
    $("str").textContent = F.qty(F.num(tn, 3), "ns");
    $("vv").textContent = F.num(b, b > 0.999 ? 6 : 3);
    $("fv").textContent = ts > 0 ? t("fig.f.v", { d: F.sci(1 - b, 2) }) : "";
    $("vg").textContent = F.num(s.gamma, 4);
    $("fg").textContent = t("fig.f.g", { p: F.num(s.p / (me * c), 3) });
    $("vn").textContent = F.num(s.vNewton / c, 3);
    $("fn").textContent = t("fig.f.n");
    $("vx").textContent = F.si(s.x, "m");
    $("fx").textContent = t("fig.f.x", { ct: F.si(c * ts, "m"), xn: F.si(s.xNewton, "m") });
  }
  sE.oninput = st.oninput = draw; draw();
})();

/* ---------- le système décrit : un électron dans 1 MV/m ---------- */
(() => {
  const E = 1e6, Fo = qe * E, tc = me * c / Fo, r = R.rayonnementLineaire(qe, me, Fo, c);
  $("sys1").innerHTML = t("sys1.body", { E: F.si(E, "V·m⁻¹"), F: F.qty(F.sci(Fo, 2), "N"), tc: F.si(tc, "s"),
    rad: F.sci(r.fraction, 1), g: F.sci(me * K.g0 / Fo, 1) });
})();

/* ---------- l'inertie près de c : les protons du LHC ---------- */
(() => {
  const T = 6.8e12 * qe - K.m_p * c * c, rho = 2803.95, S = R.depuisCinetique(K.m_p, T);   // 6,8 TeV: the total energy of a beam proton
  const B = R.champCourbure(S.p, qe, rho), BN = K.m_p * c / (qe * rho);
  $("lhc").innerHTML = t("s3.lhc", { T: F.qty("6,8", "TeV"), rho: F.si(rho, "m", { sig: 6, prefix: "" }), g: F.num(S.gamma, 4),
    d: F.si(c * S.unMoinsBeta, "m·s⁻¹"), omb: F.sci(S.unMoinsBeta, 2), B: F.si(B, "T"), BN: F.si(BN, "T", { prefix: "m" }),
    k: F.num(B / BN, 4), avance: F.si(R.avanceLumiere(S.gamma, 1000), "m") });
})();

/* ---------- le gaz chauffé : une mole d'hélium, 100 K de plus ---------- */
(() => {
  const M = 4.002602e-3, dT = 100, T0 = 300, dE = 1.5 * K.R * dT, dm = dE / (c * c);
  const vq = Math.sqrt(3 * K.R * T0 / M);
  $("gaz").innerHTML = t("s4.gaz", { M: F.si(M * 1000, "g", { sig: 2, prefix: "" }), dT: F.qty("100", "K"), dE: F.si(dE, "J", { sig: 4 }),
    dm: F.si(dm * 1000, "g", { sig: 2 }), frac: F.sci(dm / M, 2), T0: F.kelvin(T0), vq: F.si(vq, "m·s⁻¹"), b2: F.sci((vq / c) ** 2, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kaufmann", 1901, "experiment"], ["planck", 1906, "idea"], ["bucherer", 1908, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lhc"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["constante", "b"], ["double", "c"], ["aimant", "a"], ["avion", "d"], ["gaz", "a"], ["loi", "c"], ["chiffres", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 158 });
})();
</script>
