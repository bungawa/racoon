<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §48-7 : deux pendules de 25 cm, de 200 g, reliés par un ressort ; amplitude 2 cm (4,6°) ---------- */
(() => {
  const O = self.Ondes, g = Constantes.g0, L = 0.25, M = 0.2, AMP = 0.02, wA = Math.sqrt(g / L);
  const DEP = { seul: [AMP, 0], phase: [AMP, AMP], opposition: [AMP, -AMP] };
  let dep = "seul";
  function upd() {
    const eps = Math.pow(10, +$("eps").value), del = +$("del").value / 100, wK = wA * Math.sqrt(eps), wB = wA / Math.sqrt(1 + del);
    const S = O.pendulesCouples(wA, wB, wK), Mv = S.lacher(...DEP[dep]), E0 = Mv.energies(0).totale;
    const tmax = 2.5 * S.transfert, tt = +$("tt").value * tmax, ts = Array.from({ length: 601 }, (_, i) => tmax * i / 600);
    /* énergie de chaque pendule, en fraction de l'énergie totale (la part du ressort, ~ K/m ÷ ω₀², n'est pas tracée) */
    const svg = $("pe"); svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 220, pad: { l: 52, b: 44 }, x: { domain: [0, tmax], label: t("pe.xaxis") }, y: { domain: [0, 1.05], label: t("pe.yaxis") } });
    const EA = ts.map(u => Mv.energies(u));
    Plot.el("path", { d: Plot.path(ts.map((u, i) => [A.x(u), A.y(EA[i].A / E0)])), class: "stroke c-tint" }, A.g);
    Plot.el("path", { d: Plot.path(ts.map((u, i) => [A.x(u), A.y(EA[i].B / E0)])), class: "stroke c-warn" }, A.g);
    Plot.el("line", { x1: A.x(tt), x2: A.x(tt), y1: A.y(0), y2: A.y(1.05), class: "ref" }, A.g);
    /* zoom : six périodes autour de l'instant choisi, et les deux pendules à cet instant */
    const T0 = 2 * Math.PI / wA, z0 = Math.max(0, Math.min(tt - 3 * T0, tmax - 6 * T0)), zs = Array.from({ length: 481 }, (_, i) => z0 + 6 * T0 * i / 480);
    const pv = $("px"); pv.innerHTML = "";
    const B = Plot.axes(pv, { fmt: F, w: 640, h: 200, pad: { l: 52, b: 44, r: 170 }, x: { domain: [z0, z0 + 6 * T0], label: t("px.xaxis") }, y: { domain: [-2.4, 2.4], label: t("px.yaxis") } });
    Plot.el("path", { d: Plot.path(zs.map(u => [B.x(u), B.y(100 * Mv.xA(u))])), class: "stroke c-tint" }, B.g);
    Plot.el("path", { d: Plot.path(zs.map(u => [B.x(u), B.y(100 * Mv.xB(u))])), class: "stroke c-warn" }, B.g);
    Plot.el("line", { x1: B.x(tt), x2: B.x(tt), y1: B.y(-2.4), y2: B.y(2.4), class: "ref" }, B.g);
    /* les pendules, à l'échelle du dessin : angle exagéré 4 fois pour être visible */
    const piv = [[520, 20], [600, 20]], len = 130, xs = [Mv.xA(tt), Mv.xB(tt)];
    Plot.el("line", { x1: piv[0][0], y1: 20, x2: piv[1][0], y2: 20, class: "axis" }, pv);
    const bob = xs.map((x, i) => { const a = 4 * x / L; return [piv[i][0] + len * Math.sin(a), 20 + len * Math.cos(a)]; });
    bob.forEach((b, i) => { Plot.el("line", { x1: piv[i][0], y1: 20, x2: b[0], y2: b[1], class: "stroke thin" }, pv);
      Plot.el("circle", { cx: b[0], cy: b[1], r: 8, class: "fill " + (i ? "c-warn" : "c-tint") }, pv); });
    Plot.el("line", { x1: bob[0][0], y1: bob[0][1] - 40, x2: bob[1][0], y2: bob[1][1] - 40, class: "stroke thin dash c-label-2" }, pv);
    $("epsv").textContent = F.num(eps, 2); $("delv").textContent = F.num(del * 100, 2) + " %"; $("ttv").textContent = F.si(tt, "s");
    $("vf").textContent = t("pe.f.deux", { a: F.si(S.w1 / (2 * Math.PI), "Hz", { sig: 5, prefix: "" }), b: F.si(S.w2 / (2 * Math.PI), "Hz", { sig: 5, prefix: "" }) });
    $("ff").textContent = t("pe.f.K", { K: F.si(eps * M * wA * wA, "N·m⁻¹") });
    $("vtau").textContent = F.si(S.transfert, "s"); $("ftau").textContent = t("pe.f.tau", { n: F.num(S.transfert * S.w1 / (2 * Math.PI), 3) });
    $("vfr").textContent = F.num(100 * S.fractionMax, 3) + " %"; $("ffr").textContent = t("pe.f.frac", { d: F.si(Math.abs(wA - wB) / (2 * Math.PI), "Hz", { sig: 2, prefix: "" }) });
    $("dep").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.d === dep)));
  }
  $("dep").querySelectorAll("button").forEach(x => x.onclick = () => { dep = x.dataset.d; upd(); });
  ["eps", "del", "tt"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["huygens", 1665, "experiment"], ["wilberforce", 1894, "experiment"], ["hancock", 1977, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["taipei", "molecules"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["phase", "a"], ["opposition", "c"], ["superposition", "b"], ["couplage", "d"], ["feynman", "a"], ["desaccord", "c"], ["taipei", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 487 });
})();
</script>
