<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, K = Constantes, nm = x => x * 1e-9, P = Plot.el;

/* ---------- l'électron libre dans une boîte, contre les mesures ---------- */
(() => {
  const svg = $("boite"), W = 640, H = 300;
  const ax = Plot.axes(svg, { fmt: F, w: W, h: H, x: { domain: [1, 7], label: t("bx.ax.x") }, y: { domain: [100, 900], label: t("bx.ax.y") } });
  P("path", { d: Plot.path([1, 2, 3, 4, 5, 6, 7].map(k => [ax.x(k), ax.y(Math.min(900, O.polyene(k).lambda * 1e9))])), class: "stroke c-tint" }, svg);
  [1, 2, 3, 4, 5, 6, 7].forEach(k => { const l = O.polyene(k).lambda * 1e9; if (l <= 900) P("circle", { cx: ax.x(k), cy: ax.y(l), r: 3.5, class: "fill c-tint" }, svg); });
  /* mesures : butadiène, hexatriène, octatétraène (217, 258, 290 nm) ; base de Schiff protonée du rétinal dans le méthanol, 440 nm */
  [[2, 217], [3, 258], [4, 290], [6, 440]].forEach(([k, l]) => P("circle", { cx: ax.x(k), cy: ax.y(l), r: 5, class: "fill c-ko" }, svg));
  /* le même chromophore dans les quatre opsines humaines : de 419 à 558 nm */
  P("line", { x1: ax.x(6), x2: ax.x(6), y1: ax.y(O.PIGMENTS.S * 1e9), y2: ax.y(O.PIGMENTS.L * 1e9), class: "stroke bold c-ok" }, svg);
  Object.values(O.PIGMENTS).forEach(l => P("circle", { cx: ax.x(6), cy: ax.y(l * 1e9), r: 3, class: "fill c-ok" }, svg));
})();

/* ---------- le gabarit d'un pigment, contre V′(λ) ---------- */
(() => {
  const svg = $("gab"), W = 640, H = 320, sl = $("lm"), lam = Array.from({ length: 321 }, (_, i) => 380 + i);
  const HUM = [["S", O.PIGMENTS.S], ["M", O.PIGMENTS.M], ["L", O.PIGMENTS.L], ["R", O.PIGMENTS.batonnet]];
  const T310 = 310, kT = K.k_B * T310;
  function draw() {
    svg.innerHTML = "";
    const lm = nm(+sl.value);
    const ax = Plot.axes(svg, { fmt: F, w: W, h: H, x: { domain: [380, 700], label: t("gb.ax.x") }, y: { domain: [0, 1.05], label: t("gb.ax.y") } });
    HUM.forEach(([id, l]) => {
      P("path", { d: Plot.path(lam.map(x => [ax.x(x), ax.y(O.gabarit(nm(x), l))])), class: "stroke thin c-label-2" }, svg);
      P("text", { x: ax.x(l * 1e9), y: ax.y(1) - 6, "text-anchor": "middle", class: "tick" }, svg).textContent = t("gb.nom." + id);
    });
    P("path", { d: Plot.path(lam.map(x => [ax.x(x), ax.y(O.Vp(nm(x)))])), class: "stroke dash c-warn" }, svg);
    P("path", { d: Plot.path(lam.map(x => [ax.x(x), ax.y(O.gabarit(nm(x), lm))])), class: "stroke bold c-tint" }, svg);
    const E = K.h * K.c / lm;
    $("lmr").textContent = F.si(lm, "m", { prefix: "n", sig: 4 });
    $("ve").textContent = F.qty(F.num(E / K.e, 3), "eV");
    $("fe").textContent = t("gb.f.e").replace("{r}", F.num(E / kT, 3)).replace("{T}", F.qty(F.num(T310, 3), "K"));
    $("vl").textContent = F.si(O.largeur(lm), "m", { prefix: "n", sig: 3 });
    $("fl").textContent = t("gb.f.l").replace("{a}", F.qty(F.num(100 * O.gabarit(nm(650), lm), 2), "%"));
    let s = 0, n = 0; for (let x = 400; x <= 650; x += 5) { s += (O.gabarit(nm(x), lm) - O.Vp(nm(x))) ** 2; n++; }
    const r = Math.sqrt(s / n);
    $("vr").textContent = F.qty(F.num(100 * r, 2), "%");
    $("fr").textContent = t(r < 0.08 ? "gb.f.proche" : "gb.f.loin");
  }
  sl.oninput = draw;
  $("fit").onclick = () => { sl.value = (O.meilleurGabarit(O.Vp).lmax * 1e9).toFixed(1); draw(); };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["boll", 1876, "experiment"], ["hubbard", 1958, "experiment"], ["brown", 1964, "experiment"], ["dartnall", 1983, "experiment"], ["shank", 1991, "experiment"], ["palczewski", 2000, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rouge", "gabarits"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["energie", "a"], ["thermique", "c"], ["boite", "b"], ["opsine", "d"], ["forme", "a"], ["decalage", "c"], ["rouge", "b"], ["perception", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 356 });
})();
</script>
