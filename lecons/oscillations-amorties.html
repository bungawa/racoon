<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

(() => { const IDS = ["pseudo", "critique", "aperiodique"]; keyed($("regimes"), t("regimes.tag"), IDS, textOf("regimes.items", IDS)); })();

/* ---------- §24-2 : la boule lâchée de 5 cm, sans vitesse ---------- */
(() => {
  const M = 0.2, K = 20, W0 = Osc.pulsation(K, M), T0 = 2 * Math.PI / W0, X0 = 0.05, P = 0.05;   // ω₀ = 10 rad·s⁻¹, T₀ = 0,63 s
  const PRESETS = [["critique", 0.5], ["rapide", 0.72], ["faible", 30]], names = textOf("oa.presets", PRESETS.map(p => p[0]));
  $("presets").innerHTML = PRESETS.map(([id, q], i) => `<button type="button" data-q="${q}">${names[id]}</button>`).join("");
  function upd(Qset) {
    if (Qset != null) $("q").value = Math.log10(Qset);
    const Q = Qset != null ? Qset : 10 ** +$("q").value, S = Amort.libre(W0, Q, X0, 0), back = Amort.retour(W0, Q, X0, 0, P);
    [...$("presets").children].forEach(b => b.setAttribute("aria-pressed", String(Math.abs(+b.dataset.q - Q) < 1e-9)));
    const tend = Math.min(25, Math.max(2 * T0, 1.25 * back)), N = 600, ts = Array.from({ length: N + 1 }, (_, i) => tend * i / N);
    /* step by step, Osc.forceAmortie without force: about 400 steps per T₀, one dot in 25 */
    const n = Math.ceil(400 * tend / T0), run = Integ.run("leapfrog", Osc.forceAmortie(W0, 0, 0, Q).a, { t: 0, x: [X0], v: [0] }, tend / n, n, { vdep: true, every: Math.max(1, Math.round(n / 24)) });
    let svg = $("trace"); svg.innerHTML = "";
    let o = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 52 }, x: { domain: [0, tend], label: t("trace.xaxis") }, y: { domain: [-5.5, 5.5], label: t("trace.yaxis") } });
    [-1, 1].forEach(s => Plot.el("line", { x1: o.x(0), x2: o.x(tend), y1: o.y(100 * s * P * X0), y2: o.y(100 * s * P * X0), class: "stroke thin dash c-label-2" }, o.g));
    if (S.enveloppe) [-1, 1].forEach(s => Plot.el("path", { d: path(ts.map(u => [o.x(u), o.y(Math.max(-5.5, Math.min(5.5, 100 * s * S.enveloppe(u))))])), class: "stroke thin dash c-label-2" }, o.g));
    Plot.el("path", { d: path(ts.map(u => [o.x(u), o.y(100 * S.x(u))])), class: "curve" }, o.g);
    run.t.forEach((u, j) => Plot.el("circle", { cx: o.x(u), cy: o.y(100 * run.x[j][0]), r: 3, class: "fill c-warn" }, o.g));
    Plot.el("line", { x1: o.x(back), x2: o.x(back), y1: o.y(-5.5), y2: o.y(5.5), class: "stroke thin c-label-2" }, o.g);
    /* energy over its initial value, log scale, against e^(−γt) */
    const E0 = S.energie(0), g = W0 / Q, lo = 1e-4;
    svg = $("energie"); svg.innerHTML = "";
    o = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 52 }, x: { domain: [0, tend], label: t("trace.xaxis") }, y: { scale: "log", domain: [lo, 1], label: t("energie.yaxis") } });
    Plot.el("path", { d: path(ts.map(u => [o.x(u), o.y(Math.max(lo, Math.exp(-g * u)))])), class: "stroke thin dash c-label-2" }, o.g);
    Plot.el("path", { d: path(ts.map(u => [o.x(u), o.y(Math.max(lo, S.energie(u) / E0))])), class: "curve" }, o.g);
    /* readouts */
    $("qv").textContent = F.num(Q, 3);
    $("vr").textContent = t("oa.v." + S.regime); $("fr").textContent = t("oa.f.regime", { g: F.si(g, "s⁻¹"), w: F.si(W0, "rad·s⁻¹") });
    if (S.regime === "pseudo") {
      const Tg = Amort.pseudoPeriode(W0, Q), pp = Amort.parPeriode(Q);
      $("vp").textContent = F.si(Tg, "s"); $("fp").textContent = t("oa.f.periode", { r: F.num(Tg / T0, 4), d: F.num(pp.decrement, 3) });
      $("vl").textContent = F.qty(F.num(100 * pp.perte, 3), "%"); $("fl").textContent = t("oa.f.perte", { e: F.qty(F.num(Math.min(100 * pp.estimation, 999), 3), "%") });
    } else {
      $("vp").textContent = t("oa.v.aucune"); $("fp").textContent = t("oa.f.aucune", { r1: F.si(S.lent, "s⁻¹"), r2: F.si(S.rapide, "s⁻¹") });
      $("vl").textContent = "–"; $("fl").textContent = t("oa.f.perte0");
    }
    $("vt").textContent = F.si(back, "s"); $("ft").textContent = t("oa.f.retour", { n: F.num(back / T0, 3) });
  }
  $("q").oninput = () => upd(); $("presets").onclick = e => { const b = e.target.closest("button"); if (b) upd(+b.dataset.q); };
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rayleigh", 1873, "idea"], ["darsonval", 1882, "experiment"], ["houdaille", 1909, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sismometre", "aiguille"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["amplitude", "c"], ["energie", "b"], ["seuil", "d"], ["pseudo", "a"], ["critique", "c"], ["estimation", "b"], ["racines", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 242 });
})();
</script>
