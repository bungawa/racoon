<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const C = ChimArchi, R = Constantes.R;

/* ---------- la droite d'Arrhenius, quand le préfacteur varie comme T^m ---------- */
(() => {
  const svg = $("droite"), seg = $("m"), se0 = $("e0"), st1 = $("t1"), st2 = $("t2");
  let m = 0.5;
  function draw(qui) {
    if (+st2.value < +st1.value + 20) { if (qui === st2) st1.value = +st2.value - 20; else st2.value = +st1.value + 20; }
    const E0 = +se0.value * 1e3, T1 = +st1.value, T2 = +st2.value;
    const d = C.droiteArrhenius({ m, E0, T1, T2, n: 15 }), k1 = d.ks[0];
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.m === m)));
    const xs = d.Ts.map(T => 1 / T), ys = d.ks.map(k => Math.log(k / k1)), lo = Math.min(...ys), hi = Math.max(...ys), pad = 0.06 * (hi - lo || 1);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { domain: [1 / T2, 1 / T1], label: t("sim.x"), fmt: v => F.num(v * 1e3, 3) }, y: { domain: [lo - pad, hi + pad], label: t("sim.y") } });
    const L = d.droite, yl = x => L.ordonnee + L.pente * x - Math.log(k1);
    Plot.el("line", { x1: o.x(1 / T2), x2: o.x(1 / T1), y1: o.y(yl(1 / T2)), y2: o.y(yl(1 / T1)), class: "ref" }, o.g);
    xs.forEach((x, i) => Plot.el("circle", { cx: o.x(x), cy: o.y(ys[i]), r: 5, class: "dot" }, o.g));
    const Tm = 2 / (1 / T1 + 1 / T2);                                         // milieu de l'intervalle en 1/T
    $("e0v").textContent = F.qty(F.num(E0 / 1e3, 3), "kJ·mol⁻¹");
    $("t1v").innerHTML = F.kelvin(T1); $("t2v").innerHTML = F.kelvin(T2);
    $("vea").textContent = F.qty(F.num(d.Ea / 1e3, 3), "kJ·mol⁻¹");
    $("vth").textContent = F.qty(F.num(C.eaApparente(m, E0, Tm) / 1e3, 3), "kJ·mol⁻¹");
    $("vecart").textContent = F.qty(F.num(100 * d.ecartMax, 2), "%");
    $("vdix").textContent = "× " + F.num(C.kModifie(1, m, E0, T1 + 10) / C.kModifie(1, m, E0, T1), 3);
  }
  seg.onclick = e => { const b = e.target.closest("button"); if (b) { m = +b.dataset.m; draw(); } };
  se0.oninput = () => draw(se0); st1.oninput = () => draw(st1); st2.oninput = () => draw(st2); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["vanthoff", 1884, "idea"], ["arrhenius", 1889, "idea"], ["kooij", 1893, "idea"], ["dolbear", 1897, "experiment"], ["eyring", 1935, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["stabilite", "combustion"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["doubler", "c"], ["pente", "a"], ["grillon", "d"], ["sensible", "b"], ["incertitude", "c"], ["courbure", "a"], ["trempe", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 613 });
})();
</script>
