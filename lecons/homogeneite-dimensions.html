<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homogénéité : les dimensions comptent</title>
<link rel="stylesheet" href="/racoon/ds.css">
<style>
  .picks { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  .picks label { display: inline-flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-mesurer" data-i18n="monde.mesurer"></a><span class="aux">›</span><a href="/racoon/etape?id=grandeurs-incertitudes" data-i18n="etape.grandeurs-incertitudes"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <span class="chip plain" data-i18n="tag.prereq"></span>
      <span class="chip plain" data-i18n="tag.duree"></span>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n="s1.p1"></p>
    <div class="list keyed" id="base"></div>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq">
      <math display="block"><mo>[</mo><mi>E</mi><mo>]</mo><mo>=</mo><mo>[</mo><mi>F</mi><mo>]</mo><mo>·</mo><mo>[</mo><mi>ℓ</mi><mo>]</mo><mo>=</mo><mi mathvariant="normal">M</mi><mo>·</mo><msup><mi mathvariant="normal">L</mi><mn>2</mn></msup><mo>·</mo><msup><mi mathvariant="normal">T</mi><mrow><mo>−</mo><mn>2</mn></mrow></msup></math>
      
    </div>
    <p class="validite" data-i18n="eq1.validite"></p>
    <div class="box rem"><b data-i18n="s1.rem.title"></b>
      <p data-i18n="s1.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <div class="box prop"><b data-i18n="s2.prop.title"></b>
      <p data-i18n="s2.prop.body"></p>
    </div>
    <p data-i18n="s2.p1"></p>
    <figure>
      <div class="panel">
        <label class="field"><span data-i18n="check.pick"></span>
          <select id="fsel">
            <option value="chute" data-i18n="check.opt.chute"></option>
            <option value="chute2" data-i18n="check.opt.chute2"></option>
            <option value="horaire" data-i18n="check.opt.horaire"></option>
            <option value="horaire2" data-i18n="check.opt.horaire2"></option>
            <option value="decharge" data-i18n="check.opt.decharge"></option>
            <option value="decharge2" data-i18n="check.opt.decharge2"></option>
          </select></label>
        <div class="list" id="fterms"></div>
        <div class="stats"><div class="stat"><span class="k" data-i18n="check.verdict"></span><span class="v" id="fverdict"></span><span class="f" id="fnote"></span></div></div>
      </div>
    </figure>
    <div class="box warn"><b data-i18n="s2.warn.title"></b>
      <p data-i18n="s2.warn.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n="s3.p1"></p>
    <div class="eq">
      <math display="block"><mi>T</mi><mo>=</mo><mi>C</mi><mspace width="0.2em"></mspace><msup><mi>m</mi><mi>α</mi></msup><mspace width="0.2em"></mspace><msup><mi>ℓ</mi><mi>β</mi></msup><mspace width="0.2em"></mspace><msup><mi>g</mi><mi>γ</mi></msup><mspace width="1em"></mspace><mo>⟹</mo><mspace width="1em"></mspace><mrow><mo>{</mo><mtable><mtr><mtd><mi mathvariant="normal">M</mi><mo>:</mo><mspace width="0.3em"></mspace><mi>α</mi><mo>=</mo><mn>0</mn></mtd></mtr><mtr><mtd><mi mathvariant="normal">L</mi><mo>:</mo><mspace width="0.3em"></mspace><mi>β</mi><mo>+</mo><mi>γ</mi><mo>=</mo><mn>0</mn></mtd></mtr><mtr><mtd><mi mathvariant="normal">T</mi><mo>:</mo><mspace width="0.3em"></mspace><mo>−</mo><mn>2</mn><mi>γ</mi><mo>=</mo><mn>1</mn></mtd></mtr></mtable></mrow></math>
      
    </div>
    <p class="validite" data-i18n="eq2.validite"></p>
    <p data-i18n="s3.p2"></p>
    <figure>
      <div class="panel">
        <label class="field"><span data-i18n="solve.pick"></span>
          <select id="psel">
            <option value="pendule" data-i18n="solve.opt.pendule"></option>
            <option value="ressort" data-i18n="solve.opt.ressort"></option>
            <option value="vague" data-i18n="solve.opt.vague"></option>
            <option value="goutte" data-i18n="solve.opt.goutte"></option>
            <option value="taylor" data-i18n="solve.opt.taylor"></option>
          </select></label>
        <p id="ptarget"></p>
        <div class="picks" id="picks"></div>
        <div class="list" id="pexp"></div>
        <div class="stats"><div class="stat"><span class="k" data-i18n="solve.result"></span><span class="v" id="plaw"></span><span class="f" id="pnote"></span></div></div>
      </div>
      <figcaption data-i18n="solve.caption"></figcaption>
    </figure>
    <div class="box prop"><b data-i18n="s3.prop.title"></b>
      <p data-i18n="s3.prop.body"></p>
    </div>
    <p data-i18n="s3.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/homogeneite-dimensions.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/lecons/homogeneite-dimensions.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
/* typographie française partout, sauf le <h1> : il reste identique au titre de lecons/index.json */
const main = document.querySelector("main");
F.autoTypo(main);
document.title = t("title");
const $ = id => document.getElementById(id);
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const d = Dims.dim;
/* « M·L²·T⁻² » ; sans dimension : texte de la table */
const dimText = v => Dims.none(v) ? t("dim.none") : Dims.parts(v).map(([b, e]) => b + (e === 1 ? "" : F.sup(e))).join("·");
const fracText = q => (q.n < 0 ? F.MINUS : "") + Math.abs(q.n) + (q.d === 1 ? "" : "/" + q.d);

/* ---------- les sept grandeurs de base ---------- */
(() => {
  const BASE = [["M", "kg"], ["L", "m"], ["T", "s"], ["I", "A"], ["Θ", "K"], ["N", "mol"], ["J", "cd"]];
  const names = textOf("base.names", BASE.map(b => b[0]));
  $("base").innerHTML = BASE.map(([s, u]) => `<div><span class="k">${s}</span><span>${names[s]}</span><span class="v">${u}</span></div>`).join("");
})();

/* ---------- vérificateur d'homogénéité : dimension de chaque membre et de chaque terme ---------- */
(() => {
  const V = d({ L: 1, T: -1 }), A = d({ L: 1, T: -2 }), L = d({ L: 1 }), Tm = d({ T: 1 }), U = d({ M: 1, L: 2, T: -3, I: -1 });
  /* [membre de gauche, termes de droite, argument d'une fonction (doit être sans dimension) ou null] */
  const FORMULAS = {
    chute: [V, [Dims.power(Dims.times(A, L), 0.5)], null],
    chute2: [V, [Dims.times(A, L)], null],
    horaire: [L, [Dims.times(V, Tm), Dims.times(A, Dims.power(Tm, 2))], null],
    horaire2: [L, [Dims.times(V, Tm), Dims.times(A, Tm)], null],
    decharge: [U, [U], d({})],
    decharge2: [U, [U], Tm],
  };
  const txt = textOf("check.items", Object.keys(FORMULAS)), sel = $("fsel");
  function show() {
    const [left, terms, arg] = FORMULAS[sel.value], ok = terms.every(x => Dims.same(x, left)) && (!arg || Dims.none(arg));
    const rows = [[t("check.left"), left]].concat(terms.map((x, i) => [t("check.term", { i: i + 1 }), x]));
    if (arg) rows.push([t("check.arg"), arg]);
    $("fterms").innerHTML = rows.map(([k, v]) => `<div><span>${k}</span><span class="v">${dimText(v)}</span></div>`).join("");
    $("fverdict").textContent = t(ok ? "check.ok" : "check.ko"); $("fnote").textContent = txt[sel.value].note;
  }
  sel.onchange = show; show();
})();

/* ---------- solveur d'exposants ---------- */
(() => {
  const M = d({ M: 1 }), L = d({ L: 1 }), T = d({ T: 1 }), ONE = d({}), ACC = d({ L: 1, T: -2 }), RHO = d({ M: 1, L: -3 }), STIFF = d({ M: 1, T: -2 }), E = d({ M: 1, L: 2, T: -2 });
  /* cible, puis [id, dimension, coché au départ] */
  const PRESETS = {
    pendule: [T, [["m", M, 1], ["l", L, 1], ["g", ACC, 1], ["theta", ONE, 1]]],
    ressort: [T, [["m", M, 1], ["k", STIFF, 1], ["l", L, 1], ["g", ACC, 0]]],
    vague: [d({ L: 1, T: -1 }), [["g", ACC, 1], ["lambda", L, 1], ["rho", RHO, 1], ["eta", d({ M: 1, L: -1, T: -1 }), 0]]],
    goutte: [d({ T: -1 }), [["sigma", STIFF, 1], ["rho", RHO, 1], ["r", L, 1], ["g", ACC, 0]]],
    taylor: [L, [["E", E, 1], ["rho", RHO, 1], ["t", T, 1], ["p", d({ M: 1, L: -1, T: -2 }), 0]]],
  };
  const items = textOf("solve.items", Object.keys(PRESETS)), sel = $("psel");
  let on = [];
  const sym = (p, id) => `<var>${items[p].q[id].sym}</var>`;
  function load() {
    const p = sel.value, [target, qs] = PRESETS[p], it = items[p];
    on = qs.map(q => !!q[2]);
    $("ptarget").innerHTML = t("solve.target", { what: it.target, dim: dimText(target) });
    $("picks").innerHTML = qs.map(([id, dv], i) => `<label><input type="checkbox" data-i="${i}"${on[i] ? " checked" : ""}> ${it.q[id].label} ${sym(p, id)}</label>`).join("");
    $("picks").querySelectorAll("input").forEach(c => c.onchange = () => { on[+c.dataset.i] = c.checked; solve(); });
    solve();
  }
  function solve() {
    const p = sel.value, [target, qs] = PRESETS[p], it = items[p], used = qs.filter((q, i) => on[i]);
    const s = Dims.solve(target, used.map(q => q[1]));
    $("pexp").innerHTML = used.map(([id, dv], j) => `<div><span>${sym(p, id)} : ${dimText(dv)}</span><span class="v">${s.x ? t("solve.exp", { e: fracText(s.x[j]) }) : "–"}</span></div>`).join("");
    if (s.status === "none") { $("plaw").innerHTML = t("solve.none"); $("pnote").textContent = t("solve.none.note"); return; }
    const law = used.map(([id], j) => s.x[j].n === 0 ? "" : sym(p, id) + (s.x[j].n === 1 && s.x[j].d === 1 ? "" : `<sup>${fracText(s.x[j])}</sup>`)).filter(Boolean).join(" ");
    $("plaw").innerHTML = t("solve.law", { q: it.symbol, law: law || "1" });
    if (s.status === "unique") { $("pnote").textContent = t("solve.unique"); return; }
    const groups = s.groups.map(g => used.map(([id], j) => g[j].n === 0 ? "" : sym(p, id) + (g[j].n === 1 && g[j].d === 1 ? "" : `<sup>${fracText(g[j])}</sup>`)).filter(Boolean).join(" "));
    $("pnote").innerHTML = t("solve.family", { n: groups.length, g: groups.join(" ; ") });
  }
  sel.onchange = load; load();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fourier", 1822, "idea"], ["maxwell", 1873, "idea"], ["bertrand", 1878, "idea"], ["reynolds", 1883, "experiment"], ["buckingham", 1914, "idea"],
    ["taylor", 1950, "use"], ["mole", 1971, "idea"], ["mco", 1999, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["maquette", "calcul", "norme"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["horaire", "a"], ["garantie", "a"], ["masse", "a"], ["exp", "a"], ["puissance", "a"], ["taylor", "a"], ["angle", "a"], ["unites", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => { const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) }; }), { t, seed: 7 });
})();
</script>
</body>
</html>
