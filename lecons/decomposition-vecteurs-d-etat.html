<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- φ = + along (θ, 0); an apparatus A (filter +x, quarter turn about x, half turn about y); |ψ⟩ = A|φ⟩; ⟨χ|ψ⟩ two ways ---------- */
(() => {
  const sth = $("sth"); let app = 0, fin = 0;
  const r = Math.SQRT1_2, PX = [Cx.c(r, 0), Cx.c(r, 0)];
  const APP = [() => Q.projecteur(PX), () => Q.demiX(Math.PI / 2), () => Q.demiY(Math.PI)];
  const FIN = [Q.etatBase(2, 0), PX, [Cx.c(r, 0), Cx.c(0, r)]];         // +z, +x, +y (6.36 with θ = 90°, up to a phase)
  const txt = z => Cx.text(z, x => F.num(Math.abs(x) < 5e-13 ? 0 : x, 3));
  function draw() {
    const th = +sth.value * Math.PI / 180, phi = Q.amplitudesAxe(th, 0), A = APP[app](), psi = Q.appliquer(A, phi), chi = FIN[fin];
    const un = Q.produitScalaire(chi, psi), deux = Q.produitScalaire(Q.appliquer(Q.adjointe(A), chi), phi);
    const svg = $("comp"); svg.innerHTML = "";
    [[phi, 160, ["fig.lab.c0", "fig.lab.c1"]], [psi, 480, ["fig.lab.p0", "fig.lab.p1"]]].forEach(([v, x0, k]) => v.forEach((z, i) => {
      const cx0 = x0 - 60 + i * 120, cy0 = 100, R = 60;
      Plot.el("circle", { cx: cx0, cy: cy0, r: R, class: "stroke thin c-label-2", fill: "none" }, svg);
      Plot.fleche(svg, [cx0, cy0], [cx0 + R * z.re, cy0 - R * z.im], { cls: i ? "c-warn" : "c-tint", tete: 8, min: 2, trait: "stroke bold" });
      Plot.el("text", { x: cx0, y: cy0 + R + 20, "text-anchor": "middle" }, svg).textContent = t(k[i]);
    }));
    $("app").querySelectorAll("button").forEach(bt => bt.setAttribute("aria-pressed", String(+bt.dataset.i === app)));
    $("fin").querySelectorAll("button").forEach(bt => bt.setAttribute("aria-pressed", String(+bt.dataset.i === fin)));
    $("sthr").textContent = F.num(+sth.value, 3) + "\u00a0°";
    $("vpsi").textContent = psi.map(txt).join(" ; "); $("fpsi").textContent = t("fig.f.psi", { n: F.num(Q.norme2(psi), 3) });
    $("vun").textContent = txt(un);
    $("vdeux").textContent = txt(deux); $("fdeux").textContent = t("fig.f.deux", { p: F.num(Cx.abs2(un), 3) });
  }
  ["app", "fin"].forEach(id => $(id).querySelectorAll("button").forEach(bt => bt.onclick = () => { if (id === "app") app = +bt.dataset.i; else fin = +bt.dataset.i; draw(); }));
  sth.oninput = draw; draw();
  const n = Q.norme2(Q.appliquer(Q.projecteur(PX), Q.etatBase(2, 0)));
  $("sys1").innerHTML = t("sys1.body", { n: F.num(n, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["heisenberg", 1925, "idea"], ["born", 1925, "idea"], ["neumann", 1932, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["portes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["comp", "b"], ["conj", "d"], ["operateur", "a"], ["filtre", "c"], ["deux", "b"], ["ordre", "d"], ["norme", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 802 });
})();
</script>
