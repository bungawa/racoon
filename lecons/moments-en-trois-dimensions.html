<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const NM = "N·m", trio = v => "(" + v.map(q => F.num(Math.abs(q) < 5e-13 ? 0 : q, 3)).join(" ; ") + ")";

/* ---------- une clé : le point d'application P est fixe, la force et les axes de Moe varient ---------- */
(() => {
  const P = Plot.el, svg = $("plans"), r = [0.3, 0, 0.05];            // m : manche de 30 cm, main 5 cm au-dessus du plan xy
  /* three panels; each plane drawn with its own axes so that a positive moment turns counterclockwise */
  const PANELS = [["yz", 1, 2], ["zx", 2, 0], ["xy", 0, 1]], K = 260, KF = 1.1;     // px per m, px per N
  function upd() {
    const Fv = ["fx", "fy", "fz"].map(id => +$(id).value), th = +$("th").value * Math.PI / 180;
    ["fx", "fy", "fz"].forEach((id, i) => { $(id + "v").textContent = F.qty(F.num(Fv[i], 3), "N"); });
    $("thv").textContent = F.qty(F.num(+$("th").value, 3), "°");
    const m = RotEsp.momentsPlans(r, Fv), joe = RotEsp.enVecteur(m), M = RotEsp.axesTournes(th);
    const regle = RotEsp.enVecteur(RotEsp.tournerPlans(m, th));
    const moe = RotEsp.enVecteur(RotEsp.momentsPlans(AlgVec.appliquer(M, r), AlgVec.appliquer(M, Fv)));
    $("vjoe").textContent = F.qty(trio(joe), NM);
    $("vregle").textContent = F.qty(trio(regle), NM);
    $("vmoe").textContent = F.qty(trio(moe), NM);
    const gap = Math.max(...regle.map((q, i) => Math.abs(q - moe[i])));
    $("vecart").textContent = gap < 1e-12 ? t("sim.zero") : F.qty(F.sci(gap, 2), NM);
    $("fnorme").textContent = t("sim.f.norme", { a: F.num(Dyna.norme(joe), 3), b: F.num(Dyna.norme(moe), 3) });
    svg.innerHTML = "";
    PANELS.forEach(([plan, i, j], k) => {
      const cx = 110 + 220 * k, cy = 120, X = u => cx + K * u, Y = u => cy - K * u;
      const g = P("g", {}, svg);
      P("line", { x1: cx - 95, y1: cy, x2: cx + 95, y2: cy, class: "stroke thin c-label-2" }, g);
      P("line", { x1: cx, y1: cy + 95, x2: cx, y2: cy - 95, class: "stroke thin c-label-2" }, g);
      P("text", { x: cx + 98, y: cy + 4 }, g).textContent = t("fig.axe." + "xyz"[i]);
      P("text", { x: cx + 4, y: cy - 98 }, g).textContent = t("fig.axe." + "xyz"[j]);
      if (plan === "xy") {                                             // Moe's axes, turned by θ about z
        const c = Math.cos(th), s = Math.sin(th);
        P("line", { x1: cx, y1: cy, x2: cx + 85 * c, y2: cy - 85 * s, class: "stroke thin dash c-warn" }, g);
        P("line", { x1: cx, y1: cy, x2: cx - 85 * s, y2: cy - 85 * c, class: "stroke thin dash c-warn" }, g);
      }
      const px = X(r[i]), py = Y(r[j]), fx = px + KF * Fv[i], fy = py - KF * Fv[j];
      P("line", { x1: cx, y1: cy, x2: px, y2: py, class: "stroke c-label-2" }, g);
      P("circle", { cx: px, cy: py, r: 3.5, class: "fill c-label-2" }, g);
      if (Math.hypot(fx - px, fy - py) > 1) {
        P("line", { x1: px, y1: py, x2: fx, y2: fy, class: "stroke bold c-tint" }, g);
        const a = Math.atan2(fy - py, fx - px);
        P("path", { d: `M${fx} ${fy}L${fx - 9 * Math.cos(a - 0.4)} ${fy - 9 * Math.sin(a - 0.4)}L${fx - 9 * Math.cos(a + 0.4)} ${fy - 9 * Math.sin(a + 0.4)}Z`, class: "fill c-tint" }, g);
      }
      const g2 = P("g", {}, svg);
      P("text", { x: cx, y: 240, "text-anchor": "middle" }, g2).textContent = t("fig.moment." + plan, { v: F.qty(F.num(Math.abs(m[plan]) < 5e-13 ? 0 : m[plan], 3), NM) });
    });
  }
  ["fx", "fy", "fz", "th"].forEach(id => { $(id).oninput = upd; }); upd();
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["point", "plan", "cle"], items = textOf("sys.items", IDS);
  /* a 50 N push, 30 cm from the bolt, 5 cm off its plane, tilted 20° out of it */
  const Fv = [0, 50 * Math.cos(Math.PI / 9), 50 * Math.sin(Math.PI / 9)], m = RotEsp.momentsPlans([0.3, 0, 0.05], Fv);
  const v = { utile: F.num(m.xy, 3), flexion: F.num(Math.hypot(m.yz, m.zx), 2), main: F.num(0.02 / 0.3 * 100, 2) };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: items[id].text.replace(/\{(\w+)\}/g, (s, k) => k in v ? v[k] : s) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hamilton", 1843, "idea"], ["gibbs", 1881, "idea"], ["wu", 1957, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["capteur"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cle", "b"], ["axe", "c"], ["moe", "a"], ["miroir", "d"], ["quatre", "b"], ["carres", "c"], ["perp", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2001 });
})();
</script>
