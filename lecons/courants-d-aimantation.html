<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes;

/* ---------- le système décrit : un cube moyen de 10 nm, les atomes à 0,25 nm ; une boucle atomique ---------- */
(() => {
  const d = 0.25e-9, L = 10e-9, mu = Cst.mu_B, r = 0.05e-9, I = mu / (Math.PI * r * r);
  $("sys1").innerHTML = t("sys1.body", { L: F.si(L, "m", { sig: 1 }), d: F.si(d, "m", { sig: 2, prefix: "n" }), n: F.sci(Math.pow(L / d, 3), 1),
    r: F.si(r, "m", { sig: 1, prefix: "n" }), I: F.si(I, "A", { sig: 2 }), Ms: F.sci(M.FER_MS, 3) });
})();

/* ---------- le barreau de fer saturé comme solénoïde ---------- */
(() => {
  const K = M.FER_MS, rho = M.RESISTIVITES.cuivre, S = 1e-6, j = K * 1e-3 / S;
  $("solenoide").innerHTML = t("solenoide.body", { K: F.sci(K, 3), B: F.si(Cst.mu0 * K, "T", { sig: 3 }), I: F.si(K * 1e-3, "A", { sig: 2 }),
    j: F.sci(j, 2), p: F.si(rho * j * j * 1e-6, "W", { sig: 2 }) });
})();

/* ---------- blocs aimantés : nappes aux interfaces contre −dMz/dx ---------- */
(() => {
  const svg = $("blocs"), sn = $("sn"), seg = $("profil"), M0 = 1e6, X = 5e-3, demi = 4e-3, s = 1.2e-3;
  const PROFILS = {
    uniforme: x => (Math.abs(x) < demi ? M0 : 0),
    rampe: x => (Math.abs(x) < demi ? M0 * (x + demi) / (2 * demi) : 0),
    cloche: x => M0 * Math.exp(-x * x / (2 * s * s)),
  };
  let prof = "cloche";
  function draw() {
    const n = +sn.value, f = PROFILS[prof], r = M.courantsBlocs(f, -X, X, n);
    svg.innerHTML = "";
    const W = 640, Hh = 150;
    const top = Plot.axes(svg, { fmt: F, w: W, h: Hh, pad: { b: 28 }, x: { domain: [-5, 5] }, y: { domain: [0, 1.1], label: t("fig.ax.m") } });
    const gb = Plot.el("g", { transform: "translate(0," + (Hh + 10) + ")" }, svg);
    const jmax = prof === "cloche" ? 0.6 : prof === "rampe" ? 0.3 : 0.3;
    const bot = Plot.axes(gb, { fmt: F, w: W, h: 190, x: { domain: [-5, 5], label: t("fig.ax.x") }, y: { domain: [-jmax, jmax], label: t("fig.ax.j") } });
    svg.setAttribute("viewBox", "0 0 " + W + " " + (Hh + 200));
    /* top: the blocks and the profile */
    for (const b of r.blocs) Plot.el("rect", { x: top.x(b.x0 * 1e3), y: top.y(b.M / 1e6), width: Math.max(0.5, top.x(b.x1 * 1e3) - top.x(b.x0 * 1e3) - 1), height: top.y(0) - top.y(b.M / 1e6), class: "stroke thin c-label-2" }, svg);
    const pts = []; for (let k = 0; k <= 400; k++) { const x = -X + 2 * X * k / 400; pts.push([top.x(x * 1e3), top.y(f(x) / 1e6)]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke thin c-warn" }, svg);
    /* bottom: K/a at the interfaces (stems) and −dMz/dx */
    const cl = v => Math.max(-jmax, Math.min(jmax, v));
    if (prof !== "uniforme") {
      const q = []; for (let k = 0; k <= 400; k++) { const x = -X + 2 * X * k / 400; q.push([bot.x(x * 1e3), bot.y(cl(r.j(x) / 1e9))]); }
      Plot.el("path", { d: Plot.path(q), class: "stroke bold c-warn" }, gb);
    }
    for (const p of r.nappes) if (Math.abs(p.K) > 1e-6 * M0) {
      const v = p.K / r.a / 1e9, x = bot.x(p.x * 1e3);
      Plot.el("line", { x1: x, x2: x, y1: bot.y(0), y2: bot.y(cl(v)), class: "stroke c-tint" }, gb);
      Plot.el("circle", { cx: x, cy: bot.y(cl(v)), r: 3, class: "fill c-tint" }, gb);
    }
    /* stats */
    let moitie = 0, nb = 0; for (const p of r.nappes) if (p.x < -1e-12) { moitie += p.K; nb++; }
    const mid = r.blocs[nb - 1].M;                                       // the block that ends the left half
    let e = 0, ref = 0; if (prof !== "uniforme") for (const p of r.nappes.slice(1, -1)) { e = Math.max(e, Math.abs(p.K / r.a - r.j(p.x))); ref = Math.max(ref, Math.abs(r.j(p.x))); }
    $("snr").textContent = F.num(n, 2);
    $("va").innerHTML = F.si(r.a, "m", { sig: 2 });
    $("fa").innerHTML = t("fig.f.a");
    $("vs").innerHTML = F.qty(F.num(Math.abs(r.somme) < 1e-6 * M0 ? 0 : r.somme, 2), "A·m⁻¹");
    $("fs").innerHTML = t("fig.f.somme");
    $("vm").innerHTML = F.qty(F.sci(moitie, 3), "A·m⁻¹");
    $("fm").innerHTML = t("fig.f.moitie", { M: F.sci(-mid, 3) });
    $("ve").textContent = prof === "uniforme" ? "–" : F.qty(F.num(100 * e / ref, 2), "%");
    $("fe").innerHTML = t(prof === "uniforme" ? "fig.f.ecart.nappe" : "fig.f.ecart");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.p === prof)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { prof = x.dataset.p; draw(); });
  sn.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ampere", 1820, "idea"], ["fresnel", 1821, "idea"], ["dehaas", 1915, "experiment"], ["ndfeb", 1983, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["moteurs"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["uniforme", "c"], ["face", "a"], ["fer", "d"], ["gradient", "b"], ["charge", "a"], ["spin", "c"], ["deux", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 361 });
})();
</script>
