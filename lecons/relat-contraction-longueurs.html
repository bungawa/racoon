<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, c = Constantes.c;

/* ---------- mesurer une règle qui passe : deux marques, au même instant ou non ---------- */
(() => {
  const svg = $("regle"), sb = $("sb"), sd = $("sd"), L0 = 1;                 // the rod: 1 m at rest
  const X = x => 220 + 200 * x, yR = 60, yS = 120;                             // 1 m = 200 px; the rear end is at x = 0 when it is marked
  function draw() {
    const v = +sb.value * c, dt = +sd.value * 1e-9, L = R.contraction(L0, v), lue = R.longueurMarquee(L0, v, dt);
    svg.innerHTML = "";
    /* the ground's ruler: a tick every 10 cm */
    Plot.el("line", { x1: X(-1.1), x2: X(2.05), y1: yS, y2: yS, class: "stroke c-label-2" }, svg);
    for (let k = -11; k <= 20; k++) Plot.el("line", { x1: X(k / 10), x2: X(k / 10), y1: yS, y2: yS + (k % 5 ? 6 : 12), class: "stroke thin c-label-2" }, svg);
    /* the rod when its rear end is marked (t = 0), and when its front end is marked (t = dt) */
    const bar = (x0, cls) => Plot.el("rect", { x: X(x0), y: yR - 9, width: Math.max(1, 200 * L), height: 18, class: cls }, svg);
    if (dt !== 0) bar(v * dt, "stroke thin dash c-tint");
    bar(0, "stroke bold c-tint");
    Plot.fleche(svg, [X(0), 24], [X(0) + 40 + 60 * +sb.value, 24], { cls: "c-tint" });
    /* the two marks on the ground's ruler */
    [0, lue].forEach(x => Plot.el("line", { x1: X(x), x2: X(x), y1: yR + 12, y2: yS + 16, class: "stroke bold c-warn" }, svg));
    Plot.el("line", { x1: X(Math.min(0, lue)), x2: X(Math.max(0, lue)), y1: yS + 30, y2: yS + 30, class: "stroke c-warn" }, svg);
    $("sbr").textContent = t("fig.bv", { b: F.num(+sb.value, 2), g: F.num(R.gamma(v), 4) });
    $("sdr").textContent = F.si(dt, "s", { prefix: "n" });
    $("vlue").textContent = F.si(lue, "m", { prefix: "", sig: 3 });
    $("flue").textContent = t("fig.f.lue", { d: F.si(v * dt, "m", { prefix: "", sig: 3 }) });
    $("vvraie").textContent = F.si(L, "m", { prefix: "", sig: 3 });
    $("fvraie").textContent = t("fig.f.vraie", { l0: F.si(L0, "m") });
  }
  sb.oninput = sd.oninput = draw; draw();
})();

/* ---------- le système décrit : un train, puis les muons ---------- */
(() => {
  const L0 = 200, v = 90, dL = L0 * R.retard(v);                               // 1 − 1/γ: the contraction, without cancellation
  $("sys1").innerHTML = t("sys1.body", { b2: F.sci((v / c) ** 2, 2), dL: F.si(dL, "m", { prefix: "p", sig: 2 }), a0: F.si(Constantes.a0, "m", { prefix: "p", sig: 3 }) });
  const g = 50, vm = R.deCelerite(Math.sqrt(g * g - 1)), H = 1e4, tau0 = 2.1969811e-6, h = R.contraction(H, vm), dur = h / vm;
  $("sys2").innerHTML = t("sys2.body", { g: F.num(g, 2), h: F.si(h, "m", { prefix: "", sig: 3 }), dur: F.si(dur, "s", { prefix: "µ", sig: 3 }),
    f: F.num(100 * Math.exp(-dur / tau0), 2), fs: F.num(100 * R.survie(H, vm, tau0).relativiste, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mm", 1887, "experiment"], ["fitzgerald", 1889, "idea"], ["lorentz", 1892, "idea"], ["einstein", 1905, "idea"], ["terrell", 1959, "idea"], ["vienne", 2025, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ions"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["regle", "b"], ["transverse", "d"], ["reciproque", "a"], ["marques", "c"], ["contrainte", "b"], ["photo", "d"], ["muon", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 155 });
})();
</script>
