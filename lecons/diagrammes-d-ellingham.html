<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), E = ChimSolutions.Ellingham, tx = ChimSolutions.texte, R = Constantes.R;
const keyed = (id, k, ids) => { const txt = textOf(k, ids); $(id).innerHTML = ids.map(i => `<div><span class="k">${txt[i].k}</span><span>${txt[i].v}</span></div>`).join(""); };
keyed("pentes", "s2.pentes", ["metal", "co2", "co", "coco2"]);

/* ---------- §3 : le diagramme ---------- */
(() => {
  const T1 = 300, T2 = 2400, Y = [-1300, 0], AIR = 0.21;
  const CHOIX = ["cu2o", "feo", "zno", "sio2", "tio2", "al2o3", "mgo", "cao", "h2o", "co2", "cco"];
  const TRACES = ["cu2o", "h2o", "co2", "feo", "zno", "cco", "cco2", "sio2", "tio2", "al2o3", "mgo", "cao"];
  const CARBONE = ["cco", "cco2", "co2"];
  const nom = id => { const r = E.ELLINGHAM[id]; return t("fig.nom", { ox: tx(r.ox), red: tx(r.red) }); };
  $("couple").innerHTML = CHOIX.map(id => `<option value="${id}">${nom(id)}</option>`).join("");
  $("couple").value = "zno";
  let modele = "ellingham";
  const kJ = v => F.qty(F.fix(v / 1000, 0), "kJ·mol⁻¹");
  function draw() {
    const id = $("couple").value, T = +$("temp").value, svg = $("diag");
    $("tempv").innerHTML = F.kelvin(T);
    $("modele").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === modele)));
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 380, pad: { r: 70 }, x: { domain: [T1, T2], label: t("fig.ax.x") },
      y: { domain: Y, label: t("fig.ax.y"), fmt: v => F.fix(v, 0) } });
    const fin = r => Math.min(T2, E.tmaxE(r));
    const courbe = (r, cls) => {
      const pts = modele === "janaf"
        ? Array.from({ length: Math.floor((fin(r) - T1) / 50) + 1 }, (_, i) => T1 + 50 * i).map(T => [T, E.drGE(r, T, "janaf")]).filter(p => p[1] !== null)
        : E.pointsE(r, T1, fin(r));
      if (pts.length < 2) return null;
      Plot.el("path", { d: Plot.path(pts.map(([T, G]) => [x(T), y(G / 1000)])), class: cls }, g);
      return pts[pts.length - 1];
    };
    /* the air: RT ln(p(O₂)/p°) with p(O₂) = 0,21 bar */
    Plot.el("path", { d: Plot.path([T1, T2].map(T => [x(T), y(R * T * Math.log(AIR) / 1000)])), class: "stroke dash c-label" }, g);
    const etiquettes = [];
    for (const r of TRACES) {
      if (r === id) continue;
      const end = courbe(r, CARBONE.includes(r) ? "stroke c-warn" : "stroke thin c-label-2");
      if (end) etiquettes.push({ X: x(end[0]) + 4, Y: y(end[1] / 1000) + 4, r });
    }
    const end = courbe(id, "stroke bold c-tint");
    if (end) etiquettes.push({ X: x(end[0]) + 4, Y: y(end[1] / 1000) + 4, r: id, cls: "fill c-tint" });
    /* labels at the ends of the lines, pushed apart (12 px) where several lines end together */
    etiquettes.sort((a, b) => a.X - b.X || a.Y - b.Y);
    etiquettes.forEach((e, i) => { const prev = etiquettes.slice(0, i).filter(o => Math.abs(o.X - e.X) < 60);
      for (const o of prev) if (e.Y < o.Y + 12) e.Y = o.Y + 12; });
    for (const e of etiquettes) Plot.el("text", Object.assign({ x: e.X, y: e.Y }, e.cls ? { class: e.cls } : {}), g).textContent = nom(e.r);
    /* the changes of state of the chosen couple */
    const r = E.ELLINGHAM[id];
    for (const s of Object.keys(r.nu)) for (const [Tt, , k] of E.CORPS[s].tr) {
      if (k === "allo" || Tt <= T1 || Tt >= fin(id)) continue;
      const G = E.drGE(id, Tt) / 1000;
      Plot.el("circle", { cx: x(Tt), cy: y(G), r: 4, class: "fill c-tint" }, g);
      Plot.el("text", { x: x(Tt) + 6, y: y(G) - 6 }, g).textContent = t("fig.tr." + k, { s: tx(s) });
    }
    Plot.el("line", { x1: x(T), x2: x(T), y1: y(Y[0]), y2: y(Y[1]), class: "ref" }, g);
    /* readouts at T */
    const G = T <= fin(id) ? E.drGE(id, T, modele) : null;
    $("vg").textContent = G === null ? "–" : kJ(G);
    $("fg").textContent = G === null ? t("fig.f.hors") : t("fig.f.g", { e: t("etat." + E.etatCorps(r.red, T)), s: tx(r.red) });
    if (G === null) { $("vp").textContent = "–"; $("fp").textContent = ""; }
    else {
      const p = E.pX2(id, T, modele);
      $("vp").textContent = F.qty(p < 1e-3 || p > 1e6 ? F.sci(p, 2) : F.num(p, 2), "Pa");
      $("fp").textContent = t(p < AIR * 1e5 ? "fig.f.oxyde" : "fig.f.metal");
    }
    const red = G === null ? [] : CHOIX.filter(o => o !== id && T <= fin(o)).filter(o => { const go = E.drGE(o, T, modele); return go !== null && go < G; });
    $("vred").textContent = red.length ? t("fig.liste", { l: [...new Set(red.map(o => tx(E.ELLINGHAM[o].red)))].join(", ") }) : t("fig.aucun");
  }
  $("couple").onchange = $("temp").oninput = draw;
  $("modele").querySelectorAll("button").forEach(b => b.onclick = () => { modele = b.dataset.m; draw(); });
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gibbs", 1876, "idea"], ["goldschmidt", 1895, "use"], ["essen", 1899, "use"], ["ellingham", 1944, "idea"], ["richardson", 1948, "idea"], ["en14730", 2017, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rails", "atmosphere", "choix"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pente", "b"], ["carbone", "c"], ["lecture", "a"], ["reduction", "d"], ["ebullition", "b"], ["pression", "c"], ["approx", "a"], ["cinetique", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1944 });
})();
</script>
