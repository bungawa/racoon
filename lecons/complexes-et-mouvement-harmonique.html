    <div class="eq"><math display="block"><mi>x</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>A</mi><mspace width="0.1em"/><mi data-i18n="eq.cos"></mi><mo stretchy="false">(</mo><mi>ω</mi><mi>t</mi><mo>+</mo><mi>φ</mi><mo stretchy="false">)</mo><mo>=</mo><mi data-i18n="eq.re"></mi><mo stretchy="false">(</mo><mover><mi>x</mi><mo>^</mo></mover><mspace width="0.1em"/><msup><mi>e</mi><mrow><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mo stretchy="false">)</mo><mo>,</mo><mspace width="1em"/><mover><mi>x</mi><mo>^</mo></mover><mo>=</mo><mi>A</mi><mspace width="0.1em"/><msup><mi>e</mi><mrow><mi>i</mi><mi>φ</mi></mrow></msup></math><span class="n">(23.1a)</span></div>

          <div class="ctl"><div class="row"><label for="tt" data-i18n="ph.t"></label><output id="ttv" for="tt"></output></div>

    <div class="eq"><math display="block"><mfrac><mrow><mi mathvariant="normal">d</mi><mi>x</mi></mrow><mrow><mi mathvariant="normal">d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi data-i18n="eq.re"></mi><mo stretchy="false">(</mo><mi>i</mi><mi>ω</mi><mspace width="0.1em"/><mover><mi>x</mi><mo>^</mo></mover><mspace width="0.1em"/><msup><mi>e</mi><mrow><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mo stretchy="false">)</mo><mo>,</mo><mspace width="1em"/><mfrac><mrow><msup><mi mathvariant="normal">d</mi><mn>2</mn></msup><mi>x</mi></mrow><mrow><mi mathvariant="normal">d</mi><msup><mi>t</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mi data-i18n="eq.re"></mi><mo stretchy="false">(</mo><mo>−</mo><msup><mi>ω</mi><mn>2</mn></msup><mspace width="0.1em"/><mover><mi>x</mi><mo>^</mo></mover><mspace width="0.1em"/><msup><mi>e</mi><mrow><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mo stretchy="false">)</mo></math><span class="n">(23.1b)</span></div>
    <p class="validite" data-i18n-html="val.23.1a"></p>
    <p data-i18n-html="s2.p2"></p>

    </div>
    <div class="eq"><math display="block"><mo stretchy="false">⟨</mo><mi>F</mi><mi>v</mi><mo stretchy="false">⟩</mo><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mspace width="0.1em"/><mi data-i18n="eq.re"></mi><mo stretchy="false">(</mo><mover><mi>F</mi><mo>^</mo></mover><mspace width="0.1em"/><msup><mover><mi>v</mi><mo>^</mo></mover><mo>*</mo></msup><mo stretchy="false">)</mo></math><span class="n">(23.1c)</span></div>
    <p class="validite" data-i18n-html="val.23.1b"></p>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi>m</mi><mspace width="0.1em"/><mfrac><mrow><msup><mi mathvariant="normal">d</mi><mn>2</mn></msup><mi>x</mi></mrow><mrow><mi mathvariant="normal">d</mi><msup><mi>t</mi><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mi>k</mi><mi>x</mi><mo>=</mo><msub><mi>F</mi><mn>0</mn></msub><mspace width="0.1em"/><mi data-i18n="eq.cos"></mi><mspace width="0.1em"/><mi>ω</mi><mi>t</mi><mo>=</mo><mi data-i18n="eq.re"></mi><mo stretchy="false">(</mo><mover><mi>F</mi><mo>^</mo></mover><mspace width="0.1em"/><msup><mi>e</mi><mrow><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mo stretchy="false">)</mo></math><span class="n">(23.2)</span></div>
    <p class="validite" data-i18n-html="val.23.2"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="eq"><math display="block"><mi>m</mi><mo stretchy="false">(</mo><mi>i</mi><mi>ω</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mspace width="0.1em"/><mover><mi>x</mi><mo>^</mo></mover><mo>+</mo><mi>k</mi><mspace width="0.1em"/><mover><mi>x</mi><mo>^</mo></mover><mo>=</mo><mover><mi>F</mi><mo>^</mo></mover><mspace width="1em"/><mo>⟹</mo><mspace width="1em"/><mover><mi>x</mi><mo>^</mo></mover><mo>=</mo><mfrac><mover><mi>F</mi><mo>^</mo></mover><mrow><mi>m</mi><mo stretchy="false">(</mo><msubsup><mi>ω</mi><mn>0</mn><mn>2</mn></msubsup><mo>−</mo><msup><mi>ω</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></mfrac></math><span class="n">(23.5)</span></div>

  <section class="card">

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §23-1 : le phaseur qui tourne et son ombre ---------- */
(() => {
  const A = 0.05, W = Osc.pulsation(20, 0.2), T = 2 * Math.PI / W;          // la boule, lâchée à 5 cm : ω₀ = 10 rad·s⁻¹
  const TS = Array.from({ length: 241 }, (_, i) => T * i / 240);
  function upd() {
    const phi = +$("phi").value * Math.PI / 12, tt = +$("tt").value * T, P = Resonance.phaseur(A, phi, W), th = W * tt;
    /* complex plane, in units of A: x̂e^(iωt), v̂e^(iωt)/ω, âe^(iωt)/ω² */
    let svg = $("plan"); svg.innerHTML = "";
    let o = Plot.axes(svg, { fmt: F, w: 300, h: 292, pad: { l: 40, r: 16, t: 12, b: 36 }, x: { domain: [-1.3, 1.3], label: t("plan.xaxis") }, y: { domain: [-1.3, 1.3], label: t("plan.yaxis") } });
    Plot.el("circle", { cx: o.x(0), cy: o.y(0), r: o.x(1) - o.x(0), class: "stroke thin dash c-label-2" }, o.g);
    const vec = (re, im, cls) => {
      const c = Math.cos(th), s = Math.sin(th), X = (re * c - im * s) / A, Y = (re * s + im * c) / A;
      Plot.el("line", { x1: o.x(0), y1: o.y(0), x2: o.x(X), y2: o.y(Y), class: "stroke " + cls }, o.g);
      Plot.el("line", { x1: o.x(X), y1: o.y(Y), x2: o.x(X), y2: o.y(0), class: "stroke thin dash " + cls }, o.g);
      Plot.el("circle", { cx: o.x(X), cy: o.y(0), r: 4, class: "fill " + cls }, o.g);
    };
    vec(P.a.re / (W * W), P.a.im / (W * W), "c-label-2"); vec(P.v.re / W, P.v.im / W, "c-warn"); vec(P.x.re, P.x.im, "c-tint");
    /* the shadows against time, over one period */
    svg = $("temps"); svg.innerHTML = "";
    o = Plot.axes(svg, { fmt: F, w: 300, h: 292, pad: { l: 40, r: 16, t: 12, b: 36 }, x: { domain: [0, T], label: t("temps.xaxis") }, y: { domain: [-1.3, 1.3], label: t("temps.yaxis") } });
    Plot.el("path", { d: path(TS.map(s => [o.x(s), o.y(P.at(s) / (A * W * W))])), class: "stroke thin c-label-2" }, o.g);
    Plot.el("path", { d: path(TS.map(s => [o.x(s), o.y(P.vt(s) / (A * W))])), class: "stroke c-warn" }, o.g);
    Plot.el("path", { d: path(TS.map(s => [o.x(s), o.y(P.xt(s) / A)])), class: "stroke bold c-tint" }, o.g);
    Plot.el("line", { x1: o.x(tt), x2: o.x(tt), y1: o.y(-1.3), y2: o.y(1.3), class: "stroke thin dash c-label" }, o.g);
    /* readouts */
    $("phiv").textContent = F.qty(F.num(phi, 3), "rad");
    $("ttv").textContent = F.si(tt, "s");
    $("vx").textContent = F.si(P.xt(tt), "m"); $("vv").textContent = F.si(P.vt(tt), "m·s⁻¹"); $("va").textContent = F.si(P.at(tt), "m·s⁻²");
    $("fa").textContent = t("ph.f.a", { v: F.si(-W * W * P.xt(tt), "m·s⁻²") });
  }
  $("phi").oninput = $("tt").oninput = upd; upd();
})();

/* ---------- quand la méthode s'applique ---------- */
(() => { const IDS = ["lineaire", "frottement", "etabli"]; keyed($("conditions"), t("conditions.tag"), IDS, textOf("conditions.items", IDS)); })();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cotes", 1714, "idea"], ["euler", 1748, "idea"], ["wessel", 1797, "idea"], ["steinmetz", 1893, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["impedances", "iq"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["reel", "b"], ["derivee", "c"], ["vitesse", "a"], ["produit", "d"], ["phase", "b"], ["lineaire", "c"], ["module", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 231 });
})();
</script>
