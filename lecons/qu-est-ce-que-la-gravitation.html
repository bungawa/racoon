<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), Gr = Gravitation, Cst = Constantes;

/* ---------- électricité contre gravitation ---------- */
(() => {
  const ROWS = ["ee", "pp"], txt = textOf("rap.rows", ROWS);
  const V = { ee: F.sci(Gr.electricOverGravity(Cst.e, Cst.m_e), 3), pp: F.sci(Gr.electricOverGravity(Cst.e, Cst.m_p), 3) };
  $("rapports").innerHTML = ROWS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text.replace("{v}", V[id])}</span></div>`).join("");
})();

/* ---------- le principe d'équivalence mis à l'épreuve ---------- */
(() => {
  const svg = $("eta"), sl = $("esl"), E = Gr.EOTVOS, H = 1000, names = textOf("eta.who", E.map(e => e.id));
  /* sizes to compare the gap with: [id, metres] */
  const SIZES = [["cheveu", 1e-4], ["atome", 1e-10], ["noyau", 1e-15]], sizes = textOf("eta.sizes", SIZES.map(s => s[0]));
  function draw() {
    const eta = Math.pow(10, +sl.value), r = Gr.eotvos(eta, H);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { scale: "lin", domain: [1660, 2040], ticks: 8, label: t("eta.x") }, y: { scale: "log", domain: [1e-16, 1e-2], label: t("eta.y") } });
    let d = "";
    E.forEach((e, i) => { d += (i ? "L" : "M") + x(e.year).toFixed(1) + " " + y(e.eta).toFixed(1); });
    Plot.el("path", { d, class: "curve" }, g);
    E.forEach(e => {
      Plot.el("circle", { cx: x(e.year), cy: y(e.eta), r: 5, class: "dot" }, g);
      const last = e.year > 2015; Plot.el("text", { x: x(e.year) + (last ? -9 : 7), y: y(e.eta) + (last ? 4 : -7), "text-anchor": last ? "end" : "start", class: "tick" }, g).textContent = names[e.id];
    });
    Plot.el("line", { x1: x(1660), x2: x(2040), y1: y(eta), y2: y(eta), class: "ref" }, g);
    $("eread").textContent = F.sci(eta, 2);
    $("vgap").textContent = F.si(r.gap, "m");
    const near = SIZES.find(s => r.gap >= s[1] / 3) || null;
    $("fgap").textContent = near ? t("eta.f.size", { what: sizes[near[0]] }) : t("eta.f.tiny");
    $("vda").textContent = F.qty(F.sci(r.da, 2), "m·s⁻²");
    const first = E.find(e => e.eta < eta);
    $("vver").textContent = first ? t("eta.v.exclu") : t("eta.v.permis");
    $("fver").textContent = first ? t("eta.f.exclu", { who: names[first.id], year: String(first.year) }) : t("eta.f.permis");
  }
  sl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1687, "experiment"], ["bentley", 1693, "idea"], ["lesage", 1758, "idea"], ["eotvos", 1909, "experiment"], ["dicke", 1964, "experiment"], ["microscope", 2022, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["microscope", "station"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["mecanisme", "a"], ["lesage", "a"], ["champ", "a"], ["neutre", "a"], ["chute", "a"], ["station", "a"], ["eta", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 77 });
})();
</script>
