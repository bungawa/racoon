<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, sym = s => t("chim.sym", { s }), $ = id => document.getElementById(id);
const peindre = (svg, d) => { svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };

/* ---------- mécanismes : flèches courbes ---------- */
(() => {
  const sn2 = O.mol("O -2.3 0 q-1; C 0 0; Br 1 0; C -0.5 0.866; C -1.5 0.866; C -0.35 -0.94; H -0.94 -0.34 | 1-2 1-3 3-4 1h5 1w6");
  peindre($("mecaSN2"), O.schema(sn2, { texte: sym, echelle: 36, fleches: [{ de: 0, vers: [0, 1] }, { de: [1, 2], vers: 2 }], doublets: [0, 2] }));
  const sn1a = O.mol("C 0 0; Br 1 0; C -0.5 0.866; C -1.5 0.866; C -0.35 -0.94; C -0.94 -0.34; C -1.8 -0.84; C -2.67 -0.34 | 0-1 0-2 2-3 0w4 0h5 5-6 6-7");
  peindre($("mecaSN1a"), O.schema(sn1a, { texte: sym, echelle: 36, fleches: [{ de: [0, 1], vers: 1 }], doublets: [1] }));
  const sn1b = O.mol("C 0 0 q+1; C 0 1; C -0.866 1.5; C -0.866 -0.5; C 0.866 -0.5; C 1.732 0; C 2.598 -0.5; O -2.2 0.25 q-1 | 0-1 1-2 0-3 0-4 4-5 5-6");
  peindre($("mecaSN1b"), O.schema(sn1b, { texte: sym, echelle: 36, fleches: [{ de: 7, vers: [7, 0], cote: -1, courbure: 0.3 }], doublets: [7] }));
})();

/* ---------- stéréochimie : choisir substrat, nucléophile, mécanisme ---------- */
(() => {
  const SUB = ["bromomethane", "bromobutane", "bromofluoroethane", "bromomethylhexane"], noms = textOf("st.substrats", SUB);
  const NU = Object.keys(O.NUCLEOPHILES), nus = textOf("st.nucleophiles", NU);
  $("sub").innerHTML = SUB.map(id => `<option value="${id}">${noms[id]}</option>`).join("");
  $("sub").value = "bromobutane";
  $("nu").innerHTML = NU.map((id, k) => `<button type="button" data-v="${id}" aria-pressed="${k === 0}">${nus[id]}</button>`).join("");
  let nu = NU[0], mec = "SN2";
  const desc = m => { const c = Object.values(O.descripteurs(m).centres); return c.length ? t("st.centre", { d: c.join(", ") }) : t("st.achiral"); };
  function maj() {
    const id = $("sub").value, m = O.molecule(id), ps = O.sn(m, 0, mec, nu), cl = O.classeCarbone(m, 0);
    peindre($("substrat"), O.dessin(m, { texte: sym, echelle: 40, surligne: [0] }));
    $("stS").textContent = t("st.lu", { n: noms[id], f: O.ecrireFormule(O.formuleBrute(m)), d: desc(m), c: t("st.classe." + cl) });
    $("produits").innerHTML = ps.map(() => `<div><svg class="fig no-sigle" role="img" aria-label="${t("st.ariaP")}"></svg><p class="readout"></p></div>`).join("");
    [...$("produits").children].forEach((div, k) => {
      peindre(div.querySelector("svg"), O.dessin(ps[k].m, { texte: sym, echelle: 40 }));
      div.querySelector("p").textContent = t("st.produit", { f: O.ecrireFormule(O.formuleBrute(ps[k].m)), d: desc(ps[k].m), p: F.qty(F.fix(100 * ps[k].part, 0), "%") });
    });
    const rel = ps.length === 2 ? O.relationStereo(ps[0].m, ps[1].m) : null;
    const lettre = (a, b) => { const x = Object.values(O.descripteurs(a).centres)[0], y = Object.values(O.descripteurs(b).centres)[0]; return x && y ? (x === y ? "meme" : "change") : "aucune"; };
    let v = mec === "SN2" ? t("st.v.SN2." + lettre(m, ps[0].m)) : t(rel === "enantiomeres" ? "st.v.SN1.racemique" : "st.v.SN1.identiques");
    v += " " + t("st.plaus." + mec + "_" + cl);
    $("stVerdict").textContent = v;
    document.querySelectorAll("#nu button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === nu)));
    document.querySelectorAll("#mec button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === mec)));
  }
  $("sub").onchange = maj;
  $("nu").onclick = e => { const b = e.target.closest("button"); if (b) { nu = b.dataset.v; maj(); } };
  $("mec").onclick = e => { const b = e.target.closest("button"); if (b) { mec = b.dataset.v; maj(); } };
  maj();
})();

/* ---------- deux voies en parallèle : part de la SN2 en fonction de [Nu⁻] ---------- */
(() => {
  const svg = $("courbe"), cnu = $("cnu"), cs = $("cstar");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 460, h: 260, pad: { b: 44 },
    x: { scale: "log", domain: [1e-3, 10], label: t("ci.x") }, y: { domain: [0, 1], label: t("ci.y") } });
  const courbe = Plot.el("path", { class: "curve" }, g), dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  const mi = Plot.el("line", { class: "grid" }, g);
  const pct = v => F.qty(F.fix(100 * v, 0), "%"), conc = v => F.qty(F.num(v, 2), "mol·L⁻¹");
  function maj() {
    const nu = Math.pow(10, +cnu.value), c = Math.pow(10, +cs.value), k2 = 1, k1 = c * k2, pts = [];
    for (let e = -3; e <= 1.0001; e += 0.04) pts.push([x(Math.pow(10, e)), y(O.partSN2(k1, k2, Math.pow(10, e)))]);
    courbe.setAttribute("d", Plot.path(pts));
    const p = O.partSN2(k1, k2, nu), rx = 0.1;
    dot.setAttribute("cx", x(nu)); dot.setAttribute("cy", y(p));
    mi.setAttribute("x1", x(c)); mi.setAttribute("x2", x(c)); mi.setAttribute("y1", y(0)); mi.setAttribute("y2", y(1));
    $("cnuRead").textContent = conc(nu); $("cstarRead").textContent = conc(c);
    $("part").textContent = pct(p);
    $("double").textContent = "× " + F.fix(O.vitesseSN(k1, k2, rx, 2 * nu) / O.vitesseSN(k1, k2, rx, nu), 2);
    $("ee").textContent = pct(p);
  }
  cnu.oninput = maj; cs.oninput = maj; maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["walden", 1896, "experiment"], ["radio", 1935, "experiment"], ["sn1", 1940, "idea"], ["fdg", 1986, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tep", "labo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ordre", "c"], ["walden", "a"], ["lettre", "d"], ["tertiaire", "b"], ["racemique", "c"], ["mixte", "a"], ["solvant", "d"], ["nucleofuge", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
