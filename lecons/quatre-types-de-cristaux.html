<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, X = Cristaux, CA = ChimArchi, Cst = Constantes, ES = Electrostatique;
const keyed = (el, tags, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tags[id] || tags}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); };
const pm = x => F.qty(F.num(x * 1e12, 4), "pm"), kjmol = x => F.qty(F.num(x / 1e3, 3), "kJ·mol⁻¹");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- quatre modèles ---------- */
(() => { const IDS = ["metallique", "ionique", "covalent", "moleculaire"]; keyed($("modeles"), t("mod.tag"), IDS, textOf("mod.items", IDS)); })();

/* ---------- quatre cristaux en 3D ---------- */
(() => {
  /* E : énergie de cohésion vers les entités du cristal, J·mol⁻¹. Cu, C : ΔfH° du gaz monoatomique (clés CODATA) ; NaCl : cycle
     de Born–Haber (ChimArchi.bornHaber) ; CO2 : enthalpie de sublimation à 195 K (Giauque et Egan, 1937, via NIST). */
  const S = { Cu: X.STRUCTURES.Cu, NaCl: X.STRUCTURES.NaCl, diamant: X.STRUCTURES.diamant, CO2: CA.CO2 };
  const E = { Cu: 337.4e3, NaCl: CA.bornHaber("NaCl").dH, diamant: 716.68e3, CO2: 25.2e3 };
  const TYPE = { Cu: "metallique", NaCl: "ionique", diamant: "covalent", CO2: "moleculaire" };
  const COUL = { Na: "--tint", Cl: "--el-o", Cu: "--tint", C: "--el-c", O: "--el-o" }, CLS = { Na: "c-tint", Cl: "el-o", Cu: "c-tint", C: "el-c", O: "el-o" };
  const RAY = { NaCl: { Na: 0.33, Cl: 0.5 }, Cu: { Cu: 0.45 }, diamant: { C: 0.3 }, CO2: { C: 0.28, O: 0.3 } };
  const vue = VueCristal.monter($("vue"), $("vueinfo"), { hors: t("v3.hors"), reduit: reduce });
  seg($("structures"), "s", nom => {
    const s = S[nom], e0 = s.motif[0].e;
    // CO2 : la plus courte distance entre deux molécules, O d'une molécule à O d'une autre, et le C=O de la molécule
    let d = X.voisins(s, e0).d, z = X.voisins(s, e0).z, inter = null;
    if (nom === "CO2") {
      const at = X.atomes(s, 2), os = at.filter(a => a.e === "O"), c = at.find(a => a.e === "C" && a.r.every(x => Math.abs(x - s.a) < 1e-15));
      const dist = (p, q) => Math.hypot(p.r[0] - q.r[0], p.r[1] - q.r[1], p.r[2] - q.r[2]);
      const mol = os.filter(o => dist(o, c) < 1.5e-10); d = dist(mol[0], c);
      inter = Math.min(...os.filter(o => !mol.includes(o)).map(o => dist(o, mol[0])));
    }
    if (vue) vue.montrer(X.atomes(s, 2), { dLiaison: d, maille: s.a, rayons: RAY[nom], couleurs: COUL });
    $("vtype").textContent = t("type." + TYPE[nom]);
    $("fentite").textContent = t("v3.entite." + nom);
    $("vd").textContent = pm(d);
    $("fd").textContent = nom === "CO2" ? t("v3.f.dCO2", { d: pm(inter) }) : t("v3.f.d", { z });
    $("vE").textContent = kjmol(E[nom]);
    $("fE").textContent = t("v3.f.E." + nom);
    $("vX").textContent = F.num(CA.cohesionSurRT(E[nom], 298.15), 3);
    $("legende").innerHTML = [...new Set(s.motif.map(m => m.e))].map(e => `<span class="${CLS[e]}">${t("v3.e." + e)}</span>`).join("");
  });
})();

/* ---------- faire glisser un plan sur un autre ---------- */
(() => {
  /* Un plan (100) du sel au-dessus d'un autre, à la distance d : chaque ion du plan du haut voit les rangées alternées du plan du
     bas, à la distance √(1 + k²) d, de signes alternés en k. Potentiel d'une rangée : ES.ligneAlternee (série de Fourier, exacte). */
  const d = CA.distanceIons("NaCl"), u0 = CA.KC / d;           // N_A e²/(4π ε0 d), J·mol⁻¹
  const plan = u => { let s = 0; for (let k = -4; k <= 4; k++) s += (k % 2 ? -1 : 1) * ES.ligneAlternee(Math.hypot(1, k), u); return -s; };
  const E0 = plan(0), dE = u => (plan(u) - E0) * u0;
  const svg = $("glisse"), rg = $("rangees"), sl = $("usl"), N = 9;
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44 }, x: { domain: [0, 1], label: t("gl.x"), fmt: v => F.num(v, 2) },
    y: { domain: [-10, 80], label: t("gl.y") } });
  const pts = Array.from({ length: 101 }, (_, i) => [x(i / 100), y(dE(i / 100) / 1e3)]);
  P("path", { d: Plot.path(pts), class: "stroke bold" }, P("g", { class: "c-tint" }, g));
  P("path", { d: Plot.path([[x(0), y(0)], [x(1), y(0)]]), class: "stroke" }, P("g", { class: "c-ok" }, g));
  const dot = P("circle", { r: 6, class: "fill" }, P("g", { class: "c-tint" }, g));
  function draw() {
    const u = +sl.value / 100, e = dE(u);
    rg.innerHTML = "";
    const pas = 640 / (N + 1), r = 0.42 * pas, yb = 105, yh = 45;
    for (let n = 0; n < N; n++) {
      P("circle", { cx: pas * (n + 1), cy: yb, r: n % 2 ? r * 0.62 : r, class: "fill " + (n % 2 ? "c-tint" : "el-o") }, rg);
      const xh = pas * (n + 1 + u);
      if (xh < 640 - r) P("circle", { cx: xh, cy: yh, r: n % 2 ? r : r * 0.62, class: "fill " + (n % 2 ? "el-o" : "c-tint") }, rg);
    }
    dot.setAttribute("cx", x(u)); dot.setAttribute("cy", y(e / 1e3));
    $("uread").textContent = F.num(u, 2);
    $("vion").textContent = F.qty(F.num(e / 1e3, 3), "kJ·mol⁻¹");
    $("vmetal").textContent = F.qty("0", "kJ·mol⁻¹");
  }
  sl.oninput = draw; draw();
})();

/* ---------- propriétés ---------- */
(() => { const IDS = ["conduction", "marteau", "durete", "fusion", "eau"]; keyed($("proprietes"), t("prop.tag"), IDS, textOf("prop.items", IDS)); })();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["drude", 1900, "idea"], ["laue", 1912, "experiment"], ["bragg", 1913, "experiment"], ["lewis", 1916, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["silicium", "carboglace"];
  keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["entites", "b"], ["sel", "c"], ["marteau", "a"], ["carboglace", "d"], ["nombre", "b"], ["diamant", "c"], ["fondu", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 41 });
})();
</script>
