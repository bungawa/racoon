<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
const pct = e => F.qty(F.num(100 * e, 3), "%");

/* ---------- where the energy is: ρφ/2 against ε0E²/2, energy per metre of radius and energy inside r ---------- */
(() => {
  const svg = $("ou"), rsl = $("rsl"), Q = 1, a = 1, U0 = ES.K * Q * Q / a, RMAX = 4;
  const P = { uniforme: ES.profilEnergie(ES.BOULES.uniforme(Q, a), a), parabolique: ES.profilEnergie(ES.BOULES.parabolique(Q, a), a),
    coquille: ES.profilEnergie(ES.BOULES.coquille(Q, 0.7, a), a) };
  const us = Array.from({ length: 801 }, (_, i) => RMAX * i / 800);
  let nom = "uniforme";
  function draw() {
    const r = +rsl.value / 100, p = P[nom];
    const yc = us.map(u => p.densiteChamp(u) / U0), yr = us.map(u => p.densiteRhoPhi(u) / U0), top = 1.1 * Math.max(...yc, ...yr);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44 }, x: { domain: [0, RMAX], label: t("ou.x"), fmt: v => F.num(v, 2) }, y: { domain: [0, top], label: t("ou.y"), fmt: v => F.num(v, 2) } });
    const curve = (ys, cls) => {
      const gg = Plot.el("g", { class: cls }, g), inside = us.map((u, i) => [u, ys[i]]).filter(([u]) => u <= r);
      if (inside.length > 1) Plot.el("path", { d: Plot.path(inside.map(([u, v]) => [x(u), y(v)]).concat([[x(inside[inside.length - 1][0]), y(0)], [x(0), y(0)]])), class: "fill", opacity: "0.25" }, gg);
      Plot.el("path", { d: Plot.path(us.map((u, i) => [x(u), y(ys[i])])), class: "stroke" }, gg);
    };
    curve(yc, "c-tint"); curve(yr, "c-warn");
    Plot.el("line", { x1: x(1), x2: x(1), y1: y(0), y2: y(top), class: "stroke thin dash" }, Plot.el("g", { class: "c-label-2" }, g));
    $("rread").textContent = F.num(r, 3);
    $("vchamp").textContent = pct(p.champ(r) / p.total);
    $("vrhophi").textContent = pct(p.rhoPhi(r) / p.total);
    $("vsurface").textContent = pct(p.surface(r) / p.total);
  }
  document.querySelectorAll("#dist button").forEach(b => b.onclick = () => {
    nom = b.dataset.d; document.querySelectorAll("#dist button").forEach(z => z.setAttribute("aria-pressed", z === b)); draw(); });
  rsl.oninput = draw; draw();
})();

/* ---------- le système décrit : l'air, par beau temps et au claquage ---------- */
(() => {
  const u = E => ES.EPS0 * E * E / 2, P0 = 101325;
  $("sys1").innerHTML = t("sys1.body", { u1: F.si(u(100), "J·m⁻³"), u2: F.si(u(3e6), "J·m⁻³"), rap: F.sci(u(3e6) / P0, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1865, "idea"], ["poynting", 1884, "idea"], ["einstein", 1905, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["capacite", "claquage"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["demi", "b"], ["vide", "a"], ["dehors", "d"], ["surface", "c"], ["double", "a"], ["air", "b"], ["choix", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 85 });
})();
</script>
