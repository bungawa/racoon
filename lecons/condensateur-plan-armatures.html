<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-electrostatique" data-i18n="monde.electrostatique"></a><span class="aux">›</span><a href="/racoon/etape?id=condensateur-plan" data-i18n="etape.condensateur-plan"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>V</mi><mo>=</mo><mi>E</mi><mi>d</mi><mo>=</mo><mfrac><mi>σ</mi><msub><mi>ε</mi><mn>0</mn></msub></mfrac><mi>d</mi><mo>=</mo><mfrac><mi>d</mi><mrow><msub><mi>ε</mi><mn>0</mn></msub><mi>A</mi></mrow></mfrac><mi>Q</mi></math><span class="n">(6.33)</span></div>
    <p class="validite" data-i18n-html="val.6.33"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mi>Q</mi><mo>=</mo><mi>C</mi><mi>V</mi><mo>,</mo><mspace width="1em"/><mi>C</mi><mo>=</mo><mfrac><mrow><msub><mi>ε</mi><mn>0</mn></msub><mi>A</mi></mrow><mi>d</mi></mfrac></math><span class="n">(6.34)</span></div>
    <p class="validite" data-i18n-html="val.6.34"></p>

      <p id="sys1"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>C</mi><mo>≈</mo><mfrac><mrow><msub><mi>ε</mi><mn>0</mn></msub><mi>π</mi><msup><mi>a</mi><mn>2</mn></msup></mrow><mi>d</mi></mfrac><mo>+</mo><msub><mi>ε</mi><mn>0</mn></msub><mi>a</mi><mrow><mo>(</mo><mi data-i18n="eq.ln"></mi><mfrac><mrow><mn>16</mn><mi>π</mi><mi>a</mi></mrow><mi>d</mi></mfrac><mo>−</mo><mn>1</mn><mo>)</mo></mrow></math></div>
    <p class="validite" data-i18n-html="val.kirchhoff"></p>
    <p data-i18n-html="s2.p2"></p>
    <figure>
      <svg class="fig" id="carte" role="img" data-i18n-attr="aria-label:carte.aria"></svg>
      <svg class="fig" id="sig" viewBox="0 0 640 260" role="img" data-i18n-attr="aria-label:sig.aria"></svg>
      <div class="legend"><span class="c-warn" data-i18n="sig.legend.calcul"></span><span class="c-label" data-i18n="sig.legend.ideal"></span></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="dsl" data-i18n="ctl.d"></label><output id="dread" for="dsl"></output></div>
          <input id="dsl" type="range" min="-2" max="0" step="0.01" value="-1.7"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="k.calcul"></span><span class="v" id="vc"></span><span class="f" id="fc"></span></div>
          <div class="stat"><span class="k" data-i18n="k.ideal"></span><span class="v" id="vi"></span><span class="f" id="fi"></span></div>
          <div class="stat"><span class="k" data-i18n="k.kirchhoff"></span><span class="v" id="vk"></span><span class="f" id="fk"></span></div>
        </div>

    </figure>

  <section class="card">

  <section class="card">

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>

<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/condensateur-plan-armatures.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/physique-fondamentale.js"></script>
<script src="/racoon/lecons/champs-em.js"></script>

<script src="/racoon/carte-champ.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;

/* ---------- le système décrit : deux plaques de 1 cm² à 1 mm ---------- */
(() => {
  const A = 1e-4, d = 1e-3, a = Math.sqrt(A / Math.PI), s = ES.condensateurDisques(a, d);
  $("sys1").innerHTML = t("sys1.body", { C0: F.si(s.ideale, "F", { prefix: "p" }), r: F.num(d / a, 2), C: F.si(s.capacite, "F", { prefix: "p" }),
    e: F.num(100 * (s.capacite / s.ideale - 1), 2) });
})();

/* ---------- le bord des armatures : deux disques de 5 cm de rayon ---------- */
(() => {
  const a = 0.05, svg = $("carte"), sg = $("sig"), dsl = $("dsl");
  let pending = false;
  function carte(d) {
    const s = ES.condensateurDisques(a, d, 30, 3), w = Math.min(1.5 * a, 4 * d), hx = 1.2 * w, hz = hx * 300 / 640;
    const O = { W: 640, H: 300, x0: a - hx, x1: a + hx, y0: -hz, y1: hz }, c = CarteChamp.carte(svg, O);
    const vals = [-0.45, -0.35, -0.25, -0.15, -0.05, 0.05, 0.15, 0.25, 0.35, 0.45, 0];
    CarteChamp.niveaux(c, p => s.potentiel(p[0], p[1]), vals, { cls: "c-tint", n: [96, 48], epais: 10 });
    const g = c.layer("c-warn");
    [d / 2, -d / 2].forEach(z => Plot.el("line", { x1: c.sx(Math.max(O.x0, -a)).toFixed(1), x2: c.sx(a).toFixed(1), y1: c.sy(z).toFixed(1), y2: c.sy(z).toFixed(1), class: "stroke" }, g));
    if (O.x0 < 0) Plot.el("line", { x1: c.sx(0), x2: c.sx(0), y1: 0, y2: O.H, class: "stroke thin dash c-label" }, c.layer("c-label"));
  }
  function courbe(s) {
    sg.innerHTML = "";
    const { x, y, g } = Plot.axes(sg, { fmt: F, w: 640, h: 260, x: { domain: [0, 1], label: t("sig.x") }, y: { scale: "log", domain: [0.5, 100], label: t("sig.y") } });
    const pts = []; s.sigma.forEach((v, k) => { const r = v / s.sigmaIdeale; pts.push([x(s.bords[k] / a), y(Math.min(100, r))], [x(s.bords[k + 1] / a), y(Math.min(100, r))]); });
    Plot.el("path", { d: Plot.path(pts), class: "stroke c-warn" }, g);
    Plot.el("line", { x1: x(0), x2: x(1), y1: y(1), y2: y(1), class: "stroke thin dash c-label" }, g);
  }
  function draw() {
    const d = a * Math.pow(10, +dsl.value), s = ES.condensateurDisques(a, d);
    $("dread").textContent = t("ctl.dv", { d: F.si(d, "m", { prefix: "m" }), r: F.num(d / a, 2) });
    $("vc").textContent = F.si(s.capacite, "F", { prefix: "p" });
    $("fc").textContent = t("f.calcul", { s: F.num(s.sigma[s.sigma.length - 1] / s.sigmaIdeale, 2) });
    $("vi").textContent = F.si(s.ideale, "F", { prefix: "p" });
    $("fi").textContent = t("f.ideal", { e: F.num(100 * (1 - s.ideale / s.capacite), 2) });
    $("vk").textContent = F.si(s.kirchhoff, "F", { prefix: "p" });
    $("fk").textContent = t("f.kirchhoff", { e: F.num(100 * (s.kirchhoff / s.capacite - 1), 2) });
    courbe(s);
    if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; carte(a * Math.pow(10, +dsl.value)); }); }
  }
  dsl.oninput = draw; draw();
})();

/* ---------- capacité d'un objet seul : la Terre ---------- */
(() => {
  const R = Constantes.R_E_mean, C = 4 * Math.PI * ES.EPS0 * R;
  $("s3p2").innerHTML = t("s3.p2", { C: F.si(C, "F", { prefix: "µ" }), R: F.si(R, "m", { prefix: "k" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kleist", 1745, "experiment"], ["musschenbroek", 1746, "experiment"], ["kirchhoff", 1877, "idea"], ["farad", 1881, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["accelerometre", "tactile"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["double", "b"], ["ecart", "d"], ["exterieur", "a"], ["bord", "c"], ["kirchhoff", "a"], ["loin", "b"], ["terre", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 610 });
})();
</script>
</body>
</html>
