<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, D = 30;

/* ---------- the probability of two magnons at a distance d, for three rules ---------- */
(() => {
  const svg = $("fig"), s1 = $("s1"), s2 = $("s2");
  function draw() {
    const k1 = +s1.value, k2 = +s2.value;
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 }, x: { domain: [0, D], label: t("fig.xaxis") }, y: { domain: [0, 4], label: t("fig.yaxis"), ticks: 4 } });
    for (const [stat, cls] of [["discernables", "c-label-2"], ["bosons", "c-label"], ["fermions", "c-warn"]]) {
      const pts = [];
      for (let i = 0; i <= 300; i++) { const d = D * i / 300; pts.push([G.x(d), G.y(Q.paireMagnons(k1, k2, d, stat))]); }
      Plot.el("path", { d: Plot.path(pts), class: (stat === "discernables" ? "stroke thin dash " : "stroke ") + cls }, G.g);
      const gd = Plot.el("g", { class: cls }, G.g);
      for (let d = 1; d <= D; d++) Plot.el("circle", { cx: G.x(d), cy: G.y(Q.paireMagnons(k1, k2, d, stat)), r: 2.5, class: "fill" }, gd);
    }
    $("s1r").textContent = F.num(k1, 3);
    $("s2r").textContent = F.num(k2, 3);
    $("vp").textContent = t("fig.v.proche", { b: F.num(Q.paireMagnons(k1, k2, 1, "bosons") / 2, 3), f: F.num(Q.paireMagnons(k1, k2, 1, "fermions") / 2, 3) });
    $("fp").textContent = t("fig.f.proche");
    const dk = Math.abs(k1 - k2);
    $("vm").textContent = dk < 1e-9 ? t("fig.v.meme0") : F.num(2 * Math.PI / dk, 3);
    $("fm").textContent = t("fig.f.meme");
  }
  s1.oninput = draw; s2.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  $("sys1").innerHTML = t("sys1.body", { l: F.num(2 * Math.PI / 0.01, 3) });
  $("sys2").innerHTML = t("sys2.body");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dyson", 1956, "idea"], ["nikuni", 2000, "experiment"], ["demokritov", 2006, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["condensat"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["identiques", "c"], ["symetrique", "a"], ["fermions", "d"], ["regroupe", "b"], ["energie", "a"], ["bosons", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1503 });
})();
</script>
