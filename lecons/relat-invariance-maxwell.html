<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const E4 = Electro4D, c = Constantes.c;

/* ---------- une onde plane relue depuis un référentiel qui avance à u ---------- */
(() => {
  const svg = $("trace"), su = $("su"), seg = $("mode"), lambda = 1;
  let mode = "lorentz";
  const US = Array.from({ length: 37 }, (_, i) => -0.9 + 1.8 * i / 36);
  const curves = {};
  for (const tr of ["lorentz", "galilee"]) curves[tr] = US.map(b => E4.ondeVue({ lambda, u: b * c, transfo: tr }).residus);
  /* a mismatch is shown as 0 below 1e-9: what is left there is the rounding of the differences */
  const show = x => (x < 1e-9 ? "0" : F.num(x, 2));
  function draw() {
    const b = +su.value / 100, o = E4.ondeVue({ lambda, u: b * c, transfo: mode }), r = o.residus, k0 = 2 * Math.PI / lambda;
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 60, b: 44 }, x: { domain: [-0.9, 0.9], label: t("fig.xaxis") }, y: { domain: [0, 1], label: t("fig.yaxis") } });
    const cur = curves[mode];
    Plot.el("path", { d: Plot.path(US.map((u, i) => [A.x(u), A.y(cur[i].dalembert[2])])), class: "curve" }, A.g);
    Plot.el("path", { d: Plot.path(US.map((u, i) => [A.x(u), A.y(Math.min(1, cur[i].ampere))])), class: "stroke" }, Plot.el("g", { class: "c-warn" }, A.g));
    Plot.el("path", { d: Plot.path(US.map((u, i) => [A.x(u), A.y(cur[i].lorenz)])), class: "stroke" }, Plot.el("g", { class: "c-ok" }, A.g));
    Plot.el("circle", { cx: A.x(b), cy: A.y(r.dalembert[2]), r: 5, class: "dot" }, A.g);
    $("sur").textContent = F.num(b, 2) + "\u00a0c";
    $("vonde").textContent = t("fig.onde", { k: F.num(o.k / k0, 4), w: F.num(o.omega / (c * k0), 4) });
    $("fonde").textContent = t(mode === "lorentz" ? "fig.f.onde.l" : "fig.f.onde.g");
    $("vphase").textContent = t("fig.phase", { v: F.num(o.vPhase / c, 4) });
    $("fphase").textContent = t("fig.f.phase", { r: F.num(o.rapport, 4) });
    $("vdal").textContent = t("fig.dal", { d: show(r.dalembert[2]), a: show(r.ampere) });
    $("fdal").textContent = t("fig.f.dal", { f: show(r.faraday), l: show(r.lorenz) });
    $("vu").textContent = show(r.U);
    $("fu").textContent = t(r.U < 1e-9 ? "fig.f.u0" : "fig.f.u");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; draw(); });
  su.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["voigt", 1887, "idea"], ["lorentz", 1904, "idea"], ["poincare", 1905, "idea"], ["nagel", 2015, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tests"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["contenu", "c"], ["u", "a"], ["vecteur", "d"], ["galilee", "b"], ["faraday", "c"], ["doppler", "a"], ["lorentz", "b"], ["nouvelle", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 256 });
})();
</script>
