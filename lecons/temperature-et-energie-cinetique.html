<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- mélange de deux gaz : des chocs au hasard, et rien d'autre ---------- */
(() => {
  const S = Statistique, { k_B, u } = Constantes, N = 400, T1 = 100, T2 = 500, XMAX = 8, rand = Quiz.rng(29);
  const svg = $("courbes"), smr = $("mr"), sp = $("paires");
  const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
    x: { domain: [0, XMAX], label: t("sim.x") }, y: { domain: [0, 600], label: t("sim.y") } });
  const c1 = Plot.el("path", { class: "stroke c-tint" }, o.g), c2 = Plot.el("path", { class: "stroke c-warn" }, o.g);
  const moy = Plot.el("line", { class: "ref" }, o.g);
  let s, pts, run = false, m1, m2;
  const Tde = e => 2 * e / (3 * k_B);
  function raz() {
    m1 = 4 * u; m2 = +smr.value * 4 * u; run = false;
    s = S.melange({ N1: N, N2: N, m1, m2, e1: 1.5 * k_B * T1, e2: 1.5 * k_B * T2 }, rand);
    pts = [[0, T1, T2]];
    const Tm = (T1 + T2) / 2; moy.setAttribute("x1", o.x(0)); moy.setAttribute("x2", o.x(XMAX)); moy.setAttribute("y1", o.y(Tm)); moy.setAttribute("y2", o.y(Tm));
    montre();
  }
  function montre() {
    const [e1, e2] = S.energies(s);
    c1.setAttribute("d", Plot.path(pts.map(p => [o.x(p[0]), o.y(p[1])])));
    c2.setAttribute("d", Plot.path(pts.map(p => [o.x(p[0]), o.y(p[2])])));
    $("mrv").textContent = F.num(+smr.value, 2);
    $("vt1").innerHTML = F.kelvin(Tde(e1));
    $("vt2").innerHTML = F.kelvin(Tde(e2));
    $("vv").textContent = F.fix(Math.sqrt((e1 / m1) / (e2 / m2)), 2);
    $("vvf").textContent = t("sim.f.v", { r: F.fix(Math.sqrt(m2 / m1), 2) });
    $("vw").textContent = F.qty(F.sci(S.wvcm(s, 4000, rand), 2), "m²·s⁻²");
    $("go").textContent = t(run ? "sim.pause" : "sim.go");
  }
  smr.oninput = raz; sp.onchange = raz;
  $("go").onclick = () => { run = !run; montre(); };
  $("raz").onclick = raz;
  raz();
  function tick() {
    requestAnimationFrame(tick);
    if (!run) return;
    S.choc(s, N / 40, rand, { memes: sp.value === "memes" });
    const x = s.chocs * 2 / (2 * N), [e1, e2] = S.energies(s);   // collisions per molecule: each involves two
    pts.push([x, Tde(e1), Tde(e2)]);
    if (x >= XMAX) run = false;
    montre();
  }
  tick();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["waterston", 1845, "idea"], ["maxwell", 1860, "idea"], ["boltzmann", 1872, "idea"], ["rayleigh", 1892, "idea"], ["kelvin", 2019, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["acoustique", "melange"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["piston", "c"], ["lourd", "a"], ["wvcm", "b"], ["semblables", "d"], ["definition", "a"], ["ordre", "c"], ["kb", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 394 });
})();
</script>
