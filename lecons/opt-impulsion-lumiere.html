<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, Cst = Constantes, C = Cst.c;

/* ---------- un électron lié poussé par l'onde : E, v, la force magnétique q v B et sa moyenne ---------- */
(() => {
  const W0 = 2.5e15, E0 = 100;                                                  // ω0 in the near ultraviolet, a weak field of 100 V·m⁻¹
  const svg = $("pousse"), sw = $("sw"), sg = $("sg"), sT = O.sectionThomson();
  const rOf = s => 0.2 * 25 ** (s / 100), gOf = s => 10 ** (-3 + 3 * s / 100);   // ω/ω0 from 0,2 to 5 ; γ/ω0 from 10⁻³ to 1
  function draw() {
    const r = rOf(+sw.value), g = gOf(+sg.value), w = r * W0;
    const p = O.pousseeOscillateur(W0, w, E0, { gamma: g * W0 }), T = 2 * Math.PI / w;
    const ts = Array.from({ length: 401 }, (_, i) => 2 * T * i / 400);
    const Fmax = Math.max(...ts.map(x => Math.abs(p.F(x)))) || 1;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, 2], label: t("fig.xaxis") }, y: { domain: [-1.1, 1.1], label: t("fig.yaxis") } });
    const curve = (f, cls) => Plot.el("path", { d: Plot.path(ts.map(x => [P.x(x / T), P.y(f(x))])), class: cls }, P.g);
    Plot.el("line", { x1: P.x(0), x2: P.x(2), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    curve(x => -p.E(x) / E0, "stroke c-warn");                                  // the electric force −eE, normalised
    curve(x => p.v(x) / p.vmax, "curve");
    curve(x => p.F(x) / Fmax, "stroke bold c-ok");
    Plot.el("line", { x1: P.x(0), x2: P.x(2), y1: P.y(p.Fmoy / Fmax), y2: P.y(p.Fmoy / Fmax), class: "stroke dash c-ok" }, P.g);
    const lag = p.retard - Math.PI / 2;                                         // x lags the force −eE by retard, v leads x by 90°
    $("swr").textContent = F.num(r, 3);
    $("sgr").textContent = g < 0.01 ? F.sci(g, 2) : F.num(g, 2);
    $("vph").textContent = F.qty(F.num(lag * 180 / Math.PI, 3), "°");
    $("fph").textContent = t("fig.f.phase", { c: F.num(Math.cos(lag), 3) });
    $("vmoy").textContent = F.sci(p.Fmoy / Fmax, 2);
    $("fmoy").textContent = t("fig.f.moy", { f: F.si(p.Fmoy, "N", { sig: 3 }) });
    $("vbil").textContent = p.rapport === null ? "–" : F.num(p.rapport, 6);
    $("fbil").textContent = t("fig.f.bilan", { s: F.num(p.sigma / sT, 3) });
  }
  sw.oninput = sg.oninput = draw; draw();
})();

/* ---------- le système décrit : une voile solaire et un grain de poussière de comète ---------- */
(() => {
  const A = 196, noire = O.voileSolaire({ A, m: 1, R: 0 }), miroir = O.voileSolaire({ A, m: 1, R: 1 });
  const sc = Cst.L_sun / (4 * Math.PI * C * Cst.GM_sun);                        // mass per area where a black sail has a/g = 1
  const rho = 1000, rg = 3 * sc / (4 * rho), lambda = 500e-9;                   // grain: a sphere of 1 000 kg·m⁻³
  $("sys1").innerHTML = t("sys1.body", { S: F.si(noire.S, "W·m⁻²", { sig: 4 }), A: F.qty(F.num(A, 3), "m²"),
    Fn: F.si(noire.F, "N", { prefix: "m" }), Fm: F.si(miroir.F, "N", { prefix: "m" }), sc: F.qty(F.num(sc * 1e3, 2), "g·m⁻²"),
    sm: F.qty(F.num(2 * sc * 1e3, 2), "g·m⁻²"), r: F.si(rg, "m", { prefix: "µ" }), x: F.num(2 * Math.PI * rg / lambda, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kepler", 1619, "idea"], ["maxwell", 1873, "idea"], ["lebedev", 1901, "experiment"], ["compton", 1923, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ikaros", "pince", "ligo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["sens", "c"], ["ressort", "a"], ["soleil", "d"], ["pointeur", "b"], ["photons", "c"], ["coherence", "d"], ["poussiere", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 349 });
})();
</script>
