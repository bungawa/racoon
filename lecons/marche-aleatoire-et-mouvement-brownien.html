<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, { k_B, N_A, R } = Constantes;

/* ---------- l'expérience de Perrin, refaite ---------- */
(() => {
  const sA = $("bA"), sT = $("bT"), sN = $("bN"), tr = $("traj"), ms = $("msd");
  const RHO = 1050, DT = 30, NI = 10, NTRACE = 8, NPTS = 300;     // kg·m⁻³, s, intervals, drawn particles, points of the MSD ensemble
  let graine = 1;
  function draw() {
    const a = 0.1e-6 * Math.pow(20, +sA.value), T = +sT.value, N = +sN.value, eta = Fluides.etaEau(T), rhoE = Fluides.rhoEau(T);
    const r = Quiz.rng(graine), o = { N, a, rho: RHO, mu: Forces.stokes(eta, 2 * a, 1), T, dim: 2 }, s = S.brownien(o, r);
    const chemins = Array.from({ length: Math.min(N, NTRACE) }, () => [[0, 0]]), d = [];
    for (let k = 0; k < NI; k++) {
      const x0 = s.x.map(X => Float64Array.from(X));
      S.pasExact(s, DT, r);
      for (let j = 0; j < 2; j++) for (let i = 0; i < N; i++) d.push(s.x[j][i] - x0[j][i]);
      chemins.forEach((c, i) => c.push([s.x[0][i], s.x[1][i]]));
    }
    const p = S.perrin(d, DT, s.mu, T), D = k_B * T / s.mu;
    /* trajectoires, en micromètres */
    const L = 4 * Math.sqrt(4 * D * DT * NI) * 1e6;
    tr.innerHTML = "";
    const o1 = Plot.axes(tr, { fmt: F, w: 640, h: 360, pad: { b: 44, l: 56 },
      x: { domain: [-L, L], label: t("traj.x"), fmt: v => F.num(v, 3) }, y: { domain: [-0.6 * L, 0.6 * L], label: t("traj.y"), fmt: v => F.num(v, 3) } });
    chemins.forEach((c, i) => {
      const off = ((i % 4) - 1.5) * 0.5 * L, offy = (Math.floor(i / 4) - 0.5) * 0.6 * L;
      const pts = c.map(([x, y]) => [o1.x(off + x * 1e6), o1.y(offy + y * 1e6)]);
      Plot.el("path", { d: Plot.path(pts), class: "stroke c-tint" }, o1.g);
      pts.forEach(([px, py]) => Plot.el("circle", { cx: px, cy: py, r: 2.5, class: "fill c-tint" }, o1.g));
    });
    /* ⟨R²⟩(t) en deux dimensions : de la balistique à la diffusion */
    const t0 = s.tau / 100, t1 = 1000;
    ms.innerHTML = "";
    const R2 = tt => 2 * S.msd(tt, T, s.mu, s.tau), y0 = R2(t0) / 3, y1 = R2(t1) * 3;
    const o2 = Plot.axes(ms, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { domain: [t0, t1], scale: "log", label: t("msd.x") },
      y: { domain: [y0, y1], scale: "log", label: t("msd.y"), fmt: v => Math.round(Math.log10(v)) % 2 ? "" : "10" + F.sup(Math.round(Math.log10(v))) } });
    const dans = v => v >= y0 && v <= y1, cl = v => Math.max(y0, Math.min(y1, v)), cur = [], bal = [], dif = [];
    for (let i = 0; i <= 200; i++) { const tt = t0 * Math.pow(t1 / t0, i / 200), b = 2 * k_B * T / s.m * tt * tt, f = 4 * D * tt;
      cur.push([o2.x(tt), o2.y(R2(tt))]); if (dans(b)) bal.push([o2.x(tt), o2.y(b)]); if (dans(f)) dif.push([o2.x(tt), o2.y(f)]); }
    Plot.el("path", { d: Plot.path(bal), class: "stroke thin dash c-label" }, o2.g);
    Plot.el("path", { d: Plot.path(dif), class: "stroke thin dash c-label" }, o2.g);
    Plot.el("path", { d: Plot.path(cur), class: "stroke bold c-tint" }, o2.g);
    for (let e = -2; Math.pow(10, e) * s.tau < t1; e++) {
      const tt = Math.pow(10, e) * s.tau, q = S.brownien(Object.assign({}, o, { N: NPTS }), r);
      S.pasExact(q, tt, r); let m2 = 0; for (let i = 0; i < NPTS; i++) m2 += q.x[0][i] ** 2 + q.x[1][i] ** 2;
      Plot.el("circle", { cx: o2.x(tt), cy: o2.y(cl(m2 / NPTS)), r: 4.5, class: "fill c-warn" }, o2.g);
    }
    const z = (p.NA - N_A) / (p.rel * N_A), nb = v => v >= 0.01 && v < 100 ? F.num(v, 2) : F.sci(v, 1);
    $("bAv").textContent = F.si(a, "m", { sig: 2 });
    $("bTv").innerHTML = F.kelvin(T);
    $("bNv").textContent = F.num(N, 3);
    $("vtau").textContent = F.si(s.tau, "s", { sig: 2 });
    $("vr").textContent = F.si(Math.sqrt(4 * D * DT), "m", { sig: 2 });
    $("vkb").textContent = F.qty(F.sci(p.kB, 3), "J·K⁻¹");
    $("fkb").textContent = t("sim.f.kb", { n: F.num(d.length, 4), rel: F.num(100 * p.rel, 2) });
    $("vna").textContent = F.qty(F.sci(p.NA, 3), "mol⁻¹");
    $("fna").textContent = t("sim.f.na", { na: F.sci(N_A, 4) });
    $("vz").textContent = F.fix(z, 1);
    $("sys").innerHTML = t("sys.inner", { a: F.si(a, "m", { sig: 2 }), T: F.kelvin(T), eta: F.si(eta, "Pa·s", { sig: 3 }),
      mu: F.qty(F.sci(s.mu, 2), "kg·s⁻¹"), dt: F.sci(DT / s.tau, 1),
      re: nb(rhoE * Math.sqrt(3 * k_B * T / s.m) * 2 * a / eta, 1),
      sed: nb((RHO - rhoE) * 4 / 3 * Math.PI * a ** 3 * Constantes.g0 / s.mu * DT / Math.sqrt(2 * D * DT), 1) });
  }
  sA.oninput = sT.oninput = sN.oninput = draw;
  $("refaire").onclick = () => { graine++; draw(); };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["einstein", 1905, "idea"], ["smoluchowski", 1906, "idea"], ["langevin", 1908, "idea"], ["perrin", 1909, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["dls"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["racine", "b"], ["pas", "d"], ["rayon", "a"], ["chaud", "c"], ["masse", "b"], ["perrin", "a"], ["xf", "c"], ["tau", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 414 });
})();
</script>
