<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- an electron of energy Ec crosses, over w = 1 cm, a transverse field ℰ: δθ from the wave (phase across D) and from F = −∂V/∂y ---------- */
(() => {
  const sE = $("sE"), sG = $("sG"), EV = Constantes.e, M = Constantes.m_e, W = 0.01, D = 1e-3;
  const k = (Ec, V) => Math.sqrt(2 * M * (Ec - V)) / Q.hbar;           // local wave number, V ≪ Ec
  function etat() {
    const Ec = +sE.value * EV, G = +sG.value * 1e3 * EV, p = Math.sqrt(2 * M * Ec), v = p / M;   // ∂V/∂y = e ℰ, ℰ in kV·m⁻¹
    /* the wave: phases accumulated over w at y = 0 and y = D; the front tilts by their difference over k D */
    const dphi = (k(Ec, G * D) - k(Ec, 0)) * W, onde = dphi / (k(Ec, 0) * D);
    return { Ec, G, p, v, onde, classique: Q.deviationGradient(W, p, v, G), lam: Q.h / p };
  }
  function draw() {
    const r = etat(), svg = $("fronts"); svg.innerHTML = "";
    const x0 = 200, x1 = 440, yc = 120, mag = Math.min(2e3, 0.5 / Math.max(Math.abs(r.onde), 1e-12));   // tilt magnified, at most to 0,5 rad
    Plot.el("rect", { x: x0, y: 30, width: x1 - x0, height: 180, class: "stroke thin dash c-label-2", fill: "none" }, svg);
    for (let j = 0; j < 14; j++) {
      const x = 30 + j * 44;
      const tilt = x <= x0 ? 0 : Math.min(1, (x - x0) / (x1 - x0)) * r.onde * mag;
      Plot.el("line", { x1: x - 80 * Math.sin(tilt), x2: x + 80 * Math.sin(tilt), y1: yc - 80 * Math.cos(tilt), y2: yc + 80 * Math.cos(tilt), class: "stroke thin c-tint" }, svg);
    }
    Plot.fleche(svg, [30, yc], [x0, yc], { cls: "c-warn", tete: 8 });
    Plot.fleche(svg, [x1, yc], [x1 + 160 * Math.cos(r.onde * mag), yc - 160 * Math.sin(r.onde * mag)], { cls: "c-warn", tete: 8 });
    $("sEr").textContent = F.num(+sE.value, 3) + "\u00a0eV"; $("sGr").textContent = F.si(+sG.value * 1e3, "V·m⁻¹");
    $("vonde").textContent = F.si(r.onde, "rad"); $("fonde").textContent = t("fig.f.onde");
    $("vclass").textContent = F.si(r.classique, "rad");
    $("vlent").textContent = F.sci(r.G * r.lam / r.Ec, 2); $("flent").textContent = t("fig.f.lent", { l: F.si(r.lam, "m") });
  }
  sE.oninput = sG.oninput = draw; draw();
  const Ec = 100 * EV, p = Math.sqrt(2 * M * Ec);
  $("sys1").innerHTML = t("sys1.body", { l: F.si(Q.h / p, "m"), d: F.si(Math.abs(Q.deviationGradient(W, p, p / M, 1e3 * EV)), "rad") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["busch", 1926, "idea"], ["ehrenfest", 1927, "idea"], ["ruska", 1931, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["optique"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pourquoi", "b"], ["sens", "d"], ["accord", "a"], ["limite", "c"], ["lent", "b"], ["rayon", "a"], ["masse", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 704 });
})();
</script>
