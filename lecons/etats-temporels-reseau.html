<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const t_ = t;
const Q = QuantSchro, K = Constantes, B = 3e-10, N = 160, N0 = 40, S = 6, O = { E0: 0, A: K.e, b: B };

/* ---------- a packet of nearby k, followed in time ---------- */
(() => {
  const svg = $("fig"), sk = $("sk"), st = $("st");
  function draw() {
    const kb = +sk.value, tfs = +st.value, t = tfs * 1e-15;
    const C = Q.evolutionChaine(Q.paquetChaine(N, N0, kb, S), O, t), m = Q.moyenneSite(C);
    const v = Q.vitesseGroupeChaine(kb / B, O), meff = Q.masseEffectiveChaine(kb / B, O);
    svg.innerHTML = "";
    const haut = Math.max(0.02, Math.ceil(Math.max(...C.map(z => z.P)) * 50) / 50);
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, N - 1], label: t_("fig.xaxis") }, y: { domain: [0, haut], label: t_("fig.yaxis"), ticks: 4 } });
    Plot.el("path", { d: Plot.path(C.map((z, n) => [G.x(n), G.y(z.P)])), class: "stroke c-label" }, G.g);
    const xc = N0 + v * t / B;
    if (xc <= N - 1) Plot.el("line", { x1: G.x(xc), x2: G.x(xc), y1: G.y(0), y2: G.y(haut), class: "stroke thin dash c-warn" }, G.g);
    $("skr").textContent = F.num(kb, 3);
    $("str").textContent = F.si(t, "s");
    $("vv").textContent = F.si(v, "m·s⁻¹");
    $("fv").textContent = t_("fig.f.v");
    $("vm").textContent = Number.isFinite(meff) ? t_("fig.v.m", { r: F.num(meff / K.m_e, 3) }) : "∞";
    $("fm").textContent = t_(Math.abs(kb - Math.PI / 2) < 0.03 ? "fig.f.m.inf" : kb > Math.PI / 2 ? "fig.f.m.neg" : "fig.f.m.pos");
    $("vx").textContent = t_("fig.v.x", { n: F.num(m.n - N0, 3) });
    $("fx").textContent = t_("fig.f.x", { p: F.num(v * t / B, 3), s: F.num(m.ecart, 2) });
  }
  sk.oninput = draw; st.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const m = Q.masseEffectiveChaine(0, O), E = 0.025 * K.e, v = Math.sqrt(2 * E / m);
  $("sys1").innerHTML = t_("sys1.body", { v: F.si(v, "m·s⁻¹"), kb: F.num(m * v * B / K.hbar, 2) });
  $("sys2").innerHTML = t_("sys2.body", { l: F.si(2 * Math.PI * K.hbar / (m * v), "m") });
  const Eel = 1e4, T = 2 * Math.PI * K.hbar / (K.e * Eel * B);
  $("sys3").innerHTML = t_("sys3.body", { T: F.si(T, "s"), d: F.si(4 * O.A / (K.e * Eel), "m") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bloch", 1929, "idea"], ["dresselhaus", 1955, "experiment"], ["bendahan", 1996, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["masses"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["groupe", "a"], ["sens", "c"], ["masse", "b"], ["negative", "d"], ["friction", "a"], ["hk", "c"], ["mesure", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1303 });
})();
</script>
