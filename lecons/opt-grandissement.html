<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique;
const mm = v => isFinite(v) ? F.si(v, "m", { prefix: "m", sig: 3 }) : "∞";

/* ---------- construction de l'image par les trois rayons, lentille mince, (27.12) à (27.16) ---------- */
(() => {
  const svg = $("constr"), vs = $("vsl"), ps = $("psl"), W = 640, Hp = 320, Y0 = 0.01;      // objet de 1 cm
  const VS = [-10, -8, -6, -5, -4, -3, -2, 2, 3, 4, 5, 6, 8, 10];                               // vergences (m⁻¹), sans 0
  const X = [-0.65, 0.65], Y = [-0.04, 0.04], x = Plot.linScale(X[0], X[1], 10, W - 10), y = Plot.linScale(Y[0], Y[1], Hp - 20, 20);
  svg.setAttribute("viewBox", "0 0 " + W + " " + Hp);
  function draw() {
    svg.innerHTML = "";
    const clip = Plot.el("clipPath", { id: "cadre" }, Plot.el("defs", {}, svg));
    Plot.el("rect", { x: 0, y: 0, width: W, height: Hp }, clip);
    const g = Plot.el("g", { "clip-path": "url(#cadre)" }, svg);
    const seg = (a, b, cls) => Plot.el("line", { x1: x(a[0]), y1: y(a[1]), x2: x(b[0]), y2: y(b[1]), class: cls }, g);
    const far = (a, d) => { const k = (X[1] + 1 - a[0]) / d[0]; return [a[0] + k * d[0], a[1] + k * d[1]]; };   // demi-droite vers l'aval
    const V = VS[+vs.value], fp = 1 / V, p = +ps.value / 100, c = O.conjugue(p, fp), B = [p, Y0];
    seg([X[0] - 1, 0], [X[1] + 1, 0], "stroke thin rim");
    seg([0, -0.035], [0, 0.035], "stroke c-label");
    [[fp, "gr.Fp"], [-fp, "gr.F"], [0, "gr.O"]].forEach(([xv, k]) => {
      seg([xv, -0.002], [xv, 0.002], "stroke c-label-2");
      Plot.el("text", { x: x(xv) + 4, y: y(0) + 16 }, g).textContent = t(k);
    });
    Plot.fleche(g, [x(p), y(0)], [x(p), y(Y0)], { cls: "c-label" });
    const imp = [[0, Y0], [0, 0], [0, isFinite(c.gamma) ? c.gamma * Y0 : NaN]];              // points d'impact des trois rayons sur la lentille
    const dirs = [[fp, -Y0], [-p, -Y0], [1, 0]];                                              // directions émergentes : vers F′, tout droit par O, parallèle
    imp.forEach((P, i) => {
      if (!isFinite(P[1])) return;
      seg(B, P, "stroke thin c-tint");
      const d = i === 0 && fp < 0 ? [-fp, Y0] : dirs[i];                                     // divergente : le rayon 1 semble venir de F′
      seg(P, far(P, d), "stroke thin c-tint");
    });
    if (fp > 0 && p > -fp) seg([-fp, 0], B, "stroke thin dash c-label-2");                    // objet entre F et O : le rayon 3 semble venir de F
    if (fp < 0) seg(imp[2], [-fp, 0], "stroke thin dash c-label-2");                          // divergente : le rayon 3 vise F, derrière la lentille
    if (isFinite(c.pp)) {
      const Bp = [c.pp, c.gamma * Y0];
      if (c.pp < 0) imp.forEach(P => seg(P, Bp, "stroke thin dash c-label-2"));
      Plot.fleche(g, [x(c.pp), y(0)], [x(Bp[0]), y(Bp[1])], { cls: "c-warn", trait: c.pp < 0 ? "stroke dash" : "stroke" });
    }
    $("vread").textContent = t("gr.V.read", { V: F.qty(F.num(V, 2), "m⁻¹"), fp: mm(fp) });
    $("pread").textContent = mm(p);
    $("vpp").textContent = mm(c.pp);
    $("fpp").textContent = t(!isFinite(c.pp) ? "gr.f.infini" : c.reelle ? "gr.f.reelle" : "gr.f.virtuelle");
    $("vg").textContent = isFinite(c.gamma) ? F.num(c.gamma, 3) : "∞";
    $("fg").textContent = !isFinite(c.gamma) ? "" : t(c.gamma > 0 ? "gr.f.droite" : "gr.f.renversee", { taille: mm(Math.abs(c.gamma) * Y0) });
    const mm2 = v => F.qty(F.num(v * 1e6, 3), "mm²");
    $("vn").textContent = isFinite(c.sigmap) ? mm2(c.sigma * c.sigmap) : "–";
    $("fn").textContent = t("gr.f.newton", { s: mm(c.sigma), sp: mm(c.sigmap), f2: mm2(-fp * fp) });
  }
  vs.oninput = draw; ps.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kepler", 1611, "idea"], ["hooke", 1665, "use"], ["leeuwenhoek", 1673, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lithographie", "photo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["rayons", "a"], ["gamma", "c"], ["newton", "b"], ["loupe", "d"], ["deuxf", "a"], ["divergente", "b"], ["dioptre", "c"], ["photo", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 274 });
})();
</script>
