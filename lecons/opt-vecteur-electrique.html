<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, deg = Math.PI / 180;

/* ---------- l'ellipse décrite par le bout du champ ; la lumière naturelle ---------- */
(() => {
  const svg = $("plan"), seg = $("mode"), sa = $("sa"), sd = $("sd"), sn = $("sn");
  let mode = "mono", graine = 1;
  const stat = (i, k, v, f) => { $("k" + i).innerHTML = k; $("v" + i).textContent = v; $("f" + i).textContent = f; };
  const cadre = () => {
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 360, pad: { l: 166, r: 166, b: 40 }, x: { domain: [-1.2, 1.2], label: t("fig.ex") }, y: { domain: [-1.2, 1.2], label: t("fig.ey") } });
    Plot.el("line", { x1: P.x(-1.2), x2: P.x(1.2), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("line", { x1: P.x(0), x2: P.x(0), y1: P.y(-1.2), y2: P.y(1.2), class: "zero" }, P.g);
    return P;
  };
  const trace = (P, e, cls) => Plot.el("path", { d: Plot.path(Array.from({ length: 181 }, (_, k) => e.point(2 * Math.PI * k / 180)).map(([x, y]) => [P.x(x), P.y(y)])), class: cls }, P.g);
  function mono() {
    const a = +sa.value * deg, d = +sd.value * deg, Ax = Math.cos(a), Ay = Math.sin(a), e = O.etatPolarisation(Ax, Ay, d, 1e-3);
    const P = cadre();
    trace(P, e, "stroke bold c-tint");
    const [x0, y0] = e.point(0), [x1, y1] = e.point(0.5);
    Plot.fleche(P.g, [P.x(0), P.y(0)], [P.x(x0), P.y(y0)], { cls: "c-warn" });
    if (Math.hypot(x1 - x0, y1 - y0) > 0.05) Plot.fleche(P.g, [P.x(x0), P.y(y0)], [P.x(x0 + 0.6 * (x1 - x0)), P.y(y0 + 0.6 * (y1 - y0))], { cls: "c-tint" });
    $("sar").textContent = F.qty(F.num(+sa.value, 3), "°");
    $("sdr").textContent = F.qty(F.num(+sd.value, 3), "°");
    stat(1, t("fig.k.nature"), t("fig.nature." + e.nature), t("fig.f.rapport", { r: F.fix(e.rapport, 2) }));
    stat(2, t("fig.k.sens"), t("fig.sens." + (e.sens > 0 ? "droite" : e.sens < 0 ? "gauche" : "aucun")), t("fig.f.sens"));
    stat(3, t("fig.k.psi"), e.nature === "circulaire" ? "–" : F.qty(F.num(e.psi / deg, 3), "°"), t("fig.f.psi"));
  }
  function naturelle() {
    const n = Math.round(Math.pow(10, +sn.value)), r = O.alea(graine), etats = Array.from({ length: n }, () => O.etatHasard(r));
    const P = cadre();
    etats.slice(0, 30).forEach(s => trace(P, O.etatPolarisation(s.Ax, s.Ay, s.delta), "stroke thin c-label-2"));
    const p = O.degrePolarisation(etats), lin = Math.hypot(p.S[1], p.S[2]) / p.S[0];
    $("snr").textContent = F.num(n, 3);
    stat(1, t("fig.k.n"), F.num(n, 3), t("fig.f.n"));
    stat(2, t("fig.k.p"), F.fix(p.P, 3), t("fig.f.p", { r: F.fix(1 / Math.sqrt(n), 3) }));
    stat(3, t("fig.k.pol"), F.num(100 * (1 + lin) / 2, 3) + " %", t("fig.f.pol"));
  }
  function draw() {
    $("cm").hidden = $("legm").hidden = mode !== "mono"; $("cn").hidden = $("legn").hidden = mode !== "naturelle";
    svg.setAttribute("aria-label", t(mode === "mono" ? "fig.aria" : "fig.aria.n"));
    (mode === "mono" ? mono : naturelle)();
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; draw(); });
  $("tirage").onclick = () => { graine += 1; draw(); };
  sa.oninput = sd.oninput = sn.oninput = draw; draw();
})();

/* ---------- le système décrit : une lampe à sodium derrière un polariseur ---------- */
(() => {
  const d = O.coherenceDoppler(589e-9, 500, 22.99 * Constantes.u), T1 = 1e-6, T2 = 0.01;   // a fast photodiode; the eye in daylight
  $("sys1").innerHTML = t("sys1.body", { tc: F.si(d.tauc, "s"), T1: F.si(T1, "s"), n1: F.sci(T1 / d.tauc, 2), p1: F.sci(Math.sqrt(d.tauc / T1), 1),
    T2: F.si(T2, "s"), n2: F.sci(T2 / d.tauc, 2), p2: F.sci(Math.sqrt(d.tauc / T2), 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["malus", 1808, "experiment"], ["fresnel", 1819, "experiment"], ["stokes", 1852, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gps"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["phase", "a"], ["cercle", "c"], ["complexe", "b"], ["sens", "d"], ["naturelle", "a"], ["degre", "c"], ["convention", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 331 });
})();
</script>
