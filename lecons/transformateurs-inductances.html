<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd;
const pct = x => F.qty(F.num(100 * x, 3), "%");

/* ---------- un transformateur 230 V : enroulements couplés, contre le modèle idéal ---------- */
(() => {
  const base = { N1: 1000, U1: 230, f: 50, R1: 2, R2: 0.01, L1: 20 }, sn = $("sn"), sk = $("sk"), sr = $("sr");
  function draw() {
    const N2 = +sn.value, k = +sk.value / 1000, Rc = Math.pow(10, +sr.value);
    const r = M.transformateur(Object.assign({ N2, k, Rc }, base)), mod = z => Math.hypot(z.re, z.im);
    $("snr").textContent = F.num(N2, 3);
    $("skr").textContent = F.num(k, 3);
    $("srr").textContent = F.si(Rc, "Ω");
    $("vu2").textContent = F.si(mod(r.U2), "V");
    $("fu2").textContent = t("tr.f.u2", { v: F.si(r.ideal * base.U1, "V"), e: pct(1 - r.rapport / r.ideal) });
    $("vi").textContent = F.si(mod(r.I2), "A");
    $("fi").textContent = t("tr.f.i", { i1: F.si(mod(r.I1), "A"), r: F.num(mod(r.I1) / mod(r.I2), 3), n: F.num(r.ideal, 3), m: F.si(r.magnetisant, "A") });
    $("veta").textContent = pct(r.rendement);
    $("feta").textContent = t("tr.f.eta", { p: F.si(r.P2, "W"), j: F.si(r.pertes, "W") });
  }
  sn.oninput = sk.oninput = sr.oninput = draw; draw();
})();

/* ---------- couper un électroaimant : tension et durée selon ce qu'on laisse en parallèle ---------- */
(() => {
  const L = 2, R = 10, U = 12, I0 = U / R, svg = $("pic"), sp = $("sp");
  function draw() {
    const Rp = Math.pow(10, +sp.value), c = M.coupureBobine({ L, R, I0, Rp });
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 60, b: 44 }, x: { scale: "log", domain: [10, 1e6], label: t("fig.xaxis") }, y: { scale: "log", domain: [1e-6, 1e6], label: t("fig.yaxis") } });
    const xs = Array.from({ length: 121 }, (_, i) => Math.pow(10, 1 + 5 * i / 120));
    Plot.el("path", { d: Plot.path(xs.map(x => [P.x(x), P.y(M.coupureBobine({ L, R, I0, Rp: x }).upic)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map(x => [P.x(x), P.y(M.coupureBobine({ L, R, I0, Rp: x }).tau)])), class: "ref" }, P.g);
    Plot.el("circle", { cx: P.x(Rp), cy: P.y(c.upic), r: 5, class: "dot" }, P.g);
    Plot.el("circle", { cx: P.x(Rp), cy: P.y(c.tau), r: 5, class: "dot" }, P.g);
    $("spr").textContent = F.si(Rp, "Ω");
    $("vu").textContent = F.si(c.upic, "V");
    $("fu").textContent = t("fig.f.u", { u: F.si(U, "V"), x: F.num(c.upic / U, 2) });
    $("vtau").textContent = F.si(c.tau, "s");
    $("ftau").textContent = t("fig.f.tau", { l: F.si(L / R, "s", { prefix: "m" }) });
    $("vw").textContent = F.si(c.energie, "J");
    $("fw").textContent = t("fig.f.w", { p: pct(c.partRp) });
  }
  sp.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["anneau", 1831, "experiment"], ["lenz", 1834, "idea"], ["turin", 1884, "use"], ["zbd", 1885, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rouelibre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["rapport", "b"], ["courant", "d"], ["continu", "a"], ["lenz", "c"], ["couplage", "b"], ["coupure", "a"], ["lampe", "d"], ["energie", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 162 });
})();
</script>
