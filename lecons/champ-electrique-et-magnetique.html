<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- lignes de champ : E de charges ponctuelles, B de fils rectilignes (positions en m, plan z = 0) ---------- */
(() => {
  const svg = $("lignes"), P = Plot.el, BOX = [-0.08, 0.08, -0.05, 0.05], NC = 1e-9, IA = 10, V = 1e6;
  const X = Plot.linScale(BOX[0], BOX[1], 0, 640), Y = Plot.linScale(BOX[2], BOX[3], 400, 0);
  const CONF = {
    q1: { charges: [{ q: NC, x: 0, y: 0 }] },
    dip: { charges: [{ q: NC, x: -0.03, y: 0 }, { q: -NC, x: 0.03, y: 0 }] },
    pp: { charges: [{ q: NC, x: -0.03, y: 0 }, { q: NC, x: 0.03, y: 0 }] },
    f1: { fils: [{ I: IA, x: 0, y: 0 }] },
    ff: { fils: [{ I: IA, x: -0.03, y: 0 }, { I: IA, x: 0.03, y: 0 }] },
    fo: { fils: [{ I: IA, x: -0.03, y: 0 }, { I: -IA, x: 0.03, y: 0 }] },
  };
  let conf = "q1", probe = [0.015, 0.025];
  const path = (pts, cls) => P("path", { d: pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(""), class: cls }, svg);
  function lignesE(Q) {
    const champ = r => { const e = ChampsEM.champE(Q, r[0], r[1]); return [e.ex, e.ey]; };
    const puits = Q.filter(s => s.q < 0).map(s => [s.x, s.y]);
    Q.filter(s => s.q > 0).forEach(s => {
      const k = Q.length === 1 ? 16 : 14;
      for (let j = 0; j < k; j++) {
        const a = 2 * Math.PI * (j + 0.5) / k, start = [s.x + 0.002 * Math.cos(a), s.y + 0.002 * Math.sin(a)];
        path(Travail.ligneDeChamp(champ, start, { pas: 0.0008, n: 900, boite: BOX, puits, rayon: 0.0015 }), "stroke c-tint");
      }
    });
  }
  function lignesB(W) {
    /* the lines of B are the level curves of A_z; equal steps in A_z make the density of lines proportional to |B| */
    const A = r => ChampsEM.potentielVecteur(W, r[0], r[1]), vals = [];
    for (let i = 0; i <= 20; i++) for (let j = 0; j <= 20; j++) vals.push(A([BOX[0] + (BOX[1] - BOX[0]) * i / 20, BOX[2] + (BOX[3] - BOX[2]) * j / 20]));
    W.forEach(w => vals.push(A([w.x + 0.004, w.y])));
    const ok = vals.filter(Number.isFinite), lo = Math.min(...ok), hi = Math.max(...ok), n = 16, step = (hi - lo) / n;
    for (let k = 0; k < n; k++) Travail.isolignes(A, BOX, 160, lo + (k + 0.5) * step).forEach(s => path(s, "stroke c-tint"));
  }
  function draw() {
    const c = CONF[conf];
    svg.innerHTML = "";
    if (c.charges) lignesE(c.charges); else lignesB(c.fils);
    (c.charges || []).forEach(s => P("circle", { cx: X(s.x), cy: Y(s.y), r: 8, class: "fill " + (s.q > 0 ? "c-warn" : "c-label") }, svg));
    (c.fils || []).forEach(w => {
      P("circle", { cx: X(w.x), cy: Y(w.y), r: 9, class: "stroke " + (w.I > 0 ? "c-warn" : "c-label") }, svg);
      if (w.I > 0) P("circle", { cx: X(w.x), cy: Y(w.y), r: 3, class: "fill c-warn" }, svg);   // current towards the reader
      else [[1, 1], [1, -1]].forEach(([a, b]) => P("line", { x1: X(w.x) - 6 * a, y1: Y(w.y) - 6 * b, x2: X(w.x) + 6 * a, y2: Y(w.y) + 6 * b, class: "stroke c-label" }, svg));
    });
    /* the probe M: the field there, its direction, the force on an electron */
    const near = (c.charges || c.fils).some(s => Math.hypot(probe[0] - s.x, probe[1] - s.y) < 0.004);
    if (near) probe = [probe[0] + 0.01, probe[1] + 0.01];
    let fx, fy, f;
    if (c.charges) { const e = ChampsEM.champE(c.charges, probe[0], probe[1]); fx = e.ex; fy = e.ey; f = e.e; }
    else { const b = ChampsEM.champB(c.fils, probe[0], probe[1]); fx = b.bx; fy = b.by; f = b.b; }
    P("line", { x1: X(probe[0]), y1: Y(probe[1]), x2: X(probe[0]) + 36 * fx / f, y2: Y(probe[1]) - 36 * fy / f, class: "stroke bold c-ko" }, svg);
    P("circle", { cx: X(probe[0]), cy: Y(probe[1]), r: 5, class: "fill c-ko" }, svg);
    $("liread").innerHTML = t("li.read." + conf);
    $("kchamp").innerHTML = t(c.charges ? "li.k.e" : "li.k.b");
    $("vchamp").textContent = F.si(f, c.charges ? "V·m⁻¹" : "T");
    const force = c.charges ? ChampsEM.E * f : ChampsEM.E * V * f;
    $("vforce").textContent = F.si(force, "N");
    $("fforce").textContent = t(c.charges ? "li.f.force.e" : "li.f.force.b");
  }
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { conf = b.dataset.c;
    document.querySelectorAll("[data-c]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  svg.addEventListener("pointerdown", e => { const r = svg.getBoundingClientRect();
    probe = [X.inv((e.clientX - r.left) * 640 / r.width), Y.inv((e.clientY - r.top) * 400 / r.height)]; draw(); });
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["oersted", 1820, "idea"], ["faraday", 1852, "idea"], ["heaviside", 1889, "idea"], ["lorentz", 1895, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm", "boussole"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["test", "c"], ["vitesse", "a"], ["superposition", "d"], ["lignes", "b"], ["densite", "a"], ["fils", "c"], ["travail", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 12 });
})();
</script>
