<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, OG = OptiqueGeometrique, DEG = Math.PI / 180;

/* ---------- la parabole, une ligne de dipôles, un disque : les trois diagrammes ---------- */
(() => {
  const schema = $("schema"), trace = $("trace"), st = $("st"), sD = $("sD"), sf = $("sf"), sp = $("sp");
  function draw() {
    const lambda = 1, D = +sD.value, f = +sf.value * D, p = +sp.value, u = +st.value;   // lengths in wavelengths; u = sin θ · D/λ
    const th = Math.asin(Math.min(1, u * lambda / D)), n = Math.max(2, Math.round(D / p));
    /* schematic: the dish cut by its plane, the focus, rays of a plane wave coming at θ */
    schema.innerHTML = "";
    const ymax = D * D / (16 * f), g = Math.min(440 / D, 170 / Math.max(f, ymax)), cx = 320, top = 12, base = 214;
    const Xs = x => cx + g * x, Ys = y => base - g * y;
    const xs = Array.from({ length: 121 }, (_, i) => -D / 2 + D * i / 120);
    Plot.el("path", { d: Plot.path(xs.map(x => [Xs(x), Ys(x * x / (4 * f))])), class: "stroke bold c-label" }, schema);
    for (let j = 0; j <= 8; j++) {
      const x = -D / 2 + D * j / 8, Px = Xs(x), Py = Ys(x * x / (4 * f));
      Plot.el("line", { x1: Px - (Py - top) * Math.tan(th), y1: top, x2: Px, y2: Py, class: "stroke thin c-tint" }, schema);
      Plot.el("line", { x1: Px, y1: Py, x2: Xs(0), y2: Ys(f), class: "stroke thin dash c-label-2" }, schema);
    }
    Plot.el("circle", { cx: Xs(0), cy: Ys(f), r: 4, class: "fill c-warn" }, schema);
    /* pattern against u = D sin θ/λ: the parabola (numerical sum), a line of n dipoles at the chosen spacing, a disc (Airy) */
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 240, pad: { l: 52, b: 44 }, x: { domain: [-4, 4], label: t("fig.xaxis") }, y: { domain: [0, 1.05], label: t("fig.yaxis") } });
    const us = Array.from({ length: 321 }, (_, i) => -4 + i * 0.025), ang = v => Math.asin(Math.max(-1, Math.min(1, v * lambda / D)));
    Plot.el("path", { d: Plot.path(us.map(v => [P.x(v), P.y(O.parabole(f, D, lambda, ang(v), 201).puissance)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(us.map(v => [P.x(v), P.y(O.alignement(n, p, lambda, ang(v)))])), class: "stroke dash c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(us.map(v => [P.x(v), P.y(OG.airy(Math.PI * v))])), class: "stroke c-ok" }, P.g);
    Plot.el("circle", { cx: P.x(u), cy: P.y(O.parabole(f, D, lambda, th, 201).puissance), r: 5, class: "dot" }, P.g);
    const r = O.parabole(f, D, lambda, th, 201);
    $("str").textContent = t("fig.tv", { u: F.num(u, 3), a: F.num(th / DEG, 3) });
    $("sDr").textContent = t("fig.lam", { v: F.num(D, 3) });
    $("sfr").textContent = F.num(+sf.value, 3);
    $("spr").textContent = t("fig.lam", { v: F.num(p, 3) });
    $("vecart").textContent = t("fig.lam", { v: F.num(r.ecart, 3) });
    $("fecart").textContent = t("fig.f.ecart", { v: t("fig.lam", { v: F.num(D * Math.sin(th), 3) }) });
    $("vp").textContent = F.qty(F.num(100 * r.puissance, 3), "%");
    $("fp").textContent = t("fig.f.p", { v: F.qty(F.num(100 * O.ouvertureLineaire(D, lambda, th), 3), "%") });
    $("vligne").textContent = F.num(n, 3);
    $("fligne").textContent = p > 1 ? t("fig.f.lobes", { v: F.num(D / p, 3) }) : t("fig.f.sans");
  }
  st.oninput = sD.oninput = sf.oninput = sp.oninput = draw; draw();
})();

/* ---------- les systèmes décrits : une antenne du réseau de l'espace lointain, la croix de Mills ---------- */
(() => {
  const c = O.c, f = 8.4e9, D = 70, lambda = c / f, th = 1.22 * lambda / D;
  $("sys1").innerHTML = t("sys1.body", { f: F.si(f, "Hz", { prefix: "G" }), l: F.si(lambda, "m", { prefix: "m" }), D: F.si(D, "m"),
    th: F.sci(th, 2), a: F.num(th / DEG * 60, 2), far: F.si(2 * D * D / lambda, "m", { prefix: "k" }), dl: F.num(D / lambda, 4) });
  const fm = 85.5e6, L = 450, lm = c / fm;
  $("sys2").innerHTML = t("sys2.body", { f: F.si(fm, "Hz", { prefix: "M" }), l: F.si(lm, "m"), L: F.si(L, "m"), th: F.sci(lm / L, 2), a: F.num(lm / L / DEG, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hertz", 1888, "experiment"], ["reber", 1937, "experiment"], ["mills", 1954, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["dsn"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["angle", "b"], ["recip", "d"], ["parab", "a"], ["espacement", "c"], ["disque", "b"], ["lambda", "a"], ["lobes", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 304 });
})();
</script>
