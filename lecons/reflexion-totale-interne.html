<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, deg = x => x * Math.PI / 180, enDeg = x => x * 180 / Math.PI;

/* ---------- la lame d'air entre deux prismes d'indice 1,50 : réflexion totale frustrée ---------- */
(() => {
  const N = 1.5, ONDES = { lumiere: 633e-9, micro: 0.03 };
  const profil = $("profil"), trace = $("trace"), sth = $("sth"), sd = $("sd"), seg = $("onde");
  let onde = "lumiere";
  function draw() {
    const L = ONDES[onde], th = deg(+sth.value / 10), u = +sd.value / 100, d = u * L;
    const base = { n1: N, n2: 1, n3: N, theta: th, lambda0: L };
    const s = M.lame({ ...base, d, pol: "s" }), p = M.lame({ ...base, d, pol: "p" }), tir = M.reflexionTotale(N, 1, th, L);
    /* the field across the gap, |Ez|² for the s wave, x in units of λ0 */
    profil.innerHTML = "";
    const x0 = -1.5, x1 = Math.max(2, u + 1.5), xs = Array.from({ length: 601 }, (_, i) => x0 + (x1 - x0) * i / 600);
    const ys = xs.map(x => { const z = s.profil(x * L); return z.re * z.re + z.im * z.im; });
    const P = Plot.axes(profil, { fmt: F, w: 640, h: 220, pad: { l: 52, b: 44 }, x: { domain: [x0, x1], label: t("fig.xprofil") }, y: { domain: [0, 4], label: t("fig.yprofil") } });
    if (u > 0) Plot.el("rect", { x: P.x(0), y: P.y(4), width: P.x(u) - P.x(0), height: P.y(0) - P.y(4), class: "area" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x), P.y(Math.min(4, ys[i]))])), class: "stroke c-tint" }, P.g);
    /* T against the gap width, both polarisations */
    trace.innerHTML = "";
    const us = Array.from({ length: 201 }, (_, i) => i / 100);
    const Q = Plot.axes(trace, { fmt: F, w: 640, h: 220, pad: { l: 52, b: 44 }, x: { domain: [0, 2], label: t("fig.xaxis") }, y: { domain: [0, 1], label: t("fig.yaxis") } });
    for (const [pol, cls] of [["s", "stroke c-tint"], ["p", "stroke c-warn"]])
      Plot.el("path", { d: Plot.path(us.map(v => [Q.x(v), Q.y(M.lame({ ...base, d: v * L, pol }).T)])), class: cls }, Q.g);
    Plot.el("circle", { cx: Q.x(u), cy: Q.y(s.T), r: 5, class: "dot" }, Q.g);
    Plot.el("circle", { cx: Q.x(u), cy: Q.y(p.T), r: 5, class: "dot" }, Q.g);
    $("sthr").textContent = F.qty(F.fix(enDeg(th), 1), "°");
    $("sdr").textContent = t("fig.v.d", { u: F.fix(u, 2), d: F.si(d, "m") });
    $("vc").textContent = F.qty(F.fix(enDeg(tir.critique), 1), "°");
    $("fc").textContent = t(tir.totale ? "fig.f.totale" : "fig.f.partielle", { R: F.fix(M.fresnelInterface(N, 1, th).s.R, 3) });
    $("vprof").textContent = tir.totale ? F.si(tir.profondeur, "m") : t("fig.v.aucune");
    $("fprof").textContent = tir.totale ? t("fig.f.prof", { i: F.si(tir.profondeurIntensite, "m"), r: F.fix(tir.profondeur / L, 2) }) : t("fig.f.aucune");
    $("vT").textContent = t("fig.v.T", { s: F.fix(s.T, 4), p: F.fix(p.T, 4) });
    const ecart = Math.max(Math.abs(s.R + s.T - 1), Math.abs(p.R + p.T - 1));
    $("fT").textContent = t("fig.f.T", { e: ecart > 0 ? F.sci(ecart, 1) : "0" });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === onde)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { onde = x.dataset.m; draw(); });
  sth.oninput = sd.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fresnel", 1817, "experiment"], ["bose", 1897, "experiment"], ["axelrod", 1981, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tirf", "rhomb"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["critique", "b"], ["profondeur", "a"], ["energie", "d"], ["phase", "c"], ["gap", "a"], ["micro", "b"], ["eau", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 3361 });
})();
</script>
