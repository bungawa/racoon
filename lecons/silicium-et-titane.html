<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), E = ChimSolutions.Ellingham;

/* ---------- §4 : les réactions, ΔrG°(T) ---------- */
(() => {
  const T1 = 800, T2 = 2400;
  /* each reaction is a combination of couples of ChimSolutions.Ellingham (per mole of O2 or Cl2), Hess */
  const REACTIONS = {
    si: { c: { cco: 1, sio2: -1 }, cls: "c-tint" }, sic: { c: { sic: 1 }, cls: "c-warn" },
    ti: { c: { cco: 1, tio2: -1 }, cls: "c-tint" }, tic: { c: { tic: 1 }, cls: "c-warn" },
    chlor: { c: { ticl4: 2, tio2: -1 }, cls: "c-label-2" }, carbochlor: { c: { ticl4: 2, tio2: -1, cco: 1 }, cls: "c-ok" },
    kroll: { c: { mgcl2: 2, ticl4: -2 }, cls: "c-ko" },
  };
  const JEUX = { si: ["si", "sic"], ti: ["ti", "tic", "chlor", "carbochlor", "kroll"] };
  const nom = textOf("fig.r", Object.keys(REACTIONS));
  let metal = "ti", modele = "ellingham";
  const G = (r, T) => { const v = E.combinaison(REACTIONS[r].c, T, modele); return v === null ? null : v / 1000; };
  function zero(r) {                                                   // the temperature where ΔrG° changes sign, if any
    for (let T = T1; T < T2; T += 5) { const a = G(r, T), b = G(r, T + 5); if (a !== null && b !== null && a * b <= 0 && a !== b) return T + 5 * a / (a - b); }
    return null;
  }
  function draw() {
    const T = +$("temp").value, svg = $("reactions"), ids = JEUX[metal];
    $("tempv").innerHTML = F.kelvin(T);
    $("metal").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === metal)));
    $("modele").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === modele)));
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, x: { domain: [T1, T2], label: t("fig.ax.x") },
      y: { domain: [-600, 500], label: t("fig.ax.y"), fmt: v => F.fix(v, 0) } });
    Plot.el("line", { x1: x(T1), x2: x(T2), y1: y(0), y2: y(0), class: "zero" }, g);
    for (const r of ids) {
      const pts = [];
      for (let u = T1; u <= T2; u += 20) { const v = G(r, u); if (v !== null) pts.push([x(u), y(Math.max(-600, Math.min(500, v)))]); }
      if (pts.length > 1) Plot.el("path", { d: Plot.path(pts), class: "stroke bold " + REACTIONS[r].cls }, g);
    }
    Plot.el("line", { x1: x(T), x2: x(T), y1: y(-600), y2: y(500), class: "ref" }, g);
    $("legende").innerHTML = ids.map(r => `<span class="${REACTIONS[r].cls}">${nom[r]}</span>`).join("");
    $("lecture").innerHTML = ids.map(r => {
      const v = G(r, T), z = zero(r);
      const val = v === null ? t("fig.hors") : t("fig.val", { g: F.qty(F.fix(v, 0), "kJ·mol⁻¹") });
      const s = z === null ? t(G(r, T1) < 0 ? "fig.toujours" : "fig.jamais") : t(G(r, z + 10) < 0 ? "fig.audessus" : "fig.audessous", { tz: F.kelvin(z) });
      return `<div><span class="k">${nom[r]}</span><span>${val} ${s}</span></div>`;
    }).join("");
  }
  $("temp").oninput = draw;
  $("metal").querySelectorAll("button").forEach(b => b.onclick = () => { metal = b.dataset.m; draw(); });
  $("modele").querySelectorAll("button").forEach(b => b.onclick = () => { modele = b.dataset.m; draw(); });
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gregor", 1791, "experiment"], ["berzelius", 1824, "experiment"], ["hunter", 1910, "experiment"], ["kroll", 1940, "use"], ["siemens", 1956, "use"], ["ffc", 2000, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["alliages", "puces", "solaire"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["croisement", "c"], ["four", "a"], ["carbure", "b"], ["chlore", "d"], ["kroll", "c"], ["argon", "a"], ["recyclage", "d"], ["purete", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1940 });
})();
</script>
