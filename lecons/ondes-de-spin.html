<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/quantique-schrodinger.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes, N = 160, N0 = 40, S = 6, U = { A: 1, b: 1 };
/* units of the figure: A = 1, b = 1, ħ = 1 — times in ħ/A, energies in A; the module is dimensionless here except ħ */
const O = { E0: 2 * K.hbar, A: K.hbar, b: 1 };

/* ---------- one flipped spin, as a packet ---------- */
(() => {
  const svg = $("fig"), svg2 = $("fig2"), sk = $("sk"), st = $("st"), PI = Math.PI;
  function draw() {
    const kb = +sk.value, tau = +st.value;
    const C = Q.evolutionChaine(Q.paquetChaine(N, N0, kb, S), O, tau);
    svg.innerHTML = "";
    const haut = Math.max(0.02, Math.ceil(Math.max(...C.map(z => z.P)) * 50) / 50);
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 44 }, x: { domain: [0, N - 1], label: t("fig.xaxis") }, y: { domain: [0, haut], label: t("fig.yaxis"), ticks: 4 } });
    Plot.el("path", { d: Plot.path(C.map((z, n) => [G.x(n), G.y(z.P)])), class: "stroke c-label" }, G.g);
    const vg = 2 * Math.sin(kb), xc = N0 + vg * tau;
    if (xc <= N - 1) Plot.el("line", { x1: G.x(xc), x2: G.x(xc), y1: G.y(0), y2: G.y(haut), class: "stroke thin dash c-warn" }, G.g);
    svg2.innerHTML = "";
    const H = Plot.axes(svg2, { fmt: F, w: 640, h: 200, pad: { l: 56, b: 40 }, x: { domain: [-PI, PI], label: t("fig2.xaxis"), ticks: 6 }, y: { domain: [0, 4], label: t("fig2.yaxis"), ticks: 4 } });
    const pts = [];
    for (let i = 0; i <= 200; i++) { const u = -PI + 2 * PI * i / 200; pts.push([H.x(u), H.y(Q.bandeMagnon(u, U))]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke c-label" }, H.g);
    Plot.el("circle", { cx: H.x(kb), cy: H.y(Q.bandeMagnon(kb, U)), r: 5, class: "fill c-warn" }, H.g);
    $("skr").textContent = F.num(kb, 3);
    $("str").textContent = t("fig.v.t", { t: F.num(tau, 3) });
    $("ve").textContent = t("fig.v.e", { e: F.num(Q.bandeMagnon(kb, U), 3) });
    $("fe").textContent = t("fig.f.e");
    $("vv").textContent = t("fig.v.v", { v: F.num(vg, 3) });
    $("fv").textContent = t("fig.f.v", { d: F.num(C.reduce((s, z, n) => s + n * z.P, 0) - N0, 3), p: F.num(vg * tau, 3) });
  }
  sk.oninput = draw; st.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  $("sys1").innerHTML = t("sys1.body", { r: F.sci(Q.bandeMagnon(2 * Math.PI / 100, U), 2) });
  $("sys2").innerHTML = t("sys2.body");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bloch", 1930, "idea"], ["holstein", 1940, "idea"], ["brockhouse", 1957, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["neutrons"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["base", "a"], ["echange", "c"], ["fond", "b"], ["masse", "d"], ["electron", "a"], ["haut", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1501 });
})();
</script>
