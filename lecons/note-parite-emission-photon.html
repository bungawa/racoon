<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, DEG = Math.PI / 180;

/* ---------- the photon's polarization at θ for each parity: the ellipse turns by 90° ---------- */
(() => {
  const svg = $("ellipse"), sth = $("sth"), seg = $("parite");
  let p = -1;
  function draw() {
    const th = +sth.value * DEG, e = Q.emissionParite(th, p), c = 120, A = 90, B = Math.max(0.8, A * e.rapportAxes);
    svg.innerHTML = "";
    /* horizontal: perpendicular to the plane (z, direction) ; vertical: in that plane */
    Plot.el("line", { x1: 10, x2: 230, y1: c, y2: c, class: "stroke thin c-label-2" }, svg);
    Plot.el("line", { x1: c, x2: c, y1: 10, y2: 230, class: "stroke thin c-label-2" }, svg);
    const perp = p < 0;
    Plot.el("ellipse", { cx: c, cy: c, rx: perp ? A : B, ry: perp ? B : A, class: "stroke bold " + (perp ? "c-tint" : "c-warn") }, svg);
    const l1 = Plot.el("text", { x: 228, y: c - 6, "text-anchor": "end", class: "c-label-2" }, svg); l1.textContent = t("fig.perp");
    const l2 = Plot.el("text", { x: c + 6, y: 22, class: "c-label-2" }, svg); l2.textContent = t("fig.plan");
    $("sthr").textContent = F.num(+sth.value, 3) + "°";
    $("va").textContent = t("fig.v.amp", { r: F.fix(e.R, 3), l: F.fix(e.L, 3) });
    $("fa").textContent = t(p < 0 ? "fig.f.e1" : "fig.f.m1");
    $("vx").textContent = t(p < 0 ? "fig.v.perp" : "fig.v.plan");
    $("fx").textContent = t("fig.f.axe", { v: F.fix(e.rapportAxes, 3) });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.p === p)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { p = +b.dataset.p; draw(); });
  sth.oninput = draw; draw();
})();

/* ---------- the system described: how strong parity's grip is ---------- */
(() => {
  const ka = 2 * Math.PI * 0.1e-9 / 500e-9;
  $("sys1").innerHTML = t("sys1.body", { r: F.sci(1 / (ka * ka), 1) });
  $("sys2").innerHTML = t("sys2.body", { r: F.num(600 / 10, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["laporte", 1925, "idea"], ["pion", 1954, "experiment"], ["leeyang", 1956, "idea"], ["wu", 1957, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["couleurs"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["propre", "b"], ["signe", "d"], ["rotation", "a"], ["pair", "c"], ["impose", "a"], ["faible", "b"], ["laporte", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1808 });
})();
</script>
