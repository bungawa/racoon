<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, A = Q.aDepuisFrequence(23.87e9), MU = 1.47e-21 / K.c, M = 17 * K.u, L = 0.1, FLUX = 1e13;

/* ---------- the probability of leaving in state II, against the field, for one speed and for a real beam ---------- */
(() => {
  const svg = $("fig"), se = $("se"), st = $("st"), N = 120, EMAX = 1;
  function draw() {
    const Temp = +st.value, a = Math.sqrt(2 * K.k_B * Temp / M), e0 = +se.value;
    const une = e => Q.probaResonance(MU * e / K.hbar, L / a), faisceau = e => Q.moyenneFlux(v => Q.probaResonance(MU * e / K.hbar, L / v), M, Temp, 200);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, EMAX], label: t("fig.x"), fmt: v => F.num(v, 1) },
      y: { domain: [0, 1], label: t("fig.y"), fmt: v => F.num(v, 1) } });
    let best = [0, 0];
    for (const [f, cls, sty] of [[une, "c-label-2", "stroke dash"], [faisceau, "c-tint", "stroke bold"]]) {
      const pts = Array.from({ length: N + 1 }, (_, k) => { const e = EMAX * k / N, p = f(e); if (f === faisceau && p > best[1]) best = [e, p]; return [x(e), y(p)]; });
      Plot.el("path", { d: Plot.path(pts), class: sty }, Plot.el("g", { class: cls }, g));
    }
    Plot.el("line", { x1: x(e0), x2: x(e0), y1: y(0), y2: y(1), class: "stroke thin dash" }, Plot.el("g", { class: "c-label-2" }, g));
    const p = faisceau(e0);
    $("ser").textContent = F.si(e0, "V·m⁻¹", { prefix: "m" });
    $("str").innerHTML = F.kelvin(Temp);
    $("vp").textContent = F.num(p, 3);
    $("fp").textContent = t("fig.f.p", { u: F.num(une(e0), 3) });
    $("vopt").textContent = F.si(best[0], "V·m⁻¹", { prefix: "m" });
    $("fopt").textContent = t("fig.f.opt", { p: F.num(best[1], 3), e: F.si(Math.PI * K.hbar * a / (2 * MU * L), "V·m⁻¹", { prefix: "m" }) });
    $("vpuis").textContent = F.si(FLUX * 2 * A * p, "W", { prefix: "p" });
    $("fpuis").textContent = t("fig.f.puis");
  }
  se.oninput = st.oninput = draw; draw();
})();

/* ---------- the system described: the transit time and the field ---------- */
(() => {
  const a = Math.sqrt(2 * K.k_B * 300 / M), T = L / a, s = Math.PI / (2 * T);
  $("sys").innerHTML = t("sys.body", { v: F.si(a, "m·s⁻¹"), T: F.si(T, "s", { prefix: "µ" }), e: F.si(s * K.hbar / MU, "V·m⁻¹", { prefix: "m" }), r: F.sci(s / (2 * A / K.hbar), 1),
    n: F.sci(T * 23.87e9, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["basov", 1952, "idea"], ["townes", 1953, "experiment"], ["nobel", 1964, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["horloge", "espace"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pi2", "d"], ["energie", "a"], ["vitesse", "c"], ["tri", "b"], ["trop", "a"], ["trois", "d"], ["laser", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 944 });
})();
</script>
