<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, e = ES.E, PM = 1e-12;
/* An arbitrary charged group, net charge +e, for comparison: not a real ion. */
const MOLS = { eau: ES.MOLECULES.eau.charges, co2: ES.MOLECULES.co2.charges,
  ion: [{ q: 2 * e, x: 0, y: 0 }, { q: -0.5 * e, x: -80 * PM, y: 60 * PM }, { q: -0.5 * e, x: 80 * PM, y: 60 * PM }] };
const erreurs = (ch, m, P) => { const ex = ES.potentiel(ch, P); return [0, 1, 2].map(k => Math.abs(ES.potentielMultipole(m, P, k) / ex - 1)); };

/* ---------- le système décrit : la molécule d'eau vue de 1 nm ---------- */
(() => {
  const ch = MOLS.eau, m = ES.moments(ch), R = 1e-9, a = 95.7 * PM;
  let e1 = 0, e2 = 0;
  for (let k = 0; k < 360; k++) { const u = k * Math.PI / 180, er = erreurs(ch, m, [R * Math.cos(u), R * Math.sin(u)]); if (Math.abs(Math.sin(u)) > 0.5) { e1 = Math.max(e1, er[1]); e2 = Math.max(e2, er[2]); } }
  $("sys1").innerHTML = t("sys1.body", { a: F.si(a, "m", { prefix: "p" }), R: F.si(R, "m", { prefix: "n" }), x: F.num(a / R, 2), x2: F.num((a / R) ** 2, 2),
    e1: F.num(100 * e1, 2), e2: F.num(100 * e2, 2) });
})();

/* ---------- la série : erreur de chaque ordre en fonction de la distance ---------- */
(() => {
  const svg = $("serie"), an = $("an"), rr = $("rr");
  let nom = "eau";
  function draw() {
    const ch = MOLS[nom], m = ES.moments(ch), u = +an.value * Math.PI / 180, dir = [Math.cos(u), Math.sin(u)];
    const R0 = Math.pow(10, +rr.value) * 1e-9, Rs = Array.from({ length: 121 }, (_, i) => Math.pow(10, -0.5 + 1.8 * i / 120) * 1e-9);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { l: 56, r: 170 }, x: { scale: "log", domain: [0.3, 20], label: t("fig.x") }, y: { scale: "log", domain: [1e-6, 10], label: t("fig.y") } });
    const clip = v => Math.min(10, Math.max(1e-6, v));
    const E = Rs.map(R => erreurs(ch, m, [R * dir[0], R * dir[1]]));
    [["c-label-2", 0], ["c-tint", 1], ["c-warn", 2]].forEach(([cls, k]) =>
      Plot.el("path", { d: Plot.path(Rs.map((R, i) => [x(R * 1e9), y(clip(E[i][k]))])), class: "stroke " + cls }, g));
    Plot.el("line", { x1: x(R0 * 1e9), x2: x(R0 * 1e9), y1: y(1e-6), y2: y(10), class: "stroke thin dash c-label" }, g);
    /* the molecule, 1 px per 1,25 pm, and the direction of observation */
    const C = [560, 110], k = 0.8, mol = Plot.el("g", {}, svg);
    Plot.fleche(mol, C, [C[0] + 60 * dir[0], C[1] - 60 * dir[1]], { cls: "c-label-2", trait: "stroke thin dash" });
    ch.forEach(c => Plot.el("circle", { cx: C[0] + k * c.x / PM, cy: C[1] - k * c.y / PM, r: 3 + 4 * Math.sqrt(Math.abs(c.q) / e), class: "fill " + (c.q > 0 ? "c-warn" : "c-tint") }, mol));
    const P = [R0 * dir[0], R0 * dir[1]], ex = ES.potentiel(ch, P), er = erreurs(ch, m, P), pn = Math.hypot(...m.p);
    $("anr").textContent = t("fig.deg", { a: F.num(+an.value, 3) });
    $("rrr").textContent = F.si(R0, "m", { prefix: "n" });
    $("vm").textContent = t("fig.v.mom", { q: F.num(m.Q / e, 3) });
    $("fm").textContent = t("fig.f.mom", { p: pn > 1e-40 ? F.si(pn, "C·m") : "0" });
    $("vp").textContent = F.si(ex, "V");
    $("fp").textContent = t("fig.f.phi", { v: F.si(ES.potentielMultipole(m, P, 1), "V") });
    $("ve").textContent = t("fig.v.err", { e1: F.num(100 * er[1], 2), e2: F.num(100 * er[2], 2) });
    $("fe").textContent = t("fig.f.err", { x: F.num(95.7e-12 / R0, 2) });
  }
  document.querySelectorAll("#mols button").forEach(b => b.onclick = () => {
    nom = b.dataset.m; document.querySelectorAll("#mols button").forEach(z => z.setAttribute("aria-pressed", z === b)); draw(); });
  an.oninput = rr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["buckingham", 1963, "experiment"], ["fmm", 1987, "idea"], ["top", 2000, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["fmm", "geodesie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["loin", "b"], ["neutre", "d"], ["origine", "a"], ["co2", "c"], ["ordre", "b"], ["calcul", "a"], ["eau", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 65 });
})();
</script>
