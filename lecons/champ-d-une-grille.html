<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;

/* Wires 1 mm apart, 1 nC per metre each; lengths on the map in units of a. Kl = λ/(4π ε0) sets the potential scale. */
const A = 1e-3, LAMBDA = 1e-9, G = ES.grille(LAMBDA, A), KL = LAMBDA / (4 * Math.PI * ES.EPS0);

/* ---------- la carte : équipotentielles exactes et série tronquée ---------- */
(() => {
  const nh = $("nh"), hz = $("hz"), sc = $("carte"), so = $("ondul");
  const X0 = -1.5, X1 = 1.5, Z0 = -0.6, Z1 = 1.5, ox = 50, oy = 20;
  function draw() {
    const N = +nh.value, zs = +hz.value;
    sc.innerHTML = "";
    const sx = 540 / (X1 - X0), sz = 320 / (Z1 - Z0), Q = ([x, z]) => [ox + (x - X0) * sx, oy + (Z1 - z) * sz];
    const ex = ([x, z]) => { const v = G.potentiel(x * A, z * A) / KL; return Number.isFinite(v) ? Math.min(v, 6) : 6; };
    const se = ([x, z]) => G.serie(x * A, z * A, N) / KL;
    const niveaux = Array.from({ length: 16 }, (_, i) => -9.5 + i);
    [[se, "c-tint", "stroke thin dash"], [ex, "c-warn", "stroke thin"]].forEach(([fn, cls, st]) => {
      const g = Plot.el("g", { class: cls }, sc);
      niveaux.forEach(L => AnaVec.isolignes(fn, X0, X1, 151, Z0, Z1, 106, L).forEach(s => Plot.el("path", { d: Plot.path(s.map(Q)), class: st }, g)));
    });
    const fils = Plot.el("g", { class: "c-label" }, sc);
    for (let m = -1; m <= 1; m++) { const p = Q([m, 0]); Plot.el("circle", { cx: p[0], cy: p[1], r: 4, class: "fill" }, fils); }
    const h = Q([X0, zs]), h2 = Q([X1, zs]);
    Plot.el("line", { x1: h[0], y1: h[1], x2: h2[0], y2: h2[1], class: "stroke dash c-label-2" }, sc);
    Plot.el("rect", { x: ox, y: oy, width: 540, height: 320, class: "stroke thin c-label" }, sc);
    /* the ripple of Ez against height, log scale */
    so.innerHTML = "";
    const B = Plot.axes(so, { fmt: F, w: 640, h: 240, x: { domain: [0, 1.5], label: t("ond.x") }, y: { scale: "log", domain: [1e-4, 10], label: t("ond.y") } });
    const zz = Array.from({ length: 150 }, (_, i) => 0.05 + 1.45 * i / 149);
    Plot.el("path", { d: Plot.path(zz.map(z => [B.x(z), B.y(Math.max(1e-4, 2 * Math.exp(-2 * Math.PI * z)))])), class: "stroke dash c-tint" }, B.g);
    Plot.el("path", { d: Plot.path(zz.map(z => [B.x(z), B.y(Math.max(1e-4, G.ondulation(z * A)))])), class: "stroke c-warn" }, B.g);
    const o = G.ondulation(zs * A);
    Plot.el("circle", { cx: B.x(zs), cy: B.y(Math.max(1e-4, Math.min(10, o))), r: 5, class: "fill c-warn" }, B.g);
    $("nhr").textContent = String(N);
    $("hzr").textContent = t("fig.zv", { z: F.num(zs, 2), mm: F.si(zs * A, "m", { prefix: "m" }) });
    $("vo").textContent = F.num(100 * o, 2) + " %";
    $("fo").textContent = t("fig.f.ond", { e0: F.si(G.E0, "V·m⁻¹") });
    $("vh").textContent = t("fig.v.h2", { r: F.sci(G.harmonique(2, zs * A) / G.harmonique(1, zs * A), 2) });
    $("fh").textContent = t("fig.f.h2");
    const z1 = Math.asinh(100) / (2 * Math.PI);
    $("vpc").textContent = t("fig.v.pc", { z: F.num(z1, 2) });
    $("fpc").textContent = t("fig.f.pc", { mm: F.si(z1 * A, "m", { prefix: "m" }) });
  }
  nh.oninput = hz.oninput = draw;
  draw();
})();

/* ---------- la grille qui commande : la triode ---------- */
(() => {
  const a = 1e-3, r0 = 50e-6, d = 3e-3, c = 1e-3, tr = ES.triode(a, r0, d, c);
  $("sys1").innerHTML = t("sys1.body", { a: F.si(a, "m", { prefix: "m" }), r0: F.si(r0, "m", { prefix: "µ" }), d: F.si(d, "m", { prefix: "m" }),
    c: F.si(c, "m", { prefix: "m" }), delta: F.si(tr.delta, "m", { prefix: "m" }), mu: F.num(tr.mu, 3), ecran: F.num(100 * Math.exp(-2 * Math.PI * c / a), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1836, "experiment"], ["deforest", 1907, "use"], ["schottky", 1916, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm", "micro"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["loin", "b"], ["exponentielle", "c"], ["harmonique", "a"], ["pas", "d"], ["ecran", "b"], ["triode", "c"], ["fourier", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 75 });
})();
</script>
