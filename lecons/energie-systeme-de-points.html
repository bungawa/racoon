      <div class="legend"><span class="c-ok" data-i18n="sim.legend.ec"></span><span class="c-warn" data-i18n="sim.legend.ep"></span><span class="c-tint" data-i18n="sim.legend.e"></span></div>
      <div class="panel">

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/energie-systeme-de-points.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>

<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/lecons/potentiel.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- trois étoiles : une binaire serrée et une compagne lointaine ---------- */
(() => {
  const fsl = $("fsl"), E39 = 1e39;
  let count = 1;
  function draw() {
    const { m, sys, run } = Potentiel.troisEtoiles(fsl.value / 100), svg = $("echart");
    const E = run.x.map((x, i) => sys.energie(x, run.v[i], { double: count === 2 }));
    const ser = [["Ec", "stroke c-ok"], ["Ep", "stroke c-warn"], ["E", "curve"]];
    const all = E.flatMap(e => [e.Ec, e.Ep, e.E]).map(v => v / E39), lo = Math.floor(Math.min(...all)), hi = Math.ceil(Math.max(...all));
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, run.t[run.t.length - 1] / 1e8], label: t("sim.x") }, y: { domain: [lo, hi], label: t("sim.y") } });
    Plot.el("line", { x1: x(0), x2: x(run.t[run.t.length - 1] / 1e8), y1: y(0), y2: y(0), class: "zero" }, g);
    ser.forEach(([k, cls]) => Plot.el("path", { d: E.map((e, i) => (i ? "L" : "M") + x(run.t[i] / 1e8).toFixed(1) + " " + y(e[k] / E39).toFixed(1)).join(""), class: cls }, g));
    const Es = E.map(e => e.E), spread = (Math.max(...Es) - Math.min(...Es)) / Math.abs(Es[0]), Ecs = E.map(e => e.Ec);
    const ass = Potentiel.assemblage(m, [0, 1, 2].map(i => run.x[0].slice(2 * i, 2 * i + 2))).reduce((s, w) => s + w, 0);
    $("fread").textContent = F.qty(fsl.value, "%");
    $("vass").textContent = F.si(ass, "J");
    $("vec").textContent = t("sim.range", { a: F.num(Math.min(...Ecs) / E39, 3), b: F.num(Math.max(...Ecs) / E39, 3) });
    $("vde").textContent = F.sci(spread, 2);
    $("fde").textContent = t(count === 1 ? "sim.f.de1" : "sim.f.de2");
  }
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { count = +b.dataset.c;
    document.querySelectorAll("[data-c]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  fsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1687, "idea"], ["helmholtz", 1847, "idea"], ["rankine", 1853, "idea"], ["zwicky", 1933, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ncorps", "amas"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["paires", "a"], ["signe", "a"], ["double", "a"], ["assembler", "a"], ["interne", "a"], ["soleil", "a"], ["point", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 133 });
})();
</script>
