<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes, c = Cst.c;

/* ---------- the wire seen from S (wire at rest) and from S' (test charge at rest) ---------- */
(() => {
  const svg = $("fil"), D = 34, X0 = 40, X1 = 568;          // spacing of the charges at rest in S, px
  function rang(g, y, pas, phase, cls, signe, vit) {
    const gg = Plot.el("g", { class: cls }, g);
    for (let x = X0 + phase; x <= X1; x += pas) {
      Plot.el("circle", { cx: x, cy: y, r: 7, class: "stroke" }, gg);
      Plot.el("line", { x1: x - 4, y1: y, x2: x + 4, y2: y, class: "stroke" }, gg);
      if (signe > 0) Plot.el("line", { x1: x, y1: y - 4, x2: x, y2: y + 4, class: "stroke" }, gg);
    }
    if (Math.abs(vit) > 0.005) Plot.fleche(gg, [X1 + 26 - 13 * Math.sign(vit), y], [X1 + 26 - 13 * Math.sign(vit) + 26 * Math.sign(vit) * Math.min(1, Math.abs(vit) * 1.4), y], { cls, tete: 7 });
  }
  function panneau(y0, titre, ions, elec, vIons, vElec, vq, force) {
    const g = Plot.el("g", {}, svg);
    Plot.el("text", { x: X0, y: y0 }, g).textContent = titre;
    Plot.el("rect", { x: X0 - 14, y: y0 + 12, width: X1 - X0 + 28, height: 52, rx: 10, class: "stroke thin" }, Plot.el("g", { class: "c-label-2" }, g));
    rang(g, y0 + 28, D * ions, 0, "c-tint", +1, vIons);
    rang(g, y0 + 48, D * elec, D / 2, "c-warn", -1, vElec);
    const gq = Plot.el("g", { class: "c-ok" }, g), yq = y0 + 112;
    Plot.el("circle", { cx: 320, cy: yq, r: 8, class: "fill" }, gq);
    if (Math.abs(vq) > 0.005) Plot.fleche(gq, [332, yq], [332 + 40 * Math.sign(vq) * Math.min(1, Math.abs(vq) * 1.4), yq], { cls: "c-ok", tete: 8 });
    if (force) Plot.fleche(gq, [300, yq], [300, yq + Math.sign(force) * (8 + Math.min(30, 18 * Math.abs(force)))], { cls: "c-ok", tete: 8 });   // F < 0: toward the wire, up
  }
  function draw() {
    const v = +$("vsl").value / 100 * c, v0 = +$("v0sl").value / 100 * c;
    $("vread").textContent = F.qty(F.num(v / c, 2), "c");
    $("v0read").textContent = F.qty(F.num(v0 / c, 2), "c");
    const m = M.filEnMouvement({ lambda: 1, v, v0, r: 1, q: -1 });
    const g0 = m.gamma0, gv = M.gammaLorentz(v), w = (v - v0) / (1 - v * v0 / (c * c));
    svg.innerHTML = "";
    /* spacing = 1/density: ions γ0 closer in S'; electrons at rest spacing γ(v) D, seen at w: divided by γ(w) */
    const fS = Math.abs(m.S.F), ref = fS > 0 ? fS : 1;
    panneau(20, t("fi.S"), 1, 1, 0, v / c, v0 / c, m.S.F / ref);
    panneau(185, t("fi.Sp"), 1 / g0, gv / M.gammaLorentz(w), -v0 / c, w / c, 0, fS > 0 ? m.Sp.F / ref : 0);
    $("vlam").textContent = F.num(m.Sp.lambda, 3);
    $("vforce").textContent = fS > 0 ? t("fi.v.force", { r: F.num(m.rapport, 4), g: F.num(g0, 4) }) : "–";
    $("vimp").textContent = fS > 0 ? F.num(M.impulsions(m, 1).rapport, 6) : "–";
  }
  $("vsl").oninput = draw; $("v0sl").oninput = draw; draw();
})();

/* ---------- the system: a real copper wire, 10 A in 1 mm² ---------- */
(() => {
  const cu = M.filCuivre(10, 1e-6), m = M.filEnMouvement({ lambda: cu.lambda, v: cu.v, v0: cu.v, r: 0.01, q: -Cst.e });
  $("sys").innerHTML = t("sys.body", { v: F.si(cu.v, "m·s⁻¹"), b2: F.sci((cu.v / c) ** 2, 2), lam: F.si(cu.lambda, "C·m⁻¹"),
    lp: F.qty(F.sci(m.Sp.lambda, 2), "C·m⁻¹"), d: F.si(Cst.e / m.Sp.lambda, "m"), f: F.qty(F.sci(Math.abs(m.S.F), 2), "N") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rowland", 1876, "experiment"], ["einstein", 1905, "idea"], ["purcell", 1965, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["faisceau"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["repos", "b"], ["invariance", "d"], ["signe", "a"], ["cuivre", "c"], ["force", "c"], ["impulsion", "a"], ["lignes", "d"], ["faisceau", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 136 });
})();
</script>
