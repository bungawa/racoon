<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, MU0 = Constantes.mu0;
/* the ring of the page: 500 turns, section 1 cm², mean length 20 cm, copper winding of 1 Ω; iron of density 7 874 kg·m⁻³ */
const NT = 500, AS = 1e-4, LM = 0.2, RW = 1, RHO = 7874, F50 = 50;

/* ---------- le système décrit : résistance contre réactance ---------- */
(() => {
  const L = M.inductanceFer(1000, NT, AS, LM), X = 2 * Math.PI * F50 * L;
  $("sys1").innerHTML = t("sys1.body", { L: F.si(L, "H", { sig: 2 }), X: F.si(X, "Ω", { sig: 2 }), r: F.qty(F.num(100 * RW / X, 2), "%"),
    L0: F.si(M.inductanceFer(1, NT, AS, LM), "H", { sig: 2 }) });
})();

/* ---------- cycle, inductance et courant : une même figure de fer ---------- */
(() => {
  const sh = $("sh"), sk = $("sk");
  function cycle(svg, c, Hm) {
    svg.innerHTML = "";
    const X = Hm / 1e3, Y = 1.15 * Math.max(0.2, c.Bmax);
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 340, x: { domain: [-X, X], label: t("fig1.ax.x") }, y: { domain: [-Y, Y], label: t("fig1.ax.y") } });
    const xy = q => [P.x(q[0] / 1e3), P.y(q[1])];
    Plot.el("path", { d: Plot.path(c.descendante.concat(c.montante).map(xy)) + "Z", class: "area" }, P.g);
    Plot.el("path", { d: Plot.path(c.premiere.map(xy)), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(c.descendante.map(xy)), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(c.montante.map(xy)), class: "curve" }, P.g);
  }
  function inductance(svg, c) {
    const L = M.inductanceCourbe(c.premiere, NT, AS, LM).filter(r => r.I > 0), Imax = L[L.length - 1].I;
    const Ym = 1.1 * Math.max(...L.map(r => Math.max(r.Lapp, r.Ldiff)));
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, x: { domain: [0, Imax], label: t("fig2.ax.x") }, y: { domain: [0, Ym], label: t("fig2.ax.y") } });
    Plot.el("path", { d: Plot.path(L.map(r => [P.x(r.I), P.y(r.Lapp)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(L.map(r => [P.x(r.I), P.y(Math.max(0, r.Ldiff))])), class: "ref" }, P.g);
  }
  function onde(svg, c) {
    const w = M.courantMagnetisant(c, { n: 360 }), Ipk = Math.max(...w.H.map(Math.abs)) * LM / NT;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, x: { domain: [0, 360], label: t("fig3.ax.x") }, y: { domain: [-1.1, 1.1], label: t("fig3.ax.y") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(360), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const deg = th => th * 180 / Math.PI;
    Plot.el("path", { d: Plot.path(w.theta.map((th, i) => [P.x(deg(th)), P.y(w.B[i] / c.Bmax)])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(w.theta.map((th, i) => [P.x(deg(th)), P.y(w.H[i] * LM / NT / Ipk)])), class: "curve" }, P.g);
    const h1 = w.harmoniques[0] * LM / NT;
    $("vcr").innerHTML = F.si(Ipk, "A", { sig: 2 });
    $("fcr").innerHTML = t("fig3.f.crete", { r: F.num(Ipk / h1, 3) });
    $("vh3").innerHTML = F.qty(F.num(100 * w.harmoniques[1], 2), "%");
    $("fh3").innerHTML = t("fig3.f.h3", { h5: F.qty(F.num(100 * w.harmoniques[2], 2), "%") });
    $("vd").innerHTML = F.qty(F.num(w.dephasage * 180 / Math.PI, 2), "°");
    $("fd").innerHTML = t("fig3.f.d");
  }
  function draw() {
    const Hm = Math.pow(10, +sh.value), k = Math.pow(10, +sk.value), p = Object.assign({}, M.ACIER_JA, { k });
    const c = M.cycleHysteresis(p, Hm, { n: 300 }), e = M.energieCycle(c);
    cycle($("cycle"), c, Hm); inductance($("induc"), c); onde($("onde"), c);
    $("shr").innerHTML = t("fig1.f.hmax", { H: F.si(Hm, "A·m⁻¹", { sig: 2 }), I: F.si(Hm * LM / NT, "A", { sig: 2 }) });
    $("skr").innerHTML = F.si(k, "A·m⁻¹", { sig: 2 });
    $("vaire").innerHTML = F.si(e.aire, "J·m⁻³", { sig: 3 });
    $("faire").innerHTML = t("fig1.f.aire", { B: F.si(c.Bmax, "T", { sig: 3 }) });
    $("vp").innerHTML = F.si(e.aire * F50 / RHO, "W·kg⁻¹", { sig: 2 });
    $("fp").innerHTML = t("fig1.f.p", { P: F.si(e.aire * F50 * LM * AS, "W", { sig: 2 }) });
    $("vprem").innerHTML = F.si(e.premiere, "J·m⁻³", { sig: 3 });
    $("fprem").innerHTML = t("fig1.f.prem", { r: F.si(e.rendue, "J·m⁻³", { sig: 2 }) });
    $("vvide").innerHTML = F.si(e.vide, "J·m⁻³", { sig: 3 });
    $("fvide").innerHTML = t("fig1.f.vide", { r: F.num(e.vide / e.premiere, 2) });
  }
  sh.oninput = sk.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["steinmetz", 1892, "idea"], ["hadfield", 1900, "experiment"], ["goss", 1934, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tole"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["energie", "b"], ["pertes", "d"], ["spires", "a"], ["calcul", "c"], ["sature", "b"], ["pointe", "a"], ["vide", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 364 });
})();
</script>
