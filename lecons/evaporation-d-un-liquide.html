    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>V</mi><mo>(</mo><mi>r</mi><mo>)</mo><mo>=</mo><mn>4</mn><mi>ε</mi><mrow><mo>[</mo><msup><mrow><mo>(</mo><mfrac><mi>σ</mi><mi>r</mi></mfrac><mo>)</mo></mrow><mn>12</mn></msup><mo>−</mo><msup><mrow><mo>(</mo><mfrac><mi>σ</mi><mi>r</mi></mfrac><mo>)</mo></mrow><mn>6</mn></msup><mo>]</mo></mrow></math></div>

    <div class="eq"><math display="block"><mtext data-i18n="eq.proba"></mtext><mo>∝</mo><msup><mi>e</mi><mrow><mo>−</mo><munder><mo>∑</mo><mrow><mi>i</mi><mo>&lt;</mo><mi>j</mi></mrow></munder><mi>V</mi><mo>(</mo><msub><mi>r</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><mo>)</mo><mo>/</mo><msub><mi>k</mi><mi>B</mi></msub><mi>T</mi></mrow></msup></math></div>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>

    <figure class="chart">
      <svg class="fig" id="paire" role="img" data-i18n-attr="aria-label:paire.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="paire.legend"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="tp" data-i18n="paire.t"></label><output id="tpv" for="tp"></output></div>
            <input id="tp" type="range" min="20" max="1000" step="10" value="90"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="paire.k.ts"></span><span class="v" id="vts"></span><span class="f" data-i18n="paire.f.ts"></span></div>
          <div class="stat"><span class="k" data-i18n-html="paire.k.max"></span><span class="v" id="vmax"></span><span class="f" data-i18n="paire.f.max"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="paire.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="sim.sec"></span>
    <h2 data-i18n="sim.h2"></h2>
    <p data-i18n-html="sim.p"></p>
    <figure class="chart">
      <svg class="fig" id="boite" role="img" data-i18n-attr="aria-label:sim.aria"></svg>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="ts" data-i18n="sim.t"></label><output id="tsv" for="ts"></output></div>
            <input id="ts" type="range" min="20" max="300" step="5" value="30"></div>
        </div>
        <div class="controls"><button class="btn tinted" type="button" id="go" data-i18n="sim.go"></button><button class="btn tinted" type="button" id="raz" data-i18n="sim.raz"></button></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="sim.k.dense"></span><span class="v" id="vdense"></span><span class="f" data-i18n="sim.f.dense"></span></div>
          <div class="stat"><span class="k" data-i18n-html="sim.k.e"></span><span class="v" id="ve"></span><span class="f" data-i18n="sim.f.e"></span></div>
          <div class="stat"><span class="k" data-i18n-html="sim.k.acc"></span><span class="v" id="vacc"></span><span class="f" data-i18n="sim.f.acc"></span></div>
          <div class="stat"><span class="k" data-i18n-html="sim.k.n"></span><span class="v" id="vn"></span><span class="f" data-i18n="sim.f.n"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="sim.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p data-i18n-html="sys.inner"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mfrac><msub><mi>n</mi><mtext data-i18n="eq.vap"></mtext></msub><msub><mi>n</mi><mtext data-i18n="eq.liq"></mtext></msub></mfrac><mo>≈</mo><mi>A</mi><mspace width="0.2em"/><msup><mi>e</mi><mrow><mo>−</mo><mi>W</mi><mo>/</mo><msub><mi>k</mi><mi>B</mi></msub><mi>T</mi></mrow></msup></math></div>
    <p class="validite" data-i18n-html="val.vap"></p>
    <div class="panel">
      <div class="controls">
        <div class="ctl"><div class="row"><label for="tv" data-i18n="vap.t"></label><output id="tvv" for="tv"></output></div>
          <input id="tv" type="range" min="280" max="640" step="5" value="300"></div>
      </div>
      <div class="stats">
        <div class="stat"><span class="k" data-i18n-html="vap.k.w"></span><span class="v" id="vw"></span><span class="f" data-i18n="vap.f.w"></span></div>
        <div class="stat"><span class="k" data-i18n-html="vap.k.l"></span><span class="v" id="vl"></span><span class="f" id="fl"></span></div>
        <div class="stat"><span class="k" data-i18n-html="vap.k.r"></span><span class="v" id="vr"></span><span class="f" id="fr"></span></div>
      </div>
    </div>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/evaporation-d-un-liquide.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/thermo.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/statistique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, { k_B } = Constantes, P = S.LJ_AR;

/* ---------- deux atomes : le facteur de Boltzmann de leur distance ---------- */
(() => {
  const svg = $("paire"), st = $("tp"), RMIN = 0.3e-9, RMAX = 1.0e-9;
  function draw() {
    const T = +st.value, kT = k_B * T;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { domain: [RMIN * 1e9, RMAX * 1e9], label: t("paire.x") }, y: { scale: "log", domain: [1e-3, 1e3], label: t("paire.y") } });
    const pts = [];
    for (let i = 0; i <= 200; i++) { const r = RMIN + (RMAX - RMIN) * i / 200, f = S.facteur(S.lj(r), T); if (f >= 1e-3 && f <= 1e3) pts.push([o.x(r * 1e9), o.y(f)]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke c-tint" }, o.g);
    Plot.el("line", { x1: o.x(RMIN * 1e9), x2: o.x(RMAX * 1e9), y1: o.y(1), y2: o.y(1), class: "ref" }, o.g);
    $("tpv").innerHTML = F.kelvin(T);
    $("vts").textContent = F.fix(kT / P.eps, 2);
    $("vmax").textContent = F.num(S.facteur(-P.eps, T), 3);
  }
  st.oninput = draw; draw();
})();

/* ---------- cent atomes dans un plan : Metropolis ---------- */
(() => {
  const N = 100, L = 20 * P.sigma, svg = $("boite"), st = $("ts"), rand = Quiz.rng(403), PX = 400 / L;
  svg.setAttribute("viewBox", "0 0 400 400");
  Plot.el("rect", { x: 0, y: 0, width: 400, height: 400, class: "stroke rim" }, svg);
  const dots = Array.from({ length: N }, () => Plot.el("circle", { r: (0.5 * P.sigma * PX).toFixed(1), class: "fill c-tint" }, svg));
  let s, run = false, frames = 0;
  function raz() { s = S.gaz2D({ N, L }, Quiz.rng(7)); run = false; montre(); }
  function montre() {
    const T = +st.value;
    for (let i = 0; i < N; i++) { dots[i].setAttribute("cx", (s.x[i] * PX).toFixed(1)); dots[i].setAttribute("cy", (s.y[i] * PX).toFixed(1)); }
    $("tsv").innerHTML = F.kelvin(T);
    $("vdense").textContent = F.qty(F.num(100 * S.dense(s), 2), "%");
    $("ve").textContent = F.fix(S.energiePaires(s) / (N * P.eps), 2);
    $("vacc").textContent = s.essais ? F.qty(F.num(100 * s.acc / s.essais, 2), "%") : "—";
    $("vn").textContent = F.num(s.essais / N, 3);
    $("go").textContent = t(run ? "sim.pause" : "sim.go");
  }
  st.oninput = montre;
  $("go").onclick = () => { run = !run; montre(); };
  $("raz").onclick = raz;
  raz();
  (function tick() {
    requestAnimationFrame(tick);
    if (!run) return;
    S.metropolis(s, 3000, +st.value, rand);
    if (++frames % 2 === 0) montre();
  })();
})();

/* ---------- l'eau : la pente de la pression de vapeur ---------- */
(() => {
  const st = $("tv");
  function draw() {
    const T = +st.value, e = S.extraction(T);
    $("tvv").innerHTML = F.kelvin(T);
    $("vw").textContent = F.fix(e.W / e.kT, 1);
    $("vl").textContent = F.fix((e.Lm - e.kT) / e.kT, 1);
    $("fl").textContent = t("vap.f.l", { e: F.num(100 * (e.W / (e.Lm - e.kT) - 1), 2) });
    $("vr").textContent = F.sci(e.rapport, 2);
    $("fr").textContent = t("vap.f.r", { a: F.sci(e.rapport * Math.exp(e.W / e.kT), 2) });
  }
  st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["vdw", 1873, "idea"], ["lj", 1924, "idea"], ["metropolis", 1953, "experiment"], ["rahman", 1964, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["simulation", "distillation"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["chaud", "c"], ["froid", "a"], ["r0", "d"], ["nombre", "b"], ["pente", "a"], ["prefacteur", "c"], ["metro", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 403 });
})();
</script>
