<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptOnd, DEG = Math.PI / 180;
const deg = (x, n) => F.qty(F.num(x, n || 3), "°");

/* ---------- une lame de cristal uniaxe : ondelettes de Huygens, rayons ordinaire et extraordinaire ---------- */
(() => {
  const svg = $("lame"), sa = $("sa"), si = $("si"), se = $("se"), cristal = $("cristal"), pol = $("pol");
  let nom = "calcite", etat = "naturelle";
  const y0 = 80, H = 160, x0 = 220;                                               // entry face at y0, the plate H px thick, entry point x0
  function draw() {
    const { no, ne } = O.CRISTAUX[nom], axe = +sa.value * DEG, i = +si.value * DEG, e = +se.value / 1000;
    const L = O.lameUniaxe({ no, ne, axe, i, e });
    svg.innerHTML = "";
    Plot.el("rect", { x: 30, y: y0, width: 580, height: H, class: "stroke thin c-label-2" }, svg);
    /* the optic axis: parallel dashed lines across the plate */
    const ax = [Math.sin(axe), Math.cos(axe)];
    for (let k = -6; k <= 6; k++) { const cx = 320 + 70 * k, cy = y0 + H / 2, l = 30;
      Plot.el("line", { x1: cx - l * ax[0], y1: cy - l * ax[1], x2: cx + l * ax[0], y2: cy + l * ax[1], class: "stroke thin dash c-label-2" }, svg); }
    /* Huygens' wavelets from the entry point, for one instant: sphere c t/no, ellipsoid c t/no along the axis, c t/ne across */
    const s = 120, rot = Math.atan2(ax[1], ax[0]) / DEG;
    const clip = Plot.el("clipPath", { id: "dedans" }, svg); Plot.el("rect", { x: 30, y: y0, width: 580, height: H }, clip);
    const front = (Q, t0, cls) => { const u = [Math.cos(t0), -Math.sin(t0)];   // the envelope: through Q, normal to the wave
      Plot.el("line", { x1: Q[0] - 150 * u[0], y1: Q[1] - 150 * u[1], x2: Q[0] + 150 * u[0], y2: Q[1] + 150 * u[1], class: "stroke thin " + cls, "clip-path": "url(#dedans)" }, svg);
      Plot.el("circle", { cx: Q[0], cy: Q[1], r: 3, class: "fill " + cls }, svg); };
    if (etat !== "e") { Plot.el("circle", { cx: x0, cy: y0, r: s / no, class: "stroke thin dash c-warn", "clip-path": "url(#dedans)" }, svg);
      front([x0 + s / no * Math.sin(L.o.r), y0 + s / no * Math.cos(L.o.r)], L.o.r, "c-warn"); }
    if (etat !== "o") { const g = Plot.el("g", { "clip-path": "url(#dedans)" }, svg);              // clip outside the transform
      Plot.el("ellipse", { cx: x0, cy: y0, rx: s / no, ry: s / ne, transform: `rotate(${rot.toFixed(2)} ${x0} ${y0})`, class: "stroke thin dash c-tint" }, g);
      const ph = L.e.psi - axe, r = s / Math.hypot(no * Math.cos(ph), ne * Math.sin(ph));   // the ellipse along the ray
      front([x0 + r * Math.sin(L.e.psi), y0 + r * Math.cos(L.e.psi)], L.e.onde, "c-tint"); }
    /* the rays: incident, through the plate (scaled so that e is H px), out parallel to the incident one */
    const k = H / e, out = 60, d = [Math.sin(i), Math.cos(i)];
    Plot.fleche(svg, [x0 - 70 * d[0] / d[1], y0 - 70], [x0, y0], { cls: "c-label" });
    const rayon = (x, cls) => { const xe = x0 + k * x;
      Plot.el("line", { x1: x0, y1: y0, x2: xe, y2: y0 + H, class: "stroke bold " + cls }, svg);
      Plot.fleche(svg, [xe, y0 + H], [xe + out * d[0], y0 + H + out * d[1]], { cls, trait: "stroke bold" }); };
    if (etat !== "e") rayon(L.o.x, "c-warn");
    if (etat !== "o") { rayon(L.e.x, "c-tint");
      const t0 = L.e.onde;                                                          // the wave normal, for comparison
      Plot.el("line", { x1: x0, y1: y0, x2: x0 + 0.6 * H * Math.tan(t0), y2: y0 + 0.6 * H, class: "stroke thin dash c-tint" }, svg); }
    $("sar").textContent = deg(+sa.value); $("sir").textContent = deg(+si.value); $("ser").textContent = F.qty(F.num(+se.value, 3), "mm");
    $("vrho").textContent = deg(Math.abs(L.e.rho) / DEG);
    $("frho").textContent = t("fig.f.rho", { n: F.num(L.e.n, 5), no: F.num(no, 5) });
    $("vecart").textContent = F.si(L.ecart, "m", { prefix: "m" });
    $("fecart").textContent = t("fig.f.ecart", { v: F.num(100 * L.ecart / e, 2) });
    const z = x => (Math.abs(x) < 1e-9 ? 0 : x / DEG);                             // no "−0"
    $("vsnell").textContent = deg(z(L.e.psi));
    $("fsnell").textContent = t("fig.f.snell", { onde: deg(z(L.e.onde)), o: deg(z(L.o.r)) });
    cristal.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === nom)));
    pol.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === etat)));
  }
  cristal.querySelectorAll("button").forEach(b => b.onclick = () => { nom = b.dataset.c; draw(); });
  pol.querySelectorAll("button").forEach(b => b.onclick = () => { etat = b.dataset.p; draw(); });
  sa.oninput = si.oninput = se.oninput = draw; draw();
})();

/* ---------- le système décrit : un laser circulaire sur une lame demi-onde ---------- */
(() => {
  const P = 1e-3, lam = 633e-9, w = 2 * Math.PI * O.c / lam, hbar = Constantes.hbar;
  $("sys1").innerHTML = t("sys1.body", { P: F.si(P, "W", { prefix: "m" }), lam: F.si(lam, "m", { prefix: "n" }), N: F.sci(P / (hbar * w), 2),
    L: F.sci(O.momentCirculaire(P, w), 2), C: F.sci(O.couple(P, lam, 2), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bartholin", 1669, "experiment"], ["huygens", 1690, "idea"], ["nicol", 1828, "experiment"], ["beth", 1936, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["glan", "pinces"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "c"], ["axe", "a"], ["sortie", "d"], ["snell", "b"], ["tourne", "c"], ["circ", "a"], ["moment", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 337 });
})();
</script>
