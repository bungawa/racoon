<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const onTheme = f => { f(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", f); new MutationObserver(f).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] }); };

/* ---------- §1-3 : évaporation et dissolution, un seul mécanisme ---------- */
(() => {
  const DT = 0.02, STEPS = 6, WIN = 2, SPAN = 80;           // model time per step, steps per frame, rate window, chart span
  const canvas = $("sim"), ctx = canvas.getContext("2d"), out = $("simread");
  const tsl = $("tsl"), rand = Quiz.rng(13);
  const LEG = { vapeur: [["el-o", "molecule"]], solution: [["el-n", "na"], ["el-c", "cl"]] };
  let w, mode = "vapeur", hist = [], acc = { out: 0, back: 0, t: 0 }, ink = {}, chart;
  onTheme(() => ink = { wall: css("--label-2"), o: css("--el-o"), na: css("--el-n"), cl: css("--el-c"), tint: css("--tint") });

  function axes() {
    const svg = $("flows"); svg.innerHTML = "";
    const top = mode === "vapeur" ? 30 : 8;
    chart = Plot.axes(svg, { fmt: F, w: 640, h: 220, pad: { b: 40 }, x: { domain: [0, SPAN], label: t("flows.x") }, y: { domain: [0, top], label: t("flows.y") } });
    chart.top = top;
    chart.pOut = Plot.el("path", { class: "curve" }, chart.g); chart.pBack = Plot.el("path", { class: "ref" }, chart.g);
    Plot.el("text", { x: 70, y: 24, class: "note" }, chart.g).textContent = t("flows.legend");
  }
  function reset() {
    w = Equil.world({ mode, T: +tsl.value }); hist = []; acc = { out: 0, back: 0, t: 0 };
    $("flush").textContent = t("sim.flush." + mode); $("add").textContent = t("sim.add." + mode); $("remove").textContent = t("sim.remove." + mode);
    $("flush").setAttribute("aria-pressed", "false");
    $("kfree").textContent = t("sim.k.free." + mode); $("kbound").textContent = t("sim.k.bound." + mode);
    $("simlegend").innerHTML = LEG[mode].map(([c]) => `<span class="${c}"></span>`).join("");
    [...$("simlegend").children].forEach((s, i) => s.textContent = t("sim.legend." + LEG[mode][i][1]));
    axes();
  }
  $("mode").querySelectorAll("button").forEach(b => b.onclick = () => {
    mode = b.dataset.mode; $("mode").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); reset(); });
  tsl.oninput = () => { w.Tamb = +tsl.value; tread(); };
  const tread = () => $("tread").innerHTML = F.kelvin(+tsl.value);
  $("flush").onclick = () => { w.open = !w.open; $("flush").setAttribute("aria-pressed", w.open); };
  $("add").onclick = () => Equil.inject(w, mode === "vapeur" ? 120 : 150, rand);
  $("remove").onclick = () => Equil.withdraw(w, 0.9, rand);
  $("refill").onclick = reset;
  reset(); tread();

  function size() { const r = canvas.getBoundingClientRect(), d = Math.min(devicePixelRatio, 2); canvas.width = r.width * d; canvas.height = r.height * d; }
  new ResizeObserver(size).observe(canvas); size();
  let visible = true; new IntersectionObserver(e => visible = e[0].isIntersecting).observe(canvas);

  function draw() {
    const cw = canvas.width, ch = canvas.height, sc = Math.min(cw / (w.W + 8), ch / (w.H + 18)), ox = (cw - w.W * sc) / 2, base = ch - 4 * sc;   // room above for the overlay
    ctx.clearRect(0, 0, cw, ch);
    ctx.strokeStyle = ink.wall; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ox, base - w.H * sc); ctx.lineTo(ox, base); ctx.lineTo(ox + w.W * sc, base); ctx.lineTo(ox + w.W * sc, base - w.H * sc);
    if (!w.open) ctx.lineTo(ox, base - w.H * sc);
    ctx.stroke();
    if (w.open) { ctx.strokeStyle = ink.tint; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(ox, base - w.H * sc); ctx.lineTo(ox + w.W * sc, base - w.H * sc); ctx.stroke(); ctx.setLineDash([]); }
    const r = Math.max(1.5, sc * 0.9), sol = mode === "solution";
    for (let k = 0; k < w.NL; k++) {                          // condensed phase, row by row from the bottom
      const i = k % w.cols, j = Math.floor(k / w.cols);
      ctx.fillStyle = sol ? ((i + j) % 2 ? ink.cl : ink.na) : ink.o;
      ctx.beginPath(); ctx.arc(ox + (i + 0.5) * w.row * sc, base - (j + 0.5) * w.row * sc, r, 0, 6.283); ctx.fill();
    }
    for (let i = 0; i < w.n; i++) {
      ctx.fillStyle = sol ? (i % 2 ? ink.cl : ink.na) : ink.o;
      ctx.beginPath(); ctx.arc(ox + w.x[i] * sc, base - w.y[i] * sc, r, 0, 6.283); ctx.fill();
    }
  }
  function plot() {
    const { x, y } = chart, t0 = hist.length ? hist[hist.length - 1].t - SPAN : 0, cl = v => y(Math.min(v, chart.top));
    const path = k => hist.map((h, i) => (i ? "L" : "M") + x(Math.max(h.t - Math.max(t0, 0), 0)).toFixed(1) + " " + cl(h[k]).toFixed(1)).join("");
    chart.pOut.setAttribute("d", path("out")); chart.pBack.setAttribute("d", path("back"));
  }
  function tick() {
    requestAnimationFrame(tick);
    if (!visible) return;
    for (let s = 0; s < STEPS; s++) { const r = Equil.step(w, DT, rand); acc.out += r.out; acc.back += r.back; acc.t += DT; }
    if (acc.t >= WIN) {
      hist.push({ t: w.time, out: acc.out / acc.t, back: acc.back / acc.t });
      if (hist.length && hist[hist.length - 1].t - hist[0].t > SPAN) hist.shift();
      out.textContent = t("sim.readout", { o: F.fix(acc.out / acc.t, 1), b: F.fix(acc.back / acc.t, 1) });
      acc = { out: 0, back: 0, t: 0 }; plot();
    }
    $("vfree").textContent = w.n; $("vbound").textContent = w.NL; $("vtemp").innerHTML = F.kelvin(w.T);
    draw();
  }
  tick();
})();

/* ---------- §1-3 : ions hydratés ---------- */
(() => {
  const svg = $("ions");
  /* water: O at distance 46 from the ion, H pair pointing away (around Na⁺) or toward it (around Cl⁻) */
  const water = (cx, cy, ang, toward) => {
    const ox = cx + 46 * Math.cos(ang), oy = cy + 46 * Math.sin(ang), dir = toward ? ang + Math.PI : ang;
    [-0.9, 0.9].forEach(d => Plot.el("circle", { cx: ox + 17 * Math.cos(dir + d), cy: oy + 17 * Math.sin(dir + d), r: 7, class: "fill rim el-h" }, svg));
    Plot.el("circle", { cx: ox, cy: oy, r: 12, class: "fill el-o" }, svg);
  };
  const ion = (cx, cy, r, cls, key, toward) => {
    for (let k = 0; k < 6; k++) water(cx, cy, k * Math.PI / 3 + 0.3, toward);
    Plot.el("circle", { cx, cy, r, class: "fill " + cls }, svg);
    Plot.el("text", { x: cx, y: cy + 100, "text-anchor": "middle" }, svg).textContent = t(key);
  };
  ion(140, 105, 16, "el-n", "ions.lab.na", false);
  ion(420, 105, 24, "el-c", "ions.lab.cl", true);
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["henry", 1803, "experiment"], ["berthollet", 1803, "idea"], ["clapeyron", 1834, "idea"], ["guldberg", 1864, "idea"],
    ["bert", 1878, "experiment"], ["arrhenius", 1884, "idea"], ["haldane", 1908, "use"], ["bragg", 1913, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["plongee", "tours", "soda", "sel"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["lid", "a"], ["fan", "c"], ["cool", "b"], ["humid", "d"], ["salt", "a"], ["orient", "b"], ["diver", "c"], ["hot", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 3 });
})();
</script>
