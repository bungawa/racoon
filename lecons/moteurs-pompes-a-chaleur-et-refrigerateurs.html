<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const P = Plot.el, path = Plot.path;

/* ---------- §3 : pincement dans les deux échangeurs ---------- */
(() => {
  const DEF = { moteur: { Tc: 838, Tf: 298, dT: 20 }, pac: { Tc: 308, Tf: 280, dT: 5 }, frigo: { Tc: 298, Tf: 255, dT: 5 } };
  const MESURE = [4.0, 5.7];                           // COP measured at A7/W35 to EN 14511 (Swiss test centre, 2026)
  let mode = "pac";
  const set = m => { mode = m; ["Tc", "Tf", "dT"].forEach(k => $(k.toLowerCase()).value = DEF[m][k]); draw(); };
  const fmtE = e => mode === "moteur" ? F.qty(F.num(100 * e, 3), "%") : F.fix(e, 2);
  function draw() {
    let Tc = +$("tc").value, Tf = +$("tf").value;
    if (Tf > Tc - 5) { Tf = Tc - 5; $("tf").value = Tf; }
    const dmax = mode === "moteur" ? Math.min(60, Math.floor((Tc - Tf) / 2) - 1) : 60;
    const dT = Math.min(+$("dt").value, dmax); $("dt").value = dT;
    const K = s => s + 0.15;                           // sliders in whole kelvins at the usual Celsius points
    const r = Thermo.pincement(mode, K(Tc), K(Tf), dT), d = Thermo.ditherme(mode, K(Tc), K(Tf), r.sigma);
    const top = mode === "moteur" ? 1 : Math.min(40, Math.ceil(1.15 * d.carnot));
    const svg = $("pin"); svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 52 }, x: { domain: [0, 60], label: t("pin.x") },
      y: { domain: [0, top], label: t(mode === "moteur" ? "pin.y.moteur" : "pin.y.cop") } });
    if (mode === "pac" && Tc === DEF.pac.Tc && Tf === DEF.pac.Tf) {
      P("rect", { x: o.x(0), width: o.x(60) - o.x(0), y: o.y(MESURE[1]), height: o.y(MESURE[0]) - o.y(MESURE[1]), class: "area" }, o.g);
      P("text", { x: o.x(59), y: o.y(MESURE[1]) - 6, "text-anchor": "end", class: "note" }, o.g).textContent = t("pin.mesure");
    }
    P("line", { x1: o.x(0), x2: o.x(60), y1: o.y(Math.min(d.carnot, top)), y2: o.y(Math.min(d.carnot, top)), class: "ref" }, o.g);
    P("text", { x: o.x(59), y: o.y(Math.min(d.carnot, top)) + 16, "text-anchor": "end", class: "note" }, o.g).textContent = t("pin.carnot");
    const pts = [];
    for (let k = 0; k <= dmax; k++) pts.push([o.x(k), o.y(Math.min(Thermo.pincement(mode, K(Tc), K(Tf), k).e, top))]);
    P("path", { d: path(pts), class: "curve" }, o.g);
    P("circle", { cx: o.x(dT), cy: o.y(Math.min(r.e, top)), r: 6, class: "dot" }, o.g);
    $("tcv").innerHTML = F.kelvin(K(Tc)); $("tfv").innerHTML = F.kelvin(K(Tf)); $("dtv").textContent = F.qty(F.num(dT, 3), "K");
    $("vcarnot").textContent = fmtE(d.carnot); $("ve").textContent = fmtE(r.e);
    $("fe").innerHTML = t("pin.f.e", { th: F.kelvin(r.Th), tl: F.kelvin(r.Tl) });
    $("vsc").textContent = F.si(r.sigma, "K⁻¹"); $("vperdu").textContent = F.si(d.perdu, "J", { sig: 2 });
    $("fperdu").innerHTML = t("pin.f.perdu", { t0: F.kelvin(d.T0) });
    $("modeseg").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
  }
  $("modeseg").querySelectorAll("button").forEach(b => b.onclick = () => set(b.dataset.m));
  ["tc", "tf", "dt"].forEach(id => $(id).oninput = draw);
  set("pac");
})();

/* ---------- §4 : Carnot, Curzon-Ahlborn et trois centrales ---------- */
(() => {
  const svg = $("ca");
  const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 52 }, x: { domain: [0.2, 0.8], label: t("ca.x") }, y: { domain: [0, 0.8], label: t("ca.y") } });
  const curve = (f, cls) => { const pts = []; for (let i = 0; i <= 120; i++) { const th = 0.2 + 0.6 * i / 120; pts.push([o.x(th), o.y(f(th))]); }
    P("path", { d: path(pts), class: cls }, o.g); };
  curve(th => 1 - th, "curve"); curve(th => 1 - Math.sqrt(th), "ref");
  P("text", { x: o.x(0.25), y: o.y(0.75) - 4, class: "note" }, o.g).textContent = t("ca.carnot");
  P("text", { x: o.x(0.62), y: o.y(1 - Math.sqrt(0.62)) - 10, class: "note" }, o.g).textContent = t("ca.ca");
  Thermo.CENTRALES.forEach(c => { const th = c.Tf / c.Tc;
    P("circle", { cx: o.x(th), cy: o.y(c.eta), r: 6, class: "dot" }, o.g);
    P("text", { x: o.x(th) + 9, y: o.y(c.eta) + 18, class: "note" }, o.g).textContent = t("ca." + c.id); });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["carnot1824", 1824, "idea"], ["kelvin1852", 1852, "idea"], ["rittinger1856", 1856, "experiment"], ["curzon1975", 1975, "idea"], ["en2022", 2022, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pac", "scop", "eau", "frigo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signes", "c"], ["plus1", "b"], ["carnot", "a"], ["pincement", "d"], ["ambiance", "a"], ["ca", "b"], ["radiateurs", "c"], ["meme", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 7102 });
})();
</script>
