    <div class="eq"><math display="block"><mi>W</mi><mo>≈</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>Q</mi><mi>V</mi></math></div>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>

    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi>r</mi><mo>=</mo><mn>10</mn><mspace width="0.2em"/><msup><mi>I</mi><mrow><mn>0,65</mn></mrow></msup><mo>,</mo><mspace width="1em"/><mi>d</mi><mo>=</mo><msqrt><mrow><mi>h</mi><mo>(</mo><mn>2</mn><mi>r</mi><mo>−</mo><mi>h</mi><mo>)</mo></mrow></msqrt></math></div>
    <p class="validite" data-i18n-html="val.sphere"></p>
    <figure>
      <svg class="fig" id="roule" viewBox="0 0 640 300" role="img" data-i18n-attr="aria-label:sph.aria"></svg>
      <div class="legend"><span class="c-warn" data-i18n="sph.legend.sphere"></span><span class="c-ok" data-i18n="sph.legend.zone"></span></div>
      <div class="panel">
        <div class="seg" role="group" id="niv" data-i18n-attr="aria-label:sph.choix">

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
/* ---------- le traceur par bonds, puis l'arc en retour ---------- */
(() => {
  const svg = $("eclair"), sl = $("sl"), sp = $("sp"), si = $("si"), H = 3000;
  let graine = 7, tr = null;
  const alea = g => () => (g = (g * 16807) % 2147483647) / 2147483647;
  const neuf = () => { tr = ES.traceur({ H, pas: +sl.value, pause: +sp.value * 1e-6 }, alea(graine)); };
  function draw() {
    const P = tr.points, f = +si.value, tt = Math.min(1, f) * tr.duree, X = x => 320 + x * 0.1, Z = z => 300 - z * 0.09;
    svg.innerHTML = "";
    Plot.el("line", { x1: 40, x2: 600, y1: Z(0), y2: Z(0), class: "stroke c-label" }, svg);
    Plot.el("line", { x1: 180, x2: 460, y1: Z(H), y2: Z(H), class: "stroke bold c-label-2" }, svg);
    [["ecl.sol", 44, Z(0) + 16], ["ecl.nuage", 184, Z(H) - 8]].forEach(([k, x, y]) => { Plot.el("text", { x, y, class: "tick" }, svg).textContent = t(k); });
    const vus = P.filter(p => p.t <= tt + 1e-12).map(p => [X(p.x), Z(p.z)]);
    if (vus.length > 1) Plot.el("path", { d: Plot.path(vus), class: "stroke c-tint" }, svg);
    Plot.el("circle", { cx: vus[vus.length - 1][0], cy: vus[vus.length - 1][1], r: 3, class: "fill c-tint" }, svg);
    if (f > 1) {                                                /* the return stroke climbs the channel from the ground */
      const zf = Math.min(1, (f - 1) / 0.2) * H, arc = P.filter(p => p.z <= zf).map(p => [X(p.x), Z(p.z)]);
      if (arc.length > 1) Plot.el("path", { d: Plot.path(arc), class: "stroke bold c-warn" }, svg);
    }
    $("rl").textContent = F.si(+sl.value, "m"); $("rp").textContent = F.si(+sp.value * 1e-6, "s", { sig: 3 });
    $("ri").textContent = f <= 1 ? F.si(tt, "s", { sig: 3 }) : t("ecl.retour");
    $("vb").textContent = F.num(tr.pas, 4);
    $("vd").textContent = F.si(tr.duree, "s", { sig: 2 });
    $("vv").textContent = F.qty(F.sci(tr.vMoyenne, 2), "m·s⁻¹");
  }
  sl.oninput = sp.oninput = () => { neuf(); draw(); };
  si.oninput = draw;
  $("autre").onclick = () => { graine = (graine * 48271) % 2147483647; neuf(); draw(); };
  neuf(); draw();
})();

/* ---------- la sphère fictive : où un traceur peut-il toucher ? ---------- */
(() => {
  const svg = $("roule"), sh = $("sh"), N = ES.NIVEAUX_FOUDRE, X0 = 200, Y0 = 285;                /* px: foot of the rod */
  let n = 0;
  function draw() {
    const h = +sh.value, r = N[n].r, d = ES.rayonProtege(h, r), S = Math.min(130 / r, 270 / h), X = x => X0 + x * S, Y = y => Y0 - y * S;   /* S: px per metre */
    svg.innerHTML = "";
    Plot.el("line", { x1: 0, x2: 640, y1: Y0, y2: Y0, class: "stroke c-label" }, svg);
    if (h < r) {                                                /* protected: under the arc from the tip of the rod to the ground */
      const a0 = Math.atan2(h - r, -d), pts = Array.from({ length: 41 }, (_, i) => { const a = a0 + (-Math.PI / 2 - a0) * i / 40; return [X(d + r * Math.cos(a)), Y(r + r * Math.sin(a))]; });
      Plot.el("path", { d: Plot.path([[X(0), Y(0)]].concat(pts)) + "Z", class: "fill c-ok", opacity: 0.25 }, svg);
    } else Plot.el("path", { d: Plot.path([[X(0), Y(0)], [X(0), Y(r)], ...Array.from({ length: 41 }, (_, i) => { const a = Math.PI + Math.PI / 2 * i / 40; return [X(r + r * Math.cos(a)), Y(r + r * Math.sin(a))]; })]) + "Z", class: "fill c-ok", opacity: 0.25 }, svg);
    Plot.el("circle", { cx: X(d), cy: Y(r), r: r * S, class: "stroke c-warn", fill: "none" }, svg);
    Plot.el("line", { x1: X(0), x2: X(0), y1: Y(0), y2: Y(h), class: "stroke bold c-label-2" }, svg);
    Plot.el("line", { x1: X(0), x2: X(d), y1: Y0 + 8, y2: Y0 + 8, class: "stroke thin c-ok" }, svg);
    $("rh").textContent = F.si(h, "m");
    $("vr").textContent = F.si(r, "m");
    $("fr").textContent = t("f.r", { I: F.si(N[n].Imin * 1e3, "A", { prefix: "k" }), c: F.si(ES.distanceAmorcage(N[n].Imin), "m", { sig: 3 }) });
    $("vz").textContent = F.si(d, "m", { sig: 3 });
    $("fz").textContent = t(h < r ? "f.d" : "f.d.haut");
  }
  document.querySelectorAll("#niv button").forEach(bt => bt.onclick = () => {
    n = +bt.dataset.n; document.querySelectorAll("#niv button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  sh.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dalibard", 1752, "experiment"], ["boys", 1926, "idea"], ["schonland", 1935, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["norme"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["moyenne", "c"], ["sens", "a"], ["fleche", "b"], ["tonnerre", "d"], ["duree", "b"], ["energie", "a"], ["sphere", "c"], ["hauts", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 906 });
})();
</script>
