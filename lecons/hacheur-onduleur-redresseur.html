    <div class="eq"><math display="block"><mo>⟨</mo><mi>u</mi><mo>⟩</mo><mo>=</mo><mi>α</mi><mi>E</mi><mo>,</mo><mspace width="1em"/><mo>⟨</mo><mi>i</mi><mo>⟩</mo><mo>=</mo><mfrac><mrow><mi>α</mi><mi>E</mi><mo>−</mo><msub><mi>E</mi><mi>c</mi></msub></mrow><mi>R</mi></mfrac></math></div>

    <div class="eq"><math display="block"><mo>⟨</mo><msub><mi>i</mi><mi>E</mi></msub><mo>⟩</mo><mo>=</mo><mi>α</mi><mo>⟨</mo><mi>i</mi><mo>⟩</mo></math></div>

    <div class="eq"><math display="block"><mi>Δ</mi><mi>i</mi><mo>=</mo><mfrac><mrow><mi>α</mi><mo>(</mo><mn>1</mn><mo>−</mo><mi>α</mi><mo>)</mo><mi>E</mi></mrow><mrow><mi>L</mi><mi>f</mi></mrow></mfrac></math></div>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><msub><mi>U</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mn>4</mn><mi>E</mi></mrow><mi>π</mi></mfrac></math></div>
    <p class="validite" data-i18n-html="val.pleine"></p>

    <div class="eq"><math display="block"><mo>⟨</mo><mi>u</mi><mo>⟩</mo><mo>=</mo><mfrac><mrow><mn>2</mn><msub><mi>U</mi><mi>m</mi></msub></mrow><mi>π</mi></mfrac></math></div>

  <section class="card">

    <figure class="chart">
      <svg class="fig" id="tu" role="img" data-i18n-attr="aria-label:fig.aria.u"></svg>
      <svg class="fig" id="ti" role="img" data-i18n-attr="aria-label:fig.aria.i"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.sim"></span><span class="c-warn" data-i18n="fig.legend.ref"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" role="group" id="mode">
            <button type="button" data-m="hacheur" data-i18n="fig.hacheur"></button>
            <button type="button" data-m="pleine" data-i18n="fig.pleine"></button>
            <button type="button" data-m="mli" data-i18n="fig.mli"></button>
            <button type="button" data-m="redresseur" data-i18n="fig.redresseur"></button>
          </div>
          <div class="ctl"><div class="row"><label for="s1" id="s1l"></label><output id="s1r" for="s1"></output></div>
            <input id="s1" type="range" min="0" max="100" step="1" value="60"></div>
          <div class="ctl"><div class="row"><label for="s2" id="s2l"></label><output id="s2r" for="s2"></output></div>
            <input id="s2" type="range" min="0" max="100" step="1" value="50"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" id="k1"></span><span class="v" id="v1"></span><span class="f" id="f1"></span></div>
          <div class="stat"><span class="k" id="k2"></span><span class="v" id="v2"></span><span class="f" id="f2"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/hacheur-onduleur-redresseur.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/ondes-milieux.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux;
const pct = (x, s) => F.qty(F.num(100 * x, s || 3), "%");

/* ---------- règles d'interconnexion ---------- */
(() => {
  const REGLES = ["tension", "courant", "alterner"], txt = textOf("regles.items", REGLES);
  $("regles").innerHTML = REGLES.map(id => `<div><span class="k">${t("regles.tag")}</span><span><strong>${txt[id].name}.</strong> ${txt[id].text}</span></div>`).join("");
})();

/* ---------- le système décrit : 48 V vers un moteur, par hacheur ou par rhéostat ---------- */
(() => {
  const E = 48, alpha = 0.5, I = 4, r = OM.rendementHacheur({ E, alpha, I, Ron: 0.02, VD: 0.7 });
  const h = OM.hacheur({ E, alpha, f: 20e3, R: 1, L: 1e-3, Ec: 20 });
  $("sys1").innerHTML = t("sys1.body", { u: F.si(alpha * E, "V"), eta: pct(r.eta, 3), Pt: F.si(r.Pt, "W"), Pd: F.si(r.Pd, "W"),
    rheo: pct(alpha, 2), di: F.si(h.ondulation, "A"), im: F.si(h.iMoy, "A"), tau: F.si(h.tau, "s"), T: F.si(h.T, "s") });
})();

/* ---------- les trois convertisseurs, simulés ---------- */
(() => {
  const su = $("tu"), si = $("ti"), seg = $("mode"), s1 = $("s1"), s2 = $("s2");
  /* each mode: the two sliders (min, max, step, start) and what they mean */
  const MODES = {
    hacheur: { s1: [30, 95, 1, 60], s2: [1, 50, 1, 20] },          // α in %, f in kHz
    pleine: { s1: [5, 200, 5, 50], s2: [2, 50, 1, 10] },           // L in mH, R in Ω
    mli: { s1: [0, 100, 5, 80], s2: [5, 100, 5, 20] },             // m in %, fp in units of 100 Hz
    redresseur: { s1: [0, 500, 10, 100], s2: [2, 50, 1, 10] },     // L in mH, R in Ω
  };
  let mode = "hacheur";
  const axes = (svg, xs, ylab, ydom) => Plot.axes(svg, { fmt: F, w: 640, h: 180, pad: { l: 64, b: 44 }, x: { domain: xs, label: t("fig.xaxis") }, y: { domain: ydom, label: ylab } });
  const trace = (P, ts, ys, cls) => Plot.el("path", { d: Plot.path(ts.map((x, k) => [P.x(1000 * x), P.y(ys[k])])), class: cls }, P.g);
  const span = a => { const lo = Math.min(...a), hi = Math.max(...a), m = 0.1 * (hi - lo || Math.abs(hi) || 1); return [lo - m, hi + m]; };
  function setMode(m) {
    mode = m; const c = MODES[m];
    [[s1, c.s1], [s2, c.s2]].forEach(([s, [a, b, st, v]]) => { s.min = a; s.max = b; s.step = st; s.value = v; });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === m)));
    const x = textOf("fig.modes", Object.keys(MODES))[m];
    $("s1l").textContent = x.s1; $("s2l").textContent = x.s2;
    ["k1", "k2", "k3"].forEach(k => $(k).innerHTML = x[k]);
    $("cap").innerHTML = x.caption;
    draw();
  }
  function draw() {
    const a = +s1.value, b = +s2.value;
    su.innerHTML = ""; si.innerHTML = "";
    if (mode === "hacheur") {
      const E = 48, f = 1e3 * b, h = OM.hacheur({ E, alpha: a / 100, f, R: 1, L: 1e-3, Ec: 20 });
      const ts = Array.from({ length: 801 }, (_, k) => 2 * h.T * k / 800), T2 = 2000 * h.T;
      const U = axes(su, [0, T2], t("fig.yaxis.u"), [-5, 55]); trace(U, ts, ts.map(h.u), "curve");
      const um = ts.map(() => h.uMoy); trace(U, ts, um, "stroke dash c-warn");
      if (!h.discontinu) {
        const iv = ts.map(h.i), P = axes(si, [0, T2], t("fig.yaxis.i"), span(iv.concat([h.iMoy])));
        trace(P, ts, iv, "curve"); trace(P, ts, ts.map(() => h.iMoy), "stroke dash c-warn");
      }
      $("s1r").textContent = F.num(a / 100, 2); $("s2r").textContent = F.si(f, "Hz");
      $("v1").textContent = F.si(h.uMoy, "V"); $("f1").textContent = t("fig.hacheur.f1", { E: F.si(E, "V") });
      $("v2").textContent = h.discontinu ? "–" : F.si(h.iMoy, "A");
      $("f2").textContent = h.discontinu ? t("fig.hacheur.disc") : t("fig.hacheur.f2", { iE: F.si(h.iE, "A"), b: pct(h.Pfournie > 0 ? (h.Pjoule + h.Pfcem) / h.Pfournie : 1, 4) });
      $("v3").textContent = h.discontinu ? "–" : F.si(h.ondulation, "A");
      $("f3").textContent = h.discontinu ? t("fig.hacheur.disc") : t("fig.hacheur.f3", { v: F.si(h.approx, "A"), tau: F.num(h.tau / h.T, 2) });
    } else if (mode === "pleine" || mode === "mli") {
      const o = mode === "pleine" ? { E: 300, R: b, L: a / 1000, f0: 50, mode, n: 2000 } : { E: 300, R: 10, L: 0.05, f0: 50, mode, m: a / 100, fp: 100 * b, n: 2000 };
      const r = OM.onduleur(o), Z = Math.hypot(o.R, o.L * 2 * Math.PI * 50);
      const U = axes(su, [0, 20], t("fig.yaxis.u"), [-350, 350]); trace(U, r.t, r.u, "curve");
      trace(U, r.t, r.t.map(x => r.U1th * Math.sin(2 * Math.PI * 50 * x)), "stroke dash c-warn");
      const P = axes(si, [0, 20], t("fig.yaxis.i"), span(r.i)); trace(P, r.t, r.i, "curve");
      trace(P, r.t, r.t.map(x => r.I1th * Math.sin(2 * Math.PI * 50 * x - r.dephasage)), "stroke dash c-warn");
      if (mode === "pleine") { $("s1r").textContent = F.si(o.L, "H", { prefix: "m" }); $("s2r").textContent = F.si(o.R, "Ω"); }
      else { $("s1r").textContent = F.num(o.m, 2); $("s2r").textContent = F.si(o.fp, "Hz"); }
      $("v1").textContent = F.si(r.U1, "V"); $("f1").textContent = t("fig.ond.f1", { v: F.si(r.U1th, "V") });
      $("v2").textContent = F.si(r.I1, "A"); $("f2").textContent = t("fig.ond.f2", { v: F.si(r.I1th, "A"), Z: F.si(Z, "Ω") });
      $("v3").textContent = pct(r.thd, 2); $("f3").textContent = t("fig.ond.f3");
    } else {
      const o = { Um: 325, f: 50, R: b, L: a / 1000, n: 2000 }, r = OM.redresseur(o);
      const U = axes(su, [0, 20], t("fig.yaxis.u"), [-20, 350]); trace(U, r.t, r.u, "curve");
      trace(U, r.t, r.t.map(() => r.uMoyTh), "stroke dash c-warn");
      const P = axes(si, [0, 20], t("fig.yaxis.i"), [0, 1.15 * o.Um / o.R]); trace(P, r.t, r.i, "curve");
      trace(P, r.t, r.t.map(() => r.iMoyTh), "stroke dash c-warn");
      $("s1r").textContent = F.si(o.L, "H", { prefix: "m" }); $("s2r").textContent = F.si(o.R, "Ω");
      $("v1").textContent = F.si(r.uMoy, "V"); $("f1").textContent = t("fig.redresseur.f1", { v: F.si(r.uMoyTh, "V") });
      $("v2").textContent = F.si(r.iMoy, "A"); $("f2").textContent = t("fig.redresseur.f2", { v: F.si(o.Um / o.R, "A") });
      $("v3").textContent = F.si(r.ondulation, "A"); $("f3").textContent = t("fig.redresseur.f3", { v: F.si(r.approx, "A") });
    }
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => setMode(x.dataset.m));
  s1.oninput = s2.oninput = draw; setMode("hacheur");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hewitt", 1902, "experiment"], ["thyristor", 1957, "experiment"], ["mosfet", 1959, "experiment"], ["igbt", 1982, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["harmoniques"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["interrupteur", "c"], ["courtcircuit", "a"], ["moyenne", "d"], ["courantsource", "b"], ["ondulation", "c"], ["mli", "a"], ["redresse", "d"], ["bilan", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 523 });
})();
</script>
</body>
</html>
