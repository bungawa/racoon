<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9, e = ES.E, eV = ES.E;

/* ---------- le système décrit : un électron à 1 nm d'un métal ---------- */
(() => {
  const a = 1e-9, Fi = ES.forcePlan(e, a), W = ES.K * e * e / (4 * a), kT = Constantes.k_B * 300;
  $("sys1").innerHTML = t("sys1.body", { F: F.si(Fi, "N", { prefix: "p" }), W: F.num(W / eV, 2), kT: F.num(kT / eV, 2), r: F.num(W / kT, 2), T: F.kelvin(300) });
})();

/* ---------- la charge, son image, la charge induite (q = 1 nC, a = 1 cm) ---------- */
(() => {
  const svg = $("carte"), sg = $("sig"), rsl = $("rsl"), q = NC, a = 0.01;
  const O = { W: 640, H: 300, x0: -0.06, x1: 0.06, y0: -0.012, y1: 0.0443 }, OPT = { r0: 6e-4, ds: 4e-4, n: 900, loin: 0.5 };
  const ch = ES.images([{ q, x: 0, y: 0, z: a }]).map(s => ({ q: s.q, x: s.x, y: s.z }));     /* the plane x–z drawn as x–y */
  function carte(R) {
    const c = CarteChamp.carte(svg, O), m = c.layer("c-label-2");
    Plot.el("rect", { x: 0, y: c.sy(0).toFixed(1), width: O.W, height: (O.H - c.sy(0)).toFixed(1), class: "fill", opacity: "0.3" }, m);
    Plot.el("line", { x1: c.sx(-R * a), x2: c.sx(R * a), y1: c.sy(0) + 2, y2: c.sy(0) + 2, class: "stroke c-warn" }, m);
    const lg = c.layer("c-tint");
    ES.anglesEgalFlux(9).forEach(al => [1, -1].forEach(s => {
      const out = [];
      for (const p of ES.suivreLigne(ch, 0, s * al, Object.assign({ u: [0, -1] }, OPT)).points) { out.push(p); if (p[1] <= 0 || Math.abs(p[0]) > O.x1 + 0.01 || p[1] > O.y1 + 0.01) break; }
      if (out.length > 1) Plot.el("polyline", { points: out.map(p => c.sx(p[0]).toFixed(1) + "," + c.sy(Math.max(0, p[1])).toFixed(1)).join(" "), class: "stroke thin" }, lg);
    }));
    CarteChamp.point(c, [0, a], 4, "c-warn", t("fig.nom.q"));
  }
  function courbes(R) {
    sg.innerHTML = "";
    const { x, y, g } = Plot.axes(sg, { fmt: F, w: 640, h: 260, x: { domain: [0, 6], label: t("sig.x") }, y: { domain: [0, 1], label: t("sig.y") } });
    const rs = Array.from({ length: 241 }, (_, i) => 6 * i / 240);
    Plot.el("path", { d: Plot.path(rs.map(r => [x(r), y(ES.sigmaPlan(q, a, r * a) / ES.sigmaPlan(q, a, 0))])), class: "stroke c-warn" }, g);
    Plot.el("path", { d: Plot.path(rs.map(r => [x(r), y(-ES.chargeInduitePlan(q, a, r * a) / q)])), class: "stroke c-tint" }, g);
    Plot.el("line", { x1: x(R), x2: x(R), y1: y(0), y2: y(1), class: "stroke thin dash c-label" }, g);
  }
  function draw() {
    const R = +rsl.value, Fi = ES.forcePlan(q, a);
    carte(R); courbes(R);
    $("rread").textContent = t("sig.rv", { r: F.num(R, 3) });
    $("vd").textContent = t("sig.pct", { x: F.num(-100 * ES.chargeInduitePlan(q, a, R * a) / q, 3) });
    $("fd").textContent = t("sig.f.disque", { R: F.si(R * a, "m", { prefix: "m" }) });
    $("vs").textContent = F.si(ES.sigmaPlan(q, a, 0), "C·m⁻²", { prefix: "µ" });
    $("fs").textContent = t("sig.f.centre", { E: F.si(-ES.sigmaPlan(q, a, 0) / ES.EPS0, "V·m⁻¹", { prefix: "k" }) });
    $("vF").textContent = F.si(Fi, "N", { prefix: "µ" });
    $("fF").textContent = t("sig.f.force", { F: F.si(ES.forcePlanIntegree(q, a), "N", { prefix: "µ" }) });
  }
  rsl.oninput = draw; draw();
})();

/* ---------- effet Schottky : la barrière que voit un électron qui sort d'un métal ---------- */
(() => {
  const svg = $("barr"), esl = $("esl"), NM = 1e-9;
  function draw() {
    const E0 = Math.pow(10, +esl.value), s = ES.schottky(E0), xs = Array.from({ length: 300 }, (_, i) => (0.2 + 9.8 * i / 299) * NM);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, 10], label: t("barr.x") }, y: { domain: [-2, 0.5], label: t("barr.y") } });
    const cl = v => Math.max(-2, Math.min(0.5, v));
    Plot.el("path", { d: Plot.path(xs.map(X => [x(X / NM), y(cl(-ES.K * e * e / (4 * X) / eV))])), class: "stroke c-label-2" }, g);
    Plot.el("path", { d: Plot.path(xs.map(X => [x(X / NM), y(cl(s.energie(X) / eV))])), class: "stroke c-warn" }, g);
    Plot.el("line", { x1: x(0), x2: x(10), y1: y(0), y2: y(0), class: "stroke thin dash c-label" }, g);
    if (s.x0 < 10 * NM) Plot.el("circle", { cx: x(s.x0 / NM), cy: y(cl(-s.abaissement / eV)), r: 4, class: "fill c-warn" }, g);
    $("eread").textContent = F.si(E0, "V·m⁻¹");
    $("vw").textContent = t("barr.ev", { w: F.num(s.abaissement / eV, 2) });
    $("fw").textContent = t("barr.f.dw");
    $("vx").textContent = F.si(s.x0, "m", { prefix: "n" });
    $("fx").textContent = t("barr.f.x0");
  }
  esl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["schottky", 1914, "idea"], ["cole", 1969, "idea"], ["etats", 1984, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cathode", "diode"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["double", "c"], ["total", "a"], ["moitie", "b"], ["force", "d"], ["travail", "c"], ["electron", "a"], ["schottky", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 68 });
})();
</script>
