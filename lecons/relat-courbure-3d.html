<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const E = EspacesCourbes, Cst = Constantes;
const R_T = Cst.R_E_mean, M_T = Cst.GM_E / Cst.G, RHO_T = M_T / (4 / 3 * Math.PI * R_T ** 3);   // densité moyenne de la Terre

/* ---------- l'excès d'un cercle de 1 km selon l'orientation de son plan ---------- */
(() => {
  const r = 1000, U = 1e-24;                                       // m ; curseurs en 10⁻²⁴ m⁻²
  const sl = [$("k1"), $("k2"), $("k3")], th = $("th"), trace = $("trace"), seg = $("preset");
  const PRESETS = { boule: E.courburesBoule(RHO_T), dehors: E.courburesDehors(Cst.GM_E, R_T) };
  let preset = "boule";
  /* moyenne sur toutes les orientations : quadrature en (θ, φ), poids sin θ */
  const moyenne = K => { const n = 60; let s = 0, w = 0;
    for (let i = 0; i < n; i++) for (let j = 0; j < 2 * n; j++) { const a = (i + 0.5) * Math.PI / n, b = (j + 0.5) * Math.PI / n, sw = Math.sin(a);
      s += E.excesCercle3d(K, E.normale(a, b), r) * sw; w += sw; }
    return { v: s / w, n: 2 * n * n }; };
  function draw() {
    const K = sl.map(x => +x.value * U), a = +th.value * Math.PI / 180, fm = 1e-15;
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, 180], label: t("fig.xaxis") }, y: { domain: [-7, 7], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(180), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const ths = Array.from({ length: 181 }, (_, i) => i);
    const ex = (deg, phi) => E.excesCercle3d(K, E.normale(deg * Math.PI / 180, phi), r) / fm;
    const sph = E.excesSphere3d(K, r) / fm;
    Plot.el("line", { x1: P.x(0), x2: P.x(180), y1: P.y(sph), y2: P.y(sph), class: "stroke dash c-ok" }, P.g);
    Plot.el("path", { d: Plot.path(ths.map(d => [P.x(d), P.y(ex(d, Math.PI / 2))])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(ths.map(d => [P.x(d), P.y(ex(d, 0))])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(+th.value), cy: P.y(ex(+th.value, 0)), r: 5, class: "dot" }, P.g);
    sl.forEach((x, i) => $("k" + (i + 1) + "r").textContent = F.qty(F.sci(K[i], 3), "m⁻²"));
    $("thr").textContent = F.num(+th.value, 3) + "\u00a0°";
    const n = E.normale(a, 0);
    $("vc").textContent = F.si(E.excesCercle3d(K, n, r), "m", { prefix: "f" });
    $("fc").textContent = t("fig.f.cercle", { k: F.qty(F.sci(E.courbureSection(K, n), 3), "m⁻²") });
    $("vs").textContent = F.si(E.excesSphere3d(K, r), "m", { prefix: "f" });
    $("fs").textContent = t("fig.f.sphere", { k: F.qty(F.sci((K[0] + K[1] + K[2]) / 3, 3), "m⁻²") });
    const m = moyenne(K);
    $("vm").textContent = F.si(m.v, "m", { prefix: "f" });
    $("fm").textContent = t("fig.f.moyenne", { n: F.num(m.n, 6) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.p === preset)));
  }
  const pose = p => { preset = p; if (PRESETS[p]) PRESETS[p].forEach((k, i) => sl[i].value = (k / U).toFixed(1)); draw(); };
  seg.querySelectorAll("button").forEach(x => x.onclick = () => pose(x.dataset.p));
  sl.forEach(x => x.oninput = () => { preset = "choix"; draw(); });
  th.oninput = draw; pose("boule");
})();

/* ---------- le système décrit : un cercle de 1 km au sol ---------- */
(() => {
  const r = 1000, K = E.courburesDehors(Cst.GM_E, R_T), Kin = E.courburesBoule(RHO_T);
  $("sys1").innerHTML = t("sys1.body", { rho: F.qty(F.num(RHO_T, 4), "kg·m⁻³"), kin: F.qty(F.sci(Kin[0], 3), "m⁻²"),
    h: F.si(E.excesCercle3d(K, [0, 0, 1], r), "m", { prefix: "f" }), v: F.si(Math.abs(E.excesCercle3d(K, [1, 0, 0], r)), "m", { prefix: "f" }),
    rel: F.sci(E.excesCercle3d(K, [0, 0, 1], r) / r, 2), phi: F.sci(Cst.GM_E / (Cst.c ** 2 * R_T), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lobatchevski", 1829, "idea"], ["riemann", 1854, "idea"], ["ricci", 1901, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["goce"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["orient", "b"], ["sphere", "a"], ["six", "c"], ["vide", "d"], ["calcul", "a"], ["imaginer", "c"], ["regles", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 422 });
})();
</script>
