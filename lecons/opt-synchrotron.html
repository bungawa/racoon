<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, Cst = Constantes, EV = Cst.e;
const eV = x => F.si(x / EV, "eV");

/* ---------- un anneau : rayon, vitesse, spectre, perte par tour ---------- */
(() => {
  const sk = $("sk"), sbb = $("sbb"), seg = $("part"), svg = $("spectre"), L0 = 1e-13, L1 = 1e3;
  let part = "e";
  function draw() {
    const m = part === "e" ? Cst.m_e : Cst.m_p, K = Math.pow(10, +sk.value) * EV, B = Math.pow(10, +sbb.value);
    const a = O.anneau({ W: K + m * Cst.c ** 2, B, m });
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 44 }, x: { scale: "log", domain: [L0, L1], label: t("fig.xaxis"), fmt: v => { const e = Math.round(Math.log10(v)); return e % 2 ? "" : "10" + F.sup(e); } }, y: { domain: [0, 1], label: t("fig.yaxis") } });
    Plot.el("rect", { x: P.x(380e-9), y: P.y(1), width: P.x(780e-9) - P.x(380e-9), height: P.y(0) - P.y(1), class: "area" }, P.g);
    const ls = Array.from({ length: 321 }, (_, i) => L0 * Math.pow(L1 / L0, i / 320));
    const pts = ls.map(l => [P.x(l), P.y(Math.min(1, O.spectreF(a.lambdaC / l, 400)))]).filter(q => Number.isFinite(q[1]));
    Plot.el("path", { d: Plot.path(pts), class: "curve" }, P.g);
    if (a.lambdaC > L0 && a.lambdaC < L1) Plot.el("line", { x1: P.x(a.lambdaC), x2: P.x(a.lambdaC), y1: P.y(0), y2: P.y(1), class: "ref" }, P.g);
    const vis = O.fractionSpectre(a.lambdaC / 780e-9, a.lambdaC / 380e-9);
    $("skr").textContent = eV(K);
    $("sbr").textContent = F.si(B, "T");
    $("vr").textContent = F.si(a.R, "m");
    $("fr").textContent = t("fig.f.r", { T: F.si(a.T0, "s"), l: F.si(a.lambda0, "m") });
    $("vb").textContent = F.sci(a.unMoinsBeta, 2);
    $("fb").textContent = t(a.gamma < 10 ? "fig.f.lent" : "fig.f.beta", { g: F.num(a.gamma, 4) });
    $("vlc").textContent = F.si(a.lambdaC, "m");
    $("flc").textContent = t("fig.f.lc", { E: eV(a.Ec), v: vis < 1e-4 ? F.sci(vis, 1) : F.qty(F.num(100 * vis, 2), "%") });
    $("vu").textContent = eV(a.U0);
    $("fu").textContent = t("fig.f.u0", { f: F.sci(a.perte, 2) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.p === part)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { part = x.dataset.p; draw(); });
  sk.oninput = sbb.oninput = draw; draw();
})();

/* ---------- le système décrit : un électron de 1 GeV dans 1 T ---------- */
(() => {
  const a = O.anneau({ W: 1e9 * EV, B: 1 });
  $("sys1").innerHTML = t("sys1.body", { R: F.si(a.R, "m"), g: F.num(a.gamma, 4), n: F.num(1 / a.unMoinsBeta / 1e6, 2), dv: F.si(a.unMoinsBeta * Cst.c, "m·s⁻¹"),
    l0: F.si(a.lambda0, "m"), lc: F.si(a.lambdaC, "m"), E: eV(a.Ec), u: eV(a.U0), f: F.sci(a.perte, 2), q: F.sci(a.Ec / a.W, 1), th: F.si(a.angle, "rad", { prefix: "m" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ge", 1947, "experiment"], ["esrf", 1994, "use"], ["ebs", 2020, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["proteines"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["vitesse", "a"], ["rayon", "c"], ["proton", "b"], ["ecart", "d"], ["xray", "a"], ["reseau", "c"], ["polar", "b"], ["perte", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 343 });
})();
</script>
