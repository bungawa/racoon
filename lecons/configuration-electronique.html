    <div class="eq"><math display="block"><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mo>−</mo><msub><mi>E</mi><mi mathvariant="normal">R</mi></msub><mfrac><msup><mi>Z</mi><mn>2</mn></msup><msup><mi>n</mi><mn>2</mn></msup></mfrac><mo>,</mo><mspace width="1em"/><msub><mi>E</mi><mi mathvariant="normal">R</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>m</mi><mi mathvariant="normal">e</mi></msub><msup><mi>e</mi><mn>4</mn></msup></mrow><mrow><mn>8</mn><msubsup><mi>ε</mi><mn>0</mn><mn>2</mn></msubsup><msup><mi>h</mi><mn>2</mn></msup></mrow></mfrac></math></div>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mn>1</mn><mi>s</mi><mo>&lt;</mo><mn>2</mn><mi>s</mi><mo>&lt;</mo><mn>2</mn><mi>p</mi><mo>&lt;</mo><mn>3</mn><mi>s</mi><mo>&lt;</mo><mn>3</mn><mi>p</mi><mo>&lt;</mo><mn>4</mn><mi>s</mi><mo>&lt;</mo><mn>3</mn><mi>d</mi><mo>&lt;</mo><mn>4</mn><mi>p</mi><mo>&lt;</mo><mn>5</mn><mi>s</mi><mo>&lt;</mo><mn>4</mn><mi>d</mi><mo>&lt;</mo><mo>…</mo></math></div>

    <figure>

        <div class="ctl"><div class="row"><label for="zsl" data-i18n="conf.z"></label><output id="zo" for="zsl"></output></div>

          <div class="stat"><span class="k" data-i18n-html="conf.k.valence"></span><span class="v" id="vval"></span><span class="f" id="fval"></span></div>
        </div>

  <section class="card">

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>

<script src="/racoon/lecons/complexes.js"></script>

<script src="/racoon/quantique-schrodinger.js"></script>
<script src="/racoon/lecons/tableau-periodique-quantique.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m);
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimArchi, Cst = Constantes;
const sym = t("el.symboles"), L = "spdf";
const sous = s => s.n + L[s.l];
/* "1s² 2s² 2p⁶" ; abrege : le plus grand cœur de gaz noble dont la configuration ouvre celle-ci, entre crochets */
const GAZ = [36, 18, 10, 2];
function ecrire(c, abrege) {
  let reste = c.slice(), coeur = "";
  if (abrege) for (const g of GAZ) { const k = C.configurationAtome(g);
    if (k.length < c.length && k.every((s, i) => c[i].n === s.n && c[i].l === s.l && c[i].occ === s.occ)) { coeur = "[" + sym[g] + "] "; reste = c.slice(k.length); break; } }
  return coeur + reste.map(s => sous(s) + "<sup>" + s.occ + "</sup>").join(" ");
}
const charge = q => (q === 0 ? "" : (Math.abs(q) > 1 ? Math.abs(q) : "") + (q > 0 ? "+" : Fmt.MINUS));

/* ---------- l'énergie hydrogénoïde, chiffrée ---------- */
(() => {
  const ER = C.hydrogenoide(1, 1).E, alpha = Cst.e * Cst.e / (4 * Math.PI * Cst.eps0 * Cst.hbar * Cst.c);
  $("valH").innerHTML = t("val.hydrogenoide", { er: F.qty(F.num(-ER, 5), "eV"), mesure: F.qty(F.num(C.ionisation(1) / Cst.e, 5), "eV"),
    r: F.sci(Cst.m_e / Cst.m_p, 2), a2: F.sci(alpha * alpha, 1) });
})();

/* ---------- cases quantiques ---------- */
(() => {
  const ROWS = C.ORDRE_KLECHKOWSKI.slice(0, 8), svg = $("cases"), zsl = $("zsl");
  const Q = [-3, -2, -1, 0, 1, 2, 3];
  $("charges").innerHTML = Q.map(q => `<button type="button" data-q="${q}" aria-pressed="false">${q > 0 ? "+" + q : q < 0 ? Fmt.MINUS + -q : "0"}</button>`).join("");
  let q = 0;
  function draw() {
    const Z = +zsl.value; let c, hors = false;
    try { c = q ? C.configurationIon(Z, q) : C.configurationAtome(Z); } catch (e) { hors = true; c = C.configurationAtome(Z); }
    const qq = hors ? 0 : q;
    $("zo").innerHTML = t("conf.zread", { z: Z, sym: sym[Z] + (qq ? "<sup>" + charge(qq) + "</sup>" : "") });
    svg.innerHTML = "";
    const W = 30, gap = 38, x0 = 120, y0 = 300;
    ROWS.forEach(([n, l], k) => {
      const y = y0 - k * gap, s = c.find(u => u.n === n && u.l === l), occ = s ? s.occ : 0, m = 2 * l + 1;
      Plot.el("text", { x: x0 - 20, y: y + 5, "text-anchor": "end" }, svg).textContent = n + L[l];
      for (let b = 0; b < m; b++) {
        const bx = x0 + b * W;
        Plot.el("rect", { x: bx, y: y - 13, width: W, height: 26, class: "stroke thin c-label-2" }, svg);
        const up = b < occ, down = occ > m && b < occ - m;
        if (up) Plot.el("path", { d: `M${bx + 10} ${y + 9}V${y - 9}M${bx + 6} ${y - 4}L${bx + 10} ${y - 9}L${bx + 14} ${y - 4}`, class: "stroke c-tint" }, svg);
        if (down) Plot.el("path", { d: `M${bx + 20} ${y - 9}V${y + 9}M${bx + 16} ${y + 4}L${bx + 20} ${y + 9}L${bx + 24} ${y + 4}`, class: "stroke c-warn" }, svg);
      }
    });
    Plot.el("path", { d: `M${x0 - 70} ${y0 + 12}V${y0 - 7 * gap - 14}M${x0 - 75} ${y0 - 7 * gap - 6}L${x0 - 70} ${y0 - 7 * gap - 14}L${x0 - 65} ${y0 - 7 * gap - 6}`, class: "stroke thin c-label-2" }, svg);
    Plot.el("text", { x: x0 - 66, y: y0 - 7 * gap - 20, "text-anchor": "middle" }, svg).textContent = t("conf.energie");
    const ne = c.reduce((a, s) => a + s.occ, 0);
    $("vconf").innerHTML = ecrire(c, true);
    $("fconf").innerHTML = ne ? ecrire(c, false) : t("conf.vide");
    $("vcel").textContent = C.celibataires(c);
    $("fcel").innerHTML = t("conf.f.celib");
    if (!qq) { const p = C.position(Z); $("vval").textContent = p.valence; $("fval").innerHTML = t("conf.f.valence", { p: p.periode, c: p.colonne, b: L[["s", "p", "d"].indexOf(p.bloc)] }); }
    else { $("vval").textContent = ne; $("fval").innerHTML = t("conf.f.ion"); }
    const notes = [];
    if (hors) notes.push(t("conf.hors", { sym: sym[Z] }));
    if (!qq && C.EXCEPTIONS_KLECHKOWSKI.includes(Z)) notes.push(t("conf.exception", { regle: ecrire(C.klechkowski(Z), true) }));
    if (qq > 0 && C.position(Z).bloc === "d") notes.push(t("conf.ion4s"));
    $("note").innerHTML = notes.join(" ");
    document.querySelectorAll("#charges [data-q]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.q === q)));
  }
  document.querySelectorAll("#charges [data-q]").forEach(b => b.onclick = () => { q = +b.dataset.q; draw(); });
  zsl.oninput = draw; draw();
})();

/* ---------- ions : cœur de gaz noble, ou 4s d'abord ---------- */
(() => {
  const IONS = [["Na", 11, 1], ["Cl", 17, -1], ["O", 8, -2], ["Fe2", 26, 2], ["Fe3", 26, 3], ["Cu", 29, 1]], txt = textOf("ions.items", IONS.map(i => i[0]));
  $("ions").innerHTML = IONS.map(([id, Z, q]) => `<div><span class="k">${sym[Z]}<sup>${charge(q)}</sup></span><span>${ecrire(C.configurationIon(Z, q), true)} : ${txt[id]}</span></div>`).join("");
  const alpha = Cst.e * Cst.e / (4 * Math.PI * Cst.eps0 * Cst.hbar * Cst.c), s = C.slater(19, 4, 0);
  $("sys").innerHTML = t("sys.body", { rel: F.num(100 * Math.pow(36 * alpha, 2), 2), zk: F.num(s.zEff, 2), relK: F.sci(Math.pow(s.zEff * alpha, 2), 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["pauli", 1925, "idea"], ["hund", 1925, "idea"], ["madelung", 1936, "idea"], ["maiman", 1960, "experiment"], ["forman", 1972, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rubis"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${fill(uses[id].text, { cr: ecrire(C.configurationIon(24, 3), true), n: C.celibataires(C.configurationIon(24, 3)) })}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pauli", "a"], ["ordre", "b"], ["fer", "c"], ["hund", "d"], ["cuivre", "a"], ["ion", "b"], ["valence", "c"], ["places", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 812 });
})();
</script>
