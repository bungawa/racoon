<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["fourier", "impulsions"]; keyed($("methodes"), t("methodes.tag"), IDS, textOf("methodes.items", IDS)); })();
(() => { const IDS = ["antenne", "bobine", "condensateur", "taille"]; keyed($("recepteur"), t("recepteur.tag"), IDS, textOf("recepteur.items", IDS)); })();

/* ---------- §25-2 : deux stations, un circuit accordé ---------- */
(() => {
  const O = self.Ondes, L = 200e-6, R = 10, ST = [{ f: 550e3, e0: 1e-3 }, { f: 780e3, e0: 1e-3 }];
  const LF = Array.from({ length: 401 }, (_, i) => 400e3 + 600e3 * i / 400);
  function upd() {
    const fa = 1e3 * +$("fa").value, C = O.accord(L, fa), H = f => O.transfertRLC(R, L, C, 2 * Math.PI * f).module;
    const Q = Math.sqrt(L / C) / R, gmax = 1.1 * H(fa) / Math.sqrt(1 - 1 / (4 * Q * Q));
    /* gain |u_C/e| against frequency, the two stations marked */
    let svg = $("gain"); svg.innerHTML = "";
    let P = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { l: 52, b: 44 }, x: { domain: [400, 1000], label: t("ra.xaxis") }, y: { domain: [0, gmax], label: t("ra.gain.yaxis") } });
    ST.forEach(s => Plot.el("line", { x1: P.x(s.f / 1e3), x2: P.x(s.f / 1e3), y1: P.y(0), y2: P.y(gmax), class: "stroke thin dash c-label-2" }, P.g));
    Plot.el("path", { d: Plot.path(LF.map(f => [P.x(f / 1e3), P.y(Math.min(H(f), gmax))])), class: "curve" }, P.g);
    ST.forEach(s => Plot.el("circle", { cx: P.x(s.f / 1e3), cy: P.y(H(s.f)), r: 4, class: "dot" }, P.g));
    /* the antenna's emf (sum of both stations) and the capacitor voltage (sum of both responses), over 20 µs */
    const TT = Array.from({ length: 801 }, (_, i) => 20e-6 * i / 800), e = tt => ST.reduce((s, x) => s + x.e0 * Math.cos(2 * Math.PI * x.f * tt), 0);
    const uc = TT.map(tt => O.sortieRadio(R, L, C, ST, tt)), umax = 1.1 * Math.max(...uc.map(Math.abs), 2e-3);
    svg = $("signal"); svg.innerHTML = "";
    P = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { l: 52, b: 44 }, x: { domain: [0, 20], label: t("ra.taxis") }, y: { domain: [-1e3 * umax, 1e3 * umax], label: t("ra.signal.yaxis") } });
    Plot.el("path", { d: Plot.path(TT.map(tt => [P.x(1e6 * tt), P.y(1e3 * e(tt))])), class: "stroke c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(TT.map((tt, j) => [P.x(1e6 * tt), P.y(1e3 * uc[j])])), class: "curve" }, P.g);
    /* readouts */
    const g1 = H(ST[0].f), g2 = H(ST[1].f);
    $("fav").textContent = F.si(fa, "Hz");
    $("vc").textContent = F.si(C, "F"); $("fc").textContent = t("ra.f.c", { q: F.num(Q, 2), b: F.si(fa / Q, "Hz") });
    $("va").textContent = F.si(g1 * ST[0].e0, "V"); $("fa1").textContent = t("ra.f.gain", { g: F.num(g1, 3) });
    $("vb").textContent = F.si(g2 * ST[1].e0, "V"); $("fb").textContent = t("ra.f.gain", { g: F.num(g2, 3) });
    $("vs").textContent = F.num(Math.max(g1, g2) / Math.min(g1, g2), 2); $("fs").textContent = t(g1 >= g2 ? "ra.f.sel.a" : "ra.f.sel.b");
  }
  $("fa").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bernoulli", 1753, "idea"], ["fourier", 1822, "idea"], ["green", 1828, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["radio", "reverb"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["principe", "a"], ["deux", "c"], ["accord", "b"], ["selectivite", "d"], ["impulsion", "a"], ["champ", "c"], ["limite", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 252 });
})();
</script>
