<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- φ = +z, χ = + along (θ, φ) (6.36): ⟨χ|φ⟩ and ⟨φ|χ⟩ in the complex plane; |⟨χ|φ⟩|² against the dot product of the directions ---------- */
(() => {
  const sth = $("sth"), sph = $("sph"), PHI = Q.etatBase(2, 0);
  function draw() {
    const th = +sth.value * Math.PI / 180, f = +sph.value * Math.PI / 180, chi = Q.amplitudesAxe(th, f);
    const a = Q.produitScalaire(chi, PHI), b = Q.produitScalaire(PHI, chi), svg = $("plan"); svg.innerHTML = "";
    const cx0 = 320, cy0 = 120, R = 100;
    Plot.el("circle", { cx: cx0, cy: cy0, r: R, class: "stroke thin c-label-2", fill: "none" }, svg);
    Plot.el("line", { x1: cx0 - 120, x2: cx0 + 120, y1: cy0, y2: cy0, class: "stroke thin c-label-2" }, svg);
    Plot.el("line", { x1: cx0, x2: cx0, y1: cy0 - 115, y2: cy0 + 115, class: "stroke thin c-label-2" }, svg);
    Plot.fleche(svg, [cx0, cy0], [cx0 + R * a.re, cy0 - R * a.im], { cls: "c-tint", tete: 9, min: 2, trait: "stroke bold" });
    Plot.fleche(svg, [cx0, cy0], [cx0 + R * b.re, cy0 - R * b.im], { cls: "c-warn", tete: 9, min: 2, trait: "stroke bold" });
    $("sthr").textContent = F.num(+sth.value, 3) + "\u00a0°"; $("sphr").textContent = F.num(+sph.value, 3) + "\u00a0°";
    const txt = z => Cx.text(z, x => F.num(Math.abs(x) < 5e-13 ? 0 : x, 3));
    $("vamp").textContent = txt(a); $("famp").textContent = t("fig.f.amp", { b: txt(b) });
    $("vp").textContent = F.num(Cx.abs2(a), 3); $("fp").textContent = t("fig.f.p");
    $("vdir").textContent = F.num(Math.cos(th) + 0, 3); $("fdir").textContent = t("fig.f.dir");
  }
  sth.oninput = sph.oninput = draw; draw();
  const down = Q.amplitudesAxe(Math.PI, 0);
  $("sys1").innerHTML = t("sys1.body", { a: F.num(Cx.abs(Q.produitScalaire(down, PHI)), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dirac", 1930, "idea"], ["neumann", 1932, "idea"], ["notation", 1939, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["simulateur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ordre", "c"], ["demi", "a"], ["un", "d"], ["oppose", "b"], ["analogie", "c"], ["dim", "a"], ["nombre", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 801 });
})();
</script>
