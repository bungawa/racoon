    <div class="eq"><math display="block"><mo>Δ</mo><mi>ℓ</mi><mo>=</mo><mi>ℓ</mi><munder><mo>∑</mo><mrow><mi>i</mi><mi>j</mi></mrow></munder><msub><mi>n</mi><mi>i</mi></msub><msub><mi>ε</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><msub><mi>n</mi><mi>j</mi></msub></math></div>
    <p class="validite" data-i18n-html="val.dl"></p>

    <div class="eq"><math display="block"><mi>w</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><msup><mi>a</mi><mn>3</mn></msup></mrow></mfrac><munder><mo>∑</mo><mi>b</mi></munder><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mi>k</mi><mi>b</mi></msub><mo>(</mo><mo>Δ</mo><msub><mi>ℓ</mi><mi>b</mi></msub><msup><mo>)</mo><mn>2</mn></msup></math></div>

  <section class="card">

    <figure>
      <svg class="fig" id="cauchy" viewBox="0 0 640 340" role="img" data-i18n-attr="aria-label:ca.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="ca.legend.ion"></span><span class="c-warn" data-i18n="ca.legend.metal"></span><span class="c-label-2" data-i18n="ca.legend.cov"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="cr" data-i18n="ca.cr"></label></div>
            <select id="cr"></select></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="ca.k.c"></span><span class="v" id="vc"></span></div>
          <div class="stat"><span class="k" data-i18n="ca.k.r"></span><span class="v" id="vr"></span><span class="f" id="fr"></span></div>
          <div class="stat"><span class="k" data-i18n="ca.k.z"></span><span class="v" id="vz"></span><span class="f" id="fz"></span></div>
          <div class="stat"><span class="k" data-i18n="ca.k.e"></span><span class="v" id="ve"></span><span class="f" id="fe"></span></div>
        </div>
      </div>

    </figure>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mfrac><mrow><mn>2</mn><msub><mi>C</mi><mrow><mn>4</mn><mn>4</mn></mrow></msub></mrow><mrow><msub><mi>C</mi><mrow><mn>1</mn><mn>1</mn></mrow></msub><mo>−</mo><msub><mi>C</mi><mrow><mn>1</mn><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><msub><mi>k</mi><mn>2</mn></msub></mrow><mrow><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><msub><mi>k</mi><mn>2</mn></msub></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.z"></p>
    <figure>
      <svg class="fig" id="young" viewBox="0 0 640 340" role="img" data-i18n-attr="aria-label:yo.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="yo.legend.e"></span><span class="c-label-2" data-i18n="yo.legend.iso"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="k1" data-i18n="yo.k1"></label><output id="k1v" for="k1"></output></div>
            <input id="k1" type="range" min="0.5" max="15" step="0.1" value="6.5"></div>
          <div class="ctl"><div class="row"><label for="k2" data-i18n="yo.k2"></label><output id="k2v" for="k2"></output></div>
            <input id="k2" type="range" min="0" max="15" step="0.1" value="3.6"></div>
          <button class="btn" id="nacl" data-i18n="yo.nacl"></button>
          <button class="btn" id="egal" data-i18n="yo.egal"></button>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="yo.k.c"></span><span class="v" id="vyc"></span><span class="f" id="fyc"></span></div>
          <div class="stat"><span class="k" data-i18n="yo.k.z"></span><span class="v" id="vyz"></span></div>
          <div class="stat"><span class="k" data-i18n="yo.k.e"></span><span class="v" id="vye"></span><span class="f" id="fye"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>

<script src="/racoon/navigation.js"></script>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const El = Elasticite, T = Tenseurs, X = El.CRISTAUX;
const GPa = x => F.qty(F.num(x / 1e9, 3), "GPa");
const CLS = { ionique: "c-tint", metal: "c-warn", covalent: "c-label-2" };
const D100 = [1, 0, 0], D111 = [1, 1, 1];

/* ---------- le tableau 39-2 face à la relation de Cauchy ---------- */
(() => {
  const svg = $("cauchy"), ids = Object.keys(X), noms = textOf("ca.noms", ids);
  $("cr").innerHTML = ids.map(id => `<option value="${id}">${noms[id]}</option>`).join("");
  $("cr").value = "NaCl";
  function upd() {
    const sel = $("cr").value, c = X[sel], C = T.cubique4(c.C11, c.C12, c.C44);
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 340, x: { scale: "log", domain: [1, 1000], label: t("ca.xlabel"), fmt: v => F.num(v, 3) }, y: { scale: "log", domain: [1, 1000], label: t("ca.ylabel"), fmt: v => F.num(v, 3) } });
    P("line", { x1: ax.x(1), y1: ax.y(1), x2: ax.x(1000), y2: ax.y(1000), class: "stroke thin dash c-label-2" }, svg);
    P("text", { x: ax.x(300), y: ax.y(300) - 8, "text-anchor": "end", class: "tick" }, svg).textContent = t("ca.diag");
    ids.forEach(id => {
      const k = X[id], x = ax.x(k.C44 / 1e9), y = ax.y(k.C12 / 1e9);
      P("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: id === sel ? 7 : 4, class: "fill " + CLS[k.liaison] }, svg);
      P("text", { x: (x + 9).toFixed(1), y: (y + 4).toFixed(1), class: id === sel ? "label" : "tick" }, svg).textContent = noms[id];
    });
    $("vc").textContent = t("ca.v.c", { c11: GPa(c.C11), c12: GPa(c.C12), c44: GPa(c.C44) });
    const r = c.C12 / c.C44, z = El.zener(c.C11, c.C12, c.C44);
    $("vr").textContent = F.fix(r, 2);
    $("fr").textContent = t(Math.abs(r - 1) < 0.05 ? "ca.f.cauchy" : "ca.f.pas");
    $("vz").textContent = F.fix(z, 2);
    $("fz").textContent = t("ca.f.z");
    $("ve").textContent = t("ca.v.e", { a: GPa(T.youngDirection(C, D100)), b: GPa(T.youngDirection(C, D111)) });
    $("fe").textContent = t("ca.f.e");
  }
  $("cr").onchange = upd;
  upd();
})();

/* ---------- le cube de ressorts : k1, k2 → C, puis E selon la direction ---------- */
(() => {
  const svg = $("young"), a = Cristaux.STRUCTURES.NaCl.a / 2, O = [190, 175], R = 150, N = 180;     // Na–Cl distance, a/2 of the cubic cell
  const fit = El.ressortsDepuis(X.NaCl.C11, X.NaCl.C44, a);
  function upd() {
    const k1 = +$("k1").value, k2 = +$("k2").value;
    $("k1v").textContent = F.qty(F.fix(k1, 1), "N·m⁻¹"); $("k2v").textContent = F.qty(F.fix(k2, 1), "N·m⁻¹");
    const { liaisons, V } = El.reseauCubique(k1, k2, a), c = El.cubiques(El.constantesReseau(liaisons, V));
    $("vyc").textContent = t("yo.v.c", { c11: GPa(c.C11), c12: GPa(c.C12), c44: GPa(c.C44) });
    $("fyc").textContent = t("yo.f.c");
    svg.innerHTML = "";
    if (!(k2 > 0)) {
      $("vyz").textContent = F.fix(0, 2); $("vye").textContent = t("yo.v.mou"); $("fye").textContent = t("yo.f.mou");
      P("text", { x: 320, y: 170, "text-anchor": "middle", class: "label" }, svg).textContent = t("yo.mou");
      return;
    }
    const C = T.cubique4(c.C11, c.C12, c.C44), Es = [];
    for (let k = 0; k <= N; k++) { const th = 2 * Math.PI * k / N; Es.push([th, T.youngDirection(C, [Math.cos(th), Math.sin(th), 0])]); }
    const Emax = Math.max(...Es.map(e => e[1])), sc = R / Emax, E100 = Es[0][1];
    for (const f of [0.5, 1]) P("circle", { cx: O[0], cy: O[1], r: (R * f).toFixed(1), class: "stroke thin dash c-label-2" }, svg);
    P("circle", { cx: O[0], cy: O[1], r: (sc * E100).toFixed(1), class: "stroke thin c-label-2" }, svg);
    P("path", { d: Plot.path(Es.map(([th, E]) => [O[0] + sc * E * Math.cos(th), O[1] - sc * E * Math.sin(th)])) + "Z", class: "stroke c-tint" }, svg);
    [["[100]", 0], ["[110]", 45], ["[010]", 90]].forEach(([lab, deg]) => {
      const th = deg * Math.PI / 180;
      P("text", { x: (O[0] + (R + 16) * Math.cos(th)).toFixed(1), y: (O[1] - (R + 16) * Math.sin(th)).toFixed(1), "text-anchor": "middle", class: "tick" }, svg).textContent = lab;
    });
    P("text", { x: O[0] + 4, y: O[1] - R + 12, class: "tick" }, svg).textContent = GPa(Emax);
    const e110 = T.youngDirection(C, [1, 1, 0]), e111 = T.youngDirection(C, D111);
    [["yo.t.100", E100], ["yo.t.110", e110], ["yo.t.111", e111]].forEach(([k, E], i) => P("text", { x: 400, y: 70 + 26 * i, class: i ? "tick" : "label" }, svg).textContent = t(k, { e: GPa(E) }));
    $("vyz").textContent = F.fix(El.zener(c.C11, c.C12, c.C44), 2);
    $("vye").textContent = t("yo.v.e", { a: GPa(E100), b: GPa(e111) });
    $("fye").textContent = t(Math.abs(k1 - k2) < 1e-9 ? "yo.f.iso" : "yo.f.e");
  }
  $("k1").oninput = $("k2").oninput = upd;
  $("nacl").onclick = () => { $("k1").value = fit.k1.toFixed(1); $("k2").value = fit.k2.toFixed(1); upd(); };
  $("egal").onclick = () => { $("k2").value = $("k1").value; upd(); };
  upd();
})();

const EVENTS = [["green", 1837, "idea"], ["born", 1912, "idea"], ["huang", 1954, "idea"], ["dejong", 2015, "use"]];
const USES = ["bases", "potentiels", "silicium"];
const QS = [["central", "a"], ["k2", "b"], ["calcul", "c"], ["diamant", "d"], ["iso", "a"], ["partage", "b"], ["metal", "c"]];

/* ---------- histoire ---------- */
(() => {
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
