    <div class="eq"><math display="block"><msub><mi>A</mi><mtext data-i18n="eq.tri"></mtext></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>|</mo><mover accent="true"><mi>r</mi><mo>→</mo></mover><mo>∧</mo><mover accent="true"><mi>v</mi><mo>→</mo></mover><mo>|</mo><mi>Δ</mi><mi>t</mi></math></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>

<script src="/racoon/locales/fr/lecons/naissance-de-la-dynamique.js"></script>

<script src="/racoon/timeline.js"></script>

<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/lecons/kepler.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const small = (x, n) => x === 0 ? "0" : Math.abs(x) >= 1e-2 && Math.abs(x) < 1e4 ? F.num(x, n) : F.sci(x, n);

/* ---------- la construction de Newton ---------- */
(() => {
  const E = 0.3, svg = $("pol"), P = Plot.el, WD = 640, HT = 400;
  let sansForce = false;
  const k = Math.min((WD - 40) / 2, (HT - 40) / (2 * Math.sqrt(1 - E * E))) / 1.3, cx = WD / 2 + k * E, cy = HT / 2;
  const X = x => cx + k * x, Y = y => cy - k * y, xy = p => X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1);
  function upd() {
    const n = +$("nk").value, p = Kepler.polygone(n, E, 1, sansForce), S = p.sommets;
    $("nkv").textContent = String(n);
    ["centrale", "aucune"].forEach(f => $("f-" + f).setAttribute("aria-pressed", String((f === "aucune") === sansForce)));
    svg.innerHTML = "";
    const clip = P("clipPath", { id: "polarea" }, svg); P("rect", { x: 0, y: 0, width: WD, height: HT }, clip);
    const g = P("g", { "clip-path": "url(#polarea)" }, svg);
    S.slice(1).forEach((q, i) => P("path", { d: "M" + xy([0, 0]) + "L" + xy(S[i]) + "L" + xy(q) + "Z", class: "fill c-tint", opacity: i % 2 ? "0.12" : "0.3" }, g));
    P("path", { d: Kepler.ellipse(1, E, 240).map((q, i) => (i ? "L" : "M") + xy(q)).join(""), class: "stroke thin dash c-label-2" }, g);
    P("path", { d: S.map((q, i) => (i ? "L" : "M") + xy(q)).join(""), class: "stroke c-tint" }, g);
    if (!sansForce) S.slice(0, -1).forEach(q => { const r = Math.hypot(q[0], q[1]), l = 0.18 / r; P("line", { x1: X(q[0]), y1: Y(q[1]), x2: X(q[0] * (1 - l)), y2: Y(q[1] * (1 - l)), class: "stroke c-warn" }, g); });
    S.forEach(q => P("circle", { cx: X(q[0]), cy: Y(q[1]), r: 3, class: "fill c-tint" }, g));
    P("circle", { cx: X(0), cy: Y(0), r: 7, class: "fill c-warn" }, g);
    const dev = Math.max(...p.aires.map(A => Math.abs(A / p.attendue - 1)));
    $("vaire").textContent = F.num(p.attendue, 4);
    $("faire").textContent = t("pol.f.aire", { a: F.num(p.attendue, 4) });
    $("vecart").textContent = small(dev, 1);
    const end = S[S.length - 1];
    $("vfin").textContent = sansForce ? "–" : small(Math.hypot(end[0] - S[0][0], end[1] - S[0][1]), 2);
    $("ffin").textContent = t(sansForce ? "pol.f.droite" : "pol.f.fin");
  }
  $("f-centrale").onclick = () => { sansForce = false; upd(); };
  $("f-aucune").onclick = () => { sansForce = true; upd(); };
  $("nk").oninput = upd; upd();
})();

/* ---------- ce que l'on néglige ---------- */
(() => { const IDS = ["sol", "soleil", "frottement", "vitesse"]; keyed($("neglect"), t("neglect.tag"), IDS, textOf("neglect.items", IDS)); })();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dialogo", 1632, "idea"], ["discorsi", 1638, "experiment"], ["principia", 1687, "idea"], ["apollo", 1971, "experiment"], ["microscope", 2022, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["chute", "orbite"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pousse", "a"], ["ficelle", "a"], ["uniforme", "a"], ["aires", "a"], ["masse", "a"], ["galileen", "a"], ["ellipse", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 73 });
})();
</script>
