<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, eV = K.e;
/* resonance energy from heats of hydrogenation, kJ/mol: 3 × 120 expected, 208 measured */
const RESONANCE = 152e3 / K.N_A;

/* ---------- the two Kekulé structures, each drawn as dark as it is probable ---------- */
(() => {
  const sA = $("sA"), sd = $("sd");
  const ring = (svg, pDouble, cls, decal) => {
    svg.innerHTML = "";
    const c = 100, R = 70, pts = Array.from({ length: 6 }, (_, k) => [c + R * Math.cos(Math.PI / 6 + k * Math.PI / 3), c + R * Math.sin(Math.PI / 6 + k * Math.PI / 3)]);
    const g = Plot.el("g", { class: "c-label-2" }, svg), gd = Plot.el("g", { class: cls }, svg);
    for (let k = 0; k < 6; k++) {
      const [a, b] = [pts[k], pts[(k + 1) % 6]];
      Plot.el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: "stroke" }, g);
      if ((k + decal) % 2 === 0) {         /* the second line of a double bond, inside the ring */
        const f = 0.8, m = [c + f * (a[0] - c), c + f * (a[1] - c)], n = [c + f * (b[0] - c), c + f * (b[1] - c)];
        Plot.el("line", { x1: m[0], y1: m[1], x2: n[0], y2: n[1], class: "stroke bold", "stroke-opacity": Math.max(0.05, pDouble).toFixed(3) }, gd);
      }
    }
  };
  function draw() {
    const A = +sA.value * eV, d = +sd.value * eV, r = Q.vecteursPropresDeux([[-d / 2, -A], [-A, d / 2]]);
    const p1 = Cx.abs(r.bas[0]) ** 2, p2 = Cx.abs(r.bas[1]) ** 2, dE = r.Ehaut - r.Ebas;
    ring($("k1"), p1, "c-tint", 0); ring($("k2"), p2, "c-warn", 1);
    $("sAr").textContent = F.si(A / eV, "eV");
    $("sdr").textContent = F.si(d / eV, "eV");
    $("vP").textContent = F.num(p1, 3) + " / " + F.num(p2, 3);
    $("fP").textContent = t(d === 0 ? "fig.f.P0" : "fig.f.P");
    $("vG").textContent = F.si((-d / 2 - r.Ebas) / eV, "eV");
    $("fG").textContent = t("fig.f.gain");
    $("vL").textContent = F.si(Q.longueurOndeTransition(dE), "m", { prefix: "n" });
    $("fL").textContent = t("fig.f.l", { dE: F.si(dE / eV, "eV") });
  }
  sA.oninput = draw; sd.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const A = RESONANCE, l = Q.longueurOndeTransition(2 * A), lmes = 255e-9;
  $("sys").innerHTML = t("sys.body", { A: F.si(A / eV, "eV"), l: F.si(l, "m", { prefix: "n" }), lm: F.si(lmes, "m", { prefix: "n" }),
    Em: F.si(K.h * K.c / lmes / eV, "eV"), kT: F.si(K.k_B * 300 / eV, "eV", { prefix: "m" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1825, "experiment"], ["kekule", 1865, "idea"], ["oscillation", 1872, "idea"], ["lonsdale", 1929, "experiment"], ["huckel", 1931, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["industrie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dibromo", "d"], ["fondamental", "a"], ["liaisons", "c"], ["energie", "b"], ["lambda", "a"], ["dissymetrie", "d"], ["limite", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1004 });
})();
</script>
