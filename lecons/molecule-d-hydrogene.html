<script src="/racoon/i18n.js"></script>

<script src="/racoon/quiz.js"></script>

<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/quantique-deux-etats.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, Cx = self.Cx, PM = 1e-12, eV = K.e, H2 = Q.h2Morse;

/* ---------- the two curves, and the chance that two atoms meeting form the molecule ---------- */
(() => {
  const svg = $("fig"), sd = $("sd"), sa = $("sa"), N = 240, X0 = 40, X1 = 300, Y0 = -5, Y1 = 4;
  function draw() {
    const D = +sd.value * PM, th = +sa.value * Math.PI / 180, eII = Q.morse(D), eI = Q.antiMorse(D);
    /* electron 1 up along z, electron 2 along a direction at θ from it, in the xz plane */
    const p = Q.probaSingulet([Math.cos(th / 2), Math.sin(th / 2), 0, 0]);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 520, h: 320, x: { domain: [X0, X1], label: t("fig.x"), fmt: v => F.num(v, 0) },
      y: { domain: [Y0, Y1], label: t("fig.y"), fmt: v => F.num(v, 0) } });
    const clamp = v => Math.min(Y1, Math.max(Y0, v));
    for (const [f, cls, sty] of [[Q.morse, "c-tint", "stroke bold"], [Q.antiMorse, "c-warn", "stroke dash"]]) {
      const pts = Array.from({ length: N + 1 }, (_, i) => { const xr = X0 + (X1 - X0) * i / N; return [x(xr), y(clamp(f(xr * PM) / eV))]; });
      Plot.el("path", { d: Plot.path(pts), class: sty }, Plot.el("g", { class: cls }, g));
    }
    const gl = Plot.el("g", { class: "c-label-2" }, g);
    Plot.el("line", { x1: x(X0), x2: x(X1), y1: y(0), y2: y(0), class: "stroke thin dash" }, gl);
    Plot.el("line", { x1: x(+sd.value), x2: x(+sd.value), y1: y(Y0), y2: y(Y1), class: "stroke thin" }, gl);
    $("sdr").textContent = F.si(D, "m", { prefix: "p" });
    $("sar").textContent = F.num(+sa.value, 0) + " °";
    $("vII").textContent = F.si(eII / eV, "eV");
    $("fII").textContent = t("fig.f.II");
    $("vI").textContent = F.si(eI / eV, "eV");
    $("fI").textContent = t("fig.f.I");
    $("vP").textContent = F.num(p, 3);
    $("fP").textContent = t("fig.f.P", { q: F.num(1 - p, 3) });
  }
  sd.oninput = draw; sa.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const zp = H2.De - H2.D0;
  $("sys").innerHTML = t("sys.body", { De: F.si(H2.De / eV, "eV"), D0: F.si(H2.D0 / eV, "eV"), zp: F.si(zp / eV, "eV"), re: F.si(H2.re, "m", { prefix: "p" }),
    kT: F.si(K.k_B * 300 / eV, "eV", { prefix: "m" }), r: F.num(H2.D0 / (K.k_B * 300), 0) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lewis", 1916, "idea"], ["heitler", 1927, "idea"], ["para", 1929, "experiment"], ["nobel", 1932, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["liquide", "rmn"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["base", "a"], ["spins", "c"], ["parallele", "d"], ["hasard", "b"], ["fermi", "a"], ["compare", "c"], ["ionique", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1003 });
})();
</script>
