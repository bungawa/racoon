<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions;

/* ---------- titrage : 20 mL d'analyte par la soude à 0,1 mol·L⁻¹ ---------- */
(() => {
  const V0 = 0.02, CB = 0.1, VMAX = 0.04, TITRANT = [{ id: "HO-", c: CB }];
  const AN = { hcl: { id: "H3O+", n: 1 }, ethanoique: { id: "ethanoique", n: 1 }, ammonium: { id: "ammonium", n: 1 }, phosphorique: { id: "phosphorique", n: 2 } };
  const st = { a: "ethanoique", i: "phenolphtaleine" }, sca = $("sca"), sv = $("sv");
  const pHv = (ap, V) => C.titrage({ V0, apports: ap }, TITRANT, V);
  /* the volume where the indicator turns: pH(V) = pK, pH rises with V */
  const virage = (ap, pK) => { if (pHv(ap, 0) >= pK) return 0; if (pHv(ap, VMAX) <= pK) return null;
    let lo = 0, hi = VMAX; for (let k = 0; k < 60; k++) { const m = (lo + hi) / 2; if (pHv(ap, m) < pK) lo = m; else hi = m; } return (lo + hi) / 2; };
  function draw() {
    const A = AN[st.a], ca = Math.pow(10, +sca.value), ap = [{ id: A.id, c: ca }], V = +sv.value / 1e3, ind = C.INDICATEURS.find(x => x.id === st.i);
    $("analyte").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.a === st.a)));
    $("indic").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.i === st.i)));
    const VE = ca * V0 / CB;                                    // first equivalence; the phosphoric acid shows a second at 2 VE
    const svg = $("courbe"); svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 48 }, x: { domain: [0, 40], label: t("sim.x") }, y: { domain: [0, 14], label: t("sim.y"), ticks: 7 } });
    Plot.el("rect", { x: o.x(0), y: o.y(ind.zone[1]), width: o.x(40) - o.x(0), height: o.y(ind.zone[0]) - o.y(ind.zone[1]), class: "fill c-warn", opacity: 0.15 }, o.g);
    for (let k = 1; k <= A.n; k++) if (k * VE <= VMAX) Plot.el("line", { x1: o.x(k * VE * 1e3), x2: o.x(k * VE * 1e3), y1: o.y(0), y2: o.y(14), class: "stroke thin dash c-label-2" }, o.g);
    const pts = []; for (let i = 0; i <= 400; i++) { const v = i * VMAX / 400; pts.push([o.x(v * 1e3), o.y(pHv(ap, v))]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold c-tint" }, o.g);
    const p = pHv(ap, V);
    Plot.el("circle", { cx: o.x(V * 1e3), cy: o.y(p), r: 5, class: "fill c-tint" }, o.g);
    /* the mixture at V, for the buffer capacity */
    const mix = C.melange([{ V: V0, apports: ap }, { V, apports: TITRANT }]);
    $("scav").innerHTML = F.qty(F.sci(ca, 2), "mol·L⁻¹");
    $("svv").innerHTML = F.qty(F.fix(V * 1e3, 1), "mL");
    $("vph").textContent = F.fix(p, 2);
    $("vbeta").innerHTML = F.qty(F.sci(C.pouvoirTampon(mix, p), 2), "mol·L⁻¹");
    $("vve").innerHTML = VE <= VMAX ? F.qty(F.fix(VE * 1e3, 2), "mL") : t("sim.hors");
    $("fve").textContent = VE <= VMAX ? t("sim.f.ve", { ph: F.fix(pHv(ap, VE), 2) }) : t("sim.f.vehors");
    const vv = virage(ap, ind.pK);
    $("vvir").innerHTML = vv === null ? t("sim.jamais") : F.qty(F.fix(vv * 1e3, 2), "mL");
    $("fvir").textContent = vv === null || VE > VMAX ? t("sim.f.virage0", { pk: F.fix(ind.pK, 2) })
      : t("sim.f.virage", { e: F.num(100 * (vv - VE) / VE, 2), pk: F.fix(ind.pK, 2) });
  }
  $("analyte").querySelectorAll("button").forEach(b => b.onclick = () => { st.a = b.dataset.a; draw(); });
  $("indic").querySelectorAll("button").forEach(b => b.onclick = () => { st.i = b.dataset.i; draw(); });
  sca.oninput = sv.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gaylussac", 1824, "experiment"], ["mohr", 1855, "experiment"], ["baeyer", 1871, "experiment"], ["henderson", 1908, "idea"], ["hasselbalch", 1916, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sang", "titrage"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tampon", "a"], ["beta", "c"], ["dilution", "b"], ["equivalence", "d"], ["demi", "a"], ["indicateur", "c"], ["saut", "b"], ["phosphorique", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1855 });
})();
</script>
