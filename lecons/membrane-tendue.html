<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, G0 = Constantes.g0;
const metres = v => F.si(v, "m", { prefix: "" }), mm = v => F.si(v, "m", { prefix: "m" }), pct = v => F.qty(F.num(100 * v, 2), "%");

/* The described model: a latex sheet 0,5 mm thick (rubber 920 to 990 kg·m⁻³, CRC Handbook via MFA CAMEO), stretched to τ = 50 N·m⁻¹
   on a circular frame of 50 cm; a steel ball of 3 mm radius (ρ from Elasticite). Its own weight is a uniform load, f = −σ g. */
const D = 0.5, TAU = 50, SIGMA = 0.95e3 * 5e-4, P = -SIGMA * G0 / TAU, RB = 3e-3, MB = 4 / 3 * Math.PI * RB ** 3 * Elasticite.MATERIAUX.acier.rho;
const A = { x: -0.12, y: 0, r: 0.03, u: 0.01 }, B = { x: 0.12, y: 0.03, r: 0.03 };

(() => {
  const fosse = MB * G0 / (2 * Math.PI * TAU) * Math.log(D / 2 / RB);
  $("sys1").innerHTML = t("sys1.body", { D: metres(D), tau: F.si(TAU, "N·m⁻¹"), sigma: F.si(SIGMA, "kg·m⁻²"), p: F.si(-P * D * D / 16, "m", { prefix: "m" }),
    m: F.qty(F.sci(MB, 2), "kg"), r: mm(RB), fosse: mm(fosse), rel: pct(fosse / A.u) });
})();

/* ---------- un calculateur à feuille de caoutchouc ---------- */
(() => {
  const svg = $("carte"), bsl = $("bsl"), tsl = $("tsl"), seg = $("mode"), R = D / 2;
  let mode = "roule", cache = null;
  function draw() {
    const ub = +bsl.value, th = +tsl.value * Math.PI / 180;
    if (!cache || cache.ub !== ub) cache = { ub, m: ES.membrane({ D, n: 81, p: P, poteaux: [A, Object.assign({ u: ub }, B)] }) };
    const m = cache.m, depart = [A.x + 0.04 * Math.cos(th), A.y + 0.04 * Math.sin(th)];
    const b = ES.bille(m, depart, { facteur: mode === "roule" ? 5 / 7 : 1, dt: 1e-3, tmax: 6 });
    const c = CarteChamp.carte(svg, { W: 440, H: 440, x0: -R * 1.04, x1: R * 1.04, y0: -R * 1.04, y1: R * 1.04 });
    const f = ([x, y]) => (Math.hypot(x, y) >= R ? 0 : m.valeur(x, y));                      // the frame holds 0
    CarteChamp.fond(c, p => (Math.hypot(p[0], p[1]) >= R ? -0.02 : f(p)), 88, 88, { lo: -0.02, hi: 0.01 });
    const niv = []; for (let k = -15; k <= 8; k++) if (k) niv.push(k * 0.00125);
    CarteChamp.niveaux(c, f, niv, { n: [120, 120] });
    const cadre = c.layer("c-label");
    Plot.el("circle", { cx: c.sx(0), cy: c.sy(0), r: c.sx(R) - c.sx(0), class: "stroke bold" }, cadre);
    for (const q of [A, B]) Plot.el("circle", { cx: c.sx(q.x), cy: c.sy(q.y), r: c.sx(q.r) - c.sx(0), class: "fill" }, cadre);
    Plot.el("polyline", { points: b.points.map(p => c.sx(p[0]).toFixed(1) + "," + c.sy(p[1]).toFixed(1)).join(" "), class: "stroke bold" }, c.layer("c-warn"));
    CarteChamp.point(c, depart, 4, "c-warn");
    $("bread").textContent = mm(ub);
    $("tread").textContent = F.qty(F.num(+tsl.value, 3), "°");
    $("vfin").textContent = t("fin." + b.fin);
    $("ffin").textContent = t("fin.f." + b.fin, { v: F.si(b.v, "m·s⁻¹") });
    $("vduree").textContent = F.si(b.t, "s");
    $("vpente").textContent = F.num(m.penteMax, 2);
    $("fpente").textContent = t("fig.f.pente", { e: pct(m.penteMax ** 2 / 2) });
    $("venergie").textContent = pct(b.derive / (G0 * (A.u - ub)));
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(x => { x.onclick = () => { mode = x.dataset.m; draw(); }; });
  bsl.oninput = tsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["prandtl", 1903, "idea"], ["jonker", 1942, "experiment"], ["spandex", 2013, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["torsion"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tension", "b"], ["poids", "d"], ["tige", "a"], ["pentes", "c"], ["roule", "b"], ["energie", "a"], ["kepler", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 123 });
})();
</script>
