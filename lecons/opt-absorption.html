<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd;

/* ---------- une raie d'absorption : l'indice, puis la lumière transmise, selon le nombre d'atomes traversés ---------- */
(() => {
  const W0 = 2 * Math.PI * O.c / 589e-9, G = 1e8, DZ = 0.01;                 // a line at 589 nm, γ = 10⁸ s⁻¹, a 1 cm cell
  const idx = $("indice"), tr = $("trans"), sc = $("scol"), sx = $("sx");
  function draw() {
    const col = 10 ** +sc.value, x = +sx.value, raie = { N: col / DZ, w0: W0, gamma: G }, L = [raie];
    const tau0 = O.profondeurCentre(raie, col), nmax = O.indiceComplexe(W0, L).nsec, ici = O.traversee(W0 + x * G, L, DZ);
    /* the index near the line, in units of its largest n″ */
    idx.innerHTML = "";
    const xs = Array.from({ length: 241 }, (_, i) => -6 + i * 0.05), ns = xs.map(u => O.indiceComplexe(W0 + u * G, L));
    const P = Plot.axes(idx, { fmt: F, w: 640, h: 200, pad: { l: 56, b: 40 }, x: { domain: [-6, 6], label: t("fig.xaxis") }, y: { domain: [-0.6, 1.05], label: t("fig.yaxis.n") } });
    Plot.el("line", { x1: P.x(-6), x2: P.x(6), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((u, i) => [P.x(u), P.y(ns[i].nsec / nmax)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((u, i) => [P.x(u), P.y((ns[i].np - 1) / nmax)])), class: "ref" }, P.g);
    if (Math.abs(x) <= 6) Plot.el("circle", { cx: P.x(x), cy: P.y(ici.nsec / nmax), r: 5, class: "dot" }, P.g);
    /* the light that comes out of the cell */
    tr.innerHTML = "";
    const X = Math.max(8, Math.ceil(2.5 * Math.sqrt(tau0)), Math.ceil(Math.abs(x) + 1));
    const us = Array.from({ length: 601 }, (_, i) => -X + i * X / 300);
    const Q = Plot.axes(tr, { fmt: F, w: 640, h: 200, pad: { l: 56, b: 40 }, x: { domain: [-X, X], label: t("fig.xaxis") }, y: { domain: [0, 1.05], label: t("fig.yaxis.t") } });
    Plot.el("path", { d: Plot.path(us.map(u => [Q.x(u), Q.y(O.traversee(W0 + u * G, L, DZ).T)])), class: "curve" }, Q.g);
    Plot.el("circle", { cx: Q.x(x), cy: Q.y(ici.T), r: 5, class: "dot" }, Q.g);
    const w = O.largeurEquivalente(raie, col);
    $("scolr").textContent = F.qty(F.sci(col, 2), "m⁻²");
    $("sxr").textContent = F.num(x, 3) + " γ";
    $("vtau").textContent = F.num(tau0, 3);
    $("ftau").textContent = t("fig.f.tau", { T: ici.T >= 1e-3 ? F.num(ici.T, 3) : F.sci(ici.T, 2), L: F.si(ici.longueur, "m") });
    $("vn").textContent = F.sci(ici.nsec, 2);
    $("fn").textContent = t("fig.f.n", { np: F.sci(ici.np - 1, 2) });
    $("vw").textContent = F.num(w.W / G, 3) + " γ";
    $("fw").textContent = t("fig.f.w", { a: F.num(w.mince / G, 3), b: F.num(w.epais / G, 3) });
  }
  sc.oninput = sx.oninput = draw; draw();
})();

/* ---------- le système décrit : un verre loin de sa résonance ---------- */
(() => {
  const l0 = 100e-9, l = 500e-9, G = 1e8, w0 = 2 * Math.PI * O.c / l0, w = 2 * Math.PI * O.c / l;
  const r = G * w / (w0 * w0 - w * w), nsec = 0.5 * r, alpha = 2 * w * nsec / O.c;
  $("sys1").innerHTML = t("sys1.body", { r: F.sci(r, 2), n2: F.sci(nsec, 2), L: F.si(1 / alpha, "m"), x: F.sci((w0 - w) / G, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bouguer", 1729, "experiment"], ["lambert", 1760, "idea"], ["wollaston", 1802, "experiment"], ["fraunhofer", 1814, "experiment"], ["kirchhoff", 1859, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["oxymetre", "spectro"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signe", "c"], ["deux", "a"], ["verre", "d"], ["epaisseur", "b"], ["sature", "c"], ["soleil", "a"], ["centre", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 314 });
})();
</script>
