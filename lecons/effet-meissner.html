<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro;
$("sys1").innerHTML = t("sys.body", { n: F.sci(1.5e28, 2), l: F.si(Q.longueurLondon(1.5e28), "m") });
(() => {
  const svg = $("plaque"), sn = $("sn"), sd = $("sd");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [-0.6, 0.6], label: t("fig.x") }, y: { domain: [-1.1, 1.1], label: t("fig.y") } });
  const plq = Plot.el("rect", { x: x(-0.5), width: x(0.5) - x(-0.5), y: y(1.1), height: y(-1.1) - y(1.1), class: "fill c-label-2", "fill-opacity": 0.15 }, g);
  const pb = Plot.el("path", { class: "stroke c-tint" }, g), pj = Plot.el("path", { class: "stroke thin c-warn" }, g);
  function draw() {
    const n = 10 ** +sn.value, d = 10 ** +sd.value * 1e-9, l = Q.longueurLondon(n);
    const B = [], J = []; let moy = 0;
    for (let i = 0; i <= 400; i++) { const u = -0.6 + 1.2 * i / 400, xx = u * d; B.push([x(u), y(Q.profilMeissner(xx, d, l))]);
      /* J ∝ dB/dx (Ampère), normalised by its value at the face */
      const h = d * 1e-4, dB = (Q.profilMeissner(Math.min(d / 2, xx + h), d, l) - Q.profilMeissner(Math.max(-d / 2, xx - h), d, l)) / (2 * h);
      J.push([x(u), y(Math.abs(u) <= 0.5 ? dB * l * Math.tanh(d / (2 * l)) : 0)]); }
    for (let i = 0; i < 200; i++) moy += Q.profilMeissner(-d / 2 + d * (i + 0.5) / 200, d, l) / 200;
    pb.setAttribute("d", Plot.path(B)); pj.setAttribute("d", Plot.path(J));
    $("snr").textContent = F.sci(n, 2) + " m⁻³"; $("sdr").textContent = F.si(d, "m");
    $("vl").textContent = F.si(l, "m");
    $("fl").textContent = t("fig.f.l", { r: F.num(d / l, 3) });
    $("vc").textContent = F.sci(Q.profilMeissner(0, d, l), 2);
    $("fc").textContent = t("fig.f.c");
    $("vm").textContent = F.qty(F.num(100 * moy, 3), "%");
    $("fm").textContent = t("fig.f.m");
  }
  sn.oninput = sd.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["meissner", 1933, "experiment"], ["london", 1935, "idea"], ["bcs", 1957, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["levitation"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["parfait", "b"], ["london", "c"], ["ecran", "a"], ["densite", "d"], ["paires", "a"], ["mince", "c"], ["courant", "d"], ["mesure", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 216 });
})();
</script>
