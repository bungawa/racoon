<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-fluides" data-i18n="monde.fluides"></a><span class="aux">›</span><a href="/racoon/etape?id=tension-superficielle" data-i18n="etape.tension-superficielle"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fluides" href="/racoon/atlas?piste=fluides" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/protocole-tension-superficielle" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="box def"><b data-i18n="s1.sys.title"></b>
      <p data-i18n-html="s1.sys.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>F</mi><mo>=</mo><mi>γ</mi><mi>P</mi><mspace width="0.15em"/><mi data-i18n="eq.cos"></mi><mspace width="0.1em"/><mi>θ</mi><mo>−</mo><mi>ρ</mi><mi>g</mi><mi>L</mi><mi>e</mi><mi>d</mi><mo>,</mo><mspace width="0.8em"/><mi>P</mi><mo>=</mo><mn>2</mn><mo stretchy="false">(</mo><mi>L</mi><mo>+</mo><mi>e</mi><mo stretchy="false">)</mo></math></div>
    <p class="validite" data-i18n-html="val.3.1"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><mi>γ</mi><mo>=</mo><mfrac><msub><mi>F</mi><mn>0</mn></msub><mi>P</mi></mfrac></math></div>
    <p class="validite" data-i18n-html="val.3.2"></p>
    <figure class="chart">
      <svg class="fig" id="wil" role="img" data-i18n-attr="aria-label:wil.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="wil.legend.F"></span><span class="c-warn" data-i18n="wil.legend.ref"></span></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="wth" data-i18n="wil.theta"></label><output id="wthv" for="wth"></output></div>
          <input id="wth" type="range" min="0" max="40" step="1" value="0"></div>
        <div class="ctl"><div class="row"><label for="wdT" data-i18n="wil.dT"></label><output id="wdTv" for="wdT"></output></div>
          <input id="wdT" type="range" min="-3" max="3" step="0.1" value="0"></div>
        <div class="ctl"><div class="row"><label for="wuF" data-i18n="wil.uF"></label><output id="wuFv" for="wuF"></output></div>
          <input id="wuF" type="range" min="0" max="2" step="0.05" value="1"></div>
        <div class="ctl"><div class="row"><label for="wuT" data-i18n="wil.uT"></label><output id="wuTv" for="wuT"></output></div>
          <input id="wuT" type="range" min="-1.5" max="0.5" step="0.05" value="-1"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="wil.k.gamma"></span><span class="v" id="vgam"></span><span class="f" id="fgam"></span></div>
          <div class="stat"><span class="k" data-i18n="wil.k.u"></span><span class="v" id="vu"></span><span class="f" id="fu"></span></div>
          <div class="stat"><span class="k" data-i18n="wil.k.z"></span><span class="v" id="vz"></span><span class="f" id="fz"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="wil.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><msub><mi>F</mi><mi data-i18n="eq.max"></mi></msub><mo>=</mo><mn>4</mn><mi>π</mi><mi>R</mi><mi>γ</mi></math></div>
    <p class="validite" data-i18n-html="val.3.3"></p>
    <p data-i18n-html="s3.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="eq"><math display="block"><mi>u</mi><msup><mrow><mo stretchy="false">(</mo><mi>γ</mi><mo stretchy="false">)</mo></mrow><mn>2</mn></msup><mo>=</mo><msup><mrow><mo>(</mo><mfrac><mrow><mi>u</mi><mo stretchy="false">(</mo><mi>F</mi><mo stretchy="false">)</mo></mrow><mi>P</mi></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mo>+</mo><msup><mrow><mo>(</mo><mi>γ</mi><mfrac><mrow><mi>u</mi><mo stretchy="false">(</mo><mi>P</mi><mo stretchy="false">)</mo></mrow><mi>P</mi></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mo>+</mo><msup><mrow><mo>(</mo><mfrac><mrow><mi mathvariant="normal">d</mi><mi>γ</mi></mrow><mrow><mi mathvariant="normal">d</mi><mi>T</mi></mrow></mfrac><mi>u</mi><mo stretchy="false">(</mo><mi>T</mi><mo stretchy="false">)</mo><mo>)</mo></mrow><mn>2</mn></msup></math></div>
    <p class="validite" data-i18n-html="val.3.4"></p>
    <p data-i18n-html="s4.p2"></p>
    <div class="eq"><math display="block"><mi>z</mi><mo>=</mo><mfrac><mrow><mo>|</mo><msub><mi>γ</mi><mi data-i18n="eq.mes"></mi></msub><mo>−</mo><msub><mi>γ</mi><mi data-i18n="eq.ref"></mi></msub><mo>|</mo></mrow><msqrt><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msubsup><mi>u</mi><mi data-i18n="eq.ref"></mi><mn>2</mn></msubsup></mrow></msqrt></mfrac></math></div>
    <p class="validite" data-i18n-html="val.3.5"></p>
    <div class="list keyed" id="budget"></div>
    <div class="box warn"><b data-i18n="s4.warn.title"></b>
      <p data-i18n-html="s4.warn.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/mesurer-tension-superficielle.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/fluides.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const keyed = (el, ITEMS, txt) => { el.innerHTML = ITEMS.map(([id, k]) => `<div><span class="k">${k}</span><span>${txt[id]}</span></div>`).join(""); };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), path = Plot.path, E = Fluides.LIQUIDES.eau, DEG = Math.PI / 180;
/* the system of §1: plate 20,0 mm × 0,10 mm, u(P) = 20 µm; reference: IAPWS at 293,15 K, 72,74 ± 0,36 mN·m⁻¹ */
const LAME = { L: 0.02, e: 1e-4, uP: 20e-6 }, P = 2 * (LAME.L + LAME.e), T0 = 293.15, GREF = Fluides.gammaEau(T0), UREF = 0.36e-3;
const mN = (x, sig) => F.si(x * 1e3, "mN·m⁻¹", { sig: sig || 4, prefix: "" });

/* ---------- §2 : la lame, force contre immersion, et le jugement de la mesure ---------- */
(() => {
  const svg = $("wil");
  function upd() {
    const th = +$("wth").value * DEG, dT = +$("wdT").value, uF = Math.pow(10, +$("wuF").value) * 1e-6, uT = Math.pow(10, +$("wuT").value);
    const T = T0 + dT, sys = { gamma: Fluides.gammaEau(T), theta: th, L: LAME.L, e: LAME.e, rho: E.rho };
    const ref = Object.assign({}, sys, { gamma: GREF, theta: 0 }), F0 = Fluides.wilhelmy(sys, 0);
    const b = Fluides.budgetWilhelmy({ F: F0, P, uF, uP: LAME.uP, uT, T: T0 }), z = Math.abs(b.gamma - GREF) / Math.hypot(b.u, UREF);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 52 }, x: { domain: [0, 10], label: t("wil.xaxis") }, y: { domain: [2, 3], label: t("wil.yaxis") } });
    Plot.el("path", { d: path([0, 10].map(d => [o.x(d), o.y(Fluides.wilhelmy(ref, d * 1e-3) * 1e3)])), class: "ref" }, o.g);
    Plot.el("path", { d: path([0, 10].map(d => [o.x(d), o.y(Fluides.wilhelmy(sys, d * 1e-3) * 1e3)])), class: "curve" }, o.g);
    Plot.el("circle", { cx: o.x(0), cy: o.y(F0 * 1e3), r: 5, class: "dot" }, o.g);
    $("wthv").textContent = F.num(th / DEG, 2) + "°";
    $("wdTv").textContent = (dT < 0 ? F.MINUS : dT > 0 ? "+" : "") + F.qty(F.fix(Math.abs(dT), 1), "K");
    $("wuFv").textContent = F.si(uF, "N", { sig: 2 });
    $("wuTv").textContent = F.si(uT, "K", { sig: 2, prefix: "" });
    $("vgam").textContent = mN(b.gamma);
    $("fgam").textContent = t("wil.f.gamma", { F0: F.si(F0, "N", { sig: 4 }) });
    $("vu").textContent = mN(b.u, 2);
    $("fu").textContent = t("wil.f.u", { f: mN(b.parts.F, 2), p: mN(b.parts.P, 2), t: mN(b.parts.T, 2) });
    $("vz").textContent = F.num(z, 2);
    $("fz").textContent = t(z < 2 ? "wil.f.ok" : "wil.f.ko");
  }
  ["wth", "wdT", "wuF", "wuT"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- §4 : le budget d'incertitude, chiffré pour le système de §1 ---------- */
(() => {
  const F0 = GREF * P, b = Fluides.budgetWilhelmy({ F: F0, P, uF: 10e-6, uP: LAME.uP, uT: 0.1, T: T0 });
  const ITEMS = [["force", mN(b.parts.F, 2)], ["perimetre", mN(b.parts.P, 2)], ["temperature", mN(b.parts.T, 2)],
    ["angle", mN(GREF * (1 - Math.cos(10 * DEG)), 2)], ["anneau", F.si(Fluides.anneau(GREF, 0.01), "N", { sig: 3 })]];
  keyed($("budget"), ITEMS, textOf("budget.items", ITEMS.map(i => i[0])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wilhelmy1863", 1863, "experiment"], ["dunouy1925", 1925, "use"], ["harkins1930", 1930, "idea"], ["en2004", 2004, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["norme"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["perimetre", "b"], ["poussee", "d"], ["angle", "a"], ["temperature", "c"], ["anneau", "b"], ["z", "d"], ["dominante", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 3103 });
})();
</script>
</body>
</html>
