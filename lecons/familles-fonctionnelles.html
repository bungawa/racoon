  .duo { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .duo svg { flex: 1 1 260px; min-width: 0; max-width: 360px; height: 220px; }
  .duo .liste { flex: 1 1 240px; min-width: 0; }

<main class="page">

    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">

  <section class="card">

      <div class="duo">

        <div class="liste">
          <p data-i18n="fam.trouvees"></p>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>

  <section class="card">

    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><msub><mi mathvariant="normal">Δ</mi><mi mathvariant="normal">r</mi></msub><msup><mi>G</mi><mo>°</mo></msup><mo>=</mo><mo>−</mo><mi>R</mi><mi>T</mi><mspace width="0.1em"/><mi data-i18n="eq.ln"></mi><mo>⁡</mo><msup><mi>K</mi><mo>°</mo></msup></math></div>
    <p class="validite" data-i18n-html="s3.validite1"></p>
    <div class="eq"><math display="block"><mi>k</mi><mo>=</mo><mfrac><mrow><msub><mi>k</mi><mi mathvariant="normal">B</mi></msub><mi>T</mi></mrow><mi>h</mi></mfrac><mspace width="0.1em"/><mi data-i18n="eq.exp"></mi><mo>⁡</mo><mo>(</mo><mo>−</mo><mfrac><mrow><mi mathvariant="normal">Δ</mi><msup><mi>G</mi><mo>‡</mo></msup></mrow><mrow><mi>R</mi><mi>T</mi></mrow></mfrac><mo>)</mo></math></div>
    <p class="validite" data-i18n-html="s3.validite2"></p>
    <p data-i18n-html="s3.p2"></p>
    <figure>
      <div class="chart"><svg id="courbe" role="img" data-i18n-attr="aria-label:ctl.aria"></svg></div>
      <div class="legend"><span class="c-label-2" data-i18n="ctl.leg.a"></span><span class="c-tint" data-i18n="ctl.leg.b"></span><span class="c-warn" data-i18n="ctl.leg.c"></span></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="gb" data-i18n="ctl.gb"></label><output id="gbr" for="gb"></output></div>
          <input id="gb" type="range" min="60" max="110" step="1" value="80"></div>
        <div class="ctl"><div class="row"><label for="gc" data-i18n="ctl.gc"></label><output id="gcr" for="gc"></output></div>
          <input id="gc" type="range" min="60" max="110" step="1" value="88"></div>
        <div class="ctl"><div class="row"><label for="rb" data-i18n="ctl.rb"></label><output id="rbr" for="rb"></output></div>
          <input id="rb" type="range" min="-40" max="0" step="1" value="-5"></div>
        <div class="ctl"><div class="row"><label for="rc" data-i18n="ctl.rc"></label><output id="rcr" for="rc"></output></div>
          <input id="rc" type="range" min="-40" max="0" step="1" value="-15"></div>
        <div class="ctl"><div class="row"><label for="temp" data-i18n="ctl.temp"></label><output id="tr" for="temp"></output></div>
          <input id="temp" type="range" min="200" max="450" step="5" value="300"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="ctl.k.cin"></span><span class="v" id="vcin"></span><span class="f" data-i18n="ctl.f.cin"></span></div>
          <div class="stat"><span class="k" data-i18n="ctl.k.thermo"></span><span class="v" id="vth"></span><span class="f" data-i18n="ctl.f.thermo"></span></div>
          <div class="stat"><span class="k" data-i18n="ctl.k.tau"></span><span class="v" id="vtau"></span><span class="f" id="ftau"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="ctl.caption"></figcaption>
    </figure>
    <p data-i18n-html="s3.p3"></p>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <figure>
      <svg class="fig no-sigle" id="approche" viewBox="0 0 660 230" role="img" data-i18n-attr="aria-label:app.aria"></svg>
      <figcaption data-i18n-html="app.caption"></figcaption>
    </figure>
    <div class="eq"><math display="block"><msub><mi>θ</mi><mtext data-i18n="eq.bd"></mtext></msub><mo>≈</mo><mn>107</mn><mo>°</mo></math></div>
    <p class="validite" data-i18n-html="s4.validite"></p>
    <p data-i18n-html="s4.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>

    <p data-i18n="hist.intro"></p>

    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/plot.js"></script>

<script src="/racoon/locales/fr/parcours.js"></script>

<script src="/racoon/sigles.js"></script>

<script src="/racoon/parcours.js"></script>

<script src="/racoon/locales/fr/lecons/familles-fonctionnelles.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>

<script src="/racoon/chim-organique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = ChimOrga, sym = s => t("chim.sym", { s });

/* ---------- familles : une molécule, ses familles, leurs atomes surlignés ---------- */
(() => {
  const IDS = Object.values(O.EXEMPLES_FAMILLES).concat(["cgGlucopyranose", "cgGlycylserine"]), noms = textOf("fam.mol", IDS), fams = textOf("fam.nom", O.FAMILLES);
  const sel = $("choix"), svg = $("molfam"), liste = $("trouvees");
  sel.innerHTML = IDS.map(id => `<option value="${id}">${noms[id]}</option>`).join("");
  sel.value = "cgGlucopyranose";
  let actif = -1;
  function dessine() {
    const m = O.molecule(sel.value), f = O.familles(m), d = O.dessin(m, { texte: sym, echelle: 40, surligne: actif >= 0 && f[actif] ? f[actif].atomes : [] });
    svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html;
    liste.innerHTML = f.map((x, k) => `<button type="button" class="btn${k === actif ? " tinted" : ""}" data-k="${k}" aria-pressed="${k === actif}">${fams[x.famille]}</button>`).join("");
  }
  sel.onchange = () => { actif = 0; dessine(); };
  liste.onclick = e => { const b = e.target.closest("button"); if (!b) return; actif = +b.dataset.k; dessine(); };
  actif = 0; dessine();
})();

/* ---------- sites ---------- */
(() => {
  const ROWS = ["carbonyle", "alcene", "halogeno", "epoxyde", "alcool"], txt = textOf("sites.rows", ROWS);
  $("sites").innerHTML = ROWS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text}</span></div>`).join("");
})();

/* ---------- contrôle cinétique, contrôle thermodynamique ---------- */
(() => {
  const svg = $("courbe"), L0 = -6, L1 = 10, kJ = 1000;
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { domain: [L0, L1], label: t("ctl.x") }, y: { domain: [0, 1], label: t("ctl.y") } });
  const cA = Plot.el("path", { class: "axis" }, g), cB = Plot.el("path", { class: "curve" }, g), cC = Plot.el("path", { class: "ref" }, g);
  const ids = ["gb", "gc", "rb", "rc", "temp"];
  function upd() {
    const o = { gB: +$("gb").value * kJ, gC: +$("gc").value * kJ, rB: +$("rb").value * kJ, rC: +$("rc").value * kJ, T: +$("temp").value };
    const N = 200, pts = Array.from({ length: N + 1 }, (_, i) => L0 + (L1 - L0) * i / N).map(l => [l, O.controle(o, Math.pow(10, l))]);
    cA.setAttribute("d", Plot.path(pts.map(([l, r]) => [x(l), y(r.A)])));
    cB.setAttribute("d", Plot.path(pts.map(([l, r]) => [x(l), y(r.B)])));
    cC.setAttribute("d", Plot.path(pts.map(([l, r]) => [x(l), y(r.C)])));
    $("gbr").textContent = F.si(o.gB / kJ, "kJ·mol⁻¹"); $("gcr").textContent = F.si(o.gC / kJ, "kJ·mol⁻¹");
    $("rbr").textContent = F.si(o.rB / kJ, "kJ·mol⁻¹"); $("rcr").textContent = F.si(o.rC / kJ, "kJ·mol⁻¹");
    $("tr").innerHTML = F.kelvin(o.T);
    $("vcin").textContent = F.num(O.rapportVoies(o.gC - o.gB, o.T), 2);
    $("vth").textContent = F.num(O.rapportVoies(o.rC - o.rB, o.T), 2);
    const tau = O.tempsEquilibre(o);
    $("vtau").textContent = F.si(tau, "s", { sig: 2 });
    $("ftau").textContent = t("ctl.f.tau", { j: F.num(tau / 86400, 2) });
  }
  ids.forEach(id => { $(id).oninput = upd; }); upd();
})();

/* ---------- géométrie d'approche : trois directions ---------- */
(() => {
  const svg = $("approche"), fond = [], out = [], R = d => d * Math.PI / 180;
  const lobe = (cx, cy, ang, l, w, plein) => {                    // lobe d'orbitale p : ellipse dont un bout touche le noyau
    const ux = Math.cos(R(ang)), uy = -Math.sin(R(ang));
    fond.push(`<ellipse cx="${(cx + ux * l / 2).toFixed(1)}" cy="${(cy + uy * l / 2).toFixed(1)}" rx="${(l / 2).toFixed(1)}" ry="${w.toFixed(1)}" transform="rotate(${(-ang).toFixed(1)} ${(cx + ux * l / 2).toFixed(1)} ${(cy + uy * l / 2).toFixed(1)})" class="${plein ? "fill c-tint" : "stroke thin c-tint"}"/>`);
  };
  const txt = (s, x, y, cls) => out.push(`<text x="${x}" y="${y}" text-anchor="middle"${cls ? ` class="${cls}"` : ""}>${s}</text>`);
  const fleche = (x1, y1, x2, y2) => {
    const a = Math.atan2(y2 - y1, x2 - x1), h = 9;
    out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="stroke c-warn"/>`);
    out.push(`<polygon points="${x2},${y2} ${(x2 - h * Math.cos(a - 0.4)).toFixed(1)},${(y2 - h * Math.sin(a - 0.4)).toFixed(1)} ${(x2 - h * Math.cos(a + 0.4)).toFixed(1)},${(y2 - h * Math.sin(a + 0.4)).toFixed(1)}" class="fill c-warn"/>`);
  };
  /* 1. Nu → C=O, π* : gros lobe sur C, petit sur O, phases opposées ; approche à 107° de la liaison C→O */
  { const C = [95, 140], Ox = 185;
    out.push(`<line x1="${C[0]}" y1="${C[1] - 3}" x2="${Ox}" y2="${C[1] - 3}" class="stroke"/><line x1="${C[0]}" y1="${C[1] + 3}" x2="${Ox}" y2="${C[1] + 3}" class="stroke"/>`);
    lobe(C[0], C[1], 90, 62, 20, true); lobe(C[0], C[1], 270, 62, 20, false); lobe(Ox, C[1], 90, 36, 12, false); lobe(Ox, C[1], 270, 36, 12, true);
    txt(sym("C"), C[0] - 14, C[1] + 18); txt(sym("O"), Ox + 14, C[1] + 18, "fill el-o");
    const th = R(107), r0 = 115, r1 = 30, ex = Math.cos(th), ey = -Math.sin(th);
    fleche((C[0] + r0 * ex).toFixed(1), (C[1] + r0 * ey).toFixed(1), (C[0] + r1 * ex).toFixed(1), (C[1] + r1 * ey).toFixed(1));
    txt(t("app.nu"), (C[0] + (r0 + 12) * ex).toFixed(1), (C[1] + (r0 + 12) * ey).toFixed(1));
    out.push(`<path d="M${C[0] + 40},${C[1]} A40,40 0 0 0 ${(C[0] + 40 * ex).toFixed(1)},${(C[1] + 40 * ey).toFixed(1)}" class="stroke thin dash"/>`);
    txt("107°", C[0] + 58, C[1] - 52, "fill c-label-2");
    txt(t("app.t1"), 120, 222, "fill c-label-2"); }
  /* 2. Nu → C–X, σ* : gros lobe derrière C, nœud entre C et X ; approche à 180° */
  { const C = [370, 140], X = 435;
    out.push(`<line x1="${C[0]}" y1="${C[1]}" x2="${X}" y2="${C[1]}" class="stroke"/>`);
    lobe(C[0], C[1], 180, 56, 20, true); lobe(C[0], C[1], 0, 26, 12, false); lobe(X, C[1], 180, 22, 10, true); lobe(X, C[1], 0, 34, 13, false);   // nœud entre C et X : lobes en regard de signes opposés
    txt(sym("C"), C[0], C[1] + 32); txt(sym("X"), X + 4, C[1] + 32);
    fleche(C[0] - 110, C[1], C[0] - 62, C[1]); txt(t("app.nu"), C[0] - 125, C[1] + 4);
    txt(t("app.t2"), 390, 222, "fill c-label-2"); }
  /* 3. E⁺ → C=C, π : lobes au-dessus et au-dessous des deux carbones ; approche perpendiculaire au plan */
  { const C1 = [540, 140], C2 = [600, 140];
    out.push(`<line x1="${C1[0]}" y1="${C1[1] - 3}" x2="${C2[0]}" y2="${C2[1] - 3}" class="stroke"/><line x1="${C1[0]}" y1="${C1[1] + 3}" x2="${C2[0]}" y2="${C2[1] + 3}" class="stroke"/>`);
    [C1, C2].forEach(C => { lobe(C[0], C[1], 90, 48, 17, true); lobe(C[0], C[1], 270, 48, 17, false); });
    txt(sym("C"), C1[0] - 14, C1[1] + 18); txt(sym("C"), C2[0] + 14, C2[1] + 18);
    fleche(570, 20, 570, 72); txt(t("app.e"), 590, 30);
    txt(t("app.t3"), 570, 222, "fill c-label-2"); }
  svg.innerHTML = fond.join("") + out.join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wohler", 1828, "experiment"], ["eyring", 1935, "idea"], ["woodward", 1944, "idea"], ["burgi", 1973, "experiment"], ["lehn", 1974, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["nomenclature", "glucose"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["acetal", "c"], ["ester", "a"], ["site", "d"], ["controle", "b"], ["temps", "c"], ["angle", "a"], ["sn2", "d"], ["electrophile", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 3101 });
})();
</script>
</body>
</html>
