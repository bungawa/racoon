<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const C = ChimArchi;

/* ---------- une réaction à identifier : méthode intégrale sur un suivi bruité ---------- */
(() => {
  const svg = $("suivi"), seg = $("ordre"), DUREE = 600, UNITES = ["mol·L⁻¹·s⁻¹", "s⁻¹", "L·mol⁻¹·s⁻¹"];
  const Y = [c => c, c => Math.log(c), c => 1 / c];                      // ce qui doit être une droite pour l'ordre 0, 1, 2
  let graine = 11, essai, teste = 1, revele = false;
  function nouvelle() {
    const R = Quiz.rng(graine++), n = Math.floor(R() * 3) % 3, c0 = 0.05 + 0.15 * R();
    /* k choisi pour 80 % d'avancement à la fin du suivi : [A] = [A]₀/5 à t = 600 s, quel que soit l'ordre */
    const k = n === 0 ? 0.8 * c0 / DUREE : n === 1 ? Math.log(5) / DUREE : 4 / (c0 * DUREE);
    essai = { n, c0, k, s: C.suiviSimule({ n, k, c0, duree: DUREE, points: 13, bruit: 0.01 }, R) };
    revele = false; draw();
  }
  function draw() {
    const { t: ts, c } = essai.s, ys = c.map(Y[teste]), fit = C.methodeIntegrale(ts, c).ordres[teste];
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.n === teste)));
    const lo = Math.min(...ys), hi = Math.max(...ys), m = 0.08 * (hi - lo);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 64 },
      x: { domain: [0, DUREE], label: t("sim.x") }, y: { domain: [lo - m, hi + m], label: t("sim.y" + teste) } });
    const d = fit.droite;
    Plot.el("line", { x1: o.x(0), x2: o.x(DUREE), y1: o.y(d.ordonnee), y2: o.y(d.ordonnee + d.pente * DUREE), class: "ref" }, o.g);
    ts.forEach((ti, i) => Plot.el("circle", { cx: o.x(ti), cy: o.y(ys[i]), r: 5, class: "dot" }, o.g));
    $("vr2").textContent = F.num(fit.r2, 6);
    $("vk").textContent = F.qty(F.sci(fit.k, 3), UNITES[teste]);
    $("vt12").textContent = fit.k > 0 ? F.qty(F.num(C.demiReaction(teste, fit.k, c[0]), 3), "s") : "—";
    $("vvrai").textContent = revele ? t("sim.vrai", { n: essai.n }) : "?";
    $("fvrai").textContent = revele ? t("sim.f.vrai", { k: F.qty(F.sci(essai.k, 3), UNITES[essai.n]), c0: F.qty(F.num(essai.c0, 3), "mol·L⁻¹") }) : t("sim.f.cache");
  }
  seg.onclick = e => { const b = e.target.closest("button"); if (b) { teste = +b.dataset.n; draw(); } };
  $("nouvelle").onclick = nouvelle;
  $("reveler").onclick = () => { revele = true; draw(); };
  nouvelle();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wilhelmy", 1850, "experiment"], ["harcourt", 1866, "experiment"], ["vanthoff", 1884, "idea"], ["daniels", 1921, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["medicament", "spectro"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["definition", "b"], ["demivie", "c"], ["ordre2", "a"], ["unite", "d"], ["degen", "b"], ["avancement", "c"], ["isotherme", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 521 });
})();
</script>
