<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Champs de guidage d'un accélérateur</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-magnetisme-induction" data-i18n="monde.magnetisme-induction"></a><span class="aux">›</span><a href="/racoon/etape?id=focalisation" data-i18n="etape.focalisation"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-em" href="/racoon/atlas?piste=em" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/mouvement-champ-uniforme" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>n</mi><mo>=</mo><mfrac><mrow><mi mathvariant="normal">d</mi><mi>B</mi><mo>/</mo><mi>B</mi></mrow><mrow><mi mathvariant="normal">d</mi><mi>r</mi><mo>/</mo><mi>r</mi></mrow></mfrac></math><span class="n">(29.2)</span></div>
    <p class="validite" data-i18n-html="val.29.2"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><mfrac><mrow><mo>∂</mo><msub><mi>B</mi><mi>x</mi></msub></mrow><mrow><mo>∂</mo><mi>z</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>∂</mo><msub><mi>B</mi><mi>z</mi></msub></mrow><mrow><mo>∂</mo><mi>x</mi></mrow></mfrac></math><span class="n">(29.3)</span></div>
    <p class="validite" data-i18n-html="val.29.3"></p>
    <p data-i18n-html="s2.p3"></p>
    <div class="eq"><math display="block"><msub><mi>ν</mi><mi>r</mi></msub><mo>=</mo><msqrt><mn>1</mn><mo>+</mo><mi>n</mi></msqrt><mo>,</mo><mspace width="1em"/><msub><mi>ν</mi><mi>z</mi></msub><mo>=</mo><msqrt><mo>−</mo><mi>n</mi></msqrt></math><span class="n">(29.3a)</span></div>
    <p class="validite" data-i18n-html="val.29.3a"></p>
    <figure>
      <svg class="fig" id="osc" viewBox="0 0 640 340" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.r"></span><span class="c-warn" data-i18n="fig.legend.z"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="cn" data-i18n="fig.n"></label><output id="cno" for="cn"></output></div>
            <input id="cn" type="range" min="-1.4" max="0.4" step="0.02" value="-0.6"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.nur"></span><span class="v" id="vr"></span><span class="f" id="vrm"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.nuz"></span><span class="v" id="vz"></span><span class="f" id="vzm"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.etat"></span><span class="v" id="vetat"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.usuel"></span><span class="v" id="vus"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <div class="box warn"><b data-i18n="s2.warn.title"></b>
      <p data-i18n-html="s2.warn.body"></p>
    </div>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p id="s3p1" data-i18n-html="s3.p1"></p>
    <p data-i18n-html="s3.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/guidage-accelerateur.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/physique-fondamentale.js"></script>
<script src="/racoon/lecons/champs-em.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/magnetisme-induction.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const $ = id => document.getElementById(id);
const M = MagInd, e = Constantes.e, mp = Constantes.m_p, C = Constantes.c;
const EC = 10e6 * e, B0 = 1, D0 = 1e-3, TOURS = 8;      // protons of 10 MeV in 1 T, started 1 mm out and 1 mm up

/* ---------- textes chiffrés ---------- */
(() => {
  const o = M.orbiteIndice({ q: e, m: mp, ec: EC, B0, n: -0.6, tours: 0.1, pas: 10 });
  $("sys").innerHTML = t("sys.body", { r0: F.si(o.r0, "m"), T: F.si(o.T, "s"), d: F.sci(D0 / o.r0, 1), rel: F.num(EC / (mp * C * C), 2) });
  const nz = M.nombresOnde(-0.6).nuZ, amp = R => F.si(R * 1e-3 / nz, "m");
  $("s3p1").innerHTML = t("s3.p1", { nz: F.num(nz, 3), a10: amp(10), a1000: amp(1000) });
})();

/* ---------- oscillations autour de l'orbite ---------- */
(() => {
  const svg = $("osc"), El = Plot.el, LIM = 4;
  const nu = (pts, k) => { const z = []; for (let i = 1; i < pts.length; i++) if (pts[i - 1][k] * pts[i][k] < 0) z.push(pts[i].tour);
    return z.length > 2 ? (z.length - 1) / 2 / (z[z.length - 1] - z[0]) : null; };
  function draw() {
    const n = +$("cn").value, th = M.nombresOnde(n);
    const o = M.orbiteIndice({ q: e, m: mp, ec: EC, B0, n, dr: D0, dz: D0, tours: TOURS, pas: 200 }).points;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { l: 56, r: 16, t: 12, b: 40 }, x: { domain: [0, TOURS], label: t("fig.tours") }, y: { domain: [-LIM, LIM], label: t("fig.ecart") } });
    El("line", { x1: x(0), x2: x(TOURS), y1: y(0), y2: y(0), class: "stroke thin c-label-2 dash" }, g);
    for (const [k, cls] of [["dr", "c-tint"], ["dz", "c-warn"]]) {
      const pts = []; for (const s of o) { const v = s[k] * 1000; if (Math.abs(v) > LIM) break; pts.push([x(s.tour), y(v)]); }
      El("path", { d: Plot.path(pts), class: "stroke " + cls }, g);
    }
    const lost = k => o.some(s => Math.abs(s[k]) * 1000 > LIM);
    $("cno").textContent = F.num(n, 2);
    $("vr").textContent = th.nuR == null ? t("fig.aucune") : F.num(th.nuR, 3);
    $("vz").textContent = th.nuZ == null ? t("fig.aucune") : F.num(th.nuZ, 3);
    const mr = nu(o, "dr"), mz = nu(o, "dz");
    $("vrm").textContent = mr == null ? "" : t("fig.mesure", { v: F.num(mr, 2) }); $("vzm").textContent = mz == null ? "" : t("fig.mesure", { v: F.num(mz, 2) });
    $("vetat").textContent = t(th.stable ? "fig.stable" : lost("dr") || lost("dz") ? "fig.perdue" : "fig.neutre");
    $("vus").textContent = F.num(th.usuel, 2);
  }
  $("cn").oninput = draw; draw();
})();
F.autoTypo(document.querySelector("main"));

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lawrence", 1931, "experiment"], ["thomas", 1938, "idea"], ["kerst", 1940, "experiment"], ["serber", 1941, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(x => x[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["protontherapie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["uniforme", "c"], ["radial", "a"], ["vertical", "d"], ["somme", "b"], ["signe", "c"], ["taille", "a"], ["indice", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 296 });
})();
</script>
</body>
</html>
