<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique;
const mm = v => F.si(v, "m", { prefix: "m", sig: 3 }), um = v => F.si(v, "m", { prefix: "µ", sig: 2 });

/* ---------- plan-convexe N-BK7, f′ = 100 mm à la raie d, diamètre 40 mm ; faisceau parallèle tracé exactement, aberration sphérique, (27.11a), (27.11b), (27.17d) ---------- */
(() => {
  const vue = $("vue"), zoom = $("zoom"), as = $("asl"), sens = $("sens"), lum = $("lum");
  const G = O.VERRES.crown, R = 0.1 * (G.nd - 1), FORME = O.formeLentille(R, Infinity, 0.02, 0.001), E = FORME.e;   // R = 51,7 mm, e = 5,0 mm
  const RAIES = [["C", "c-ko"], ["d", "c-ok"], ["F", "c-tint"]];
  const W = 640, H1 = 260, H2 = 260;
  const X1 = [-0.02, 0.13], Y1 = [-0.025, 0.025], x1 = Plot.linScale(X1[0], X1[1], 10, W - 10), y1 = Plot.linScale(Y1[0], Y1[1], H1 - 10, 10);
  vue.setAttribute("viewBox", "0 0 " + W + " " + H1); zoom.setAttribute("viewBox", "0 0 " + W + " " + H2);
  let mode = "bombe", lumi = "d";
  const lens = (n, bombe) => bombe ? O.lentille({ n, R1: R, R2: Infinity, e: E }) : O.lentille({ n, R1: Infinity, R2: -R, e: E });
  const line = (svg, sx, sy, pts, cls) => Plot.el("path", { d: Plot.path(pts.map(([a, b]) => [sx(a), sy(b)])), class: cls }, svg);
  function draw() {
    vue.innerHTML = ""; zoom.innerHTML = "";
    const a = +as.value / 1000, bombe = mode === "bombe", raies = lumi === "d" ? [RAIES[1]] : RAIES;
    const calc = raies.map(([k, cls]) => { const n = G["n" + k], L = lens(n, bombe); return { k, cls, n, ab: O.aberrationSpherique({ surfaces: L.surfaces(0), a, N: 21 }) }; });
    const d = calc.find(c => c.k === "d") || calc[0], D = d.ab;
    /* vue d'ensemble */
    line(vue, x1, y1, [[X1[0], 0], [X1[1], 0]], "stroke thin rim");
    const z1 = bombe ? FORME.z1 : (yy => 0), z2 = bombe ? (yy => 0) : (yy => -FORME.z1(yy));
    const contour = [];
    for (let k = -20; k <= 20; k++) { const yy = 0.02 * k / 20; contour.push([z1(yy), yy]); }
    for (let k = 20; k >= -20; k--) { const yy = 0.02 * k / 20; contour.push([E + z2(yy), yy]); }
    contour.push(contour[0]); line(vue, x1, y1, contour, "stroke c-label");
    line(vue, x1, y1, [[-0.012, a], [-0.012, 0.024]], "stroke bold c-label"); line(vue, x1, y1, [[-0.012, -a], [-0.012, -0.024]], "stroke bold c-label");
    calc.forEach(c => c.ab.rayons.forEach((r, i) => { if (i % 2) return;
      const k = (X1[1] - r.x) / r.dx; line(vue, x1, y1, r.points.concat([[r.x + k * r.dx, r.y + k * r.dy]]), "stroke thin " + c.cls); }));
    /* zoom autour du foyer : 7 mm sur l'axe, ±(tache au foyer paraxial) en hauteur */
    const xP = D.xP, span = Math.max(Math.abs(D.lsa) * 1.6, 0.3e-3) + (calc.length > 1 ? 2.4e-3 : 0);
    const X2 = [xP - span, xP + Math.max(0.15e-3, span * 0.25)], hy = Math.max(D.tache(xP) * 1.2, 4 * D.rayon, 5e-6) + (calc.length > 1 ? 0.25e-3 : 0);
    const x2 = Plot.linScale(X2[0], X2[1], 10, W - 10), y2 = Plot.linScale(-hy, hy, H2 - 20, 10);
    const clip = Plot.el("clipPath", { id: "cadre-z" }, Plot.el("defs", {}, zoom));
    Plot.el("rect", { x: 0, y: 0, width: W, height: H2 }, clip);
    const g = Plot.el("g", { "clip-path": "url(#cadre-z)" }, zoom);
    line(g, x2, y2, [[X2[0], 0], [X2[1], 0]], "stroke thin rim");
    calc.forEach(c => c.ab.rayons.forEach(r => {
      const ya = r.y + (X2[0] - r.x) * r.dy / r.dx, yb = r.y + (X2[1] - r.x) * r.dy / r.dx;
      line(g, x2, y2, [[X2[0], ya], [X2[1], yb]], "stroke thin " + c.cls);
    }));
    const vert = (xv, cls, key) => { line(g, x2, y2, [[xv, -hy], [xv, hy]], "stroke thin dash " + cls);
      Plot.el("text", { x: x2(xv) + 4, y: H2 - 6 }, g).textContent = t(key); };
    vert(xP, "c-label-2", "ab.z.paraxial"); vert(D.meilleur, "c-warn", "ab.z.meilleur");
    Plot.el("text", { x: 14, y: 22 }, g).textContent = t("ab.z.echelle", { x: mm(X2[1] - X2[0]), y: um(2 * hy) });
    /* lectures */
    const lam = O.RAIES.d, Nf = 0.1 / (2 * a), airyR = 1.2197 * lam * Nf;
    let wmax = 0; D.h.forEach(h => { wmax = Math.max(wmax, Math.abs(D.W(h, D.meilleur))); });
    const ch = O.chromatique(0.1, "crown");
    $("aread").textContent = t("ab.a.read", { a: mm(a), N: F.num(Nf, 2) });
    $("vlsa").textContent = mm(D.lsa); $("flsa").textContent = t("ab.f.lsa", { k: F.num(-D.lsa * 0.1 / (a * a), 3) });
    $("vt").textContent = um(D.rayon); $("ft").textContent = t(D.rayon > airyR ? "ab.f.tache.geo" : "ab.f.tache.diff", { r: um(airyR) });
    $("vw").textContent = t("ab.w.v", { w: F.num(wmax / lam, 2) });
    $("fw").textContent = t(wmax < lam / 4 ? "ab.f.w.rayleigh" : wmax < lam ? "ab.f.w.feynman" : "ab.f.w.non");
    $("vc").textContent = mm(ch.dFC);
    $("fc").textContent = t("ab.f.chrom", { nu: F.num(O.abbe("crown"), 3), r: um(Math.abs(ch.dFC) * a / 0.1 / 2) });
  }
  const segs = [[sens, v => { mode = v; }], [lum, v => { lumi = v; }]];
  segs.forEach(([el, set]) => el.querySelectorAll("button").forEach(b => b.onclick = () => {
    set(b.dataset.v); el.querySelectorAll("button").forEach(c => c.setAttribute("aria-pressed", String(c === b))); draw(); }));
  as.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1668, "experiment"], ["dollond", 1758, "use"], ["seidel", 1857, "idea"], ["hubble", 1990, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["doublet", "diaphragme"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["bord", "b"], ["h2", "d"], ["sens", "a"], ["diaphragme", "c"], ["bleu", "b"], ["achromat", "d"], ["critere", "a"], ["hubble", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 276 });
})();
</script>
