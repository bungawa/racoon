<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const cplx = (z, u, sig = 3) => { const m = Cx.abs(z), n = v => F.num(Math.abs(v), sig), s = v => v < 0 ? F.MINUS : "", r = Math.abs(z.re) > 1e-9 * m, i = Math.abs(z.im) > 1e-9 * m;
  return (r && i ? Cx.text(z, v => F.num(v, sig)) : i ? s(z.im) + n(z.im) + " i" : s(z.re) + n(z.re)) + " " + u; };

/* ---------- (22.20) et (22.21) contre la résolution nœud par nœud ---------- */
(() => {
  const w = 2 * Math.PI * 1e3, o = { z1: Cx.c(100), z2: Cx.c(0, w * 15e-3), z3: Cx.c(0, -1 / (w * 2.2e-6)), e1: Cx.c(5), e2: Cx.polar(10, Math.PI / 3) };
  const d = M.deuxGenerateurs(o), D = Cx.add(Cx.mul(o.z1, Cx.add(o.z2, o.z3)), Cx.mul(o.z2, o.z3));
  const I1 = Cx.div(Cx.sub(Cx.mul(o.z2, o.e2), Cx.mul(Cx.add(o.z2, o.z3), o.e1)), D), I2 = Cx.div(Cx.add(Cx.mul(o.z1, o.e2), Cx.mul(o.z3, o.e1)), D);
  const ecart = Math.max(Cx.abs(Cx.sub(I1, d.I1)) / Cx.abs(I1), Cx.abs(Cx.sub(I2, d.I2)) / Cx.abs(I2));
  $("verif").innerHTML = t("verif.body", { z2: cplx(o.z2, "Ω", 4), z3: cplx(o.z3, "Ω", 4), i1: cplx(I1, "A", 4), i2: cplx(I2, "A", 4), ecart: F.sci(Math.max(ecart, 1e-16), 1),
    noeuds: F.sci(Math.max(d.solution.residuNoeuds, 1e-18), 1) });
})();

/* ---------- le pont de Maxwell–Wien : équilibrer une bobine inconnue ---------- */
(() => {
  const RX = 12, LX = 47e-3, R2 = 100, R3 = 100, E = 1, ZS = 50, ZG = 1e3;
  keyed($("bras"), t("bras.tag"), ["a", "b", "c", "d", "g"], textOf("bras.items", ["a", "b", "c", "d", "g"]));
  const seg = $("freq"), lr1 = $("lr1"), lc1 = $("lc1"), XS = Array.from({ length: 801 }, (_, i) => 2 * i / 800);
  let f = 1000;
  const pontA = (R1, C1) => { const w = 2 * Math.PI * f, mw = M.maxwellWien(R1, C1, R2, R3, w);
    return Object.assign(M.pont({ za: mw.za, zb: mw.zb, zc: mw.zc, zd: Cx.c(RX, w * LX), zg: ZG, e: E, zs: ZS }), { Rx: mw.Rx, Lx: mw.Lx }); };
  function draw() {
    const R1 = 10 ** +lr1.value, C1 = 10 ** +lc1.value, p = pontA(R1, C1);
    const svg = $("trace"); svg.innerHTML = "";
    /* both knobs on one axis: the position of each slider, in decades from its bottom (R1 from 100 Ω, C1 from 0,1 μF) */
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 60, b: 44 }, x: { domain: [0, 2], label: t("fig.xaxis") }, y: { scale: "log", domain: [1e-12, 1e-3], label: t("fig.yaxis") } });
    const cl = v => Math.min(1e-3, Math.max(1e-12, v)), xr = +lr1.value - 2, xc = +lc1.value + 7;
    Plot.el("path", { d: Plot.path(XS.map(x => [P.x(x), P.y(cl(Cx.abs(pontA(10 ** (2 + x), C1).Ig)))])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(XS.map(x => [P.x(x), P.y(cl(Cx.abs(pontA(R1, 10 ** (x - 7)).Ig)))])), class: "stroke c-warn" }, P.g);
    Plot.el("circle", { cx: P.x(xr), cy: P.y(cl(Cx.abs(p.Ig))), r: 5, class: "dot" }, P.g);
    Plot.el("circle", { cx: P.x(xc), cy: P.y(cl(Cx.abs(p.Ig))), r: 5, class: "fill c-warn" }, P.g);
    $("lr1v").textContent = F.si(R1, "Ω");
    $("lc1v").textContent = F.si(C1, "F");
    $("vig").textContent = F.si(Cx.abs(p.Ig), "A");
    $("fig").textContent = t(p.desequilibre < 1e-3 ? "fig.f.equilibre" : "fig.f.desequilibre", { d: F.qty(F.num(100 * p.desequilibre, 2), "%") });
    $("vm").textContent = F.si(p.Rx, "Ω");
    $("fm").textContent = t("fig.f.mesure", { l: F.si(p.Lx, "H") });
    const n = M.compter(p.reseau);
    $("vq").textContent = String(n.loisNoeuds + n.loisMailles);
    $("fq").textContent = t("fig.f.equations", { n: n.n, b: n.b, kn: n.loisNoeuds, km: n.loisMailles });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.f === f)));
  }
  seg.querySelectorAll("button").forEach(x => { x.textContent = F.si(+x.dataset.f, "Hz"); x.onclick = () => { f = +x.dataset.f; draw(); }; });
  lr1.oninput = lc1.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wheatstone", 1843, "experiment"], ["kirchhoff", 1845, "idea"], ["spice", 1973, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["simulateur", "jauge"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["maille", "b"], ["noeud", "c"], ["compte", "a"], ["trop", "d"], ["pont", "b"], ["frequence", "c"], ["haute", "a"], ["sensible", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 223 });
})();
