<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, Cst = Constantes, c = Cst.c, qe = Cst.e, me = Cst.m_e;
const r0 = qe * qe / (4 * Math.PI * Cst.eps0 * me * c * c);

/* ---------- le système décrit : la sphère qui donne toute la masse de l'électron ---------- */
(() => {
  const a = 2 * r0 / 3, P = M.contraintesPoincare(qe, a);
  $("sys1").innerHTML = t("sys1.body", { a: F.si(a, "m", { prefix: "f" }), p: F.qty(F.sci(P.pression, 2), "Pa"), f: F.si(P.forceHemisphere, "N", { sig: 2 }),
    r: F.num(P.rapport, 3), mi: F.qty(F.sci(P.mImpulsion, 3), "kg"), me: F.qty(F.sci(P.mEnergie, 3), "kg") });
})();

/* ---------- l'haltère : la force d'une moitié sur l'autre, calculée sans approximation ---------- */
(() => {
  const trace = $("trace"), sd = $("sd"), sw = $("sw"), BETA = 1e-3;          // peak speed 0,001 c: the motion stays linear
  function draw() {
    const d = 1e-15 * 10 ** +sd.value, kd = +sw.value / 100, w = kd * c / d, A = BETA * c / w;
    const P = M.periodeHaltere({ q: qe, d, A, w, n: 96 }), mvt = M.mouvementSinusoidal(A, w), unit = P.masse * w * w * A;
    const ex = P.points.map(p => [p.t / P.T, -p.F / unit]);
    const se = P.points.map(p => [p.t / P.T, -M.serieForcePropre({ q: qe, d, mvt, t: p.t }).total / unit]);
    const ma = P.points.map(p => [p.t / P.T, P.masse * p.a / unit]);
    [ex, se, ma].forEach(s => s.push([1, s[0][1]]));
    const ecart = Math.max(...ex.map((p, i) => Math.abs(p[1] - se[i][1])));
    const ymax = 1.15 * Math.max(1, ...ex.map(p => Math.abs(p[1])));
    trace.innerHTML = "";
    const G = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, 1], label: t("fig.xaxis") }, y: { domain: [-ymax, ymax], label: t("fig.yaxis") } });
    Plot.el("line", { x1: G.x(0), x2: G.x(1), y1: G.y(0), y2: G.y(0), class: "zero" }, G.g);
    Plot.el("path", { d: Plot.path(ma.map(([x, y]) => [G.x(x), G.y(y)])), class: "stroke thin dash c-label-2" }, G.g);
    Plot.el("path", { d: Plot.path(se.map(([x, y]) => [G.x(x), G.y(y)])), class: "stroke thin c-warn" }, G.g);
    Plot.el("path", { d: Plot.path(ex.map(([x, y]) => [G.x(x), G.y(y)])), class: "curve" }, G.g);
    $("sdr").textContent = F.si(d, "m", { prefix: "f", sig: 2 });
    $("swr").textContent = F.num(kd, 2);
    $("vm").textContent = F.qty(F.sci(P.masse, 2), "kg");
    $("fm").textContent = t("fig.f.masse", { r: F.num(P.masse / me, 2) });
    $("vr").textContent = F.num(4 * kd / 3, 2);
    $("fr").textContent = t("fig.f.reaction");
    $("ve").textContent = F.qty(F.num(100 * ecart, 2), "%");
    $("fe").textContent = t("fig.f.ecart", { r: F.num(100 * Math.abs(P.mEff / P.masse - 1), 2) });
  }
  sd.oninput = sw.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["thomson", 1881, "idea"], ["abraham", 1902, "idea"], ["lorentz", 1904, "idea"], ["poincare", 1905, "idea"], ["fermi", 1922, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["thomson"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["quatretiers", "c"], ["explose", "a"], ["uniforme", "d"], ["retard", "b"], ["pointe", "a"], ["reaction", "c"], ["haltere", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 284 });
})();
</script>
