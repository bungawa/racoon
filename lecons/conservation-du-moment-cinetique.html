      <div class="panel">

          <div class="ctl"><div class="row"><label for="pm" data-i18n="pa.m"></label><output id="pmv" for="pm"></output></div><input id="pm" type="range" min="1" max="5" step="0.5" value="3"></div>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);

/* ---------- la patineuse : I ω constant, énergie qui change ---------- */
(() => {
  const I0 = 1, R0 = 0.8, W0 = 2 * Math.PI, RALENTI = 4;            // corps 1 kg·m², bras tendus à 0,8 m, un tour par seconde
  const svg = $("pat"), C = [200, 150], K = 160;
  let theta = 0, w = W0, last = null;
  function draw() {
    const r = +$("pr").value, m = +$("pm").value;
    svg.innerHTML = "";
    P("circle", { cx: C[0], cy: C[1], r: 0.25 * K, class: "stroke c-label-2" }, svg);
    P("circle", { cx: C[0], cy: C[1], r: R0 * K, class: "stroke thin dash c-label-2" }, svg);
    const c = Math.cos(theta), s = Math.sin(theta);
    P("line", { x1: C[0] - r * K * c, y1: C[1] + r * K * s, x2: C[0] + r * K * c, y2: C[1] - r * K * s, class: "stroke bold c-label-2" }, svg);
    [1, -1].forEach(k => P("circle", { cx: C[0] + k * r * K * c, cy: C[1] - k * r * K * s, r: 4 + 3 * Math.sqrt(m), class: "fill c-tint" }, svg));
    P("circle", { cx: C[0] + 0.25 * K * s, cy: C[1] + 0.25 * K * c, r: 3, class: "fill c-label-2" }, svg);       // a mark on the body
    P("circle", { cx: C[0], cy: C[1], r: 4, class: "fill c-warn" }, svg);
  }
  function upd() {
    const r = +$("pr").value, m = +$("pm").value;
    $("prv").textContent = F.qty(F.num(r, 2), "m"); $("pmv").textContent = F.qty(F.num(m, 2), "kg");
    const I1 = RotPlane.patineuse({ I0, m, r: R0 }), I = RotPlane.patineuse({ I0, m, r }), L = I1 * W0;
    w = L / I;
    const ec0 = L * L / (2 * I1), ec = L * L / (2 * I);
    $("vi").textContent = F.qty(F.num(I, 3), "kg·m²");
    $("vw").textContent = F.qty(F.num(w, 3), "rad·s⁻¹"); $("fw").textContent = t("pa.f.w", { T: F.qty(F.num(2 * Math.PI / w, 3), "s"), x: F.num(w / W0, 3) });
    $("vec").textContent = F.qty(F.num(ec, 3), "J"); $("fec").textContent = t("pa.f.ec", { x: F.num(ec / ec0, 3) });
    const sim = RotPlane.tirerBras({ I0, m, r0: R0, r1: r, w0: W0, duree: 0.5 }, 400);
    $("vtr").textContent = Math.abs(sim.travail) < 1e-9 ? t("pa.nul") : F.qty(F.num(sim.travail, 4), "J");
    $("ftr").textContent = t("pa.f.tr", { x: F.qty(F.num(ec - ec0, 4), "J"), l: F.sci(Math.max(sim.ecartL, 1e-16), 1) });
    /* L, ω and Ec against r, relative to the arms-out values */
    const rp = $("rplot"); rp.innerHTML = "";
    const rs = Array.from({ length: 66 }, (_, i) => 0.15 + i * 0.01), ratio = rr => I1 / RotPlane.patineuse({ I0, m, r: rr });
    const hi = Math.ceil(ratio(0.15) + 0.5);
    const { x: X, y: Y, g } = Plot.axes(rp, { fmt: F, w: 640, h: 260, pad: { b: 44 }, x: { domain: [0.15, 0.8], label: t("rp.x") }, y: { domain: [0, hi], label: t("rp.y") } });
    const line = (f, cls) => P("path", { d: rs.map((x, i) => (i ? "L" : "M") + X(x).toFixed(1) + " " + Y(f(x)).toFixed(1)).join(""), class: cls }, g);
    line(() => 1, "ref"); line(ratio, "curve"); line(rr => 1 / ratio(rr), "stroke dash c-label-2");
    P("circle", { cx: X(r), cy: Y(ratio(r)), r: 5, class: "dot" }, g);
    draw();
  }
  function tick(now) {
    if (last !== null) theta += w * Math.min(now - last, 100) / 1000 / RALENTI;
    last = now; draw(); requestAnimationFrame(tick);
  }
  $("pr").oninput = $("pm").oninput = upd; upd(); requestAnimationFrame(tick);
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["frottement", "bras", "axe"], items = textOf("sys.items", IDS);
  const Lb = 0.6, rb = 0.2 + Lb / 2;                                    // un bras de 0,6 m, attaché à 0,2 m de l'axe
  const v = { perte: F.num(100 * 0.5 / 10, 2), bras: F.num(100 * (Lb * Lb / 12) / (rb * rb), 2) };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["marey", 1894, "experiment"], ["noether", 1918, "idea"], ["kane", 1969, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["plongeon", "pulsar"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["iomega", "a"], ["energie", "a"], ["source", "a"], ["tabouret", "a"], ["alpha", "a"], ["distance", "a"], ["chat", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1804 });
})();
</script>
