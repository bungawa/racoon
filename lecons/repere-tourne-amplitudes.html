<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- two z rotations φ1 then φ2, each matrix given a phase of its own choosing; the product against the direct rotation ---------- */
(() => {
  const ids = ["sf1", "sf2", "sd1", "sd2"], deg = id => +$(id).value * Math.PI / 180;
  const phase = (R, d) => R.map(l => l.map(z => Cx.mul(z, Cx.polar(1, d))));
  const ang = z => F.num(Cx.arg(z) * 180 / Math.PI + 0, 3) + "\u00a0°";
  function etat() {
    const f1 = deg("sf1"), f2 = deg("sf2"), RTS = phase(Q.demiZ(f1), deg("sd1")), RUT = phase(Q.demiZ(f2), deg("sd2"));
    const P = Q.produitMatrices(RUT, RTS), D = Q.demiZ(f1 + f2), S = Q.produitMatrices(Q.standardiser(RUT), Q.standardiser(RTS));
    return { P, D, S, dTS: Q.det2(RTS), dUT: Q.det2(RUT), e: Cx.div(P[0][0], D[0][0]), s: Cx.div(S[0][0], D[0][0]) };
  }
  function draw() {
    const r = etat(), svg = $("phases"); svg.innerHTML = "";
    [[r.e, 110, "fig.lab.brut"], [r.s, 320, "fig.lab.std"], [r.dTS, 530, "fig.lab.det"]].forEach(([z, cx0, k]) => {
      const cy0 = 90, R = 60;
      Plot.el("circle", { cx: cx0, cy: cy0, r: R, class: "stroke thin c-label-2", fill: "none" }, svg);
      Plot.el("line", { x1: cx0, x2: cx0 + R, y1: cy0, y2: cy0, class: "stroke thin dash c-label-2" }, svg);
      Plot.fleche(svg, [cx0, cy0], [cx0 + R * z.re / Cx.abs(z), cy0 - R * z.im / Cx.abs(z)], { cls: "c-tint", tete: 8, trait: "stroke bold" });
      Plot.el("text", { x: cx0, y: cy0 + R + 22, "text-anchor": "middle" }, svg).textContent = t(k);
    });
    ids.forEach(id => { $(id + "r").textContent = F.num(+$(id).value, 3) + "\u00a0°"; });
    $("vbrut").textContent = ang(r.e); $("fbrut").textContent = t("fig.f.brut", { d: F.num(+$("sd1").value + +$("sd2").value, 3) });
    $("vdet").textContent = ang(r.dTS) + " ; " + ang(r.dUT);
    $("vstd").textContent = F.num(r.s.re + 0, 3); $("fstd").textContent = t("fig.f.std");
  }
  ids.forEach(id => { $(id).oninput = draw; }); draw();
  const R2 = Q.produitMatrices(Q.demiZ(Math.PI), Q.demiZ(Math.PI));
  $("sys1").innerHTML = t("sys1.body", { a: F.num(R2[0][0].re + 0, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rodrigues", 1840, "idea"], ["hamilton", 1844, "idea"], ["pauli", 1927, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["quaternions"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["compose", "c"], ["phase", "a"], ["det", "d"], ["signe", "b"], ["ordre", "a"], ["pourquoi", "c"], ["unitaire", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 602 });
})();
</script>
