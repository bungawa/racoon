<!doctype html>
<html lang="fr">

<title>Le chlore en solution aqueuse</title>

<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-solutions" data-i18n="monde.chim-solutions"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-industrie-minerale" data-i18n="etape.chim-industrie-minerale"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n-html="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>

    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>

    <p data-i18n-html="s1.p1"></p>
    <div class="list keyed" id="especes"></div>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq" data-i18n-html="eq.dismutation"></div>
    <p class="validite" data-i18n-html="val.dismutation"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq" data-i18n-html="eq.basique"></div>
    <p class="validite" data-i18n-html="val.basique"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq" data-i18n-html="eq.frontiere"></div>
    <p class="validite" data-i18n-html="val.frontiere"></p>
    <figure class="chart">
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="conc" data-i18n="fig.c"></label><output id="concv" for="conc"></output></div>
            <input id="conc" type="range" min="-4" max="0" step="0.1" value="-1"></div>
          <div class="ctl"><div class="row"><label for="ph" data-i18n="fig.pH"></label><output id="phv" for="ph"></output></div>
            <input id="ph" type="range" min="0" max="14" step="0.1" value="3"></div>
        </div>
      </div>
      <svg class="fig" id="diag" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.leg.front"></span><span class="c-label" data-i18n="fig.leg.eau"></span><span class="c-warn" data-i18n="fig.leg.ph"></span></div>
      <div class="stats">
        <div class="stat"><span class="k" data-i18n="fig.k.dism"></span><span class="v" id="vd"></span><span class="f" data-i18n="fig.f.dism"></span></div>
        <div class="stat"><span class="k" data-i18n="fig.k.hclo"></span><span class="v" id="vh"></span><span class="f" data-i18n="fig.f.hclo"></span></div>
        <div class="stat"><span class="k" data-i18n="fig.k.p"></span><span class="v" id="vp"></span><span class="f" id="fp"></span></div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <p data-i18n-html="s3.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="eq" data-i18n-html="eq.acide"></div>
    <p class="validite" data-i18n-html="val.acide"></p>
    <p data-i18n-html="s4.p2"></p>
    <div class="box rem"><b data-i18n="s4.rem.title"></b>
      <p data-i18n-html="s4.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n-html="hist.intro"></p>

    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>

  <p class="foot" data-i18n-html="foot"></p>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/chlore-en-solution.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/chim-solutions.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions, H = C.Industrie;
const keyed = (id, k, ids) => { const txt = textOf(k, ids); $(id).innerHTML = ids.map(i => `<div><span class="k">${txt[i].k}</span><span>${txt[i].v}</span></div>`).join(""); };
keyed("especes", "s1.especes", ["cl", "cl2", "hclo", "clo"]);

/* ---------- §3 : diagramme potentiel-pH du chlore ---------- */
(() => {
  const PH = [0, 14], EV = [0, 2], svg = $("diag");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 400, pad: { b: 44 },
    x: { domain: PH, label: t("fig.ax.x"), ticks: 7 }, y: { domain: EV, label: t("fig.ax.y"), fmt: v => F.fix(v, 1) } });
  /* the line O₂/H₂O, fixed: the line H⁺/H₂ is below the frame */
  Plot.el("path", { d: Plot.path(PH.map(pH => [x(pH), y(C.eau(pH).O2)])), class: "stroke dash c-label" }, g);
  Plot.el("text", { x: x(11.5), y: y(C.eau(11.5).O2) - 8, class: "note" }, g).textContent = t("fig.o2");
  const layer = Plot.el("g", {}, g), mark = Plot.el("line", { y1: y(EV[0]), y2: y(EV[1]), class: "stroke c-warn" }, g);
  const pa = p => p >= 1e3 ? F.si(p, "Pa") : F.qty(F.sci(p, 2), "Pa");
  function draw() {
    const c = Math.pow(10, +$("conc").value), pH = +$("ph").value, d = H.diagrammeChlore(c, { pH: PH, E: EV });
    $("concv").textContent = F.qty(c < 0.01 ? F.sci(c, 2) : F.num(c, 2), "mol·L⁻¹");
    $("phv").textContent = F.fix(pH, 1);
    layer.textContent = "";
    for (const e of d.especes) {
      if (!e.poly.length) continue;
      const pts = e.poly.map(([a, b]) => [x(a), y(b)]);
      if (e.phase === "gaz") Plot.el("path", { d: Plot.path(pts) + "Z", class: "area" }, layer);
      const cx = pts.reduce((s, q) => s + q[0], 0) / pts.length, cy = pts.reduce((s, q) => s + q[1], 0) / pts.length;
      Plot.el("text", { x: cx, y: cy + (e.s === "Cl^-" ? 40 : e.phase === "gaz" ? -2 : 4), "text-anchor": "middle", class: "note" }, layer).textContent = t(e.phase === "gaz" ? "fig.gaz" : "fig.label", { s: C.texte(e.s) });
    }
    for (const f of d.frontieres) Plot.el("path", { d: Plot.path(f.seg.map(([a, b]) => [x(a), y(b)])), class: "stroke bold c-tint" }, layer);
    mark.setAttribute("x1", x(pH)); mark.setAttribute("x2", x(pH));
    const pd = H.pHDismutation(c);
    $("vd").textContent = pd > 0 ? t("fig.v.dism", { pH: F.fix(pd, 2) }) : t("fig.v.aucun");
    $("vh").textContent = F.qty(F.fix(100 * C.fractions([H.CHLORE.pKa], pH)[0], 1), "%");
    const p = H.pDichlore(pH, c, c);
    $("vp").textContent = pa(p);
    $("fp").textContent = t(p > C.P0 ? "fig.f.degage" : p > 1 ? "fig.f.odeur" : "fig.f.rien");
  }
  $("conc").oninput = $("ph").oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["javel", 1785, "use"], ["labarraque", 1825, "use"], ["balard", 1834, "experiment"], ["maidstone", 1897, "use"], ["jersey", 1908, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["javel", "eau", "melange"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dismutation", "b"], ["basique", "d"], ["domaine", "a"], ["dilution", "c"], ["acide", "b"], ["hclo", "a"], ["eau", "d"], ["actif", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1834 });
})();
</script>
</body>
</html>
