<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, M = Minkowski, C = R.c;
const m = v => F.qty(F.num(Math.abs(v) < 1e-9 ? 0 : v, 3), "m"), m2 = v => F.qty(F.num(v, 3), "m²");

/* ---------- le même événement vu par un autre observateur : Lorentz ou rotation ---------- */
(() => {
  const svg = $("diag"), sb = $("sb"), seg = $("mode"), E = [4, 6];              // the fork: x = 4 m, ct = 6 m
  let mode = "lorentz";
  /* Fig. 17-1: at rest, uniform, slowing down; the fork at E */
  const repos = [[-6, -10], [-6, 10]], uniforme = [[0, -10], E];
  const freine = Array.from({ length: 81 }, (_, i) => { const ct = -10 + i * 0.25; return [-9 + 4 * (1 - Math.exp(-(ct + 10) / 5)), ct]; });
  const fils = [[E, [7, 10]], [E, [2, 10]]];
  function draw() {
    const b = +sb.value / 100, th = Math.atan(b);
    const c = M.cadre(svg, { W: 420, H: 420, x0: -10, x1: 10, t0: -10, t1: 10, pad: 10 });
    M.fond(c, { x: t("fig.ax.x"), t: t("fig.ax.ct"), pas: 2 });
    const lignes = c.layer("c-label");
    for (const l of [repos, uniforme, freine, ...fils]) M.chemin(c, l, "stroke bold", lignes);
    /* the other observer's axes: Lorentz closes them on the light line, a rotation turns them together */
    const g = c.layer("c-tint");
    if (mode === "lorentz") M.repere(c, b, { x: t("fig.ax.xp"), t: t("fig.ax.ctp"), pas: 2 });
    else {
      const s = Math.sin(th), co = Math.cos(th);
      M.droite(c, [0, 0], [co, -s], "stroke", g); M.droite(c, [0, 0], [s, co], "stroke", g);
      for (const [d, lab] of [[[co, -s], "fig.ax.xp"], [[s, co], "fig.ax.ctp"]]) {
        const end = M.couper(c.box, [0, 0], d)[1];
        Plot.el("text", { x: c.sx(end[0]) - 6, y: c.sy(end[1]) + 14, "text-anchor": "end", class: "fill" }, g).textContent = t(lab);
      }
      for (let k = -6; k <= 6; k++) if (k) for (const p of [[2 * k * co, -2 * k * s], [2 * k * s, 2 * k * co]])
        if (Math.abs(p[0]) <= 10 && Math.abs(p[1]) <= 10) Plot.el("circle", { cx: c.sx(p[0]), cy: c.sy(p[1]), r: 2.5, class: "fill" }, g);
    }
    M.point(c, E, 5, "c-ok", t("fig.ax.e"));
    /* E read by the other observer */
    const ev = { t: E[1] / C, x: E[0] };
    const p = mode === "lorentz" ? R.lorentz(ev, b * C) : (q => ({ x: q.x, t: q.y / C }))(R.rotation({ x: E[0], y: E[1] }, -th));
    const xp = p.x, ctp = C * p.t;
    /* light x = ct, read in the new axes */
    const lum = mode === "lorentz" ? 1 : (Math.cos(th) - Math.sin(th)) / (Math.cos(th) + Math.sin(th));
    $("sbr").textContent = mode === "lorentz" ? t("fig.beta.v", { b: F.num(b, 2) }) : t("fig.theta.v", { b: F.num(b, 2), th: F.qty(F.num(th * 180 / Math.PI, 3), "°") });
    $("ve").textContent = t("fig.e.v", { x: m(xp), ct: m(ctp) });
    $("fe").textContent = t("fig.e.f", { x: m(E[0]), ct: m(E[1]) });
    $("veu").textContent = m2(xp * xp + ctp * ctp);
    $("feu").textContent = t("fig.f.r", { v: m2(E[0] ** 2 + E[1] ** 2) });
    $("vmi").textContent = m2(ctp * ctp - xp * xp);
    $("fmi").textContent = t("fig.f.r", { v: m2(E[1] ** 2 - E[0] ** 2) });
    $("vc").textContent = t("fig.c.v", { r: F.num(lum, 3) });
    $("fc").textContent = t(mode === "lorentz" ? "fig.c.lorentz" : "fig.c.rotation", { v: F.si(lum * C, "m·s⁻¹") });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; draw(); });
  sb.oninput = draw; draw();
})();

/* ---------- le système décrit : un train à 300 km/h, un événement à 1 km devant ---------- */
(() => {
  const u = 300 / 3.6, L = 1000, g = R.gamma(u);
  $("sys1").innerHTML = t("sys1.body", { u: F.si(u, "m·s⁻¹"), L: F.si(L, "m"), dt: F.qty(F.sci(g * u * L / (C * C), 2), "s"), b2: F.sci((u / C) ** 2, 2), dx: F.qty(F.sci((u / C) ** 2 / 2 * L, 2), "m") });   // γ − 1 ≈ (u/c)²/2: no cancellation
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["marey", 1885, "use"], ["poincare", 1906, "idea"], ["minkowski", 1908, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["graphique"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["evenement", "b"], ["ligne", "d"], ["melange", "a"], ["rotation", "c"], ["lumiere", "b"], ["train", "a"], ["fourche", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1701 });
})();
</script>
