<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9;
const pct = e => (e < 1e-4 ? F.sci(e, 1) : F.qty(F.num(100 * e, 2), "%"));

/* ---------- le système décrit : la sphère d'un générateur de Van de Graaff, 20 cm de rayon, dans l'air ---------- */
(() => {
  const R = 0.2, Ec = 3e6, d = 2, Q = 4 * Math.PI * ES.EPS0 * R * R * Ec;
  $("sys").innerHTML = t("sys.body", { q: F.si(Q, "C", { prefix: "µ" }), phi: F.si(Ec * R, "V", { prefix: "k" }), err: pct((R / (2 * d)) ** 2) });
})();

/* ---------- E(r) d'une boule de 1 nC et 5 cm : loi de Gauss, charge ponctuelle, et somme de Coulomb sur 2n³ charges ---------- */
(() => {
  const svg = $("sph"), nsl = $("nsl"), Q = NC, R = 0.05, U = ES.BOULES.uniforme(Q, R), P = ES.BOULES.parabolique(Q, R);
  const ER = ES.K * Q / (R * R), YMAX = 1.4, DIR = AnaVec.unitaire([0.6, 0.48, 0.64]);
  const RS = [1.1, 1.25, 1.4, 1.6, 1.8, 2, 2.25, 2.5, 2.75, 3];
  const radial = (charges, u) => { const p = DIR.map(x => x * u * R), e = ES.champ(charges, p); return AnaVec.scalaire(e, DIR) / ER; };
  const gauss = (B, u) => ES.K * B.charge(u * R) / (u * R) ** 2 / ER;
  function draw() {
    const n = +nsl.value, pts = ES.bouleDiscrete(Q, R, n);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44 }, x: { domain: [0, 3], label: t("sp.x"), fmt: v => F.num(v, 1) }, y: { domain: [0, YMAX], label: t("sp.y"), fmt: v => F.num(v, 1) } });
    const us = Array.from({ length: 241 }, (_, i) => 0.0125 * (i + 1e-6));
    const curve = (f, cls, k) => Plot.el("path", { d: Plot.path(us.filter(u => f(u) <= YMAX).map(u => [x(u), y(f(u))])), class: k }, Plot.el("g", { class: cls }, g));
    curve(u => 1 / (u * u), "c-label-2", "stroke dash");
    curve(u => gauss(U, u), "c-tint", "stroke");
    curve(u => gauss(P, u), "c-ok", "stroke");
    Plot.el("line", { x1: x(1), x2: x(1), y1: y(0), y2: y(YMAX), class: "stroke thin dash c-label-2" }, g);
    const gw = Plot.el("g", { class: "c-warn" }, g);
    let gout = 0;
    RS.forEach(u => {
      const v = radial(pts, u);
      gout = Math.max(gout, Math.abs(v / gauss(U, u) - 1));
      Plot.el("circle", { cx: x(u), cy: y(Math.min(YMAX, v)), r: 4.5, class: "fill" }, gw);
    });
    $("nread").textContent = String(n);
    $("vnb").textContent = F.num(pts.length, 0);
    $("vdehors").textContent = pct(gout);
    $("vsurf").textContent = F.si(ER, "V·m⁻¹");
  }
  nsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1687, "idea"], ["cavendish", 1773, "experiment"], ["vandegraaff", 1931, "experiment"], ["hofstadter", 1961, "experiment"], ["pohl", 2010, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["generateur", "proton"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dehors", "a"], ["dedans", "c"], ["moitie", "b"], ["symetrie", "d"], ["coquille", "a"], ["generateur", "c"], ["profil", "d"], ["terre", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 47 });
})();
</script>
