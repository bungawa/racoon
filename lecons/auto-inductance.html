    <div class="eq"><math display="block"><mi>L</mi><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>+</mo><mi>R</mi><mi>i</mi><mo>=</mo><mi>U</mi><mspace width="1em"/><mo>⇒</mo><mspace width="1em"/><mi>i</mi><mo>(</mo><mi>t</mi><mo>)</mo><mo>=</mo><mfrac><mi>U</mi><mi>R</mi></mfrac><mo>(</mo><mn>1</mn><mo>−</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi><mo>/</mo><mi>τ</mi></mrow></msup><mo>)</mo><mo>,</mo><mspace width="1em"/><mi>τ</mi><mo>=</mo><mfrac><mi>L</mi><mi>R</mi></mfrac></math></div>

    <figure class="chart">
      <svg class="fig" id="rl" role="img" data-i18n-attr="aria-label:rl.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="rl.legend.i"></span><span class="c-warn" data-i18n="rl.legend.e"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="sl" data-i18n="rl.l"></label><output id="slr" for="sl"></output></div>
            <input id="sl" type="range" min="-2" max="1" step="0.01" value="0.3"></div>
          <div class="ctl"><div class="row"><label for="srs" data-i18n="rl.r"></label><output id="srsr" for="srs"></output></div>
            <input id="srs" type="range" min="0" max="2" step="0.01" value="1"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="rl.k.tau"></span><span class="v" id="vtau"></span><span class="f" id="ftau"></span></div>
          <div class="stat"><span class="k" data-i18n-html="rl.k.w"></span><span class="v" id="vw"></span><span class="f" id="fw"></span></div>
          <div class="stat"><span class="k" data-i18n-html="rl.k.j"></span><span class="v" id="vj"></span><span class="f" id="fj"></span></div>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd;

/* ---------- l'analogie, terme à terme ---------- */
(() => {
  const ROWS = ["tension", "courant", "inductance", "charge", "flux", "energie", "resistance"], rows = textOf("ana.rows", ROWS);
  $("analogie").innerHTML = ROWS.map(id => `<div><span class="k">${rows[id].elec}</span><span>${rows[id].meca}</span></div>`).join("");
})();

/* ---------- établir un courant : courant, énergie stockée, chaleur ---------- */
(() => {
  const U = 12, svg = $("rl"), sl = $("sl"), sr = $("srs");
  function draw() {
    const L = Math.pow(10, +sl.value), R = Math.pow(10, +sr.value), c = M.circuitRL({ U, R, L }), T = 5 * c.tau, w = c.stockee(1e3 * c.tau);
    const ts = Array.from({ length: 201 }, (_, k) => k * T / 200);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 60, b: 44 }, x: { domain: [0, 5], label: t("rl.xaxis") }, y: { domain: [0, 1.05], label: t("rl.yaxis") } });
    Plot.el("path", { d: Plot.path(ts.map(s => [P.x(s / c.tau), P.y(c.i(s) / c.iInf)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(ts.map(s => [P.x(s / c.tau), P.y(c.stockee(s) / w)])), class: "ref" }, P.g);
    $("slr").textContent = F.si(L, "H");
    $("srsr").textContent = F.si(R, "Ω");
    $("vtau").textContent = F.si(c.tau, "s");
    $("ftau").textContent = t("rl.f.tau", { i: F.si(c.iInf, "A"), t: F.si(Math.log(100) * c.tau, "s") });
    $("vw").textContent = F.si(w, "J");
    $("fw").textContent = t("rl.f.w", { m: F.si(L, "kg"), v: F.si(c.iInf, "m·s⁻¹") });
    $("vj").textContent = F.si(c.source(T), "J");
    $("fj").textContent = t("rl.f.j", { w: F.si(c.stockee(T), "J"), j: F.si(c.joule(T), "J") });
  }
  sl.oninput = sr.oninput = draw; draw();
})();

/* ---------- une vraie bobine : le coefficient de Nagaoka, calculé ---------- */
(() => {
  const N = 100, a = 0.01, svg = $("nag"), sn = $("sn");
  const rs = Array.from({ length: 82 }, (_, k) => Math.pow(10, -1 + 2.7 * k / 81));     // ℓ/D from 0,1 to 50
  const Ks = rs.map(r => M.inductanceNappe(N, a, 2 * a * r, 400).K);
  function draw() {
    const r = Math.pow(10, +sn.value), l = 2 * a * r, x = M.inductanceNappe(N, a, l, 2000), dev = 1 - 8 * a / (3 * Math.PI * l);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 60, b: 44 }, x: { scale: "log", domain: [0.1, 50], label: t("nag.xaxis") }, y: { domain: [0, 1.05], label: t("nag.yaxis") } });
    const dv = rs.map(q => [q, 1 - 4 / (3 * Math.PI * q)]).filter(p => p[1] > 0);
    Plot.el("path", { d: Plot.path(dv.map(p => [P.x(p[0]), P.y(p[1])])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(rs.map((q, k) => [P.x(q), P.y(Ks[k])])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(r), cy: P.y(x.K), r: 5, class: "dot" }, P.g);
    $("snr").textContent = F.num(r, 3);
    $("vk").textContent = F.num(x.K, 4);
    $("fk").textContent = dev > 0 ? t("nag.f.k", { d: F.num(dev, 4) }) : t("nag.f.k0");
    $("vl").textContent = F.si(x.L, "H");
    $("fl").textContent = t("nag.f.l", { l: F.qty(F.num(100 * l, 3), "cm"), i: F.si(x.Lideal, "H") });
    $("vwh").textContent = F.si(x.wheeler, "H");
    $("fwh").textContent = t("nag.f.w", { e: F.qty(F.num(100 * (x.wheeler / x.L - 1), 2), "%") });
  }
  sn.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["henry", 1832, "experiment"], ["faraday", 1835, "experiment"], ["unite", 1893, "idea"], ["nagaoka", 1909, "idea"], ["wheeler", 1928, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["boost"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["serie", "b"], ["mesure", "a"], ["lenz", "c"], ["duree", "d"], ["quantite", "a"], ["courte", "b"], ["spires", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 177 });
})();
</script>
