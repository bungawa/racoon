<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, A = 0.05, TAU = 2 * Math.PI;                         // plates of 5 cm radius

/* ---------- le champ entre les armatures : corrections successives et J0 ---------- */
(() => {
  const trace = $("trace"), sf = $("sf"), rs = Array.from({ length: 201 }, (_, i) => A * i / 200);
  function draw() {
    const f = Math.pow(10, +sf.value), k = TAU * f / Constantes.c, d = M.condensateurHF(A, f);
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 }, x: { domain: [0, 100 * A], label: t("fig.xaxis") }, y: { domain: [-1.2, 1.2], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(100 * A), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const clip = v => Math.max(-1.2, Math.min(1.2, v));
    const line = (n, cls) => Plot.el("path", { d: Plot.path(rs.map(r => [P.x(100 * r), P.y(clip(n ? M.serieCondensateur(k * r, n).E : M.besselJ(0, k * r)))])), class: cls }, P.g);
    line(1, "stroke thin c-label-2"); line(2, "stroke c-warn"); line(3, "stroke c-ok"); line(0, "curve");
    if (d.rZero) Plot.el("circle", { cx: P.x(100 * d.rZero), cy: P.y(0), r: 5, class: "dot" }, P.g);
    $("sfr").textContent = F.si(f, "Hz");
    $("vx").textContent = F.num(d.x, 3);
    $("fx").textContent = t("fig.f.x", { l: F.si(Constantes.c / f, "m") });
    $("vbord").textContent = F.num(d.Ebord, 3);
    $("fbord").textContent = t("fig.f.bord", { p: F.num(1 - d.x * d.x / 4, 3), t3: F.num(M.serieCondensateur(d.x, 3).E, 3) });
    $("vb").textContent = F.num(d.Bbord, 3);
    $("fb").textContent = t(d.rZero ? "fig.f.zero" : "fig.f.b", { r: F.qty(F.num(100 * (d.rZero || 0), 3), "cm") });
  }
  sf.oninput = draw; draw();
})();

/* ---------- le système décrit : deux disques de 5 cm ---------- */
(() => {
  const d = M.condensateurHF(A, 1e8), f0 = M.zeroBessel(0, 1) * Constantes.c / (TAU * A), h = 0.002;
  $("sys1").innerHTML = t("sys1.body", { a: F.qty(F.num(100 * A, 2), "cm"), h: F.qty(F.num(1000 * h, 2), "mm"), f1: F.si(d.f1pc, "Hz"), l1: F.si(Constantes.c / d.f1pc, "m"),
    e100: F.qty(F.num(100 * d.ecartUniforme, 2), "%"), q100: F.qty(F.num(100 * (1 - d.Emoyen), 2), "%"), f0: F.si(f0, "Hz"), ha: F.num(h / A, 2), n: F.num(Constantes.c / d.f1pc / A, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bernoulli", 1732, "idea"], ["bessel", 1824, "idea"], ["maxwell", 1861, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["fibre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pourquoiB", "b"], ["proportionnel", "d"], ["correction", "a"], ["epaisseur", "c"], ["serie", "b"], ["seuil", "c"], ["signe", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 232 });
})();
</script>
