<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
/* an arrow from (x1, y1) to (x2, y2), in svg pixels */
const arrow = (svg, x1, y1, x2, y2, cls) => Plot.fleche(svg, [x1, y1], [x2, y2], { cls });

/* ---------- vitesses d'un solide en rotation (18.9) ---------- */
(() => {
  const svg = $("plaque"), W = 640, H = 340, K = 200, O = [320, 170];             // 200 px par mètre
  const plaque = [[-0.55, -0.2], [-0.3, 0.5], [0.25, 0.6], [0.7, 0.25], [0.6, -0.35], [0.1, -0.55], [-0.35, -0.5]];
  const marques = [[0.15, 0.1], [-0.3, 0.3], [0.45, -0.2], [0.6, 0.2], [-0.4, -0.35], [0.1, -0.45], [0.2, 0.5]];
  function upd() {
    const w = +$("w").value; $("wv").textContent = F.qty(F.num(w, 2), "rad·s⁻¹");
    svg.innerHTML = "";
    P("path", { d: plaque.map((p, i) => (i ? "L" : "M") + (O[0] + K * p[0]) + " " + (O[1] - K * p[1])).join("") + "Z", class: "stroke thin c-label-2" }, svg);
    const corps = Solide.tourner(marques.map(r => ({ m: 1, r })), w, [0, 0]);
    corps.forEach(c => {
      const x = O[0] + K * c.r[0], y = O[1] - K * c.r[1];
      P("line", { x1: O[0], y1: O[1], x2: x, y2: y, class: "stroke thin dash c-label-2" }, svg);
      P("circle", { cx: x, cy: y, r: 3.5, class: "fill c-tint" }, svg);
      arrow(svg, x, y, x + 0.25 * K * c.v[0], y - 0.25 * K * c.v[1], "c-tint");
    });
    P("circle", { cx: O[0], cy: O[1], r: 5, class: "fill c-warn" }, svg);
    const v = corps.map(c => Math.hypot(c.v[0], c.v[1])), r = corps.map(c => Math.hypot(c.r[0], c.r[1]));
    const iM = v.indexOf(Math.max(...v)), im = v.indexOf(Math.min(...v));
    $("vmax").textContent = F.qty(F.num(v[iM], 3), "m·s⁻¹"); $("fmax").textContent = t("pl.f.r", { r: F.qty(F.num(r[iM], 2), "m") });
    $("vmin").textContent = F.qty(F.num(v[im], 3), "m·s⁻¹"); $("fmin").textContent = t("pl.f.r", { r: F.qty(F.num(r[im], 2), "m") });
    $("vrap").textContent = w === 0 ? t("pl.immobile") : F.qty(F.num(v[iM] / r[iM], 3), "s⁻¹");
  }
  $("w").oninput = upd; upd();
})();

/* ---------- le couple d'une force sur une roue (18.12) ---------- */
(() => {
  const svg = $("roue"), K = 300, O = [250, 175], Fn = 20, DT = 0.01;           // 300 px par mètre ; F = 20 N ; Δθ = 0,01 rad
  function upd() {
    const r = +$("rr").value, phiDeg = +$("phi").value, phi = phiDeg * Math.PI / 180, a = 0.35;   // OP fait 20° avec Ox
    $("rrv").textContent = F.qty(F.num(r, 2), "m"); $("phiv").textContent = F.qty(F.num(phiDeg, 3), "°");
    const rv = [r * Math.cos(a), r * Math.sin(a)], Fv = [Fn * Math.cos(a + phi), Fn * Math.sin(a + phi)];
    const tau = RotPlane.couple(rv, Fv), d = Math.abs(tau) / Fn;
    svg.innerHTML = "";
    P("circle", { cx: O[0], cy: O[1], r: 0.5 * K, class: "stroke thin c-label-2" }, svg);
    const Px = O[0] + K * rv[0], Py = O[1] - K * rv[1];
    P("line", { x1: O[0], y1: O[1], x2: Px, y2: Py, class: "stroke thin c-label-2" }, svg);
    /* line of action, and the lever arm: the foot of the perpendicular from O */
    const u = [Math.cos(a + phi), Math.sin(a + phi)], s = -(rv[0] * u[0] + rv[1] * u[1]), foot = [rv[0] + s * u[0], rv[1] + s * u[1]];
    P("line", { x1: O[0] + K * (rv[0] - 0.7 * u[0]), y1: O[1] - K * (rv[1] - 0.7 * u[1]), x2: O[0] + K * (rv[0] + 0.7 * u[0]), y2: O[1] - K * (rv[1] + 0.7 * u[1]), class: "stroke thin dash c-label-2" }, svg);
    if (d > 1e-9) P("line", { x1: O[0], y1: O[1], x2: O[0] + K * foot[0], y2: O[1] - K * foot[1], class: "stroke bold c-warn" }, svg);
    arrow(svg, Px, Py, Px + 6 * Fv[0], Py - 6 * Fv[1], "c-tint");
    P("circle", { cx: O[0], cy: O[1], r: 5, class: "fill c-warn" }, svg);
    P("circle", { cx: Px, cy: Py, r: 4, class: "fill c-tint" }, svg);
    $("vtau").textContent = Math.abs(tau) < 1e-12 ? t("ro.nul") : F.qty(F.num(tau, 3), "N·m");
    $("vd").textContent = F.qty(F.num(d < 1e-12 ? 0 : d, 3), "m");
    const W = RotPlane.travailRotation(rv, Fv, DT);
    $("vw").textContent = Math.abs(W) < 1e-12 ? t("ro.nul") : F.qty(F.num(W, 4), "J");
    $("fw").textContent = t("ro.f.w", { x: Math.abs(tau) < 1e-12 ? "0" : F.qty(F.num(tau * DT, 4), "J") });
  }
  $("rr").oninput = $("phi").oninput = upd; upd();
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["rigide", "axe", "plan"], items = textOf("sys.items", IDS);
  const v = { eps: F.sci(235e6 / 210e9, 2) };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["archimede", -250, "idea"], ["varignon", 1687, "idea"], ["euler", 1765, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["moteur", "pedalier"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["memeomega", "a"], ["vitesse", "a"], ["axe", "a"], ["porte", "a"], ["travail", "a"], ["equilibre", "a"], ["signe", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1802 });
})();
</script>
