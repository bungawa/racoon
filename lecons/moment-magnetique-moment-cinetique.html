<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes;

/* ---------- le système décrit : l'orbite de Bohr de l'hydrogène ---------- */
(() => {
  const alpha = Cst.e ** 2 / (4 * Math.PI * Cst.eps0 * Cst.hbar * Cst.c), v = alpha * Cst.c, o = M.momentOrbite(-Cst.e, Cst.m_e, Cst.a0, v);
  $("sys1").innerHTML = t("sys1.body", { r: F.si(Cst.a0, "m", { prefix: "p", sig: 3 }), v: F.si(v, "m·s⁻¹", { sig: 3 }), b: F.sci(v / Cst.c, 3), b2: F.sci((v / Cst.c) ** 2, 2),
    J: F.sci(Math.abs(o.J), 4), h: F.sci(Cst.hbar, 4), mu: F.sci(Math.abs(o.mu), 4), muB: F.sci(Cst.mu_B, 4) });
})();

/* ---------- le g d'un corps rigide qui tourne ; l'électron-boule ---------- */
(() => {
  const sr = $("sr"); let fq = "boule", fm = "boule";
  function draw() {
    const g = M.facteurGClassique(fq, fm), R = Math.pow(10, +sr.value), v = M.vitesseEquateur(R).v;
    $("vg").textContent = F.num(g, 3);
    $("fg").textContent = t(Math.abs(g - 1) < 1e-12 ? "fig.f.g1" : "fig.f.g", { s: F.num(M.S2_FORMES[fq], 3), m: F.num(M.S2_FORMES[fm], 3) });
    $("srr").textContent = F.si(R, "m", { sig: 2 });
    $("vv").textContent = t("fig.vc", { v: F.num(v / Cst.c, 3) });
    $("fv").textContent = t(v > Cst.c ? "fig.f.vplus" : "fig.f.vmoins", { r: F.si(M.vitesseEquateur().R, "m", { sig: 3 }) });
  }
  const seg = (id, set) => document.querySelectorAll("#" + id + " button").forEach(b => b.onclick = () => {
    set(b.dataset.f); document.querySelectorAll("#" + id + " button").forEach(z => z.setAttribute("aria-pressed", z === b)); draw(); });
  seg("charge", f => { fq = f; }); seg("masse", f => { fm = f; });
  sr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["edh", 1915, "experiment"], ["spin", 1925, "idea"], ["penning", 2023, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rpe"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["rayon", "c"], ["signe", "a"], ["spin", "d"], ["g", "b"], ["neutron", "c"], ["classique", "a"], ["bohr", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 342 });
})();
</script>
