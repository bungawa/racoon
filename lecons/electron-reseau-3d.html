<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes, L = 3e-10, PI = Math.PI;

/* ---------- curves of equal energy in the plane kz = 0 ---------- */
(() => {
  const svg = $("fig"), sr = $("sr"), se = $("se");
  function draw() {
    const r = +sr.value, f = +se.value, Ax = K.e, Ay = r * K.e;
    const o = { E0: 0, Ax, Ay, Az: 0.5 * K.e, a: L, b: L, c: L };
    /* energy measured from the bottom of the slice kz = 0; the slice spans 4(Ax + Ay) */
    const Emin = Q.bande3D([0, 0, 0], o), W = 4 * (Ax + Ay), eps = f * W;
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 420, pad: { l: 116, r: 116, b: 44 }, x: { domain: [-PI, PI], label: t("fig.xaxis"), ticks: 6 }, y: { domain: [-PI, PI], label: t("fig.yaxis"), ticks: 6 } });
    const branches = [[], []];
    const traits = [];
    for (let s = -1; s <= 1; s += 2) {
      let seg = [];
      for (let i = 0; i <= 400; i++) {
        const u = -PI + 2 * PI * i / 400, c = -(Emin + eps + 2 * Ax * Math.cos(u) + 2 * o.Az) / (2 * Ay);
        if (c >= -1 && c <= 1) seg.push([G.x(u), G.y(s * Math.acos(c))]);
        else if (seg.length) { traits.push(seg); seg = []; }
      }
      if (seg.length) traits.push(seg);
    }
    traits.forEach(p => Plot.el("path", { d: Plot.path(p), class: "stroke c-label" }, G.g));
    /* the ellipse of (13.26) */
    const ell = [];
    for (let i = 0; i <= 200; i++) { const th = 2 * PI * i / 200, ux = Math.sqrt(eps / Ax) * Math.cos(th), uy = Math.sqrt(eps / Ay) * Math.sin(th);
      if (Math.abs(ux) <= PI && Math.abs(uy) <= PI) ell.push([G.x(ux), G.y(uy)]); else if (ell.length) break; }
    Plot.el("path", { d: Plot.path(ell), class: "stroke thin dash c-tint" }, G.g);
    const m = Q.massesEffectives3D(o);
    $("srr").textContent = F.num(r, 2);
    $("ser").textContent = F.num(f, 2);
    $("vx").textContent = t("fig.v.m", { r: F.num(m.mx / K.m_e, 3) });
    $("fx").textContent = t("fig.f.mx");
    $("vy").textContent = t("fig.v.m", { r: F.num(m.my / K.m_e, 3) });
    $("fy").textContent = t("fig.f.my", { q: F.num(m.my / m.mx, 3) });
    $("vf").textContent = t("fig.v.forme", { q: F.num(Math.sqrt(Ax / Ay), 3) });
    $("ff").textContent = t(f < 0.25 ? "fig.f.ellipse" : f > 0.75 ? "fig.f.haut" : "fig.f.milieu");
  }
  sr.oninput = draw; se.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const o = { E0: 0, Ax: K.e, Ay: K.e, Az: K.e, a: L, b: L, c: L };
  const k = 0.2 / L, dir = [k / Math.sqrt(3), k / Math.sqrt(3), k / Math.sqrt(3)];
  const Ex = Q.bande3D([k, 0, 0], o) - Q.bande3D([0, 0, 0], o), Ed = Q.bande3D(dir, o) - Q.bande3D([0, 0, 0], o);
  $("sys1").innerHTML = t("sys1.body", { p: F.num(100 * Math.abs(Ex - Ed) / Ex, 2) });
  $("sys2").innerHTML = t("sys2.body", { n: F.sci(1e-6 / L, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bloch", 1929, "idea"], ["wallace", 1947, "idea"], ["slater", 1954, "idea"], ["dresselhaus", 1955, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["silicium"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["separable", "b"], ["cubique", "d"], ["tenseur", "a"], ["forme", "c"], ["direction", "a"], ["haut", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1304 });
})();
</script>
