    <div class="eq"><math display="block"><mfrac><mi>Q</mi><mi>a</mi></mfrac><mo>=</mo><mfrac><mi>q</mi><mi>b</mi></mfrac><mo>,</mo><mspace width="1em"/><mfrac><msub><mi>E</mi><mi>a</mi></msub><msub><mi>E</mi><mi>b</mi></msub></mfrac><mo>=</mo><mfrac><mrow><mi>Q</mi><mo>/</mo><msup><mi>a</mi><mn>2</mn></msup></mrow><mrow><mi>q</mi><mo>/</mo><msup><mi>b</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mi>b</mi><mi>a</mi></mfrac></math><span class="n">(6.35)</span></div>

    <figure>

      <div class="panel">

        <div class="stats">
          <div class="stat"><span class="k" data-i18n="rap.k.rapport"></span><span class="v" id="vr"></span><span class="f" id="fr"></span></div>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>α</mi><mo>=</mo><mfrac><mn>1</mn><mi>λ</mi></mfrac><msup><mi>e</mi><mrow><mo>−</mo><msub><mi>V</mi><mi>i</mi></msub><mo>/</mo><mo>(</mo><mi>E</mi><mi>λ</mi><mo>)</mo></mrow></msup><mo>=</mo><mi>A</mi><mi>p</mi><mspace width="0.2em"/><msup><mi>e</mi><mrow><mo>−</mo><mi>B</mi><mi>p</mi><mo>/</mo><mi>E</mi></mrow></msup></math></div>
    <p class="validite" data-i18n-html="val.townsend"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><msub><mi>V</mi><mi>c</mi></msub><mo>=</mo><mfrac><mrow><mi>B</mi><mi>p</mi><mi>d</mi></mrow><mrow><mi data-i18n="eq.ln"></mi><mo>(</mo><mi>A</mi><mi>p</mi><mi>d</mi><mo>)</mo><mo>−</mo><mi data-i18n="eq.ln"></mi><mi data-i18n="eq.ln"></mi><mo>(</mo><mn>1</mn><mo>+</mo><mn>1</mn><mo>/</mo><mi>γ</mi><mo>)</mo></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.paschen"></p>
    <figure>

        <div class="stats">

          <div class="stat"><span class="k" data-i18n="pas.k.e"></span><span class="v" id="pe"></span><span class="f" id="pfe"></span></div>
          <div class="stat"><span class="k" data-i18n="pas.k.w"></span><span class="v" id="pw"></span><span class="f" id="pfw"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>

<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/physique-fondamentale.js"></script>
<script src="/racoon/lecons/champs-em.js"></script>
<script src="/racoon/tenseurs.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, EC = 3e6, ATM = Constantes.atm;   /* EC: dielectric strength of air, V·m⁻¹ (tables) */

/* ---------- le système décrit : une sphère de 10 cm dans l'air ---------- */
(() => {
  const a = 0.1, lam = ES.libreParcours(ATM);
  $("sys1").innerHTML = t("sys1.body", { V: F.si(EC * a, "V", { prefix: "k" }), l: F.si(lam, "m", { prefix: "µ" }), r: F.sci(lam / a, 1) });
})();

/* ---------- deux sphères reliées : a = 10 cm, d = 50 cm entre centres ---------- */
(() => {
  const a = 0.1, D = 0.5, svg = $("rap"), bsl = $("bsl");
  const courbe = Array.from({ length: 41 }, (_, i) => { const b = Math.pow(10, -3 + 2 * i / 40); return [a / b, ES.champsSpheresReliees(a, b, D).rapport]; });
  function draw() {
    const b = Math.pow(10, +bsl.value), r = ES.champsSpheresReliees(a, b, D), Vmax = EC / Math.max(r.Ea, r.Eb);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { scale: "log", domain: [1, 100], label: t("rap.x") }, y: { scale: "log", domain: [1, 100], label: t("rap.y") } });
    Plot.el("path", { d: Plot.path([[x(1), y(1)], [x(100), y(100)]]), class: "stroke thin dash c-label" }, g);
    Plot.el("path", { d: Plot.path(courbe.map(([u, v]) => [x(u), y(v)])), class: "stroke c-warn" }, g);
    Plot.el("circle", { cx: x(a / b), cy: y(r.rapport), r: 4, class: "fill c-warn" }, g);
    $("bread").textContent = F.si(b, "m", { prefix: "m" });
    $("vr").textContent = F.num(r.rapport, 3);
    $("fr").textContent = t("rap.f.rapport", { r: F.num(r.rapport635, 3) });
    $("vv").textContent = F.si(Vmax, "V", { prefix: "k" });
    $("fv").textContent = t("rap.f.vmax", { V: F.si(EC * a, "V", { prefix: "k" }) });
  }
  bsl.oninput = draw; draw();
})();

/* ---------- Paschen : l'air à 1 atm entre deux plans ---------- */
(() => {
  const svg = $("pas"), dsl = $("dsl"), m = ES.paschenMinimum(), PDMES = 7.5e-6 * ATM, VMES = 327;   /* measured minimum of air */
  const p0 = Math.log(1 + 1 / ES.AIR.gamma) / ES.AIR.A, pds = Array.from({ length: 400 }, (_, i) => p0 * Math.pow(10, 0.0005 + 4.7 * Math.pow(i / 399, 1.5)));
  function draw() {
    const d = Math.pow(10, +dsl.value), pd = ATM * d, V = ES.paschen(pd), E = V / d, lam = ES.libreParcours(ATM);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { scale: "log", domain: [0.3, 2e4], label: t("pas.x") }, y: { scale: "log", domain: [100, 1e6], label: t("pas.y") } });
    Plot.el("path", { d: Plot.path(pds.map(p => [p, ES.paschen(p)]).filter(([p, v]) => v > 0 && v < 1e6 && p <= 2e4).map(([p, v]) => [x(p), y(v)])), class: "stroke c-warn" }, g);
    Plot.el("circle", { cx: x(PDMES), cy: y(VMES), r: 4, class: "fill c-label-2" }, g);
    if (V > 0) Plot.el("circle", { cx: x(pd), cy: y(V), r: 5, class: "fill c-warn" }, g);
    $("dread").textContent = F.si(d, "m", { prefix: d < 1e-3 ? "µ" : "m" });
    $("pv").textContent = F.si(V, "V", V >= 1e3 ? { prefix: "k" } : {});
    $("pf").textContent = t("pas.f.v", { pd: F.num(pd, 3) });
    $("pe").textContent = F.si(E, "V·m⁻¹", { prefix: "M" });
    $("pfe").textContent = t("pas.f.e", { r: F.num(E / EC, 2) });
    $("pw").textContent = t("pas.ev", { w: F.num(E * lam, 2) });
    $("pfw").textContent = t("pas.f.w", { l: F.si(lam, "m", { prefix: "µ" }), n: F.num(d / lam, 2) });
  }
  dsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["paschen", 1889, "experiment"], ["townsend", 1897, "idea"], ["vdg1", 1929, "experiment"], ["vdg2", 1931, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["poste", "vide"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pointe", "c"], ["rapport", "a"], ["proches", "d"], ["avalanche", "b"], ["libre", "c"], ["minimum", "a"], ["pression", "d"], ["lisse", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 611 });
})();
</script>
