<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹", MS2 = "m·s⁻²", DEG = Math.PI / 180;

/* ---------- plan incliné : adhérence, puis glissement ---------- */
(() => {
  let pair = "bois";
  const svg = $("plan"), P = Plot.el, tsl = $("tsl");
  const arrow = (x1, y1, x2, y2, cls) => Plot.fleche(svg, [x1, y1], [x2, y2], { cls, tete: 10, min: 2 });
  function draw() {
    svg.innerHTML = "";
    const th = +tsl.value * DEG, p = Forces.PAIRS[pair], r = Forces.incline(th, p.mus, p.muk);
    const A = [70, 235], L = th > 0 ? Math.min(470, 200 / Math.sin(th)) : 470, B = [A[0] + L * Math.cos(th), A[1] - L * Math.sin(th)];
    P("polygon", { points: [A, B, [B[0], A[1]]].map(q => q.join(",")).join(" "), class: "stroke thin c-label-2" }, svg);
    const tx = Math.cos(th), ty = -Math.sin(th), nx = -Math.sin(th), ny = -Math.cos(th), w = 46, s = 0.55 * L;
    const S = [A[0] + s * tx, A[1] + s * ty], c = (a, b) => [S[0] + a * tx + b * nx, S[1] + a * ty + b * ny];
    P("polygon", { points: [c(-w / 2, 0), c(w / 2, 0), c(w / 2, w), c(-w / 2, w)].map(q => q.map(n => n.toFixed(1)).join(",")).join(" "), class: "fill c-label-2" }, svg);
    const G = c(0, w / 2), K = 80 / Forces.G0;
    arrow(G[0], G[1], G[0], G[1] + K * Forces.G0, "c-label");
    const C0 = c(0, 0);
    arrow(C0[0], C0[1], C0[0] + K * r.rn * nx, C0[1] + K * r.rn * ny, "c-tint");
    arrow(C0[0], C0[1], C0[0] + K * r.rt * tx, C0[1] + K * r.rt * ty, "c-warn");
    const lab = P("text", { x: A[0] + 54, y: A[1] - 8 }, svg); lab.textContent = "θ";
    $("tread").textContent = F.num(+tsl.value, 3) + "°";
    $("vmu").textContent = t("plan.mu", { s: F.num(p.mus, 2), d: F.num(p.muk, 2) });
    $("flim").textContent = t("plan.f.lim", { a: F.num(Forces.angleLimite(p.mus) / DEG, 3) });
    $("vtan").textContent = F.fix(Math.tan(th), 3);
    $("fusage").textContent = r.glisse ? t("plan.f.depasse") : t("plan.f.usage", { u: F.num(r.usage * 100, 3) });
    $("vetat").textContent = t(r.glisse ? "plan.glisse" : "plan.adhere");
    $("facc").textContent = r.glisse ? t("plan.f.acc", { a: F.qty(F.num(r.a, 3), MS2), g: F.num(r.a / Forces.G0, 2) }) : t("plan.f.repos");
  }
  $("pair").onchange = () => { pair = $("pair").value; draw(); };
  tsl.oninput = draw; draw();
})();

/* ---------- vitesse limite d'une bille d'acier : trois modèles, un critère ---------- */
(() => {
  let fluid = "air";
  const svg = $("vchart"), dsl = $("dsl"), RHO = 7850;
  function draw() {
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300,
      x: { scale: "log", domain: [1e-6, 0.1], label: t("vl.x") }, y: { scale: "log", domain: [1e-5, 1e3], label: t("vl.y") } });
    const inY = v => v >= 1e-5 && v <= 1e3;
    const path = (key, cls) => {
      let d = "", pen = false;
      for (let i = 0; i <= 200; i++) {
        const dd = Math.pow(10, -6 + i * 5 / 200), v = Forces.terminal(Forces.sphere(dd, RHO), fluid)[key];
        if (!isFinite(v) || !inY(v)) { pen = false; continue; }
        d += (pen ? "L" : "M") + x(dd).toFixed(1) + " " + y(v).toFixed(1); pen = true;
      }
      Plot.el("path", { d, class: cls }, g);
    };
    path("lin", "stroke thin dash c-warn"); path("quad", "stroke thin dash c-label-2"); path("corr", "curve");
    const d = Math.pow(10, +dsl.value), tv = Forces.terminal(Forces.sphere(d, RHO), fluid);
    if (isFinite(tv.corr) && inY(tv.corr)) Plot.el("circle", { cx: x(d), cy: y(tv.corr), r: 6, class: "dot" }, g);
    $("dread").textContent = F.si(d, "m");
    $("vcorr").textContent = isFinite(tv.corr) ? F.si(tv.corr, MS) : "–";
    $("fre").textContent = isFinite(tv.corr) ? t("vl.f.re", { re: F.num(tv.re, 2), regime: t("regime." + Forces.regime(tv.re)) }) : t("vl.f.crise");
    const err = v => isFinite(tv.corr) ? t("vl.f.err", { e: F.num((v / tv.corr - 1) * 100, 2) }) : "";
    $("vlin").textContent = F.si(tv.lin, MS); $("flin").textContent = err(tv.lin);
    $("vquad").textContent = F.si(tv.quad, MS); $("fquad").textContent = err(tv.quad);
  }
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { fluid = b.dataset.f;
    document.querySelectorAll("[data-f]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  dsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["amontons", 1699, "experiment"], ["coulomb", 1785, "idea"], ["stokes", 1851, "idea"], ["reynolds", 1883, "experiment"], ["bowden", 1950, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["freinage", "viscosimetre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["aire", "a"], ["angle", "a"], ["statique", "a"], ["coulomb", "a"], ["reynolds", "a"], ["stokes", "a"], ["limite", "a"], ["pluie", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 122 });
})();
</script>
