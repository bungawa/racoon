<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux;

/* ---------- où s'arrête le tableau : trois nombres sans dimension par système ---------- */
(() => {
  const S = OM.systemesClassiques(), IDS = ["pendule", "gps", "mercure", "lhc", "cuivre", "hydrogene"];
  const txt = textOf("sys.items", IDS), carte = $("carte"), pick = $("pick");
  const lg = Math.log10;
  function draw() {
    const id = pick.value, s = S[id];
    carte.innerHTML = "";
    const P = Plot.axes(carte, { fmt: F, w: 640, h: 280, pad: { l: 64, b: 44 }, x: { domain: [-50, 5], label: t("fig.xaxis") }, y: { domain: [-18, 1], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(-1), x2: P.x(-1), y1: P.y(-18), y2: P.y(1), class: "stroke dash c-ko" }, P.g);
    for (const k of IDS) {
      const c = Plot.el("circle", { cx: P.x(lg(S[k].quantique)), cy: P.y(lg(S[k].beta2)), r: k === id ? 7 : 5, class: k === id ? "dot" : "fill c-label-2" }, P.g);
      c.style.cursor = "pointer"; c.onclick = () => { pick.value = k; draw(); };
    }
    $("vb").textContent = F.sci(s.beta2, 2);
    $("fb").textContent = t("fig.f.b2", { v: F.si(s.v, "m·s⁻¹"), g: F.num(s.gamma, 4) });
    $("vq").textContent = (s.majorant ? "< " : "") + F.sci(s.quantique, 2);
    $("fq").textContent = t("fig.f.q", { l: F.qty(F.sci(s.lambda, 2), "m"), L: F.si(s.L, "m") });
    $("vg").textContent = s.gravite == null ? "–" : F.sci(s.gravite, 2);
    $("fg").textContent = t(s.gravite == null ? "fig.f.sansg" : "fig.f.g");
    $("verdict").innerHTML = "<strong>" + txt[id].name + ".</strong> " + txt[id].text;
  }
  pick.onchange = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1687, "idea"], ["maxwell", 1865, "idea"], ["planck", 1900, "idea"], ["impulsion", 1906, "idea"], ["einstein", 1915, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lhc"], uses = textOf("uses.items", USES);
  const Brho = 6.8e12 / Constantes.c;                                               // p/e for a 6,8 TeV proton (pc ≈ E), T·m
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${t("uses.lhc.text", { Brho: F.qty(F.num(Brho, 3), "T·m"), rho: F.si(Brho / 8.33, "m", { prefix: "k" }) })}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["redondant", "d"], ["force", "a"], ["relativite", "c"], ["hydrogene", "b"], ["gps", "d"], ["lhc", "a"], ["newton", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 183 });
})();
</script>
