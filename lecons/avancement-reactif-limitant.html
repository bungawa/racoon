<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimArchi;

/* ---------- tableau d'avancement ---------- */
(() => {
  const ESP = ["CH4", "O2", "CO2", "H2O", "N2", "H2", "NH3", "Ag+", "Cl-", "AgCl"], nom = textOf("esp", ESP);
  const CLS = ["c-tint", "c-warn", "c-ok", "c-label-2"];
  const seg = $("rseg"), na = $("na"), nb = $("nb"), xs = $("xi"), svg = $("graphe");
  let r = "ch4";
  const mol = v => F.qty(F.fix(v, 2), "mol");
  function draw() {
    const R = C.REACTIONS[r], esp = R.esp, nu = esp.map(s => s.nu);
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.r === r)));
    const reac = esp.filter(s => s.nu < 0), prod = esp.filter(s => s.nu > 0);
    const terme = s => (Math.abs(s.nu) === 1 ? "" : Math.abs(s.nu) + " ") + nom[s.id];
    $("equation").textContent = reac.map(terme).join(" + ") + " → " + prod.map(terme).join(" + ");
    $("naLab").textContent = t("tab.n0", { e: nom[reac[0].id] }); $("nbLab").textContent = t("tab.n0", { e: nom[reac[1].id] });
    const n0 = esp.map((s, i) => i === 0 ? +na.value : i === 1 ? +nb.value : 0);
    $("nav").textContent = mol(n0[0]); $("nbv").textContent = mol(n0[1]);
    const b = C.bornes(esp, n0), xm = b.xiMax, xi = xm * xs.value / 100;
    $("xiv").textContent = t("tab.xival", { xi: mol(xi), p: F.fix(+xs.value, 0) });
    /* the table: initial state, current state, final state */
    const nx = x => C.quantites(n0, nu, x);
    const ligne = (lab, x) => "<tr><td>" + lab + "</td>" + nx(x).map(v => "<td>" + F.fix(Math.max(v, 0), 2) + "</td>").join("") + "</tr>";
    const sym = x => esp.map((s, i) => "<td>" + (s.nu > 0 ? (n0[i] ? F.fix(n0[i], 2) + " + " : "") + (s.nu === 1 ? "" : s.nu) + x
      : F.fix(n0[i], 2) + " " + F.MINUS + " " + (s.nu === -1 ? "" : -s.nu) + x) + "</td>").join("");
    $("tableau").innerHTML = "<thead><tr><th>" + t("tab.th.etat") + "</th>" + esp.map(s => "<th>" + nom[s.id] + "</th>").join("") + "</tr></thead><tbody>"
      + ligne(t("tab.th.init"), 0) + "<tr><td>" + t("tab.th.cours") + "</td>" + sym(t("tab.xisym")) + "</tr>"
      + ligne(t("tab.th.xi", { xi: F.fix(xi, 2) }), xi) + ligne(t("tab.th.fin", { xi: F.fix(xm, 2) }), xm) + "</tbody>";
    /* the graph: n_i(ξ), straight lines of slope ν_i */
    svg.innerHTML = "";
    const top = Math.max(...esp.map((s, i) => Math.max(n0[i], nx(xm)[i])), 0.1);
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 260, x: { domain: [0, xm], label: t("tab.ax.x") }, y: { domain: [0, top * 1.05], label: t("tab.ax.y") } });
    esp.forEach((s, i) => Plot.el("path", { d: Plot.path([[x(0), y(n0[i])], [x(xm), y(Math.max(nx(xm)[i], 0))]]), class: "stroke bold " + CLS[i] }, g));
    Plot.el("line", { x1: x(xi), x2: x(xi), y1: y(0), y2: y(top * 1.05), class: "ref" }, g);
    nx(xi).forEach((v, i) => Plot.el("circle", { cx: x(xi), cy: y(Math.max(v, 0)), r: 5, class: "fill " + CLS[i] }, g));
    $("legende").innerHTML = esp.map((s, i) => '<span class="' + CLS[i] + '">' + nom[s.id] + "</span>").join("");
    $("vximax").textContent = mol(xm);
    $("vlim").textContent = b.limitants.length > 1 ? t("tab.stoech") : nom[esp[b.limitants[0]].id];
    const exces = reac.map(s => esp.indexOf(s)).filter(i => !b.limitants.includes(i));
    $("vreste").textContent = exces.length ? t("tab.reste", { e: nom[esp[exces[0]].id], n: mol(nx(xm)[exces[0]]) }) : t("tab.rien");
  }
  seg.querySelectorAll("button").forEach(bt => bt.onclick = () => { r = bt.dataset.r; draw(); });
  na.oninput = nb.oninput = xs.oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lavoisier", 1789, "experiment"], ["richter", 1792, "idea"], ["dedonder", 1922, "idea"], ["mole", 1971, "idea"], ["si2019", 2019, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lambda", "titrage"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["limitant", "b"], ["stoech", "c"], ["signe", "a"], ["unite", "d"], ["deux", "b"], ["masse", "c"], ["pression", "a"], ["exces", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
