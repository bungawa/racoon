<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, EV = Constantes.e, U = Constantes.u;
const SYSTEMES = { fixe: [1, Infinity], h: [1, Constantes.m_p], d: [1, 2.01355 * U], he: [2, 4.00151 * U], ps: [1, Constantes.m_e] };

/* ---------- the levels −E_R Z²/n² of a hydrogen-like system, and two lines ---------- */
(() => {
  const svg = $("niveaux"), seg = $("systemes");
  let s = "h";
  function draw() {
    const [Z, M] = SYSTEMES[s], e = Q.echellesHydrogenoide(Z, M), Eh = Q.echellesHydrogenoide(1, Constantes.m_p).ER;
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 30, l: 64 },
      x: { domain: [0, 1], label: "", fmt: () => "" }, y: { domain: [-1.15 * e.ER / EV, 0.05 * e.ER / EV], label: t("fig.y") } });
    for (let n = 1; n <= 8; n++) { const E = -e.ER / (n * n) / EV;
      Plot.el("line", { x1: ax.x(0.08), x2: ax.x(0.92), y1: ax.y(E), y2: ax.y(E), class: "stroke c-tint" }, ax.g);
      if (n <= 4) { const l = Plot.el("text", { x: ax.x(0.95), y: ax.y(E) + 4, class: "c-label-2" }, ax.g); l.textContent = t("fig.n", { n }); } }
    Plot.el("line", { x1: ax.x(0.08), x2: ax.x(0.92), y1: ax.y(0), y2: ax.y(0), class: "stroke thin dash c-label-2" }, ax.g);
    Plot.fleche(ax.g, [ax.x(0.3), ax.y(-e.ER / 4 / EV)], [ax.x(0.3), ax.y(-e.ER / EV)], { cls: "c-warn", tete: 8 });
    Plot.fleche(ax.g, [ax.x(0.6), ax.y(-e.ER / 9 / EV)], [ax.x(0.6), ax.y(-e.ER / 4 / EV)], { cls: "c-ok", tete: 8 });
    const ly = Q.raieHydrogenoide(1, 2, Z, M), ba = Q.raieHydrogenoide(2, 3, Z, M), lyh = Q.raieHydrogenoide(1, 2, 1, Constantes.m_p);
    $("ve").textContent = F.qty(F.fix(-e.ER / EV, 3), "eV");
    $("fe").textContent = t("fig.f.e1", { r: F.si(e.rB, "m"), mu: F.num(e.mu / Constantes.m_e, 6) });
    $("vl").textContent = F.qty(F.fix(ly * 1e9, 3), "nm");
    $("fl").textContent = t("fig.f.ecart", { v: F.num((ly - lyh) * 1e12, 3) });
    $("vb").textContent = F.qty(F.fix(ba * 1e9, 2), "nm");
    $("fb").textContent = t(ba > 380e-9 && ba < 750e-9 ? "fig.f.visible" : "fig.f.invisible");
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === s)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { s = b.dataset.s; draw(); });
  draw();
})();

/* ---------- the system described: what the equation leaves out ---------- */
(() => {
  const alpha = EV * EV / (4 * Math.PI * Constantes.eps0 * Q.hbar * Constantes.c);
  $("sys1").innerHTML = t("sys1.body", { r: F.sci(Constantes.m_e / Constantes.m_p, 2) });
  $("sys2").innerHTML = t("sys2.body", { a2: F.sci(alpha * alpha, 2), v: F.qty(F.sci(alpha * Constantes.c, 2), "m·s⁻¹") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["schrodinger", 1926, "idea"], ["urey", 1931, "experiment"], ["nobel", 1934, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lyman"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["potentiel", "c"], ["stationnaire", "a"], ["spherique", "d"], ["masse", "b"], ["deuterium", "a"], ["helium", "c"], ["neglige", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1901 });
})();
</script>
