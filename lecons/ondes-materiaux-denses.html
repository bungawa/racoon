<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, DEG = Math.PI / 180;
const L0 = 589e-9, NO = 1.6584, NE = 1.4864, NV = 1.52;           // sodium D line ; calcite ; a crown glass

/* ---------- le système décrit : la lumière jaune dans un verre ---------- */
(() => {
  const o = M.ondeAnisotrope({ eps: [NV * NV, NV * NV, NV * NV], theta: 0, pol: "y", lambda0: L0 }), a = 0.3e-9;
  $("sys1").innerHTML = t("sys1.body", { L: F.si(L0, "m", { prefix: "n" }), n: F.num(NV, 3), l: F.si(o.lambda, "m", { prefix: "n" }),
    k: F.sci(Math.hypot(...o.k), 3), a: F.si(a, "m", { prefix: "n" }), N: F.num(o.lambda / a, 2), N3: F.sci((o.lambda / a) ** 3, 1) });
})();

/* ---------- une onde plane dans le verre ou dans la calcite : k, E, D, S ---------- */
(() => {
  const svg = $("onde"), sth = $("sth"), seg = $("milieu");
  let milieu = "extra";
  const W = 640, H = 360, X0 = 20, Y0 = 20, X1 = 620, Y1 = 340, cx = 320, cy = 180;
  /* the part of the line p + s u inside the frame (Liang–Barsky) */
  function clip(p, u) {
    let a = -1e4, b = 1e4;
    for (const [q, d, lo, hi] of [[p[0], u[0], X0, X1], [p[1], u[1], Y0, Y1]]) {
      if (Math.abs(d) < 1e-12) { if (q < lo || q > hi) return null; continue; }
      const s1 = (lo - q) / d, s2 = (hi - q) / d; a = Math.max(a, Math.min(s1, s2)); b = Math.min(b, Math.max(s1, s2));
    }
    return a < b ? [[p[0] + a * u[0], p[1] + a * u[1]], [p[0] + b * u[0], p[1] + b * u[1]]] : null;
  }
  function draw() {
    const th = +sth.value * DEG;
    const eps = milieu === "verre" ? [NV * NV, NV * NV, NV * NV] : [NO * NO, NO * NO, NE * NE];
    const o = M.ondeAnisotrope({ eps, theta: th, pol: milieu === "ordinaire" ? "y" : "xz", lambda0: L0 });
    svg.innerHTML = "";
    /* screen: x to the right, z (the optic axis) upwards */
    const scr = v => [v[0], -v[2]], kh = scr(o.kHat), tg = [-kh[1], kh[0]], lam = 90 / o.n;
    Plot.el("rect", { x: X0, y: Y0, width: X1 - X0, height: Y1 - Y0, class: "stroke thin c-label-2" }, svg);
    for (let m = -6; m <= 6; m++) for (const half of [0, 0.5]) {
      const seg2 = clip([cx + (m + half) * lam * kh[0], cy + (m + half) * lam * kh[1]], tg);
      if (seg2) Plot.el("line", { x1: seg2[0][0], y1: seg2[0][1], x2: seg2[1][0], y2: seg2[1][1], class: half ? "stroke thin dash c-label-2" : "stroke thin c-tint" }, svg);
    }
    if (milieu !== "verre") {
      Plot.el("line", { x1: cx, y1: Y0 + 4, x2: cx, y2: Y1 - 4, class: "stroke dash c-label" }, svg);
      Plot.el("text", { x: cx + 6, y: Y0 + 16 }, svg).textContent = t("fig.axe");
    }
    const tip = (v, L) => { const u = scr(v), m = Math.hypot(u[0], u[1]) || 1; return [cx + L * u[0] / m, cy + L * u[1] / m]; };
    const label = (p, s) => { Plot.el("text", { x: p[0] + 6, y: p[1] - 6 }, svg).textContent = s; };
    const K = tip(o.kHat, 140), S = tip(o.S, 120);
    Plot.fleche(svg, [cx, cy], K, { cls: "c-tint", trait: "stroke bold" }); label(K, t("fig.sym.k"));
    Plot.fleche(svg, [cx, cy], S, { cls: "c-warn", trait: "stroke bold" }); label(S, t("fig.sym.s"));
    if (o.E[1] === 0) {                                              // E and D in the plane of the figure
      const E = tip(o.E, 90), D = tip(o.D, 75);
      Plot.fleche(svg, [cx, cy], D, { cls: "c-label", trait: "stroke" }); label(D, t("fig.sym.d"));
      Plot.fleche(svg, [cx, cy], E, { cls: "c-ok", trait: "stroke bold" }); label(E, t("fig.sym.e"));
    } else {                                              // E and D along y, out of the page
      Plot.el("circle", { cx: cx - 60 * kh[0], cy: cy - 60 * kh[1], r: 9, class: "stroke bold c-ok" }, svg);
      Plot.el("circle", { cx: cx - 60 * kh[0], cy: cy - 60 * kh[1], r: 2.5, class: "fill c-ok" }, svg);
      label([cx - 60 * kh[0] + 6, cy - 60 * kh[1]], t("fig.ey"));
    }
    const r = M.residusOndeMilieu(o, [1.3e-7, 0.7e-7, 2.1e-7], 1e-16, 1e-10);
    $("sthr").textContent = F.num(+sth.value, 3) + "°";
    $("vn").textContent = F.num(o.n, 5);
    $("fn").textContent = t("fig.f.n", { l: F.si(o.lambda, "m", { prefix: "n" }) });
    $("vsk").textContent = F.num(o.angleSk / DEG, 3) + "°";
    $("fsk").textContent = t(o.angleSk > 1e-6 ? "fig.f.sk" : "fig.f.sk0");
    $("vres").textContent = F.sci(r.faraday / r.echelle.faraday, 1);
    $("fres").textContent = t("fig.f.res", { a: F.sci(r.ampere / r.echelle.ampere, 1) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === milieu)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { milieu = x.dataset.m; draw(); });
  sth.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bartholin", 1669, "experiment"], ["huygens", 1690, "idea"], ["hamilton", 1832, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["glan"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["phase", "b"], ["nabla", "d"], ["sensB", "a"], ["longueur", "c"], ["calcite", "b"], ["frequence", "a"], ["dense", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 332 });
})();
</script>
