<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique;
const ARCMIN = Math.PI / 10800;
const inv = v => F.qty(F.num(v, 3), "m⁻¹");
const dist = d => isFinite(d) ? F.si(d, "m", { sig: 2 }) : t("mp.infini");

/* ---------- mise au point de l'œil réduit, (27.3), accommodation requise, flou D |ΔV| ---------- */
(() => {
  const svg = $("oeil"), W = 640, H = 280, Y0 = 140, XC = 110, S = 10000, XM = 400; // S : pixels par mètre dans l'œil ; coupe jusqu'à XM
  const ds = $("dsl"), as = $("asl"), ks = $("ksl"), vs = $("vsl"), ps = $("psl"), P = Plot.el;
  const dOf = v => +v >= 100 ? Infinity : Math.pow(10, -1.15 + 3.15 * (+v) / 99);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  function draw() {
    svg.innerHTML = "";
    const d = dOf(ds.value), age = +as.value, K = +ks.value, Vc = +vs.value, D = +ps.value * 1e-3;
    const A = O.accommodation(age).moy, r = O.oeil({ d, A, K, Vc, D });
    const L = O.OEIL.L, xR = XC + L * S, h = D / 2;
    /* le globe, la cornée, la rétine */
    P("circle", { cx: XC + L * S / 2, cy: Y0, r: L * S / 2 + 6, class: "stroke thin c-label-2" }, svg);
    const Rc = O.OEIL.R * S, a = Math.asin(Math.min(1, 52 / Rc));
    P("path", { d: "M" + (XC + Rc - Rc * Math.cos(a)).toFixed(1) + " " + (Y0 - Rc * Math.sin(a)).toFixed(1) + " A" + Rc.toFixed(1) + " " + Rc.toFixed(1) + " 0 0 0 " + (XC + Rc - Rc * Math.cos(a)).toFixed(1) + " " + (Y0 + Rc * Math.sin(a)).toFixed(1), class: "stroke c-label-2" }, svg);
    P("line", { x1: xR, x2: xR, y1: Y0 - 80, y2: Y0 + 80, class: "stroke c-label-2" }, svg);
    P("line", { x1: 0, x2: XM, y1: Y0, y2: Y0, class: "stroke thin dash c-label-2" }, svg);
    if (Vc) P("line", { x1: XC - 14, x2: XC - 14, y1: Y0 - 50, y2: Y0 + 50, class: "stroke c-tint" }, svg);
    P("text", { x: xR + 6, y: Y0 - 84, class: "tick" }, svg).textContent = t("mp.retine");
    P("text", { x: XC - 10, y: Y0 - 84, "text-anchor": "middle", class: "tick" }, svg).textContent = t("mp.cornee");
    /* rayons : du point objet (sur l'axe, à d) à la cornée, puis vers l'image p′ ; échelle verticale × 1,25 pour la pupille */
    const kY = 1.25 * S, yOf = (hh, s) => Y0 - kY * hh * (1 - s / r.image);              // s : distance après la cornée
    let yR = 0;
    [-h, h].forEach(hh => {
      const yIn = x => Y0 - kY * hh * (isFinite(d) ? 1 + (x - XC) / S / d : 1);
      P("path", { d: Plot.path([[0, yIn(0)], [XC, yIn(XC)]]), class: "stroke c-tint" }, svg);
      const sEnd = isFinite(r.image) ? Math.min(Math.max(L, r.image), (XM - XC) / S) : (XM - XC) / S;
      P("path", { d: Plot.path([[XC, Y0 - kY * hh], [XC + L * S, yOf(hh, L)]]), class: "stroke c-tint" }, svg);
      if (sEnd > L) P("path", { d: Plot.path([[XC + L * S, yOf(hh, L)], [XC + sEnd * S, yOf(hh, sEnd)]]), class: "stroke thin dash c-tint" }, svg);
      yR = Math.abs(yOf(hh, L) - Y0);
    });
    if (yR > 0.5) P("line", { x1: xR, x2: xR, y1: Y0 - yR, y2: Y0 + yR, class: "stroke c-warn", "stroke-width": 4 }, svg);
    /* la fovéa vue de face, 100 µm de côté : cônes au pas s, tache de défocalisation D |ΔV| et tache de diffraction, vues sur la rétine */
    const X0 = 430, YT = 40, C = 200, k = C / 100e-6, s = O.echantillonnage(O.RETINE.rhoFovea).s * k, g = P("g", {}, svg);
    for (let j = 0, yy = YT + s / 2; yy < YT + C; j++, yy += s * Math.sqrt(3) / 2)
      for (let xx = X0 + (j % 2 ? s : s / 2); xx < X0 + C; xx += s) P("circle", { cx: xx.toFixed(1), cy: yy.toFixed(1), r: 0.9, class: "fill c-label-2" }, g);
    P("rect", { x: X0, y: YT, width: C, height: C, class: "stroke thin c-label-2", fill: "none" }, svg);
    const cx = X0 + C / 2, cy = YT + C / 2, rb = Math.min(r.tache / 2 * k, C * 0.7), ra = 1.22 * 550e-9 / D * (L / O.OEIL.n) * k;
    if (rb > 0.5) P("circle", { cx, cy, r: rb.toFixed(1), class: "fill stroke c-warn", "fill-opacity": 0.25 }, svg);
    P("circle", { cx, cy, r: ra.toFixed(1), class: "fill c-ok", "fill-opacity": 0.7 }, svg);
    P("text", { x: cx, y: YT + C + 18, "text-anchor": "middle", class: "tick" }, svg).textContent = t("mp.fovea");
    $("dread").textContent = dist(d);
    $("aread").textContent = t("mp.age.v", { a: age, A: inv(A) });
    $("kread").textContent = inv(K); $("vread").textContent = inv(Vc);
    $("pread").textContent = F.si(D, "m", { prefix: "m", sig: 2 });
    $("va").textContent = inv(r.requise);
    $("fa").textContent = t(r.requise < 0 ? "mp.f.acc.neg" : r.requise > A ? "mp.f.acc.trop" : "mp.f.acc.ok", { A: inv(A) });
    $("vf").textContent = t("mp.flou.v", { m: F.num(r.flou / ARCMIN, 2) });
    $("ff").textContent = t(r.flou <= ARCMIN ? "mp.f.net" : r.dV > 0 ? "mp.f.derriere" : "mp.f.devant", { rad: F.si(r.flou, "rad", { sig: 2 }) });
    $("vp").textContent = t("mp.plage.v", { pp: dist(r.pp), pr: r.prVirtuel ? t("mp.virtuel") : dist(r.pr) });
    $("fp").textContent = t(K < 0 && Vc > K ? "mp.f.myope" : K > 0 && Vc < K ? "mp.f.hyper" : A < 2 ? "mp.f.presbyte" : "mp.f.plage");
  }
  [ds, as, ks, vs, ps].forEach(c => c.oninput = draw); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kepler", 1604, "idea"], ["mariotte", 1668, "experiment"], ["helmholtz", 1851, "experiment"], ["monoyer", 1872, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ordonnance", "fond"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cornee", "b"], ["eau", "d"], ["presbytie", "a"], ["myope", "c"], ["fovea", "b"], ["plisser", "a"], ["fibres", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 351 });
})();
</script>
