<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, R = Constantes.R;
const pc = (x, n = 2) => F.num(100 * x, n) + F.NB + "%";

/* ---------- analogie électrique ---------- */
(() => {
  const ROWS = ["potentiel", "courant", "resistance", "noeuds", "capacite"], txt = textOf("ana.items", ROWS);
  $("ana").innerHTML = ROWS.map(id => `<div><span class="k">${txt[id].th}</span><span>${txt[id].el}</span></div>`).join("");
})();

/* ---------- mur de brique isolé par l'extérieur ---------- */
(() => {
  const svg = $("mur"), sb = $("eb"), si = $("ei"), ste = $("te"), TI = 293, FILM = 0.03, JOUR = 86400;
  function draw() {
    const eb = +sb.value / 100, ei = +si.value / 100, Te = +ste.value, couches = [{ e: eb, lambda: S.LAMBDA.brique }];
    if (ei > 0) couches.push({ e: ei, lambda: S.LAMBDA.laine });
    const w = S.mur(couches, TI, Te), tot = eb + ei, lo = Math.min(Te, TI) - 2, hi = Math.max(Te, TI) + 2;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 }, x: { domain: [-FILM, 0.7 + FILM], label: t("mur.x") }, y: { domain: [lo, hi], label: t("mur.y") } });
    [0, eb, tot].forEach(x => Plot.el("line", { x1: o.x(x), x2: o.x(x), y1: o.y(lo), y2: o.y(hi), class: "stroke thin c-label" }, o.g));
    const xs = [-FILM, 0, eb].concat(ei > 0 ? [tot] : []).concat([tot + FILM]);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [o.x(x), o.y(w.T[i])]).concat([[o.x(0.7 + FILM), o.y(Te)]])), class: "stroke c-tint" }, o.g);
    const tau = S.tempsDiffusion(eb, S.DIFFUSIVITE.brique);
    $("ebv").textContent = F.qty(F.num(eb * 100, 3), "cm"); $("eiv").textContent = F.qty(F.num(ei * 100, 3), "cm"); $("tev").innerHTML = F.kelvin(Te);
    $("vr").textContent = F.qty(F.num(w.R, 3), "m²·K·W⁻¹"); $("vu").textContent = F.qty(F.num(w.U, 3), "W·m⁻²·K⁻¹");
    $("vphi").textContent = F.qty(F.num(w.phi, 3), "W·m⁻²");
    $("vts").innerHTML = F.kelvin(w.T[1]); $("fts").textContent = t("mur.f.ts", { d: F.qty(F.num(TI - w.T[1], 2), "K") });
    $("vpart").textContent = ei > 0 ? pc(w.Rs[2] / w.R) : pc(0);
    $("sys").innerHTML = t("sys.inner", { ti: F.kelvin(TI), te: F.kelvin(Te), tau: F.qty(F.num(tau / 3600, 2), "h"), r: F.num(tau / JOUR, 2),
      rs: pc((w.Rs[0] + w.Rs[w.Rs.length - 1]) / w.R), avis: t(tau < 0.2 * JOUR ? "sys.ok" : "sys.lent") });
  }
  sb.oninput = si.oninput = ste.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fourier", 1822, "idea"], ["ohm", 1827, "idea"], ["dewar", 1892, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["batiment", "composant"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["conserve", "c"], ["serie", "a"], ["surface", "d"], ["isolant", "b"], ["cylindre", "a"], ["arqs", "c"], ["parallele", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 9202 });
})();
</script>
