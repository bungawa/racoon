<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimArchi, K = Constantes;
const pct = x => F.qty(F.fix(100 * x, 0), "%");

/* ---------- les trois parts de van der Waals ---------- */
(() => {
  const IDS = ["ar", "ch4", "hcl", "hi", "nh3", "h2o"], nom = textOf("w.e", IDS);
  const seg = $("mseg"), svg = $("barre"), tk = $("tk"), rr = $("rr");
  seg.innerHTML = IDS.map(id => `<button type="button" data-m="${id}">${nom[id]}</button>`).join("");
  let id = "h2o";
  function draw() {
    const m = C.MOLECULES_VDW[id], T = +tk.value, r = +rr.value * 1e-9, c = C.coefficientsVdW(m, m, T);
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === id)));
    $("tkv").innerHTML = F.kelvin(T); $("rrv").textContent = F.si(r, "m", { prefix: "n" });
    svg.innerHTML = "";
    let x = 20;
    [["keesom", "c-warn"], ["debye", "c-ok"], ["london", "c-tint"]].forEach(([k, cls]) => {
      const w = 600 * c[k] / c.total; if (w < 0.5) return;
      Plot.el("rect", { x, y: 15, width: w, height: 40, class: "fill " + cls }, svg); x += w;
    });
    $("vparts").textContent = t("w.parts", { k: pct(c.keesom / c.total), d: pct(c.debye / c.total), l: pct(c.london / c.total) });
    $("vc").textContent = F.qty(F.sci(c.total, 3), "J·m⁶");
    const E = c.total / r ** 6, Em = E * K.N_A;
    $("ve").innerHTML = t("w.eval", { e: F.qty(F.fix(Em / 1000, Em < 1e3 ? 2 : 1), "kJ·mol⁻¹"), rt: F.fix(E / (K.k_B * T), 2) });
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { id = b.dataset.m; draw(); });
  tk.oninput = rr.oninput = draw; draw();
})();

/* ---------- températures d'ébullition des hydrures ---------- */
(() => {
  const E = C.EBULLITION_HYDRURES, COLS = [["14", "c-label-2"], ["15", "c-ok"], ["16", "c-tint"], ["17", "c-warn"]], f = t("eb.f");
  const svg = $("geb");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [1.7, 5.4], label: t("eb.x") }, y: { domain: [100, 400], label: t("eb.y") } });
  COLS.forEach(([col, cls]) => {
    const pts = E[col].map(([, T], i) => [x(i + 2), y(T)]);
    Plot.el("path", { d: Plot.path(pts), class: "stroke " + cls }, g);
    E[col].forEach(([fo, T], i) => {
      Plot.el("circle", { cx: x(i + 2), cy: y(T), r: 4.5, class: "fill " + cls }, g);
      if (i === 0 || i === 3)                       // périodes 2 et 5 seulement : au milieu, les points se touchent
        Plot.el("text", { x: x(i + 2) + 8, y: y(T) + (i === 0 && col === "14" ? 14 : i === 0 ? -6 : 4), class: "note" }, g).textContent = f[fo];
    });
  });
  $("ebleg").innerHTML = COLS.map(([col, cls]) => `<span class="${cls}">${t("eb.col", { c: col })}</span>`).join("");
})();

/* ---------- isomères et masses voisines ---------- */
(() => {
  const ROWS = [["propane", 231.1], ["methoxymethane", 248.3], ["ethanol", 351.5]], txt = textOf("iso.rows", ROWS.map(r => r[0]));
  $("isomeres").innerHTML = ROWS.map(([id, T]) => `<div><span class="k">${F.kelvin(T)}</span><span>${txt[id]}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["vdw", 1873, "idea"], ["nobel", 1910, "idea"], ["latimer", 1920, "idea"], ["debye", 1920, "idea"], ["keesom", 1921, "idea"],
    ["london", 1930, "idea"], ["adn", 1953, "experiment"], ["gecko", 2002, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pcr", "gecko"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["r6", "a"], ["argon", "c"], ["iode", "b"], ["eau", "d"], ["hf", "a"], ["isomere", "c"], ["energie", "d"], ["temperature", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
