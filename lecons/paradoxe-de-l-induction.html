<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, MU0 = Constantes.mu0;

/* the disc of the paradox: a 2 cm solenoid at 1 T (superconducting), 0,1 µC on the rim, a plastic disc of 0,5 kg and 15 cm */
const a = 0.02, B0 = 1, nI = B0 / MU0, Q = 1e-7, J = 0.5 * 0.5 * 0.15 * 0.15, phi0 = B0 * Math.PI * a * a;

/* ---------- le flux enlacé par l'anneau, et le moment cinétique du champ calculé point par point ---------- */
(() => {
  const svg = $("trace"), sr = $("sr"), sl = $("sl"), N = 40;
  function draw() {
    const R = +sr.value / 1000, l = +sl.value / 100, sp = M.solenoideFini(1e4, nI / 1e4, a, l, N);
    const d = M.paradoxeDisque({ Q, R, spires: sp, J }), Lc = M.momentChamp(Q, R, sp, 64);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 250, pad: { l: 60, b: 44 }, x: { domain: [0, 30], label: t("fig.xaxis") }, y: { domain: [-0.1, 1.05], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(30), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("line", { x1: P.x(100 * a), x2: P.x(100 * a), y1: P.y(-0.1), y2: P.y(1.05), class: "zero" }, P.g);
    const xs = Array.from({ length: 141 }, (_, i) => 2.2 + i * 0.2);
    Plot.el("path", { d: Plot.path(xs.map(x => [P.x(x), P.y(M.fluxAnneau(sp, x / 100) / phi0)])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(100 * R), cy: P.y(d.flux / phi0), r: 5, class: "dot" }, P.g);
    $("srr").textContent = F.qty(F.num(100 * R, 3), "cm");
    $("slr").textContent = F.qty(F.num(100 * l, 3), "cm");
    $("vf").textContent = F.si(d.flux, "Wb");
    $("ff").textContent = t("fig.f.flux", { x: F.num(100 * d.flux / phi0, 3) });
    $("vl").textContent = F.sci(d.dL, 3);
    $("fl").textContent = t("fig.f.dl", { w: F.qty(F.sci(d.omega, 2), "rad·s⁻¹") });
    $("vc").textContent = F.sci(Lc, 3);
    $("fc").textContent = t("fig.f.champ", { e: F.num(100 * Math.abs(Lc / d.dL - 1), 2) });
  }
  sr.oninput = sl.oninput = draw; draw();
})();

/* ---------- le système décrit : des ordres de grandeur ---------- */
(() => {
  const sp = M.solenoideFini(1e4, nI / 1e4, a, 0.3, 200), d = M.paradoxeDisque({ Q, R: 0.06, spires: sp, J });
  $("sys1").innerHTML = t("sys1.body", { a: F.si(a, "m", { prefix: "m" }), B: F.si(B0, "T"), Q: F.si(Q, "C", { prefix: "µ" }), J: F.qty(F.sci(J, 2), "kg·m²"),
    dl: F.qty(F.sci(d.dL, 2), "kg·m²·s⁻¹"), w: F.qty(F.sci(d.omega, 2), "rad·s⁻¹"), ans: F.num(2 * Math.PI / d.omega / (365.25 * 86400), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["busch", 1926, "idea"], ["cours", 1964, "idea"], ["graham", 1980, "experiment"], ["lombardi", 1983, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["canon"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tourne", "c"], ["conserve", "a"], ["vitesse", "d"], ["retour", "b"], ["signe", "c"], ["ordre", "a"], ["ou", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 174 });
})();
</script>
