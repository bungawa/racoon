<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique;
const mm = v => isFinite(v) ? F.si(v, "m", { prefix: "m", sig: 3 }) : "∞";

/* ---------- construction de l'image par un miroir sphérique, relations au sommet, au centre et de Newton ---------- */
(() => {
  const svg = $("constr"), vs = $("vsl"), ps = $("psl"), W = 640, Hp = 320, Y0 = 0.01;               // objet de 1 cm
  const VS = [-10, -8, -6, -5, -4, -3, -2, 2, 3, 4, 5, 6, 8, 10];                                    // vergences (m⁻¹), sans 0
  const X = [-1, 0.7], Y = [-0.05, 0.05], x = Plot.linScale(X[0], X[1], 10, W - 10), y = Plot.linScale(Y[0], Y[1], Hp - 20, 20);
  svg.setAttribute("viewBox", "0 0 " + W + " " + Hp);
  function draw() {
    svg.innerHTML = "";
    const clip = Plot.el("clipPath", { id: "cadre" }, Plot.el("defs", {}, svg));
    Plot.el("rect", { x: 0, y: 0, width: W, height: Hp }, clip);
    const g = Plot.el("g", { "clip-path": "url(#cadre)" }, svg);
    const seg = (a, b, cls) => Plot.el("line", { x1: x(a[0]), y1: y(a[1]), x2: x(b[0]), y2: y(b[1]), class: cls }, g);
    const V = VS[+vs.value], R = -2 / V, f = R / 2, p = +ps.value / 100, im = O.miroirSpherique(R).image(p), B = [p, Y0];
    seg([X[0] - 1, 0], [X[1] + 1, 0], "stroke thin rim");
    const H = 0.042, k = R < 0 ? -0.025 : 0.025;                                                      // crochets : vers la lumière si concave
    seg([0, -H], [0, H], "stroke bold c-label"); seg([0, H], [k, H + 0.004], "stroke bold c-label"); seg([0, -H], [k, -H - 0.004], "stroke bold c-label");
    [[R, "cj.C"], [f, "cj.F"], [0, "cj.S"]].forEach(([xv, key]) => {
      seg([xv, -0.002], [xv, 0.002], "stroke c-label-2");
      Plot.el("text", { x: x(xv) + 4, y: y(0) + 16 }, g).textContent = t(key);
    });
    Plot.fleche(g, [x(p), y(0)], [x(p), y(Y0)], { cls: "c-label" });
    const fin = isFinite(im.pp), yB = fin ? im.gamma * Y0 : NaN;
    const sortie = yI => fin ? (im.pp < 0 ? [im.pp, yB - yI] : [-im.pp, yI - yB]) : [-1, Y0 / p];    // vers B′, ou depuis B′ virtuel
    const RAYS = [[Y0, null], [Math.abs(R - p) > 1e-9 ? Y0 * R / (R - p) : NaN, R], [0, 0], [Math.abs(f - p) > 1e-9 ? Y0 * f / (f - p) : NaN, f]];
    RAYS.forEach(([yI, xP]) => {
      if (!isFinite(yI)) return;
      const I = [0, yI], d = sortie(yI), kk = (X[0] - 0.1) / d[0];
      seg(B, I, "stroke thin c-tint");
      seg(I, [kk * d[0], yI + kk * d[1]], "stroke thin c-tint");
      if (xP !== null && xP > 0) seg(I, [xP, 0], "stroke thin dash c-label-2");                     // vise C ou F, derrière le miroir
      if (xP !== null && xP < p) seg([xP, 0], B, "stroke thin dash c-label-2");                     // semble venir de C ou F
      if (fin && im.pp > 0) seg(I, [im.pp, yB], "stroke thin dash c-label-2");
    });
    if (fin) Plot.fleche(g, [x(im.pp), y(0)], [x(im.pp), y(yB)], { cls: "c-warn", trait: im.pp > 0 ? "stroke dash" : "stroke" });
    $("vread").textContent = t("cj.V.read", { V: F.qty(F.num(V, 2), "m⁻¹"), f: mm(f) });
    $("pread").textContent = mm(p);
    $("vpp").textContent = mm(im.pp);
    $("fpp").textContent = t(!fin ? "cj.f.infini" : im.reelle ? "cj.f.reelle" : "cj.f.virtuelle");
    $("vg").textContent = fin ? F.num(im.gamma, 3) : "∞";
    $("fg").textContent = !fin ? "" : t(im.gamma > 0 ? "cj.f.droite" : "cj.f.renversee", { taille: mm(Math.abs(im.gamma) * Y0) });
    const mm2 = v => F.qty(F.num(v * 1e6, 4), "mm²");
    $("vn").textContent = fin ? mm2(im.sigma * im.sigmap) : "–";
    $("fn").textContent = t("cj.f.newton", { s: mm(im.sigma), sp: mm(im.sigmap), f2: mm2(f * f) });
  }
  vs.oninput = draw; ps.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["herschel", 1781, "experiment"], ["foucault", 1859, "use"], ["hooker", 1917, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["retroviseur", "grossissant"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["conj", "a"], ["centre", "c"], ["foyer", "d"], ["grossissant", "b"], ["convexe", "c"], ["newton", "a"], ["sommet", "d"], ["gauss", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 322 });
})();
</script>
