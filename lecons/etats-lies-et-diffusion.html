          <div class="stat"><span class="k" data-i18n="pl.k.rmax"></span><span class="v" id="vrmax"></span><span class="f" data-i18n="pl.f.d"></span></div>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
const DEG = Math.PI / 180, Cst = Constantes;

(() => { const IDS = ["gravitation", "coulomb"]; keyed($("signes"), t("signes.tag"), IDS, textOf("signes.items", IDS)); })();

/* ---------- Ep,eff et trajectoire en unités réduites ---------- */
(() => {
  const P = Plot.el, CAS = { lie: [1, -1], attr: [1, 1], rep: [-1, 1] }, ETATS = textOf("pl.etats", ["lie", "circulaire", "diffusion", "impossible"]);
  const seg = $("cas"); let cas = "lie";
  function upd() {
    const [sg, s] = CAS[cas], ell = +$("ell").value, o = DeuxCorps.etats(sg, s, ell);
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.cas === cas)));
    $("ellv").textContent = F.num(ell, 2);
    /* Ep,eff */
    const svg = $("eff"); svg.innerHTML = "";
    const X0 = 0.02, X1 = 3, Y0 = -4, Y1 = 4;
    const { x: X, y: Y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44 }, x: { domain: [0, X1], label: t("pl.x") }, y: { domain: [Y0, Y1], label: t("pl.y") } });
    const clip = v => Math.max(Y0, Math.min(Y1, v)), xs = Array.from({ length: 400 }, (_, i) => X0 + (X1 - X0) * i / 399);
    const tp = o.tournants;
    if (tp.length) {
      const a = tp[0], b = tp.length > 1 ? tp[1] : X1, zr = xs.filter(x => x >= a && x <= b);
      if (zr.length) P("path", { d: "M" + X(a) + " " + Y(s) + zr.map(x => "L" + X(x).toFixed(1) + " " + Y(clip(o.eff(x))).toFixed(1)).join("") + "L" + X(b) + " " + Y(s) + "Z", class: "area" }, g);
    }
    P("path", { d: xs.map((x, i) => (i ? "L" : "M") + X(x).toFixed(1) + " " + Y(clip(o.eff(x))).toFixed(1)).join(""), class: "curve" }, g);
    P("path", { d: "M" + X(0) + " " + Y(0) + "L" + X(X1) + " " + Y(0), class: "zero" }, g);
    P("path", { d: "M" + X(0) + " " + Y(s) + "L" + X(X1) + " " + Y(s), class: "ref" }, g);
    tp.filter(x => x <= X1).forEach(x => P("circle", { cx: X(x), cy: Y(s), r: 5, class: "dot" }, g));
    /* trajectory, centre (attracting or repelling body) at the origin, unit d = 60 px */
    const tr = $("traj"); tr.innerHTML = ""; const lie = o.etat === "lie" || o.etat === "circulaire", CY = 150;
    const S = lie ? 130 / Math.max(tp[1], 0.25) : 40, CX = lie ? 320 + S * (tp[1] - tp[0]) / 2 : 400;   // bound: fill and centre
    let pts = DeuxCorps.trajectoire(sg, s, ell, 12, 400), rot = 0;
    if (!lie && pts.length > 1 && ell > 0) {                     // turn the picture: the projectile arrives from the left, along +x
      rot = -Math.atan2(pts[1][1] - pts[0][1], pts[1][0] - pts[0][0]);
      const c = Math.cos(rot), sn = Math.sin(rot); pts = pts.map(([x, y]) => [c * x - sn * y, sn * x + c * y]);
    }
    P("path", { d: pts.map((p, i) => (i ? "L" : "M") + (CX + S * p[0]).toFixed(1) + " " + (CY - S * p[1]).toFixed(1)).join(""), class: "stroke c-tint" }, tr);
    if (pts.length) { const p = pts[Math.floor(pts.length * 0.75)]; P("circle", { cx: CX + S * p[0], cy: CY - S * p[1], r: 4, class: "fill c-tint" }, tr); }
    tp.forEach((r, i) => { const ang = rot + (i && ell > 0 ? Math.PI : 0);   // pericentre on +x before turning, apocentre on −x
      P("circle", { cx: CX + S * r * Math.cos(ang), cy: CY - S * r * Math.sin(ang), r: 5, class: "fill c-warn" }, tr); });
    P("circle", { cx: CX, cy: CY, r: 6, class: "fill c-label" }, tr);
    P("path", { d: "M" + (CX + S) + " " + (CY + 30) + "h" + (-S), class: "stroke thin c-label-2" }, tr);
    P("text", { x: CX + S / 2, y: CY + 46, "text-anchor": "middle" }, tr).textContent = "d";
    /* stats */
    $("vetat").textContent = ETATS[o.etat]; $("fetat").textContent = t("pl.f." + o.etat);
    $("vrmin").textContent = tp.length ? F.num(tp[0], 3) : "–";
    $("vrmax").textContent = o.etat === "lie" || o.etat === "circulaire" ? F.num(tp[1], 3) : o.etat === "diffusion" ? t("pl.infini") : "–";
    $("vdev").textContent = o.etat === "diffusion" ? F.qty(F.num(o.deviation / DEG, 3), "°") : "–";
    $("fdev").textContent = o.etat === "diffusion" ? t(sg === 1 ? "pl.f.vers" : "pl.f.loin") : "";
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { cas = x.dataset.cas; upd(); });
  $("ell").oninput = upd; upd();
})();

/* ---------- ‘Oumuamua : de l'excentricité à la déviation ---------- */
(() => {
  const vInf = 26.32e3, e = 1.19936, d = 2 * Cst.GM_sun / (vInf * vInf), th = 2 * Math.asin(1 / e), b = d / (2 * Math.tan(th / 2));
  const ua = x => F.qty(F.num(x / Cst.au, 3), t("u.ua"));
  $("oud").textContent = ua(d); $("oudev").textContent = F.qty(F.num(th / DEG, 3), "°");
  $("oub").textContent = ua(b); $("ouq").textContent = ua((-d + Math.sqrt(d * d + 4 * b * b)) / 2);
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["ecran", "quantique", "autres"], items = textOf("sys.items", IDS);
  const MA = DeuxCorps.masseAlpha, d = DeuxCorps.coulomb(2, 79) / DeuxCorps.ecm(MA * 2.06e7 ** 2 / 2, MA, 197 * Cst.u);   // d = |K|/|Em|, μ of the pair
  const v = { eta: F.num(DeuxCorps.coulomb(2, 79) / (Cst.hbar * 2.06e7), 2), dfm: F.qty(F.num(d * 1e15, 3), "fm"), ratio: F.sci(d / Cst.a0, 1) };
  $("s4p1").innerHTML = t("s4.p1", { dfm: v.dfm });
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rutherford", 1911, "idea"], ["mariner", 1974, "experiment"], ["oumuamua", 2017, "experiment"], ["borisov", 2019, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["assistance"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signe", "c"], ["repulsion", "a"], ["tournant", "d"], ["deviation", "b"], ["rmin", "c"], ["reduite", "a"], ["comete", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 223 });
})();
</script>
