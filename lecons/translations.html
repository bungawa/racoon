  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys"></p>
    </div>
    <figure>
      <svg class="fig" id="fig" viewBox="0 0 640 340" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.b1"></span><span class="c-warn" data-i18n="fig.legend.b2"></span><span class="c-label-2" data-i18n="fig.legend.r"></span><span class="c-ok" data-i18n="fig.legend.rp"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="axsl" data-i18n="fig.ax"></label><output id="axread" for="axsl"></output></div>
            <input id="axsl" type="range" min="-0.5" max="4" step="0.1" value="1.5"></div>
          <div class="ctl"><div class="row"><label for="aysl" data-i18n="fig.ay"></label><output id="ayread" for="aysl"></output></div>
            <input id="aysl" type="range" min="-0.4" max="2.2" step="0.1" value="0.5"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="fig.k.chocR"></span><span class="v" id="vchocR"></span><span class="f" id="fchocR"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.k.chocRp"></span><span class="v" id="vchocRp"></span><span class="f" id="fchocRp"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.k.v"></span><span class="v" id="vv"></span><span class="f" id="fv"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.k.ecart"></span><span class="v" id="vecart"></span><span class="f" data-i18n="fig.f.ecart"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mfrac><mrow><mi>Δ</mi><mi>g</mi></mrow><mi>g</mi></mfrac><mo>≈</mo><mo>−</mo><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><msub><mi>R</mi><mi mathvariant="normal">T</mi></msub></mfrac><mo>,</mo><mspace width="0.8em"/><mi>Δ</mi><mi>θ</mi><mo>≈</mo><mfrac><mi>d</mi><msub><mi>R</mi><mi mathvariant="normal">T</mi></msub></mfrac></math></div>

    <div class="panel">
      <div class="controls">
        <div class="ctl"><div class="row"><label for="hsl" data-i18n="up.h"></label><output id="hread" for="hsl"></output></div>
          <input id="hsl" type="range" min="0" max="10000" step="100" value="1000"></div>
        <div class="ctl"><div class="row"><span data-i18n="up.terre"></span></div>
          <div class="seg" role="group" data-i18n-attr="aria-label:up.terre">

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/fmt.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const E = Sym.billes(), REF = Sym.simule(E);           // the experiment in the lab frame R, computed once
const pair = (p, d) => t("fig.pair", { x: F.num(p[0], d || 3), y: F.num(p[1], d || 3) });

/* ---------- le système décrit, chiffré ---------- */
(() => {
  const n = Sym.negligeables();
  $("sys").innerHTML = t("sys.body", { m1: F.num(E.m[0], 3), m2: F.num(E.m[1], 3), rel: F.sci(n.rel, 1), trainee: F.qty(F.num(n.trainee * 100, 1), "%"),
    cor: F.sci(n.coriolis, 1), dgv: F.sci(Sym.decalageVertical(1, 1).relatif, 2) });
})();

/* ---------- le même choc, calculé dans R et dans R′ ---------- */
(() => {
  const svg = $("fig"), P = Plot.el, K = 110, X0 = 60, Y0 = 290;
  const sx = x => X0 + K * x, sy = y => Y0 - K * y;
  const arrow = (x1, y1, x2, y2, cls) => Plot.fleche(svg, [x1, y1], [x2, y2], { cls });
  const label = (x, y, key, cls, anchor) => { const e = P("text", { x, y, "text-anchor": anchor || "start", class: cls || "" }, svg); e.textContent = t(key); };
  const axesAt = (o, cls, kx, ky, ko) => {
    const X = sx(o[0]), Y = sy(o[1]);
    arrow(X, Y, X + 90, Y, cls); arrow(X, Y, X, Y - 90, cls);
    label(X + 94, Y + 4, kx, cls); label(X + 6, Y - 92, ky, cls); label(X - 6, Y + 16, ko, cls, "end");
  };
  const path = (i, cls) => P("path", { d: REF.chemin.map((c, k) => (k ? "L" : "M") + sx(c[i][0]).toFixed(1) + " " + sy(c[i][1]).toFixed(1)).join(""), class: "stroke " + cls }, svg);
  function draw() {
    const a = [+$("axsl").value, +$("aysl").value], R = Sym.repere(a, 0), c = Sym.compare(E, R, null, REF);
    svg.innerHTML = "";
    P("line", { x1: 0, y1: sy(0), x2: 640, y2: sy(0), class: "stroke thin dash c-label-2" }, svg);
    label(636, sy(0) - 6, "fig.sol", "", "end");
    path(0, "c-tint"); path(1, "c-warn");
    REF.fin.x.forEach((p, i) => P("circle", { cx: sx(p[0]), cy: sy(p[1]), r: 6, class: "fill " + (i ? "c-warn" : "c-tint") }, svg));
    P("circle", { cx: sx(REF.choc.point[0]), cy: sy(REF.choc.point[1]), r: 5, class: "fill c-label" }, svg);
    label(sx(REF.choc.point[0]) + 8, sy(REF.choc.point[1]) - 8, "fig.choc");
    axesAt([0, 0], "c-label-2", "fig.x", "fig.y", "fig.o");
    axesAt(a, "c-ok", "fig.xp", "fig.yp", "fig.op");
    $("axread").textContent = F.si(a[0], "m", { prefix: "" });
    $("ayread").textContent = F.si(a[1], "m", { prefix: "" });
    $("vchocR").textContent = pair(REF.choc.point);
    $("fchocR").textContent = t("fig.f.t", { t: F.num(REF.choc.t, 3) });
    $("vchocRp").textContent = pair(c.autre.choc.point);
    $("fchocRp").textContent = t("fig.f.tp", { t: F.num(c.autre.choc.t, 3) });
    $("vv").textContent = pair(c.autre.fin.v[0]);
    $("fv").textContent = t("fig.f.v", { v: pair(REF.fin.v[0]) });
    $("vecart").textContent = F.si(c.ecart.x, "m");
  }
  $("axsl").oninput = $("aysl").oninput = draw; draw();
})();

/* ---------- déplacer l'expérience, la Terre restant en place ---------- */
(() => {
  let suit = false;
  function draw() {
    const h = +$("hsl").value, emporte = { champ: suit };
    const up = Sym.compare(E, Sym.deplacement([0, h]), emporte, REF), side = Sym.compare(E, Sym.deplacement([h, 0]), emporte, REF);
    const pv = Sym.decalageVertical(h, E.duree), ph = Sym.decalageHorizontal(h, E.duree);
    $("hread").textContent = F.si(h, "m", { prefix: "" });
    $("vdg").textContent = suit ? t("up.zero") : F.sci(pv.relatif, 2);
    $("vup").textContent = F.si(up.ecart.x, "m");
    $("fup").textContent = suit ? t("up.f.suit") : t("up.f.pred", { p: F.si(pv.dy, "m") });
    $("vside").textContent = F.si(side.ecart.x, "m");
    $("fside").textContent = suit ? t("up.f.suit") : t("up.f.predh", { p: F.si(ph.dx, "m") });
  }
  const set = v => { suit = v; $("t-reste").setAttribute("aria-pressed", String(!v)); $("t-suit").setAttribute("aria-pressed", String(v)); draw(); };
  $("t-reste").onclick = () => set(false); $("t-suit").onclick = () => set(true);
  $("hsl").oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["galilee", 1632, "idea"], ["newton", 1687, "idea"], ["noether", 1918, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["geodesie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["origine", "a"], ["force", "a"], ["constante", "a"], ["choc", "a"], ["monter", "a"], ["uniforme", "a"], ["mouvement", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 112 });
})();
</script>
