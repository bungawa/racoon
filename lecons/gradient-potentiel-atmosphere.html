<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>

<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, E0 = 130, R = Constantes.R_E_mean;   /* E0: mean fair-weather field over land, V·m⁻¹ (Handbook of Geophysics, 1985) */

/* ---------- le système décrit : la Terre et son air ---------- */
(() => {
  const c = ES.chargeTerre(E0);
  $("sys1").innerHTML = t("sys1.body", { s: F.si(-c.sigma, "C·m⁻²", { prefix: "n" }), Q: F.sci(-c.Q, 2), r: F.num(50e3 / R * 100, 2), n: F.sci(-c.sigma / Constantes.e, 2) });
})();

/* ---------- un objet conducteur debout sur le sol ---------- */
(() => {
  const svg = $("pers"), hsl = $("hsl"), rsl = $("rsl");
  function draw() {
    const h = Math.pow(10, +hsl.value), m = Math.pow(10, +rsl.value), b = h / m, p = ES.pieceAuSol(h, b);
    const W = 640, H = 360, zt = 1.8 * h, xw = zt * W / H / 2;
    const c = CarteChamp.carte(svg, { W, H, x0: -xw, x1: xw, y0: 0, y1: zt });
    const phi = q => p.potentiel(Math.abs(q[0]), q[1]);
    const pas = h / 6, lv = Array.from({ length: 10 }, (_, k) => (k + 1) * pas);
    CarteChamp.niveaux(c, phi, lv, { n: [160, 90], epais: 5 });
    const g = c.layer("c-warn"), pts = [];
    for (let i = 0; i <= 120; i++) { const u = Math.PI * i / 120; pts.push([c.sx(-b * Math.cos(u)), c.sy(h * Math.sin(u))]); }
    Plot.el("path", { d: Plot.path(pts) + "Z", class: "fill", opacity: "0.35" }, g);
    Plot.el("path", { d: Plot.path(pts), class: "stroke" }, g);
    Plot.el("line", { x1: 0, y1: c.sy(0) - 1, x2: W, y2: c.sy(0) - 1, class: "stroke c-label" }, c.layer());
    $("hread").textContent = F.si(h, "m", { prefix: "" });
    $("rread").textContent = F.num(m, 3);
    $("vren").textContent = F.num(p.renfort, 3);
    $("fren").textContent = t("pers.f.renfort", { rho: F.si(b * b / h, "m", { prefix: b * b / h < 0.01 ? "m" : "" }) });
    $("vtop").textContent = F.si(p.renfort * E0, "V·m⁻¹");
    $("ftop").textContent = t("pers.f.top", { E: F.si(E0, "V·m⁻¹") });
    $("vdv").textContent = F.si(E0 * h, "V");
    $("fdv").textContent = t("pers.f.dv", { pas: F.si(E0 * pas, "V") });
  }
  hsl.oninput = rsl.oninput = draw; draw();
})();

/* ---------- le moulin à champ ---------- */
(() => {
  const A = 0.01, f = 50, m = ES.moulinChamp(E0, A, f);
  $("moulin").innerHTML = t("moulin.body", { q: F.si(m.Q, "C", { prefix: "p" }), i: F.si(m.I, "A", { prefix: "n" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lemonnier", 1752, "experiment"], ["kew", 1860, "experiment"], ["wilson", 1906, "experiment"], ["carnegie", 1928, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ksc", "mesure"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signe", "b"], ["charge", "d"], ["corps", "a"], ["sphere", "c"], ["mat", "b"], ["moulin", "a"], ["plat", "d"], ["haut", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 901 });
})();
</script>
