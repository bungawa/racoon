<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, A = Q.aDepuisFrequence(23.87e9), MU = 1.47e-21 / K.c, W0 = 2 * A / K.hbar;

/* ---------- (9.43) integrated as it is, against (9.45); time in periods of the molecule, 2π/ω0 ---------- */
(() => {
  const svg = $("fig"), ss = $("ss"), sd = $("sd"), N = 160, PAS = 24;
  function draw() {
    const s = 10 ** +ss.value, dw = +sd.value * s, w = 1 + dw, Tmax = 1.2 * Math.PI / s, n = Math.max(1, Math.round(PAS * Tmax / (2 * Math.PI) / N));
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, Tmax / (2 * Math.PI)], label: t("fig.x"), fmt: v => F.num(v, 0) },
      y: { domain: [0, 1], label: t("fig.y"), fmt: v => F.num(v, 1) } });
    const courbes = {};
    for (const approx of ["complet", "rwa"]) {
      const o = { s, w, w0: 1, n: 1, approx };
      let v = [1, 0], u = 0; const pts = [[x(0), y(0)]], pv = [0];
      /* step the slow amplitudes interval by interval; the field is rebuilt at each interval's start time */
      for (let k = 1; k <= N; k++) {
        const t1 = Tmax * k / N, Hf = approx === "rwa" ? tt => { const c = Q.cx({ re: Math.cos(-dw * tt), im: Math.sin(-dw * tt) }); return [[0, { re: K.hbar * s * c.re, im: K.hbar * s * c.im }], [{ re: K.hbar * s * c.re, im: -K.hbar * s * c.im }, 0]]; }
          : tt => { const a = 2 * K.hbar * s * Math.cos(w * tt); return [[0, { re: a * Math.cos(tt), im: a * Math.sin(tt) }], [{ re: a * Math.cos(tt), im: -a * Math.sin(tt) }, 0]]; };
        v = Q.evolutionTemps(Hf, v, u, t1, approx === "rwa" ? 4 : n); u = t1;
        const c = Q.cx(v[1]), P = c.re * c.re + c.im * c.im; pts.push([x(t1 / (2 * Math.PI)), y(P)]); pv.push(P);
      }
      courbes[approx] = pv;
      Plot.el("path", { d: Plot.path(pts), class: approx === "rwa" ? "stroke dash" : "stroke bold" }, Plot.el("g", { class: approx === "rwa" ? "c-tint" : "c-warn" }, g));
    }
    const max = a => Math.max(...a), ecart = Math.max(...courbes.complet.map((p, i) => Math.abs(p - courbes.rwa[i])));
    $("ssr").textContent = F.sci(s, 1);
    $("sdr").textContent = F.num(+sd.value, 1);
    $("vmax").textContent = t("fig.v.max", { c: F.num(max(courbes.complet), 3), r: F.num(max(courbes.rwa), 3) });
    $("fmax").textContent = t("fig.f.max", { p: F.num(1 / (1 + (dw / (2 * s)) ** 2), 3) });
    $("vecart").textContent = F.num(ecart, 3);
    $("fecart").textContent = t(ecart < 0.01 ? "fig.f.bon" : "fig.f.mauvais");
  }
  ss.oninput = sd.oninput = draw; draw();
})();

/* ---------- the system described: a real field against the molecule's own frequency ---------- */
(() => {
  const e0 = 100, s = MU * e0 / K.hbar;
  $("sys").innerHTML = t("sys.body", { w0: F.qty(F.sci(W0, 3), "rad·s⁻¹"), s: F.qty(F.sci(s, 2), "rad·s⁻¹"), r: F.sci(s / W0, 1), T: F.si(Math.PI / (2 * s), "s", { prefix: "µ" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rabi", 1938, "experiment"], ["blochsiegert", 1940, "idea"], ["nobel", 1944, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["lent", "a"], ["rapide", "c"], ["resonance", "b"], ["fort", "d"], ["gamma", "a"], ["desaccord", "b"], ["energie", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 933 });
})();
</script>
