<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (id, k, ids) => { const txt = textOf(k, ids); $(id).innerHTML = ids.map(i => `<div><span class="k">${txt[i].k}</span><span>${txt[i].v}</span></div>`).join(""); };

keyed("pc", "s3.pc", ["methane", "propane", "ethanol", "hydrogene"]);

/* ---------- §2 : le cycle de Hess, par les éléments ---------- */
(() => {
  const C = ChimSolutions, P = Plot.el, kJ = x => x / 1000;
  const MASSE = { C: 12.011, H: 1.008, O: 15.999, N: 14.007 };              // g·mol⁻¹, masses atomiques conventionnelles de l'IUPAC
  const COMBUSTIBLES = ["CH4", "C3H8", "C2H5OH(l)"];
  const EQN = { CH4: { "H2O(l)": "eqn.CH4.l", "H2O(g)": "eqn.CH4.g" }, C3H8: { "H2O(l)": "eqn.C3H8.l", "H2O(g)": "eqn.C3H8.g" },
    "C2H5OH(l)": { "H2O(l)": "eqn.C2H5OH.l", "H2O(g)": "eqn.C2H5OH.g" }, ammoniac: "eqn.ammoniac", vaporeformage: "eqn.vaporeformage" };
  let r = "CH4", eau = "H2O(l)";
  function draw() {
    const comb = COMBUSTIBLES.includes(r), nu = comb ? C.combustion(r, eau) : C.REACTIONS[r];
    const Hr = Object.keys(nu).filter(id => nu[id] < 0).reduce((s, id) => s - nu[id] * C.ESPECES[id].dfH, 0);
    const Hp = Object.keys(nu).filter(id => nu[id] > 0).reduce((s, id) => s + nu[id] * C.ESPECES[id].dfH, 0), h = C.drH(nu);
    const lv = [0, kJ(Hr), kJ(Hp)], lo = Math.min(...lv), hi = Math.max(...lv), m = 0.15 * (hi - lo);
    const svg = $("cycle"); svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { b: 30, l: 70 }, x: { domain: [0, 3], ticks: 1, fmt: () => "" }, y: { domain: [lo - m, hi + m], label: t("fig.y") } });
    const niveau = (x, y, lab) => { P("line", { x1: o.x(x - 0.4), x2: o.x(x + 0.4), y1: o.y(y), y2: o.y(y), class: "stroke bold" }, o.g);
      P("text", { x: o.x(x), y: o.y(y) - 8, "text-anchor": "middle", class: "note" }, o.g).textContent = lab;
      P("text", { x: o.x(x), y: o.y(y) + 16, "text-anchor": "middle", class: "note" }, o.g).textContent = F.si(1000 * y, "J·mol⁻¹", { sig: 4 }); };
    niveau(0.5, kJ(Hr), t("fig.reactifs")); niveau(1.5, 0, t("fig.elements")); niveau(2.5, kJ(Hp), t("fig.produits"));
    Plot.fleche(o.g, [o.x(0.9), o.y(kJ(Hr))], [o.x(1.1), o.y(0)], { cls: "c-label-2", min: 4 });
    Plot.fleche(o.g, [o.x(1.9), o.y(0)], [o.x(2.1), o.y(kJ(Hp))], { cls: "c-label-2", min: 4 });
    Plot.fleche(o.g, [o.x(0.75), o.y(kJ(Hr))], [o.x(2.25), o.y(kJ(Hp))], { cls: "c-warn", min: 4 });
    $("veq").textContent = t(comb ? EQN[r][eau] : EQN[r]);
    $("vh").textContent = F.si(h, "J·mol⁻¹", { sig: 4 });
    $("fh").textContent = t(h < 0 ? "fig.f.exo" : "fig.f.endo");
    if (comb) {
      const a = C.formule(C.ESPECES[r].f).atomes, M = Object.keys(a).reduce((s, X) => s + a[X] * MASSE[X], 0) / 1000;
      $("vpc").textContent = F.si(-h / M, "J·kg⁻¹", { sig: 3 }); $("fpc").textContent = t(eau === "H2O(l)" ? "fig.f.pcs" : "fig.f.pci");
    } else { $("vpc").textContent = "–"; $("fpc").textContent = t("fig.f.sans"); }
    $("rseg").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.r === r)));
    $("eseg").querySelectorAll("button").forEach(b => { b.disabled = !comb; b.setAttribute("aria-pressed", String(comb && b.dataset.e === eau)); });
  }
  $("rseg").querySelectorAll("button").forEach(b => b.onclick = () => { r = b.dataset.r; draw(); });
  $("eseg").querySelectorAll("button").forEach(b => b.onclick = () => { eau = b.dataset.e; draw(); });
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hess1840", 1840, "idea"], ["codata1989", 1989, "use"], ["atct2004", 2004, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gaz", "chaudiere"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["reference", "c"], ["zero", "a"], ["calcul", "d"], ["co", "b"], ["etat", "c"], ["pci", "a"], ["fonction", "d"], ["incertitude", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 8102 });
})();
</script>
