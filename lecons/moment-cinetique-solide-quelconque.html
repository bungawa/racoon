<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const onTheme = f => { f(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", f); new MutationObserver(f).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] }); };
const DEG = 180 / Math.PI, UL = "kg·m²·s⁻¹", D = 0.2;                 // m between the two bearings

/* ---------- un solide sur un arbre vertical, incliné de α, qui tourne à ω constant ---------- */
const IDS = ["haltere", "roue", "pave"], NAMES = textOf("sim.solides", IDS);
let solide = "haltere", L0 = [0, 0, 1], view = null;
function upd() {
  IDS.forEach(id => $("s-" + id).setAttribute("aria-pressed", String(id === solide)));
  const a = +$("al").value / DEG, w = +$("om").value, W = [0, 0, w];
  $("alv").textContent = F.qty(F.num(+$("al").value, 3), "°"); $("omv").textContent = F.qty(F.num(w, 3), "rad·s⁻¹");
  const P = RotEsp.solide(solide, a), L = RotEsp.momentCinetique(P, W), M = RotEsp.palier(P, W), Iz = RotEsp.inertie(P);
  const ax = RotEsp.axesPrincipaux(Iz), nL = Dyna.norme(L), nM = Dyna.norme(M);
  $("vangle").textContent = F.qty(F.num(nL > 0 ? AlgVec.angle(L, W) * DEG : 0, 3), "°");
  $("vl").textContent = F.qty(F.num(nL, 3), UL);
  $("flz").textContent = t("sim.f.lz", { lz: F.qty(F.num(L[2], 3), UL) });
  $("vm").textContent = nM < 1e-9 ? t("sim.nul") : F.qty(F.num(nM, 3), "N·m");
  $("fm").textContent = t("sim.f.force", { f: F.qty(F.num(nM / D, 3), "N") });
  $("vabc").textContent = F.qty(ax.moments.map(q => F.num(Math.abs(q) < 1e-12 ? 0 : q, 3)).join(" ; "), "kg·m²");
  $("fe").textContent = t("sim.f.energie", { e: F.qty(F.num(RotEsp.energie(P, W), 3), "J") });
  L0 = L; if (view) view(solide, a);
}
IDS.forEach(id => { $("s-" + id).textContent = NAMES[id]; $("s-" + id).onclick = () => { solide = id; upd(); }; });
$("al").oninput = $("om").oninput = upd;

/* ---------- vue 3D (three.js) : rotation ralentie, flèches de longueur fixe ---------- */
(() => {
  const canvas = $("vue"), read = $("vueread");
  if (!self.THREE) { read.textContent = t("v3d.offline"); return; }
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, 4 / 3, 0.01, 10);
  cam.up.set(0, 0, 1); cam.position.set(1.0, -1.2, 0.6);
  const ctl = new THREE.OrbitControls(cam, canvas); ctl.target.set(0, 0, 0); ctl.enableDamping = true;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.0));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(1, -1, 2); scene.add(sun);
  const mat = () => new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.15 });
  const mBody = mat(), mShaft = mat();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.7, 16), mShaft); shaft.rotation.x = Math.PI / 2; scene.add(shaft);
  [-D / 2, D / 2].forEach(z => { const b = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.03), mShaft); b.position.z = z - Math.sign(z) * 0.0; b.position.x = 0; scene.add(b); });
  const spin = new THREE.Group(); scene.add(spin);
  const tilt = new THREE.Group(); spin.add(tilt);
  const S = RotEsp.SOLIDES, shapes = {};
  { const g = new THREE.Group(), a = S.haltere.a;                                   // rod along y at α = 0
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 2 * a, 10), mBody); g.add(rod);
    [-a, a].forEach(y => { const s = new THREE.Mesh(new THREE.SphereGeometry(0.035, 24, 16), mBody); s.position.y = y; g.add(s); });
    shapes.haltere = g; }
  { const g = new THREE.Group(), tor = new THREE.Mesh(new THREE.TorusGeometry(S.roue.R, 0.018, 12, 72), mBody); g.add(tor);
    for (let k = 0; k < 6; k++) { const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, S.roue.R, 6), mShaft); sp.rotation.z = k * Math.PI / 3; sp.position.set(-Math.sin(k * Math.PI / 3) * S.roue.R / 2, Math.cos(k * Math.PI / 3) * S.roue.R / 2, 0); g.add(sp); }
    shapes.roue = g; }
  { const g = new THREE.Group(), [a, b, c] = S.pave.cotes, box = new THREE.Mesh(new THREE.BoxGeometry(a, b, c), mBody);
    box.material = new THREE.MeshStandardMaterial({ roughness: 0.45, transparent: true, opacity: 0.55 }); g.add(box); g.rotation.z = Math.PI / 6; shapes.pave = g; }
  Object.values(shapes).forEach(g => tilt.add(g));
  const arrW = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 0.36), 0.12, 0, 0.04, 0.025);
  const arrL = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(), 0.45, 0, 0.05, 0.03);
  const arrM = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 0.3, 0, 0.04, 0.025);
  scene.add(arrW, arrL, arrM);
  onTheme(() => {
    mBody.color.set(css("--label-2")); mShaft.color.set(css("--label")); shapes.pave.children[0].material.color.set(css("--label-2"));
    arrW.setColor(new THREE.Color(css("--ok"))); arrL.setColor(new THREE.Color(css("--tint"))); arrM.setColor(new THREE.Color(css("--warn")));
  });
  view = (nom, a) => { Object.entries(shapes).forEach(([k, g]) => g.visible = k === nom); tilt.rotation.x = a; };
  function resize() { const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); cam.aspect = r.width / r.height; cam.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(canvas); resize();
  let visible = true, phi = 0, last = performance.now(), frame = 0;
  new IntersectionObserver(e => visible = e[0].isIntersecting).observe(canvas);
  const v = new THREE.Vector3();
  function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (!visible) return;
    if (!reduce) phi = (phi + 0.8 * dt) % (2 * Math.PI);                          // shown at 0,8 rad/s whatever ω
    spin.rotation.z = phi;
    const c = Math.cos(phi), s = Math.sin(phi), L = [c * L0[0] - s * L0[1], s * L0[0] + c * L0[1], L0[2]];
    if (Dyna.norme(L) > 1e-12) { arrL.visible = true; arrL.setDirection(v.set(L[0], L[1], L[2]).normalize()); } else arrL.visible = false;
    const M = [-L[1], L[0], 0];                                                    // ẑ ∧ L, the direction of ω ∧ L
    if (Math.hypot(M[0], M[1]) > 1e-9 * (Dyna.norme(L) + 1e-30)) { arrM.visible = true; arrM.setDirection(v.set(M[0], M[1], 0).normalize()); } else arrM.visible = false;
    if (++frame % 30 === 0) read.textContent = t("v3d.read");
    ctl.update(); renderer.render(scene, cam);
  }
  requestAnimationFrame(tick);
})();
upd();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["rigide", "axe", "explorer"], items = textOf("sys.items", IDS);
  const roue = RotEsp.solide("roue", Math.PI / 180), w = 25 / 0.3, M = Dyna.norme(RotEsp.palier(roue, [0, 0, w]));
  const v = { w: F.num(w, 2), m: F.num(M, 2), f: F.num(M / 0.1, 2) };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["euler", 1765, "idea"], ["poinsot", 1834, "idea"], ["explorer", 1958, "experiment"], ["djanibekov", 1985, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["equilibrage"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["haltere", "c"], ["symetrie", "a"], ["vibration", "b"], ["equilibre", "d"], ["double", "c"], ["explorer", "a"], ["raquette", "b"], ["composantes", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2004 });
})();
</script>
