<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, MU = 1.47e-21 / K.c, IT = 1e-9;

/* ---------- the probability against the time, for light of spectral width σ: T² for short times, T for long ones ---------- */
(() => {
  const svg = $("fig"), ss = $("ss"), st = $("st"), N = 60, T0 = 1e-7, T1 = 1e-3;
  function draw() {
    const sig = 10 ** +ss.value, Tc = 10 ** +st.value, Iw = IT / (sig * Math.sqrt(2 * Math.PI));
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, x: { domain: [T0, T1], scale: "log", label: t("fig.x") }, y: { domain: [1e-14, 1], scale: "log", label: t("fig.y") } });
    const clip = p => y(Math.max(1e-14, Math.min(1, p)));
    const courbe = (f, cls, sty) => { const pts = Array.from({ length: N + 1 }, (_, k) => { const T = T0 * (T1 / T0) ** (k / N); return [x(T), clip(f(T))]; });
      Plot.el("path", { d: Plot.path(pts), class: sty }, Plot.el("g", { class: cls }, g)); };
    courbe(T => Q.probaAbsorption(MU, IT, T, 0), "c-label-2", "stroke dash");
    courbe(T => Q.probaLargeBande(MU, Iw, T), "c-warn", "stroke dash");
    courbe(T => Q.probaSpectreGaussien(MU, IT, sig, T), "c-tint", "stroke bold");
    Plot.el("line", { x1: x(Tc), x2: x(Tc), y1: y(1e-14), y2: y(1), class: "stroke thin dash" }, Plot.el("g", { class: "c-label-2" }, g));
    const p = Q.probaSpectreGaussien(MU, IT, sig, Tc);
    $("ssr").textContent = F.qty(F.sci(sig, 1), "rad·s⁻¹");
    $("str").textContent = F.si(Tc, "s", { prefix: "µ" });
    $("vp").textContent = F.sci(p, 2);
    $("fp").textContent = t("fig.f.p", { r: F.num(p / Q.probaLargeBande(MU, Iw, Tc), 3) });
    $("vst").textContent = F.num(sig * Tc, 2);
    $("fst").textContent = t(sig * Tc > 10 ? "fig.f.large" : sig * Tc < 0.3 ? "fig.f.mono" : "fig.f.entre");
  }
  ss.oninput = st.oninput = draw; draw();
})();

/* ---------- the system described: the coefficient, and the field of a weak beam ---------- */
(() => {
  const coef = MU * MU / (4 * Math.PI * K.eps0 * K.hbar * K.hbar * K.c), e0 = Math.sqrt(IT / (2 * K.eps0 * K.c));
  $("sys").innerHTML = t("sys.body", { c: F.qty(F.sci(coef, 2), "W⁻¹·m²·s⁻²"), I: F.qty(F.sci(IT, 0), "W·m⁻²"), e: F.si(e0, "V·m⁻¹", { prefix: "m" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["einstein16", 1916, "idea"], ["einstein17", 1917, "idea"], ["dirac", 1927, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["spectro"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["taux", "c"], ["large", "a"], ["mono", "d"], ["mu2", "b"], ["emission", "c"], ["matrice", "a"], ["regime", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 966 });
})();
</script>
