<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux;

/* ---------- une onde plane et sa réflexion : u, S, et le bilan local ---------- */
(() => {
  const E0 = 1000, lambda = 0.03, c = Constantes.c;                          // 1 kV·m⁻¹, 3 cm (10 GHz)
  const trace = $("trace"), sr = $("sr"), sp = $("sp"), MU = 1e6;            // energy densities shown in µJ·m⁻³
  const xs = Array.from({ length: 241 }, (_, i) => i * 2 * lambda / 240);
  function draw() {
    const r = +sr.value / 100, o = OM.ondeMixte({ E0, lambda, r }), tt = (+sp.value / 360) * o.T;
    trace.innerHTML = "";
    const ymax = 2.2 * Constantes.eps0 * E0 * E0 * MU;
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, 6], label: t("fig.x") }, y: { domain: [-0.52 * ymax, ymax], label: t("fig.y") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(6), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const hline = (v, cls) => Plot.el("line", { x1: P.x(0), x2: P.x(6), y1: P.y(v * MU), y2: P.y(v * MU), class: cls }, P.g);
    hline(o.uMoy, "stroke thin dash c-tint"); hline(o.SMoy / c, "stroke thin dash c-warn");
    Plot.el("path", { d: Plot.path(xs.map(x => [P.x(100 * x), P.y(o.u(x, tt) * MU)])), class: "stroke c-tint" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map(x => [P.x(100 * x), P.y(o.S(x, tt) / c * MU)])), class: "stroke c-warn" }, P.g);
    const x0 = lambda / 8, b = OM.bilanLocal({ E: o.E, B: o.B }, [x0, 0, 0], tt, { h: 1e-6, ht: 1e-15 });
    Plot.el("circle", { cx: P.x(100 * x0), cy: P.y(o.u(x0, tt) * MU), r: 5, class: "dot" }, P.g);
    $("srr").textContent = F.num(r, 2);
    $("spr").textContent = F.num(+sp.value, 3) + "°";
    $("vmoy").textContent = F.si(o.SMoy, "W·m⁻²", { sig: 3 });
    $("fmoy").textContent = t("fig.f.moy", { u: F.si(o.uMoy, "J·m⁻³", { prefix: "µ" }) });
    $("vvit").textContent = F.qty(F.num(o.vitesse / c, 3), "c");
    $("fvit").textContent = t("fig.f.vitesse");
    $("vbil").textContent = F.qty(F.sci(b.dudt, 3), "W·m⁻³");
    $("fbil").textContent = t("fig.f.bilan", { div: F.qty(F.sci(b.divS, 3), "W·m⁻³"), res: F.sci(Math.abs(b.residu) / Math.max(b.echelle, 1e-30), 1) });
  }
  sr.oninput = sp.oninput = draw; draw();
})();

/* ---------- le système décrit : la lumière du Soleil au-dessus de l'atmosphère ---------- */
(() => {
  const S = 1361, s = OM.ondePlaneFlux(S), demi = 0.25 * Math.PI / 180;      // half the Sun's apparent diameter, ≈ 0,25°
  $("sys1").innerHTML = t("sys1.body", { S: F.si(S, "W·m⁻²", { sig: 4 }), E: F.si(s.Eeff, "V·m⁻¹"), B: F.si(s.Beff, "T", { prefix: "µ" }),
    u: F.si(s.u, "J·m⁻³", { prefix: "µ" }), ecart: F.sci(1 - Math.cos(demi), 1), moy: F.si(S / 4, "W·m⁻²", { sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1865, "idea"], ["poynting", 1884, "idea"], ["sorce", 2003, "experiment"], ["kopp", 2011, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["bilan"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["electrique", "c"], ["produit", "a"], ["sens", "d"], ["stationnaire", "b"], ["soleil", "c"], ["statique", "a"], ["vitesse", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 273 });
})();
</script>
