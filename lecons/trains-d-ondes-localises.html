<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §48-4 : un paquet d'ondes radio de 10 MHz dans un plasma de fréquence propre 6 MHz, ou dans le vide ---------- */
(() => {
  const O = self.Ondes, c = Constantes.c, W0 = 2 * Math.PI * 10e6, SIG = 0.0067;
  const PL = O.plasma(2 * Math.PI * 6e6), MIL = {
    plasma: O.paquet(PL.k(W0), SIG, PL.omega),
    vide: O.paquet(W0 / c, SIG, O.RELATIONS.son(c)),
  };
  const XS = Array.from({ length: 1201 }, (_, i) => -300 + 1800 * i / 1200);
  let mil = "plasma";
  function upd() {
    const Q = MIL[mil], tt = 1e-6 * +$("tp").value, xg = Q.vgroupe * tt, xp = Q.vphase * tt;
    const svg = $("pq"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 250, pad: { l: 52, b: 44 }, x: { domain: [-300, 1500], label: t("pq.xaxis") }, y: { domain: [-1.2, 1.2], label: t("pq.yaxis") } });
    Plot.el("path", { d: Plot.path(XS.map(x => [P.x(x), P.y(Q.enveloppe(x, tt))])), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(XS.map(x => [P.x(x), P.y(Q.chi(x, tt))])), class: "curve" }, P.g);
    Plot.el("line", { x1: P.x(xg), x2: P.x(xg), y1: P.y(-1.2), y2: P.y(1.2), class: "ref" }, P.g);
    if (xp <= 1500) Plot.el("circle", { cx: P.x(xp), cy: P.y(Q.chi(xp, tt)), r: 6, class: "fill c-label-2" }, P.g);
    $("tpv").textContent = F.si(tt, "s");
    $("vvp").textContent = t("pq.enc", { r: F.num(Q.vphase / c, 3) }); $("fvp").textContent = t("pq.f.vp", { d: F.si(xp, "m") });
    $("vvg").textContent = t("pq.enc", { r: F.num(Q.vgroupe / c, 3) }); $("fvg").textContent = t("pq.f.vg", { d: F.si(xg, "m"), p: F.num(Q.vphase * Q.vgroupe / (c * c), 4) });
    $("mil").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mil)));
  }
  $("mil").querySelectorAll("button").forEach(x => x.onclick = () => { mil = x.dataset.m; upd(); });
  $("tp").oninput = upd; upd();
})();

/* ---------- §48-4 : un seul sommet, beaucoup de fréquences (figure 48-6) ---------- */
(() => {
  const O = self.Ondes, F0 = 2e6, DF = 1e5, TS = Array.from({ length: 2401 }, (_, i) => -12e-6 + 24e-6 * i / 2400);
  function upd() {
    const n = +$("nn").value, P0 = O.peigne(n, F0, DF);
    const svg = $("pg"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 230, pad: { l: 52, b: 44 }, x: { domain: [-12, 12], label: t("pg.xaxis") }, y: { domain: [-1.1, 1.1], label: t("pg.yaxis") } });
    Plot.el("path", { d: Plot.path(TS.map(x => [P.x(1e6 * x), P.y(P0.enveloppe(x))])), class: "stroke dash c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(TS.map(x => [P.x(1e6 * x), P.y(-P0.enveloppe(x))])), class: "stroke dash c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(TS.map(x => [P.x(1e6 * x), P.y(P0.s(x))])), class: "stroke thin c-tint" }, P.g);
    $("nnv").textContent = F.num(n, 2);
    $("vdt").textContent = n > 1 ? F.si(P0.demiLargeur, "s") : t("pg.inf"); $("fdt").textContent = t("pg.f.dt", { r: F.si(P0.recurrence, "s") });
    $("vdf").textContent = F.si(P0.largeurSpectrale, "Hz"); $("fdf").textContent = t("pg.f.df", { p: F.num(P0.demiLargeur * P0.largeurSpectrale, 3) });
  }
  $("nn").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hamilton", 1839, "idea"], ["rayleigh", 1877, "idea"], ["sommerfeld", 1907, "idea"], ["brillouin", 1914, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gps", "pulsars"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["nondispersif", "c"], ["indice", "a"], ["relativite", "d"], ["groupe", "b"], ["produit", "c"], ["sommet", "a"], ["gps", "b"], ["pulsar", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 484 });
})();
</script>
