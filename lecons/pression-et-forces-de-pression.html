<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/constantes.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- la paroi d'un bassin ---------- */
(() => {
  const FLUIDES = ["eau", "eauDeMer", "mercure"], NAMES = textOf("wall.fluides", FLUIDES), svg = $("wall"), g = Constantes.g0;
  let fl = "eau";
  const text = (x, y, s, anchor) => { P("text", { x, y, "text-anchor": anchor || "middle" }, svg).textContent = s; };
  function upd() {
    const rho = Fluides.RHO[fl], h = +$("h").value, b = +$("b").value, r = Fluides.resultanteRectangle({ b, h2: h, rho, g });
    const pf = Fluides.pressionProfondeur(h, { rho, g, p0: 0 });
    FLUIDES.forEach(id => $("f-" + id).setAttribute("aria-pressed", String(id === fl)));
    $("hv").textContent = F.qty(F.num(h, 3), "m"); $("bv").textContent = F.qty(F.num(b, 3), "m");
    $("vp").textContent = F.si(pf, "Pa"); $("fp").textContent = t("wall.f.p", { r: F.num(pf / Constantes.atm, 3) });
    $("vF").textContent = F.si(r.F, "N"); const m = r.F / g; $("fF").textContent = t("wall.f.F", { m: F.qty(m < 1e5 ? F.num(m, 3) : F.sci(m, 3), "kg") });
    $("vz").textContent = t("wall.f.z", { z: F.qty(F.num(r.zc, 3), "m") });
    $("vM").textContent = F.si(r.moment, "N·m");
    /* drawing: the liquid at the left of the wall, pressure arrows growing with depth, the resultant at 2h/3 */
    svg.innerHTML = "";
    const top = 30, H = 240, x0 = 40, xw = 360, sc = 0.85 * H / h, hy = h * sc, ys = top + H - hy;   // the liquid fills the drawing
    P("rect", { x: x0, y: ys, width: xw - x0, height: hy, class: "area" }, svg);
    P("line", { x1: x0, y1: ys, x2: xw, y2: ys, class: "stroke thin c-tint" }, svg);
    P("line", { x1: xw, y1: top - 10, x2: xw, y2: top + H, class: "stroke bold c-label" }, svg);
    P("line", { x1: x0, y1: top + H, x2: xw + 40, y2: top + H, class: "stroke c-label-2" }, svg);
    const L = 200;                                                  // arrow length at the bottom, whatever h
    for (let i = 1; i <= 8; i++) { const z = h * i / 8, y = ys + z * sc, l = L * z / h;
      Plot.fleche(svg, [xw - l, y], [xw, y], { cls: "c-tint", tete: 7 }); }
    P("line", { x1: xw - L, y1: top + H, x2: xw, y2: ys, class: "stroke thin dash c-label-2" }, svg);
    const yc = ys + r.zc * sc;
    Plot.fleche(svg, [xw + 6, yc], [xw + 96, yc], { cls: "c-warn" });
    text(xw + 100, yc + 4, t("wall.Fl"), "start");
    text(xw + 100, yc + 22, t("wall.zl"), "start");
    text(x0 + 6, ys - 8, t("wall.surface"), "start");
  }
  ["h", "b"].forEach(id => $(id).oninput = upd);
  FLUIDES.forEach(id => { $("f-" + id).textContent = NAMES[id]; $("f-" + id).onclick = () => { fl = id; upd(); }; });
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["stevin", 1586, "idea"], ["guericke", 1672, "experiment"], ["bramah", 1795, "use"], ["pascal", 1971, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["freins", "barrage", "ventouse"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["normale", "c"], ["surface", "a"], ["forme", "d"], ["centre", "b"], ["hemi", "a"], ["uniforme", "c"], ["mercure", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
