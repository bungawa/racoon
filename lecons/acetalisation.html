<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acétalisation et hémiacétalisation du glucose</title>
<link rel="stylesheet" href="/racoon/ds.css">
<style>
  #meca { width: 100%; max-width: 440px; height: 190px; }
  .deux { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .deux svg { width: 100%; height: 190px; }
  #ouvert { width: 100%; max-width: 420px; height: 150px; }
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-organique" data-i18n="monde.chim-organique"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-activation-protection" data-i18n="etape.chim-activation-protection"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/activation-electrophile-alcools" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <figure>
      <div class="panel"><div class="seg" role="group" id="actes"></div></div>
      <svg class="fig no-sigle" id="meca" role="img" data-i18n-attr="aria-label:meca.aria"></svg>
      <p id="actetxt"></p>
      <figcaption data-i18n-html="meca.caption"></figcaption>
    </figure>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>K</mi><mo>=</mo><mfrac><mrow><msub><mi>x</mi><mtext data-i18n="eq.acetal"></mtext></msub><mspace width="0.2em"></mspace><msub><mi>x</mi><mtext data-i18n="eq.eau"></mtext></msub></mrow><mrow><msub><mi>x</mi><mtext data-i18n="eq.carbonyle"></mtext></msub><mspace width="0.2em"></mspace><msub><mi>x</mi><mtext data-i18n="eq.diol"></mtext></msub></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="s2.validite"></p>
    <figure>
      <div class="chart"><svg id="courbe" role="img" data-i18n-attr="aria-label:eqb.aria"></svg></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="lgK" data-i18n="eqb.K"></label><output id="Kv" for="lgK"></output></div>
          <input id="lgK" type="range" min="-2" max="2" step="0.5" value="0"></div>
        <div class="ctl"><div class="row"><label for="diol" data-i18n="eqb.diol"></label><output id="diolv" for="diol"></output></div>
          <input id="diol" type="range" min="1" max="5" step="0.5" value="1"></div>
        <div class="ctl"><div class="row"><label for="retrait" data-i18n="eqb.retrait"></label><output id="retraitv" for="retrait"></output></div>
          <input id="retrait" type="range" min="0" max="0.99" step="0.01" value="0"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="eqb.k.r"></span><span class="v" id="vr"></span><span class="f" id="fr"></span></div>
          <div class="stat"><span class="k" data-i18n="eqb.k.eau"></span><span class="v" id="veau"></span><span class="f" id="feau"></span></div>
          <div class="stat"><span class="k" data-i18n="eqb.k.cond"></span><span class="v" id="vcond"></span><span class="f" id="fcond"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="eqb.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure>
      <svg class="fig no-sigle" id="ouvert" role="img" data-i18n-attr="aria-label:glu.ariaOuvert"></svg>
      <div class="deux">
        <div><svg class="fig no-sigle" id="alpha" role="img" data-i18n-attr="aria-label:glu.ariaAlpha"></svg><p class="readout" id="dalpha"></p></div>
        <div><svg class="fig no-sigle" id="beta" role="img" data-i18n-attr="aria-label:glu.ariaBeta"></svg><p class="readout" id="dbeta"></p></div>
      </div>
      <figcaption data-i18n-html="glu.caption"></figcaption>
    </figure>
    <p data-i18n-html="s3.p2"></p>
    <div class="eq"><math display="block"><mrow><mo>[</mo><mi>α</mi><mo>]</mo></mrow><mo>=</mo><msub><mi>x</mi><mi>α</mi></msub><msub><mrow><mo>[</mo><mi>α</mi><mo>]</mo></mrow><mi>α</mi></msub><mo>+</mo><msub><mi>x</mi><mi>β</mi></msub><msub><mrow><mo>[</mo><mi>α</mi><mo>]</mo></mrow><mi>β</mi></msub></math></div>
    <p class="validite" data-i18n-html="s3.validite"></p>
    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="xb" data-i18n="rot.xb"></label><output id="xbv" for="xb"></output></div>
          <input id="xb" type="range" min="0" max="1" step="0.01" value="0"></div>
        <div class="controls"><button class="btn tinted" type="button" id="equil" data-i18n="rot.equil"></button></div>
        <p class="readout" id="rotv" aria-live="polite"></p>
      </div>
      <figcaption data-i18n-html="rot.caption"></figcaption>
    </figure>
    <p data-i18n-html="s3.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/acetalisation.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/chim-organique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = ChimOrga, sym = s => t("chim.sym", { s });
const peindre = (svg, d) => { svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };
const pct = x => F.qty(F.fix(100 * x, 1), "%");

/* ---------- mécanisme de l'acétalisation, acte par acte ---------- */
(() => {
  const vues = O.actesActivation("acetal", { texte: sym, echelle: 40 }), txt = textOf("meca.actes", vues.map((_, k) => "a" + k));
  const seg = $("actes"), svg = $("meca");
  seg.innerHTML = vues.map((_, k) => `<button type="button" data-k="${k}">${txt["a" + k].bouton}</button>`).join("");
  function montre(k) {
    peindre(svg, vues[k]); $("actetxt").textContent = txt["a" + k].texte;
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.k === k)));
  }
  seg.onclick = e => { const b = e.target.closest("button"); if (b) montre(+b.dataset.k); };
  montre(0);
})();

/* ---------- équilibre et Dean-Stark ---------- */
(() => {
  const N0 = 0.1, svg = $("courbe");                                  // 0,1 mol de cétone
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 260, x: { domain: [0, 1], label: t("eqb.x") }, y: { domain: [0, 100], label: t("eqb.y") } });
  const courbe = Plot.el("path", { class: "curve" }, g), dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  function maj() {
    const K = Math.pow(10, +$("lgK").value), d = +$("diol").value, f = +$("retrait").value;
    const r = u => O.acetalisation({ K, carbonyle: 1, diol: d, retrait: u }).rendement, R = r(f);
    courbe.setAttribute("d", Plot.path(Array.from({ length: 100 }, (_, i) => i / 100).map(u => [x(u), y(100 * r(u))])));
    dot.setAttribute("cx", x(f)); dot.setAttribute("cy", y(100 * R));
    $("Kv").textContent = K >= 1 ? F.num(K, 3) : F.num(K, 2); $("diolv").textContent = F.num(d, 2); $("retraitv").textContent = pct(f);
    $("vr").textContent = pct(R); $("fr").textContent = t("eqb.f.r");
    const nEau = f * R * N0;
    $("veau").textContent = F.si(nEau * 18.015, "g", { sig: 2 }); $("feau").textContent = t("eqb.f.eau");
    $("vcond").textContent = F.si(1e3 * O.condensatMinimal(nEau, "toluene"), "g", { sig: 2 }); $("fcond").textContent = t("eqb.f.cond");
  }
  ["lgK", "diol", "retrait"].forEach(id => $(id).oninput = maj); maj();
})();

/* ---------- glucose ---------- */
(() => {
  peindre($("ouvert"), O.dessin(O.molecule("glucoseOuvert"), { texte: sym, echelle: 34, marques: { 1: "1", 5: "5" } }));
  [["alpha", "alphaGlucopyranose"], ["beta", "betaGlucopyranose"]].forEach(([id, mid]) => {
    const m = O.molecule(mid);
    peindre($(id), O.dessin(m, { texte: sym, echelle: 34, surligne: [0], marques: { 0: "1" } }));
    $("d" + id).textContent = t("glu.d." + id, { d: O.descripteurRS(m, 0) });
  });
  const G = O.GLUCOSE;
  const maj = () => { const xb = +$("xb").value, a = O.pouvoirMelange([{ alpha: G.alpha, c: 1 - xb }, { alpha: G.beta, c: xb }], 1);
    $("xbv").textContent = pct(xb);
    $("rotv").textContent = t("rot.v", { a: F.num(a, 3), e: F.num(G.equilibre, 3) }); };
  $("xb").oninput = maj;
  $("equil").onclick = () => { $("xb").value = O.fractionBeta(G.equilibre).toFixed(2); maj(); };
  maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dubrunfaut", 1846, "experiment"], ["fischer", 1891, "idea"], ["deanstark", 1920, "experiment"], ["haworth", 1929, "idea"], ["delrin", 1960, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pom", "osides"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["catalyse", "b"], ["hemi", "d"], ["eau", "a"], ["deanstark", "c"], ["cycle", "b"], ["anomeres", "a"], ["biot", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1920 });
})();
</script>
</body>
</html>
