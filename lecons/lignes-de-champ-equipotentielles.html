<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9;

/* ---------- deux charges sur un axe : lignes en tubes de flux égal, équipotentielles (positions en m) ---------- */
(() => {
  const svg = $("lignes"), q2sl = $("q2sl"), nsl = $("nsl"), cb = $("seules"), O = { W: 640, H: 384, x0: -0.15, x1: 0.15, y0: -0.09, y1: 0.09 };
  const X1 = -0.05, X2 = 0.05, OPT = { r0: 1.5e-3, ds: 1e-3, loin: 0.5, n: 3000 }, NIV = [-400, -200, -100, -50, -25, 0, 25, 50, 100, 200, 400];
  const deg = a => a * 180 / Math.PI;
  function trace(c, g, pts) { Plot.el("path", { d: Plot.path(pts.map(p => [c.sx(p[0]), c.sy(p[1])])), class: "stroke thin" }, g); }
  function draw() {
    const k2 = +q2sl.value, n = +nsl.value, Q = [{ q: NC, x: X1, y: 0 }, { q: k2 * NC, x: X2, y: 0 }].filter(s => s.q !== 0);
    const c = CarteChamp.carte(svg, O), phi = p => ES.potentiel(Q, p);
    const clip = Plot.el("clipPath", { id: "cadre-lignes" }, Plot.el("defs", {}, svg)), dans = g => (g.setAttribute("clip-path", "url(#cadre-lignes)"), g);
    Plot.el("rect", { x: 0, y: 0, width: O.W, height: O.H }, clip);
    CarteChamp.niveaux(c, phi, NIV, { cls: "c-label-2", epais: NIV.indexOf(0) });
    if (cb.checked) {                       /* the picture of each charge alone: straight radial lines, which cross */
      const g = dans(c.layer("c-tint"));
      Q.forEach(s => ES.anglesEgalFlux(Math.max(1, Math.round(n * Math.abs(s.q) / NC))).forEach(a => [1, -1].forEach(sg => {
        const u = s.x < 0 ? 1 : -1;        /* angles measured from the direction toward the other charge */
        trace(c, g, [[s.x, 0], [s.x + 0.4 * u * Math.cos(a), sg * 0.4 * Math.sin(a)]]);
      })));
    }
    const g = dans(c.layer("c-ok"));
    let arrivent = 0, infini1 = 0, ecart = 0, infini2 = 0;
    ES.anglesEgalFlux(n).forEach(a => [1, -1].forEach(sg => {
      const l = ES.suivreLigne(Q, 0, sg * a, Object.assign({ u: [1, 0] }, OPT));
      trace(c, g, l.points);
      if (l.fin === 1) { arrivent++; const b = ES.angleArrivee(1, k2, a); if (Number.isFinite(b)) ecart = Math.max(ecart, Math.abs(deg(l.angle - b))); }
      else infini1++;
    }));
    if (Q.length === 2) {                    /* lines of q2 that do not end on q1 */
      const n2 = Math.round(n * Math.abs(k2));
      if (n2 > 0) ES.anglesEgalFlux(n2).forEach(a => [1, -1].forEach(sg => {
        const l = ES.suivreLigne(Q, 1, sg * a, Object.assign({ u: [-1, 0] }, OPT));
        if (l.fin !== 0) { trace(c, g, l.points); infini2++; }
      }));
    }
    Q.forEach(s => CarteChamp.point(c, [s.x, s.y], 4 + 2.5 * Math.abs(s.q) / NC, s.q > 0 ? "c-warn" : "c-label", t("li.nom", { i: s.x < 0 ? 1 : 2 }), -14));
    const prevu = k2 < 0 ? 2 * n * Math.min(1, -k2) : 0;
    $("q2read").textContent = F.si(k2 * NC, "C", { prefix: "n" });
    $("nread").textContent = String(n);
    $("varrivent").textContent = t("li.v.arrivent", { a: arrivent, n: 2 * n });
    $("farrivent").textContent = t("li.f.arrivent", { p: F.num(prevu, 3) });
    $("vangle").textContent = arrivent ? F.qty(F.num(ecart, 2), "°") : "–";
    $("vinfini").textContent = String(infini1 + infini2);
    $("finfini").textContent = t("li.f.infini", { p: F.num(2 * n * Math.abs(1 + k2), 3) });
  }
  q2sl.oninput = nsl.oninput = cb.onchange = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday52", 1852, "idea"], ["maxwell", 1855, "idea"], ["maxwell61", 1861, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["anneaux", "calcul"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["nombre", "b"], ["croisement", "d"], ["perpendiculaire", "a"], ["densite", "c"], ["vide", "a"], ["moitie", "c"], ["superposer", "b"], ["plan", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 48 });
})();
</script>
