<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["son", "vagues", "lumiere", "matiere"]; keyed($("exemples"), t("exemples.tag"), IDS, textOf("exemples.items", IDS)); })();
(() => { const IDS = ["amplitude", "dispersion", "absorption"]; keyed($("neglige"), t("neglige.tag"), IDS, textOf("neglige.items", IDS)); })();

/* ---------- §47-1 : un paquet d'ondes, sans et avec dispersion ---------- */
(() => {
  const O = self.Ondes;
  /* sound in air at 293 K, wavelength 0,5 m ; deep-water gravity waves, wavelength 1 m ; same packet width, σ = k₀/8 */
  const MIL = { son: { lam: 0.5, w: O.RELATIONS.son(O.celerite("air", 293.15)) }, eau: { lam: 1, w: O.RELATIONS.eau(9.81) } };
  const P = {}; for (const m in MIL) { const k0 = 2 * Math.PI / MIL[m].lam; P[m] = O.paquet(k0, k0 / 8, MIL[m].w, 481); }
  const XS = Array.from({ length: 1201 }, (_, i) => -5 + 50 * i / 1200);          // x in wavelengths
  let mil = "son";
  function upd() {
    const p = P[mil], lam = MIL[mil].lam, T = lam / p.vphase, n = +$("tp").value, tt = n * T;
    const svg = $("pq"); svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 44, b: 44 }, x: { domain: [-5, 45], label: t("pq.xaxis") }, y: { domain: [-1.1, 1.1], label: t("pq.yaxis") } });
    const chi = XS.map(u => [A.x(u), A.y(p.chi(u * lam, tt))]), env = XS.map(u => p.enveloppe(u * lam, tt));
    Plot.el("path", { d: Plot.path(XS.map((u, i) => [A.x(u), A.y(env[i])])), class: "stroke thin dash c-label-2" }, A.g);
    Plot.el("path", { d: Plot.path(XS.map((u, i) => [A.x(u), A.y(-env[i])])), class: "stroke thin dash c-label-2" }, A.g);
    Plot.el("path", { d: Plot.path(chi), class: "curve" }, A.g);
    const xg = p.vgroupe * tt / lam, xp = p.vphase * tt / lam;
    Plot.el("line", { x1: A.x(xg), x2: A.x(xg), y1: A.y(-1.1), y2: A.y(1.1), class: "stroke thin c-warn" }, A.g);
    Plot.el("line", { x1: A.x(xp), x2: A.x(xp), y1: A.y(-1.1), y2: A.y(1.1), class: "stroke thin dash c-label" }, A.g);
    const top = Math.max(...env);
    $("tpv").textContent = t("pq.t.v", { n: F.num(n, 3), s: F.si(tt, "s") });
    $("vphi").textContent = F.si(p.vphase, "m·s⁻¹"); $("fphi").textContent = t("pq.f.phase", { lam: F.si(lam, "m"), T: F.si(T, "s") });
    $("vgr").textContent = F.si(p.vgroupe, "m·s⁻¹"); $("fgr").textContent = t("pq.f.groupe", { r: F.num(p.vgroupe / p.vphase, 3) });
    $("vsom").textContent = F.num(top, 3); $("fsom").textContent = t(top > 0.995 ? "pq.f.garde" : "pq.f.etale");
    $("milieu").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mil)));
  }
  $("milieu").querySelectorAll("button").forEach(b => b.onclick = () => { mil = b.dataset.m; upd(); });
  $("tp").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["alembert", 1747, "idea"], ["young", 1802, "experiment"], ["hertz", 1888, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["houle", "seisme"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["matiere", "b"], ["forme", "d"], ["gauche", "a"], ["dispersion", "c"], ["groupe", "b"], ["somme", "a"], ["choc", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 471 });
})();
</script>
