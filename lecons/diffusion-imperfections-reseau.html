<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes, B = 3e-10, PI = Math.PI;

/* ---------- reflection and transmission by one impurity ---------- */
(() => {
  const svg = $("fig"), sf = $("sf"), sk = $("sk");
  function draw() {
    const Fe = +sf.value, kb = +sk.value, o = { E0: 0, A: K.e, F: Fe * K.e, b: B };
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 }, x: { domain: [0, PI], label: t("fig.xaxis"), ticks: 6 }, y: { domain: [0, 1], label: t("fig.yaxis") } });
    const r = [], tr = [];
    for (let i = 1; i < 300; i++) { const u = PI * i / 300, d = Fe === 0 ? { R: 0, T: 1 } : Q.diffusionImpurete(u / B, o); r.push([G.x(u), G.y(d.R)]); tr.push([G.x(u), G.y(d.T)]); }
    Plot.el("path", { d: Plot.path(r), class: "stroke c-warn" }, G.g);
    Plot.el("path", { d: Plot.path(tr), class: "stroke c-label" }, G.g);
    const d = Fe === 0 ? { R: 0, T: 1 } : Q.diffusionImpurete(kb / B, o);
    Plot.el("line", { x1: G.x(kb), x2: G.x(kb), y1: G.y(0), y2: G.y(1), class: "stroke thin dash c-label-2" }, G.g);
    $("sfr").textContent = F.si(Fe, "eV");
    $("skr").textContent = F.num(kb, 3);
    $("vr").textContent = F.num(d.R, 3);
    $("fr").textContent = t("fig.f.r");
    $("vt").textContent = F.num(d.T, 3);
    $("ft").textContent = t("fig.f.t", { s: F.num(d.R + d.T, 6) });
    $("ve").textContent = F.si(Q.bandeChaine(kb / B, o) / K.e, "eV");
    $("fe").textContent = t("fig.f.e");
  }
  sf.oninput = draw; sk.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const o = { E0: 0, A: K.e, F: 0.3 * K.e, b: B }, R = Q.diffusionImpurete(Math.PI / 2 / B, o).R, c = 1e-4;
  $("sys1").innerHTML = t("sys1.body", { R: F.sci(R, 2), F2: F.num((0.3 / 2) ** 2, 2) });
  $("sys2").innerHTML = t("sys2.body", { l: F.si(B / (c * R), "m"), n: F.sci(1 / (c * R), 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["matthiessen", 1864, "experiment"], ["bloch", 1929, "idea"], ["anderson", 1958, "idea"], ["billy", 2008, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["mobilite"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["conserve", "b"], ["faible", "a"], ["signe", "d"], ["bord", "c"], ["somme", "a"], ["resistance", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1306 });
})();
</script>
