<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, A = O.Alcenes, sym = s => t("chim.sym", { s }), $ = id => document.getElementById(id);

/* ---------- mécanismes limites, acte par acte : flèches courbes et comptes d'électrons du module ---------- */
function mecanisme(id, o) {
  const vues = O.actesMecanisme(id, Object.assign({ texte: sym, echelle: 40 }, o));
  ActesMecanisme.monter({ vues, textes: textOf("meca.actes." + id, vues.map((_, k) => "a" + k)), svg: $("m-" + id), boutons: $("m-" + id + "-actes"), texte: $("m-" + id + "-texte") });
}
mecanisme("propagation", { carbones: true, doublets: [1, 3, 5] });
mecanisme("acetylure", { carbones: true, doublets: [1, 4] });
const kj = v => F.qty(F.num(v, 3), "kJ·mol⁻¹");

/* ---------- les deux étapes de propagation, X = Cl, Br, I ---------- */
(() => {
  const svg = $("barres");
  let X = "Br";
  function maj() {
    const r = A.radicalaire(X);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 64, b: 28 }, x: { domain: [0, 3], fmt: () => "", ticks: 1 }, y: { domain: [-140, 60], label: t("ha.y") } });
    [[r.e1, "c-tint", "ha.e1"], [r.e2, "c-warn", "ha.e2"], [r.bilan, "c-label", "ha.bilan"]].forEach(([v, cls, k], i) => {
      const x0 = o.x(i + 0.25), x1 = o.x(i + 0.75), y0 = o.y(0), y1 = o.y(v);
      Plot.el("rect", { x: x0, width: x1 - x0, y: Math.min(y0, y1), height: Math.abs(y1 - y0), class: "fill " + cls }, o.g);
      Plot.el("text", { x: (x0 + x1) / 2, y: v < 0 ? y1 + 16 : y1 - 6, "text-anchor": "middle", class: "tick" }, o.g).textContent = kj(v);
      Plot.el("text", { x: (x0 + x1) / 2, y: o.y(60) + 14, "text-anchor": "middle", class: "tick" }, o.g).textContent = t(k);
    });
    Plot.el("line", { x1: o.x(0), x2: o.x(3), y1: o.y(0), y2: o.y(0), class: "stroke" }, o.g);
    $("haverdict").textContent = t("ha.verdict." + X, { e1: kj(r.e1), e2: kj(r.e2), d: kj(r.DHX) });
    document.querySelectorAll("#halogene button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.x === X)));
  }
  $("halogene").onclick = e => { const b = e.target.closest("button"); if (!b) return; X = b.dataset.x; maj(); };
  maj();
})();

/* ---------- acidité d'un alcyne vrai : quelle base ? ---------- */
(() => {
  const P = A.PKA, BASES = { hydroxyde: P.eau, amidure: P.ammoniac, methyle: P.methane }, IDS = Object.keys(BASES), noms = textOf("ab.bases", IDS), sel = $("base");
  sel.innerHTML = IDS.map(id => `<option value="${id}">${noms[id]}</option>`).join("");
  sel.value = "amidure";
  function maj() {
    const r = A.acideBase(P.ethyne, BASES[sel.value]);
    $("vpka").textContent = F.num(BASES[sel.value], 3);
    $("vK").textContent = F.sci(r.K, 2);
    $("vfrac").textContent = r.fraction > 0.9999 ? t("ab.presque") : F.qty(r.fraction < 1e-4 ? F.sci(100 * r.fraction, 2) : F.num(100 * r.fraction, 3), "%");
    $("abverdict").textContent = t(r.K > 1e3 ? "ab.oui" : r.K < 1e-3 ? "ab.non" : "ab.partiel");
  }
  sel.onchange = maj; maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["davy", 1836, "experiment"], ["berthelot", 1860, "experiment"], ["willson", 1892, "use"], ["kharasch", 1933, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rilsan", "butynediol"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["peroxyde", "b"], ["regio", "d"], ["hcl", "a"], ["hi", "c"], ["radical", "b"], ["base", "d"], ["sn2", "a"], ["argent", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
