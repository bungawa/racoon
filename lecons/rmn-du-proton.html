<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const S = ChimOrga.Spectro, out = id => document.getElementById(id);
const larmor = B => MagInd.frequencePrecession("proton", B).f;

/* ---------- déplacements chimiques mesurés (CDCl₃, Fulmer et al. 2010) ---------- */
(() => {
  const ROWS = [["methane", 0.22], ["acetonitrile", 2.10], ["acetone", 2.17], ["toluene", 2.36], ["methanol", 3.49], ["nitromethane", 4.33],
    ["dichloromethane", 5.30], ["ethylene", 5.40], ["chloroforme", 7.26], ["benzene", 7.36], ["dmf", 8.02]], txt = textOf("dep.rows", ROWS.map(r => r[0]));
  out("deplacements").innerHTML = ROWS.map(([id, d]) => `<div><span class="k">${F.qty(F.fix(d, 2), t("u.ppm"))}</span><span>${txt[id]}</span></div>`).join("");
})();

/* ---------- mélange éthanol + éthanoate d'éthyle : spectre et intégration ---------- */
(() => {
  const svg = out("cspectre"), frac = out("frac"), champ = out("champ"), W = 1;   // largeur à mi-hauteur des raies : 1 Hz
  const D0 = 0, D1 = 4.6;
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 560, h: 280, pad: { b: 44, l: 44 },
    x: { domain: [-D1, -D0], label: t("sp.xaxe"), fmt: v => F.num(Math.abs(v), 3) }, y: { domain: [0, 1.15], label: t("sp.yaxe"), fmt: () => "" } });
  const spectre = Plot.el("path", { class: "curve" }, g), integ = Plot.el("path", { class: "ref" }, g), notes = Plot.el("g", {}, g);
  function maj() {
    const xA = +frac.value / 100, B = +champ.value / 100, nu0 = larmor(B);
    const rs = S.raies(S.melange([["acetateEthyle", xA], ["ethanol", 1 - xA]]), nu0);
    const n = 4000, ds = []; for (let i = 0; i <= n; i++) ds.push(D0 + (D1 - D0) * i / n);
    const ys = S.spectreRMN(rs, ds, nu0, W), ymax = Math.max(...ys);
    spectre.setAttribute("d", Plot.path(ds.map((d, i) => [x(-d), y(ys[i] / ymax)])));
    const h = W / 2, tot = rs.reduce((s, r) => s + r.I, 0);                       // intégrale exacte des lorentziennes, de δ = 0 vers la gauche
    const cum = ds.map(d => rs.reduce((s, r) => s + r.I * (0.5 + Math.atan((d - r.delta) * nu0 / 1e6 / h) / Math.PI), 0) / tot);
    integ.setAttribute("d", Plot.path(ds.map((d, i) => [x(-d), y(0.05 + 1.05 * cum[i])])));
    notes.innerHTML = "";
    [[4.12, "sp.n.ester"], [3.72, "sp.n.ethanol"], [2.05, "sp.n.acetyle"], [1.25, "sp.n.methyles"]].forEach(([d, k], i) =>
      Plot.el("text", { x: x(-d), y: y(1.12) + 14 * (i % 2), "text-anchor": "middle", class: "note" }, notes).textContent = t(k));
    const e = S.integrale(rs, 4.0, 4.25), a = S.integrale(rs, 3.6, 3.85);
    out("xread").textContent = F.qty(F.fix(100 * xA, 0), "%");
    out("bread").textContent = F.qty(F.fix(B, 2), "T");
    out("nu0").textContent = F.si(nu0, "Hz", { sig: 4 });
    out("ecarthz").textContent = F.qty(F.fix((4.12 - 3.72) * nu0 / 1e6, 0), "Hz");
    out("aires").textContent = e + a > 0 ? t("sp.rapport", { e: F.fix(e / (e + a), 2), a: F.fix(a / (e + a), 2) }) : t("sp.na");
    out("deduit").textContent = e + a > 0 ? F.qty(F.fix(100 * e / (e + a), 0), "%") : t("sp.na");
  }
  frac.oninput = champ.oninput = maj; maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bloch", 1946, "experiment"], ["arnold", 1951, "experiment"], ["tiers", 1958, "idea"], ["varian", 1961, "experiment"], ["ernst", 1966, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount(out("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["paillasse", "irm"], uses = textOf("uses.items", USES);
  out("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["champ", "c"], ["hertz", "a"], ["electro", "d"], ["chlore", "b"], ["melange", "a"], ["signaux", "c"], ["tms", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount(out("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
