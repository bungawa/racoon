<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, Th = Thermo, E = Th.EAU;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const pct = r => F.qty(Math.abs(r) < 0.01 ? F.num(100 * r, 2) : F.fix(100 * r, 1), "%");

/* ---------- le cycle de Carnot sur le palier (schéma) ---------- */
(() => {
  const svg = $("cyc"), X0 = 70, X1 = 600, Y0 = 260, Y1 = 20;
  P("line", { x1: X0, y1: Y0, x2: X1, y2: Y0, class: "stroke thin c-label-2" }, svg);
  P("line", { x1: X0, y1: Y0, x2: X0, y2: Y1, class: "stroke thin c-label-2" }, svg);
  const xa = 120, xb = 470, yT = 110, yT2 = 160;
  const iso = (y, dx) => `M ${xa - 25 + dx} ${Y1 + 10} C ${xa - 12 + dx} ${y - 40}, ${xa - 6 + dx} ${y - 5}, ${xa + dx} ${y} L ${xb + dx} ${y} C ${xb + 60 + dx} ${y + 30}, ${X1 - 60} ${y + 70}, ${X1 - 10} ${y + 85}`;
  P("path", { d: iso(yT, 0), class: "stroke c-tint" }, svg);
  P("path", { d: iso(yT2, -6), class: "stroke c-tint" }, svg);
  P("path", { d: `M ${xa} ${yT} L ${xb} ${yT} L ${xb - 6} ${yT2} L ${xa - 6} ${yT2} Z`, class: "stroke c-warn" }, svg);
  Plot.fleche(svg, [xa + 120, yT], [xa + 200, yT], { cls: "c-warn" });
  Plot.fleche(svg, [xb - 200, yT2], [xb - 280, yT2], { cls: "c-warn" });
  const L = textOf("cyc.labels", ["p", "v", "T", "T2", "vap", "cond", "dp", "vl", "vg"]);
  const txt = (x, y, s, a) => { P("text", { x, y, "text-anchor": a || "middle" }, svg).textContent = s; };
  txt(X0 - 8, Y1 + 10, L.p, "end"); txt(X1, Y0 + 20, L.v, "end");
  txt(xb + 80, yT + 20, L.T, "start"); txt(xb + 70, yT2 + 30, L.T2, "start");
  txt((xa + xb) / 2, yT - 10, L.vap); txt((xa + xb) / 2, yT2 + 22, L.cond);
  txt(xa - 30, (yT + yT2) / 2 + 4, L.dp, "end"); txt(xa, Y0 + 20, L.vl); txt(xb, Y0 + 20, L.vg);
  P("line", { x1: xa, y1: yT, x2: xa, y2: Y0, class: "stroke thin dash c-label-2" }, svg);
  P("line", { x1: xb, y1: yT, x2: xb, y2: Y0, class: "stroke thin dash c-label-2" }, svg);
})();

/* ---------- pression de vapeur : IAPWS contre l'intégrale à L constant ---------- */
(() => {
  const svg = $("ps");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 360, pad: { b: 44, l: 60 },
    x: { domain: [270, 650], label: t("ps.x") }, y: { scale: "log", domain: [100, 1e8], label: t("ps.y") } });
  const Ts = Array.from({ length: 301 }, (_, i) => E.Tt + (E.Tc - E.Tt) * i / 300);
  P("path", { d: Plot.path(Ts.map(T => [x(T), y(Th.psat(T))])), class: "curve" }, g);
  P("circle", { cx: x(E.Tc), cy: y(E.pc), r: 4, class: "fill c-label-2" }, g);
  const cc = P("path", { class: "ref" }, g), d0 = P("circle", { r: 5, class: "fill c-warn" }, g), dot = P("circle", { r: 6, class: "dot" }, g);
  const s0 = $("psT0"), s1 = $("psT");
  function upd() {
    const T0 = +s0.value, T = +s1.value, p0 = Th.psat(T0), L = Th.Lvap(T0);
    const f = T2 => Th.clausiusClapeyron(T2, T0, p0, L);
    cc.setAttribute("d", Plot.path(Ts.map(T2 => [x(T2), y(Math.min(Math.max(f(T2), 100), 1e8))])));
    d0.setAttribute("cx", x(T0)); d0.setAttribute("cy", y(p0));
    const pv = Th.psat(T), pc = f(T), n = Th.negligesCC(T);
    dot.setAttribute("cx", x(T)); dot.setAttribute("cy", y(pv));
    $("psT0v").innerHTML = t("ps.T0read", { T: F.kelvin(T0), L: F.qty(F.num(L / 1e3, 4), "kJ·kg⁻¹") });
    $("psTv").innerHTML = F.kelvin(T);
    $("psv").textContent = F.si(pv, "Pa"); $("psvf").textContent = t("ps.f.vrai");
    $("psc").textContent = F.si(pc, "Pa"); $("pscf").textContent = t("ps.f.cc", { r: (pc >= pv ? "+" : "") + pct(pc / pv - 1) });
    $("psn").textContent = F.sci(n.vSurV, 2); $("psnf").textContent = t("ps.f.neg", { z: pct(1 - n.Z) });
  }
  s0.oninput = s1.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["carnot", 1824, "idea"], ["clapeyron", 1834, "idea"], ["clausius", 1850, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rosee", "climat", "vide"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["aire", "b"], ["signe", "c"], ["hypotheses", "a"], ["extrapoler", "d"], ["pente", "b"], ["droite", "a"], ["molecule", "c"], ["climat", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
