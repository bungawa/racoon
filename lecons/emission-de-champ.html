    <p class="validite" data-i18n-html="val.barriere"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><mi>J</mi><mo>=</mo><mfrac><mrow><mi>a</mi><msup><mi>E</mi><mn>2</mn></msup></mrow><mrow><mi>φ</mi><msup><mi>t</mi><mn>2</mn></msup></mrow></mfrac><mspace width="0.2em"/><msup><mi>e</mi><mrow><mo>−</mo><mi>v</mi><mi>b</mi><msup><mi>φ</mi><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msup><mo>/</mo><mi>E</mi></mrow></msup><mo>,</mo><mspace width="1em"/><mi>a</mi><mo>=</mo><mfrac><msup><mi>e</mi><mn>3</mn></msup><mrow><mn>8</mn><mi>π</mi><mi>h</mi></mrow></mfrac><mo>,</mo><mspace width="0.6em"/><mi>b</mi><mo>=</mo><mfrac><mrow><mn>8</mn><mi>π</mi><msqrt><mrow><mn>2</mn><msub><mi>m</mi><mi>e</mi></msub></mrow></msqrt></mrow><mrow><mn>3</mn><mi>e</mi><mi>h</mi></mrow></mfrac></math></div>

      <svg class="fig" id="cour" viewBox="0 0 640 260" role="img" data-i18n-attr="aria-label:cour.aria"></svg>
      <div class="legend"><span class="c-warn" data-i18n="cour.legend.45"></span><span class="c-tint" data-i18n="cour.legend.50"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>

<script src="/racoon/navigation.js"></script>

<script src="/racoon/fmt.js"></script>

<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/integration.js"></script>

<script src="/racoon/lecons/forces.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, eV = ES.E, NM = 1e-9, L = 1e-3, R = 0.05, PHI = 4.5, PHI2 = 5.0;   /* needle half-length, screen radius (m), work functions (eV) */

/* ---------- le système décrit : une pointe de 50 nm sous 1,1 kV ---------- */
(() => {
  const rho = 50e-9, p = ES.champPointe(L, rho, 1100), Fe = p.E, w = PHI / (Fe * NM), s = ES.schottky(Fe);
  $("sys1").innerHTML = t("sys1.body", { k: F.num(p.k, 2), E: F.si(Fe, "V·m⁻¹", { prefix: "G" }), w: F.num(w, 2), r: F.num(w * NM / rho, 1), x0: F.num(s.x0 / NM, 2) });
})();

/* ---------- la barrière, le courant, le contraste, le grandissement ---------- */
(() => {
  const vsl = $("vsl"), rsl = $("rsl"), sb = $("barr"), sc = $("cour");
  const Fs = Array.from({ length: 181 }, (_, i) => (1 + 9 * i / 180) * 1e9);
  const courbe = phi => Fs.map(Fe => [Fe, ES.fowlerNordheim(Fe, phi).J]).filter(([, J]) => J > 0);
  const C45 = courbe(PHI), C50 = courbe(PHI2);
  function draw() {
    const V = +vsl.value, rho = +rsl.value * NM, p = ES.champPointe(L, rho, V), Fe = p.E, r = ES.fowlerNordheim(Fe, PHI), r2 = ES.fowlerNordheim(Fe, PHI2);
    sb.innerHTML = "";
    const A = Plot.axes(sb, { fmt: F, w: 640, h: 260, x: { domain: [0, 3], label: t("barr.x") }, y: { domain: [-1, 5], label: t("barr.y") } });
    const U = ES.barriereSN(Fe, PHI), xs = Array.from({ length: 300 }, (_, i) => (0.02 + 2.98 * i / 299) * NM);
    const cl = v => Math.max(-1, Math.min(5, v));
    Plot.el("path", { d: Plot.path(xs.map(X => [A.x(X / NM), A.y(cl(U(X) / eV))])), class: "stroke c-warn" }, A.g);
    Plot.el("line", { x1: A.x(0), x2: A.x(3), y1: A.y(0), y2: A.y(0), class: "stroke thin dash c-label" }, A.g);
    const dans = xs.filter(X => U(X) > 0);
    if (dans.length && Number.isFinite(r.J)) Plot.el("rect", { x: A.x(dans[0] / NM), y: A.y(0) - 3, width: A.x(dans[dans.length - 1] / NM) - A.x(dans[0] / NM), height: 6, class: "fill c-label-2" }, A.g);
    sc.innerHTML = "";
    const B = Plot.axes(sc, { fmt: F, w: 640, h: 260, x: { domain: [1, 10], label: t("cour.x") }, y: { domain: [-10, 14], label: t("cour.y") } });
    const tr = c => c.filter(([, J]) => J >= 1e-10 && J <= 1e14).map(([Fe2, J]) => [B.x(Fe2 / 1e9), B.y(Math.log10(J))]);
    Plot.el("path", { d: Plot.path(tr(C45)), class: "stroke c-warn" }, B.g);
    Plot.el("path", { d: Plot.path(tr(C50)), class: "stroke c-tint" }, B.g);
    if (Fe <= 1e10 && r.J >= 1e-10 && r.J <= 1e14) Plot.el("circle", { cx: B.x(Fe / 1e9), cy: B.y(Math.log10(r.J)), r: 5, class: "fill c-warn" }, B.g);
    $("vread").textContent = F.si(V, "V", { prefix: "k" });
    $("rread").textContent = F.si(rho, "m", { prefix: "n" });
    $("ve").textContent = F.si(Fe, "V·m⁻¹", { prefix: "G" });
    $("fe").textContent = t("f.e", { k: F.num(p.k, 2), f: F.num(r.f, 2) });
    if (Number.isFinite(r.J)) {
      $("vj").textContent = F.si(r.J, "A·m⁻²");
      $("fj").textContent = t("f.j", { I: F.si(r.J * Math.PI * rho * rho, "A") });
      $("vc").textContent = t("c.fois", { x: F.num(r.J / r2.J, 2) });
    } else {
      $("vj").textContent = t("f.sans"); $("fj").textContent = t("f.sansf"); $("vc").textContent = "—";
    }
    $("fc").textContent = t("f.c");
    $("vm").textContent = t("m.fois", { m: F.sci(R / rho, 2) });
    $("fm").textContent = t("f.m", { d: F.si(2.5e-9 * R / rho, "m", { prefix: "m" }) });
  }
  vsl.oninput = draw; rsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fowler", 1928, "idea"], ["fim", 1951, "experiment"], ["atomes", 1955, "experiment"], ["sonde", 1967, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["canon", "tomographie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["fine", "b"], ["k", "d"], ["grandissement", "a"], ["tunnel", "c"], ["sensible", "b"], ["contraste", "a"], ["helium", "d"], ["image", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 612 });
})();
</script>
