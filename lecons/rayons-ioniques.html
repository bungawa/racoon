        <svg class="fig" id="cn6" viewBox="-0.2 -0.2 1 1" role="img" data-i18n-attr="aria-label:sec.aria6"></svg>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/quantique-schrodinger.js"></script>
<script src="/racoon/lecons/tableau-periodique-quantique.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, CA = ChimArchi;
const pm = x => F.qty(F.num(x * 1e12, 4), "pm"), pct = x => F.qty(F.fix(100 * x, 1), "%");
const row = (k, html) => `<div><span class="k">${k}</span><span>${html}</span></div>`;

/* ---------- différences de rayons tirées des mailles ---------- */
(() => {
  const A = CA.A_SEL_GEMME, R = CA.RAYONS, d = id => A[id] / 2;
  const L = [["KNa", "Cl", d("KCl") - d("NaCl")], ["KNa", "Br", d("KBr") - d("NaBr")], ["BrCl", "Na", d("NaBr") - d("NaCl")], ["BrCl", "K", d("KBr") - d("KCl")]];
  const ref = { KNa: R["K+"].r[6] - R["Na+"].r[6], BrCl: R["Br-"].r[6] - R["Cl-"].r[6] };
  $("differences").innerHTML = L.map(([q, autre, v]) => row(t("diff.k." + q), t("diff.v", { autre: t("diff.ion." + autre), v: pm(v), s: pm(ref[q]) }))).join("");
})();

/* ---------- section des trois polyèdres ---------- */
(() => {
  const sl = $("rsl"), CN = [8, 6, 4];
  function dessine(cn, rho) {
    const k = 60, svg = $("cn" + cn), s = CA.section(cn, rho), m = 1.15 * k, W = s.largeur * k + 2 * m, H = s.hauteur * k + 2 * m;
    svg.setAttribute("viewBox", `${-m} ${-m} ${W} ${H}`);
    svg.innerHTML = "";
    const xy = ([x, y]) => [x * k, (s.hauteur - y) * k];          // y vers le haut, anion de rayon k
    P("rect", { x: 0, y: 0, width: s.largeur * k, height: s.hauteur * k, class: "stroke thin dash c-label-2" }, svg);
    s.horsPlan.forEach(p => { const [x, y] = xy(p); P("circle", { cx: x, cy: y, r: k, class: "stroke dash c-label-2" }, svg); });
    s.anions.forEach(p => { const [x, y] = xy(p); P("circle", { cx: x, cy: y, r: k, class: "fill el-o", "fill-opacity": 0.75 }, svg); });
    const [cx, cy] = xy(s.cation); P("circle", { cx, cy, r: rho * k, class: "fill c-tint" }, svg);
    return s;
  }
  function upd() {
    const rho = +sl.value / 100;
    $("rread").textContent = F.fix(rho, 2);
    CN.forEach(cn => {
      const s = dessine(cn, rho);
      $("v" + cn).textContent = t("sec.v." + s.contact);
      $("f" + cn).textContent = t("sec.f", { rc: F.fix(CA.rapportCritique(cn), 3), jeu: F.fix(s.jeu, 2) });
    });
    $("vpred").textContent = t("sec.pred." + CA.coordinencePredite(rho));
  }
  sl.oninput = upd; upd();
})();

/* ---------- prédiction contre structure observée ---------- */
(() => {
  /* [composé, cation et coordinence, anion et coordinence, coordinence observée du cation (structure de type)] */
  const L = [["LiF", "Li+", 6, "F-", 6, 6, "NaCl"], ["NaCl", "Na+", 6, "Cl-", 6, 6, "NaCl"], ["MgO", "Mg2+", 6, "O2-", 6, 6, "NaCl"],
    ["CsCl", "Cs+", 8, "Cl-", 6, 8, "CsCl"], ["CaF2", "Ca2+", 8, "F-", 4, 8, "CaF2"], ["ZnS", "Zn2+", 4, "S2-", 6, 4, "ZnS"],
    ["KCl", "K+", 6, "Cl-", 6, 6, "NaCl"], ["LiI", "Li+", 6, "I-", 6, 6, "NaCl"]];
  const ids = L.map(l => l[0]), txt = textOf("comp.items", ids);
  $("composes").innerHTML = L.map(([id, c, cnc, a, cna, obs, type]) => {
    const rho = CA.rayon(c, cnc).r / CA.rayon(a, cna).r, pred = CA.coordinencePredite(rho);
    return row(txt[id], t(pred === obs ? "comp.ok" : "comp.ko", { rho: F.fix(rho, 2), pred, obs, type: t("comp.type." + type) }));
  }).join("");
})();

/* ---------- additivité dans quatre structures ---------- */
(() => {
  const IDS = ["NaCl", "CsCl", "CaF2", "ZnS"], txt = textOf("add.items", IDS);
  $("additivite").innerHTML = IDS.map(id => { const a = CA.additivite(id);
    return row(txt[id], t("add.v", { d: pm(a.d), s: pm(a.somme), c: pm(a.cation.r), a: pm(a.anion.r), e: (a.ecart >= 0 ? "+" : "") + pct(a.ecart) })); }).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wasastjerna", 1923, "idea"], ["goldschmidt", 1926, "idea"], ["pauling", 1927, "idea"], ["shannon", 1976, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["dopage", "geochimie"], u = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => row(t("uses.tag"), `<strong>${u[id].name}.</strong> ${u[id].text}`)).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["bord", "c"], ["convention", "a"], ["difference", "d"], ["flotte", "b"], ["csclp", "a"], ["kcl", "c"], ["zns", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 53 });
})();
</script>
