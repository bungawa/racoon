<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const signed = (v, unit) => (v < 0 ? F.MINUS : "") + F.si(Math.abs(v), unit, { sig: 3 });

/* ---------- §21-3 : le vecteur tournant et son ombre ---------- */
(() => {
  const R = 0.1, S = 320, C = 160, CY = 135, RP = 110, AX = 290;   // rayon 10 cm ; dessin 320 × 320, centre (160, 135), ombre sur y = 290
  const k = RP / R, deg = Math.PI / 180;
  let tm = 0, playing = true, last = null;
  const omega = () => +$("om").value, phi = () => +$("ph").value * deg;
  const arrow = (g, x1, y1, x2, y2, cls) => Plot.fleche(g, [x1, y1], [x2, y2], { cls, min: 2 });
  function draw() {
    const w = omega(), p = phi(), c = Osc.cercle(R, w, p, tm), T = 2 * Math.PI / w;
    /* the disc: radius vector, point, its shadow on the x axis, the centripetal acceleration and its x component */
    let svg = $("disc"); svg.innerHTML = ""; svg.setAttribute("viewBox", `0 0 ${S} ${S}`);
    const g = Plot.el("g", {}, svg), px = C + k * c.X, py = CY - k * c.Y;   // acceleration ω²R drawn as half the radius, towards O
    Plot.el("circle", { cx: C, cy: CY, r: RP, class: "stroke thin c-label-2" }, g);
    Plot.el("line", { x1: C - RP - 12, y1: AX, x2: C + RP + 12, y2: AX, class: "stroke thin c-label" }, g);
    Plot.el("line", { x1: C, y1: CY - RP - 8, x2: C, y2: AX + 8, class: "stroke thin dash c-label-2" }, g);
    Plot.el("line", { x1: px, y1: py, x2: px, y2: AX, class: "stroke thin dash c-label-2" }, g);
    arrow(g, C, CY, px, py, "c-tint");
    arrow(g, px, py, px + 0.5 * (C - px), py + 0.5 * (CY - py), "c-ko");
    arrow(g, px, AX, px + 0.5 * (C - px), AX, "c-ko");
    Plot.el("circle", { cx: px, cy: AX, r: 6, class: "fill c-warn" }, g);
    Plot.el("circle", { cx: px, cy: py, r: 5, class: "fill c-tint" }, g);
    Plot.el("text", { x: C - 14, y: CY - 6 }, g).textContent = t("disc.O");
    Plot.el("text", { x: px + 8, y: py - 8 }, g).textContent = t("disc.P");
    Plot.el("text", { x: px + 8, y: AX + 18 }, g).textContent = t("disc.S");
    /* x(t) of the shadow over the last two turns */
    svg = $("ombre"); svg.innerHTML = "";
    const t0 = Math.max(0, tm - 2 * T), t1 = Math.max(tm, 2 * T);
    const o = Plot.axes(svg, { fmt: F, w: S, h: S, pad: { b: 44, l: 52 }, x: { domain: [t0, t1], label: t("ombre.xaxis") }, y: { domain: [-12, 12], label: t("ombre.yaxis") } });
    const pts = Array.from({ length: 301 }, (_, i) => { const tt = t0 + (Math.min(tm, t1) - t0) * i / 300; return [o.x(tt), o.y(100 * Osc.cercle(R, w, p, tt).X)]; });
    Plot.el("path", { d: path(pts), class: "curve" }, o.g);
    Plot.el("circle", { cx: o.x(tm), cy: o.y(100 * c.X), r: 5, class: "dot" }, o.g);
    /* readouts */
    $("omv").textContent = F.qty(F.num(w, 2), "rad·s⁻¹");
    $("phv").textContent = (p < 0 ? F.MINUS : "") + F.num(Math.abs(+$("ph").value), 3) + "°";
    $("vx").textContent = signed(c.X, "m");
    $("vax").textContent = signed(c.ax, "m·s⁻²");
    $("vw2x").textContent = signed(-w * w * c.X, "m·s⁻²");
    $("vT").textContent = F.si(T, "s");
  }
  function frame(ts) {
    if (!playing) { last = null; return; }
    if (last != null) tm += Math.min(0.1, (ts - last) / 1000);
    last = ts; draw(); requestAnimationFrame(frame);
  }
  $("play").onclick = () => { playing = !playing; $("play").setAttribute("aria-pressed", String(playing)); $("play").textContent = t(playing ? "disc.pause" : "disc.play"); if (playing) requestAnimationFrame(frame); else draw(); };
  $("play").textContent = t("disc.pause");
  $("om").oninput = $("ph").oninput = draw;
  draw(); requestAnimationFrame(frame);
})();

/* ---------- §21-3 : dictionnaire cercle ↔ oscillateur ---------- */
(() => {
  const ROWS = ["rayon", "vitesse", "angle", "tour", "ordonnee"];
  const txt = textOf("dico.rows", ROWS);
  const row = (cells, role) => `<div role="row">${cells.map((c, i) => `<span class="${i ? "v" : ""}" role="${role}">${c}</span>`).join("")}</div>`;
  $("dico").innerHTML = row([t("dico.head.cercle"), t("dico.head.osc")], "columnheader") + ROWS.map(id => row([txt[id].cercle, txt[id].osc], "cell")).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cotes", 1714, "idea"], ["euler", 1748, "idea"], ["steinmetz", 1893, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["coulisse", "fresnel"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ombre", "a"], ["rapide", "c"], ["acc", "b"], ["rayon", "d"], ["phase", "a"], ["bielle", "c"], ["portrait", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 213 });
})();
</script>
