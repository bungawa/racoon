<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réflexion dans un miroir</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-principes" data-i18n="monde.principes"></a><span class="aux">›</span><a href="/racoon/etape?id=symetries-lois-conservation" data-i18n="etape.symetries-lois-conservation"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/operations-de-symetrie" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo>,</mo><mi>z</mi><mo stretchy="false">)</mo><mo>→</mo><mo stretchy="false">(</mo><mo>−</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo>,</mo><mi>z</mi><mo stretchy="false">)</mo><mspace width="0.8em"/><mtext data-i18n="eq.ou"></mtext><mspace width="0.8em"/><mover accent="true"><mi>r</mi><mo>→</mo></mover><mo>→</mo><mo>−</mo><mover accent="true"><mi>r</mi><mo>→</mo></mover></math></div>
    <p class="validite" data-i18n-html="val.miroir"></p>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure>
      <svg class="fig" id="mol" viewBox="0 0 640 300" role="img" data-i18n-attr="aria-label:mol.aria"></svg>
      <p class="aux" data-i18n="mol.legend"></p>
      <div class="panel">
        <div class="controls">
          <div class="seg" id="molecule" role="group" data-i18n-attr="aria-label:mol.choix">
            <button type="button" data-m="alanine" data-i18n="mol.alanine"></button><button type="button" data-m="glycine" data-i18n="mol.glycine"></button>
          </div>
        </div>
        <div class="controls">
          <button class="btn tinted" type="button" id="c3" data-i18n="mol.c3"></button><button class="btn tinted" type="button" id="c2" data-i18n="mol.c2"></button><button class="btn" type="button" id="raz" data-i18n="mol.reset"></button><button class="btn" type="button" id="cherche" data-i18n="mol.chercher"></button>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="mol.k.accord"></span><span class="v" id="vaccord"></span><span class="f" data-i18n="mol.f.accord"></span></div>
          <div class="stat"><span class="k" data-i18n="mol.k.rot"></span><span class="v" id="vrot"></span><span class="f" data-i18n="mol.f.rot"></span></div>
        </div>
        <p id="resultat"></p>
      </div>
      <figcaption data-i18n-html="mol.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="eq"><math display="block"><mi>α</mi><mo>=</mo><mo stretchy="false">[</mo><mi>α</mi><mo stretchy="false">]</mo><mspace width="0.15em"/><mi>ℓ</mi><mspace width="0.15em"/><mi>c</mi></math></div>
    <p class="validite" data-i18n-html="val.biot"></p>
    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="csl" data-i18n="pol.c"></label><output id="cread" for="csl"></output></div>
          <input id="csl" type="range" min="0" max="300" step="5" value="100"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="pol.k.d"></span><span class="v" id="vd"></span><span class="f" data-i18n="pol.f.d"></span></div>
          <div class="stat"><span class="k" data-i18n="pol.k.l"></span><span class="v" id="vl"></span><span class="f" data-i18n="pol.f.l"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="pol.caption"></figcaption>
    </figure>
    <p data-i18n-html="s3.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/reflexion-dans-un-miroir.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/principes.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, Pr = Principes;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); };

/* ---------- la molécule et son image ---------- */
(() => {
  const GROUPES = { H: "c-label-2", CH3: "t-chim", NH2: "c-tint", COOH: "c-warn" };
  const nom = textOf("mol.g", Object.keys(GROUPES));
  const MOL = { alanine: ["H", "CH3", "NH2", "COOH"], glycine: ["H", "H", "NH2", "COOH"] };
  const C3 = Tenseurs.rotation(Pr.TETRAEDRE[0], 2 * Math.PI / 3), C2 = Tenseurs.rotation([1, 0, 0], Math.PI), ID = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  /* the view: the mirror's normal is the screen's horizontal, so the image is the left–right mirror of the molecule */
  const a = 1.2, nx = Pr.MIROIR_TETRA, d = [Math.SQRT1_2, Math.SQRT1_2, 0];
  const up = [0, 1, 2].map(i => Math.cos(a) * [0, 0, 1][i] - Math.sin(a) * d[i]), deep = Tenseurs.vectoriel(nx, up);
  const dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
  const svg = $("mol"), K = 95;
  let subst = MOL.alanine, R = ID, n = 0;
  function dessin(pos, ox) {
    const g = P("g", {}, svg), cy = 170;
    const pts = pos.map((p, j) => ({ x: ox + K * dot(p, nx), y: cy - K * dot(p, up), z: dot(p, deep), lab: subst[j] })).sort((u, v) => v.z - u.z);
    pts.forEach(q => P("line", { x1: ox, y1: cy, x2: q.x, y2: q.y, class: "stroke c-label-2" }, g));
    P("circle", { cx: ox, cy, r: 12, class: "fill c-label" }, g);
    pts.forEach(q => {
      P("circle", { cx: q.x, cy: q.y, r: (q.lab === "H" ? 13 : 19) * (1 - 0.15 * q.z), class: "fill rim " + GROUPES[q.lab] }, g);
      P("text", { x: q.x, y: q.y > cy ? q.y + 32 : q.y - 24, "text-anchor": "middle" }, g).textContent = nom[q.lab];
    });
  }
  function upd() {
    svg.innerHTML = "";
    P("line", { x1: 320, x2: 320, y1: 20, y2: 290, class: "stroke dash c-label-2" }, svg);
    P("text", { x: 326, y: 290 }, svg).textContent = t("mol.miroir");
    dessin(Pr.TETRAEDRE, 160);
    dessin(Pr.TETRAEDRE.map(e => Tenseurs.appliquer(R, Pr.reflechir(e, Pr.MIROIR_TETRA))), 480);
    const ac = Pr.accord(subst, R);
    $("vaccord").textContent = F.num(ac.memes, 1);
    $("vrot").textContent = F.num(n, 3);
  }
  const tourner = Q => { R = Tenseurs.produit(R, Q); n++; $("resultat").textContent = ""; upd(); };
  $("c3").onclick = () => tourner(C3);
  $("c2").onclick = () => tourner(C2);
  $("raz").onclick = () => { R = ID; n = 0; $("resultat").textContent = ""; upd(); };
  $("cherche").onclick = () => {
    const s = Pr.superposable(subst);
    R = s.R; n = 0;
    $("resultat").textContent = s.superposable ? t("mol.res.achiral") : t("mol.res.chiral", { n: F.num(s.meilleur, 1) });
    upd();
  };
  seg($("molecule"), "m", m => { subst = MOL[m]; R = ID; n = 0; $("resultat").textContent = ""; upd(); });
})();

/* ---------- pouvoir rotatoire ---------- */
(() => {
  const L = 0.2, sl = $("csl");
  const upd = () => {
    const c = +sl.value, al = Pr.rotationOptique(Pr.POUVOIR_SACCHAROSE, L, c);
    $("cread").textContent = F.qty(F.num(c, 3), "kg·m⁻³");
    $("vd").textContent = F.qty(F.fix(al, 1), "°");
    $("vl").textContent = F.qty(F.fix(-al, 1), "°");
  };
  sl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["biot", 1815, "experiment"], ["pasteur", 1848, "experiment"], ["vanthoff", 1874, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["saccharimetre"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["horloge", "b"], ["droite", "c"], ["chirale", "d"], ["accord", "c"], ["biot", "b"], ["synthese", "a"], ["vivant", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 5204 });
})();
</script>
</body>
</html>
