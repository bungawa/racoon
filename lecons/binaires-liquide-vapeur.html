<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, B = ChimSolutions.Binaires;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- diagramme isobare (T, x) ---------- */
(() => {
  const svg = $("tx"), sx = $("txx"), sT = $("txT"), PA = 101300;
  const SYS = {
    "benzene-toluene": { s: "benzene-toluene", T: [350, 388], p: B.P_ATM },
    "ethanol-eau": { s: "ethanol-eau", T: [349, 376], p: PA },
    ideal: { s: { a: "ethanol", b: "eau" }, T: [349, 376], p: PA, ref: "ethanol-eau" },
  };
  const DOM = textOf("tx.dom", ["L", "V", "L+V"]);
  let cur = "benzene-toluene", ax;
  const xOf = () => +sx.value / 1000, TOf = () => SYS[cur].T[0] + (SYS[cur].T[1] - SYS[cur].T[0]) * +sT.value / 1000;
  function dessiner() {
    const S = SYS[cur];
    svg.textContent = "";
    ax = Plot.axes(svg, { fmt: F, w: 640, h: 380, pad: { b: 44, l: 60 },
      x: { domain: [0, 1], label: t(cur === "benzene-toluene" ? "tx.xlab.bt" : "tx.xlab.ee"), fmt: v => F.num(v, 2) },
      y: { domain: S.T, label: t("tx.ylab") } });
    const { x, y, g } = ax, c = B.courbes(S.s, S.p, 200);
    if (S.ref) {                                             // the measured mixture, in grey behind the ideal model
      const m = B.courbes(S.ref, S.p, 200);
      P("path", { d: Plot.path(m.map(q => [x(q.x), y(q.T)])), class: "stroke thin dash c-label-2" }, g);
      P("path", { d: Plot.path(m.map(q => [x(q.y), y(q.T)])), class: "stroke thin dash c-label-2" }, g);
    }
    P("path", { d: Plot.path(c.map(q => [x(q.x), y(q.T)])), class: "stroke c-tint" }, g);
    P("path", { d: Plot.path(c.map(q => [x(q.y), y(q.T)])), class: "stroke c-warn" }, g);
    const mes = (B.SYSTEMES[S.ref || (typeof S.s === "string" ? S.s : "")] || {}).mesures;
    if (mes) mes.forEach(([xm, Tm, ym]) => { P("circle", { cx: x(xm), cy: y(Tm), r: 2.5, class: "fill c-label-2" }, g); P("circle", { cx: x(ym), cy: y(Tm), r: 2.5, class: "fill c-label-2" }, g); });
    const az = B.azeotrope(S.s, S.p);
    if (az) { P("circle", { cx: x(az.x), cy: y(az.T), r: 5, class: "fill c-warn" }, g);
      P("text", { x: x(az.x), y: y(az.T) - 12, "text-anchor": "middle" }, g).textContent = t("tx.az"); }
    const ZONES = textOf("tx.zones", ["L", "V"]);
    P("text", { x: x(0.5), y: y(S.T[0] + 0.06 * (S.T[1] - S.T[0])), "text-anchor": "middle" }, g).textContent = ZONES.L;
    P("text", { x: x(0.5), y: y(S.T[1] - 0.06 * (S.T[1] - S.T[0])), "text-anchor": "middle" }, g).textContent = ZONES.V;
    ax.conode = P("path", { class: "stroke thin dash c-label-2" }, g);
    ax.dot = P("circle", { r: 6, class: "dot" }, g);
  }
  function upd() {
    const S = SYS[cur], x0 = xOf(), T = TOf(), { x, y } = ax, c = B.conode(S.s, x0, T, S.p);
    $("txxv").textContent = F.fix(x0, 3); $("txTv").innerHTML = F.kelvin(T);
    ax.dot.setAttribute("cx", x(x0)); ax.dot.setAttribute("cy", y(T));
    $("txdom").textContent = DOM[c.domaine].name; $("txdomf").textContent = DOM[c.domaine].text;
    if (c.domaine === "L+V") {
      ax.conode.setAttribute("d", Plot.path([[x(c.xL), y(T)], [x(c.yV), y(T)]]));
      $("txph").textContent = t("tx.f.comp", { l: F.fix(c.xL, 3), v: F.fix(c.yV, 3) });
      $("txphf").textContent = t("tx.f.frac", { v: F.num(100 * c.fV, 3) });
    } else { ax.conode.setAttribute("d", ""); $("txph").textContent = "–"; $("txphf").textContent = t("tx.f.une"); }
    const b = B.bulle(S.s, x0, S.p), az = B.azeotrope(S.s, S.p);
    let Tr;                                                   // dew temperature of x0: the vapour curve at height T
    if (az && Math.abs(x0 - az.x) < 1e-3) Tr = az.T;
    else { const lo = az ? (x0 < az.x ? 0 : az.x) : 0, hi = az ? (x0 < az.x ? az.x : 1) : 1, cs = B.courbes(S.s, S.p, 400).filter(q => q.x >= lo && q.x <= hi);
      let k = cs.findIndex((q, i) => i > 0 && (cs[i - 1].y - x0) * (q.y - x0) <= 0);
      Tr = k > 0 ? cs[k - 1].T + (cs[k].T - cs[k - 1].T) * (x0 - cs[k - 1].y) / (cs[k].y - cs[k - 1].y) : b.T; }
    $("txb").innerHTML = t("tx.f.bornes", { b: F.kelvin(b.T), r: F.kelvin(Tr) });
    $("txbf").textContent = az && Math.abs(x0 - az.x) < 2e-3 ? t("tx.f.az") : t("tx.f.ecart", { d: F.num(Tr - b.T, 2) });
  }
  const segs = $("sys").querySelectorAll("button");
  const choisir = m => { cur = m; segs.forEach(bt => bt.setAttribute("aria-pressed", String(bt.dataset.m === m))); dessiner(); upd(); };
  segs.forEach(bt => bt.onclick = () => choisir(bt.dataset.m));
  sx.oninput = sT.oninput = upd;
  choisir(cur);
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["konovalov", 1881, "idea"], ["raoult", 1887, "experiment"], ["wade", 1911, "experiment"], ["lai", 2014, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["bioethanol", "hcl", "colonne"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["variance", "c"], ["raoult", "a"], ["vapeur", "d"], ["moments", "b"], ["azeo", "c"], ["max", "a"], ["pression", "d"], ["massique", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
