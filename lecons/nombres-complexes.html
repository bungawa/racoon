<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
/* typographie française partout, sauf le <h1> : il reste identique au titre de lecons/index.json */
const main = document.querySelector("main");
F.autoTypo(main);
document.title = t("title");
const $ = id => document.getElementById(id);
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };

/* ---------- le plan complexe : deux nombres à déplacer, une opération ---------- */
(() => {
  const svg = $("plane"), P = Plot.el, O = [320, 200], K = 70, seg = $("pseg");
  const S = { zr: $("zr"), zt: $("zt"), wr: $("wr"), wt: $("wt") };
  let op = "mul", drag = null;
  const px = z => [O[0] + K * z.re, O[1] - K * z.im];
  const num = x => F.num(x, 3), cx = z => Cx.text(z, num);
  const ang = th => t("pl.angle", { r: F.num(th, 3), d: F.num(th * 180 / Math.PI, 3) });
  const polarText = z => Cx.abs(z) === 0 ? t("pl.polar0") : t("pl.polar", { r: num(Cx.abs(z)), a: ang(Cx.arg(z)) });
  const get = () => ({ z: Cx.polar(+S.zr.value, +S.zt.value), w: Cx.polar(+S.wr.value, +S.wt.value) });
  function result(z, w) {
    if (op === "add") return Cx.add(z, w);
    if (op === "mul") return Cx.mul(z, w);
    if (op === "conj") return Cx.conj(z);
    return Cx.abs(w) === 0 ? null : Cx.div(z, w);
  }
  function arrow(z, cls, label) {
    const [x, y] = px(z);
    Plot.fleche(svg, O, [x, y], { cls, tete: 10 });
    P("text", { x: x + 8, y: y - 8 }, svg).textContent = label;
  }
  function arc(th, rad, cls) {
    if (Math.abs(th) < 1e-3) return;
    const a = [O[0] + rad, O[1]], b = [O[0] + rad * Math.cos(th), O[1] - rad * Math.sin(th)];
    P("path", { d: `M${a[0]},${a[1]} A${rad},${rad} 0 ${Math.abs(th) > Math.PI ? 1 : 0} ${th > 0 ? 0 : 1} ${b[0].toFixed(1)},${b[1].toFixed(1)}`, class: "stroke thin " + cls }, svg);
  }
  function draw(z, w, r) {
    svg.innerHTML = "";
    P("line", { x1: 10, x2: 630, y1: O[1], y2: O[1], class: "stroke thin c-label-2" }, svg);
    P("line", { x1: O[0], x2: O[0], y1: 10, y2: 390, class: "stroke thin c-label-2" }, svg);
    P("text", { x: 600, y: O[1] - 8 }, svg).textContent = t("pl.re");
    P("text", { x: O[0] + 8, y: 22 }, svg).textContent = t("pl.im");
    P("circle", { cx: O[0], cy: O[1], r: K, class: "stroke thin dash c-label-2" }, svg);
    P("text", { x: O[0] + K + 4, y: O[1] + 16 }, svg).textContent = "1";
    if (op === "add") P("polyline", { points: [px(z), px(r), px(w)].map(p => p.join(",")).join(" "), class: "stroke thin dash c-label-2" }, svg);
    if (op === "mul" || op === "div") { arc(Cx.arg(z), 26, "c-tint"); arc(Cx.arg(w), 36, "c-warn"); if (r) arc(Cx.arg(r), 46, "c-label"); }
    arrow(z, "c-tint", t("pl.lbl.z"));
    if (op !== "conj") arrow(w, "c-warn", t("pl.lbl.w"));
    if (r) arrow(r, "c-label", t("pl.lbl." + op));
    [["z", z], ["w", w]].forEach(([k, v]) => { if (k === "w" && op === "conj") return; const [x, y] = px(v); P("circle", { cx: x, cy: y, r: 9, class: "handle", "data-h": k }, svg); });
  }
  function upd() {
    const { z, w } = get(), r = result(z, w);
    $("zrv").textContent = num(+S.zr.value);
    $("ztv").textContent = ang(+S.zt.value); $("wrv").textContent = num(+S.wr.value); $("wtv").textContent = ang(+S.wt.value);
    $("pz").textContent = cx(z); $("pzf").textContent = polarText(z);
    $("pw").textContent = cx(w); $("pwf").textContent = polarText(w);
    $("prk").textContent = t("pl.res." + op);
    $("pr").textContent = r ? cx(r) : "–"; $("prf").textContent = r ? polarText(r) : t("pl.divzero");
    const sumArg = Cx.arg(z) + (op === "mul" ? Cx.arg(w) : -Cx.arg(w));
    $("pcheck").textContent = !r ? "" : op === "mul" ? t("pl.check.mul", { p: num(Cx.abs(z) * Cx.abs(w)), s: ang(sumArg), w: ang(Cx.wrap(sumArg)) })
      : op === "div" ? t("pl.check.div", { p: num(Cx.abs(z) / Cx.abs(w)), s: ang(sumArg), w: ang(Cx.wrap(sumArg)) })
      : op === "add" ? t("pl.check.add", { s: num(Cx.abs(r)), a: num(Cx.abs(z) + Cx.abs(w)) })
      : t("pl.check.conj", { p: num(Cx.abs2(z)) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.op === op)));
    draw(z, w, r);
  }
  /* glisser une poignée : la position devient module et argument, arrondis au pas des curseurs */
  function toPlane(e) { const m = svg.getScreenCTM().inverse(), p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m); return Cx.c((p.x - O[0]) / K, (O[1] - p.y) / K); }
  svg.addEventListener("pointerdown", e => { const h = e.target.dataset && e.target.dataset.h; if (h) { drag = h; svg.setPointerCapture(e.pointerId); } });
  svg.addEventListener("pointermove", e => { if (!drag) return; const z = toPlane(e), r = Math.min(2.4, Cx.abs(z));
    S[drag + "r"].value = r; if (r > 0) S[drag + "t"].value = Cx.arg(z); upd(); });
  svg.addEventListener("pointerup", () => { drag = null; });
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { op = x.dataset.op; upd(); });
  Object.values(S).forEach(s => s.oninput = upd); upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cardano", 1545, "idea"], ["bombelli", 1572, "idea"], ["wessel", 1799, "idea"], ["argand", 1806, "idea"], ["gauss", 1831, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["oscillateur", "circuit", "quantique"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["produit", "a"], ["module", "a"], ["rotation", "a"], ["argsum", "a"], ["ordre", "a"], ["cardano", "a"], ["amorti", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => { const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) }; }), { t, seed: 26 });
})();
</script>
