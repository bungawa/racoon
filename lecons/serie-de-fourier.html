<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §50-2 : la somme des N premiers harmoniques d'une forme, sur deux périodes, et ses amplitudes Aₙ ---------- */
(() => {
  const O = self.Ondes, NB = 20, M = 1200, US = Array.from({ length: M + 1 }, (_, i) => 2 * i / M);
  let nom = "creneau";
  function upd() {
    const N = +$("nn").value, q = +$("qq").value, Fo = O.signal(nom, q), S = O.partielle(Fo, N);
    const A = n => Math.hypot(Fo.a(n), Fo.b(n));
    const svg = $("sy"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 220, pad: { l: 52, b: 44 }, x: { domain: [0, 2], label: t("sy.xaxis") }, y: { domain: [-1.4, 1.4], label: t("sy.yaxis") } });
    Plot.el("path", { d: Plot.path(US.map(u => [P.x(u), P.y(Fo.f(u))])), class: "stroke thin c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(US.map(u => [P.x(u), P.y(Math.max(-1.4, Math.min(1.4, S(u))))])), class: "stroke c-tint" }, P.g);
    const bs = $("sp"); bs.innerHTML = "";
    const amax = Math.max(...Array.from({ length: NB }, (_, i) => A(i + 1)));
    const B = Plot.axes(bs, { fmt: F, w: 640, h: 170, pad: { l: 52, b: 44 }, x: { domain: [0.4, NB + 0.6], label: t("sp.xaxis"), ticks: 10 }, y: { domain: [0, 1.1 * amax], label: t("sp.yaxis") } });
    for (let n = 1; n <= NB; n++) { const v = A(n), w = (B.x(1) - B.x(0)) * 0.6;
      Plot.el("rect", { x: B.x(n) - w / 2, y: B.y(v), width: w, height: Math.max(0, B.y(0) - B.y(v)), class: "fill " + (n <= N ? "c-tint" : "c-label-2") }, B.g); }
    /* le dernier harmonique non nul ajouté, rapporté au fondamental */
    let nd = N; while (nd > 1 && A(nd) < 1e-12) nd--;
    const e = O.ecartForme(Fo, N, 6000);
    $("nnv").textContent = String(N); $("qqv").textContent = F.num(q, 2);
    $("fo").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.f === nom)));
    $("vd").textContent = F.num(A(nd) / A(1), 3); $("fd").textContent = t("sy.f.dernier", { n: nd });
    $("vp").textContent = F.num(e.haut, 4); $("fp").textContent = t("sy.f.pic", { c: F.num(e.haut - e.depassement, 3) });
  }
  $("fo").querySelectorAll("button").forEach(x => x.onclick = () => { nom = x.dataset.f; upd(); });
  ["nn", "qq"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fourier", 1807, "idea"], ["theorie", 1822, "idea"], ["michelson", 1898, "experiment"], ["gibbs", 1899, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["analyseur", "distorsion"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["periode", "b"], ["phase", "d"], ["moyenne", "a"], ["air", "c"], ["decroissance", "b"], ["gibbs", "a"], ["absent", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 502 });
})();
</script>
