<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, $ = id => document.getElementById(id), sym = s => t("chim.sym", { s });
const poser = (id, d) => { const svg = $(id); svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };
const BETA = 74;                         // |β| en kJ·mol⁻¹, calé sur la stabilisation du benzène (2|β| ≈ 148 kJ·mol⁻¹)

/* ---------- les électrophiles ---------- */
const REACTIONS = [
  ["bromation", { E: "Br", el: "Br" }, "Br"], ["nitration", { E: "NO₂", el: "N" }, "NO2"],
  ["alkylation", { E: "CH₃", el: "C", h: 3 }, "CH3"], ["acylation", { E: "COCH₃", el: "C", h: 3 }, "COCH3"],
];
(() => {
  const g = textOf("gen.rows", REACTIONS.map(r => r[0]));
  $("generation").innerHTML = REACTIONS.map(([id]) => `<div><span class="k">${t("fig." + id)}</span><span>${g[id]}</span></div>`).join("");
})();

/* ---------- le mécanisme en deux actes ---------- */
(() => {
  const bilans = textOf("fig.bilans", REACTIONS.map(r => r[0]));
  let cle = "bromation";
  function maj() {
    const [, E, sub] = REACTIONS.find(r => r[0] === cle), o = { texte: sym, echelle: 30 };
    const a = O.areneMol({ electrophile: Object.assign({ a: 0 }, E) });
    poser("m1", O.dessinArene(Object.assign({ electrophile: Object.assign({ a: 0 }, E), fleches: [{ de: [0, 1], vers: [0, a.E] }] }, o)));
    const w = O.areneMol({ wheland: Object.assign({ a: 0, plus: 1 }, E) });
    poser("m2", O.dessinArene(Object.assign({ wheland: Object.assign({ a: 0, plus: 1 }, E), fleches: [{ de: [0, w.H], vers: [0, 1] }] }, o)));
    poser("m3", O.dessinArene(Object.assign({ subs: { 0: sub } }, o)));
    $("bilan").textContent = bilans[cle];
    document.querySelectorAll("#reaction button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.r === cle)));
  }
  $("reaction").onclick = e => { const b = e.target.closest("button"); if (!b) return; cle = b.dataset.r; maj(); };
  maj();
})();

/* ---------- formes mésomères de l'intermédiaire ---------- */
[1, 3, 5].forEach(p => poser("f" + p, O.dessinArene({ wheland: { a: 0, plus: p, E: "E", el: "Br" }, texte: sym, echelle: 30 })));

/* ---------- échelle des énergies π ---------- */
(() => {
  const e = O.etatsSEAr(), perte = s => (e.benzene - s) * BETA;
  const ETATS = [["benzene", 0, perte(e.benzene)], ["wheland", 1, perte(e.wheland)], ["substitution", 2, perte(e.substitution)], ["addition", 2, perte(e.addition)]];
  const noms = textOf("ech.noms", ETATS.map(s => s[0]));
  const { x, y, g } = Plot.axes($("echelle"), { fmt: F, w: 520, h: 280, pad: { b: 30, l: 60 },
    x: { domain: [0, 3], ticks: 1, fmt: () => "" }, y: { domain: [0, 300], label: t("ech.y") } });
  ETATS.forEach(([id, k, E]) => {
    const dx = id === "addition" ? 0.18 : id === "substitution" ? -0.18 : 0, c = x(k + 0.5 + dx);
    Plot.el("line", { x1: c - 34, x2: c + 34, y1: y(E), y2: y(E), class: id === "addition" ? "ref" : "curve" }, g);
    Plot.el("text", { x: c, y: y(E) - 8, "text-anchor": "middle", class: "note" }, g).textContent = noms[id];
    Plot.el("text", { x: c, y: y(E) + 16, "text-anchor": "middle", class: "tick" }, g).textContent = F.qty(F.num(E, 3), "kJ·mol⁻¹");
  });
})();

/* ---------- Friedel et Crafts : ce qui limite ---------- */
(() => {
  const L = ["polyalkylation", "transposition", "desactive", "acylation"], txt = textOf("lim.rows", L), k = textOf("lim.k", L);
  $("limites").innerHTML = L.map(id => `<div><span class="k">${k[id]}</span><span>${txt[id]}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["friedel", 1877, "experiment"], ["wheland", 1942, "idea"], ["ingold", 1946, "experiment"], ["melander", 1950, "experiment"], ["reed", 2003, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ethylbenzene", "cumene"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["electrophile", "b"], ["wheland", "d"], ["isotope", "a"], ["choix", "c"], ["poly", "b"], ["propyle", "a"], ["nitro", "d"], ["acyle", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1877 });
})();
</script>
