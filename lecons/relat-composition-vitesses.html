<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, c = Constantes.c;
const enC = x => F.num(x, 4) + "\u00a0c";

/* ---------- le plan des vitesses : toutes les directions d'une vitesse v' prise dans le vaisseau, vues du sol ---------- */
(() => {
  const svg = $("plan"), su = $("su"), sv = $("sv"), sth = $("sth");
  function draw() {
    const u = +su.value / 100 * c, w = +sv.value / 100 * c, th = +sth.value * Math.PI / 180;
    const dirs = Array.from({ length: 361 }, (_, i) => i * Math.PI / 180);
    const ein = dirs.map(a => R.composerVecteur(u, [w * Math.cos(a), w * Math.sin(a), 0]));
    const gal = dirs.map(a => [u + w * Math.cos(a), w * Math.sin(a)]);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 400, pad: { l: 52, b: 44 }, x: { domain: [-2, 2], label: t("fig.xaxis") }, y: { domain: [-1.25, 1.25], label: t("fig.yaxis") } });
    const pt = v => [P.x(v[0] / c), P.y(v[1] / c)];
    Plot.el("path", { d: Plot.path(dirs.map(a => [P.x(Math.cos(a)), P.y(Math.sin(a))])), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("line", { x1: P.x(-2), x2: P.x(2), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("path", { d: Plot.path(gal.map(pt)), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(ein.map(pt)), class: "curve" }, P.g);
    const e = R.composerVecteur(u, [w * Math.cos(th), w * Math.sin(th), 0]), g = [u + w * Math.cos(th), w * Math.sin(th)];
    Plot.fleche(P.g, pt([0, 0]), pt([u, 0]), { cls: "c-label-2" });
    Plot.fleche(P.g, pt([0, 0]), pt(e), { cls: "c-tint" });
    Plot.fleche(P.g, pt([0, 0]), pt(g), { cls: "c-warn", trait: "stroke dash" });
    /* the numbers */
    const ne = Math.hypot(e[0], e[1]), ng = Math.hypot(...g), deg = v => F.qty(F.num(Math.atan2(v[1], v[0]) * 180 / Math.PI, 3), "°");
    $("sur").textContent = enC(u / c); $("svr").textContent = enC(w / c); $("sthr").textContent = F.qty(sth.value, "°");
    $("ve").textContent = enC(ne / c);
    $("fe").textContent = t("fig.f.einstein", { a: deg(e), vx: F.num(e[0] / c, 4), vy: F.num(e[1] / c, 4) });
    $("vg").textContent = enC(ng / c);
    $("fg").textContent = t(ng > c ? "fig.f.galilee.trop" : "fig.f.galilee", { a: deg(g) });
    /* rapidities add along x only: shown for the collinear part, θ = 0 or 180° */
    const col = th === 0 || +sth.value === 180, wx = w * Math.cos(th);
    if (col && Math.abs(wx) < c) {
      const pu = R.rapidite(u), pv = R.rapidite(wx);
      $("vr").textContent = F.num(pu, 3) + " + " + F.num(pv, 3) + " = " + F.num(pu + pv, 3);
      $("fr").textContent = t("fig.f.rapidite", { v: enC(R.deRapidite(pu + pv) / c) });
    } else { $("vr").textContent = "–"; $("fr").textContent = t(col ? "fig.f.lumiere" : "fig.f.oblique"); }
  }
  su.oninput = sv.oninput = sth.oninput = draw; draw();
})();

/* ---------- les systèmes décrits : un avion qui tire, et deux protons du LHC ---------- */
(() => {
  const u = 300, v = 300, r = R.composer(u, v);
  $("sys1").innerHTML = t("sys1.body", { u: F.si(u, "m·s⁻¹"), v: F.si(v, "m·s⁻¹"), e: F.sci(u * v / c ** 2, 2), d: F.qty(F.sci(u + v - r, 3), "m·s⁻¹") });
  const E = 6.8e12 * Constantes.e, m = Constantes.m_p, g = E / (m * c * c), b = Math.sqrt((1 - 1 / g) * (1 + 1 / g));
  const grel = 2 * g * g - 1;                                           // γ of one proton seen from the other: γ(v ⊕ v) = 2γ² \u2212 1
  $("sys2").innerHTML = t("sys2.body", { g: F.num(g, 4), b: F.sci(1 - b, 2), grel: F.sci(grel, 3), brel: F.sci(1 / (2 * grel * grel), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fizeau", 1851, "experiment"], ["einstein", 1905, "idea"], ["laue", 1907, "idea"], ["alvager", 1964, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lhc"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["moitie", "c"], ["lumiere", "a"], ["denominateur", "d"], ["transverse", "b"], ["fizeau", "c"], ["rapidite", "a"], ["faible", "b"], ["relative", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 163 });
})();
</script>
