<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
function clip(svg, id, o, x0, x1, y0, y1) { const c = Plot.el("clipPath", { id }, svg); Plot.el("rect", { x: o.x(x0), y: o.y(y1), width: o.x(x1) - o.x(x0), height: o.y(y0) - o.y(y1) }, c); return Plot.el("g", { "clip-path": `url(#${id})` }, o.g); }

/* ---------- §23-2 : réponse en fréquence et mouvement calculé pas à pas ---------- */
(() => {
  const M = 0.2, K = 20, W0 = Osc.pulsation(K, M), F0 = 0.05, f = F0 / M, XS = F0 / K, T0 = 2 * Math.PI / W0;   // ω₀ = 10 rad·s⁻¹, F₀/k = 2,5 mm : Q·F₀/k < mg/k = 9,8 cm up to Q = 39
  const RS = Array.from({ length: 581 }, (_, i) => 0.1 + 2.9 * i / 580);
  const cap = v => Math.min(Math.max(v, 1e-3), 1e3);
  function upd() {
    const Q = 10 ** +$("q").value, r = +$("r").value, w = r * W0, X = Resonance.reponse(W0, Q, w, f);
    const er = Resonance.resonanceElongation(W0, Q);
    /* gains: |x̂|/(F₀/k) and |v̂|/(F₀/(mω₀)) */
    let svg = $("gain"); svg.innerHTML = "";
    let o = Plot.axes(svg, { fmt: F, w: 320, h: 280, pad: { b: 44, l: 52 }, x: { domain: [0, 3], label: t("gain.xaxis") }, y: { scale: "log", domain: [1e-2, 1e2], label: t("gain.yaxis") } });
    let g = clip(svg, "gainclip", o, 0, 3, 1e-2, 1e2);
    const gx = q => Resonance.reponse(W0, Q, q * W0, f).module / XS, gv = q => Resonance.reponse(W0, Q, q * W0, f).vitesse.module / (f / W0);
    Plot.el("line", { x1: o.x(1), x2: o.x(1), y1: o.y(1e-2), y2: o.y(1e2), class: "stroke thin dash c-label-2" }, g);
    Plot.el("line", { x1: o.x(0), x2: o.x(3), y1: o.y(Q / Math.SQRT2), y2: o.y(Q / Math.SQRT2), class: "stroke thin dash c-label-2" }, g);
    Plot.el("path", { d: path(RS.map(q => [o.x(q), o.y(cap(gv(q)))])), class: "stroke c-warn" }, g);
    Plot.el("path", { d: path(RS.map(q => [o.x(q), o.y(cap(gx(q)))])), class: "curve" }, g);
    Plot.el("circle", { cx: o.x(r), cy: o.y(cap(gx(r))), r: 5, class: "dot" }, g);
    Plot.el("circle", { cx: o.x(r), cy: o.y(cap(gv(r))), r: 4, class: "fill c-warn" }, g);
    /* lags behind the force: x in [0, π], v in [−π/2, π/2] */
    svg = $("phase"); svg.innerHTML = "";
    o = Plot.axes(svg, { fmt: F, w: 320, h: 280, pad: { b: 44, l: 52 }, x: { domain: [0, 3], label: t("gain.xaxis") }, y: { domain: [-1.6, 3.2], label: t("phase.yaxis") } });
    g = clip(svg, "phaseclip", o, 0, 3, -1.6, 3.2);
    [0, Math.PI / 2, Math.PI].forEach(p => Plot.el("line", { x1: o.x(0), x2: o.x(3), y1: o.y(p), y2: o.y(p), class: "stroke thin dash c-label-2" }, g));
    Plot.el("path", { d: path(RS.map(q => [o.x(q), o.y(Resonance.reponse(W0, Q, q * W0, f).vitesse.retard)])), class: "stroke c-warn" }, g);
    Plot.el("path", { d: path(RS.map(q => [o.x(q), o.y(Resonance.reponse(W0, Q, q * W0, f).retard)])), class: "curve" }, g);
    Plot.el("circle", { cx: o.x(r), cy: o.y(X.retard), r: 5, class: "dot" }, g);
    /* motion from rest, step by step (Integ), until the steady state */
    const T = 2 * Math.PI / w, tend = Math.min(60, Math.max(6 * T0, Resonance.etablissement(W0, Q, 1e-3) + 2 * T));
    const n = Math.max(100, Math.ceil(100 * T / T0)), S = Resonance.simuler(W0, Q, w, f, Math.ceil(tend / T), n);
    const keep = Math.max(1, Math.floor(S.t.length / 1500)), idx = S.t.map((_, k) => k).filter(k => k % keep === 0);
    const big = 100 * Math.max(X.module, ...S.x.map(Math.abs)) * 1.15, TE = S.t[S.t.length - 1];
    svg = $("trace"); svg.innerHTML = "";
    o = Plot.axes(svg, { fmt: F, w: 660, h: 240, pad: { b: 44, l: 52 }, x: { domain: [0, TE], label: t("trace.xaxis") }, y: { domain: [-big, big], label: t("trace.yaxis") } });
    g = clip(svg, "traceclip", o, 0, TE, -big, big);
    Plot.el("path", { d: path(idx.map(k => [o.x(S.t[k]), o.y(0.9 * big * Math.cos(w * S.t[k]))])), class: "stroke thin c-label-2" }, g);
    Plot.el("path", { d: path(idx.map(k => [o.x(S.t[k]), o.y(100 * X.x(S.t[k]))])), class: "ref" }, g);
    Plot.el("path", { d: path(idx.map(k => [o.x(S.t[k]), o.y(100 * S.x[k])])), class: "curve" }, g);
    /* readouts */
    const P = Resonance.puissances(M, W0, Q, w, F0), pin = Resonance.moyenne(S, (tt, x, v) => F0 * Math.cos(w * tt) * v), pout = Resonance.moyenne(S, (tt, x, v) => P.c * v * v);
    $("qv").textContent = F.num(Q, 3); $("rv").textContent = t("fa.rv", { r: F.fix(r, 2), w: F.qty(F.num(w, 3), "rad·s⁻¹") });
    $("vx").textContent = F.si(X.module, "m"); $("fx").textContent = t("fa.f.x", { n: F.num(X.module / XS, 3) });
    $("vphi").textContent = F.qty(F.fix(X.retard, 2), "rad"); $("fphi").textContent = t(X.retard < Math.PI / 4 ? "fa.f.phi.phase" : X.retard > 3 * Math.PI / 4 ? "fa.f.phi.opp" : "fa.f.phi.quad");
    if (er) { $("vres").textContent = F.qty(F.num(er.w, 3), "rad·s⁻¹"); $("fres").textContent = t("fa.f.res", { g: F.num(er.gain, 3) }); }
    else { $("vres").textContent = t("fa.v.nores"); $("fres").textContent = t("fa.f.nores"); }
    $("vbande").textContent = F.qty(F.num(W0 / Q, 3), "rad·s⁻¹");
    $("vetab").textContent = F.si(Resonance.etablissement(W0, Q, 0.05), "s");
    $("vp").textContent = F.si(P.fournie, "W"); $("fp").textContent = t("fa.f.p", { pin: F.si(pin, "W"), pout: F.si(pout, "W") });
  }
  $("q").oninput = $("r").oninput = upd; upd();
})();

/* ---------- trois régimes de Q ---------- */
(() => { const IDS = ["fort", "moyen", "faible"]; keyed($("regimes"), t("regimes.tag"), IDS, textOf("regimes.items", IDS)); })();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["stokes", 1850, "idea"], ["helmholtz", 1863, "experiment"], ["rayleigh", 1877, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["accelerometre", "sismometre", "diapason"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["phase", "c"], ["elongation", "a"], ["vitesse", "b"], ["bande", "d"], ["faible", "c"], ["energie", "a"], ["air", "b"], ["capteur", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 232 });
})();
</script>
