<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ondes d'étrave</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-ondes" data-i18n="monde.ondes"></a><span class="aux">›</span><a href="/racoon/etape?id=ondes-choc-surface" data-i18n="etape.ondes-choc-surface"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-ondes" href="/racoon/atlas?piste=ondes" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/la-vitesse-du-son" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mi data-i18n="eq.sin"></mi><mi>θ</mi><mo>=</mo><mfrac><msub><mi>c</mi><mi>w</mi></msub><mi>v</mi></mfrac></math><span class="n">(51.1)</span></div>
    <p class="validite" data-i18n-html="val.51.1"></p>
    <figure class="chart">
      <svg class="fig" id="mc" role="img" data-i18n-attr="aria-label:mc.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="mc.legend.fronts"></span><span class="c-warn" data-i18n="mc.legend.cone"></span><span class="c-label-2" data-i18n="mc.legend.source"></span></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="ma" data-i18n="mc.m"></label><output id="mav" for="ma"></output></div>
          <input id="ma" type="range" min="0.3" max="3" step="0.01" value="2"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="mc.k.theta"></span><span class="v" id="vth"></span><span class="f" id="fth"></span></div>
          <div class="stat"><span class="k" data-i18n="mc.k.bang"></span><span class="v" id="vbg"></span><span class="f" id="fbg"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="mc.caption"></figcaption>
    </figure>
    <p data-i18n-html="s1.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi data-i18n="eq.cos"></mi><msub><mi>θ</mi><mi>c</mi></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mi>n</mi><mi>β</mi></mrow></mfrac><mo>,</mo><mspace width="0.6em"></mspace><mi>β</mi><mo>=</mo><mfrac><mi>v</mi><mi>c</mi></mfrac></math></div>
    <p class="validite" data-i18n-html="val.ck"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><msub><mi>T</mi><mi>s</mi></msub><mo>=</mo><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup><mrow><mo>(</mo><mfrac><mn>1</mn><msqrt><mn>1</mn><mo>−</mo><mn>1</mn><mo>/</mo><msup><mi>n</mi><mn>2</mn></msup></msqrt></mfrac><mo>−</mo><mn>1</mn><mo>)</mo></mrow></math></div>
    <p class="validite" data-i18n-html="val.seuil"></p>
    <figure class="chart">
      <svg class="fig" id="ck" role="img" data-i18n-attr="aria-label:ck.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="ck.legend.e"></span><span class="c-warn" data-i18n="ck.legend.mu"></span><span class="c-label-2" data-i18n="ck.legend.max"></span></div>
      <div class="panel">
        <div class="seg" role="group" id="mil">
          <button type="button" data-n="1.33" data-i18n="ck.eau"></button>
          <button type="button" data-n="1.5" data-i18n="ck.verre"></button>
        </div>
        <div class="ctl"><div class="row"><label for="te" data-i18n="ck.t"></label><output id="tev" for="te"></output></div>
          <input id="te" type="range" min="-1" max="4" step="0.01" value="2"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="ck.k.e"></span><span class="v" id="vce"></span><span class="f" id="fce"></span></div>
          <div class="stat"><span class="k" data-i18n="ck.k.mu"></span><span class="v" id="vcm"></span><span class="f" id="fcm"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="ck.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/ondes-d-etrave.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/thermo.js"></script>
<script src="/racoon/ondes.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const deg = r => r * 180 / Math.PI;

/* ---------- §51-1 : les fronts d'une source qui va à v, et leur enveloppe ---------- */
(() => {
  const O = self.Ondes, C = O.milieu("air", 293.15, Constantes.atm).c, H = 1e4, W = 640, Hp = 300, PAD = { l: 52, r: 16, t: 12, b: 44 };
  const X0 = -4.4, X1 = 1.4, ys = (X1 - X0) * (Hp - PAD.t - PAD.b) / (W - PAD.l - PAD.r) / 2;
  function upd() {
    const M = +$("ma").value, fr = O.fronts(1, M, 1, 10), th = O.angleMach(1, M);
    const svg = $("mc"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: W, h: Hp, pad: PAD, x: { domain: [X0, X1], label: t("mc.xaxis") }, y: { domain: [-ys, ys], label: t("mc.yaxis") } });
    const r = q => P.x(q) - P.x(0);
    for (const f of fr) Plot.el("circle", { cx: P.x(f.x), cy: P.y(0), r: r(f.r), class: "stroke thin c-tint" }, P.g);
    if (th != null) {
      const L = Math.min(M + 1, ys / Math.sin(th), -X0 / Math.cos(th)), dx = -L * Math.cos(th), dy = L * Math.sin(th);
      for (const s of [1, -1]) Plot.el("line", { x1: P.x(0), y1: P.y(0), x2: P.x(dx), y2: P.y(s * dy), class: "stroke c-warn" }, P.g);
    }
    Plot.el("line", { x1: P.x(-M), y1: P.y(0), x2: P.x(0), y2: P.y(0), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("circle", { cx: P.x(0), cy: P.y(0), r: 5, class: "fill c-label-2" }, P.g);
    $("mav").textContent = F.num(M, 3);
    if (th != null) {
      $("vth").textContent = F.num(deg(th), 3) + "°"; $("fth").textContent = t("mc.f.theta", { v: F.si(M * C, "m·s⁻¹") });
      $("vbg").textContent = F.si(H / (Math.tan(th) * M * C), "s"); $("fbg").textContent = t("mc.f.bang", { d: F.si(H / Math.tan(th), "m") });
    } else {
      $("vth").textContent = t("mc.aucun"); $("fth").textContent = t("mc.f.sub", { v: F.si(M * C, "m·s⁻¹") });
      $("vbg").textContent = t("mc.aucun"); $("fbg").textContent = t("mc.f.nobang");
    }
  }
  $("ma").oninput = upd; upd();
})();

/* ---------- §51-1 : le cône de lumière de Tcherenkov dans l'eau ou le verre ---------- */
(() => {
  const O = self.Ondes, MEV = 1e6 * Constantes.e, PA = O.PARTICULES;
  const LT = Array.from({ length: 501 }, (_, i) => -1 + 5 * i / 500);
  let n = 1.33;
  const ang = (T, p) => { const r = O.tcherenkov(n, T * MEV, PA[p].mc2); return r.emet ? deg(r.theta) : null; };
  const courbe = (P, p, cls) => { let pts = []; for (const l of LT) { const a = ang(10 ** l, p); if (a != null) pts.push([P.x(l), P.y(a)]); }
    if (pts.length > 1) Plot.el("path", { d: Plot.path(pts), class: cls }, P.g); };
  function upd() {
    const l = +$("te").value, T = 10 ** l, svg = $("ck"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 52, b: 44 }, x: { domain: [-1, 4], label: t("ck.xaxis"), fmt: v => "10" + F.sup(Math.round(v)) }, y: { domain: [0, 55], label: t("ck.yaxis") } });
    const max = deg(Math.acos(1 / n));
    Plot.el("line", { x1: P.x(-1), x2: P.x(4), y1: P.y(max), y2: P.y(max), class: "stroke thin dash c-label-2" }, P.g);
    courbe(P, "electron", "curve"); courbe(P, "muon", "stroke c-warn");
    Plot.el("line", { x1: P.x(l), x2: P.x(l), y1: P.y(0), y2: P.y(55), class: "ref" }, P.g);
    $("tev").textContent = F.si(T * MEV, "J") + " = " + F.qty(F.num(T, 3), "MeV");
    for (const [p, v, f] of [["electron", "vce", "fce"], ["muon", "vcm", "fcm"]]) {
      const r = O.tcherenkov(n, T * MEV, PA[p].mc2);
      $(v).textContent = r.emet ? F.num(deg(r.theta), 3) + "°" : t("ck.rien");
      const b = r.beta < 0.999 ? t("ck.beta", { b: F.num(r.beta, 3) }) : t("ck.ecart", { e: F.sci(1 - r.beta, 2) });
      $(f).textContent = t("ck.f", { b, s: F.qty(F.num(r.seuil / MEV, 3), "MeV") });
    }
    $("mil").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.n === n)));
  }
  $("mil").querySelectorAll("button").forEach(x => x.onclick = () => { n = +x.dataset.n; upd(); });
  $("te").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mach", 1887, "experiment"], ["tcherenkov", 1934, "experiment"], ["tamm", 1937, "idea"], ["yeager", 1947, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["superk", "bang"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["angle", "b"], ["subsonique", "d"], ["bang", "a"], ["vitesse", "c"], ["seuil", "a"], ["muon", "b"], ["plus", "d"], ["courbe", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 511 });
})();
</script>
</body>
</html>
