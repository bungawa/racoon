<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m);
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const P = Charge.PARTICULES, e = Charge.E0;

/* ---------- ordres de grandeur : la force de Lorentz contre le poids ---------- */
(() => {
  const drop = { q: e, m: 4 / 3 * Math.PI * 1e-18 * 900 };                 // oil drop, radius 1 µm, density 900 kg·m⁻³, one charge
  const ROWS = [
    ["electron", Charge.negligeables({ q: P.electron.q, m: P.electron.m, v: 0, E: 1e3 }).poidsE],
    ["vent", Charge.negligeables({ q: P.proton.q, m: P.proton.m, v: 4e5, B: 5e-5 }).poidsB],
    ["goutte", Charge.negligeables({ q: drop.q, m: drop.m, v: 0, E: 3e5 }).poidsE],
  ];
  const txt = textOf("oom.items", ROWS.map(r => r[0]));
  $("oom").innerHTML = ROWS.map(([id, r]) => `<div><span class="k">${txt[id].k}</span><span>${fill(txt[id].text, { r: r > 0.01 ? F.num(r, 2) : F.sci(r, 2) })}</span></div>`).join("");
})();

/* ---------- le filtre de Wien : champs croisés, pas à pas ---------- */
(() => {
  const svg = $("wien"), El = Plot.el, L = 0.10, d = 0.04, K = 5000, X0 = 70, Y0 = 150;   // 1 m = 5000 px; field region 10 cm × 4 cm
  const sx = x => X0 + K * x, sy = y => Y0 - K * y, p = P.proton;
  const label = (x, y, key, anchor) => { El("text", { x, y, "text-anchor": anchor || "middle" }, svg).textContent = t(key); };
  function frame() {
    svg.innerHTML = "";
    El("rect", { x: sx(0), y: sy(d / 2) - 8, width: K * L, height: 8, class: "fill c-label-2" }, svg);
    El("rect", { x: sx(0), y: sy(-d / 2), width: K * L, height: 8, class: "fill c-label-2" }, svg);
    for (let i = 1; i < 10; i++) for (let j = -1; j <= 1; j++) {                         // B out of the screen: ⊙
      const cx = sx(i * L / 10), cy = sy(j * d / 3);
      El("circle", { cx, cy, r: 4, class: "stroke thin c-label-2" }, svg); El("circle", { cx, cy, r: 1.2, class: "fill c-label-2" }, svg);
    }
    for (const i of [0.5, 9.5]) El("line", { x1: sx(i * L / 10), y1: sy(-d / 2) - 4, x2: sx(i * L / 10), y2: sy(d / 2) + 12, class: "stroke thin c-warn" }, svg);
    El("polygon", { points: [sx(0.95 * L), sy(d / 2) + 4, sx(0.95 * L) - 5, sy(d / 2) + 14, sx(0.95 * L) + 5, sy(d / 2) + 14].join(" "), class: "fill c-warn" }, svg);
    label(sx(L) + 14, sy(d / 2) + 20, "wien.E.label", "start"); label(sx(L) + 14, sy(d / 3) + 4, "wien.B.label", "start");
    label(sx(L / 2), sy(d / 2) - 16, "wien.moins"); label(sx(L / 2), sy(-d / 2) + 26, "wien.plus");   // E points up, from + to −
    El("line", { x1: 20, y1: Y0, x2: X0, y2: Y0, class: "stroke thin dash c-label-2" }, svg);
  }
  function draw() {
    const v = +$("wv").value, E = +$("wE").value, B = +$("wB").value;
    frame();
    const run = Charge.simule({ q: p.q, m: p.m, E: [0, E, 0], B: [0, 0, B], v0: [v, 0, 0], duree: 4 * L / v, n: 1600 });
    let k = 0, d0 = "M" + sx(0) + " " + sy(0), out = null;
    for (k = 1; k < run.x.length; k++) {
      const [x, y] = run.x[k];
      if (Math.abs(y) >= d / 2) { out = { type: "plaque", x, y: Math.sign(y) * d / 2 }; d0 += "L" + sx(x).toFixed(1) + " " + sy(out.y).toFixed(1); break; }
      if (x >= L || x < 0) { out = { type: x >= L ? "sortie" : "retour", x, y }; d0 += "L" + sx(Math.min(x, L)).toFixed(1) + " " + sy(y).toFixed(1); break; }
      d0 += "L" + sx(x).toFixed(1) + " " + sy(y).toFixed(1);
    }
    if (out && out.type === "sortie") d0 += "L" + (sx(L) + 40) + " " + (sy(out.y) - 40 * (run.v[k][1] / run.v[k][0])).toFixed(1);
    El("path", { d: d0, class: "stroke c-tint" }, svg);
    const fe = Math.abs(p.q * E), fm = Math.abs(p.q * v * B), vf = B > 0 ? E / B : Infinity;
    $("wvo").textContent = F.qty(F.sci(v, 2), "m·s⁻¹");
    $("wEo").textContent = F.si(E, "V·m⁻¹");
    $("wBo").textContent = F.si(B, "T");
    $("vF").textContent = F.si(fe, "N", { prefix: "f" }) + " / " + F.si(fm, "N", { prefix: "f" });
    $("fF").textContent = t(fe === fm ? "wien.f.egal" : fe > fm ? "wien.f.haut" : "wien.f.bas");
    $("vfil").textContent = isFinite(vf) ? F.qty(F.sci(vf, 3), "m·s⁻¹") : t("wien.aucune");
    $("ffil").textContent = isFinite(vf) ? t("wien.f.filtre", { r: F.num(v / vf, 3) }) : t("wien.f.sansB");
    const end = out || { type: "dedans", x: run.x[k - 1][0], y: run.x[k - 1][1] };
    $("vout").textContent = end.type === "sortie" ? F.qty(F.num(end.y * 1000, 2), "mm") : t("wien.out." + end.type);
    $("fout").textContent = t("wien.f.sortie");
    /* energy gained: the work of qE alone, q E Δy, against the change of kinetic energy computed from the speed */
    const vEnd = run.v[Math.min(k, run.v.length - 1)], dEc = p.m * (vEnd[0] ** 2 + vEnd[1] ** 2 - v * v) / 2, w = p.q * E * run.x[Math.min(k, run.x.length - 1)][1];
    $("vEc").textContent = F.qty(F.num(dEc / e, 3), "eV");
    $("fEc").textContent = t("wien.f.energie", { w: F.num(w / e, 3) });
  }
  ["wv", "wE", "wB"].forEach(id => $(id).oninput = draw); draw();
})();

/* ---------- le système décrit, chiffré ---------- */
(() => {
  const n = Charge.negligeables({ q: P.proton.q, m: P.proton.m, v: 4e5, E: 2e4, B: 0.05 });
  $("sys").innerHTML = t("sys.body", { rel: F.sci(n.rel, 1), pE: F.sci(n.poidsE, 1), pB: F.sci(n.poidsB, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1873, "idea"], ["heaviside", 1889, "idea"], ["lorentz", 1892, "idea"], ["thomson", 1897, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["wien"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["travail", "a"], ["parallele", "b"], ["signe", "c"], ["poids", "d"], ["filtre", "a"], ["energie", "b"], ["vitesse", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 211 });
})();
</script>
