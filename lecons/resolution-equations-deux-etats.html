<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes;
/* ammonia: 2A = h × 23,87 GHz; dipole 1,47 D, 1 D = 10⁻²¹/c C·m */
const NU = 23.87e9, A = Q.aDepuisFrequence(NU), MU = 1.47 * 1e-21 / K.c;

/* ---------- ammonia in a static field: the levels, then the flipping probability ---------- */
(() => {
  const s1 = $("niveaux"), s2 = $("proba"), sE = $("sE"), EMAX = 5e6, YMAX = 2.6e-23;
  function draw() {
    const E = +sE.value * 1e6, W = MU * E, H = [[A, W], [W, -A]], n = Q.niveauxDeux(H);
    s1.innerHTML = ""; s2.innerHTML = "";
    const o = Plot.axes(s1, { fmt: F, w: 640, h: 240, pad: { b: 44, l: 70 }, x: { domain: [0, EMAX], label: t("fig.x1") }, y: { domain: [-YMAX, YMAX], label: t("fig.y1") } });
    const ph = [], pb = [], lh = [], lb = [];
    for (let k = 0; k <= 120; k++) {
      const e = EMAX * k / 120, m = Q.niveauxDeux([[A, MU * e], [MU * e, -A]]);
      ph.push([o.x(e), o.y(m.Ehaut)]); pb.push([o.x(e), o.y(m.Ebas)]);
      lh.push([o.x(e), o.y(Math.min(YMAX, MU * e))]); lb.push([o.x(e), o.y(Math.max(-YMAX, -MU * e))]);
    }
    for (const p of [ph, pb]) Plot.el("path", { d: Plot.path(p), class: "stroke bold c-ok" }, o.g);
    for (const p of [lh, lb]) Plot.el("path", { d: Plot.path(p), class: "stroke dash c-tint" }, o.g);
    Plot.el("circle", { cx: o.x(E), cy: o.y(n.Ehaut), r: 5, class: "fill c-ok" }, o.g);
    Plot.el("circle", { cx: o.x(E), cy: o.y(n.Ebas), r: 5, class: "fill c-ok" }, o.g);
    const T = 3 * K.h / (2 * A) / 2, q = Plot.axes(s2, { fmt: F, w: 640, h: 240, pad: { b: 44, l: 70 }, x: { domain: [0, T * 1e12], label: t("fig.x2") }, y: { domain: [0, 1], label: t("fig.y2") } });
    const pp = [];
    for (let k = 0; k <= 400; k++) { const tt = T * k / 400; pp.push([q.x(tt * 1e12), q.y(Q.probaBasculement(A, W, tt))]); }
    Plot.el("path", { d: Plot.path(pp), class: "stroke bold c-warn" }, q.g);
    const pmax = W * W / (A * A + W * W);
    Plot.el("line", { x1: q.x(0), x2: q.x(T * 1e12), y1: q.y(pmax), y2: q.y(pmax), class: "stroke thin dash c-label-2" }, q.g);
    $("sEr").textContent = F.si(E, "V·m⁻¹");
    $("vm").textContent = F.si(W, "J");
    $("fm").textContent = t("fig.f.mue", { r: F.fix(W / A, 2) });
    $("ve").textContent = F.si(n.Ehaut - n.Ebas, "J");
    $("fe").textContent = t("fig.f.ecart", { f: F.si((n.Ehaut - n.Ebas) / K.h, "Hz") });
    $("vp").textContent = F.fix(pmax, 3);
    $("fp").textContent = n.demiEcart > 0 ? t("fig.f.max", { T: F.si(Math.PI * K.hbar / n.demiEcart, "s") }) : "";
  }
  sE.oninput = draw; draw();
})();

/* ---------- the system described: ammonia, the field, the neglected states ---------- */
(() => {
  const Ec = A / MU;
  $("sys1").innerHTML = t("sys1.body", { A: F.si(A, "J"), nu: F.si(NU, "Hz"), mu: F.si(MU, "C·m"), Ec: F.si(Ec, "V·m⁻¹") });
  $("sys2").innerHTML = t("sys2.body", { kT: F.si(K.k_B * 300, "J"), r: F.num(K.k_B * 300 / (2 * A), 2), T: F.kelvin(300) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cw", 1934, "experiment"], ["maser", 1953, "experiment"], ["ism", 1968, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["nuages", "qubit"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["champ", "b"], ["niveaux", "d"], ["faible", "a"], ["fort", "c"], ["max", "b"], ["periode", "a"], ["general", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1103 });
})();
</script>
