<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, C = Constantes.c;

/* ---------- une onde plane vue de deux référentiels : crêtes, vecteur d'onde, λx, phase en un événement ---------- */
(() => {
  const LAMBDA = 500e-9, W = 2 * Math.PI * C / LAMBDA;                         // green light, ω ≈ 3,8 × 10¹⁵ rad·s⁻¹
  const EVT = [C * 2e-15, 300e-9, 200e-9, 0];                                  // an event: t = 2 fs, x = 300 nm, y = 200 nm
  const svg = $("ondes"), sa = $("sa"), sb = $("sb"), PX = 40;                 // 40 px per wavelength in the left panel
  const deg = a => F.qty(F.num(a * 180 / Math.PI, 3), "°");
  function panel(x0, n, lam, title, lx) {
    const w = 300, h = 250, y0 = 34, cx = x0 + w / 2, cy = y0 + h / 2;
    const g = Plot.el("g", {}, svg);
    Plot.el("rect", { x: x0, y: y0, width: w, height: h, class: "stroke thin c-label-2" }, g);
    Plot.el("text", { x: x0, y: 20 }, g).textContent = title;
    const clip = "clip" + x0, cp = Plot.el("clipPath", { id: clip }, g);
    Plot.el("rect", { x: x0, y: y0, width: w, height: h }, cp);
    const crests = Plot.el("g", { "clip-path": "url(#" + clip + ")" }, g);
    const ux = n[0], uy = -n[1], R = Math.hypot(w, h);                          // screen y points down
    for (let j = -Math.ceil(R / lam); j <= Math.ceil(R / lam); j++) {         // crests: lines normal to n, every λ
      const px = cx + j * lam * ux, py = cy + j * lam * uy;
      Plot.el("line", { x1: px - R * uy, y1: py + R * ux, x2: px + R * uy, y2: py - R * ux, class: "stroke thin" }, crests);
    }
    if (lx) {                                                                   // λx: two neighbouring crests along a line y = const
      const cs = Math.abs(ux) > 1e-3 ? lam / Math.abs(ux) : Infinity;
      if (cs < w - 20) Plot.fleche(crests, [cx, cy + 70], [cx + cs * Math.sign(ux), cy + 70], { cls: "c-warn", tete: 6 });
    }
    Plot.fleche(g, [cx, cy], [cx + 60 * ux, cy + 60 * uy], { cls: "c-tint", trait: "stroke bold" });
  }
  function draw() {
    const a = +sa.value * Math.PI / 180, b = +sb.value / 100;
    const K = O.quadriOnde(W, [Math.cos(a), Math.sin(a), 0]), v = O.ondeVue(K, b), comp = O.composantes(LAMBDA, a);
    svg.innerHTML = "";
    panel(10, [Math.cos(a), Math.sin(a)], PX, t("fig.S"), true);
    panel(330, v.n, Math.max(8, Math.min(240, PX / v.rapport)), t("fig.Sp", { b: F.num(b, 2) }), false);
    const ap = Math.atan2(v.n[1], v.n[0]);
    $("sar").textContent = deg(a);
    $("sbr").textContent = F.num(b, 2);
    $("vlx").textContent = comp.lambdaX === Infinity ? "∞" : F.si(comp.lambdaX, "m", { prefix: "n" });
    $("flx").textContent = t("fig.f.lx", { l: F.si(LAMBDA, "m", { prefix: "n" }) });
    $("vw").textContent = F.num(v.rapport, 3);
    $("fw").textContent = t("fig.f.w", { l: F.si(v.lambda, "m", { prefix: "n" }), a: deg(ap) });
    $("vphi").textContent = F.qty(F.num(O.phaseOnde(K, EVT), 6), "rad");
    $("fphi").textContent = t("fig.f.phase", { p: F.qty(F.num(O.phaseOnde(v.K, Relativite.boostQuadri(EVT, b)), 6), "rad") });
  }
  sa.oninput = sb.oninput = draw; draw();
})();

/* ---------- le système décrit : la Terre dans le fond diffus cosmologique ---------- */
(() => {
  const v = 369.82e3, T0 = 2.72548, b = v / C;
  const up = T0 / (Relativite.gamma(v) * (1 - b)), down = T0 / (Relativite.gamma(v) * (1 + b));
  $("sys1").innerHTML = t("sys1.body", { v: F.si(v, "m·s⁻¹"), b: F.sci(b, 3), T0: F.qty(F.num(T0, 6), "K"),
    dT: F.si(T0 * b, "K", { prefix: "m", sig: 4 }), hi: F.qty(F.num(up, 6), "K"), lo: F.qty(F.num(down, 6), "K"),
    q: F.si(T0 * b * b, "K", { prefix: "µ", sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["doppler", 1842, "idea"], ["einstein", 1905, "idea"], ["minkowski", 1908, "idea"], ["planck", 2018, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["dipole", "radar"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["lx", "c"], ["plusc", "a"], ["compte", "d"], ["travers", "b"], ["lambda", "c"], ["plasma", "a"], ["radio", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 347 });
})();
</script>
