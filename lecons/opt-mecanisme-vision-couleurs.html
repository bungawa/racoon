<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, nm = x => x * 1e-9, P = Plot.el;
const teinte = (x, y) => "rgb(" + O.couleurAffichable(x, y).join(" ") + ")", FOND = O.grilleCouleurs(0.01);
const lam = Array.from({ length: 65 }, (_, k) => 380 + 5 * k);

/* ---------- les trois fondamentales, déduites des points coponctuels, (35.4b) ---------- */
(() => {
  const svg = $("fond"), W = 640, H = 300, f = lam.map(l => O.fondamentales(nm(l))), mx = [0, 1, 2].map(k => Math.max(...f.map(v => v[k])));
  const ax = Plot.axes(svg, { fmt: F, w: W, h: H, x: { domain: [380, 700], label: t("fd.ax.x") }, y: { domain: [0, 1.05], label: t("fd.ax.y") } });
  ["c-ko", "c-ok", "c-tint"].forEach((cls, k) => P("path", { d: Plot.path(lam.map((l, i) => [ax.x(l), ax.y(f[i][k] / mx[k])])), class: "stroke " + cls }, svg));
  P("path", { d: Plot.path(lam.map(l => [ax.x(l), ax.y(O.V(nm(l)))])), class: "stroke thin dash c-label-2" }, svg);
})();

/* ---------- droites de confusion d'un dichromate, (35.4c) ---------- */
(() => {
  const svg = $("conf"), W = 640, H = 560, D65 = O.SRGB.blanc, LOC = O.locus(), sel = $("type"), ls = $("lsl"), ps = $("psl");
  const K = { protan: 0, deutan: 1, tritan: 2 };
  const nomBord = s => s.lambda === null ? t("cf.pourpre") : F.si(s.lambda, "m", { prefix: "n", sig: 3 });
  function draw() {
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: W, h: H, x: { domain: [0, 0.8], label: t("cf.ax.x") }, y: { domain: [0, 0.9], label: t("cf.ax.y") } });
    const bord = Plot.path(LOC.map(p => [ax.x(p.x), ax.y(p.y)])) + "Z", dx = ax.x(0.01) - ax.x(0), dy = ax.y(0) - ax.y(0.01);
    P("path", { d: bord }, P("clipPath", { id: "dom2" }, P("defs", {}, svg)));
    const g = P("g", { "clip-path": "url(#dom2)", opacity: 0.6 }, svg);
    FOND.forEach(([x, y, c]) => P("rect", { x: ax.x(x - 0.005) - 0.5, y: ax.y(y + 0.005) - 0.5, width: dx + 1, height: dy + 1, fill: "rgb(" + c.join(" ") + ")" }, g));
    P("path", { d: bord, class: "stroke c-label" }, svg);
    const type = sel.value, Pc = O.COPONCTUELS[type];
    /* faisceau : droites issues du point coponctuel vers des points du bord, tracées dans le domaine réel */
    const seg = q => { const b = O.confusion(type, q).bords; return b.length === 2 ? b : null; };
    /* des points régulièrement espacés sur le bord (longueur d'arc), rentrés de 2 % vers le blanc */
    const B = LOC.map(p => [p.x, p.y]).concat([[LOC[0].x, LOC[0].y]]), cum = [0];
    for (let i = 1; i < B.length; i++) cum.push(cum[i - 1] + Math.hypot(B[i][0] - B[i - 1][0], B[i][1] - B[i - 1][1]));
    for (let j = 0; j < 24; j++) {
      const s = (j + 0.5) * cum[cum.length - 1] / 24, i = cum.findIndex(v => v >= s), u = (s - cum[i - 1]) / (cum[i] - cum[i - 1]);
      const e = [B[i - 1][0] + u * (B[i][0] - B[i - 1][0]), B[i - 1][1] + u * (B[i][1] - B[i - 1][1])], b = seg([D65[0] + 0.98 * (e[0] - D65[0]), D65[1] + 0.98 * (e[1] - D65[1])]);
      if (b) P("line", { x1: ax.x(b[0].x), y1: ax.y(b[0].y), x2: ax.x(b[1].x), y2: ax.y(b[1].y), class: "stroke thin c-label-2" }, svg);
    }
    const l = +ls.value, p = +ps.value, c = O.chromaticite(O.cmf(nm(l))), C = [D65[0] + p * (c.x - D65[0]), D65[1] + p * (c.y - D65[1])];
    const b = seg(C) || [{ x: C[0], y: C[1], lambda: null }, { x: C[0], y: C[1], lambda: null }];
    P("line", { x1: ax.x(b[0].x), y1: ax.y(b[0].y), x2: ax.x(b[1].x), y2: ax.y(b[1].y), class: "stroke bold c-tint" }, svg);
    /* cinq couleurs de la droite, qu'il confond toutes */
    [0.1, 0.3, 0.5, 0.7, 0.9].forEach(u => { const x = b[0].x + u * (b[1].x - b[0].x), y = b[0].y + u * (b[1].y - b[0].y);
      P("circle", { cx: ax.x(x), cy: ax.y(y), r: 7, fill: teinte(x, y), class: "stroke thin c-label" }, svg); });
    P("circle", { cx: ax.x(C[0]), cy: ax.y(C[1]), r: 5, class: "fill c-tint" }, svg);
    P("circle", { cx: ax.x(D65[0]), cy: ax.y(D65[1]), r: 4, class: "stroke c-label" }, svg);
    /* point coponctuel ; hors du cadre (deutéranope), on marque l'endroit où la droite y mène, au bord du cadre */
    const u = Math.min(1, ...[[0, 0.8], [1, 0]].map(([i, lim]) => (Pc[i] - C[i]) !== 0 && (lim - C[i]) / (Pc[i] - C[i]) > 0 ? (lim - C[i]) / (Pc[i] - C[i]) : 1));
    const q = [C[0] + u * (Pc[0] - C[0]), C[1] + u * (Pc[1] - C[1])];
    P("line", { x1: ax.x(C[0]), y1: ax.y(C[1]), x2: ax.x(q[0]), y2: ax.y(q[1]), class: "stroke thin dash c-warn" }, svg);
    P("circle", { cx: ax.x(q[0]), cy: ax.y(q[1]), r: u < 1 ? 3 : 5, class: "fill c-warn" }, svg);
    $("lr").textContent = F.si(nm(l), "m", { prefix: "n", sig: 3 });
    $("pr").textContent = F.qty(F.num(100 * p, 2), "%");
    $("vb").textContent = b.map(nomBord).join(" ; ");
    $("fb").textContent = t("cf.f.bords");
    const n = O.pointNeutre(type, D65);
    $("vn").textContent = n.map(v => F.si(v, "m", { prefix: "n", sig: 3 })).join(" ; ");
    $("fn").textContent = t("cf.f.neutre." + type);
    /* les deux bouts, dosés pour qu'il ne les distingue pas du point choisi (Y = 1) : seul le cône manquant change, et la luminance avec lui */
    const e = O.confondus(type, O.versXYZ(C[0], C[1], 1)), k = K[type], r0 = O.lms(O.versXYZ(C[0], C[1], 1))[k];
    $("vc").textContent = e.length === 2 ? e.map(v => F.num(v.xyz[1], 2)).join(" ; ") : "";
    $("fc").textContent = t("cf.f.cone." + type).replace("{a}", e.length === 2 ? e.map(v => F.num(v.lms[k] / r0, 2)).join(" ; ") : "");
  }
  sel.onchange = draw; ls.oninput = draw; ps.oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dalton", 1794, "experiment"], ["maxwell", 1855, "idea"], ["konig", 1886, "experiment"], ["judd", 1944, "idea"], ["nathans", 1986, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["depistage", "simulation"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["lineaire", "b"], ["normal", "d"], ["droite", "a"], ["point", "c"], ["luminance", "b"], ["neutre", "a"], ["rouge", "d"], ["genetique", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 355 });
})();
</script>
