<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
function clip(svg, id, o, x0, x1, y0, y1) { const c = Plot.el("clipPath", { id }, svg); Plot.el("rect", { x: o.x(x0), y: o.y(y1), width: o.x(x1) - o.x(x0), height: o.y(y0) - o.y(y1) }, c); return Plot.el("g", { "clip-path": `url(#${id})` }, o.g); }

/* ---------- le circuit décrit ---------- */
(() => { const IDS = ["generateur", "bobine", "condensateur", "fils"]; keyed($("composants"), t("composants.tag"), IDS, textOf("composants.items", IDS)); })();

/* ---------- l'analogie, ligne à ligne ---------- */
(() => {
  const IDS = ["head", "x", "v", "m", "c", "k", "F", "w0", "Q", "Ec", "Ep", "P"], rows = textOf("analogie.rows", IDS);
  $("analogie").innerHTML = IDS.map(id => `<div role="row">${rows[id].map((c, j) => `<span role="${id === "head" ? "columnheader" : "cell"}"${j ? ' class="v"' : ""}>${id === "head" ? "<strong>" + c + "</strong>" : c}</span>`).join("")}</div>`).join("");
})();

/* ---------- §23-3 : courbes de résonance du circuit, et de son jumeau mécanique ---------- */
(() => {
  const L = 0.10, C = 1.0e-7, RG = 50, RB = 20, E0 = 1, W0 = Osc.pulsationLC(L, C);       // ω₀ = 10⁴ rad·s⁻¹, f₀ = 1,59 kHz
  const RS = Resonance.resistanceSerieCondensateur(5e-3, C, W0);                          // film polyester, tan δ = 5 × 10⁻³ : 5 Ω
  /* the log axis only marks decades: add 500, 2 000 and 5 000 Hz */
  const minor = (o, y0, y1) => [500, 2000, 5000].forEach(v => { Plot.el("line", { x1: o.x(v), x2: o.x(v), y1: o.y(y0), y2: o.y(y1), class: "grid" }, o.g);
    Plot.el("text", { x: o.x(v), y: o.y(y0) + 16, "text-anchor": "middle", class: "tick" }, o.g).textContent = F.num(v, 2); });
  const LF = Array.from({ length: 421 }, (_, i) => 2.5 + 1.4 * i / 420), DOTS = LF.filter((_, i) => i % 20 === 10);
  function upd() {
    const Rv = +$("rv").value, R = RG + RB + RS + Rv, f = 10 ** +$("lf").value, w = 2 * Math.PI * f, E = Resonance.rlc(R, L, C);
    const cur = lf => Resonance.intensite(R, L, C, E0, 2 * Math.PI * 10 ** lf), me = E.mecanique;
    const meca = lf => Resonance.reponse(Osc.pulsation(me.k, me.m), me.m * W0 / me.c, 2 * Math.PI * 10 ** lf, E0 / me.m).vitesse.module;
    /* current amplitude (mA), with the mechanical twin's velocity amplitude (m·s⁻¹, same number) as dots */
    const imax = 1000 * E0 / (RG + RB + RS) * 1.08;
    let svg = $("courant"); svg.innerHTML = "";
    let o = Plot.axes(svg, { fmt: F, w: 320, h: 280, pad: { b: 44, l: 52 }, x: { scale: "log", domain: [10 ** 2.5, 10 ** 3.9], label: t("re.xaxis"), fmt: v => F.num(v, 2) }, y: { domain: [0, imax], label: t("courant.yaxis") } });
    minor(o, 0, imax);
    let g = clip(svg, "courclip", o, 10 ** 2.5, 10 ** 3.9, 0, imax);
    Plot.el("line", { x1: o.x(E.f0), x2: o.x(E.f0), y1: o.y(0), y2: o.y(imax), class: "stroke thin dash c-label-2" }, g);
    Plot.el("line", { x1: o.x(10 ** 2.5), x2: o.x(10 ** 3.9), y1: o.y(1000 * E0 / R / Math.SQRT2), y2: o.y(1000 * E0 / R / Math.SQRT2), class: "stroke thin dash c-label-2" }, g);
    Plot.el("path", { d: path(LF.map(lf => [o.x(10 ** lf), o.y(1000 * cur(lf).I0)])), class: "curve" }, g);
    DOTS.forEach(lf => Plot.el("circle", { cx: o.x(10 ** lf), cy: o.y(1000 * meca(lf)), r: 3, class: "fill c-warn" }, g));
    Plot.el("circle", { cx: o.x(f), cy: o.y(1000 * cur(Math.log10(f)).I0), r: 5, class: "dot" }, g);
    /* capacitor voltage over the generator's: the charge resonance, twin of the elongation resonance */
    const umax = Math.max(1.5, 1.1 * Resonance.rlc(RG + RB + RS, L, C).Q);
    svg = $("tension"); svg.innerHTML = "";
    o = Plot.axes(svg, { fmt: F, w: 320, h: 280, pad: { b: 44, l: 52 }, x: { scale: "log", domain: [10 ** 2.5, 10 ** 3.9], label: t("re.xaxis"), fmt: v => F.num(v, 2) }, y: { domain: [0, umax], label: t("tension.yaxis") } });
    minor(o, 0, umax);
    g = clip(svg, "tensclip", o, 10 ** 2.5, 10 ** 3.9, 0, umax);
    Plot.el("line", { x1: o.x(E.f0), x2: o.x(E.f0), y1: o.y(0), y2: o.y(umax), class: "stroke thin dash c-label-2" }, g);
    Plot.el("line", { x1: o.x(10 ** 2.5), x2: o.x(10 ** 3.9), y1: o.y(1), y2: o.y(1), class: "stroke thin dash c-label-2" }, g);
    Plot.el("path", { d: path(LF.map(lf => [o.x(10 ** lf), o.y(cur(lf).UC / E0)])), class: "curve" }, g);
    Plot.el("circle", { cx: o.x(f), cy: o.y(cur(Math.log10(f)).UC / E0), r: 5, class: "dot" }, g);
    /* readouts */
    const now = Resonance.intensite(R, L, C, E0, w), B = Resonance.bande(W0, E.Q), er = Resonance.resonanceElongation(W0, E.Q);
    $("rvv").textContent = t("re.rvv", { r: F.si(Rv, "Ω"), tot: F.si(R, "Ω") }); $("lfv").textContent = F.si(f, "Hz");
    $("vq").textContent = F.num(E.Q, 3); $("fq").textContent = t("re.f.q", { f0: F.si(E.f0, "Hz") });
    $("vb").textContent = F.si(B.largeur / (2 * Math.PI), "Hz"); $("fb").textContent = t("re.f.b", { f1: F.si(B.w1 / (2 * Math.PI), "Hz"), f2: F.si(B.w2 / (2 * Math.PI), "Hz") });
    $("vi").textContent = F.si(now.I0, "A"); $("fi").textContent = t("re.f.i", { phi: F.qty(F.fix(now.retard, 2), "rad") });
    $("vuc").textContent = F.si(now.UC, "V"); $("fuc").textContent = er ? t("re.f.uc", { u: F.si(er.gain * E0, "V"), f: F.si(er.w / (2 * Math.PI), "Hz") }) : t("re.f.uc0");
    $("vm").textContent = F.si(meca(Math.log10(f)), "m·s⁻¹"); $("fm").textContent = t("re.f.m", { m: F.qty(F.num(me.m, 3), "kg"), c: F.qty(F.num(me.c, 3), "kg·s⁻¹"), k: F.qty(F.sci(me.k, 2), "N·m⁻¹") });
  }
  $("rv").oninput = $("lf").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["savary", 1827, "experiment"], ["feddersen", 1859, "experiment"], ["hertz", 1887, "experiment"], ["johnson", 1914, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["radio", "quartz"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["analogie", "b"], ["resonance", "a"], ["q", "d"], ["surtension", "c"], ["resistance", "b"], ["phase", "a"], ["bobine", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 233 });
})();
</script>
