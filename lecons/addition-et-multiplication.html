<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Addition et multiplication</title>
<link rel="stylesheet" href="/racoon/ds.css">

<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-outils" data-i18n="monde.outils"></a><span class="aux">›</span><a href="/racoon/etape?id=nombres-logarithmes" data-i18n="etape.nombres-logarithmes"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n-html="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <span class="chip plain" data-i18n="tag.prereq"></span>
      <span class="chip plain" data-i18n="tag.duree"></span>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n="s1.p1"></p>
    <div class="eq">
      <math display="block"><mtable columnalign="left"><mtr><mtd><mi>a</mi><mo>+</mo><mi>b</mi><mo>=</mo><munder><munder><mrow><mi>a</mi><mo>+</mo><mn>1</mn><mo>+</mo><mn>1</mn><mo>+</mo><mo>⋯</mo><mo>+</mo><mn>1</mn></mrow><mo>⏟</mo></munder><mrow><mi>b</mi><mspace width="0.2em"></mspace><mtext data-i18n="eq.fois"></mtext></mrow></munder></mtd></mtr><mtr><mtd><mi>a</mi><mi>b</mi><mo>=</mo><munder><munder><mrow><mn>0</mn><mo>+</mo><mi>a</mi><mo>+</mo><mi>a</mi><mo>+</mo><mo>⋯</mo><mo>+</mo><mi>a</mi></mrow><mo>⏟</mo></munder><mrow><mi>b</mi><mspace width="0.2em"></mspace><mtext data-i18n="eq.fois"></mtext></mrow></munder></mtd></mtr><mtr><mtd><msup><mi>a</mi><mi>b</mi></msup><mo>=</mo><munder><munder><mrow><mn>1</mn><mo>×</mo><mi>a</mi><mo>×</mo><mi>a</mi><mo>×</mo><mo>⋯</mo><mo>×</mo><mi>a</mi></mrow><mo>⏟</mo></munder><mrow><mi>b</mi><mspace width="0.2em"></mspace><mtext data-i18n="eq.fois"></mtext></mrow></munder></mtd></mtr></mtable></math>
      
    </div>
    <p class="validite" data-i18n="eq1.validite"></p>
    <p data-i18n="s1.p2"></p>
    <figure>
      <div class="panel">
        <div class="seg" role="group" id="opseg">
          <button type="button" data-op="add" data-i18n="rep.add"></button>
          <button type="button" data-op="mul" data-i18n="rep.mul"></button>
          <button type="button" data-op="pow" data-i18n="rep.pow"></button>
        </div>
        <div class="controls">
          <div class="ctl"><div class="row"><label for="ra" data-i18n="rep.a"></label><output id="rav" for="ra"></output></div><input id="ra" type="range" min="0" max="9" step="1" value="3"></div>
          <div class="ctl"><div class="row"><label for="rb" data-i18n="rep.b"></label><output id="rbv" for="rb"></output></div><input id="rb" type="range" min="0" max="6" step="1" value="4"></div>
        </div>
        <p id="rchain"></p>
        <svg class="fig" id="rdots" viewBox="0 0 640 170" role="img" data-i18n-attr="aria-label:rep.aria"></svg>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="rep.result"></span><span class="v" id="rres"></span></div>
          <div class="stat"><span class="k" data-i18n="rep.steps"></span><span class="v" id="rsteps"></span><span class="f" id="rstepsf"></span></div>
          <div class="stat"><span class="k" data-i18n="rep.swap"></span><span class="v" id="rswap"></span><span class="f" id="rswapf"></span></div>
        </div>
      </div>
      <figcaption data-i18n="rep.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n="s2.p1"></p>
    <div class="box prop"><b data-i18n="s2.prop.title"></b>
      <p data-i18n-html="s2.prop.body"></p>
    </div>
    <div class="eq">
      <math display="block"><msup><mi>a</mi><mrow><mi>b</mi><mo>+</mo><mi>c</mi></mrow></msup><mo>=</mo><msup><mi>a</mi><mi>b</mi></msup><mspace width="0.15em"></mspace><msup><mi>a</mi><mi>c</mi></msup><mo>,</mo><mspace width="2em"></mspace><msup><mrow><mo>(</mo><msup><mi>a</mi><mi>b</mi></msup><mo>)</mo></mrow><mi>c</mi></msup><mo>=</mo><msup><mi>a</mi><mrow><mi>b</mi><mi>c</mi></mrow></msup><mo>,</mo><mspace width="2em"></mspace><msup><mrow><mo>(</mo><mi>a</mi><mi>b</mi><mo>)</mo></mrow><mi>c</mi></msup><mo>=</mo><msup><mi>a</mi><mi>c</mi></msup><msup><mi>b</mi><mi>c</mi></msup></math>
      <span class="n">(22.1)</span>
    </div>
    <p class="validite" data-i18n="eq2.validite"></p>
    <p data-i18n="s2.p2"></p>
    <div class="box warn"><b data-i18n="s2.warn.title"></b>
      <p data-i18n="s2.warn.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n="s3.p1"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="box rem"><b data-i18n="s3.rem.title"></b>
      <p data-i18n="s3.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/addition-et-multiplication.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
/* typographie française partout, sauf le <h1> : il reste identique au titre de lecons/index.json */
const main = document.querySelector("main");
F.autoTypo(main);
document.title = t("title");
const $ = id => document.getElementById(id);
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };

/* ---------- la machine à répéter : chaque opération est la répétition de la précédente ---------- */
(() => {
  const OPS = {
    add: { f: (a, b) => a + b, start: a => a, step: () => "1", sym: "+", show: (a, b) => a + " + " + b },
    mul: { f: (a, b) => a * b, start: () => 0, step: a => String(a), sym: "+", show: (a, b) => a + " × " + b },
    pow: { f: (a, b) => Math.pow(a, b), start: () => 1, step: a => String(a), sym: "×", show: (a, b) => a + F.sup(b) },
  };
  const seg = $("opseg"), ra = $("ra"), rb = $("rb"), svg = $("rdots"), P = Plot.el, MAXDOTS = 120;
  let op = "mul";
  const n = x => F.num(x, 7);
  function dots(a, b) {
    svg.innerHTML = "";
    const r = OPS[op].f(a, b);
    /* addition : a puis b points ; multiplication : b rangées de a ; puissance : a^(b−1) rangées de a */
    const rows = op === "add" ? [[a, "c-tint"], [b, "c-warn"]] : op === "mul" ? Array.from({ length: b }, (_, i) => [a, i % 2 ? "c-warn" : "c-tint"])
      : b === 0 ? [[1, "c-tint"]] : Array.from({ length: r / a || 0 }, (_, i) => [a, i % 2 ? "c-warn" : "c-tint"]);
    if (r > MAXDOTS) { P("text", { x: 320, y: 90, "text-anchor": "middle" }, svg).textContent = t("rep.toomany", { n: n(r), max: MAXDOTS }); return; }
    if (r === 0) { P("text", { x: 320, y: 90, "text-anchor": "middle" }, svg).textContent = t("rep.zero"); return; }
    const flat = op === "add", gap = 13, R = 5;
    let x = 0, y = 0;
    rows.forEach(([k, cls]) => {
      for (let j = 0; j < k; j++) {
        if (x >= 40) { x = 0; y++; }
        P("circle", { cx: 20 + x * gap + R, cy: 14 + y * gap + R, r: R, class: "fill " + cls }, svg);
        x++;
      }
      if (!flat) { x = 0; y++; }
    });
    svg.setAttribute("viewBox", "0 0 640 " + Math.max(40, 28 + (y + (x ? 1 : 0)) * gap));
  }
  function upd() {
    const a = +ra.value, b = +rb.value, O = OPS[op], r = O.f(a, b), s = O.f(b, a);
    $("rav").textContent = n(a); $("rbv").textContent = n(b);
    const terms = b === 0 ? "" : " " + O.sym + " " + (b <= 6 ? Array(b).fill(O.step(a)).join(" " + O.sym + " ") : "");
    $("rchain").textContent = O.show(a, b) + " = " + n(O.start(a)) + terms + " = " + n(r) + (b === 0 ? " " + t("rep.none") : "");
    $("rres").textContent = n(r);
    const d = r - O.start(a); $("rsteps").textContent = d >= 0 ? n(d) : "–"; $("rstepsf").textContent = t("rep.steps.f." + op);
    $("rswap").textContent = O.show(b, a) + " = " + n(s); $("rswapf").textContent = t(r === s ? "rep.same" : "rep.diff");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.op === op)));
    dots(a, b);
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { op = x.dataset.op; upd(); });
  ra.oninput = rb.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["grassmann", 1861, "idea"], ["dedekind", 1888, "idea"], ["peano", 1889, "idea"], ["ieee", 1985, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["parallele", "carres", "oscillateur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["zero", "a"], ["puiss0", "a"], ["commute", "a"], ["regroupe", "a"], ["flottant", "a"], ["cout", "a"], ["tetration", "a"], ["phase", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => { const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) }; }), { t, seed: 22 });
})();
</script>
</body>
</html>
