<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const VM = "V·m⁻¹";

/* ---------- superposition : champ de deux charges ponctuelles ---------- */
(() => {
  const svg = $("champ"), P = Plot.el, qsl = $("qsl"), pxsl = $("pxsl"), pysl = $("pysl");
  const S = 1600, O = [320, 170], Q1 = 1e-9, D = 0.05;                 // px per metre, origin, charge 1, half-distance
  const px = X => O[0] + S * X, py = Y => O[1] - S * Y;
  const arrow = (x1, y1, x2, y2, cls) => Plot.fleche(svg, [x1, y1], [x2, y2], { cls, tete: 8 });
  function draw() {
    svg.innerHTML = "";
    const q2 = +qsl.value * 1e-9, src = [{ q: Q1, x: -D, y: 0 }].concat(q2 ? [{ q: q2, x: D, y: 0 }] : []);
    /* map: direction everywhere, length growing with log |E| */
    for (let i = 16; i < 640; i += 32) for (let j = 14; j < 340; j += 32) {
      const X = (i - O[0]) / S, Y = (O[1] - j) / S;
      if (src.some(s => Math.hypot(X - s.x, Y - s.y) < 0.012)) continue;
      const e = Forces.field(src, X, Y); if (!(e.e > 0)) continue;
      const L = Math.max(4, Math.min(14, 4 + 4 * Math.log10(e.e / 100)));
      arrow(i - L * e.ex / e.e / 2, j + L * e.ey / e.e / 2, i + L * e.ex / e.e / 2, j - L * e.ey / e.e / 2, "c-label-2 thin");
    }
    /* the charges */
    src.forEach((s, k) => {
      P("circle", { cx: px(s.x), cy: py(s.y), r: 9, class: "fill " + (s.q > 0 ? "c-ko" : "c-tint") }, svg);
      const l = P("text", { x: px(s.x), y: py(s.y) + 26, "text-anchor": "middle" }, svg); l.textContent = t(k ? "ch.lab.q2" : "ch.lab.q1");
    });
    /* the probe: each contribution and their vector sum, on one linear scale */
    const X = pxsl.value / 1000, Y = pysl.value / 1000;
    const e1 = Forces.field(src.slice(0, 1), X, Y), e2 = q2 ? Forces.field(src.slice(1), X, Y) : { ex: 0, ey: 0, e: 0 }, e = Forces.field(src, X, Y);
    const ok = [e1, e2, e].every(v => isFinite(v.e));
    if (ok) {
      const k = 90 / Math.max(e1.e, e2.e, e.e, 1e-30), M = [px(X), py(Y)];
      arrow(M[0], M[1], M[0] + k * e1.ex, M[1] - k * e1.ey, "c-label dash");
      if (q2) arrow(M[0], M[1], M[0] + k * e2.ex, M[1] - k * e2.ey, "c-warn dash");
      arrow(M[0], M[1], M[0] + k * e.ex, M[1] - k * e.ey, "c-tint bold");
      P("circle", { cx: M[0], cy: M[1], r: 4, class: "fill c-label" }, svg);
      const l = P("text", { x: M[0] + 8, y: M[1] + 16 }, svg); l.textContent = t("ch.lab.m");
    }
    $("qread").textContent = F.qty(F.num(+qsl.value, 3), "nC");
    $("pxread").textContent = F.qty(F.num(+pxsl.value, 3), "mm");
    $("pyread").textContent = F.qty(F.num(+pysl.value, 3), "mm");
    const show = v => ok ? F.si(v.e, VM) : "–";
    $("ve1").textContent = show(e1); $("ve2").textContent = show(e2); $("ve").textContent = show(e);
    $("fe").textContent = ok ? t("ch.f.electron", { f: F.si(Forces.E * e.e, "N") }) : t("ch.f.sur");
  }
  qsl.oninput = pxsl.oninput = pysl.oninput = draw; draw();
})();

/* ---------- ordres de grandeur des quatre interactions ---------- */
(() => {
  const V = {
    grav: { v: F.sci(Forces.alphaG(Forces.MP), 2) },
    em: { v: F.num(1 / Forces.alpha(), 6) },
    faible: { v: F.sci(Forces.range(Forces.MW), 2) },
    forte: { v: F.num(Forces.range(Forces.MPI), 2) },
    pp: { v: F.sci(Forces.ratioEG(Forces.E, Forces.MP), 3) },
    ee: { v: F.sci(Forces.ratioEG(Forces.E, Forces.ME), 3) },
  };
  const ROWS = Object.keys(V), txt = textOf("ordres.items", ROWS);
  $("ordres").innerHTML = ROWS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text.replace("{v}", V[id].v)}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1687, "idea"], ["coulomb", 1785, "experiment"], ["cavendish", 1798, "experiment"], ["faraday", 1852, "idea"], ["maxwell", 1865, "idea"], ["yukawa", 1935, "idea"], ["wz", 1983, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["grace", "electrostatique"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["neutre", "a"], ["rapport", "a"], ["champ", "a"], ["superposition", "a"], ["milieu", "a"], ["portee", "a"], ["gravite", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 124 });
})();
</script>
