<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, D = Math.PI / 180;
const matrice = al => { const { a, b, c, d } = Q.demiRotationY(al); return Q.projectionSpin1(a, b, c, d); };

/* ---------- spin 1 built from two spins 1/2, rotated by α about y ---------- */
(() => {
  const svg = $("courbe"), sA = $("sA"), tab = $("matrice"), lab = ["<mo>+</mo>", "<mn>0</mn>", "<mo>−</mo>"];
  function draw() {
    const al = +sA.value * D, R = matrice(al), S = Q.spin1Y(al);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 }, x: { domain: [0, 360], label: t("fig.x") }, y: { domain: [0, 1], label: t("fig.y") } });
    const cls = ["c-ok", "c-warn", "c-tint"];
    for (let j = 0; j < 3; j++) {
      const p = [];
      for (let k = 0; k <= 360; k += 2) p.push([o.x(k), o.y(Cx.abs2(matrice(k * D)[j][0]))]);
      Plot.el("path", { d: Plot.path(p), class: "stroke bold " + cls[j] }, o.g);
      Plot.el("circle", { cx: o.x(+sA.value), cy: o.y(Cx.abs2(R[j][0])), r: 4, class: "fill " + cls[j] }, o.g);
    }
    $("sAr").textContent = F.num(+sA.value, 3) + "°";
    $("vc").textContent = R.map(l => F.fix(Cx.abs2(l[0]), 3)).join(" ; "); $("fc").textContent = t("fig.f.col");
    let e = 0, u = 0;
    R.forEach((l, i) => l.forEach((z, j) => { e = Math.max(e, Math.abs(z.re - S[i][j].re)); }));
    Q.produitMatrices(Q.adjointe(R), R).forEach((l, i) => l.forEach((z, j) => { u = Math.max(u, Math.abs(z.re - (i === j ? 1 : 0))); }));
    $("ve").textContent = F.sci(Math.max(e, 1e-17), 1); $("fe").textContent = t("fig.f.ecart");
    $("vu").textContent = F.sci(Math.max(u, 1e-17), 1); $("fu").textContent = t("fig.f.unit");
    const m = x => "<math>" + x + "</math>", nb = x => F.fix(Math.abs(x) < 5e-13 ? 0 : x, 3);
    tab.innerHTML = "<tr><th>" + t("tab.coin") + "</th>" + lab.map(s => "<th>" + m(s + "<mi>S</mi>") + "</th>").join("") + "</tr>" +
      R.map((l, j) => "<tr><th>" + m(lab[j] + "<mi>T</mi>") + "</th>" + l.map(z => "<td>" + nb(z.re) + "</td>").join("") + "</tr>").join("");
  }
  sA.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["sg", 1922, "experiment"], ["wigner", 1927, "idea"], ["livre", 1931, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["molecules", "mesure"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["produit", "d"], ["zero", "a"], ["demi", "c"], ["tour", "b"], ["prob", "c"], ["pourquoi", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1206 });
})();
</script>
