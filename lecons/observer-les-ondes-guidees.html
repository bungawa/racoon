<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, A = 22.86e-3, B = 10.16e-3;                         // the R100 guide

/* ---------- la ligne fendue : la sonde parcourt le guide ---------- */
(() => {
  const L = 0.18, S0 = 0.02, S1 = 0.16, GAMMA = { absorbant: 0, plaque: -1, partielle: -0.5 };
  const trace = $("trace"), sf = $("sf"), seg = $("charge");
  let charge = "plaque";
  function draw() {
    const f = +sf.value * 1e9, g = M.guideRect(A, B, f), G = GAMMA[charge];
    const p = M.ligneFendue({ guide: g, L, Gamma: G, s0: S0, s1: S1, n: 1400 });
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [100 * S0, 100 * S1], label: t("fig.xaxis") }, y: { domain: [0, 4.2], label: t("fig.yaxis") } });
    Plot.el("path", { d: Plot.path(p.s.map((s, i) => [P.x(100 * s), P.y(Math.min(4.2, p.lecture[i]))])), class: "curve" }, P.g);
    p.minima.forEach(s => Plot.el("line", { x1: P.x(100 * s), x2: P.x(100 * s), y1: P.y(0), y2: P.y(0.35), class: "stroke c-warn" }, P.g));
    $("sfr").textContent = F.si(f, "Hz", { prefix: "G" });
    if (g.propage) {
      $("vlg").textContent = Number.isFinite(p.lambdaMesure) ? F.qty(F.num(100 * p.lambdaMesure, 3), "cm") : "–";
      $("flg").textContent = t("fig.f.lg", { v: F.qty(F.num(100 * g.lambdaG, 3), "cm"), l0: F.qty(F.num(100 * g.lambda0, 3), "cm") });
      $("vros").textContent = Number.isFinite(p.rosTheorique) && p.ros < 100 ? F.num(p.ros, 3) : t("fig.v.grand");
      $("fros").textContent = t("fig.f.ros", { v: Number.isFinite(p.rosTheorique) ? F.num(p.rosTheorique, 3) : "∞" });
      $("vreg").textContent = t("fig.propage");
      $("freg").textContent = t("fig.f.fc", { r: F.num(f / g.fc, 3), fc: F.si(g.fc, "Hz", { prefix: "G" }) });
    } else {
      $("vlg").textContent = "–"; $("flg").textContent = t("fig.f.pasdonde");
      $("vros").textContent = "–"; $("fros").textContent = t("fig.f.pasdonde");
      $("vreg").textContent = t("fig.evanescent");
      $("freg").textContent = t("fig.f.decroit", { v: F.qty(F.num(g.dBparMetre / 100, 3), "dB·cm⁻¹"), fc: F.si(g.fc, "Hz", { prefix: "G" }) });
    }
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === charge)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { charge = x.dataset.m; draw(); });
  sf.oninput = draw; draw();
})();

/* ---------- le système décrit : le banc en bande de 10 GHz ---------- */
(() => {
  const f = 10e9, g = M.guideRect(A, B, f), te20 = M.modeRect("TE", 2, 0, A, B, f), at = M.attenuationTE10(g, 5.8e7);
  $("sys1").innerHTML = t("sys1.body", { a: F.qty(F.num(1000 * A, 4), "mm"), b: F.qty(F.num(1000 * B, 4), "mm"), f: F.si(f, "Hz", { prefix: "G" }),
    l0: F.qty(F.num(100 * g.lambda0, 3), "cm"), lg: F.qty(F.num(100 * g.lambdaG, 3), "cm"), fc: F.si(g.fc, "Hz", { prefix: "G" }),
    d20: F.qty(F.num(1000 / te20.kPrime, 2), "mm"), att20: F.qty(F.num(te20.dBparMetre / 100, 2), "dB·cm⁻¹"),
    att: F.qty(F.num(at.dB, 2), "dB·m⁻¹"), ros: F.num((1 + Math.exp(-2 * at.alpha * 1)) / (1 - Math.exp(-2 * at.alpha * 1)), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rayleigh", 1897, "idea"], ["southworth", 1936, "experiment"], ["montgomery", 1947, "idea"], ["analyseur", 1967, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["vna"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["absorbeur", "c"], ["noeuds", "a"], ["mesure", "d"], ["coupure", "b"], ["ros", "c"], ["sonde", "a"], ["sous", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 245 });
})();
</script>
