<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, NM = 1e-9, EV = Constantes.e, M = Q.m_e;
const V0 = 1 * EV, L = 2 * NM, V = x => Math.abs(x) < L / 2 ? 0 : V0, O = { m: M, x0: -4 * NM, x1: 4 * NM, n: 4000 };
const NIVEAUX = Q.niveauxPuitsFini(V0, L, M);

/* ---------- shooting: integrate (16.58) from the left wall and watch the tail at the right one ---------- */
(() => {
  const svg = $("tir"), se = $("se"), seg = $("niveaux");
  let exacte = null;                                                   // a level found by a button, finer than the slider step
  function draw() {
    const E = exacte != null ? exacte : +se.value * EV, r = Q.tirNumerov(V, E, O);
    const mid = r.a.slice(0, Math.round(0.75 * r.a.length)), A = Math.max(...mid.map(Math.abs)) || 1;
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { domain: [-4, 4], label: t("fig.x"), fmt: v => F.num(v, 2) }, y: { domain: [-0.6, 1.6], label: t("fig.y") } });
    Plot.el("path", { d: Plot.path([[ax.x(-4), ax.y(1)], [ax.x(-1), ax.y(1)], [ax.x(-1), ax.y(0)], [ax.x(1), ax.y(0)], [ax.x(1), ax.y(1)], [ax.x(4), ax.y(1)]]), class: "stroke c-warn" }, ax.g);
    NIVEAUX.forEach(En => Plot.el("line", { x1: ax.x(-1), x2: ax.x(1), y1: ax.y(En / EV), y2: ax.y(En / EV), class: "stroke thin dash c-ok" }, ax.g));
    Plot.el("line", { x1: ax.x(-4), x2: ax.x(4), y1: ax.y(E / EV), y2: ax.y(E / EV), class: "stroke thin c-label-2" }, ax.g);
    /* a(x), scaled so that its largest swing in the left three quarters is 0,4, drawn around the line of E; clipped */
    const pts = r.x.map((x, j) => [ax.x(x / NM), ax.y(Math.max(-0.6, Math.min(1.6, E / EV + 0.4 * r.a[j] / A)))]);
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold c-tint" }, ax.g);
    const fin = r.a[r.a.length - 1] / A;
    let n = 0, last = 0; for (const v of mid) { if (v && last && Math.sign(v) !== Math.sign(last)) n++; if (v) last = v; }
    $("ser").textContent = F.qty(F.fix(E / EV, exacte != null ? 5 : 3), "eV");
    $("vq").textContent = Math.abs(fin) < 1e-3 ? "≈ 0" : F.sci(fin, 2);
    $("fq").textContent = t(Math.abs(fin) < 1e-3 ? "fig.f.lie" : fin > 0 ? "fig.f.haut" : "fig.f.bas");
    $("vn").textContent = F.num(n, 2);
    const proche = NIVEAUX.reduce((b, En, i) => Math.abs(En - E) < Math.abs(NIVEAUX[b] - E) ? i : b, 0);
    $("fn").textContent = t("fig.f.proche", { n: proche, e: F.qty(F.fix(NIVEAUX[proche] / EV, 4), "eV") });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(Math.abs(NIVEAUX[+b.dataset.n] - E) < 2e-4 * EV)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { exacte = Q.niveauTir(V, +b.dataset.n, O, 0, 0.999 * V0); se.value = (exacte / EV).toFixed(3); draw(); });
  se.oninput = () => { exacte = null; draw(); }; draw();
})();

/* ---------- the system described: the well against the infinite well, an electron against a marble ---------- */
(() => {
  const inf = n => Q.niveauPuitsInfini(n, L, M) / EV;
  $("sys1").innerHTML = t("sys1.body", { n: NIVEAUX.length, e0: F.fix(NIVEAUX[0] / EV, 4), i0: F.fix(inf(1), 4), e3: F.fix(NIVEAUX[3] / EV, 3), i3: F.fix(inf(4), 3) });
  const bille = Q.niveauPuitsInfini(1, 0.1, 1e-3);
  $("sys2").innerHTML = t("sys2.body", { e: F.qty(F.sci(bille, 2), "J"), n: F.sci(Math.sqrt(1e-3 * 9.81 * 0.01 / bille), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["franckhertz", 1914, "experiment"], ["schrodinger", 1926, "idea"], ["ekimov", 1981, "experiment"], ["nobel", 2023, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["qled"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["stationnaire", "a"], ["courbure", "c"], ["queue", "b"], ["noeuds", "d"], ["fini", "b"], ["profond", "a"], ["bille", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1606 });
})();
</script>
