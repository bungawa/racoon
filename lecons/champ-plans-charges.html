<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-electrostatique" data-i18n="monde.electrostatique"></a><span class="aux">›</span><a href="/racoon/etape?id=gauss-symetries" data-i18n="etape.gauss-symetries"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mi>E</mi><mo>=</mo><mfrac><mi>σ</mi><mrow><mn>2</mn><msub><mi>ε</mi><mn>0</mn></msub></mrow></mfrac></math><span class="n">(5.3)</span></div>
    <p class="validite" data-i18n-html="val.5.3"></p>
    <p data-i18n-html="s1.p3"></p>
    <div class="eq"><math display="block"><msub><mi>E</mi><mn>1</mn></msub><mo>+</mo><msub><mi>E</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi>σ</mi><msub><mi>ε</mi><mn>0</mn></msub></mfrac></math><span class="n">(5.4)</span></div>
    <p class="validite" data-i18n-html="val.5.4"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>E</mi><mo>=</mo><mfrac><mi>σ</mi><msub><mi>ε</mi><mn>0</mn></msub></mfrac><mspace width="1em"/><mo stretchy="false">(</mo><mtext data-i18n="eq.entre"></mtext><mo stretchy="false">)</mo></math><span class="n">(5.5)</span></div>
    <p class="validite" data-i18n-html="val.5.5"></p>
    <div class="eq"><math display="block"><mi>E</mi><mo>=</mo><mn>0</mn><mspace width="1em"/><mo stretchy="false">(</mo><mtext data-i18n="eq.dehors"></mtext><mo stretchy="false">)</mo></math><span class="n">(5.6)</span></div>
    <p class="validite" data-i18n-html="val.5.6"></p>
    <p data-i18n-html="s2.p2"></p>
    <figure>
      <svg class="fig" id="pla" viewBox="0 0 640 340" role="img" data-i18n-attr="aria-label:pl.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="pl.legend.disques"></span><span class="c-ok" data-i18n="pl.legend.plans"></span><span class="c-label-2" data-i18n="pl.legend.armatures"></span></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="ssl" data-i18n="pl.s2"></label><output id="sread" for="ssl"></output></div>
          <input id="ssl" type="range" min="0" max="8" step="1" value="0"></div>
        <div class="ctl"><div class="row"><label for="asl" data-i18n="pl.ad"></label><output id="aread" for="asl"></output></div>
          <input id="asl" type="range" min="0" max="40" step="1" value="20"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="pl.k.centre"></span><span class="v" id="vcentre"></span><span class="f" data-i18n="pl.f.centre"></span></div>
          <div class="stat"><span class="k" data-i18n-html="pl.k.dehors"></span><span class="v" id="vdehors"></span><span class="f" data-i18n="pl.f.dehors"></span></div>
          <div class="stat"><span class="k" data-i18n-html="pl.k.saut"></span><span class="v" id="vsaut"></span><span class="f" data-i18n="pl.f.saut"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="pl.caption"></figcaption>

    <div class="box rem"><b data-i18n="sys.title"></b>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/champ-plans-charges.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/physique-fondamentale.js"></script>
<script src="/racoon/lecons/champs-em.js"></script>
<script src="/racoon/tenseurs.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
const pct = e => F.qty(F.num(100 * e, 2), "%");

/* ---------- two coaxial disks of radius a, d apart, σ1 at z = −d/2 and σ2 at z = +d/2, against two infinite planes ---------- */
(() => {
  const svg = $("pla"), ssl = $("ssl"), asl = $("asl"), d = 1e-3, s1 = 1e-6, E0 = s1 / ES.EPS0, ZM = 2.5;
  function draw() {
    const k = -1 + +ssl.value / 4, a = d * Math.pow(10, +asl.value / 20);
    const D = [{ sigma: s1, a, z: -d / 2 }, { sigma: k * s1, a, z: d / 2 }], P = D.map(p => ({ sigma: p.sigma, z: p.z }));
    const disk = u => ES.disquesAxe(D, u * d) / E0, plane = u => ES.champPlans(P, u * d) / E0;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { b: 44 }, x: { domain: [-ZM, ZM], label: t("pl.x"), fmt: v => F.num(v, 2) }, y: { domain: [-1.1, 1.1], label: t("pl.y"), fmt: v => F.num(v, 2) } });
    const ga = Plot.el("g", { class: "c-label-2" }, g);
    [-0.5, 0.5].forEach(u => Plot.el("line", { x1: x(u), x2: x(u), y1: y(-1.1), y2: y(1.1), class: "stroke thin dash" }, ga));
    const seg = (u0, u1) => Array.from({ length: 121 }, (_, i) => u0 + (u1 - u0) * i / 120);
    const pieces = [seg(-ZM, -0.5 - 1e-6), seg(-0.5 + 1e-6, 0.5 - 1e-6), seg(0.5 + 1e-6, ZM)];
    const curve = (f, cls) => { const gc = Plot.el("g", { class: cls }, g); pieces.forEach(us => Plot.el("path", { d: Plot.path(us.map(u => [x(u), y(f(u))])), class: "stroke" }, gc)); };
    curve(plane, "c-ok");
    curve(disk, "c-tint");
    const cIdeal = plane(0), cDisk = disk(0);
    $("sread").textContent = F.num(k, 2);
    $("aread").textContent = F.num(a / d, 2);
    $("vcentre").textContent = Math.abs(cIdeal) > 1e-12 ? pct(1 - cDisk / cIdeal) : "–";
    $("vdehors").textContent = F.num(disk(1.5), 2) + " | " + F.num(plane(1.5), 2);
    $("vsaut").textContent = F.num(disk(-0.5 + 1e-6) - disk(-0.5 - 1e-6), 4);
  }
  ssl.oninput = draw; asl.oninput = draw; draw();
})();

/* ---------- le système décrit : deux disques de 5 cm de rayon à 1 mm, sous 1 kV ---------- */
(() => {
  const a = 0.05, d = 1e-3, U = 1000, s = ES.EPS0 * U / d, D = [{ sigma: s, a, z: -d / 2 }, { sigma: -s, a, z: d / 2 }];
  $("sys").innerHTML = t("sys.body", { sigma: F.si(s, "C·m⁻²"), e: F.si(U / d, "V·m⁻¹"), err: pct(1 - ES.disquesAxe(D, 0) / (s / ES.EPS0)), dehors: F.si(Math.abs(ES.disquesAxe(D, 0.01)), "V·m⁻¹") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kleist", 1745, "experiment"], ["franklin", 1748, "experiment"], ["millikan", 1909, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["multicouche", "plaques"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["distance", "c"], ["valeur", "a"], ["boite", "d"], ["saut", "b"], ["entre", "a"], ["memesigne", "c"], ["bord", "d"], ["conducteur", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 53 });
})();
</script>
</body>
</html>
