<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- un ressort et un frottement solide : l'énergie mécanique part en chaleur ---------- */
(() => {
  const M = 0.5, K = 20, C_FER = 449;                  // kg, N·m⁻¹, J·kg⁻¹·K⁻¹ (fer à 298 K)
  const musl = $("musl"), xsl = $("xsl");
  function draw() {
    const mu = musl.value / 100, x0 = xsl.value / 100, R = Travail.ressortFrottement({ m: M, k: K, mu, x0, duree: 8 });
    const tEnd = R.colle ? Math.max(R.tArret * 1.15, 1) : 8, cm = 100;
    let svg = $("xt"); svg.innerHTML = "";
    let ax = Plot.axes(svg, { fmt: F, w: 640, h: 200, x: { domain: [0, tEnd], label: t("rf.t") }, y: { domain: [-32, 32], label: t("rf.x") } });
    if (R.d > 0) [R.d, -R.d].forEach(y => Plot.el("line", { x1: ax.x(0), x2: ax.x(tEnd), y1: ax.y(y * cm), y2: ax.y(y * cm), class: "ref" }, ax.g));
    const path = (ys, cls, k) => Plot.el("path", { d: ys.map((v, i) => (i ? "L" : "M") + ax.x(R.t[i]).toFixed(1) + " " + ax.y(v * k).toFixed(1)).join("") + (R.colle ? "L" + ax.x(tEnd).toFixed(1) + " " + ax.y(ys[ys.length - 1] * k).toFixed(1) : ""), class: cls }, ax.g);
    path(R.x, "curve", cm);
    svg = $("et"); svg.innerHTML = "";
    const E0 = R.em[0];
    ax = Plot.axes(svg, { fmt: F, w: 640, h: 200, x: { domain: [0, tEnd], label: t("rf.t") }, y: { domain: [0, 1], label: t("rf.e") } });
    path(R.ec, "stroke c-ok", 1); path(R.ep, "stroke c-warn", 1); path(R.em, "curve", 1);
    path(R.wf.map(w => E0 + w), "stroke dash c-label-2", 1);
    const n = R.em.length - 1, Q = R.chaleur;
    $("muread").textContent = F.fix(mu, 2);
    $("xread").textContent = F.si(x0, "m", { prefix: "", sig: 2 });
    $("varret").textContent = R.colle ? F.si(R.tArret, "s") : "–";
    $("farret").textContent = R.colle ? t("rf.f.arret", { x: F.si(Math.abs(R.xArret), "m", { prefix: "m", sig: 2 }), n: R.arrets.length - 1 }) : t("rf.f.libre");
    $("vq").textContent = F.si(Q, "J", { prefix: Q > 0.01 || Q === 0 ? "" : "m" });
    $("vbilan").textContent = F.qty(F.sci(Math.max(...R.em.map((e, i) => Math.abs(e - E0 - R.wf[i]))) || 0, 1), "J");
    $("vdt").textContent = Q > 0 ? F.si(Q / (M * C_FER), "K") : F.qty("0", "K");
  }
  musl.oninput = xsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rumford", 1798, "experiment"], ["mayer", 1842, "idea"], ["joule", 1845, "experiment"], ["helmholtz", 1847, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["freins", "recuperation"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pente", "c"], ["amplitude", "b"], ["ou", "a"], ["atomes", "d"], ["ascenseur", "b"], ["deuxtours", "a"], ["chaud", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 144 });
})();
</script>
