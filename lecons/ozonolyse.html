<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, A = O.Alcenes, sym = s => t("chim.sym", { s }), $ = id => document.getElementById(id);

/* ---------- mécanismes limites, acte par acte : flèches courbes et comptes d'électrons du module ---------- */
function mecanisme(id, o) {
  const vues = O.actesMecanisme(id, Object.assign({ texte: sym, echelle: 40 }, o));
  ActesMecanisme.monter({ vues, textes: textOf("meca.actes." + id, vues.map((_, k) => "a" + k)), svg: $("m-" + id), boutons: $("m-" + id + "-actes"), texte: $("m-" + id + "-texte") });
}
mecanisme("ozonolyse", { doublets: [4, 5, 6] });
const peindre = (svg, m, o) => { const d = O.dessin(m, Object.assign({ texte: sym }, o)); svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };
const IDS = ["methylbut2ene", "hex3eneE", "hex3eneZ", "but1ene", "methylcyclohexene", "limonene"], noms = textOf("oz.alcenes", IDS);
const fam = textOf("oz.familles", ["aldehyde", "cetone", "acide"]);
const formule = m => O.ecrireFormule(O.formuleBrute(m)), familles = m => O.groupes(m).filter(g => g in fam).map(g => fam[g]).join(", ");
const doubles = m => m.liaisons.filter(l => l.ordre === 2).flatMap(l => [l.a, l.b]);
/* une rangée de dessins : la molécule de départ (si m), puis les fragments */
function rangee(el, m, frag) {
  const cases = (m ? [m] : []).concat(frag);
  el.innerHTML = cases.map((_, k) => `<div><svg class="fig no-sigle" role="img" aria-label="${m && !k ? t("oz.ariaA") : t("oz.ariaP")}"></svg><p class="readout"></p></div>`).join("");
  [...el.children].forEach((div, k) => {
    const x = cases[k], depart = m && !k;
    peindre(div.querySelector("svg"), x, { echelle: 32, surligne: depart ? doubles(x) : [] });
    div.querySelector("p").textContent = depart ? t("oz.depart", { f: formule(x) }) : t("oz.produit", { f: formule(x), g: familles(x) });
  });
}

/* ---------- produits d'ozonolyse ---------- */
(() => {
  const sel = $("alcene");
  sel.innerHTML = IDS.map(id => `<option value="${id}">${noms[id]}</option>`).join("");
  let tr = "reducteur";
  function maj() {
    const m = A.molecule(sel.value);
    rangee($("produits"), m, A.ozonolyse(m, { oxydant: tr === "oxydant" }));
    document.querySelectorAll("#traitement button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.t === tr)));
  }
  sel.onchange = maj;
  $("traitement").onclick = e => { const x = e.target.closest("button"); if (!x) return; tr = x.dataset.t; maj(); };
  maj();
})();

/* ---------- énigme : remonter à l'alcène ---------- */
(() => {
  const pari = $("pari"), ORDRE = ["methylcyclohexene", "hex3eneZ", "but1ene", "limonene", "methylbut2ene", "hex3eneE"];
  pari.innerHTML = IDS.map(id => `<option value="${id}">${noms[id]}</option>`).join("");
  let k = 0;
  const montrer = () => { rangee($("enigme"), null, A.ozonolyse(A.molecule(ORDRE[k]))); $("verdict").textContent = t("en.attente"); };
  $("verifier").onclick = () => {
    const cache = A.ozonolyse(A.molecule(ORDRE[k])), essai = A.ozonolyse(A.molecule(pari.value));
    const juste = A.memesProduits(cache, essai);
    $("verdict").textContent = juste ? t(pari.value === ORDRE[k] ? "en.juste" : "en.justeAutre", { n: noms[pari.value] })
      : t("en.faux", { n: noms[pari.value], l: essai.map(formule).join(" + ") });
  };
  $("autre").onclick = () => { k = (k + 1) % ORDRE.length; montrer(); };
  montrer();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["schonbein", 1840, "experiment"], ["harries", 1905, "experiment"], ["criegee", 1953, "idea"], ["revue", 1975, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["azelaique", "brassylique"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dipole", "c"], ["traitement", "a"], ["oxydant", "d"], ["cycle", "b"], ["ze", "c"], ["compter", "a"], ["limonene", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
