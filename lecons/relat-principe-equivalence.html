<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, c = R.c, GM = Constantes.GM_E, RT = Constantes.R_E_mean, g0 = Constantes.g_CPGE;

/* ---------- une bille lâchée dans une cabine fermée : au sol, dans une fusée, en chute libre ---------- */
(() => {
  const h0 = 1.5, L = 3, svg = $("chute"), sa = $("sa"), seg = $("mode");
  let mode = "sol";
  function draw() {
    const a = +sa.value / 100 * g0;                                        // the rocket's thrust, 0 to 3 g
    const o = mode === "sol" ? { g: g0, A: 0 } : mode === "fusee" ? { g: 0, A: a } : { g: g0, A: -g0 };
    const s = R.chuteCabine(Object.assign({ h0 }, o));
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 44 }, x: { domain: [0, 1], label: t("fig.xaxis") }, y: { domain: [0, 2], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(1), y1: P.y(0), y2: P.y(0), class: "ref" }, P.g);
    const ts = Array.from({ length: 201 }, (_, i) => i / 200);
    Plot.el("path", { d: Plot.path(ts.map(x => [P.x(x), P.y(s.h(x))])), class: "curve" }, P.g);
    if (s.tSol !== null && s.tSol <= 1) Plot.el("circle", { cx: P.x(s.tSol), cy: P.y(0), r: 5, class: "dot" }, P.g);
    $("sar").textContent = F.si(a, "m·s⁻²");
    sa.disabled = mode !== "fusee";
    $("vgapp").textContent = F.si(s.gApp, "m·s⁻²");
    $("fgapp").textContent = t("fig.f." + mode);
    $("vtsol").textContent = s.tSol === null ? t("fig.jamais") : F.si(s.tSol, "s");
    $("ftsol").textContent = t("fig.f.tsol", { h: F.si(h0, "m") });
    $("vlum").textContent = s.gApp > 0 ? F.si(s.gApp * L * L / (2 * c * c), "m") : "0";
    $("flum").textContent = t("fig.f.lum", { L: F.si(L, "m"), t: F.si(L / c, "s") });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; draw(); });
  sa.oninput = draw; draw();
})();

/* ---------- les marées : deux corps lâchés dans une cabine en chute libre s'écartent ou se rapprochent ---------- */
(() => {
  const svg = $("maree"), sz = $("sz"), sdd = $("sdd"), st = $("st");
  function draw() {
    const z = 10 ** (+sz.value / 100) * 1e3 - 1e3;                        // altitude, 0 to 40 000 km (log of 1 km + z)
    const d = 10 ** (+sdd.value / 100), T = 10 ** (+st.value / 100), r = RT + z;
    const m = R.maree(GM, r, d), gr = GM / (r * r), drv = R.deriveMaree(GM, r, d, T);
    svg.innerHTML = "";
    const ts = Array.from({ length: 201 }, (_, i) => T * i / 200), vs = ts.map(x => R.deriveMaree(GM, r, d, x));
    const ymax = Math.max(1e-30, ...vs.map(v => v.vertical / d)), ymin = Math.min(0, ...vs.map(v => v.horizontal / d));
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 64, b: 44 }, x: { domain: [0, T], label: t("fig.taxis") }, y: { domain: [1.1 * ymin, 1.1 * ymax], label: t("fig.daxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(T), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("path", { d: Plot.path(ts.map((x, i) => [P.x(x), P.y(vs[i].vertical / d)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(ts.map((x, i) => [P.x(x), P.y(vs[i].horizontal / d)])), class: "ref" }, P.g);
    $("szr").textContent = F.si(z, "m");
    $("sddr").textContent = F.si(d, "m");
    $("str").textContent = F.si(T, "s");
    $("vg").textContent = F.si(gr, "m·s⁻²");
    $("fg").textContent = t("fig.f.g", { r: F.si(r, "m") });
    $("vmar").textContent = F.qty(F.sci(m.vertical, 2), "m·s⁻²");
    $("fmar").textContent = t("fig.f.maree", { x: F.sci(m.vertical / gr, 2) });
    $("vder").textContent = F.si(drv.vertical, "m");
    $("fder").textContent = t("fig.f.derive", { h: F.si(drv.horizontal, "m") });
  }
  sz.oninput = sdd.oninput = st.oninput = draw; draw();
})();

/* ---------- le système décrit : une station en orbite à 400 km, un module de 10 m ---------- */
(() => {
  const z = 400e3, d = 5, r = RT + z, gr = GM / (r * r), m = R.maree(GM, r, d), drv = R.deriveMaree(GM, r, d, 60);
  $("sys1").innerHTML = t("sys1.body", { z: F.si(z, "m"), g: F.si(gr, "m·s⁻²"), pc: F.num(100 * gr / g0, 2), d: F.si(d, "m"),
    a: F.qty(F.sci(m.vertical, 2), "m·s⁻²"), x: F.sci(m.vertical / gr, 2), der: F.si(drv.vertical, "m", { prefix: "m", sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["einstein", 1907, "idea"], ["eotvos", 1909, "experiment"], ["apollo", 1971, "experiment"], ["microscope", 2022, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["parabole"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["orbite", "b"], ["fusee", "d"], ["fait", "a"], ["vertical", "c"], ["horizontal", "b"], ["lumiere", "a"], ["taille", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 425 });
})();
</script>
