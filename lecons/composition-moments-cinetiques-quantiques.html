<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro;
const fracJ = v => Number.isInteger(v) ? (v > 0 ? "+" : "") + F.num(v, 2) : (v < 0 ? "−" : "+") + Math.round(Math.abs(2 * v)) + "/2";
const fracA = v => Number.isInteger(v) ? F.num(v, 2) : Math.round(2 * v) + "/2";

/* ---------- the states |J, M⟩ of two angular momenta, as bars of Clebsch–Gordan coefficients over the products |m_a; m_b⟩ ---------- */
(() => {
  const svg = $("barres"), se = $("setat"), A = $("ja"), B = $("jb");
  let ja = 0.5, jb = 1;
  function draw() {
    const E = Q.composer(ja, jb), n = E.length;
    se.max = String(n - 1); if (+se.value > n - 1) se.value = String(n - 1);
    const e = E[+se.value], prods = [];
    for (let ma = ja; ma >= -ja; ma--) for (let mb = jb; mb >= -jb; mb--) if (Math.abs(ma + mb - e.M) < 1e-9) prods.push([ma, mb]);
    svg.innerHTML = "";
    const w = 560 / Math.max(prods.length, 1), y0 = 130, H = 100;
    Plot.el("line", { x1: 40, x2: 620, y1: y0, y2: y0, class: "stroke thin c-label-2" }, svg);
    prods.forEach(([ma, mb], i) => {
      const t0 = e.termes.find(u => Math.abs(u.m1 - ma) < 1e-9 && Math.abs(u.m2 - mb) < 1e-9), c = t0 ? t0.c : 0, x = 50 + i * w;
      Plot.el("rect", { x: x + w * 0.2, y: c >= 0 ? y0 - H * c : y0, width: w * 0.6, height: Math.abs(H * c), class: "fill " + (c >= 0 ? "c-tint" : "c-warn") }, svg);
      const lab = Plot.el("text", { x: x + w / 2, y: 252, "text-anchor": "middle", class: "c-label-2" }, svg); lab.textContent = fracJ(ma) + " ; " + fracJ(mb);
      const val = Plot.el("text", { x: x + w / 2, y: c >= 0 ? y0 - H * c - 6 : y0 + Math.abs(H * c) + 14, "text-anchor": "middle", class: "c-label" }, svg); val.textContent = F.fix(c, 3);
    });
    const norme = e.termes.reduce((s, u) => s + u.c * u.c, 0);
    $("setatr").textContent = t("fig.v.etat", { J: fracA(e.J), M: fracJ(e.M) });
    $("vcp").textContent = F.num(n, 3);
    $("fcp").textContent = t("fig.f.compte", { a: F.num(2 * ja + 1, 2), b: F.num(2 * jb + 1, 2), J: [...new Set(E.map(x => x.J))].map(fracA).join(", ") });
    $("vno").textContent = F.fix(norme, 6);
    $("fno").textContent = t("fig.f.norme");
    A.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === ja)));
    B.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === jb)));
  }
  A.querySelectorAll("button").forEach(b => b.onclick = () => { ja = +b.dataset.v; draw(); });
  B.querySelectorAll("button").forEach(b => b.onclick = () => { jb = +b.dataset.v; draw(); });
  se.oninput = draw; draw();
})();

/* ---------- the system described: hydrogen's two spins, and the 21 cm line ---------- */
(() => {
  const f = 1420.405751768e6, lam = Constantes.c / f, E = Constantes.h * f / Constantes.e, kT = Constantes.k_B * 2.725 / Constantes.e;
  $("sys1").innerHTML = t("sys1.body", { l: F.si(lam, "m"), e: F.qty(F.sci(E, 3), "eV") });
  $("sys2").innerHTML = t("sys2.body", { r: F.num(kT / E, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["racah", 1942, "idea"], ["hulst", 1944, "idea"], ["ewen", 1951, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["galaxie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["somme", "a"], ["valeurs", "d"], ["compte", "b"], ["haut", "c"], ["coef", "a"], ["deux", "b"], ["structure", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1806 });
})();
</script>
