<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, k_B = Constantes.k_B;

/* ---------- le moteur : vitesse, rendement, puissance en fonction de la charge ---------- */
(() => {
  const T2 = 300, kT = k_B * T2, L0 = -1, L1 = 10;               // charge Lθ en unités k_B T2 ; θ = 1 rad, τ = 1 : vitesses en θ/τ
  const s1 = $("t1"), se = $("eps"), sl = $("lo"), sv = $("vit"), sr = $("rend");
  function draw() {
    const T1 = +s1.value, e = +se.value, lo = +sl.value, base = { eps: e * kT, theta: 1, T1, T2, tau: 1 };
    const at = (x, K) => S.cliquetMoteur(Object.assign({ L: x * kT, fuite: K }, base));
    let Pmax = 0, best = null;
    for (let k = 0; k <= 600; k++) { const x = L0 + (L1 - L0) * k / 600, m = at(x); if (m.P > Pmax) { Pmax = m.P; best = m; } }
    const K = best ? 0.2 * best.Q1 / Math.abs(T1 - T2 || 1) : 0;    // fuite : 20 % de Q1 à puissance maximale
    const xs = Array.from({ length: 301 }, (_, k) => L0 + (L1 - L0) * k / 300), u = Math.exp(-e);   // ω en unités θ e^(−ε/kT2)/τ
    const w = xs.map(x => at(x).omega / u), w461 = xs.map(x => S.omega461(e * kT, x * kT, 1, T2, 1) / u);
    const y0 = -1.5, y1 = Math.max(3, 1.3 * at(0).omega / u);
    sv.innerHTML = "";
    const av = Plot.axes(sv, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 64 }, x: { domain: [L0, L1], label: t("sim.x") }, y: { domain: [y0, y1], label: t("sim.yw") } });
    const dans = ys => Plot.path(xs.map((x, k) => [x, ys[k]]).filter(([, y]) => y >= y0 && y <= y1).map(([x, y]) => [av.x(x), av.y(y)]));
    Plot.el("line", { x1: av.x(L0), x2: av.x(L1), y1: av.y(0), y2: av.y(0), class: "stroke thin c-label" }, av.g);
    Plot.el("path", { d: dans(w461), class: "stroke thin dash c-label-2" }, av.g);
    Plot.el("path", { d: dans(w), class: "stroke bold c-tint" }, av.g);
    const m = at(lo), arret = m.Larret / kT;
    if (m.omega / u >= y0 && m.omega / u <= y1) Plot.el("circle", { cx: av.x(lo), cy: av.y(m.omega / u), r: 5, class: "fill c-tint" }, av.g);
    sr.innerHTML = "";
    const ar = Plot.axes(sr, { fmt: F, w: 640, h: 220, pad: { b: 44, l: 64 }, x: { domain: [0, L1], label: t("sim.x") }, y: { domain: [0, 1.05], label: t("sim.yr") } });
    const xp = xs.filter(x => x >= 0);
    const seg = f => { const p = []; xp.forEach(x => { const v = f(x); if (v !== null && isFinite(v)) p.push([ar.x(x), ar.y(Math.min(1.05, v))]); }); return p; };
    if (T1 > T2) {
      Plot.el("path", { d: Plot.path(seg(x => { const r = at(x); return r.eta === null ? null : r.eta / r.carnot; })), class: "stroke bold c-tint" }, ar.g);
      Plot.el("path", { d: Plot.path(seg(x => { const r = at(x, K); return r.eta === null ? null : r.eta / r.carnot; })), class: "stroke c-warn" }, ar.g);
      Plot.el("path", { d: Plot.path(seg(x => { const r = at(x); return r.P > 0 ? r.P / Pmax : null; })), class: "stroke thin dash c-label-2" }, ar.g);
    }
    $("t1v").innerHTML = F.kelvin(T1); $("epsv").textContent = F.num(e, 2); $("lov").textContent = F.num(lo, 3);
    $("vw").textContent = F.num(m.omega / u, 3);
    $("fw").textContent = t(m.omega > 0 ? "sim.f.avant" : m.omega < 0 ? "sim.f.arriere" : "sim.f.arret0");
    $("veta").textContent = m.eta === null ? "—" : F.qty(F.num(100 * m.eta, 3), "%");
    $("feta").textContent = T1 > T2 ? t("sim.f.eta", { c: F.num(100 * m.carnot, 3) }) : t("sim.f.froid");
    $("varret").textContent = F.num(arret, 3);
  }
  [s1, se, sl].forEach(x => x.oninput = draw); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["brillouin", 1950, "idea"], ["parrondo", 1996, "idea"], ["eshuis", 2010, "experiment"], ["li", 2018, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["kinesine", "tri"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["avant", "b"], ["arret", "d"], ["carnot", "a"], ["puissance", "c"], ["chaud", "b"], ["redresseur", "a"], ["fuite", "d"], ["kinesine", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 462 });
})();
</script>
