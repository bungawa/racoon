    <div class="eq"><math display="block"><msub><mi>L</mi><mrow><mn>1</mn><mo>→</mo><mn>2</mn></mrow></msub><mo>(</mo><mi>T</mi><mo>)</mo><mo>=</mo><msub><mi>h</mi><mn>2</mn></msub><mo>(</mo><mi>T</mi><mo>)</mo><mo>−</mo><msub><mi>h</mi><mn>1</mn></msub><mo>(</mo><mi>T</mi><mo>)</mo></math></div>

      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="chq" data-i18n="ch.q"></label><output id="chqv" for="chq"></output></div>
            <input id="chq" type="range" min="0" max="3400" step="1" value="1500"></div>
          <div class="ctl"><div class="row"><label for="chp" data-i18n="ch.p"></label><output id="chpv" for="chp"></output></div>
            <input id="chp" type="range" min="3.3" max="6.3" step="0.005" value="5.006"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="ch.k.etat"></span><span class="v" id="che"></span><span class="f" id="chef"></span></div>
          <div class="stat"><span class="k" data-i18n="ch.k.T"></span><span class="v" id="chT"></span><span class="f" id="chTf"></span></div>
          <div class="stat"><span class="k" data-i18n="ch.k.s"></span><span class="v" id="chs"></span><span class="f" id="chsf"></span></div>

      </div>
      <figcaption data-i18n-html="ch.caption"></figcaption>
    </figure>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>L</mi><mo>=</mo><mi mathvariant="normal">Δ</mi><mi>h</mi><mo>=</mo><mi mathvariant="normal">Δ</mi><mi>u</mi><mo>+</mo><mi>p</mi><mspace width="0.1em"></mspace><mi mathvariant="normal">Δ</mi><mi>v</mi></math></div>
    <p class="validite" data-i18n-html="val.du"></p>
    <p data-i18n-html="s2.p2"></p>
    <figure class="chart">
      <svg class="fig" id="lt" role="img" data-i18n-attr="aria-label:lt.aria"></svg>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="ltT" data-i18n="lt.T"></label><output id="ltTv" for="ltT"></output></div>
          <input id="ltT" type="range" min="273.16" max="647.096" step="0.01" value="373.12"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="lt.k.L"></span><span class="v" id="ltL"></span><span class="f" id="ltLf"></span></div>
          <div class="stat"><span class="k" data-i18n="lt.k.w"></span><span class="v" id="ltw"></span><span class="f" id="ltwf"></span></div>
          <div class="stat"><span class="k" data-i18n="lt.k.s"></span><span class="v" id="lts"></span><span class="f" id="ltsf"></span></div>

      <div class="legend"><span class="c-tint" data-i18n="lt.leg.L"></span><span class="c-warn" data-i18n="lt.leg.w"></span></div>

    <div class="eq"><math display="block"><mi mathvariant="normal">Δ</mi><msub><mi>s</mi><mrow><mn>1</mn><mo>→</mo><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mi>L</mi><mrow><mn>1</mn><mo>→</mo><mn>2</mn></mrow></msub><mo>(</mo><mi>T</mi><mo>)</mo></mrow><mi>T</mi></mfrac></math></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/enthalpie-et-entropie-de-changement-d-etat.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/thermo.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, Th = Thermo, E = Th.EAU;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const kJkg = j => F.qty(F.num(j / 1e3, 4), "kJ·kg⁻¹"), JKkg = s => F.qty(F.num(s, 4), "J·K⁻¹·kg⁻¹");
const pct = r => F.qty(F.num(100 * r, 3), "%");

/* ---------- courbe de chauffage à pression constante ---------- */
(() => {
  const svg = $("ch"), Q1 = 3400;
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { b: 44, l: 56 },
    x: { domain: [0, Q1], label: t("ch.x") }, y: { domain: [240, 520], label: t("ch.y") } });
  const courbe = P("path", { class: "curve" }, g), dot = P("circle", { r: 6, class: "dot" }, g);
  const lbl = ["fusion", "ebullition"].map(() => P("text", { "text-anchor": "middle" }, g));
  const sq = $("chq"), sp = $("chp"), ETATS = textOf("ch.etats", ["glace", "fusion", "eau", "ebullition", "vapeur"]);
  function upd() {
    const p = Math.pow(10, +sp.value), q = +sq.value * 1e3, o = { p };
    const pts = []; for (let i = 0; i <= 680; i++) { const r = Th.chauffage(Q1 * 1e3 * i / 680, o); pts.push([x(Q1 * i / 680), y(Math.min(r.T, 520))]); }
    courbe.setAttribute("d", Plot.path(pts));
    const r = Th.chauffage(q, o), [q1, q2, q3, q4] = r.paliers;
    [[q1, q2, r.Tf, "ch.l.fusion"], [q3, q4, r.Te, "ch.l.ebullition"]].forEach(([a, b, T, k], i) => {
      lbl[i].setAttribute("x", x((a + b) / 2e3)); lbl[i].setAttribute("y", y(T) - 10); lbl[i].textContent = t(k, { L: kJkg(b - a) }); });
    dot.setAttribute("cx", x(q / 1e3)); dot.setAttribute("cy", y(Math.min(r.T, 520)));
    $("chqv").textContent = kJkg(q); $("chpv").textContent = F.si(p, "Pa");
    $("che").textContent = ETATS[r.etat];
    $("chef").textContent = r.etat === "fusion" ? t("ch.f.fondu", { x: pct(r.x) }) : r.etat === "ebullition" ? t("ch.f.vapo", { x: pct(r.x) }) : t("ch.f.une");
    $("chT").innerHTML = F.kelvin(r.T); $("chTf").innerHTML = t("ch.f.paliers", { f: F.kelvin(r.Tf), e: F.kelvin(r.Te) });
    $("chs").textContent = JKkg(r.s); $("chsf").textContent = t("ch.f.part", { r: pct((q4 - q3) / q4) });
  }
  sq.oninput = sp.oninput = upd; upd();
})();

/* ---------- L(T), travail de dilatation, entropie de vaporisation ---------- */
(() => {
  const svg = $("lt");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44, l: 60 },
    x: { domain: [270, 650], label: t("lt.x") }, y: { domain: [0, 2600], label: t("lt.y") } });
  const L = [], W = [];
  for (let i = 0; i <= 400; i++) { const T = E.Tt + (E.Tc - E.Tt) * i / 400, s = Th.saturationEau(T);
    L.push([x(T), y((s.hV - s.hL) / 1e3)]); W.push([x(T), y(s.p * (1 / s.rhoV - 1 / s.rhoL) / 1e3)]); }
  P("path", { d: Plot.path(L), class: "curve" }, g); P("path", { d: Plot.path(W), class: "ref" }, g);
  const dot = P("circle", { r: 6, class: "dot" }, g), sT = $("ltT");
  function upd() {
    const T = +sT.value, s = Th.saturationEau(T), Lv = s.hV - s.hL, w = s.p * (1 / s.rhoV - 1 / s.rhoL);
    dot.setAttribute("cx", x(T)); dot.setAttribute("cy", y(Lv / 1e3));
    $("ltTv").innerHTML = t("lt.Tread", { T: F.kelvin(T), p: F.si(s.p, "Pa") });
    $("ltL").textContent = kJkg(Lv); $("ltLf").textContent = t("lt.f.u", { u: kJkg(Lv - w) });
    $("ltw").textContent = kJkg(w); $("ltwf").textContent = Lv > 0 ? t("lt.f.w", { r: pct(w / Lv) }) : t("lt.f.c");
    $("lts").textContent = JKkg(Lv / T); $("ltsf").textContent = t("lt.f.mol", { s: F.qty(F.num(Lv / T * E.M, 3), "J·K⁻¹·mol⁻¹") });
  }
  sT.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["black", 1762, "experiment"], ["watt", 1769, "use"], ["trouton", 1884, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sueur", "glaciere", "vapeur"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["palier", "a"], ["du", "c"], ["entropie", "b"], ["trouton", "d"], ["critique", "a"], ["brulure", "b"], ["irreversible", "c"], ["glacons", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
