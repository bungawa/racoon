    <div class="eq"><math display="block"><mi>κ</mi><mo>−</mo><mn>1</mn><mo>=</mo><mfrac><mi>P</mi><mrow><msub><mi>ε</mi><mn>0</mn></msub><mi>E</mi></mrow></mfrac></math><span class="n">(11.1)</span></div>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi mathvariant="bold">p</mi><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>q</mi><mi>i</mi></msub><msub><mi mathvariant="bold">r</mi><mi>i</mi></msub></math></div>
    <p class="validite" data-i18n-html="val.p"></p>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/lecons/integration.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, e = Constantes.e, a0 = Constantes.a0, U30 = 1e-30;
const mesure = id => ES.MOLECULES_MESURES.find(m => m.id === id);

/* ---------- une molécule coudée ---------- */
(() => {
  const svg = $("mol"), as = $("as");
  /* the two point-charge models of the shared module: their end charge q and bond length L */
  const MODELES = {
    eau: { q: ES.MOLECULES.eau.charges[1].q, L: 95.7e-12, angle: 104.5, centre: "O", bout: "H", alpha: mesure("H2O").alphaF },
    co2: { q: ES.MOLECULES.co2.charges[0].q, L: 116e-12, angle: 180, centre: "C", bout: "O", alpha: mesure("CO2").alphaF },
  };
  let mod = "eau";
  function dessin(m, th) {
    svg.innerHTML = "";
    const P = (tag, a, g) => Plot.el(tag, a, g || svg), cx = 320, cy = 175, s = 1.1e12, R = m.L * s;
    const pts = [[cx - R * Math.sin(th / 2), cy - R * Math.cos(th / 2)], [cx + R * Math.sin(th / 2), cy - R * Math.cos(th / 2)]];
    const gl = P("g", { class: "c-label" });
    pts.forEach(([x, y]) => P("line", { x1: cx, y1: cy, x2: x.toFixed(1), y2: y.toFixed(1), class: "stroke" }, gl));
    const cls = q => (q > 0 ? "c-warn" : "c-tint");
    P("circle", { cx, cy, r: 26, class: "fill", opacity: 0.85 }, P("g", { class: cls(-2 * m.q) }));
    pts.forEach(([x, y]) => P("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 17, class: "fill", opacity: 0.85 }, P("g", { class: cls(m.q) })));
    const gn = P("g", { class: "c-label" });
    P("text", { x: cx, y: cy + 5, "text-anchor": "middle", class: "label" }, gn).textContent = m.centre;
    pts.forEach(([x, y]) => (P("text", { x: x.toFixed(1), y: (y + 5).toFixed(1), "text-anchor": "middle", class: "label" }, gn).textContent = m.bout));
    /* p points from the negative charges toward the positive ones: along +y (up on screen) when the ends are positive */
    const p = ES.coudee(m.q, m.L, th).p, len = Math.min(110, Math.abs(p) / (2 * e * 1e-11) * 30);
    if (len > 2) Plot.fleche(P("g", { class: "c-label" }), [560, 140 + Math.sign(p) * len / 2], [560, 140 - Math.sign(p) * len / 2], { trait: "stroke bold" });
    P("text", { x: 560, y: 245, "text-anchor": "middle", class: "label" }, gl).textContent = t("fig.p");
    P("text", { x: 90, y: 245, "text-anchor": "middle", class: "label" }, gl).textContent = t("fig.angle", { a: F.num(th * 180 / Math.PI, 4) });
  }
  function draw() {
    const m = MODELES[mod], th = +as.value * Math.PI / 180, p = Math.abs(ES.coudee(m.q, m.L, th).p);
    dessin(m, th);
    $("ar").textContent = F.num(+as.value, 4) + " °";
    $("vp").textContent = F.qty(F.sci(p, 3), "C·m");
    $("fp").textContent = t("f.p", { D: F.num(p / ES.DEBYE, 3) });
    $("va").textContent = F.num(p / (e * a0), 2);
    $("fa").textContent = t("f.ea0");
    const pi = m.alpha * ES.EPS0 * 1e6;
    $("vq").textContent = F.qty(F.sci(pi, 2), "C·m");
    $("fq").textContent = p > 1e-40 ? t("f.q", { r: F.sci(pi / p, 1) }) : t("f.q0");
  }
  document.querySelectorAll("#mols button").forEach(bt => bt.onclick = () => {
    mod = bt.dataset.m; as.value = MODELES[mod].angle;
    document.querySelectorAll("#mols button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  as.oninput = draw; draw();
})();

/* ---------- les moments mesurés ---------- */
(() => {
  const svg = $("barres"), ids = ["H2O", "NH3", "HCl", "CO", "H2", "N2", "O2", "CO2", "CH4"], nom = t("mol.formules");
  const A = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 70, r: 20, t: 10, b: 40 }, x: { domain: [0, 7], label: t("fig2.x") }, y: { domain: [0, ids.length], ticks: ids.length, fmt: () => "" } });
  const g = Plot.el("g", { class: "c-label" }, A.g), h = (A.y(0) - A.y(1)) * 0.6;
  ids.forEach((id, i) => {
    const m = mesure(id), yc = A.y(ids.length - i - 0.5), v = m.pSI / U30;
    Plot.el("rect", { x: A.x(0), y: (yc - h / 2).toFixed(1), width: Math.max(1.5, A.x(v) - A.x(0)).toFixed(1), height: h.toFixed(1), class: "fill", opacity: 0.7 }, g);
    Plot.el("text", { x: A.x(0) - 8, y: (yc + 4).toFixed(1), "text-anchor": "end", class: "label" }, g).textContent = nom[id];
    Plot.el("text", { x: (A.x(v) + 6).toFixed(1), y: (yc + 4).toFixed(1), class: "tick" }, g).textContent = v > 0 ? F.num(v, 3) : t("fig2.zero");
  });
})();

/* ---------- le système décrit : moment permanent et moment induit ---------- */
(() => {
  const w = mesure("H2O"), E0 = 1e6, pi = w.alphaF * ES.EPS0 * E0, T = 293.15, kT = Constantes.k_B * T, x = w.pSI * E0 / kT;
  $("sys1").innerHTML = t("sys1.body", { p: F.num(w.pSI / U30, 3), pm: F.num(ES.MOLECULES.eau.p / U30, 3), pi: F.sci(pi, 2), r: F.sci(pi / w.pSI, 1),
    T: F.kelvin(T), x: F.sci(x, 2), o: F.sci(w.pSI * x / 3, 1), ro: F.num(w.pSI * x / 3 / pi, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["tyndall", 1859, "experiment"], ["debye", 1912, "idea"], ["nobel", 1936, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ir"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["o2", "c"], ["co2", "a"], ["coude", "d"], ["ordre", "b"], ["eau", "b"], ["induit", "c"], ["kappa", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1101 });
})();
</script>
