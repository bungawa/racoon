<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, X = Cristaux;
const keyed = (el, tag, ids, items, sub) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text.replace(/\{(\w+)\}/g, (m, k) => (sub && sub[id] && k in sub[id] ? sub[id][k] : m))}</span></div>`).join(""); };
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); return pick; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- le cristal parfait : Frenkel ---------- */
(() => {
  /* measured: resolved shear stresses that move dislocations in pure copper crystals (0,28 to 2,3 MPa); for iron,
     the shear yield of the construction steel S235 */
  const MESURE = { Cu: { lo: 0.28e6, hi: 2.3e6 }, Fe: { lo: X.cissionLimite(X.ACIERS.S235), hi: X.cissionLimite(X.ACIERS.S235) } };
  const svg = $("courbe");
  function upd(m) {
    const M = X.METAUX[m], g = X.glissement(M.reseau, M.a), tm = X.cissionTheorique(M.G, g.b, g.d);
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, 1], label: t("fr.ax.x") }, y: { domain: [-1.2 * tm / 1e9, 1.2 * tm / 1e9], label: t("fr.ax.y") } });
    const pts = Array.from({ length: 201 }, (_, i) => i / 200);
    P("path", { d: Plot.path(pts.map(u => [ax.x(u), ax.y(X.frenkel(u * g.b, M.G, g.b, g.d) / 1e9)])), class: "curve" }, svg);
    const hk = pts.filter(u => M.G * u * g.b / g.d <= 1.2 * tm);
    P("path", { d: Plot.path(hk.map(u => [ax.x(u), ax.y(M.G * u * g.b / g.d / 1e9)])), class: "stroke thin dash c-label-2" }, svg);
    $("vbd").textContent = F.si(g.b, "m") + " ; " + F.si(g.d, "m");
    $("fbd").textContent = t("fr.f.bd", { plan: g.plan, dir: g.direction });
    $("vth").textContent = F.si(tm, "Pa", { prefix: "G" });
    const ms = MESURE[m];
    $("vmes").textContent = ms.lo === ms.hi ? F.si(ms.lo, "Pa", { prefix: "M" }) : t("fr.v.plage", { lo: F.num(ms.lo / 1e6, 2), hi: F.qty(F.num(ms.hi / 1e6, 2), "MPa") });
    $("fmes").textContent = t("fr.f.mes." + m);
    $("vrap").textContent = ms.lo === ms.hi ? F.num(tm / ms.lo, 2) : t("fr.v.plage", { lo: F.sci(tm / ms.hi, 1), hi: F.sci(tm / ms.lo, 1) });
  }
  seg($("metal"), "m", upd);
})();

/* ---------- une rangée qui glisse : Frenkel–Kontorova ---------- */
(() => {
  const N = 40, svg = $("chaine"), L = 15, ox = 320 - L * N / 2, Y0 = 70, Y1 = 150;
  let disloc = true, k = 1, f = 0.3, x = null, seuil = 1, x0 = null, raf = 0;
  const px = u => ox + L * u;
  function depart() {
    x = X.fkChaine(N, disloc, k); if (disloc) x = X.fkContraint(x, k).x; x0 = x.slice();
    seuil = X.fkSeuil(k, disloc);
    $("vseuil").textContent = F.fix(seuil, seuil < 0.1 ? 3 : 2);
  }
  function dessin() {
    svg.innerHTML = "";
    const sub = Array.from({ length: 2 * N + 41 }, (_, i) => -10 + i / 2).filter(u => px(u) >= 0 && px(u) <= 640);
    sub.forEach(u => { if (Number.isInteger(u)) P("circle", { cx: px(u), cy: Y1, r: 6, class: "fill c-label-2" }, svg); });
    P("path", { d: Plot.path(Array.from({ length: 321 }, (_, i) => { const u = (i * 2 - ox) / L; return [i * 2, Y0 + 26 - 14 * Math.cos(2 * Math.PI * u)]; })), class: "stroke thin c-label-2" }, svg);
    for (let i = 0; i + 1 < x.length; i++) P("line", { x1: px(x[i]), y1: Y0, x2: px(x[i + 1]), y2: Y0, class: "stroke thin c-tint" }, svg);
    const p = X.fkPosition(x);
    x.forEach((xi, i) => P("circle", { cx: px(xi), cy: Y0, r: 6, class: "fill " + (p !== null && Math.abs(i - p) < 1.5 ? "el-o" : "c-tint") }, svg));
    const g = x.reduce((s, xi, i) => s + xi - x0[i], 0) / x.length;
    $("vglisse").textContent = F.fix(g, 2);
    const etat = p === null ? (disloc ? "sortie" : f > seuil ? "glisse" : "tient") : f > seuil ? "avance" : "bloquee";
    $("vetat").textContent = t("fk.etat." + etat);
    $("fetat").textContent = p === null ? "" : t("fk.f.pos", { p: F.fix(p, 1) });
  }
  function boucle() {
    const dt = X.fkDt(k);
    for (let s = 0; s < 150; s++) x = X.fkPas(x, k, f, dt);
    dessin();
    raf = reduce ? 0 : requestAnimationFrame(boucle);
  }
  function relance() { cancelAnimationFrame(raf); depart(); if (reduce) { const dt = X.fkDt(k); for (let s = 0; s < 20000; s++) x = X.fkPas(x, k, f, dt); dessin(); } else boucle(); }
  $("lk").oninput = () => { k = Math.pow(10, +$("lk").value); $("lkv").textContent = F.num(k, 2); relance(); };
  $("ff").oninput = () => { f = +$("ff").value; $("ffv").textContent = F.fix(f, 2); if (reduce) relance(); };
  $("reprise").onclick = relance;
  $("lkv").textContent = F.num(k, 2); $("ffv").textContent = F.fix(f, 2);
  seg($("mode"), "d", v => { disloc = v === "1"; relance(); });
})();

/* ---------- aciers de construction ---------- */
(() => {
  const ids = Object.keys(X.ACIERS), items = textOf("aciers.items", ids), sub = {};
  const fe = X.glissement("cc", X.METAUX.Fe.a), tm = X.cissionTheorique(X.G_ACIER, fe.b, fe.d);
  ids.forEach(id => { const ty = X.cissionLimite(X.ACIERS[id]); sub[id] = { fy: F.si(X.ACIERS[id], "Pa", { prefix: "M" }), ty: F.si(ty, "Pa", { prefix: "M" }), r: F.num(tm / ty, 2) }; });
  keyed($("aciers"), t("aciers.tag"), ids, items, sub);
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["frenkel", 1926, "idea"], ["dislocation", 1934, "idea"], ["frankread", 1950, "idea"], ["hirsch", 1956, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["acier", "ecrouissage"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ecart", "c"], ["quart", "a"], ["un", "d"], ["raideur", "b"], ["fer", "c"], ["ecrouir", "a"], ["carbone", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
