<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
const DEG = Math.PI / 180, Cst = Constantes, D = DeuxCorps, MA = D.masseAlpha;
const fm = x => F.qty(F.num(x * 1e15, 3), "fm");
/* closest head-on distance for an alpha particle of lab energy E on a nucleus (Z, A): relative-motion energy, d = Z1 Z2 e²/(4π ε0 Ec) */
const dArret = (E, Z, A) => D.coulomb(2, Z) / D.ecm(E, MA, A * Cst.u);

/* ---------- simulation : histogramme des déviations contre 1/sin⁴(θ/2) ---------- */
(() => {
  const P = Plot.el, BORNES = Array.from({ length: 12 }, (_, i) => (15 + 15 * i) * DEG), seg = $("cible");
  let Z = 79, A = 197, graine = 1;
  const parSr = (n, i) => n / (2 * Math.PI * (Math.cos(BORNES[i]) - Math.cos(BORNES[i + 1])));
  function upd() {
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.z === Z)));
    const E = +$("en").value * D.MeV, N = Math.round(Math.pow(10, +$("nn").value)), d = dArret(E, Z, A), bmax = 5 * d;
    $("env").textContent = F.qty(F.num(+$("en").value, 2), "MeV"); $("nnv").textContent = F.num(N, 6);
    const R = D.rutherford(N, bmax, d, graine, BORNES), S = Math.PI * bmax * bmax;
    const svg = $("hist"); svg.innerHTML = "";
    const th = x => N / S * D.differentielle(x * DEG, d);                     // expected count per steradian
    const Y0 = Math.max(0.1, th(180) / 30), Y1 = th(15) * 3;
    const { x: X, y: Y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [0, 180], label: t("mc.x") }, y: { scale: "log", domain: [Y0, Y1], label: t("mc.y") } });
    const xs = Array.from({ length: 200 }, (_, i) => 12 + 168 * i / 199);
    P("path", { d: xs.map((x, i) => (i ? "L" : "M") + X(x).toFixed(1) + " " + Y(th(x)).toFixed(1)).join(""), class: "ref" }, g);
    R.compte.forEach((n, i) => { if (n > 0) P("circle", { cx: X((BORNES[i] + BORNES[i + 1]) / 2 / DEG), cy: Y(Math.max(Y0, parSr(n, i))), r: 5, class: "dot" }, g); });
    if (Z === 79) {                       // Geiger and Marsden's gold counts, scaled to the curve by one factor (least squares in log)
      const k = Math.exp(D.GM1913.reduce((s, [a, n]) => s + Math.log(th(a) / n), 0) / D.GM1913.length);
      D.GM1913.forEach(([a, n]) => P("rect", { x: X(a) - 4, y: Y(n * k) - 4, width: 8, height: 8, class: "fill c-label" }, g));
    }
    $("vd").textContent = fm(d); $("vb").textContent = fm(D.impact(90 * DEG, d));
    $("varr").textContent = F.sci(5.896e28 * 2.1e-7 * D.auDela(90 * DEG, d), 2);
    const chi = R.compte.reduce((s, n, i) => s + (n - R.attendu[i]) ** 2 / R.attendu[i], 0);
    $("vchi").textContent = F.num(chi, 3); $("fchi").textContent = t("mc.f.chi", { k: R.compte.length });
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { Z = +x.dataset.z; A = +x.dataset.a; upd(); });
  $("en").oninput = $("nn").oninput = upd; $("tirer").onclick = () => { graine++; upd(); }; upd();
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["electrons", "recul", "noyau", "quantique"], items = textOf("sys.items", IDS);
  const E = MA * 2.06e7 ** 2 / 2, d = dArret(E, 79, 197);
  const v = { emax: F.num(D.angleMax(MA, Cst.m_e) / DEG, 2), mu: F.num(100 * (1 - D.ecm(E, MA, 197 * Cst.u) / E), 2),
    d: fm(d), eta: F.num(D.coulomb(2, 79) / (Cst.hbar * 2.06e7), 2), dal: fm(dArret(E, 13, 27)) };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gm1909", 1909, "experiment"], ["rutherford", 1911, "idea"], ["gm1913", 1913, "experiment"], ["chadwick", 1921, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rbs"], u = textOf("uses.items", USES), rad = 170 * DEG;
  const v = { au: F.num(D.facteurK(4, 197, rad), 3), si: F.num(D.facteurK(4, 28, rad), 3) };
  keyed($("uses"), t("uses.tag"), USES, { rbs: { name: u.rbs.name, text: fill(u.rbs.text, v) } });
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["thomson", "c"], ["sin4", "a"], ["energie", "d"], ["z", "b"], ["b90", "c"], ["electron", "a"], ["anomalie", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 229 });
})();
</script>
