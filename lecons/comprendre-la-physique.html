    <div class="eq"><math display="block"><mover accent="true"><mi>g</mi><mo>→</mo></mover><mo>=</mo><mo>−</mo><mfrac><mrow><mi>G</mi><msub><mi>M</mi><mi>T</mi></msub></mrow><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><msub><mover accent="true"><mi>u</mi><mo>→</mo></mover><mn>1</mn></msub><mo>−</mo><mfrac><mrow><mi>G</mi><msub><mi>M</mi><mi>L</mi></msub></mrow><msubsup><mi>r</mi><mn>2</mn><mn>2</mn></msubsup></mfrac><msub><mover accent="true"><mi>u</mi><mo>→</mo></mover><mn>2</mn></msub></math></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/lecons/kepler.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>
<script src="/racoon/lecons/champs.js"></script>
<script src="/racoon/carte-champ.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const TL = Champs.TERRE_LUNE, D = TL.d, KM = 1e3;

/* ---------- le système décrit, chiffré ---------- */
(() => {
  const RT = Constantes.R_E_mean, RL = 1.7374e6;   // m, mean radius of the Moon (NASA fact sheet)
  const xn = Champs.pointNeutre(), sol = 2 * Constantes.GM_sun * xn / Constantes.au ** 3 / (TL.GM / xn ** 2);   // tidal pull of the Sun over x_N, against the Earth's pull there
  $("sys").innerHTML = t("sys.body", { d: F.num(D / KM, 4), rt: F.num(RT / D, 2), rl: F.num(RL / D, 2), sol: F.num(sol, 1), rot: F.num(Champs.ecartRotation(), 2) });
})();

/* ---------- la carte : potentiel, équipotentielles, lignes de champ ---------- */
(() => {
  const svg = $("carte"), O = { W: 640, H: 360, x0: -0.3 * D, x1: 1.3 * D, y0: -0.45 * D, y1: 0.45 * D }, mu0 = TL.mu;
  const sl = $("musl"), cb = $("tourne");
  let mu = mu0, hover = [0.6 * D, 0.2 * D], c;
  const muOf = k => Math.pow(mu0, 1 - k / 100);
  function zero(mu) {   /* the neutral point found by computing the field: sign change of g_x on the axis */
    let a = 0.05 * D, b = 0.999 * D;
    for (let k = 0; k < 80; k++) { const m = (a + b) / 2; if (Champs.champTL([m, 0], mu)[0] < 0) a = m; else b = m; }
    return (a + b) / 2;
  }
  function draw() {
    c = CarteChamp.carte(svg, O);
    const phi = p => Champs.potentielTL(p, mu), g = p => Champs.champTL(p, mu), xn = Champs.pointNeutre(mu), l1 = Champs.pointL1(mu);
    /* deeper well, darker tint: log of the depth, saturated within 0,05 d of the Earth */
    CarteChamp.fond(c, p => Math.log10(-phi(p)), 80, 45, { lo: Math.log10(-phi([-0.3 * D, 0.45 * D])), hi: Math.log10(-phi([0.05 * D, 0])) });
    const pn = phi([xn, 0]);
    CarteChamp.niveaux(c, phi, [pn, 1.25 * pn, 0.8 * pn, 0.6 * pn], { epais: 0 });
    const ring = (q, r, n) => Array.from({ length: n }, (_, k) => [q[0] + r * Math.cos(2 * Math.PI * (k + 0.5) / n), q[1] + r * Math.sin(2 * Math.PI * (k + 0.5) / n)]);
    CarteChamp.lignes(c, g, ring([0, 0], 0.06 * D, 16).concat(ring([D, 0], 0.03 * D, 8)), { ds: 0.012 * D, n: 160, sens: -1 });   /* drawn outwards, against g */
    CarteChamp.point(c, [0, 0], 9, "c-label", t("carte.terre"), 26);
    CarteChamp.point(c, [D, 0], 3 + 6 * Math.cbrt(mu), "c-label", t("carte.lune"), 26);
    CarteChamp.point(c, [xn, 0], 5, "c-ok", t("carte.n"));
    if (cb.checked) CarteChamp.point(c, [l1, 0], 4, "c-ok", t("carte.l1"), 22);
    const gv = g(hover), n = AnaVec.norme(gv);
    CarteChamp.point(c, hover, 3, "c-ok");
    CarteChamp.fleche(c, hover, gv, 36, "c-ok");
    $("muread").textContent = F.num(mu, 3) + (sl.value === "0" ? " " + t("carte.muLune") : "");
    $("vxn").textContent = F.qty(F.num(xn / KM, 4), "km");
    $("vnum").textContent = F.qty(F.num(zero(mu) / KM, 4), "km");
    $("vl1").textContent = F.qty(F.num(l1 / KM, 4), "km");
    $("fl1").textContent = t("carte.f.l1", { ecart: F.num(100 * (1 - l1 / xn), 2) });
    $("vg").textContent = F.si(n, "m·s⁻²");
    $("fg").textContent = t("carte.f.g", { x: F.num(hover[0] / KM, 3), y: F.num(hover[1] / KM, 3) });
  }
  CarteChamp.survol(svg, () => c, p => { hover = p; draw(); });
  sl.oninput = () => { mu = muOf(+sl.value); draw(); };
  cb.onchange = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1852, "idea"], ["maxwell55", 1855, "idea"], ["maxwell64", 1864, "idea"], ["artemis", 2010, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lagrange", "dessin"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dirac", "b"], ["neutre", "a"], ["egales", "c"], ["rotation", "d"], ["trajectoire", "b"], ["equation", "a"], ["image", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 221 });
})();
</script>
