<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OndesMilieux;

/* ---------- un électron qui oscille à 100 MHz, vu sur la perpendiculaire : les trois termes de (21.1) ---------- */
(() => {
  const lambda = 3, beta = 1e-3, q = -Constantes.e;                          // 100 MHz; peak speed 10⁻³ c, amplitude ≈ 0,48 mm
  const KEYS = ["coulomb", "extrapole", "rayonne"], CLS = ["stroke c-label-2", "stroke c-warn dash", "stroke t-ondes"];
  const XS = Array.from({ length: 31 }, (_, i) => -1.5 + i * 0.1);            // log10(r/λ)
  const courbes = XS.map(x => O.oscillante({ beta, lambda, r: lambda * 10 ** x, n: 24, q }).amplitudes);
  const sr = $("sr");
  function draw() {
    const x = +sr.value, r = lambda * 10 ** x, s = O.oscillante({ beta, lambda, r, n: 96, q }), A = s.amplitudes;
    /* one period of the x components, each divided by the swing of the total */
    const tr = $("trace"); tr.innerHTML = "";
    const P = Plot.axes(tr, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 40 }, x: { domain: [0, 1], label: t("fig.xaxis") }, y: { domain: [-2.2, 2.2], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(1), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const pts = k => s.ech.map(e => [P.x(e.t / s.T), P.y(Math.max(-2.2, Math.min(2.2, e[k] / A.total)))]);
    KEYS.forEach((k, i) => Plot.el("path", { d: Plot.path(pts(k)), class: CLS[i] }, P.g));
    Plot.el("path", { d: Plot.path(pts("total")), class: "curve" }, P.g);
    /* amplitude of each term against distance, log–log */
    const po = $("portee"); po.innerHTML = "";
    const Q = Plot.axes(po, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { scale: "log", domain: [10 ** -1.5, 10 ** 1.5], label: t("fig.raxis") }, y: { scale: "log", domain: [1e-16, 1e-7], label: t("fig.aaxis") } });
    KEYS.forEach((k, i) => Plot.el("path", { d: Plot.path(XS.map((v, j) => [Q.x(10 ** v), Q.y(Math.max(1e-16, courbes[j][k]))])), class: CLS[i] }, Q.g));
    Plot.el("line", { x1: Q.x(1 / (2 * Math.PI)), x2: Q.x(1 / (2 * Math.PI)), y1: Q.y(1e-16), y2: Q.y(1e-7), class: "zero" }, Q.g);
    KEYS.forEach(k => Plot.el("circle", { cx: Q.x(r / lambda), cy: Q.y(A[k]), r: 4, class: "dot" }, Q.g));
    $("srr").textContent = t("fig.rval", { r: F.si(r, "m"), x: F.num(r / lambda, 3), kr: F.num(s.k * r, 3) });
    KEYS.forEach((k, i) => { $("v" + (i + 1)).textContent = F.si(A[k], "V·m⁻¹"); $("f" + (i + 1)).textContent = t("fig.f.part", { p: F.num(100 * A[k] / (A.coulomb + A.extrapole + A.rayonne), 2) }); });
    $("vi").textContent = F.num(A.ecart / A.instantane, 2);
    $("fi").textContent = t("fig.f.inst", { v: F.num((s.k * r) ** 2 / 2, 2) });
  }
  sr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1865, "idea"], ["hertz", 1888, "experiment"], ["lienard", 1898, "idea"], ["esrf", 2020, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["synchrotron"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["retard", "c"], ["termes", "a"], ["loin", "d"], ["proche", "b"], ["signe", "c"], ["portee", "a"], ["statique", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 211 });
})();
