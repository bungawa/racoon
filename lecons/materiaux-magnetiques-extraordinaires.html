<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, C = Constantes;
/* Illustrative parameter sets (w in T per Bohr magneton per formula unit): chosen to show each kind of order, not fitted. */
const PRESETS = {
  ferro: { nA: 1, nB: 1, jA: 0.5, jB: 0.5, wAA: 200, wAB: 200, wBB: 200 },
  anti: { nA: 1, nB: 1, jA: 0.5, jB: 0.5, wAB: -400 },
  ferri: { nA: 1, nB: 2, jA: 2.5, jB: 2, wAA: -10, wAB: -60, wBB: 5 },
  comp: { nA: 1, nB: 1, jA: 2.5, jB: 3.5, wAA: 150, wAB: -15, wBB: 0 },
};

/* ---------- deux sous-réseaux en champ moyen ---------- */
(() => {
  const seg = $("ordre"), st = $("st"); let cle = "ferri", cache = {};
  /* the ordering temperature: the highest T where sublattice a keeps a moment, by bisection after a coarse scan */
  const ordonne = (o, T) => Math.abs(M.deuxReseaux(Object.assign({ T }, o)).mA) > 1e-6;
  function preparer(k) {
    if (cache[k]) return cache[k];
    const o = PRESETS[k]; let hi = 50; while (ordonne(o, hi) && hi < 1e5) hi *= 2;
    let lo = hi / 2; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (ordonne(o, m)) lo = m; else hi = m; }
    const To = lo, pts = [];
    for (let i = 1; i <= 140; i++) { const T = 1.15 * To * i / 140, r = M.deuxReseaux(Object.assign({ T }, o));
      pts.push([T, o.nA * 2 * o.jA * r.mA, o.nB * 2 * o.jB * r.mB, r.net]); }
    let Tcomp = null; for (let i = 1; i < pts.length; i++) if (pts[i - 1][3] * pts[i][3] < 0 && pts[i][0] < To * 0.999)
      Tcomp = pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * pts[i - 1][3] / (pts[i - 1][3] - pts[i][3]);
    return (cache[k] = { o, To, pts, Tcomp });
  }
  function draw() {
    const c = preparer(cle), tt = +st.value, T = tt * c.To, r = M.deuxReseaux(Object.assign({ T }, c.o)), svg = $("reseaux"); svg.innerHTML = "";
    const ymax = Math.max(...c.pts.map(p => Math.max(Math.abs(p[1]), Math.abs(p[2])))) * 1.1;
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, 1.15 * c.To], label: t("fig.ax.x") }, y: { domain: [-ymax, ymax], label: t("fig.ax.y") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(1.15 * c.To), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const seg0 = [[0, c.pts[0][1], c.pts[0][2], c.pts[0][3]]].concat(c.pts);
    Plot.el("path", { d: Plot.path(seg0.map(p => [P.x(p[0]), P.y(p[1])])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(seg0.map(p => [P.x(p[0]), P.y(p[2])])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(seg0.map(p => [P.x(p[0]), P.y(p[3])])), class: "stroke bold c-label-2" }, P.g);
    Plot.el("line", { x1: P.x(T), x2: P.x(T), y1: P.y(-ymax), y2: P.y(ymax), class: "stroke thin dash c-label" }, P.g);
    Plot.el("circle", { cx: P.x(T), cy: P.y(r.net), r: 5, class: "dot" }, P.g);
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.p === cle)));
    $("str").textContent = F.num(tt, 3);
    $("vnet").textContent = F.num(r.net, 3);
    $("fnet").innerHTML = t("fig.f.net", { T: F.kelvin(T) });
    $("vto").innerHTML = F.kelvin(c.To);
    $("fto").innerHTML = t(cle === "ferro" ? "fig.f.to.curie" : cle === "anti" ? "fig.f.to.neel" : "fig.f.to.ferri");
    $("vcomp").innerHTML = c.Tcomp == null ? t("fig.aucune") : F.kelvin(c.Tcomp);
    $("fcomp").innerHTML = t(c.Tcomp == null ? "fig.f.comp.non" : "fig.f.comp.oui");
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { cle = x.dataset.p; draw(); });
  st.oninput = draw; draw();
})();

/* ---------- le décompte de Néel : magnétite et grenat ---------- */
(() => {
  const mg = M.momentFerrite(M.FERRITES.magnetite), y = M.momentFerrite(M.FERRITES.yig);
  $("ferrites").innerHTML = t("ferrites.body", { nm: String(mg.net), sm: F.si(mg.sigma, "A·m²·kg⁻¹", { sig: 3 }),
    ny: String(y.net), sy: F.si(y.sigma, "A·m²·kg⁻¹", { sig: 3 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["neel", 1948, "idea"], ["shull", 1949, "experiment"], ["bertaut", 1956, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["filtres"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["anti", "c"], ["neutrons", "a"], ["magnetite", "d"], ["isolant", "b"], ["compensation", "c"], ["grenat", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 375 });
})();
</script>
