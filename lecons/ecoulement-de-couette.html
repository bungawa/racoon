<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const EAU = Fluides.eau(293.15), A = 0.020, B = 0.022, RADS = "rad·s⁻¹";

/* ---------- moment cinétique dans l'entrefer : critère de Rayleigh, seuil de Taylor ---------- */
(() => {
  const svg = $("moment"), wa = $("wasl"), wb = $("wbsl");
  function draw() {
    svg.innerHTML = "";
    const oa = +wa.value, ob = +wb.value, c = Fluides.couette(A, B, oa, ob);
    const rs = Array.from({ length: 101 }, (_, i) => A + (B - A) * i / 100), L = rs.map(c.L);
    const lo = Math.min(0, ...L), hi = Math.max(0, ...L), m = 0.08 * (hi - lo || 1e-4);
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 64 },
      x: { domain: [A * 1e3, B * 1e3], label: t("co.x") }, y: { domain: [lo - m, hi + m], label: t("co.y"), fmt: v => F.num(v * 1e4, 3) } });
    if (c.instable) Plot.el("rect", { x: x(c.instable[0] * 1e3), y: y(hi + m), width: x(c.instable[1] * 1e3) - x(c.instable[0] * 1e3), height: y(lo - m) - y(hi + m), class: "fill c-warn", opacity: 0.15 }, g);
    if (lo < 0) Plot.el("line", { x1: x(A * 1e3), x2: x(B * 1e3), y1: y(0), y2: y(0), class: "stroke thin c-label-2" }, g);
    Plot.el("path", { d: Plot.path(rs.map((r, i) => [x(r * 1e3), y(L[i])])), class: "curve" }, g);
    $("waread").textContent = F.qty(F.num(oa, 3), RADS); $("wbread").textContent = F.qty(F.num(ob, 3), RADS);
    if (c.instable) {
      const part = (c.instable[1] - c.instable[0]) / (B - A);
      $("vray").textContent = t("co.instable"); $("fray").textContent = t("co.f.zone", { p: F.num(100 * part, 2) });
    } else { $("vray").textContent = t("co.stable"); $("fray").textContent = t("co.f.croit"); }
    if (ob === 0) {
      const ty = Fluides.taylor(A, B, oa, EAU.nu);
      $("vta").textContent = F.num(ty.ta, 3);
      $("fta").textContent = t(ty.instable ? "co.f.tourbillons" : "co.f.laminaire", { re: F.num(ty.re, 3), rc: F.num(ty.reC, 3) });
    } else { $("vta").textContent = "–"; $("fta").textContent = t("co.f.horsta"); }
    const G = Fluides.coupleCouette(EAU.eta, 1, A, B, oa, ob);
    $("vcouple").textContent = F.si(Math.abs(G), "N·m"); $("fcouple").textContent = t("co.f.couple");
  }
  wa.oninput = draw; wb.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["couette", 1890, "experiment"], ["mallock", 1896, "experiment"], ["rayleigh", 1917, "idea"], ["taylor", 1923, "experiment"], ["gollub", 1975, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rheometre", "palier"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["profil", "a"], ["exterieur", "b"], ["rayleigh", "d"], ["contre", "c"], ["taylor", "a"], ["convection", "b"], ["regimes", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 416 });
})();
</script>
