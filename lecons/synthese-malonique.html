<!doctype html>

<title>Synthèse malonique</title>
<link rel="stylesheet" href="/racoon/ds.css">
<style>
  .malonate svg { width: 300px; max-width: 100%; height: 110px; display: block; margin: 0 auto; }
  .ret { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; }
  .ret svg { width: 150px; max-width: 45%; height: 110px; flex: none; }

<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-organique" data-i18n="monde.chim-organique"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-complements-synthese" data-i18n="etape.chim-complements-synthese"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/couples-acide-base" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="malonate"><svg class="fig no-sigle" id="svgmalonate" role="img" data-i18n-attr="aria-label:s1.aria"></svg></div>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><msup><mi>K</mi><mo>°</mo></msup><mo>=</mo><msup><mn>10</mn><mrow><mi>p</mi><msub><mi>K</mi><mi mathvariant="normal">a</mi></msub><mo>(</mo><mi mathvariant="normal">B</mi><mi mathvariant="normal">H</mi><mo>)</mo><mo>−</mo><mi>p</mi><msub><mi>K</mi><mi mathvariant="normal">a</mi></msub><mo>(</mo><mi mathvariant="normal">A</mi><mi mathvariant="normal">H</mi><mo>)</mo></mrow></msup></math></div>
    <p class="validite" data-i18n-html="s1.validite"></p>
    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="acide" data-i18n="dep.acide"></label></div><select id="acide"></select></div>
        <div class="ctl"><div class="row"><label for="base" data-i18n="dep.base"></label></div><select id="base"></select></div>
        <div class="ctl"><div class="row"><label for="eq" data-i18n="dep.eq"></label><output id="eqv" for="eq"></output></div>
          <input id="eq" type="range" min="0.5" max="2" step="0.1" value="1"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="dep.k"></span><span class="v" id="kv"></span></div>
          <div class="stat"><span class="k" data-i18n="dep.x"></span><span class="v" id="xv"></span></div>
        </div>
        <p class="readout" id="deplecture" aria-live="polite"></p>
      </div>
      <figcaption data-i18n-html="dep.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <ol>
      <li data-i18n-html="s2.e1"></li>
      <li data-i18n-html="s2.e2"></li>
      <li data-i18n-html="s2.e3"></li>
    </ol>
    <div class="eq"><math display="block"><mi mathvariant="normal">R</mi><mo>–</mo><mi mathvariant="normal">C</mi><mi mathvariant="normal">H</mi><msub><mrow><mo>(</mo><mi mathvariant="normal">C</mi><mi mathvariant="normal">O</mi><mi mathvariant="normal">O</mi><mi mathvariant="normal">H</mi><mo>)</mo></mrow><mn>2</mn></msub><mo>⟶</mo><mi mathvariant="normal">R</mi><mo>–</mo><mi mathvariant="normal">C</mi><msub><mi mathvariant="normal">H</mi><mn>2</mn></msub><mo>–</mo><mi mathvariant="normal">C</mi><mi mathvariant="normal">O</mi><mi mathvariant="normal">O</mi><mi mathvariant="normal">H</mi><mo>+</mo><mi mathvariant="normal">C</mi><msub><mi mathvariant="normal">O</mi><mn>2</mn></msub></math></div>
    <p class="validite" data-i18n-html="s2.validite"></p>
    <div class="box prop"><b data-i18n="s2.prop.titre"></b>
      <p data-i18n-html="s2.prop.corps"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="cible" data-i18n="ret.cible"></label></div><select id="cible"></select></div>
      </div>
      <div class="ret no-sigle" id="ret"></div>
      <p class="readout" id="retlecture" aria-live="polite"></p>
      <figcaption data-i18n-html="ret.caption"></figcaption>
    </figure>
    <p data-i18n-html="s3.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>

  <p class="foot" data-i18n-html="foot"></p>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/synthese-malonique.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/chim-organique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, sym = s => t("chim.sym", { s }), $ = id => document.getElementById(id);
const peindre = (svg, m, o) => { const d = O.dessin(m, Object.assign({ texte: sym }, o)); svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };
const svgVide = aria => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("class", "fig no-sigle"); s.setAttribute("role", "img"); s.setAttribute("aria-label", aria); return s; };

peindre($("svgmalonate"), O.molecule("malonateEthyle"), { surligne: [0], echelle: 30 });

/* ---------- déprotonation : AH + B⁻ ⇌ A⁻ + BH ---------- */
(() => {
  const ACIDES = ["ester", "malonate", "acetoacetate"], BASES = ["ethanol", "tbutanol", "diisopropylamine"];
  const na = textOf("dep.acides", ACIDES), nb = textOf("dep.bases", BASES);
  $("acide").innerHTML = ACIDES.map(id => `<option value="${id}">${na[id]}</option>`).join("");
  $("base").innerHTML = BASES.map(id => `<option value="${id}">${nb[id]}</option>`).join("");
  $("acide").value = "malonate";
  function maj() {
    const a = $("acide").value, b = $("base").value, eq = +$("eq").value, pa = O.PKA[a], pb = O.PKA[b];
    const x = O.fractionDeprotonee(pa, pb, eq), lgK = pb - pa;
    $("eqv").textContent = F.fix(eq, 1);
    $("kv").textContent = t("dep.kval", { k: F.sci(Math.pow(10, lgK), 2) });
    $("xv").textContent = x > 0.999 ? t("dep.presque") : x < 1e-3 ? F.sci(100 * x, 2) + "\u00a0%" : F.num(100 * x, 3) + "\u00a0%";
    $("deplecture").textContent = t(x > 0.9 ? "dep.lecture.oui" : x > 0.1 ? "dep.lecture.partiel" : "dep.lecture.non", { a: na[a], b: nb[b], pa: F.num(pa, 3), pb: F.num(pb, 3) });
  }
  ["acide", "base"].forEach(id => { $(id).onchange = maj; });
  $("eq").oninput = maj;
  maj();
})();

/* ---------- rétrosynthèse : l'acide cible à rebours ---------- */
(() => {
  const IDS = ["acideHexanoique", "acideMethylbutanoique", "acideMethylbutanoique3", "acidePhenylpropanoique", "acideCyclopentanecarboxylique", "acideDimethylpropanoique"];
  const noms = textOf("ret.noms", IDS), sel = $("cible");
  sel.innerHTML = IDS.map(id => `<option value="${id}">${noms[id].cible}</option>`).join("");
  function maj() {
    const id = sel.value, m = O.molecule(id), r = O.deconnecterMalonique(m), n = noms[id];
    $("ret").innerHTML = "";
    const cible = svgVide(n.cible); $("ret").appendChild(cible); peindre(cible, m, { surligne: [r.alpha], echelle: 28 });
    r.halogenures.forEach((h, k) => { const s = svgVide(n["h" + k]); $("ret").appendChild(s); peindre(s, h.m, { echelle: 28 }); });
    const halo = r.halogenures.map((h, k) => n["h" + k]).join(t("ret.sep"));
    $("retlecture").textContent = r.possible
      ? t(r.cycle ? "ret.cycle" : r.alkylations === 2 ? "ret.deux" : "ret.une", { h: halo, cl: r.halogenures.flatMap(h => h.classes).map(c => t("ret.classe." + c)).join(t("ret.sep")) })
      : t("ret.non." + r.raison, { h: halo });
  }
  sel.onchange = maj;
  maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dessaignes", 1858, "experiment"], ["perkin", 1883, "experiment"], ["barbital", 1902, "use"], ["veronal", 1904, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["medicaments", "vitamines"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["acidite", "b"], ["base", "d"], ["ester", "a"], ["synthon", "c"], ["decarbox", "b"], ["dialkyl", "a"], ["pivalique", "d"], ["cycle", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
</html>
