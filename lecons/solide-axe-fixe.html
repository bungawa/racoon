<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const DEG = Math.PI / 180, L = 1;
const deg = a => F.num(a / DEG, 3) + "°";
const dOf = () => +$("dd").value / 100;

/* ---------- §2 : période en fonction de la position du pivot ---------- */
(() => {
  const svg = $("periode");
  function upd() {
    const d = dOf(), r = Contact.barre({ L, d }), N = 120;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 48 }, x: { domain: [0, 50], label: t("per.xaxis") }, y: { domain: [1.4, 4.4], label: t("per.yaxis") } });
    const pts = Array.from({ length: N + 1 }, (_, i) => { const dd = 0.02 + (0.5 - 0.02) * i / N; return [o.x(dd * 100), o.y(Contact.barre({ L, d: dd }).T0)]; });
    Plot.el("path", { d: path(pts), class: "curve" }, o.g);
    Plot.el("line", { x1: o.x(r.dMin * 100), x2: o.x(r.dMin * 100), y1: o.y(1.4), y2: o.y(4.4), class: "ref" }, o.g);
    Plot.el("circle", { cx: o.x(d * 100), cy: o.y(r.T0), r: 5, class: "dot" }, o.g);
    $("ddv").textContent = F.si(d, "m", { sig: 3 });
    $("vT").textContent = F.si(r.T0, "s", { sig: 4 });
    $("fT").textContent = t("per.f.T", { m: F.si(r.Tmin, "s", { sig: 4 }), d: F.si(r.dMin, "m", { sig: 3 }) });
    $("vl").textContent = F.si(r.lEq, "m", { sig: 3 });
    $("vconj").textContent = r.dConj <= L / 2 ? F.si(r.dConj, "m", { sig: 3 }) : t("per.horsbarre");
    $("fconj").textContent = t(r.dConj <= L / 2 ? "per.f.conj" : "per.f.hors", { l: F.si(r.dConj, "m", { sig: 3 }) });
    amorti();
  }
  $("dd").oninput = upd; upd();                                   // §3 below reads the same pivot position
})();

/* ---------- §3 : pivot avec frottement sec, θ(t) ---------- */
function amorti() {
  const svg = $("amorti"), d = dOf(), r = Contact.barre({ L, d }), th0 = +$("th0").value * DEG, eps = +$("eps").value;
  const T = Pendule.periode(r.w0, th0), duree = 15 * r.T0, run = Contact.pivotSec({ w0: r.w0, th0, eps, duree, h: r.T0 / 300 });
  const tEnd = run.t[run.t.length - 1] < duree - 1e-9 && isFinite(run.arret) ? Math.max(run.arret * 1.15, 2 * r.T0) : duree;
  svg.innerHTML = "";
  const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 48 }, x: { domain: [0, tEnd], label: t("am.xaxis") }, y: { domain: [-95, 95], label: t("am.yaxis") } });
  Plot.el("line", { x1: o.x(0), x2: o.x(tEnd), y1: o.y(0), y2: o.y(0), class: "stroke thin c-label-2" }, o.g);
  /* the linear envelope of the small-angle model: θ₀ − 2ε per half period, down to zero */
  if (eps > 0) [1, -1].forEach(sg => {
    const tz = Math.min(tEnd, th0 / (2 * eps) * r.T0 / 2);
    Plot.el("path", { d: path([[o.x(0), o.y(sg * th0 / DEG)], [o.x(tz), o.y(sg * Math.max(0, th0 - 2 * eps * tz / (r.T0 / 2)) / DEG)]]), class: "ref" }, o.g);
  });
  const keep = run.t.map((tt, i) => [tt, run.th[i]]).filter(([tt]) => tt <= tEnd);
  if (isFinite(run.arret)) keep.push([tEnd, run.thArret]);
  Plot.el("path", { d: path(keep.map(([tt, q]) => [o.x(tt), o.y(q / DEG)])), class: "curve" }, o.g);
  $("th0v").textContent = deg(th0);
  $("epsv").textContent = F.num(eps, 2);
  $("vdec").textContent = deg(2 * eps);
  const halves = run.t.filter((_, i) => i > 0 && run.om[i] === 0).length;
  $("varret").textContent = isFinite(run.arret) ? F.si(run.arret, "s", { sig: 3 }) : t("am.jamais");
  $("farret").textContent = isFinite(run.arret) ? t("am.f.arret", { n: F.num(halves, 3), a: deg(run.thArret) }) : t("am.f.jamais");
  $("vTa").textContent = F.si(T, "s", { sig: 4 });
  $("fTa").textContent = t("am.f.T", { e: F.qty(F.num((T / r.T0 - 1) * 100, 2), "%") });
}
$("th0").oninput = amorti; $("eps").oninput = amorti;

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["huygens1673", 1673, "idea"], ["maelzel1815", 1815, "use"], ["kater1818", 1818, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["metronome", "inertie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["regle", "b"], ["leq", "c"], ["min", "d"], ["conj", "a"], ["masse", "c"], ["frottement", "b"], ["metronome", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 4401 });
})();
</script>
