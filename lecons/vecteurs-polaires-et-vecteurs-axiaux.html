<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const ligne = (tag, it) => `<div><span class="k">${tag}</span><span><strong>${it.name}.</strong> ${it.text}</span></div>`;
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); };

/* ---------- les deux natures, les règles de produit ---------- */
(() => {
  const NAT = [["r", "polaire"], ["f", "polaire"], ["e", "polaire"], ["omega", "axial"], ["l", "axial"], ["b", "axial"]];
  const it = textOf("nat.items", NAT.map(n => n[0]));
  $("natures").innerHTML = NAT.map(([id, n]) => ligne(t("nat.tag." + n), it[id])).join("");
  const REG = ["pp", "pa", "aa", "ps"], r = textOf("reg.items", REG);
  $("regles").innerHTML = REG.map(id => ligne(t("reg.tag"), r[id])).join("");
})();

/* ---------- la force magnétique dans un miroir ---------- */
(() => {
  const Q = -Constantes.e, V = [1e6, 0, 0], B = [0, 0.4, 0.3], NORMALES = { x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1] };
  const svg = $("mondes");
  let n = "x", nat = "axial";
  /* oblique view: x to the right, z up, y receding */
  const proj = (o, v, k) => [o[0] + k * (v[0] + 0.45 * v[1]), o[1] - k * (v[2] + 0.3 * v[1])];
  const unit = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
  function fleche(o, v, k, cls, dash) {
    const [x1, y1] = proj(o, [0, 0, 0], k), [x2, y2] = proj(o, v, k), a = Math.atan2(y2 - y1, x2 - x1), h = 9;
    P("line", { x1, y1, x2, y2, class: "stroke bold " + cls + (dash ? " dash" : "") }, svg);
    P("path", { d: `M${x2} ${y2}L${x2 - h * Math.cos(a - 0.4)} ${y2 - h * Math.sin(a - 0.4)}L${x2 - h * Math.cos(a + 0.4)} ${y2 - h * Math.sin(a + 0.4)}Z`, class: dash ? "stroke " + cls : "fill " + cls }, svg);
  }
  function monde(o, titre, v, b, f, image) {
    [[[1, 0, 0], "fig.x"], [[0, 1, 0], "fig.y"], [[0, 0, 1], "fig.z"]].forEach(([e, k]) => {
      const [x, y] = proj(o, e, 105);
      P("line", { x1: o[0], y1: o[1], x2: x, y2: y, class: "stroke thin c-label-2" }, svg);
      P("text", { x: x + 4, y: y - 4 }, svg).textContent = t(k);
    });
    P("text", { x: o[0] - 120, y: 26 }, svg).textContent = titre;
    fleche(o, unit(v), 80, "c-tint"); fleche(o, unit(b), 80, "t-chim"); fleche(o, unit(f), 80, "c-warn");
    if (image) fleche(o, unit(image), 80, "c-warn", true);
    P("circle", { cx: o[0], cy: o[1], r: 5, class: "fill c-label" }, svg);
  }
  function upd() {
    const r = Principes.lorentzMiroir(Q, V, B, NORMALES[n], nat), norme = Math.hypot(...r.F);
    svg.innerHTML = "";
    P("line", { x1: 320, x2: 320, y1: 20, y2: 290, class: "stroke dash c-label-2" }, svg);
    monde([170, 180], t("fig.monde"), V, B, r.F);
    monde([490, 180], t("fig.image"), r.vp, r.Bp, r.calculee, r.image);
    $("vf").textContent = F.si(norme, "N");
    const rel = r.ecart / norme;
    $("vecart").textContent = rel < 1e-9 ? F.qty("0", "N") : F.si(r.ecart, "N");
    $("fecart").textContent = t(rel < 1e-9 ? "sim.ok" : "sim.ko");
  }
  seg($("miroir"), "n", m => { n = m; upd(); });
  seg($("nature"), "b", b => { nat = b; upd(); });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["oersted", 1820, "experiment"], ["gibbs", 1881, "idea"], ["wilson", 1901, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["graphisme"], u = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => ligne(t("uses.tag"), u[id])).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["nature", "c"], ["miroirL", "b"], ["regle", "a"], ["lorentz", "c"], ["bobine", "b"], ["pseudo", "b"], ["rotation", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 5205 });
})();
</script>
