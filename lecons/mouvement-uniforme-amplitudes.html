<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- a packet of plane waves (7.9), units ħ = M = 1, λ₀ = 1: ω = k²/2, so the crests move at k₀/2 and the lump at k₀ ---------- */
(() => {
  const st = $("st"), sw = $("sw"), K0 = 2 * Math.PI, N = 61;
  const psi = (x, t, s) => {                                              // Σ over k of a Gaussian weight, width s·k₀
    let re = 0, im = 0, norm = 0;
    for (let j = 0; j < N; j++) {
      const k = K0 * (1 + s * (j - (N - 1) / 2) * 6 / (N - 1)), w = Math.exp(-(((k - K0) / (s * K0)) ** 2) / 2), ph = k * x - k * k * t / 2;
      re += w * Math.cos(ph); im += w * Math.sin(ph); norm += w;
    }
    return { re: re / norm, im: im / norm };
  };
  function draw() {
    const t0 = +st.value, s = +sw.value, svg = $("paquet"); svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 260, x: { domain: [-3, 16], label: t("fig.ax.x") }, y: { domain: [-1, 1], label: t("fig.ax.psi") } });
    const xs = Array.from({ length: 761 }, (_, k) => -3 + k * 0.025), v = xs.map(x => psi(x, t0, s));
    Plot.el("path", { d: Plot.path(xs.map((x, k) => [ax.x(x), ax.y(v[k].re)])), class: "stroke thin c-label-2", fill: "none" }, svg);
    Plot.el("path", { d: Plot.path(xs.map((x, k) => [ax.x(x), ax.y(v[k].re ** 2 + v[k].im ** 2)])), class: "stroke c-tint", fill: "none" }, svg);
    const xc = (K0 / 2) * t0;                                              // the crest that started at x = 0
    Plot.el("line", { x1: ax.x(xc), x2: ax.x(xc), y1: ax.y(-1), y2: ax.y(1), class: "stroke thin dash c-warn" }, svg);
    $("str").textContent = F.num(t0, 3); $("swr").textContent = F.num(s, 2);
    $("vcentre").textContent = F.num(K0 * t0, 3) + "\u00a0λ₀"; $("fcentre").textContent = t("fig.f.centre");
    $("vcrete").textContent = F.num(xc, 3) + "\u00a0λ₀"; $("fcrete").textContent = t("fig.f.crete");
  }
  st.oninput = sw.oninput = draw; draw();
  const m = Constantes.m_e, lam = 1e-9, p = Q.h / lam, v = p / m;
  $("sys1").innerHTML = t("sys1.body", { v: F.si(v, "m·s⁻¹"), b: F.sci((v / Constantes.c) ** 2, 2), Ec: F.si(p * p / (2 * m) / Constantes.e, "eV") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["broglie", 1924, "idea"], ["davisson", 1927, "experiment"], ["c60", 1999, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["neutrons"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["lorentz", "b"], ["lambda", "d"], ["groupe", "a"], ["phase", "c"], ["paquet", "b"], ["relat", "a"], ["hyp", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 702 });
})();
</script>
