<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, M = Minkowski, O = OndesMilieux, C = R.c;
const n3 = v => F.num(Math.abs(v) < 5e-4 ? 0 : v, 3);

/* ---------- la densité que mesure un observateur : un produit scalaire ---------- */
(() => {
  const svg = $("diag"), sb = $("sb"), seg = $("source");
  /* each source as its four-current in units: ρ0 for a cloud (J/(cρ0)), j for the wire (J/j) */
  const SOURCES = { repos: { J: O.quadriCourant(1 / C, 0), s2: 1 }, nuage: { J: O.quadriCourant(1 / C, 0.6), s2: 1 }, fil: { J: [0, 1, 0, 0], s2: -1 } };
  let src = "nuage";
  function draw() {
    const b = +sb.value / 100, S = SOURCES[src], J = S.J, U = R.quadriVitesse(b);
    const c = M.cadre(svg, { W: 480, H: 360, x0: -2.4, x1: 2.4, t0: -0.4, t1: 3.2, pad: 10 });
    M.fond(c, { x: t("fig.ax.x"), t: t("fig.ax.ct"), pas: 0.5 });
    M.hyperbole(c, 1, "c-label-2");
    if (src === "fil") M.hyperbole(c, -1, "c-label-2");
    M.repere(c, b, { x: t("fig.ax.xp"), t: t("fig.ax.ctp") });
    M.fleche(c, [0, 0], [U[1], U[0]], "c-tint");
    M.fleche(c, [0, 0], [J[1], J[0]], "c-ok", { trait: "stroke bold" });
    /* (25.7b) from the components in R, then the same density read in the observer's own frame */
    const parProduit = R.scalaire(U, J), parBoost = R.boostQuadri(J, b)[0];
    $("sbr").textContent = t("fig.b.v", { b: F.num(b, 2) });
    const unite = t(src === "fil" ? "fig.u.fil" : "fig.u.nuage");
    $("vr").textContent = t("fig.v.rho", { r: n3(parProduit), u: unite });
    $("fr").textContent = t("fig.f.rho", { r: n3(parBoost), u: unite });
    const Jb = R.boostQuadri(J, b);
    $("vj").textContent = t("fig.v.jj", { a: n3(R.carre(J)), u: t(src === "fil" ? "fig.u2.fil" : "fig.u2.nuage") });
    $("fj").textContent = t("fig.f.jj", { a: n3(R.carre(Jb)) });
    $("vg").textContent = t(src === "fil" ? "fig.genre.espace" : "fig.genre.temps");
    $("fg").textContent = src === "fil" ? t("fig.f.fil", { r: n3(-R.gamma(b * C) * b) }) : t("fig.f.nuage", { r: n3(parProduit) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.s === src)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { src = x.dataset.s; draw(); });
  sb.oninput = draw; draw();
})();

/* ---------- le système décrit : un fil de cuivre longé à pied ---------- */
(() => {
  const j = 1e6, v = 1, b = v / C, J = [0, j, 0, 0];
  $("sys1").innerHTML = t("sys1.body", { j: F.si(j, "A·m⁻²"), v: F.si(v, "m·s⁻¹"), b2: F.sci(b * b, 2),
    rho: F.qty(F.sci(O.densiteMesuree(J, b), 2), "C·m⁻³") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["raumzeit", 1908, "idea"], ["antiproton", 1955, "experiment"], ["mandelstam", 1958, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ad"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["moins", "a"], ["choix", "c"], ["seuil", "b"], ["cinetique", "d"], ["minimum", "b"], ["fil", "c"], ["convention", "d"], ["phase", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2502 });
})();
</script>
