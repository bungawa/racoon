<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const pct = (r, sig) => (r < 0 ? F.MINUS : "+") + F.qty(F.num(Math.abs(r) * 100, sig || 2), "%");

/* ---------- §21-2 : isochronisme — ressort linéaire, ressort raidi, pendule ---------- */
(() => {
  const K = 20, M = 0.2, W = Osc.pulsation(K, M), BETA = 100, AMAX = 0.1;            // ω₀ = 10 rad·s⁻¹, β = 100 m⁻² (βA² = 1 à 10 cm)
  const WP = Osc.pulsationPendule(1), TMAX = 170;                                     // pendule de 1 m, jusqu'à 170°
  const deg = Math.PI / 180, MODELS = ["lin", "cub", "pend"]; let model = "lin";
  /* amplitude for a slider position s ∈ ]0, 1]: metres for the springs, radians for the pendulum */
  const amp = s => model === "pend" ? s * TMAX * deg : s * AMAX;
  const w0 = () => model === "pend" ? WP : W;
  const sys = () => model === "lin" ? Osc.lineaire(W) : model === "cub" ? Osc.cubique(W, BETA) : Osc.pendule(WP);
  const exact = s => model === "lin" ? 1 : model === "pend" ? Osc.periodePendule(WP, amp(s)) * WP / (2 * Math.PI) : Osc.periodeNum(sys(), amp(s)) * W / (2 * Math.PI);
  const approx = s => model === "lin" ? 1 : model === "pend" ? Osc.periodePenduleApprox(WP, amp(s)) * WP / (2 * Math.PI) : Osc.periodeCubiqueApprox(W, BETA, amp(s)) * W / (2 * Math.PI);
  const CURVES = {};
  const curve = () => CURVES[model] || (CURVES[model] = Array.from({ length: 34 }, (_, i) => { const s = (i + 1) / 34; return [s, exact(s), approx(s)]; }));
  const DOM = { lin: [0.7, 1.3], cub: [0.7, 1.3], pend: [0.8, 2.6] };
  const xval = s => model === "pend" ? s * TMAX : s * AMAX * 100;                      // axis: degrees or cm

  function upd() {
    MODELS.forEach(m => $("m-" + m).setAttribute("aria-pressed", String(m === model)));
    const s = +$("amp").value / 100, r = exact(s), ra = approx(s), T0 = 2 * Math.PI / w0();
    /* T/T₀ against the amplitude */
    let svg = $("per"); svg.innerHTML = "";
    const xmax = model === "pend" ? TMAX : AMAX * 100;
    let o = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 48 }, x: { domain: [0, xmax], label: t("per.xaxis." + (model === "pend" ? "pend" : "ressort")) }, y: { domain: DOM[model], label: t("per.yaxis") } });
    const pts = [[0, 1, 1]].concat(curve());
    Plot.el("path", { d: path(pts.map(([q, , a]) => [o.x(xval(q)), o.y(a)])), class: "ref" }, o.g);
    Plot.el("path", { d: path(pts.map(([q, e]) => [o.x(xval(q)), o.y(e)])), class: "curve" }, o.g);
    Plot.el("circle", { cx: o.x(xval(s)), cy: o.y(r), r: 5, class: "dot" }, o.g);
    /* the motion over three linear periods, normalised by the amplitude, against cos ω₀t */
    svg = $("trace"); svg.innerHTML = "";
    const TEND = 3 * T0, A = amp(s), n = 1500, h = TEND / n, run = Integ.run("leapfrog", sys().a, { t: 0, x: [A], v: [0] }, h, n);
    o = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 48 }, x: { domain: [0, TEND], label: t("trace.xaxis") }, y: { domain: [-1.1, 1.1], label: t("trace.yaxis") } });
    Plot.el("path", { d: path(run.t.map(tt => [o.x(tt), o.y(Math.cos(w0() * tt))])), class: "ref" }, o.g);
    Plot.el("path", { d: path(run.t.map((tt, k) => [o.x(tt), o.y(run.x[k][0] / A)])), class: "curve" }, o.g);
    /* readouts */
    $("ampv").textContent = model === "pend" ? F.num(s * TMAX, 3) + "°" : model === "cub" ? t("per.ampcub", { A: F.si(A, "m"), ba: F.num(BETA * A * A, 2) }) : F.si(A, "m");
    $("vT").textContent = F.si(r * T0, "s", { sig: 4 });
    $("fT").textContent = t("per.f.T", { T0: F.si(T0, "s", { sig: 4 }) });
    $("vrel").textContent = model === "lin" ? "0" : pct(r - 1);
    $("vapp").textContent = model === "lin" ? "0" : pct(ra / r - 1);
    $("fapp").textContent = t("per.f.approx." + model);
  }
  MODELS.forEach(m => $("m-" + m).onclick = () => { model = m; upd(); });
  $("amp").oninput = upd; upd();
})();

/* ---------- décrire le système : masse du ressort ---------- */
(() => {
  const K = 20, M = 0.2;
  function upd() {
    const r = +$("mr").value / 100, R = Osc.masseRessort(K, M, r * M);
    $("mrv").textContent = F.qty(F.num(r * 100, 3), "%");
    /* error on the period: T_model / T_exact − 1 = ω_exact / ω_model − 1 */
    $("vnaive").textContent = r === 0 ? "0" : pct(R.exacte / R.naive - 1);
    $("vray").textContent = r === 0 ? "0" : pct(R.exacte / R.rayleigh - 1, 2);
  }
  $("mr").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["galilee1602", 1602, "experiment"], ["galilee1638", 1638, "idea"], ["huygens1657", 1657, "use"], ["huygens1673", 1673, "idea"], ["hooke", 1678, "idea"], ["quartz", 1927, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["montre", "infrarouge"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["masse", "b"], ["amplitude", "a"], ["pendule", "c"], ["lune", "a"], ["ressort", "d"], ["raidi", "b"], ["deux", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 212 });
})();
</script>
