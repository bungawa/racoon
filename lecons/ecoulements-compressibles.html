<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
/* the gases of the panel: γ and molar mass (kg·mol⁻¹); combustion: assumed values, see the table */
const GAZ = { air: { gamma: 1.4, Mmol: 0.0289644 }, vapeur: { gamma: 1.3, Mmol: 0.018015 }, combustion: { gamma: 1.2, Mmol: 0.014 } };
const rOf = s => Math.pow(100, s / 100);                                   // A_s/A_c from 1 to 100, log slider

/* ---------- §3 : la tuyère de Laval, rapport de sections et nombre de Mach ---------- */
(() => {
  const P = Plot.el, path = Plot.path, MMAX = 6, RANGE = [1, 100];
  function draw() {
    const g = GAZ[$("gaz").value], ratio = rOf(+$("r").value), T0 = +$("t0").value;
    const s = Fluides.tuyere({ T0, p0: 1e6, gamma: g.gamma, Mmol: g.Mmol, ratio });
    const svg = $("laval"); svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 }, x: { domain: [0, MMAX], label: t("laval.x") },
      y: { scale: "log", domain: RANGE, label: t("laval.y"), fmt: v => F.num(v, 3) } });
    const clip = a => Math.min(RANGE[1], a);
    const sub = Array.from({ length: 120 }, (_, i) => 0.01 + i * 0.99 / 119), sup = Array.from({ length: 200 }, (_, i) => 1 + i * (MMAX - 1) / 199);
    const pts = ms => ms.map(m => [o.x(m), o.y(clip(Fluides.isentropique(m, g.gamma).AsurAc))]).filter(([, y]) => y >= o.y(RANGE[1]) - 1e-9);
    P("path", { d: path(pts(sub)), class: "stroke c-label-2" }, o.g);
    P("path", { d: path(pts(sup)), class: "curve" }, o.g);
    P("line", { x1: o.x(0), x2: o.x(MMAX), y1: o.y(ratio), y2: o.y(ratio), class: "ref" }, o.g);
    P("line", { x1: o.x(1), x2: o.x(1), y1: o.y(1), y2: o.y(RANGE[1]), class: "stroke thin dash c-label-2" }, o.g);
    if (s.M <= MMAX) P("circle", { cx: o.x(s.M), cy: o.y(ratio), r: 6, class: "dot" }, o.g);
    /* readouts */
    $("rv").textContent = F.num(ratio, 3); $("t0v").innerHTML = F.kelvin(T0);
    $("vm").textContent = F.num(s.M, 3); $("fm").textContent = t("laval.f.m", { p: F.sci(1 / Fluides.isentropique(s.M, g.gamma).p0surp, 2) });
    $("vt").innerHTML = F.kelvin(s.T); $("ft").textContent = t("laval.f.t", { c: F.si(s.c, "m·s⁻¹") });
    $("vv").textContent = F.si(s.v, "m·s⁻¹"); $("fv").textContent = t("laval.f.v", { l: F.si(s.vLim, "m·s⁻¹") });
  }
  $("gaz").onchange = draw; $("r").oninput = draw; $("t0").oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mach1887", 1887, "experiment"], ["laval1888", 1888, "experiment"], ["ackeret1929", 1929, "idea"], ["yeager1947", 1947, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["vulcain", "debitmetre", "turbine"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["seuil", "a"], ["calorifugee", "b"], ["convergent", "c"], ["col", "d"], ["limite", "a"], ["froid", "b"], ["debit", "c"], ["rapport", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 6104 });
})();
</script>
