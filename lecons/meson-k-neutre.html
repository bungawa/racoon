<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes;
/* measured: K_S and K_L mean lives, mass difference (PDG values, as quoted by Wikipedia) */
const TS = 8.954e-11, TL = 5.116e-8, DM = 3.484e-12 * 1e6 * K.e, ALPHA = DM / K.hbar, BETA = 1 / (2 * TS);

/* ---------- a K⁰ at t = 0: the probabilities of K⁰ and K̄⁰ ---------- */
(() => {
  const svg = $("courbe"), sR = $("sR"), kl = $("kl"), X1 = 16;
  let avecL = false;
  function draw() {
    const r = +sR.value, o0 = { alpha: r * BETA, beta: BETA, gammaL: avecL ? 1 / TL : 0 };
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 }, x: { domain: [0, X1], label: t("fig.x") }, y: { domain: [-0.3, 1], label: t("fig.y") } });
    const pp = [], pm = [], pd = []; let mx = 0, tm = 0;
    for (let k = 0; k <= 400; k++) {
      const x = X1 * k / 400, s = Q.kaonsNeutres(x * TS, o0);
      pp.push([o.x(x), o.y(s.Pp)]); pm.push([o.x(x), o.y(s.Pm)]); pd.push([o.x(x), o.y(s.Pp - s.Pm)]);
      if (s.Pm > mx) { mx = s.Pm; tm = x; }
    }
    Plot.el("line", { x1: o.x(0), x2: o.x(X1), y1: o.y(0), y2: o.y(0), class: "stroke thin c-label-2" }, o.g);
    Plot.el("line", { x1: o.x(0), x2: o.x(X1), y1: o.y(0.25), y2: o.y(0.25), class: "stroke thin dash c-label-2" }, o.g);
    Plot.el("path", { d: Plot.path(pd), class: "stroke dash c-tint" }, o.g);
    Plot.el("path", { d: Plot.path(pp), class: "stroke bold c-ok" }, o.g);
    Plot.el("path", { d: Plot.path(pm), class: "stroke bold c-warn" }, o.g);
    Plot.el("circle", { cx: o.x(tm), cy: o.y(mx), r: 5, class: "fill c-warn" }, o.g);
    $("sRr").textContent = F.fix(r, 2);
    $("vm").textContent = F.fix(mx, 3); $("fm").textContent = t("fig.f.max", { t: F.fix(tm, 1) });
    const tard = Q.kaonsNeutres(X1 * TS, o0);
    $("vt").textContent = F.fix(tard.Pp, 3) + " ; " + F.fix(tard.Pm, 3); $("ft").textContent = t("fig.f.tard", { n: F.num(X1, 2) });
    $("vv").textContent = F.fix(ALPHA / BETA, 3); $("fv").textContent = t("fig.f.vrai");
    kl.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String((x.dataset.k === "1") === avecL)));
  }
  kl.querySelectorAll("button").forEach(x => x.onclick = () => { avecL = x.dataset.k === "1"; draw(); });
  sR.oninput = draw; draw();
})();

/* ---------- the system described: lifetimes, mass difference, how far a kaon flies ---------- */
(() => {
  $("sys1").innerHTML = t("sys1.body", { ts: F.si(TS, "s"), tl: F.si(TL, "s"), r: F.num(TL / TS, 3), dm: F.si(DM, "J"), a: F.si(ALPHA, "s⁻¹"), b: F.si(BETA, "s⁻¹") });
  const p = 1e9 * K.e / K.c, m = 497.6e6 * K.e / (K.c * K.c), bg = p / (m * K.c);    // a 1 GeV/c kaon; m c² ≈ 497,6 MeV
  $("sys2").innerHTML = t("sys2.body", { bg: F.fix(bg, 2), l: F.si(bg * K.c * TS, "m"), L: F.si(bg * K.c * TL, "m"), mc2: F.sci(DM / (m * K.c * K.c), 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lederman", 1956, "experiment"], ["cronin", 1964, "experiment"], ["direct", 1999, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["mesons", "neutrinos"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["etrange", "b"], ["deux", "d"], ["k1", "a"], ["quart", "c"], ["masse", "b"], ["sans", "a"], ["regenere", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1105 });
})();
</script>
