<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- four heat currents h (W·m⁻²), points in m ---------- */
const W = 100, P0 = 1000, K3 = 100, KT = 100;
const CHAMPS = {
  source: p => { const r = Math.hypot(...p); return p.map(x => W * x / (4 * Math.PI * r ** 3)); },   // a point source of 100 W at O
  chauffage: p => p.map(x => P0 * x / 3),                                                            // 1 kW·m⁻³ produced everywhere
  cubique: p => [K3 * p[0] ** 3, 0, 0],                                                              // ∇·h = 3 k x²
  tourbillon: p => [-KT * p[1], KT * p[0], 0],                                                       // ∇·h = 0
};

(() => {
  const svg = $("cube"), P = Plot.el, K = 200, O = [320, 210];
  const X = x => O[0] + K * x, Y = y => O[1] - K * y;
  let champ = "source";
  const arrow = (A, B, cls, parent, thin) => Plot.fleche(parent, A, B, { cls, tete: thin ? 6 : 9, trait: "stroke" + (thin ? " thin" : "") });
  const S3 = ["xsl", "ysl", "asl"].map($);
  let echelle = 1;
  const nul = v => Math.abs(v) < 1e-3 * echelle, fv = v => F.num(nul(v) ? 0 : v, 2), fmtW = v => F.qty(nul(v) ? "0" : F.num(v, 3), "W");
  function draw() {
    svg.innerHTML = "";
    const C = CHAMPS[champ], x0 = +S3[0].value, y0 = +S3[1].value, a = +S3[2].value, c = [x0, y0, 0];
    /* the field in the plane z = 0: directions, length growing slowly with |h| */
    const champs = P("g", {}, svg);
    for (let i = -7; i <= 7; i++) for (let j = -5; j <= 5; j++) {
      const p = [i * 0.2, j * 0.2, 0], v = C(p), m = Math.hypot(...v);
      if (!(m > 1e-9) || !isFinite(m)) continue;
      const L = 6 + 6 * Math.log10(1 + m / 3), u = v.map(q => q / m);
      arrow([X(p[0]) - L * u[0], Y(p[1]) + L * u[1]], [X(p[0]) + L * u[0], Y(p[1]) - L * u[1]], "c-label-2", champs, true);
    }
    if (champ === "source") { P("circle", { cx: X(0), cy: Y(0), r: 6, class: "fill c-warn" }, svg); }
    /* the cube, seen from above, and the flux through its four side faces */
    P("rect", { x: X(x0 - a / 2), y: Y(y0 + a / 2), width: K * a, height: K * a, class: "stroke bold c-label" }, svg);
    const R = AnaVec.fluxCube(C, c, a, 24), max = Math.max(...R.faces.map(Math.abs), 1e-12);
    echelle = R.faces.reduce((s, f) => s + Math.abs(f), 0) || 1;
    [[0, [1, 0]], [1, [-1, 0]], [2, [0, 1]], [3, [0, -1]]].forEach(([k, n]) => {
      const f = R.faces[k], L = 50 * Math.abs(f) / max, M = [X(x0 + n[0] * a / 2), Y(y0 + n[1] * a / 2)];
      if (Math.abs(f) < 1e-3 * max || nul(f)) return;
      const s = f > 0 ? 1 : -1, A = s > 0 ? M : [M[0] + L * n[0], M[1] - L * n[1]], B = s > 0 ? [M[0] + L * n[0], M[1] - L * n[1]] : M;
      arrow(A, B, s > 0 ? "c-tint" : "c-warn", svg);
    });
    /* the three numbers of Gauss */
    const inside = champ === "source" && Math.abs(x0) < a / 2 && Math.abs(y0) < a / 2;
    const vol = AnaVec.integraleCube(q => AnaVec.divergence(C, q), c, a, 10);
    const centre = champ === "source" && Math.hypot(x0, y0) < 1e-9 ? NaN : AnaVec.divergence(C, c) * a ** 3;
    $("xread").textContent = F.qty(F.fix(x0, 2), "m");
    $("yread").textContent = F.qty(F.fix(y0, 2), "m");
    $("aread").textContent = F.qty(F.fix(a, 2), "m");
    $("vflux").textContent = fmtW(R.total);
    $("fflux").textContent = t("cube.f.faces", { px: fv(R.faces[0]), mx: fv(R.faces[1]), py: fv(R.faces[2]), my: fv(R.faces[3]), z: fv(R.faces[4] + R.faces[5]) });
    $("vvol").textContent = fmtW(vol);
    $("fvol").textContent = inside ? t("cube.f.manque") : t("cube.f.vol");
    $("vcentre").textContent = isFinite(centre) ? fmtW(centre) : "–";
    $("fcentre").textContent = !isFinite(centre) ? t("cube.f.infini") : nul(R.total) ? t("cube.f.zero")
      : t("cube.f.ecart", { e: F.num(100 * (centre / R.total - 1), 2) });
  }
  $("champ").querySelectorAll("button").forEach(b => b.onclick = () => {
    champ = b.dataset.v; $("champ").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); draw();
  });
  S3.forEach(s => s.oninput = draw); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lagrange", 1762, "idea"], ["gauss", 1813, "idea"], ["ostrogradski", 1826, "idea"], ["green", 1828, "idea"], ["openfoam", 2004, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["volumes", "bilan"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["definition", "a"], ["paire", "b"], ["cloisons", "c"], ["uniforme", "d"], ["source", "a"], ["petit", "b"], ["signe", "c"], ["tourbillon", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 303 });
})();
</script>
