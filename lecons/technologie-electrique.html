  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mfrac><msub><mi>P</mi><mtext data-i18n="eq.pertes"></mtext></msub><mi>P</mi></mfrac><mo>=</mo><mfrac><mrow><mi>R</mi><mi>P</mi></mrow><msup><mi>U</mi><mn>2</mn></msup></mfrac><mo>,</mo><mspace width="1em"/><mi>R</mi><mo>=</mo><mfrac><mrow><mi>ρ</mi><mi>ℓ</mi></mrow><mi>S</mi></mfrac></math></div>
    <p class="validite" data-i18n-html="val.ligne"></p>
    <figure class="chart">
      <svg class="fig" id="ligne" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.f"></span><span class="c-warn" data-i18n="fig.legend.tout"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="su" data-i18n="fig.u"></label><output id="sur" for="su"></output></div>
            <input id="su" type="range" min="2.6" max="5.6" step="0.01" value="5.6"></div>
          <div class="ctl"><div class="row"><label for="sp" data-i18n="fig.p"></label><output id="spr" for="sp"></output></div>
            <input id="sp" type="range" min="4" max="9" step="0.01" value="9"></div>
          <div class="ctl"><div class="row"><label for="sl" data-i18n="fig.l"></label><output id="slr" for="sl"></output></div>
            <input id="sl" type="range" min="1" max="500" step="1" value="200"></div>
          <div class="ctl"><div class="row"><label for="ss" data-i18n="fig.s"></label><output id="ssr" for="ss"></output></div>
            <input id="ss" type="range" min="1" max="3" step="0.01" value="2.7"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.f"></span><span class="v" id="vf"></span><span class="f" id="ff"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.i"></span><span class="v" id="vi"></span><span class="f" id="fi"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="sys.title"></b>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, CU = M.RESISTIVITES.cuivre;
const pct = x => F.qty(F.num(100 * x, 2), "%");

/* ---------- une ligne triphasée : part de la puissance perdue en fonction de la tension ---------- */
(() => {
  const svg = $("ligne"), su = $("su"), sp = $("sp"), sl = $("sl"), ss = $("ss");
  function draw() {
    const U = Math.pow(10, +su.value), P = Math.pow(10, +sp.value), l = +sl.value * 1000, S = Math.pow(10, +ss.value) * 1e-6;
    const at = u => M.ligneTriphasee({ P, U: u, longueur: l, section: S, rho: CU }), r = at(U);
    svg.innerHTML = "";
    const Pl = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 60, b: 44 }, x: { scale: "log", domain: [100, 1e6], label: t("fig.xaxis") }, y: { scale: "log", domain: [1e-4, 1e4], label: t("fig.yaxis") } });
    const us = Array.from({ length: 121 }, (_, i) => Math.pow(10, 2 + 4 * i / 120));
    Plot.el("path", { d: Plot.path(us.map(u => [Pl.x(u), Pl.y(Math.min(1e4, Math.max(1e-4, at(u).fraction)))])), class: "curve" }, Pl.g);
    Plot.el("line", { x1: Pl.x(100), x2: Pl.x(1e6), y1: Pl.y(1), y2: Pl.y(1), class: "ref" }, Pl.g);
    Plot.el("circle", { cx: Pl.x(U), cy: Pl.y(Math.min(1e4, Math.max(1e-4, r.fraction))), r: 5, class: "dot" }, Pl.g);
    $("sur").textContent = F.si(U, "V");
    $("spr").textContent = F.si(P, "W");
    $("slr").textContent = F.si(l, "m", { prefix: "k" });
    $("ssr").textContent = F.qty(F.num(S * 1e6, 3), "mm²");
    $("vf").textContent = r.fraction < 0.2 ? pct(r.fraction) : t("fig.trop");
    $("ff").textContent = t(r.fraction < 0.2 ? "fig.f.f" : "fig.f.trop", { p: F.si(r.pertes, "W"), x: F.num(r.fraction, 2), R: F.si(r.R, "Ω") });
    $("vi").textContent = F.si(r.I, "A");
    $("fi").textContent = t("fig.f.i", { j: F.qty(F.num(r.I / S / 1e6, 3), "A·mm⁻²") });
  }
  su.oninput = sp.oninput = sl.oninput = ss.oninput = draw; draw();
  /* Lauffen–Frankfurt, 1891: 175 km, 15 kV, 300 hp; wire of 4 mm diameter in this model */
  const P = 300 * 735.5, l = 175e3, d = 0.004, S = Math.PI * d * d / 4, r15 = M.ligneTriphasee({ P, U: 15e3, longueur: l, section: S, rho: CU });
  const r1 = M.ligneTriphasee({ P, U: 1e3, longueur: l, section: S, rho: CU });
  $("sys1").innerHTML = t("sys1.body", { P: F.si(P, "W"), l: F.si(l, "m", { prefix: "k" }), d: F.si(d, "m", { prefix: "m" }), R: F.si(r15.R, "Ω"),
    f15: pct(r15.fraction), I: F.si(r15.I, "A"), x1: F.num(r1.fraction, 2), S1: F.qty(F.num(S * 1e6 * r1.fraction / r15.fraction, 2), "mm²") });
})();

/* ---------- tôles feuilletées : pertes par courants de Foucault ---------- */
(() => {
  const f = 50, B0 = 1.5, rho = 46e-8, masse = 7870, e = 3e-4, E = 0.03;
  const p = M.pertesFoucaultTole(f, B0, e, rho), pE = M.pertesFoucaultTole(f, B0, E, rho);
  $("sys2").innerHTML = t("sys2.body", { e: F.si(e, "m", { prefix: "m" }), B: F.si(B0, "T"), rho: F.qty(F.sci(rho, 2), "Ω·m"), p: F.si(p, "W·m⁻³"),
    pk: F.qty(F.num(p / masse, 2), "W·kg⁻¹"), E: F.si(E, "m", { prefix: "m" }), x: F.sci(pE / p, 1), P: F.si(1e8 * 0.01, "W") });
  $("s4p2").innerHTML = t("s4.p2", { T: F.kelvin(273.15 - 200) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["stanley", 1886, "use"], ["lauffen", 1891, "experiment"], ["boulder", 1936, "use"], ["ampacity", 2014, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["huile"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tension", "a"], ["courant", "c"], ["section", "d"], ["lauffen", "b"], ["feuillete", "c"], ["chaleur", "a"], ["supra", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 164 });
})();
</script>
