<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique;
const mm = v => isFinite(v) ? F.si(v, "m", { prefix: "m", sig: 3 }) : "∞";

/* ---------- tracé exact à travers un dioptre air → verre, R = +5 cm, contre l'image de Gauss (27.7) ---------- */
(() => {
  const svg = $("dioptre"), ps = $("psl"), ns = $("nsl"), hs = $("hsl"), R = 0.05, W = 640, Hp = 300;
  const X = [-0.62, 0.48], Y = [-0.05, 0.05], x = Plot.linScale(X[0], X[1], 10, W - 10), y = Plot.linScale(Y[0], Y[1], Hp - 20, 20);
  const P = (a, b) => [x(a), y(b)], line = (pts, cls) => Plot.el("path", { d: Plot.path(pts.map(([a, b]) => P(a, b))), class: cls }, svg);
  const mark = (xv, key, cls) => { if (!(xv > X[0] && xv < X[1])) return;
    Plot.el("line", { x1: x(xv), x2: x(xv), y1: y(0) - 5, y2: y(0) + 5, class: "stroke " + cls }, svg);
    Plot.el("text", { x: x(xv), y: y(0) + 18, "text-anchor": "middle" }, svg).textContent = t(key); };
  svg.setAttribute("viewBox", "0 0 " + W + " " + Hp);
  function draw() {
    svg.innerHTML = "";
    const p = +ps.value / 100, n2 = +ns.value, hmax = +hs.value / 100, d = O.dioptre({ n1: 1, n2, R }), pp = d.conj(p);
    const surf = [{ x: 0, R, n: n2 }];
    line([[X[0], 0], [X[1], 0]], "stroke thin rim");
    const arc = []; for (let k = -40; k <= 40; k++) { const yy = 0.048 * k / 40; arc.push([R - Math.sqrt(R * R - yy * yy), yy]); }
    line(arc, "stroke c-label");
    let bord = null;
    for (let k = -6; k <= 6; k++) {
      const h = hmax * k / 6, r = O.trace({ x: p, y: 0, u: Math.atan2(h, -p) }, surf);
      if (!r) continue;
      const [x1, y1] = r.points[1], tEnd = (X[1] - x1) / r.dx;
      line([[p, 0], [x1, y1], [x1 + tEnd * r.dx, y1 + tEnd * r.dy]], "stroke thin c-tint");
      const xc = O.coupeAxe(r);
      if (k !== 0 && xc < x1) line([[x1, y1], [Math.max(xc, X[0]), y1 + (Math.max(xc, X[0]) - x1) * r.dy / r.dx]], "stroke thin dash c-label-2");
      if (k === 6) bord = xc;
    }
    mark(p, "di.A", "c-label"); mark(d.fp, "di.Fp", "c-label-2"); mark(d.f, "di.F", "c-label-2");
    if (isFinite(pp) && pp > X[0] && pp < X[1]) Plot.el("circle", { cx: x(pp), cy: y(0), r: 5, class: "fill c-warn" }, svg);
    $("pread").textContent = mm(p); $("nread").textContent = F.num(n2, 3); $("hread").textContent = mm(hmax);
    $("vfp").textContent = t("di.v.fp", { fp: mm(d.fp) }); $("ff").textContent = t("di.f.f", { f: mm(d.f), V: F.qty(F.num(d.V, 3), "m⁻¹") });
    $("vpp").textContent = isFinite(pp) ? mm(pp) : "∞";
    $("fpp").textContent = t(!isFinite(pp) ? "di.f.infini" : pp > 0 ? "di.f.reelle" : "di.f.virtuelle");
    $("vbord").textContent = bord === null ? "–" : mm(bord);
    $("fbord").textContent = bord === null || !isFinite(pp) ? "" : t("di.f.ecart", { e: mm(bord - pp) });
  }
  ps.oninput = draw; ns.oninput = draw; hs.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["sahl", 984, "idea"], ["descartes", 1637, "idea"], ["gullstrand", 1911, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cornee", "piscine"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["retard", "b"], ["conj", "c"], ["focales", "a"], ["virtuelle", "d"], ["piscine", "b"], ["rapport", "c"], ["bord", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 272 });
})();
</script>
