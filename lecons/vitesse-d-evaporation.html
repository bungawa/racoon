<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>

<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/thermo.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/statistique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique;

/* ---------- l'eau sous vide : flux de Hertz-Knudsen ---------- */
(() => {
  const svg = $("courbe"), st = $("t"), sa = $("a"), T0 = 275, T1 = 370, FILM = 1e-3;   // film of 1 mm, for the cooling rate
  function draw() {
    const T = +st.value, a = +sa.value, e = S.evaporationEau(T, a);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { domain: [T0, T1], label: t("sim.x") }, y: { scale: "log", domain: [1e-2, 1e3], label: t("sim.y") } });
    const line = al => { const p = []; for (let Ti = T0; Ti <= T1; Ti += 1) p.push([o.x(Ti), o.y(S.evaporationEau(Ti, al).J)]); return Plot.path(p); };
    Plot.el("path", { d: line(1), class: "stroke dash c-label-2" }, o.g);
    Plot.el("path", { d: line(a), class: "stroke bold c-tint" }, o.g);
    Plot.el("circle", { cx: o.x(T), cy: o.y(e.J), r: 5, class: "fill c-warn" }, o.g);
    $("tv").innerHTML = F.kelvin(T);
    $("av").textContent = F.fix(a, 2);
    $("vp").textContent = F.si(e.p, "Pa");
    $("vj").textContent = F.qty(F.num(e.J, 3), "kg·m⁻²·s⁻¹");
    $("fj").textContent = t("sim.f.j", { n: F.sci(e.Jn, 2) });
    $("vr").textContent = F.si(e.recul, "m·s⁻¹");
    $("vq").textContent = F.si(e.q, "W·m⁻²");
    $("fq").textContent = t("sim.f.q", { r: F.qty(F.num(e.q / (Thermo.rhoLiq(T) * Thermo.C_EAU * FILM), 2), "K·s⁻¹") });
  }
  st.oninput = draw; sa.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hertz", 1882, "experiment"], ["langmuir", 1913, "experiment"], ["knudsen", 1915, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["depot", "refroidir"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["expo", "b"], ["flux", "d"], ["vide", "a"], ["froid", "c"], ["air", "b"], ["alpha", "a"], ["distribution", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 421 });
})();
</script>
