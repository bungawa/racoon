<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, C = Constantes;
const NI = M.nickelWeiss(), A_NI = Math.SQRT1_2 * Math.cbrt(4 / NI.N), MU_NI = 0.606 * C.mu_B;

/* ---------- le système décrit : trois énergies entre deux atomes voisins de nickel ---------- */
(() => {
  const e = M.echelleEnergies(A_NI, MU_NI, M.NICKEL.Tc), eV = x => F.si(x / C.e, "eV", { sig: 2 });
  $("sys1").innerHTML = t("sys1.body", { a: F.si(A_NI, "m", { sig: 3 }), dip: eV(e.dipolaire), kT: eV(e.thermique), Tc: F.kelvin(M.NICKEL.Tc),
    r1: F.sci(e.rapportDipole, 1), cou: eV(e.coulomb), r2: F.num(100 * e.rapportCoulomb, 1) });
})();

/* ---------- quantique contre classique ---------- */
(() => {
  const st = $("st"), ts = Array.from({ length: 200 }, (_, i) => 0.005 + 0.995 * i / 199);
  const c = { demi: ts.map(x => [x, M.aimantationReduite(x, 0.5)]), un: ts.map(x => [x, M.aimantationReduite(x, 1)]),
    cl: ts.map(x => [x, M.aimantationReduite(x, Infinity)]) };
  c.demi.push([1, 0], [1.2, 0]); c.un.push([1, 0], [1.2, 0]); c.cl.push([1, 0], [1.2, 0]);
  function draw() {
    const tt = +st.value, svg = $("courbes"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, 1.2], label: t("fig.ax.x") }, y: { domain: [0, 1.05], label: t("fig.ax.y") } });
    Plot.el("path", { d: Plot.path(c.cl.map(q => [P.x(q[0]), P.y(q[1])])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(c.un.map(q => [P.x(q[0]), P.y(q[1])])), class: "stroke thin c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(c.demi.map(q => [P.x(q[0]), P.y(q[1])])), class: "curve" }, P.g);
    const md = M.aimantationReduite(tt, 0.5), mc = M.aimantationReduite(tt, Infinity);
    Plot.el("line", { x1: P.x(tt), x2: P.x(tt), y1: P.y(0), y2: P.y(1.05), class: "stroke thin dash c-label" }, P.g);
    Plot.el("circle", { cx: P.x(tt), cy: P.y(md), r: 5, class: "dot" }, P.g);
    Plot.el("circle", { cx: P.x(tt), cy: P.y(mc), r: 4, class: "fill c-warn" }, P.g);
    $("str").textContent = F.num(tt, 3);
    $("vdemi").textContent = F.num(md, 3);
    $("fdemi").innerHTML = t("fig.f.demi", { T: F.kelvin(tt * M.NICKEL.Tc) });
    $("vcl").textContent = F.num(mc, 3);
    $("fcl").innerHTML = t("fig.f.classique", { e: F.num(100 * (md - mc) / md, 2) });
    $("vexp").textContent = F.num(M.exposantLocal(x => M.aimantationReduite(x, 0.5), tt), 3);
    $("fexp").innerHTML = t("fig.f.exposant");
  }
  st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ising", 1925, "idea"], ["heisenberg", 1928, "idea"], ["bloch", 1930, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["thermobalance"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["porteur", "c"], ["dipole", "a"], ["pauli", "d"], ["signe", "b"], ["classique", "c"], ["basse", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 371 });
})();
</script>
