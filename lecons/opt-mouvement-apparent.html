<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, TAU = 2 * Math.PI;

/* ---------- la cycloïde raccourcie et son impulsion ---------- */
(() => {
  const sb = $("sb"), svgC = $("courbe"), svgP = $("pic");
  const betaOf = v => 1 - 0.9 * Math.pow(10, -v / 100);                     // slider 0 … 400: β from 0,1 to 0,999 91
  function draw() {
    const b = betaOf(+sb.value), p = O.picCercle(b);
    /* the received position x′/R over two periods, against the slow sinusoid; the cusps at Ωt = π/2 + 2πk */
    svgC.innerHTML = "";
    const C = Plot.axes(svgC, { fmt: F, w: 640, h: 200, pad: { l: 56, b: 40 }, x: { domain: [0, 2], label: t("fig.taxis") }, y: { domain: [-1.15, 1.15], label: t("fig.ypos") } });
    Plot.el("line", { x1: C.x(0), x2: C.x(2), y1: C.y(0), y2: C.y(0), class: "zero" }, C.g);
    const phis = [];
    for (let k = -1; k <= 2; k++) for (let i = 0; i < 600; i++) { const u = -Math.PI + TAU * i / 600; phis.push(Math.PI / 2 + TAU * k + Math.sign(u) * Math.PI * (Math.abs(u) / Math.PI) ** 3); }  // dense near each cusp
    const pts = phis.map(f => O.cercle(b, f)).filter(q => q.Ot >= 0 && q.Ot <= 2 * TAU);
    const lent = Array.from({ length: 401 }, (_, i) => 2 * TAU * i / 400);
    Plot.el("path", { d: Plot.path(lent.map(s => [C.x(s / TAU), C.y(Math.sin(s))])), class: "ref" }, C.g);
    Plot.el("path", { d: Plot.path(pts.map(q => [C.x(q.Ot / TAU), C.y(q.x)])), class: "curve" }, C.g);
    /* the pulse, centred on the cusp, time in units of 1/ωc, field over its peak; the γ → ∞ curve dashed */
    svgP.innerHTML = "";
    const P = Plot.axes(svgP, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 40 }, x: { domain: [-4, 4], label: t("fig.wct") }, y: { domain: [-0.25, 1.05], label: t("fig.ychamp") } });
    Plot.el("line", { x1: P.x(-4), x2: P.x(4), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const us = Array.from({ length: 401 }, (_, i) => -3 + 6 * i / 400).map(O.picUniversel).filter(g => Math.abs(g.wct) <= 4);
    Plot.el("path", { d: Plot.path(us.map(g => [P.x(g.wct), P.y(g.E)])), class: "ref" }, P.g);
    const ex = Array.from({ length: 401 }, (_, i) => -4 + 8 * i / 400).map(w => [w, -O.cercleVu(b, Math.PI / 2 + w / p.wcSurOmega).a / p.hauteur]);
    Plot.el("path", { d: Plot.path(ex.map(([w, e]) => [P.x(w), P.y(Math.max(-0.25, Math.min(1.05, e)))])), class: "curve" }, P.g);
    $("sbr").textContent = t("fig.bval", { b: F.num(b, b > 0.999 ? 6 : 4), u: F.sci(1 - b, 2) });
    $("vcomp").textContent = F.num(p.compression, 3);
    $("fcomp").textContent = t("fig.f.comp", { g: F.num(2 * p.gamma ** 2, 3) });
    $("vhaut").textContent = p.hauteur < 1e4 ? F.num(p.hauteur, 3) : F.sci(p.hauteur, 3);
    $("fhaut").textContent = t("fig.f.haut");
    $("vlarg").textContent = F.sci(p.largeur / TAU, 3);
    $("flarg").textContent = t("fig.f.larg", { w: F.num(p.largeur * p.wcSurOmega, 3), z: F.num(p.zero * p.wcSurOmega, 3) });
  }
  sb.oninput = draw; draw();
})();

/* ---------- le système décrit : un électron de 1 MeV sur un cercle de 1 m ---------- */
(() => {
  const Cst = Constantes, mc2 = Cst.m_e * Cst.c ** 2, W = mc2 + 1e6 * Cst.e, R = 1, R0 = 100;
  const B = Math.sqrt(W * W - mc2 * mc2) / Cst.c / (Cst.e * R), a = O.anneau({ W, B }), p = O.picCercle(a.beta);
  $("sys1").innerHTML = t("sys1.body", { b: F.num(a.beta, 3), g: F.num(a.gamma, 3), B: F.si(B, "T"), T0: F.si(a.T0, "s"), comp: F.num(p.compression, 3),
    h: F.num(p.hauteur, 3), d: F.si(p.largeur / a.omega, "s"), wc: F.qty(F.sci(a.omegaC, 2), "rad·s⁻¹"), lc: F.si(a.lambdaC, "m"), r: F.num(R / R0, 2), perte: F.sci(a.perte, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["schott", 1912, "idea"], ["pomeranchuk", 1944, "idea"], ["schwinger", 1949, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["moniteur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deplier", "b"], ["pointe", "d"], ["roue", "a"], ["hauteur", "c"], ["largeur", "b"], ["lent", "a"], ["cone", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 342 });
})();
</script>
