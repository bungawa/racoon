<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, MEV = 1e6 * ES.E, FM = 1e-15;
const pct = e => F.qty(F.num(100 * e, 2), "%");

/* ---------- le système décrit : deux petites sphères chargées ---------- */
(() => {
  const q = 10e-9, a = 0.01, d = 0.1, Up = ES.energiePaires([{ q, x: 0, y: 0 }, { q, x: d, y: 0 }]), Us = ES.K * q * q / (2 * a);
  $("sys1").innerHTML = t("sys1.body", { up: F.si(Up, "J"), us: F.si(Us, "J"), rap: F.num(a / d, 2), corr: pct((a / d) ** 3) });
})();

/* ---------- building the ball shell by shell: dU/dr and U(r), for three distributions of the same Q and a ---------- */
(() => {
  const svg = $("bati"), rsl = $("rsl"), Q = 1, a = 1, U0 = ES.K * Q * Q / a;
  const DIST = { uniforme: ES.BOULES.uniforme(Q, a), parabolique: ES.BOULES.parabolique(Q, a), coquille: ES.BOULES.coquille(Q, 0.7, a) };
  const coupe = (B, r) => ({ charge: x => B.charge(Math.min(x, r)) });           // the ball built up to the radius r
  const N = 200, us = Array.from({ length: N + 1 }, (_, i) => i / N);
  let nom = "uniforme";
  const tables = {};
  for (const k in DIST) {                                                        // U(r) and dU/dr, in units of K Q²/a
    const B = DIST[k], U = us.map(u => (u === 0 ? 0 : ES.energieAssemblage(coupe(B, u), u, 400) / U0));
    const dU = us.map(u => (u === 0 ? 0 : ES.K * B.charge(u) * B.rho(u) * 4 * Math.PI * u / U0));   // (8.4): K Q(r) dQ/dr / r
    tables[k] = { U, dU, total: ES.energieAssemblage(B, a, 4000) / U0 };
  }
  function draw() {
    const k = +rsl.value / 100, T = tables[nom], top = Math.max(...T.dU) * 1.1;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44 }, x: { domain: [0, 1], label: t("ba.x"), fmt: v => F.num(v, 2) }, y: { domain: [0, Math.max(top, 1.05 * T.total)], label: t("ba.y"), fmt: v => F.num(v, 2) } });
    const gs = Plot.el("g", { class: "c-tint" }, g), gu = Plot.el("g", { class: "c-warn" }, g);
    const pts = (arr, upto) => us.filter(u => u <= upto + 1e-9).map(u => [x(u), y(arr[Math.round(u * N)])]);
    Plot.el("path", { d: Plot.path(pts(T.dU, 1)), class: "stroke dash" }, gs);
    Plot.el("path", { d: Plot.path(pts(T.dU, k)), class: "stroke" }, gs);
    Plot.el("path", { d: Plot.path(pts(T.U, 1)), class: "stroke dash" }, gu);
    Plot.el("path", { d: Plot.path(pts(T.U, k)), class: "stroke" }, gu);
    Plot.el("line", { x1: x(k), x2: x(k), y1: y(0), y2: y(Math.max(top, 1.05 * T.total)), class: "stroke thin dash" }, Plot.el("g", { class: "c-label-2" }, g));
    const i = Math.round(k * N);
    $("rread").textContent = F.num(k, 2);
    $("vfait").textContent = pct(T.U[i] / T.total);
    $("vcharge").textContent = pct(DIST[nom].charge(k) / Q);
    $("vtotal").textContent = F.num(T.total, 3);
  }
  document.querySelectorAll("#dist button").forEach(b => b.onclick = () => {
    nom = b.dataset.d; document.querySelectorAll("#dist button").forEach(z => z.setAttribute("aria-pressed", z === b)); draw(); });
  rsl.oninput = draw; draw();
})();

/* ---------- le système décrit : le noyau d'uranium 238 comme boule uniforme ---------- */
(() => {
  const Z = 92, A = 238, R = 1.25 * FM * Math.cbrt(A), U = ES.energieBoule(Z * ES.E, R);
  /* the same charge with a diffuse edge: ρ ∝ 1/(1 + e^((r − R)/d)), d = 0,5 fm (Woods–Saxon), half density at R */
  const d = 0.5 * FM, Rm = R + 20 * d, n = 4000, h = Rm / n, cum = [0];
  for (let i = 1; i <= n; i++) { const r = (i - 0.5) * h; cum.push(cum[i - 1] + 4 * Math.PI * r * r * h / (1 + Math.exp((r - R) / d))); }
  const B = { charge: r => { const u = Math.min(n, r / h), i = Math.min(n - 1, Math.floor(u)); return Z * ES.E * (cum[i] + (cum[i + 1] - cum[i]) * (u - i)) / cum[n]; } };
  const Ud = ES.energieAssemblage(B, Rm, n);
  $("sys2").innerHTML = t("sys2.body", { r: F.si(R, "m", { prefix: "f" }), u: F.qty(F.num(U / MEV, 3), "MeV"), z: pct(1 / Z), par: F.qty(F.num(U / MEV / A, 2), "MeV"), diff: pct(1 - Ud / U) });
})();

/* ---------- the ball as 2n³ point charges: the pair sum misses the energy of each grain ---------- */
(() => {
  const nsl = $("nsl"), U87 = ES.energieBoule(1, 1);
  function draw() {
    const n = +nsl.value, c = ES.bouleDiscrete(1, 1, n), N = c.length, r = ES.energiePaires(c) / U87;
    $("nread").textContent = F.num(N, 4);
    $("vpaires").textContent = F.num(r, 4);
    $("vmanque").textContent = pct(1 - r);
    $("vestim").textContent = pct(N ** (-2 / 3));
  }
  nsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ewald", 1921, "idea"], ["weizsacker", 1935, "idea"], ["fission", 1939, "experiment"], ["pme", 1993, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["md", "fission"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["paires", "c"], ["ordre", "a"], ["derniere", "d"], ["double", "b"], ["coquille", "a"], ["grain", "c"], ["noyau", "b"], ["signe", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 81 });
})();
</script>
