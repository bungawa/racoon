<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, DEG = 180 / Math.PI, MEC2 = Constantes.m_e * O.c ** 2 / Constantes.e;   // electron rest energy, eV
const betaDe = g => Math.sqrt((g - 1) * (g + 1)) / g;

/* ---------- le coude vu de loin, et le cône où part l'énergie ---------- */
(() => {
  const svgA = $("apparent"), svgP = $("polaire"), sg = $("sg"), seg = $("mode"), DELTA = 0.2, BREF = 0.1;
  let mode = "perpendiculaire";
  /* apparent transverse position x′ against the observer's time t, observer far away along the initial velocity (θ = 0):
     t = t′ − z(t′)/c, x′ = x(t′); in units of the turn duration T and of the end-of-turn offset R(1 − cos δ) */
  const courbe = b => { const k = O.coude({ beta: b, R: 1, delta: DELTA }), u = 1 - Math.cos(DELTA);
    return Array.from({ length: 401 }, (_, i) => { const tp = (-0.3 + 3.3 * i / 400) * k.T, r = k.traj(tp); return [(tp - r[2] / O.c) / k.T, r[0] / u]; }); };
  function draw() {
    const g = 10 ** +sg.value, b = betaDe(g);
    svgA.innerHTML = "";
    const A = Plot.axes(svgA, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 40 }, x: { domain: [-0.3, 1.5], label: t("fig.xaxis") }, y: { domain: [0, 4], label: t("fig.yaxis") } });
    const clipA = ([x, y]) => [A.x(Math.max(-0.3, Math.min(1.5, x))), A.y(Math.max(0, Math.min(4, y)))];
    const visible = p => p[0] >= -0.3 && p[0] <= 1.5 && p[1] <= 4;
    Plot.el("path", { d: Plot.path(courbe(BREF).filter(visible).map(clipA)), class: "stroke c-warn" }, A.g);
    Plot.el("path", { d: Plot.path(courbe(b).filter(visible).map(clipA)), class: "curve" }, A.g);
    /* polar diagram in the plane of v and a (φ = 0, π), velocity to the right, acceleration up */
    svgP.innerHTML = "";
    const cx = 320, cy = 150, R = 140, N = 721;
    const D = (bb, th, ph) => O.distributionAngulaire(bb, th, ph, mode);
    const lobe = bb => { const pts = Array.from({ length: N }, (_, i) => -Math.PI + 2 * Math.PI * i / (N - 1));
      const val = pts.map(th => D(bb, Math.abs(th), th < 0 ? Math.PI : 0)), max = Math.max(...val);
      return Plot.path(pts.map((th, i) => [cx + R * val[i] / max * Math.cos(th), cy - R * val[i] / max * Math.sin(th)])); };
    Plot.el("line", { x1: cx - R, x2: cx + R + 20, y1: cy, y2: cy, class: "stroke thin c-label-2" }, svgP);
    Plot.fleche(svgP, [cx, cy], [cx + 60, cy], { cls: "c-label-2" });                               // v
    if (mode === "parallele") Plot.fleche(svgP, [cx, cy + 14], [cx + 40, cy + 14], { cls: "c-ko" });  // a along v
    else Plot.fleche(svgP, [cx, cy], [cx, cy - 40], { cls: "c-ko" });                                // a across v
    Plot.el("path", { d: lobe(BREF), class: "stroke c-warn" }, svgP);
    Plot.el("path", { d: lobe(b), class: "curve" }, svgP);
    /* stats */
    const cone = O.demiCone(b, mode);
    $("sgr").textContent = t("fig.f.gamma", { g: F.num(g, 3), b: F.num(b, 4) });
    $("vc").textContent = F.sci(O.compression(b, 1), 2);
    $("fc").textContent = t("fig.f.comp", { x: F.num(1 / O.compression(b, 1), 3) });
    $("vk").textContent = F.num(cone * DEG, 2) + "°";
    $("fk").textContent = t("fig.f.cone", { g: F.num(DEG / g, 2) + "°", r: F.num(cone * g, 2) });
    $("vf").textContent = F.qty(F.num(100 * O.fractionCone(b, Math.min(Math.PI, 1 / g), mode), 3), "%");
    $("ff").textContent = t("fig.f.frac");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; draw(); });
  sg.oninput = draw; draw();
})();

/* ---------- le système décrit : tube à rayons X de 100 kV contre accélérateur médical de 6,5 MeV ---------- */
(() => {
  const ligne = K => { const g = 1 + K / MEC2, b = betaDe(g); return { g: F.num(g, 3), b: F.num(b, 3), un: F.sci(O.compression(b, 1), 2), c: F.num(O.demiCone(b) * DEG, 2) + "°" }; };
  const tube = ligne(1e5), lin = ligne(6.5e6);
  $("sys1").innerHTML = t("sys1.body", { g1: tube.g, b1: tube.b, u1: tube.un, c1: tube.c, g2: lin.g, b2: lin.b, u2: lin.un, c2: lin.c,
    l: F.si(Constantes.h * O.c / (Constantes.e * 1e5), "m") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rontgen", 1895, "experiment"], ["duane", 1915, "experiment"], ["bethe", 1934, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["linac", "tube"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["avant", "b"], ["compression", "d"], ["cone", "a"], ["lent", "c"], ["coupure", "b"], ["tungstene", "a"], ["axe", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 345 });
})();
</script>
