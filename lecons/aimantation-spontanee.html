<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, C = Constantes, NI = M.nickelWeiss();

/* ---------- le système décrit : un moment dans un tesla, contre l'agitation ---------- */
(() => {
  const x = C.mu_B * 1 / (C.k_B * 300), Bd = C.mu0 * NI.Msat;
  $("sys1").innerHTML = t("sys1.body", { x: F.num(x, 2), Bd: F.si(Bd, "T", { sig: 2 }), x2: F.num(C.mu_B * Bd / (C.k_B * 300), 2) });
})();

/* ---------- la résolution graphique, et la courbe de l'aimantation spontanée ---------- */
(() => {
  const st = $("st"), sh = $("sh");
  const courbe = []; for (let i = 1; i <= 160; i++) { const tt = 1.2 * i / 160; courbe.push([tt, M.weiss(tt, 0).m]); }
  function draw() {
    const tt = +st.value, h = +sh.value, w = M.weiss(tt, h);
    let svg = $("tanh"); svg.innerHTML = "";
    let P = Plot.axes(svg, { fmt: F, w: 640, h: 320, x: { domain: [-3, 3], label: t("fig1.ax.x") }, y: { domain: [-1.2, 1.2], label: t("fig1.ax.y") } });
    Plot.el("line", { x1: P.x(-3), x2: P.x(3), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("line", { x1: P.x(0), x2: P.x(0), y1: P.y(-1.2), y2: P.y(1.2), class: "zero" }, P.g);
    const xs = Array.from({ length: 241 }, (_, i) => -3 + 6 * i / 240);
    Plot.el("path", { d: Plot.path(xs.map(x => [P.x(x), P.y(Math.tanh(x))])), class: "curve" }, P.g);
    const ln = xs.map(x => [x, tt * x - h]).filter(q => q[1] >= -1.2 && q[1] <= 1.2);
    Plot.el("path", { d: Plot.path(ln.map(q => [P.x(q[0]), P.y(q[1])])), class: "ref" }, P.g);
    for (const m of w.racines) { const x = (h + m) / tt; if (Math.abs(x) <= 3) Plot.el("circle", { cx: P.x(x), cy: P.y(m), r: m === w.m ? 6 : 4, class: m === w.m ? "dot" : "stroke c-warn" }, P.g); }
    $("str").textContent = F.num(tt, 3);
    $("shr").textContent = F.num(h, 2);
    $("vm").textContent = F.num(w.m, 3);
    $("fm").innerHTML = t(tt < 1 ? "fig1.f.m.dessous" : "fig1.f.m.dessus", { cw: tt > 1 ? F.num(M.curieWeiss(tt, h), 3) : "" });
    $("vmeta").textContent = w.metastable == null ? t("fig1.aucun") : F.num(w.metastable, 3);
    $("fmeta").innerHTML = t(w.metastable == null ? "fig1.f.meta.non" : h === 0 ? "fig1.f.meta.sym" : "fig1.f.meta.oui");
    $("vni").innerHTML = F.kelvin(tt * M.NICKEL.Tc);
    $("fni").innerHTML = t("fig1.f.ni", { H: F.si(0.1 * C.k_B * M.NICKEL.Tc / (C.mu_B * C.mu0), "A·m⁻¹", { sig: 2 }) });
    svg = $("spont"); svg.innerHTML = "";
    P = Plot.axes(svg, { fmt: F, w: 640, h: 240, x: { domain: [0, 1.2], label: t("fig2.ax.x") }, y: { domain: [0, 1.05], label: t("fig2.ax.y") } });
    Plot.el("path", { d: Plot.path(courbe.map(q => [P.x(q[0]), P.y(q[1])])), class: "curve" }, P.g);
    const pr = courbe.filter(q => q[0] <= 1).map(q => [q[0], Math.sqrt(3 * (1 - q[0]))]).filter(q => q[1] <= 1.05);
    Plot.el("path", { d: Plot.path(pr.map(q => [P.x(q[0]), P.y(q[1])])), class: "ref" }, P.g);
    Plot.el("circle", { cx: P.x(Math.min(1.2, tt)), cy: P.y(M.weiss(tt, 0).m), r: 5, class: "dot" }, P.g);
  }
  st.oninput = sh.oninput = draw; draw();
})();

/* ---------- le nickel ---------- */
(() => {
  $("nickel").innerHTML = t("nickel.body", { N: F.sci(NI.N, 3), Ms: F.si(NI.Msat, "A·m⁻¹", { sig: 2 }), T13: F.si(NI.Tc13, "K", { sig: 2 }),
    Tc: F.kelvin(M.NICKEL.Tc), f: F.num(NI.facteur, 2), l: F.num(NI.lambda, 2), Bl: F.si(NI.champ, "T", { sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["curie", 1895, "experiment"], ["weiss", 1907, "idea"], ["bitter", 1931, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cuiseur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["agitation", "b"], ["dessus", "d"], ["local", "a"], ["nickel", "c"], ["curieweiss", "b"], ["pres", "c"], ["domaines", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 366 });
})();
</script>
