<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les symétries brisées</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-principes" data-i18n="monde.principes"></a><span class="aux">›</span><a href="/racoon/etape?id=parite-antimatiere" data-i18n="etape.parite-antimatiere"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/l-antimatiere" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p id="s1p2"></p>
    <div class="eq"><math display="block"><mi>Δ</mi><msub><mi>E</mi><mi>C</mi></msub><mo>=</mo><mfrac><mn>3</mn><mn>5</mn></mfrac><mfrac><mrow><mo>(</mo><mi>A</mi><mo>−</mo><mn>1</mn><mo>)</mo><msup><mi>e</mi><mn>2</mn></msup></mrow><mrow><mn>4</mn><mi>π</mi><msub><mi>ε</mi><mn>0</mn></msub><msub><mi>r</mi><mn>0</mn></msub><msup><mi>A</mi><mrow><mn>1</mn><mo>/</mo><mn>3</mn></mrow></msup></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.coulomb"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure class="chart">
      <svg id="graphe" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="sa" data-i18n="fig.a"></label><output id="sar" for="sa"></output></div>
          <input id="sa" type="range" min="3" max="99" step="2" value="15"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="fig.k.de"></span><span class="v" id="vde"></span><span class="f" id="fde"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.k.b"></span><span class="v" id="vb"></span><span class="f" id="fb"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.k.r"></span><span class="v" id="vr"></span><span class="f" id="fr"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="list keyed" id="echelle"></div>
    <p data-i18n-html="s3.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <p data-i18n-html="s4.p2"></p>
    <p data-i18n-html="s4.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/les-symetries-brisees.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/principes.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Principes, C = Constantes;
const MEV = 1e6 * C.e, mev = x => F.qty(F.num(x / MEV, 3), "MeV");
const B_NUCLEON = 8 * MEV;                             // binding energy per nucleon, about 8 MeV beyond the light nuclei
const B_H3 = 8.481855 * MEV, B_HE3 = 7.718109 * MEV;   // measured (TUNL evaluation)

/* ---------- tritium et hélium 3 ---------- */
(() => {
  $("s1p2").innerHTML = t("s1.p2", { bh: mev(B_H3), bhe: mev(B_HE3), d: mev(B_H3 - B_HE3), m: mev(P.ecartMiroir(3).dE),
    R: F.qty(F.num(P.ecartMiroir(3).R * 1e15, 3), "fm") });
})();

/* ---------- l'écart coulombien selon A ---------- */
(() => {
  const svg = $("graphe"), sa = $("sa");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 },
    x: { domain: [0, 100], label: t("fig.x") }, y: { domain: [0, 16], label: t("fig.y") } });
  const As = []; for (let A = 3; A <= 99; A += 2) As.push(A);
  Plot.el("path", { d: Plot.path(As.map(A => [x(A), y(P.ecartMiroir(A).dE / MEV)])), class: "curve" }, g);
  Plot.el("path", { d: Plot.path(As.map(A => [x(A), y(100 * P.ecartMiroir(A).dE / (B_NUCLEON * A))])), class: "ref" }, g);
  Plot.el("circle", { cx: x(3), cy: y((B_H3 - B_HE3) / MEV), r: 4, class: "dot" }, g);
  Plot.el("text", { x: x(3) + 10, y: y((B_H3 - B_HE3) / MEV) - 8, class: "note" }, g).textContent = t("fig.mesure");
  Plot.el("text", { x: x(70), y: y(13), class: "note" }, g).textContent = t("fig.l.de");
  Plot.el("text", { x: x(70), y: y(2.6), class: "note" }, g).textContent = t("fig.l.r");
  const dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  function draw() {
    const A = +sa.value, m = P.ecartMiroir(A), B = B_NUCLEON * A, r = m.dE / B;
    dot.setAttribute("cx", x(A)); dot.setAttribute("cy", y(m.dE / MEV));
    $("sar").textContent = t("fig.paire", { A: String(A), Z: String(m.Z), N: String(m.N) });
    $("vde").textContent = mev(m.dE); $("fde").textContent = t("fig.f.de", { R: F.qty(F.num(m.R * 1e15, 3), "fm") });
    $("vb").textContent = mev(B); $("fb").textContent = t("fig.f.b");
    $("vr").textContent = F.qty(F.num(100 * r, 2), "%"); $("fr").textContent = t("fig.f.r");
  }
  sa.oninput = draw; draw();
})();

/* ---------- l'échelle des brisures ---------- */
(() => {
  const mnp = (C.m_n - C.m_p) / C.m_p, coul = P.ecartMiroir(41).dE / (B_NUCLEON * 41);
  const a = Math.abs(P.coefficientWu(-1, 1, P.betaCinetique(317e3 * C.e, C.m_e * C.c * C.c))), kl = 1 / 500;
  const ROWS = [["isospin", mnp], ["coulomb", coul], ["cp", kl], ["parite", a]], txt = textOf("echelle.rows", ROWS.map(r => r[0]));
  $("echelle").innerHTML = ROWS.map(([id, v]) => `<div><span class="k">${F.sci(v, 1)}</span><span>${txt[id]}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["heisenberg", 1932, "idea"], ["wigner", 1937, "idea"], ["cpt", 1954, "idea"], ["cronin", 1964, "experiment"],
    ["sakharov", 1967, "idea"], ["bmesons", 2001, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lhcb"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["nucleaire", "b"], ["miroirs", "d"], ["croissance", "a"], ["kaon", "c"], ["cpt", "a"], ["univers", "d"], ["grec", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 529 });
})();
</script>
</body>
</html>
