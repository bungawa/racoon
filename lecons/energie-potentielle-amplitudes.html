<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- an electron of kinetic energy Ec meets a step of height V and width L: wavelength or decay length, attenuation (7.25) ---------- */
(() => {
  const sE = $("sE"), sV = $("sV"), sL = $("sL"), EV = Constantes.e, M = Constantes.m_e, HB = Q.hbar;
  function draw() {
    const Ec = +sE.value * EV, V = +sV.value * EV, L = +sL.value * 1e-9, p1 = Math.sqrt(2 * M * Ec), l1 = Q.h / p1;
    const svg = $("marche"); svg.innerHTML = "";
    const X = x => 40 + (x + 2) * 560 / 5, Yv = e => 200 - e * 15;     // x from −2 to 3 nm; energies in eV, 15 px per eV
    Plot.el("path", { d: Plot.path([[X(-2), Yv(0)], [X(0), Yv(0)], [X(0), Yv(+sV.value)], [X(+sL.value), Yv(+sV.value)], [X(+sL.value), Yv(0)], [X(3), Yv(0)]]), class: "stroke c-label-2", fill: "none" }, svg);
    Plot.el("line", { x1: X(-2), x2: X(3), y1: Yv(+sE.value), y2: Yv(+sE.value), class: "stroke thin dash c-warn" }, svg);
    /* a sketch of Re ψ: oscillation outside, wave or exponential inside, scaled to fit, centred on the energy line */
    const xs = Array.from({ length: 501 }, (_, k) => -2 + k * 0.01), amp = 1.2, k1 = p1 / HB * 1e-9;
    const inside = V > Ec, q = Math.sqrt(2 * M * Math.abs(V - Ec)) / HB * 1e-9, att = Math.exp(-q * +sL.value);
    const f = x => x < 0 ? Math.cos(k1 * x) : x < +sL.value ? (inside ? Math.exp(-q * x) : Math.cos(q * x)) : (inside ? att : 1) * Math.cos(k1 * (x - +sL.value));
    Plot.el("path", { d: Plot.path(xs.map(x => [X(x), Yv(+sE.value) - 15 * amp * f(x)])), class: "stroke c-tint", fill: "none" }, svg);
    $("sEr").textContent = F.num(+sE.value, 2) + "\u00a0eV"; $("sVr").textContent = F.num(+sV.value, 2) + "\u00a0eV"; $("sLr").textContent = F.si(L, "m");
    $("vl1").textContent = F.si(l1, "m");
    if (inside) { $("vl2").textContent = F.si(1 / (q * 1e9), "m"); $("fl2").textContent = t("fig.f.decr"); }
    else { $("vl2").textContent = F.si(Q.h / Math.sqrt(2 * M * (Ec - V)), "m"); $("fl2").textContent = t("fig.f.onde"); }
    const T = Q.attenuationBarriere(M, Ec, V, L);
    $("vatt").textContent = F.sci(T, 2); $("fatt").textContent = t("fig.f.att", { r: F.num(q * +sL.value, 2) });
  }
  sE.oninput = sV.oninput = sL.oninput = draw; draw();
  const a = Q.attenuationBarriere(M, 4 * EV, 8.5 * EV, 0.5e-9), b = Q.attenuationBarriere(M, 4 * EV, 8.5 * EV, 0.6e-9);
  $("sys1").innerHTML = t("sys1.body", { a: F.sci(a, 2), r: F.num(a / b, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gamow", 1928, "idea"], ["esaki", 1957, "experiment"], ["stm", 1981, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["flash"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["constant", "c"], ["frequence", "a"], ["lambda", "d"], ["interdit", "b"], ["epais", "c"], ["stm", "a"], ["classique", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 703 });
})();
</script>
