<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, MU0 = Constantes.mu0;

/* ---------- lignes de champ de la boucle (exactes) et du dipôle, dans le plan y = 0 ; champ en un point sonde ---------- */
(() => {
  const svg = $("lignes"), ss = $("ss"), rs = $("rs"), ts = $("ts"), Ic = 1;               // A ; lengths in mm on the sliders
  const O = [320, 200], S = 2000;                                                           // px, px per m (view ±16 cm × ±10 cm)
  const px = v => [O[0] + S * v[0], O[1] - S * v[1]];
  const inside = v => Math.abs(v[0]) < 0.16 && Math.abs(v[1]) < 0.1;
  let forme = "carre";
  /* the runs of consecutive points inside the frame: a line that leaves and comes back is not joined across the edge */
  const morceaux = pts => pts.reduce((acc, q, k) => { if (!inside(q)) return acc; if (k === 0 || !inside(pts[k - 1])) acc.push([]); acc[acc.length - 1].push(q); return acc; }, []).filter(m => m.length > 1);
  /* B of the loop at a point of space: the square of side s, or the circular loop of the same area (spireExacte) */
  const champ = (s, p) => {
    if (forme === "carre") return M.circuitB(Ic, M.rectangle(s, s), p);
    const R0 = s / Math.sqrt(Math.PI), rho = Math.hypot(p[0], p[1]), b = M.spireExacte(Ic, R0, rho, p[2]);
    return rho > 0 ? [b.Brho * p[0] / rho, b.Brho * p[1] / rho, b.Bz] : [0, 0, b.Bz];
  };
  function draw() {
    const s = +ss.value / 1000, R = +rs.value / 1000, th = +ts.value * Math.PI / 180, mu = Ic * s * s;
    svg.innerHTML = "";
    /* point dipole: r = C sin²θ, θ from the z axis */
    const gp = Plot.el("g", { class: "c-label-2" }, svg);
    [0.03, 0.05, 0.08, 0.12, 0.18, 0.28].forEach(C => [1, -1].forEach(sg => {
      const pts = Array.from({ length: 241 }, (_, k) => { const u = Math.PI * (k + 0.5) / 241, rr = C * Math.sin(u) ** 2; return [sg * rr * Math.sin(u), rr * Math.cos(u)]; });
      morceaux(pts).forEach(m => Plot.el("path", { d: Plot.path(m.map(px)), class: "stroke thin dash" }, gp));
    }));
    /* the loop: lines through the plane of the loop, traced step by step until they close or leave the frame */
    const gl = Plot.el("g", { class: "c-tint" }, svg), Fxz = q => { const b = champ(s, [q[0], 0, q[1]]); return [b[0], b[2]]; };
    for (const f of [0, 0.3, 0.55, 0.75, 0.9]) [1, -1].forEach(sg => {
      if (f === 0 && sg < 0) return;
      const p0 = [sg * f * s / 2, 0], ds = Math.min(s / 40, 0.002);
      [1, -1].forEach(sens => {                                                            // both ways: a line that leaves the frame has two halves
        let n = 0;
        const pts = AnaVec.ligneDeChamp(Fxz, p0, ds, 4000, sens, q => (++n > 20 && Math.hypot(q[0] - p0[0], q[1] - p0[1]) < ds) || !inside(q));
        morceaux(pts).forEach(m => Plot.el("path", { d: Plot.path(m.map(px)), class: "stroke thin" }, gl));
      });
    });
    [-1, 1].forEach(sg => Plot.el("circle", { cx: px([sg * s / 2, 0])[0], cy: O[1], r: 4, class: "fill c-tint" }, svg));
    Plot.el("line", { x1: px([-s / 2, 0])[0], x2: px([s / 2, 0])[0], y1: O[1], y2: O[1], class: "stroke bold c-tint" }, svg);
    /* probe */
    const P = [R * Math.sin(th), 0, R * Math.cos(th)], B = champ(s, P), Bd = M.dipoleB([0, 0, mu], P), c = M.composantesDipoleB(mu, R, th);
    const nB = Math.hypot(...Bd), L = 60 / nB, A = px([P[0], P[2]]);
    Plot.fleche(svg, A, [A[0] + L * B[0], A[1] - L * B[2]], { cls: "c-tint", trait: "stroke bold" });
    Plot.fleche(svg, A, [A[0] + L * Bd[0], A[1] - L * Bd[2]], { cls: "c-warn" });
    Plot.el("circle", { cx: A[0], cy: A[1], r: 4, class: "fill c-warn" }, svg);
    $("ssr").textContent = F.si(s, "m", { prefix: "m" });
    $("rsr").textContent = F.si(R, "m", { prefix: "m" });
    $("tsr").textContent = t("fig.deg", { a: F.num(+ts.value, 3) });
    $("vz").textContent = F.si(c.Bz, "T");
    $("fz").textContent = t("fig.f.exact", { v: F.si(B[2], "T") });
    $("vx").textContent = F.si(c.Bperp, "T");
    $("fx").textContent = t("fig.f.exact", { v: F.si(B[0], "T") });
    $("ve").textContent = t("fig.v.err", { e: F.num(100 * Math.hypot(Bd[0] - B[0], Bd[2] - B[2]) / Math.hypot(...B), 2) });
    $("fe").textContent = t("fig.f.err", { x: F.num(s / R, 2) });
    $("forme").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.f === forme)));
  }
  $("forme").querySelectorAll("button").forEach(x => x.onclick = () => { forme = x.dataset.f; draw(); });
  ss.oninput = rs.oninput = ts.oninput = draw; draw();
})();

/* ---------- le système décrit : la Terre, puis une petite bobine de laboratoire ---------- */
(() => {
  const muT = 8.22e22, RT = Constantes.R_E_mean, eq = M.composantesDipoleB(muT, RT, Math.PI / 2).Bz, pole = M.composantesDipoleB(muT, RT, 0).Bz;
  const s = 0.01, mu = 1 * s * s, d = 0.1, Bb = M.composantesDipoleB(mu, d, 0).Bz, Bex = M.circuitB(1, M.rectangle(s, s), [0, 0, d])[2];
  $("sys1").innerHTML = t("sys1.body", { mu: F.sci(muT, 3), RT: F.si(RT, "m", { prefix: "k", sig: 4 }), eq: F.si(Math.abs(eq), "T"), pole: F.si(pole, "T"),
    s: F.si(s, "m", { prefix: "m" }), m: F.si(mu, "A·m²", { sig: 2 }), d: F.si(d, "m", { prefix: "m" }), Bb: F.si(Bb, "T"),
    ecart: F.num(100 * (Bb / Bex - 1), 2), rap: F.sci(Math.abs(eq) / Bb, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gauss", 1839, "idea"], ["stern", 1922, "experiment"], ["wmm", 2024, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["boussole"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["moment", "c"], ["forme", "a"], ["decroissance", "d"], ["axe", "b"], ["analogie", "c"], ["poles", "a"], ["sonde", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 145 });
})();
</script>
