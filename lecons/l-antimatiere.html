<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'antimatière</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-principes" data-i18n="monde.principes"></a><span class="aux">›</span><a href="/racoon/etape?id=parite-antimatiere" data-i18n="etape.parite-antimatiere"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/la-parite-n-est-pas-conservee" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><msub><mi>E</mi><mi>γ</mi></msub><mo>=</mo><msub><mi>m</mi><mi>e</mi></msub><msup><mi>c</mi><mn>2</mn></msup></math></div>
    <p class="validite" data-i18n-html="val.repos"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>M</mi><msup><mi>c</mi><mn>2</mn></msup><mo>=</mo><msqrt><mrow><mn>2</mn><msub><mi>m</mi><mi>e</mi></msub><msup><mi>c</mi><mn>2</mn></msup><mo>(</mo><mi>T</mi><mo>+</mo><mn>2</mn><msub><mi>m</mi><mi>e</mi></msub><msup><mi>c</mi><mn>2</mn></msup><mo>)</mo></mrow></msqrt></math></div>
    <p class="validite" data-i18n-html="val.masse"></p>
    <figure>
      <svg class="fig" id="vue" viewBox="0 0 640 260" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.pos"></span><span class="c-warn" data-i18n="fig.legend.ph"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="st" data-i18n="fig.t"></label><output id="str" for="st"></output></div>
            <input id="st" type="range" min="0" max="3" step="0.01" value="1"></div>
          <div class="ctl"><div class="row"><label for="sa" data-i18n="fig.a"></label><output id="sar" for="sa"></output></div>
            <input id="sa" type="range" min="0" max="180" step="1" value="90"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="fig.k.e1"></span><span class="v" id="ve1"></span><span class="f" id="fe1"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.k.e2"></span><span class="v" id="ve2"></span><span class="f" id="fe2"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.k.angle"></span><span class="v" id="vang"></span><span class="f" id="fang"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <p data-i18n-html="s3.p2"></p>
    <figure>
      <svg class="fig" id="nu" viewBox="0 0 640 150" role="img" data-i18n-attr="aria-label:nu.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="nu.legend.p"></span><span class="c-label-2" data-i18n="nu.legend.s"></span></div>
      <div class="panel">
        <div class="seg" role="group" id="ops">
          <button type="button" data-op="" data-i18n="nu.op.rien"></button>
          <button type="button" data-op="P" data-i18n="nu.op.P"></button>
          <button type="button" data-op="C" data-i18n="nu.op.C"></button>
          <button type="button" data-op="CP" data-i18n="nu.op.CP"></button>
          <button type="button" data-op="T" data-i18n="nu.op.T"></button>
          <button type="button" data-op="CPT" data-i18n="nu.op.CPT"></button>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="nu.k.etat"></span><span class="v" id="vetat"></span><span class="f" id="fetat"></span></div>
          <div class="stat"><span class="k" data-i18n="nu.k.existe"></span><span class="v" id="vex"></span><span class="f" id="fex"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="nu.caption"></figcaption>
    </figure>
    <p data-i18n-html="s3.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/l-antimatiere.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/principes.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Principes, C = Constantes, DEG = Math.PI / 180;
const MEV = 1e6 * C.e, ev = (E, p) => F.si(E / C.e, "eV", { prefix: p || "k" }), deg = x => F.qty(F.num(x, 3), "°");

/* ---------- l'annihilation en vol ---------- */
(() => {
  const svg = $("vue"), st = $("st"), sa = $("sa"), O = [330, 130];
  function draw() {
    const T = +st.value * MEV, th = +sa.value * DEG, a = P.annihilation(T, th), Emax = a.mc2 + T;
    svg.innerHTML = "";
    Plot.fleche(svg, [60, 130], [O[0] - 12, 130], { cls: "c-tint", trait: "stroke bold" });
    Plot.el("text", { x: 60, y: 118 }, svg).textContent = t("fig.t.pos");
    Plot.el("circle", { cx: O[0], cy: O[1], r: 6, class: "fill c-label" }, svg);
    Plot.el("text", { x: O[0] - 4, y: 154 }, svg).textContent = t("fig.t.ele");
    for (const p of [a.p1, a.p2]) {                                   // length ∝ energy, at most 260 px for T + mc²
      const l = Math.hypot(p[0], p[1]), L = 30 + 95 * l / Emax;
      Plot.fleche(svg, O, [O[0] + L * p[0] / l, O[1] - L * p[1] / l], { cls: "c-warn", trait: "stroke bold" });
    }
    $("str").textContent = ev(T, T >= MEV ? "M" : "k");
    $("sar").textContent = deg(+sa.value);
    $("ve1").textContent = ev(a.E1); $("ve2").textContent = ev(a.E2);
    $("fe1").textContent = t("fig.f.e", { r: F.num(a.E1 / a.mc2, 3) }); $("fe2").textContent = t("fig.f.e", { r: F.num(a.E2 / a.mc2, 3) });
    $("vang").textContent = deg(a.angle / DEG); $("fang").textContent = t("fig.f.angle", { b: F.num(a.betaCM, 3) });
  }
  st.oninput = sa.oninput = draw; draw();
})();

/* ---------- le système décrit : un examen de tomographie ---------- */
(() => {
  const mc2 = C.m_e * C.c * C.c, E = 1 * C.e;                       // a positron slowed to about 1 eV meets an electron
  const p = Math.sqrt(2 * C.m_e * E) * C.c;                           // pc of the pair, J, non-relativistic
  const ecart = p / mc2;                                               // the angle by which the two photons miss 180°, rad
  $("sys").innerHTML = t("sys.body", { mc2: ev(mc2), ecart: F.sci(ecart, 1), deg: F.qty(F.num(ecart / DEG, 1), "°"), d: F.qty(F.num(0.4 * ecart / 2 * 1e3, 1), "mm"),   // chord of a ring of radius 0,4 m: R sin(δ/2)
    rel: F.sci(E / mc2, 1) });
})();

/* ---------- C, P, T sur un neutrino ---------- */
(() => {
  const svg = $("nu"), seg = $("ops");
  const nu = P.etat({ nom: "neutrino", p: [1, 0, 0], s: [-0.5, 0, 0] });         // from π⁺ → μ⁺ ν_μ: left-handed
  let op = "";
  const NOMS = { false: "nu.neutrino", true: "nu.antineutrino" };
  function draw() {
    const e = P.transforme(nu, op), h = P.helicite(e.s, e.p), ok = P.existe(e), Y = 75, X = 320;
    svg.innerHTML = "";
    Plot.el("circle", { cx: X, cy: Y, r: 10, class: e.anti ? "stroke bold c-label" : "fill c-label" }, svg);
    Plot.fleche(svg, [X + 14 * Math.sign(e.p[0]), Y], [X + 150 * Math.sign(e.p[0]), Y], { cls: "c-tint", trait: "stroke bold" });
    Plot.fleche(svg, [X - 14 * Math.sign(e.s[0]), Y + 26], [X + 90 * Math.sign(e.s[0]), Y + 26], { cls: "c-label-2", trait: "stroke" });
    Plot.el("text", { x: X, y: 30, "text-anchor": "middle" }, svg).textContent = t(NOMS[e.anti]);
    $("vetat").textContent = t(NOMS[e.anti]); $("fetat").textContent = t(h < 0 ? "nu.gaucher" : "nu.droitier");
    $("vex").textContent = t(ok ? "nu.oui" : "nu.non"); $("fex").textContent = t(ok ? "nu.f.oui" : "nu.f.non");
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.op === op)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { op = b.dataset.op; draw(); });
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dirac28", 1928, "idea"], ["dirac31", 1931, "idea"], ["anderson", 1932, "experiment"], ["antiproton", 1955, "experiment"],
    ["antihydrogene", 1995, "experiment"], ["alpha", 2010, "experiment"], ["chute", 2023, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tep"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["anti", "c"], ["repos", "a"], ["vol", "d"], ["neutron", "b"], ["martien", "c"], ["cp", "a"], ["tep", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 528 });
})();
</script>
</body>
</html>
