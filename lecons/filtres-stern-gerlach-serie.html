  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>

    <figure class="chart">
      <svg class="fig" id="barres" viewBox="0 0 640 220" role="img" data-i18n-attr="aria-label:fig.aria.barres"></svg>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><span data-i18n="fig.fs"></span></div>
            <div class="seg" role="group" id="fs" data-i18n-attr="aria-label:fig.fs">
              <button type="button" data-i="0" data-i18n="fig.b.plus"></button><button type="button" data-i="1" data-i18n="fig.b.zero"></button><button type="button" data-i="2" data-i18n="fig.b.moins"></button>
            </div></div>
          <div class="ctl"><div class="row"><span data-i18n="fig.ft"></span></div>
            <div class="seg" role="group" id="ft" data-i18n-attr="aria-label:fig.ft">
              <button type="button" data-i="0" data-i18n="fig.b.plus"></button><button type="button" data-i="1" data-i18n="fig.b.zero"></button><button type="button" data-i="2" data-i18n="fig.b.moins"></button>
            </div></div>
          <div class="ctl"><div class="row"><span data-i18n="fig.fs2"></span></div>
            <div class="seg" role="group" id="fs2" data-i18n-attr="aria-label:fig.fs2">
              <button type="button" data-i="0" data-i18n="fig.b.plus"></button><button type="button" data-i="1" data-i18n="fig.b.zero"></button><button type="button" data-i="2" data-i18n="fig.b.moins"></button>
            </div></div>
          <div class="ctl"><div class="row"><label for="sa" data-i18n="fig.alpha"></label><output id="sar" for="sa"></output></div>
            <input id="sa" type="range" min="0" max="180" step="0.5" value="54.5"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.n"></span><span class="v" id="vn"></span><span class="f" id="fn"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.rapport"></span><span class="v" id="vrap"></span><span class="f" id="frap"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.memoire"></span><span class="v" id="vmem"></span><span class="f" id="fmem"></span></div>

      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>

    <p data-i18n-html="s2.p2"></p>

    <div class="eq"><math display="block"><mfrac><msub><mi>N</mi><mn>3</mn></msub><msub><mi>N</mi><mn>2</mn></msub></mfrac><mo>=</mo><msup><mrow><mo>|</mo><mo>⟨</mo><mi>k</mi><msup><mi>S</mi><mo>′</mo></msup><mo>|</mo><mi>i</mi><mi>T</mi><mo>⟩</mo><mo>|</mo></mrow><mn>2</mn></msup></math></div>
    <p class="validite" data-i18n-html="val.rapport"></p>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>

<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>

<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/filtres-stern-gerlach-serie.js"></script>
<script src="/racoon/fmt.js"></script>

<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/quantique-deux-etats.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- S, then T tilted by α about y, then S' (S's orientation); furnace beam: one third in each state, probabilities added ---------- */
(() => {
  const sa = $("sa"), ouv = { fs: [true, false, false], ft: [false, true, false], fs2: [true, false, false] }, S = Q.spin1Y(0);
  const etages = a => [{ R: S, ouverts: ouv.fs }, { R: Q.spin1Y(a), ouverts: ouv.ft }, { R: S, ouverts: ouv.fs2 }];
  /* fractions of the furnace beam after each filter; first: which states the first filter passes (default: its open beams) */
  const fractions = (a, premier) => [0, 1, 2].reduce((acc, i) => {
    const r = Q.chaineFiltres(Q.etatBase(3, i), [{ R: S, ouverts: premier }, ...etages(a).slice(1)]);
    return acc.map((x, k) => x + r[k].p / 3);
  }, [0, 0, 0]);
  function draw() {
    const a = +sa.value * Math.PI / 180, n = fractions(a, ouv.fs), svg = $("barres"); svg.innerHTML = "";
    Object.keys(ouv).forEach(id => $(id).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(ouv[id][+b.dataset.i]))));
    const X = k => 100 + k * 150, Y = v => 180 - v * 150;             // four bars: furnace, after S, after T, after S'
    Plot.el("line", { x1: 40, x2: 620, y1: Y(0), y2: Y(0), class: "axis" }, svg);
    [1, ...n].forEach((v, k) => {
      Plot.el("rect", { x: X(k) - 30, width: 60, y: Y(v), height: Math.max(0, Y(0) - Y(v)), class: "fill c-tint" }, svg);
      Plot.el("text", { x: X(k), y: Y(0) + 18, "text-anchor": "middle" }, svg).textContent = t("fig.etage." + k);
      Plot.el("text", { x: X(k), y: Y(v) - 6, "text-anchor": "middle" }, svg).textContent = F.num(v, 3);
    });
    $("sar").textContent = F.num(+sa.value, 3) + "\u00a0°";
    $("vn").textContent = F.num(n[2], 3);
    $("fn").textContent = t("fig.f.n", { a: F.num(n[0], 3), b: F.num(n[1], 3) });
    $("vrap").textContent = n[1] > 1e-12 ? F.num(n[2] / n[1], 3) : "—";
    $("frap").textContent = t("fig.f.rapport");
    /* the same ratio for each single state let through by the first filter */
    const r = [0, 1, 2].map(i => { const f = fractions(a, [0, 1, 2].map(k => k === i)); return f[1] > 1e-12 ? f[2] / f[1] : null; }).filter(x => x !== null);
    const ecart = r.length ? Math.max(...r) - Math.min(...r) : 0;
    $("vmem").textContent = t(ecart < 1e-9 ? "fig.mem.non" : "fig.mem.oui");
    $("fmem").textContent = t("fig.f.mem", { v: r.map(x => F.num(x, 3)).join(" ; ") });
  }
  Object.keys(ouv).forEach(id => $(id).querySelectorAll("button").forEach(b => b.onclick = () => { ouv[id][+b.dataset.i] = !ouv[id][+b.dataset.i]; draw(); }));
  sa.oninput = draw; draw();
  const am = Math.acos(1 / Math.sqrt(3));
  $("sys1").innerHTML = t("sys1.body", { a: F.num(am * 180 / Math.PI, 3), b: F.num(Cx.abs2(Q.spin1Y(am)[1][0]), 3), c: F.num(Cx.abs2(Q.spin1Y(am)[1][1]), 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wiesner", 1983, "idea"], ["bb84", 1984, "idea"], ["vienne", 2008, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["reseau"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["memoire", "c"], ["tiers", "a"], ["nombre", "d"], ["deuxvoies", "b"], ["ordre", "c"], ["rapport", "a"], ["cle", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 503 });
})();
</script>

</html>
