<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, S = ChimSolutions, $ = id => document.getElementById(id), sym = s => t("chim.sym", { s });
const signe = x => (x > 0 ? "+" : "") + F.num(x, 3);
const keyed = (el, rows) => { el.innerHTML = rows.map(([k, v]) => `<div><span class="k">${k}</span><span>${v}</span></div>`).join(""); };

/* ---------- §2 : le mécanisme schématique, flèches courbes de l'étape « Mécanismes réactionnels » ---------- */
(() => {
  const IDS = ["ethanal", "butanal", "acetone", "butanone", "cyclohexanone", "oxopentanoateEthyle", "butanoateEthyle"];
  const noms = textOf("meca.substrats", IDS), produits = textOf("meca.produits", IDS);
  const sel = $("subsel");
  sel.innerHTML = IDS.map(id => `<option value="${id}">${noms[id]}</option>`).join("");
  sel.value = "butanone";
  let etape = 1;
  const copie = m => ({ atomes: m.atomes.map(a => Object.assign({}, a)), liaisons: m.liaisons.map(l => Object.assign({}, l)) });
  const tourne = (u, deg) => { const r = deg * Math.PI / 180; return [u[0] * Math.cos(r) - u[1] * Math.sin(r), u[0] * Math.sin(r) + u[1] * Math.cos(r)]; };
  /* acte 1 : H⁻ vient du côté opposé à O, dans le plan du dessin ; acte 2 : l'éthanol s'approche de l'alcoolate */
  function actes(m, x) {
    const C = m.atomes[x.c], Ox = m.atomes[x.o], L = Math.hypot(Ox.x - C.x, Ox.y - C.y), u = [(Ox.x - C.x) / L, (Ox.y - C.y) / L];
    const m1 = copie(m), h = m1.atomes.length;
    m1.atomes.push({ e: "H", x: C.x - 1.5 * u[0], y: C.y - 1.5 * u[1], q: -1 });
    const f1 = [{ de: h, vers: [h, x.c] }, { de: [x.c, x.o], vers: x.o }];
    const m2 = copie(O.appliquer(m1, f1).m);
    m2.atomes[h].x = C.x - u[0]; m2.atomes[h].y = C.y - u[1];
    const n = m2.atomes.length, at = (p, v, k) => ({ x: p.x + k * v[0], y: p.y + k * v[1] });
    const v = tourne(u, -55), pH = at(Ox, v, 1.8), pO = at(Ox, v, 3), pC1 = at(pO, tourne(v, 60), 1), pC2 = at(pC1, v, 1);
    m2.atomes.push(Object.assign({ e: "H" }, pH), Object.assign({ e: "O" }, pO), Object.assign({ e: "C" }, pC1), Object.assign({ e: "C" }, pC2));
    m2.liaisons.push({ a: n, b: n + 1, ordre: 1, style: null }, { a: n + 1, b: n + 2, ordre: 1, style: null }, { a: n + 2, b: n + 3, ordre: 1, style: null });
    const f2 = [{ de: x.o, vers: [x.o, n], courbure: 0.6 }, { de: [n + 1, n], vers: n + 1, courbure: 0.6 }];
    return { m1, f1, m2, f2, m3: O.appliquer(m2, f2).m, h, oEt: n + 1 };
  }
  const peindre = d => { $("meca").setAttribute("viewBox", d.viewBox); $("meca").innerHTML = d.html; };
  function maj() {
    const id = sel.value, m = O.molecule(id), r = O.reduireNaBH4(m);
    $("etape").querySelectorAll("button").forEach(b => { b.setAttribute("aria-pressed", String(+b.dataset.e === etape)); b.disabled = !r.reduits.length; });
    if (!r.reduits.length) {
      peindre(O.schema(m, { texte: sym, doublets: false, echelle: 34 }));
      $("mecatexte").textContent = t("meca.rien");
      keyed($("mecadetail"), [[t("meca.k.produit"), t("meca.aucun")]]);
      return;
    }
    const x = r.reduits[0], A = actes(m, x), o = { texte: sym, echelle: 44 };
    if (etape === 1) peindre(O.schema(A.m1, Object.assign(o, { fleches: A.f1, doublets: [x.o, A.h], marques: { [x.c]: "δ+" } })));
    else if (etape === 2) peindre(O.schema(A.m2, Object.assign(o, { fleches: A.f2, doublets: [x.o, A.oEt] })));
    else peindre(O.schema(A.m3, Object.assign(o, { doublets: [A.oEt] })));
    $("mecatexte").textContent = t("meca.texte." + etape);
    const avant = O.nombreOxydation(m, x.c), apres = O.nombreOxydation(r.produit, x.c);
    const d = S.demiEquation(O.formuleTexte(m), O.formuleTexte(r.produit));
    const rows = [
      [t("meca.k.produit"), t("meca.produit", { n: produits[id], k: t("meca.classe." + x.classe) })],
      [t("meca.k.no"), t("meca.no", { a: signe(avant), b: signe(apres) })],
      [t("meca.k.demi"), S.ecrire(d)],
      [t("meca.k.stereo"), t(x.centre ? "meca.racemique" : "meca.achiral")],
    ];
    if (r.intacts.length) rows.push([t("meca.k.intact"), t("meca.intact")]);
    keyed($("mecadetail"), rows);
  }
  sel.onchange = maj;
  $("etape").querySelectorAll("button").forEach(b => b.onclick = () => { etape = +b.dataset.e; maj(); });
  maj();
})();

/* ---------- §3 : stœchiométrie, butanone et NaBH₄ ---------- */
(() => {
  const Mcet = O.masseMolaire(O.formuleBrute(O.molecule("butanone"))), Mol = O.masseMolaire(O.formuleBrute(O.molecule("butan2ol")));
  const Mbh = O.masseMolaire(O.NABH4);                                         // kg·mol⁻¹
  const g = kg => F.si(kg * 1000, "g"), mol = n => F.si(n, "mol");
  function maj() {
    const mc = +$("mcet").value * 1e-3, mb = +$("mbh").value * 1e-3, nc = mc / Mcet, nb = mb / Mbh, r = O.bilanNaBH4(nc, nb);
    $("mcetv").textContent = g(mc); $("mbhv").textContent = g(mb);
    $("sth").textContent = mol(r.hydrures);
    $("fsth").textContent = t("st.f.h", { nb: mol(nb), nc: mol(nc) });
    $("stlim").textContent = t("st.lim." + r.limitant);
    $("fstlim").textContent = r.limitant === "carbonyle" ? t("st.f.exces", { x: F.num(r.hydrures / nc, 3) }) : r.limitant === "hydrure" ? t("st.f.reste", { n: mol(r.resteCarbonyle) }) : t("st.f.juste");
    $("stm").textContent = g(r.nAlcool * Mol);
    $("fstm").textContent = t("st.f.m", { M: F.qty(F.num(Mol * 1000, 4), "g·mol⁻¹") });
  }
  $("mcet").oninput = $("mbh").oninput = maj;
  maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["finholt", 1947, "experiment"], ["schlesinger", 1953, "experiment"], ["brown", 1979, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["papier", "pharmacie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["hydrure", "a"], ["bore", "c"], ["etape2", "b"], ["ester", "d"], ["racemique", "c"], ["stoechio", "a"], ["no", "b"], ["solvant", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
