<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, { k_B, N_A } = Constantes;

/* ---------- la dérive d'une molécule de masse M parmi des molécules de masse m ---------- */
(() => {
  const svg = $("courbe"), sv = $("vols"), sa = $("apres"), sr = $("lr"), K = 300000, TAU = 1e-10, T = 293.15, m = S.M.N2 / N_A;
  let seed = 433;
  function draw() {
    const reg = sv.value === "reg", neuf = sa.value === "neuf", r = Math.pow(10, +sr.value), M = r * m;
    const th = neuf ? (reg ? 0.5 : 1) : S.deriveTheorie(M, m, reg);
    const F0 = 0.2 * Math.sqrt(k_B * T / M) * M / (TAU * th);          // drift 0,2 × thermal speed: a weak force
    const d = S.derive({ M, m, T, F: F0, tau: TAU, chocs: K, regulier: reg, neuf }, Quiz.rng(seed));
    svg.innerHTML = "";
    const top = Math.max(2.2, 1.3 * th);
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { scale: "log", domain: [10, K], label: t("sim.x") }, y: { domain: [0, top], label: t("sim.y") } });
    const h = (y, cls) => { if (y <= top) Plot.el("line", { x1: o.x(10), x2: o.x(K), y1: o.y(y), y2: o.y(y), class: cls }, o.g); };
    h(1, "stroke thin dash c-label-2"); h(0.5, "stroke thin dash c-label-2"); h(th, "stroke c-warn");
    const p = d.suivi.filter(([k]) => k >= 10).map(([k, v]) => [o.x(k), o.y(Math.min(top, Math.max(0, v / d.unite)))]);
    Plot.el("path", { d: Plot.path(p), class: "stroke bold c-tint" }, o.g);
    $("lrv").textContent = F.num(r, 2);
    $("vmes").textContent = F.num(d.v / d.unite, 3);
    $("fmes").textContent = t("sim.f.mes", { e: F.num(d.err / d.unite, 2), k: F.sci(K, 1) });
    $("vth").textContent = F.num(th, 3);
    $("fth").textContent = t(neuf ? (reg ? "sim.f.th.neufreg" : "sim.f.th.neuf") : (reg ? "sim.f.th.chocreg" : "sim.f.th.choc"));
    $("voubli").textContent = neuf ? "1" : F.num(1 + r, 3);
  }
  sv.onchange = draw; sa.onchange = draw; sr.onchange = draw;
  sr.oninput = () => { $("lrv").textContent = F.num(Math.pow(10, +sr.value), 2); };
  $("refaire").onclick = () => { seed++; draw(); }; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["thomson", 1896, "experiment"], ["drude", 1900, "idea"], ["nygren", 1974, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["mobilite", "tpc"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["moitie", "a"], ["numerique", "b"], ["mobilite", "c"], ["lourde", "d"], ["fort", "a"], ["mesure", "b"], ["tube", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 433 });
})();
</script>
