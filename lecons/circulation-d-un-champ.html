<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const C2 = "m²·s⁻¹";

/* ---------- the system, in numbers ---------- */
const RIV = { v0: 1, b: 10 };
(() => {
  const c = [0, 5], R = 2, G = Circ.cercleExact("riviere", [RIV.v0, RIV.b], c, R);
  $("sys").innerHTML = t("sys.body", { b: F.num(2 * RIV.b, 2), v0: F.num(RIV.v0, 1), R: F.num(R, 1), y: F.num(c[1], 1), G: F.fix(G, 2), rb: F.fix(R / RIV.b, 1) });
})();

/* ---------- a loop in the water ---------- */
(() => {
  const svg = $("eau"), P = Plot.el, S = 20, X = x => 320 + S * x, Y = y => 200 - S * y;
  const FIELDS = { uniforme: [1], riviere: [RIV.v0, RIV.b], bloc: [0.1], tourbillon: [20] };
  const notes = textOf("fig.notes", Object.keys(FIELDS));
  let nom = "riviere";
  const sl = { cx: $("cx"), cy: $("cy"), rr: $("rr") };
  const arrow = (x, y, v, cls, parent) => {
    const n = Math.hypot(v[0], v[1]); if (!(n > 0)) return;
    const L = Math.min(1.6 * n, 1.8);
    Plot.fleche(parent, [X(x), Y(y)], [X(x + L * v[0] / n), Y(y + L * v[1] / n)], { cls, tete: 6, trait: "stroke thin" });
  };
  function draw() {
    let R = +sl.rr.value, cx = +sl.cx.value, cy = +sl.cy.value;
    cx = Math.max(-16 + R, Math.min(16 - R, cx)); cy = Math.max(-10 + R, Math.min(10 - R, cy));
    sl.cx.value = cx; sl.cy.value = cy;
    const f = Circ.CHAMPS[nom](...FIELDS[nom]), c = [cx, cy];
    svg.innerHTML = "";
    for (let x = -15; x <= 15; x += 2) for (let y = -9; y <= 9; y += 2) if (x || y) arrow(x, y, f.F([x, y]), "c-label-2", svg);
    if (nom === "riviere") [-10, 10].forEach(y => P("line", { x1: 0, x2: 640, y1: Y(y), y2: Y(y), class: "stroke bold c-label-2" }, svg));
    if (f.singulier) P("circle", { cx: X(0), cy: Y(0), r: 4, class: "fill c-warn" }, svg);
    const dist = Math.hypot(cx, cy), passe = f.singulier && Math.abs(dist - R) < 0.3;
    /* the loop, each piece coloured by the sign of the tangential component */
    const N = 96;
    for (let k = 0; k < N; k++) {
      const a0 = 2 * Math.PI * k / N, a1 = 2 * Math.PI * (k + 1) / N, am = (a0 + a1) / 2;
      const p = [cx + R * Math.cos(am), cy + R * Math.sin(am)];
      const ct = passe && Math.hypot(...p) < 0.3 ? 0 : Circ.CHAMPS[nom](...FIELDS[nom]).F(p).reduce((s, v, i) => s + v * [-Math.sin(am), Math.cos(am)][i], 0);
      const cls = Math.abs(ct) < 1e-3 ? "c-label-2" : ct > 0 ? "c-tint" : "c-warn";
      P("line", { x1: X(cx + R * Math.cos(a0)), y1: Y(cy + R * Math.sin(a0)), x2: X(cx + R * Math.cos(a1)), y2: Y(cy + R * Math.sin(a1)), class: "stroke bold " + cls }, svg);
    }
    /* the direction of travel, counterclockwise, and the cut */
    const tx = X(cx), ty = Y(cy + R);
    P("polygon", { points: [tx - 8, ty, tx + 2, ty - 6, tx + 2, ty + 6].join(" "), class: "fill c-label" }, svg);
    P("line", { x1: X(cx), x2: X(cx), y1: Y(cy - R), y2: Y(cy + R), class: "stroke thin dash c-label-2" }, svg);
    $("cxr").textContent = F.qty(F.fix(cx, 1), "m"); $("cyr").textContent = F.qty(F.fix(cy, 1), "m"); $("rrr").textContent = F.qty(F.fix(R, 1), "m");
    if (passe) {
      ["vcirc", "vmoit", "vmoy"].forEach(id => $(id).textContent = "–");
      $("fcirc").textContent = t("fig.passe"); $("fmoit").textContent = "";
    } else {
      const G = AnaVec.circulation(f.F, AnaVec.cercle(c, R), 1440), m = Circ.moities(f.F, c, R, 720), ex = Circ.cercleExact(nom, FIELDS[nom], c, R);
      $("vcirc").textContent = F.qty(F.fix(G, 2), C2);
      $("fcirc").textContent = t("fig.f.exact", { e: F.fix(ex, 2) });
      $("vmoit").textContent = F.qty(F.fix(m.gauche + m.droite, 2), C2);
      $("fmoit").textContent = t("fig.f.moities", { g: F.fix(m.gauche, 2), d: F.fix(m.droite, 2), c: F.fix(m.coupe, 2) });
      $("vmoy").textContent = F.qty(F.fix(G / (2 * Math.PI * R), 3), "m·s⁻¹");
    }
    $("note").innerHTML = notes[nom];
  }
  document.querySelectorAll("#champs button").forEach(b => b.onclick = () => {
    nom = b.dataset.c; document.querySelectorAll("#champs button").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); });
  Object.values(sl).forEach(s => s.oninput = draw);
  /* drag the loop by its centre */
  const toWorld = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [(q.x - 320) / S, (200 - q.y) / S]; };
  let drag = null;
  svg.addEventListener("pointerdown", e => { const [x, y] = toWorld(e); if (Math.hypot(x - sl.cx.value, y - sl.cy.value) <= +sl.rr.value) { drag = [x - sl.cx.value, y - sl.cy.value]; svg.setPointerCapture(e.pointerId); } });
  svg.addEventListener("pointermove", e => { if (!drag) return; const [x, y] = toWorld(e); sl.cx.value = Math.round(2 * (x - drag[0])) / 2; sl.cy.value = Math.round(2 * (y - drag[1])) / 2; draw(); });
  svg.addEventListener("pointerup", () => drag = null);
  draw();
})();

/* ---------- history ---------- */
(() => {
  const EVENTS = [["chattock", 1887, "experiment"], ["kelvin", 1869, "idea"], ["joukowski", 1906, "idea"], ["rogowski", 1912, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.sort((a, b) => a[1] - b[1]).map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rogowski", "aile"], uses = textOf("uses.items", USES);
  const m = 70000, g = 9.81, rho = 1.2, V = 70, b = 34, G = m * g / (rho * V * b);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace("{G}", F.num(G, 2))}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["definition", "a"], ["uniforme", "b"], ["riviere", "c"], ["bloc", "a"], ["coupe", "d"], ["travail", "b"], ["tourbillon", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 335 });
})();
</script>
