<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organocuprates et additions conjuguées</title>
<link rel="stylesheet" href="/racoon/ds.css">
<style>
  .duo { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: center; }
  .duo svg { width: 170px; max-width: 42%; height: 140px; flex: none; }
  .enal svg { width: 260px; max-width: 100%; height: 110px; display: block; margin: 0 auto; }
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-organique" data-i18n="monde.chim-organique"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-complements-synthese" data-i18n="etape.chim-complements-synthese"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/orbitales-frontalieres" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <figure>
      <div class="seg" role="group" id="reactif"><button type="button" data-r="MeLi" aria-pressed="false" data-i18n="rea.MeLi"></button><button type="button" data-r="MeMgBr" aria-pressed="false" data-i18n="rea.MeMgBr"></button><button type="button" data-r="cuprate" aria-pressed="true" data-i18n="rea.cuprate"></button><button type="button" data-r="kharasch" aria-pressed="false" data-i18n="rea.kharasch"></button></div>
      <div class="duo">
        <svg class="fig no-sigle" id="svgenone" role="img" data-i18n-attr="aria-label:rea.ariaEnone"></svg>
        <span class="aux" data-i18n="rea.fleche"></span>
        <svg class="fig no-sigle" id="svgproduit" role="img" data-i18n-attr="aria-label:rea.ariaProduit"></svg>
      </div>
      <p class="readout" id="realecture" aria-live="polite"></p>
      <figcaption data-i18n-html="rea.caption"></figcaption>
    </figure>
    <div class="box def"><b data-i18n="s1.def.titre"></b>
      <p data-i18n-html="s1.def.corps"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><msub><mi>q</mi><mi>r</mi></msub><mo>=</mo><msub><mi>n</mi><mi>r</mi></msub><mo>−</mo><munder><mo>∑</mo><mi>j</mi></munder><msub><mi>ν</mi><mi>j</mi></msub><msubsup><mi>c</mi><mrow><mi>j</mi><mi>r</mi></mrow><mn>2</mn></msubsup></math></div>
    <p class="validite" data-i18n-html="s2.validite"></p>
    <figure>
      <div class="enal"><svg class="fig no-sigle" id="svgenal" role="img" data-i18n-attr="aria-label:hu.aria"></svg></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="ho" data-i18n-html="hu.ho"></label><output id="hov" for="ho"></output></div>
          <input id="ho" type="range" min="0.5" max="2" step="0.1" value="1"></div>
        <div class="ctl"><div class="row"><label for="kco" data-i18n-html="hu.kco"></label><output id="kcov" for="kco"></output></div>
          <input id="kco" type="range" min="0.8" max="1.2" step="0.05" value="1"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="hu.q2"></span><span class="v" id="q2"></span></div>
          <div class="stat"><span class="k" data-i18n="hu.q4"></span><span class="v" id="q4"></span></div>
          <div class="stat"><span class="k" data-i18n="hu.c2"></span><span class="v" id="c2"></span></div>
          <div class="stat"><span class="k" data-i18n="hu.c4"></span><span class="v" id="c4"></span></div>
        </div>
        <p class="readout" id="hulecture" aria-live="polite"></p>
      </div>
      <figcaption data-i18n-html="hu.caption"></figcaption>
    </figure>
    <div class="box prop"><b data-i18n="s2.prop.titre"></b>
      <p data-i18n-html="s2.prop.corps"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mn>2</mn><mspace width="0.1em"/><mi mathvariant="normal">R</mi><mrow><mi mathvariant="normal">L</mi><mi mathvariant="normal">i</mi></mrow><mo>+</mo><mrow><mi mathvariant="normal">C</mi><mi mathvariant="normal">u</mi><mi mathvariant="normal">I</mi></mrow><mo>⟶</mo><msub><mi mathvariant="normal">R</mi><mn>2</mn></msub><mrow><mi mathvariant="normal">C</mi><mi mathvariant="normal">u</mi><mi mathvariant="normal">L</mi><mi mathvariant="normal">i</mi></mrow><mo>+</mo><mrow><mi mathvariant="normal">L</mi><mi mathvariant="normal">i</mi><mi mathvariant="normal">I</mi></mrow></math></div>
    <p class="validite" data-i18n-html="s3.validite"></p>
    <p data-i18n-html="s3.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/organocuprates.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/quantique-deux-etats.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/chim-organique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, sym = s => t("chim.sym", { s }), $ = id => document.getElementById(id);
const peindre = (svg, m, o) => { const d = O.dessin(m, Object.assign({ texte: sym }, o)); svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };

/* ---------- réactif : addition 1,2 ou 1,4 sur la cyclohex-2-énone ---------- */
(() => {
  const SITE = { MeLi: "12", MeMgBr: "12", cuprate: "14", kharasch: "14" }, PRODUIT = { 12: "methylcyclohexenol", 14: "methylcyclohexanone" };
  peindre($("svgenone"), O.molecule("cyclohexenone"), { marques: { 6: "1", 0: "2", 1: "3", 2: "4" }, echelle: 34 });
  let r = "cuprate";
  function maj() {
    const s = SITE[r], m = O.molecule(PRODUIT[s]);
    peindre($("svgproduit"), m, { surligne: [s === "12" ? 0 : 2], echelle: 34 });
    $("realecture").textContent = t("rea.lecture." + s, { r: t("rea." + r) });
    document.querySelectorAll("#reactif button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.r === r)));
  }
  $("reactif").onclick = e => { const b = e.target.closest("button"); if (!b) return; r = b.dataset.r; maj(); };
  maj();
})();

/* ---------- Hückel : propénal ---------- */
(() => {
  peindre($("svgenal"), O.molecule("propenal"), { marques: { 0: "1", 1: "2", 2: "3", 3: "4" }, echelle: 40 });
  function maj() {
    const hO = +$("ho").value, k = +$("kco").value, h = O.huckelEnone(hO, k), bv = h.orbitales[h.BV].c.map(c => c * c);
    $("hov").textContent = F.fix(hO, 1); $("kcov").textContent = F.fix(k, 2);
    $("q2").textContent = t("hu.charge", { q: F.fix(h.charges[1], 2) }); $("q4").textContent = t("hu.charge", { q: F.fix(h.charges[3], 2) });
    $("c2").textContent = F.fix(bv[1], 2); $("c4").textContent = F.fix(bv[3], 2);
    $("hulecture").textContent = t("hu.lecture", { r: F.num(bv[3] / bv[1], 2), s: F.num(h.charges[1] / h.charges[3], 2) });
  }
  ["ho", "kco"].forEach(id => { $(id).oninput = maj; });
  maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kharasch", 1941, "experiment"], ["gilman", 1952, "experiment"], ["house", 1966, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["fulvestrant", "coreyHouse"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["site", "c"], ["grignard", "a"], ["cuprate", "b"], ["kharasch", "d"], ["huckel", "a"], ["charge", "c"], ["economie", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
</html>
