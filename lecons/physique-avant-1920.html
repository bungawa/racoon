    <h1 data-i18n="h1"></h1>

    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>

    <div class="box def"><b data-i18n="s1.def.title"></b>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq">
      <math display="block"><msub><mi>F</mi><mi>g</mi></msub><mo>=</mo><mi>G</mi><mfrac><mrow><msub><mi>m</mi><mn>1</mn></msub><msub><mi>m</mi><mn>2</mn></msub></mrow><msup><mi>r</mi><mn>2</mn></msup></mfrac><mo>,</mo><mspace width="1.5em"></mspace><msub><mi>F</mi><mi>e</mi></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mn>4</mn><mi>π</mi><msub><mi>ε</mi><mn>0</mn></msub></mrow></mfrac><mfrac><mrow><mo>|</mo><msub><mi>q</mi><mn>1</mn></msub><msub><mi>q</mi><mn>2</mn></msub><mo>|</mo></mrow><msup><mi>r</mi><mn>2</mn></msup></mfrac></math>
    </div>
    <p class="validite" data-i18n="val.2.2"></p>
    <p data-i18n-html="s2.p2"></p>
    <figure>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="fsl" data-i18n="grain.f"></label><output id="fread" for="fsl"></output></div>
            <input id="fsl" type="range" min="-20" max="0" step="0.5" value="0"></div>
          <div class="ctl"><div class="row"><label for="dsl" data-i18n="grain.d"></label><output id="dread" for="dsl"></output></div>
            <input id="dsl" type="range" min="-2" max="3" step="0.01" value="1.48"></div>
        </div>
        <div class="controls">
          <button class="btn tinted" type="button" id="feynman" data-i18n="grain.feynman"></button>
          <button class="btn" type="button" id="egal" data-i18n="grain.egal"></button>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="grain.k.q"></span><span class="v" id="vq"></span><span class="f" data-i18n="grain.k.q.f"></span></div>
          <div class="stat"><span class="k" data-i18n="grain.k.force"></span><span class="v" id="vforce"></span></div>
          <div class="stat"><span class="k" data-i18n="grain.k.masse"></span><span class="v" id="vmasse"></span><span class="f" data-i18n="grain.k.masse.f"></span></div>
          <div class="stat"><span class="k" data-i18n="grain.k.poids"></span><span class="v" id="vpoids"></span><span class="f" data-i18n="grain.k.poids.f"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="grain.caption"></figcaption>

    <div class="box rem"><b data-i18n="s2.rem.title"></b>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n="s3.p1"></p>
    <p data-i18n="s3.p2"></p>
    <div class="box def"><b data-i18n="s3.def.title"></b>
      <p data-i18n-html="s3.def.body"></p>
    </div>
    <p data-i18n="s3.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="eq">
      <math display="block"><mi>λ</mi><mo>=</mo><mfrac><mi>c</mi><mi>f</mi></mfrac><mo>,</mo><mspace width="1.5em"></mspace><mi>E</mi><mo>=</mo><mi>h</mi><mi>f</mi></math>
    </div>
    <p class="validite" data-i18n="val.2.3"></p>
    <figure class="chart">
      <svg id="spectre" role="img" data-i18n-attr="aria-label:spec.aria"></svg>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="lsl" data-i18n="spec.f"></label><output id="lread" for="lsl"></output></div>
          <input id="lsl" type="range" min="1" max="28" step="0.05" value="14.7"></div>
        <div class="seg" id="ladder" role="group" data-i18n-attr="aria-label:spec.rows"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="spec.k.lambda"></span><span class="v" id="vlambda"></span></div>
          <div class="stat"><span class="k" data-i18n="spec.k.e"></span><span class="v" id="ve"></span><span class="f" id="vev"></span></div>
          <div class="stat"><span class="k" data-i18n="spec.k.band"></span><span class="v" id="vband"></span></div>
          <div class="stat"><span class="k" data-i18n="spec.k.how"></span><span class="v" id="vhow"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/physique-avant-1920.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/physique-fondamentale.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const $ = id => document.getElementById(id);
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const P = Fondamentale;

/* ---------- §2-2 : la matière en mouvement ---------- */
(() => {
  const IDS = ["pression", "vent", "chaleur", "son"], txt = textOf("kinetic", IDS);
  $("kinetic").innerHTML = IDS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text}</span></div>`).join("");
})();

/* ---------- §2-2 : deux grains de sable ---------- */
(() => {
  const fsl = $("fsl"), dsl = $("dsl"), D = 1e-3, wGrain = P.grainMass(D) * P.G0;
  const upd = () => {
    const f = 10 ** +fsl.value, d = 10 ** +dsl.value, Fe = P.grainForce(f, d, D);
    $("fread").textContent = +fsl.value === 0 ? "1" : F.sci(f, 2);
    $("dread").textContent = F.si(d, "m");
    $("vq").textContent = F.si(f * P.grainElectronCharge(D), "C");
    $("vforce").textContent = F.si(Fe, "N");
    $("vmasse").textContent = F.qty(F.sci(Fe / P.G0, 2), "kg");
    $("vpoids").textContent = F.sci(Fe / wGrain, 2);
  };
  $("feynman").onclick = () => { fsl.value = 0; dsl.value = Math.log10(30); upd(); };
  $("egal").onclick = () => { dsl.value = Math.log10(30); fsl.value = (Math.round(2 * Math.log10(P.fractionForForce(wGrain, 30, D))) / 2).toFixed(1); upd(); };
  fsl.oninput = dsl.oninput = upd; upd();
})();

/* ---------- §2-2 : l'échelle du spectre électromagnétique ---------- */
(() => {
  const BANDS = textOf("spec.bands", P.BANDS.map(b => b.id)), ROWS = textOf("spec.ladder", P.LADDER.map(r => r.id));
  const FMIN = 10, FMAX = 1e28;
  const { x, y, g } = Plot.axes($("spectre"), { fmt: F, w: 640, h: 190, pad: { l: 16, r: 16, t: 34, b: 40 },
    x: { scale: "log", domain: [FMIN, FMAX], label: t("spec.x"), fmt: v => { const e = Math.round(Math.log10(v)); return e % 3 ? "" : "10" + F.sup(e); } },
    y: { domain: [0, 1], ticks: 1, fmt: () => "" } });
  P.BANDS.forEach((b, i) => {
    const x0 = x(Math.max(b.from, FMIN)), x1 = x(Math.min(b.to, FMAX));
    if (i % 2 === 0) Plot.el("rect", { x: x0, y: y(1), width: x1 - x0, height: y(0) - y(1), class: "area" }, g);
    Plot.el("line", { x1: x0, x2: x0, y1: y(0), y2: y(1), class: "zero" }, g);
    Plot.el("text", { x: (x0 + x1) / 2, y: y([0.72, 0.45, 0.18][i % 3]), "text-anchor": "middle", class: "note" }, g).textContent = BANDS[b.id].short;
  });
  P.LADDER.forEach(r => Plot.el("line", { x1: x(r.f), x2: x(r.f), y1: y(0), y2: y(0.12), class: "axis" }, g));
  const cursor = Plot.el("line", { y1: y(0) + 4, y2: 6, class: "ref" }, g), dot = Plot.el("circle", { r: 6, cy: y(1), class: "dot" }, g);
  const lab = Plot.el("text", { y: 18, "text-anchor": "middle", class: "note" }, g);
  const lsl = $("lsl");
  $("ladder").innerHTML = P.LADDER.map(r => `<button type="button" id="row-${r.id}" aria-pressed="false">${ROWS[r.id].name}</button>`).join("");
  const upd = from => {
    const f = 10 ** +lsl.value, b = P.band(f), X = x(f);
    $("lread").textContent = F.si(f, "Hz");
    cursor.setAttribute("x1", X); cursor.setAttribute("x2", X); dot.setAttribute("cx", X);
    lab.setAttribute("x", Math.min(Math.max(X, 80), 560)); lab.textContent = t("spec.lambda", { l: F.si(P.wavelength(f), "m") });
    $("vlambda").textContent = F.si(P.wavelength(f), "m");
    $("ve").textContent = F.si(P.photonEnergy(f), "J");
    $("vev").textContent = t("spec.ev", { e: F.si(P.photonEnergyEV(f), "eV") });
    $("vband").textContent = BANDS[b].name;
    $("vhow").textContent = BANDS[b].how;
    $("vrow").textContent = from ? ROWS[from].text : BANDS[b].text;
    P.LADDER.forEach(r => $("row-" + r.id).setAttribute("aria-pressed", String(r.id === from)));
  };
  P.LADDER.forEach(r => $("row-" + r.id).onclick = () => { lsl.value = Math.log10(r.f).toFixed(2); upd(r.id); });
  lsl.oninput = () => upd(null); upd(null);
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["coulomb", 1785, "experiment"], ["oersted", 1820, "experiment"], ["faraday", 1831, "experiment"], ["maxwell", 1865, "idea"],
    ["hertz", 1887, "experiment"], ["rontgen", 1895, "experiment"], ["villard", 1900, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["four", "fm"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["rapport", "c"], ["distance", "a"], ["neutre", "d"], ["champ", "b"], ["retard", "a"], ["four", "c"], ["visible", "b"], ["energie", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 22 });
})();
</script>
</body>
</html>
