<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, MEV = 1e6 * ES.E, FM = 1e-15, R0 = 1.2 * FM;
const pct = e => F.qty(F.num(100 * e, 2), "%");
const mev = (x, s) => F.qty(F.num(x / MEV, s || 3), "MeV"), fm = x => F.qty(F.num(x / FM, 3), "fm");
const nom = s => { const m = /^(\d+)(.*)$/.exec(s); return F.sup(m[1]) + m[2]; };                       // "11C" → ¹¹C

/* ---------- le système décrit : le carbone 11 ---------- */
(() => {
  const p = ES.MIROIRS.find(m => m.haut === "11C"), R = ES.rayonMiroir(p), B = ES.energieLiaison(6, 11, p.exces[1]), U = ES.energieCoulombNoyau(6, R);
  $("sys1").innerHTML = t("sys1.body", { r: fm(R), u: mev(U, 2), b: mev(B, 3), part: pct(U / B), de: mev(ES.ecartCoulomb(p), 3) });
})();

/* ---------- les rayons des noyaux miroirs ---------- */
(() => {
  const svg = $("rayons"), psl = $("psl"), P = ES.MIROIRS;
  const pts = P.map(m => ({ m, a: Math.cbrt(m.A), b: ES.rayonMiroir(m) / FM, d: ES.rayonMiroir(m, "dernier") / FM }));
  function draw() {
    const i = +psl.value, s = pts[i], m = s.m;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { b: 44 }, x: { domain: [1, 3.6], label: t("ry.x"), fmt: v => F.num(v, 2) },
      y: { domain: [0, 5.5], label: t("ry.y"), fmt: v => F.num(v, 2) } });
    Plot.el("path", { d: Plot.path([[x(1), y(1.2)], [x(3.6), y(1.2 * 3.6)]]), class: "stroke dash" }, Plot.el("g", { class: "c-label-2" }, g));
    const gb = Plot.el("g", { class: "c-tint" }, g), gd = Plot.el("g", { class: "c-ok" }, g);
    pts.forEach((q, j) => {
      Plot.el("circle", { cx: x(q.a), cy: y(q.b), r: j === i ? 7 : 4, class: "fill" }, gb);
      Plot.el("rect", { x: x(q.a) - (j === i ? 6 : 3.5), y: y(q.d) - (j === i ? 6 : 3.5), width: j === i ? 12 : 7, height: j === i ? 12 : 7, class: "fill" }, gd);
    });
    const lab = Plot.el("text", { x: x(s.a) + 10, y: y(s.b) - 10 }, Plot.el("g", { class: "c-label" }, g));
    const paire = t("ry.v.paire", { bas: nom(m.bas), haut: nom(m.haut) });
    lab.textContent = paire;
    $("pread").textContent = paire;
    $("vmasse").textContent = F.qty(F.num((m.exces[1] - m.exces[0]) / 1000, 4), "MeV");
    $("vcoul").textContent = mev(ES.ecartCoulomb(m), 4);
    $("vloi").textContent = fm(R0 * s.a);
    $("vboule").textContent = F.qty(F.num(s.b, 3), "fm");
    $("fboule").textContent = t("ry.f.r0", { r0: F.qty(F.num(s.b / s.a, 3), "fm") });
    $("vdernier").textContent = F.qty(F.num(s.d, 3), "fm");
    $("fdernier").textContent = t("ry.f.r0", { r0: F.qty(F.num(s.d / s.a, 3), "fm") });
  }
  psl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["heisenberg", 1932, "idea"], ["tuve", 1936, "experiment"], ["wilson", 1952, "experiment"], ["nolen", 1969, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tep"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["symetrie", "b"], ["paires", "d"], ["neutron", "a"], ["double", "c"], ["dernier", "b"], ["fluor", "a"], ["coulomb", "d"], ["part", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 84 });
})();
</script>
