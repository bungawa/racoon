<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["circuit", "source", "mesure", "arqs"]; keyed($("systeme"), t("systeme.tag"), IDS, textOf("systeme.items", IDS)); })();
(() => { const IDS = ["moyenneur", "integrateur", "derivateur", "selectif"]; keyed($("roles"), t("roles.tag"), IDS, textOf("roles.items", IDS)); })();

/* ---------- un signal périodique filtré harmonique par harmonique, (2.3) ---------- */
(() => {
  const O = self.Ondes, F0 = 500, N = 300;
  const FORMES = ["creneau", "triangle", "scie"], TYPES = ["passeBas1", "passeHaut1", "passeBande2"];
  const nf = textOf("fi.formes", FORMES), nt = textOf("fi.types", TYPES), st = { forme: 0, type: 0 };
  const seg = (id, ids, noms, key) => { $(id).innerHTML = ids.map((x, i) => `<button type="button" data-i="${i}" aria-pressed="${i === 0}">${noms[x]}</button>`).join("");
    $(id).onclick = e => { const b = e.target.closest("button"); if (b) { st[key] = +b.dataset.i; upd(); } }; };
  seg("forme", FORMES, nf, "forme"); seg("type", TYPES, nt, "type");
  function upd() {
    ["forme", "type"].forEach(k => [...$(k).children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === st[k]))));
    const type = TYPES[st.type], bande = type === "passeBande2", fc = F0 * Math.pow(10, +$("cx").value), Q = +$("cq").value;
    $("cq").disabled = !bande; $("cxv").textContent = F.si(fc, "Hz"); $("cqv").textContent = bande ? F.num(Q, 3) : "–";
    const S = O.filtrerPeriodique(O.signal(FORMES[st.forme]), F0, type, fc, Q, N);
    /* Bode : gain en dB de 50 Hz à 50 kHz, et les harmoniques du signal (hauteur : amplitude d'entrée, en dB) */
    let svg = $("bode"); svg.innerHTML = "";
    let P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 44 }, x: { scale: "log", domain: [50, 5e4], label: t("fi.xaxis") }, y: { domain: [-60, 10], label: t("fi.yaxis.g") } });
    const g = []; for (let j = 0; j <= 300; j++) { const f = 50 * Math.pow(1000, j / 300); g.push([P.x(f), P.y(Math.max(-60, O.bode(type, f / fc, Q).gainDb))]); }
    Plot.el("path", { d: Plot.path(g), class: "curve" }, P.g);
    S.raies.forEach(r => { if (!r.A || r.f > 5e4) return; const yi = Math.max(-60, 20 * Math.log10(r.A)), yo = Math.max(-60, 20 * Math.log10(r.Asortie));
      Plot.el("line", { x1: P.x(r.f), x2: P.x(r.f), y1: P.y(-60), y2: P.y(yi), class: "stroke c-label-2" }, P.g);
      Plot.el("circle", { cx: P.x(r.f), cy: P.y(yo), r: 3, class: "fill c-warn" }, P.g); });
    /* deux périodes d'entrée et de sortie */
    svg = $("temps"); svg.innerHTML = "";
    const ts = Array.from({ length: 401 }, (_, j) => 2 * j / (400 * F0)), ue = ts.map(S.entree), us = ts.map(S.sortie);
    const m = Math.max(1.2, ...us.map(Math.abs)) * 1.05;
    P = Plot.axes(svg, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 44 }, x: { domain: [0, 4], label: t("fi.taxis") }, y: { domain: [-m, m], label: t("fi.yaxis.u") } });
    Plot.el("path", { d: Plot.path(ts.map((tt, j) => [P.x(tt * 1e3), P.y(ue[j])])), class: "stroke c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(ts.map((tt, j) => [P.x(tt * 1e3), P.y(us[j])])), class: "curve" }, P.g);
    /* le fondamental : gain, déphasage ; la pureté : part de la puissance de sortie (hors continu) dans le fondamental */
    const r1 = S.raies[0], p = S.raies.reduce((s, r) => s + r.Asortie ** 2, 0), pur = p ? r1.Asortie ** 2 / p : 0;
    $("vg").textContent = t("fi.v.db", { g: F.num(20 * Math.log10(r1.gain), 3) }); $("fg").textContent = t("fi.f.g1", { phi: F.num(r1.phase * 180 / Math.PI, 3) + "°" });
    $("vp").textContent = F.qty(F.num(100 * pur, 3), "%"); $("fp").textContent = t("fi.f.pur");
    const x = F0 / fc, role = type === "passeBas1" ? (x > 5 ? "integrateur" : x < 0.2 ? "transparent" : "intermediaire")
      : type === "passeHaut1" ? (x < 0.2 ? "derivateur" : x > 5 ? "transparent" : "intermediaire")
      : (Math.abs(Math.log(x)) < 0.05 && Q >= 5 ? "selectif" : "intermediaire");
    $("vr").textContent = t("fi.roles")[role]; $("fr").textContent = t("fi.f.x", { x: F.num(x, 3) });
  }
  ["cx", "cq"].forEach(id => $(id).oninput = upd);
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["campbell", 1915, "idea"], ["campbell22", 1922, "idea"], ["butterworth", 1930, "idea"], ["sallen", 1955, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["enceinte", "acquisition"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["iw", "c"], ["coupure", "a"], ["pente", "d"], ["harmonique", "b"], ["integrateur", "a"], ["selectif", "c"], ["continu", "b"], ["non", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1915 });
})();
</script>
