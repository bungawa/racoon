<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §48-1 : la somme, sa porteuse et son enveloppe ---------- */
(() => {
  const O = self.Ondes, TMAX = 2, N = 1600, TS = Array.from({ length: N + 1 }, (_, i) => TMAX * i / N);
  function upd() {
    const f1 = +$("f1").value, f2 = +$("f2").value, a2 = +$("a2").value, D = O.deuxSinus(1, 2 * Math.PI * f1, a2, 2 * Math.PI * f2);
    const svg = $("som"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 52, b: 44 }, x: { domain: [0, TMAX], label: t("so.xaxis") }, y: { domain: [-2.2, 2.2], label: t("so.yaxis") } });
    Plot.el("path", { d: Plot.path(TS.map(x => [P.x(x), P.y(D.enveloppe(x))])), class: "stroke dash c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(TS.map(x => [P.x(x), P.y(-D.enveloppe(x))])), class: "stroke dash c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(TS.map(x => [P.x(x), P.y(D.s(x))])), class: "curve" }, P.g);
    const R = O.periodeSomme(f1, f2), e = Math.abs(f1 - f2);
    $("f1v").textContent = F.si(f1, "Hz"); $("f2v").textContent = F.si(f2, "Hz"); $("a2v").textContent = F.num(a2, 2);
    $("vbat").textContent = e ? F.si(e, "Hz") : t("so.aucun");
    $("fbat").textContent = e ? t("so.f.bat", { T: F.si(1 / e, "s") }) : t("so.f.unisson");
    $("vper").textContent = F.si(R.periode, "s");
    $("fper").textContent = e ? t(R.battementsParPeriode === 1 ? "so.f.per1" : "so.f.per", { n: F.num(R.battementsParPeriode, 3) }) : t("so.f.per0");
    $("vmin").textContent = F.num(Math.sqrt(D.Imin), 3); $("fmin").textContent = t("so.f.min", { max: F.num(Math.sqrt(D.Imax), 3) });
  }
  ["f1", "f2", "a2"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["sauveur", 1701, "idea"], ["helmholtz", 1863, "idea"], ["forrester", 1955, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["accordage", "peigne"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["frequence", "b"], ["battement", "c"], ["periode", "a"], ["inegales", "d"], ["energie", "b"], ["rapport", "c"], ["diapason", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 481 });
})();
</script>
