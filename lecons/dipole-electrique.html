<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;

/* ---------- le système décrit : la molécule d'eau vue comme un dipôle ---------- */
(() => {
  const p = ES.MOLECULES.eau.p, d = p / ES.E, r = 1e-9;
  $("sys1").innerHTML = t("sys1.body", { p: F.si(p, "C·m"), d: F.si(d, "m", { prefix: "p" }), r: F.si(r, "m", { prefix: "n" }),
    taille: F.sci((d / r) ** 2, 1), champ: F.si(2 * ES.K * p / r ** 3, "V·m⁻¹") });
})();

/* ---------- potentiel exact et potentiel du dipôle le long d'une demi-droite ---------- */
(() => {
  const svg = $("courbe"), th = $("th"), rr = $("rr"), q = 1e-9, d = 1e-3, pair = ES.paireDipole(q, d), p = [0, 0, q * d], U = ES.K * q / d;
  const at = (u, a) => [u * d * Math.sin(a), 0, u * d * Math.cos(a)];
  function draw() {
    const a = +th.value * Math.PI / 180, u0 = Math.pow(10, +rr.value), us = Array.from({ length: 161 }, (_, i) => Math.pow(10, -0.3 + 2.6 * i / 160));
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, x: { scale: "log", domain: [0.5, 200], label: t("fig.x") }, y: { scale: "log", domain: [1e-5, 10], label: t("fig.y") } });
    const clip = v => Math.min(10, Math.max(1e-5, v));
    const curve = (f, cls) => Plot.el("path", { d: Plot.path(us.map(u => [x(u), y(clip(f(u)))])), class: cls }, g);
    curve(u => 1 / u, "stroke thin dash c-label-2");
    curve(u => Math.abs(ES.potentiel(pair, at(u, a))) / U, "stroke c-tint");
    curve(u => Math.abs(ES.potentielDipole(p, at(u, a))) / U, "stroke dash c-warn");
    const ex = ES.potentiel(pair, at(u0, a)), ap = ES.potentielDipole(p, at(u0, a));
    Plot.el("line", { x1: x(u0), x2: x(u0), y1: y(1e-5), y2: y(10), class: "stroke thin c-label" }, g);
    $("thr").textContent = t("fig.deg", { a: F.num(+th.value, 3) });
    $("rrr").textContent = t("fig.rd", { u: F.num(u0, 3) });
    $("ve").textContent = F.si(ex, "V");
    $("fe").textContent = t("fig.f.exact", { v: F.si(ap, "V") });
    $("vx").textContent = t("fig.v.err", { e: F.num(100 * Math.abs(ap / ex - 1), 2) });
    $("fx").textContent = t("fig.f.err", { e: F.num(100 * (1 / (2 * u0)) ** 2, 2) });
  }
  th.oninput = rr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["debye", 1912, "idea"], ["nobel", 1936, "experiment"], ["mesure", 1973, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["four", "solvant"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["decroissance", "c"], ["produit", "a"], ["equateur", "d"], ["erreur", "b"], ["eau", "c"], ["sens", "a"], ["vecteur", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 62 });
})();
</script>
