<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, P = Plot.el, DEG = Math.PI / 180;

/* ---------- l'œil sous l'eau : (27.7a), puis le flou D ΔV ---------- */
(() => {
  const svg = $("eau"), W = 640, H = 300, sn = $("nx"), sa = $("acc"), sd = $("pup"), cm = $("masque");
  const ns = Array.from({ length: 377 }, (_, i) => 1 + i * 0.001);
  function draw() {
    const nExt = +sn.value, A = +sa.value, D = +sd.value * 1e-3, lunettes = cm.checked;
    const e = O.sousLEau({ nExt, A, D, lunettes });
    svg.innerHTML = "";
    const ym = Math.max(2, 5 * Math.ceil(O.sousLEau({ nExt: O.CORNEE.n, D }).flou / DEG * 1.1 / 5));
    const ax = Plot.axes(svg, { fmt: F, w: W, h: H, x: { domain: [1, 1.376], label: t("eau.ax.x") }, y: { domain: [0, ym], label: t("eau.ax.y") } });
    const courbe = m => ns.map(n => [ax.x(n), ax.y(Math.min(ym, O.sousLEau({ nExt: n, A, D, lunettes: m }).flou / DEG))]);
    P("path", { d: Plot.path(courbe(false)), class: "stroke bold c-tint" }, svg);
    P("path", { d: Plot.path(courbe(true)), class: "stroke dash c-ok" }, svg);
    [[1, "eau.m.air"], [O.INDICE.eau, "eau.m.eau"], [O.CORNEE.n, "eau.m.cornee"]].forEach(([n, key]) => {
      P("line", { x1: ax.x(n), x2: ax.x(n), y1: ax.y(0), y2: ax.y(ym), class: "stroke thin c-label-2" }, svg);
      P("text", { x: ax.x(n) + (n === 1 ? 4 : -4), y: ax.y(ym) + 14, "text-anchor": n === 1 ? "start" : "end", class: "tick" }, svg).textContent = t(key);
    });
    P("circle", { cx: ax.x(nExt), cy: ax.y(Math.min(ym, e.flou / DEG)), r: 6, class: "fill " + (lunettes ? "c-ok" : "c-tint") }, svg);
    $("nxr").textContent = F.fix(nExt, 3); $("accr").textContent = F.qty(F.num(A, 3), "m⁻¹"); $("pupr").textContent = F.qty(F.num(+sd.value, 2), "mm");
    $("vface").textContent = F.qty(F.num(e.face, 3), "m⁻¹");
    $("fface").textContent = t("eau.f.face").replace("{air}", F.qty(F.num(e.faceAir, 3), "m⁻¹"));
    $("vdv").textContent = F.qty(F.num(e.dV, 3), "m⁻¹");
    $("fdv").textContent = t(e.dV > 0 ? "eau.f.reste" : "eau.f.net").replace("{a}", F.qty(F.num(e.utilisee, 3), "m⁻¹"));
    $("vflou").textContent = e.flou / DEG >= 0.1 ? F.num(e.flou / DEG, 2) + "°" : F.num(e.flou / DEG * 60, 2) + "′";
    $("fflou").textContent = t("eau.f.flou").replace("{x}", F.num(e.flou / (1 / 60 * DEG), 2));
  }
  sn.oninput = sa.oninput = sd.oninput = cm.onchange = draw;
  draw();
})();

/* ---------- le grandissement cortical de Horton et Hoyt ---------- */
(() => {
  const svg = $("cortex"), W = 640, H = 300, E = Array.from({ length: 401 }, (_, i) => i * 0.2);
  const ax = Plot.axes(svg, { fmt: F, w: W, h: H, pad: { r: 56 }, x: { domain: [0, 80], label: t("cx.ax.x") }, y: { domain: [0, 90], label: t("cx.ax.y") } });
  P("path", { d: Plot.path(E.map(e => [ax.x(e), ax.y(O.distanceCorticale(e))])), class: "stroke bold c-tint" }, svg);
  /* M sur une échelle à droite : 0 à 24 mm/° ramené à 0 à 90 */
  const k = 90 / 24;
  P("path", { d: Plot.path(E.map(e => [ax.x(e), ax.y(k * O.grandissementCortical(e))])), class: "stroke dash c-warn" }, svg);
  [0, 6, 12, 18].forEach(m => { P("text", { x: W - 50, y: ax.y(k * m) + 4, class: "tick" }, svg).textContent = F.num(m, 2); });
  P("text", { x: W - 50, y: ax.y(k * 24) + 4, class: "tick" }, svg).textContent = t("cx.ax.m");
  [[10, "cx.p.dix"]].forEach(([e, key]) => {
    P("circle", { cx: ax.x(e), cy: ax.y(O.distanceCorticale(e)), r: 5, class: "fill c-tint" }, svg);
    P("text", { x: ax.x(e) + 8, y: ax.y(O.distanceCorticale(e)) + 16, class: "tick" }, svg).textContent =
      t(key).replace("{d}", F.qty(F.num(O.distanceCorticale(e), 2), "mm")).replace("{p}", F.qty(F.num(100 * O.distanceCorticale(e) / O.distanceCorticale(80), 2), "%"));
  });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["inouye", 1909, "experiment"], ["sperry", 1943, "experiment"], ["nobel", 1981, "idea"], ["horton", 1991, "experiment"], ["moken", 2003, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["masque", "champ"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["eau", "c"], ["perte", "a"], ["masque", "d"], ["gradient", "b"], ["envers", "c"], ["chiasma", "a"], ["centre", "b"], ["salamandre", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 362 });
})();
</script>
