<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, MU0 = Constantes.mu0;

/* ---------- un cadre près d'un fil, vu le long du fil : forces sur les côtés, force totale, couple, énergie ---------- */
(() => {
  const svg = $("cadre"), sx = $("sx"), sa = $("sa"), st = $("st"), Iw = 20, Ic = 1, b = 0.03;  // A, A, m
  const O = [70, 160], S = 3200, px = v => [O[0] + S * v[0], O[1] - S * v[1]];                 // px per m: 18 cm × 10 cm
  const fond = Plot.el("g", {}, svg), dyn = Plot.el("g", {}, svg);
  [0.02, 0.05, 0.1, 0.15].forEach(r => Plot.el("circle", { cx: O[0], cy: O[1], r: S * r, class: "stroke thin dash" }, fond));
  Plot.el("circle", { cx: O[0], cy: O[1], r: 7, class: "stroke c-label-2" }, fond);
  Plot.el("circle", { cx: O[0], cy: O[1], r: 2.5, class: "fill c-label-2" }, fond);
  const marque = (p, sortant) => {                                                          // ⊙ out of the page, ⊗ into it
    const [cx, cy] = px(p); Plot.el("circle", { cx, cy, r: 6, class: "stroke c-tint" }, dyn);
    if (sortant) Plot.el("circle", { cx, cy, r: 2, class: "fill c-tint" }, dyn);
    else [[-4, -4, 4, 4], [-4, 4, 4, -4]].forEach(([a1, b1, a2, b2]) => Plot.el("line", { x1: cx + a1, y1: cy + b1, x2: cx + a2, y2: cy + b2, class: "stroke c-tint" }, dyn));
  };
  function draw() {
    const x0 = +sx.value / 1000, a = Math.min(+sa.value / 1000, 2 * (x0 - 0.005)), th = +st.value * Math.PI / 180;
    const c = M.cadreFil({ Iw, I: Ic, x0, a, b, theta: th }), u = [Math.cos(th), Math.sin(th)];
    const pp = [x0 + a / 2 * u[0], a / 2 * u[1]], pm = [x0 - a / 2 * u[0], -a / 2 * u[1]];
    /* forces on the two vertical sides (the horizontal ones cancel): I b ẑ ∧ B, current down at p+, up at p− */
    const side = (p, s) => { const B = c.champ([p[0], p[1], 0]); return [-s * Ic * b * B[1], s * Ic * b * B[0]]; };
    const fp = side(pp, -1), fm = side(pm, 1), k = 70 / Math.max(Math.hypot(...fp), Math.hypot(...fm));
    dyn.innerHTML = "";
    const A = px(pm), Bq = px(pp), C = px([x0, 0]);
    Plot.el("line", { x1: A[0], y1: A[1], x2: Bq[0], y2: Bq[1], class: "stroke bold c-tint" }, dyn);
    marque(pp, false); marque(pm, true);
    [[pp, fp], [pm, fm]].forEach(([p, f]) => { const q = px(p); Plot.fleche(dyn, q, [q[0] + k * f[0], q[1] - k * f[1]], { cls: "c-tint" }); });
    Plot.fleche(dyn, C, [C[0] + k * c.F[0], C[1] - k * c.F[1]], { cls: "c-warn", trait: "stroke bold" });
    const mu = c.mu.map(v => v / Math.hypot(...c.mu));
    Plot.fleche(dyn, C, [C[0] + 40 * mu[0], C[1] - 40 * mu[1]], { cls: "c-label-2", ouverte: true });
    $("sxr").textContent = F.si(x0, "m", { prefix: "m" });
    $("sar").textContent = F.si(a, "m", { prefix: "m" });
    $("str").textContent = t("fig.deg", { a: F.num(+st.value, 3) });
    $("vf").textContent = F.si(Math.hypot(...c.F), "N");
    $("ff").textContent = t("fig.f.f", { v: F.si(Math.hypot(...c.Fdip), "N"), e: F.sci(Math.hypot(c.F[0] - c.Fdip[0], c.F[1] - c.Fdip[1]) / Math.hypot(...c.F), 2), x: F.num(a / x0, 2) });
    $("vc").textContent = F.si(c.C, "N·m");
    $("fc").textContent = t("fig.f.c", { v: F.si(c.Cdip, "N·m") });
    $("vu").textContent = F.si(c.U, "J");
    $("fu").textContent = t("fig.f.u", { v: F.si(c.Udip, "J") });
  }
  sx.oninput = sa.oninput = st.oninput = draw; draw();
})();

/* ---------- le système décrit : une bobine de nanosatellite dans le champ terrestre ---------- */
(() => {
  const mT = 8.22e22, r = Constantes.R_E_mean + 500e3, N = 200, Ib = 0.05, s = 0.08, L = 0.1;
  const B = Math.abs(M.composantesDipoleB(mT, r, Math.PI / 2).Bz), mu = N * Ib * s * s;
  const C = mu * B, Fz = 3 * mu * B / r;                                                    // ∂B/∂r = −3B/r for a dipole field
  $("sys1").innerHTML = t("sys1.body", { N: F.num(N, 3), I: F.si(Ib, "A", { prefix: "m" }), s: F.si(s, "m", { prefix: "m" }), mu: F.si(mu, "A·m²", { sig: 2 }),
    h: F.si(500e3, "m", { prefix: "k" }), B: F.si(B, "T"), C: F.si(C, "N·m"), F: F.si(Fz, "N"), rap: F.sci(Fz * L / C, 1), L: F.si(L, "m", { prefix: "m" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["darsonval", 1882, "experiment"], ["weston", 1888, "use"], ["stern", 1922, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["magnetocoupleur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["uniforme", "b"], ["couple", "a"], ["equilibre", "d"], ["gradient", "c"], ["signe", "a"], ["total", "c"], ["ordre", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 151 });
})();
