<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const El = Elasticite;
const MPa = x => F.qty(F.num(x / 1e6, 3), "MPa");

/* ---------- une barre d'acier S235 cyclée en traction-compression ---------- */
(() => {
  const svg = $("cycle"), A = El.MATERIAUX.acier, E = A.E, fy = A.lim, FU = 360e6, PAS = 120;   // fu of S235, EN 1993-1-1 Table 3.1
  function upd() {
    const ea = +$("ea").value / 1000, H = +$("h").value / 100 * E, n = +$("n").value, mode = $("mode").value;
    $("eav").textContent = F.qty(F.fix(ea * 1000, 1), "‰"); $("hv").textContent = F.qty(F.fix(+$("h").value, 1), "%"); $("nv").textContent = n;
    const chemin = []; for (let k = 0; k <= n * PAS; k++) chemin.push(ea * Math.sin(2 * Math.PI * k / PAS));
    const p = El.elastoplastique({ E, fy, H, ecrouissage: mode }, chemin), last = p.slice((n - 1) * PAS, n * PAS + 1);
    const smax = Math.max(...p.map(q => Math.abs(q.sigma))), ymax = Math.max(1.15 * smax, 1.1 * fy) / 1e6, xmax = ea * 1100;
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 340, x: { domain: [-xmax, xmax], label: t("cy.xlabel") }, y: { domain: [-ymax, ymax], label: t("cy.ylabel") } });
    for (const s of [fy, -fy]) P("line", { x1: ax.x(-xmax), x2: ax.x(xmax), y1: ax.y(s / 1e6), y2: ax.y(s / 1e6), class: "stroke thin dash c-label-2" }, svg);
    P("path", { d: Plot.path(p.map(q => [ax.x(q.eps * 1000), ax.y(q.sigma / 1e6)])), class: "stroke thin c-tint" }, svg);
    P("path", { d: Plot.path(last.map(q => [ax.x(q.eps * 1000), ax.y(q.sigma / 1e6)])), class: "stroke c-warn" }, svg);
    const W = El.aire(last), end = p[p.length - 1];
    $("vsmax").textContent = MPa(smax);
    $("fsmax").textContent = t(smax > FU ? "cy.f.rupture" : "cy.f.smax", { r: F.fix(smax / fy, 2), fu: MPa(FU) });
    $("vw").textContent = F.qty(F.num(W / 1e3, 3), "kJ·m⁻³");
    $("fw").textContent = t(W < 1 ? "cy.f.w0" : "cy.f.w");
    $("vep").textContent = F.qty(F.fix(end.epsP * 1000, 3), "‰");
    $("fep").textContent = t("cy.f.ep");
    const Wlin = fy * fy / (2 * E);
    $("vratio").textContent = F.fix(W / Wlin, 1);
    $("fratio").textContent = t("cy.f.ratio", { w: F.qty(F.num(Wlin / 1e3, 3), "kJ·m⁻³") });
  }
  ["ea", "h", "n"].forEach(id => $(id).oninput = upd); $("mode").onchange = upd;
  upd();
})();

const EVENTS = [["hooke", 1678, "idea"], ["tresca", 1864, "experiment"], ["dislocation", 1934, "idea"], ["hirsch", 1956, "experiment"]];
const USES = ["plastique", "seisme", "emboutissage"];
const QS = [["lin", "a"], ["craie", "b"], ["decharge", "c"], ["cisaille", "d"], ["aire", "a"], ["bauschinger", "b"], ["film", "c"]];

/* ---------- histoire ---------- */
(() => {
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
