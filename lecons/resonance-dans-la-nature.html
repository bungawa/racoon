<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/lecons/forces.js"></script>

<script src="/racoon/lecons/complexes.js"></script>

<script src="/racoon/lecons/amortissement.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

(() => { const IDS = ["lineaire", "isole", "largeur"]; keyed($("conditions"), t("conditions.tag"), IDS, textOf("conditions.items", IDS)); })();
(() => { const IDS = ["maree", "sel", "aimants", "noyau", "mossbauer", "particules"]; keyed($("exemples"), t("exemples.tag"), IDS, textOf("exemples.items", IDS)); })();

/* ---------- §23-4 : la même raie à toutes les échelles ---------- */
(() => {
  const eV = Constantes.e, FE = Amort.raie(14413 * eV, 141e-9);
  /* [id, f₀ (Hz), Q]: sphere and brake (« L'oscillateur forcé amorti »), circuit (« Résonance électrique »), Shortt's pendulum in its
     tank (Q = 1,1 × 10⁵, period 2 s), the 14,4 keV level of iron 57 (τ = 141 ns) */
  const SYS = [["frein", 10 / (2 * Math.PI), 1], ["circuit", 1e4 / (2 * Math.PI), Resonance.rlc(75, 0.1, 1e-7).Q], ["pendule", 0.5, 1.1e5], ["fer", FE.f0, FE.Q]];
  const names = textOf("rn.systemes", SYS.map(s => s[0]));
  $("systemes").innerHTML = SYS.map(([id], i) => `<button type="button" data-i="${i}" aria-pressed="${i === 1}">${names[id]}</button>`).join("");
  const X = Array.from({ length: 401 }, (_, i) => -5 + 10 * i / 400);
  function upd(k) {
    [...$("systemes").children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === k)));
    const [id, f0, Q] = SYS[k], w0 = 2 * Math.PI * f0, O = Amort.oscillateur(f0, Q);
    /* abscissa u = (f − f₀)/Δf, Δf = f₀/Q; ω = ω₀(1 + u/Q) must stay ≥ 0 */
    const pts = X.filter(u => 1 + u / Q >= 0).map(u => [u, Amort.raieReduite(Q, u)]);
    const svg = $("raie"); svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 52 }, x: { domain: [-5, 5], label: t("rn.xaxis") }, y: { domain: [0, 1.05], label: t("rn.yaxis") } });
    [-0.5, 0.5].forEach(u => Plot.el("line", { x1: o.x(u), x2: o.x(u), y1: o.y(0), y2: o.y(1.05), class: "stroke thin dash c-label-2" }, o.g));
    Plot.el("line", { x1: o.x(-5), x2: o.x(5), y1: o.y(0.5), y2: o.y(0.5), class: "stroke thin dash c-label-2" }, o.g);
    Plot.el("path", { d: path(X.map(u => [o.x(u), o.y(0.25 / (u * u + 0.25))])), class: "stroke dash c-warn" }, o.g);
    Plot.el("path", { d: path(pts.map(([u, r]) => [o.x(u), o.y(r.exacte)])), class: "curve" }, o.g);
    const r = Amort.raieReduite(Q, 2);
    $("vf0").textContent = F.si(f0, "Hz"); $("ff0").textContent = t("rn.f." + id);
    $("vq").textContent = Q >= 1e4 ? F.sci(Q, 2) : F.num(Q, 3); $("fq").textContent = t("rn.f.q", { r: F.sci(1 / Q, 1) });
    $("vl").textContent = F.si(O.largeur, "Hz"); $("fl").textContent = t("rn.f.largeur");
    $("vt").textContent = F.si(O.tau, "s"); $("ft").textContent = t("rn.f.tau", { n: O.periodes >= 1e4 ? F.sci(O.periodes, 2) : F.num(O.periodes, 2) });
    const e = 100 * Math.abs(r.lorentz / r.exacte - 1); $("ve").textContent = F.qty(e >= 0.01 ? F.num(e, 2) : F.sci(e, 1), "%");
  }
  $("systemes").onclick = e => { const b = e.target.closest("button"); if (b) upd(+b.dataset.i); };
  upd(1);
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kelvin", 1882, "idea"], ["krakatoa", 1883, "experiment"], ["barnes", 1931, "experiment"], ["zavoisky", 1944, "experiment"], ["mossbauer", 1958, "experiment"], ["chapman", 1970, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm", "seconde"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["forme", "c"], ["largeur", "a"], ["fer", "d"], ["deux", "b"], ["sel", "c"], ["particule", "a"], ["aimants", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 234 });
})();
</script>
