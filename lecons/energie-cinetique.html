  <section class="card">

      <svg id="echart" role="img" data-i18n-attr="aria-label:fall.aria"></svg>
      <div class="legend"><span class="c-warn" data-i18n="fall.legend.ep"></span><span class="c-tint" data-i18n="fall.legend.ec"></span><span class="c-label-2" data-i18n="fall.legend.tot"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="hsl" data-i18n="fall.h0"></label><output id="hread" for="hsl"></output></div>
            <input id="hsl" type="range" min="1" max="100" step="1" value="20"></div>
          <div class="ctl"><div class="row"><label for="msl" data-i18n="fall.m"></label><output id="mread" for="msl"></output></div>
            <input id="msl" type="range" min="0.1" max="10" step="0.1" value="1"></div>
          <div class="ctl"><div class="row"><label for="tsl" data-i18n="fall.t"></label><output id="tread" for="tsl"></output></div>
            <input id="tsl" type="range" min="0" max="1000" step="1" value="500"></div>

        <div class="stats">

          <div class="stat"><span class="k" data-i18n-html="fall.k.v"></span><span class="v" id="vv"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fall.k.ep"></span><span class="v" id="vep"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/energie-cinetique.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/energie.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹";

/* ---------- chute libre : Ep se change en Ec, le total ne bouge pas ---------- */
(() => {
  const svg = $("echart"), hsl = $("hsl"), msl = $("msl"), tsl = $("tsl");
  let anim = 0;
  function draw() {
    svg.innerHTML = "";
    const h0 = +hsl.value, m = +msl.value, s0 = Energie.fall(m, h0, 0), tf = s0.tf, E0 = s0.total;
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { domain: [0, tf], label: t("fall.x") },
      y: { domain: [0, E0 * 1.08], label: t("fall.y") } });
    const path = k => { let d = ""; for (let i = 0; i <= 120; i++) { const s = Energie.fall(m, h0, tf * i / 120); d += (i ? "L" : "M") + x(s.t).toFixed(1) + " " + y(s[k]).toFixed(1); } return d; };
    Plot.el("line", { x1: x(0), x2: x(tf), y1: y(E0), y2: y(E0), class: "zero" }, g);
    Plot.el("path", { d: path("ep"), class: "ref" }, g);
    Plot.el("path", { d: path("ec"), class: "curve" }, g);
    const s = Energie.fall(m, h0, tf * tsl.value / 1000);
    Plot.el("line", { x1: x(s.t), x2: x(s.t), y1: y(0), y2: y(E0), class: "zero" }, g);
    Plot.el("circle", { cx: x(s.t), cy: y(s.ep), r: 5, class: "dot" }, g);
    Plot.el("circle", { cx: x(s.t), cy: y(s.ec), r: 6, class: "dot" }, g);
    $("hread").textContent = F.si(h0, "m", { prefix: "" });
    $("mread").textContent = F.qty(F.num(m, 2), "kg");
    $("tread").textContent = F.si(s.t, "s", { prefix: "" });
    $("vh").textContent = F.si(s.h, "m", { prefix: "" });
    $("vv").textContent = F.qty(F.num(s.v, 3), MS);
    $("vep").textContent = F.si(s.ep, "J");
    $("vec").textContent = F.si(s.ec, "J");
    $("fsum").textContent = t("fall.f.sum", { e: F.si(s.ep + s.ec, "J") });
  }
  $("drop").onclick = () => { cancelAnimationFrame(anim); const t0 = performance.now(), dur = 1500;
    const step = now => { const u = Math.min(1, (now - t0) / dur); tsl.value = Math.round(1000 * u); draw(); if (u < 1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step); };
  hsl.oninput = msl.oninput = tsl.oninput = () => { cancelAnimationFrame(anim); draw(); };
  draw();
})();

/* ---------- vitesse d'une voiture : énergie, hauteur de chute équivalente, freinage ---------- */
(() => {
  const M = 1200, A = 7, vsl = $("vsl");
  function upd() {
    const v = Energie.ms(+vsl.value), h = Energie.heightFromSpeed(v);
    $("vread").textContent = t("car.vread", { ms: F.qty(F.num(v, 3), MS), kmh: F.qty(vsl.value, "km·h⁻¹") });
    $("cec").textContent = F.si(Energie.kinetic(M, v), "J");
    $("ch").textContent = F.si(h, "m", { prefix: "" });
    $("cfl").textContent = t("car.f.etages", { n: F.num(Math.round(h / 3), 3) });
    $("cd").textContent = F.si(v * v / (2 * A), "m", { prefix: "" });
  }
  vsl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["leibniz", 1686, "idea"], ["gravesande", 1722, "experiment"], ["chatelet", 1740, "idea"], ["coriolis", 1829, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["crash", "freinage"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["double", "a"], ["chute", "a"], ["lancer", "a"], ["pendule", "a"], ["voiture", "a"], ["direction", "a"], ["falaise", "a"], ["train", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 43 });
})();
</script>
