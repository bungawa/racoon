<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, kB = Constantes.k_B, T0 = 373.15;
const mesure = id => ES.MOLECULES_MESURES.find(m => m.id === id), eau = mesure("H2O");
const N0 = Constantes.atm / (kB * T0);                       // m⁻³: vapour at 373,15 K and 101 325 Pa, kept fixed

/* ---------- des dipoles agités : la loi de Boltzmann tirée au sort ---------- */
(() => {
  const svg = $("orient"), xs = $("xs"), NB = 20, NT = 2000;
  let graine = 1;
  const alea = () => { let s = graine; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
  function draw() {
    const x = Math.pow(10, +xs.value), u = ES.tirageOrientation(x, NT, alea()), h = new Array(NB).fill(0);
    u.forEach(v => { h[Math.min(NB - 1, Math.floor((v + 1) / 2 * NB))]++; });
    const dens = h.map(c => c / NT / (2 / NB)), top = Math.max(1, ...dens, ES.densiteOrientation(x, 1)) * 1.1;
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 240, x: { domain: [-1, 1], label: t("fig.x") }, y: { domain: [0, top], ticks: 4, label: t("fig.y") } });
    const g = Plot.el("g", { class: "c-tint" }, A.g);
    dens.forEach((d, i) => Plot.el("rect", { x: A.x(-1 + i * 2 / NB) + 1, width: A.x(2 / NB) - A.x(0) - 2, y: A.y(d), height: A.y(0) - A.y(d), class: "fill", opacity: 0.55 }, g));
    const us = Array.from({ length: 201 }, (_, i) => -1 + i / 100);
    Plot.el("path", { d: Plot.path(us.map(v => [A.x(v), A.y(ES.densiteOrientation(x, v))])), class: "stroke c-warn" }, A.g);
    const moy = u.reduce((a, b) => a + b, 0) / NT, L = ES.langevin(x), E0 = x * kB * T0 / eau.pSI;
    $("xr").textContent = F.sci(x, 2);
    $("vm").textContent = F.num(L, 3);
    $("fm").textContent = t("f.moy", { m: F.num(moy, 3), s: F.num(Math.sqrt((1 / 3 + 0) / NT), 1) });
    $("vl").textContent = F.num(x / 3, 3);
    $("fl").textContent = t("f.lin", { e: F.num(100 * Math.abs(x / 3 - L) / L, 2) });
    $("ve").textContent = F.si(E0, "V·m⁻¹");
    $("fe").innerHTML = t(E0 > 3e6 ? "f.E.claque" : "f.E", { T: F.kelvin(T0) });
  }
  $("tirer").onclick = () => { graine = (graine * 48271) % 2147483647; draw(); };
  xs.oninput = draw; draw();
})();

/* ---------- le système décrit : vapeur d'eau à 373 K ---------- */
(() => {
  const o = ES.orientation(eau.pSI, 1e6, T0, N0), Ex = kB * T0 / eau.pSI, nl = 998.2 / 0.018015 * Constantes.N_A;
  const chiL = ES.orientation(eau.pSI, 1, 293.15, nl).chi;
  $("sys1").innerHTML = t("sys1.body", { T: F.kelvin(T0), x: F.sci(o.x, 2), err: F.sci(o.x * o.x / 15, 1), N: F.sci(N0, 3),
    chi: F.sci(o.chi, 2), Ex: F.sci(Ex, 1), cl: F.num(Ex / 3e6, 2), chiL: F.num(chiL, 2) });
})();

/* ---------- la droite de Debye ---------- */
(() => {
  const svg = $("debye");
  let mol = "H2O";
  function draw() {
    const m = mesure(mol), d = ES.debyeGaz({ N: N0, alpha: m.alphaF, p0: m.pSI }), ymax = 8;
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 260, x: { domain: [0, 3], label: t("fig2.x") }, y: { domain: [0, ymax], label: t("fig2.y") } });
    const y = u => d.kappa1(1 / (u * 1e-3)) * 1e3, g = Plot.el("g", { class: "c-tint" }, A.g);
    const umes = [1e3 / 700, 1e3 / T0];                          // gas at fixed N: from 700 K down to the boiling point
    Plot.el("path", { d: Plot.path([[A.x(0), A.y(d.ordonnee * 1e3)], [A.x(umes[0]), A.y(y(umes[0]))]]), class: "stroke dash" }, g);
    Plot.el("path", { d: Plot.path(umes.map(u => [A.x(u), A.y(Math.min(ymax, y(u)))])), class: "stroke bold" }, g);
    const ge = Plot.el("g", { class: "c-warn" }, A.g);
    Plot.el("circle", { cx: A.x(0), cy: A.y(d.ordonnee * 1e3), r: 5, class: "fill" }, ge);
    Plot.el("line", { x1: A.x(0), x2: A.x(3), y1: A.y(d.ordonnee * 1e3), y2: A.y(d.ordonnee * 1e3), class: "stroke thin dash" }, ge);
    $("vs").textContent = F.si(d.pente, "K");
    $("fs").textContent = t("f.pente", { p: F.num(ES.momentDePente(d.pente, N0) / 1e-30, 3) });
    $("vo").textContent = F.sci(d.ordonnee, 2);
    $("fo").textContent = t("f.ord", { a: F.num(d.ordonnee / N0 / (4 * Math.PI) * 1e30, 3) });
    $("vr").textContent = d.ordonnee > 0 ? F.num(d.pente / T0 / d.ordonnee, 3) : "−";
    $("fr").innerHTML = t("f.rap", { T: F.kelvin(T0) });
  }
  document.querySelectorAll("#mols button").forEach(bt => bt.onclick = () => {
    mol = bt.dataset.m; document.querySelectorAll("#mols button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["curie", 1895, "experiment"], ["langevin", 1905, "idea"], ["spencer", 1945, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["four"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["temperature", "a"], ["carre", "c"], ["lineaire", "b"], ["saturation", "d"], ["pression", "c"], ["methane", "b"], ["liquide", "d"], ["frequence", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1103 });
})();
</script>
