<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes;
/* Feynman's model atom: sodium, treated as a spin 1/2 of g = 2 (its nuclear moment is left out) */
const NA = { m: 22.98976928 * Cst.u, gamma: M.rapportGyromagnetique("electron") };
const vpDe = T => Math.sqrt(2 * Cst.k_B * T / NA.m);

/* ---------- le système décrit ---------- */
(() => {
  const T = 600, l = 0.05, B0 = 0.01, vp = vpDe(T), tt = l / vp, wp = Math.abs(NA.gamma) * B0, Bpi = M.champPi(NA.gamma, l, vp);
  const w1 = Math.abs(NA.gamma) * Bpi / 2;
  $("sys1").innerHTML = t("sys1.body", { T: F.kelvin(T), vp: F.si(vp, "m·s⁻¹", { sig: 2 }), t: F.si(tt, "s", { sig: 2 }), B0: F.si(B0, "T", { sig: 1 }),
    fp: F.si(wp / (2 * Math.PI), "Hz", { sig: 3 }), n: F.sci(wp * tt / (2 * Math.PI), 1), Bpi: F.si(Bpi, "T", { sig: 2 }), r: F.sci(w1 / wp, 1),
    bs: F.sci((w1 / wp) ** 2 / 4, 1) });
})();

/* ---------- le creux du courant au détecteur ---------- */
(() => {
  const svg = $("creux"), sb = $("sb"), sp = $("sp"), sl = $("sl"), st = $("st");
  function draw() {
    const B0 = Math.pow(10, +sb.value), l = +sl.value / 100, T = +st.value, vp = vpDe(T), B1 = +sp.value * M.champPi(NA.gamma, l, vp);
    const o = { gamma: NA.gamma, B0, B1, l, m: NA.m, T, nv: 200 }, L = M.largeurRabi(o), ref = M.largeurRabi(Object.assign({}, o, { B1: M.champPi(NA.gamma, l, vp) }));
    const X = 4 * ref.largeur, n = 241, f = [];
    for (let k = 0; k < n; k++) f.push(L.fp - X + 2 * X * k / (n - 1));
    const c = M.courantRabi(Object.assign({ f }, o));
    /* one atom at the most probable speed: the bare formula (35.7a), side lobes not yet washed out by the spread of speeds */
    const w1 = Math.abs(NA.gamma) * B1 / 2, un = f.map(x => 1 - M.rabi(2 * Math.PI * (x - L.fp), w1, l / vp));
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-X / 1e3, X / 1e3], label: t("fig.ax.x") }, y: { domain: [0, 1.05], label: t("fig.ax.y") } });
    const trace = (I, cls) => Plot.el("path", { d: Plot.path(f.map((x, k) => [P.x((x - L.fp) / 1e3), P.y(I[k])])), class: cls }, svg);
    trace(un, "stroke thin dash c-warn"); trace(c.I, "stroke bold c-tint");
    $("sbr").textContent = F.si(B0, "T", { sig: 2 });
    $("spr").textContent = F.num(+sp.value, 2);
    $("slr").textContent = F.qty(F.num(100 * l, 3), "cm");
    $("str").innerHTML = F.kelvin(T);
    $("vf").textContent = F.si(L.fp, "Hz", { sig: 4 });
    $("ff").innerHTML = t("fig.f.fp");
    $("vl").textContent = F.si(L.largeur, "Hz", { sig: 2 });
    $("fl").textContent = t("fig.f.largeur", { t: F.si(L.tMoy, "s", { sig: 2 }), p: F.num(L.largeur * L.tMoy, 2) });
    $("vr").textContent = F.sci(L.largeur / L.fp, 1);
    $("fr").textContent = t("fig.f.relatif");
    $("vd").textContent = F.qty(F.num(100 * L.profondeur, 2), "%");
    $("fd").textContent = t(sp.value > 1.6 ? "fig.f.trop" : sp.value < 0.6 ? "fig.f.peu" : "fig.f.bien");
  }
  sb.oninput = sp.oninput = sl.oninput = st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rabi", 1938, "experiment"], ["nobel", 1944, "idea"], ["essen", 1955, "use"], ["seconde", 1967, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cesium"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["creux", "a"], ["frequence", "d"], ["largeur", "b"], ["champ", "c"], ["precision", "a"], ["double", "d"], ["trop", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 353 });
})();
</script>
