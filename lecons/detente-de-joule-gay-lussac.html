<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, R = Constantes.R;
const pc = (x, n = 2) => F.num(100 * x, n) + F.NB + "%";

/* ---------- détente dans le vide sur une isotherme mesurée ---------- */
(() => {
  const svg = $("jg"), sg = $("gaz"), st = $("ti"), s1 = $("p1"), s2 = $("p2");
  const temps = g => Object.keys(S.ISO[g]).map(Number).sort((a, b) => a - b);
  function draw() {
    const g = sg.value, T = temps(g)[+st.value], D = S.detente(g, T), G = S.vdwCritique(g), cv = D.Cv[0], Tc = S.CRITIQUE[g].Tc;
    const i = +s1.value; let j = +s2.value; if (j >= i) { j = i - 1; s2.value = j; }
    const pts = [];
    for (let k = j + 1; k < D.P.length; k++) { const m = S.jouleMesure(g, T, k, j); pts.push({ k, x: 1 / m.V1, mes: m.dT, vdw: S.jouleVdw(G, cv, m.V1, m.V2), m }); }
    const lim = -0.3 * T, lo = Math.max(lim, 1.08 * Math.min(...pts.map(q => Math.min(q.mes, q.vdw)))), xmax = 1.05 * pts[pts.length - 1].x;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44, l: 56 },
      x: { domain: [0, xmax], label: t("jg.x") }, y: { domain: [lo, -0.08 * lo], label: t("jg.y") } });
    Plot.el("line", { x1: o.x(0), x2: o.x(xmax), y1: o.y(0), y2: o.y(0), class: "stroke dash c-warn" }, o.g);
    Plot.el("path", { d: Plot.path([[o.x(1 / D.Vm[j]), o.y(0)]].concat(pts.filter(q => q.vdw >= lo).map(q => [o.x(q.x), o.y(q.vdw)]))), class: "stroke c-tint" }, o.g);
    pts.filter(q => q.mes >= lo).forEach(q => Plot.el("circle", { cx: o.x(q.x), cy: o.y(q.mes), r: q.k === i ? 6 : 3.5, class: "fill c-ok" }, o.g));
    const q = pts.find(q => q.k === i), m = q.m, ds = S.entropieJouleVdw(G, cv, T, m.V1, m.V2), dsgp = R * Math.log(m.V2 / m.V1), e = Math.abs(q.mes) / T;
    Plot.el("line", { x1: o.x(q.x), x2: o.x(q.x), y1: o.y(lo), y2: o.y(-0.08 * lo), class: "stroke thin c-label" }, o.g);
    $("tiv").innerHTML = F.kelvin(T);
    $("p1v").textContent = F.si(D.P[i], "Pa", { sig: 3 }); $("p2v").textContent = F.si(D.P[j], "Pa", { sig: 3 });
    $("vratio").textContent = F.num(m.V2 / m.V1, 3);
    $("vmes").textContent = F.qty(F.num(q.mes, 3), "K");
    $("vvdw").textContent = F.qty(F.num(q.vdw, 3), "K"); $("fvdw").textContent = t("jg.f.vdw", { e: pc(q.vdw / q.mes - 1) });
    $("vds").textContent = F.qty(F.num(ds, 3), "J·K⁻¹·mol⁻¹"); $("vdsgp").textContent = F.qty(F.num(dsgp, 3), "J·K⁻¹·mol⁻¹");
    $("sys").innerHTML = t("sys.inner", { gaz: t("gaz." + g), T: F.kelvin(T), p1: F.si(D.P[i], "Pa", { sig: 3 }), p2: F.si(D.P[j], "Pa", { sig: 3 }),
      bv: F.fix(G.b / m.V1, 3), av: F.fix(G.a / (R * T * m.V1), 3), e: pc(e), cv: F.num(cv, 3),
      avis: t(e > 0.1 || T + q.mes < Tc ? "sys.ko" : e > 0.02 ? "sys.moyen" : "sys.ok") });
  }
  sg.onchange = st.oninput = s1.oninput = s2.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gaylussac", 1807, "experiment"], ["joule", 1845, "experiment"], ["poreux", 1852, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["reference", "melange"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["travail", "b"], ["parfait", "d"], ["signe", "a"], ["chiffre", "c"], ["joule", "b"], ["entropie", "c"], ["chemin", "a"], ["co2", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 9101 });
})();
</script>
