<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions;

/* ---------- le domaine de chaque formule : pH exact contre formule, en fonction de pC = −lg(c/c°) ---------- */
(() => {
  const acide = id => C.ACIDES.find(a => a.id === id);
  const MODES = {   // apports(c, pKa) for the exact pH, formule(c, pKa) for the usual formula
    fort: { apports: c => [{ id: "H3O+", c }], formule: c => C.pHFort(c), pka: false },
    faible: { apports: (c, k) => [{ pKa: [k], c }], formule: (c, k) => C.pHFaible(k, c), pka: true },
    base: { apports: (c, k) => [{ pKa: [k], j: 1, c }], formule: (c, k) => C.pHBaseFaible(k, c), pka: true },
    carb: { apports: c => [{ id: "carbonique", j: 1, c }], formule: () => C.pHAmpholyte(...acide("carbonique").pKa), pka: false },
    phos: { apports: c => [{ id: "phosphorique", j: 1, c }], formule: () => C.pHAmpholyte(...acide("phosphorique").pKa.slice(0, 2)), pka: false },
  };
  const TOL = 0.05, st = { m: "faible" }, spka = $("spka"), spc = $("spc"), seg = $("mode");
  function draw() {
    const M = MODES[st.m], k = +spka.value, pc = +spc.value;
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === st.m)));
    $("ctlpka").hidden = !M.pka;
    const svg = $("courbe"); svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 48 }, x: { domain: [0, 8], label: t("sim.x") }, y: { domain: [0, 14], label: t("sim.y"), ticks: 7 } });
    const ex = [], fo = [], ok = [];
    for (let i = 0; i <= 320; i++) { const x = i * 8 / 320, c = Math.pow(10, -x), pe = C.pH(M.apports(c, k)), pf = M.formule(c, k);
      ex.push([o.x(x), o.y(pe)]); if (pf >= 0 && pf <= 14) fo.push([o.x(x), o.y(pf)]); ok.push([x, Math.abs(pe - pf) < TOL]); }
    /* the domain: contiguous runs where the formula is within TOL */
    let dom = [];
    for (let i = 0; i < ok.length; i++) if (ok[i][1] && (i === 0 || !ok[i - 1][1])) { let j = i; while (j + 1 < ok.length && ok[j + 1][1]) j++; dom.push([ok[i][0], ok[j][0]]); }
    dom.forEach(([a, b]) => Plot.el("rect", { x: o.x(a), y: o.y(14), width: Math.max(o.x(b) - o.x(a), 1), height: o.y(0) - o.y(14), class: "fill c-ok", opacity: 0.12 }, o.g));
    Plot.el("path", { d: Plot.path(ex), class: "stroke bold c-tint" }, o.g);
    Plot.el("path", { d: Plot.path(fo), class: "stroke dash c-warn" }, o.g);
    Plot.el("line", { x1: o.x(0), x2: o.x(8), y1: o.y(7), y2: o.y(7), class: "stroke thin dash c-label-2" }, o.g);
    const c = Math.pow(10, -pc), pe = C.pH(M.apports(c, k)), pf = M.formule(c, k);
    Plot.el("circle", { cx: o.x(pc), cy: o.y(pe), r: 5, class: "fill c-tint" }, o.g);
    $("spkav").textContent = F.fix(k, 2);
    $("spcv").innerHTML = t("sim.pcv", { pc: F.fix(pc, 2), c: F.qty(F.sci(c, 2), "mol·L⁻¹") });
    $("vex").textContent = F.fix(pe, 2); $("vfo").textContent = F.fix(pf, 2); $("ffo").textContent = t("ffo." + st.m);
    $("vec").textContent = F.fix(Math.abs(pe - pf), 3);
    const d = dom.find(([a]) => a === 0) || dom[0];
    $("vdo").innerHTML = d ? t("sim.dom", { c: F.qty(F.sci(Math.pow(10, -d[1]), 2), "mol·L⁻¹") }) : t("sim.dom.vide");
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { st.m = b.dataset.m; draw(); });
  spka.oninput = spc.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["sorensen", 1909, "idea"], ["beckman", 1934, "experiment"], ["uicpa", 2002, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["phmetre"], uses = textOf("uses.items", USES);
  const pente = F.qty(F.num(1e3 * C.pente(298.15), 4), "mV");          // RT ln 10/F, the slope of a glass electrode
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace("{pente}", pente)}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dilue", "b"], ["faible", "c"], ["domaine", "a"], ["base", "d"], ["ampholyte", "c"], ["melange", "b"], ["bilan", "d"], ["activite", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2002 });
})();
</script>
