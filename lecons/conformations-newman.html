<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-organique" data-i18n="monde.chim-organique"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-stereochimie" data-i18n="etape.chim-stereochimie"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>

    <p data-i18n-html="s1.p1"></p>
    <div class="paire">
      <svg class="fig no-sigle" id="cram" role="img" data-i18n-attr="aria-label:s1.aria"></svg>
      <p data-i18n-html="s1.lecture"></p>

      <p data-i18n-html="s1.def.corps"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure>
      <div class="duo">
        <svg class="fig no-sigle proj" id="newman" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
        <div class="chart" id="graphe"><svg id="courbe" role="img" data-i18n-attr="aria-label:fig.courbe"></svg></div>
      </div>
      <div class="panel">
        <div class="seg" role="group" id="mol"><button type="button" data-m="ethane" aria-pressed="false" data-i18n="fig.ethane"></button><button type="button" data-m="butane" aria-pressed="true" data-i18n="fig.butane"></button></div>
        <div class="ctl"><div class="row"><label for="phi" data-i18n="fig.phi"></label><output id="phiread" for="phi"></output></div>
          <input id="phi" type="range" min="0" max="360" step="1" value="60"></div>
        <div class="ctl"><div class="row"><label for="temp" data-i18n="fig.temp"></label><output id="tread" for="temp"></output></div>
          <input id="temp" type="range" min="100" max="1000" step="5" value="300"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="fig.nom"></span><span class="v" id="nom"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.energie"></span><span class="v" id="energie"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.part"></span><span class="v" id="part"></span><span class="f" id="partf"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.vitesse"></span><span class="v" id="vitesse"></span><span class="f" id="vitf"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi>V</mi><mo stretchy="false">(</mo><mi>φ</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><msub><mi>V</mi><mn>0</mn></msub><mn>2</mn></mfrac><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi data-i18n="eq.cos"></mi><mo>⁡</mo><mn>3</mn><mi>φ</mi><mo stretchy="false">)</mo></math></div>
    <p class="validite" data-i18n-html="s3.validite1"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="eq"><math display="block"><mfrac><msub><mi>N</mi><mi mathvariant="normal">g</mi></msub><msub><mi>N</mi><mi mathvariant="normal">a</mi></msub></mfrac><mo>≈</mo><mn>2</mn><mspace width="0.1em"/><mi data-i18n="eq.exp"></mi><mo>⁡</mo><mo>(</mo><mo>−</mo><mfrac><mrow><mi mathvariant="normal">Δ</mi><mi>E</mi></mrow><mrow><mi>R</mi><mi>T</mi></mrow></mfrac><mo>)</mo></math></div>
    <p class="validite" data-i18n-html="s3.validite2"></p>
    <p data-i18n-html="s3.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="eq"><math display="block"><mi>k</mi><mo>=</mo><mfrac><mrow><msub><mi>k</mi><mi mathvariant="normal">B</mi></msub><mi>T</mi></mrow><mi>h</mi></mfrac><mspace width="0.1em"/><mi data-i18n="eq.exp"></mi><mo>⁡</mo><mo>(</mo><mo>−</mo><mfrac><mrow><mi mathvariant="normal">Δ</mi><msup><mi>G</mi><mo>‡</mo></msup></mrow><mrow><mi>R</mi><mi>T</mi></mrow></mfrac><mo>)</mo></math></div>
    <p class="validite" data-i18n-html="s4.validite"></p>
    <div class="list keyed" id="barrieres"></div>
    <p data-i18n-html="s4.p2"></p>

    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>

    <div class="list keyed" id="uses"></div>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/conformations-newman.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/chim-organique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, sym = s => t("chim.sym", { s });

/* ---------- l'éthane en coins de Cram ---------- */
(() => {
  const m = O.mol("C 0 0; C 1.4 0; H -0.6 0.85; H -0.95 -0.35; H -0.25 -0.95; H 2 -0.85; H 2.35 0.35; H 1.65 0.95 | 0-1 0-2 0w3 0h4 1-5 1w6 1h7");
  const d = O.dessin(m, { texte: sym, echelle: 46 }), svg = document.getElementById("cram");
  svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html;
})();

/* ---------- Newman, énergie, populations, vitesse ---------- */
(() => {
  const kJ = 1000;
  const MOL = {
    ethane: { c: [6 * kJ, 0, 0, 6 * kJ], avant: ["H", "H", "H"], arriere: ["H", "H", "H"], barriere: 12 * kJ, ymax: 22 },
    butane: { c: O.ajusterTorsion([[0, 19 * kJ], [60, 3.8 * kJ], [120, 16 * kJ], [180, 0]]), avant: ["CH₃", "H", "H"], arriere: ["CH₃", "H", "H"], barriere: 16 * kJ, ymax: 22 },
  };
  let cle = "butane";
  const svg = document.getElementById("courbe"), proj = document.getElementById("newman");
  const phi = document.getElementById("phi"), temp = document.getElementById("temp");
  const out = id => document.getElementById(id);
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 460, h: 260, pad: { b: 44 },
    x: { domain: [0, 360], label: t("fig.x") }, y: { domain: [0, 22], label: t("fig.y") } });
  [60, 120, 180, 240, 300].forEach(p => Plot.el("line", { x1: x(p), x2: x(p), y1: y(0), y2: y(22), class: "grid" }, g));
  const courbe = Plot.el("path", { class: "curve" }, g), dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  const nomDe = (k, p) => {
    const d = Math.min(p % 360, 360 - p % 360);
    if (k === "ethane") { const r = ((p % 120) + 120) % 120; return t(r < 15 || r > 105 ? "conf.eclipsee" : Math.abs(r - 60) < 15 ? "conf.decalee" : "conf.entre"); }
    return t(d < 15 ? "conf.syn" : Math.abs(d - 60) < 15 ? "conf.gauche" : Math.abs(d - 120) < 15 ? "conf.anticlinale" : d > 165 ? "conf.anti" : "conf.entre");
  };
  function trace() {
    const M = MOL[cle]; let d = "";
    for (let p = 0; p <= 360; p += 2) d += (p ? "L" : "M") + x(p).toFixed(1) + " " + y(O.torsion(M.c, p) / kJ).toFixed(1);
    courbe.setAttribute("d", d);
    document.querySelectorAll("#mol button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === cle)));
  }
  function maj() {
    const M = MOL[cle], p = +phi.value, T = +temp.value, V = O.torsion(M.c, p);
    const n = O.newman({ avant: M.avant, arriere: M.arriere, phi: p, texte: sym });
    proj.setAttribute("viewBox", n.viewBox); proj.innerHTML = n.html;
    dot.setAttribute("cx", x(p)); dot.setAttribute("cy", y(Math.max(V, 0) / kJ));
    out("phiread").textContent = F.fix(p, 0) + "°";
    out("tread").innerHTML = F.kelvin(T);
    out("nom").textContent = nomDe(cle, p);
    out("energie").textContent = F.qty(F.fix(V / kJ, 1), "kJ·mol⁻¹");
    if (cle === "butane") {
      const [a, g1, g2] = O.fractions(M.c, T, [[120, 240], [0, 120], [240, 360]]);
      out("part").textContent = F.qty(F.fix(100 * a, 0), "%"); out("partf").textContent = t("fig.anti", { g: F.qty(F.fix(100 * (g1 + g2), 0), "%") });
    } else {
      const s = O.fractions(M.c, T, [[30, 90], [150, 210], [270, 330]]).reduce((u, f) => u + f, 0);
      out("part").textContent = F.qty(F.fix(100 * s, 0), "%"); out("partf").textContent = t("fig.decalees");
    }
    const k = O.eyring(M.barriere, T);
    out("vitesse").textContent = F.qty(F.sci(k, 2), "s⁻¹");
    out("vitf").textContent = t("fig.vitf", { e: F.qty(F.num(M.barriere / kJ, 2), "kJ·mol⁻¹"), r: F.fix(M.barriere / (Constantes.R * T), 1) });
  }
  document.getElementById("mol").onclick = e => { const b = e.target.closest("button"); if (!b) return; cle = b.dataset.m; trace(); maj(); };
  phi.oninput = temp.oninput = maj;
  trace(); maj();
})();

/* ---------- échelle des barrières ---------- */
(() => {
  const ROWS = [["thermique", 2.49], ["ethane", 12], ["butane", 16], ["oki", 93]], txt = textOf("bar.rows", ROWS.map(r => r[0]));
  document.getElementById("barrieres").innerHTML = ROWS.map(([id, e]) => `<div><span class="k">${F.qty(F.num(e, 3), "kJ·mol⁻¹")}</span><span>${txt[id]}</span><span class="v">${F.sci(O.eyring(e * 1000, 298.15), 1)}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["pitzer", 1936, "experiment"], ["barton", 1950, "idea"], ["newman", 1952, "idea"], ["nobel", 1969, "idea"], ["oki", 1983, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount(document.getElementById("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["champs", "polymeres"], uses = textOf("uses.items", USES);
  document.getElementById("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["newman", "c"], ["eclipse", "a"], ["gauche", "d"], ["separer", "b"], ["chaud", "c"], ["rt", "a"], ["conf", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount(document.getElementById("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
