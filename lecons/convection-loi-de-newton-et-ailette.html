<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, R = Constantes.R;
const pc = (x, n = 2) => F.num(100 * x, n) + F.NB + "%";

/* ---------- ordres de grandeur de h ---------- */
(() => {
  const ROWS = [["calme", 1 / S.R_SURFACE.int], ["vent", 1 / S.R_SURFACE.ext]];
  $("tab").innerHTML = ROWS.map(([id, hc]) => `<div><span class="k">${t("tab." + id)}</span><span>${t("tab.ligne", {
    h: F.qty(F.num(hc, 2), "W·m⁻²·K⁻¹"), d: F.si(S.LAMBDA.air / hc, "m", { sig: 2 }) })}</span></div>`).join("")
    + ["air", "eau"].map(id => `<div><span class="k">${t("tab." + id)}</span><span>${t("tabv." + id)}</span></div>`).join("");
})();

/* ---------- ailette cylindrique ---------- */
(() => {
  const svg = $("ail"), sm = $("mat"), sr = $("rr"), sl = $("ll"), sh = $("hh"), TH0 = 50;
  function draw() {
    const mat = sm.value, lam = S.LAMBDA[mat], r = +sr.value / 1000, L = +sl.value / 100, hc = +sh.value, p = 2 * Math.PI * r, A = Math.PI * r * r;
    const m = S.mAilette(hc, lam, p, A), mL = m * L, bi = S.biot(hc, r, lam);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 }, x: { domain: [0, 0.3], label: t("ail.x") }, y: { domain: [0, TH0], label: t("ail.y") } });
    const a = [], b = [];
    for (let i = 0; i <= 200; i++) { const x = 0.3 * i / 200; b.push([o.x(x), o.y(TH0 * S.ailette(x, 0.3, m, "infinie"))]); if (x <= L) a.push([o.x(x), o.y(TH0 * S.ailette(x, L, m))]); }
    a.push([o.x(L), o.y(TH0 * S.ailette(L, L, m))]);
    Plot.el("path", { d: Plot.path(b), class: "stroke dash c-warn" }, o.g); Plot.el("path", { d: Plot.path(a), class: "stroke c-tint" }, o.g);
    Plot.el("line", { x1: o.x(L), x2: o.x(L), y1: o.y(0), y2: o.y(TH0), class: "stroke thin c-label" }, o.g);
    $("rrv").textContent = F.qty(F.num(r * 1000, 2), "mm"); $("llv").textContent = F.qty(F.num(L * 100, 2), "cm"); $("hhv").textContent = F.qty(F.num(hc, 3), "W·m⁻²·K⁻¹");
    $("vlm").textContent = F.si(1 / m, "m", { sig: 3 }); $("vml").textContent = F.num(mL, 3); $("fml").textContent = t(mL > 3 ? "ail.f.longue" : mL < 0.3 ? "ail.f.courte" : "ail.f.moyenne");
    $("vphi").textContent = F.si(S.fluxAilette(hc, lam, p, A, L, TH0), "W", { sig: 3 });
    $("veta").textContent = pc(S.rendementAilette(mL)); $("veff").textContent = F.num(S.efficaciteAilette(hc, lam, p, A, L), 3);
    $("sys").innerHTML = t("sys.inner", { mat: t("mat." + mat), r: F.qty(F.num(r * 1000, 2), "mm"), L: F.qty(F.num(L * 100, 2), "cm"), bi: F.sci(bi, 2),
      bout: pc(S.ailette(L, L, m)), avis: t(bi < 0.1 ? "sys.ok" : "sys.ko") });
  }
  sm.onchange = sr.oninput = sl.oninput = sh.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1701, "experiment"], ["prandtl", 1904, "idea"], ["nusselt", 1915, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["dissipateur", "echangeur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["h", "c"], ["biot", "a"], ["tau", "d"], ["longueur", "b"], ["longue", "a"], ["materiau", "c"], ["bilan", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 9301 });
})();
</script>
