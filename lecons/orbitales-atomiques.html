<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const Q = QuantSchro, CA = ChimArchi, K = Constantes;
const onTheme = f => { f(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", f); new MutationObserver(f).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] }); };
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹", conf = Z => CA.configuration(Z).map(c => c.n + "spd"[c.l] + String(c.e).split("").map(d => SUP[d]).join("")).join(" ");

/* ---------- coupe d'une orbitale dans le plan xz : couleur = signe de ψ, intensité = |ψ| ---------- */
(() => {
  const ORB = { "1s": [1, "s", 5], "2s": [2, "s", 13], "2pz": [2, "pz", 10], "3pz": [3, "pz", 22], "3dz2": [3, "dz2", 18], "3dxz": [3, "dxz", 18] };
  const canvas = $("om"), ctx = canvas.getContext("2d"), seg = $("orbs"), N = 160;
  let cur = "2pz", ink = {};
  function size() { const r = canvas.getBoundingClientRect(), d = Math.min(devicePixelRatio, 2); canvas.width = Math.round(r.width * d); canvas.height = Math.round(r.height * d); draw(); }
  const rgb = c => { ctx.fillStyle = c; const h = ctx.fillStyle; return h[0] === "#" ? [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)) : h.match(/\d+/g).slice(0, 3).map(Number); };
  const off = document.createElement("canvas"); off.width = off.height = N;
  function draw() {
    if (!ink.plus || !canvas.width) return;
    const [n, nom, L] = ORB[cur], l = Q.lDe(nom), w = canvas.width, h = canvas.height, side = Math.min(w, h);
    const v = new Float64Array(N * N);
    let m = 0;
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const x = -L + 2 * L * (i + 0.5) / N, z = L - 2 * L * (j + 0.5) / N, p = Q.ondeOrbitale(n, nom, x, 0, z);
      v[j * N + i] = p; m = Math.max(m, Math.abs(p));
    }
    const img = new ImageData(N, N), P = rgb(ink.plus), M = rgb(ink.moins);
    v.forEach((p, k) => { const c = p > 0 ? P : M; img.data.set([c[0], c[1], c[2], Math.round(255 * Math.min(1, Math.abs(p) / m))], 4 * k); });
    off.getContext("2d").putImageData(img, 0, 0);
    ctx.clearRect(0, 0, w, h); ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, (w - side) / 2, (h - side) / 2, side, side);
    ctx.globalAlpha = 1; ctx.fillStyle = ink.noyau; ctx.beginPath(); ctx.arc(w / 2, h / 2, 3, 0, 6.283); ctx.fill();
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.o === cur)));
    $("vn").textContent = t("om.v.noeuds", { r: n - l - 1, a: l });
    $("fn").textContent = t("om.f.noeuds", { n, l });
    const H = CA.hydrogenoide(1, n);
    $("ve").textContent = F.si(H.E, "eV");
    $("fe").textContent = t("om.f.e", { r: F.si(H.r, "m", { prefix: "p" }) });
    $("omread").textContent = t("om.cote", { c: F.si(2 * L * K.a0, "m", { prefix: "p" }) });
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { cur = b.dataset.o; draw(); });
  onTheme(() => { ink = { plus: css("--tint"), moins: css("--el-o"), noyau: css("--label") }; draw(); });
  new ResizeObserver(size).observe(canvas); size();
})();

/* ---------- Slater : rayon de l'orbitale de valence, Z = 1 à 18 ---------- */
(() => {
  const svg = $("gr"), sl = $("zsl"), PM = 1e-12;
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { domain: [0, 19], label: t("gr.x") }, y: { domain: [0, 240], label: t("gr.y") } });
  const pts = Array.from({ length: 18 }, (_, i) => [i + 1, CA.valenceSlater(i + 1).r / PM]);
  for (const per of [[1, 2], [3, 10], [11, 18]]) Plot.el("path", { d: Plot.path(pts.slice(per[0] - 1, per[1]).map(([z, r]) => [x(z), y(r)])), class: "curve" }, g);
  const dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  const SYM = ["H", "He", "Li", "Be", "B", "C", "N", "O", "F", "Ne", "Na", "Mg", "Al", "Si", "P", "S", "Cl", "Ar"];
  function upd() {
    const Z = +sl.value, v = CA.valenceSlater(Z), sym = SYM[Z - 1], der = CA.configuration(Z).pop(), tab = (CA.ORBITALES_EV[sym] || {})[der.n + "sp"[der.l]];
    dot.setAttribute("cx", x(Z)); dot.setAttribute("cy", y(v.r / PM));
    $("zread").textContent = t("gr.zread", { z: Z, s: sym });
    $("vc").textContent = conf(Z);
    $("vz").textContent = F.fix(v.zEff, 2);
    $("fz").textContent = t("gr.f.zeff", { s: F.fix(Z - v.zEff, 2) });
    $("vr").textContent = F.si(v.r, "m", { prefix: "p" });
    $("vs").textContent = F.si(v.E, "eV");
    $("fs").textContent = tab === undefined ? t("gr.f.sans") : t("gr.f.table", { e: F.si(tab, "eV") });
  }
  sl.oninput = upd; upd();
})();

/* ---------- table des énergies de valence ---------- */
(() => {
  const E = CA.ORBITALES_EV, ROWS = ["H", "B", "C", "N", "O", "F"], txt = textOf("table.rows", ROWS);
  $("table").innerHTML = ROWS.map(s => `<div><span class="k">${txt[s]}</span><span>${Object.entries(E[s]).map(([o, e]) => o + " : " + F.si(e, "eV")).join(" ; ")}</span><span class="v">${E[s]["2s"] !== undefined ? F.si(E[s]["2p"] - E[s]["2s"], "eV") : ""}</span></div>`).join("");
  const c = CA.valenceSlater(6);
  $("sysb").innerHTML = t("sys.body", { es: F.si(c.E, "eV"), et: F.si(E.C["2p"], "eV"), rc: F.si(c.r, "m", { prefix: "p" }), rn: F.si(CA.valenceSlater(11).r, "m", { prefix: "p" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["schrodinger", 1926, "idea"], ["slater", 1930, "idea"], ["mulliken", 1932, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["spectro", "calcul"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["densite", "b"], ["phase", "c"], ["rayon", "a"], ["noeuds", "d"], ["zeff", "b"], ["electroneg", "a"], ["polarisable", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2101 });
})();
</script>
