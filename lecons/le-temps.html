<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le temps</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-mesurer" data-i18n="monde.mesurer"></a><span class="aux">›</span><a href="/racoon/etape?id=le-temps" data-i18n="etape.le-temps"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <span class="chip plain" data-i18n="tag.prereq"></span>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n="s1.p1"></p>
    <p data-i18n="s1.p2"></p>
    <div class="box def"><b data-i18n="s1.def.title"></b>
      <p data-i18n-html="s1.def.body"></p>
    </div>
    <p data-i18n="s1.p3"></p>
    <div class="box rem"><b data-i18n="s1.rem.title"></b>
      <p data-i18n-html="s1.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq">
      <math display="block"><msub><mi>T</mi><mn>0</mn></msub><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mi>L</mi><mi>g</mi></mfrac></msqrt></math>
      
    </div>
    <p class="validite" data-i18n="eq1.validite"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq">
      <math display="block"><mi>T</mi><mo>≈</mo><msub><mi>T</mi><mn>0</mn></msub><mrow><mo>(</mo><mn>1</mn><mo>+</mo><mfrac><msubsup><mi>θ</mi><mn>0</mn><mn>2</mn></msubsup><mn>16</mn></mfrac><mo>)</mo></mrow></math>
      
    </div>
    <p class="validite" data-i18n="eq2.validite"></p>
    <figure class="chart">
      <svg id="pchart" role="img" data-i18n-attr="aria-label:chart.aria"></svg>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="lsl" data-i18n="chart.len"></label><output id="lread" for="lsl"></output></div>
            <input id="lsl" type="range" min="5" max="300" step="1" value="100"></div>
          <div class="ctl"><div class="row"><label for="asl" data-i18n="chart.amp"></label><output id="aread" for="asl"></output></div>
            <input id="asl" type="range" min="1" max="170" step="1" value="10"></div>
        </div>
        <div class="controls">
          <div class="seg" role="group" data-i18n-attr="aria-label:chart.where"><button type="button" id="terre" aria-pressed="true" data-i18n="chart.terre"></button><button type="button" id="lune" aria-pressed="false" data-i18n="chart.lune"></button></div>
          <button class="btn tinted" type="button" id="seconde" data-i18n="chart.seconde"></button>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="stat.t0"></span><span class="v" id="vt0"></span></div>
          <div class="stat"><span class="k" data-i18n-html="stat.t"></span><span class="v" id="vt"></span></div>
          <div class="stat"><span class="k" data-i18n="stat.ecart"></span><span class="v" id="vecart"></span></div>
          <div class="stat"><span class="k" data-i18n="stat.jour"></span><span class="v" id="vjour"></span><span class="f" data-i18n="stat.jour.f"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="chart.caption"></figcaption>
    </figure>
    <div class="box warn"><b data-i18n="s2.warn.title"></b>
      <p data-i18n-html="s2.warn.body"></p>
    </div>
    <p data-i18n-html="s2.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/le-temps.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/le-temps.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const $ = id => document.getElementById(id);
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));

/* ---------- §5-2 : période du pendule, petites puis grandes amplitudes ---------- */
(() => {
  const G = { terre: Temps.G0, lune: 1.62 };
  let g = G.terre;
  const { x, y, g: layer } = Plot.axes($("pchart"), { fmt: F, w: 640, h: 300,
    x: { domain: [0, 180], label: t("chart.x") }, y: { domain: [1, 2.6], label: t("chart.y") } });
  const path = f => { let d = ""; for (let a = 0; a <= 170; a += 1) d += (a ? "L" : "M") + x(a).toFixed(1) + " " + y(Math.min(f(Temps.deg(a)), 2.6)).toFixed(1); return d; };
  Plot.el("path", { d: path(Temps.ratioBorda), class: "ref" }, layer);
  Plot.el("path", { d: path(Temps.ratioExact), class: "curve" }, layer);
  const dot = Plot.el("circle", { r: 6, class: "dot" }, layer);
  const lsl = $("lsl"), asl = $("asl");
  const upd = () => {
    const L = lsl.value / 100, a = +asl.value, th = Temps.deg(a), T0 = Temps.period0(L, g), r = Temps.ratioExact(th);
    $("lread").textContent = F.si(L, "m", { prefix: "" });
    $("aread").textContent = a + "°";
    dot.setAttribute("cx", x(a)); dot.setAttribute("cy", y(r));
    $("vt0").textContent = F.si(T0, "s", { prefix: "" });
    $("vt").textContent = F.si(T0 * r, "s", { prefix: "" });
    $("vecart").textContent = F.qty(F.num((r - 1) * 100, 3), "%");
    $("vjour").textContent = F.si(Temps.dailyDelay(th), "s", { sig: 3, prefix: "" });
  };
  const where = k => { g = G[k]; ["terre", "lune"].forEach(id => $(id).setAttribute("aria-pressed", String(id === k))); upd(); };
  $("terre").onclick = () => where("terre"); $("lune").onclick = () => where("lune");
  $("seconde").onclick = () => { lsl.value = Math.round(Temps.lengthForPeriod(2, g) * 100); asl.value = 2; upd(); };
  lsl.oninput = asl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["galilee", 1582, "experiment"], ["lettre", 1602, "idea"], ["santorio", 1603, "use"], ["huygens", 1656, "experiment"],
    ["horologium", 1673, "idea"], ["quartz", 1927, "experiment"], ["astron", 1969, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["montre", "bigben"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["longueur", "a"], ["lune", "a"], ["amplitude", "a"], ["ressort", "a"], ["masse", "a"], ["piece", "a"], ["accord", "a"], ["pouls", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
</html>
