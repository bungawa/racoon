<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["bobine", "condensateur", "resistance"]; keyed($("composants"), t("composants.tag"), IDS, textOf("composants.items", IDS)); })();

/* ---------- quand un composant réel est-il son modèle idéal ? ---------- */
(() => {
  const TOL = 0.01, F0 = 1, F1 = 1e9, Z0 = 1e-2, Z1 = 1e10, seg = $("mode"), lf = $("lf");
  let type = "bobine";
  const clampZ = z => Math.min(Z1, Math.max(Z0, z));
  const LF = Array.from({ length: 451 }, (_, i) => 9 * i / 450);
  function draw() {
    const f = 10 ** +lf.value, w = 2 * Math.PI * f, s = M.composant(type, w), d = M.domaineIdeal(type, TOL);
    const svg = $("trace"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 60, b: 44 }, x: { scale: "log", domain: [F0, F1], label: t("fig.xaxis") }, y: { scale: "log", domain: [Z0, Z1], label: t("fig.yaxis") } });
    if (d) { const a = Math.max(F0, d.wmin / (2 * Math.PI)), b = Math.min(F1, d.wmax / (2 * Math.PI));
      Plot.el("rect", { x: P.x(a), y: P.y(Z1), width: P.x(b) - P.x(a), height: P.y(Z0) - P.y(Z1), class: "area" }, P.g); }
    const pts = LF.map(l => M.composant(type, 2 * Math.PI * 10 ** l));
    Plot.el("path", { d: Plot.path(LF.map((l, i) => [P.x(10 ** l), P.y(clampZ(Math.hypot(pts[i].Zideal.re, pts[i].Zideal.im)))])), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(LF.map((l, i) => [P.x(10 ** l), P.y(clampZ(pts[i].module))])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(f), cy: P.y(clampZ(s.module)), r: 5, class: "dot" }, P.g);
    $("lfv").textContent = F.si(f, "Hz");
    $("vz").textContent = F.si(s.module, "Ω");
    $("fz").textContent = t("fig.f.z", { phi: F.qty(F.fix(s.phase, 2), "rad"), nature: t(Math.abs(s.Z.im) < 0.01 * s.module ? "fig.nature.r" : s.Z.im > 0 ? "fig.nature.l" : "fig.nature.c") });
    $("ve").textContent = s.ecart < 1e-3 ? F.sci(s.ecart, 2) : F.qty(F.num(100 * s.ecart, 3), "%");
    $("fe").textContent = d ? t(d.wmin === 0 ? "fig.f.domaine0" : "fig.f.domaine", { a: F.si(d.wmin / (2 * Math.PI), "Hz"), b: F.si(d.wmax / (2 * Math.PI), "Hz") }) : t("fig.f.jamais");
    $("vt").textContent = F.sci(s.rapportTaille, 2);
    $("ft").textContent = t("fig.f.taille", { l: F.si(s.lambda, "m"), d: F.si(s.taille, "m") });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === type)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { type = x.dataset.m; draw(); });
  lf.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["henry", 1832, "experiment"], ["heaviside", 1886, "idea"], ["steinmetz", 1893, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["fiche", "mesureur"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["continu", "c"], ["phase", "a"], ["ideal", "d"], ["fil", "b"], ["haut", "c"], ["taille", "a"], ["fer", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 221 });
})();
</script>
