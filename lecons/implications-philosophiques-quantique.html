<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, K = Constantes;
/* air at 293 K and 101 kPa: free path 68 nm (Jennings, 1988), N₂ kinetic diameter 0,364 nm, mean speed √(8 k_B T/(π m)) */
const LIBRE = 68e-9, RAYON = 0.364e-9 / 2, MN2 = 28.0134 * K.u, VMOY = Math.sqrt(8 * K.k_B * 293.15 / (Math.PI * MN2)), TAU = LIBRE / VMOY;
const DIRE = 3;                                                  // digits spoken per second, to state the precision aloud

/* ---------- how long a classical prediction lasts ---------- */
(() => {
  const svg = $("fig"), sc = $("sc"), sa = $("sa"), XMAX = 300;
  function draw() {
    const chiffres = +sc.value, A = 10 ** +sa.value, h = Q.horizonPrevision(10 ** -chiffres, A, TAU);
    const ymax = Q.horizonPrevision(10 ** -XMAX, 10, TAU).t * 1e9;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { domain: [0, XMAX], label: t("fig.x") }, y: { domain: [0, ymax], label: t("fig.y") } });
    const pts = [0, XMAX].map(c => [x(c), y(c === 0 ? 0 : Q.horizonPrevision(10 ** -c, A, TAU).t * 1e9)]);
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold" }, Plot.el("g", { class: "c-tint" }, g));
    Plot.el("circle", { cx: x(chiffres), cy: y(h.t * 1e9), r: 5, class: "fill" }, Plot.el("g", { class: "c-warn" }, g));
    $("scr").textContent = t("fig.eps", { e: F.sup(-chiffres) });
    $("sar").textContent = F.num(A, 3);
    $("vn").textContent = F.num(h.n, 3);
    $("fn").textContent = t("fig.f.chocs", { A: F.num(A, 3) });
    $("vt").textContent = F.si(h.t, "s");
    $("ft").textContent = t("fig.f.temps", { tau: F.si(TAU, "s") });
    $("vd").textContent = F.si(chiffres / DIRE, "s");
    $("fd").textContent = t("fig.f.dire", { r: F.sci(chiffres / DIRE / h.t, 2) });
  }
  sc.oninput = sa.oninput = draw; draw();
})();

/* ---------- the system described: a molecule of air, an excited atom ---------- */
(() => {
  $("sys1").innerHTML = t("sys1.body", { l: F.si(LIBRE, "m", { prefix: "n" }), r: F.si(RAYON, "m", { prefix: "n" }), A: F.num(LIBRE / RAYON, 2), v: F.si(VMOY, "m·s⁻¹"), tau: F.si(TAU, "s"), T: F.kelvin(293.15) });
  $("sys2").innerHTML = t("sys2.body", { m: F.si(1.6e-9 * Math.LN2, "s") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["laplace", 1814, "idea"], ["poincare", 1908, "idea"], ["born", 1926, "idea"], ["lorenz", 1963, "idea"], ["bell", 1964, "idea"], ["aspect", 1982, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["meteo", "hasard"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["arbre", "b"], ["mesure", "c"], ["prevoir", "a"], ["atome", "d"], ["classique", "b"], ["log", "c"], ["minimum", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 386 });
})();
</script>
