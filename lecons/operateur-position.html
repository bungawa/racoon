<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, L = 1e-9, me = Constantes.m_e, N = 400, dx = L / N;
const E1 = Q.niveauPuitsInfini(1, L, me), E2 = Q.niveauPuitsInfini(2, L, me), T = Constantes.h / (E2 - E1);
$("sys1").innerHTML = t("sys.body", { L: F.si(L, "m"), E1: F.qty(F.num(E1 / Constantes.e, 3), "eV"), E2: F.qty(F.num(E2 / Constantes.e, 3), "eV"), T: F.si(T, "s"),
  kT: F.qty(F.num(Constantes.k_B * 300 / Constantes.e, 2), "eV") });
(() => {
  const svg = $("boite"), sm = $("sm"), st = $("st");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [0, 1], label: t("fig.x") }, y: { domain: [0, 4], label: t("fig.y") } });
  const band = Plot.el("rect", { y: y(4), height: y(0) - y(4), class: "fill c-label-2", "fill-opacity": 0.18 }, g);
  const pd = Plot.el("path", { class: "stroke c-tint" }, g), mx = Plot.el("line", { y1: y(0), y2: y(4), class: "stroke c-warn" }, g);
  const trace = Plot.el("path", { class: "stroke thin dash c-warn" }, g);
  function etat(th, tt) {
    const ph = -(E2 - E1) * tt / Constantes.hbar, c1 = Math.cos(th), c2 = Math.sin(th), g = [];
    for (let i = 0; i <= N; i++) { const xx = i * dx, a = Q.etatBoiteL(1, xx, L), b = Q.etatBoiteL(2, xx, L); g.push({ re: c1 * a + c2 * b * Math.cos(ph), im: c2 * b * Math.sin(ph) }); }
    return g;
  }
  function draw() {
    const th = +sm.value * Math.PI / 180, tt = T * +st.value / 100, psi = etat(th, tt), s = Q.moyennesGrille(psi, dx, 0);
    pd.setAttribute("d", Plot.path(psi.map((z, i) => [x(i / N), y(Math.min(4, (z.re * z.re + z.im * z.im) * L))])));
    mx.setAttribute("x1", x(s.x / L)); mx.setAttribute("x2", x(s.x / L));
    band.setAttribute("x", x((s.x - s.ecart) / L)); band.setAttribute("width", x(2 * s.ecart / L) - x(0));
    /* ⟨x⟩(t) over one period, drawn as a dashed curve: time on the vertical axis, from bottom (t = 0) to top (t = T) */
    const P = []; for (let k = 0; k <= 60; k++) { const m = Q.moyennesGrille(etat(th, T * k / 60), dx, 0); P.push([x(m.x / L), y(4 * k / 60)]); }
    trace.setAttribute("d", Plot.path(P));
    $("smr").textContent = F.num(+sm.value, 3) + "°";
    $("str").textContent = t("fig.v.t", { f: F.num(+st.value / 100, 2) });
    $("vx").textContent = F.num(s.x / L, 3) + " L";
    $("fx").textContent = t("fig.f.x", { x: F.si(s.x, "m") });
    $("vd").textContent = F.num(s.ecart / L, 3) + " L";
    $("fd").textContent = t("fig.f.d", { d: F.si(s.ecart, "m") });
    $("vt").textContent = F.si(T, "s");
    $("ft").textContent = t("fig.f.t", { a: F.num(Math.abs(32 / (9 * Math.PI * Math.PI)) * Math.sin(th) * Math.cos(th), 3) });
  }
  sm.oninput = st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["born", 1926, "idea"], ["heisenberg", 1927, "idea"], ["kennard", 1927, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["puits"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["centre", "b"], ["action", "c"], ["stationnaire", "a"], ["periode", "b"], ["ecart", "c"], ["propre", "b"], ["symetrie", "d"], ["rayonne", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 204 });
})();
</script>
