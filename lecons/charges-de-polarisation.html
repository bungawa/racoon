    <div class="eq"><math display="block"><mi>E</mi><mo>=</mo><mfrac><msub><mi>σ</mi><mi data-i18n="eq.libre"></mi></msub><msub><mi>ε</mi><mn>0</mn></msub></mfrac><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><mi>χ</mi></mrow></mfrac></math><span class="n">(10.9)</span></div>

    <p class="validite" data-i18n-html="val.10.10"></p>

    <div class="eq"><math display="block"><msub><mi>σ</mi><mi data-i18n="eq.pol"></mi></msub><mo>=</mo><mi mathvariant="bold">P</mi><mo>·</mo><mi mathvariant="bold">n</mi></math><span class="n">(10.12)</span></div>

    <div class="eq"><math display="block"><msub><mo>∫</mo><mi>V</mi></msub><msub><mi>ρ</mi><mi data-i18n="eq.pol"></mi></msub><mspace width="0.2em"/><mi>d</mi><mi>V</mi><mo>=</mo><mo>−</mo><msub><mo>∮</mo><mi>S</mi></msub><mi mathvariant="bold">P</mi><mo>·</mo><mi mathvariant="bold">n</mi><mspace width="0.2em"/><mi>d</mi><mi>a</mi></math><span class="n">(10.15)</span></div>
    <p class="validite" data-i18n-html="val.10.15"></p>
    <div class="eq"><math display="block"><msub><mi>ρ</mi><mi data-i18n="eq.pol"></mi></msub><mo>=</mo><mo>−</mo><mo>∇</mo><mo>·</mo><mi mathvariant="bold">P</mi></math><span class="n">(10.16)</span></div>
    <p class="validite" data-i18n-html="val.10.16"></p>
    <figure>
      <svg class="fig" id="profil" viewBox="0 0 640 180" role="img" data-i18n-attr="aria-label:fig.aria.P"></svg>

      <div class="panel">
        <div class="seg" role="group" id="profs" data-i18n-attr="aria-label:fig.choix">

<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;

/* ---------- le système décrit : 100 V sur un film de PTFE de 10 µm ---------- */
(() => {
  const k = 2.1, U = 100, d = 10e-6, E0 = U / d, c = ES.couches(k * ES.EPS0 * E0, [{ e: d, kappa: k }]);
  const P = c.couches[0].P, n = P / ES.E, nSurf = 1 / (0.3e-9) ** 2;
  $("sys1").innerHTML = t("sys1.body", { E: F.si(E0, "V·m⁻¹", { prefix: "M" }), s: F.sci(c.couches[0].D, 2), P: F.sci(P, 2),
    n: F.sci(n, 1), f: F.num(nSurf / n, 1) });
})();

/* ---------- compter les charges décalées ---------- */
(() => {
  const d = 1, P0 = 1, Nq = 200;                                   // units of d and P0; δ max = d/200, exaggerated
  const PROFILS = { uniforme: () => P0, rampe: x => P0 * x / d, bosse: x => P0 * Math.sin(Math.PI * x / d) ** 2 };
  const sp = $("profil"), sb = $("bilan"), nsl = $("nsl");
  let prof = "uniforme";
  function draw() {
    const Pf = PROFILS[prof], n = +nsl.value, w = d / n;
    const bords = Array.from({ length: n + 2 }, (_, i) => -w / 2 + i * w);
    const compte = ES.chargesDeplacees(Pf, 0, d, Nq, bords);
    const loi = bords.slice(1).map((b, i) => { const a = bords[i], lo = Math.max(a, 0), hi = Math.min(b, d);
      return (a < 0 && b > 0 ? -Pf(0) : 0) + (a < d && b > d ? Pf(d) : 0) - (hi > lo ? Pf(hi) - Pf(lo) : 0); });
    sp.innerHTML = "";
    const A = Plot.axes(sp, { fmt: F, w: 640, h: 180, x: { domain: [-0.1, 1.1], label: t("fig.x") }, y: { domain: [0, 1.2], ticks: 3, label: t("fig.yP") } });
    const pts = [[A.x(-0.1), A.y(0)], [A.x(0), A.y(0)]];
    for (let i = 0; i <= 200; i++) pts.push([A.x(i / 200), A.y(Pf(i / 200))]);
    pts.push([A.x(1), A.y(0)], [A.x(1.1), A.y(0)]);
    Plot.el("path", { d: Plot.path(pts), class: "stroke c-label" }, A.g);
    sb.innerHTML = "";
    const B = Plot.axes(sb, { fmt: F, w: 640, h: 260, x: { domain: [-0.1, 1.1], label: t("fig.x") }, y: { domain: [-1.2, 1.2], label: t("fig.yq") } });
    const gt = Plot.el("g", { class: "c-tint" }, B.g), gw = Plot.el("g", { class: "c-warn" }, B.g);
    compte.forEach((q, i) => {
      const x0 = B.x(Math.max(-0.1, bords[i])), x1 = B.x(Math.min(1.1, bords[i + 1])), y0 = B.y(0), y1 = B.y(q);
      Plot.el("rect", { x: (x0 + 0.5).toFixed(1), width: Math.max(0.5, x1 - x0 - 1).toFixed(1), y: Math.min(y0, y1).toFixed(1), height: Math.abs(y1 - y0).toFixed(1), class: "fill", opacity: 0.55 }, gt);
      Plot.el("circle", { cx: ((x0 + x1) / 2).toFixed(1), cy: B.y(loi[i]).toFixed(1), r: 3.5, class: "fill" }, gw);
    });
    const faces = compte[0] + compte[n], volume = compte.slice(1, n).reduce((s, q) => s + q, 0), total = compte.reduce((s, q) => s + q, 0);
    $("nread").textContent = t("ctl.nv", { n, w: F.num(w, 3) });
    $("vf").textContent = F.num(compte[0], 3) + " ; " + F.num(compte[n], 3);
    $("ff").textContent = t("f.faces", { a: F.num(-Pf(0), 3), b: F.num(Pf(d), 3) });
    $("vv").textContent = F.num(Math.abs(volume) < 1e-9 ? 0 : volume, 3);
    $("fv").textContent = t("f.volume");
    $("vt").textContent = F.num(Math.abs(total) < 1e-9 ? 0 : total, 3);
    $("ft").textContent = t("f.total");
  }
  document.querySelectorAll("#profs button").forEach(bt => bt.onclick = () => {
    prof = bt.dataset.p; document.querySelectorAll("#profs button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  nsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["poisson", 1824, "idea"], ["curie", 1880, "experiment"], ["lorentz", 1892, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pyro"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["face", "b"], ["decharge", "d"], ["eau", "a"], ["chi", "c"], ["volume", "a"], ["oblique", "c"], ["neutre", "d"], ["bosse", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1003 });
})();
</script>
