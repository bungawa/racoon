<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp;

/* the system of « Observer les électrons »: 50 keV electrons, holes 1 µm apart and 0,2 µm wide, screen at 1 m */
const LAMBDA_E = Q.broglie(Q.impulsion(Q.m_e, 50e3 * Q.e)), FENTES = { lambda: LAMBDA_E, d: 1e-6, a: 0.2e-6, L: 1 };
const INTERFRANGE = Q.interfrangeFentes(LAMBDA_E, FENTES.L, FENTES.d);

/* ---------- two amplitudes as arrows, the probability on the screen, a jittered experiment ---------- */
(() => {
  const plan = $("plan"), ecran = $("ecran"), sx = $("sx"), ss = $("ss");
  const X = 8e-6, xs = Array.from({ length: 481 }, (_, i) => -X + i * 2 * X / 480);
  function draw() {
    const x = +sx.value * 1e-6, sigma = +ss.value, V = Q.contrasteBrouille(sigma);
    const r = Q.probaAvecTemoin(x, FENTES, V), a = Q.amplitudesDeuxFentes(x, FENTES);
    /* the complex plane: φ1 from the origin, φ2 from its head, the sum */
    plan.innerHTML = "";
    const c = 120, s = 55, px = z => [c + s * z.re, c - s * z.im];
    Plot.el("line", { x1: 10, x2: 230, y1: c, y2: c, class: "zero" }, plan);
    Plot.el("line", { x1: c, x2: c, y1: 10, y2: 230, class: "zero" }, plan);
    const O = px({ re: 0, im: 0 }), A = px(a.phi1), S = px({ re: a.phi1.re + a.phi2.re, im: a.phi1.im + a.phi2.im });
    Plot.fleche(plan, O, A, { cls: "c-label-2", tete: 9, min: 2 });
    Plot.fleche(plan, A, S, { cls: "c-label-2", tete: 9, min: 2 });
    Plot.fleche(plan, O, S, { cls: "c-tint", tete: 10, min: 2 });
    const tag = (p, txt) => { const e = Plot.el("text", { x: p[0], y: p[1], "text-anchor": "middle" }, plan); e.textContent = txt; };
    const cote = (P0, P1, sgn) => { const dx = P1[0] - P0[0], dy = P1[1] - P0[1], l = Math.hypot(dx, dy) || 1;   // label beside an arrow
      return [(P0[0] + P1[0]) / 2 - sgn * 16 * dy / l, (P0[1] + P1[1]) / 2 + sgn * 16 * dx / l + 4]; };
    tag(cote(O, A, 1), t("fig.phi1"));
    tag(cote(A, S, 1), t("fig.phi2"));
    /* the screen */
    ecran.innerHTML = "";
    const P = Plot.axes(ecran, { fmt: F, w: 480, h: 240, pad: { l: 48, b: 40 }, x: { domain: [-8, 8], label: t("fig.xaxis") }, y: { domain: [0, 4.2], label: t("fig.yaxis") } });
    const pts = xs.map(u => Q.probaAvecTemoin(u, FENTES, V));
    Plot.el("path", { d: Plot.path(xs.map((u, i) => [P.x(u * 1e6), P.y(pts[i].somme)])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((u, i) => [P.x(u * 1e6), P.y(pts[i].P1)])), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((u, i) => [P.x(u * 1e6), P.y(pts[i].P)])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(x * 1e6), cy: P.y(r.P), r: 5, class: "dot" }, P.g);
    $("sxr").textContent = F.qty(F.num(+sx.value, 3), "µm");
    $("ssr").textContent = F.qty(F.num(sigma, 2), "rad");
    $("vp").textContent = F.num(r.P, 2);
    $("fp").textContent = t("fig.f.p", { s: F.num(r.somme, 2), v: F.num(V, 2) });
    const rap = r.P / r.P1;
    $("vc").textContent = F.num(rap, 2);
    $("fc").textContent = t(rap < 1 ? "fig.f.moins" : "fig.f.plus");
  }
  sx.oninput = ss.oninput = draw; draw();
})();

/* ---------- the system described: how still must the wall be? ---------- */
(() => {
  const sigma = 0.3, s = sigma * INTERFRANGE / (2 * Math.PI);
  const P = Q.impulsion(Q.m_e, 50e3 * Q.e), v = Q.vitessesOnde(Q.m_e, P).groupe;
  $("sys1").innerHTML = t("sys1.body", { i: F.si(INTERFRANGE, "m"), s: F.si(s, "m"), v: F.num(Q.contrasteBrouille(sigma), 2), t: F.si(FENTES.L / v, "s") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["born", 1926, "idea"], ["bell", 1964, "idea"], ["aspect", 1982, "experiment"], ["nobel", 2022, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["hasard"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ideale", "c"], ["carre", "a"], ["somme", "d"], ["ouvrir", "b"], ["appareil", "c"], ["cache", "a"], ["brouille", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 377 });
})();
</script>
