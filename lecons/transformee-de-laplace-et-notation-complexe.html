<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["lineaire", "derivee", "convolution", "limites"]; keyed($("morphisme"), t("morphisme.tag"), IDS, textOf("morphisme.items", IDS)); })();
(() => { const IDS = ["circuit", "source", "debut", "taille"]; keyed($("systeme"), t("systeme.tag"), IDS, textOf("systeme.items", IDS)); })();

/* ---------- le circuit : réponse exacte (pôles et résidus) contre la notation complexe seule, vérifiée par RK4 ---------- */
const L = 0.1, C = 1e-7, W0 = 1 / Math.sqrt(L * C), E0 = 1, DUREE = 5e-3, N = 5000, KS = 1e3;
const pole = p => F.qty(Cx.text(p, v => F.num(v, 3)), "s⁻¹");
(() => {
  const TS = Array.from({ length: 401 }, (_, k) => DUREE * k / 400);
  function upd() {
    const R = +$("cr").value, w = +$("cw").value * W0, q0 = +$("cq").value * 1e-6, i0 = +$("ci").value * 1e-3;
    const o = { R, L, C, E0, w, q0, i0 }, r = Laplace.rlc(o), v = Laplace.verifier(o, DUREE, N);
    $("crv").textContent = F.si(R, "Ω");
    $("cwv").textContent = w === 0 ? t("tp.echelon") : F.si(w, "rad·s⁻¹");
    $("cqv").textContent = F.si(q0, "C");
    $("civ").textContent = F.si(i0, "A");
    const ex = TS.map(r.q), cn = TS.map(r.complexe.q), tr = TS.map(r.qTransitoire);
    const m = Math.max(...ex.map(Math.abs), ...cn.map(Math.abs), 1e-8) * 1.1e6;
    const svg = $("temps"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 }, x: { domain: [0, DUREE * 1e3], label: t("tp.xaxis") }, y: { domain: [-m, m], label: t("tp.yaxis") } });
    const line = (ys, cls) => Plot.el("path", { d: Plot.path(TS.map((tt, k) => [P.x(tt * 1e3), P.y(ys[k] * 1e6)])), class: cls }, P.g);
    line(tr, "stroke thin c-warn"); line(cn, "stroke dash c-label-2"); line(ex, "curve");
    for (let k = 0; k <= N; k += 125) Plot.el("circle", { cx: P.x(v.t[k] * 1e3), cy: P.y(v.q[k] * 1e6), r: 3, class: "fill c-ok" }, P.g);
    let e = 0, mx = 0; for (let k = 0; k <= N; k += 5) { e = Math.max(e, Math.abs(r.q(v.t[k]) - v.q[k])); mx = Math.max(mx, Math.abs(v.q[k])); }
    const [p1, p2] = r.poles.circuit;
    $("vp").textContent = pole(p1); $("fp").textContent = r.poles.double ? t("tp.f.double") : t(p1.im !== 0 ? "tp.f.pseudo" : "tp.f.aperiodique", { p2: pole(p2) });
    $("vt").textContent = F.si(r.tau, "s"); $("ft").textContent = t("tp.f.tau");
    $("vc").textContent = F.si(r.complexe.q(0), "C"); $("fc").textContent = t("tp.f.complexe", { q0: F.si(q0, "C") });
    $("vr").textContent = F.num(e / mx, 2); $("fr").textContent = t("tp.f.rk4");
  }
  ["cr", "cw", "cq", "ci"].forEach(id => $(id).oninput = upd);
  upd();
})();

/* ---------- le plan des s : pôles du circuit, de la source, et la boucle proportionnelle ---------- */
(() => {
  const MODES = ["circuit", "boucle"], noms = textOf("pl.modes", MODES); let mode = 0;
  $("mode").innerHTML = MODES.map((id, i) => `<button type="button" data-i="${i}" aria-pressed="${i === 0}">${noms[id]}</button>`).join("");
  const X = [-22, 4], Y = [-36, 36];
  const croix = (P, p, cls) => { const x = P.x(p.re / KS), y = P.y(p.im / KS);
    Plot.el("path", { d: `M${x - 5} ${y - 5}L${x + 5} ${y + 5}M${x - 5} ${y + 5}L${x + 5} ${y - 5}`, class: "stroke " + cls }, P.g); };
  function upd() {
    [...$("mode").children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === mode)));
    const R = +$("cr").value, w = +$("cw").value * W0, K = +$("ck").value, boucle = mode === 1;
    $("ck").disabled = !boucle; $("ckv").textContent = boucle ? F.num(K, 2) : "–";
    const svg = $("plan"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { l: 56, b: 44 }, x: { domain: X, label: t("pl.xaxis") }, y: { domain: Y, label: t("pl.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(0), y1: P.y(Y[0]), y2: P.y(Y[1]), class: "stroke c-label-2" }, P.g);
    if (boucle) {   /* le lieu des pôles quand K va de 0 à 10 */
      const lieu = Array.from({ length: 201 }, (_, k) => Laplace.boucle(R, L, C, 10 * k / 200).poles);
      [0, 1].forEach(j => Plot.el("path", { d: Plot.path(lieu.map(ps => [P.x(Math.max(X[0], ps[j].re / KS)), P.y(ps[j].im / KS)])), class: "stroke thin dash c-warn" }, P.g));
      const B = Laplace.boucle(R, L, C, K);
      B.poles.forEach(p => croix(P, p, "c-warn"));
      $("vb").textContent = pole(B.poles[0]);
      $("fb").textContent = t("pl.f.boucle", { zeta: F.num(B.zeta, 2), g: F.num(B.gainStatique, 3) });
    } else {
      const r = Laplace.rlc({ R, L, C, E0, w, q0: 0, i0: 0 });
      r.poles.circuit.forEach(p => croix(P, p, "c-warn"));
      r.poles.source.forEach(p => Plot.el("circle", { cx: P.x(0), cy: P.y(p.im / KS), r: 6, class: "stroke c-tint" }, P.g));
      $("vb").textContent = pole(r.poles.circuit[0]);
      $("fb").textContent = t("pl.f.circuit", { w: w === 0 ? t("tp.echelon") : F.si(w, "rad·s⁻¹") });
    }
  }
  $("mode").onclick = e => { const b = e.target.closest("button"); if (b) { mode = +b.dataset.i; upd(); } };
  ["cr", "cw", "ck"].forEach(id => $(id).addEventListener("input", upd));
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["laplace", 1812, "idea"], ["heaviside", 1893, "idea"], ["steinmetz", 1893, "use"], ["bromwich", 1916, "idea"],
    ["carson", 1926, "idea"], ["black", 1927, "use"], ["nyquist", 1932, "idea"], ["doetsch", 1937, "idea"], ["bode", 1940, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["asservissement", "electronique"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["derivee", "c"], ["homomorphisme", "a"], ["propre", "d"], ["iw", "b"], ["perd", "a"], ["poles", "c"], ["finale", "d"], ["boucle", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1812 });
})();
</script>
