<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, K = Constantes, A0 = K.a0, E0 = Q.atomeOptimal().E;
const net = x => (Math.abs(x) < 1e-24 ? 0 : x);                        // rounding noise of a sum that vanishes
const J = x => F.qty(F.sci(net(x), 3), "J");
const eV = x => F.si(net(x) / K.e, "eV");

/* ---------- E(a): the kinetic energy of confinement against the electric energy ---------- */
(() => {
  const svg = $("fig"), sa = $("sa"), sx = $("sx"), N = 240, LO = 0.2, HI = 4, U = 1e-18, YLO = -5, YHI = 4;
  const clip = v => Math.max(YLO, Math.min(YHI, v));
  function draw() {
    const xi = +sx.value, a = +sa.value * A0, e = Q.atomeIncertitude(a, { xi }), m = Q.atomeOptimal({ xi });
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [LO, HI], label: t("fig.x") }, y: { domain: [YLO, YHI], label: t("fig.y") } });
    Plot.el("line", { x1: x(LO), x2: x(HI), y1: y(0), y2: y(0), class: "stroke thin" }, Plot.el("g", { class: "c-label-2" }, g));
    [["cinetique", "c-warn", "stroke dash"], ["potentielle", "c-label-2", "stroke dash"], ["totale", "c-tint", "stroke bold"]].forEach(([k, cls, st]) => {
      const pts = Array.from({ length: N + 1 }, (_, i) => { const u = LO + (HI - LO) * i / N; return [x(u), y(clip(Q.atomeIncertitude(u * A0, { xi })[k] / U))]; });
      Plot.el("path", { d: Plot.path(pts), class: st }, Plot.el("g", { class: cls }, g));
    });
    if (m.a / A0 <= HI) Plot.el("line", { x1: x(m.a / A0), x2: x(m.a / A0), y1: y(YLO), y2: y(YHI), class: "stroke thin dash" }, Plot.el("g", { class: "c-tint" }, g));
    Plot.el("circle", { cx: x(a / A0), cy: y(clip(e.totale / U)), r: 5, class: "fill" }, Plot.el("g", { class: "c-tint" }, g));
    $("sar").textContent = F.si(a, "m", { prefix: "p" });
    $("sxr").textContent = F.num(xi, 3);
    $("ve").textContent = J(e.totale);
    $("fe").textContent = t("fig.f.e", { ev: eV(e.totale) });
    $("vm").textContent = F.si(m.a, "m", { prefix: "p" });
    $("fm").textContent = t("fig.f.min", { r: F.num(m.a / A0, 3), E: J(m.E), ev: eV(m.E) });
    $("vc").textContent = J(e.totale - m.E);
    $("fc").textContent = t("fig.f.comp", { ev: eV(e.totale - m.E) });
  }
  sa.oninput = sx.oninput = draw; draw();
})();

/* ---------- the system described: wavelength, speed, nucleus ---------- */
(() => {
  const o = Q.atomeOptimal(), p = K.hbar / o.a, v = p / K.m_e;
  $("sys1").innerHTML = t("sys1.body", { a: F.si(o.a, "m", { prefix: "p" }), a0: F.si(A0, "m", { prefix: "p" }), ecart: F.sci(Math.abs(o.a / A0 - 1), 1), l: F.si(Q.broglie(p), "m", { prefix: "n" }) });
  $("sys2").innerHTML = t("sys2.body", { v: F.si(v, "m·s⁻¹"), b: F.num(v / K.c, 3), b2: F.sci((v / K.c) ** 2, 2) });
  $("sys3").innerHTML = t("sys3.body", { r: F.sci(K.m_e / K.m_p, 2), n: F.sci(0.84e-15 / A0, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bohr", 1913, "idea"], ["pauli", 1925, "idea"], ["heisenberg", 1927, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["nebuleuse"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["compromis", "d"], ["petit", "a"], ["facteur", "c"], ["negatif", "b"], ["plancher", "a"], ["lourd", "d"], ["exclusion", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 384 });
})();
</script>
