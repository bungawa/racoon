<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- +S atoms, T tilted by α with chosen open beams, then S'; amplitudes recombined, or beams marked (probabilities added) ---------- */
(() => {
  const sa = $("sa"), ouv = { ft: [true, true, true], fs2: [false, true, false] }, S = Q.spin1Y(0), p = Q.etatBase(3, 0);
  const amp = a => Q.chaineFiltres(p, [{ R: Q.spin1Y(a), ouverts: ouv.ft }, { R: S, ouverts: ouv.fs2 }])[1].p;
  /* a witness marks the beam taken in T: each open beam is a separate final state, its probabilities are added */
  const marque = a => [0, 1, 2].filter(i => ouv.ft[i]).reduce((s, i) =>
    s + Q.chaineFiltres(p, [{ R: Q.spin1Y(a), ouverts: [0, 1, 2].map(k => k === i) }, { R: S, ouverts: ouv.fs2 }])[1].p, 0);
  function draw() {
    const a = +sa.value * Math.PI / 180, svg = $("courbe"); svg.innerHTML = "";
    Object.keys(ouv).forEach(id => $(id).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(ouv[id][+b.dataset.i]))));
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 240, x: { domain: [0, 180], label: t("fig.ax.alpha") }, y: { domain: [0, 1], label: t("fig.ax.p") } });
    const as = Array.from({ length: 181 }, (_, k) => k * Math.PI / 180);
    Plot.el("path", { d: Plot.path(as.map(x => [ax.x(x * 180 / Math.PI), ax.y(amp(x))])), class: "stroke c-tint", fill: "none" }, svg);
    Plot.el("path", { d: Plot.path(as.map(x => [ax.x(x * 180 / Math.PI), ax.y(marque(x))])), class: "stroke dash c-warn", fill: "none" }, svg);
    Plot.el("line", { x1: ax.x(+sa.value), x2: ax.x(+sa.value), y1: ax.y(0), y2: ax.y(1), class: "stroke thin dash c-label" }, svg);
    $("sar").textContent = F.num(+sa.value, 3) + "\u00a0°";
    $("vamp").textContent = F.num(amp(a), 3); $("famp").textContent = t("fig.f.amp");
    $("vproba").textContent = F.num(marque(a), 3); $("fproba").textContent = t("fig.f.proba");
  }
  Object.keys(ouv).forEach(id => $(id).querySelectorAll("button").forEach(b => b.onclick = () => { ouv[id][+b.dataset.i] = !ouv[id][+b.dataset.i]; draw(); }));
  sa.oninput = draw; draw();
  const a = Math.PI / 3, seul = Q.chaineFiltres(p, [{ R: Q.spin1Y(a), ouverts: [false, true, false] }, { R: S, ouverts: [false, true, false] }])[1].p;
  $("sys1").innerHTML = t("sys1.body", { g: F.num(seul, 3), N: F.num(Math.round(seul * 1e6), 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dirac", 1930, "idea"], ["neumann", 1932, "idea"], ["folman", 2018, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["interfero"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ouvrir", "d"], ["base", "a"], ["purete", "c"], ["temoin", "b"], ["complet", "a"], ["gamma", "c"], ["histoire", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 504 });
})();
</script>
