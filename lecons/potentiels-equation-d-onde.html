<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OndesMilieux, c = Constantes.c;

/* ---------- une impulsion de la nappe, ses potentiels dans quatre jauges ---------- */
(() => {
  const src = O.courant({ J: 1, tau: 1e-9, T: 4e-9 });                     // 1 A·m⁻¹ for 4 ns: the block of « Un champ qui se propage »
  const pot = { phi: () => 0, A: (x, tt) => [0, O.potentielNappe(src.Q, x, tt), 0] };
  const psi0 = 6e-7, w = 0.8, h = 1e-4, k = h / c;                        // ψ in V·s, a Gaussian 0,8 m wide
  const xs = Array.from({ length: 301 }, (_, i) => -3 + i * 0.02);
  const sp = $("pots"), sc = $("champs"), st = $("st"), seg = $("jauge");
  let jauge = "onde";
  function draw() {
    const tt = +st.value * 1e-9, p2 = O.jauger(pot, O.jaugeExemple(jauge, psi0, w));
    const P2 = xs.map(x => ({ phi: p2.phi(x, tt), A: p2.A(x, tt), f: O.champsDepuisPotentiels(p2, x, tt, h, k), f0: O.champsDepuisPotentiels(pot, x, tt, h, k) }));
    const ymax = 1.15 * Math.max(50, ...P2.flatMap(p => [Math.abs(p.phi), Math.abs(c * p.A[0]), Math.abs(c * p.A[1])]));
    sp.innerHTML = "";
    const A = Plot.axes(sp, { fmt: F, w: 640, h: 220, pad: { l: 64, b: 40 }, x: { domain: [-3, 3], label: t("fig.xaxis") }, y: { domain: [-ymax, ymax], label: t("fig.yaxis.pots") } });
    Plot.el("line", { x1: A.x(-3), x2: A.x(3), y1: A.y(0), y2: A.y(0), class: "zero" }, A.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [A.x(x), A.y(c * P2[i].A[1])])), class: "curve" }, A.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [A.x(x), A.y(c * P2[i].A[0])])), class: "stroke c-warn" }, A.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [A.x(x), A.y(P2[i].phi)])), class: "stroke c-ok dash" }, A.g);
    sc.innerHTML = "";
    const B = Plot.axes(sc, { fmt: F, w: 640, h: 220, pad: { l: 64, b: 40 }, x: { domain: [-3, 3], label: t("fig.xaxis") }, y: { domain: [-250, 250], label: t("fig.yaxis.champs") } });
    Plot.el("line", { x1: B.x(-3), x2: B.x(3), y1: B.y(0), y2: B.y(0), class: "zero" }, B.g);
    Plot.el("path", { d: Plot.path(xs.map(x => [B.x(x), B.y(O.nappe(src.J, x, tt).Ey)])), class: "stroke c-label-2 bold" }, B.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [B.x(x), B.y(P2[i].f.E[1])])), class: "curve" }, B.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [B.x(x), B.y(P2[i].f.E[0])])), class: "stroke c-warn dash" }, B.g);
    /* what the gauge changed in the fields, and what it did to the Lorenz condition */
    const dE = Math.max(...P2.map(p => Math.max(...p.f.E.map((e, j) => Math.abs(e - p.f0.E[j])), ...p.f.B.map((b, j) => c * Math.abs(b - p.f0.B[j])))));
    const lz = Math.max(...xs.map(x => Math.abs(c * O.residuLorenz(p2, x, tt, h, k))));
    $("str").textContent = F.si(tt, "s", { prefix: "n" });
    $("vde").textContent = dE < 1e-3 ? t("fig.zero") : F.si(dE, "V·m⁻¹");
    $("fde").textContent = t("fig.f.de");
    $("vlz").textContent = lz < 1e-3 ? t("fig.zero") : F.si(lz, "V·m⁻¹");
    $("flz").textContent = t(lz < 1e-3 ? "fig.f.lorenz.oui" : "fig.f.lorenz.non");
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.j === jauge)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { jauge = b.dataset.j; draw(); });
  st.oninput = draw; draw();
})();

/* ---------- le système décrit : quand le retard compte ---------- */
(() => {
  const L1 = 1, f1 = 50, L2 = 0.1, f2 = 2.4e9;
  const r1 = L1 * f1 / c, r2 = L2 * f2 / c;                                  // L/(c T) with T = 1/f
  $("sys1").innerHTML = t("sys1.body", { L1: F.si(L1, "m"), f1: F.si(f1, "Hz"), r1: F.sci(r1, 2), L2: F.qty(F.num(100 * L2, 3), "cm"), f2: F.si(f2, "Hz", { prefix: "G" }), r2: F.num(r2, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lorenz", 1867, "idea"], ["heaviside", 1885, "idea"], ["ab", 1959, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(x => x[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["holographie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["existe", "c"], ["solenoide", "a"], ["jauge", "d"], ["statique", "b"], ["lorenz", "c"], ["vide", "a"], ["antenne", "d"]];
  const txt = textOf("quiz.items", QS.map(x => x[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const x = txt[id];
    return { id, correct, prompt: x.prompt, why: x.why, hint: x.hint, options: Object.entries(x.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 186 });
})();
</script>
