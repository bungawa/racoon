<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;

/* ---------- lignes de champ de la paire et du dipôle ponctuel, champ en un point sonde ---------- */
(() => {
  const svg = $("lignes"), dd = $("dd"), rs = $("rs"), ts = $("ts"), Q = 1e-9;          // C; lengths in mm on the sliders
  const O = [320, 210], S = 2000;                                                       // px, px per m (view ±16 cm × ±10 cm)
  const px = v => [O[0] + S * v[0], O[1] - S * v[1]];
  const inside = v => Math.abs(v[0]) < 0.16 && Math.abs(v[1]) < 0.105;
  function draw() {
    const d = +dd.value / 1000, r = +rs.value / 1000, th = +ts.value * Math.PI / 180, pair = ES.paireDipole(Q, d, [0, 1]), p = [0, Q * d];
    svg.innerHTML = "";
    /* point dipole: r = C sin²θ, θ from the axis */
    const gp = Plot.el("g", { class: "c-label-2" }, svg);
    [0.02, 0.04, 0.07, 0.11, 0.17, 0.27].forEach(C => [1, -1].forEach(s => {
      const pts = Array.from({ length: 121 }, (_, k) => { const u = Math.PI * (k + 0.5) / 121, rr = C * Math.sin(u) ** 2; return [s * rr * Math.sin(u), rr * Math.cos(u)]; }).filter(inside);
      if (pts.length > 1) Plot.el("path", { d: Plot.path(pts.map(px)), class: "stroke thin dash" }, gp);
    }));
    /* the pair: lines that leave +q, traced numerically */
    const gl = Plot.el("g", { class: "c-tint" }, svg);
    for (let k = 1; k < 12; k++) {
      const L = ES.suivreLigne(pair, 0, Math.PI * k / 12 * 2, { u: [0, 1], r0: d / 8, ds: d / 16, n: 6000, loin: 0.25 });
      const pts = L.points.filter(inside);
      if (pts.length > 1) Plot.el("path", { d: Plot.path(pts.map(px)), class: "stroke thin" }, gl);
    }
    pair.forEach(c => Plot.el("circle", { cx: px([c.x, c.y])[0], cy: px([c.x, c.y])[1], r: 5, class: "fill " + (c.q > 0 ? "c-warn" : "c-tint") }, svg));
    /* probe */
    const P = [r * Math.sin(th), r * Math.cos(th)], E = ES.champ(pair, P), Ed = ES.champDipole(p, P), c = ES.composantesDipole(Q * d, r, th);
    const nE = Math.hypot(...Ed), L = 60 / nE, A = px(P);
    Plot.fleche(svg, A, [A[0] + L * E[0], A[1] - L * E[1]], { cls: "c-tint", trait: "stroke bold" });
    Plot.fleche(svg, A, [A[0] + L * Ed[0], A[1] - L * Ed[1]], { cls: "c-warn" });
    Plot.el("circle", { cx: A[0], cy: A[1], r: 4, class: "fill c-warn" }, svg);
    $("ddr").textContent = F.si(d, "m", { prefix: "m" });
    $("rsr").textContent = F.si(r, "m", { prefix: "m" });
    $("tsr").textContent = t("fig.deg", { a: F.num(+ts.value, 3) });
    $("vz").textContent = F.si(c.Ez, "V·m⁻¹");
    $("fz").textContent = t("fig.f.exact", { v: F.si(E[1], "V·m⁻¹") });
    $("vp").textContent = F.si(c.Eperp, "V·m⁻¹");
    $("fp").textContent = t("fig.f.exact", { v: F.si(E[0], "V·m⁻¹") });
    $("ve").textContent = t("fig.v.err", { e: F.num(100 * Math.hypot(Ed[0] - E[0], Ed[1] - E[1]) / Math.hypot(...E), 2) });
    $("fe").textContent = t("fig.f.err", { x: F.num(d / r, 2) });
  }
  dd.oninput = rs.oninput = ts.oninput = draw; draw();
})();

/* ---------- le système décrit : une sphère polarisée ---------- */
(() => {
  const a = 0.01, s = 1e-12, n = 8.47e28, rho = n * ES.E, B = ES.spheresDecalees(rho, a, s);   // copper's free electrons, m⁻³
  $("sys1").innerHTML = t("sys1.body", { s: F.si(s, "m", { prefix: "p" }), rho: F.sci(rho, 2), sigma: F.si(B.sigma0, "C·m⁻²", { prefix: "m" }),
    p: F.si(B.p, "C·m"), E: F.si(Math.abs(B.Eint), "V·m⁻¹"), rapport: F.sci(s / a, 0) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["waller", 1887, "experiment"], ["einthoven", 1912, "idea"], ["nobel", 1924, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ecg", "simulation"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["axe", "a"], ["equateur", "c"], ["cube", "d"], ["deplacer", "b"], ["gradient", "a"], ["boules", "c"], ["sonde", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 64 });
})();
</script>
