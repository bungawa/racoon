<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions, P = Plot.el;
const conc = x => F.qty(F.sci(x, 3), "mol·L⁻¹");

/* ---------- table : pKs et solubilité dans l'eau ---------- */
(() => {
  const SELS = ["AgCl", "AgBr", "AgI", "Ag2CrO4", "BaSO4", "CaF2", "CaCO3"];
  $("tab").innerHTML = SELS.map(s => `<div><span class="k">${t("tab.k", { sel: C.texte(s) })}</span><span>${t("tab.ligne", {
    pks: F.fix(C.SELS[s].pKs, 2), s: conc(C.solubiliteEau(s)) })}</span></div>`).join("");
})();

/* ---------- domaine d'existence de AgCl, c(Cl⁻) = 0,1 mol·L⁻¹ ---------- */
(() => {
  const svg = $("dom"), x = p => 40 + (p - 2) * 560 / 12, front = C.SELS.AgCl.pKs - 1;
  P("rect", { x: x(2), y: 40, width: x(front) - x(2), height: 26, class: "fill c-tint", "fill-opacity": 0.25 }, svg);
  P("line", { x1: x(2), x2: x(14), y1: 66, y2: 66, class: "stroke c-label" }, svg);
  Plot.fleche(svg, [x(13.6), 66], [x(14), 66], { cls: "c-label" });
  for (let p = 2; p <= 13; p++) { P("line", { x1: x(p), x2: x(p), y1: 62, y2: 70, class: "stroke thin c-label" }, svg);
    P("text", { x: x(p), y: 86, "text-anchor": "middle", class: "tick" }, svg).textContent = F.num(p, 2); }
  P("line", { x1: x(front), x2: x(front), y1: 30, y2: 74, class: "stroke c-warn" }, svg);
  P("text", { x: x(front), y: 24, "text-anchor": "middle", class: "note" }, svg).textContent = F.fix(front, 2);
  P("text", { x: (x(2) + x(front)) / 2, y: 58, "text-anchor": "middle", class: "note" }, svg).textContent = t("dom.solide");
  P("text", { x: (x(front) + x(14)) / 2, y: 58, "text-anchor": "middle", class: "note" }, svg).textContent = t("dom.libre");
  P("text", { x: x(14), y: 104, "text-anchor": "end", class: "tick" }, svg).textContent = t("dom.axe");
})();

/* ---------- dosage de Mohr : pAg le long du dosage ---------- */
(() => {
  const V0 = 20e-3, cCl = 0.01, cAg = 0.01, svg = $("mohr"), sv = $("vv"), sc = $("cr");
  const etat = (V, cr, g = [1, 1]) => { const Vt = V0 + V;               // g: Davies γ of charge 1 and 2, folded into Ks
    return Object.assign(C.partage(cAg * V / Vt, [{ sel: "AgCl", c: cCl * V0 / Vt, pKs: C.SELS.AgCl.pKs + 2 * Math.log10(g[0]) },
      { sel: "Ag2CrO4", c: cr * V0 / Vt, pKs: C.SELS.Ag2CrO4.pKs + Math.log10(g[0] * g[0] * g[1]) }]), { Vt }); };
  const rouge = (cr, g) => { let lo = 1e-6, hi = 40e-3;                  // first volume where Ag2CrO4 exists
    for (let k = 0; k < 60; k++) { const m = (lo + hi) / 2; if (etat(m, cr, g).sels.Ag2CrO4.solide > 0) hi = m; else lo = m; } return hi; };
  const qfmt = q => q >= 0.01 ? F.num(q, 3) : F.sci(q, 2);
  const Veq = cCl * V0 / cAg;
  function draw() {
    const V = +sv.value * 1e-3, cr = Math.pow(10, +sc.value), Vr = rouge(cr);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 52 },
      x: { scale: "lin", domain: [0, 30], label: t("mohr.x") }, y: { scale: "lin", domain: [2, 9], label: t("mohr.y") } });
    const pts = [];
    for (let i = 1; i <= 300; i++) { const v = i * 0.1, p = -Math.log10(etat(v * 1e-3, cr).M); if (p >= 2 && p <= 9) pts.push([o.x(v), o.y(p)]); }
    P("path", { d: Plot.path(pts), class: "stroke c-tint" }, o.g);
    P("line", { x1: o.x(Veq * 1e3), x2: o.x(Veq * 1e3), y1: o.y(2), y2: o.y(9), class: "stroke thin c-label-2" }, o.g);
    P("line", { x1: o.x(Vr * 1e3), x2: o.x(Vr * 1e3), y1: o.y(2), y2: o.y(9), class: "stroke dash c-warn" }, o.g);
    const e = etat(V, cr), pAg = -Math.log10(e.M);
    P("circle", { cx: o.x(V * 1e3), cy: o.y(Math.max(2, Math.min(9, pAg))), r: 5, class: "fill c-tint" }, o.g);
    const qCl = e.sels.AgCl.solide > 0 ? 1 : C.saturation("AgCl", { "Ag^+": e.M, "Cl^-": e.sels.AgCl.libre });
    const qCr = C.saturation("Ag2CrO4", { "Ag^+": e.M, "CrO4^2-": e.sels.Ag2CrO4.libre });
    $("vvv").textContent = F.qty(F.fix(V * 1e3, 2), "mL");
    $("crv").textContent = conc(cr);
    $("vpag").textContent = F.fix(pAg, 2); $("fpag").textContent = conc(e.M);
    $("vagcl").textContent = qfmt(qCl); $("fagcl").textContent = t("mohr.f.solide", { n: F.si(e.sels.AgCl.solide * e.Vt, "mol", { sig: 3 }) });
    $("vcro4").textContent = qfmt(Math.min(qCr, 1));
    $("fcro4").textContent = qCr >= 1 ? t("mohr.f.solide", { n: F.si(e.sels.Ag2CrO4.solide * e.Vt, "mol", { sig: 3 }) }) : t("mohr.f.aucun");
    $("verr").textContent = F.qty(F.fix(Vr * 1e3, 3), "mL");
    $("ferr").textContent = t("mohr.f.err", { e: F.qty((Vr >= Veq ? "+" : F.MINUS) + F.fix(Math.abs(100 * (Vr / Veq - 1)), 2), "%") });
    const ions = { "Na^+": cCl * V0 / e.Vt, "Cl^-": e.sels.AgCl.libre, "K^+": 2 * cr * V0 / e.Vt, "CrO4^2-": e.sels.Ag2CrO4.libre, "NO3^-": cAg * V / e.Vt, "Ag^+": e.M };
    const Ii = C.ionique(ions), g1 = C.davies(1, Ii), g2 = C.davies(2, Ii), Vg = rouge(cr, [g1, g2]);
    $("sys").innerHTML = t("sys.inner", { I: conc(Ii), g1: F.fix(g1, 3), g2: F.fix(g2, 3), f1: F.fix(1 / (g1 * g1), 2), f2: F.fix(1 / (g1 * g1 * g2), 2),
      v: F.qty(F.fix(Vr * 1e3, 3), "mL"), vg: F.qty(F.fix(Vg * 1e3, 3), "mL") });
  }
  sv.oninput = sc.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mohr", 1856, "experiment"], ["guldberg", 1864, "idea"], ["nernst", 1889, "idea"], ["debye", 1923, "idea"], ["davies", 1938, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["eaux", "baryte"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text
    .replace("{s}", conc(C.solubiliteEau("BaSO4")))}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["chromate", "b"], ["melange", "c"], ["solide", "a"], ["ordre", "d"], ["activite", "b"], ["domaine", "a"], ["temperature", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 9741 });
})();
</script>
