      <div class="panel">
        <div class="seg" role="group" id="iv">
          <button type="button" data-i="unisson" data-i18n="co.unisson"></button>
          <button type="button" data-i="tierceMineure" data-i18n="co.tierceMineure"></button>
          <button type="button" data-i="tierceMajeure" data-i18n="co.tierceMajeure"></button>
          <button type="button" data-i="quarte" data-i18n="co.quarte"></button>
          <button type="button" data-i="quinte" data-i18n="co.quinte"></button>
          <button type="button" data-i="sixteMajeure" data-i18n="co.sixteMajeure"></button>

    <h2 data-i18n="s3.h2"></h2>

    <div class="eq"><math display="block"><msub><mi>f</mi><mi>k</mi></msub><mo>=</mo><msub><mi>f</mi><mn>0</mn></msub><mo>×</mo><msup><mn>2</mn><mrow><mi>k</mi><mo>/</mo><mn>12</mn></mrow></msup></math></div>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const O = self.Ondes;
/* joue une suite de morceaux s(t), chacun normé, bout à bout (Ondes.jouer) ; msg : l'élément qui affiche l'état */
const jouer = (morceaux, duree, msg, texte) => { msg.textContent = O.jouer(morceaux, duree) ? texte : t("au.none"); };

/* ---------- §50-3 : un orgue à huit harmoniques de 220 Hz ; les registres fixent les amplitudes, les phases se brouillent ---------- */
(() => {
  const F0 = 220, NH = 8, M = 800, TS = Array.from({ length: M + 1 }, (_, i) => 2 * i / (M * F0));
  const REG = { pur: n => (n === 1 ? 1 : 0), scie: n => 1 / n, impairs: n => (n % 2 ? 1 / n : 0), creux: n => (n === 1 ? 1 : n <= 3 ? 0 : 1 / n) };
  let reg = "scie", phi = Array(NH).fill(0), graine = 1;
  const amps = () => Array.from({ length: NH }, (_, i) => (i === 1 ? +$("a2").value : i === 2 ? +$("a3").value : REG[reg](i + 1)));
  function upd() {
    const A = amps(), H = O.harmoniques(F0, A, phi), H0 = O.harmoniques(F0, A);
    const svg = $("og"); svg.innerHTML = "";
    const ym = Math.max(1, Math.ceil(H0.crete() * 2) / 2);
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 200, pad: { l: 52, b: 44 }, x: { domain: [0, 2000 / F0], label: t("og.xaxis") }, y: { domain: [-ym, ym], label: t("og.yaxis") } });
    Plot.el("path", { d: Plot.path(TS.map(x => [P.x(1000 * x), P.y(H.s(x))])), class: "stroke c-tint" }, P.g);
    const bs = $("os"); bs.innerHTML = "";
    const B = Plot.axes(bs, { fmt: F, w: 640, h: 150, pad: { l: 52, b: 44 }, x: { domain: [0.4, NH + 0.6], label: t("os.xaxis"), ticks: NH }, y: { domain: [0, 1.1], label: t("os.yaxis") } });
    for (let n = 1; n <= NH; n++) { const v = A[n - 1], w = (B.x(1) - B.x(0)) * 0.6;
      Plot.el("rect", { x: B.x(n) - w / 2, y: B.y(v), width: w, height: Math.max(0, B.y(0) - B.y(v)), class: "fill c-tint" }, B.g); }
    $("a2v").textContent = F.num(A[1], 2); $("a3v").textContent = F.num(A[2], 2);
    $("reg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.r === reg)));
    $("vpw").textContent = F.num(H.puissance, 3); $("fpw").textContent = t("og.f.p");
    $("vcr").textContent = F.num(H.crete(), 3); $("fcr").textContent = t("og.f.c", { c: F.num(H0.crete(), 3) });
  }
  function choisir(r) { reg = r; $("a2").value = REG[r](2); $("a3").value = REG[r](3); upd(); }
  $("reg").querySelectorAll("button").forEach(x => x.onclick = () => choisir(x.dataset.r));
  ["a2", "a3"].forEach(id => $(id).oninput = upd);
  $("brouiller").onclick = () => { graine += 1; phi = O.bruit(NH, graine).map(v => Math.PI * v); upd(); };
  $("aligner").onclick = () => { phi = Array(NH).fill(0); upd(); };
  $("play").onclick = () => {
    const A = amps(), ph = O.bruit(NH, graine + 100).map(v => Math.PI * v);
    jouer([O.harmoniques(F0, A).s, O.harmoniques(F0, A, ph).s], 1.5, $("aumsg"), t("au.playing"));
  };
  choisir("scie");
})();

/* ---------- §50-3 : deux notes, leurs dix premiers harmoniques, les paires qui coïncident ou battent ---------- */
(() => {
  const F1 = 220, NH = 10, SEUIL = 40, FMAX = 2400;
  let iv = "quinte", acc = "juste";
  /* le triton n'a pas de rapport juste simple : 2^(6/12) = √2 dans les deux accords */
  const rapport = () => (iv === "triton" ? O.tempere(6)
    : acc === "juste" ? O.INTERVALLES[iv].p / O.INTERVALLES[iv].q : O.tempere(O.INTERVALLES[iv].k));
  function upd() {
    const r = rapport(), f2 = F1 * r, C = O.consonance(F1, f2, NH, SEUIL);
    const svg = $("co"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 230, pad: { l: 52, b: 44 }, x: { domain: [0, FMAX], label: t("co.xaxis") }, y: { domain: [-1.3, 1.3], label: t("co.yaxis") } });
    for (let n = 1; n <= NH; n++) {
      if (n * F1 <= FMAX) Plot.el("line", { x1: P.x(n * F1), x2: P.x(n * F1), y1: P.y(0), y2: P.y(1 / Math.sqrt(n)), class: "stroke bold c-tint" }, P.g);
      if (n * f2 <= FMAX) Plot.el("line", { x1: P.x(n * f2), x2: P.x(n * f2), y1: P.y(0), y2: P.y(-1 / Math.sqrt(n)), class: "stroke bold c-label-2" }, P.g);
    }
    for (const x of C.paires) if (x.f <= FMAX) {
      Plot.el("line", { x1: P.x(x.f), x2: P.x(x.m * f2), y1: P.y(1.15), y2: P.y(-1.15), class: "stroke dash c-warn" }, P.g);
      const lb = Plot.el("text", { x: P.x(x.f), y: P.y(1.2), "text-anchor": "middle", class: "note" }, P.g);
      lb.textContent = x.battement === 0 ? "0" : F.si(x.battement, "Hz", { prefix: "" });
    }
    const lent = C.battements.length ? C.battements.reduce((a, b) => (b.battement < a.battement ? b : a)) : null;
    $("iv").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.i === iv)));
    $("ac").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.a === acc)));
    $("vr").textContent = F.num(r, 5); $("fr").textContent = t("co.f.r", { f: F.si(f2, "Hz", { prefix: "" }) });
    $("vc").textContent = F.num(O.cents(r), 4); $("fc").textContent = t("co.f.c", { n: C.coincidences.length });
    $("vb").textContent = lent ? F.si(lent.battement, "Hz", { prefix: "" }) : "–";
    $("fb").textContent = lent ? t("co.f.b", { n: lent.n, m: lent.m }) : t("co.f.aucun");
  }
  $("iv").querySelectorAll("button").forEach(x => x.onclick = () => { iv = x.dataset.i; upd(); });
  $("ac").querySelectorAll("button").forEach(x => x.onclick = () => { acc = x.dataset.a; upd(); });
  $("play2").onclick = () => {
    const A = Array.from({ length: 6 }, (_, i) => 1 / (i + 1)), a = O.harmoniques(F1, A).s, b = O.harmoniques(F1 * rapport(), A).s;
    jouer([tt => a(tt) + b(tt)], 3, $("aumsg2"), t("au.playing2", { r: F.num(rapport(), 5) }));
  };
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["zhu", 1584, "idea"], ["helmholtz", 1863, "idea"], ["hammond", 1935, "experiment"], ["plomp", 1965, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tirettes", "accordage"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["timbre", "c"], ["phases", "a"], ["coincide", "d"], ["piano", "b"], ["quinte", "c"], ["tierce", "a"], ["pur", "b"], ["accord", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 503 });
})();
</script>
