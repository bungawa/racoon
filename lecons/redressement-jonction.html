<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/quantique-schrodinger.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes;

/* ---------- the characteristic of a junction ---------- */
(() => {
  const svg = $("fig"), sv = $("sv"), si0 = $("si0"), st = $("st");
  function draw() {
    const dV = +sv.value, I0 = Math.pow(10, +si0.value), T = +st.value, I = Q.courantDiode(I0, dV, T);
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 64, b: 44 }, x: { domain: [-0.4, 0.8], label: t("fig.xaxis") }, y: { domain: [-2, 10], label: t("fig.yaxis") } });
    const pts = [];
    for (let i = 0; i <= 400; i++) { const v = -0.4 + 1.2 * i / 400, c = Q.courantDiode(I0, v, T) * 1e3; if (c <= 10) pts.push([G.x(v), G.y(c)]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke c-label" }, G.g);
    const Im = I * 1e3;
    if (Im <= 10) Plot.el("circle", { cx: G.x(dV), cy: G.y(Math.max(-2, Im)), r: 5, class: "fill c-warn" }, G.g);
    $("svr").textContent = F.si(dV, "V");
    $("si0r").textContent = F.si(I0, "A");
    $("str").innerHTML = F.kelvin(T);
    $("vi").textContent = F.si(I, "A");
    $("fi").textContent = t(dV > 0 ? "fig.f.direct" : dV < 0 ? "fig.f.inverse" : "fig.f.zero");
    const a = Math.abs(dV) < 1e-9 ? 0.1 : Math.abs(dV);
    $("vr").textContent = F.sci(Q.courantDiode(I0, a, T) / -Q.courantDiode(I0, -a, T), 2);
    $("fr").textContent = t("fig.f.r", { v: F.si(a, "V") });
    const rd = K.k_B * T / (K.e * (I + I0));
    $("vd").textContent = F.si(rd, "Ω");
    $("fd").textContent = t("fig.f.rd");
  }
  sv.oninput = draw; si0.oninput = draw; st.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const kT = K.k_B * 300 / K.e;
  $("sys1").innerHTML = t("sys1.body", { kT: F.si(kT, "V"), dec: F.si(kT * Math.LN10, "V"), i: F.si(Q.courantDiode(1e-13, 0.6, 300), "A") });
  const I0a = 1e-13, I0b = 1e-13 * Math.pow(400 / 300, 3) * Math.exp(Q.SEMI.Si.Eg / K.k_B * (1 / 300 - 1 / 400));
  $("sys2").innerHTML = t("sys2.body", { r: F.sci(I0b / I0a, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mott", 1939, "idea"], ["ohl", 1941, "use"], ["scaff", 1947, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["alimentation"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["direct", "c"], ["inverse", "a"], ["minoritaires", "d"], ["decade", "b"], ["chaud", "c"], ["cliquet", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1405 });
})();
</script>
