<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, alea = Q.aleaGraine(423), TIRAGES = 2000;
const proba = p => p < 1e-3 ? F.sci(p, 2) : F.num(p, 3);

/* ---------- N particles into M states, one by one: weights n_i + 1 (bosons) or 1 ---------- */
(() => {
  const svg = $("histo"), sM = $("sM"), sN = $("sN");
  function draw() {
    const M = +sM.value, N = +sN.value, hb = new Array(N + 1).fill(0), hd = new Array(N + 1).fill(0);
    for (let i = 0; i < TIRAGES; i++) { hb[Q.remplirEtats(M, N, alea)[0]]++; hd[Q.remplirEtats(M, N, alea, "discernables")[0]]++; }
    const eb = [], ed = [];
    for (let k = 0; k <= N; k++) { eb.push(Q.loiOccupation(M, N, k)); ed.push(Q.loiOccupation(M, N, k, "discernables")); }
    const top = Math.max(...eb, ...ed, ...hb.map(v => v / TIRAGES), ...hd.map(v => v / TIRAGES)) * 1.1;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { domain: [-0.5, N + 0.5], label: t("fig.x"), ticks: Math.min(N + 1, 10) }, y: { domain: [0, top], label: t("fig.y") } });
    const w = Math.min(14, (o.x(1) - o.x(0)) * 0.38);
    for (let k = 0; k <= N; k++) {
      const x = o.x(k);
      Plot.el("rect", { x: x - w, y: o.y(hb[k] / TIRAGES), width: w, height: o.y(0) - o.y(hb[k] / TIRAGES), class: "fill c-ok" }, o.g);
      Plot.el("rect", { x, y: o.y(hd[k] / TIRAGES), width: w, height: o.y(0) - o.y(hd[k] / TIRAGES), class: "fill c-tint" }, o.g);
      Plot.el("circle", { cx: x - w / 2, cy: o.y(eb[k]), r: 3, class: "fill c-label" }, o.g);
      Plot.el("circle", { cx: x + w / 2, cy: o.y(ed[k]), r: 3, class: "fill c-label" }, o.g);
    }
    const te = Q.tousEnsemble(M, N);
    $("sMr").textContent = F.num(M, 3);
    $("sNr").textContent = F.num(N, 3);
    $("vv").textContent = proba(eb[0]);
    $("fv").textContent = t("fig.f.vide", { d: proba(ed[0]) });
    $("vt").textContent = proba(te.bose);
    $("ft").textContent = t("fig.f.tous", { d: proba(te.discernables), r: F.num(te.rapport, 3), f: F.num(te.factorielle, 4) });
  }
  sM.oninput = sN.oninput = $("tirer").onclick = draw; draw();
})();

/* ---------- the system described: small probabilities, many states ---------- */
(() => {
  const p = 1e-3, n = 5, r = Q.coincidencesBose(new Array(n).fill(p));
  $("sys1").innerHTML = t("sys1.body", { d: F.sci(r.differentes, 2), b: F.sci(r.bose, 2), f: F.num(r.rapport, 3), lim: F.num(1 / p, 3) });
  const a = Q.tousEnsemble(1000, n), b = Q.tousEnsemble(30, n);
  $("sys2").innerHTML = t("sys2.body", { ra: F.num(a.rapport, 4), rb: F.num(b.rapport, 3), f: F.num(a.factorielle, 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bose", 1924, "idea"], ["einstein", 1925, "idea"], ["jila", 1995, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cal"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["trois", "b"], ["ajout", "d"], ["indep", "a"], ["division", "c"], ["moyenne", "b"], ["limite", "a"], ["foule", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 443 });
})();
</script>
