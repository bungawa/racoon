<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const El = Elasticite, T = Tenseurs;
const ms = v => F.qty(F.num(v, 4), "m·s⁻¹");

/* ---------- vitesses selon la direction : Christoffel sur le tenseur d'ordre 4 ---------- */
(() => {
  const svg = $("polaire"), O = [190, 180], R = 160, N = 180;
  const milieu = id => {
    if (id === "acier") { const m = El.MATERIAUX.acier, c = El.constantesIsotropes(m.E, m.nu); return { C: T.isotrope4(c.lambda, c.mu), rho: m.rho, z: El.zener(c.C11, c.C12, c.C44) }; }
    const c = El.CRISTAUX[id];
    return { C: T.cubique4(c.C11, c.C12, c.C44), rho: c.rho, z: El.zener(c.C11, c.C12, c.C44) };
  };
  const dir = (plan, th) => plan === "001" ? [Math.cos(th), Math.sin(th), 0]
    : [Math.sin(th) / Math.SQRT2, Math.sin(th) / Math.SQRT2, Math.cos(th)];        // from [001] (θ = 0) towards [110] (θ = 90°)
  const ROT = { "001": [["[100]", 0], ["[110]", 45], ["[010]", 90]], "110": [["[001]", 0], ["[111]", 54.7356], ["[110]", 90]] };
  function upd() {
    const md = milieu($("mat").value), plan = $("plan").value, th = +$("th").value * Math.PI / 180;
    $("thv").textContent = F.qty(F.fix(+$("th").value, 0), "°");
    const curves = [[], [], []], vs = [];
    for (let k = 0; k <= N; k++) { const a = 2 * Math.PI * k / N, w = El.vitesses(md.C, md.rho, dir(plan, a)).v; vs.push(w); }
    const vmax = Math.max(...vs.map(w => w[0])) * 1.05, sc = R / vmax;
    svg.innerHTML = "";
    for (const f of [0.25, 0.5, 0.75, 1]) P("circle", { cx: O[0], cy: O[1], r: (R * f).toFixed(1), class: "stroke thin dash c-label-2" }, svg);
    for (const f of [0.5, 1]) P("text", { x: O[0] + 4, y: (O[1] - R * f + 12).toFixed(1), class: "tick" }, svg).textContent = ms(vmax * f);
    vs.forEach((w, k) => { const a = 2 * Math.PI * k / N; w.forEach((v, b) => curves[b].push([O[0] + sc * v * Math.cos(a), O[1] - sc * v * Math.sin(a)])); });
    [["c-tint", 0], ["c-warn", 1], ["c-label-2", 2]].forEach(([cls, b]) => P("path", { d: Plot.path(curves[b]) + "Z", class: "stroke " + cls }, svg));
    ROT[plan].forEach(([lab, deg]) => {
      const a = deg * Math.PI / 180, x = O[0] + (R + 14) * Math.cos(a), y = O[1] - (R + 14) * Math.sin(a);
      P("text", { x: x.toFixed(1), y: y.toFixed(1), "text-anchor": "middle", class: "tick" }, svg).textContent = lab;
    });
    const w = El.vitesses(md.C, md.rho, dir(plan, th)), n = dir(plan, th);
    Plot.fleche(svg, O, [O[0] + R * Math.cos(th), O[1] - R * Math.sin(th)], { cls: "c-label-2" });
    w.v.forEach((v, b) => P("circle", { cx: (O[0] + sc * v * Math.cos(th)).toFixed(1), cy: (O[1] - sc * v * Math.sin(th)).toFixed(1), r: 4, class: ["fill c-tint", "fill c-warn", "fill c-label-2"][b] }, svg));
    const pol = Math.acos(Math.min(1, Math.abs(T.scalaire(w.polarisations[0], n)))) * 180 / Math.PI;
    const P0 = vs.map(x => x[0]), ani = Math.max(...P0) / Math.min(...P0);
    $("vv").textContent = t("po.v.v", { p: ms(w.v[0]), s1: ms(w.v[1]), s2: ms(w.v[2]) });
    $("fv").textContent = t("po.f.v");
    $("vpol").textContent = F.qty(F.fix(pol, 1), "°");
    $("fpol").textContent = t(pol < 0.05 ? "po.f.pur" : "po.f.quasi");
    $("vani").textContent = F.fix(ani, 3);
    $("fani").textContent = t("po.f.ani");
    $("vzen").textContent = F.fix(md.z, 2);
    $("fzen").textContent = t(Math.abs(md.z - 1) < 1e-9 ? "po.f.iso" : "po.f.zener");
    // the free text on the right: the three speeds along the cube axes, as (39.38)–(39.39) would give them
    const x0 = 400;
    P("text", { x: x0, y: 40, class: "label" }, svg).textContent = t("po.t.titre");
    w.v.forEach((v, b) => P("text", { x: x0, y: 70 + 24 * b, class: ["c-tint", "c-warn", "c-label-2"][b] }, svg).textContent = t("po.t." + b, { v: ms(v) }));
    P("text", { x: x0, y: 160, class: "tick" }, svg).textContent = t("po.t.rho", { rho: F.qty(F.num(md.rho, 4), "kg·m⁻³") });
  }
  $("mat").onchange = $("plan").onchange = upd; $("th").oninput = upd;
  upd();
})();

const EVENTS = [["brewster", 1816, "experiment"], ["navier", 1821, "idea"], ["oldham", 1900, "experiment"], ["coker", 1931, "use"]];
const USES = ["sismo", "ultrasons", "verre"];
const QS = [["uniforme", "a"], ["acier", "b"], ["volume", "c"], ["rapport", "d"], ["liquide", "a"], ["fer", "b"], ["grains", "c"]];

/* ---------- histoire ---------- */
(() => {
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
