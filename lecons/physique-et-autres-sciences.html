<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La physique et les autres sciences</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-panorama" data-i18n="monde.panorama"></a><span class="aux">›</span><a href="/racoon/etape?id=physique-et-sciences" data-i18n="etape.physique-et-sciences"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/atomes-en-mouvement" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n="s1.p1"></p>
    <p data-i18n="s1.p2"></p>
    <div class="box def"><b data-i18n="s1.def.title"></b>
      <p data-i18n-html="s1.def.body"></p>
    </div>
    <p data-i18n="s1.p3"></p>
    <div class="box rem"><b data-i18n="s1.rem.title"></b>
      <p data-i18n-html="s1.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure class="chart">
      <svg id="map" class="fig" role="img" data-i18n-attr="aria-label:map.aria"></svg>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="lsl" data-i18n="map.size"></label><output id="lread" for="lsl"></output></div>
          <input id="lsl" type="range" min="-15.5" max="26.9" step="0.1" value="0.2"></div>
        <div class="controls">
          <button class="btn" type="button" id="prev" data-i18n="map.prev"></button>
          <button class="btn" type="button" id="next" data-i18n="map.next"></button>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="stat.objet"></span><span class="v" id="vobj"></span><span class="f" id="fobj"></span></div>
          <div class="stat"><span class="k" data-i18n="stat.force"></span><span class="v" id="vforce"></span></div>
          <div class="stat"><span class="k" data-i18n="stat.atomes"></span><span class="v" id="vatomes"></span></div>
        </div>
      </div>
      <div class="list keyed" id="disc"></div>
      <figcaption data-i18n-html="map.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq">
      <math display="block"><msub><mi>R</mi><mi mathvariant="normal">p</mi></msub><mo>≈</mo><msqrt><mfrac><mrow><mn>2</mn><msub><mi>σ</mi><mi mathvariant="normal">y</mi></msub></mrow><mrow><mi>π</mi><mi>G</mi><msup><mi>ρ</mi><mn>2</mn></msup></mrow></mfrac></msqrt></math>
    </div>
    <p class="validite" data-i18n="eq1.validite"></p>
    <p data-i18n-html="s2.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n="s3.p1"></p>
    <div class="list keyed" id="adds"></div>
    <div class="box warn"><b data-i18n="s3.warn.title"></b>
      <p data-i18n-html="s3.warn.body"></p>
    </div>
    <p data-i18n="s3.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/physique-et-autres-sciences.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/physique-sciences.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const $ = id => document.getElementById(id);
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));

/* ---------- §3-1 : carte des échelles ---------- */
(() => {
  const OBJ = textOf("map.objects", Sciences.OBJECTS.map(o => o.id)), DISC = textOf("map.disciplines", Sciences.DISCIPLINES.map(d => d.id));
  const FORCE = textOf("map.forces", ["forte", "electromagnetique", "gravite"]), QUEST = textOf("map.questions", Sciences.DISCIPLINES.map(d => d.id));
  const rows = Sciences.DISCIPLINES.map(d => d.id), n = rows.length;
  const { x, y, g } = Plot.axes($("map"), { fmt: F, w: 640, h: 330, pad: { l: 92, b: 40 },
    x: { scale: "log", domain: [1e-16, 1e27], label: t("map.x"), fmt: v => { const e = Math.round(Math.log10(v)); return e % 5 ? "" : "10" + F.sup(e); } },
    y: { domain: [-1.5, n - 0.5], ticks: n + 1, fmt: v => v < 0 ? t("map.row.objets") : DISC[rows[n - 1 - v]] } });
  const band = Sciences.DISCIPLINES.map((d, i) => Plot.el("rect", { x: x(d.from), width: x(d.to) - x(d.from), y: y(n - 1 - i + 0.35), height: y(0) - y(0.7), rx: 6, class: "area" }, g));
  const dots = Sciences.OBJECTS.map(o => Plot.el("circle", { cx: x(o.L), cy: y(-1), r: 4, class: "dot" }, g));
  const cursor = Plot.el("line", { y1: y(n - 0.5), y2: y(-1.5), class: "ref" }, g);
  const lsl = $("lsl");
  const upd = () => {
    const L = Math.pow(10, +lsl.value), o = Sciences.nearest(L), act = Sciences.active(L);
    $("lread").textContent = F.si(L, "m", { sig: 2 });
    cursor.setAttribute("x1", x(L)); cursor.setAttribute("x2", x(L));
    band.forEach((b, i) => b.setAttribute("class", act.includes(rows[i]) ? "dot" : "area"));
    dots.forEach((d, i) => d.setAttribute("r", Sciences.OBJECTS[i] === o ? 8 : 4));
    $("vobj").textContent = OBJ[o.id];
    $("fobj").textContent = t("map.objsize", { L: F.si(o.L, "m", { sig: 3 }) });
    $("vforce").textContent = FORCE[Sciences.regime(L)];
    $("vatomes").textContent = L >= Sciences.ATOM ? F.sci(Sciences.atomsAcross(L), 2) : t("map.subatom");
    $("disc").innerHTML = act.map(id => `<div><span class="k">${DISC[id]}</span><span>${QUEST[id]}</span></div>`).join("");
  };
  const jump = s => { const L = Math.pow(10, +lsl.value), i = Sciences.OBJECTS.indexOf(Sciences.nearest(L)), j = Math.max(0, Math.min(Sciences.OBJECTS.length - 1, i + s));
    lsl.value = Math.log10(Sciences.OBJECTS[j].L).toFixed(1); upd(); };
  $("prev").onclick = () => jump(-1); $("next").onclick = () => jump(1);
  lsl.oninput = upd; upd();
})();

/* ---------- §3-1 : ce que chaque science ajoute ---------- */
(() => {
  const IDS = ["chimie", "biologie", "astronomie", "geologie", "psychologie"], adds = textOf("adds.items", IDS);
  $("adds").innerHTML = IDS.map(id => `<div><span class="k">${adds[id].name}</span><span>${adds[id].text}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wohler", 1828, "experiment"], ["mayer", 1842, "idea"], ["dirac", 1929, "idea"], ["anderson", 1972, "idea"],
    ["patate", 2010, "idea"], ["multi", 2013, "use"], ["alphafold", 2024, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["medicament", "proteine"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["fondement", "a"], ["maths", "b"], ["echecs", "c"], ["patate", "a"], ["echelle", "d"], ["anderson", "b"], ["vivant", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 3 });
})();
</script>
</body>
</html>
