  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>

    <figure class="chart">
      <svg class="fig" id="diag" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="sq c-warn" data-i18n="fig.legend.cones"></span><span class="c-tint" data-i18n="fig.legend.present"></span><span class="c-ok" data-i18n="fig.legend.p"></span></div>
      <div class="panel">

            <button type="button" data-c="soleil" data-i18n="fig.c.soleil"></button>

          </div>
          <div class="ctl"><div class="row"><label for="sb" data-i18n="fig.beta"></label><output id="sbr" for="sb"></output></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/fmt.js"></script>

<script src="/racoon/relativite.js"></script>
<script src="/racoon/minkowski.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, M = Minkowski, C = R.c, Cst = Constantes;
const sec = v => F.si(v, "s");

/* ---------- autour de O : trois régions ; P à déplacer, un observateur à u ---------- */
(() => {
  const svg = $("diag"), sb = $("sb"), seg = $("cas");
  /* each case: the diagram unit (m) and P in that unit. Soleil: the Sun « now », 1 au away. LIGO: Livingston is O,
     Hanford 3002 km away receives the same wave 6,9 ms later (GW150914). */
  const CAS = {
    labo: { u: 1, P: [3, 5] },
    soleil: { u: Cst.au, P: [1, 0] },
    ligo: { u: 1e6, P: [3.002, C * 6.9e-3 / 1e6] },
  };
  let cas = "labo", P = CAS.labo.P.slice(), c = null;
  function draw() {
    const b = +sb.value / 100, U = CAS[cas].u, e = { t: P[1] * U / C, x: P[0] * U };
    const L = cas === "labo" ? 10 : 5;
    c = M.cadre(svg, { W: 420, H: 420, x0: -L, x1: L, t0: -L, t1: L, pad: 10 });
    M.cones(c, [0, 0], { cls: "c-warn" });
    const lab = t("fig.unit." + cas);
    M.fond(c, { x: t("fig.ax.x", { u: lab }), t: t("fig.ax.ct", { u: lab }), pas: cas === "labo" ? 2 : 1 });
    M.repere(c, b, { x: t("fig.ax.present"), t: t("fig.ax.ctp") });
    /* the news of P reaches x = 0 by light at ct = ctP + |xP| */
    const arr = [0, P[1] + Math.abs(P[0])];
    const g = c.layer("c-warn"); M.chemin(c, [P, arr], "stroke dash", g);
    M.point(c, P, 6, "c-ok", t("fig.ax.p")); M.point(c, [0, 0], 4, "c-label", t("fig.ax.o"));
    const reg = R.region(e, 1e-9), tp = R.lorentz(e, b * C).t, us = R.vitesseSimultanee(e);
    $("sbr").textContent = t("fig.beta.v", { b: F.num(b, 2) });
    $("vr").textContent = t("fig.r." + reg);
    $("fr").textContent = t("fig.rf." + reg);
    $("vd").textContent = sec(Math.abs(tp) < 1e-15 ? 0 : tp);
    $("fd").textContent = t(Math.abs(tp) < 1e-15 ? "fig.d.meme" : tp > 0 ? "fig.d.apres" : "fig.d.avant", { t: sec(e.t) });
    $("vs").textContent = us === null ? t("fig.s.aucun") : t("fig.s.u", { u: F.num(us / C, 3) });
    $("fs").textContent = t(us === null ? "fig.s.f.aucun" : "fig.s.f.u");
    $("vn").textContent = sec(arr[1] * U / C);
    $("fn").textContent = t("fig.n.f", { d: F.si(Math.abs(e.x), "m") });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.c === cas)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { cas = x.dataset.c; P = CAS[cas].P.slice(); draw(); });
  M.glisser(svg, () => c, ([x, ct]) => {
    const L = c.box.x1 * 0.95;
    x = Math.max(-L, Math.min(L, x)); ct = Math.max(-L, Math.min(L, ct));
    if (Math.abs(Math.abs(x) - Math.abs(ct)) < 0.015 * c.box.x1) ct = Math.sign(ct || 1) * Math.abs(x);
    P = [+x.toFixed(3), +ct.toFixed(3)]; draw();
  });
  sb.oninput = draw; draw();
})();

/* ---------- le système décrit : le Soleil et Alpha du Centaure « maintenant » ---------- */
(() => {
  const u = 3e4, dS = Cst.au, dA = 4.37 * 365.25 * 86400 * C;     // Alpha Centauri A and B: 4,37 years of light
  $("sys1").innerHTML = t("sys1.body", { dS: F.qty(F.sci(dS, 4), "m"), tS: sec(dS / C), u: F.si(u, "m·s⁻¹"), b2: F.sci((u / C) ** 2, 1),
    sS: F.si(u * dS / (C * C), "s", { prefix: "m" }), dA: F.qty(F.sci(dA, 2), "m"), sA: F.qty(F.num(u * dA / (C * C) / 3600, 2), "h") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["romer", 1676, "experiment"], ["henderson", 1839, "experiment"], ["gw150914", 2015, "experiment"], ["gw170817", 2017, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ligo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["passe", "a"], ["soleil", "c"], ["ordre", "b"], ["futur", "d"], ["etoile", "a"], ["ligo", "c"], ["voyant", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1703 });
})();
</script>
