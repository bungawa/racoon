<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Q = -Constantes.e, HB = Constantes.hbar;                               // an electron
const U = 50e3, L = 1, d = 2e-6, s = 4e-7, w = 1e-5, LB = M.longueurOndeReduite(U);       // V, m, m, m, m

/* ---------- l'écran : flux enfermé (franges seules) ou bande de champ (tout le motif) ---------- */
(() => {
  const svg = $("ecran"), sf = $("sf"), sb = $("sb"), X = 20e-6;
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 },
    x: { domain: [-20, 20], label: t("fig.x") }, y: { domain: [0, 1.05], label: t("fig.y") } });
  const pe = Plot.el("path", { class: "stroke thin dash c-label-2" }, g), pi = Plot.el("path", { class: "stroke c-tint" }, g);
  const z0 = Plot.el("line", { y1: y(0), y2: y(1.05), class: "stroke thin c-warn" }, g);
  let mode = "sol";
  function draw() {
    const fluxQ = +sf.value, B = +sb.value * 1e-6, flux = fluxQ * M.quantumFlux();
    const o = mode === "sol" ? { L, d, s, lambdabar: LB, phi: M.phaseMagnetique(Q, flux) } : { L, d, s, lambdabar: LB, alpha: -Q * B * w * LB / HB };
    const fr = M.franges(o), env = u => { const v = s * (u / L - (o.alpha || 0)) / (2 * LB); return Math.abs(v) < 1e-9 ? 1 : (Math.sin(v) / v) ** 2; };
    let di = "", de = "";
    for (let i = 0; i <= 600; i++) { const u = -X + 2 * X * i / 600, px = x(u * 1e6).toFixed(1);
      di += (i ? "L" : "M") + px + " " + y(fr.intensite(u)).toFixed(1); de += (i ? "L" : "M") + px + " " + y(env(u)).toFixed(1); }
    pi.setAttribute("d", di); pe.setAttribute("d", de);
    const xc = fr.decalageFranges;                                                         // the central bright fringe, followed
    z0.setAttribute("x1", x(xc * 1e6)); z0.setAttribute("x2", x(xc * 1e6));
    sf.disabled = mode !== "sol"; sb.disabled = mode === "sol";
    $("sfr").textContent = t("fig.v.flux", { n: F.num(fluxQ, 3), v: F.si(flux, "Wb") });
    $("sbr").textContent = t("fig.v.b", { b: F.si(B, "T"), w: F.si(w, "m") });
    $("vp").textContent = t("fig.v.rad", { p: F.num(fr.phi, 3) });
    $("fp").textContent = t("fig.f.phase", { n: F.num(fr.phi / (2 * Math.PI), 3) });
    $("vf").textContent = F.si(xc, "m");
    $("ff").textContent = t("fig.f.franges", { i: F.si(fr.interfrange, "m") });
    $("ve").textContent = F.si(fr.decalageEnveloppe, "m");
    $("fe").textContent = mode === "sol" ? t("fig.f.env.sol") : t("fig.f.env.bande", { a: F.sci(o.alpha, 2) });
    $("mode").querySelectorAll("button").forEach(e => e.setAttribute("aria-pressed", String(e.dataset.m === mode)));
  }
  $("mode").querySelectorAll("button").forEach(e => e.onclick = () => { mode = e.dataset.m; draw(); });
  sf.oninput = sb.oninput = draw; draw();
})();

/* ---------- le système décrit : le champ terrestre entre les deux chemins ---------- */
(() => {
  const Bt = 5e-5, aire = d * L / 2, n = Bt * aire / M.quantumFlux(), r = 0.5e-6, Bs = M.quantumFlux() / (Math.PI * r * r);
  $("sys1").innerHTML = t("sys1.body", { U: F.si(U, "V"), lam: F.si(2 * Math.PI * LB, "m"), d: F.si(d, "m"), L: F.si(L, "m"), i: F.si(2 * Math.PI * LB * L / d, "m"),
    he: F.sci(M.quantumFlux(), 3), r: F.si(r, "m"), Bs: F.si(Bs, "T"), Bt: F.si(Bt, "T"), A: F.sci(aire, 1), n: F.num(Math.round(n / 100) * 100, 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ehrenberg", 1949, "idea"], ["fluxoide", 1961, "experiment"], ["webb", 1985, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["squid"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["force", "b"], ["periode", "c"], ["enveloppe", "a"], ["jauge", "d"], ["quantum", "b"], ["paires", "c"], ["bande", "a"], ["classique", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 155 });
})();
</script>
