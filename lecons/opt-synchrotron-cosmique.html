<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, MEC2 = Constantes.m_e * O.c ** 2, EV = Constantes.e, AN = 365.25 * 86400;
const AGE = new Date().getFullYear() - 1054;                                  // years since the explosion

/* ---------- combien de temps un électron garde son énergie ---------- */
(() => {
  const svg = $("refroid"), sb = $("sb"), sn = $("sn");
  function draw() {
    const B = 10 ** +sb.value, nu = 10 ** +sn.value;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 40 }, x: { scale: "log", domain: [1e7, 1e19], label: t("fig.xaxis") }, y: { scale: "log", domain: [1e-2, 1e8], label: t("fig.yaxis") } });
    const clip = v => Math.min(1e8, Math.max(1e-2, v));
    const xs = Array.from({ length: 121 }, (_, i) => 10 ** (7 + i * 0.1));
    const tau = f => O.tempsRefroidissement(O.gammaPourFrequence(f, B), B) / AN;
    Plot.el("path", { d: Plot.path(xs.map(f => [P.x(f), P.y(clip(tau(f)))])), class: "curve" }, P.g);
    Plot.el("line", { x1: P.x(1e7), x2: P.x(1e19), y1: P.y(AGE), y2: P.y(AGE), class: "stroke c-warn" }, P.g);
    const g = O.gammaPourFrequence(nu, B), ta = tau(nu);
    Plot.el("circle", { cx: P.x(nu), cy: P.y(clip(ta)), r: 5, class: "dot" }, P.g);
    $("sbr").textContent = F.si(B, "T");
    $("snr").textContent = F.si(nu, "Hz");
    $("vg").textContent = F.sci(g, 2);
    $("fg").textContent = t("fig.f.gamma", { E: F.si(g * MEC2 / EV, "eV") });
    $("vt").textContent = F.qty(F.num(ta, 2), t("fig.ans"));
    $("ft").textContent = t("fig.f.tau", { s: F.si(ta * AN, "s") });
    $("vb").textContent = F.num(ta / AGE, 2);
    $("fb").textContent = t(ta < AGE ? "fig.f.court" : "fig.f.long", { a: F.num(AGE, 3) });
  }
  sb.oninput = sn.oninput = draw; draw();
})();

/* ---------- le système décrit : un électron qui éclaire le visible, dans 30 nT ---------- */
(() => {
  const B = 3e-8, nu = 5e14, g = O.gammaPourFrequence(nu, B), s = O.gyration(g, B), P = O.puissanceSynchrotron(g, B);
  const tau = O.tempsRefroidissement(g, B), parTour = P * s.periode / (g * MEC2), photon = Constantes.h * O.frequenceCritique(g, B) / (g * MEC2);
  $("sys1").innerHTML = t("sys1.body", { B: F.si(B, "T"), nu: F.si(nu, "Hz"), g: F.sci(g, 2), E: F.si(g * MEC2 / EV, "eV"), un: F.sci(1 - s.beta, 2),
    f: F.si(s.f, "Hz"), T: F.si(s.periode, "s"), R: F.si(s.rayon, "m"), tour: F.sci(parTour, 1), ph: F.sci(photon, 1),
    tau: F.qty(F.num(tau / AN, 2), t("fig.ans")), age: F.num(AGE, 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["etoile", 1054, "experiment"], ["bevis", 1731, "experiment"], ["messier", 1758, "experiment"], ["chklovski", 1953, "idea"], ["polarisation", 1954, "experiment"], ["pulsar", 1968, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["etalon"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["continu", "c"], ["gyration", "a"], ["gamma2", "d"], ["polar", "b"], ["xray", "a"], ["source", "c"], ["champ", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 341 });
})();
</script>
