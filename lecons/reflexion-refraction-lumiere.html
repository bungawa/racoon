<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, DEG = Math.PI / 180;
const pct = R => F.qty(F.num(100 * R, 3), "%");

/* ---------- (33.3) et (33.4) selon l'angle d'incidence ---------- */
(() => {
  const svg = $("angles"), an = $("an"), ath = $("ath"), seg = $("sens");
  let sens = "entre";
  function draw() {
    const n = +an.value, th = +ath.value * DEG, [n1, n2] = sens === "entre" ? [1, n] : [n, 1];
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 52, b: 44 }, x: { domain: [0, 90], label: t("fa.xaxis") }, y: { domain: [0, 100], label: t("fa.yaxis") } });
    const xs = Array.from({ length: 361 }, (_, i) => i * 0.2499);
    for (const [key, cls] of [["perp", "stroke c-tint"], ["par", "stroke c-warn"]])
      Plot.el("path", { d: Plot.path(xs.map(d => [P.x(d), P.y(100 * M.reflectances(n1, n2, d * DEG)[key])])), class: cls }, P.g);
    const r = M.reflectances(n1, n2, th), b = r.brewster / DEG;
    Plot.el("line", { x1: P.x(b), x2: P.x(b), y1: P.y(0), y2: P.y(100), class: "ref" }, P.g);
    if (r.critique) Plot.el("line", { x1: P.x(r.critique / DEG), x2: P.x(r.critique / DEG), y1: P.y(0), y2: P.y(100), class: "ref" }, P.g);
    Plot.el("circle", { cx: P.x(th / DEG), cy: P.y(100 * r.perp), r: 5, class: "dot" }, P.g);
    Plot.el("circle", { cx: P.x(th / DEG), cy: P.y(100 * r.par), r: 5, class: "dot" }, P.g);
    $("anr").textContent = F.num(n, 3);
    $("athr").textContent = F.num(+ath.value, 3) + "°";
    $("vt").textContent = r.total ? t("fa.total") : F.num(r.thetaT / DEG, 3) + "°";
    $("ft").textContent = r.critique ? t("fa.f.crit", { a: F.num(r.critique / DEG, 3) + "°" }) : t("fa.f.brew", { a: F.num(b, 3) + "°" });
    $("vperp").textContent = pct(r.perp); $("vpar").textContent = pct(r.par);
    $("fperp").textContent = $("fpar").textContent = t("fa.f.norm", { v: pct(r.normale) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.s === sens)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { sens = x.dataset.s; draw(); });
  an.oninput = ath.oninput = draw; draw();
})();

/* ---------- une propriété de la surface : transition lisse ou couche mince, à incidence normale ---------- */
(() => {
  const L0 = 500e-9, NC = 1.38;                                   // a vacuum wavelength in the green ; magnesium fluoride
  const profil = $("profil"), courbe = $("courbe"), se = $("se"), sn = $("sn"), seg = $("forme");
  let forme = "lisse";
  const ep = v => L0 * Math.pow(10, -3 + 3.5 * v / 1000);          // thickness, 0,5 nm to 1,6 µm
  const prof = (e, n2) => forme === "lisse" ? M.profilTanh(1, n2, e) : M.profilCouche(1, NC, e, n2);
  const Rde = (e, n2) => forme === "lisse" ? M.reflectanceEpstein(1, n2, e, L0) : M.traverseeInterface(prof(e, n2), { lambda0: L0, pas: 120 }).R;
  function draw() {
    const e = ep(+se.value), n2 = +sn.value, p = prof(e, n2), R0 = M.reflectances(1, n2, 0).normale;
    const sol = M.traverseeInterface(p, { lambda0: L0 });
    /* the index profile across one wavelength on each side */
    profil.innerHTML = "";
    const xr = Math.max(L0, 1.2 * (forme === "lisse" ? 3 * e : e)), x0 = forme === "lisse" ? -xr : -xr / 2;
    const A = Plot.axes(profil, { fmt: F, w: 640, h: 150, pad: { l: 52, b: 40 }, x: { domain: [x0 / L0, (x0 + 2 * xr) / L0], label: t("fs.xprofil") }, y: { domain: [0.9, 2.6], label: "n" } });
    const xs = Array.from({ length: 401 }, (_, i) => x0 + 2 * xr * i / 400);
    Plot.el("path", { d: Plot.path(xs.map(x => [A.x(x / L0), A.y(Math.sqrt(p.eps(x)))])), class: "stroke bold c-tint" }, A.g);
    /* R against the thickness, log scale */
    courbe.innerHTML = "";
    const vs = Array.from({ length: 141 }, (_, i) => i * 1000 / 140), Rs = vs.map(v => Rde(ep(v), n2));
    const ymax = 100 * 1.15 * Math.max(R0, ...Rs);
    const P = Plot.axes(courbe, { fmt: F, w: 640, h: 240, pad: { l: 52, b: 44 }, x: { scale: "log", domain: [1e-3, 10 ** 0.5], label: t(forme === "lisse" ? "fs.xaxis.w" : "fs.xaxis.d") }, y: { domain: [0, ymax], label: t("fs.yaxis") } });
    Plot.el("line", { x1: P.x(1e-3), x2: P.x(10 ** 0.5), y1: P.y(100 * R0), y2: P.y(100 * R0), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(vs.map((v, i) => [P.x(ep(v) / L0), P.y(100 * Rs[i])])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(e / L0), cy: P.y(100 * sol.R), r: 5, class: "dot" }, P.g);
    $("sel").textContent = t(forme === "lisse" ? "fs.w" : "fs.d");
    $("ser").textContent = F.si(e, "m", { prefix: "n" });
    $("snr").textContent = F.num(n2, 3);
    $("vr").textContent = pct(sol.R);
    $("fr").textContent = t("fs.f.r", { T: pct(sol.T) });
    $("vnet").textContent = pct(R0);
    $("fnet").textContent = t("fs.f.net", { q: F.num(sol.R / R0, 3) });
    if (forme === "lisse") {
      $("kx").innerHTML = t("fs.k.exact"); $("vx").textContent = pct(M.reflectanceEpstein(1, n2, e, L0));
      $("fx").textContent = t("fs.f.exact", { w: F.num(e / L0, 2) });
    } else {
      $("kx").innerHTML = t("fs.k.quart"); $("vx").textContent = F.si(L0 / (4 * NC), "m", { prefix: "n" });
      $("fx").textContent = t("fs.f.quart", { n: F.num(Math.sqrt(n2), 3) });
    }
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.f === forme)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { forme = x.dataset.f; draw(); });
  se.oninput = sn.oninput = draw; draw();
})();

/* ---------- le système décrit : une face de verre polie, dans le vert ---------- */
(() => {
  const L0 = 550e-9, w = 1e-9, n = 1.52, R0 = M.reflectances(1, n, 0).normale, Rw = M.reflectanceEpstein(1, n, w, L0);
  const Rc = M.traverseeInterface(M.profilCouche(1, 1.38, L0 / (4 * 1.38), n), { lambda0: L0 }).R;
  $("sys1").innerHTML = t("sys1.body", { L: F.si(L0, "m", { prefix: "n" }), w: F.si(w, "m", { prefix: "n" }), q: F.sci(w / L0, 2),
    R0: pct(R0), ecart: F.sci(1 - Rw / R0, 2), d: F.si(L0 / (4 * 1.38), "m", { prefix: "n" }), Rc: pct(Rc) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ibnsahl", 984, "idea"], ["snell", 1621, "idea"], ["fresnel", 1823, "idea"], ["rayleigh", 1886, "experiment"], ["smakula", 1935, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lunettes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["surface", "c"], ["normale", "a"], ["brewster", "d"], ["progressif", "b"], ["couche", "a"], ["indice", "c"], ["retour", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 331 });
})();
</script>
