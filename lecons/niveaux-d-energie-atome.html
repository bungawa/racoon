<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, K = Constantes;
const niveau = n => Q.niveauHydrogene(n, { M: K.m_p });              // the proton's recoil included: 5 × 10⁻⁴
const J = x => F.qty(F.sci(x, 3), "J"), eV = x => F.si(x / K.e, "eV");
/* the region of the spectrum of a wavelength in vacuum */
const domaine = l => l < 10e-9 ? "x" : l < 380e-9 ? "uv" : l <= 780e-9 ? "visible" : "ir";

/* ---------- the levels of hydrogen and one jump ---------- */
(() => {
  const svg = $("fig"), sh = $("sh"), sb = $("sb"), NMAX = 7;
  const y = Plot.linScale(niveau(1), 0, 300, 24), xL = 70, xR = 400;
  const tag = (x, yy, txt, anchor) => { const e = Plot.el("text", { x, y: yy, "text-anchor": anchor || "start" }, svg); e.textContent = txt; };
  function draw(src) {
    if (+sb.value >= +sh.value) { if (src === sb) sh.value = Math.min(NMAX, +sb.value + 1); if (+sb.value >= +sh.value) sb.value = +sh.value - 1; }
    const nh = +sh.value, nb = +sb.value, r = Q.raieTransition(niveau(nh), niveau(nb));
    svg.innerHTML = "";
    /* the continuum above E = 0, the levels below */
    Plot.el("line", { x1: xL, x2: xR, y1: y(0), y2: y(0), class: "stroke thin dash" }, Plot.el("g", { class: "c-label-2" }, svg));
    tag(xL + 6, 18, t("fig.continu"));
    for (let n = 1; n <= NMAX; n++) {
      Plot.el("line", { x1: xL, x2: xR, y1: y(niveau(n)), y2: y(niveau(n)), class: n === nh || n === nb ? "stroke bold" : "stroke thin" }, Plot.el("g", { class: "c-label-2" }, svg));
      if (n <= 4) tag(xL - 8, y(niveau(n)) + 4, t("fig.n", { n }), "end");
    }
    tag(xR + 8, y(niveau(1)) + 4, eV(niveau(1)));
    tag(xR + 8, y(0) + 4, "0");
    /* the jump nh → nb; and, when a level lies between, the two smaller jumps of Ritz */
    Plot.fleche(svg, [200, y(niveau(nh))], [200, y(niveau(nb))], { cls: "c-warn", tete: 10 });
    const nk = nh - nb >= 2 ? nb + 1 : null;
    if (nk) {
      Plot.fleche(svg, [290, y(niveau(nh))], [290, y(niveau(nk))], { cls: "c-tint", tete: 8 });
      Plot.fleche(svg, [290, y(niveau(nk))], [290, y(niveau(nb))], { cls: "c-tint", tete: 8 });
    }
    $("shr").textContent = F.num(nh, 2);
    $("sbr").textContent = F.num(nb, 2);
    $("vl").textContent = F.si(r.lambda, "m");
    $("fl").textContent = t("fig.f.lambda." + domaine(r.lambda), { nu: F.si(r.nu, "Hz") });
    $("ve").textContent = J(r.energie);
    $("fe").textContent = t("fig.f.energie", { ev: eV(r.energie), w: F.sci(r.omega, 3) });
    if (nk) {
      const a = Q.raieTransition(niveau(nh), niveau(nk)), b = Q.raieTransition(niveau(nk), niveau(nb));
      $("vr").textContent = t("fig.v.ritz", { a: F.sci(a.omega, 4), b: F.sci(b.omega, 4) });
      $("fr").textContent = t("fig.f.ritz", { k: nk, s: F.sci(a.omega + b.omega, 4) });
    } else { $("vr").textContent = t("fig.v.aucun"); $("fr").textContent = t("fig.f.aucun"); }
  }
  sh.oninput = () => draw(sh); sb.oninput = () => draw(sb); draw();
})();

/* ---------- the system described: recoil, lifetime, Doppler ---------- */
(() => {
  const ha = Q.raieTransition(niveau(3), niveau(2)), ha0 = Q.raieTransition(Q.niveauHydrogene(3), Q.niveauHydrogene(2));
  $("sys1").innerHTML = t("sys1.body", { l: F.num(ha.lambda * 1e9, 5), l0: F.num(ha0.lambda * 1e9, 5) });
  const ly = Q.raieTransition(niveau(2), niveau(1)), MH = K.m_p + K.m_e;
  $("sys2").innerHTML = t("sys2.body", { recul: F.sci(ly.energie / (2 * MH * K.c * K.c), 1), nat: F.sci(1 / (ly.omega * 1.6e-9), 1) });
  const vth = Math.sqrt(K.k_B * 293.15 / MH);
  $("sys3").innerHTML = t("sys3.body", { T: F.kelvin(293.15), v: F.si(vth, "m·s⁻¹"), d: F.sci(vth / K.c, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["balmer", 1885, "idea"], ["rydberg", 1890, "idea"], ["ritz", 1908, "idea"], ["bohr", 1913, "idea"], ["franck", 1914, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["galaxies"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["libre", "b"], ["frequence", "d"], ["ritz", "a"], ["absorbe", "c"], ["balmer", "b"], ["corde", "a"], ["largeur", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 385 });
})();
</script>
