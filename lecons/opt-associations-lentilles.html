<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique;
const mm = v => isFinite(v) ? F.si(v, "m", { prefix: "m", sig: 3 }) : "∞";
const cm = mm;
const dio = v => F.qty(F.num(v, 3), "m⁻¹");

/* ---------- deux lentilles minces : image intermédiaire, plans principaux, (27.12a) à (27.12c), (27.16c) ---------- */
(() => {
  const svg = $("constr"), s1 = $("v1sl"), s2 = $("v2sl"), es = $("esl"), ps = $("psl"), W = 640, Hp = 320, Y0 = 0.01;   // objet de 1 cm
  const VS = [-20, -10, -5, -4, -3, -2, 2, 3, 4, 5, 6, 8, 10, 15, 20];                                                   // vergences (m⁻¹), sans 0
  const X = [-0.62, 0.5], Y = [-0.022, 0.022], x = Plot.linScale(X[0], X[1], 10, W - 10), y = Plot.linScale(Y[0], Y[1], Hp - 20, 20);
  const dans = v => v !== null && isFinite(v) && v > X[0] && v < X[1];
  svg.setAttribute("viewBox", "0 0 " + W + " " + Hp);
  function draw() {
    svg.innerHTML = "";
    const clip = Plot.el("clipPath", { id: "cadre" }, Plot.el("defs", {}, svg));
    Plot.el("rect", { x: 0, y: 0, width: W, height: Hp }, clip);
    const g = Plot.el("g", { "clip-path": "url(#cadre)" }, svg);
    const seg = (a, b, cls) => Plot.el("line", { x1: x(a[0]), y1: y(a[1]), x2: x(b[0]), y2: y(b[1]), class: cls }, g);
    const lab = (xv, k, dy) => { Plot.el("text", { x: x(xv) + 3, y: dy === null ? y(0.02) : y(0) + dy }, g).textContent = t(k); };
    const V1 = VS[+s1.value], V2 = VS[+s2.value], e = +es.value / 100, p = +ps.value / 100;
    const L = [{ x: 0, fp: 1 / V1 }, { x: e, fp: 1 / V2 }], S = O.systeme(L), im = S.image(p), B = [p, Y0];
    seg([X[0] - 1, 0], [X[1] + 1, 0], "stroke thin rim");
    L.forEach((l, k) => { seg([l.x, -0.019], [l.x, 0.019], "stroke c-label"); lab(l.x - (k ? 0 : 0.03), k ? "as.L2" : "as.L1", null); });
    if (!S.afocal) {
      [[S.xF, "as.F", 16], [S.xFp, "as.Fp", 16]].forEach(([xv, k, dy]) => { if (!dans(xv)) return; seg([xv, -0.002], [xv, 0.002], "stroke c-ok"); lab(xv, k, dy); });
      [[S.xH, "as.H", 32], [S.xHp, "as.Hp", 32]].forEach(([xv, k, dy]) => { if (!dans(xv)) return; seg([xv, -0.017], [xv, 0.017], "stroke thin dash c-ok"); lab(xv, k, dy); });
    }
    Plot.fleche(g, [x(p), y(0)], [x(p), y(Y0)], { cls: "c-label" });
    /* trois rayons issus de B : parallèle à l'axe, par O1, et vers le foyer objet du système (il ressort parallèle) */
    const us = [0, Y0 / p]; if (!S.afocal && Math.abs(S.xF - p) > 1e-3) { const u = -Y0 / (S.xF - p); if (Math.abs(Y0 - u * p) < 0.019) us.push(u); }   // seulement s'il passe dans L₁
    const virt = isFinite(im.xAp) && im.xAp < e;
    us.forEach(u => {
      const r = O.rayonMince({ x: p, y: Y0, u }, L), pts = r.points, k = (X[1] + 1 - r.x);
      for (let i = 1; i < pts.length; i++) seg(pts[i - 1], pts[i], "stroke thin c-tint");
      seg([r.x, r.y], [r.x + k, r.y + k * r.u], "stroke thin c-tint");
      if (virt && im.gamma !== null) seg([r.x, r.y], [im.xAp, im.gamma * Y0], "stroke thin dash c-label-2");
    });
    const a1 = im.etapes[0];
    if (dans(a1.xAp) && isFinite(a1.gamma)) Plot.fleche(g, [x(a1.xAp), y(0)], [x(a1.xAp), y(a1.gamma * Y0)], { cls: "c-label-2", trait: "stroke thin dash" });
    if (isFinite(im.xAp) && im.gamma !== null && isFinite(im.gamma))
      Plot.fleche(g, [x(im.xAp), y(0)], [x(im.xAp), y(im.gamma * Y0)], { cls: "c-warn", trait: virt ? "stroke dash" : "stroke" });
    $("v1read").textContent = t("as.V.read", { V: dio(V1), fp: cm(1 / V1) });
    $("v2read").textContent = t("as.V.read", { V: dio(V2), fp: cm(1 / V2) });
    $("eread").textContent = cm(e); $("pread").textContent = cm(p);
    if (S.afocal) {
      $("vf").textContent = "∞"; $("ff").textContent = t("as.f.afocal", { G: F.num(S.G, 3) });
      $("vh").textContent = "–"; $("fh").textContent = "";
    } else {
      $("vf").textContent = cm(S.fp); $("ff").textContent = t("as.f.V", { V: dio(S.V), G: dio(V1 + V2 - e * V1 * V2) });
      $("vh").textContent = t("as.h.v", { h: cm(S.xHp - e) }); $("fh").textContent = t("as.h.f", { h: cm(S.xH), fp: cm(S.xFp - e) });
    }
    $("vi").textContent = isFinite(im.xAp) ? t("as.i.v", { p: cm(im.xAp - e) }) : "∞";
    $("fi").textContent = !isFinite(im.xAp) || im.gamma === null ? t("as.i.infini")
      : t(virt ? "as.i.virtuelle" : "as.i.reelle", { g: F.num(im.gamma, 3), g1: F.num(a1.gamma, 3), x1: cm(a1.xAp) });
  }
  [s1, s2, es, ps].forEach(c => c.oninput = draw); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lipperhey", 1608, "use"], ["gauss", 1841, "idea"], ["dallmeyer", 1891, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tele", "zoom"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["objet", "c"], ["gullstrand", "a"], ["accolees", "b"], ["plans", "b"], ["afocal", "c"], ["tele", "a"], ["newton", "d"], ["mince", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 275 });
})();
</script>
