<title>Les autres usages de l'approximation</title>
<link rel="stylesheet" href="/racoon/ds.css">

<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-quantique-schrodinger" data-i18n="monde.quantique-schrodinger"></a><span class="aux">›</span><a href="/racoon/etape?id=molecules-independantes" data-i18n="etape.molecules-independantes"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-quant" href="/racoon/atlas?piste=quant" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/chimie-organique-quantique" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure class="chart">
      <svg class="fig" id="fig" viewBox="0 0 640 300" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-label" data-i18n="fig.legend.plein"></span><span class="c-warn" data-i18n="fig.legend.cours"></span><span class="c-label-2" data-i18n="fig.legend.vide"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="sn" data-i18n="fig.n"></label><output id="snr" for="sn"></output></div>
            <input id="sn" type="range" min="1" max="126" step="1" value="20"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.niveau"></span><span class="v" id="vn"></span><span class="f" id="fn"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.magique"></span><span class="v" id="vm"></span><span class="f" id="fm"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="box rem"><b data-i18n="sys.title"></b>

      <p id="sys2"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/autres-usages-particules-independantes.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/quantique-schrodinger.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, L = Q.COUCHES_NOYAU, MAG = Q.MAGIQUES;

/* ---------- nucleons put one by one into the levels of the shell model ---------- */
(() => {
  const svg = $("fig"), sn = $("sn");
  /* each level a horizontal bar in a column per major shell (between two magic numbers), its slots as small squares */
  function draw() {
    const N = +sn.value;
    svg.innerHTML = "";
    let cum = 0, col = 0, row = 0, courant = null, fin = null;
    const X = c => 40 + c * 84, Y = r => 280 - r * 34;
    L.forEach(l => {
      const debut = cum; cum += l.places;
      const plein = Math.max(0, Math.min(l.places, N - debut));
      if (plein > 0 && plein < l.places) courant = l;
      if (N > debut && N <= cum) { courant = l; fin = cum; }
      const g = Plot.el("g", { class: plein === l.places ? "c-label" : plein > 0 ? "c-warn" : "c-label-2" }, svg);
      for (let i = 0; i < l.places; i++) Plot.el("rect", { x: X(col) + (i % 7) * 10, y: Y(row) - 10 - Math.floor(i / 7) * 10, width: 8, height: 8, class: i < plein ? "fill" : "stroke thin" }, g);
      const tx = Plot.el("text", { x: X(col), y: Y(row) + 12, class: "c-label-2" }, svg); tx.textContent = l.nom;
      row++;
      if (MAG.includes(cum)) { const m = Plot.el("text", { x: X(col), y: 20, class: "c-label" }, svg); m.textContent = String(cum); col++; row = 0; }
    });
    $("snr").textContent = F.num(N, 3);
    $("vn").textContent = courant.nom;
    $("fn").textContent = t(N === fin ? "fig.f.plein" : "fig.f.cours", { reste: fin - N });
    const next = MAG.find(m => m >= N);
    $("vm").textContent = String(next);
    $("fm").textContent = t(N === next ? "fig.f.magique" : "fig.f.manque", { d: next - N });
  }
  sn.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  $("sys1").innerHTML = t("sys1.body");
  $("sys2").innerHTML = t("sys2.body");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ivanenko", 1932, "idea"], ["mayer", 1949, "idea"], ["nobel", 1963, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["superlourds"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["couches", "b"], ["gaz", "a"], ["noyau", "d"], ["spinorbite", "c"], ["limite", "b"], ["plomb", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1506 });
})();
</script>
</body>
</html>
