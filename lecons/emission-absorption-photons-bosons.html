<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, { h, c, k_B } = Constantes;
const xDe = (lambda, T) => h * c / (lambda * k_B * T);               // ħω/(k_B T) for a wavelength and a temperature
const nb = v => v < 1e-3 || v >= 1e4 ? F.sci(v, 2) : F.num(v, 3);

/* ---------- one photon state in equilibrium with atoms: jumps n → n + 1 (rate e^(−x)(n + 1)) and n → n − 1 (rate n) ---------- */
(() => {
  const svg = $("histo"), sx = $("sx"), seg = $("poste"), alea = Q.aleaGraine(444), SAUTS = 200000;
  const POSTES = { visible: [500e-9, 5772], ir: [50e-6, 300], mm: [1e-3, 300] };
  let poste = null;
  function draw() {
    const x = 10 ** +sx.value, s = Q.avanceMode(Q.modeThermique(x), SAUTS, alea), moy = Q.occupationPhotons(x);
    const nmax = Math.min(80, Math.max(6, Math.ceil(4 * moy) + 3));
    const top = Math.max(Q.loiPhotonsThermique(x, 0), (s.temps[0] || 0) / s.duree) * 1.1;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { domain: [-0.5, nmax + 0.5], label: t("fig.x"), ticks: Math.min(nmax + 1, 10) }, y: { domain: [0, top], label: t("fig.y") } });
    const w = Math.min(16, (o.x(1) - o.x(0)) * 0.7);
    for (let n = 0; n <= nmax; n++) {
      const f = (s.temps[n] || 0) / s.duree, p = Q.loiPhotonsThermique(x, n);
      Plot.el("rect", { x: o.x(n) - w / 2, y: o.y(f), width: w, height: o.y(0) - o.y(f), class: "fill c-tint" }, o.g);
      Plot.el("circle", { cx: o.x(n), cy: o.y(p), r: 3, class: "fill c-label" }, o.g);
    }
    $("sxr").textContent = F.num(x, 3);
    $("vm").textContent = nb(s.moyenne);
    $("fm").textContent = t("fig.f.moyenne", { n: nb(moy) });
    $("vi").textContent = s.spontanees ? nb(s.induites / s.spontanees) : "—";
    $("fi").textContent = t("fig.f.induites", { s: F.num(s.spontanees, 6), i: F.num(s.induites, 6) });
    $("vb").textContent = F.fix((s.spontanees + s.induites) / Math.max(1, s.absorptions), 3);
    $("fb").textContent = t("fig.f.bilan", { a: F.num(s.absorptions, 6) });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === poste)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { poste = b.dataset.p; sx.value = Math.log10(xDe(...POSTES[poste])).toFixed(2); draw(); });
  sx.oninput = () => { poste = null; draw(); };
  $("relancer").onclick = draw;
  draw();
})();

/* ---------- the system described: photons per state from the Sun, a radio receiver, a laser ---------- */
(() => {
  const xs = xDe(500e-9, 5772), xr = h * 100e6 / (k_B * 300);
  $("sys1").innerHTML = t("sys1.body", { x: F.num(xs, 3), n: nb(Q.occupationPhotons(xs)), t: F.kelvin(5772) });
  $("sys2").innerHTML = t("sys2.body", { x: F.sci(xr, 2), n: nb(Q.occupationPhotons(xr)), t: F.kelvin(300) });
  const lambda = 633e-9, Psortie = 1e-3, T = 0.01, L = 0.3, Pint = Psortie / T, photon = h * c / lambda;
  const N = Pint * 2 * L / c / photon;
  $("sys3").innerHTML = t("sys3.body", { pi: F.si(Pint, "W"), e: F.si(photon, "J"), n: F.sci(N, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["einstein", 1917, "idea"], ["dirac", 1927, "idea"], ["maiman", 1960, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["edfa"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["emettre", "c"], ["vide", "a"], ["racine", "b"], ["induite", "d"], ["soleil", "a"], ["equilibre", "c"], ["einstein", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 444 });
})();
</script>
