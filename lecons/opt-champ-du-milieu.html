<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const K = Constantes, TAU = 2 * Math.PI;
const N_GAZ = K.atm / (K.k_B * 273.15);                                       // molecules per m³ of an ideal gas at 273,15 K and 101 325 Pa
const L0 = 100e-9, W0 = TAU * K.c / L0, E0 = 1000;                            // the model gas: one electron per molecule, resonance at 100 nm; a field of 1 kV·m⁻¹

/* ---------- l'électron, son dipôle, le champ de la nappe, selon ω/ω0 ---------- */
(() => {
  const ph = $("phaseurs"), trace = $("trace"), sw = $("sw");
  function draw() {
    const r = +sw.value / 100, w = r * W0, near = Math.abs(1 - r) < 0.015;
    /* normalised: p in units of q²E0/(mω0²), Ea in units of its value at ω = ω0/2; both are 1/(1 − r²) and r/(1 − r²) */
    const pN = 1 / (1 - r * r), aN = r / (1 - r * r) / (0.5 / 0.75);
    ph.innerHTML = "";
    const O = [190, 115], R = 70, cl = v => Math.max(-1.45, Math.min(1.45, v));
    Plot.el("line", { x1: O[0] - 1.6 * R, x2: O[0] + 1.6 * R, y1: O[1], y2: O[1], class: "stroke thin c-label-2" }, ph);
    Plot.el("line", { x1: O[0], x2: O[0], y1: O[1] - 1.55 * R, y2: O[1] + 1.55 * R, class: "stroke thin c-label-2" }, ph);
    Plot.fleche(ph, O, [O[0] + R, O[1]], { cls: "c-label-2", trait: "stroke bold" });
    if (!near) {
      Plot.fleche(ph, [O[0], O[1] - 6], [O[0] + R * cl(0.5 * pN), O[1] - 6], { cls: "c-warn" });
      Plot.fleche(ph, O, [O[0], O[1] + R * cl(1.5 * aN)], { cls: "c-ok", trait: "stroke bold" });
    }
    Plot.el("text", { x: O[0] + 1.6 * R - 16, y: O[1] - 12 }, ph).textContent = t("fig.re");
    Plot.el("text", { x: O[0] + 6, y: O[1] - 1.55 * R + 10 }, ph).textContent = t("fig.im");
    Plot.el("text", { x: 340, y: 60 }, ph).textContent = t("fig.ph.s");
    Plot.el("text", { x: 340, y: 84 }, ph).textContent = t(near ? "fig.ph.res" : r < 1 ? "fig.ph.pin" : "fig.ph.pout");
    Plot.el("text", { x: 340, y: 108 }, ph).textContent = t(near ? "fig.ph.res2" : r < 1 ? "fig.ph.ain" : "fig.ph.aout");
    /* (n − 1) in units of N q²/(2 ε0 m ω0²): 1/(1 − r²) */
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 230, pad: { l: 52, b: 40 }, x: { domain: [0, 3], label: t("fig.xaxis") }, y: { domain: [-4, 4], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(3), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("line", { x1: P.x(1), x2: P.x(1), y1: P.y(-4), y2: P.y(4), class: "ref" }, P.g);
    const branch = (a, b) => Array.from({ length: 200 }, (_, i) => a + (b - a) * i / 199).map(u => [P.x(u), P.y(Math.max(-4, Math.min(4, 1 / (1 - u * u))))]);
    Plot.el("path", { d: Plot.path(branch(0, Math.sqrt(0.75))), class: "curve" }, P.g);           // |n − 1| ≤ 4 units
    Plot.el("path", { d: Plot.path(branch(Math.sqrt(1.25), 3)), class: "curve" }, P.g);
    if (!near) Plot.el("circle", { cx: P.x(r), cy: P.y(Math.max(-4, Math.min(4, pN))), r: 5, class: "dot" }, P.g);
    $("swr").textContent = t("fig.wr", { r: F.num(r, 3), l: F.si(L0 / r, "m", { sig: 3 }) });
    if (near) { ["vn", "vx", "va"].forEach(id => $(id).textContent = "–"); $("fn").textContent = t("fig.f.res"); $("fx").textContent = $("fa").textContent = ""; return; }
    const n = OptOnd.indiceMilieu(N_GAZ, W0, w), e = OptOnd.electronElastique(W0, w, E0);
    $("vn").textContent = F.sci(n - 1, 3);
    $("fn").textContent = t(n > 1 ? "fig.f.retard" : "fig.f.avance");
    $("vx").textContent = F.si(e.module, "m", { sig: 2 });
    $("fx").textContent = t("fig.f.x", { v: F.si(e.module * w, "m·s⁻¹", { sig: 2 }) });
    const eta = N_GAZ * 1e-6, Ea = OptOnd.champMilieu(eta, W0, w);
    $("va").textContent = F.sci(Math.abs(Ea.im), 2);
    $("fa").textContent = t(Ea.im < 0 ? "fig.f.aretard" : "fig.f.aavance");
  }
  sw.oninput = draw; draw();
})();

/* ---------- le système décrit : le gaz modèle ---------- */
(() => {
  const w = TAU * K.c / 589e-9, n = OptOnd.indiceMilieu(N_GAZ, W0, w), e = OptOnd.electronElastique(W0, w, E0);
  $("sys1").innerHTML = t("sys1.body", { N: F.sci(N_GAZ, 3), d: F.si(Math.cbrt(1 / N_GAZ), "m", { sig: 2 }), n: F.sci(n - 1, 2),
    x: F.si(e.module, "m", { sig: 2 }), f: F.num(2.93e-4 / (n - 1), 2), b: F.sci(e.module * w / K.c, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gladstone", 1863, "experiment"], ["lorenz", 1869, "idea"], ["lorentz", 1878, "idea"], ["zeeman", 1896, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["soufflerie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ressort", "b"], ["phase", "d"], ["quadrature", "a"], ["epaisseur", "c"], ["densite", "b"], ["haute", "c"], ["ordre", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 312 });
})();
</script>
