<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, C = Constantes;

/* Water at 298,15 K (εr = 78,4), a 1:1 salt; polystyrene spheres of radius 100 nm, Hamaker constant 1,4 × 10⁻²⁰ J across water. */
const T = 298.15, EPSR = 78.4, R = 100e-9, H = 1.4e-20, kT = C.k_B * T, NM = 1e-9;
const n0 = c => c * 1000 * C.N_A;                                       // ions of each sign per m³ for c in mol·L⁻¹

/* ---------- le système décrit : 0,1 mol·L⁻¹ de sel dans l'eau ---------- */
(() => {
  const c = 0.1, D = ES.longueurDebye(T, n0(c), { epsr: EPSR }), sans = ES.longueurDebye(T, n0(c));
  $("sys1").innerHTML = t("sys1.body", { T: F.kelvin(T), n: F.sci(n0(c), 2), ecart: F.si(Math.cbrt(1 / (2 * n0(c))), "m", { prefix: "n" }),
    D: F.si(D, "m", { prefix: "n" }), vide: F.si(sans, "m", { prefix: "n" }), kT: F.si(kT / C.e, "V", { prefix: "m" }) });
})();

/* ---------- la gaine d'ions, puis deux sphères ---------- */
(() => {
  const sel = $("sel"), sig = $("sig"), sp = $("pot"), sw = $("paire");
  function draw() {
    const c = Math.pow(10, +sel.value), sigma = +sig.value * 1e-3, g = ES.gouyChapman(sigma, T, n0(c), { epsr: EPSR });
    const d = ES.dlvo(R, H, sigma, T, n0(c), { epsr: EPSR });
    sp.innerHTML = "";
    const top = Math.max(50, Math.ceil(Math.min(g.phi0Lineaire, 1) * 1000 / 50) * 50);
    const A = Plot.axes(sp, { fmt: F, w: 640, h: 240, x: { domain: [0, 20], label: t("pot.x") }, y: { domain: [0, top], label: t("pot.y") } });
    const xs = Array.from({ length: 201 }, (_, i) => i * 0.1 * NM);
    const tr = (fn, cls) => Plot.el("path", { d: Plot.path(xs.map(x => [A.x(x / NM), A.y(Math.min(top, fn(x) * 1000))])), class: "stroke " + cls }, A.g);
    tr(g.phiLineaire, "c-tint"); tr(g.phi, "c-warn");
    if (g.D / NM <= 20) Plot.el("line", { x1: A.x(g.D / NM), x2: A.x(g.D / NM), y1: A.y(0), y2: A.y(top), class: "stroke thin dash c-label-2" }, A.g);
    sw.innerHTML = "";
    const bmax = d.barriere.U / kT, hi = bmax > 0 ? Math.max(20, Math.ceil(1.25 * bmax / 20) * 20) : 20, lo = -hi / 2;   // the barrier fits
    const B = Plot.axes(sw, { fmt: F, w: 640, h: 240, x: { domain: [0, 20], label: t("paire.x") }, y: { domain: [lo, hi], label: t("paire.y") } });
    const hs = Array.from({ length: 200 }, (_, i) => (0.3 + 19.7 * i / 199) * NM);
    Plot.el("line", { x1: B.x(0), x2: B.x(20), y1: B.y(0), y2: B.y(0), class: "stroke thin c-label-2" }, B.g);
    Plot.el("path", { d: Plot.path(hs.map(h => [B.x(h / NM), B.y(Math.max(lo, Math.min(hi, d.U(h) / kT)))])), class: "stroke c-warn" }, B.g);
    $("selr").textContent = F.si(c, "mol·L⁻¹", { sig: 2 });
    $("sigr").textContent = F.si(sigma, "C·m⁻²", { prefix: "m" });
    $("vd").textContent = F.si(g.D, "m", { prefix: "n" });
    $("fd").textContent = t("fig.f.d");
    $("vphi").textContent = F.si(g.phi0, "V", { prefix: "m" });
    $("fphi").textContent = t("fig.f.phi", { lin: F.si(g.phi0Lineaire, "V", { prefix: "m" }), r: F.num(g.phi0 * C.e / kT, 2) });
    const b = d.barriere.U / kT;
    $("vb").textContent = b > 0 ? t("fig.v.b", { b: F.num(b, 3) }) : t("fig.v.sans");
    $("fb").textContent = t(b > 20 ? "fig.f.stable" : b > 0 ? "fig.f.lent" : "fig.f.agrege");
  }
  sel.oninput = sig.oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gouy", 1910, "idea"], ["chapman", 1913, "idea"], ["debye", 1923, "idea"], ["dlvo", 1941, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["eau", "proteines"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["gaine", "a"], ["boltzmann", "d"], ["racine", "b"], ["condensateur", "c"], ["sel", "a"], ["eau", "d"], ["fort", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 74 });
})();
</script>
