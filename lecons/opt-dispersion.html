<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const K = Constantes, TAU = 2 * Math.PI;
const N_GAZ = K.atm / (K.k_B * 273.15);                                       // molecules per m³ of an ideal gas at 273,15 K and 101 325 Pa
const W1 = TAU * K.c / 100e-9;                                                // first resonance at 100 nm, the second 2,5 times higher

/* ---------- deux résonances amorties : n′ et n″ selon ω ---------- */
(() => {
  const trace = $("trace"), sw = $("sw"), sg = $("sg"), U = 1e-4;
  const res = g => [{ N: N_GAZ, w0: W1, gamma: g * W1 }, { N: 2 * N_GAZ, w0: 2.5 * W1, gamma: g * 2.5 * W1 }];
  function draw() {
    const g = +sg.value / 100, r = +sw.value / 100, R = res(g);
    const xs = Array.from({ length: 1601 }, (_, i) => 0.02 + i * (4 - 0.02) / 1600), pts = xs.map(x => OptOnd.indiceDispersion(R, x * W1));
    const top = 1.1 * Math.max(...pts.map(p => Math.max(Math.abs(p.n1 - 1), p.n2))) / U;
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 52, b: 40 }, x: { domain: [0, 4], label: t("fig.xaxis") }, y: { domain: [-top, top], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(4), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x), P.y(pts[i].n2 / U)])), class: "stroke c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x), P.y((pts[i].n1 - 1) / U)])), class: "curve" }, P.g);
    const p = OptOnd.indiceDispersion(R, r * W1);
    Plot.el("line", { x1: P.x(r), x2: P.x(r), y1: P.y(-top), y2: P.y(top), class: "ref" }, P.g);
    Plot.el("circle", { cx: P.x(r), cy: P.y((p.n1 - 1) / U), r: 5, class: "dot" }, P.g);
    $("swr").textContent = t("fig.wr", { r: F.num(r, 3), l: F.si(100e-9 / r, "m", { sig: 3 }) });
    $("sgr").textContent = F.num(g, 2);
    $("vn1").textContent = F.sci(p.n1 - 1, 3);
    $("fn1").textContent = t(p.n1 >= 1 ? "fig.f.lent" : "fig.f.rapide", { v: F.num(1 / p.n1, 8) });
    $("vn2").textContent = F.sci(p.n2, 2);
    $("fn2").textContent = t("fig.f.n2", { v: F.num(p.n2 / Math.abs(p.n1 - 1), 2) });
    $("vp").textContent = t(p.regime === "anormale" ? "fig.v.anormale" : "fig.v.normale");
    $("fp").textContent = t("fig.f.pente", { v: F.sci(p.pente * W1, 2) });
  }
  sw.oninput = sg.oninput = draw; draw();
})();

/* ---------- le système décrit : un verre, puis l'ionosphère ---------- */
(() => {
  const S = OptOnd.SELLMEIER_BK7, osc = OptOnd.oscillateursSellmeier(S), n = l => OptOnd.sellmeier(S, l).n;
  const nC = n(656.27e-9), nd = OptOnd.sellmeier(S, 587.56e-9), nF = n(486.13e-9);
  $("sys1").innerHTML = t("sys1.body", { l1: F.si(osc[0].lambda, "m", { sig: 2 }), l2: F.si(osc[1].lambda, "m", { sig: 3 }), l3: F.si(osc[2].lambda, "m", { sig: 3 }),
    nC: F.fix(nC, 4), nd: F.fix(nd.n, 4), nF: F.fix(nF, 4), dn: F.num(nF - nC, 2), r: F.num(587.56e-9 / osc[0].lambda, 2), dil: F.fix(nd.dilue, 3), ec: F.num(nd.ecart, 2) });
  const Ne = 1e12, fp = OptOnd.plasmaPulsation(Ne) / TAU, L1 = 1575.42e6, pl = OptOnd.plasmaIndice(Ne, TAU * L1), io = OptOnd.ionoRetard(5e17, L1);
  $("sys2").innerHTML = t("sys2.body", { N: F.sci(Ne, 1), fp: F.si(fp, "Hz", { sig: 2 }), n: F.sci(pl.premierOrdre - 1, 2), K: F.num(io.K, 3),
    d: F.si(io.distance, "m", { sig: 2 }), d2: F.si(OptOnd.ionoRetard(5e17, 1227.6e6).distance, "m", { sig: 3 }), fc: F.si(K.e * 50e-6 / K.m_e / TAU, "Hz", { sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1672, "experiment"], ["christiansen", 1870, "experiment"], ["sellmeier", 1871, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gps"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["prisme", "c"], ["rayonsx", "a"], ["signal", "d"], ["anormale", "b"], ["ionosphere", "c"], ["gps", "a"], ["dense", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 313 });
})();
</script>
