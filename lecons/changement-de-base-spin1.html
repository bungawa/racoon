<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- the state whose vector (5.42) is the unit vector n of the xz plane, seen from S and from T turned by α about y ---------- */
(() => {
  const st = $("st"), sa = $("sa"), r = Math.SQRT1_2;
  /* (5.42) inverted: C₊ = −(Cx − iCy)/√2, C₀ = Cz, C₋ = (Cx + iCy)/√2; here Cy = 0 */
  const etat = th => [Cx.c(-Math.sin(th) * r, 0), Cx.c(Math.cos(th), 0), Cx.c(Math.sin(th) * r, 0)];
  const txt = z => (Math.abs(z.re) < 5e-13 ? 0 : z.re);
  function draw() {
    const th = +st.value * Math.PI / 180, a = +sa.value * Math.PI / 180, c = etat(th), cT = Q.appliquer(Q.spin1Y(a), c), v = Q.composantesVecteur(cT);
    const svg = $("axes"); svg.innerHTML = "";
    const o = [320, 150], L = 120, pt = (x, z) => [o[0] + L * x, o[1] - L * z];
    const axe = (x, z, cls, k) => { Plot.fleche(svg, pt(-x, -z), pt(x, z), { cls, tete: 7 });
      Plot.el("text", { x: pt(1.1 * x, 1.1 * z)[0], y: pt(1.1 * x, 1.1 * z)[1] + 4, "text-anchor": "middle" }, svg).textContent = t(k); };
    axe(0, 1, "c-label-2", "fig.z"); axe(1, 0, "c-label-2", "fig.x");
    axe(Math.sin(a), Math.cos(a), "c-tint", "fig.zp"); axe(Math.cos(a), -Math.sin(a), "c-tint", "fig.xp");
    Plot.fleche(svg, pt(0, 0), pt(Math.sin(th), Math.cos(th)), { cls: "c-label", tete: 10, trait: "stroke bold" });
    $("str").textContent = F.num(+st.value, 3) + "\u00a0°"; $("sar").textContent = F.num(+sa.value, 3) + "\u00a0°";
    $("vcs").textContent = c.map(z => F.num(txt(z), 3)).join(" ; ");
    $("vct").textContent = cT.map(z => F.num(txt(z), 3)).join(" ; ");
    $("vvt").textContent = F.num(txt(v.x), 3) + " ; " + F.num(txt(v.z), 3);
    $("fvt").textContent = t("fig.f.vt", { x: F.num(Math.sin(th - a) + 0, 3), z: F.num(Math.cos(th - a), 3) });
    $("vp").textContent = cT.map(z => F.num(Cx.abs2(z), 3)).join(" ; ");
  }
  st.oninput = sa.oninput = draw; draw();
  const p = Q.appliquer(Q.spin1Y(Math.PI / 2), Q.etatBase(3, 1)).map(Cx.abs2);
  $("sys1").innerHTML = t("sys1.body", { p: p.map(x => F.num(x, 2)).join(" ; ") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wigner", 1927, "idea"], ["livre", 1931, "idea"], ["wz", 1983, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["spineur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["meme", "b"], ["z", "c"], ["vecteur", "a"], ["phase", "d"], ["retour", "b"], ["proba", "a"], ["nom", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 507 });
})();
</script>
