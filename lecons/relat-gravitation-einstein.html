<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, K = Constantes, C2 = K.c * K.c, AS = Gravitation.ARCSEC;

/* ---------- the system described: how weak is the field? ---------- */
(() => {
  const merc = FC.relativite("mercure");
  $("sys1").innerHTML = t("sys1.body", {
    terre: F.sci(K.GM_E / (K.R_E_mean * C2), 2), soleil: F.sci(K.GM_sun / (K.R_sun * C2), 2),
    merc: F.sci(merc.rapport, 2), v2: F.sci(K.GM_sun / merc.a / C2, 2),
    rt: F.si(EspacesCourbes.excesEinstein(K.GM_E), "m"), rs: F.si(EspacesCourbes.excesEinstein(K.GM_sun), "m"),
    rel: F.sci(EspacesCourbes.excesEinstein(K.GM_E) / K.R_E_mean, 1) });
})();

/* ---------- where Newton is wrong: the perihelion, and light grazing the Sun ---------- */
(() => {
  const svg = $("dev"), seg = $("planete"), sb = $("sb");
  let id = "mercure";
  const B = x => 10 ** (x / 100);                                      // b in solar radii, 1 to 100
  const dev = b => Gravitation.deflection(K.GM_sun, b * K.R_sun);
  function draw() {
    const b = B(+sb.value), d = dev(b), p = FC.relativite(id);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 42 }, x: { scale: "log", domain: [1, 100], label: t("fig.xaxis") }, y: { scale: "log", domain: [0.001, 10], label: t("fig.yaxis") } });
    const bs = Array.from({ length: 101 }, (_, i) => B(2 * i));
    Plot.el("path", { d: Plot.path(bs.map(x => [P.x(x), P.y(dev(x).einstein / AS)])), class: "stroke bold c-tint" }, P.g);
    Plot.el("path", { d: Plot.path(bs.map(x => [P.x(x), P.y(dev(x).newton / AS)])), class: "stroke c-warn" }, P.g);
    Plot.el("circle", { cx: P.x(b), cy: P.y(d.einstein / AS), r: 5, class: "dot" }, P.g);
    $("sbr").textContent = t("fig.b.v", { b: F.num(b, 3) });
    $("vperi").textContent = t("fig.v.peri", { v: F.num(p.parSiecle, 3) });
    $("fperi").textContent = t("fig.f.peri", { r: F.sci(p.rapport, 2), n: F.num(36525 * 86400 / p.T, 3) });
    $("vein").textContent = t("fig.v.angle", { v: F.num(d.einstein / AS, 3) });
    $("fein").textContent = t("fig.f.ein", { r: F.sci(K.GM_sun / (b * K.R_sun * C2), 2) });
    $("vnew").textContent = t("fig.v.angle", { v: F.num(d.newton / AS, 3) });
    $("fnew").textContent = t("fig.f.new");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === id)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { id = x.dataset.m; draw(); });
  sb.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["leverrier", 1859, "experiment"], ["einstein", 1915, "idea"], ["eclipse", 1919, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ondes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "c"], ["terre", "a"], ["maxwell", "d"], ["energie", "b"], ["lumiere", "a"], ["mercure", "c"], ["newton", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 429 });
})();
</script>
