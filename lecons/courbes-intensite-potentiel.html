<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions;

/* ---------- courbe intensité-potentiel : Fe³⁺/Fe²⁺ dans l'acide sulfurique à pH 0, électrode de platine ou de plomb ---------- */
(() => {
  const svg = $("ie"), EX = [-1, 2], JY = [-40, 40], KD = 2e-5;              // KD: mass transfer coefficient of a stirred solution (model)
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 360, pad: { b: 44 },
    x: { domain: EX, label: t("ie.x") }, y: { domain: JY, label: t("ie.y") } });
  Plot.el("line", { x1: x(EX[0]), x2: x(EX[1]), y1: y(0), y2: y(0), class: "zero" }, g);
  const refs = Plot.el("g", {}, g), curve = Plot.el("path", { class: "curve" }, g), dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  let metal = "pt";
  const btns = [...$("metal").querySelectorAll("button")];
  btns.forEach(b => b.onclick = () => { metal = b.dataset.m; draw(); });
  const ksl = $("ksl"), oxsl = $("oxsl"), redsl = $("redsl");
  const mM = v => F.qty(F.num(v, 3), "mmol·L⁻¹"), J = v => F.qty(F.num(v, 3), "A·m⁻²");
  function draw() {
    btns.forEach(b => b.setAttribute("aria-pressed", b.dataset.m === metal));
    const k0 = Math.pow(10, +ksl.value), cox = +oxsl.value / 1000, cred = +redsl.value / 1000;
    $("kread").textContent = F.qty(F.sci(k0, 2), "m·s⁻¹"); $("oxread").textContent = mM(+oxsl.value); $("redread").textContent = mM(+redsl.value);
    const fe = { E0: 0.77, n: 1, k0, cox, cred, kdA: KD, kdC: KD };
    const bs = [fe, C.brancheO2(0), C.brancheH2(0, C.K_H2[metal])];             // the solvent: O₂ and H₂ evolution, H₂ fast on platinum, very slow on lead
    /* the curve leaves the frame at the walls: drawn up to the edge, not along it */
    const pts = C.courbeIE(bs, EX, 600).filter(([, j], k, a) => j >= JY[0] && j <= JY[1] || (a[k - 1] && Math.abs(a[k - 1][1]) <= JY[1]) || (a[k + 1] && Math.abs(a[k + 1][1]) <= JY[1]));
    curve.setAttribute("d", Plot.path(pts.map(([E, j]) => [x(E), y(Math.max(JY[0], Math.min(JY[1], j)))])));
    /* plateaus of the iron couple alone */
    refs.textContent = "";
    const la = C.F * KD * cred * 1000, lc = C.F * KD * cox * 1000;
    [la, -lc].filter(v => v).forEach(v => Plot.el("line", { x1: x(EX[0]), x2: x(EX[1]), y1: y(v), y2: y(v), class: "ref" }, refs));
    const eq = cox > 0 && cred > 0 ? 0.77 + C.pente() * Math.log10(cox / cred) : null;
    const Ei0 = C.potentielPourCourant(bs, 0, EX);
    dot.setAttribute("cx", x(Ei0)); dot.setAttribute("cy", y(0));
    $("eeq").textContent = eq === null ? t("ie.sans") : F.qty(F.fix(eq, 3), "V");
    /* threshold: the overpotential at which the iron couple gives a tenth of its smallest plateau */
    const cible = 0.1 * Math.min(la || Infinity, lc || Infinity);
    const sa = cred > 0 ? C.potentielPourCourant([fe], cible, [-3, 4]) : null, sc = cox > 0 ? C.potentielPourCourant([fe], -cible, [-3, 4]) : null;
    $("seuil").textContent = eq === null || sa === null || sc === null ? t("ie.sans") : t("ie.seuilv", { a: F.qty(F.fix((sa - eq) * 1000, 0), "mV"), c: F.qty(F.fix((sc - eq) * 1000, 0), "mV") });
    $("jlim").textContent = t("ie.limv", { a: J(la), c: J(lc) }); $("jlimf").textContent = t("ie.limf");
  }
  ksl.oninput = oxsl.oninput = redsl.oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1834, "idea"], ["tafel", 1905, "experiment"], ["heyrovsky", 1922, "experiment"], ["butler", 1924, "idea"], ["volmer", 1930, "idea"], ["clark", 1956, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["clark", "zinc", "chlore"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signe", "a"], ["lent", "c"], ["plateau", "b"], ["electrode", "d"], ["mur", "a"], ["vague", "b"], ["seuil", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
