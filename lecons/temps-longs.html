<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les temps longs</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-mesurer" data-i18n="monde.mesurer"></a><span class="aux">›</span><a href="/racoon/etape?id=le-temps" data-i18n="etape.le-temps"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <span class="chip plain" data-i18n="tag.prereq"></span>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n="s1.p1"></p>
    <p data-i18n="s1.p2"></p>
    <div class="list scale" id="ladder" role="table" data-i18n-attr="aria-label:ladder.aria"></div>
    <p class="caption" data-i18n="ladder.caption"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq">
      <math display="block"><mi>N</mi><mo>(</mo><mi>t</mi><mo>)</mo><mo>=</mo><msub><mi>N</mi><mn>0</mn></msub><mo>·</mo><msup><mn>2</mn><mrow><mo>−</mo><mi>t</mi><mo>/</mo><mi>T</mi></mrow></msup></math>
      
    </div>
    <p class="validite" data-i18n="eq1.validite"></p>
    <div class="box def"><b data-i18n="s2.def.title"></b>
      <p data-i18n-html="s2.def.body"></p>
    </div>
    <div class="box prop"><b data-i18n="s2.prop.title"></b>
      <p data-i18n-html="s2.prop.body"></p>
    </div>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq">
      <math display="block"><mfrac><mi>D</mi><mi>P</mi></mfrac><mo>=</mo><msup><mn>2</mn><mrow><mi>t</mi><mo>/</mo><mi>T</mi></mrow></msup><mo>−</mo><mn>1</mn></math>
      
    </div>
    <p class="validite" data-i18n="eq2.validite"></p>
    <figure class="chart">
      <svg id="dchart" role="img" data-i18n-attr="aria-label:chart.aria"></svg>
      <div class="panel">
        <div class="seg" role="group" data-i18n-attr="aria-label:chart.iso"><button type="button" id="i-c14" aria-pressed="true" data-i18n="iso.c14"></button><button type="button" id="i-u238" aria-pressed="false" data-i18n="iso.u238"></button><button type="button" id="i-u235" aria-pressed="false" data-i18n="iso.u235"></button></div>
        <div class="ctl"><div class="row"><label for="xsl" id="xlabel"></label><output id="xread" for="xsl"></output></div>
          <input id="xsl" type="range" min="0" max="1000" step="1" value="800"></div>
        <div class="controls"><button class="btn tinted" type="button" id="terre" data-i18n="chart.terre"></button></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="stat.half"></span><span class="v" id="vhalf"></span></div>
          <div class="stat"><span class="k" data-i18n="stat.age"></span><span class="v" id="vage"></span></div>
          <div class="stat"><span class="k" data-i18n="stat.n"></span><span class="v" id="vn"></span></div>
          <div class="stat"><span class="k" data-i18n="stat.err"></span><span class="v" id="verr"></span><span class="f" data-i18n="stat.err.f"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="chart.caption"></figcaption>
    </figure>
    <div class="box warn"><b data-i18n="s2.warn.title"></b>
      <p data-i18n-html="s2.warn.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n="s3.p1"></p>
    <p data-i18n="s3.p2"></p>
    <div class="box rem"><b data-i18n="s3.rem.title"></b>
      <p data-i18n-html="s3.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/temps-longs.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/lecons/temps-longs.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const $ = id => document.getElementById(id);
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const P = TempsLongs;
/* une durée en années, dans l'unité qui se lit le mieux */
const years = y => y >= 1e9 ? t("age.ga", { v: F.num(y / 1e9, 3) }) : y >= 1e6 ? t("age.ma", { v: F.num(y / 1e6, 3) }) : t("age.a", { v: F.num(y, 3) });

/* ---------- §5-4 : échelle des temps longs ---------- */
(() => {
  const ROWS = [["jour", 86400], ["an", P.YEAR], ["vie", 80 * P.YEAR], ["ecriture", 5000 * P.YEAR], ["c14", 5e4 * P.YEAR], ["terre", 4.54e9 * P.YEAR], ["univers", 13.8e9 * P.YEAR]];
  const names = textOf("ladder.rows", ROWS.map(r => r[0])), LO = 4, HI = 18;
  $("ladder").innerHTML = ROWS.map(([id, s]) => `<div role="row"><span role="cell">${names[id]}</span><span class="track" aria-hidden="true"><i style="left:${(Math.log10(s) - LO) / (HI - LO) * 100}%"></i></span><span class="v" role="cell">${F.qty("10" + F.sup(Math.round(Math.log10(s))), "s")}</span></div>`).join("");
})();

/* ---------- §5-4 : horloge radioactive, calcul d'âge ---------- */
(() => {
  const RANGE = { fraction: [-3, 0], ratio: [-3, 2] };
  const { x, y, g } = Plot.axes($("dchart"), { fmt: F, w: 640, h: 280,
    x: { domain: [0, 10], label: t("chart.x") }, y: { domain: [0, 1], label: t("chart.y") } });
  let d1 = "", d2 = "";
  for (let i = 0; i <= 200; i++) { const u = i / 20, r = Math.pow(2, -u);
    d1 += (i ? "L" : "M") + x(u).toFixed(1) + " " + y(r).toFixed(1); d2 += (i ? "L" : "M") + x(u).toFixed(1) + " " + y(1 - r).toFixed(1); }
  Plot.el("path", { d: d2, class: "ref" }, g);
  Plot.el("path", { d: d1, class: "curve" }, g);
  const dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  let iso = "c14";
  const xsl = $("xsl");
  const value = () => { const [a, b] = RANGE[P.ISOTOPES[iso].mode]; return Math.pow(10, a + xsl.value / 1000 * (b - a)); };
  const setValue = v => { const [a, b] = RANGE[P.ISOTOPES[iso].mode], k = v > 0 ? (Math.log10(v) - a) / (b - a) * 1000 : 0; xsl.value = Math.round(Math.min(1000, Math.max(0, k))); };
  const upd = () => {
    const I0 = P.ISOTOPES[iso], v = value(), age = P.age(iso, v), n = age / I0.half;
    $("xlabel").textContent = t("chart.x." + iso);
    $("xread").textContent = I0.mode === "fraction" ? F.qty(F.num(v * 100, 3), "%") : F.num(v, 3);
    $("vhalf").textContent = years(I0.half);
    $("vage").textContent = years(age);
    $("vn").textContent = F.num(n, 3);
    $("verr").textContent = years(P.ageUncertainty(I0.mode, v, I0.half, 0.01));
    dot.setAttribute("cx", x(Math.min(n, 10))); dot.setAttribute("cy", y(Math.pow(2, -Math.min(n, 10))));
  };
  const select = k => { iso = k; ["c14", "u238", "u235"].forEach(id => $("i-" + id).setAttribute("aria-pressed", String(id === k))); };
  const pick = k => { const keep = P.age(iso, value()), h = P.ISOTOPES[k].half; select(k);   // même âge, lu avec un autre isotope
    setValue(P.ISOTOPES[k].mode === "fraction" ? P.remaining(keep, h) : P.ratioAfter(keep, h)); upd(); };
  ["c14", "u238", "u235"].forEach(k => $("i-" + k).onclick = () => pick(k));
  $("terre").onclick = () => { select("u238"); setValue(P.ratioAfter(4.54e9, P.ISOTOPES.u238.half)); upd(); };
  xsl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kelvin", 1862, "idea"], ["becquerel", 1896, "experiment"], ["rutherford", 1905, "idea"], ["boltwood", 1907, "experiment"], ["holmes", 1911, "experiment"],
    ["libby", 1949, "experiment"], ["patterson", 1956, "experiment"], ["linceul", 1988, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ams", "zircon"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["trois", "a"], ["quart", "a"], ["limite", "a"], ["memoire", "a"], ["egal", "a"], ["zircon", "a"], ["choix", "a"], ["calibration", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
</html>
