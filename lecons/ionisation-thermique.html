<script src="/racoon/lecons/probabilites.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, { k_B, e: qe, m_e } = Constantes, W = S.W_H, EV = qe / k_B;

/* ---------- l'hydrogène : fraction ionisée selon T et la densité ---------- */
(() => {
  const svg = $("courbe"), st = $("t"), sn = $("n"), T0 = 2000, T1 = 30000, REF = [8, 14, 26];   // log10 n of the dashed curves
  function draw() {
    const T = +st.value, n = 10 ** +sn.value, f = S.fractionIonisee(n, T, W), lam = S.lambdaTh(m_e, T);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { domain: [T0, T1], label: t("sim.x") }, y: { domain: [0, 1], label: t("sim.y") } });
    const line = nn => { const p = []; for (let Ti = T0; Ti <= T1; Ti += 100) p.push([o.x(Ti), o.y(S.fractionIonisee(nn, Ti, W))]); return Plot.path(p); };
    for (const r of REF) Plot.el("path", { d: line(10 ** r), class: "stroke dash c-label-2" }, o.g);
    Plot.el("path", { d: line(n), class: "stroke bold c-tint" }, o.g);
    Plot.el("circle", { cx: o.x(T), cy: o.y(f), r: 5, class: "fill c-warn" }, o.g);
    const td = S.tDemi(n, W);
    $("tv").innerHTML = F.kelvin(T);
    $("nv").textContent = F.qty(F.sci(n, 2), "m⁻³");
    $("vf").textContent = f < 1e-3 ? F.sci(f, 2) : F.num(f, 3);
    $("vl").textContent = F.si(lam, "m");
    $("fl").textContent = t("sim.f.l", { r: F.sci(n * lam ** 3, 2) });
    $("vd").innerHTML = F.kelvin(td);
    $("fd").textContent = t("sim.f.d", { r: F.num(W * EV / td, 3) });
  }
  st.oninput = draw; sn.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["saha", 1920, "idea"], ["payne", 1925, "experiment"], ["russell", 1929, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["etoiles", "fond"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["bilan", "b"], ["dilution", "c"], ["loin", "a"], ["volume", "d"], ["neutre", "b"], ["payne", "a"], ["vide", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 423 });
})();
</script>
