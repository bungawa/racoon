<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const S = ChimOrga.Spectro, out = id => document.getElementById(id);
const larmor = B => MagInd.frequencePrecession("proton", B).f;
const presser = (el, attr, cle) => el.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset[attr] === cle)));
const lorentz = (rs, fs, w) => fs.map(f => rs.reduce((y, r) => y + r.I * (w / 2) ** 2 / ((f - r.f) ** 2 + (w / 2) ** 2), 0));
const multiplicite = n => t("mult." + Math.min(n, 9));

/* ---------- simulateur : spectres du premier ordre de molécules réelles ---------- */
(() => {
  const MOLS = ["ethanol", "acetateEthyle", "ethoxyethane", "propan2ol", "propane", "triethylamine"], noms = textOf("si.noms", MOLS);
  const sig = t("si.signaux");
  out("molrmn").innerHTML = MOLS.map(id => `<button type="button" data-m="${id}" aria-pressed="false">${noms[id]}</button>`).join("");
  let cle = "ethanol", choix = "ch2";
  const champ = out("champ"), W = 0.8;
  const A = Plot.axes(out("ctout"), { fmt: F, w: 420, h: 240, pad: { b: 44, l: 24 },
    x: { domain: [-4.5, 0], label: t("si.x"), fmt: v => F.num(Math.abs(v), 3) }, y: { domain: [0, 1.1], fmt: () => "" } });
  const Z = Plot.axes(out("czoom"), { fmt: F, w: 260, h: 240, pad: { b: 44, l: 24 },
    x: { domain: [-40, 40], label: t("si.xzoom") }, y: { domain: [0, 1.1], fmt: () => "" } });
  const tout = Plot.el("path", { class: "curve" }, A.g), cadre = Plot.el("rect", { class: "area" }, A.g), zoom = Plot.el("path", { class: "curve" }, Z.g);
  function boutonsSignaux() {
    const ss = S.MOLECULES_RMN[cle]; if (!ss.some(s => s.id === choix)) choix = ss.find(s => s.couplages.length).id;
    out("signal").innerHTML = ss.map(s => `<button type="button" data-s="${s.id}" aria-pressed="${s.id === choix}">${sig[s.id]} · ${F.fix(s.delta, 2)}</button>`).join("");
  }
  function maj() {
    presser(out("molrmn"), "m", cle); presser(out("signal"), "s", choix);
    const B = +champ.value / 100, nu0 = larmor(B), ss = S.MOLECULES_RMN[cle], rs = S.raies(ss, nu0);
    const ds = []; for (let i = 0; i <= 6000; i++) ds.push(4.5 * i / 6000);
    const ys = S.spectreRMN(rs, ds, nu0, W), ym = Math.max(...ys);
    tout.setAttribute("d", Plot.path(ds.map((d, i) => [A.x(-d), A.y(ys[i] / ym)])));
    const s = ss.find(x => x.id === choix), c = s.delta, demi = 40 / nu0 * 1e6;
    cadre.setAttribute("x", A.x(-(c + demi))); cadre.setAttribute("width", A.x(-(c - demi)) - A.x(-(c + demi)));
    cadre.setAttribute("y", A.y(1.1)); cadre.setAttribute("height", A.y(0) - A.y(1.1));
    const ml = S.multiplet(s.couplages), fs = []; for (let f = -40; f <= 40; f += 0.05) fs.push(f);
    const zs = lorentz(ml, fs, W), zm = Math.max(...zs);
    zoom.setAttribute("d", Plot.path(fs.map((f, i) => [Z.x(f), Z.y(zs[i] / zm)])));
    out("bread").innerHTML = F.qty(F.fix(B, 2), "T") + ' <span class="aux">(' + F.si(nu0, "Hz", { sig: 3 }) + ")</span>";
    const n = s.couplages.reduce((u, k) => u + k.n, 0), J = s.couplages.length ? s.couplages[0].J : 0;
    out("massif").textContent = multiplicite(ml.length);
    out("massiff").textContent = n ? t("si.voisins", { n, j: F.qty(F.num(J, 2), "Hz") }) : t("si.aucun");
    const lHz = ml[ml.length - 1].f - ml[0].f;
    out("largeur").textContent = F.qty(F.num(lHz, 3), "Hz"); out("largeurf").textContent = t("si.ppm", { p: F.qty(F.num(lHz / nu0 * 1e6, 2), "ppm") });
    const partenaires = ss.filter(x => x !== s && x.couplages.length && s.couplages.length);
    if (partenaires.length) {
      const r = Math.min(...partenaires.map(x => Math.abs(x.delta - c) * nu0 / 1e6)) / J;
      out("rapport").textContent = F.num(r, 3); out("rapportf").textContent = t(r > 10 ? "si.premier" : "si.second");
    } else { out("rapport").textContent = t("si.sans"); out("rapportf").textContent = ""; }
  }
  out("molrmn").onclick = e => { const b = e.target.closest("button"); if (!b) return; cle = b.dataset.m; boutonsSignaux(); maj(); };
  out("signal").onclick = e => { const b = e.target.closest("button"); if (!b) return; choix = b.dataset.s; maj(); };
  champ.oninput = maj; boutonsSignaux(); maj();
})();

/* ---------- AmMpXq : le massif de M ---------- */
(() => {
  const jam = out("jam"), jmx = out("jmx"); let v = "3-2";
  const { x, y, g } = Plot.axes(out("camx"), { fmt: F, w: 520, h: 220, pad: { b: 44, l: 24 },
    x: { domain: [-30, 30], label: t("mx.x") }, y: { domain: [0, 1.1], fmt: () => "" } });
  const courbe = Plot.el("path", { class: "curve" }, g), batons = Plot.el("g", {}, g);
  function maj() {
    presser(out("voisins"), "v", v);
    const [m, q] = v.split("-").map(Number), J1 = +jam.value / 10, J2 = +jmx.value / 10;
    const ml = S.multiplet([{ n: m, J: J1 }, { n: q, J: J2 }]), fs = []; for (let f = -30; f <= 30; f += 0.05) fs.push(f);
    const zs = lorentz(ml, fs, 0.6), zm = Math.max(...zs), Im = Math.max(...ml.map(r => r.I));
    courbe.setAttribute("d", Plot.path(fs.map((f, i) => [x(f), y(zs[i] / zm)])));
    batons.innerHTML = ""; ml.forEach(r => Plot.el("line", { x1: x(r.f), x2: x(r.f), y1: y(0), y2: y(r.I / Im), class: "ref" }, batons));
    out("jamread").textContent = F.qty(F.fix(J1, 1), "Hz"); out("jmxread").textContent = F.qty(F.fix(J2, 1), "Hz");
    out("nraies").textContent = F.fix(ml.length, 0);
    out("nraiesf").textContent = t("mx.attendu", { p: (m + 1) * (q + 1), s: m + q + 1 });
  }
  out("voisins").onclick = e => { const b = e.target.closest("button"); if (!b) return; v = b.dataset.v; maj(); };
  jam.oninput = jmx.oninput = maj; maj();
})();

/* ---------- AB : exact contre premier ordre ---------- */
(() => {
  const rap = out("rap"), J = 7, svg = out("cab");
  function maj() {
    const r = Math.pow(10, -0.7 + 2.4 * +rap.value / 100), dnu = r * J, ech = Math.max(dnu, J) * 1.3;   // Δν/J de 0,2 à 50
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 520, h: 220, pad: { b: 44, l: 24 },
      x: { domain: [-ech, ech], label: t("ab.x") }, y: { domain: [0, 1.1], fmt: () => "" } });
    const exacte = Plot.el("path", { class: "curve" }, g), premier = Plot.el("path", { class: "ref" }, g);
    const fs = []; for (let i = 0; i <= 1200; i++) fs.push(-ech + 2 * ech * i / 1200);
    const w = Math.max(0.6, ech / 120);
    const a = lorentz(S.ab(dnu, J), fs, w), b = lorentz(S.abPremierOrdre(dnu, J), fs, w), m = Math.max(...a, ...b);
    exacte.setAttribute("d", Plot.path(fs.map((f, i) => [x(f), y(a[i] / m)])));
    premier.setAttribute("d", Plot.path(fs.map((f, i) => [x(f), y(b[i] / m)])));
    const l = S.ab(dnu, J).sort((u, v) => u.f - v.f), D = Math.hypot(dnu, J);
    out("rapread").textContent = F.num(r, 2);
    out("toit").textContent = F.num(l[1].I / l[0].I, 3);
    out("decal").textContent = F.qty(F.num((D - dnu) / 2, 2), "Hz");
  }
  rap.oninput = maj; maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gutowsky", 1951, "experiment"], ["karplus", 1959, "idea"], ["lyon", 2009, "experiment"], ["florence", 2020, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount(out("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["structure", "paillasse"], uses = textOf("uses.items", USES);
  out("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["n1", "b"], ["pascal", "c"], ["champ", "a"], ["equiv", "d"], ["amx", "b"], ["toit", "d"], ["oh", "a"], ["septuplet", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount(out("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
