    <div class="eq"><math display="block"><msub><mi>g</mi><mi>r</mi></msub><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><msup><mi>r</mi><mn>2</mn></msup></mfrac><mrow><mo>[</mo><mn>1</mn><mo>−</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><msub><mi>J</mi><mn>2</mn></msub><msup><mrow><mo>(</mo><mfrac><mi>R</mi><mi>r</mi></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mo stretchy="false">(</mo><mn>3</mn><msup><mi data-i18n="fn.sin"></mi><mn>2</mn></msup><mi>φ</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo>]</mo></mrow></math></div>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const K = Constantes, MS2 = "m·s⁻²", DEG = Math.PI / 180;

/* ---------- la Terre en coquille ou en boule : intégration numérique contre le théorème ---------- */
(() => {
  const a = K.R_E_mean, M = K.GM_E / K.G, g0 = K.GM_E / (a * a), nsl = $("nsl"), rsl = $("rsl");
  let body = "coquille";
  const num = (r, n) => body === "coquille" ? Potentiel.coquille(M, a, r, { regle: "anneaux", n }).g : Potentiel.boule(M, a, r, { couches: n, coupe: false, tol: 1e-7 }).g;
  const exact = r => (body === "coquille" ? Potentiel.coquilleExacte(M, a, r) : Potentiel.bouleExacte(M, a, r)).g;
  function draw() {
    const n = +nsl.value, rr = rsl.value / 100, svg = $("gchart");
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { domain: [0, 3], label: t("sh.x") }, y: { domain: [-0.2, 1.2], label: t("sh.y") } });
    Plot.el("line", { x1: x(0), x2: x(3), y1: y(0), y2: y(0), class: "zero" }, g);
    Plot.el("line", { x1: x(1), x2: x(1), y1: y(-0.2), y2: y(1.2), class: "ref" }, g);
    const seg = (r0, r1) => { let d = ""; for (let i = 0; i <= 120; i++) { const r = r0 + (r1 - r0) * i / 120; d += (i ? "L" : "M") + x(r).toFixed(1) + " " + y(exact(r * a) / g0).toFixed(1); } return d; };
    Plot.el("path", { d: seg(0, 0.999) + seg(1.001, 3), class: "curve" }, g);           // deux morceaux : la coquille a un saut en r = a
    for (let i = 0; i <= 60; i++) { const r = i / 20, v = num(r * a, n) / g0; if (v > -0.2 && v < 1.2) Plot.el("circle", { cx: x(r), cy: y(v), r: 3, class: "fill c-warn" }, g); }
    const gn = num(rr * a, n), ge = exact(rr * a);
    Plot.el("circle", { cx: x(rr), cy: y(Math.max(-0.2, Math.min(1.2, gn / g0))), r: 6, class: "dot" }, g);
    $("nread").textContent = t(body === "coquille" ? "sh.nread.anneaux" : "sh.nread.couches", { n });
    $("rread").textContent = t("sh.rread", { r: F.fix(rr, 2) });
    $("vnum").textContent = F.qty(F.num(gn, 4), MS2);
    $("fnum").textContent = t("sh.f.num", { n });
    $("vex").textContent = F.qty(F.num(ge, 4), MS2);
    $("fex").textContent = t(rr < 1 ? (body === "coquille" ? "sh.f.dedans" : "sh.f.lineaire") : rr === 1 ? "sh.f.surface" : "sh.f.dehors");
    $("verr").textContent = F.sci(Math.abs(gn - ge) / g0, 2);
  }
  document.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { body = b.dataset.b;
    document.querySelectorAll("[data-b]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  nsl.oninput = rsl.oninput = draw; draw();
})();

/* ---------- la Terre aplatie et tournante : ce que le point néglige ---------- */
(() => {
  const lsl = $("lsl"), hsl = $("hsl");
  function upd() {
    const lat = lsl.value * DEG, r = K.R_E_eq + hsl.value * 1000, gp = K.GM_E / (r * r), j = Potentiel.j2(r, lat);
    const rot = K.Omega_E ** 2 * r * Math.cos(lat) ** 2 / gp;
    $("lread").textContent = F.num(+lsl.value, 3) + "°";
    $("hread").textContent = F.si(hsl.value * 1000, "m");
    $("vpt").textContent = F.qty(F.num(gp, 4), MS2);
    $("vj2").textContent = (j > 0 ? "+" : "") + F.sci(j, 2);
    $("fj2").textContent = t("j2.f.j2", { d: F.qty(F.num(Math.abs(j) * gp * 1000, 3), "mm·s⁻²") });
    $("vrot").textContent = F.sci(rot, 2);
  }
  lsl.oninput = hsl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1687, "idea"], ["gauss", 1813, "idea"], ["ostrogradski", 1826, "idea"], ["grace", 2002, "experiment"], ["gracefo", 2018, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["bouguer", "orbites"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dedans", "a"], ["dehors", "a"], ["tunnel", "a"], ["plan", "a"], ["pente", "a"], ["j2", "a"], ["surface", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 134 });
})();
</script>
