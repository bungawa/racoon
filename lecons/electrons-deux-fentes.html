<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, UM = 1e-6;
/* the bench: 50 keV electrons, slits 0,3 µm wide and 1 µm apart, screen 1 m behind */
const EC = 50e3 * Q.e, P = Q.impulsion(Q.m_e, EC), LAM = Q.broglie(P);
const BANC = { lambda: LAM, d: 1 * UM, a: 0.3 * UM, L: 1 }, X = 16 * UM, NB = 48;
const dens = x => Q.amplitudesDeuxFentes(x, BANC).P12;
/* the share of each cell, for the expected counts */
const PART = (() => { const m = NB * 200, h = 2 * X / m, c = []; let tot = 0, cur = 0;
  for (let j = 0; j < m; j++) { const v = dens(-X + (j + 0.5) * h) * h; tot += v; cur += v; if ((j + 1) % 200 === 0) { c.push(cur); cur = 0; } }
  return c.map(v => v / tot); })();

/* ---------- electrons one at a time: the screen, the clicks, the counts ---------- */
(() => {
  const ecran = $("ecran"), clics = $("clics"), histo = $("histo"), sdebit = $("sdebit"), lect = $("lecture");
  const alea = Q.aleaGraine(Date.now());
  let pts = [], h = new Array(NB).fill(0), N = 0, temps = 0, instants = [], enCours = false, avant = 0;
  const MAXPTS = 20000;
  const debit = () => Math.pow(10, +sdebit.value);
  function ajouter(n) {
    const xs = Q.tirerArrivees(dens, -X, X, n, alea, 2000);
    Q.histogrammeArrivees(xs, -X, X, NB).forEach((v, c) => h[c] += v);
    for (const x of xs) { if (pts.length < MAXPTS) pts.push([x, alea()]); }
    N += n;
  }
  function dessiner() {
    /* the screen: one small square per arrival */
    ecran.innerHTML = "";
    Plot.el("rect", { x: 20, y: 5, width: 600, height: 140, class: "stroke thin c-label-2" }, ecran);
    const d = pts.map(([x, y]) => "M" + (20 + 600 * (x + X) / (2 * X)).toFixed(1) + " " + (6 + 137 * y).toFixed(1) + "h1.6v1.6h-1.6z").join("");
    Plot.el("path", { d, class: "fill c-tint" }, ecran);
    /* the clicks of the last 5 s, all the same */
    clics.innerHTML = "";
    Plot.el("line", { x1: 20, x2: 620, y1: 40, y2: 40, class: "stroke thin c-label-2" }, clics);
    instants.filter(s => s > temps - 5).forEach(s => { const x = 620 - 120 * (temps - s); Plot.el("line", { x1: x, x2: x, y1: 10, y2: 40, class: "stroke c-label" }, clics); });
    /* the counts per cell, the expected N p and the band ± σ */
    histo.innerHTML = "";
    const att = PART.map(p => Q.fluctuationComptage(N, p)), haut = Math.max(4, ...h, ...att.map(a => a.moyenne + 2 * a.ecart)) * 1.05;
    const G = Plot.axes(histo, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 44 }, x: { domain: [-16, 16], label: t("fig.xaxis") }, y: { domain: [0, haut], label: t("fig.yaxis") } });
    const cw = 2 * X / NB, gx = x => G.x(x / UM);
    h.forEach((v, c) => { if (v) Plot.el("rect", { x: gx(-X + c * cw) + 1, width: gx(cw) - gx(0) - 2, y: G.y(v), height: G.y(0) - G.y(v), class: "fill c-tint" }, G.g); });
    if (N) {
      const bord = s => att.flatMap((a, c) => [[gx(-X + c * cw), G.y(Math.max(0, a.moyenne + s * a.ecart))], [gx(-X + (c + 1) * cw), G.y(Math.max(0, a.moyenne + s * a.ecart))]]);
      Plot.el("path", { d: Plot.path(bord(1)), class: "stroke thin dash c-label-2" }, G.g);
      Plot.el("path", { d: Plot.path(bord(-1)), class: "stroke thin dash c-label-2" }, G.g);
      Plot.el("path", { d: Plot.path(bord(0)), class: "stroke c-label" }, G.g);
    }
    /* stats: the central cell, and how many σ separate a bright cell from the dark one next to it */
    const c0 = NB / 2, fl = Q.fluctuationComptage(N, PART[c0]);
    const iMin = PART.indexOf(Math.min(...PART.slice(c0, c0 + 12)), c0), fm = Q.fluctuationComptage(N, PART[iMin]);
    const z = N ? (fl.moyenne - fm.moyenne) / Math.sqrt(fl.ecart ** 2 + fm.ecart ** 2) : 0;
    $("vn").textContent = F.num(N, 6);
    $("fn").textContent = t("fig.f.n", { c: F.num(h[c0], 6) });
    $("vfl").textContent = N ? F.num(100 * fl.relatif, 2) + " %" : "—";
    $("ffl").textContent = t("fig.f.fluct", { m: F.num(fl.moyenne, 3) });
    $("vfr").textContent = N ? F.num(z, 2) + " σ" : "—";
    $("ffr").textContent = t(z > 5 ? "fig.f.nettes" : z > 2 ? "fig.f.devinees" : "fig.f.noyees");
    $("sdebitr").textContent = F.num(debit(), 2) + " " + t("fig.parS");
  }
  function boucle(ts) {
    if (!enCours) return;
    const dt = Math.max(0, Math.min(0.1, (ts - avant) / 1000)); avant = ts;
    const nouv = Q.instantsPoisson(debit(), dt, alea).map(s => temps + s);
    temps += dt; instants = instants.filter(s => s > temps - 5).concat(nouv);
    if (nouv.length) ajouter(nouv.length);
    dessiner(); requestAnimationFrame(boucle);
  }
  lect.onclick = () => { enCours = !enCours; lect.textContent = t(enCours ? "fig.pause" : "fig.lecture"); if (enCours) { avant = performance.now(); requestAnimationFrame(boucle); } };
  $("plus1").onclick = () => { ajouter(1); instants.push(temps); dessiner(); };
  $("plus100").onclick = () => { ajouter(100); dessiner(); };
  $("plus10k").onclick = () => { ajouter(10000); dessiner(); };
  $("effacer").onclick = () => { pts = []; h = new Array(NB).fill(0); N = 0; instants = []; dessiner(); };
  sdebit.oninput = dessiner; dessiner();
})();

/* ---------- the system described: one electron at a time, how many to see the fringes ---------- */
(() => {
  const gamma = 1 + EC / (Q.m_e * Q.c ** 2), v = Q.c * Math.sqrt(1 - 1 / gamma ** 2), debit = 1000, Lapp = 1;
  $("sys1").innerHTML = t("sys1.body", { l: F.si(LAM, "m"), v: F.num(v / Q.c, 2), i: F.si(Q.interfrangeFentes(LAM, BANC.L, BANC.d), "m"),
    e: F.si(v / debit, "m"), n: F.sci(debit * Lapp / v, 1) });
  const c0 = NB / 2, iMin = PART.indexOf(Math.min(...PART.slice(c0, c0 + 12)), c0);
  const z = N => { const a = Q.fluctuationComptage(N, PART[c0]), b = Q.fluctuationComptage(N, PART[iMin]); return (a.moyenne - b.moyenne) / Math.sqrt(a.ecart ** 2 + b.ecart ** 2); };
  $("sys2").innerHTML = t("sys2.body", { z8: F.num(z(8), 2), z270: F.num(z(270), 2), z2000: F.num(z(2000), 2), z160k: F.num(z(160000), 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["jonsson", 1961, "experiment"], ["bologne", 1974, "experiment"], ["tonomura", 1989, "experiment"], ["masque", 2013, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["holographie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["clics", "a"], ["filament", "c"], ["deux", "b"], ["proba", "d"], ["huit", "a"], ["pensee", "c"], ["seul", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 374 });
})();
</script>
