          <div class="stat"><span class="k" data-i18n="viv.k.eau"></span><span class="v" id="vtue"></span><span class="f" data-i18n="viv.f.eau"></span></div>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = ChimOrga.Polymeres, PC = PolyCoord;
const pc = x => F.qty(F.num(100 * x, 3), "%");
const keyed = (el, k, ids) => { const txt = textOf(k, ids); $(el).innerHTML = ids.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text}</span></div>`).join(""); };

keyed("actes", "actes", ["amorcage", "propagation", "pas", "fin"]);
keyed("copos", "copos", ["statistique", "alterne", "blocs", "greffe"]);

/* ---------- living chains: Poisson against Schulz–Flory ---------- */
(() => {
  const svg = $("distrib"), sR = $("ratio"), sX = $("conv"), sE = $("eau");
  const I0 = 1 * P.MOL_L / 1000, M0 = P.motif("styrene").M0;              // 1 mmol·L⁻¹ of butyllithium, in mol·m⁻³
  function draw() {
    const r = Math.pow(10, +sR.value), x = +sX.value, eau = +sE.value * 1e-3;  // [M]₀/[I]₀ ; conversion ; mg·L⁻¹ → kg·m⁻³
    const tue = P.eauTuee(eau, I0), Iact = I0 * (1 - tue);
    const nu = tue >= 1 ? 0 : x * r * I0 / Iact, v = P.vivante(nu), s = PC.schulzFlory(1 - 1 / v.Xn);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { scale: "log", domain: [1, 1e5], label: t("viv.x") }, y: { domain: [0, 1.1], label: t("viv.y") } });
    /* mass per interval of ln n, n·w(n), each curve relative to its own maximum */
    const N = 900, ns = Array.from({ length: N + 1 }, (_, i) => Math.max(1, Math.round(Math.pow(10, 5 * i / N))));
    [[n => n * v.masse(n), "stroke bold c-tint"], [n => n * s.masse(n), "stroke c-label-2"]].forEach(([g, cls]) => {
      const ys = ns.map(g), top = Math.max(...ys) || 1;
      Plot.el("path", { d: Plot.path(ns.map((n, i) => [o.x(n), o.y(ys[i] / top)])), class: cls }, o.g);
    });
    Plot.el("text", { x: o.x(v.Xn) + 6, y: o.y(1.02), class: "note" }, o.g).textContent = t("viv.poisson");
    Plot.el("text", { x: o.x(Math.min(2 * v.Xn, 9e4)), y: o.y(0.55), class: "note" }, o.g).textContent = t("viv.sf");
    $("ratiov").textContent = F.num(r, 3); $("convv").textContent = pc(x);
    $("eauv").textContent = F.qty(F.num(+sE.value, 3), "mg·L⁻¹");
    $("vxn").textContent = F.num(v.Xn, 4);
    $("fmn").textContent = t("viv.f.mn", { mn: F.qty(F.num(v.Xn * M0, 3), "kg·mol⁻¹") });
    $("vd").textContent = F.num(v.D, 4); $("vsf").textContent = F.num(s.D, 4);
    $("vtue").textContent = pc(tue);
  }
  [sR, sX, sE].forEach(e => e.oninput = draw); draw();
})();

/* ---------- tacticity: Bernoulli triads ---------- */
(() => {
  const sl = $("pm"), rand = Quiz.rng(1956), L = 4000;
  let conf;
  function lire() {
    const Pm = +sl.value, th = P.triades(Pm), cpt = { mm: 0, mr: 0, rr: 0 };
    for (let i = 2; i < conf.length; i++) { const a = conf[i - 1] === conf[i - 2], b = conf[i] === conf[i - 1]; cpt[a && b ? "mm" : !a && !b ? "rr" : "mr"]++; }
    $("pmv").textContent = F.num(Pm, 2);
    ["mm", "mr", "rr"].forEach(k => { $("v" + k).textContent = pc(th[k]); $("f" + k).textContent = t("tri.f.compte", { p: pc(cpt[k] / (conf.length - 2)) }); });
    const d = []; for (let i = 1; i <= 40; i++) d.push(conf[i] === conf[i - 1] ? "m" : "r");
    $("diades").innerHTML = t("tri.lu", { d: d.join(" "), n: L - 1, m: pc(PC.meso(conf)) });
  }
  const tirer = () => { conf = PC.chaine(L, "ata", rand, +sl.value); lire(); };
  sl.oninput = tirer; $("tirer").onclick = tirer; tirer();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mayo", 1944, "idea"], ["natta", 1954, "experiment"], ["szwarc", 1956, "experiment"], ["kraton", 1964, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sbs", "etalons"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["vivant", "a"], ["eau", "c"], ["xn", "b"], ["dispersite", "d"], ["monomere", "a"], ["bloc", "c"], ["triades", "b"], ["sbs", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1956 });
})();
</script>
