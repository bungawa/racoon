      <div class="legend"><span class="c-tint sq" data-i18n="mc.legend.sim"></span><span class="c-warn" data-i18n="mc.legend.th"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="nn" data-i18n="mc.n"></label><output id="nnv" for="nn"></output></div>
            <input id="nn" type="range" min="2" max="5" step="0.1" value="3.5"></div>
          <div class="ctl"><div class="row"><label for="bm" data-i18n="mc.bmax"></label><output id="bmv" for="bm"></output></div>

          <div class="stat"><span class="k" data-i18n="mc.k.arriere"></span><span class="v" id="varriere"></span><span class="f" data-i18n="mc.f.arriere"></span></div>

<script src="/racoon/i18n.js"></script>

<script src="/racoon/lecons/cinematique.js"></script>

<script src="/racoon/lecons/algebre-vectorielle.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
const DEG = Math.PI / 180, Cst = Constantes, D = DeuxCorps;

/* ---------- sphères dures : tirage et histogramme ---------- */
(() => {
  const P = Plot.el, BORNES = Array.from({ length: 13 }, (_, i) => i * 15 * DEG); let graine = 1;
  const pc = x => F.qty(F.num(100 * x, 3), "%");
  function upd() {
    const N = Math.round(Math.pow(10, +$("nn").value)), bmax = +$("bm").value, R = 1;
    $("nnv").textContent = F.num(N, 6); $("bmv").textContent = F.num(bmax, 3) + " R";
    const th = D.tirer(N, bmax, graine).map(b => D.sphereDure(b, R)), hit = th.filter(x => x > 0);
    const c = D.histogramme(hit, BORNES), att = c.map((_, i) => D.isotrope(N, R, bmax, BORNES[i], BORNES[i + 1]));
    const svg = $("hist"); svg.innerHTML = "";
    const ymax = Math.max(...c, ...att) * 1.15 || 1;
    const { x: X, y: Y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44 }, x: { domain: [0, 180], label: t("mc.x") }, y: { domain: [0, ymax], label: t("mc.y") } });
    c.forEach((n, i) => P("rect", { x: X(BORNES[i] / DEG) + 2, y: Y(n), width: X(BORNES[i + 1] / DEG) - X(BORNES[i] / DEG) - 4, height: Y(0) - Y(n), class: "area" }, g));
    P("path", { d: att.map((a, i) => "M" + X(BORNES[i] / DEG) + " " + Y(a) + "H" + X(BORNES[i + 1] / DEG)).join(""), class: "ref" }, g);
    const sigma = (R / bmax) ** 2;
    $("vtouche").textContent = pc(hit.length / N); $("ftouche").textContent = t("mc.f.touche", { s: pc(sigma) });
    $("varriere").textContent = pc(hit.filter(x => x > Math.PI / 2).length / Math.max(1, hit.length));
    const chi = c.reduce((s, n, i) => s + (n - att[i]) ** 2 / att[i], 0);
    $("vchi").textContent = F.num(chi, 3);
  }
  $("nn").oninput = $("bm").oninput = upd; $("tirer").onclick = () => { graine++; upd(); }; upd();
})();

/* ---------- la feuille d'or de Geiger et Marsden ---------- */
const OR = (() => {
  const n = D.densite(19283, 196.966570), x = 2.1e-7, E = D.masseAlpha * 2.06e7 ** 2 / 2;
  const d = D.coulomb(2, 79) / D.ecm(E, D.masseAlpha, 197 * Cst.u);
  $("orn").textContent = F.qty(F.sci(n, 3), "m⁻³");
  $("orc").textContent = F.num(x * Math.cbrt(n), 3);
  const p = n * x * Math.PI * d * d;
  $("orp").textContent = t("or.v.p", { n: F.num(Math.round(1 / p / 1000) * 1000, 6) });
  return { n, x, d, p };
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["mince", "elastique", "recul"], items = textOf("sys.items", IDS);
  const v = { p: F.sci(OR.p, 1), kau: F.num(D.facteurK(4, 197, Math.PI), 3), kc: F.num(D.facteurK(4, 12, Math.PI), 3),
    lab: F.num(D.angleLabo(90 * DEG, 4, 197) / DEG, 3) };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["clausius", 1858, "idea"], ["barn", 1942, "idea"], ["lhc", 2024, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["luminosite", "neutrons"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["surface", "a"], ["isotrope", "c"], ["mince", "b"], ["libre", "d"], ["labo", "b"], ["disque", "a"], ["epais", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 227 });
})();
</script>
