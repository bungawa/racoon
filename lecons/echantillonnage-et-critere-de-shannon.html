<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["carte", "quantification", "instants", "filtre"]; keyed($("systeme"), t("systeme.tag"), IDS, textOf("systeme.items", IDS)); })();

/* ---------- une sinusoïde, ses échantillons, et ce que la formule (3.3) en reconstruit ---------- */
(() => {
  const O = self.Ondes, FEN = 2e-3;                      // fenêtre affichée : 2 ms
  function upd() {
    const f = +$("cf").value, fe = +$("cfe").value, u = t => Math.cos(2 * Math.PI * f * t), fa = O.replie(f, fe);
    $("cfv").textContent = F.si(f, "Hz"); $("cfev").textContent = F.si(fe, "Hz");
    /* échantillons de −40 ms à +40 ms (assez pour que la somme tronquée de (3.3) soit juste au centre) */
    const n = Math.round(80e-3 * fe) + 1, t0 = -40e-3, E = O.prelever(u, fe, n, t0), R = O.reconstruire(E.y, fe, t0);
    let svg = $("temps"); svg.innerHTML = "";
    let P = Plot.axes(svg, { fmt: F, w: 640, h: 230, pad: { l: 56, b: 44 }, x: { domain: [0, FEN * 1e3], label: t("ec.taxis") }, y: { domain: [-1.3, 1.3], label: t("ec.yaxis") } });
    const ts = Array.from({ length: 801 }, (_, j) => FEN * j / 800);
    Plot.el("path", { d: Plot.path(ts.map(tt => [P.x(tt * 1e3), P.y(u(tt))])), class: "stroke thin c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(ts.filter((_, j) => j % 4 === 0).map(tt => [P.x(tt * 1e3), P.y(Math.max(-1.3, Math.min(1.3, R(tt))))])), class: "curve" }, P.g);
    E.t.forEach((tt, k) => { if (tt >= -1e-12 && tt <= FEN + 1e-12) Plot.el("circle", { cx: P.x(tt * 1e3), cy: P.y(E.y[k]), r: 4, class: "fill c-warn" }, P.g); });
    /* raies : f et ses images |m fe ± f|, la bande [0, fe/2] */
    svg = $("raies"); svg.innerHTML = "";
    P = Plot.axes(svg, { fmt: F, w: 640, h: 180, pad: { l: 56, b: 44 }, x: { domain: [0, 40], label: t("ec.faxis") }, y: { domain: [0, 1.2], label: t("ec.aaxis") } });
    Plot.el("rect", { x: P.x(0), y: P.y(1.2), width: P.x(fe / 2e3) - P.x(0), height: P.y(0) - P.y(1.2), class: "area" }, P.g);
    O.images(f, fe, 6).forEach(g => { if (g > 40e3) return; const vrai = Math.abs(g - f) < 1e-6, dedans = g <= fe / 2 + 1e-9;
      Plot.el("line", { x1: P.x(g / 1e3), x2: P.x(g / 1e3), y1: P.y(0), y2: P.y(vrai ? 1 : 0.6), class: "stroke bold " + (vrai ? "c-label-2" : dedans ? "c-tint" : "c-warn") }, P.g); });
    $("va").textContent = F.si(fa, "Hz"); $("fa").textContent = t(Math.abs(fa - f) < 1e-6 ? "ec.f.juste" : "ec.f.replie", { m: F.num(Math.round(f / fe), 2) });
    $("vn").textContent = F.num(fe / f, 3); $("fn").textContent = t("ec.f.par");
    const ok = fe > 2 * f;
    $("vc").textContent = t(ok ? "ec.v.ok" : "ec.v.non"); $("fc").textContent = t("ec.f.critere", { m: F.si(fe / 2, "Hz") });
  }
  ["cf", "cfe"].forEach(id => $(id).oninput = upd);
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["whittaker", 1915, "idea"], ["nyquist", 1928, "idea"], ["kotelnikov", 1933, "idea"], ["shannon", 1949, "idea"], ["cd", 1982, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["disque", "cinema"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["alias", "c"], ["minimum", "a"], ["pourquoi", "d"], ["avant", "b"], ["roue", "c"], ["rendu", "a"], ["recurrence", "d"], ["limite", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1949 });
})();
</script>
