<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹";

/* ---------- une personne marche sur un wagon : le centre de masse ne bouge pas ---------- */
(() => {
  const svg = $("wagon"), P = Plot.el, L = 3, CRR = 0.0015, PX = 70, X0 = 215, Y0 = 130;
  const label = (x, y, text, parent, anchor) => { const e = P("text", { x, y, "text-anchor": anchor || "middle" }, parent); e.textContent = text; return e; };
  const msl = $("wmsl"), Msl = $("wMsl"), dsl = $("wdsl"), usl = $("wusl");
  let anim = 0;
  function draw() {
    svg.innerHTML = "";
    const m = +msl.value, M = +Msl.value, dur = +dsl.value, u = usl.value / 1000, s = L * u * u * (3 - 2 * u);   // marche douce : départ et arrêt sans à-coup
    const b = QteMvt.boat(m, M, s), end = QteMvt.boat(m, M, L);
    P("line", { x1: 10, x2: 630, y1: Y0 + 22, y2: Y0 + 22, class: "stroke c-label-2" }, svg);
    label(600, Y0 + 40, t("wagon.rails"), svg, "end");
    const wx = X0 + PX * b.boat, ww = PX * 4.2;                               // plateau de 4,2 m ; la personne part à 0,6 m du bord gauche
    P("rect", { x: wx, y: Y0 - 8, width: ww, height: 18, rx: 3, class: "fill c-label-2" }, svg);
    [0.12, 0.88].forEach(f => P("circle", { cx: wx + f * ww, cy: Y0 + 14, r: 8, class: "stroke c-label-2" }, svg));
    const px = X0 + PX * (0.6 + b.person);
    const g = P("g", { class: "c-tint" }, svg);
    P("circle", { cx: px, cy: Y0 - 64, r: 8, class: "fill" }, g);
    P("line", { x1: px, y1: Y0 - 56, x2: px, y2: Y0 - 26, class: "stroke bold" }, g);
    P("line", { x1: px, y1: Y0 - 26, x2: px - 8, y2: Y0 - 8, class: "stroke" }, g); P("line", { x1: px, y1: Y0 - 26, x2: px + 8, y2: Y0 - 8, class: "stroke" }, g);
    /* G : fixe ; repère du départ */
    const gx = X0 + PX * (m * 0.6 + M * 2.1) / (m + M);
    const gg = P("g", { class: "c-warn" }, svg);
    P("line", { x1: gx, x2: gx, y1: 20, y2: Y0 + 30, class: "stroke thin dash" }, gg);
    P("circle", { cx: gx, cy: Y0 - 30, r: 5, class: "fill" }, gg);
    label(gx, 14, t("wagon.glabel"), svg);
    P("line", { x1: X0, x2: X0, y1: Y0 + 26, y2: Y0 + 40, class: "stroke thin c-label-2" }, svg);
    label(X0, Y0 + 54, t("wagon.start"), svg);
    $("wmread").textContent = F.qty(F.num(m, 3), "kg"); $("wMread").textContent = F.qty(F.num(M, 3), "kg");
    $("wdread").textContent = F.si(dur, "s", { prefix: "" }); $("wuread").textContent = F.qty(F.fix(s, 2), "m");
    $("ww").textContent = F.qty(F.fix(-end.boat, 2), "m");
    $("wp").textContent = F.qty(F.fix(end.person, 2), "m");
    $("wg").textContent = F.qty(F.fix(0, 2), "m");
    const vw = m * L / ((m + M) * dur);                                       // vitesse moyenne du wagon pendant la marche
    $("wshare").textContent = F.qty(F.num(100 * CRR * (m + M) * QteMvt.G * dur / (M * vw), 2), "%");
  }
  $("walk").onclick = () => { cancelAnimationFrame(anim); const t0 = performance.now(), d = 1000 * +dsl.value;
    const step = now => { const k = Math.min(1, (now - t0) / d); usl.value = Math.round(1000 * k); draw(); if (k < 1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step); };
  msl.oninput = Msl.oninput = dsl.oninput = usl.oninput = () => { cancelAnimationFrame(anim); draw(); };
  draw();
})();

/* ---------- fusée : n paquets, puis la limite logarithmique ---------- */
(() => {
  const svg = $("rchart"), rsl = $("rrsl"), usl = $("rusl"), nsl = $("rnsl"), tsl = $("rtsl"), RMAX = 20;
  function draw() {
    svg.innerHTML = "";
    const R = +rsl.value, u = +usl.value, n = +nsl.value, tb = +tsl.value;
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { domain: [1, RMAX], label: t("rocket.x") },
      y: { domain: [0, 4500 * Math.log(RMAX) / 1000 * 1.02], label: t("rocket.y") } });
    const path = f => { let d = ""; for (let i = 0; i <= 160; i++) { const r = 1 + (RMAX - 1) * i / 160; d += (i ? "L" : "M") + x(r).toFixed(1) + " " + y(f(r) / 1000).toFixed(1); } return d; };
    Plot.el("path", { d: path(r => QteMvt.rocket(r, 1, u)), class: "curve" }, g);
    Plot.el("path", { d: path(r => QteMvt.rocketDiscrete(r, 1, u, n)), class: "ref" }, g);
    const dn = QteMvt.rocketDiscrete(R, 1, u, n), dl = QteMvt.rocket(R, 1, u), loss = QteMvt.G * tb;
    Plot.el("circle", { cx: x(R), cy: y(dl / 1000), r: 6, class: "dot" }, g);
    Plot.el("circle", { cx: x(R), cy: y(dn / 1000), r: 5, class: "dot" }, g);
    $("rrread").textContent = F.num(R, 3); $("ruread").textContent = F.qty(F.num(u, 4), MS);
    $("rnread").textContent = F.num(n, 3); $("rtread").textContent = F.si(tb, "s", { prefix: "" });
    $("rn").textContent = F.qty(F.num(dn / 1000, 3), "km·s⁻¹");
    $("rnf").textContent = t("rocket.f.n", { e: F.num(100 * (1 - dn / dl), 2) });
    $("rl").textContent = F.qty(F.num(dl / 1000, 3), "km·s⁻¹");
    $("rg").textContent = F.qty(F.num(loss / 1000, 3), "km·s⁻¹");
    $("rnet").textContent = F.qty(F.num((dl - loss) / 1000, 3), "km·s⁻¹");
  }
  rsl.oninput = usl.oninput = nsl.oninput = tsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["descartes", 1644, "idea"], ["wallis", 1668, "idea"], ["tsiolkovski", 1903, "idea"], ["ariane", 2024, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["etages", "astronaute"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["isole", "a"], ["horizontal", "a"], ["obus", "a"], ["wagon", "a"], ["centre", "a"], ["fusee", "a"], ["paquets", "a"], ["frottement", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 102 });
})();
</script>
