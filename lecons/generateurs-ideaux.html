<link rel="stylesheet" href="/racoon/ds.css">

<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-ondes-milieux" data-i18n="monde.ondes-milieux"></a><span class="aux">›</span><a href="/racoon/etape?id=circuits-impedances" data-i18n="etape.circuits-impedances"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-em" href="/racoon/atlas?piste=em" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/alternateur" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>V</mi><mo>=</mo><mo>−</mo><mi>ℰ</mi><mo>=</mo><mfrac><mi>d</mi><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>(</mo><mtext data-i18n="eq.flux"></mtext><mo>)</mo></math><span class="n">(22.11)</span></div>
    <p class="validite" data-i18n-html="val.22.11"></p>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mfrac><mover><mi>F</mi><mo>→</mo></mover><mi>q</mi></mfrac><mo>=</mo><mover><mi>E</mi><mo>→</mo></mover><mo>+</mo><mover><mi>v</mi><mo>→</mo></mover><mo>∧</mo><mover><mi>B</mi><mo>→</mo></mover><mo>=</mo><mover><mn>0</mn><mo>→</mo></mover></math><span class="n">(22.12)</span></div>
    <p class="validite" data-i18n-html="val.22.12"></p>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi>V</mi><mo>=</mo><mi>ℰ</mi><mo>−</mo><msub><mi>z</mi><mi>i</mi></msub><mi>I</mi></math></div>
    <p class="validite" data-i18n-html="val.reel"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="eq"><math display="block"><mi>I</mi><mo>=</mo><msub><mi>I</mi><mi>N</mi></msub><mo>−</mo><mfrac><mi>V</mi><msub><mi>z</mi><mi>i</mi></msub></mfrac><mo>,</mo><mspace width="1.2em"/><msub><mi>I</mi><mi>N</mi></msub><mo>=</mo><mfrac><mi>ℰ</mi><msub><mi>z</mi><mi>i</mi></msub></mfrac></math></div>
    <p class="validite" data-i18n-html="val.norton"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="list keyed" id="sources"></div>
    <figure class="chart">
      <svg class="fig" id="trace" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.reel"></span><span class="c-label-2" data-i18n="fig.legend.ideal"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" role="group" id="mode" data-i18n-attr="aria-label:fig.source">
            <button type="button" data-m="pile" data-i18n="fig.pile"></button>
            <button type="button" data-m="alternateur" data-i18n="fig.alternateur"></button>
            <button type="button" data-m="gbf" data-i18n="fig.gbf"></button>
          </div>
          <div class="ctl"><div class="row"><label for="lr" data-i18n="fig.r"></label><output id="lrv" for="lr"></output></div>
            <input id="lr" type="range" min="-2" max="6" step="0.01" value="1"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="fig.k.v"></span><span class="v" id="vv"></span><span class="f" id="fv"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.k.i"></span><span class="v" id="vi"></span><span class="f" id="fi"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.k.ecart"></span><span class="v" id="ve"></span><span class="f" id="fe"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <p data-i18n-html="s4.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/generateurs-ideaux.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/ondes-milieux.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- trois sources réelles sur une charge résistive ---------- */
(() => {
  /* ℰ (V) and the internal impedance zi (Ω) at the working frequency: a cell in dc, a small alternator at 50 Hz
     (0,5 Ω of wire, 5 mH of winding), a function generator with its 50 Ω output */
  const SOURCES = {
    pile: { e: 1.5, zi: Cx.c(0.2) },
    alternateur: { e: 12, zi: Cx.c(0.5, 2 * Math.PI * 50 * 5e-3) },
    gbf: { e: 1, zi: Cx.c(50) },
  };
  keyed($("sources"), t("sources.tag"), Object.keys(SOURCES), textOf("sources.items", Object.keys(SOURCES)));
  const seg = $("mode"), lr = $("lr"), LR = Array.from({ length: 401 }, (_, i) => -2 + 8 * i / 400);
  let id = "pile";
  const cplx = (z, u, sig = 3) => { const m = Cx.abs(z), n = v => F.num(Math.abs(v), sig), s = v => v < 0 ? F.MINUS : "", r = Math.abs(z.re) > 1e-9 * m, i = Math.abs(z.im) > 1e-9 * m;
  return (r && i ? Cx.text(z, v => F.num(v, sig)) : i ? s(z.im) + n(z.im) + " i" : s(z.re) + n(z.re)) + " " + u; };
  function draw() {
    const S = SOURCES[id], R = 10 ** +lr.value, g = M.generateur(S.e, S.zi, R), n = M.norton(S.e, S.zi);
    const svg = $("trace"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { scale: "log", domain: [1e-2, 1e6], label: t("fig.xaxis") }, y: { domain: [0, 1.1], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(1e-2), x2: P.x(1e6), y1: P.y(1), y2: P.y(1), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("line", { x1: P.x(Cx.abs(S.zi)), x2: P.x(Cx.abs(S.zi)), y1: P.y(0), y2: P.y(1.1), class: "stroke thin c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(LR.map(l => [P.x(10 ** l), P.y(Cx.abs(M.generateur(S.e, S.zi, 10 ** l).V) / S.e)])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(R), cy: P.y(Cx.abs(g.V) / S.e), r: 5, class: "dot" }, P.g);
    $("lrv").textContent = F.si(R, "Ω");
    $("vv").textContent = F.si(Cx.abs(g.V), "V");
    $("fv").textContent = t("fig.f.v", { e: F.si(S.e, "V"), phi: F.qty(F.fix(Cx.arg(g.V), 3), "rad") });
    $("vi").textContent = F.si(Cx.abs(g.I), "A");
    $("fi").textContent = t("fig.f.i", { j: F.si(Cx.abs(n.J), "A"), zi: cplx(S.zi, "Ω") });
    $("ve").textContent = g.ecart < 1e-3 ? F.sci(g.ecart, 2) : F.qty(F.num(100 * g.ecart, 3), "%");
    $("fe").textContent = t("fig.f.ecart");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === id)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { id = x.dataset.m; draw(); });
  lr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["volta", 1800, "experiment"], ["ohm", 1827, "idea"], ["pixii", 1832, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["reseau", "gbf"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["impedance", "b"], ["deux", "d"], ["mouvement", "a"], ["pile", "c"], ["gbf", "b"], ["norton", "a"], ["court", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 222 });
})();
</script>
</body>
</html>
