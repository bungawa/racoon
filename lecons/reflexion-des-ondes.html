<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §49-1 : corde de 50 N, 2 g·m⁻¹ ; bosse de 4 mm, largeur 6 cm, partie de x = −0,6 m ---------- */
(() => {
  const O = self.Ondes, T = 50, MU = 0.002, C1 = O.impedanceCorde(T, MU), H = 0.004, X0 = -0.6, W = 0.06;
  const bump = O.bosse(H, W, X0), XS = Array.from({ length: 801 }, (_, i) => -1 + 2 * i / 800);
  let bout = "fixe";
  function upd() {
    const q = Math.pow(10, +$("mu").value), C2 = O.impedanceCorde(T, MU * q);
    const R = O.reflexion(C1.c, bump, bout === "corde" ? { c2: C2.c } : { bout });
    const J = bout === "corde" ? O.jonction(C1.Z, C2.Z) : O.jonction(C1.Z, bout === "fixe" ? Infinity : 0);
    const tmax = 1.3 / C1.c, tt = +$("tt").value * tmax;
    const svg = $("re"); svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 250, pad: { l: 52, b: 44 }, x: { domain: [-1, 1], label: t("re.xaxis") }, y: { domain: [-9, 9], label: t("re.yaxis") } });
    const gauche = XS.filter(x => x <= 0), droite = XS.filter(x => x >= 0);
    Plot.el("path", { d: Plot.path(gauche.map(x => [A.x(x), A.y(1000 * R.y(x, tt))])), class: "stroke c-tint" }, A.g);
    if (bout === "corde") Plot.el("path", { d: Plot.path(droite.map(x => [A.x(x), A.y(1000 * R.transmise(x, tt))])), class: "stroke c-tint" }, A.g);
    else {
      /* derrière le mur : la suite de l'onde incidente et l'image qui vient à sa rencontre */
      Plot.el("path", { d: Plot.path(droite.map(x => [A.x(x), A.y(1000 * R.reflechie(x, tt))])), class: "stroke thin dash c-label-2" }, A.g);
      Plot.el("path", { d: Plot.path(droite.map(x => [A.x(x), A.y(1000 * R.incidente(x, tt))])), class: "stroke thin dash c-label-2" }, A.g);
      Plot.el("line", { x1: A.x(0), x2: A.x(0), y1: A.y(-9), y2: A.y(9), class: bout === "fixe" ? "stroke bold" : "ref" }, A.g);
    }
    if (bout === "corde") Plot.el("line", { x1: A.x(0), x2: A.x(0), y1: A.y(-9), y2: A.y(9), class: "ref" }, A.g);
    $("mu").disabled = bout !== "corde";
    $("muv").textContent = F.num(q, 2); $("ttv").textContent = F.si(tt, "s");
    $("vr").textContent = F.num(J.r, 3); $("fr").textContent = t(J.r < 0 ? "re.f.inverse" : J.r > 0 ? "re.f.droit" : "re.f.rien");
    $("vR").textContent = F.num(100 * J.R, 3) + " %"; $("fR").textContent = t("re.f.T", { T: F.num(100 * J.T, 3) + " %" });
    $("vc").textContent = bout === "corde" ? F.si(C2.c, "m·s⁻¹") : "—";
    $("fc").textContent = bout === "corde" ? t("re.f.Z", { z: F.num(C2.Z / C1.Z, 3) }) : t("re.f.c1", { c: F.si(C1.c, "m·s⁻¹") });
    $("bout").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.b === bout)));
  }
  $("bout").querySelectorAll("button").forEach(x => x.onclick = () => { bout = x.dataset.b; upd(); });
  ["mu", "tt"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- (49.3) et (49.3a) : onde sinusoïdale de longueur d'onde 0,4 m réfléchie en x = 0 ---------- */
(() => {
  const O = self.Ondes, LAM = 0.4, K = 2 * Math.PI / LAM, W = 1, XS = Array.from({ length: 601 }, (_, i) => -1 + i / 600);
  function upd() {
    const r = +$("rr").value, S = O.stationnaire(r, K);
    const svg = $("st"); svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 220, pad: { l: 52, b: 44 }, x: { domain: [-1, 0], label: t("st.xaxis"), fmt: v => F.num(Math.abs(v) < 1e-9 ? 0 : v, 3) }, y: { domain: [-2.1, 2.1], label: t("st.yaxis") } });
    for (let j = 0; j < 6; j++) { const tj = j / 6 * Math.PI / W;
      Plot.el("path", { d: Plot.path(XS.map(x => [A.x(x), A.y(S.y(x, tj, W))])), class: "stroke thin c-label-2" }, A.g); }
    Plot.el("path", { d: Plot.path(XS.map(x => [A.x(x), A.y(S.amplitude(x))])), class: "stroke c-tint" }, A.g);
    Plot.el("path", { d: Plot.path(XS.map(x => [A.x(x), A.y(-S.amplitude(x))])), class: "stroke c-tint" }, A.g);
    $("rrv").textContent = F.num(r, 2);
    $("vros").textContent = S.ros === Infinity ? "∞" : F.num(S.ros, 3);
    $("fros").textContent = t("st.f.ros", { a: F.num(S.max, 3), b: F.num(S.min, 3) });
    $("vno").textContent = F.si(S.interNoeuds, "m");
    $("fno").textContent = t(r < 0 ? "st.f.mur.noeud" : r > 0 ? "st.f.mur.ventre" : "st.f.mur.rien");
  }
  $("rr").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dalembert", 1747, "idea"], ["melde", 1859, "experiment"], ["wiener", 1890, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tdr", "sol"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["image", "b"], ["libre", "d"], ["lourde", "a"], ["energie", "c"], ["noeuds", "b"], ["mode", "a"], ["tdr", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 491 });
})();
</script>
