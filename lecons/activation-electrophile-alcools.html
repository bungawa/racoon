<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activation électrophile des alcools</title>
<link rel="stylesheet" href="/racoon/ds.css">
<style>
  .voie { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .voie svg { width: 260px; max-width: 100%; height: 170px; flex: none; }
  .voie > div { flex: 1 1 240px; min-width: 0; }
  #meca { width: 100%; max-width: 440px; height: 170px; }
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-organique" data-i18n="monde.chim-organique"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-activation-protection" data-i18n="etape.chim-activation-protection"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/synthese-de-williamson" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="list keyed" id="nucleofuges"></div>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mfrac><mrow><mo>[</mo><mtext data-i18n="eq.roh2"></mtext><mo>]</mo></mrow><mrow><mo>[</mo><mtext data-i18n="eq.roh2"></mtext><mo>]</mo><mo>+</mo><mo>[</mo><mtext data-i18n="eq.roh"></mtext><mo>]</mo></mrow></mfrac><mo>=</mo><mfrac><mi>h</mi><mrow><mi>h</mi><mo>+</mo><msub><mi>K</mi><mi>a</mi></msub></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="s2.validite"></p>
    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="lgh" data-i18n="prot.h"></label><output id="hv" for="lgh"></output></div>
          <input id="lgh" type="range" min="-2" max="3" step="0.5" value="0"></div>
        <p class="readout" id="protv" aria-live="polite"></p>
      </div>
      <figcaption data-i18n-html="prot.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
    <figure>
      <div class="panel"><div class="seg" role="group" id="actes"></div></div>
      <svg class="fig no-sigle" id="meca" role="img" data-i18n-attr="aria-label:meca.aria"></svg>
      <p id="actetxt"></p>
      <figcaption data-i18n-html="meca.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure>
      <div class="voie">
        <svg class="fig no-sigle" id="mol" role="img" data-i18n-attr="aria-label:voie.aria"></svg>
        <div><p id="molnom"></p><p class="readout" id="voiev" aria-live="polite"></p></div>
      </div>
      <div class="panel">
        <div class="controls">
          <button class="btn tinted" type="button" data-r="tosyler" data-i18n="voie.tosyler"></button>
          <button class="btn tinted" type="button" data-r="bromure" data-i18n="voie.bromure"></button>
          <button class="btn tinted" type="button" data-r="hbr" data-i18n="voie.hbr"></button>
          <button class="btn tinted" type="button" data-r="base" data-i18n="voie.base"></button>
          <button class="btn" type="button" data-r="depart" data-i18n="voie.depart"></button>
        </div>
      </div>
      <figcaption data-i18n-html="voie.caption"></figcaption>
    </figure>
    <div class="box prop"><b data-i18n="s3.box.titre"></b>
      <p data-i18n-html="s3.box.corps"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/activation-electrophile-alcools.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/chim-organique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = ChimOrga, sym = s => t("chim.sym", { s });
const peindre = (svg, d) => { svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };

/* ---------- groupes partants ---------- */
(() => {
  const IDS = ["hydroxyde", "eau", "tosylate", "mesylate", "bromure"], txt = textOf("nf.items", IDS);
  $("nucleofuges").innerHTML = IDS.map(id => `<div><span class="k">${F.num(O.NUCLEOFUGES[id], 3)}</span><span>${txt[id]}</span></div>`).join("");
})();

/* ---------- protonation ---------- */
(() => {
  const pKa = O.PKA_ACTIVATION.methyloxonium;
  const maj = () => { const lg = +$("lgh").value, a = O.fractionProtonee(pKa, Math.pow(10, lg));
    $("hv").textContent = "10" + F.sup(lg);
    $("protv").textContent = t("prot.v", { p: a < 0.01 ? F.qty(F.num(100 * a, 2), "%") : F.qty(F.fix(100 * a, 1), "%") }); };
  $("lgh").oninput = maj; maj();
})();

/* ---------- mécanisme : éthanol + HBr ---------- */
(() => {
  const vues = O.actesActivation("hbr", { texte: sym, echelle: 40 }), txt = textOf("meca.actes", vues.map((_, k) => "a" + k));
  const seg = $("actes"), svg = $("meca");
  seg.innerHTML = vues.map((_, k) => `<button type="button" data-k="${k}">${txt["a" + k].bouton}</button>`).join("");
  function montre(k) {
    peindre(svg, vues[k]); $("actetxt").textContent = txt["a" + k].texte;
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.k === k)));
  }
  seg.onclick = e => { const b = e.target.closest("button"); if (b) montre(+b.dataset.k); };
  montre(0);
})();

/* ---------- deux voies depuis le (R)-butan-2-ol ---------- */
(() => {
  const C = 1, OX = 4, ALCOOL = O.molecule("butan2olR");
  const TOSYLATE = O.mol("C -0.866 -0.5; C 0 0; C 0.866 -0.5; C 1.732 0; O 0 1 h0; H 0 -0.9; S 0.866 1.5 h0 | 0-1 1-2 2-3 1w4 1h5 4-6");
  const noms = textOf("voie.noms", ["alcool", "tosylate", "bromure", "racemique", "alcene"]);
  let etat = "alcool", m = ALCOOL, msg = "voie.m.depart";
  function maj() {
    const etiq = etat === "tosylate" ? { 6: "Ts" } : {};
    peindre($("mol"), O.dessin(m, { texte: sym, echelle: 48, surligne: etat === "alcene" ? [] : [C], etiquettes: etiq }));
    const d = etat === "alcene" || etat === "racemique" ? null : O.descripteurRS(m, C);
    $("molnom").innerHTML = t("voie.nom", { n: noms[etat], d: d ? "(" + d + ")-" : "" });
    $("voiev").textContent = t(msg, { d: d || "" });
  }
  const R = {
    depart: () => { etat = "alcool"; m = ALCOOL; msg = "voie.m.depart"; },
    tosyler: () => { if (etat !== "alcool") { msg = "voie.m.pasAlcool"; return; } etat = "tosylate"; m = TOSYLATE; msg = "voie.m.tosyle"; },
    bromure: () => { if (etat !== "tosylate") { msg = etat === "alcool" ? "voie.m.hoPart" : "voie.m.rien"; return; } m = O.substituerSN2(m, C, OX, "Br"); etat = "bromure"; msg = "voie.m.sn2"; },
    hbr: () => { if (etat !== "alcool") { msg = "voie.m.pasAlcool"; return; } m = O.substituerSN2(ALCOOL, C, OX, "Br"); etat = "racemique"; msg = "voie.m.hbr"; },
    base: () => { if (etat !== "tosylate") { msg = "voie.m.baseAlcool"; return; } m = O.mol("C -0.866 -0.5; C 0 0; C 0.866 -0.5; C 1.732 0 | 0-1 1=2 2-3"); etat = "alcene"; msg = "voie.m.e2"; },
  };
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { R[b.dataset.r](); maj(); });
  maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["walden", 1896, "experiment"], ["lucas", 1930, "experiment"], ["tipson", 1944, "experiment"], ["busulfan", 1953, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["busulfan", "inversion"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["partant", "c"], ["protone", "a"], ["fraction", "d"], ["tosyl", "b"], ["config", "c"], ["tertiaire", "a"], ["choix", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1944 });
})();
</script>
</body>
</html>
