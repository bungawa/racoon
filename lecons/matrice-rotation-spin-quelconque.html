<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, DEG = Math.PI / 180;
const fracJ = v => Number.isInteger(v) ? F.num(v, 2) : (v < 0 ? "−" : "") + Math.round(Math.abs(2 * v)) + "/2";

/* ---------- the (2j + 1) × (2j + 1) matrix of R_y(θ): each cell coloured by sign, its size by |d|² ---------- */
(() => {
  const svg = $("matrice"), sth = $("sth"), seg = $("spins");
  let j = 1.5;
  function draw() {
    const th = +sth.value * DEG, M = Q.matriceRotation(j, th), n = M.length, cote = 340 / n, x0 = 70, y0 = 60;
    svg.innerHTML = "";
    const lab = (x, y, s, cls) => { const e = Plot.el("text", { x, y, "text-anchor": "middle", class: cls || "c-label-2" }, svg); e.textContent = s; };
    lab(x0 + 170, 22, t("fig.col"), "c-label"); lab(24, y0 + 170, t("fig.lig"), "c-label");
    for (let a = 0; a < n; a++) {
      lab(x0 + (a + 0.5) * cote, 46, fracJ(j - a));
      lab(54, y0 + (a + 0.5) * cote + 4, fracJ(j - a));
      for (let b = 0; b < n; b++) {
        const v = M[a][b], s = Math.sqrt(v * v) * (cote - 6);
        Plot.el("rect", { x: x0 + b * cote + 3, y: y0 + a * cote + 3, width: cote - 6, height: cote - 6, class: "stroke thin c-label-2" }, svg);
        if (s > 0.5) Plot.el("rect", { x: x0 + (b + 0.5) * cote - s / 2, y: y0 + (a + 0.5) * cote - s / 2, width: s, height: s, class: "fill " + (v >= 0 ? "c-tint" : "c-warn") }, svg);
        if (n <= 4) lab(x0 + (b + 0.5) * cote, y0 + (a + 0.85) * cote, F.fix(v, 2));
      }
    }
    let pire = 0;
    for (let b = 0; b < n; b++) { let s = 0; for (let a = 0; a < n; a++) s += M[a][b] ** 2; pire = Math.max(pire, Math.abs(s - 1)); }
    $("sthr").textContent = F.num(+sth.value, 3) + "°";
    $("vc").textContent = F.sci(pire, 1);
    $("fc").textContent = t("fig.f.colonne");
    if (Number.isInteger(j)) { $("vp").textContent = F.fix(Q.dRotation(j, 0, 0, th), 4); $("fp").textContent = t("fig.f.centre", { v: F.fix(Q.legendre(j, Math.cos(th)), 4) }); }
    else { $("vp").textContent = "–"; $("fp").textContent = t("fig.f.pasCentre"); }
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.j === j)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { j = +b.dataset.j; draw(); });
  sth.oninput = draw; draw();
})();

/* ---------- the system described: a spin as 2j spins 1/2 ---------- */
(() => {
  const d32 = Q.dRotation(1.5, 1.5, 1.5, 2 * Math.PI), d2 = Q.dRotation(2, 2, 2, 2 * Math.PI);
  $("sys1").innerHTML = t("sys1.body", { a: F.fix(d32, 0), b: F.fix(d2, 0) });
  $("sys2").innerHTML = t("sys2.body", { p: F.num(100 * Q.dRotation(3, 0, 0, Math.PI / 3) ** 2, 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["legendre", 1782, "idea"], ["wigner", 1927, "idea"], ["gruppentheorie", 1931, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rmn"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["z", "a"], ["construire", "c"], ["symetrique", "b"], ["tour", "d"], ["legendre", "a"], ["colonne", "c"], ["demi", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1804 });
})();
</script>
