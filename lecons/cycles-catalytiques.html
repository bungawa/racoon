<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), CS = ChimSolutions;
/* formulas are notation, the same in every language: the table only marks them */
const fx = c => t("fx", { f: CS.ecrireComplexe(c) }), sp = s => t("fx", { f: CS.LIGANDS[s] && s !== "S" ? CS.LIGANDS[s].f : CS.texte(s) });
const ROMAIN = ["0", "I", "II", "III", "IV", "V", "VI"];
const signe = v => v > 0 ? "+" + v : v < 0 ? "−" + -v : "0";
const TYPES = ["association", "dissociation", "echange", "additionOxydante", "eliminationReductrice", "insertion", "desinsertion"];

/* ---------- a worked number of cycles: a textbook example, not a measurement ---------- */
(() => {
  const ex = { nP: 5.0e-2, nC: 1.0e-5, dt: 1800 };
  $("tonex").innerHTML = t("tonex", { nP: F.si(ex.nP, "mol"), nC: F.si(ex.nC, "mol"), dt: F.qty(F.num(ex.dt / 60, 3), "min"),
    N: F.num(CS.ton(ex.nP, ex.nC), 4), f: F.qty(F.num(CS.tof(ex.nP, ex.nC, ex.dt), 2), "s⁻¹") });
})();

/* ---------- the elementary processes, measured on the two cycles of the page ---------- */
(() => {
  const K = ["wilkinson", "monsanto"].map(k => CS.cycleCatalytique(CS.CYCLES[k]));
  const W = CS.CYCLES.wilkinson, act = CS.etape(W.precurseur, W.depart, W.activation.entre, W.activation.sort);
  const exemples = [{ type: act.type, de: W.precurseur, vers: W.depart, entre: W.activation.entre, sort: W.activation.sort, dx: act.dx, dNe: act.dNe, ds: act.ds }];
  K.forEach(k => k.etapes.forEach(e => exemples.push(e)));
  /* dissociation and β-elimination: from the alkene polymerisation of « Polymérisation des alcènes par coordination » */
  const P = CS.CYCLES.coordination; let cur = P.depart;
  [...P.croissance, ...P.transfert].forEach(s => { const e = { de: cur, vers: s.vers, entre: s.entre || [], sort: s.sort || [] };
    exemples.push(Object.assign(e, CS.etape(cur, s.vers, e.entre, e.sort))); cur = s.vers; });
  const vus = TYPES.map(ty => exemples.find(e => e.type === ty)).filter(Boolean);
  $("actes").innerHTML = vus.map(e => `<div><span class="k">${t("proc." + e.type)}</span><span>${t("actes.ligne", {
    de: fx(e.de), vers: fx(e.vers), plus: e.entre.map(sp).join(" + ") || "—", moins: e.sort.map(sp).join(" + ") || "—" })}</span>`
    + `<span class="v">${t("actes.delta", { dx: signe(e.dx), dne: signe(e.dNe), ds: signe(e.ds) })}</span></div>`).join("");
})();

/* ---------- step through a cycle, guess each process ---------- */
(() => {
  const ring = $("ring"), seg = $("kseg"), devine = $("devine");
  let k, cyc, i, devinee, entres, sortis;
  devine.innerHTML = TYPES.map(ty => `<button type="button" data-t="${ty}">${t("proc." + ty)}</button>`).join("");
  function nodes() {
    const n = cyc.etapes.length, R = 120, c = 170, cx = 210;
    const pos = j => [cx + R * Math.sin(2 * Math.PI * j / n), c - R * Math.cos(2 * Math.PI * j / n)];
    ring.innerHTML = "";
    Plot.el("circle", { cx, cy: c, r: R, class: "stroke thin dash c-label-2" }, ring);
    const inter = [cyc.depart, ...cyc.etapes.slice(0, -1).map(e => Object.assign({ c: e.vers }, e.compte))];
    inter.forEach((s, j) => {
      const [x, y] = pos(j), on = j === i % n;
      Plot.el("circle", { cx: x, cy: y, r: 26, class: on ? "fill c-tint" : "fill c-label-2", opacity: on ? 1 : 0.25 }, ring);
      Plot.el("text", { x, y: y - 2, "text-anchor": "middle", class: on ? "fill c-label" : "" }, ring).textContent = s.Ne;
      Plot.el("text", { x, y: y + 13, "text-anchor": "middle", class: on ? "fill c-label" : "" }, ring).textContent = t("cy.metal", { m: s.c.m, x: ROMAIN[s.x] });
    });
    /* what comes in and goes out at each step, outside the ring between its two ends */
    cyc.etapes.forEach((e, j) => {
      const a = 2 * Math.PI * (j + 0.5) / n, x = cx + (R + 34) * Math.sin(a), y = c - (R + 34) * Math.cos(a) + 4;
      const s = [...e.entre.map(v => "+" + CS.texte(v)), ...e.sort.map(v => "−" + CS.texte(v))].join(" ");
      if (s) Plot.el("text", { x, y, "text-anchor": x > cx + 5 ? "start" : x < cx - 5 ? "end" : "middle" }, ring).textContent = t("fx", { f: s });
    });
    Plot.el("text", { x: cx, y: c + 4, "text-anchor": "middle" }, ring).textContent = t("cy.centre");
  }
  function journal() {
    const net = {};
    entres.forEach(s => net[s] = (net[s] || 0) + 1); sortis.forEach(s => net[s] = (net[s] || 0) - 1);
    const g = {}, d = {};
    for (const s in net) if (net[s] > 0) g[s] = net[s]; else if (net[s] < 0) d[s] = -net[s];
    const fin = i >= cyc.etapes.length;
    let html = `<div><span class="k">${t("cy.entre")}</span><span>${entres.map(sp).join(" + ") || "—"}</span></div>`
      + `<div><span class="k">${t("cy.sort")}</span><span>${sortis.map(sp).join(" + ") || "—"}</span></div>`;
    if (fin) {
      html += `<div><span class="k">${t("cy.bilan")}</span><span>${t("fx", { f: CS.ecrire({ gauche: g, droite: d }, "→") })}</span></div>`;
      if (CS.CYCLES[k].annexes) {
        const b = cyc.bilan;
        html += `<div><span class="k">${t("cy.iode")}</span><span>${t("cy.iodeTexte", { b: t("fx", { f: CS.ecrire(b, "→") }) })}</span></div>`;
      }
    }
    $("journal").innerHTML = html;
  }
  function show() {
    nodes(); journal();
    const n = cyc.etapes.length, fin = i >= n;
    devine.querySelectorAll("button").forEach(b => { b.disabled = fin || devinee; b.setAttribute("aria-pressed", "false"); });
    $("suivant").disabled = fin;
    if (fin) { $("pas").innerHTML = t("cy.fini", { c: fx(cyc.depart.c) }); $("verdict").textContent = ""; return; }
    const e = cyc.etapes[i];
    $("pas").innerHTML = t("cy.pas", { k: i + 1, n, de: fx(e.de), vers: fx(e.vers),
      plus: e.entre.map(sp).join(" + ") || "—", moins: e.sort.map(sp).join(" + ") || "—" });
    if (!devinee) $("verdict").textContent = t("cy.question");
  }
  function guess(ty) {
    if (i >= cyc.etapes.length || devinee) return;
    const e = cyc.etapes[i]; devinee = true;
    devine.querySelectorAll("button").forEach(b => { b.setAttribute("aria-pressed", String(b.dataset.t === e.type)); b.disabled = true; });
    $("verdict").innerHTML = t(ty === e.type ? "cy.juste" : "cy.faux", { p: t("proc." + e.type), dx: signe(e.dx), dne: signe(e.dNe),
      x: ROMAIN[e.compte.x], ne: e.compte.Ne, pourquoi: t("pourquoi." + e.type) });
  }
  function next() {
    if (i >= cyc.etapes.length) return;
    const e = cyc.etapes[i]; entres.push(...e.entre); sortis.push(...e.sort);
    i++; devinee = false; show();
  }
  function load(name) {
    k = name; cyc = CS.cycleCatalytique(CS.CYCLES[k]); i = 0; devinee = false; entres = []; sortis = [];
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === k)));
    show();
  }
  seg.onclick = ev => { const b = ev.target.closest("button"); if (b) load(b.dataset.k); };
  devine.onclick = ev => { const b = ev.target.closest("button"); if (b) guess(b.dataset.t); };
  $("suivant").onclick = next;
  $("debut").onclick = () => load(k);
  load("wilkinson");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wilkinson", 1965, "experiment"], ["knowles", 1968, "experiment"], ["paulik", 1968, "experiment"], ["monsanto", 1970, "use"],
    ["ldopa", 1974, "use"], ["cativa", 1995, "use"], ["nobel2001", 2001, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["acetique", "chiral"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["bilan", "b"], ["precurseur", "c"], ["ao", "a"], ["insertion", "d"], ["cis", "b"], ["seize", "c"], ["ton", "a"], ["monsanto", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1965 });
})();
</script>
