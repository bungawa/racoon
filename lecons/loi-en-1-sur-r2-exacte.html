    <div class="eq"><math display="block"><mfrac><msub><mi>q</mi><mi>a</mi></msub><msub><mi>q</mi><mi>b</mi></msub></mfrac><mo>≈</mo><mi>M</mi><mo>(</mo><mi>a</mi><mo>/</mo><mi>b</mi><mo>)</mo><mspace width="0.2em"/><mi>δ</mi></math></div>

        <div class="ctl"><div class="row"><label for="ksl" data-i18n="cv.k"></label><output id="kread" for="ksl"></output></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
const B = 0.3, V = 1e4, QB = B * V / ES.K;                 // outer sphere: 30 cm at 10 kV
/* published bounds on |δ| (Cavendish 1/50; Maxwell 1/21 600; Plimpton and Lawton 2 × 10⁻⁹; Williams, Faller and Hill: the uncertainty of (2,7 ± 3,1) × 10⁻¹⁶) */
const BORNES = [["cavendish", 0.02], ["maxwell", 1 / 21600], ["plimpton", 2e-9], ["williams", 3.1e-16]];

/* ---------- le système décrit : une expérience de Cavendish de table ---------- */
(() => {
  const qmin = 1e-13, M = ES.penteCavendish(0.27, B);
  $("sys1").innerHTML = t("sys1.body", { qb: F.si(QB, "C", { prefix: "n" }), m: F.num(M, 3), borne: F.sci(qmin / (M * QB), 1) });
})();

/* ---------- l'expérience de Cavendish : la charge gardée par la sphère intérieure ---------- */
(() => {
  const svg = $("cav"), dsl = $("dsl"), ksl = $("ksl"), noms = textOf("cv.noms", BORNES.map(b => b[0]));
  const ds = Array.from({ length: 81 }, (_, i) => Math.pow(10, -17 + 16 * i / 80));
  function draw() {
    const d = Math.pow(10, +dsl.value / 2), k = +ksl.value / 100, a = k * B, M = ES.penteCavendish(a, B), r = ES.cavendish(a, B, d);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, x: { scale: "log", domain: [1e-17, 1e-1], label: t("cv.x") }, y: { scale: "log", domain: [1e-18, 1], label: t("cv.y") } });
    const gb = Plot.el("g", { class: "c-label-2" }, g);
    BORNES.forEach(([id, v], i) => {
      Plot.el("line", { x1: x(v), x2: x(v), y1: y(1e-18), y2: y(1), class: "stroke thin dash" }, gb);
      Plot.el("text", { x: x(v) + 4, y: y(1) + 14 + 14 * (i % 2), class: "label" }, gb).textContent = noms[id];
    });
    const gc = Plot.el("g", { class: "c-tint" }, g);
    Plot.el("path", { d: Plot.path(ds.map(u => [x(u), y(ES.cavendish(a, B, u))])), class: "stroke" }, gc);
    Plot.el("circle", { cx: x(d), cy: y(r), r: 5, class: "fill" }, gc);
    const exclu = BORNES.filter(b => b[1] < d).map(b => noms[b[0]]);
    $("dread").textContent = F.sci(d, 2);
    $("kread").textContent = F.num(k, 2);
    $("vrap").textContent = F.sci(r, 3);
    $("frap").textContent = t("cv.f.rap", { m: F.num(M, 3) });
    $("vq").textContent = F.si(r * QB, "C");
    $("fq").textContent = t("cv.f.q", { n: F.sci(r * QB / ES.E, 2) });
    $("vexclu").textContent = exclu.length ? exclu.join(", ") : t("cv.v.aucune");
  }
  dsl.oninput = ksl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cavendish", 1773, "experiment"], ["maxwell", 1879, "experiment"], ["plimpton", 1936, "experiment"], ["lamb", 1947, "experiment"], ["williams", 1971, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["photon", "zero"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cones", "a"], ["zero", "c"], ["signe", "b"], ["forme", "d"], ["borne", "b"], ["distance", "a"], ["yukawa", "c"], ["cavendish", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 58 });
})();
</script>
