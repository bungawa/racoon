  <section class="card">

    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><mi>f</mi><mo>=</mo><mfrac><mn>1</mn><mi>T</mi></mfrac></math></div>

      <div class="panel">

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §50-1 : bruit ou son musical ? Corde d'acier de 0,65 m, c = 429 m·s⁻¹ (f₁ = 330 Hz), pincée de 2 mm,
   mêlée à un bruit ; la pente au chevalet, échantillonnée à 44,1 kHz, et sa ressemblance avec elle-même décalée ---------- */
(() => {
  const O = self.Ondes, L = 0.65, C = 429, H = 0.002, FE = 44100, DT = 1 / FE, N = 4000, KMAX = 600, VUE = 0.01;
  const Z = O.bruit(N, 11), rms = y => Math.sqrt(y.reduce((s, v) => s + v * v, 0) / y.length), ZR = rms(Z);
  let y = [], per = 0;
  function upd() {
    const e = +$("eb").value, q = +$("pp").value, P = O.penteChevalet(L, C, q * L, H);
    const y0 = Array.from({ length: N }, (_, j) => P.pente(j * DT)), r0 = rms(y0);
    y = y0.map((v, j) => (1 - e) * v / r0 + e * Z[j] / ZR); per = P.periode;
    const d = O.periodeDetectee(y, DT, { kmin: 20, kmax: KMAX, seuil: 0.3 }), nv = Math.round(VUE / DT);
    const svg = $("sig"); svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 200, pad: { l: 52, b: 44 }, x: { domain: [0, 1000 * VUE], label: t("sig.xaxis") }, y: { domain: [-3.5, 3.5], label: t("sig.yaxis") } });
    Plot.el("path", { d: Plot.path(y.slice(0, nv + 1).map((v, j) => [A.x(1000 * j * DT), A.y(Math.max(-3.5, Math.min(3.5, v)))])), class: "stroke thin c-tint" }, A.g);
    const ac = $("ac"); ac.innerHTML = "";
    const B = Plot.axes(ac, { fmt: F, w: 640, h: 180, pad: { l: 52, b: 44 }, x: { domain: [0, 1000 * KMAX * DT], label: t("ac.xaxis") }, y: { domain: [-1, 1], label: t("ac.yaxis") } });
    Plot.el("path", { d: Plot.path(d.correlation.map((v, k) => [B.x(1000 * k * DT), B.y(v)])), class: "stroke c-tint" }, B.g);
    if (d.periode) Plot.el("line", { x1: B.x(1000 * d.periode), x2: B.x(1000 * d.periode), y1: B.y(-1), y2: B.y(1), class: "stroke dash c-warn" }, B.g);
    $("ebv").textContent = F.num(100 * e, 3) + " %"; $("ppv").textContent = F.num(q, 3) + " L";
    $("vr").textContent = F.num(d.r, 2); $("fr").textContent = t(d.r >= 0.9 ? "sig.f.musical" : d.r >= 0.3 ? "sig.f.mele" : "sig.f.bruit");
    $("vT").textContent = d.periode ? F.si(d.periode, "s") : "–";
    $("fT").textContent = d.periode ? t("sig.f.T", { f: F.si(1 / d.periode, "Hz", { prefix: "" }), T: F.si(per, "s") }) : t("sig.f.aucune");
  }
  ["eb", "pp"].forEach(id => $(id).oninput = upd); upd();

  /* écouter 2 s : le motif échantillonné, répété (la corde idéale ne s'amortit pas) */
  $("play").onclick = () => {
    const e = +$("eb").value, q = +$("pp").value, P = O.penteChevalet(L, C, q * L, H), M = 2 * FE, Zl = O.bruit(M, 5);
    const s = tt => { const j = Math.min(M - 1, Math.round(tt * FE)); return (1 - e) * P.pente(tt) / (H / Math.sqrt(q * L * (L - q * L))) + e * Math.sqrt(3) * Zl[j]; };
    $("aumsg").textContent = O.jouer([s], 2, { fe: FE }) ? t("au.playing", { e: F.num(100 * e, 3) + " %" }) : t("au.none");
  };
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["scott", 1857, "experiment"], ["edison", 1877, "experiment"], ["firstsounds", 2008, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["hauteur", "niveau"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["bruit", "c"], ["hauteur", "a"], ["timbre", "d"], ["pythagore", "b"], ["aller", "c"], ["vitesse", "a"], ["pression", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 501 });
})();
</script>
