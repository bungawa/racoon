<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd;

/* ---------- deux sources décalées en fréquence, ou n sources au hasard ---------- */
(() => {
  const DET = { oeil: 0.01, camera: 1e-3, photodiode: 1e-9 };     // averaging times (s): the eye in daylight (cones), a 1 kHz camera, a fast photodiode
  const A1 = 1, A2 = 0.8;
  let mode = "deux", det = "oeil", graine = 1;
  const svg = $("trace"), seg = $("mode"), sdet = $("det"), sdf = $("sdf"), sn = $("sn");
  const stat = (i, k, v, f) => { $("k" + i).innerHTML = k; $("v" + i).textContent = v; $("f" + i).textContent = f; };
  function deux() {
    const df = Math.pow(10, +sdf.value), T = DET[det], s = O.interferenceMoyennee(A1, A2, df, T, 0.6);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, 3], label: t("fig.xaxis") }, y: { domain: [0, 3.5], label: t("fig.yaxis") } });
    const xs = Array.from({ length: 601 }, (_, i) => 3 * i / 600);
    Plot.el("path", { d: Plot.path(xs.map(u => [P.x(u), P.y(s.I(u / df))])), class: "stroke thin c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map(u => [P.x(u), P.y(s.detecte(u / df))])), class: "curve" }, P.g);
    Plot.el("line", { x1: P.x(0), x2: P.x(3), y1: P.y(s.seules), y2: P.y(s.seules), class: "zero" }, P.g);
    $("sdfr").textContent = F.si(df, "Hz");
    stat(1, t("fig.k.contraste"), F.fix(s.contraste, 3), t("fig.f.contraste", { c: F.fix(2 * A1 * A2 / s.seules, 3) }));
    stat(2, t("fig.k.battement"), F.si(1 / df, "s"), t("fig.f.battement", { T: F.si(T, "s") }));
    stat(3, t("fig.k.dfT"), F.num(df * T, 3), t(df * T < 0.3 ? "fig.f.suit" : df * T < 3 ? "fig.f.milieu" : "fig.f.perdu"));
  }
  function plusieurs() {
    const n = +sn.value, r = O.alea(graine), s = O.sommeAleatoire(n, 1, r);
    let moy = 0; const M = 400, r2 = O.alea(graine + 7919);
    for (let k = 0; k < M; k++) moy += O.sommeAleatoire(n, 1, r2).I;
    moy /= M;
    svg.innerHTML = "";
    const xs = s.pas.map(p => p[0]), ys = s.pas.map(p => p[1]);
    const R = 1.1 * Math.max(3, ...xs.map(Math.abs), ...ys.map(Math.abs));
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 360, pad: { l: 166, r: 166, b: 40 }, x: { domain: [-R, R], label: t("fig.re") }, y: { domain: [-R, R], label: t("fig.im") } });
    Plot.el("path", { d: Plot.path(s.pas.map(([x, y]) => [P.x(x), P.y(y)])), class: "stroke c-tint" }, P.g);
    Plot.fleche(P.g, [P.x(0), P.y(0)], [P.x(s.re), P.y(s.im)], { cls: "c-warn" });
    Plot.el("circle", { cx: P.x(0), cy: P.y(0), r: P.x(Math.sqrt(n)) - P.x(0), class: "stroke thin c-label-2" }, P.g);
    $("snr").textContent = F.num(n, 3);
    stat(1, t("fig.k.tirage"), F.num(s.I / n, 3), t("fig.f.tirage", { I: F.num(s.I, 3), n: F.num(n, 3) }));
    stat(2, t("fig.k.moyenne"), F.num(moy / n, 3), t("fig.f.moyenne", { M: F.num(M, 3) }));
    stat(3, t("fig.k.ordre"), F.num(n * n, 3), t("fig.f.ordre"));
  }
  function draw() {
    $("c2").hidden = $("leg2").hidden = mode !== "deux"; $("cn").hidden = $("legn").hidden = mode !== "n";
    svg.setAttribute("aria-label", t(mode === "deux" ? "fig.aria" : "fig.aria.n"));
    (mode === "deux" ? deux : plusieurs)();
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
    sdet.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.d === det)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; draw(); });
  sdet.querySelectorAll("button").forEach(x => x.onclick = () => { det = x.dataset.d; draw(); });
  $("tirage").onclick = () => { graine += 1; draw(); };
  sdf.oninput = sn.oninput = draw; draw();
})();

/* ---------- le système décrit : deux lampes, deux lasers, deux sources éloignées ---------- */
(() => {
  const lambda = 589e-9, Tlampe = 500, m = 22.99 * Constantes.u, d = O.coherenceDoppler(lambda, Tlampe, m), Toeil = 0.01;
  $("sys1").innerHTML = t("sys1.body", { T: F.qty(F.num(Tlampe, 3), "K"), dnu: F.si(d.dnu, "Hz"), tc: F.si(d.tauc, "s"),
    train: F.si(O.dureeTrainClassique(lambda), "s"), Te: F.si(Toeil, "s"), res: F.sci(O.residuTrains(d.tauc, Toeil), 2) });
  const D = 1, L = 10, i = lambda * L / D, pup = 3e-3;
  $("sys2").innerHTML = t("sys2.body", { D: F.si(D, "m"), Dl: F.sci(D / lambda, 2), L: F.si(L, "m"), i: F.si(i, "m"), p: F.si(pup, "m"), n: F.num(pup / i, 2) });
  const df = 1e6, Tp = 1e-9;
  $("sys3").innerHTML = t("sys3.body", { df: F.si(df, "Hz"), Te: F.si(Toeil, "s"), x: F.sci(df * Toeil, 1), Tp: F.si(Tp, "s"),
    c: F.fix(O.interferenceMoyennee(1, 1, df, Tp).contraste, 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["forrester", 1955, "experiment"], ["magyar", 1963, "experiment"], ["pfleegor", 1967, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["coherent"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["croise", "c"], ["pupille", "a"], ["oeil", "d"], ["lasers", "b"], ["nsources", "a"], ["tirage", "c"], ["jamais", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 324 });
})();
</script>
