<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, C = Constantes.c;
const LAMBDA = 11 / 2e7;                 // the 1887 paper: 11 m of path = 2 × 10⁷ wavelengths of yellow light
const LIMITE = 0.4 / 40;                 // « probably less than the fortieth part » of the 0,4 fringe expected
const U_ORBITE = 2 * Math.PI * Constantes.au / (365.25 * 86400);

/* ---------- l'interféromètre qui tourne dans le vent d'éther ---------- */
(() => {
  const schema = $("schema"), trace = $("trace"), sth = $("sth"), su = $("su"), sl = $("sl"), seg = $("mode");
  let mode = "rigide";
  const mm = (th, u, L) => R.michelsonMorley({ L1: L, u, lambda: LAMBDA, theta: th, contraction: mode === "contraction" });
  function draw() {
    const deg = +sth.value, th = deg * Math.PI / 180, u = 1e3 * +su.value, L = +sl.value;
    const m = mm(th, u, L), N = m.ordre - mm(0, u, L).ordre;
    /* top view: splitter at (200, 130), arm 1 along θ, arm 2 along θ + 90°; the ether wind blows along −x */
    schema.innerHTML = "";
    const O = [200, 130], a = 95, dir = k => [Math.cos(th + k * Math.PI / 2), -Math.sin(th + k * Math.PI / 2)];
    const at = (d, r) => [O[0] + r * d[0], O[1] + r * d[1]];
    const seg2 = (p, q, cls) => Plot.el("line", { x1: p[0], y1: p[1], x2: q[0], y2: q[1], class: cls }, schema);
    seg2(at(dir(2), 70), O, "stroke c-label-2");                                     // source → splitter
    seg2(O, at(dir(0), a), "stroke bold c-tint"); seg2(O, at(dir(1), a), "stroke bold c-tint");
    seg2(O, at(dir(3), 60), "stroke c-label-2");                                     // splitter → telescope
    const perp = (d, r, h) => { const p = at(d, r), n = [-d[1], d[0]]; seg2([p[0] - h * n[0], p[1] - h * n[1]], [p[0] + h * n[0], p[1] + h * n[1]], "stroke bold"); };
    perp(dir(0), a, 14); perp(dir(1), a, 14);
    const dg = [Math.cos(th + Math.PI / 4), -Math.sin(th + Math.PI / 4)];
    seg2([O[0] - 12 * dg[0], O[1] - 12 * dg[1]], [O[0] + 12 * dg[0], O[1] + 12 * dg[1]], "stroke bold c-label-2");
    Plot.el("circle", { cx: at(dir(2), 70)[0], cy: at(dir(2), 70)[1], r: 6, class: "fill c-warn" }, schema);
    [["1", dir(0)], ["2", dir(1)]].forEach(([k, d]) => { const p = at(d, a + 26); Plot.el("text", { x: p[0], y: p[1] + 4, "text-anchor": "middle", class: "tick" }, schema).textContent = t("fig.bras" + k); });
    Plot.fleche(schema, [150, 245], [40, 245], { cls: "c-warn" });
    Plot.el("text", { x: 160, y: 249, class: "tick" }, schema).textContent = t("fig.vent");
    /* the fringes seen in the telescope, shifted by N; the mark stays where the dark fringe was at θ = 0 */
    const x0 = 380, w = 240, y0 = 50, h = 150, i0 = 48;
    Plot.el("rect", { x: x0, y: y0, width: w, height: h, class: "stroke thin c-label-2" }, schema);
    for (let k = 0; k < 120; k++) {
      const xx = x0 + k * w / 120, I2 = Math.cos(Math.PI * ((xx - x0 - w / 2) / i0 - N)) ** 2;
      Plot.el("rect", { x: xx, y: y0, width: w / 120 + 0.3, height: h, class: "fill c-tint", opacity: (0.9 * I2).toFixed(3) }, schema);
    }
    seg2([x0 + w / 2 + i0 / 2, y0 - 8], [x0 + w / 2 + i0 / 2, y0 + h + 8], "stroke c-warn");
    Plot.el("text", { x: x0 + w / 2, y: y0 + h + 28, "text-anchor": "middle", class: "tick" }, schema).textContent = t("fig.franges");
    /* the shift against the angle, one full turn */
    trace.innerHTML = "";
    const degs = Array.from({ length: 361 }, (_, i) => i), curve = degs.map(d => mm(d * Math.PI / 180, u, L).ordre - mm(0, u, L).ordre);
    const ymax = 1.2 * Math.max(0.025, ...curve.map(Math.abs));
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 240, pad: { l: 64, b: 44 }, x: { domain: [0, 360], label: t("fig.xaxis") }, y: { domain: [-ymax, ymax], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(360), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    [-1, 1].forEach(s => Plot.el("line", { x1: P.x(0), x2: P.x(360), y1: P.y(s * LIMITE), y2: P.y(s * LIMITE), class: "stroke dash c-warn" }, P.g));
    Plot.el("path", { d: Plot.path(degs.map((d, i) => [P.x(d), P.y(curve[i])])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(deg), cy: P.y(N), r: 5, class: "dot" }, P.g);
    /* numbers */
    $("sthr").textContent = F.qty(F.num(deg, 3), "°");
    $("sur").textContent = F.si(u, "m·s⁻¹", { prefix: "k" });
    $("slr").textContent = F.si(L, "m");
    $("vatt").textContent = t("fig.n", { n: F.num(m.attendu, 2) });
    $("fatt").textContent = t("fig.f.att", { n: F.num(N, 2) });
    $("vdt").textContent = F.si(Math.abs(m.dt), "s");
    $("fdt").textContent = t("fig.f.dt", { t: F.si(m.t1, "s", { prefix: "n" }) });
    const ulim = m.attendu > 0 ? u * Math.sqrt(LIMITE / m.attendu) : Infinity;
    $("vlim").textContent = t("fig.n", { n: F.num(LIMITE, 1) });
    $("flim").textContent = isFinite(ulim) ? t("fig.f.lim", { u: F.si(ulim, "m·s⁻¹", { prefix: "k" }) }) : t("fig.f.limNon");
    seg.querySelectorAll("button").forEach(z => z.setAttribute("aria-pressed", String(z.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(z => z.onclick = () => { mode = z.dataset.m; draw(); });
  sth.oninput = su.oninput = sl.oninput = draw; draw();
})();

/* ---------- le système décrit : l'appareil de 1887, emporté par la Terre ---------- */
(() => {
  const u = U_ORBITE, L = 11, m = R.michelsonMorley({ L1: L, u, lambda: LAMBDA });
  $("sys1").innerHTML = t("sys1.body", { u: F.si(u, "m·s⁻¹", { prefix: "k" }), b2: F.sci((u / C) ** 2, 2), L: F.si(L, "m"), lam: F.si(LAMBDA, "m", { prefix: "µ" }),
    t0: F.si(2 * L / C, "s", { prefix: "n" }), dt: F.si(m.dt, "s"), n: F.num(m.attendu, 2), lim: F.num(LIMITE, 1),
    ulim: F.si(u * Math.sqrt(LIMITE / m.attendu), "m·s⁻¹", { prefix: "k" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["potsdam", 1881, "experiment"], ["mm", 1887, "experiment"], ["fitzgerald", 1889, "idea"], ["lorentz", 1892, "idea"], ["nagel", 2015, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ligo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pourquoi", "c"], ["rotation", "a"], ["quart", "b"], ["ordre", "d"], ["contraction", "a"], ["adhoc", "c"], ["limite", "b"], ["ligo", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 153 });
})();
</script>
