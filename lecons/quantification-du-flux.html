<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, P0 = Q.quantumFlux(), PL = Q.quantumFlux(-Constantes.e);
$("sys1").innerHTML = t("sys.body", { r: F.si(6.5e-6, "m"), b: F.si(P0 / (Math.PI * 6.5e-6 ** 2), "T"), bt: F.si(5e-5, "T") });
(() => {
  const svg = $("escalier"), sb = $("sb"), sr = $("sr");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [-4.5, 4.5], label: t("fig.x") }, y: { domain: [-4.5, 4.5], label: t("fig.y") } });
  const lin = Plot.el("line", { x1: x(-4.5), y1: y(-4.5), x2: x(4.5), y2: y(4.5), class: "stroke thin dash c-label-2" }, g);
  const st = []; for (let i = -300; i <= 300; i++) { const u = 4.5 * i / 300; st.push([x(u), y(Q.fluxPiege(u * P0) / P0)]); }
  Plot.el("path", { d: Plot.path(st), class: "stroke c-tint" }, g);
  const dot = Plot.el("circle", { r: 6, class: "dot c-warn" }, g);
  function draw() {
    const r = +sr.value * 1e-6, B = +sb.value * 1e-6, Phi = B * Math.PI * r * r, Pp = Q.fluxPiege(Phi), n = Math.round(Pp / P0);
    dot.setAttribute("cx", x(Math.max(-4.5, Math.min(4.5, Phi / P0)))); dot.setAttribute("cy", y(Math.max(-4.5, Math.min(4.5, n))));
    $("sbr").textContent = F.si(B, "T"); $("srr").textContent = F.si(r, "m");
    $("va").textContent = t("fig.v.a", { n: F.num(Phi / P0, 3) });
    $("fa").textContent = t("fig.f.a", { f: F.sci(Phi, 3) });
    $("vp").textContent = t("fig.v.p", { n });
    $("fp").textContent = t("fig.f.p", { l: F.num(Phi / PL, 3) });
    $("vb").textContent = F.si(P0 / (Math.PI * r * r), "T");
    $("fb").textContent = t("fig.f.b");
  }
  sb.oninput = sr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["london", 1948, "idea"], ["bcs", 1957, "idea"], ["deaver", 1961, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["squid"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["origine", "b"], ["valeur", "c"], ["facteur", "a"], ["mince", "b"], ["champ", "a"], ["change", "d"], ["escalier", "b"], ["terrestre", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 217 });
})();
</script>
