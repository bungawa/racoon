<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique;

/* ---------- miroir courbe : trajet par O minimum, plat ou maximum ---------- */
(() => {
  const A = 1, H = 1, S0 = 0.3, SMAX = 0.3, ks = $("ksl"), geo = $("geo"), dl = $("dl");
  const SC = 200, W = 560, HT = 300, X0 = W / 2, Y0 = HT - 50;           // 200 px par mètre ; O en (X0, Y0)
  const px = ([x, y]) => [X0 + SC * x, Y0 - SC * y];
  geo.setAttribute("viewBox", `0 0 ${W} ${HT}`);
  function draw() {
    const k = +ks.value, R = Math.abs(k) < 1e-9 ? Infinity : 1 / k, m = O.miroirCourbe({ a: A, h: H, R });
    geo.innerHTML = "";
    const ell = Array.from({ length: 121 }, (_, i) => { const u = -0.6 + 1.2 * i / 120; return px([Math.SQRT2 * Math.sin(u), H - H * Math.cos(u)]); });
    Plot.el("path", { d: Plot.path(ell), class: "stroke thin dash c-label-2" }, geo);
    const smax = isFinite(R) ? Math.min(1.3, 0.95 * Math.PI * Math.abs(R)) : 1.3;
    const arc = Array.from({ length: 121 }, (_, i) => px(m.P(-smax + 2 * smax * i / 120)));
    Plot.el("path", { d: Plot.path(arc), class: "stroke bold c-tint" }, geo);
    const a = px([-A, H]), b = px([A, H]), o = px([0, 0]), p = px(m.P(S0));
    Plot.el("path", { d: Plot.path([a, o, b]), class: "stroke c-label" }, geo);
    Plot.el("path", { d: Plot.path([a, p, b]), class: "stroke thin dash c-label" }, geo);
    [[a, "A"], [b, "B"], [o, "O"], [p, "P"]].forEach(([q, n]) => {
      Plot.el("circle", { cx: q[0], cy: q[1], r: 4, class: "fill c-label" }, geo);
      Plot.el("text", { x: q[0] + 7, y: q[1] - 7 }, geo).textContent = n;
    });
    dl.innerHTML = "";
    const ss = Array.from({ length: 121 }, (_, i) => -SMAX + 2 * SMAX * i / 120), dL = ss.map(s => (m.L(s) - m.L0) * 1e3);
    const { x, y, g } = Plot.axes(dl, { fmt: F, w: 640, h: 220, x: { domain: [-SMAX * 100, SMAX * 100], label: t("mc.x") }, y: { domain: [-40, 40], label: t("mc.y") } });
    Plot.el("line", { x1: x(-SMAX * 100), x2: x(SMAX * 100), y1: y(0), y2: y(0), class: "ref" }, g);
    Plot.el("path", { d: Plot.path(ss.map((s, i) => [x(s * 100), y(Math.max(-40, Math.min(40, dL[i])))])), class: "curve" }, g);
    Plot.el("circle", { cx: x(S0 * 100), cy: y(Math.max(-40, Math.min(40, (m.L(S0) - m.L0) * 1e3))), r: 5, class: "dot" }, g);
    ks.value = k;
    $("kread").textContent = isFinite(R) ? t("mc.k.read", { k: F.qty(F.fix(k, 2), "m⁻¹"), r: F.si(R, "m", { prefix: "", sig: 3 }) }) : t("mc.k.plan");
    $("vnat").textContent = t("mc.nat." + m.nature); $("fnat").textContent = t("mc.f.nat", { rc: F.si(m.Rc, "m", { prefix: "" }) });
    $("vl2").textContent = F.qty(F.fix(m.L2, 3), "m⁻¹");
    const z1 = m.zone(550e-9), z2 = m.zone(0.03);
    $("vzl").textContent = isFinite(z1) ? F.si(z1, "m", { sig: 2 }) : "∞";
    $("fzr").textContent = t("mc.f.zone", { z: isFinite(z2) ? F.si(z2, "m", { sig: 2 }) : "∞" });
  }
  ks.oninput = draw;
  $("bplan").onclick = () => { ks.value = 0; draw(); };
  $("bell").onclick = () => { ks.value = 0.5; draw(); };
  $("bfort").onclick = () => { ks.value = 0.8; draw(); };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fermat", 1662, "idea"], ["grimaldi", 1665, "experiment"], ["maupertuis", 1744, "idea"], ["hamilton", 1827, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["faisceau"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["nom", "b"], ["concave", "a"], ["ellipse", "c"], ["zone", "d"], ["fente", "a"], ["doigts", "b"], ["savoir", "c"], ["mirage", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 265 });
})();
</script>
