            </div></div>
          <div class="ctl"><div class="row"><label for="sa" data-i18n="fig.alpha"></label><output id="sar" for="sa"></output></div>

<script src="/racoon/i18n.js"></script>

<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/quantique-deux-etats.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- a superposition (+S − −S)/√2 against a mixture of +S and −S, half each, and the furnace beam, through T at α ---------- */
(() => {
  const sa = $("sa"); let voie = 1;
  const r = Math.SQRT1_2, SUP = [Cx.c(r, 0), Cx.c(0, 0), Cx.c(-r, 0)], B = [0, 1, 2].map(i => Q.etatBase(3, i));
  const chiT = (a, i) => Q.appliquer(Q.adjointe(Q.spin1Y(a)), Q.etatBase(3, i));       // the state iT written in the base S
  const P = (a, i) => ({ sup: Cx.abs2(Q.produitScalaire(chiT(a, i), SUP)),
    mel: Q.probaMelange([0.5, 0.5], [B[0], B[2]], chiT(a, i)), four: Q.probaMelange([1 / 3, 1 / 3, 1 / 3], B, chiT(a, i)) });
  function draw() {
    const a = +sa.value * Math.PI / 180, svg = $("courbes"); svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 250, x: { domain: [0, 180], label: t("fig.ax.alpha") }, y: { domain: [0, 1], label: t("fig.ax.p") } });
    const ds = Array.from({ length: 181 }, (_, k) => k), pts = ds.map(d => P(d * Math.PI / 180, voie));
    [["sup", "stroke c-tint"], ["mel", "stroke dash c-warn"], ["four", "stroke thin c-label-2"]].forEach(([k, cls]) =>
      Plot.el("path", { d: Plot.path(ds.map((d, j) => [ax.x(d), ax.y(pts[j][k])])), class: cls, fill: "none" }, svg));
    Plot.el("line", { x1: ax.x(+sa.value), x2: ax.x(+sa.value), y1: ax.y(0), y2: ax.y(1), class: "stroke thin dash c-label" }, svg);
    $("voie").querySelectorAll("button").forEach(bt => bt.setAttribute("aria-pressed", String(+bt.dataset.i === voie)));
    $("sar").textContent = F.num(+sa.value, 3) + "\u00a0°";
    const p = P(a, voie);
    $("vsup").textContent = F.num(p.sup, 3); $("vmel").textContent = F.num(p.mel, 3);
    $("vfour").textContent = F.num(p.four, 3); $("ffour").textContent = t("fig.f.four");
  }
  $("voie").querySelectorAll("button").forEach(bt => bt.onclick = () => { voie = +bt.dataset.i; draw(); });
  sa.oninput = draw; draw();
  const p = P(Math.PI / 2, 1);
  $("sys1").innerHTML = t("sys1.body", { s: F.num(p.sup, 2), m: F.num(p.mel, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["densite", 1927, "idea"], ["livre", 1932, "idea"], ["bloch", 1946, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lunettes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["four", "d"], ["n", "a"], ["sup", "c"], ["isotrope", "b"], ["poids", "a"], ["demi", "d"], ["infini", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 508 });
})();
</script>
