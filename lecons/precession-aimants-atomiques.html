<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes;

/* ---------- J sur son cône autour de B, vue oblique, ralentie ---------- */
(() => {
  const svg = $("cone"), sb = $("sb"), st = $("st"), O = [320, 250], S = 150, K = 0.32;      // K: foreshortening of depth
  // seen from above and in front: x to the right, z up, y away from the viewer, so higher on the screen (right-handed)
  const px = v => [O[0] + S * v[0], O[1] - S * v[2] - S * K * v[1]];
  const fond = Plot.el("g", {}, svg), dyn = Plot.el("g", {}, svg);
  Plot.fleche(fond, [O[0], O[1] + 60], [O[0], 20], { cls: "c-label-2", trait: "stroke bold" });
  let part = "electron", phase = 0, last = null, raf = 0;
  const etat = () => {
    const B = Math.pow(10, +sb.value), th = +st.value * Math.PI / 180, g = M.rapportGyromagnetique(part), J = Cst.hbar / 2;
    return { B, th, g, J, mu: g * J, fp: M.frequencePrecession(part, B) };
  };
  function figure(e) {
    dyn.innerHTML = "";
    const c = Math.cos(e.th), s = Math.sin(e.th), sens = e.g < 0 ? 1 : -1;     // Ω = −γB: counterclockwise seen from +z when γ < 0
    const pts = []; for (let k = 0; k <= 72; k++) { const a = TAU * k / 72; pts.push(px([s * Math.cos(a), s * Math.sin(a), c])); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke thin dash" }, dyn);
    const a = sens * phase, u = [s * Math.cos(a), s * Math.sin(a), c], o = px([0, 0, 0]), j = px(u);
    Plot.el("line", { x1: o[0], y1: o[1], x2: px([0, 0, c])[0], y2: px([0, 0, c])[1], class: "stroke thin dash" }, dyn);
    Plot.fleche(dyn, o, j, { cls: "c-tint", trait: "stroke bold" });
    const m = Math.sign(e.mu) * 0.55, pm = px(u.map(x => m * x));
    Plot.fleche(dyn, o, pm, { cls: "c-warn", ouverte: true });
    // torque μ ∧ B ∝ γ J ∧ ẑ, drawn at the tip of J: it is the velocity of the tip
    const tq = [e.g * u[1], -e.g * u[0], 0], n = Math.hypot(tq[0], tq[1]) || 1, L = 0.45 * s;
    Plot.fleche(dyn, j, px(u.map((x, i) => x + L * tq[i] / n)), { cls: "c-label" });
  }
  function stats(e) {
    $("sbr").textContent = F.si(e.B, "T", { sig: 2 });
    $("str").textContent = t("fig.deg", { a: F.num(+st.value, 3) });
    $("vf").textContent = F.si(e.fp.f, "Hz", { sig: 3 });
    $("ff").textContent = t("fig.f.f", { T: F.si(1 / e.fp.f, "s", { sig: 2 }), sens: t(e.g < 0 ? "fig.sens.direct" : "fig.sens.indirect") });
    const tau = Math.abs(e.mu) * e.B * Math.sin(e.th);
    $("vt").textContent = F.si(tau, "N·m", { sig: 2 });
    $("ft").textContent = t("fig.f.tau", { w: F.si(tau / (e.J * Math.sin(e.th)), "rad·s⁻¹", { sig: 3 }) });
    // one turn by Runge–Kutta, 200 steps, against the exact rotation
    const J0 = [Math.sin(e.th), 0, Math.cos(e.th)].map(x => x * e.J), T = 1 / e.fp.f, r = M.precessionPas(e.g, [0, 0, e.B], J0, T, 200), Jn = r.J.at(-1);
    $("vr").textContent = F.sci(Math.hypot(Jn[0] - J0[0], Jn[1] - J0[1], Jn[2] - J0[2]) / e.J, 2);
    $("fr").textContent = t("fig.f.rk");
  }
  const TAU = 2 * Math.PI;
  function tick(now) {
    if (last != null) phase += TAU * (now - last) / 4000;                         // shown: one turn in 4 s
    last = now; figure(etat()); raf = requestAnimationFrame(tick);
  }
  function maj() { const e = etat(); stats(e); figure(e); }
  document.querySelectorAll("#parts button").forEach(b => b.onclick = () => {
    part = b.dataset.p; document.querySelectorAll("#parts button").forEach(z => z.setAttribute("aria-pressed", z === b)); maj(); });
  sb.oninput = st.oninput = maj; maj();
  if (!(self.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) raf = requestAnimationFrame(tick);
})();

/* ---------- le système décrit : un magnétomètre à protons dans le champ terrestre ---------- */
(() => {
  const B = 47e-6, f = M.frequencePrecession("proton", B).f, dB = 1e-9, df = M.frequencePrecession("proton", dB).f;
  $("sys1").innerHTML = t("sys1.body", { B: F.si(B, "T", { prefix: "µ" }), f: F.si(f, "Hz", { sig: 3 }), dB: F.si(dB, "T", { prefix: "n" }), df: F.si(df, "Hz", { prefix: "m", sig: 2 }),
    r: F.sci(dB / B, 1), irm: F.si(M.frequencePrecession("proton", 1.5).f, "Hz", { sig: 3 }), rpe: F.si(M.frequencePrecession("electron", 0.35).f, "Hz", { sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["larmor", 1897, "idea"], ["zavoisky", 1944, "experiment"], ["varian", 1954, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["magnetometre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["angle", "a"], ["champ", "c"], ["aligne", "d"], ["irm", "b"], ["sens", "a"], ["terre", "c"], ["rapport", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 343 });
})();
</script>
