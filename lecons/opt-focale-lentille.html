<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique;
const mm = v => isFinite(v) ? F.si(v, "m", { prefix: "m", sig: 3 }) : "∞";

/* ---------- faisceau parallèle à travers une vraie lentille (épaisseur au bord 1 mm, demi-ouverture 2 cm), contre (27.11) ---------- */
(() => {
  const svg = $("lentille"), c1 = $("c1sl"), c2 = $("c2sl"), ns = $("nsl"), A = 0.02, W = 640, Hp = 300;
  const X = [-0.3, 0.5], Y = [-0.025, 0.025], x = Plot.linScale(X[0], X[1], 10, W - 10), y = Plot.linScale(Y[0], Y[1], Hp - 20, 20);
  const P = (a, b) => [x(a), y(b)], line = (pts, cls) => Plot.el("path", { d: Plot.path(pts.map(([a, b]) => P(a, b))), class: cls }, svg);
  const mark = (xv, key, cls) => { if (!(xv > X[0] && xv < X[1])) return;
    Plot.el("line", { x1: x(xv), x2: x(xv), y1: y(0) - 5, y2: y(0) + 5, class: "stroke " + cls }, svg);
    Plot.el("text", { x: x(xv), y: y(0) + 18, "text-anchor": "middle" }, svg).textContent = t(key); };
  const rayon = c => c === 0 ? Infinity : 1 / c;
  svg.setAttribute("viewBox", "0 0 " + W + " " + Hp);
  function draw() {
    svg.innerHTML = "";
    const C1 = +c1.value, C2 = +c2.value, n = +ns.value, R1 = rayon(C1), R2 = rayon(C2);
    const forme = O.formeLentille(R1, R2, A, 0.001), e = forme.e, L = O.lentille({ n, R1, R2, e }), x0 = -e / 2, surf = L.surfaces(x0);
    line([[X[0], 0], [X[1], 0]], "stroke thin rim");
    const contour = [];
    for (let k = -20; k <= 20; k++) { const yy = A * k / 20; contour.push([x0 + forme.z1(yy), yy]); }
    for (let k = 20; k >= -20; k--) { const yy = A * k / 20; contour.push([x0 + e + forme.z2(yy), yy]); }
    contour.push(contour[0]);
    line(contour, "stroke c-label");
    let bord = null;
    for (let k = -5; k <= 5; k++) {
      const h = 0.9 * A * k / 5, r = O.trace({ x: X[0], y: h, u: 0 }, surf);
      if (!r) continue;
      const tEnd = (X[1] - r.x) / r.dx;
      line(r.points.concat([[r.x + tEnd * r.dx, r.y + tEnd * r.dy]]), "stroke thin c-tint");
      const xc = O.coupeAxe(r);
      if (k !== 0 && xc < r.x) { const xb = Math.max(xc, X[0]); line([[r.x, r.y], [xb, r.y + (xb - r.x) * r.dy / r.dx]], "stroke thin dash c-label-2"); }
      if (k === 5) bord = xc;
    }
    mark(L.fp, "le.Fp", "c-label-2"); mark(-L.fp, "le.F", "c-label-2");
    if (isFinite(L.fp) && L.fp > X[0] && L.fp < X[1]) Plot.el("circle", { cx: x(L.fp), cy: y(0), r: 5, class: "fill c-warn" }, svg);
    const fe = L.xFp + x0;
    $("c1read").textContent = isFinite(R1) ? t("le.R", { R: mm(R1) }) : t("le.plan");
    $("c2read").textContent = isFinite(R2) ? t("le.R", { R: mm(R2) }) : t("le.plan");
    $("nread").textContent = F.num(n, 3);
    $("vfp").textContent = mm(L.fp); $("fV").textContent = t("le.f.V", { V: F.qty(F.num(L.V, 3), "m⁻¹") });
    $("vfe").textContent = mm(fe); $("fe").textContent = t("le.f.e", { e: F.si(e, "m", { prefix: "m", sig: 2 }) });
    $("vbord").textContent = bord === null ? "–" : mm(bord);
    $("fbord").textContent = bord === null || !isFinite(fe) ? "" : t("le.f.ecart", { d: mm(bord - fe) });
  }
  c1.oninput = draw; c2.oninput = draw; ns.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["giordano", 1306, "use"], ["halley", 1693, "idea"], ["monoyer", 1872, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lunettes", "frontofocometre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["chaine", "d"], ["epaisseur", "a"], ["biconvexe", "c"], ["menisque", "b"], ["retourner", "d"], ["eau", "a"], ["myope", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 273 });
})();
</script>
