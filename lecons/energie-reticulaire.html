<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, CA = ChimArchi, Cst = Constantes;
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); };
const kj = x => F.qty(F.num(x / 1e3, 4), "kJ·mol⁻¹"), RT = Cst.R * 298.15;

/* ---------- cycle de Born–Haber ---------- */
(() => {
  const svg = $("cycle"), ESP = { NaCl: ["Na", "Cl"], KCl: ["K", "Cl"], CsCl: ["Cs", "Cl"], NaF: ["Na", "F"], LiF: ["Li", "F"], CaF2: ["Ca", "F"] };
  seg($("composes"), "c", id => {
    const b = CA.bornHaber(id), d = CA.BH[id], e = Object.fromEntries(b.etapes.map(x => [x.id, x.dH]));
    const [M, X] = ESP[id], n = d.n, q = n === 1 ? "" : String(n);
    // niveaux, en J·mol⁻¹, comptés depuis les corps simples M(s) + n/2 X₂
    const L = { cristal: d.dfH, elements: 0, metal: e.metal, atomes: e.metal + e.halogene };
    L.cations = L.atomes + e.ionisation; L.ions = L.cations + e.attachement;
    const vars = { M, X, n: q, i: n === 1 ? "" : "₂", z: n === 1 ? "⁺" : "²⁺", demi: n === 1 ? "½ " : "" };
    const lab = k => t("bh.niv." + k, vars);
    svg.innerHTML = "";
    const lo = L.cristal - 150e3, hi = L.cations + 150e3, y = v => 400 - (v - lo) / (hi - lo) * 380;
    const xs = { cristal: 40, elements: 40, metal: 160, atomes: 260, cations: 360, ions: 470 };
    Object.keys(L).forEach(k => {
      P("line", { x1: xs[k], x2: xs[k] + 120, y1: y(L[k]), y2: y(L[k]), class: "stroke bold" + (k === "cristal" || k === "ions" ? " c-tint" : " c-label") }, svg);
      P("text", { x: xs[k], y: y(L[k]) - 6, class: "note" }, svg).textContent = lab(k);
    });
    const fleche = (k0, k1, x, cls, txt) => {
      P("line", { x1: x, x2: x, y1: y(L[k0]), y2: y(L[k1]), class: "stroke " + cls }, svg);
      const up = L[k1] > L[k0], y1 = y(L[k1]);
      P("path", { d: `M${x - 5} ${y1 + (up ? 8 : -8)} L${x} ${y1} L${x + 5} ${y1 + (up ? 8 : -8)}`, class: "stroke " + cls }, svg);
      P("text", { x: x + 8, y: (y(L[k0]) + y1) / 2 + 4, class: "note" }, svg).textContent = txt;
    };
    fleche("elements", "metal", 150, "c-label-2", kj(e.metal));
    fleche("metal", "atomes", 250, "c-label-2", kj(e.halogene));
    fleche("atomes", "cations", 350, "c-label-2", kj(e.ionisation));
    fleche("cations", "ions", 460, "c-label-2", kj(e.attachement));
    fleche("elements", "cristal", 30, "c-label-2", kj(d.dfH));
    fleche("cristal", "ions", 600, "bold c-tint", t("bh.ret"));
    $("vret").textContent = kj(b.dH);
    $("fret").textContent = t("bh.f.ret", { id: t("bh.nom." + id) });
    $("vions").textContent = kj(e.ionisation + e.attachement);
    $("vX").textContent = F.num(b.dH / RT, 3);
  });
})();

/* ---------- ordres de grandeur ---------- */
(() => {
  /* énergies par mole, J·mol⁻¹ : RT à 298 K ; sublimation de CO₂ (Giauque et Egan, 1937) ; ΔfH° de Cu(g) (clé CODATA) ; Born–Haber */
  const L = [["rt", RT], ["co2", 25.2e3], ["cu", 337.4e3], ["cscl", CA.bornHaber("CsCl").dH], ["nacl", CA.bornHaber("NaCl").dH],
    ["lif", CA.bornHaber("LiF").dH], ["caf2", CA.bornHaber("CaF2").dH]];
  const txt = textOf("ech.items", L.map(l => l[0])), max = Math.log10(4e6), min = Math.log10(1e3);
  $("echelle").innerHTML = L.map(([id, v]) => `<div><span class="k">${txt[id]}</span><span class="track" aria-hidden="true"><i style="left:${(100 * (Math.log10(v) - min) / (max - min)).toFixed(1)}%"></i></span><span class="v">${kj(v)}</span></div>`).join("");
})();

/* ---------- tendance : énergie réticulaire contre |z⁺z⁻|/(r⁺ + r⁻) ---------- */
(() => {
  /* [composé, cation, coordinence, anion, coordinence, |z⁺z⁻|, ions par unité formulaire] */
  const L = [["CsCl", "Cs+", 8, "Cl-", 6, 1, 2], ["KCl", "K+", 6, "Cl-", 6, 1, 2], ["NaCl", "Na+", 6, "Cl-", 6, 1, 2], ["NaF", "Na+", 6, "F-", 6, 1, 2],
    ["LiF", "Li+", 6, "F-", 6, 1, 2], ["CaF2", "Ca2+", 8, "F-", 4, 2, 3]];
  const pts = L.map(([id, c, cc, a, cn, zz, nu]) => { const d = CA.rayon(c, cc).r + CA.rayon(a, cn).r; return { id, x: nu * zz / d * 1e-12, d, nu, zz, E: CA.bornHaber(id).dH }; });
  const svg = $("tendance");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [0, 0.026], label: t("td.x"), fmt: v => F.num(v, 2) },
    y: { domain: [0, 3200], label: t("td.y") } });
  const K = CA.KC * CA.madelung("NaCl") / 2;                  // attraction seule : N_A (M_NaCl/2) e²/(4π ε0) × ν|z⁺z⁻|/d
  const courbe = [0, 0.026].map(X => [x(X), y(K * X * 1e12 / 1e3)]);
  P("path", { d: Plot.path(courbe), class: "stroke dash" }, P("g", { class: "c-label-2" }, g));
  const gp = P("g", { class: "c-tint" }, g);
  pts.forEach(p => {
    P("circle", { cx: x(p.x), cy: y(p.E / 1e3), r: 5, class: "fill" }, gp);
    P("text", { x: x(p.x) + 8, y: y(p.E / 1e3) + 4, class: "note" }, g).textContent = t("td.nom." + p.id);
  });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bornhaber", 1919, "idea"], ["bornmayer", 1932, "idea"], ["kapustinskii", 1956, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["affinite", "solubilite"], u = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${u[id].name}.</strong> ${u[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signe", "a"], ["mesure", "c"], ["ionisation", "b"], ["lif", "d"], ["caf2", "a"], ["rt", "c"], ["mg", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 67 });
})();
</script>
