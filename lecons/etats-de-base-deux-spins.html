<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, D = Math.PI / 180;

/* ---------- a product state, blended toward the singlet: four probabilities, and whether it still factorizes ---------- */
(() => {
  const svg = $("barres"), sE = $("sE"), sP = $("sP"), sS = $("sS"), s2 = Math.SQRT1_2;
  function draw() {
    const prod = Q.etatProduit(Q.etatSpinDemi(+sE.value * D, 0), Q.etatSpinDemi(+sP.value * D, 0)), s = +sS.value;
    const sing = [0, s2, -s2, 0].map(x => Cx.c(x, 0)), raw = prod.map((z, i) => Cx.add(Cx.scale(z, Math.sqrt(1 - s)), Cx.scale(sing[i], Math.sqrt(s))));
    const n = Math.sqrt(Q.norme2(raw)), psi = raw.map(z => Cx.scale(z, 1 / n)), P = psi.map(Cx.abs2);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 30, l: 56 }, x: { domain: [0, 4], label: t("fig.x") }, y: { domain: [0, 1], label: t("fig.y") } });
    P.forEach((p, i) => {
      Plot.el("rect", { x: o.x(i + 0.2), y: o.y(p), width: o.x(i + 0.8) - o.x(i + 0.2), height: o.y(0) - o.y(p), class: "fill c-ok" }, o.g);
      Plot.el("line", { x1: o.x(i + 0.2), x2: o.x(i + 0.8), y1: o.y(0.25), y2: o.y(0.25), class: "stroke thin dash c-label-2" }, o.g);
    });
    $("sEr").textContent = F.num(+sE.value, 3) + "°"; $("sPr").textContent = F.num(+sP.value, 3) + "°"; $("sSr").textContent = F.fix(s, 2);
    $("vc").textContent = P.map(p => F.fix(p, 3)).join(" ; "); $("fc").textContent = t("fig.f.c");
    const e = Q.intrication(psi);
    $("vi").textContent = F.fix(e, 3); $("fi").textContent = t(e < 1e-9 ? "fig.f.prod" : "fig.f.intr");
    const sz = Q.appliquer(Q.sigmaElectron("z"), psi), mz = psi.reduce((acc, z, i) => acc + Cx.mul(Cx.conj(z), sz[i]).re, 0);
    $("ve").textContent = F.fix(mz, 3); $("fe").textContent = t("fig.f.e");
  }
  sE.oninput = sP.oninput = sS.oninput = draw; draw();
})();

/* ---------- the system described: ground state, the other states 10 eV away ---------- */
(() => {
  const dE = 10.2 * K.e, hf = K.h * Q.frequenceHyperfineH, kT = K.k_B * 300;
  $("sys1").innerHTML = t("sys1.body", { dE: F.si(dE, "J"), hf: F.si(hf, "J"), r: F.sci(hf / dE, 1), kT: F.si(kT, "J"), b: F.sci(Math.exp(-dE / kT), 0), T: F.kelvin(300) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["epr", 1935, "idea"], ["ws", 1949, "experiment"], ["bell", 1964, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["qubits", "ortho"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["nombre", "b"], ["produit", "a"], ["singulet", "d"], ["electron", "c"], ["trois", "a"], ["choix", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1201 });
})();
</script>
