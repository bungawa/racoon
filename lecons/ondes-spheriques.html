<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OndesMilieux, c = Constantes.c;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- une impulsion sphérique : f(u) = e^(−(u/τ)²), τ = 2 ns ; sortante, ou entrante (arrive au centre à 40 ns) ---------- */
(() => {
  const tau = 2e-9, T = 40e-9, R0 = 0.5, R1 = 12, YMAX = 1.25;
  const f = u => Math.exp(-((u / tau) ** 2));
  let sens = 1;
  function draw() {
    const tt = +$("st").value * 1e-9, g = sens > 0 ? f : (u => f(u - T)), psi = O.spherique(g, sens);
    const svg = $("profil"); svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, R1], label: t("sph.xaxis") }, y: { domain: [-0.05, YMAX], label: t("sph.yaxis") } });
    const rs = Array.from({ length: 1101 }, (_, i) => R0 + (R1 - R0) * i / 1100), clip = v => Math.min(YMAX, v);
    Plot.el("path", { d: Plot.path(rs.filter(r => 1 / r <= YMAX).map(r => [A.x(r), A.y(1 / r)])), class: "ref" }, A.g);
    const t0 = tt / 2;
    Plot.el("path", { d: Plot.path(rs.map(r => [A.x(r), A.y(clip(psi(r, t0)))])), class: "stroke thin c-label-2 dash" }, A.g);
    Plot.el("path", { d: Plot.path(rs.map(r => [A.x(r), A.y(clip(psi(r, tt)))])), class: "curve" }, A.g);
    const rp = sens > 0 ? c * tt : c * (T - tt);
    $("stv").textContent = F.si(tt, "s", { prefix: "n" });
    $("vr").textContent = F.si(rp, "m"); $("fr").textContent = t(sens > 0 ? "sph.f.r.sort" : "sph.f.r.entr");
    const ok = rp > R0 + 3 * c * tau && rp < R1 - 3 * c * tau;
    $("vrpsi").textContent = ok ? F.num(rp * psi(rp, tt), 3) : "–"; $("frpsi").textContent = t("sph.f.rpsi");
    $("vw").textContent = F.num(O.energieCoquille(psi, tt, R0, R1, 4000), 3);
    $("fw").textContent = t(ok ? "sph.f.w" : "sph.f.w.bord");
    $("sens").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.s === sens)));
  }
  $("sens").querySelectorAll("button").forEach(b => b.onclick = () => { sens = +b.dataset.s; draw(); });
  $("st").oninput = draw; draw();
})();

/* ---------- le système décrit : un haut-parleur de 10 cm en chambre anéchoïque, à 1 kHz ---------- */
(() => {
  const a = 0.1, f = 1000, cs = 343, lam = cs / f;
  $("sys1").innerHTML = t("sys1.body", { a: F.si(a, "m", { prefix: "m" }), f: F.si(f, "Hz"), l: F.si(lam, "m", { prefix: "m" }), kr: F.si(lam / (2 * Math.PI), "m", { prefix: "m" }), db: F.num(O.niveauEcart(1, 2), 3), db10: F.num(O.niveauEcart(1, 10), 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["huygens", 1690, "idea"], ["lorenz", 1867, "idea"], ["wheeler", 1945, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["anechoique"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["laplacien", "b"], ["forme", "d"], ["intensite", "a"], ["decibels", "c"], ["entrante", "b"], ["origine", "a"], ["proche", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 204 });
})();
</script>
