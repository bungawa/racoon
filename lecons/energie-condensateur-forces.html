<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
const pct = e => F.qty(F.num(100 * e, 2), "%");

/* ---------- le système décrit : deux disques de 5 cm de rayon à 1 mm, sous 1 kV, chargés à travers 1 kΩ ---------- */
(() => {
  const a = 0.05, d = 1e-3, V = 1e3, R = 1e3, A = Math.PI * a * a, Cr = ES.condensateurDisques(a, d).capacite, Ci = ES.capacitePlan(A, d);
  $("sys1").innerHTML = t("sys1.body", { c: F.si(Cr, "F"), u: F.si(Cr * V * V / 2, "J"), e: F.si(V / d, "V/m"), bord: pct(Cr / Ci - 1),
    tau: F.si(R * Cr, "s"), lc: F.si(2 * a / ES.C, "s"), rap: F.num(2 * a / ES.C / (R * Cr), 2) });
})();

/* ---------- le bilan d'un petit déplacement, et la force des disques réels ---------- */
(() => {
  const a = 0.05, V0 = 1e3, A = Math.PI * a * a, dsl = $("dsl");
  const Cd = x => ES.condensateurDisques(a, x).capacite;
  let mode = "Q";
  function draw() {
    const r = 0.01 * Math.pow(50, +dsl.value / 100), d = r * a, f = ES.forceArmatures(Cd, d, 1e-3 * d), Q = f.C * V0;
    const C2 = Cd(1.01 * d), b = ES.bilanDeplacement(f.C, C2, mode === "Q" ? { Q } : { V: V0 }), Fr = f.parV(V0);
    $("dread").textContent = t("bi.v.d", { r: F.num(r, 2), d: F.si(d, "m") });
    $("vdU").textContent = F.si(b.dU, "J");
    $("vsrc").textContent = F.si(b.source, "J");
    $("vop").textContent = F.si(b.operateur, "J");
    $("vF").textContent = F.si(Fr, "N");
    $("veQ").textContent = pct(Q * Q / (2 * ES.EPS0 * A) / Fr - 1);
    $("veV").textContent = pct(ES.EPS0 * A * V0 * V0 / (2 * d * d) / Fr - 1);
    $("bilan").innerHTML = t(mode === "Q" ? "bi.note.Q" : "bi.note.V", { w: F.si(Fr * 0.01 * d, "J") });
  }
  document.querySelectorAll("#mode button").forEach(b => b.onclick = () => {
    mode = b.dataset.m; document.querySelectorAll("#mode button").forEach(z => z.setAttribute("aria-pressed", z === b)); draw(); });
  dsl.oninput = draw; draw();
})();

/* ---------- l'armature sur ressort : l'énergie à tension fixée, ou à charge fixée ---------- */
(() => {
  const k = 1, side = 100e-6, A = side * side, d0 = 2e-6, B = ES.basculement(k, A, d0), Qc = Math.sqrt(2 * ES.EPS0 * A * k * d0);
  const svg = $("puits"), usl = $("usl"), E0 = k * d0 * d0;                     // energies in units of k d0²
  let mode = "V";
  function draw() {
    const s = +usl.value / 100, N = 300, xs = Array.from({ length: N }, (_, i) => 0.98 * i / (N - 1));
    $("ulab").textContent = t(mode === "V" ? "pu.uV" : "pu.uQ");
    $("uread").textContent = F.num(s, 2);
    let E, x0, bar = NaN;
    if (mode === "V") {
      const V = s * B.Vb, e = B.equilibres(V);
      E = xs.map(u => B.energie(u * d0, V) / E0);
      x0 = e.stable / d0;
      if (Number.isFinite(e.stable)) bar = (B.energie(e.instable, V) - B.energie(e.stable, V)) / E0;
    } else {
      const Q = s * Qc;
      E = xs.map(u => B.energieQ(u * d0, Q) / E0 - Q * Q * d0 / (2 * ES.EPS0 * A) / E0);
      x0 = B.equilibreQ(Q) / d0;
    }
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44 }, x: { domain: [0, 1], label: t("pu.x"), fmt: v => F.num(v, 2) },
      y: { domain: [-0.3, 0.3], label: t("pu.y"), fmt: v => F.num(v, 2) } });
    const clip = v => Math.max(-0.3, Math.min(0.3, v));
    Plot.el("path", { d: Plot.path(xs.map((u, i) => [x(u), y(clip(E[i]))])), class: "stroke" }, Plot.el("g", { class: "c-tint" }, g));
    Plot.el("line", { x1: x(1 / 3), x2: x(1 / 3), y1: y(-0.3), y2: y(0.3), class: "stroke thin dash" }, Plot.el("g", { class: "c-label-2" }, g));
    if (Number.isFinite(x0)) {
      const i = Math.min(N - 1, Math.round(x0 / 0.98 * (N - 1)));
      Plot.el("circle", { cx: x(x0), cy: y(clip(E[i])), r: 6, class: "fill" }, Plot.el("g", { class: "c-warn" }, g));
    }
    $("vx").textContent = Number.isFinite(x0) ? F.num(x0, 3) : t("pu.colle");
    $("vbar").textContent = mode === "V" ? (Number.isFinite(bar) ? F.si(bar * E0, "J") : t("pu.aucune")) : t("pu.pasde");
    $("vvb").textContent = F.si(B.Vb, "V");
  }
  document.querySelectorAll("#tenu button").forEach(b => b.onclick = () => {
    mode = b.dataset.m; document.querySelectorAll("#tenu button").forEach(z => z.setAttribute("aria-pressed", z === b)); draw(); });
  usl.oninput = draw; draw();
  /* le système décrit : une plaque de silicium de 100 µm de côté et 2 µm d'épaisseur */
  const m = 2330 * A * d0, poids = m * 9.81, kb = k * B.xb;
  $("sys2").innerHTML = t("sys2.body", { vb: F.si(B.Vb, "V"), bord: F.num(d0 / side, 2), poids: F.sci(poids / kb, 2),
    f0: F.si(Math.sqrt(k / m) / (2 * Math.PI), "Hz") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["thomson", 1867, "idea"], ["maxwell", 1873, "idea"], ["nathanson", 1967, "experiment"], ["hornbeck", 1987, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["mandrin", "miroirs"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["moitie", "b"], ["ecarter", "d"], ["generateur", "a"], ["demi", "c"], ["bords", "b"], ["tiers", "a"], ["charge", "d"], ["pression", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 82 });
})();
</script>
