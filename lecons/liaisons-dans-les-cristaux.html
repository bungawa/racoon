    </div>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure>
      <div class="stage"><canvas id="vue"></canvas><div class="overlay" id="vueinfo"></div></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" id="structures" role="group" data-i18n-attr="aria-label:v3.structure">
            <button type="button" data-s="NaCl" data-i18n="v3.s.NaCl"></button><button type="button" data-s="Cu" data-i18n="v3.s.Cu"></button><button type="button" data-s="diamant" data-i18n="v3.s.diamant"></button>
          </div>
          <label><input type="checkbox" id="reseauSeul"> <span data-i18n="v3.reseauSeul"></span></label>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="v3.k.a"></span><span class="v" id="va"></span></div>
          <div class="stat"><span class="k" data-i18n="v3.k.d"></span><span class="v" id="vd"></span><span class="f" id="fd"></span></div>
          <div class="stat"><span class="k" data-i18n="v3.k.rho"></span><span class="v" id="vrho"></span><span class="f" id="frho"></span></div>
        </div>
      </div>

    </figure>
    <div class="eq"><math display="block"><mi>ρ</mi><mo>=</mo><mfrac><mrow><munder><mo>∑</mo><mtext data-i18n="eq.maille"></mtext></munder><mi>M</mi></mrow><mrow><msub><mi>N</mi><mi mathvariant="normal">A</mi></msub><msup><mi>a</mi><mn>3</mn></msup></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.rho"></p>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi>α</mi><mo>=</mo><munder><mo>∑</mo><mrow><mi>j</mi><mo>≠</mo><mn>0</mn></mrow></munder><mo>∓</mo><mfrac><msub><mi>r</mi><mn>0</mn></msub><msub><mi>r</mi><mi>j</mi></msub></mfrac></math></div>
    <p class="validite" data-i18n-html="val.madelung"></p>
    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="cube" data-i18n="md.cube"></label><output id="cubev" for="cube"></output></div>
          <input id="cube" type="range" min="1" max="12" step="1" value="1"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="md.k.alpha"></span><span class="v" id="valpha"></span><span class="f" id="falpha"></span></div>
          <div class="stat"><span class="k" data-i18n="md.k.chaine"></span><span class="v" id="vchaine"></span><span class="f" data-i18n="md.f.chaine"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="md.caption"></figcaption>
    </figure>
    <p data-i18n-html="s3.p2"></p>
    <div class="eq"><math display="block"><mi>E</mi><mo>(</mo><mi>r</mi><mo>)</mo><mo>=</mo><mo>−</mo><mfrac><mrow><mi>α</mi><msup><mi>e</mi><mn>2</mn></msup></mrow><mrow><mn>4</mn><mi>π</mi><msub><mi>ε</mi><mn>0</mn></msub><mi>r</mi></mrow></mfrac><mo>+</mo><mfrac><mi>B</mi><msup><mi>r</mi><mi>n</mi></msup></mfrac><mo>,</mo><mspace width="1em"></mspace><mi>U</mi><mo>=</mo><msub><mi>N</mi><mi mathvariant="normal">A</mi></msub><mfrac><mrow><mi>α</mi><msup><mi>e</mi><mn>2</mn></msup></mrow><mrow><mn>4</mn><mi>π</mi><msub><mi>ε</mi><mn>0</mn></msub><msub><mi>r</mi><mn>0</mn></msub></mrow></mfrac><mrow><mo>(</mo><mn>1</mn><mo>−</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><mo>)</mo></mrow></math></div>
    <p class="validite" data-i18n-html="val.born"></p>
    <figure class="chart">
      <svg id="courbe" role="img" data-i18n-attr="aria-label:bl.aria"></svg>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="nborn" data-i18n="bl.n"></label><output id="nbornv" for="nborn"></output></div>
          <input id="nborn" type="range" min="4" max="14" step="0.5" value="8"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="bl.k.u"></span><span class="v" id="vu"></span><span class="f" id="fu"></span></div>
          <div class="stat"><span class="k" data-i18n="bl.k.coul"></span><span class="v" id="vcoul"></span><span class="f" data-i18n="bl.f.coul"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="bl.caption"></figcaption>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>

    <span class="sec" data-i18n="quiz.sec"></span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/liaisons-dans-les-cristaux.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/cristaux.js"></script>
<script src="/racoon/vue-cristal.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, X = Cristaux, Cst = Constantes;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); };
const pm = x => F.qty(F.num(x * 1e12, 4), "pm");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- cinq familles ---------- */
(() => { const IDS = ["ionique", "covalente", "metallique", "moleculaire", "vdw"]; keyed($("familles"), t("fam.tag"), IDS, textOf("fam.items", IDS)); })();

/* ---------- trois cristaux en 3D ---------- */
(() => {
  const MESURE = { NaCl: 2165, Cu: 8960, diamant: 3513 };   // kg·m⁻³ near room temperature (Handbook of Chemistry and Physics)
  const COUL = { Na: "--tint", Cl: "--el-o", Cu: "--tint", C: "--el-c" }, CLS = { Na: "c-tint", Cl: "el-o", Cu: "c-tint", C: "el-c" };
  const RAY = { NaCl: { Na: 0.33, Cl: 0.5 }, Cu: { Cu: 0.45 }, diamant: { C: 0.3 } };
  const vue = VueCristal.monter($("vue"), $("vueinfo"), { hors: t("v3.hors"), reduit: reduce });
  let nom = "NaCl";
  function upd() {
    const s = X.STRUCTURES[nom], seul = $("reseauSeul").checked;
    const e0 = s.motif[0].e, v = X.voisins(s, e0);
    // « réseau seul » : keep the atoms that sit on the nodes of one fcc lattice (motif index 0 to 3)
    const at = X.atomes(s, 2).map(a => Object.assign({}, a, { e: seul && a.k >= 4 ? "autre" : a.e }));
    if (vue) vue.montrer(at, { dLiaison: seul ? s.a / Math.SQRT2 : v.d, maille: s.a, rayons: Object.assign({ autre: 0.25 }, RAY[nom]),
      couleurs: Object.assign({ autre: "--label-2" }, COUL), estompe: seul ? ["autre"] : [] });
    $("va").textContent = pm(s.a);
    $("vd").textContent = pm(v.d);
    $("fd").textContent = t("v3.f.d", { z: v.z });
    const rho = X.masseVolumique(s);
    $("vrho").textContent = F.qty(F.num(rho, 4), "kg·m⁻³");
    $("frho").textContent = t("v3.f.rho", { m: F.num(MESURE[nom], 4), e: F.fix(100 * (rho / MESURE[nom] - 1), 1) });
    const es = [...new Set(s.motif.map(m => m.e))];
    $("legende").innerHTML = es.map(e => `<span class="${CLS[e]}">${t("v3.e." + e)}</span>`).join("");
  }
  seg($("structures"), "s", s => { nom = s; upd(); });
  $("reseauSeul").onchange = upd;
})();

/* ---------- constante de Madelung ---------- */
(() => {
  const ref = X.madelungNaCl(24);
  const upd = () => {
    const n = +$("cube").value, a = X.madelungNaCl(n);
    $("cubev").textContent = t("md.v.cube", { n, c: 2 * n + 1 });
    $("valpha").textContent = F.fix(a, 5);
    $("falpha").textContent = t("md.f.alpha", { e: F.sci(Math.abs(a - ref), 2) });
  };
  $("vchaine").textContent = F.fix(2 * Math.log(2), 5);
  $("cube").oninput = upd; upd();
})();

/* ---------- énergie de Born–Landé ---------- */
(() => {
  const alpha = X.madelungNaCl(24), r0 = X.STRUCTURES.NaCl.a / 2, BH = 787e3;   // J·mol⁻¹, Born–Haber cycle
  const svg = $("courbe");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 },
    x: { domain: [200, 600], label: t("bl.x") }, y: { domain: [-1000, 600], label: t("bl.y") } });
  const curve = P("path", { class: "curve" }, g), coul = P("path", { class: "ref" }, g), dot = P("circle", { r: 6, class: "dot" }, g);
  P("line", { x1: x(200), x2: x(600), y1: y(-BH / 1e3), y2: y(-BH / 1e3), class: "ref" }, g);
  P("text", { x: x(590), y: y(-BH / 1e3) - 6, "text-anchor": "end", class: "note" }, g).textContent = t("bl.note.bh");
  const kJ = E => E * Cst.N_A / 1e3;
  let dc = "";
  for (let r = 200; r <= 600; r += 4) dc += (dc ? "L" : "M") + x(r).toFixed(1) + " " + y(Math.max(-1000, kJ(-alpha * Cst.e ** 2 / (4 * Math.PI * Cst.eps0 * r * 1e-12)))).toFixed(1);
  coul.setAttribute("d", dc);
  const upd = () => {
    const n = +$("nborn").value; let d = "";
    for (let r = 200; r <= 600; r += 2) d += (d ? "L" : "M") + x(r).toFixed(1) + " " + y(Math.min(600, Math.max(-1000, kJ(X.energiePaire(r * 1e-12, alpha, r0, n))))).toFixed(1);
    curve.setAttribute("d", d);
    const U = X.energieReticulaire(alpha, r0, n);
    dot.setAttribute("cx", x(r0 * 1e12)); dot.setAttribute("cy", y(-U / 1e3));
    $("nbornv").textContent = F.num(n, 3);
    $("vu").textContent = F.qty(F.num(U / 1e3, 3), "kJ·mol⁻¹");
    $("fu").textContent = t("bl.f.u", { e: F.fix(100 * (U / BH - 1), 1) });
  };
  $("vcoul").textContent = F.qty(F.num(X.energieReticulaire(alpha, r0, 1e9) / 1e3, 3), "kJ·mol⁻¹");
  $("nborn").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bragg", 1913, "experiment"], ["madelung", 1918, "idea"], ["ewald", 1921, "idea"], ["pauling", 1932, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pme", "densite"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["molecule", "c"], ["diamant", "a"], ["metal", "d"], ["argon", "b"], ["madelung", "c"], ["born", "a"], ["rho", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
