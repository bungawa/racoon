<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, C = ChimSolutions, E = Thermo.EAU;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const Jmol = v => F.qty(F.num(v, 3), "J·mol⁻¹"), JKmol = v => F.qty(F.num(v, 3), "J·K⁻¹·mol⁻¹");

/* ---------- eau et glace : ΔG de la solidification ---------- */
(() => {
  const Tf = 273.15, Lm = E.Lf * E.M, dCp = (E.c.eau - E.c.glace) * E.M;          // J·mol⁻¹, J·K⁻¹·mol⁻¹
  /* solidification water → ice at T and p°: capacities constant (model), or nothing but Lm and Tf (approximation) */
  const solCp = T => { const dH = -(Lm + dCp * (T - Tf)), dS = -(Lm / Tf + dCp * Math.log(T / Tf)); return { dH, dS, dG: dH - T * dS }; };
  const solCst = T => -Lm * (1 - T / Tf);
  const { x, y, g } = Plot.axes($("gl"), { fmt: F, w: 640, h: 320, pad: { b: 44, l: 64 },
    x: { domain: [243.15, 303.15], label: t("gl.x") }, y: { domain: [-800, 800], label: t("gl.y") } });
  const a = [], b = [];
  for (let i = 0; i <= 120; i++) { const T = 243.15 + i / 2; a.push([x(T), y(solCp(T).dG)]); b.push([x(T), y(solCst(T))]); }
  P("line", { x1: x(243.15), x2: x(303.15), y1: y(0), y2: y(0), class: "zero" }, g);
  P("path", { d: Plot.path(b), class: "ref" }, g); P("path", { d: Plot.path(a), class: "curve" }, g);
  P("text", { x: x(250), y: y(-560), class: "note" }, g).textContent = t("gl.n.gel");
  P("text", { x: x(282), y: y(560), class: "note" }, g).textContent = t("gl.n.fond");
  const dot = P("circle", { r: 6, class: "dot" }, g), sT = $("glT");
  function upd() {
    const T = +sT.value, r = solCp(T), sens = Math.abs(T - Tf) < 0.01 ? "eq" : T < Tf ? "gel" : "fusion";
    const sg = sens === "fusion" ? -1 : 1, dG = sg * r.dG, dH = sg * r.dH, dS = sg * r.dS;   // the spontaneous direction
    dot.setAttribute("cx", x(T)); dot.setAttribute("cy", y(r.dG));
    $("glTv").innerHTML = F.kelvin(T);
    $("gls").textContent = t("gl.sens." + sens); $("glsf").textContent = t("gl.f.sens", { h: Jmol(dH) });
    $("glg").textContent = Jmol(dG); $("glgf").textContent = t("gl.f.ecart", { e: Jmol(sg * (solCst(T) - r.dG)) });
    $("glc").textContent = JKmol(-dG / T);
    $("glcf").textContent = t("gl.f.Sc", { s: JKmol(dS), th: JKmol(-dH / T) });
  }
  sT.oninput = upd; upd();
})();

/* ---------- entropies molaires standard ---------- */
(() => {
  const IDS = ["H2O(l)", "H2O(g)", "H2", "N2", "O2", "CO2", "NH3", "NO2", "N2O4"], NOMS = textOf("ent.noms", IDS);
  $("entropies").innerHTML = IDS.map(id => `<div><span class="k">${NOMS[id].f}</span><span>${NOMS[id].nom}</span><span class="v">${JKmol(C.S0[id])}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gibbs", 1876, "idea"], ["helmholtz", 1882, "idea"], ["nernst", 1906, "idea"], ["lewis", 1923, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const PILE = { H2: -1, O2: -0.5, "H2O(l)": 1 }, V = v => F.qty(F.fix(v, 3), "V");
  const USES = ["pile", "electrolyse", "tables"], items = textOf("uses.items", USES);
  items.pile = { name: items.pile.name, text: items.pile.text.replace("{g}", F.qty(F.num(-C.drG(PILE) / 1e3, 4), "kJ·mol⁻¹")).replace("{e}", V(-C.drG(PILE) / (2 * C.F))) };
  items.electrolyse = { name: items.electrolyse.name, text: items.electrolyse.text.replace("{e}", V(-C.drG(PILE) / (2 * C.F))).replace("{h}", V(-C.drH(PILE) / (2 * C.F))) };
  keyed($("uses"), t("uses.tag"), USES, items);
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["critere", "b"], ["thermostat", "a"], ["surfondue", "c"], ["pente", "d"], ["travail", "a"], ["entropie", "c"], ["approx", "b"], ["signe", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
