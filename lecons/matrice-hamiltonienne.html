<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, NU = 23.87e9, A = Q.aDepuisFrequence(NU), T = Q.periodeAmmoniac(A), PS = 1e-12;

/* ---------- two states: H11 − H22, |H12|, and a deliberately non-Hermitian H21 ---------- */
(() => {
  const svg = $("fig"), sd = $("sd"), sc = $("sc"), sh = $("sh"), UE = 1e-6 * K.e, DUREE = 160 * PS, N = 320;
  const p = z => { const c = Q.cx(z); return c.re * c.re + c.im * c.im; };
  function draw() {
    const d = +sd.value * UE, c = +sc.value * UE, eps = +sh.value, H = [[d / 2, -c], [-(1 + eps) * c, -d / 2]];
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, DUREE / PS], label: t("fig.x"), fmt: v => F.num(v, 0) },
      y: { domain: [0, 1.5], label: t("fig.y"), fmt: v => F.num(v, 1) } });
    const P1 = [], P2 = [], S = []; let v = [1, 0];
    for (let k = 0; k <= N; k++) {
      if (k) v = Q.evolutionRK4(H, v, DUREE / N, 8);
      const a = p(v[0]), b = p(v[1]), X = x(k * DUREE / N / PS), cl = u => y(Math.min(1.5, u));
      P1.push([X, cl(a)]); P2.push([X, cl(b)]); S.push([X, cl(a + b)]);
    }
    Plot.el("path", { d: Plot.path(P1), class: "stroke dash" }, Plot.el("g", { class: "c-label-2" }, g));
    Plot.el("path", { d: Plot.path(P2), class: "stroke bold" }, Plot.el("g", { class: "c-tint" }, g));
    Plot.el("path", { d: Plot.path(S), class: "stroke" }, Plot.el("g", { class: "c-warn" }, g));
    $("sdr").textContent = F.si(d / K.e, "eV", { prefix: "µ" });
    $("scr").textContent = F.si(c / K.e, "eV", { prefix: "µ" });
    $("shr").textContent = F.num(eps, 2);
    if (eps === 0) {
      const n = Q.niveauxDeux(H), ecart = n.Ehaut - n.Ebas;
      $("vniv").textContent = t("fig.v.niv", { b: F.num(n.Ebas / UE, 1), h: F.num(n.Ehaut / UE, 1) });
      $("fniv").textContent = t("fig.f.niv", { nu: F.si(ecart / K.h, "Hz", { prefix: "G" }) });
      $("vmax").textContent = F.num(c * c / (ecart * ecart / 4), 3);
      $("fmax").textContent = t("fig.f.max", { T: F.si(K.h / ecart, "s", { prefix: "p" }) });
    } else {
      $("vniv").textContent = t("fig.v.aucun");
      $("fniv").textContent = t("fig.f.aucun");
      $("vmax").textContent = "—";
      $("fmax").textContent = t("fig.f.aucun");
    }
    $("vtot").textContent = F.num(p(v[0]) + p(v[1]), 3);
    $("ftot").textContent = t(eps === 0 ? "fig.f.herm" : "fig.f.nonherm");
  }
  sd.oninput = sc.oninput = sh.oninput = draw; draw();
})();

/* ---------- the system described: the ammonia numbers in the general formula ---------- */
(() => {
  const n = Q.niveauxDeux([[0, -A], [-A, 0]]);
  $("sys").innerHTML = t("sys.body", { A: F.si(A / K.e, "eV", { prefix: "µ" }), nu: F.si((n.Ehaut - n.Ebas) / K.h, "Hz", { prefix: "G" }),
    l: F.si(K.c * K.h / (n.Ehaut - n.Ebas), "m", { prefix: "m" }), kT: F.si(K.k_B * 300 / K.e, "eV", { prefix: "m" }), r: F.num(K.k_B * 300 / (2 * A), 0) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hamilton", 1833, "idea"], ["dreimaenner", 1925, "idea"], ["pauli", 1926, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["chimie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["herm", "c"], ["diag", "a"], ["un", "d"], ["deux", "b"], ["max", "c"], ["freq", "a"], ["nonherm", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 885 });
})();
</script>
