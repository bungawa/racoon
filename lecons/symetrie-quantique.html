<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, S = QuantSchro, K = Constantes;
const eV = K.e, A = 1 * eV;                                       // coupling of the model ion, 1 eV (order of magnitude)

/* ---------- two histories that the reflection maps onto each other, while H is symmetric ---------- */
(() => {
  const svg = $("courbe"), sD = $("sD"), T = 2 * K.h / (2 * A), S0 = [Math.cos(0.4), Math.sin(0.4)];   // mostly near proton 1
  function draw() {
    const d = +sD.value, H = [[d * A / 2, -A], [-A, -d * A / 2]], P = [[0, 1], [1, 0]];
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 }, x: { domain: [0, T * 1e15], label: t("fig.x") }, y: { domain: [0, 1], label: t("fig.y") } });
    const pa = [], pb = []; let ec = 0;
    for (let k = 0; k <= 300; k++) {
      const tt = T * k / 300, a = Q.evolutionExacte(H, S0, tt), b = Q.evolutionExacte(H, [S0[1], S0[0]], tt);
      const pa1 = Cx.abs2(a[0]), pb2 = Cx.abs2(b[1]);                // P(1) from ψ₁, P(2) from its image Pψ₁
      pa.push([o.x(tt * 1e15), o.y(pa1)]); pb.push([o.x(tt * 1e15), o.y(pb2)]); ec = Math.max(ec, Math.abs(pa1 - pb2));
    }
    Plot.el("path", { d: Plot.path(pa), class: "stroke bold c-ok" }, o.g);
    Plot.el("path", { d: Plot.path(pb), class: "stroke dash c-warn" }, o.g);
    $("sDr").textContent = F.fix(d, 2);
    $("vc").textContent = F.si(S.normeCommutateur(P, H), "J"); $("fc").textContent = t("fig.f.com");
    $("ve").textContent = F.fix(ec, 3); $("fe").textContent = t("fig.f.ecart");
  }
  sD.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  $("sys1").innerHTML = t("sys1.body", { A: F.si(A, "J"), T: F.si(K.h / (4 * A), "s") });   // sin²(At/ħ) reaches 1 at t = h/4A
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["noether", 1918, "idea"], ["wigner", 1927, "idea"], ["livre", 1931, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["orbitales", "regles"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["image", "b"], ["commute", "a"], ["brise", "d"], ["petit", "c"], ["matrice", "a"], ["ion", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1701 });
})();
</script>
