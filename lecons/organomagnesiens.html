<script src="/racoon/fmt.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, sym = s => t("chim.sym", { s }), $ = id => document.getElementById(id);
const peindre = (svg, d) => { svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };

/* ---------- inversion de polarité : C–Br, puis C–Mg ---------- */
(() => {
  const rx = O.molecule("bromoethane"), rmg = O.organomagnesien(rx, 0);
  const montrer = (m, svg, out, j) => {
    const p = O.polarites(m), marques = {};
    p.atomes.forEach((a, i) => { if (a.delta && (i === 0 || i === j)) marques[i] = a.delta > 0 ? "δ+" : "δ−"; });
    peindre($(svg), O.schema(m, { texte: sym, echelle: 40, marques, doublets: false }));
    const l = p.liaisons.find(q => (q.a === 0 && q.b === j) || (q.a === j && q.b === 0));
    $(out).textContent = t("pol.lu", { l: sym("C") + "–" + sym(m.atomes[j].e), d: F.fix(l.dchi, 2), s: t(p.atomes[0].delta > 0 ? "pol.plus" : "pol.moins") });
  };
  montrer(rx, "avant", "polA", 1);
  montrer(rmg, "apres", "polB", 1);
})();

/* ---------- l'eau du solvant ---------- */
(() => {
  const RHO = 713.4, M_EAU = 18.015e-3;                 // éthoxyéthane à 293 K, kg·m⁻³ ; eau, kg·mol⁻¹
  const w = $("w"), vol = $("vol"), nr = $("nr");
  function maj() {
    const W = +w.value * 1e-6, V = +vol.value * 1e-6, N = +nr.value * 1e-3;   // fraction massique, m³, mol
    const me = W * RHO * V, ne = me / M_EAU, perte = Math.min(1, ne / N);
    $("wRead").textContent = F.qty(F.fix(+w.value, 0), "mg·kg⁻¹");
    $("volRead").textContent = F.qty(F.fix(+vol.value, 0), "mL");
    $("nrRead").textContent = F.qty(F.fix(+nr.value, 0), "mmol");
    $("mEau").textContent = F.qty(F.num(me * 1e6, 3), "mg");
    $("nEau").textContent = F.qty(F.num(ne * 1e3, 3), "mmol");
    $("perte").textContent = F.qty(F.fix(100 * perte, perte < 0.1 ? 1 : 0), "%");
    $("perteF").textContent = t(perte >= 1 ? "eau.tout" : perte > 0.05 ? "eau.notable" : "eau.faible");
  }
  [w, vol, nr].forEach(e => e.oninput = maj); maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["barbier", 1899, "experiment"], ["grignard", 1900, "experiment"], ["nobel", 1912, "idea"], ["schlenk", 1929, "idea"], ["kumada", 1972, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["aliskiren"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["polarite", "c"], ["solvant", "a"], ["eau", "d"], ["calcul", "b"], ["alcyne", "c"], ["ether", "b"], ["inversion", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
