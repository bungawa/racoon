    <figure class="chart">
      <svg class="fig" id="sol" role="img" data-i18n-attr="aria-label:sol.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="sol.leg.t"></span><span class="c-warn" data-i18n="sol.leg.env"></span><span class="c-ok" data-i18n="sol.leg.x"></span></div>
      <div class="panel">
        <div class="controls">
          <label class="field"><span data-i18n="sol.per"></span>
            <select id="per"><option value="jour" data-i18n="per.jour"></option><option value="an" data-i18n="per.an"></option></select></label>
          <div class="ctl"><div class="row"><label for="dd" data-i18n="sol.dd"></label><output id="ddv" for="dd"></output></div>
            <input id="dd" type="range" min="0" max="100" step="1" value="70"></div>
          <div class="ctl"><div class="row"><label for="xx" data-i18n="sol.xx"></label><output id="xxv" for="xx"></output></div>
            <input id="xx" type="range" min="0" max="100" step="1" value="30"></div>
          <div class="ctl"><div class="row"><label for="ph" data-i18n="sol.ph"></label><output id="phv" for="ph"></output></div>
            <input id="ph" type="range" min="0" max="100" step="1" value="0"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="sol.k.delta"></span><span class="v" id="vdelta"></span><span class="f" data-i18n="sol.f.delta"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/quiz.js"></script>

<script src="/racoon/thermo.js"></script>

<script src="/racoon/lecons/probabilites.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, R = Constantes.R;
const pc = (x, n = 2) => F.num(100 * x, n) + F.NB + "%";

const JOUR = 86400, AN = 365.25 * JOUR;
const duree = s => s < 7200 ? F.qty(F.num(s / 60, 3), "min") : s < 172800 ? F.qty(F.num(s / 3600, 3), "h") : F.qty(F.num(s / 86400, 3), "d");
/* ---------- profondeurs de pénétration ---------- */
(() => {
  $("tab").innerHTML = [["sec", 2e-7], ["moyen", 5e-7], ["humide", 1e-6]].map(([id, D]) => `<div><span class="k">${t("tab." + id)}</span><span>${t("tab.ligne", {
    d: F.qty(F.sci(D, 1), "m²·s⁻¹"), j: F.si(S.profondeur(D, 2 * Math.PI / JOUR), "m", { sig: 2 }), a: F.si(S.profondeur(D, 2 * Math.PI / AN), "m", { sig: 2 }) })}</span></div>`).join("");
})();

/* ---------- onde thermique dans le sol ---------- */
(() => {
  const svg = $("sol"), sp = $("per"), sd = $("dd"), sx = $("xx"), sph = $("ph"), T0 = 284, A = 10;
  function draw() {
    const an = sp.value === "an", P = an ? AN : JOUR, omega = 2 * Math.PI / P, D = 1e-7 * Math.pow(10, +sd.value / 100), XM = an ? 12 : 0.6;
    const d = S.profondeur(D, omega), x = XM * +sx.value / 100, tt = P * +sph.value / 100, o1 = { D, omega, T0, A };
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 }, x: { domain: [0, XM], label: t("sol.x") }, y: { domain: [T0 - A - 1, T0 + A + 1], label: t("sol.y") } });
    const up = [], dn = [], cur = [];
    for (let i = 0; i <= 240; i++) { const u = XM * i / 240, e = A * Math.exp(-u / d); up.push([o.x(u), o.y(T0 + e)]); dn.push([o.x(u), o.y(T0 - e)]); cur.push([o.x(u), o.y(S.ondeThermique(u, tt, o1))]); }
    Plot.el("path", { d: Plot.path(up), class: "stroke dash c-warn" }, o.g); Plot.el("path", { d: Plot.path(dn), class: "stroke dash c-warn" }, o.g);
    Plot.el("path", { d: Plot.path(cur), class: "stroke c-tint" }, o.g);
    Plot.el("circle", { cx: o.x(x), cy: o.y(S.ondeThermique(x, tt, o1)), r: 5, class: "fill c-ok" }, o.g);
    const att = Math.exp(-x / d), ret = S.retardOnde(x, D, omega), v = S.vitesseOnde(D, omega);
    $("ddv").textContent = F.qty(F.sci(D, 2), "m²·s⁻¹"); $("xxv").textContent = F.si(x, "m", { sig: 3 }); $("phv").textContent = duree(tt);
    $("vdelta").textContent = F.si(d, "m", { sig: 3 });
    $("vamp").textContent = F.qty(F.num(A * att, 2), "K"); $("famp").textContent = t("sol.f.amp", { e: pc(att) });
    $("vret").textContent = duree(ret); $("fret").textContent = t("sol.f.ret", { r: F.num(ret / P, 2) });
    $("vv").textContent = F.qty(F.num(v * JOUR * 100, 3), "cm"); $("vlam").textContent = F.si(2 * Math.PI * d, "m", { sig: 3 });
    $("sys").innerHTML = t("sys.inner", { per: t("per." + sp.value), D: F.qty(F.sci(D, 2), "m²·s⁻¹"), x: F.si(x, "m", { sig: 3 }), xd: F.num(x / d, 2),
      avis: t(x < 0.5 * d ? "sys.surface" : x < 3 * d ? "sys.milieu" : "sys.fond") });
  }
  sp.onchange = sd.oninput = sx.oninput = sph.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["forbes", 1837, "experiment"], ["angstrom", 1861, "experiment"], ["kelvin", 1862, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["inertie", "sous-sol"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["delta", "b"], ["frequence", "d"], ["cave", "a"], ["phase", "c"], ["onde", "b"], ["echelon", "d"], ["peau", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 9203 });
})();
</script>
