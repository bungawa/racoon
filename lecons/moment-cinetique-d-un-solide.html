<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
const UL = "kg·m²·s⁻¹";

/* ---------- deux corps liés : les couples intérieurs s'annulent (18.19) ---------- */
(() => {
  const IDS = RotPlane.FORCES, NAMES = textOf("dc.forces", IDS);
  const O = { m1: 1, m2: 3, k: 20, l0: 1, beta: 0.3, Fext: [0, 0.2], r1: [0.1, 0.5], r2: [1.3, 0.5], v1: [0.3, -1.2], v2: [0.3, 0.4] };
  const H = 0.005, N = 1200;                                           // 6 s
  let f = "ressort";
  function upd() {
    IDS.forEach(id => $("f-" + id).setAttribute("aria-pressed", String(id === f)));
    const r = RotPlane.deuxCorps(f, O, H, N);
    const svg = $("traj"), W = 640, HT = 320, all = r.x1.concat(r.x2, [[0, 0]]);
    const x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0])), y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
    const k = Math.min((W - 40) / (x1 - x0), (HT - 40) / (y1 - y0)), X = x => W / 2 + k * (x - (x0 + x1) / 2), Y = y => HT / 2 - k * (y - (y0 + y1) / 2);
    const path = (pts, cls) => P("path", { d: pts.filter((_, i) => i % 3 === 0 || i === N).map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(""), class: cls }, svg);
    svg.innerHTML = "";
    path(r.x1, "stroke thin c-tint"); path(r.x2, "stroke thin c-label-2");
    P("line", { x1: X(r.x1[N][0]), y1: Y(r.x1[N][1]), x2: X(r.x2[N][0]), y2: Y(r.x2[N][1]), class: "stroke thin dash c-label-2" }, svg);
    P("circle", { cx: X(r.x1[N][0]), cy: Y(r.x1[N][1]), r: 5, class: "fill c-tint" }, svg);
    P("circle", { cx: X(r.x2[N][0]), cy: Y(r.x2[N][1]), r: 8, class: "fill c-label-2" }, svg);
    P("circle", { cx: X(0), cy: Y(0), r: 5, class: "fill c-warn" }, svg);
    /* stats */
    const span = a => Math.max(...a) - Math.min(...a);
    $("vl1").textContent = F.qty(F.num(span(r.L1), 3), UL);
    $("vl").textContent = F.qty(F.num(r.L[N] - r.L[0], 3), UL);
    if (Math.abs(r.L[N] - r.L[0]) < 1e-9) $("vl").textContent = t("dc.conserve");
    $("fl").textContent = t("dc.f.l", { l0: F.qty(F.num(r.L[0], 3), UL) });
    const dP = Math.hypot(r.P[N][0] - r.P[0][0], r.P[N][1] - r.P[0][1]);
    $("vp").textContent = dP < 1e-9 ? t("dc.conserve") : F.qty(F.num(dP, 3), "kg·m·s⁻¹");
    /* L1, L2, L1 + L2 against time */
    const lp = $("lplot"); lp.innerHTML = "";
    const vals = r.L1.concat(r.L2, r.L), lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.08 || 0.1;
    const { x: Xp, y: Yp, g } = Plot.axes(lp, { fmt: F, w: 640, h: 260, pad: { b: 44 }, x: { domain: [0, N * H], label: t("lp.x") }, y: { domain: [lo - pad, hi + pad], label: t("lp.y") } });
    const line = (arr, cls) => P("path", { d: arr.map((v, i) => [i, v]).filter(([i]) => i % 4 === 0 || i === N).map(([i, v], j) => (j ? "L" : "M") + Xp(r.t[i]).toFixed(1) + " " + Yp(v).toFixed(1)).join(""), class: cls }, g);
    line(r.L1, "curve"); line(r.L2, "stroke c-label-2"); line(r.L, "ref");
  }
  IDS.forEach(id => { $("f-" + id).textContent = NAMES[id]; $("f-" + id).onclick = () => { f = id; upd(); }; });
  upd();
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["forte", "origine", "referentiel"], items = textOf("sys.items", IDS);
  const v = { mag: F.sci((1 / Constantes.c) ** 2, 1), cor: F.sci(2 * Constantes.Omega_E / Constantes.g0, 2) };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kepler", 1609, "idea"], ["euler", 1746, "idea"], ["telescope", 2013, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["roues", "helicoptere"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["definition", "a"], ["bras", "a"], ["paire", "a"], ["decalee", "a"], ["roue", "a"], ["interne", "a"], ["helico", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1803 });
})();
</script>
