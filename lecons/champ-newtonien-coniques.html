<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-mecanique" data-i18n="monde.mecanique"></a><span class="aux">›</span><a href="/racoon/etape?id=forces-centrales" data-i18n="etape.forces-centrales"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-meca" href="/racoon/atlas?piste=meca" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/energie-potentielle-effective" data-i18n="tag.prereq"></a>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>r</mi><mo>=</mo><mfrac><mi>p</mi><mrow><mn>1</mn><mo>+</mo><mi>e</mi><mi data-i18n="eq.cos"></mi><mo>(</mo><mi>θ</mi><mo>−</mo><msub><mi>θ</mi><mn>0</mn></msub><mo>)</mo></mrow></mfrac><mo>,</mo><mspace width="1em"></mspace><mi>p</mi><mo>=</mo><mfrac><msup><mi>C</mi><mn>2</mn></msup><mrow><mi>G</mi><mi>M</mi></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.conique"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mi>e</mi><mo>=</mo><msqrt><mn>1</mn><mo>+</mo><mfrac><mrow><mn>2</mn><msub><mi>E</mi><mi mathvariant="normal">m</mi></msub><msup><mi>C</mi><mn>2</mn></msup></mrow><mrow><mi>m</mi><msup><mrow><mo>(</mo><mi>G</mi><mi>M</mi><mo>)</mo></mrow><mn>2</mn></msup></mrow></mfrac></msqrt></math></div>
    <p class="validite" data-i18n-html="val.e"></p>
    <div class="list keyed" id="types"></div>
    <p data-i18n-html="s1.p3"></p>
    <figure>
      <svg class="fig" id="canon" viewBox="0 0 640 380" role="img" data-i18n-attr="aria-label:can.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="can.legend.vol"></span><span class="c-label-2 sq" data-i18n="can.legend.terre"></span><span class="c-warn" data-i18n="can.legend.tir"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="h" data-i18n="can.h"></label><output id="hv" for="h"></output></div>
            <input id="h" type="range" min="200" max="2000" step="50" value="400"></div>
          <div class="ctl"><div class="row"><label for="v" data-i18n="can.v"></label><output id="vv" for="v"></output></div>
            <input id="v" type="range" min="6" max="13" step="0.05" value="9.5"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="can.k.type"></span><span class="v" id="vtype"></span><span class="f" id="ftype"></span></div>
          <div class="stat"><span class="k" data-i18n="can.k.e"></span><span class="v" id="ve"></span><span class="f" id="fe"></span></div>
          <div class="stat"><span class="k" data-i18n="can.k.a"></span><span class="v" id="va"></span><span class="f" id="fa"></span></div>
          <div class="stat"><span class="k" data-i18n="can.k.v12"></span><span class="v" id="vv12"></span><span class="f" data-i18n="can.f.v12"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="can.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><msub><mi>v</mi><mn>1</mn></msub><mo>=</mo><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mi>R</mi></mfrac></msqrt></math></div>
    <p class="validite" data-i18n-html="val.v1"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><msub><mi>v</mi><mn>2</mn></msub><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mi>R</mi></mfrac></msqrt><mo>=</mo><msqrt><mn>2</mn></msqrt><msub><mi>v</mi><mn>1</mn></msub></math></div>
    <p class="validite" data-i18n-html="val.v2"></p>
    <div class="stats">
      <div class="stat"><span class="k" data-i18n="cos.k.v1"></span><span class="v" id="cv1"></span><span class="f" data-i18n="cos.f.v1"></span></div>
      <div class="stat"><span class="k" data-i18n="cos.k.v2"></span><span class="v" id="cv2"></span><span class="f" data-i18n="cos.f.v2"></span></div>
      <div class="stat"><span class="k" data-i18n="cos.k.rot"></span><span class="v" id="crot"></span><span class="f" data-i18n="cos.f.rot"></span></div>
      <div class="stat"><span class="k" data-i18n="cos.k.sol"></span><span class="v" id="csol"></span><span class="f" data-i18n="cos.f.sol"></span></div>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mfrac><msup><mi>T</mi><mn>2</mn></msup><msup><mi>a</mi><mn>3</mn></msup></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><msup><mi>π</mi><mn>2</mn></msup></mrow><mrow><mi>G</mi><mi>M</mi></mrow></mfrac><mo>,</mo><mspace width="1em"></mspace><msub><mi>E</mi><mi mathvariant="normal">m</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.k3"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="stats">
      <div class="stat"><span class="k" data-i18n="geo.k.T"></span><span class="v" id="gT"></span><span class="f" data-i18n="geo.f.T"></span></div>
      <div class="stat"><span class="k" data-i18n="geo.k.r"></span><span class="v" id="gr"></span><span class="f" id="gh"></span></div>
      <div class="stat"><span class="k" data-i18n="geo.k.v"></span><span class="v" id="gv"></span><span class="f" data-i18n="geo.f.v"></span></div>
    </div>
    <p data-i18n-html="s3.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="list keyed" id="sys"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>

<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/champ-newtonien-coniques.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/cinematique.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/dynamique.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>
<script src="/racoon/lecons/travail.js"></script>
<script src="/racoon/lecons/algebre-vectorielle.js"></script>
<script src="/racoon/lecons/kepler.js"></script>
<script src="/racoon/lecons/potentiel.js"></script>
<script src="/racoon/lecons/forces-centrales.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
const sci = (x, n) => Math.abs(x) >= 1e-2 && Math.abs(x) < 1e4 ? F.num(x, n) : F.sci(x, n);
const DEG = Math.PI / 180, JOUR = 86400, GM = Constantes.GM_E, R = Constantes.R_E_mean;
const km = r => F.qty(F.num(r / 1e3, 4), "km"), kms = v => F.qty(F.num(v / 1e3, 3), "km·s⁻¹");
const TYPES = ["cercle", "ellipse", "parabole", "hyperbole"];
keyed($("types"), t("types.tag"), TYPES, textOf("types.items", TYPES));

/* ---------- le canon de Newton : tir horizontal à l'altitude h ---------- */
(() => {
  const P = Plot.el, W = 640, HT = 380, cx = 430, cy = HT / 2, k = 45 / R;   // 45 px per Earth radius
  const NAMES = textOf("can.types", ["ellipse", "parabole", "hyperbole"]);
  const inside = p => p[0] > -10 && p[0] < W + 10 && p[1] > -10 && p[1] < HT + 10;
  function upd() {
    const h = +$("h").value * 1e3, v0 = +$("v").value * 1e3, o = FC.canon(h, v0), c = FC.cosmiques(R + h);
    $("hv").textContent = km(h); $("vv").textContent = kms(v0);
    const svg = $("canon"); svg.innerHTML = "";
    P("circle", { cx, cy, r: k * R, class: "fill c-label-2", opacity: "0.25" }, svg);
    let d = "", pen = false;                                           // the flown path, cut at the frame
    FC.vol(o, 720).forEach(q => { const p = [cx + k * q[0], cy - k * q[1]];
      if (inside(p)) { d += (pen ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); pen = true; } else pen = false; });
    P("path", { d, class: "stroke c-tint" }, svg);
    P("circle", { cx: cx + k * (R + h), cy, r: 5, class: "fill c-warn" }, svg);
    P("path", { d: `M${cx + k * (R + h)} ${cy}L${cx + k * (R + h)} ${cy - 30}`, class: "stroke thin c-warn" }, svg);
    $("vtype").textContent = o.type === "ellipse" && o.e < 1e-3 ? t("can.cercle") : NAMES[o.type];
    $("ftype").textContent = t(o.touche ? "can.f.touche" : "can.f.e." + (o.E < 0 ? "neg" : "pos"), { e: F.qty(F.sci(o.E, 3), "J·kg⁻¹") });
    $("ve").textContent = F.num(o.e, 3);
    $("fe").textContent = t("can.f.c", { c: F.qty(F.sci(o.C, 3), "m²·s⁻¹") });
    $("va").textContent = o.type === "ellipse" ? km(o.a) : t("can.infini");
    $("fa").textContent = o.type === "ellipse" ? t("can.f.T", { T: F.qty(F.num(o.T / 60, 3), "min") }) : "";
    $("vv12").textContent = t("can.v12", { a: kms(c.v1), b: kms(c.v2) });
  }
  $("h").oninput = $("v").oninput = upd; upd();
})();

/* ---------- vitesses cosmiques ---------- */
(() => {
  const c = FC.cosmiques();
  $("cv1").textContent = kms(c.v1); $("cv2").textContent = kms(c.v2);
  $("crot").textContent = F.qty(F.num(Constantes.Omega_E * Constantes.R_E_eq, 3), "m·s⁻¹");
  $("csol").textContent = kms(Math.sqrt(2 * Constantes.GM_sun / Constantes.au));
})();

/* ---------- orbite géostationnaire ---------- */
(() => {
  const g = FC.geostationnaire();
  $("gT").textContent = F.qty(F.num(g.T, 6), "s");
  $("gr").textContent = km(g.r);
  $("gh").textContent = t("geo.f.h", { h: km(g.h) });
  $("gv").textContent = kms(g.v);
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["deuxcorps", "forme", "trainee", "lune", "relativite"], items = textOf("sys.items", IDS);
  const J = FC.precessionJ2(Constantes.R_E_eq + 400e3, 0, 51.6 * DEG), g = FC.geostationnaire(), q = Kepler.LUNE.masse;
  const v = { lune: F.sci(q, 2), sat: F.sci(1000 * Constantes.G / GM, 1), j2: F.sci(J.relatif, 1), noeud: F.num(J.noeud * JOUR / DEG, 2),
    drag: F.sci(100 / (Constantes.R_E_eq + 400e3), 1), maree: F.sci(2 * q * (g.r / Kepler.LUNE.a) ** 3, 1),
    merc: F.num(FC.relativite("mercure").parSiecle, 3), terre: F.num(FC.relativite("terre").parSiecle, 2) };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["principia", 1687, "idea"], ["clarke", 1945, "idea"], ["spoutnik", 1957, "experiment"], ["luna", 1959, "experiment"], ["syncom", 1964, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["geo", "missions"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signe", "a"], ["liberation", "a"], ["horizontal", "a"], ["k3", "a"], ["geo", "a"], ["est", "a"], ["e", "a"], ["drag", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 184 });
})();
</script>
