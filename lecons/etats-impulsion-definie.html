<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, NM = 1e-9, HB = Q.hbar;

/* ---------- one packet or two: |ψ(x)|² and |φ(p)|², the transform done by hand against the closed form ---------- */
(() => {
  const sx = $("enx"), sp = $("enp"), ssig = $("ssig"), sd = $("sd");
  function draw() {
    const s = +ssig.value * NM, d = +sd.value * s, o = { sigma: s, d }, P0 = HB / (0.1 * NM);   // p unit: ħ/(0,1 nm)
    sx.innerHTML = ""; sp.innerHTML = "";
    const ax = Plot.axes(sx, { fmt: F, w: 640, h: 220, pad: { b: 40, l: 56 },
      x: { domain: [-2.5, 2.5], label: t("fig.x"), fmt: v => F.num(v, 2) }, y: { domain: [0, 8], label: t("fig.y.x") } });
    const cx = [];
    for (let i = 0; i <= 400; i++) { const x = -2.5 + 5 * i / 400; cx.push([ax.x(x), ax.y(Math.min(8, Q.deuxPaquets(x * NM, o).P / 1e9))]); }
    Plot.el("path", { d: Plot.path(cx), class: "stroke bold c-tint" }, ax.g);
    const dens = u => Q.ampImpulsionDeuxPaquets(u * P0, o).P * P0, us = [];
    for (let i = 0; i <= 320; i++) us.push(-4 + 8 * i / 320);
    const top = 1.15 * Math.max(...us.map(dens));
    const ap = Plot.axes(sp, { fmt: F, w: 640, h: 220, pad: { b: 40, l: 56 },
      x: { domain: [-4, 4], label: t("fig.p"), fmt: v => F.num(v, 2) }, y: { domain: [0, top], label: t("fig.y.p") } });
    const cp = us.map(u => [ap.x(u), ap.y(dens(u))]);
    Plot.el("path", { d: Plot.path(cp), class: "stroke bold c-tint" }, ap.g);
    /* (16.24) by Simpson, on 41 points: the dots must sit on the curve */
    let pire = 0;
    for (let i = 0; i <= 40; i++) { const u = -4 + 8 * i / 40, p = u * P0;
      const z = Q.transformeeImpulsion(x => Q.deuxPaquets(x, o), p, -(d / 2 + 8 * s), d / 2 + 8 * s, 1200), v = (z.re * z.re + z.im * z.im) / (2 * Math.PI * HB) * P0;
      pire = Math.max(pire, Math.abs(v - Q.ampImpulsionDeuxPaquets(p, o).P * P0));
      if (v <= top) Plot.el("circle", { cx: ap.x(u), cy: ap.y(v), r: 3, class: "fill c-warn" }, ap.g); }
    const r = Q.ecartsDeuxPaquets(o);
    $("ssigr").textContent = F.qty(F.fix(+ssig.value, 3), "nm");
    $("sdr").textContent = t("fig.v.d", { v: F.fix(+sd.value, 1) });
    $("vdx").textContent = F.si(r.dx, "m");
    $("fdx").textContent = t("fig.f.dx", { v: F.num(r.dx / s, 3) });
    $("vdp").textContent = F.qty(F.sci(r.dp, 3), "kg·m·s⁻¹");
    $("fdp").textContent = t("fig.f.dp", { v: F.num(r.dp / (HB / (2 * s)), 3) });
    $("vpr").textContent = F.num(r.produit, 3);
    $("fpr").textContent = t("fig.f.produit", { v: F.sci(pire, 1) });
  }
  ssig.oninput = sd.oninput = draw; draw();
})();

/* ---------- the system described: an electron in an atom, a grain of dust ---------- */
(() => {
  const dv = (m, s) => HB / (2 * s * m);
  const ve = dv(Q.m_e, 0.05 * NM), vg = dv(1e-9, 1e-6);
  $("sys1").innerHTML = t("sys1.body", { s: F.qty(F.fix(0.05, 2), "nm"), dp: F.qty(F.sci(HB / (2 * 0.05 * NM), 3), "kg·m·s⁻¹"), dv: F.qty(F.sci(ve, 3), "m·s⁻¹"), b: F.sci((ve / Constantes.c) ** 2, 2) });
  $("sys2").innerHTML = t("sys2.body", { dv: F.qty(F.sci(vg, 2), "m·s⁻¹"), an: F.sci(vg * 3.156e7, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["heisenberg", 1927, "idea"], ["kennard", 1927, "idea"], ["weyl", 1928, "idea"], ["robertson", 1929, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["laser"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["amplitude", "c"], ["onde", "a"], ["largeur", "d"], ["produit", "b"], ["deux", "c"], ["franges", "a"], ["poussiere", "d"], ["norme", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1603 });
})();
</script>
