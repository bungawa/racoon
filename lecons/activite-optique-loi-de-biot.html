<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, $ = id => document.getElementById(id), P = Plot.el;
const deg = x => F.fix(x, 2).replace(/^-/, Fmt.MINUS) + "°";
const DM = O.DEG_DM_G_ML;                                          // valeurs tabulées en °·dm⁻¹·g⁻¹·mL → °·m²·kg⁻¹
const SPEC = { saccharose: 66.5 * DM, glucose: 52.7 * DM, fructose: -92 * DM, carvoneS: 61 * DM };

/* ---------- polarimètre : mélange des deux carvones ---------- */
(() => {
  const svg = $("cadran"), xs = $("xs"), lg = $("lg"), conc = $("conc");
  for (let k = 0; k < 36; k++) { const a = k * Math.PI / 18, r1 = k % 9 ? 66 : 60;
    P("line", { x1: r1 * Math.sin(a), y1: -r1 * Math.cos(a), x2: 70 * Math.sin(a), y2: -70 * Math.cos(a), class: "stroke thin c-label-2" }, svg); }
  P("circle", { cx: 0, cy: 0, r: 70, class: "stroke thin c-label-2" }, svg);
  P("line", { x1: 0, y1: 58, x2: 0, y2: -58, class: "stroke dash c-label-2" }, svg);
  const analyseur = P("line", { x1: 0, y1: 58, x2: 0, y2: -58, class: "stroke bold c-tint" }, svg);
  const arc = P("path", { class: "stroke c-tint" }, svg);
  function maj() {
    const x = +xs.value / 100, l = +lg.value / 10, c = +conc.value, a = O.biot(SPEC.carvoneS, l, c * x) + O.biot(-SPEC.carvoneS, l, c * (1 - x));
    analyseur.setAttribute("transform", `rotate(${a.toFixed(2)})`);
    const r = 40, aa = a * Math.PI / 180;
    arc.setAttribute("d", `M 0 ${-r} A ${r} ${r} 0 ${Math.abs(a) > 180 ? 1 : 0} ${a > 0 ? 1 : 0} ${(r * Math.sin(aa)).toFixed(2)} ${(-r * Math.cos(aa)).toFixed(2)}`);
    $("xsread").textContent = F.qty(F.fix(100 * x, 0), "%");
    $("lread").textContent = F.qty(F.fix(+lg.value, 1), "dm");
    $("cread").textContent = F.qty(F.fix(c, 0), "kg·m⁻³");
    $("alpha").textContent = deg(a);
    $("alphaf").textContent = t(Math.abs(a) < 0.005 ? "pol.nul" : a > 0 ? "pol.dextro" : "pol.levo");
    $("ee").textContent = F.qty(F.fix(100 * Math.abs(2 * x - 1), 0), "%");
    $("eef").textContent = t(Math.abs(2 * x - 1) < 0.005 ? "pol.racemique" : x > 0.5 ? "pol.excesS" : "pol.excesR");
  }
  xs.oninput = lg.oninput = conc.oninput = maj; maj();
})();

/* ---------- inversion du saccharose ---------- */
(() => {
  const l = 0.2, c0 = 100, Ms = O.masseMolaire({ C: 12, H: 22, O: 11 }), Mg = O.masseMolaire({ C: 6, H: 12, O: 6 });
  const alpha = tau => { const cg = c0 * tau * Mg / Ms;
    return O.pouvoirMelange([{ alpha: SPEC.saccharose, c: c0 * (1 - tau) }, { alpha: SPEC.glucose, c: cg }, { alpha: SPEC.fructose, c: cg }], l); };
  const { x, y, g } = Plot.axes($("inversion"), { fmt: F, w: 560, h: 260, pad: { b: 44 }, x: { domain: [0, 1], label: t("inv.x") }, y: { domain: [-6, 15], label: t("inv.y") } });
  P("line", { x1: x(0), x2: x(1), y1: y(0), y2: y(0), class: "zero" }, g);
  P("path", { d: `M ${x(0)} ${y(alpha(0))} L ${x(1)} ${y(alpha(1))}`, class: "curve" }, g);
  const a0 = alpha(0), a1 = alpha(1), t0 = a0 / (a0 - a1);
  P("line", { x1: x(t0), x2: x(t0), y1: y(-6), y2: y(15), class: "ref" }, g);
  const dot = P("circle", { r: 6, class: "dot" }, g), note = P("text", { x: x(0.55), y: y(12), class: "note" }, g);
  const tau = $("tau");
  function maj() {
    const u = +tau.value / 100, a = alpha(u);
    dot.setAttribute("cx", x(u)); dot.setAttribute("cy", y(a));
    $("tauread").textContent = F.qty(F.fix(100 * u, 0), "%");
    note.textContent = t("inv.note", { a: deg(a) });
  }
  tau.oninput = maj; maj();
})();

/* ---------- méthodes de séparation ---------- */
(() => {
  const IDS = ["tri", "sels", "chromato", "synthese"], txt = textOf("sep.items", IDS);
  $("methodes").innerHTML = IDS.map(id => `<div><span class="k">${txt[id].k}</span><span><strong>${txt[id].name}.</strong> ${txt[id].text}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["arago", 1811, "experiment"], ["biot", 1815, "experiment"], ["pasteur", 1848, "experiment"], ["wilhelmy", 1850, "experiment"], ["nobel", 2001, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["etalon", "carvone"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["biot", "c"], ["double", "a"], ["racem", "d"], ["signe", "b"], ["ee", "c"], ["diast", "a"], ["inversion", "d"], ["valid", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
