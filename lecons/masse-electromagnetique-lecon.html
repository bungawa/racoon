<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux, K = Constantes, EL = OM.electronClassique();

/* ---------- le système décrit : l'électron tout électromagnétique, chiffré ---------- */
(() => {
  $("sys1").innerHTML = t("sys1.body", { r0: F.si(EL.r0, "m", { prefix: "f", sig: 4 }), a: F.si(EL.aMasse.coquille, "m", { prefix: "f", sig: 3 }),
    b: F.si(EL.aMasse.boule, "m", { prefix: "f", sig: 3 }), d: F.sci(EL.r0 / (2 * K.a0), 1) });
  $("sys2").innerHTML = t("sys2.body", { lc: F.si(EL.lambdaC, "m", { prefix: "f", sig: 3 }), x: F.num(EL.lambdaC / EL.aMasse.coquille, 3) });
})();

/* ---------- masse transverse : Lorentz (sphère qui se contracte) contre Abraham (sphère rigide) ---------- */
(() => {
  const svg = $("trace"), sb = $("sb"), q = K.e, a = EL.r0;
  const pts = [0.2, 0.4, 0.6, 0.8, 0.9].map(b => { const r = OM.impulsionChamp({ q, a, v: b * K.c, n: 80 }); return [b, r.p / (r.mElec * b * K.c)]; });
  function draw() {
    const beta = +sb.value / 100;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 }, x: { domain: [0, 1], label: t("fig.xaxis") }, y: { domain: [1, 3], label: t("fig.yaxis") } });
    const xs = Array.from({ length: 301 }, (_, i) => 0.95 * i / 300);
    const courbe = m => Plot.path(xs.map(b => [P.x(b), P.y(Math.min(3, OM.masseTransverse(b, m)))]));
    Plot.el("path", { d: courbe("abraham"), class: "ref" }, P.g);
    Plot.el("path", { d: courbe("lorentz"), class: "curve" }, P.g);
    for (const [b, r] of pts) Plot.el("circle", { cx: P.x(b), cy: P.y(r), r: 4, class: "stroke c-label-2" }, P.g);
    Plot.el("line", { x1: P.x(beta), x2: P.x(beta), y1: P.y(1), y2: P.y(3), class: "zero" }, P.g);
    Plot.el("circle", { cx: P.x(beta), cy: P.y(OM.masseTransverse(beta, "lorentz")), r: 5, class: "dot" }, P.g);
    const gL = OM.masseTransverse(beta, "lorentz"), gA = OM.masseTransverse(beta, "abraham");
    $("sbr").textContent = F.num(beta, 2);
    $("vl").textContent = F.num(gL, 4); $("fl").textContent = t("fig.f.lorentz");
    $("va").textContent = F.num(gA, 4); $("fa").textContent = t("fig.f.abraham", { e: F.qty(F.num(100 * (gL - gA) / gL, 2), "%") });
    $("vU").textContent = F.num(gL * (1 + beta * beta / 3), 4); $("fU").textContent = t("fig.f.U", { g: F.num(gL, 4) });
  }
  sb.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kaufmann", 1901, "experiment"], ["abraham", 1902, "idea"], ["lorentz", 1904, "idea"], ["bucherer", 1908, "experiment"], ["fermi", 1922, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["reseau"], uses = textOf("uses.items", USES);
  const d = (K.m_n - K.m_p) * K.c ** 2 / K.e;
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace("{d}", F.si(d, "eV", { prefix: "M", sig: 4 }))}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["mesure", "c"], ["taille", "a"], ["r0", "d"], ["vitesse", "b"], ["kaufmann", "c"], ["quatre", "a"], ["energie", "d"], ["stabilite", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 283 });
})();
</script>
