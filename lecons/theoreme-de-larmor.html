<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes;

/* ---------- une orbite liée dans un champ : vue du laboratoire, vue du repère de Larmor ---------- */
(() => {
  const svg = $("orbites"), sw = $("sw"), sn = $("sn"), S = 92, C1 = [160, 180], C2 = [480, 180];
  let force = "coulomb";
  const px = (c, p) => [c[0] + S * p[0], c[1] - S * p[1]];
  function draw() {
    const wL = Math.pow(10, +sw.value), tours = +sn.value;
    const r = M.orbiteLarmor({ force, wL, tours, pas: 400, every: 2 }), k = r.courbe;
    svg.innerHTML = "";
    const titre = (c, cle) => { const e = Plot.el("text", { x: c[0], y: 24, "text-anchor": "middle" }, svg); e.textContent = t(cle); };
    titre(C1, "fig.lab"); titre(C2, "fig.tournant");
    for (const c of [C1, C2]) { Plot.el("circle", { cx: c[0], cy: c[1], r: 3.5, class: "fill" }, svg); }
    const ligne = (c, pts, cls) => Plot.el("path", { d: Plot.path(pts.map(p => px(c, p))), class: cls }, svg);
    ligne(C1, k.ref, "stroke thin dash c-label-2"); ligne(C1, k.lab, "stroke c-tint");
    ligne(C2, k.ref, "stroke thin dash c-label-2"); ligne(C2, k.tournant, "stroke bold c-tint");
    $("swr").textContent = F.sci(wL, 2);
    $("snr").textContent = t("fig.n", { n: tours });
    $("vl").textContent = F.num(r.ecartLab, 3);
    $("fl").innerHTML = t("fig.f.lab", { p: F.num(r.ecartLab / (wL * tours * 2 * Math.PI), 2) });
    $("vt").textContent = F.sci(r.ecart, 2);
    $("ft").textContent = t("fig.f.tour");
    $("vo").textContent = F.num(r.ecart / (wL * wL), 3);
    $("fo").textContent = t("fig.f.ordre");
  }
  document.querySelectorAll("#forces button").forEach(bt => bt.onclick = () => {
    force = bt.dataset.f; document.querySelectorAll("#forces button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  sw.oninput = sn.oninput = draw; draw();
})();

/* ---------- le système décrit : une raie visible dans un champ de 1 T ---------- */
(() => {
  const lam = 600e-9, f0 = Cst.c / lam, B = 1, z = M.zeemanNormal(f0, B), dlam = lam * lam * z.fL / Cst.c;
  const w0 = Cst.hbar / (Cst.m_e * Cst.a0 ** 2), wL = Cst.e * 10 / (2 * Cst.m_e);
  $("sys1").innerHTML = t("sys1.body", { f0: F.si(f0, "Hz", { sig: 3 }), fL: F.si(z.fL, "Hz", { sig: 3 }), r: F.sci(z.rapport, 2),
    dl: F.si(dlam, "m", { prefix: "p", sig: 2 }), r2: F.sci(z.rapport ** 2, 1), orb: F.sci(wL / w0, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["zeeman", 1896, "experiment"], ["preston", 1897, "experiment"], ["hale", 1908, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["soleil"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["repere", "c"], ["choix", "a"], ["faible", "d"], ["sens", "b"], ["triplet", "a"], ["spin", "c"], ["diamag", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 345 });
})();
</script>
