<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, m = Constantes.m_e, W = 1e15, N = 600, L = 4e-9, dx = L / N, X0 = -L / 2, NP = 60, K = 80, DT = 2e-18;
const B = m * W * W / (4 * 2.5e-19);                       // quartic well, same force as the harmonic one at 0,5 nm
const POT = { harm: { dV: x => m * W * W * x, V: x => 0.5 * m * W * W * x * x }, quart: { dV: x => 4 * B * x ** 3, V: x => B * x ** 4 } };
$("sys1").innerHTML = t("sys.body", { T: F.si(2 * Math.PI / W, "s"), E: F.qty(F.num(Constantes.hbar * W / Constantes.e, 3), "eV"), v: F.si(W * 5e-10, "m·s⁻¹") });
(() => {
  const svg = $("ehr"), sx = $("sx"), ss = $("ss"), TT = (NP - 1) * K * DT;
  let mode = "harm", timer = 0;
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [0, TT * 1e15], label: t("fig.x") }, y: { domain: [-1, 1], label: t("fig.y") } });
  const band = Plot.el("path", { class: "area c-label-2", "fill-opacity": 0.2 }, g), pc = Plot.el("path", { class: "stroke thin dash c-warn" }, g), pq = Plot.el("path", { class: "stroke c-tint" }, g);
  function calc() {
    const P = POT[mode], a = +sx.value * 1e-10, s = +ss.value * 1e-11, psi = [], V = [];
    for (let i = 0; i < N; i++) { const xx = X0 + i * dx, z = Q.paquetGaussien(xx, { sigma: s, x0: a }); psi.push({ re: z.re, im: z.im }); V.push(P.V(xx)); }
    const o = { m, dx, dt: DT, x0: X0, dV: P.dV, V }, ev = Q.evolutionMoyennes(psi, o, NP, K), cl = Q.trajectoireClassique(a, 0, o, NP, K);
    const nm = v => y(Math.max(-1, Math.min(1, v * 1e9)));
    pq.setAttribute("d", Plot.path(ev.map(e => [x(e.t * 1e15), nm(e.x)])));
    pc.setAttribute("d", Plot.path(cl.map(e => [x(e.t * 1e15), nm(e.x)])));
    band.setAttribute("d", Plot.path(ev.map(e => [x(e.t * 1e15), nm(e.x + e.ecart)]).concat(ev.slice().reverse().map(e => [x(e.t * 1e15), nm(e.x - e.ecart)]))) + "Z");
    let worst = 0, iw = 0; ev.forEach((e, i) => { const d = Math.abs(e.F - e.Fx) / (Math.abs(e.Fx) + Math.abs(e.F) + 1e-30); if (d > worst) { worst = d; iw = i; } });
    const e = ev[iw], dev = Math.max(...ev.map((q, i) => Math.abs(q.x - cl[i].x)));
    $("sxr").textContent = F.si(a, "m"); $("ssr").textContent = F.si(s, "m");
    $("vf").textContent = F.si(e.F, "N") + " ; " + F.si(e.Fx, "N");
    $("ff").textContent = t("fig.f.f", { t: F.si(e.t, "s") });
    $("ve").textContent = F.si(dev, "m");
    $("fe").textContent = mode === "harm" ? t("fig.f.e.harm") : t("fig.f.e.quart");
    $("vd").textContent = F.si(ev[ev.length - 1].ecart, "m");
    $("fd").textContent = t("fig.f.d", { s: F.si(s, "m") });
    $("mode").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
  }
  const draw = () => { clearTimeout(timer); timer = setTimeout(calc, 30); };
  $("mode").querySelectorAll("button").forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
  sx.oninput = ss.oninput = draw; calc();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bhj", 1926, "idea"], ["schrodinger", 1926, "idea"], ["ehrenfest", 1927, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ions"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["commute", "b"], ["vitesse", "c"], ["force", "a"], ["harmonique", "d"], ["quartique", "b"], ["atome", "c"], ["explicite", "b"], ["energie", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 207 });
})();
</script>
