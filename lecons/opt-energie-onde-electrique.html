<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd;

/* ---------- une feuille d'atomes : le bilan de Feynman au premier ordre, et le bilan exact ---------- */
(() => {
  const W0 = 2 * Math.PI * O.c / 589e-9, G = 1e8, E0 = 1;                      // the line of « L’absorption »; fractions do not depend on E0
  const svg = $("parts"), se = $("seta"), sx = $("sx"), sa = $("sa");
  const pc = v => F.num(100 * v, 3) + " %";
  const small = v => (Math.abs(v) >= 1e-3 ? F.num(v, 3) : F.sci(v, 2));
  function draw() {
    const eta = 10 ** +se.value, x = +sx.value, a = +sa.value, w = W0 + x * G;
    const f = eta => O.feuille({ eta, w0: W0, gamma: G, omega: w, E0, alpha: a });
    const ici = f(eta), I0 = ici.exacte.entree;
    /* the three parts, as fractions of the incident intensity, over six decades of η */
    svg.innerHTML = "";
    const es = Array.from({ length: 121 }, (_, i) => 10 ** (9 + i * 0.05)), rs = es.map(f);
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 56, b: 44 }, x: { scale: "log", domain: [1e9, 1e15], label: t("fig.xaxis") }, y: { scale: "log", domain: [1e-10, 10], label: t("fig.yaxis"), fmt: v => { const e = Math.round(Math.log10(v)); return e % 2 ? "" : "10" + F.sup(e); } } });
    const clip = v => Math.min(10, Math.max(1e-10, v));
    const line = (get, cls) => Plot.el("path", { d: Plot.path(es.map((e, i) => [P.x(e), P.y(clip(get(rs[i]) / I0))])), class: cls }, P.g);
    line(r => r.exacte.absorbee, "curve");
    line(r => r.ordre1.travail, "ref");
    line(r => r.exacte.reflechie, "stroke thin dash c-label-2");
    Plot.el("line", { x1: P.x(eta), x2: P.x(eta), y1: P.y(1e-10), y2: P.y(10), class: "zero" }, P.g);
    Plot.el("circle", { cx: P.x(eta), cy: P.y(clip(ici.exacte.absorbee / I0)), r: 5, class: "dot" }, P.g);
    $("setar").textContent = F.qty(F.sci(eta, 2), "m⁻²");
    $("sxr").textContent = F.num(x, 3) + " γ";
    $("sar").textContent = F.num(a, 3) + " ε₀c";
    const o = ici.ordre1, e = ici.exacte;
    const r = o.bilan / o.travail;                                              // = 1 − α/(ε0c): rounding leaves ~10⁻¹⁶ at α = ε0c
    $("vbilan").textContent = small(Math.abs(r) < 1e-12 ? 0 : r);
    $("fbilan").textContent = t(Math.abs(a - 1) < 1e-9 ? "fig.f.bilan0" : "fig.f.bilan");
    $("veps").textContent = small(o.epsilon);
    $("feps").textContent = t("fig.f.eps", { r: small(Math.abs(e.absorbee - o.travail) / o.travail) });
    $("vexact").textContent = pc(e.absorbee / I0);
    $("fexact").textContent = t("fig.f.exact", { t: pc(e.transmise / I0), r: small(e.reflechie / I0), s: F.num((e.transmise + e.reflechie + e.absorbee) / I0, 12) });
  }
  se.oninput = sx.oninput = sa.oninput = draw; draw();
})();

/* ---------- le système décrit : le Soleil, un pointeur laser, et l'épaisseur d'une « lame mince » ---------- */
(() => {
  const sol = O.champIntensite(1361), las = O.champIntensite(1e-3 / 1e-6);
  const dAir = 500e-9 / (2 * Math.PI * 2.9e-4), dVerre = 500e-9 / (2 * Math.PI * 0.5);
  $("sys1").innerHTML = t("sys1.body", { E: F.si(sol.E0, "V·m⁻¹"), Ee: F.si(sol.efficace, "V·m⁻¹"), El: F.si(las.E0, "V·m⁻¹"),
    da: F.si(dAir, "m", { prefix: "m" }), dv: F.si(dVerre, "m", { prefix: "n" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["umov", 1874, "idea"], ["poynting", 1884, "idea"], ["lebedev", 1900, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pv", "tsi"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["double", "b"], ["croise", "a"], ["reflet", "d"], ["soleil", "a"], ["moyenne", "c"], ["alpha", "b"], ["epaisse", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 315 });
})();
</script>
