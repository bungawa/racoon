<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, c = Constantes.c, A = 22.86e-3, B = 10.16e-3;          // the guide of the page: 22,86 mm × 10,16 mm, copper

/* ---------- le système décrit : le guide à 10 GHz ---------- */
(() => {
  const f = 10e9, g = M.guideRect(A, B, f), sigma = 5.8e7, delta = Math.sqrt(2 / (Constantes.mu0 * sigma * 2 * Math.PI * f));
  const modes = M.modesRect(A, B, 20e9);
  $("sys1").innerHTML = t("sys1.body", { a: F.si(A, "m", { prefix: "m" }), b: F.si(B, "m", { prefix: "m" }), f: F.si(f, "Hz"),
    l0: F.si(g.lambda0, "m", { prefix: "m" }), r: F.num(g.lambda0 / (2 * A), 3), delta: F.si(delta, "m", { prefix: "µ" }),
    fc: F.si(g.fc, "Hz", { sig: 4 }), f2: F.si(modes[1].fc, "Hz") });
})();

/* ---------- le champ vu de dessus ---------- */
(() => {
  const svg = $("carte"), sf = $("sf"), st = $("st"), play = $("play"), Lz = 0.12, S = 600 / Lz, X0 = 20, Y0 = 28;
  const Z = z => X0 + z * S, Y = x => Y0 + (A - x) * S;                         // z to the right, x upward from the lower wall
  let timer = null;
  function draw() {
    const f = +sf.value * 1e9, g = M.guideRect(A, B, f), tt = +st.value / f;
    svg.innerHTML = "";
    [0, A].forEach(x => Plot.el("line", { x1: Z(0), x2: Z(Lz), y1: Y(x), y2: Y(x), class: "stroke bold c-label-2" }, svg));
    for (let i = 0; i < 40; i++) for (let j = 0; j < 7; j++) {
      const z = (i + 0.5) * Lz / 40, x = (j + 0.5) * A / 7, e = g.champ(x, z, tt).Ey;
      if (Math.abs(e) > 0.03) Plot.el("circle", { cx: Z(z), cy: Y(x), r: (5.5 * Math.abs(e)).toFixed(2), class: "fill " + (e > 0 ? "c-tint" : "c-warn") }, svg);
    }
    for (let i = 0; i < 20; i++) for (let j = 0; j < 4; j++) {
      const z = (i + 0.25) * Lz / 20, x = (j + 0.5) * A / 4, F2 = g.champ(x, z, tt), k = 15 * c;
      Plot.fleche(svg, [Z(z), Y(x)], [Z(z) + k * F2.Bz, Y(x) - k * F2.Bx], { cls: "c-ok", tete: 5, min: 4 });
    }
    Plot.el("text", { x: Z(Lz), y: Y(A) - 10, "text-anchor": "end" }, svg).textContent = t("fig.z");
    Plot.el("text", { x: Z(0), y: Y(0) + 18 }, svg).textContent = t("fig.parois");
    $("sfr").textContent = F.si(f, "Hz", { sig: 3 });
    $("str").textContent = t("fig.tv", { v: F.num(+st.value, 2) });
    $("vl0").textContent = F.si(g.lambda0, "m", { prefix: "m" });
    $("fl0").textContent = t("fig.f.l0", { v: F.num(g.lambda0 / (2 * A), 3) });
    $("vlg").textContent = F.si(g.lambdaG, "m", { prefix: "m" });
    $("flg").textContent = t("fig.f.lg", { v: F.num(g.lambdaG / g.lambda0, 3) });
    $("vv").textContent = F.num(g.vPhase / c, 3) + " c";
    $("fv").textContent = t("fig.f.v", { v: F.si(g.fc, "Hz", { sig: 4 }) });
  }
  const stop = () => { clearInterval(timer); timer = null; play.textContent = t("fig.play"); };
  play.onclick = () => {
    if (timer) return stop();
    play.textContent = t("fig.pause");
    timer = setInterval(() => { st.value = ((+st.value + 0.01) % 1).toFixed(2); draw(); }, 50);
  };
  sf.oninput = st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rayleigh", 1897, "idea"], ["southworth", 1933, "experiment"], ["barrow", 1936, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["normalise"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tuyau", "b"], ["parois", "d"], ["lg", "a"], ["valeur", "c"], ["mode2", "b"], ["boucles", "a"], ["hauteur", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 242 });
})();
</script>
