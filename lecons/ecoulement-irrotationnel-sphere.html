<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
/* ---------- les lignes de courant et une sonde ---------- */
(() => {
  const svg = $("flux"), sa = $("sa"), sr = $("sr"), f = ES.ecoulementSphere(1, 1), S = 52, X = z => 320 + z * S, Y = x => 160 - x * S;
  function draw() {
    const al = +sa.value * Math.PI / 180, th = Math.PI - al, r = +sr.value, v = f.vitesse(r, th);
    svg.innerHTML = "";
    for (let k = 1; k <= 14; k++) { const l = f.ligne(0.2 * k, 6.1, 200);
      [1, -1].forEach(s => Plot.el("path", { d: Plot.path(l.map(([z, x]) => [X(z), Y(s * x)])), class: "stroke thin c-tint" }, svg)); }
    Plot.el("line", { x1: X(-6.1), x2: X(-1), y1: Y(0), y2: Y(0), class: "stroke thin c-tint" }, svg);
    Plot.el("line", { x1: X(1), x2: X(6.1), y1: Y(0), y2: Y(0), class: "stroke thin c-tint" }, svg);
    Plot.el("circle", { cx: X(0), cy: Y(0), r: S, class: "fill c-label", opacity: 0.25 }, svg);
    Plot.el("circle", { cx: X(0), cy: Y(0), r: S, class: "stroke c-label", fill: "none" }, svg);
    const z = r * Math.cos(th), x = r * Math.sin(th), vz = v.vr * Math.cos(th) - v.vt * Math.sin(th), vx = v.vr * Math.sin(th) + v.vt * Math.cos(th);
    Plot.el("circle", { cx: X(z), cy: Y(x), r: 4, class: "fill c-warn" }, svg);
    Plot.fleche(svg, [X(z), Y(x)], [X(z) + 40 * vz, Y(x) - 40 * vx], { cls: "c-warn" });
    $("ra").textContent = F.qty(F.num(+sa.value, 3), "°"); $("rr").textContent = F.num(r, 3);
    $("vv").textContent = F.num(v.v, 3);
    $("fv").textContent = t(v.v > 1.001 ? "f.v.plus" : v.v < 0.999 ? "f.v.moins" : "f.v.egal");
    $("vc").textContent = F.num(f.cp(r, th), 3);
    $("vd").textContent = F.sci(Math.pow(1 / r, 3), 2);
  }
  sa.oninput = sr.oninput = draw; draw();
})();

/* ---------- et une vraie bille dans un vrai fluide ? ---------- */
(() => {
  const FL = { eau: { nu: 1.0e-6, rho: 998, c: 1480 }, air: { nu: 1.5e-5, rho: 1.2, c: 343 } }, sD = $("sD"), sV = $("sV");
  let fl = "eau";
  function draw() {
    const D = Math.pow(10, +sD.value), V = Math.pow(10, +sV.value), o = FL[fl], Re = ES.reynolds(V, D, o.nu), reg = ES.regimeSphere(Re), ma2 = (V / o.c) ** 2;
    $("rD").textContent = F.si(D, "m", { sig: 2 }); $("rV").textContent = F.si(V, "m·s⁻¹", { sig: 2 });
    $("vRe").textContent = F.sci(Re, 2);
    $("fRe").textContent = t("reg." + reg);
    $("vMa").textContent = F.sci(ma2, 1);
    $("fMa").textContent = t(ma2 < 0.01 ? "f.Ma.ok" : ma2 < 0.1 ? "f.Ma.limite" : "f.Ma.non");
    $("vF").textContent = reg === "plateau" ? F.si(0.47 * 0.5 * o.rho * V * V * Math.PI * D * D / 4, "N", { sig: 2 }) : "−";
    $("fF").textContent = t(reg === "plateau" ? "f.F.plateau" : "f.F.autre");
  }
  document.querySelectorAll("#fluide button").forEach(bt => bt.onclick = () => {
    fl = bt.dataset.f; document.querySelectorAll("#fluide button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  sD.oninput = sV.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["alembert", 1752, "idea"], ["prandtl", 1904, "idea"], ["blasius", 1908, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["aile"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "b"], ["seche", "c"], ["paroi", "a"], ["equateur", "d"], ["pression", "b"], ["trainee", "a"], ["bille", "c"], ["kappa", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1205 });
})();
</script>
