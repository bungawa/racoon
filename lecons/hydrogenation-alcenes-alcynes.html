<body>
<main class="page">

    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-organique" data-i18n="monde.chim-organique"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-alcenes-alcynes" data-i18n="etape.chim-alcenes-alcynes"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>

      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="de" data-i18n="niv.de"></label></div><select id="de"></select></div>
          <div class="ctl"><div class="row"><label for="vers" data-i18n="niv.vers"></label></div><select id="vers"></select></div>

    <div class="eq"><math display="block"><msub><mi>Δ</mi><mi>r</mi></msub><msub><mi>H</mi><mn>1</mn></msub><mo>=</mo><msub><mi>Δ</mi><mi>r</mi></msub><msub><mi>H</mi><mtext data-i18n="eq.tot"></mtext></msub><mo>−</mo><msub><mi>Δ</mi><mi>r</mi></msub><msub><mi>H</mi><mn>2</mn></msub></math></div>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure>
      <div class="deux">
        <div><svg class="fig no-sigle" id="alcyne" role="img" data-i18n-attr="aria-label:lin.ariaA"></svg><p class="readout" id="alcynenom"></p></div>
        <div><svg class="fig no-sigle" id="alcene" role="img" data-i18n-attr="aria-label:lin.ariaB"></svg><p class="readout" id="alcenenom"></p></div>
      </div>
      <figcaption data-i18n-html="lin.caption"></figcaption>
    </figure>
    <div class="box def"><b data-i18n="s2.def.titre"></b>

      <p data-i18n-html="s2.warn.corps"></p>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure class="chart">
      <svg class="fig" id="courbes" role="img" data-i18n-attr="aria-label:sim.aria"></svg>
      <div class="legend"><span class="c-warn" data-i18n="sim.alcyne"></span><span class="c-tint" data-i18n="sim.alcene"></span><span class="c-label" data-i18n="sim.alcane"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="sel" data-i18n="sim.S"></label><output id="selv" for="sel"></output></div>
            <input id="sel" type="range" min="0" max="4" step="0.05" value="2"></div>
          <div class="ctl"><div class="row"><label for="h2" data-i18n="sim.h"></label><output id="h2v" for="h2"></output></div>
            <input id="h2" type="range" min="0" max="2" step="0.005" value="1"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="sim.k.alcyne"></span><span class="v" id="valcyne"></span></div>
          <div class="stat"><span class="k" data-i18n="sim.k.alcene"></span><span class="v" id="valcene"></span></div>
          <div class="stat"><span class="k" data-i18n="sim.k.alcane"></span><span class="v" id="valcane"></span></div>

        </div>
      </div>
      <figcaption data-i18n-html="sim.caption"></figcaption>
    </figure>
    <div class="eq"><math display="block"><mi>y</mi><mo>=</mo><mfrac><mi>S</mi><mrow><mi>S</mi><mo>−</mo><mn>1</mn></mrow></mfrac><mrow><mo>(</mo><msup><mi>x</mi><mrow><mn>1</mn><mo>/</mo><mi>S</mi></mrow></msup><mo>−</mo><mi>x</mi><mo>)</mo></mrow><mspace width="2em"/><msub><mi>y</mi><mtext data-i18n="eq.max"></mtext></msub><mo>=</mo><msup><mi>S</mi><mrow><mn>1</mn><mo>/</mo><mo>(</mo><mn>1</mn><mo>−</mo><mi>S</mi><mo>)</mo></mrow></msup></math></div>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>

<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>

<script src="/racoon/locales/fr/lecons/hydrogenation-alcenes-alcynes.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/chim-organique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, A = O.Alcenes, sym = s => t("chim.sym", { s }), $ = id => document.getElementById(id);
const kj = v => F.qty(F.num(v, 4), "kJ·mol⁻¹"), pct = v => F.qty(F.num(100 * v, 3), "%");
const peindre = (svg, m, o) => { const d = O.dessin(m, Object.assign({ texte: sym }, o)); svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };

/* ---------- niveaux d'enthalpie des C₄ : butane en bas ---------- */
(() => {
  const H = A.HYDROGENATION, IDS = ["butane", "but2eneE", "but2eneZ", "but1ene", "but2yne"], noms = textOf("niv.especes", IDS);
  const niveau = id => id === "butane" ? 0 : -H[id];                            // kJ·mol⁻¹ au-dessus du butane + n H₂
  const svg = $("niveaux"), de = $("de"), vers = $("vers");
  [de, vers].forEach(s => { s.innerHTML = IDS.map(id => `<option value="${id}">${noms[id]}</option>`).join(""); });
  de.value = "but2yne"; vers.value = "but2eneZ";
  function maj() {
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 64, b: 24 }, x: { domain: [0, 1], fmt: () => "", ticks: 1 }, y: { domain: [0, 300], label: t("niv.y") } });
    IDS.forEach((id, k) => {
      const y = o.y(niveau(id)), x0 = o.x(0.08 + 0.18 * k), x1 = x0 + o.x(0.14) - o.x(0);
      const actif = id === de.value || id === vers.value;
      Plot.el("line", { x1: x0, x2: x1, y1: y, y2: y, class: "stroke " + (actif ? "bold c-tint" : "c-label") }, o.g);
      Plot.el("text", { x: (x0 + x1) / 2, y: y - 6, "text-anchor": "middle", class: "tick" }, o.g).textContent = noms[id];
    });
    const a = niveau(de.value), b = niveau(vers.value), ka = IDS.indexOf(de.value), kb = IDS.indexOf(vers.value);
    if (ka !== kb) Plot.fleche(o.g, [o.x(0.15 + 0.18 * ka), o.y(a)], [o.x(0.15 + 0.18 * kb), o.y(b)], { cls: "c-warn" });
    $("nivtexte").innerHTML = ka === kb ? t("niv.meme") : t(b < a ? "niv.dh" : "niv.dhInverse", { de: noms[de.value], vers: noms[vers.value], dh: kj(b - a) });
  }
  de.onchange = maj; vers.onchange = maj; maj();
})();

/* ---------- Lindlar : but-2-yne → (Z)-but-2-ène ---------- */
(() => {
  const yne = A.molecule("but2yne"), ene = A.molecule("but2eneZ"), [a, b] = O.doublesStereogenes(ene)[0];
  peindre($("alcyne"), yne, { echelle: 40 }); peindre($("alcene"), ene, { echelle: 40 });
  $("alcynenom").textContent = t("lin.nomA");
  $("alcenenom").textContent = t("lin.nomB", { d: O.descripteurZE(ene, a, b) });
})();

/* ---------- s'arrêter à l'alcène : sélectivité S et équivalents de H₂ ---------- */
(() => {
  const svg = $("courbes"), sS = $("sel"), sh = $("h2");
  function maj() {
    const S = Math.pow(10, +sS.value), h = +sh.value, c = A.courbeSemi(S, 400), e = A.etatH(S, h), ym = A.alceneMax(S);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 }, x: { domain: [0, 2], label: t("sim.x") }, y: { domain: [0, 1], label: t("sim.y") } });
    [["x", "c-warn"], ["y", "bold c-tint"], ["z", "c-label"]].forEach(([k, cls]) =>
      Plot.el("path", { d: Plot.path(c.map(p => [o.x(p.h), o.y(p[k])])), class: "stroke " + cls }, o.g));
    Plot.el("line", { x1: o.x(h), x2: o.x(h), y1: o.y(0), y2: o.y(1), class: "stroke thin dash c-label" }, o.g);
    const best = A.semi(S, Math.abs(S - 1) < 1e-9 ? Math.exp(-1) : Math.pow(S, S / (1 - S)));      // dy/dx = 0
    $("selv").textContent = S < 1e3 ? F.num(S, 3) : F.sci(S, 2);
    $("h2v").textContent = F.num(h, 3);
    $("valcyne").textContent = pct(e.x); $("valcene").textContent = pct(e.y); $("valcane").textContent = pct(e.z);
    $("vmax").textContent = pct(ym); $("fmax").textContent = t("sim.f.max", { h: F.num(best.h, 4) });
  }
  sS.oninput = maj; sh.oninput = maj; maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["sabatier", 1897, "experiment"], ["nobel", 1912, "idea"], ["kistiakowsky", 1935, "experiment"], ["lindlar", 1952, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["vinyle", "vitamine"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["stable", "c"], ["hess", "a"], ["syn", "d"], ["poison", "b"], ["thermo", "c"], ["arret", "a"], ["max", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
