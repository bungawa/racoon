    <p class="validite" data-i18n-html="val.reaction"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys"></p>
    </div>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><msub><mi>r</mi><mi mathvariant="normal">L</mi></msub><mo>=</mo><mfrac><mrow><mi>m</mi><msub><mi>v</mi><mo>⊥</mo></msub></mrow><mrow><mo stretchy="false">|</mo><mi>q</mi><mo stretchy="false">|</mo><mi>B</mi></mrow></mfrac><mo>,</mo><mspace width="1em"/><msub><mi>v</mi><mo>⊥</mo></msub><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><msub><mi>k</mi><mi mathvariant="normal">B</mi></msub><mi>T</mi></mrow><mi>m</mi></mfrac></msqrt></math></div>
    <p class="validite" data-i18n-html="val.larmor"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><mi>β</mi><mo>=</mo><mfrac><mrow><mi>n</mi><msub><mi>k</mi><mi mathvariant="normal">B</mi></msub><mo>(</mo><msub><mi>T</mi><mi mathvariant="normal">e</mi></msub><mo>+</mo><msub><mi>T</mi><mi mathvariant="normal">i</mi></msub><mo>)</mo></mrow><mrow><msup><mi>B</mi><mn>2</mn></msup><mo>/</mo><mn>2</mn><msub><mi>μ</mi><mn>0</mn></msub></mrow></mfrac></math></div>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi>μ</mi><mo>=</mo><mfrac><mrow><mi>m</mi><msubsup><mi>v</mi><mo>⊥</mo><mn>2</mn></msubsup></mrow><mrow><mn>2</mn><mi>B</mi></mrow></mfrac><mo>≈</mo><mi data-i18n="eq.cte"></mi><mspace width="0.6em"/><mo>⟹</mo><mspace width="0.6em"/><msup><mi data-i18n="eq.sin"></mi><mn>2</mn></msup><msub><mi>α</mi><mi mathvariant="normal">c</mi></msub><mo>=</mo><mfrac><msub><mi>B</mi><mn>0</mn></msub><msub><mi>B</mi><mi data-i18n="eq.max"></mi></msub></mfrac></math></div>
    <p class="validite" data-i18n-html="val.miroir"></p>
    <figure class="chart">
      <svg class="fig" id="mir" role="img" data-i18n-attr="aria-label:mir.aria"></svg>
      <svg class="fig" id="mirz" role="img" data-i18n-attr="aria-label:mirz.aria"></svg>
      <div class="legend"><span class="c-label-2" data-i18n="mir.legend.lignes"></span><span class="c-tint" data-i18n="mir.legend.traj"></span><span class="c-warn" data-i18n="mir.legend.predit"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="mR" data-i18n="mir.R"></label><output id="mRo" for="mR"></output></div>
            <input id="mR" type="range" min="1.5" max="10" step="0.1" value="4"></div>
          <div class="ctl"><div class="row"><label for="mA" data-i18n="mir.alpha"></label><output id="mAo" for="mA"></output></div>
            <input id="mA" type="range" min="5" max="89" step="1" value="45"></div>
          <div class="ctl"><div class="row"><label for="mB" data-i18n="mir.B0"></label><output id="mBo" for="mB"></output></div>
            <input id="mB" type="range" min="-2.5" max="0.5" step="0.05" value="0"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="mir.k.verdict"></span><span class="v" id="vver"></span><span class="f" id="fver"></span></div>
          <div class="stat"><span class="k" data-i18n-html="mir.k.z"></span><span class="v" id="vz"></span><span class="f" id="fz"></span></div>
          <div class="stat"><span class="k" data-i18n-html="mir.k.mu"></span><span class="v" id="vmu"></span><span class="f" id="fmu"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="mir.caption"></figcaption>
    </figure>
    <div class="box warn"><b data-i18n="s3.warn.title"></b>
      <p data-i18n-html="s3.warn.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <p data-i18n-html="s4.p2"></p>
    <div class="eq"><math display="block"><mi>n</mi><msub><mi>τ</mi><mi>E</mi></msub><mo>≥</mo><mfrac><mrow><mn>12</mn><mspace width="0.1em"/><msub><mi>k</mi><mi mathvariant="normal">B</mi></msub><mi>T</mi></mrow><mrow><mo>⟨</mo><mi>σ</mi><mi>v</mi><mo>⟩</mo><mspace width="0.1em"/><msub><mi>E</mi><mi>α</mi></msub></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.lawson"></p>
    <figure class="chart">
      <svg class="fig" id="law" role="img" data-i18n-attr="aria-label:law.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="law.legend.seuil"></span><span class="c-warn" data-i18n="law.legend.point"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="ln" data-i18n="law.n"></label><output id="lno" for="ln"></output></div>
            <input id="ln" type="range" min="19" max="21" step="0.01" value="20"></div>
          <div class="ctl"><div class="row"><label for="lT" data-i18n="law.T"></label><output id="lTo" for="lT"></output></div>
            <input id="lT" type="range" min="0" max="2" step="0.01" value="1"></div>
          <div class="ctl"><div class="row"><label for="ltau" data-i18n="law.tau"></label><output id="ltauo" for="ltau"></output></div>
            <input id="ltau" type="range" min="-2" max="1" step="0.01" value="0"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="law.k.triple"></span><span class="v" id="vtr"></span><span class="f" id="ftr"></span></div>
          <div class="stat"><span class="k" data-i18n-html="law.k.p"></span><span class="v" id="vpa"></span><span class="f" id="fpa"></span></div>
          <div class="stat"><span class="k" data-i18n-html="law.k.Q"></span><span class="v" id="vQ"></span><span class="f" id="fQ"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="law.caption"></figcaption>
    </figure>
    <p id="s4p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/confinement-magnetique-fusion.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/ondes-milieux.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m);
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), M = OndesMilieux, Cst = Constantes;
const keV = 1e3 * Cst.e, mD = 2.014 * Cst.u;
/* ITER, reference inductive scenario: ⟨ne⟩ = 1,01 × 10²⁰ m⁻³, ⟨Te⟩ = 8,8 keV, ⟨Ti⟩ = 8,0 keV, B = 5,3 T, R0 = 6,2 m, τE ≈ 3,7 s */
const ITER = { n: 1.01e20, Te: 8.8, Ti: 8.0, B: 5.3, a: 2, tauE: 3.7 };

/* ---------- le système décrit ---------- */
(() => {
  const x = M.plasmaFroid({ n: ITER.n, T: ITER.Te * M.KEV, L: ITER.a });
  $("sys").innerHTML = t("sys.body", { T: F.si(ITER.Ti * M.KEV, "K"), fp: F.si(x.fp, "Hz"), ld: F.si(x.lambdaD, "m"), nu: F.sci(x.nu, 2),
    lib: F.si(x.vth * Math.SQRT2 / x.nu, "m"), p: F.si(ITER.n * (ITER.Te + ITER.Ti) * keV, "Pa") });
})();

/* ---------- échelles du confinement dans ITER ---------- */
(() => {
  const e = M.giration(ITER.Te * M.KEV, ITER.B), d = M.giration(ITER.Ti * M.KEV, ITER.B, mD, Cst.e), al = M.giration(3.5e3 * M.KEV, ITER.B, 4.0026 * Cst.u, 2 * Cst.e);
  const b = M.betaPlasma(ITER.n, ITER.Te * M.KEV, ITER.Ti * M.KEV, ITER.B), ROWS = ["electron", "deuton", "alpha", "beta"];
  const txt = textOf("echelles.items", ROWS);
  const v = { electron: { r: F.si(e.rayon, "m"), f: F.si(e.fc, "Hz"), q: F.sci(e.rayon / ITER.a, 1) }, deuton: { r: F.si(d.rayon, "m"), f: F.si(d.fc, "Hz"), q: F.sci(d.rayon / ITER.a, 1) },
    alpha: { r: F.si(al.rayon, "m"), q: F.sci(al.rayon / ITER.a, 1) }, beta: { b: F.num(b.beta * 100, 2), p: F.si(b.p, "Pa"), pB: F.si(b.pB, "Pa") } };
  $("echelles").innerHTML = ROWS.map(id => `<div><span class="k">${txt[id].k}</span><span>${fill(txt[id].text, v[id])}</span></div>`).join("");
})();

/* ---------- le miroir magnétique ---------- */
(() => {
  const svg = $("mir"), svz = $("mirz"), L = 1, Ec = 1e3 * Cst.e;
  function draw() {
    const R = +$("mR").value, alpha = +$("mA").value * Math.PI / 180, B0 = 10 ** +$("mB").value;
    const s = M.miroir({ B0, R, L, m: mD, q: Cst.e, Ec, alpha, parTour: 40, duree: 4e-5 });
    const pts = s.pts, step = Math.max(1, Math.floor(pts.length / 3000)), sub = pts.filter((p, i) => i % step === 0 || i === pts.length - 1);
    const rmax = Math.max(0.05, ...sub.map(p => Math.hypot(p.x[0], p.x[1]))) * 1.15;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 44 }, x: { domain: [-1.3, 1.3], label: t("mir.xaxis") }, y: { domain: [-rmax, rmax], label: t("mir.yaxis") } });
    /* field lines: r √B constant (flux conservation) */
    const zs = Array.from({ length: 131 }, (_, i) => -1.3 + i * 0.02);
    [0.25, 0.5, 0.75, 1].forEach(k => [1, -1].forEach(sg => Plot.el("path", { d: Plot.path(zs.map(z => [P.x(z), P.y(sg * k * rmax * 0.85 * Math.sqrt(B0 / s.champ.Bz(z)))])), class: "stroke thin c-label-2" }, P.g)));
    [-1, 1].forEach(z => Plot.el("line", { x1: P.x(z), x2: P.x(z), y1: P.y(-rmax), y2: P.y(rmax), class: "zero" }, P.g));
    Plot.el("path", { d: Plot.path(sub.map(p => [P.x(p.x[2]), P.y(p.x[0])])), class: "stroke thin c-tint" }, P.g);
    if (s.zPredit != null) [1, -1].forEach(sg => Plot.el("line", { x1: P.x(sg * s.zPredit), x2: P.x(sg * s.zPredit), y1: P.y(-rmax), y2: P.y(rmax), class: "stroke c-warn" }, P.g));
    svz.innerHTML = "";
    const T = pts[pts.length - 1].t, Q = Plot.axes(svz, { fmt: F, w: 640, h: 180, pad: { l: 56, b: 44 }, x: { domain: [0, 4e-5 * 1e6], label: t("mirz.xaxis") }, y: { domain: [-1.3, 1.3], label: t("mirz.yaxis") } });
    Plot.el("path", { d: Plot.path(sub.map(p => [Q.x(p.t * 1e6), Q.y(p.x[2])])), class: "stroke c-tint" }, Q.g);
    if (s.zPredit != null) [1, -1].forEach(sg => Plot.el("line", { x1: Q.x(0), x2: Q.x(40), y1: Q.y(sg * s.zPredit), y2: Q.y(sg * s.zPredit), class: "stroke thin c-warn" }, Q.g));
    $("mRo").textContent = F.num(R, 3); $("mAo").textContent = F.num(alpha * 180 / Math.PI, 3) + "°"; $("mBo").textContent = F.si(B0, "T");
    $("vver").innerHTML = t(s.piege ? "mir.piege" : "mir.perdu");
    $("fver").innerHTML = t("mir.f.cone", { a: F.num(s.cone * 180 / Math.PI, 3) });
    $("vz").textContent = s.piege ? F.si(s.zmax, "m") : "–";
    $("fz").textContent = s.zPredit != null ? t("mir.f.predit", { z: F.si(s.zPredit, "m") }) : t("mir.f.cone2");
    $("vmu").textContent = F.qty(F.num(s.mu.ecart * 100, 2), "%");
    $("fmu").innerHTML = t("mir.f.rl", { r: F.sci(s.rL / L, 2), d: F.si(T, "s") });
  }
  ["mR", "mA", "mB"].forEach(id => $(id).oninput = draw); draw();
})();

/* ---------- critère de Lawson ---------- */
(() => {
  const svg = $("law"), Ts = Array.from({ length: 121 }, (_, i) => 10 ** (i / 60));
  function draw() {
    const n = 10 ** +$("ln").value, T = 10 ** +$("lT").value, tau = 10 ** +$("ltau").value, b = M.bilanFusion({ n, T, tauE: tau });
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 60, b: 44 }, x: { scale: "log", domain: [1, 100], label: t("law.xaxis") }, y: { scale: "log", domain: [1e18, 1e23], label: t("law.yaxis") } });
    Plot.el("path", { d: Plot.path(Ts.filter(T => M.lawson(T).nTau <= 1e23).map(T => [P.x(T), P.y(M.lawson(T).nTau)])), class: "stroke c-tint" }, P.g);
    Plot.el("circle", { cx: P.x(T), cy: P.y(Math.min(1e23, Math.max(1e18, n * tau))), r: 7, class: "fill c-warn" }, P.g);
    Plot.el("circle", { cx: P.x(ITER.Ti), cy: P.y(ITER.n * ITER.tauE), r: 4, class: "fill c-label-2" }, P.g);
    Plot.el("text", { x: P.x(ITER.Ti) + 8, y: P.y(ITER.n * ITER.tauE) + 14, class: "tick" }, P.g).innerHTML = t("law.iter");
    $("lno").textContent = F.qty(F.sci(n, 2), "m⁻³"); $("lTo").textContent = F.qty(F.num(T, 3), "keV"); $("ltauo").textContent = F.si(tau, "s");
    $("vtr").textContent = F.qty(F.sci(b.triple, 2), "keV·s·m⁻³"); $("ftr").innerHTML = t("law.f.seuil", { s: F.sci(b.seuil, 2) });
    $("vpa").textContent = F.si(b.Palpha, "W·m⁻³"); $("fpa").innerHTML = t("law.f.pertes", { p: F.si(b.Ppertes, "W·m⁻³") });
    $("vQ").textContent = b.allumage ? t("law.allume") : F.num(b.Q, 3); $("fQ").innerHTML = t(b.allumage ? "law.f.allume" : "law.f.Q", { e: F.si(b.Pext, "W·m⁻³") });
  }
  ["ln", "lT", "ltau"].forEach(id => $(id).oninput = draw); draw();
  /* ITER in the same 0-D model, plasma volume ≈ 830 m³ */
  const V = 830, b = M.bilanFusion({ n: ITER.n, T: ITER.Ti, tauE: ITER.tauE });
  $("s4p3").innerHTML = t("s4.p3", { tr: F.sci(b.triple, 2), s: F.sci(b.seuil, 2), pf: F.si(b.Pfusion * V, "W"), pe: F.si(b.Pext * V, "W"), Q: F.num(b.Q, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["tamm", 1950, "idea"], ["lawson", 1955, "idea"], ["t3", 1968, "experiment"], ["nif", 2022, "experiment"], ["jet", 2023, "experiment"], ["west", 2025, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["iter"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["temperature", "c"], ["paroi", "a"], ["rayon", "d"], ["beta", "b"], ["cone", "a"], ["adiabatique", "c"], ["tore", "d"], ["lawson", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 703 });
})();
</script>
</body>
