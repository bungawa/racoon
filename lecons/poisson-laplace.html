<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;

/* The box: 10 cm square, 31 × 31 nodes; top and left sides at chosen potentials, right and bottom at 0;
   a central square of 5 × 5 nodes (1,7 cm) carries the density ρ. */
const N = 31, A = 0.1, H = A / (N - 1), C0 = 13, C1 = 17;

/* ---------- le système décrit : la charge est-elle continue à l'échelle de la grille ? ---------- */
(() => {
  const rho = 1e-6, n = rho / ES.E, ecart = Math.cbrt(1 / n);   // electrons per m³ and their mean spacing, m
  $("sys1").innerHTML = t("sys1.body", { h: F.si(H, "m", { prefix: "m" }), n: F.sci(n, 2), ecart: F.si(ecart, "m", { prefix: "µ" }), rapport: F.num(H / ecart, 0), parcelle: F.sci(n * H ** 3, 2), fluct: F.sci(1 / Math.sqrt(n * H ** 3), 1) });
})();

/* ---------- relaxation sur la grille ---------- */
(() => {
  const svg = $("carte"), vh = $("vh"), vg = $("vg"), rh = $("rho");
  const S0 = 380, X0 = 20, Y0 = 10, cell = S0 / N;
  let phi = null, iter = 0, res = 0;
  const bords = () => ({ haut: +vh.value, gauche: +vg.value, rho: +rh.value * 1e-6 });
  const options = (b, extra) => Object.assign({ nx: N, ny: N, h: H,
    fixe: (i, j) => j === N - 1 ? b.haut : i === 0 ? b.gauche : (j === 0 || i === N - 1 ? 0 : null),
    rho: (i, j) => (i >= C0 && i <= C1 && j >= C0 && j <= C1 ? b.rho : 0) }, extra);
  const residu = b => ES.relaxation(options(b, { phi0: phi, max: 0 })).residu;
  function zero() { const b = bords(); phi = ES.relaxation(options(b, { max: 0 })).phi; iter = 0; res = residu(b); draw(); }
  function balayer(n) { const b = bords(), r = ES.relaxation(options(b, { phi0: phi, max: n, omega: 1 })); phi = r.phi; iter += r.iterations; res = r.residu; draw(); }
  function equilibre() { const b = bords(), r = ES.relaxation(options(b, { phi0: phi })); phi = r.phi; iter += r.iterations; res = r.residu; draw(); }
  function draw() {
    const b = bords();
    svg.innerHTML = "";
    let amp = 1; phi.forEach(row => row.forEach(v => { amp = Math.max(amp, Math.abs(v)); }));
    const fond = Plot.el("g", {}, svg);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const v = phi[j][i];
      Plot.el("rect", { x: (X0 + i * cell).toFixed(1), y: (Y0 + (N - 1 - j) * cell).toFixed(1), width: (cell + 0.4).toFixed(1), height: (cell + 0.4).toFixed(1),
        class: "fill " + (v >= 0 ? "c-warn" : "c-tint"), "fill-opacity": (0.75 * Math.abs(v) / amp).toFixed(3) }, fond);
    }
    /* equipotentials every 10 V, from the grid by bilinear interpolation */
    const f = ([x, y]) => { const u = Math.min(N - 1.000001, Math.max(0, x)), w = Math.min(N - 1.000001, Math.max(0, y)), i = Math.floor(u), j = Math.floor(w), a = u - i, c = w - j;
      return (1 - a) * (1 - c) * phi[j][i] + a * (1 - c) * phi[j][i + 1] + (1 - a) * c * phi[j + 1][i] + a * c * phi[j + 1][i + 1]; };
    const iso = Plot.el("g", { class: "c-label-2" }, svg), px = ([x, y]) => [X0 + (x + 0.5) * cell, Y0 + (N - 0.5 - y) * cell];
    for (let L = -200; L <= 200; L += 10) if (L !== 0 || b.haut || b.gauche) AnaVec.isolignes(f, 0, N - 1, 61, 0, N - 1, 61, L).forEach(s =>
      Plot.el("path", { d: Plot.path(s.map(px)), class: "stroke thin" }, iso));
    const cadre = Plot.el("g", { class: "c-label" }, svg);
    Plot.el("rect", { x: X0, y: Y0, width: S0, height: S0, class: "stroke thin" }, cadre);
    if (b.rho) Plot.el("rect", { x: X0 + C0 * cell, y: Y0 + (N - 1 - C1) * cell, width: (C1 - C0 + 1) * cell, height: (C1 - C0 + 1) * cell, class: "stroke dash" }, cadre);
    const lab = (x, y, s, anchor) => { Plot.el("text", { x, y, "text-anchor": anchor || "start" }, svg).textContent = s; };
    lab(X0 + S0 / 2, Y0 + 14, F.si(b.haut, "V"), "middle");
    lab(X0 + 6, Y0 + S0 / 2, F.si(b.gauche, "V"));
    lab(X0 + S0 / 2, Y0 + S0 - 6, F.si(0, "V"), "middle");
    lab(X0 + S0 - 6, Y0 + S0 / 2, F.si(0, "V"), "end");
    const m = (N - 1) / 2, centre = phi[m][m];
    let hi = -Infinity, lo = Infinity;
    for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) { hi = Math.max(hi, phi[j][i]); lo = Math.min(lo, phi[j][i]); }
    const bmax = Math.max(0, b.haut, b.gauche), bmin = Math.min(0, b.haut, b.gauche);
    lab(430, 40, t("fig.iter", { n: iter }));
    lab(430, 60, t("fig.cote", { a: F.si(A, "m", { prefix: "" }) }));
    $("vhr").textContent = F.si(b.haut, "V");
    $("vgr").textContent = F.si(b.gauche, "V");
    $("rhor").textContent = F.si(b.rho, "C·m⁻³", { prefix: "µ" });
    $("vc").textContent = F.si(centre, "V");
    $("fc").textContent = t("fig.f.centre", { v: F.si((b.haut + b.gauche) / 4, "V") });
    $("vm").textContent = t("fig.v.max", { lo: F.si(lo, "V"), hi: F.si(hi, "V") });
    $("fm").textContent = t("fig.f.max", { lo: F.si(bmin, "V"), hi: F.si(bmax, "V") });
    $("vr").textContent = F.si(res, "V");
    $("fr").textContent = t("fig.f.res");
  }
  vh.oninput = vg.oninput = rh.oninput = () => { phi = null; iter = 0; zero(); equilibre(); };
  $("zero").onclick = zero; $("dix").onclick = () => balayer(10); $("eq").onclick = equilibre;
  zero(); equilibre();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["laplace", 1782, "idea"], ["poisson", 1813, "idea"], ["green", 1828, "idea"], ["richardson", 1911, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["elements", "optique"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["gradient", "b"], ["une", "d"], ["moyenne", "a"], ["extremum", "c"], ["superposition", "b"], ["signe", "a"], ["integrale", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 61 });
})();
</script>
