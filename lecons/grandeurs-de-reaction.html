<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (id, k, ids) => { const txt = textOf(k, ids); $(id).innerHTML = ids.map(i => `<div><span class="k">${txt[i].k}</span><span>${txt[i].v}</span></div>`).join(""); };

keyed("etats", "s2.etats", ["gaz", "condense", "solute", "solvant"]);

/* ---------- §4 : ΔrH°(T), la relation de Kirchhoff intégrée ---------- */
(() => {
  const C = ChimSolutions, P = Plot.el, T0 = C.T0, kJ = x => x / 1000;
  let r = "ammoniac";
  function draw() {
    const nu = C.REACTIONS[r], T = +$("tsl").value, h0 = C.drH(nu), h = C.drH(nu, T);
    const pts = [];
    for (let i = 0; i <= 120; i++) { const Ti = T0 + (1500 - T0) * i / 120; pts.push([Ti, kJ(C.drH(nu, Ti))]); }
    const ys = pts.map(p => p[1]).concat(kJ(h0)), lo = Math.min(...ys), hi = Math.max(...ys), m = Math.max(2, 0.2 * (hi - lo));
    const svg = $("drh"); svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 64 }, x: { domain: [T0, 1500], label: t("fig.x") }, y: { domain: [lo - m, hi + m], label: t("fig.y") } });
    P("line", { x1: o.x(T0), x2: o.x(1500), y1: o.y(kJ(h0)), y2: o.y(kJ(h0)), class: "stroke thin dash c-label-2" }, o.g);
    P("path", { d: Plot.path(pts.map(([a, b]) => [o.x(a), o.y(b)])), class: "curve" }, o.g);
    P("line", { x1: o.x(T), x2: o.x(T), y1: o.y(kJ(h0)), y2: o.y(kJ(h)), class: "stroke c-warn" }, o.g);
    P("circle", { cx: o.x(T), cy: o.y(kJ(h)), r: 5, class: "dot" }, o.g);
    $("tv").innerHTML = F.kelvin(T);
    $("vh").textContent = F.si(h, "J·mol⁻¹", { sig: 4 });
    $("feq").innerHTML = t("fig.f.h", { h: F.si(h0, "J·mol⁻¹", { sig: 4 }) });
    $("vecart").textContent = F.qty(F.num(100 * (h - h0) / Math.abs(h0), 2), "%");
    $("fecart").textContent = t(h0 < 0 ? "fig.f.exo" : "fig.f.endo");
    $("vcp").textContent = F.si(C.drCp(nu, T), "J·mol⁻¹·K⁻¹", { sig: 3 });
    $("vu").textContent = F.si(C.drU(nu, T), "J·mol⁻¹", { sig: 4 });
    $("fu").textContent = t("fig.f.u", { n: F.num(C.dnGaz(nu), 2) });
    $("rseg").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.r === r)));
  }
  $("rseg").querySelectorAll("button").forEach(b => b.onclick = () => { r = b.dataset.r; draw(); });
  $("tsl").oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lavoisier1783", 1783, "experiment"], ["kirchhoff1858", 1858, "idea"], ["iupac1982", 1982, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["bombe", "tables"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["etat", "b"], ["sens", "c"], ["standard298", "a"], ["bombe", "d"], ["kirchhoff", "b"], ["ideal", "a"], ["vaporeformage", "c"], ["mesure", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 8101 });
})();
</script>
