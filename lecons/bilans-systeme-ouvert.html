<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const DEG = Math.PI / 180, D = 0.01, S = Math.PI * D * D / 4, RHO = Fluides.DYN.eau.rho;

/* ---------- §2 : un jet d'eau de 10 mm sur une plaque ou une roue à augets ---------- */
(() => {
  const P = Plot.el, path = Plot.path;
  function draw() {
    const mode = $("mode").value, v = +$("v").value, th = +$("th").value * DEG, x = +$("x").value / 100, u = x * v;
    const r = Fluides.jet({ rho: RHO, S, v, u, theta: th, mode });
    /* the drawing, in the frame of the plate: the jet comes from the left at w, leaves at ±θ, the force pushes right */
    const svg = $("jet"); svg.innerHTML = "";
    const C = [250, 150], R = 70, lw = 40 + 3 * r.w;
    P("rect", { x: 20, y: C[1] - 8, width: C[0] - 30, height: 16, class: "fill c-tint" }, svg);
    const bord = [-1, 1].map(s => [C[0] + R * Math.cos(th) * 0.9 + 6, C[1] + s * R * Math.sin(th) * 0.9 + s * (th > 2.6 ? 22 : 0)]);
    P("path", { d: path([bord[0], [C[0] + 6, C[1]], bord[1]]), class: "stroke bold c-label" }, svg);
    [-1, 1].forEach(s => Plot.fleche(svg, [C[0] - 2, C[1] + s * 14], [C[0] - 2 + lw * Math.cos(th), C[1] + s * 14 + s * lw * Math.sin(th)], { cls: "c-label-2", min: 2 }));
    Plot.fleche(svg, [C[0] - 60 - lw, C[1] - 30], [C[0] - 60, C[1] - 30], { cls: "c-label-2", min: 2 });
    P("text", { x: C[0] - 60 - lw, y: C[1] - 40 }, svg).textContent = t("jet.lab.w", { w: F.si(r.w, "m·s⁻¹") });
    Plot.fleche(svg, [C[0] + 12, C[1]], [C[0] + 12 + Math.min(130, 1.2 * Math.sqrt(r.F) * 6), C[1]], { cls: "c-warn", tete: 11, min: 2 });
    if (u > 0) P("text", { x: C[0] + 20, y: C[1] - 18 }, svg).textContent = t("jet.lab.u", { u: F.si(u, "m·s⁻¹") });
    /* efficiency against u/v for this mode and angle */
    const g = $("rend"); g.innerHTML = "";
    const o = Plot.axes(g, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 48 }, x: { domain: [0, 1], label: t("rend.x") }, y: { domain: [0, 1], label: t("rend.y") } });
    const pts = Array.from({ length: 101 }, (_, i) => i / 100).map(k => [o.x(k), o.y(Fluides.jet({ rho: RHO, S, v, u: k * v, theta: th, mode }).rendement)]);
    if (mode === "plaque") { const pl = 8 / 27 * (1 - Math.cos(th)); P("line", { x1: o.x(0), x2: o.x(1), y1: o.y(pl), y2: o.y(pl), class: "stroke thin dash c-label-2" }, o.g); }   // max of 2x(1−x)²(1−cos θ), at x = 1/3
    P("path", { d: path(pts), class: "curve" }, o.g);
    P("circle", { cx: o.x(x), cy: o.y(r.rendement), r: 6, class: "dot" }, o.g);
    /* readouts */
    $("vv").textContent = F.si(v, "m·s⁻¹"); $("thv").textContent = F.num(th / DEG, 3) + "°"; $("xv").textContent = F.fix(x, 2);
    $("vqm").textContent = F.si(r.qm, "kg·s⁻¹"); $("fqm").textContent = t(mode === "roue" ? "jet.f.qm.roue" : "jet.f.qm.plaque", { q: F.si(RHO * S * v, "kg·s⁻¹") });
    $("vf").textContent = F.si(r.F, "N"); $("ff").textContent = t("jet.f.f", { k: F.num(r.F / (RHO * S * v * v), 3) });
    $("vp").textContent = F.si(r.P, "W"); $("fp").textContent = t("jet.f.p", { e: F.qty(F.num(100 * r.rendement, 3), "%"), j: F.si(r.Pjet, "W") });
  }
  ["v", "th", "x"].forEach(id => $(id).oninput = draw); $("mode").onchange = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["euler1755", 1755, "idea"], ["pelton1880", 1880, "experiment"], ["betz1920", 1920, "idea"], ["bieudron1998", 1998, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pelton", "eolienne", "pompe"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ferme", "b"], ["force", "a"], ["auget", "c"], ["optimum", "d"], ["plaque", "a"], ["poids", "b"], ["pompe", "c"], ["bieudron", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 6101 });
})();
</script>
