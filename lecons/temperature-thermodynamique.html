<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-thermo" data-i18n="monde.thermo"></a><span class="aux">›</span><a href="/racoon/etape?id=entropie-energie-interne" data-i18n="etape.entropie-energie-interne"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-thermo" href="/racoon/atlas?piste=thermo" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/etape?id=premier-second-principe" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>T</mi><mo>=</mo><mn>273,16</mn><mspace width="0.2em"/><mi mathvariant="normal">K</mi><mo>×</mo><mfrac><mi>Q</mi><msub><mi>Q</mi><mn>0</mn></msub></mfrac></math><span class="n">(44.10a)</span></div>
    <p class="validite" data-i18n-html="val.44.10"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><mfrac><msub><mi>Q</mi><mn>1</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi>Q</mi><mn>2</mn></msub><msub><mi>T</mi><mn>2</mn></msub></mfrac></math><span class="n">(44.12)</span></div>
    <p class="validite" data-i18n-html="val.44.12"></p>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure class="chart">
      <svg class="fig" id="chaine" role="img" data-i18n-attr="aria-label:ch.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="ch.legend.res"></span><span class="c-warn" data-i18n="ch.legend.droite"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="t1" data-i18n="ch.t1"></label><output id="t1v" for="t1"></output></div>
            <input id="t1" type="range" min="300" max="1200" step="10" value="820"></div>
          <div class="ctl"><div class="row"><label for="nm" data-i18n="ch.n"></label><output id="nmv" for="nm"></output></div>
            <input id="nm" type="range" min="1" max="8" step="1" value="4"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="ch.k.ratio"></span><span class="v" id="vratio"></span><span class="f" data-i18n="ch.f.ratio"></span></div>
          <div class="stat"><span class="k" data-i18n-html="ch.k.dt"></span><span class="v" id="vdt"></span><span class="f" data-i18n="ch.f.dt"></span></div>
          <div class="stat"><span class="k" data-i18n-html="ch.k.w"></span><span class="v" id="vw"></span><span class="f" data-i18n="ch.f.w"></span></div>
          <div class="stat"><span class="k" data-i18n-html="ch.k.eta"></span><span class="v" id="veta"></span><span class="f" data-i18n="ch.f.eta"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="ch.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="eq"><math display="block"><mi>η</mi><mo>=</mo><mfrac><mi>W</mi><msub><mi>Q</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msub><mi>T</mi><mn>1</mn></msub><mo>−</mo><msub><mi>T</mi><mn>2</mn></msub></mrow><msub><mi>T</mi><mn>1</mn></msub></mfrac></math><span class="n">(44.14)</span></div>
    <p class="validite" data-i18n-html="val.44.14"></p>
    <p id="exemple"></p>
    <p data-i18n-html="s4.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/temperature-thermodynamique.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/thermo.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const pct = x => F.qty(F.num(100 * x, 3), "%");

/* ---------- le système : des thermostats qui ne bougent pas ---------- */
(() => {
  const C = 1000 * 4180, dT = 1000 / C;                     // 1 m³ of water receives 1 kJ
  $("sys").innerHTML = t("sys.inner", { dT: F.si(dT, "K", { sig: 2 }), r: F.sci(dT / 293.15, 1) });
})();

/* ---------- une chaîne de machines réversibles ---------- */
(() => {
  const svg = $("chaine"), s1 = $("t1"), sn = $("nm"), T2 = Thermo.T_PT, TMAX = 1250;
  function draw() {
    const T1 = +s1.value, n = +sn.value, Q1 = T1 / T2, ch = Thermo.chaine(Q1, T1, T2, n);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44, l: 52 }, x: { domain: [0, TMAX], label: t("ch.x") }, y: { domain: [0, TMAX / T2], label: t("ch.y") } });
    Plot.el("path", { d: Plot.path([[o.x(0), o.y(0)], [o.x(TMAX), o.y(TMAX / T2)]]), class: "ref" }, o.g);
    ch.T.forEach((T, k) => {
      if (k) Plot.el("line", { x1: o.x(T), x2: o.x(T), y1: o.y(ch.Q[k]), y2: o.y(ch.Q[k - 1]), class: "stroke c-label-2" }, o.g);
      Plot.el("circle", { cx: o.x(T), cy: o.y(ch.Q[k]), r: 6, class: "dot" }, o.g);
    });
    Plot.el("text", { x: o.x(T2) + 8, y: o.y(1) + 16, class: "note" }, o.g).textContent = t("ch.note.pt");
    $("t1v").innerHTML = F.kelvin(T1);
    $("nmv").textContent = F.num(n, 2);
    $("vratio").textContent = F.fix(Q1, 3);
    $("vdt").textContent = F.si((T1 - T2) / n, "K", { sig: 3 });
    $("vw").textContent = pct(ch.W[0] / Q1);
    $("veta").textContent = pct(Thermo.carnot(T1, T2).eta);
  }
  s1.oninput = sn.oninput = draw; draw();
})();

/* ---------- exemple chiffré : entre l'eau bouillante et la glace fondante ---------- */
(() => {
  const c = Thermo.carnot(373.15, 273.15), d = Thermo.carnot(2 * 373.15, 2 * 273.15);
  $("exemple").innerHTML = t("s4.exemple", { T1: F.kelvin(373.15), T2: F.kelvin(273.15), eta: pct(c.eta), eta2: pct(d.eta) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["amontons", 1702, "idea"], ["carnot", 1824, "idea"], ["thomson", 1848, "idea"], ["cgpm10", 1954, "use"],
    ["cgpm13", 1967, "use"], ["eit90", 1989, "use"], ["cgpm26", 2018, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["eit", "kb"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["mercure", "c"], ["rapport", "a"], ["chaine", "d"], ["double", "b"], ["unite", "c"], ["zero", "a"], ["gaz", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 445 });
})();
</script>
</body>
</html>
