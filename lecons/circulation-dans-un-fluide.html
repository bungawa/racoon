    </div>
    <figure>
      <svg class="fig" id="cyl" viewBox="0 0 640 400" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.cp"></span><span class="c-label" data-i18n="fig.legend.psi"></span><span class="c-warn" data-i18n="fig.legend.arret"></span><span class="c-ko" data-i18n="fig.legend.force"></span><span class="c-ok" data-i18n="fig.legend.boucle"></span></div>
      <div class="panel">

            <input id="gam" type="range" min="-1.5" max="1.5" step="0.05" value="0"></div>
          <div class="ctl"><div class="row"><label for="rb" data-i18n="fig.rb"></label><output id="rbr" for="rb"></output></div>
            <input id="rb" type="range" min="1.1" max="3.5" step="0.1" value="2"></div>
        </div>
        <div class="stats">

          <div class="stat"><span class="k" data-i18n-html="fig.k.fy"></span><span class="v" id="vfy"></span><span class="f" id="ffy"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>

<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>

<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>
<script src="/racoon/carte-champ.js"></script>
<script src="/racoon/fluides.js"></script>
<script src="/racoon/fluides-parfait.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const g = Constantes.g_CPGE, AIR = Fluides.DYN.air;
const CY = { U: 10, R: 0.05 };                                   // air at 10 m·s⁻¹ past a cylinder of radius 5 cm
const G1 = 4 * Math.PI * CY.U * CY.R;                            // the circulation that brings both stagnation points together

/* ---------- the system, in numbers ---------- */
(() => {
  $("sys").innerHTML = t("sys.body", { U: F.num(CY.U, 2), D: F.num(200 * CY.R, 2), re: F.sci(Fluides.reynolds(CY.U, 2 * CY.R, AIR.nu), 1),
    ma: F.sci(Fluides.compressibilite(CY.U, AIR.c), 1), G1: F.fix(G1, 2), w: F.fix(G1 / (2 * Math.PI * CY.R * CY.R), 0) });
})();

/* ---------- flow past a cylinder, with circulation ---------- */
(() => {
  const svg = $("cyl"), P = Plot.el, notes = textOf("fig.notes", ["zero", "surface", "detache"]);
  const O = { W: 640, H: 400, x0: -0.32, x1: 0.32, y0: -0.2, y1: 0.2 };
  function draw() {
    const s = +$("gam").value, G = s * G1, rb = +$("rb").value * CY.R, cyl = FluidesParfait.cylindreCirculation(CY.U, CY.R, G);
    const c = CarteChamp.carte(svg, O), out = p => Math.hypot(p[0], p[1]) >= CY.R;
    const surf = p => { const r = Math.hypot(p[0], p[1]) || 1; return [CY.R * p[0] / r, CY.R * (p[1] || 1e-9) / r]; };   // cells inside take the value at the wall
    CarteChamp.fond(c, p => cyl.cp(out(p) ? p : surf(p)), 96, 60, { lo: -3, hi: 1, signe: -1 });   // darker where the pressure is low
    const lv = []; for (let k = -12; k <= 12; k++) lv.push(k * CY.U * 0.016);
    CarteChamp.niveaux(c, cyl.psi, lv, { n: [128, 80] });     // inside the cylinder, hidden by the disc
    const gd = c.layer("c-label");
    P("circle", { cx: c.sx(0), cy: c.sy(0), r: c.sx(CY.R) - c.sx(0), class: "fill" }, gd);
    if (s) {   // the cylinder turns to drag the circulation: an arrow on its rim
      const rr = (c.sx(CY.R) - c.sx(0)) * 0.6, n = 20, a0 = 0.6, a1 = a0 + Math.sign(s) * 2.4, gi = c.layer("c-label-2"); let d = "";
      for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; d += (i ? "L" : "M") + (c.sx(0) + rr * Math.cos(a)).toFixed(1) + " " + (c.sy(0) - rr * Math.sin(a)).toFixed(1); }
      P("path", { d, class: "stroke" }, gi);
      const pt = a => [c.sx(0) + rr * Math.cos(a), c.sy(0) - rr * Math.sin(a)];
      Plot.fleche(gi, pt(a1 - 0.35 * Math.sign(s)), pt(a1), { tete: 7 });
    }
    cyl.arrets.forEach(p => CarteChamp.point(c, p, 5, "c-warn"));
    const gb = c.layer("c-ok"); P("circle", { cx: c.sx(0), cy: c.sy(0), r: c.sx(rb) - c.sx(0), class: "stroke dash" }, gb);
    const f = cyl.force(AIR.rho, 720), circ = AnaVec.circulation(cyl.F, AnaVec.cercle([0, 0], rb), 1440);
    if (Math.abs(f.Fy) > 1e-6) CarteChamp.fleche(c, [0, 0], [0, f.Fy], Math.min(150, 1.3 * Math.abs(f.Fy)), "c-ko");
    $("gamr").textContent = F.fix(s, 2); $("rbr").textContent = F.fix(+$("rb").value, 1);
    $("vc").textContent = F.qty(F.fix(circ, 3), "m²·s⁻¹"); $("fc").innerHTML = t("fig.f.circ", { g: F.fix(G, 3) });
    $("vfx").textContent = F.qty(F.fix(f.Fx, 3), "N·m⁻¹");
    $("vfy").textContent = F.qty(F.fix(f.Fy, 2), "N·m⁻¹"); $("ffy").innerHTML = t("fig.f.fy", { kj: F.fix(-AIR.rho * CY.U * G, 2) });
    $("note").innerHTML = notes[s === 0 ? "zero" : Math.abs(s) <= 1 ? "surface" : "detache"];
  }
  $("gam").oninput = $("rb").oninput = draw; draw();
})();

/* ---------- the bathtub vortex ---------- */
(() => {
  const C = 0.03, z = FluidesParfait.baignoire(C, g);
  $("bain").innerHTML = t("bain", { C: F.fix(C, 2), z1: F.fix(-1000 * z(0.01), 1), z2: F.fix(-1000 * z(0.02), 1), z5: F.fix(-1000 * z(0.05), 2), v: F.fix(C / (2 * Math.PI * 0.01), 2) });
})();

/* ---------- history ---------- */
(() => {
  const EVENTS = [["dalembert", 1752, "idea"], ["magnus", 1852, "experiment"], ["joukowski", 1906, "idea"], ["buckau", 1925, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rotor"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["analogie", "c"], ["dalembert", "a"], ["portance", "d"], ["sens", "b"], ["boucle", "c"], ["baignoire", "a"], ["arrets", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 404 });
})();
</script>
