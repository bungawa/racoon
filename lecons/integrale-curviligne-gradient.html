<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-outils" data-i18n="monde.outils"></a><span class="aux">›</span><a href="/racoon/etape?id=flux-et-gauss" data-i18n="etape.flux-et-gauss"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi mathvariant="normal">Δ</mi><mi>ψ</mi><mo>≈</mo><mo>∇</mo><mi>ψ</mi><mo>·</mo><mi mathvariant="normal">Δ</mi><mover accent="true"><mi>s</mi><mo>→</mo></mover></math><span class="n">(3.3)</span></div>
    <p class="validite" data-i18n-html="val.3.2"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mi>ψ</mi><mo stretchy="false">(</mo><mn>2</mn><mo stretchy="false">)</mo><mo>−</mo><mi>ψ</mi><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∫</mo><mrow><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><mrow><mo stretchy="false">(</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></msubsup><mo>∇</mo><mi>ψ</mi><mo>·</mo><mi mathvariant="normal">d</mi><mover accent="true"><mi>s</mi><mo>→</mo></mover></math><span class="n">(3.1)</span></div>
    <p class="validite" data-i18n-html="val.3.1"></p>
    <div class="box prop"><b data-i18n="s1.prop.title"></b>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys"></p>
    </div>
    <figure>
      <svg class="fig" id="plaque" viewBox="0 0 640 440" role="img" data-i18n-attr="aria-label:plaque.aria"></svg>
      <div class="legend"><span class="c-warn" data-i18n="plaque.legend.chaud"></span><span class="c-tint" data-i18n="plaque.legend.chemin"></span><span class="c-label-2" data-i18n="plaque.legend.iso"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" id="champ"><button type="button" data-v="gradient" aria-pressed="true" data-i18n="plaque.gradient"></button><button type="button" data-v="tourbillon" aria-pressed="false" data-i18n="plaque.tourbillon"></button></div>
          <div class="seg" id="chemin"><button type="button" data-v="droit" aria-pressed="true" data-i18n="plaque.droit"></button><button type="button" data-v="detour" aria-pressed="false" data-i18n="plaque.detour"></button><button type="button" data-v="zigzag" aria-pressed="false" data-i18n="plaque.zigzag"></button></div>
          <div class="ctl"><div class="row"><label for="nsl" data-i18n="plaque.n"></label><output id="nread" for="nsl"></output></div>
            <input id="nsl" type="range" min="1" max="80" step="1" value="8"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="plaque.k.somme"></span><span class="v" id="vsomme"></span><span class="f" id="fsomme"></span></div>
          <div class="stat"><span class="k" data-i18n-html="plaque.k.diff"></span><span class="v" id="vdiff"></span><span class="f" id="fdiff"></span></div>
          <div class="stat"><span class="k" data-i18n-html="plaque.k.ecart"></span><span class="v" id="vecart"></span><span class="f" data-i18n="plaque.f.ecart"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="plaque.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><msub><mi>W</mi><mrow><mn>1</mn><mo>→</mo><mn>2</mn></mrow></msub><mo>=</mo><msubsup><mo>∫</mo><mrow><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><mrow><mo stretchy="false">(</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></msubsup><mover accent="true"><mi>F</mi><mo>→</mo></mover><mo>·</mo><mi mathvariant="normal">d</mi><mover accent="true"><mi>s</mi><mo>→</mo></mover><mo>=</mo><mo>−</mo><msubsup><mo>∫</mo><mrow><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><mrow><mo stretchy="false">(</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></msubsup><mo>∇</mo><mi>U</mi><mo>·</mo><mi mathvariant="normal">d</mi><mover accent="true"><mi>s</mi><mo>→</mo></mover><mo>=</mo><mi>U</mi><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo>−</mo><mi>U</mi><mo stretchy="false">(</mo><mn>2</mn><mo stretchy="false">)</mo></math></div>
    <p class="validite" data-i18n-html="val.travail"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="box warn"><b data-i18n="s3.warn.title"></b>
      <p data-i18n-html="s3.warn.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>

  <p class="foot" data-i18n-html="foot"></p>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/integrale-curviligne-gradient.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>
<script src="/racoon/lecons/integrale-curviligne-gradient.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- the plate: a temperature field T(x, y), two points, three paths ---------- */
const { temperature: T, gradient: GRAD, tourbillon: TOURBILLON, CHEMINS, P1, P2 } = Curviligne, { LX, LY } = Curviligne.PLAQUE;

(() => { const b = Curviligne.bornes();
  $("sys").innerHTML = t("sys.body", { lx: F.num(LX * 100, 2), ly: F.num(LY * 100, 2), tmin: F.num(b.tmin, 3), tmax: F.num(b.tmax, 3), g: F.num(b.gmax, 2) }); })();

(() => {
  const svg = $("plaque"), P = Plot.el, K = 1000, OX = 20, OY = 420;
  const X = x => OX + K * x, Y = y => OY - K * y;
  const st = { champ: "gradient", chemin: "droit" };
  /* the heat map and the isotherms do not move: drawn once */
  const fond = P("g", {}, svg), dessin = P("g", {}, svg);
  const NX = 40, NY = 27, dx = LX / NX, dy = LY / NY, T0 = Curviligne.PLAQUE.T0, amp = 75;
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const v = T([(i + 0.5) * dx, (j + 0.5) * dy]);
    P("rect", { x: X(i * dx), y: Y((j + 1) * dy), width: K * dx + 0.5, height: K * dy + 0.5,
      class: "fill " + (v >= T0 ? "c-warn" : "c-tint"), "fill-opacity": (0.45 * Math.min(1, Math.abs(v - T0) / amp)).toFixed(3) }, fond);
  }
  const isos = P("g", { class: "c-label-2" }, fond);
  for (let niv = 280; niv <= 360; niv += 10) AnaVec.isolignes(T, 0, LX, 61, 0, LY, 41, niv)
    .forEach(([a, b]) => P("line", { x1: X(a[0]), y1: Y(a[1]), x2: X(b[0]), y2: Y(b[1]), class: "stroke thin" }, isos));
  P("rect", { x: X(0), y: Y(LY), width: K * LX, height: K * LY, class: "stroke thin c-label-2" }, svg);
  const fleches = P("g", { class: "c-label-2" }, fond);
  const arrow = (A, B, cls, parent) => Plot.fleche(parent, A, B, { cls, tete: 8, trait: "stroke thin" });
  const label = (p, text, parent) => { const e = P("text", { x: p[0], y: p[1], "text-anchor": "middle" }, parent); e.textContent = text; return e; };
  function draw() {
    dessin.innerHTML = ""; fleches.innerHTML = "";
    const champ = st.champ === "gradient" ? GRAD : TOURBILLON, chemin = CHEMINS[st.chemin], n = +$("nsl").value;
    fond.setAttribute("opacity", st.champ === "gradient" ? 1 : 0.25);
    if (st.champ === "tourbillon") for (let i = 1; i < 12; i++) for (let j = 1; j < 8; j++) {
      const p = [i * LX / 12, j * LY / 8], v = TOURBILLON(p), m = 0.03 / 60;
      arrow([X(p[0]), Y(p[1])], [X(p[0] + m * v[0]), Y(p[1] + m * v[1])], "c-label-2", dessin);
    }
    /* the fine path, its chords, the field at each chord's middle */
    P("polyline", { points: Array.from({ length: 201 }, (_, k) => chemin(k / 200)).map(p => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" "), class: "stroke thin dash c-tint" }, dessin);
    const pts = Array.from({ length: n + 1 }, (_, k) => chemin(k / n));
    P("polyline", { points: pts.map(p => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" "), class: "stroke c-tint" }, dessin);
    if (n <= 30) pts.slice(0, -1).forEach((a, k) => {
      const b = pts[k + 1], m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], v = champ(m), sc = 0.04 / (st.champ === "gradient" ? 650 : 60);
      arrow([X(m[0]), Y(m[1])], [X(m[0] + sc * v[0]), Y(m[1] + sc * v[1])], "c-warn", dessin);
    });
    [[P1, "1"], [P2, "2"]].forEach(([p, s]) => { P("circle", { cx: X(p[0]), cy: Y(p[1]), r: 5, class: "fill c-label" }, dessin); label([X(p[0]) - 12, Y(p[1]) + 4], s, dessin); });
    const somme = AnaVec.circulation(champ, chemin, n), fine = AnaVec.circulation(champ, chemin, 2000);
    $("nread").textContent = F.num(n, 2);
    $("vsomme").textContent = F.qty(F.fix(somme, 2), "K");
    $("fsomme").textContent = t("plaque.f.somme", { n: F.num(n, 2) });
    if (st.champ === "gradient") {
      const d = T(P2) - T(P1);
      $("vdiff").textContent = F.qty(F.fix(d, 2), "K");
      $("fdiff").textContent = t("plaque.f.diff", { t1: F.fix(T(P1), 1), t2: F.fix(T(P2), 1) });
      $("vecart").textContent = F.qty(F.fix(somme - d, 3), "K");
    } else {
      $("vdiff").textContent = t("plaque.v.aucune");
      $("fdiff").textContent = t("plaque.f.aucune", { fine: F.fix(fine, 1) });
      $("vecart").textContent = F.qty(F.fix(somme - fine, 3), "K");
    }
  }
  [["champ", "champ"], ["chemin", "chemin"]].forEach(([id, k]) => $(id).querySelectorAll("button").forEach(b => b.onclick = () => {
    st[k] = b.dataset.v; $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); draw();
  }));
  $("nsl").oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lagrange", 1773, "idea"], ["green", 1828, "idea"], ["gauss", 1840, "idea"], ["maregraphe", 1885, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["nivellement", "voltmetre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["chemin", "a"], ["boucle", "b"], ["pas", "c"], ["tourbillon", "d"], ["travail", "a"], ["altitude", "b"], ["signe", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 301 });
})();
</script>
</body>
</html>
