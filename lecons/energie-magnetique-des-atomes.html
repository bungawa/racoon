<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes;

/* ---------- les 2j + 1 niveaux en fonction du champ, contre l'agitation thermique ---------- */
(() => {
  const svg = $("niveaux"), sb = $("sb"), st = $("st"), eV = Cst.e, muN = Cst.e * Cst.hbar / (2 * Cst.m_p);
  const OBJETS = {
    electron: { j: 0.5, g: M.PARTICULES.electron.g, o: {} },
    atome: { j: 1.5, g: 4 / 3, o: {} },
    proton: { j: 0.5, g: M.PARTICULES.proton.g, o: { magneton: muN, signe: -1 } },
  };
  const UNITES = [[1, "eV"], [1e-3, "meV"], [1e-6, "µeV"], [1e-9, "neV"], [1e-12, "peV"]];
  let objet = "electron";
  function draw() {
    const B = Math.pow(10, +sb.value), T = Math.pow(10, +st.value), p = OBJETS[objet];
    const niv = M.niveauxMagnetiques(p.j, p.g, B, p.o), dU = M.ecartMagnetique(p.g, B, p.o.magneton), kT = Cst.k_B * T;
    const Umax = Math.max(...niv.map(n => Math.abs(n.U))) / eV, [u, nom] = UNITES.find(x => Umax >= x[0]) || UNITES.at(-1);
    const ymax = 1.25 * Math.max(Umax, Math.min(kT / eV, 3 * Umax)) / u;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 64 }, x: { domain: [0, B], label: t("fig.ax.b") },
      y: { domain: [-ymax, ymax], label: t("fig.ax.u", { u: nom }) } });
    Plot.el("path", { d: Plot.path([[P.x(0), P.y(0)], [P.x(B), P.y(0)]]), class: "stroke thin dash c-label-2" }, svg);
    for (const n of niv) Plot.el("path", { d: Plot.path([[P.x(0), P.y(0)], [P.x(B), P.y(n.U / eV / u)]]), class: "stroke bold c-tint" }, svg);
    const kTu = kT / eV / u;
    if (kTu < ymax) for (const s of [1, -1]) Plot.el("path", { d: Plot.path([[P.x(0), P.y(s * kTu)], [P.x(B), P.y(s * kTu)]]), class: "stroke thin dash c-warn" }, svg);
    $("sbr").textContent = F.si(B, "T", { sig: 2 });
    $("str").innerHTML = F.si(T, "K", { sig: 2 }) + ' <span class="aux">(' + F.si(T - 273.15, "°C", { sig: 4 }) + ")</span>";
    $("ve").textContent = F.si(dU / eV, "eV", { sig: 3 });
    $("fe").textContent = t("fig.f.ecart", { n: niv.length });
    $("vf").textContent = F.si(dU / Cst.h, "Hz", { sig: 3 });
    $("ff").textContent = t("fig.f.freq");
    const r = dU / kT; $("vr").textContent = r >= 0.01 && r < 1000 ? F.num(r, 2) : F.sci(r, 2);
    $("fr").innerHTML = t(dU / kT < 0.1 ? "fig.f.desordre" : dU / kT > 10 ? "fig.f.ordre" : "fig.f.entre", { kT: F.si(kT / eV, "eV", { sig: 2 }) });
  }
  document.querySelectorAll("#objets button").forEach(bt => bt.onclick = () => {
    objet = bt.dataset.o; document.querySelectorAll("#objets button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  sb.oninput = st.oninput = draw; draw();
})();

/* ---------- le système décrit : un spin d'électron, à température ambiante et à froid ---------- */
(() => {
  const g = M.PARTICULES.electron.g, d1 = M.ecartMagnetique(g, 1);
  $("sys1").innerHTML = t("sys1.body", { dU: F.si(d1 / Cst.e, "eV", { sig: 3 }), f: F.si(d1 / Cst.h, "Hz", { sig: 4 }),
    fp: F.si(M.frequencePrecession("electron", 1).f, "Hz", { sig: 4 }), T1: F.kelvin(300), r1: F.sci(M.rapportThermique(g, 1, 300), 2),
    r2: F.num(M.rapportThermique(g, 10, 1), 3), T2: F.kelvin(1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["weiss", 1911, "experiment"], ["lande", 1921, "idea"], ["phillips", 1982, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ralentisseur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["nombre", "b"], ["ecart", "d"], ["electron", "a"], ["precession", "c"], ["thermique", "b"], ["bas", "a"], ["proton", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 348 });
})();
</script>
