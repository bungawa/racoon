<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite;

/* ---------- tourner les axes, ou changer de référentiel : ce qui reste ---------- */
(() => {
  const EVTS = { P: [1, 2], Q: [2, 0.5] };                 // [ct or y, x] in m: P space-like (x > ct), Q time-like
  const svg = $("plan"), sk = $("sk"), seg = $("mode"), segE = $("evt");
  let mode = "lorentz", ev = "P";
  const L = 3, m = v => F.qty(F.num(v, 3), "m"), m2 = v => F.qty(F.num(v, 3), "m²");
  function draw() {
    const k = +sk.value, rot = mode === "rotation", th = k * Math.PI / 270, beta = k / 100;   // θ to ±60°, β to ±0,9
    const [a, x] = EVTS[ev], A = [a, x, 0, 0];
    /* rotation: [., x, y] with y in slot 2; Lorentz: [ct, x] */
    const B = rot ? R.tournerQuadri([0, x, a, 0], th) : R.boostQuadri(A, beta);
    const ap = rot ? B[2] : B[0], xp = B[1];
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 520, h: 520, pad: { l: 44, b: 40, r: 12, t: 12 },
      x: { domain: [-L, L], label: t("fig.xaxis") }, y: { domain: [-L, L], label: t(rot ? "fig.yaxis" : "fig.ctaxis") } });
    const g = P.g, px = (X, Y) => [P.x(X), P.y(Y)];
    Plot.el("line", { x1: P.x(-L), x2: P.x(L), y1: P.y(0), y2: P.y(0), class: "zero" }, g);
    Plot.el("line", { x1: P.x(0), x2: P.x(0), y1: P.y(-L), y2: P.y(L), class: "zero" }, g);
    /* the invariant curve through the event: circle, or the branch of hyperbola */
    let pts;
    if (rot) { const r = Math.hypot(x, a); pts = Array.from({ length: 241 }, (_, i) => { const f = i * Math.PI / 120; return [r * Math.cos(f), r * Math.sin(f)]; }); }
    else {
      const s2 = a * a - x * x;                                // (ct)² − x²
      pts = Array.from({ length: 241 }, (_, i) => { const w = -L + i * L / 120;
        return s2 >= 0 ? [w, Math.sign(a) * Math.sqrt(s2 + w * w)] : [Math.sign(x) * Math.sqrt(-s2 + w * w), w]; });
    }
    pts = pts.filter(([X, Y]) => Math.abs(X) <= L && Math.abs(Y) <= L);
    Plot.el("path", { d: Plot.path(pts.map(([X, Y]) => px(X, Y))), class: "curve" }, g);
    /* the primed axes, and the lines through the event parallel to them: they read off its new components */
    const ex = rot ? [Math.cos(th), Math.sin(th)] : [1, beta], ey = rot ? [-Math.sin(th), Math.cos(th)] : [beta, 1];
    const clip = Plot.el("g", { "clip-path": "url(#cadre)" }, g);
    const defs = Plot.el("defs", {}, svg), cp = Plot.el("clipPath", { id: "cadre" }, defs);
    Plot.el("rect", { x: P.x(-L), y: P.y(L), width: P.x(L) - P.x(-L), height: P.y(-L) - P.y(L) }, cp);
    const ax = Plot.el("g", { class: "c-warn" }, clip);
    [ex, ey].forEach(d => { const s = 2 * L; Plot.el("line", { x1: P.x(-s * d[0]), y1: P.y(-s * d[1]), x2: P.x(s * d[0]), y2: P.y(s * d[1]), class: "stroke" }, ax); });
    const dash = Plot.el("g", { class: "c-label-2" }, clip);
    [ex, ey].forEach(d => { const s = 2 * L; Plot.el("line", { x1: P.x(x - s * d[0]), y1: P.y(a - s * d[1]), x2: P.x(x + s * d[0]), y2: P.y(a + s * d[1]), class: "stroke thin dash" }, dash); });
    Plot.el("circle", { cx: P.x(x), cy: P.y(a), r: 5, class: "dot" }, g);
    /* readouts */
    $("skl").textContent = t(rot ? "fig.theta" : "fig.beta");
    $("skr").textContent = rot ? t("fig.deg", { v: F.num(th * 180 / Math.PI, 3) }) : F.num(beta, 2);
    $("vR").textContent = t(rot ? "fig.comp.y" : "fig.comp.ct", { x: m(x), a: m(a) });
    $("vRp").textContent = t(rot ? "fig.compp.y" : "fig.compp.ct", { x: m(xp), a: m(ap) });
    const diff = v => v[0] * v[0] - v[1] * v[1], sum = v => v[0] * v[0] + v[1] * v[1];
    $("kdiff").innerHTML = t(rot ? "fig.k.diffy" : "fig.k.diffct");
    $("ksum").innerHTML = t(rot ? "fig.k.sumy" : "fig.k.sumct");
    $("vdiff").textContent = m2(diff([xp, ap])); $("fdiff").textContent = t("fig.f.R", { v: m2(diff([x, a])) });
    $("vsum").textContent = m2(sum([xp, ap])); $("fsum").textContent = t("fig.f.R", { v: m2(sum([x, a])) });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
    segE.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.e === ev)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
  segE.querySelectorAll("button").forEach(b => b.onclick = () => { ev = b.dataset.e; draw(); });
  sk.oninput = draw; draw();
})();

/* ---------- le système décrit : un TGV et un éclair à 1 km devant lui ---------- */
(() => {
  const u = 300 / 3.6, c = Constantes.c, b = u / c, x = 1000;
  const E = R.boostQuadri([0, x, 0, 0], b), r = Math.sqrt((1 - b) * (1 + b));   // the strike at t = 0 on the ground, x = 1 km
  const dx = x * b * b / (r * (1 + r));                         // x′ − x = (γ − 1) x, without the cancellation
  $("sys1").innerHTML = t("sys1.body", { u: F.si(u, "m·s⁻¹"), b: F.sci(b, 2), phi: F.sci(R.rapidite(u), 2), b2: F.sci(b * b, 2),
    tp: F.si(E[0] / c, "s"), dx: F.si(dx, "m"), rel: F.sci(b * b / 2, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["einstein", 1905, "idea"], ["poincare", 1905, "idea"], ["minkowski", 1908, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["calcul"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["reste", "c"], ["signe", "a"], ["ajout", "d"], ["vitesse", "b"], ["tgv", "c"], ["equation", "a"], ["temps", "d"], ["figure", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 157 });
})();
</script>
