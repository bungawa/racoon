<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp;

/* the system of « Observer les électrons »: 50 keV electrons, holes 1 µm apart and 0,2 µm wide, screen at 1 m */
const P_E = Q.impulsion(Q.m_e, 50e3 * Q.e), LAMBDA_E = Q.broglie(P_E), FENTES = { lambda: LAMBDA_E, d: 1e-6, a: 0.2e-6, L: 1 };
const DELTA = Q.reculPlaque(P_E, FENTES.d, FENTES.L), INTERFRANGE = Q.interfrangeFentes(LAMBDA_E, FENTES.L, FENTES.d);

/* ---------- the wall on rollers: its momentum known to σp ---------- */
(() => {
  const mur = $("mur"), ecran = $("ecran"), ssp = $("ssp");
  const X = 8e-6, xs = Array.from({ length: 481 }, (_, i) => -X + i * 2 * X / 480);
  const us = Array.from({ length: 401 }, (_, i) => -4 + i * 0.02);                  // wall momentum in units of Δ
  function draw() {
    const r = Math.pow(10, +ssp.value), w = Q.plaqueHeisenberg(r * DELTA, DELTA);
    /* the two recoil distributions of the wall, means ∓Δ/2, standard deviation σp, in units of Δ */
    mur.innerHTML = "";
    const g = (u, m) => Math.exp(-((u - m) ** 2) / (2 * r * r)) / (r * Math.sqrt(2 * Math.PI));
    const top = 1.1 * g(0.5, 0.5);
    const A = Plot.axes(mur, { fmt: F, w: 640, h: 180, pad: { l: 56, b: 40 }, x: { domain: [-4, 4], label: t("fig.xaxis.mur") }, y: { domain: [0, top], label: t("fig.yaxis.mur"), fmt: () => "" } });
    Plot.el("path", { d: Plot.path(us.map(u => [A.x(u), A.y(g(u, 0.5))])), class: "curve" }, A.g);
    Plot.el("path", { d: Plot.path(us.map(u => [A.x(u), A.y(g(u, -0.5))])), class: "stroke c-warn" }, A.g);
    /* the screen: fringes smeared by the random position of the wall */
    ecran.innerHTML = "";
    const P = Plot.axes(ecran, { fmt: F, w: 640, h: 200, pad: { l: 56, b: 40 }, x: { domain: [-8, 8], label: t("fig.xaxis") }, y: { domain: [0, 4.2], label: t("fig.yaxis") } });
    const pts = xs.map(x => Q.probaAvecTemoin(x, FENTES, w.V));
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x * 1e6), P.y(pts[i].somme)])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x * 1e6), P.y(pts[i].P)])), class: "curve" }, P.g);
    $("sspr").textContent = t("fig.f.sp", { r: F.num(r, 2), s: F.qty(F.sci(r * DELTA, 2), "kg·m·s⁻¹") });
    $("vj").textContent = F.qty(F.num(100 * w.Pjuste, 3), "%");
    $("fj").textContent = t("fig.f.juste", { d: F.num(w.D, 2) });
    $("vv").textContent = F.num(w.V, 2);
    $("fv").textContent = t("fig.f.v", { r: F.num(w.recouvrement, 2) });
    $("vx").textContent = F.num(w.sigmaX / INTERFRANGE, 2);
    $("fx").textContent = t("fig.f.sx", { s: F.si(w.sigmaX, "m") });
  }
  ssp.oninput = draw; draw();
})();

/* ---------- the system described: an electron, a wall of one gram, a single atom ---------- */
(() => {
  const M = 1e-3, w = Q.plaqueHeisenberg(DELTA / 4, DELTA);
  $("sys1").innerHTML = t("sys1.body", { p: F.qty(F.sci(P_E, 3), "kg·m·s⁻¹"), D: F.qty(F.sci(DELTA, 2), "kg·m·s⁻¹"), sp: F.qty(F.sci(DELTA / 4, 2), "kg·m·s⁻¹"),
    sx: F.si(w.sigmaX, "m"), i: F.si(INTERFRANGE, "m"), dv: F.qty(F.sci(DELTA / 4 / M, 1), "m·s⁻¹") });
  $("sys2").innerHTML = t("sys2.body", { le: F.si(LAMBDA_E, "m"), ang: F.sci(LAMBDA_E / FENTES.a, 2), r: F.sci(Q.h / (FENTES.a * P_E), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["heisenberg", 1927, "idea"], ["kennard", 1927, "idea"], ["ustc", 2025, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ligo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["enonce", "b"], ["recul", "c"], ["flou", "a"], ["compromis", "d"], ["facteur", "b"], ["mur", "c"], ["protege", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 378 });
})();
</script>
