<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, NA = Constantes.N_A;
const pct = x => F.qty(F.num(100 * x, 3), "%");

/* ---------- le système décrit : la distance entre molécules et la taille d'une molécule de sucre contre λ ---------- */
(() => {
  const lambda = 589e-9, eau = M.SACCHAROSE.lignes[0], c1 = M.concentrations(0, eau.rho).c1;
  const d = Math.cbrt(1 / (NA * c1)), v2 = M.SACCHAROSE.M2 / 1587 / NA, a = Math.cbrt(v2);   // crystal 1587 kg·m⁻³
  $("sys1").innerHTML = t("sys1.body", { c1: F.qty(F.num(c1 / 1000, 3), "kmol·m⁻³"), d: F.si(d, "m", { prefix: "n" }),
    r: F.num(lambda / d, 2), a: F.si(a, "m", { prefix: "n" }), ra: F.num(lambda / a, 2) });
})();

/* ---------- le test de Feynman : α du sucre déduit à chaque concentration, selon trois règles ---------- */
(() => {
  const R = { ll: M.regleMelange("ll"), gd: M.regleMelange("gladstoneDale"), sans: M.regleMelange("sansChampLocal") };
  const CLS = { ll: "c-tint", gd: "c-warn", sans: "c-label-2" }, trace = $("trace"), sw = $("sw");
  const rows = R.ll.lignes;
  function draw() {
    const i = +sw.value, l = rows[i], k = M.concentrations(l.w, l.rho);
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, 80], label: t("fig.xaxis") }, y: { domain: [-2, 2], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(80), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("line", { x1: P.x(100 * l.w), x2: P.x(100 * l.w), y1: P.y(-2), y2: P.y(2), class: "stroke thin dash c-label-2" }, P.g);
    for (const [id, r] of Object.entries(R)) {
      const pts = r.lignes.filter(x => x.a2 != null).map(x => [P.x(100 * x.w), P.y(100 * (x.a2 / r.a2 - 1))]);
      Plot.el("path", { d: Plot.path(pts), class: "stroke " + CLS[id] }, P.g);
      pts.forEach(([x, y]) => Plot.el("circle", { cx: x, cy: y, r: 3.5, class: "fill " + CLS[id] }, P.g));
    }
    $("swr").textContent = pct(l.w);
    $("vc").textContent = F.qty(F.num(k.c2 / 1000, 3), "kmol·m⁻³");
    $("fc").textContent = t("fig.f.c", { c1: F.qty(F.num(k.c1 / 1000, 3), "kmol·m⁻³"), rho: F.qty(F.num(l.rho, 6), "kg·m⁻³") });
    $("va2").textContent = F.qty(F.num(1e6 * rows[i].a2, 4), "cm³·mol⁻¹");
    $("fa2").textContent = t("fig.f.a2", { e: F.num(100 * (rows[i].a2 / R.ll.a2 - 1), 2) });
    $("vn").textContent = F.num(R.ll.lignes[i].nPredit, 6);
    $("fn").textContent = t("fig.f.n", { n: F.num(l.n, 6), gd: F.num(R.gd.lignes[i].nPredit, 6), sans: F.num(R.sans.lignes[i].nPredit, 6) });
  }
  sw.oninput = draw; draw();
  $("s3p2").innerHTML = t("s3.p2", { ll: F.num(100 * R.ll.ecartA2, 2), gd: F.num(100 * R.gd.ecartA2, 2), sans: F.num(100 * R.sans.ecartA2, 2),
    nll: F.sci(R.ll.ecartN, 1), ngd: F.sci(R.gd.ecartN, 1), nsans: F.sci(R.sans.ecartN, 1),
    r: F.qty(F.num(1e6 * M.polarisabilite(R.ll.a2).refractionMolaire, 3), "cm³·mol⁻¹"), alpha: F.qty(F.sci(M.polarisabilite(R.ll.a2).alpha, 2), "m³") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gladstone", 1858, "experiment"], ["abbe", 1874, "experiment"], ["icumsa", 1897, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["mout"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["moyenne", "c"], ["champ", "a"], ["test", "d"], ["constant", "b"], ["dilue", "a"], ["concentration", "c"], ["metal", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 325 });
})();
</script>
