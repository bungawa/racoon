<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/quantique-deux-etats.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- two states E1, E2 = E1 + hν mixed equally, every energy shifted by A: the beat cos²(πνt) does not see A ---------- */
(() => {
  const snu = $("snu"), sA = $("sA"), EV = Constantes.e, E1 = 0;
  function draw() {
    const nu = +snu.value * 1e9, A = +sA.value * EV, dE = Q.h * nu, svg = $("battement"); svg.innerHTML = "";
    const T = 1 / nu, ax = Plot.axes(svg, { fmt: F, w: 640, h: 240, x: { domain: [0, 3], label: t("fig.ax.t") }, y: { domain: [0, 1], label: t("fig.ax.p") } });
    const xs = Array.from({ length: 301 }, (_, k) => k * 0.01);
    /* t in units of 1/ν; the module's phases are computed exactly, then the common phase drops out of |…|² */
    Plot.el("path", { d: Plot.path(xs.map(x => [ax.x(x), ax.y(Q.battement(E1 + A, E1 + dE + A, x * T))])), class: "stroke c-tint", fill: "none" }, svg);
    $("snur").textContent = F.si(nu, "Hz"); $("sAr").textContent = F.num(+sA.value, 2) + "\u00a0eV";
    $("vde").textContent = F.si(dE, "J"); $("fde").textContent = t("fig.f.de", { v: F.sci(dE / EV, 3) });
    $("vper").textContent = F.si(T, "s");
    $("vph").textContent = F.si(Math.abs(A) / Q.h, "Hz"); $("fph").textContent = t("fig.f.ph");
  }
  snu.oninput = sA.oninput = draw; draw();
  const M = 133 * Q.u, f0 = M * Constantes.c ** 2 / Q.h, nuCs = 9192631770;
  $("sys1").innerHTML = t("sys1.body", { f: F.sci(f0, 3), r: F.sci(f0 / nuCs, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ramsey", 1950, "experiment"], ["essen", 1955, "experiment"], ["seconde", 1967, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["horloge"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["module", "c"], ["zero", "a"], ["deux", "d"], ["frequence", "b"], ["excite", "c"], ["masse", "d"], ["mesure", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 701 });
})();
</script>
