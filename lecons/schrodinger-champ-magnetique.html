<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, eV = Constantes.e, K = 1 * eV, B0 = 0.3e-9;   // hopping 1 eV, atoms 0,3 nm apart
(() => {
  const svg = $("spec"), sf = $("sf"), sn = $("sn");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [-1.5, 1.5], label: t("fig.x") }, y: { domain: [-2.2, 2.2], label: t("fig.y") } });
  const lines = Plot.el("g", {}, g), mk = Plot.el("line", { y1: y(-2.2), y2: y(2.2), class: "stroke c-warn" }, g), dots = Plot.el("g", {}, g);
  function draw() {
    const N = +sn.value, phi = +sf.value / 100, o = { E0: 0, K };
    lines.replaceChildren(); dots.replaceChildren();
    for (let j = -N; j < 2 * N; j++) { const P = [];
      for (let i = 0; i <= 120; i++) { const f = -1.5 + 3 * i / 120; P.push([x(f), y(-2 * Math.cos(2 * Math.PI * (j - f) / N))]); }
      Plot.el("path", { d: Plot.path(P), class: "stroke thin c-label-2" }, lines); }
    const E = Q.niveauxAnneauFlux(N, o, phi), j0 = E.indexOf(Math.min(...E));
    E.forEach(e => Plot.el("circle", { cx: x(phi), cy: y(e / K), r: 4, class: "dot c-tint" }, dots));
    mk.setAttribute("x1", x(phi)); mk.setAttribute("x2", x(phi));
    /* at half-integer flux two ground states of opposite currents cross: show their mean, zero */
    const demi = Math.abs(Math.abs(phi - Math.round(phi)) - 0.5) < 1e-9;
    const I = demi ? 0 : -Constantes.e * Q.courantAnneauFlux(N, o, phi, j0), R = N * B0 / (2 * Math.PI), Phi = phi * Constantes.h / Constantes.e;
    $("sfr").textContent = t("fig.v.phi", { p: F.num(phi, 3) }); $("snr").textContent = String(N);
    $("ve").textContent = F.qty(F.num(E[j0] / eV, 4), "eV");
    $("fe").textContent = t("fig.f.e", { j: j0 });
    $("vi").textContent = F.si(I, "A");
    $("fi").textContent = Math.abs(phi - Math.round(phi)) < 1e-9 || Math.abs(Math.abs(phi - Math.round(phi)) - 0.5) < 1e-9 ? t("fig.f.i0") : t("fig.f.i");
    $("vb").textContent = F.si(Phi / (Math.PI * R * R), "T");
    $("fb").textContent = t("fig.f.b", { r: F.si(R, "m"), f: F.sci(Phi, 3) });
  }
  sf.oninput = sn.oninput = draw; draw();
  $("sys1").innerHTML = t("sys.body", { b: F.si(B0, "m"), K: F.qty("1", "eV"), he: F.sci(Constantes.h / Constantes.e, 3), B: F.si(Constantes.h / Constantes.e / (Math.PI * (6 * B0 / (2 * Math.PI)) ** 2), "T") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["peierls", 1933, "idea"], ["ab", 1959, "idea"], ["hofstadter", 1976, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["anneaux"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["potentiel", "b"], ["phase", "a"], ["jauge", "c"], ["periode", "d"], ["continu", "a"], ["courant", "b"], ["champnul", "c"], ["masse", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 211 });
})();
</script>
