<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
const DEG = 180 / Math.PI, X = [1, 0, 0], Y = [0, 1, 0], Z = [0, 0, 1];

/* ---------- deux rotations finies d'angle α, autour de x puis de y, et l'inverse ---------- */
(() => {
  const P = Plot.el, svg = $("dessus");
  /* the gaps over the whole range, for the chart: computed once */
  const AS = Array.from({ length: 61 }, (_, i) => 0.5 * Math.pow(180, i / 60));          // 0,5° to 90°
  const G = AS.map(a => RotEsp.ordreRotations(X, Y, a / DEG));
  const ch = $("ecarts");
  const { x: Xc, y: Yc, g } = Plot.axes(ch, { fmt: F, w: 640, h: 280, pad: { b: 44 },
    x: { domain: [0.5, 100], scale: "log", label: t("ch.x") }, y: { domain: [1e-3, 1000], scale: "log", label: t("ch.y") } });
  const line = (arr, cls) => P("path", { d: arr.map((v, i) => (i ? "L" : "M") + Xc(AS[i]).toFixed(1) + " " + Yc(Math.max(v, 1e-3)).toFixed(1)).join(""), class: cls }, g);
  line(G.map(q => q.ordre * DEG), "curve");
  line(G.map(q => q.somme * DEG), "ref");
  line(AS.map(a => (a / DEG) ** 2 * DEG), "zero");
  const dots = P("g", {}, g);

  function upd() {
    const a = +$("al").value, r = a / DEG;
    $("alv").textContent = F.qty(F.num(a, 3), "°");
    const Rx = AlgVec.rotation(X, r), Ry = AlgVec.rotation(Y, r);
    const xy = AlgVec.appliquer(Ry, AlgVec.appliquer(Rx, Z)), yx = AlgVec.appliquer(Rx, AlgVec.appliquer(Ry, Z));
    const un = AlgVec.appliquer(AlgVec.rotation([1, 1, 0], r * Math.SQRT2), Z);
    const o = RotEsp.ordreRotations(X, Y, r);
    $("vordre").textContent = F.qty(F.num(o.ordre * DEG, 3), "°");
    $("fordre").textContent = t("sim.f.ordre", { p: F.qty(F.num(r * r * DEG, 3), "°"), q: F.num(o.ordre / (r * r), 3) });
    $("vsomme").textContent = F.qty(F.num(o.somme * DEG, 3), "°");
    $("fsomme").textContent = t("sim.f.somme", { p: F.qty(F.num(r * r * DEG / 2, 3), "°"), q: F.num(o.somme / (r * r), 3) });
    /* top view: where the tip of the vertical unit vector ends up, seen from above */
    svg.innerHTML = "";
    const cx = 320, cy = 150, K = 120, gg = P("g", {}, svg);
    P("circle", { cx, cy, r: K, class: "stroke thin c-label-2" }, gg);
    P("line", { x1: cx - K - 10, y1: cy, x2: cx + K + 10, y2: cy, class: "stroke thin c-label-2" }, gg);
    P("line", { x1: cx, y1: cy + K + 10, x2: cx, y2: cy - K - 10, class: "stroke thin c-label-2" }, gg);
    P("text", { x: cx + K + 14, y: cy + 4 }, gg).textContent = t("fig.x");
    P("text", { x: cx + 4, y: cy - K - 14 }, gg).textContent = t("fig.y");
    P("circle", { cx, cy, r: 3, class: "fill c-label-2" }, gg);
    [[xy, "c-tint", "fill"], [yx, "c-warn", "fill"], [un, "c-ok", "stroke"]].forEach(([v, c, kind]) => {
      P("line", { x1: cx, y1: cy, x2: cx + K * v[0], y2: cy - K * v[1], class: "stroke thin " + c }, gg);
      P("circle", { cx: cx + K * v[0], cy: cy - K * v[1], r: kind === "fill" ? 5 : 8, class: kind + " " + c }, gg);
    });
    const g2 = P("g", {}, svg);
    P("text", { x: 16, y: 24 }, g2).textContent = t("fig.titre");
    dots.innerHTML = "";
    P("circle", { cx: Xc(a), cy: Yc(o.ordre * DEG), r: 5, class: "dot" }, dots);
    P("circle", { cx: Xc(a), cy: Yc(Math.max(o.somme * DEG, 1e-3)), r: 5, class: "dot" }, dots);
  }
  $("al").oninput = upd; upd();
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["rigide", "galileen", "interieur"], items = textOf("sys.items", IDS);
  const rho = 7850, E = 2.1e11, v = 0.1 * 1000;                  // acier ; disque de 10 cm de rayon à 1 000 rad/s
  const vals = { def: F.sci(rho * v * v / E, 1), cor: F.sci(Constantes.Omega_E, 2) };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, vals) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["euler", 1776, "idea"], ["rodrigues", 1840, "idea"], ["iphone", 2010, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gyrometre"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["vitesse", "c"], ["sens", "a"], ["ordre", "d"], ["petit", "b"], ["terre", "c"], ["puissance", "a"], ["interieur", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2002 });
})();
</script>
