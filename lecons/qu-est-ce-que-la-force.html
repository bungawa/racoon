<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS2 = "m·s⁻²";
const pct = r => r >= 0.01 ? F.qty(F.num(r * 100, 3), "%") : F.sci(r, 2);

/* ---------- le système décrit, chiffré ---------- */
$("sys").innerHTML = t("sys.body", Dyna.chiffres("chute", F));

/* ---------- le poids avec l'altitude : jusqu'où g est-il constant ? ---------- */
(() => {
  const svg = $("gh"), H0 = 1, H1 = 4e8, Y0 = 1e-7, Y1 = 1;
  const { x: X, y: Y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 60 }, x: { scale: "log", domain: [H0, H1], label: t("gh.x") }, y: { scale: "log", domain: [Y0, Y1], label: t("gh.y") } });
  const path = (fn, cls) => { let d = ""; for (let i = 0; i <= 200; i++) { const h = H0 * Math.pow(H1 / H0, i / 200), v = Math.min(Math.max(fn(h), Y0), Y1); d += (i ? "L" : "M") + X(h).toFixed(1) + " " + Y(v).toFixed(1); } Plot.el("path", { d, class: cls }, g); };
  path(Dyna.ecartUniforme, "curve"); path(h => 2 * h / Dyna.RT, "ref");
  const one = Plot.el("line", { x1: X(H0), x2: X(H1), y1: Y(0.01), y2: Y(0.01), class: "zero" }, g);
  Plot.el("text", { x: X(H0) + 6, y: Y(0.01) - 6, class: "note" }, g).textContent = t("gh.one");
  const dot = Plot.el("circle", { r: 6, class: "dot" }, g), hsl = $("hsl");
  function upd() {
    const h = Math.pow(10, +hsl.value), e = Dyna.ecartUniforme(h), gh = Dyna.pesanteur(h);
    dot.setAttribute("cx", X(h)); dot.setAttribute("cy", Y(Math.max(e, Y0)));
    $("hread").textContent = F.si(h, "m");
    $("vg").textContent = F.qty(F.num(gh, 4), MS2);
    $("fg").textContent = t("gh.f.g", { p: F.num(gh / Dyna.pesanteur(0) * 100, 3) });
    $("verr").textContent = pct(e);
    $("flin").textContent = t("gh.f.lin", { e: pct(2 * h / Dyna.RT) });
  }
  hsl.oninput = upd; upd();
})();

/* ---------- le ressort : la force dépend de la position ---------- */
(() => {
  const svg = $("spr"), P = Plot.el, M = 0.5, WALL = 40, EQ = 320, K = 12, Y = 90;     // 1 cm = 12 px
  const arrow = (x1, y1, x2, y2, cls, parent) => Plot.fleche(parent, [x1, y1], [x2, y2], { cls, tete: 10 });
  const label = (x, y, key, anchor) => { const e = P("text", { x, y, "text-anchor": anchor || "middle" }, svg); e.textContent = t(key); };
  const xsl = $("xsl"), ksl = $("ksl");
  function draw() {
    svg.innerHTML = "";
    const xcm = +xsl.value, k = +ksl.value, f = Dyna.ressort(k, xcm / 100), a = f / M, B = EQ + K * xcm;
    P("line", { x1: WALL, y1: 30, x2: WALL, y2: 130, class: "stroke bold c-label-2" }, svg);
    P("line", { x1: WALL, y1: 130, x2: 620, y2: 130, class: "stroke thin c-label-2" }, svg);
    P("line", { x1: EQ, y1: 24, x2: EQ, y2: 136, class: "stroke thin dash c-label-2" }, svg);
    label(EQ, 18, "spr.eq");
    /* spring: 12 coils between the wall and the block */
    const x0 = WALL, x1 = B - 30, n = 24; let d = `M${x0} ${Y}`;
    for (let i = 1; i < n; i++) d += ` L${(x0 + (x1 - x0) * i / n).toFixed(1)} ${Y + (i % 2 ? -12 : 12)}`;
    d += ` L${x1.toFixed(1)} ${Y}`;
    P("path", { d, class: "stroke c-label" }, svg);
    P("rect", { x: B - 30, y: Y - 30, width: 60, height: 60, rx: 6, class: "stroke c-label" }, svg);
    label(B, Y + 5, "spr.m");
    if (f) { arrow(B, Y - 44, B + f * 30, Y - 44, "c-warn bold", svg); label(B + f * 15, Y - 52, "spr.flabel"); }          // 1 N = 30 px
    if (xcm) { arrow(EQ, 146, B, 146, "c-label-2", svg); label((EQ + B) / 2, 162, "spr.xlabel"); }
    $("xread").textContent = F.qty(F.num(xcm / 100, 2), "m");
    $("kread").textContent = F.qty(k, "N·m⁻¹");
    $("vf").textContent = F.qty(F.num(f, 3), "N");
    $("fdir").textContent = t(f > 0 ? "spr.f.right" : f < 0 ? "spr.f.left" : "spr.f.zero");
    $("va").textContent = F.qty(F.num(a, 3), MS2);
    $("fga").textContent = t("spr.f.m");
  }
  xsl.oninput = ksl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hooke", 1678, "idea"], ["newton", 1687, "idea"], ["cavendish", 1798, "experiment"], ["grace", 2002, "use"], ["microscope", 2016, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["balance", "orbite"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cause", "a"], ["ma", "a"], ["chute", "a"], ["altitude", "a"], ["ressort", "a"], ["constante", "a"], ["orbite", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 94 });
})();
</script>
