<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, c = Constantes.c;

/* ---------- l'éclair au milieu du vaisseau, dans le diagramme d'espace-temps du sol ---------- */
(() => {
  const svg = $("diagramme"), sb = $("sb"), st = $("st"), L0 = 300;           // the ship: 300 m at rest
  const W = 640, H = 330, pad = { l: 64, r: 16, t: 12, b: 44 }, kx = (W - pad.l - pad.r) / (H - pad.t - pad.b);
  const us = v => F.si(v, "s", { prefix: "µ", sig: 3 });
  function draw() {
    const b = +sb.value, u = b * c, e = R.eclairMilieu(L0, u), L = e.L;
    /* equal scales on x and ct, so that light runs at 45°; the box holds both arrivals with a margin */
    const top = 1.25 * Math.max(c * e.avant.t, c * e.arriere.t, L0 / 2), D = top * kx / 2;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: W, h: H, pad, x: { domain: [-D, D], label: t("fig.xaxis") }, y: { domain: [0, top], label: t("fig.yaxis") } });
    const pt = (x, ct) => [P.x(x), P.y(ct)];
    /* the world lines of the two ends, x = ∓L/2 + β ct */
    [-1, 1].forEach(s => Plot.el("path", { d: Plot.path([pt(s * L / 2, 0), pt(s * L / 2 + b * top, top)]), class: "stroke bold c-label-2" }, P.g));
    /* the two light signals from the midpoint, up to each end */
    Plot.el("path", { d: Plot.path([pt(e.arriere.x, c * e.arriere.t), pt(0, 0), pt(e.avant.x, c * e.avant.t)]), class: "stroke bold c-tint" }, P.g);
    /* the ship's line of simultaneity through both arrivals, slope β in these axes */
    const ctAt = x => c * e.arriere.t + b * (x - e.arriere.x);
    let x1 = -D, x2 = D;
    if (b !== 0) { const xa = e.arriere.x - c * e.arriere.t / b, xb = e.arriere.x + (top - c * e.arriere.t) / b; x1 = Math.max(-D, Math.min(xa, xb)); x2 = Math.min(D, Math.max(xa, xb)); }
    Plot.el("path", { d: Plot.path([pt(x1, ctAt(x1)), pt(x2, ctAt(x2))]), class: "stroke dash c-warn" }, P.g);
    [e.arriere, e.avant].forEach(a => Plot.el("circle", { cx: P.x(a.x), cy: P.y(c * a.t), r: 5, class: "dot" }, P.g));
    /* one instant of the ground, chosen by the slider */
    const ct = +st.value * top, tt = ct / c;
    Plot.el("line", { x1: P.x(-D), x2: P.x(D), y1: P.y(ct), y2: P.y(ct), class: "stroke thin c-label-2" }, P.g);
    /* each clock is set to zero when the flash reaches it, then runs at 1/γ of the ground's rate */
    const g = R.gamma(u), lit = (a) => tt >= a.t ? us((tt - a.t) / g) : t("fig.attente");
    $("sbr").textContent = t("fig.bv", { b: F.num(b, 2), g: F.num(g, 4) });
    $("str").textContent = us(tt);
    $("vecart").textContent = F.si(e.ecart, "s", { prefix: "µ", sig: 3 });
    $("fecart").textContent = t("fig.f.ecart", { L: F.si(L, "m", { prefix: "", sig: 3 }) });
    $("var").textContent = lit(e.arriere);
    $("vav").textContent = lit(e.avant);
    $("fav").textContent = t("fig.f.av", { d: us(u * L0 / (c * c)) });
  }
  sb.oninput = st.oninput = draw; draw();
})();

/* ---------- le système décrit : un train ---------- */
(() => {
  const L0 = 300, v = 90, e = R.eclairMilieu(L0, v);
  $("sys1").innerHTML = t("sys1.body", { b: F.sci(v / c, 2), d: F.si(e.ecart, "s", { prefix: "f", sig: 2 }), tl: F.si(L0 / c, "s", { prefix: "µ", sig: 3 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lorentz", 1895, "idea"], ["poincare", 1898, "idea"], ["einstein", 1905, "idea"], ["sagnac", 1985, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  /* uses.temps: around the equator, light-signal synchronisation in the rotating frame misses by 2ΩA/c², A = πR², 207 ns */
  const USES = ["temps"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["milieu", "a"], ["memelieu", "c"], ["calcul", "b"], ["lecture", "d"], ["causal", "a"], ["quotidien", "c"], ["reciproque", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 156 });
})();
</script>
