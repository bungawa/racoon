<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, { R } = Constantes;

/* ---------- γ(T) : la vibration gelée, puis libérée ---------- */
(() => {
  const D = S.DIATOMIQUES, IDS = Object.keys(D), noms = textOf("gam.noms", IDS), svg = $("gam"), niv = $("niv"), sg = $("gz"), sl = $("tl");
  sg.innerHTML = IDS.map(k => `<option value="${k}">${noms[k]}</option>`).join(""); sg.value = "O2";
  const T0 = 100, T1 = 3000, Tde = s => T0 * Math.pow(T1 / T0, s), NIV = 6;
  function draw() {
    const gz = sg.value, d = D[gz], T = Tde(+sl.value), x = d.thetaV / T, g = S.gammaDiatomique(gz, T);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { domain: [T0, T1], scale: "log", label: t("gam.x"), fmt: v => F.num(v, 3) }, y: { domain: [1.25, 1.45], label: t("gam.y"), fmt: y => F.fix(y, 2) } });
    for (const gr of [1.4, 9 / 7]) Plot.el("line", { x1: o.x(T0), x2: o.x(T1), y1: o.y(gr), y2: o.y(gr), class: "ref" }, o.g);
    const pts = []; for (let i = 0; i <= 200; i++) { const Ti = Tde(i / 200); pts.push([o.x(Ti), o.y(S.gammaDiatomique(gz, Ti).gamma)]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold c-tint" }, o.g);
    for (const [Ti, cp] of d.cp) Plot.el("circle", { cx: o.x(Ti), cy: o.y(cp / (cp - R)), r: 4.5, class: "fill c-label" }, o.g);
    const tb = S.GAMMA_MES[gz]; if (tb) Plot.el("circle", { cx: o.x(tb.T), cy: o.y(tb.gamma), r: 5, class: "fill c-warn" }, o.g);
    Plot.el("line", { x1: o.x(T), x2: o.x(T), y1: o.y(1.25), y2: o.y(1.45), class: "stroke thin dash c-label" }, o.g);
    /* les populations des premiers niveaux, (40.11) */
    niv.innerHTML = "";
    const p = S.niveaux(x, NIV), q = Plot.axes(niv, { fmt: F, w: 640, h: 170, pad: { b: 40, l: 56 },
      x: { domain: [-0.5, NIV - 0.5], label: t("niv.x"), ticks: NIV, fmt: v => F.num(v, 1) }, y: { domain: [0, 1], label: t("niv.y"), fmt: y => F.fix(y, 1) } });
    p.forEach((w, k) => Plot.el("rect", { x: q.x(k - 0.35), y: q.y(w), width: q.x(0.35) - q.x(-0.35), height: q.y(0) - q.y(w), class: "fill c-tint" }, q.g));
    $("tlv").innerHTML = F.kelvin(T);
    $("vth").textContent = F.qty(F.num(d.thetaV, 4), "K");
    $("vx").textContent = F.num(1 / x, 3);
    $("fx").textContent = t("gam.f.x", { x: F.num(x, 3) });
    $("vp").textContent = p[1] / p[0] > 1e-3 ? F.num(p[1] / p[0], 3) : F.sci(p[1] / p[0], 2);
    $("vc").textContent = F.num(S.cVib(d.thetaV, T), 3);
    $("vg").textContent = F.fix(g.gamma, 3);
    $("fg").textContent = t("gam.f.g", { cv: F.num(g.cv, 3) });
    $("sys").innerHTML = t("sys.inner", { gaz: noms[gz], T: F.kelvin(T), rot: F.num(T / d.thetaR, 3),
      avis: t(T / d.thetaR > 5 ? "sys.rot.ok" : "sys.rot.ko"), kT: F.si(Constantes.k_B * T / Constantes.e, "eV", { sig: 2 }) });
  }
  sg.onchange = sl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1875, "idea"], ["einstein", 1907, "idea"], ["eucken", 1912, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cars"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["gel", "b"], ["raide", "d"], ["electrons", "a"], ["iode", "c"], ["froid", "b"], ["chaud", "a"], ["rapport", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 406 });
})();
</script>
