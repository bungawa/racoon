<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m);
const $ = id => document.getElementById(id);
const M = MagInd, P = Charge.PARTICULES, e = Constantes.e, C = Constantes.c;
const nrm = a => Math.hypot(a[0], a[1], a[2]);

/* ---------- le système décrit : électron au repos dans 1 MV/m ---------- */
(() => {
  const el = P.electron, E = 1e6, s = M.champEUniforme(el.q, el.m, -E, [0, 0, 0]);
  const r = M.rayonnementLineaire(el.q, el.m, E).rapport, pE = Charge.negligeables({ q: el.q, m: el.m, v: 0, E }).poidsE;
  const d = 0.01, u = Math.sqrt((1 + d / s.L) ** 2 - 1), v1 = Math.abs(s.vel(u * s.tau)[0]) / C, vn1 = Math.sqrt(2 * e * E * d / el.m) / C;
  $("val-loi").innerHTML = t("val.loi", { r: F.sci(r, 1), pE: F.sci(pE, 1) });
  $("val-hyper").innerHTML = t("val.hyper", { tau: F.si(s.tau, "s"), L: F.si(s.L, "m") });
  $("sys").innerHTML = t("sys.body", { tau: F.si(s.tau, "s"), v1: F.num(v1, 3), vn1: F.num(vn1, 3), e1: F.num((vn1 / v1 - 1) * 100, 2), r: F.sci(r, 1), pE: F.sci(pE, 1) });
})();
F.autoTypo(document.querySelector("main"));

/* ---------- entrer de côté : chaînette exacte et parabole de Newton ---------- */
(() => {
  const svg = $("chn"), El = Plot.el, W = 640, H = 300, pad = { l: 56, r: 16, t: 12, b: 40 };
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  let nom = "electron";
  function draw() {
    const p = P[nom], E = Math.pow(10, +$("cE").value), ec = Math.pow(10, +$("cK").value) * e, k = Math.pow(10, +$("ct").value);
    const g0 = 1 + ec / (p.m * C * C), v0 = C * Math.sqrt(1 - 1 / (g0 * g0));
    const s = M.champEUniforme(p.q, p.m, Math.sign(p.q) * E, [0, v0, 0]), T = k * s.tau, N = 240;
    const ex = [], nw = [];
    for (let i = 0; i <= N; i++) { const tt = T * i / N; const a = s.pos(tt), b = s.newton.pos(tt); ex.push([a[1], a[0]]); nw.push([b[1], b[0]]); }
    const all = ex.concat(nw), span = Math.max(...all.map(q => q[0] / pw), ...all.map(q => q[1] / ph)) * 1.05 || 1;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: W, h: H, pad, x: { domain: [0, span * pw], label: t("fig.x") }, y: { domain: [0, span * ph], label: t("fig.y") } });
    const line = (pts, cls) => El("path", { d: Plot.path(pts.map(q => [x(q[0]), y(q[1])])), class: cls }, g);
    line(nw, "stroke c-label-2 dash"); line(ex, "stroke c-tint");
    const vf = s.vel(T), vn = s.newton.vel(T);
    $("cEo").textContent = F.si(E, "V·m⁻¹");
    $("cKo").textContent = F.si(ec / e, "eV");
    $("cto").textContent = F.si(T, "s");
    $("vt").textContent = F.num(k, 3); $("ft").textContent = t("fig.f.t", { tau: F.si(s.tau, "s") });
    $("vv").textContent = F.num(nrm(vf) / C, 4); $("fv").textContent = t("fig.f.v", { vn: F.num(nrm(vn) / C, 4) });
    $("vvy").textContent = F.num(vf[1] / v0, 4);
    $("vg").textContent = F.num(s.gamma(T), 4); $("fg").textContent = t("fig.f.g", { g0: F.num(g0, 4) });
  }
  document.querySelectorAll("[data-p]").forEach(btn => btn.onclick = () => {
    nom = btn.dataset.p; document.querySelectorAll("[data-p]").forEach(b => b.setAttribute("aria-pressed", String(b === btn))); draw();
  });
  ["cE", "cK", "ct"].forEach(id => $(id).oninput = draw); draw();
})();

/* ---------- rigidité : deux cas chiffrés ---------- */
(() => {
  const ROWS = ["lhc", "terre"], txt = textOf("rig.items", ROWS);
  const lhc = M.rigidite(P.proton.q, P.proton.m, 7e12 * e), el = M.rigidite(P.electron.q, P.electron.m, 1e6 * e);
  const pN = Math.sqrt(2 * P.electron.m * 1e6 * e);
  const vals = {
    lhc: { Br: F.num(lhc.Brho, 3), B: F.num(lhc.Brho / 2803.95, 3), f: F.num(2 * Math.PI * 2803.95 / 26659 * 100, 2) },
    terre: { Br: F.sci(el.Brho, 3), R: F.num(el.Brho / 5e-5, 3), r1: F.num(el.Brho * 1e3, 3), e: F.num((1 - pN / el.p) * 100, 2) },
  };
  $("rig").innerHTML = ROWS.map(id => `<div><span class="k">${txt[id].k}</span><span>${fill(txt[id].text, vals[id])}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kaufmann", 1901, "experiment"], ["bucherer", 1908, "experiment"], ["bertozzi", 1964, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(x => x[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lhc"], uses = textOf("uses.items", USES), R = M.rigidite(P.proton.q, P.proton.m, 7e12 * e).Brho / 8.33;
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${fill(uses[id].text, { R: F.num(R, 4) })}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["plafond", "a"], ["tau", "b"], ["vy", "c"], ["forme", "d"], ["rigidite", "b"], ["newton", "c"], ["norme", "b"], ["rayonnement", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 291 });
})();
</script>
