<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-thermo" data-i18n="monde.thermo"></a><span class="aux">›</span><a href="/racoon/etape?id=entropie-energie-interne" data-i18n="etape.entropie-energie-interne"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-thermo" href="/racoon/atlas?piste=thermo" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/temperature-thermodynamique" data-i18n="tag.prereq"></a>
    </div>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>d</mi><mi>S</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>Q</mi></mrow><mi>T</mi></mfrac><mspace width="1.5em"/><msub><mi>S</mi><mi>b</mi></msub><mo>−</mo><msub><mi>S</mi><mi>a</mi></msub><mo>=</mo><msubsup><mo>∫</mo><mi>a</mi><mi>b</mi></msubsup><mfrac><mrow><mi>d</mi><mi>Q</mi></mrow><mi>T</mi></mfrac></math><span class="n">(44.15–16)</span></div>
    <p class="validite" data-i18n-html="val.44.16"></p>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys"></p>
    </div>
    <figure class="chart">
      <svg class="fig" id="pv" role="img" data-i18n-attr="aria-label:pv.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="pv.legend.chemin"></span><span class="c-label-2" data-i18n="pv.legend.autres"></span><span class="c-warn" data-i18n="pv.legend.iso"></span></div>
      <div class="panel">
        <div class="seg" role="group" data-i18n-attr="aria-label:pv.choix"><button type="button" id="c1" aria-pressed="true" data-i18n="pv.c1"></button><button type="button" id="c2" aria-pressed="false" data-i18n="pv.c2"></button><button type="button" id="c3" aria-pressed="false" data-i18n="pv.c3"></button></div>
        <div class="controls">
          <div class="ctl"><div class="row"><label for="vb" data-i18n="pv.vb"></label><output id="vbv" for="vb"></output></div>
            <input id="vb" type="range" min="0.5" max="4" step="0.1" value="2"></div>
          <div class="ctl"><div class="row"><label for="tb" data-i18n="pv.tb"></label><output id="tbv" for="tb"></output></div>
            <input id="tb" type="range" min="200" max="600" step="5" value="375"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="pv.k.q"></span><span class="v" id="vq"></span><span class="f" data-i18n="pv.f.q"></span></div>
          <div class="stat"><span class="k" data-i18n-html="pv.k.w"></span><span class="v" id="vw"></span><span class="f" data-i18n="pv.f.w"></span></div>
          <div class="stat"><span class="k" data-i18n-html="pv.k.int"></span><span class="v" id="vint"></span><span class="f" data-i18n="pv.f.int"></span></div>
          <div class="stat"><span class="k" data-i18n-html="pv.k.ds"></span><span class="v" id="vds"></span><span class="f" data-i18n="pv.f.ds"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="pv.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><mi>S</mi><mo stretchy="false">(</mo><mi>V</mi><mo>,</mo><mi>T</mi><mo stretchy="false">)</mo><mo>=</mo><mi>n</mi><mi>R</mi><mrow><mo>[</mo><mi data-i18n="eq.ln"></mi><mi>V</mi><mo>+</mo><mfrac><mn>1</mn><mrow><mi>γ</mi><mo>−</mo><mn>1</mn></mrow></mfrac><mi data-i18n="eq.ln"></mi><mi>T</mi><mo>]</mo></mrow><mo>+</mo><mi>a</mi></math></div>
    <p class="validite" data-i18n-html="val.gp"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi>Δ</mi><mi>S</mi><mo>=</mo><mfrac><mrow><mi>Δ</mi><mi>Q</mi></mrow><msub><mi>T</mi><mn>2</mn></msub></mfrac><mo>−</mo><mfrac><mrow><mi>Δ</mi><mi>Q</mi></mrow><msub><mi>T</mi><mn>1</mn></msub></mfrac></math><span class="n">(44.19)</span></div>
    <p class="validite" data-i18n-html="val.44.19"></p>
    <div class="list keyed" id="irrev"></div>
    <div class="box prop"><b data-i18n="s3.prop.title"></b>
      <p data-i18n-html="s3.prop.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <p data-i18n-html="s4.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>

    <div id="quiz"></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/entropie.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/thermo.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const N = 1, GAMMA = 1.4, A = { V: 0.0224, T: 273.15 };       // one mole of a diatomic gas, near normal conditions

/* ---------- le système ---------- */
(() => {
  const e = Thermo.ecarts("N2", N, A.V, A.T);
  $("sys").innerHTML = t("sys.inner", { V: F.qty(F.num(A.V * 1e3, 3), "L"), T: F.kelvin(A.T), P: F.si(Thermo.pression(N, A.V, A.T), "Pa", { sig: 3 }),
    a: F.sci(e.a, 1), b: F.sci(e.b, 1) });
})();

/* ---------- trois chemins réversibles de a à b ---------- */
(() => {
  const svg = $("pv"), sv = $("vb"), st = $("tb"), btn = [$("c1"), $("c2"), $("c3")];
  let choix = 0;
  const legs = B => {
    const Vad = A.V * Math.pow(A.T / B.T, 1 / (GAMMA - 1));
    return [[{ type: "isotherme", V: B.V }, { type: "isochore", T: B.T }],
      [{ type: "isochore", T: B.T }, { type: "isotherme", V: B.V }],
      [{ type: "adiabatique", V: Vad }, { type: "isotherme", V: B.V }]];
  };
  const isoT = T => { const pts = [], V0 = Math.max(1e-3, N * Constantes.R * T / 3e6); for (let i = 0; i <= 60; i++) { const V = V0 * Math.pow(0.2 / V0, i / 60); pts.push([V, Thermo.pression(N, V, T)]); } return pts; };
  function draw() {
    const B = { V: +sv.value * A.V, T: +st.value }, all = legs(B).map(l => Thermo.chemin(N, GAMMA, A, l, 400));
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { b: 44, l: 56 },
      x: { scale: "log", domain: [1, 200], label: t("pv.x"), fmt: v => F.num(v, 3) },
      y: { scale: "log", domain: [10, 3000], label: t("pv.y"), fmt: v => F.num(v, 4) } });
    const px = pts => Plot.path(pts.map(([V, P]) => [o.x(Math.min(Math.max(V * 1e3, 1), 200)), o.y(Math.min(Math.max(P / 1e3, 10), 3000))]));
    [A.T, B.T].forEach(T => Plot.el("path", { d: px(isoT(T)), class: "ref" }, o.g));
    all.forEach((c, i) => { if (i !== choix) Plot.el("path", { d: px(c.pts), class: "stroke thin c-label-2" }, o.g); });
    Plot.el("path", { d: px(all[choix].pts), class: "curve" }, o.g);
    [[A, "a"], [B, "b"]].forEach(([s, nom]) => {
      const X = o.x(s.V * 1e3), Y = o.y(Thermo.pression(N, s.V, s.T) / 1e3);
      Plot.el("circle", { cx: X, cy: Y, r: 6, class: "dot" }, o.g);
      Plot.el("text", { x: X + 9, y: Y - 9, class: "note" }, o.g).textContent = nom;
    });
    const c = all[choix];
    $("vbv").textContent = F.qty(F.num(B.V * 1e3, 3), "L");
    $("tbv").innerHTML = F.kelvin(B.T);
    $("vq").textContent = F.si(c.Q, "J", { sig: 3 });
    $("vw").textContent = F.si(c.W, "J", { sig: 3 });
    $("vint").textContent = F.qty(F.fix(c.dS, 2), "J·K⁻¹");
    $("vds").textContent = F.qty(F.fix(Thermo.dS(N, GAMMA, A, B), 2), "J·K⁻¹");
  }
  const set = i => { choix = i; btn.forEach((b, k) => b.setAttribute("aria-pressed", k === i)); draw(); };
  btn.forEach((b, i) => b.onclick = () => set(i));
  sv.oninput = st.oninput = draw; draw();
})();

/* ---------- trois processus irréversibles, chiffrés ---------- */
(() => {
  const fr = 1000 / 300, th = Thermo.thermostats(1000, 400, 300), j = Thermo.joule(1, 1, 2), c = Thermo.contact(4180, 353.15, 4180, 293.15);
  const ROWS = ["frottement", "thermostats", "joule", "contact"], txt = textOf("irrev.rows", ROWS);
  const val = { frottement: F.qty(F.fix(fr, 2), "J·K⁻¹"), thermostats: F.qty(F.fix(th, 2), "J·K⁻¹"), joule: F.qty(F.fix(j.dS, 2), "J·K⁻¹"), contact: F.qty(F.fix(c.dS, 1), "J·K⁻¹") };
  const arg = { T1: F.kelvin(353.15), T2: F.kelvin(293.15), Tf: F.kelvin(c.Tf), d1: F.qty(F.fix(c.dS1, 0), "J·K⁻¹"), d2: F.qty(F.fix(c.dS2, 0), "J·K⁻¹") };
  $("irrev").innerHTML = ROWS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text.replace(/\{(\w+)\}/g, (_, k) => arg[k])}</span><span class="v">+${val[id]}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["clausius54", 1854, "idea"], ["clausius65", 1865, "idea"], ["boltzmann", 1877, "idea"], ["nernst", 1906, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const cop = 308.15 / (308.15 - 278.15);
  const USES = ["pac", "pertes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace("{cop}", F.num(cop, 3)).replace("{Tc}", F.kelvin(308.15)).replace("{Tf}", F.kelvin(278.15))}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["chemin", "b"], ["isotherme", "a"], ["adiabatique", "c"], ["joule", "d"], ["flux", "a"], ["frigo", "b"], ["zero", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 446 });
})();
</script>
</body>
</html>
