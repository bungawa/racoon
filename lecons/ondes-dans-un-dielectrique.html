<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux, AZ = OM.azote();

/* ---------- du gaz au liquide : l'azote ---------- */
(() => {
  const trace = $("trace"), sd = $("sd");
  const R = x => Math.pow(10, x / 100);                                             // slider: density ratio 1 to 3 160
  const rs = Array.from({ length: 351 }, (_, i) => R(i)).filter(r => AZ.alpha * AZ.Ngaz * r < 2.9);
  const pc = x => 100 * (x - AZ.mesure) / AZ.mesure;
  function draw() {
    const r = R(+sd.value), Na = AZ.alpha * AZ.Ngaz * r;
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { scale: "log", domain: [1, 1e4], label: t("fig.xaxis") }, y: { scale: "log", domain: [1e-4, 10], label: t("fig.yaxis") } });
    const line = (f, cls) => Plot.el("path", { d: Plot.path(rs.map(x => [P.x(x), P.y(Math.max(1e-4, Math.min(10, f(OM.indicesReels(AZ.alpha * AZ.Ngaz * x)) - 1)))])), class: cls }, P.g);
    line(n => n.libre, "stroke dash c-label-2"); line(n => n.gaz, "stroke c-warn"); line(n => n.local, "curve");
    Plot.el("line", { x1: P.x(AZ.rapport), x2: P.x(AZ.rapport), y1: P.y(1e-4), y2: P.y(10), class: "grid" }, P.g);
    Plot.el("circle", { cx: P.x(AZ.rapport), cy: P.y(AZ.mesure - 1), r: 5, class: "dot" }, P.g);
    Plot.el("text", { x: P.x(AZ.rapport) + 8, y: P.y(AZ.mesure - 1) + 16, class: "note" }, P.g).textContent = t("fig.mesure");
    const ok = Na < 2.9;
    if (ok) Plot.el("line", { x1: P.x(r), x2: P.x(r), y1: P.y(1e-4), y2: P.y(10), class: "ref" }, P.g);
    const n = ok ? OM.indicesReels(Na) : null;
    $("sdr").textContent = F.num(r, 3);
    $("vlocal").textContent = ok ? F.num(n.local, 4) : "–";
    $("flocal").innerHTML = t("fig.f.na", { na: F.num(Na, 3) });
    $("vgaz").textContent = ok ? F.num(n.gaz, 4) : "–";
    $("fgaz").textContent = ok ? t("fig.f.ecart", { e: F.num((n.gaz - n.local) / n.local * 100, 2) }) : "";
    $("vlibre").textContent = ok ? F.num(n.libre, 4) : "–";
    $("flibre").textContent = ok ? t("fig.f.ecart", { e: F.num((n.libre - n.local) / n.local * 100, 2) }) : "";
  }
  sd.oninput = draw; draw();
  /* the system: the gas and the liquid, the spacing of the molecules against the wavelength */
  const dg = Math.cbrt(1 / AZ.Ngaz), dl = Math.cbrt(1 / AZ.Nliq), lam = 589e-9;
  $("sys1").innerHTML = t("sys1.body", { Ng: F.qty(F.sci(AZ.Ngaz, 4), "m⁻³"), Nl: F.qty(F.sci(AZ.Nliq, 4), "m⁻³"), r: F.num(AZ.rapport, 3),
    a: F.qty(F.sci(AZ.alpha, 3), "m³"), dg: F.si(dg, "m", { prefix: "n" }), dl: F.si(dl, "m", { prefix: "n" }), lg: F.num(lam / dg, 2), ll: F.num(lam / dl, 2),
    na: F.num(AZ.Na, 3), loc: F.num(AZ.n.local, 4), gaz: F.num(AZ.n.gaz, 4), lib: F.num(AZ.n.libre, 4), mes: F.num(AZ.mesure, 4),
    el: F.num(pc(AZ.n.local), 2), eg: F.num(pc(AZ.n.gaz), 2), eb: F.num(pc(AZ.n.libre), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mossotti", 1850, "idea"], ["lorenz", 1869, "idea"], ["lorentz", 1878, "idea"], ["traductions", 1880, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pression"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["gaz", "a"], ["divergence", "c"], ["voisins", "b"], ["azote", "d"], ["echelle", "a"], ["resonance", "c"], ["trois", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 323 });
})();
</script>
