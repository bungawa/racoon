<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, LAMBDA = 550e-9;

/* ---------- (27.1) : l'erreur de h²/2d, en longueurs d'onde, contre le quart d'onde ---------- */
(() => {
  const svg = $("ecart"), ds = $("dsl"), hs = $("hsl"), H = [1e-4, 1e-1];
  const mm = v => F.si(v, "m", { prefix: "m", sig: 3 });
  function draw() {
    svg.innerHTML = "";
    const d = Math.pow(10, +ds.value), h = Math.pow(10, +hs.value), e = O.exces(h, d), hz = O.hParaxial(d, LAMBDA);
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { scale: "log", domain: H, label: t("ex.x") }, y: { scale: "log", domain: [1e-6, 1e4], label: t("ex.y") } });
    const pts = [];
    for (let k = 0; k <= 120; k++) { const hv = H[0] * Math.pow(H[1] / H[0], k / 120), r = Math.abs(O.exces(hv, d).ecart) / LAMBDA; if (r > 1e-6 && r < 1e4) pts.push([x(hv), y(r)]); }
    Plot.el("path", { d: Plot.path(pts), class: "curve" }, g);
    Plot.el("line", { x1: x(H[0]), x2: x(H[1]), y1: y(0.25), y2: y(0.25), class: "ref" }, g);
    if (hz > H[0] && hz < H[1]) Plot.el("line", { x1: x(hz), x2: x(hz), y1: y(1e-6), y2: y(1e4), class: "zero" }, g);
    const r = Math.abs(e.ecart) / LAMBDA;
    if (r > 1e-6 && r < 1e4) Plot.el("circle", { cx: x(h), cy: y(r), r: 5, class: "dot" }, g);
    $("dread").textContent = mm(d);
    $("hread").textContent = mm(h);
    $("vexact").textContent = F.si(e.exact, "m", { sig: 4 });
    $("fapprox").textContent = t("ex.f.approx", { approx: F.si(e.approx, "m", { sig: 4 }) });
    $("vecart").textContent = F.si(Math.abs(e.ecart), "m", { sig: 2 });
    $("fecart").textContent = t("ex.f.ecart", { l: F.num(r, 2) });
    $("vzone").textContent = mm(hz);
    $("fzone").textContent = t(h < hz ? "ex.f.dedans" : "ex.f.dehors");
  }
  ds.oninput = draw; hs.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["haytham", 1011, "idea", "1011–1021"], ["hamilton", 1827, "idea"], ["gauss", 1841, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind, label]) => Object.assign({ year, kind }, label ? { label } : {}, txt[id])), { t });
  const USES = ["conception", "lunettes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["rayon", "c"], ["exces", "a"], ["quart", "d"], ["sphere", "b"], ["gauss", "a"], ["trace", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 271 });
})();
</script>
