<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, c = Constantes.c, g0 = Constantes.g0, AN = 365.25 * 86400, AL = c * AN;   // Julian year; c × 1 year in m
const ans = x => F.qty(F.num(x, 3), t("u.ans"));

/* ---------- diagramme d'espace-temps du voyage : lignes d'univers, années de chacun, signaux lumineux ---------- */
(() => {
  const svg = $("diagramme"), sb = $("sb"), sd = $("sd"), sa = $("sa"), seg = $("sig");
  let sig = "sol";
  const W = 640, H = 520, pad = { l: 56, r: 16, t: 12, b: 44 };
  function draw() {
    const beta = +sb.value / 100, Dy = +sd.value, a = g0 * 10 ** +sa.value, D = Dy * AL;
    const V = R.voyage({ a, beta, D }), Ty = V.T / AN;
    /* the same scale on both axes, in years and in light-years: light goes at 45° */
    const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b, x0 = -0.12 * Dy, s = Math.min(ph / (1.04 * Ty), pw / (1.25 * Dy));
    const xd = [x0, x0 + pw / s].map(x => x * AL / 1e16), yd = [0, ph / s];
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: W, h: H, pad, x: { domain: xd, label: t("fig.xaxis") }, y: { domain: yd, label: t("fig.yaxis") } });
    const X = x => P.x(x / 1e16), Y = ty => P.y(ty);
    /* light signals first, under the worldlines */
    const S = sig === "aucun" ? null : R.signaux(V, AN);
    if (S) {
      const L = sig === "sol" ? S.duSol : S.duVoyageur;
      L.forEach(e => {
        const A = sig === "sol" ? [0, e.emission / AN] : [V.etat(e.date).x, e.date / AN];
        const B = sig === "sol" ? [V.etat(e.date).x, e.date / AN] : [0, e.reception / AN];
        Plot.el("line", { x1: X(A[0]), y1: Y(A[1]), x2: X(B[0]), y2: Y(B[1]), class: "stroke thin c-label-2" }, P.g);
      });
    }
    Plot.el("line", { x1: X(0), y1: Y(0), x2: X(0), y2: Y(Ty), class: "stroke bold c-warn" }, P.g);
    const n = 400, pts = Array.from({ length: n + 1 }, (_, i) => V.etat(i * V.T / n));
    Plot.el("path", { d: Plot.path(pts.map((q, i) => [X(q.x), Y(i * Ty / n)])), class: "curve" }, P.g);
    /* one mark per year on each clock */
    for (let k = 1; k < Ty; k++) Plot.el("circle", { cx: X(0), cy: Y(k), r: 3, class: "fill c-warn" }, P.g);
    const ticks = R.signaux(V, AN).duVoyageur;                                           // the ground dates of Paul's birthdays
    ticks.slice(1).forEach(e => Plot.el("circle", { cx: X(V.etat(e.date).x), cy: Y(e.date / AN), r: 3, class: "fill c-tint" }, P.g));
    /* the numbers */
    $("sbr").textContent = F.num(beta, 2) + "\u00a0c";
    $("sdr").textContent = F.si(D, "m");
    $("sar").textContent = F.si(a, "m·s⁻²", { prefix: "" });
    $("vT").textContent = ans(Ty);
    $("fT").textContent = t("fig.f.pierre", { v: F.num(V.beta, 3) });
    $("vtau").textContent = ans(V.tau / AN);
    $("ftau").textContent = t("fig.f.paul", { d: ans(Ty - V.tau / AN), r: F.num(V.tau / V.T, 3) });
    if (!S) { $("vsig").textContent = "–"; $("fsig").textContent = t("fig.f.aucun"); }
    else {
      /* split at Paul's turnaround, on Paul's clock: when he receives Peter's signals, when he sends his own */
      const L = sig === "sol" ? S.duSol : S.duVoyageur;
      const aller = L.filter(e => (sig === "sol" ? e.reception : e.emission) <= V.tau / 2).length, retour = L.length - aller;
      $("vsig").textContent = aller + "\u00a0+\u00a0" + retour;
      $("fsig").textContent = t(sig === "sol" ? "fig.f.sol" : "fig.f.voyageur", { n: L.length });
    }
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === sig)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { sig = x.dataset.m; draw(); });
  sb.oninput = sd.oninput = sa.oninput = draw; draw();
})();

/* ---------- le système décrit : les muons de l'anneau de stockage du CERN ---------- */
(() => {
  const gamma = 29.33, tau = 64.42e-6, r = 7, v = c * Math.sqrt(1 - 1 / gamma ** 2);
  $("sys1").innerHTML = t("sys1.body", { g: F.num(gamma, 4), tau: F.si(tau, "s"), tau0: F.si(tau / gamma, "s"), v: F.num(v / c, 5),
    acc: F.sci(v * v / r, 2), accg: F.sci(v * v / r / g0, 2), tour: F.si(2 * Math.PI * r / v, "s"), tours: F.num(tau * v / (2 * Math.PI * r), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["einstein", 1905, "idea"], ["langevin", 1911, "idea"], ["hafele", 1971, "experiment"], ["muons", 1977, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gm2"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["qui", "b"], ["symetrie", "d"], ["chiffre", "a"], ["accel", "c"], ["signaux", "b"], ["muons", "a"], ["gravite", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 162 });
})();
</script>
