<main class="page">

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><msub><mi>ℰ</mi><mtext data-i18n="eq.tr"></mtext></msub><mo>=</mo><mo>−</mo><msub><mi mathvariant="bold">v</mi><mtext data-i18n="eq.derive"></mtext></msub><mo>×</mo><mi mathvariant="bold">B</mi></math><span class="n">(14.9)</span></div>
    <p class="validite" data-i18n-html="val.14.9"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><msub><mi>ℰ</mi><mtext data-i18n="eq.tr"></mtext></msub><mo>=</mo><mo>−</mo><mfrac><mn>1</mn><mrow><mi>q</mi><mi>N</mi></mrow></mfrac><mi mathvariant="bold">j</mi><mo>×</mo><mi mathvariant="bold">B</mi></math><span class="n">(14.9a)</span></div>
    <p class="validite" data-i18n-html="val.14.9a"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure class="chart">
      <svg class="fig" id="fig" viewBox="0 0 640 240" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-label" data-i18n="fig.legend.j"></span><span class="c-warn" data-i18n="fig.legend.f"></span><span class="c-tint" data-i18n="fig.legend.v"></span></div>
      <div class="panel">

          <div class="ctl"><div class="row"><label for="sq" data-i18n="fig.q"></label><output id="sqr" for="sq"></output></div>
            <input id="sq" type="range" min="0" max="1" step="1" value="0"></div>
          <div class="ctl"><div class="row"><label for="sn" data-i18n="fig.n"></label><output id="snr" for="sn"></output></div>
            <input id="sn" type="range" min="19" max="29" step="0.1" value="22"></div>
          <div class="ctl"><div class="row"><label for="sb" data-i18n="fig.b"></label><output id="sbr" for="sb"></output></div>
            <input id="sb" type="range" min="0" max="2" step="0.05" value="0.5"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.v"></span><span class="v" id="vv"></span><span class="f" id="fv"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.rh"></span><span class="v" id="vr"></span><span class="f" id="fr"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>

  <section class="card">

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/effet-hall.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/quantique-schrodinger.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes, I0 = 1e-3, EP = 0.5e-3, LARG = 5e-3;

/* ---------- a slab carrying a current in a magnetic field ---------- */
(() => {
  const svg = $("fig"), sq = $("sq"), sn = $("sn"), sb = $("sb");
  const tag = (x, y, txt, cls) => { const e = Plot.el("text", { x, y, "text-anchor": "middle", class: cls || "" }, svg); e.textContent = txt; };
  function draw() {
    const trous = +sq.value === 1, q = trous ? K.e : -K.e, N = Math.pow(10, +sn.value), B = +sb.value;
    const j = I0 / (LARG * EP), E = Q.champHall(j, B, q, N), V = E * LARG;   // E along +y when q > 0: field from the top edge (y = +) down, j along x, B along z
    svg.innerHTML = "";
    Plot.el("rect", { x: 120, y: 60, width: 400, height: 120, class: "stroke c-label-2" }, svg);
    Plot.fleche(svg, [150, 120], [490, 120], { cls: "c-label", tete: 12 });
    tag(320, 110, t("fig.j"), "c-label");
    /* the carriers drift along +x (holes) or −x (electrons); F = q v × B points to −y in both cases: the same edge fills */
    const sens = B > 0 ? 1 : 0;
    if (sens) { Plot.fleche(svg, [250, 140], [250, 172], { cls: "c-warn", tete: 9 }); Plot.fleche(svg, [390, 140], [390, 172], { cls: "c-warn", tete: 9 }); }
    tag(320, 50, sens ? (trous ? "−" : "+") : "", "c-tint");
    tag(320, 202, sens ? (trous ? "+" : "−") : "", "c-tint");
    tag(570, 125, t("fig.bz"), "c-label-2");
    tag(320, 230, t(trous ? "fig.porteurs.p" : "fig.porteurs.n"), "c-label-2");
    $("sqr").textContent = t(trous ? "fig.q.p" : "fig.q.n");
    $("snr").textContent = F.qty(F.sci(N, 2), "m⁻³");
    $("sbr").textContent = F.si(B, "T");
    $("vv").textContent = F.si(V, "V");
    $("fv").textContent = t(V > 0 ? "fig.f.v.pos" : V < 0 ? "fig.f.v.neg" : "fig.f.v.nul");
    $("vr").textContent = F.si(1 / (q * N), "m³·C⁻¹");
    $("fr").textContent = t("fig.f.rh");
  }
  sq.oninput = draw; sn.oninput = draw; sb.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const j = I0 / (LARG * EP);
  $("sys1").innerHTML = t("sys1.body", { v: F.si(Math.abs(Q.champHall(j, 1, -K.e, 1e22)) * LARG, "V"), vcu: F.si(Math.abs(Q.champHall(j, 1, -K.e, 8.5e28)) * LARG, "V") });
  $("sys2").innerHTML = t("sys2.body", { th: F.num(0.15 * 1, 2) });
  $("sys3").innerHTML = t("sys3.body", { rk: F.num(K.h / (K.e * K.e), 9) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hall", 1879, "experiment"], ["klitzing", 1980, "experiment"], ["nobel", 1985, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["capteurs", "etalon"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signe", "a"], ["force", "c"], ["metal", "b"], ["densite", "d"], ["equilibre", "b"], ["beryllium", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1403 });
})();
</script>
</body>
</html>
