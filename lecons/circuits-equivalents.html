<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const cplx = (z, u, sig = 3) => { const m = Cx.abs(z), n = v => F.num(Math.abs(v), sig), s = v => v < 0 ? F.MINUS : "", r = Math.abs(z.re) > 1e-9 * m, i = Math.abs(z.im) > 1e-9 * m;
  return (r && i ? Cx.text(z, v => F.num(v, sig)) : i ? s(z.im) + n(z.im) + " i" : s(z.re) + n(z.re)) + " " + u; };

/* ---------- la boîte noire : le réseau à deux générateurs, vu des bornes de z1 ---------- */
(() => {
  /* the network of « Réseaux d'éléments idéaux et lois de Kirchhoff », at 1 kHz, with z1 replaced by the load */
  const w = 2 * Math.PI * 1e3, o = { z1: Cx.c(100), z2: Cx.c(0, w * 15e-3), z3: Cx.c(0, -1 / (w * 2.2e-6)), e1: Cx.c(5), e2: Cx.polar(10, Math.PI / 3) };
  const d = M.deuxGenerateurs(o), [a, b] = d.bornes, th = M.thevenin(d.sansZ1, a, b);
  /* each kind of load: its unit, the bottom of its five decades, its impedance */
  const CHARGES = { R: { u: "Ω", lo: 0, z: v => Cx.c(v) }, L: { u: "H", lo: -4, z: v => Cx.c(0, w * v) }, C: { u: "F", lo: -9, z: v => Cx.c(0, -1 / (w * v)) } };
  const seg = $("mode"), lz = $("lz"), XS = Array.from({ length: 501 }, (_, i) => 5 * i / 500), DOTS = Array.from({ length: 21 }, (_, i) => i / 4);
  let k = "R";
  const V0 = 1e-2, V1 = 1e4, cl = v => Math.min(V1, Math.max(V0, v));
  function draw() {
    const C = CHARGES[k], val = 10 ** (C.lo + +lz.value), Z = C.z(val);
    const vrai = M.brancher(d.sansZ1, a, b, Z), modele = M.generateur(th.E, th.z, Z);
    const svg = $("trace"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 60, b: 44 }, x: { scale: "log", domain: [0.1, 1e6], label: t("fig.xaxis") }, y: { scale: "log", domain: [V0, V1], label: t("fig.yaxis") } });
    const pt = x => { const z = C.z(10 ** (C.lo + x)); return [Cx.abs(z), z]; };
    Plot.el("path", { d: Plot.path(XS.map(x => { const [m, z] = pt(x); return [P.x(m), P.y(cl(Cx.abs(M.generateur(th.E, th.z, z).V)))]; })), class: "curve" }, P.g);
    DOTS.forEach(x => { const [m, z] = pt(x); Plot.el("circle", { cx: P.x(m), cy: P.y(cl(Cx.abs(M.brancher(d.sansZ1, a, b, z).V))), r: 3, class: "stroke c-warn" }, P.g); });
    Plot.el("circle", { cx: P.x(Cx.abs(Z)), cy: P.y(cl(Cx.abs(vrai.V))), r: 5, class: "dot" }, P.g);
    $("lzv").textContent = F.si(val, C.u);
    $("vr").textContent = F.si(Cx.abs(vrai.V), "V");
    $("fr").textContent = t("fig.f.reseau", { i: F.si(Cx.abs(vrai.I), "A") });
    $("vm").textContent = F.si(Cx.abs(modele.V), "V");
    $("fm").textContent = t("fig.f.modele", { ecart: F.sci(Math.max(1e-16, Cx.abs(Cx.sub(modele.V, vrai.V)) / Cx.abs(vrai.V)), 1) });
    $("vx").textContent = cplx(th.z, "Ω");
    $("fx").textContent = t("fig.f.mesures", { e: F.si(Cx.abs(th.E), "V"), icc: F.si(Cx.abs(th.Icc), "A") });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === k)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { k = x.dataset.m; draw(); });
  lz.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["helmholtz", 1853, "idea"], ["thevenin", 1883, "idea"], ["norton", 1926, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["batterie", "transistor"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["passif", "a"], ["mesure", "c"], ["norton", "b"], ["frequence", "d"], ["resonance", "a"], ["lineaire", "c"], ["dedans", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 224 });
})();
</script>
