<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/locales/fr/lecons/symetries-dans-le-plan.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, X = Cristaux;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); };
const ordre = r => Math.max(...r);

/* ---------- réseau × motif ---------- */
(() => {
  const ring = (n, r, phase, e) => Array.from({ length: n }, (_, k) => ({ x: r * Math.cos(phase + 2 * Math.PI * k / n), y: r * Math.sin(phase + 2 * Math.PI * k / n), e }));
  const tiers = (a, b, s) => [s * (a[0] + b[0]) / 3, s * (a[1] + b[1]) / 3];
  const MOTIFS = {   // atom positions about the node, in units of |a|; graphene and boron nitride sit at ±(a + b)/3
    point: () => [{ x: 0, y: 0, e: "A" }],
    triangle: () => ring(3, 0.22, Math.PI / 2, "A"),
    carre: () => ring(4, 0.22, Math.PI / 4, "A"),
    moulinet: () => [0, 1, 2, 3].flatMap(k => { const c = Math.cos(k * Math.PI / 2), s = Math.sin(k * Math.PI / 2);
      return [[0.2, 0, "A"], [0.27, 0.1, "B"]].map(([x, y, e]) => ({ x: c * x - s * y, y: s * x + c * y, e })); }),
    graphene: (a, b) => [1, -1].map(s => { const [x, y] = tiers(a, b, s); return { x, y, e: "C" }; }),
    bn: (a, b) => [[1, "B"], [-1, "N"]].map(([s, e]) => { const [x, y] = tiers(a, b, s); return { x, y, e }; }),
  };
  const CLS = { A: "c-tint", B: "el-o", C: "el-c", N: "el-n" };
  const svg = $("papier"), U = 62, O = [320, 190];
  let res = "oblique", mot = "point";
  const px = (x, y) => [O[0] + U * x, O[1] - U * y];
  const nb = (r, m) => t("pp.v.sym", { n: ordre(r), m: m.length });
  function upd() {
    const L = X.BRAVAIS2D.find(l => l.id === res), a = L.a, b = L.b, M = MOTIFS[mot](a, b);
    svg.innerHTML = "";
    const nodes = [];
    for (let i = -9; i <= 9; i++) for (let j = -7; j <= 7; j++) {
      const x = i * a[0] + j * b[0], y = i * a[1] + j * b[1], [u, v] = px(x, y);
      if (u > -40 && u < 680 && v > -40 && v < 420) nodes.push([x, y]);
    }
    const cri = X.symetriesCristal(a, b, M), lat = X.symetriesCristal(a, b, [{ x: 0, y: 0, e: "A" }]), sm = mot === "point" ? null : X.symetriesMotif(M);   // a lone point has every rotation and every line
    cri.miroirs.forEach(f => { const d = [Math.cos(f), Math.sin(f)], p1 = px(-8 * d[0], -8 * d[1]), p2 = px(8 * d[0], 8 * d[1]);
      P("line", { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], class: "stroke dash c-tint" }, svg); });
    nodes.forEach(([x, y]) => { M.forEach(m => { const [u, v] = px(x + m.x, y + m.y);
      P("circle", { cx: u, cy: v, r: m.e === "B" && mot === "moulinet" ? 4 : 7, class: "fill " + CLS[m.e] }, svg); });
      const [u, v] = px(x, y); P("circle", { cx: u, cy: v, r: 2.5, class: "fill c-label-2" }, svg); });
    const c = [[0, 0], a, [a[0] + b[0], a[1] + b[1]], b].map(p => px(...p).join(" "));
    P("path", { d: "M" + c.join("L") + "Z", class: "stroke thin c-label-2" }, svg);
    P("circle", { cx: O[0], cy: O[1], r: 13, class: "stroke c-label" }, svg);
    P("text", { x: O[0] + 16, y: O[1] - 14 }, svg).textContent = String(ordre(cri.rotations));
    $("vres").textContent = t("bravais." + res);
    $("fres").textContent = nb(lat.rotations, lat.miroirs);
    $("vmot").textContent = sm ? nb(sm.rotations, sm.miroirs) : t("pp.v.tout");
    $("fmot").textContent = t("pp.f.motif", { k: M.length });
    $("vcri").textContent = nb(cri.rotations, cri.miroirs);
    $("fcri").textContent = t(cri.miroirs.length ? "pp.f.cristal" : "pp.f.chiral");
  }
  seg($("reseaux"), "r", r => { res = r; upd(); });
  seg($("motifs"), "m", m => { mot = m; upd(); });
})();

/* ---------- la preuve des deux nœuds ---------- */
(() => {
  const svg = $("preuve"), U = 110, O = [265, 230];
  const px = p => [O[0] + U * p[0], O[1] - U * p[1]];
  const dot = (p, cls, lbl, dx, dy) => { const [u, v] = px(p); P("circle", { cx: u, cy: v, r: 6, class: "fill " + cls }, svg);
    P("text", { x: u + (dx || 8), y: v + (dy || -8) }, svg).textContent = lbl; };
  const line = (p, q, cls) => { const [a, b] = px(p), [c, d] = px(q); P("line", { x1: a, y1: b, x2: c, y2: d, class: cls }, svg); };
  function upd() {
    const n = +$("ordre").value, r = X.preuveRotation(n), A = [0, 0], B = [1, 0];
    svg.innerHTML = "";
    for (let k = -2; k <= 3; k++) P("circle", { cx: px([k, 0])[0], cy: px([k, 0])[1], r: 3, class: "fill c-label-2" }, svg);
    line(A, B, "stroke c-label");
    line(A, r.A2, "stroke thin dash c-label-2"); line(B, r.B2, "stroke thin dash c-label-2");
    line(r.A2, r.B2, "stroke bold " + (r.entier ? "c-ok" : "c-ko"));
    dot(A, "c-label", "A", -14, 18); dot(B, "c-label", "B", 4, 18);
    dot(r.A2, "c-tint", "A′"); dot(r.B2, "c-tint", "B′");
    $("ordrev").textContent = String(n);
    $("vtheta").textContent = F.qty(F.num(360 / n, 4), "°");
    $("vecart").textContent = F.fix(r.ecart, 3);
    $("vverdict").textContent = t(r.entier ? "pr.v.oui" : "pr.v.non");
  }
  $("ordre").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fedorov", 1891, "idea"], ["polya", 1924, "idea"], ["shechtman", 1982, "experiment"], ["graphene", 2004, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["graphene", "tables"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ordre5", "c"], ["graphene", "a"], ["moulinet", "d"], ["inversion", "b"], ["octogone", "a"], ["reseaux", "c"], ["bn", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
