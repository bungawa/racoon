<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Principes, C = Constantes;

/* ---------- l'action d'un trajet d'essai ---------- */
(() => {
  const SYS = { balle: { sys: P.pesanteur(0.26, 9.81), amax: 0.3, T: () => 1 }, ressort: { sys: P.ressort(0.1, 10), amax: 0.05, T: () => +$("tsl").value } };
  let cur = "balle";
  const seg = $("sys"), asl = $("asl"), nsl = $("nsl"), tsl = $("tsl");
  const J = x => F.si(x, "J·s", { sig: 3 });
  function draw() {
    const S = SYS[cur], sys = S.sys, T = S.T(), n = +nsl.value, a = +asl.value * S.amax, b = { t1: 0, x1: 0, t2: T, x2: 0 };
    tsl.disabled = cur === "balle";
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.s === cur)));
    $("aread").textContent = F.qty(F.fix(a * 100, 1), "cm");
    $("nread").textContent = String(n); $("tread").textContent = F.si(T, "s", { prefix: "", sig: 2 });
    const vrai = sys.vrai(b), x = P.essai(sys, b, a, n), N = 120, ts = Array.from({ length: N + 1 }, (_, i) => T * i / N);
    const top = cur === "balle" ? 1.6 : S.amax * 1.1, bot = cur === "balle" ? -0.4 : -S.amax * 1.1;
    const xt = $("xt"); xt.innerHTML = "";
    const A = Plot.axes(xt, { fmt: F, w: 640, h: 220, x: { domain: [0, T], label: t("ac.x.t") }, y: { domain: [bot, top], label: t("ac.y.x") } });
    const clip = v => Math.max(bot, Math.min(top, v));
    Plot.el("path", { d: Plot.path(ts.map(s => [A.x(s), A.y(clip(vrai(s)))])), class: "stroke c-label" }, A.g);
    Plot.el("path", { d: Plot.path(ts.map(s => [A.x(s), A.y(clip(x(s)))])), class: "stroke dash c-tint" }, A.g);
    const S0 = P.action(sys, vrai, b), dS = P.action(sys, x, b) - S0, c = P.courbure(sys, T, n), Y = Math.max(Math.abs(c) * S.amax ** 2, 1e-9);
    const sa = $("sa"); sa.innerHTML = "";
    const B = Plot.axes(sa, { fmt: F, w: 640, h: 200, x: { domain: [-S.amax * 100, S.amax * 100], label: t("ac.x.a") }, y: { domain: [-Y * 1e3, Y * 1e3], label: t("ac.y.ds") } });
    Plot.el("line", { x1: B.x(-S.amax * 100), x2: B.x(S.amax * 100), y1: B.y(0), y2: B.y(0), class: "ref" }, B.g);
    const as = Array.from({ length: 81 }, (_, i) => -S.amax + 2 * S.amax * i / 80);
    Plot.el("path", { d: Plot.path(as.map(u => [B.x(u * 100), B.y(c * u * u * 1e3)])), class: "curve" }, B.g);
    Plot.el("circle", { cx: B.x(a * 100), cy: B.y(dS * 1e3), r: 5, class: "dot" }, B.g);
    $("vs0").textContent = J(S0); $("fs0").textContent = t("ac.f.s0", { r: F.sci(Math.abs(S0) / C.hbar, 2) });
    $("vds").textContent = J(dS); $("fds").textContent = t("ac.f.ds", { f: J(c * a * a) });
    const neg = P.modesNegatifs(sys, T), plat = Math.abs(c) < 1e-3 * sys.m * (n * Math.PI / T) ** 2 * T / 4;
    $("vnat").textContent = t(plat ? "ac.nat.plat" : neg ? "ac.nat.col" : "ac.nat.min");
    $("fnat").textContent = t("ac.f.nat", { k: String(neg) });
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { cur = x.dataset.s; draw(); });
  asl.oninput = nsl.oninput = tsl.oninput = draw;
  draw();
})();

/* ---------- la capacité par un potentiel d'essai ---------- */
(() => {
  const bsl = $("bsl"), alsl = $("alsl"), k = 2 * Math.PI * C.eps0, AL = [-4, 1], Q = [1.1, 1.5, 2, 4, 10, 100];   // les rapports des tables publiées
  function draw() {
    const q = Q[+bsl.value], al = +alsl.value, vrai = P.capaCoaxiale(1, q) / k, ce = P.capaQuadratique(1, q, al) / k;
    const ao = P.alphaOptimal(1, q), co = P.capaQuadratique(1, q, ao) / k;
    const ys = Array.from({ length: 101 }, (_, i) => AL[0] + (AL[1] - AL[0]) * i / 100).map(u => [u, P.capaQuadratique(1, q, u) / k]);
    const top = Math.max(...ys.map(p => p[1]).filter(isFinite)), svg = $("ca"); svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 240, x: { domain: AL, label: t("cp.x") }, y: { domain: [0, top * 1.05], label: t("cp.y") } });
    Plot.el("line", { x1: A.x(AL[0]), x2: A.x(AL[1]), y1: A.y(vrai), y2: A.y(vrai), class: "ref" }, A.g);
    Plot.el("path", { d: Plot.path(ys.map(([u, c]) => [A.x(u), A.y(c)])), class: "curve" }, A.g);
    Plot.el("circle", { cx: A.x(al), cy: A.y(ce), r: 5, class: "dot" }, A.g);
    $("bread").textContent = F.num(q, 3); $("alread").textContent = F.fix(al, 2);
    $("vcv").textContent = F.fix(vrai, 4);
    $("vce").textContent = F.fix(ce, 4); $("fce").textContent = t("cp.f.ecart", { e: F.num(100 * (ce / vrai - 1), 2) });
    $("vco").textContent = F.fix(co, 4); $("fco").textContent = t("cp.f.opt", { a: F.fix(ao, 3), e: F.num(100 * (co / vrai - 1), 2) });
  }
  bsl.oninput = alsl.oninput = draw;
  $("blin").onclick = () => { alsl.value = -1; draw(); };
  $("bopt").onclick = () => { alsl.value = P.alphaOptimal(1, Q[+bsl.value]); draw(); };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maupertuis", 1744, "idea"], ["euler", 1744, "idea"], ["lagrange", 1788, "idea"], ["hamilton", 1834, "idea"], ["feynman", 1948, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["verlet", "ritz"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["libre", "b"], ["bornes", "c"], ["cout", "a"], ["col", "d"], ["frottement", "b"], ["classique", "a"], ["capa", "c"], ["local", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 191 });
})();
</script>
