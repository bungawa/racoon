<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, NM = 1e-9, HB = Q.hbar;
const ONDE = { sigma: 0.1 * NM, p0: 2 * HB / (0.1 * NM) };            // a packet that oscillates: Re ψ has some curvature
const psi = x => Q.paquetGaussien(x * NM, ONDE).re / Math.sqrt(1e9);  // nm⁻¹ᐟ², x in nm

/* ---------- δ as the limit of narrow kernels: ∫ δ_ε(x − x′) ψ(x) dx against ψ(x′) ---------- */
(() => {
  const svg = $("filtre"), seps = $("seps"), sx = $("sx"), seg = $("forme");
  let forme = "rect";
  function draw() {
    const eps = +seps.value, x1 = +sx.value;
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { domain: [-0.4, 0.4], label: t("fig.x"), fmt: v => F.num(v, 2) }, y: { domain: [-2.5, 2.5], label: t("fig.y") } });
    const c = [], k = [];
    for (let i = 0; i <= 400; i++) { const x = -0.4 + 0.8 * i / 400; c.push([ax.x(x), ax.y(psi(x))]);
      k.push([ax.x(x), ax.y(Math.min(2.4, 0.1 * Q.noyauDelta(x - x1, eps, forme)))]); }
    Plot.el("path", { d: Plot.path(k), class: "stroke c-warn" }, ax.g);
    Plot.el("path", { d: Plot.path(c), class: "stroke bold c-tint" }, ax.g);
    Plot.el("line", { x1: ax.x(-0.4), x2: ax.x(0.4), y1: ax.y(0), y2: ax.y(0), class: "stroke thin c-label-2" }, ax.g);
    const v = Q.filtreDelta(psi, x1, eps, forme, 800), vrai = psi(x1), d2 = (psi(x1 + 1e-3) - 2 * vrai + psi(x1 - 1e-3)) / 1e-6;
    Plot.el("circle", { cx: ax.x(x1), cy: ax.y(v), r: 5, class: "fill c-warn" }, ax.g);
    Plot.el("circle", { cx: ax.x(x1), cy: ax.y(vrai), r: 3, class: "fill c-tint" }, ax.g);
    $("sepsr").textContent = F.qty(F.fix(eps, 3), "nm");
    $("sxr").textContent = F.qty(F.fix(x1, 3), "nm");
    $("vfi").textContent = F.fix(v, 4);
    $("ffi").textContent = t("fig.f.filtre", { v: F.fix(vrai, 4) });
    $("vec").textContent = F.sci(v - vrai, 2);
    $("fec").textContent = t("fig.f.ecart", { v: F.sci(d2 * eps * eps / (forme === "gauss" ? 2 : 24), 2) });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === forme)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { forme = b.dataset.f; draw(); });
  seps.oninput = sx.oninput = draw; draw();
})();

/* ---------- the system described: a position measured with a resolution ε ---------- */
(() => {
  const err = eps => Math.abs(Q.filtreDelta(psi, 0, eps, "rect", 800) / psi(0) - 1);
  $("sys1").innerHTML = t("sys1.body", { e1: F.num(100 * err(0.01), 2), e2: F.num(100 * err(0.05), 2), e3: F.num(100 * err(0.1), 2), l: F.qty(F.fix(2 * Math.PI * 0.1 / 2, 3), "nm") });
  $("sys2").innerHTML = t("sys2.body", { l: F.qty(F.fix(2 * Math.PI * 0.1 / 2, 3), "nm") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fourier", 1822, "idea"], ["dirac", 1927, "idea"], ["principes", 1930, "idea"], ["schwartz", 1945, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["impulsion"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["noyau", "a"], ["aire", "c"], ["dimension", "d"], ["ortho", "b"], ["largeur", "a"], ["trois", "c"], ["mesure", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1604 });
})();
</script>
