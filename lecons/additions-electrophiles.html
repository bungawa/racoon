    <div class="eq"><math display="block"><mfrac><msub><mi>v</mi><mn>1</mn></msub><msub><mi>v</mi><mn>2</mn></msub></mfrac><mo>=</mo><mi data-i18n="eq.exp"></mi><mo>⁡</mo><mo>(</mo><mfrac><mrow><mi mathvariant="normal">Δ</mi><mi mathvariant="normal">Δ</mi><msup><mi>G</mi><mo>‡</mo></msup></mrow><mrow><mi>R</mi><mi>T</mi></mrow></mfrac><mo>)</mo></math></div>

<script src="/racoon/fmt.js"></script>

<script src="/racoon/plot.js"></script>

<script src="/racoon/locales/fr/parcours.js"></script>

<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>

<script src="/racoon/actes-mecanisme.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = ChimOrga, sym = s => t("chim.sym", { s });

/* ---------- mécanisme limite de l'hydratation, acte par acte ---------- */
(() => {
  const vues = O.actesMecanisme("hydratation", { texte: sym, echelle: 40 });
  ActesMecanisme.monter({ vues, textes: textOf("meca.actes", vues.map((_, k) => "a" + k)), svg: $("meca"), boutons: $("actes"), texte: $("actetxt") });
})();

/* ---------- réactivité comparée des alcènes ---------- */
(() => {
  const ROWS = [["ethene", 1], ["propene", 1.6e6], ["methylpropene", 2.5e11]], txt = textOf("vit.rows", ROWS.map(r => r[0]));
  $("vitesses").innerHTML = ROWS.map(([id, k]) => `<div><span class="k">${k === 1 ? "1" : F.sci(k, 2)}</span><span>${txt[id]}</span><span class="v">${F.si(O.ecartBarrieres(k, 298.15) / 1000, "kJ·mol⁻¹", { sig: 3 })}</span></div>`).join("");
})();

/* ---------- sélectivité contre température ---------- */
(() => {
  /* r = produit majoritaire / minoritaire, mesuré vers 298 K. Hydroboration : % d'alcool primaire après oxydation. Hydratation : rapport des vitesses. */
  const CAS = [["hexBH3", 94 / 6], ["hexSia", 99 / 1], ["hexBBN", 999], ["styBH3", 80 / 20], ["stySia", 98 / 2], ["styBBN", 98.5 / 1.5], ["hydPropene", 1.6e6], ["hydMethylpropene", 2.5e11 / 1.6e6]];
  const txt = textOf("sel.cases", CAS.map(c => c[0])), T0 = 298.15, sel = $("cas"), temp = $("temp");
  sel.innerHTML = CAS.map(([id]) => `<option value="${id}">${txt[id].nom}</option>`).join("");
  const svg = $("courbe"), { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 260, x: { domain: [200, 400], label: t("sel.x") }, y: { domain: [50, 100], label: t("sel.y") } });
  const courbe = Plot.el("path", { class: "curve" }, g), dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  const pct = r => 100 * r / (1 + r);
  function upd() {
    const [, r] = CAS.find(c => c[0] === sel.value), T = +temp.value, dd = O.ecartBarrieres(r, T0), rT = O.rapportVoies(dd, T);
    const xs = Array.from({ length: 81 }, (_, i) => 200 + 2.5 * i);
    courbe.setAttribute("d", Plot.path(xs.map(u => [x(u), y(Math.max(50, pct(O.rapportVoies(dd, u))))])));
    dot.setAttribute("cx", x(T)); dot.setAttribute("cy", y(Math.max(50, pct(rT))));
    $("tr").innerHTML = F.kelvin(T);
    $("vmes").textContent = txt[sel.value].mesure; $("fmes").textContent = txt[sel.value].quoi;
    $("vdd").textContent = F.si(dd / 1000, "kJ·mol⁻¹", { sig: 3 }); $("fdd").textContent = t("sel.f.ecart", { rt: F.num(dd / (Constantes.R * T), 3) });
    $("vprev").textContent = rT > 1e4 ? F.sci(rT, 2) : F.num(rT, 3);
    $("fprev").textContent = t("sel.f.prevu", { p: F.qty(F.fix(Math.min(pct(rT), 99.99), 2), "%") });
  }
  sel.onchange = temp.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["markovnikov", 1870, "idea"], ["kharasch", 1933, "experiment"], ["shell", 1947, "experiment"], ["brown", 1956, "experiment"], ["nobel", 1979, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ethanol"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["regio", "a"], ["hammond", "c"], ["borane", "b"], ["ecart", "d"], ["transposition", "a"], ["syn", "c"], ["vitesse", "b"], ["chaud", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 3102 });
})();
</script>

</html>
