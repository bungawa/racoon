<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, HB = Constantes.hbar, R0 = 0.3e-9, I0 = Constantes.m_e * R0 * R0, T1 = 2 * Math.PI * 2 * I0 / HB;   // E_m = m²ħ²/2I : the m = ±1 beat with m = 0 has period 4πI/ħ
$("sys1").innerHTML = t("sys.body", { R: F.si(R0, "m"), E: F.qty(F.num(HB * HB / (2 * I0) / Constantes.e, 3), "eV"), T: F.si(T1, "s") });
(() => {
  const svg = $("anneau"), c0 = $("c0"), c1 = $("c1"), cm = $("cm"), st = $("st"), CX = 200, CY = 160, RR = 100, M = 360;
  Plot.el("circle", { cx: CX, cy: CY, r: RR, class: "stroke thin c-label-2", fill: "none" }, svg);
  const dens = Plot.el("path", { class: "stroke c-tint" }, svg), fl = Plot.el("g", {}, svg);
  const ax = Plot.axes(Plot.el("svg", { x: 380, y: 20, width: 250, height: 280, viewBox: "0 0 250 280" }, svg), { fmt: F, w: 250, h: 280, pad: { l: 40, b: 40 }, x: { domain: [-2.5, 2.5], label: t("fig.xm"), ticks: 5 }, y: { domain: [0, 1], label: t("fig.ym"), ticks: 4 } });
  const bars = Plot.el("g", {}, ax.g);
  function draw() {
    const a0 = +c0.value / 100, a1 = +c1.value / 100, am = +cm.value / 100, tt = T1 * +st.value / 100;
    if (!(a0 + a1 + am > 0)) c0.value = 10;
    const c = { 0: +c0.value / 100, 1: a1, "-1": am }, o = { I: I0 }, ps = [];
    for (let j = 0; j < M; j++) ps.push(Q.ondeAnneau(c, 2 * Math.PI * j / M, tt, o));
    const top = Math.max(...ps.map(z => z.P)) || 1;
    dens.setAttribute("d", Plot.path(ps.concat([ps[0]]).map((z, j) => { const f = 2 * Math.PI * j / M, r = RR * (1 + 0.6 * z.P / top); return [CX + r * Math.cos(f), CY - r * Math.sin(f)]; })) + "Z");
    const L = Q.lzAnneau(c), num = Q.lzDerivee(ps, 2 * Math.PI / M);
    fl.replaceChildren();
    if (Math.abs(L.moyenne) > 0.01) Plot.fleche(fl, [CX, CY], [CX + 0, CY - 80 * L.moyenne], { cls: "c-warn" });
    bars.replaceChildren();
    const n = c[0] ** 2 + a1 ** 2 + am ** 2;
    for (const [mm, w] of [[-1, am], [0, c[0]], [1, a1]]) { const P = w * w / n;
      Plot.el("rect", { x: ax.x(mm - 0.3), width: ax.x(0.6) - ax.x(0), y: ax.y(P), height: ax.y(0) - ax.y(P), class: "fill c-warn" }, bars); }
    $("c0r").textContent = F.num(c[0], 2); $("c1r").textContent = F.num(a1, 2); $("cmr").textContent = F.num(am, 2);
    $("str").textContent = F.si(tt, "s");
    $("vl").textContent = F.num(L.moyenne, 3) + " ħ";
    $("fl").textContent = t("fig.f.l", { n: F.num(num, 4) });
    $("vd").textContent = F.num(L.ecart, 3) + " ħ";
    $("fd").textContent = L.ecart < 1e-9 ? t("fig.f.propre") : t("fig.f.melange");
    $("vc").textContent = t("fig.v.c");
    $("fc").textContent = t("fig.f.c");
  }
  c0.oninput = c1.oninput = cm.oninput = st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["stern", 1922, "experiment"], ["spin", 1925, "idea"], ["bhj", 1925, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rmn"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["generateur", "a"], ["classique", "b"], ["propre", "c"], ["entier", "d"], ["commut", "a"], ["xpy", "b"], ["superposition", "c"], ["axes", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 206 });
})();
</script>
