<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux;

/* ---------- le montage sur la table : gain réel, saturation, vitesse de balayage ---------- */
(() => {
  const schema = $("schema"), trace = $("trace"), st = { mode: "nonInverseur", puce: "tl081" };
  const R1 = 1e4;                                                               // 10 kΩ, R2 set by the chosen gain
  const segs = { mode: $("mode"), puce: $("puce") };
  /* schematic: the op amp as a triangle, + and − inputs on the left, R1 and R2 as boxes, the ground as a bar */
  function dessiner(mode) {
    schema.innerHTML = "";
    const L = (x1, y1, x2, y2) => Plot.el("line", { x1, y1, x2, y2, class: "stroke" }, schema);
    const boite = (x, y, w, h, nom, gauche) => { Plot.el("rect", { x, y, width: w, height: h, class: "stroke" }, schema);
      Plot.el("text", gauche ? { x: x - 6, y: y + h / 2 + 4, "text-anchor": "end" } : { x: x + w / 2, y: y - 6, "text-anchor": "middle" }, schema).textContent = t(nom); };
    const masse = (x, y) => { L(x, y, x, y + 10); L(x - 10, y + 10, x + 10, y + 10); };
    const txt = (x, y, k, a) => { Plot.el("text", { x, y, "text-anchor": a || "middle" }, schema).textContent = t(k); };
    const point = (x, y) => Plot.el("circle", { cx: x, cy: y, r: 3, class: "fill" }, schema);
    Plot.el("path", { d: "M 330 40 L 330 130 L 410 85 Z", class: "stroke bold c-tint" }, schema);
    txt(340, 64, "sch.moins", "start"); txt(340, 116, "sch.plus", "start");
    L(410, 85, 560, 85); point(560, 85); txt(580, 89, "sch.vs", "start");
    if (mode === "nonInverseur") {
      L(120, 145, 310, 145); L(310, 145, 310, 110); L(310, 110, 330, 110); point(120, 145); txt(100, 149, "sch.ve", "end");
      L(330, 60, 280, 60); L(280, 60, 280, 28); L(280, 28, 360, 28); boite(360, 20, 60, 16, "sch.R2"); L(420, 28, 480, 28); L(480, 28, 480, 85); point(480, 85);
      L(280, 60, 280, 72); boite(272, 72, 16, 22, "sch.R1", true); masse(280, 94); point(280, 60);
    } else {
      L(330, 110, 310, 110); masse(310, 110);
      L(120, 60, 200, 60); point(120, 60); txt(100, 64, "sch.ve", "end"); boite(200, 52, 60, 16, "sch.R1"); L(260, 60, 330, 60);
      L(280, 60, 280, 28); L(280, 28, 360, 28); boite(360, 20, 60, 16, "sch.R2"); L(420, 28, 480, 28); L(480, 28, 480, 85); point(480, 85);
      point(280, 60);
    }
  }
  function draw() {
    const ao = M.AO[st.puce], G = Math.pow(10, +$("sg").value), E = Math.pow(10, +$("se").value), f = Math.pow(10, +$("sf").value);
    const R2 = st.mode === "nonInverseur" ? R1 * (G - 1) : R1 * G;
    const m = M.montage(st.mode, { R1, R2 }), lim = M.limites(m, ao, E, f);
    dessiner(st.mode);
    /* three periods after one period of settling */
    const T = 1 / f, s = M.simulerMontage(m, ao, x => E * Math.sin(2 * Math.PI * f * x), 4 * T, 4 * 600);
    const pts = s.t.map((x, j) => [x, j]).filter(([x]) => x >= T);
    const ymax = 1.15 * Math.max(Math.abs(m.G) * E, ao.Vsat * 0.2);
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 240, pad: { l: 64, b: 44 }, x: { domain: [0, 3], label: t("fig.xaxis") }, y: { domain: [-ymax, ymax], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(3), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    for (const v of [ao.Vsat, -ao.Vsat]) if (v < ymax && v > -ymax) Plot.el("line", { x1: P.x(0), x2: P.x(3), y1: P.y(v), y2: P.y(v), class: "stroke thin dash c-warn" }, P.g);
    const cl = v => Math.max(-ymax, Math.min(ymax, v));
    Plot.el("path", { d: Plot.path(pts.map(([x, j]) => [P.x((x - T) / T), P.y(cl(s.ideal[j]))])), class: "stroke dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(pts.map(([x, j]) => [P.x((x - T) / T), P.y(s.vs[j])])), class: "curve" }, P.g);
    $("sgr").textContent = F.num(m.G, 3);
    $("ser").textContent = F.si(E, "V");
    $("sfr").textContent = F.si(f, "Hz");
    $("vg").textContent = F.num(lim.G, 4);
    $("fg").textContent = t("fig.f.gain", { e: F.num(100 * lim.ecart, 2) + " %", r2: F.si(R2, "Ω") });
    $("vfc").textContent = F.si(lim.fc, "Hz");
    $("ffc").textContent = t("fig.f.fc", { fp: F.si(lim.fPuissance, "Hz") });
    $("vr").textContent = t("fig.regimes")[lim.regime];
    $("fr").textContent = t("fig.f.regime", { c: F.si(lim.crete, "V"), p: F.qty(F.num(lim.pente * 1e-6, 3), "V·µs⁻¹") });
    for (const k in segs) segs[k].querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === st[k])));
  }
  for (const k in segs) segs[k].querySelectorAll("button").forEach(x => x.onclick = () => { st[k] = x.dataset.m; draw(); });
  ["sg", "se", "sf"].forEach(id => $(id).oninput = draw); draw();
})();

/* ---------- le système décrit : un intégrateur qui dérive ---------- */
(() => {
  const R = 1e4, C = 1e-7, Vio = 1e-3, Rp = 1e6, Vsat = M.AO.tl081.Vsat;
  const a = M.integrateur({ R, C, Vio, Vsat }), b = M.integrateur({ R, C, Rp, Vio, Vsat });
  $("sys1").innerHTML = t("sys1.body", { R: F.si(R, "Ω"), C: F.si(C, "F", { prefix: "n" }), RC: F.si(R * C, "s", { prefix: "m" }), vio: F.si(Vio, "V", { prefix: "m" }),
    d: F.si(a.derive, "V·s⁻¹"), ts: F.si(a.tSat, "s"), rp: F.si(Rp, "Ω"), pl: F.si(b.plateau, "V", { prefix: "m" }), fb: F.si(b.fBas, "Hz") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["black", 1927, "idea"], ["ragazzini", 1947, "idea"], ["philbrick", 1952, "use"], ["ua741", 1968, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["thermocouple", "catalogue"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["epsilon", "c"], ["masse", "a"], ["gainreel", "d"], ["bande", "b"], ["balayage", "a"], ["entree", "c"], ["derive", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 701 });
})();
</script>
