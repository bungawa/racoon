          <div class="stat"><span class="k" data-i18n-html="fig.k.ld"></span><span class="v" id="vld"></span><span class="f" data-i18n="fig.f.ld"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.n"></span><span class="v" id="vn"></span><span class="f" id="fn"></span></div>

<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const He = HeliumLiquide, Q = QuantAmp;
/* a low temperature: kelvin with two or three figures, Celsius in grey */
const kelvin = T => F.qty(F.num(T, 3), "K") + ' <span class="aux">(' + F.qty(F.fix(T - 273.15, 2), "°C") + ")</span>";

/* ---------- n λ_th³ of the two liquids against temperature ---------- */
(() => {
  const svg = $("degen"), sT = $("sT"), seg = $("iso"), T0 = 0.5, T1 = 10, Y0 = 0.3, Y1 = 100;
  let iso = "he4";
  const Tde = () => T0 * Math.pow(T1 / T0, +sT.value);
  function draw() {
    const T = Tde(), s = He.systeme(iso, T);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { domain: [T0, T1], scale: "log", label: t("fig.ax.T"), fmt: v => F.num(v, 2) }, y: { domain: [Y0, Y1], scale: "log", label: t("fig.ax.n"), fmt: v => F.num(v, 2) } });
    const courbe = (i, cls) => { const pts = [];
      for (let k = 0; k <= 200; k++) { const Tk = T0 * Math.pow(T1 / T0, k / 200), y = He.systeme(i, Tk).degenerescence; if (y >= Y0 && y <= Y1) pts.push([o.x(Tk), o.y(y)]); }
      Plot.el("path", { d: Plot.path(pts), class: "stroke " + (i === iso ? "bold " : "") + cls }, o.g); };
    Plot.el("line", { x1: o.x(T0), x2: o.x(T1), y1: o.y(Q.ZETA32), y2: o.y(Q.ZETA32), class: "stroke thin dash c-label-2" }, o.g);
    Plot.el("line", { x1: o.x(He.T_LAMBDA), x2: o.x(He.T_LAMBDA), y1: o.y(Y0), y2: o.y(Y1), class: "stroke thin c-label-2" }, o.g);
    const lab = Plot.el("text", { x: o.x(He.T_LAMBDA) + 4, y: o.y(Y1) + 14 }, o.g); lab.textContent = t("fig.lambda");
    courbe("he3", "c-warn"); courbe("he4", "c-tint");
    if (s.degenerescence >= Y0 && s.degenerescence <= Y1)
      Plot.el("circle", { cx: o.x(T), cy: o.y(s.degenerescence), r: 5, class: "fill " + (iso === "he4" ? "c-tint" : "c-warn") }, o.g);
    $("sTv").innerHTML = kelvin(T);
    $("vl").textContent = F.si(s.lambda, "m", { sig: 3 });
    $("fl").textContent = t("fig.f.l", { d: F.si(s.d, "m", { sig: 3 }) });
    $("vld").textContent = F.num(s.rapport, 3);
    $("vn").textContent = F.num(s.degenerescence, 3);
    $("fn").textContent = t(s.degenerescence > Q.ZETA32 ? "fig.f.n.deg" : "fig.f.n.cl");
    if (iso === "he4") {
      $("kt").innerHTML = t("fig.k.tc"); $("vt").innerHTML = kelvin(s.Tc);
      $("ft").textContent = t("fig.f.tc", { f: F.num(100 * s.fraction, 2) });
    } else {
      $("kt").innerHTML = t("fig.k.tf"); $("vt").innerHTML = kelvin(s.TF);
      $("ft").textContent = t("fig.f.tf", { r: F.num(T / s.TF, 2) });
    }
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.i === iso)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { iso = b.dataset.i; draw(); });
  sT.oninput = draw; draw();
})();

/* ---------- the system described: the liquid at its λ point, a gas at room temperature ---------- */
(() => {
  const s = He.systeme("he4", He.T_LAMBDA), h3 = He.systeme("he3", 1);
  const n = 101325 / (Constantes.k_B * 300), m = Statistique.M.N2 / Constantes.N_A, air = n * Statistique.lambdaTh(m, 300) ** 3;
  $("sys").innerHTML = t("sys.body", { Tl: kelvin(He.T_LAMBDA), d: F.si(s.d, "m", { sig: 2 }), l: F.si(s.lambda, "m", { sig: 2 }),
    nl: F.num(s.degenerescence, 2), tc: kelvin(s.Tc), ecart: F.num(100 * (s.Tc / He.T_LAMBDA - 1), 2),
    tf: kelvin(h3.TF), air: F.sci(air, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["onnes", 1908, "experiment"], ["einstein", 1925, "idea"], ["keesom", 1927, "experiment"], ["kapitsa", 1938, "experiment"],
    ["london", 1938, "idea"], ["osheroff", 1972, "experiment"], ["cornell", 1995, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lhc"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["recouvre", "c"], ["viscosite", "a"], ["isotope", "d"], ["ideal", "b"], ["chaud", "a"], ["he3", "c"], ["lhc", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 446 });
})();
</script>
