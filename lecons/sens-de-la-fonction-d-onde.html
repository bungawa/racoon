<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, NB = 60, X = 1, IF = 0.15;     // fringes of spacing I over a Gaussian envelope, in units of the envelope width
const dens = x => Math.exp(-x * x / 0.18) * Math.cos(Math.PI * x / IF) ** 2;
$("sys1").innerHTML = t("sys.body");
(() => {
  const svg = $("histo"), sn = $("sn"), sg = $("sg");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [-X, X], label: t("fig.x") }, y: { domain: [0, 1.6], label: t("fig.y") } });
  const bars = Plot.el("g", {}, g), pd = Plot.el("path", { class: "stroke c-warn" }, g);
  /* the expected count per bin, normalised so that the largest expected bin is 1 */
  const h = 2 * X / NB, exp = [];
  for (let b = 0; b < NB; b++) { let s = 0; for (let k = 0; k < 20; k++) s += dens(-X + (b + (k + 0.5) / 20) * h); exp.push(s / 20); }
  const tot = exp.reduce((a, b) => a + b, 0), top = Math.max(...exp);
  pd.setAttribute("d", Plot.path(Array.from({ length: 401 }, (_, i) => { const u = -X + 2 * X * i / 400; return [x(u), y(dens(u) / top)]; })));
  function draw() {
    const N = Math.round(10 ** +sn.value), xs = Q.tirerDensite(dens, -X, X, N, +sg.value), c = new Array(NB).fill(0);
    for (const v of xs) c[Math.min(NB - 1, Math.floor((v + X) / h))]++;
    const scale = N * top / tot;                                        // expected count of the largest bin
    bars.replaceChildren();
    c.forEach((n, b) => { const v = n / scale; Plot.el("rect", { x: x(-X + b * h) + 0.5, width: x(h) - x(0) - 1, y: y(Math.min(1.6, v)), height: y(0) - y(Math.min(1.6, v)), class: "fill c-tint", "fill-opacity": 0.6 }, bars); });
    /* relative scatter on the bright bins: rms of (n − ⟨n⟩)/⟨n⟩ over bins whose expectation exceeds half the largest */
    let s2 = 0, k = 0; c.forEach((n, b) => { const e = exp[b] * N / tot; if (exp[b] > top / 2) { s2 += ((n - e) / e) ** 2; k++; } });
    const rel = Math.sqrt(s2 / k), pred = 1 / Math.sqrt(0.75 * N * top / tot);
    $("snr").textContent = F.num(N, 3); $("sgr").textContent = String(+sg.value);
    $("ve").textContent = F.qty(F.num(100 * rel, 2), "%");
    $("fe").textContent = t("fig.f.e", { p: F.qty(F.num(100 * pred, 2), "%") });
    $("vc").textContent = pred < 0.05 ? t("fig.v.oui") : t("fig.v.non");
    $("fc").textContent = t("fig.f.c");
    $("vj").textContent = t("fig.v.j");
    $("fj").textContent = t("fig.f.j");
  }
  sn.oninput = sg.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["madelung", 1926, "idea"], ["london", 1935, "idea"], ["bec", 1995, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["laser"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["charge", "b"], ["bosons", "c"], ["fluctu", "a"], ["photon", "a"], ["phase", "b"], ["jauge", "a"], ["vitesse", "c"], ["deux", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 214 });
})();
