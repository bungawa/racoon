<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const E4 = Electro4D, K = Constantes, c = K.c;

/* ---------- le système décrit : ce que la forme à quatre dimensions néglige ---------- */
(() => {
  const pes = K.g0 * 1 / (c * c);                                         // gH/c² for H = 1 m
  const rot = K.Omega_E * 10 / c;                                         // ΩL/c, L = 10 m: the Sagnac term, first order in the rotation
  const Es = K.m_e ** 2 * c ** 3 / (K.e * K.hbar);                        // Sauter–Schwinger field
  const Ep = K.e / (4 * Math.PI * K.eps0) / (1e-10) ** 2;               // field of a proton at 0,1 nm
  $("sys1").innerHTML = t("sys1.body", { pes: F.sci(pes, 2), rot: F.sci(rot, 1), om: F.sci(K.Omega_E, 2), Es: F.sci(Es, 2), Ep: F.sci(Ep, 2) });
})();

/* ---------- Lorenz ou Coulomb : la charge en mouvement uniforme ---------- */
(() => {
  const svg = $("trace"), sb = $("sb"), q = 1e-9, b = 1, unit = q / (4 * Math.PI * K.eps0) / (c * b * b), h = 1e-4;
  const X = Array.from({ length: 241 }, (_, i) => -4 + 8 * i / 240);
  function draw() {
    const beta = +sb.value / 100, A = E4.quadripotentielCharge(q, beta * c).A;
    const pts = X.map(x => E4.jauges(A, [0, x * b, b, 0], h));
    const top = Math.max(0.05, ...pts.map(p => Math.abs(p.espace) / unit)) * 1.15;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 60, b: 44 }, x: { domain: [-4, 4], label: t("fig.xaxis") }, y: { domain: [-top, top], label: t("fig.yaxis") } });
    const line = (k, cls) => Plot.el("path", { d: Plot.path(X.map((x, i) => [P.x(x), P.y(pts[i][k] / unit)])), class: "stroke" }, Plot.el("g", { class: cls }, P.g));
    Plot.el("path", { d: Plot.path(X.map((x, i) => [P.x(x), P.y(pts[i].temps / unit)])), class: "curve" }, P.g);
    line("espace", "c-warn"); line("lorenz", "c-ok");
    const lor = Math.max(...pts.map(p => Math.abs(p.lorenz))), ech = Math.max(...pts.map(p => p.echelle)), cou = Math.max(...pts.map(p => Math.abs(p.espace)));
    const g = 1 / Math.sqrt(1 - beta * beta);
    $("sbr").textContent = F.num(beta, 2) + "\u00a0c";
    $("vlor").textContent = beta === 0 ? "0" : F.sci(lor / ech, 1);
    $("flor").textContent = t("fig.f.lorenz");
    $("vcou").textContent = t("fig.cou", { v: F.num(cou / unit, 3) });
    $("fcou").textContent = t("fig.f.coulomb", { x: F.num(1 / (g * Math.SQRT2), 2) });
    $("vrep").textContent = t("fig.rep");
    $("frep").textContent = t("fig.f.repos");
  }
  sb.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dalembert", 1747, "idea"], ["lorenz", 1867, "idea"], ["minkowski", 1908, "idea"], ["sommerfeld", 1910, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["qed"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["unites", "c"], ["argument", "a"], ["contenu", "d"], ["jauge", "b"], ["coulomb", "c"], ["courant", "a"], ["repos", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 254 });
})();
</script>
