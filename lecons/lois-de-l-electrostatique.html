<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- est-ce de l'électrostatique ? deux nombres sans dimension ---------- */
(() => {
  const ES = Electrostatique, S = ES.SYSTEMES, SEUIL = 0.01;                  // what is neglected must stay under 1 %
  const Lsl = $("Lsl"), Tsl = $("Tsl"), vsl = $("vsl"), btn = document.querySelectorAll("[data-s]");
  const VMIN = -6;                                                            // slider at its minimum: charges at rest
  let choisi = "ballon";
  const fmtR = x => x === 0 ? "0" : x < 1e-3 || x >= 1e3 ? F.sci(x, 2) : F.num(x, 2);
  function draw() {
    const L = Math.pow(10, +Lsl.value), T = Math.pow(10, +Tsl.value), beta = +vsl.value <= VMIN ? 0 : Math.pow(10, +vsl.value);
    const v = beta * ES.C, r = ES.regime(L, T, Math.min(v, 0.999 * ES.C));
    $("Lread").textContent = F.si(L, "m", L >= 1e3 ? { prefix: "k" } : {});
    $("Tread").textContent = F.si(T, "s");
    $("vread").textContent = beta === 0 ? t("re.repos") : t("re.vread", { b: fmtR(beta) });
    $("vretard").textContent = fmtR(r.retard);
    $("vmagn").textContent = fmtR(r.magnetique);
    const bad = [r.retard >= SEUIL ? "retard" : null, r.magnetique >= SEUIL ? "magn" : null].filter(Boolean);
    $("vverdict").textContent = t(bad.length ? "re.non" : "re.oui");
    $("fverdict").textContent = t("re.v." + (bad.length === 2 ? "deux" : bad[0] || "ok"));
    $("reread").innerHTML = choisi ? t("re.read." + choisi) : t("re.read.libre");
  }
  function choisir(id) {
    choisi = id; const s = S[id];
    Lsl.value = Math.log10(s.L); Tsl.value = Math.log10(s.T); vsl.value = s.v > 0 ? Math.log10(s.v / ES.C) : VMIN;
    btn.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === id)));
    draw();
  }
  btn.forEach(b => b.onclick = () => choisir(b.dataset.s));
  [Lsl, Tsl, vsl].forEach(s => s.oninput = () => { choisi = null; btn.forEach(b => b.setAttribute("aria-pressed", "false")); draw(); });
  choisir("ballon");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["priestley", 1767, "idea"], ["coulomb", 1785, "experiment"], ["volta", 1800, "experiment"], ["oersted", 1820, "experiment"],
    ["cottrell", 1908, "use"], ["carlson", 1938, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["filtres", "photocopie", "decharges"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["decouple", "b"], ["courant", "a"], ["induction", "d"], ["tube", "c"], ["ligne", "a"], ["divergence", "b"], ["connues", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 41 });
})();
</script>
