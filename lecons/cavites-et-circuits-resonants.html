<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, C = Constantes.c, A = 0.04;                          // can of 4 cm radius

/* ---------- la cavité chargée : coupe, modèle localisé, modèle de ligne ---------- */
(() => {
  const svg = $("coupe"), sb = $("sb"), sh = $("sh"), sg = $("sg");
  function draw() {
    const b = +sb.value / 100, h = +sh.value / 100, g = Math.min(+sg.value / 1000, 0.9 * h), k = M.caviteChargee({ a: A, b, h, g });
    /* cross-section through the axis, to scale: at most 1 cm = 70 px, the whole height within 260 px ; axis at x = 320 */
    const s = Math.min(7000, 260 / h), X = x => 320 + s * x, top = 140 - s * h / 2, bot = 140 + s * h / 2, post = (h - g) / 2;
    svg.innerHTML = "";
    Plot.el("rect", { x: X(-A), y: top, width: 2 * s * A, height: s * h, class: "stroke bold c-label-2" }, svg);
    Plot.el("rect", { x: X(-b), y: top, width: 2 * s * b, height: s * post, class: "stroke bold c-label-2" }, svg);
    Plot.el("rect", { x: X(-b), y: bot - s * post, width: 2 * s * b, height: s * post, class: "stroke bold c-label-2" }, svg);
    /* E across the gap ; B around the posts: out of the page on the left (dot), into it on the right (cross) */
    for (let i = -2; i <= 2; i++) Plot.fleche(svg, [X(0.8 * i * b / 2), 140 + s * g / 2], [X(0.8 * i * b / 2), 140 - s * g / 2], { cls: "c-tint", min: 0, tete: 4 });
    for (const side of [-1, 1]) for (let j = 1; j <= 2; j++) for (let l = -1; l <= 1; l++) {
      const cx = X(side * (b + (A - b) * j / 3)), cy = 140 + l * s * h / 3.2, q = 3;
      Plot.el("circle", { cx, cy, r: 6, class: "stroke c-warn" }, svg);
      if (side < 0) Plot.el("circle", { cx, cy, r: 1.8, class: "fill c-warn" }, svg);
      else { Plot.el("line", { x1: cx - q, y1: cy - q, x2: cx + q, y2: cy + q, class: "stroke c-warn" }, svg); Plot.el("line", { x1: cx - q, y1: cy + q, x2: cx + q, y2: cy - q, class: "stroke c-warn" }, svg); }
    }
    $("sbr").textContent = F.qty(F.num(100 * b, 3), "cm");
    $("shr").textContent = F.qty(F.num(100 * h, 3), "cm");
    $("sgr").textContent = F.qty(F.num(1000 * g, 3), "mm");
    $("vloc").textContent = F.si(k.f0Localise, "Hz");
    $("floc").innerHTML = t("fig.f.loc", { C: F.si(k.C, "F"), L: F.si(k.L, "H") });
    $("vligne").textContent = F.si(k.f0Ligne, "Hz");
    $("fligne").innerHTML = t("fig.f.ligne", { e: F.qty(F.num(100 * (1 - k.f0Ligne / k.f0Localise), 2), "%"), kh: F.num(k.kh, 2), kb: F.num(k.kb, 2) });
    $("vboite").textContent = F.si(k.f0Boite, "Hz");
    $("fboite").textContent = t("fig.f.boite", { r: F.num(k.f0Ligne / k.f0Boite, 2) });
  }
  sb.oninput = sh.oninput = sg.oninput = draw; draw();
})();

/* ---------- le système décrit : trois résonateurs, du circuit à la boîte ---------- */
(() => {
  const L = 1e-6, Cc = 100e-12, f1 = 1 / (2 * Math.PI * Math.sqrt(L * Cc)), d1 = 0.02;
  const k = M.caviteChargee({ a: A, b: 0.01, h: 0.03, g: 0.002 }), boite = M.cavite(A, 0.03);
  $("sys1").innerHTML = t("sys1.body", { L: F.si(L, "H"), C: F.si(Cc, "F"), f1: F.si(f1, "Hz"), q1: F.sci(d1 / (C / f1), 2),
    f2: F.si(k.f0Ligne, "Hz"), q2: F.num(2 * A / (C / k.f0Ligne), 2), f3: F.si(boite.f0, "Hz"), q3: F.num(2 * A / boite.lambda, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["thomson", 1853, "idea"], ["feddersen", 1859, "experiment"], ["hansen", 1938, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["klystron"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["monter", "b"], ["parallele", "d"], ["mutuelle", "a"], ["regions", "c"], ["hauteur", "b"], ["ligne", "a"], ["boite", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 235 });
})();
</script>
