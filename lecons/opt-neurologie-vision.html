<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, P = Plot.el;

/* ---------- inhibition latérale : équations de Hartline et Ratliff sur une rangée d'ommatidies ---------- */
(() => {
  const svg = $("inhib"), W = 640, H = 300, N = 80, sk = $("kk"), sl = $("ll"), seg = $("motif");
  let motif = "marche";
  const pc = x => F.qty(F.num(100 * x, 3), "%");
  function draw() {
    const K = +sk.value, l = +sl.value, e = O.motifLumiere(motif, N), r = O.inhibitionLaterale(e, { K, l }).r;
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: W, h: H, x: { domain: [0, N - 1], label: t("in.ax.x") }, y: { domain: [0, 3.2], label: t("in.ax.y") } });
    P("path", { d: Plot.path(e.map((v, i) => [ax.x(i), ax.y(v)])), class: "stroke thin c-label-2" }, svg);
    P("path", { d: Plot.path(r.map((v, i) => [ax.x(i), ax.y(v)])), class: "stroke bold c-tint" }, svg);
    r.forEach((v, i) => P("circle", { cx: ax.x(i), cy: ax.y(v), r: 2, class: "fill c-tint" }, svg));
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === motif)));
    $("kkr").textContent = F.num(K, 2); $("llr").textContent = t("in.v.l").replace("{l}", F.num(l, 2));
    const b = O.bordsMach(r);
    if (motif === "fente") {
      $("k1").textContent = t("in.k.trait"); $("v1").textContent = F.num(b.pic / b.bas, 3); $("f1").textContent = t("in.f.trait");
      $("k2").textContent = t("in.k.cotes"); $("v2").textContent = pc(b.creusement); $("f2").textContent = t("in.f.cotes");
    } else {
      $("k1").textContent = t("in.k.claire"); $("v1").textContent = pc(b.depassement); $("f1").textContent = t("in.f.claire");
      $("k2").textContent = t("in.k.sombre"); $("v2").textContent = pc(b.creusement); $("f2").textContent = t("in.f.sombre");
    }
    $("k3").textContent = t("in.k.fond"); $("v3").textContent = pc(b.bas / e[0]); $("f3").textContent = t("in.f.fond").replace("{u}", pc(1 / (1 + K)));
  }
  seg.querySelectorAll("button").forEach(btn => btn.onclick = () => { motif = btn.dataset.m; draw(); });
  sk.oninput = sl.oninput = draw;
  draw();
})();

/* ---------- les cinq sortes de fibres de la grenouille ---------- */
(() => {
  const TYPES = ["bord", "convexe", "contraste", "assombrir", "noir"], txt = textOf("gr.types", TYPES);
  $("types").innerHTML = TYPES.map((id, i) => `<div><span class="k">${t("gr.num").replace("{n}", i + 1)}</span><span><strong>${txt[id].name}.</strong> ${txt[id].text} <span class="aux">${txt[id].data}</span></span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mach", 1865, "idea"], ["adrian", 1926, "experiment"], ["limule", 1932, "experiment"], ["inhibition", 1956, "experiment"], ["grenouille", 1959, "experiment"], ["chat", 1959, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["evenements", "nettete"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["impulsion", "b"], ["limule", "d"], ["voisin", "a"], ["uniforme", "c"], ["bord", "b"], ["mach", "d"], ["mouche", "a"], ["couleur", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 366 });
})();
</script>
