    <div class="eq"><math display="block"><mover accent="true"><mi>p</mi><mo>→</mo></mover><mo>=</mo><mi>γ</mi><mi>m</mi><mover accent="true"><mi>v</mi><mo>→</mo></mover><mo>,</mo><mspace width="0.6em"/><mi>γ</mi><mo>=</mo><mfrac><mn>1</mn><msqrt><mn>1</mn><mo>−</mo><msup><mi>v</mi><mn>2</mn></msup><mo>/</mo><msup><mi>c</mi><mn>2</mn></msup></msqrt></mfrac></math><span class="n">(10.8)</span></div>

      <div class="panel">

        <div class="stats">
          <div class="stat"><span class="k" data-i18n="p.k.v"></span><span class="v" id="pv"></span></div>

        </div>
      </div>
      <figcaption data-i18n-html="p.caption"></figcaption>
    </figure>
    <div class="eq"><math display="block"><mi>E</mi><mo>=</mo><mi>γ</mi><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup><mo>,</mo><mspace width="0.6em"/><msup><mi>E</mi><mn>2</mn></msup><mo>=</mo><msup><mi>p</mi><mn>2</mn></msup><msup><mi>c</mi><mn>2</mn></msup><mo>+</mo><msup><mi>m</mi><mn>2</mn></msup><msup><mi>c</mi><mn>4</mn></msup></math><span class="n">(10.7a)</span></div>
    <p class="validite" data-i18n-html="val.10.15"></p>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>

    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><mi>M</mi><mo>=</mo><mn>2</mn><mi>γ</mi><mo stretchy="false">(</mo><mi>u</mi><mo stretchy="false">)</mo><mspace width="0.1em"/><mi>m</mi><mo>&gt;</mo><mn>2</mn><mi>m</mi><mo>,</mo><mspace width="0.6em"/><mi>w</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>u</mi></mrow><mrow><mn>1</mn><mo>+</mo><msup><mi>u</mi><mn>2</mn></msup><mo>/</mo><msup><mi>c</mi><mn>2</mn></msup></mrow></mfrac></math><span class="n">(10.7b)</span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/quantite-de-mouvement-relativiste.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/quantite-mouvement.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const C = QteMvt.C;
const speed = v => v >= 1e3 ? F.qty(F.num(v / 1e3, 4), "km·s⁻¹") : F.qty(F.num(v, 3), "m·s⁻¹");
const rel = x => x >= 1e-3 ? F.qty(F.num(100 * x, 3), "%") : F.sci(x, 2);
const relz = x => x < 1e-12 ? t("st.zero") : rel(x);                       // sous 10⁻¹², c'est l'arrondi des flottants

/* ---------- p = γ m v contre m v ---------- */
(() => {
  const svg = $("pchart"), sl = $("bsl"), YMAX = 4;
  function draw() {
    svg.innerHTML = "";
    const beta = Math.pow(10, +sl.value), g0 = QteMvt.gamma(beta);
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { domain: [0, 1], label: t("p.x") }, y: { domain: [0, YMAX], label: t("p.y") } });
    const BTOP = YMAX / Math.hypot(1, YMAX);                                       // γβ = YMAX : le bord haut du graphe
    let d = ""; for (let i = 0; i <= 300; i++) { const b = BTOP * i / 300; d += (i ? "L" : "M") + x(b).toFixed(1) + " " + y(b * QteMvt.gamma(b)).toFixed(1); }
    Plot.el("path", { d, class: "curve" }, g);
    Plot.el("path", { d: "M" + x(0) + " " + y(0) + "L" + x(1) + " " + y(1), class: "ref" }, g);
    Plot.el("circle", { cx: x(beta), cy: y(Math.min(YMAX, beta * g0)), r: 6, class: "dot" }, g);
    $("bread").textContent = F.num(beta, 3);
    $("pv").textContent = speed(beta * C);
    $("pg").textContent = g0 < 1 + 1e-6 ? t("p.gsmall", { d: F.sci(QteMvt.gammaMinusOne(beta), 2) }) : F.num(g0, 4);
    $("perr").textContent = rel(QteMvt.gammaMinusOne(beta));
  }
  sl.oninput = draw; draw();
})();

/* ---------- deux boules qui se collent, vues du référentiel de l'une d'elles ---------- */
(() => {
  const sl = $("usl");
  function upd() {
    const b = Math.pow(10, +sl.value), u = b * C, m = 1, s = QteMvt.stick(m, u, m, -u);
    const frame = -u, w = QteMvt.addVelocity(u, frame), V = QteMvt.addVelocity(s.V, frame);       // dans le référentiel de la boule 2
    const clBefore = m * w, clAfter = 2 * m * V;
    const relBefore = QteMvt.momentumRel(m, w) + QteMvt.momentumRel(m, QteMvt.addVelocity(-u, frame)), relAfter = QteMvt.momentumRel(s.M, V);
    $("uread").textContent = F.num(b, 3);
    $("sw").textContent = F.num(w / C, 4); $("swf").textContent = t("st.f.w", { g: F.num(2 * b, 4) });
    $("scl").textContent = rel(Math.abs(clAfter / clBefore - 1));
    $("srel").textContent = relz(Math.abs(relAfter / relBefore - 1));
    $("sm").textContent = F.num(s.M / (2 * m), 5);
  }
  sl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kaufmann", 1901, "experiment"], ["einstein", 1905, "idea"], ["planck", 1906, "idea"], ["bucherer", 1908, "experiment"], ["compton", 1923, "experiment"], ["bertozzi", 1964, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["collisionneur", "detecteur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["gamma", "a"], ["mur", "a"], ["avion", "a"], ["masse", "a"], ["photon", "a"], ["referentiel", "a"], ["doubler", "a"], ["aimants", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 105 });
})();
</script>
