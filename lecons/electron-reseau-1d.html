<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const t_ = t;
const Q = QuantSchro, K = Constantes, B = 3e-10, N = 61, MIL = 30;

/* ---------- an electron put on one atom, then left alone ---------- */
(() => {
  const svg = $("fig"), st = $("st"), sa = $("sa");
  const C0 = Array.from({ length: N }, (_, n) => n === MIL ? 1 : 0);
  function draw() {
    const tfs = +st.value, AeV = +sa.value, o = { E0: 0, A: AeV * K.e, b: B }, t = tfs * 1e-15;
    const C = Q.evolutionChaine(C0, o, t), m = Q.moyenneSite(C), haut = Math.max(0.2, Math.ceil(Math.max(...C.map(z => z.P)) * 10) / 10);
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [-MIL, MIL], label: t_("fig.xaxis") }, y: { domain: [0, haut], label: t_("fig.yaxis") } });
    const g = Plot.el("g", { class: "c-label" }, G.g);
    C.forEach((z, n) => { const x = G.x(n - MIL); Plot.el("line", { x1: x, x2: x, y1: G.y(0), y2: G.y(z.P), class: "stroke bold" }, g); });
    /* the fastest part of the spreading: 2A/ħ atoms per second, the largest group velocity of the band */
    const front = 2 * o.A * t / K.hbar, gf = Plot.el("g", { class: "c-warn" }, G.g);
    for (const s of [-1, 1]) if (front <= MIL) { const x = G.x(s * front); Plot.el("line", { x1: x, x2: x, y1: G.y(0), y2: G.y(haut), class: "stroke thin dash" }, gf); }
    $("str").textContent = F.si(t, "s");
    $("sar").textContent = F.si(o.A / K.e, "eV");
    $("ve").textContent = t_("fig.v.ecart", { n: F.num(m.ecart, 3) });
    $("fe").textContent = t_("fig.f.ecart", { d: F.si(m.ecart * B, "m"), r: F.num(m.ecart / Math.max(1e-9, Math.SQRT2 * o.A * t / K.hbar), 3) });
    $("vf").textContent = F.si(2 * o.A * B / K.hbar, "m·s⁻¹");
    $("ff").textContent = t_("fig.f.front");
    $("vs").textContent = F.si(K.hbar / o.A, "s");
    $("fs").textContent = t_("fig.f.saut");
  }
  st.oninput = draw; sa.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const A = 1 * K.e;
  $("sys1").innerHTML = t_("sys1.body", { tau: F.si(K.hbar / A, "s"), v: F.si(2 * A * B / K.hbar, "m·s⁻¹") });
  $("sys2").innerHTML = t_("sys2.body", { r: F.sci(Math.exp(-B / K.a0), 1) });
  $("sys3").innerHTML = t_("sys3.body", { n: F.sci(1e-2 / B, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hill", 1877, "idea"], ["floquet", 1883, "idea"], ["bloch", 1929, "idea"], ["slater", 1954, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["materiaux", "polymeres"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["base", "c"], ["voisins", "a"], ["e0", "d"], ["etale", "b"], ["parfait", "a"], ["vitesse", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1301 });
})();
</script>
