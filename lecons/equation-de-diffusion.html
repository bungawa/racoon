<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- a pulse of heat in a bar of 10 cm: the scheme against the exact Gaussian ---------- */
(() => {
  const L = 0.1, S0 = 0.002, SMAX = 0.015, svg = $("barre");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 },
    x: { domain: [-5, 5], label: t("barre.x") }, y: { domain: [0, 1.05], label: t("barre.y"), ticks: 5 } });
  const courbe = Plot.el("path", { class: "curve" }, g), depart = Plot.el("path", { class: "ref" }, g), points = Plot.el("g", {}, g);
  const pic0 = Diffusion.gaussienne(0, 0, 1, 1, S0), path = f => Array.from({ length: 201 }, (_, i) => -L / 2 + i * L / 200)
    .map((xi, i) => (i ? "L" : "M") + x(100 * xi).toFixed(1) + " " + y(f(xi) / pic0).toFixed(1)).join("");
  depart.setAttribute("d", path(xi => Diffusion.gaussienne(xi, 0, 1, 1, S0)));
  let mat = "cuivre";
  const duree = s => s < 1 ? F.qty(F.num(s * 1e3, 2), "ms") : s < 120 ? F.qty(F.num(s, 2), "s") : s < 7200 ? F.qty(F.num(s / 60, 2), t("barre.min")) : s < 2 * 86400 ? F.qty(F.num(s / 3600, 2), t("barre.heures")) : F.qty(F.num(s / 86400, 2), t("barre.jours"));
  function draw() {
    const D = Diffusion.MATERIAUX[mat].a, tmax = (SMAX ** 2 - S0 ** 2) / (2 * D), tt = tmax * +$("tsl").value / 100;
    const R = Diffusion.impulsion({ L, N: 101, a: D, E: 1, s0: S0, t: tt });
    courbe.setAttribute("d", path(xi => Diffusion.gaussienne(xi, tt, D, 1, S0)));
    points.innerHTML = "";
    R.x.forEach((xi, i) => { if (i % 4 === 0) Plot.el("circle", { cx: x(100 * xi), cy: y(R.T[i] / pic0), r: 3, class: "dot" }, points); });
    const s = Diffusion.largeur(tt, D, S0), pic = Math.max(...R.T) / pic0;
    $("tread").textContent = duree(tt);
    $("vs").textContent = F.qty(F.num(s * 1e3, 3), "mm");
    $("vpic").textContent = F.qty(F.num(100 * pic, 3), "%");
    $("fpic").textContent = t("barre.f.pic", { th: F.num(100 * S0 / s, 3) });
    $("vaire").textContent = F.qty(F.num(100 * R.aire, 4), "%");
    $("faire").textContent = t("barre.f.aire", { n: F.num(R.n, 3), r: F.num(R.r, 2) });
    $("vcm").textContent = duree(Diffusion.tempsDiffusion(0.01, D));
    $("fcm").textContent = t("barre.f.cm", { d: F.sci(D, 3) });
  }
  $("mat").querySelectorAll("button").forEach(b => b.onclick = () => {
    mat = b.dataset.v; $("mat").querySelectorAll("button").forEach(q => q.setAttribute("aria-pressed", q === b)); draw();
  });
  $("tsl").oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fourier", 1807, "idea"], ["theorie", 1822, "idea"], ["fick", 1855, "experiment"], ["parker", 1961, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["flash", "soupe"], uses = textOf("uses.items", USES);
  const v = { tf: F.num(1e3 * Diffusion.flashDemiTemps(2e-3, Diffusion.MATERIAUX.cuivre.a), 2), te: F.num(Diffusion.tempsDiffusion(0.01, Diffusion.MATERIAUX.eau.a) / 60, 2),
    jours: F.num(Diffusion.tempsDiffusion(0.1, Diffusion.MATERIAUX.eau.a) / 86400, 2) };
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace(/\{(\w+)\}/g, (_, k) => v[k])}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["local", "a"], ["source", "b"], ["fourier", "c"], ["temps", "d"], ["largeur", "a"], ["diffusivite", "b"], ["regime", "c"], ["stabilite", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 304 });
})();
</script>
