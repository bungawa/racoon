<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["noeuds", "mailles"]; keyed($("lois"), t("lois.tag"), IDS, textOf("lois.items", IDS)); })();
(() => { const IDS = ["bobine", "condensateur", "taille"]; keyed($("composants"), t("composants.tag"), IDS, textOf("composants.items", IDS)); })();

/* ---------- §25-5 : trois réseaux des mêmes composants, réduits branche par branche ---------- */
(() => {
  const L = 10e-3, r = 10, C = 100e-9, F0 = 1 / (2 * Math.PI * Math.sqrt(L * C)), ZMIN = 1, ZMAX = 1e6;
  /* each network: its two branches (tree), how they combine */
  const RESEAUX = [
    ["serie", ["serie", ["R", r], ["L", L]], ["C", C], "serie"],
    ["ideal", ["L", L], ["C", C], "parallele"],
    ["reel", ["serie", ["R", r], ["L", L]], ["C", C], "parallele"],
  ];
  const noms = textOf("im.reseaux", RESEAUX.map(x => x[0]));
  let k = 0;
  $("choix").innerHTML = RESEAUX.map(([id], i) => `<button type="button" data-i="${i}" aria-pressed="${i === 0}">${noms[id]}</button>`).join("");
  const LF = Array.from({ length: 601 }, (_, i) => 2 + 3 * i / 600);
  const tout = (n, w) => { const [, b1, b2, how] = RESEAUX[n]; try { return Ondes.reseau([how, b1, b2], w); } catch (e) { return null; } };
  const cplx = z => z == null ? "∞" : Cx.text(Cx.c(z.re, z.im), v => F.num(v, 3)) + " Ω";
  function upd() {
    [...$("choix").children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === k)));
    const f = 10 ** +$("lf").value, w = 2 * Math.PI * f, [, b1, b2] = RESEAUX[k];
    const svg = $("trace"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 60, b: 44 }, x: { scale: "log", domain: [100, 1e5], label: t("im.xaxis") }, y: { scale: "log", domain: [ZMIN, ZMAX], label: t("im.yaxis") } });
    Plot.el("line", { x1: P.x(F0), x2: P.x(F0), y1: P.y(ZMIN), y2: P.y(ZMAX), class: "stroke thin dash c-label-2" }, P.g);
    const clampZ = z => Math.min(ZMAX, Math.max(ZMIN, z == null ? ZMAX : Cx.abs(z)));
    Plot.el("path", { d: Plot.path(LF.map(lf => [P.x(10 ** lf), P.y(clampZ(tout(k, 2 * Math.PI * 10 ** lf)))])), class: "curve" }, P.g);
    const Z = tout(k, w);
    Plot.el("circle", { cx: P.x(f), cy: P.y(clampZ(Z)), r: 5, class: "dot" }, P.g);
    /* readouts: the two branches, then the whole */
    const z1 = Ondes.reseau(b1, w), z2 = Ondes.reseau(b2, w);
    $("lfv").textContent = F.si(f, "Hz");
    $("v1").textContent = cplx(z1); $("f1").textContent = t("im.f.b1." + RESEAUX[k][0]);
    $("v2").textContent = cplx(z2); $("f2").textContent = t("im.f.b2");
    $("vz").textContent = cplx(Z);
    $("fz").textContent = Z == null ? t("im.f.infini") : t("im.f.z", { m: F.si(Cx.abs(Z), "Ω"), phi: F.qty(F.fix(Cx.arg(Z), 2), "rad"),
      nature: t(Math.abs(Z.im) < 1e-3 * Cx.abs(Z) ? "im.nature.r" : Z.im > 0 ? "im.nature.l" : "im.nature.c") });
  }
  $("lf").oninput = upd; $("choix").onclick = e => { const b = e.target.closest("button"); if (b) { k = +b.dataset.i; upd(); } };
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kirchhoff", 1845, "idea"], ["heaviside", 1886, "idea"], ["kennelly", 1893, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["filtre", "spectroscopie"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["serie", "b"], ["parallele", "c"], ["bouchon", "a"], ["basse", "d"], ["reel", "b"], ["noeud", "a"], ["deux", "c"], ["methode", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 255 });
})();
</script>
