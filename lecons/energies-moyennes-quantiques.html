<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, R = Math.PI / 180, NMAX = 2000;
const A = Constantes.h * 24e9 / 2;                                    // half the ammonia splitting, h × 24 GHz = 2A
$("sys1").innerHTML = t("sys.body", { A2: F.si(2 * A / Constantes.e, "eV"), kT: F.si(Constantes.k_B * 300 / Constantes.e, "eV") });
(() => {
  const svg = $("conv"), sa = $("sa"), sd = $("sd"), sg = $("sg");
  const H = [[0, -1], [-1, 0]];                                        // in units of A, energies from E0
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [1, NMAX], scale: "log", label: t("fig.x") }, y: { domain: [-1.2, 1.2], label: t("fig.y") } });
  const band = Plot.el("path", { class: "area c-label-2", "fill-opacity": 0.25 }, g), th = Plot.el("line", { x1: x(1), x2: x(NMAX), class: "stroke thin dash c-warn" }, g), run = Plot.el("path", { class: "stroke c-tint" }, g);
  for (const v of [-1, 1]) Plot.el("line", { x1: x(1), x2: x(NMAX), y1: y(v), y2: y(v), class: "stroke thin c-label-2" }, g);
  function draw() {
    const a = +sa.value * R, d = +sd.value * R, C = [{ re: Math.cos(a), im: 0 }, { re: Math.sin(a) * Math.cos(d), im: Math.sin(a) * Math.sin(d) }];
    const D = Q.decomposition(H, C), m = Q.moyenneOperateur(H, C), sig = Math.sqrt(Math.max(0, D.P[0] * (D.E[0] - m) ** 2 + D.P[1] * (D.E[1] - m) ** 2));
    const r = Q.tirerMesures(D.P, D.E, NMAX, +sg.value);
    let s = 0, dr = "", up = [], lo = [];
    r.forEach((v, i) => { s += v; const n = i + 1; dr += (i ? "L" : "M") + x(n).toFixed(1) + " " + y(s / n).toFixed(1); });
    for (let n = 1; n <= NMAX; n = Math.ceil(n * 1.1)) { up.push([x(n), y(Math.min(1.2, m + sig / Math.sqrt(n)))]); lo.push([x(n), y(Math.max(-1.2, m - sig / Math.sqrt(n)))]); }
    run.setAttribute("d", dr);
    band.setAttribute("d", Plot.path(up.concat(lo.reverse())) + "Z");
    th.setAttribute("y1", y(m)); th.setAttribute("y2", y(m));
    const nI = r.filter(v => v === D.E[0]).length;
    $("sar").textContent = F.num(+sa.value, 3) + "°"; $("sdr").textContent = F.num(+sd.value, 3) + "°"; $("sgr").textContent = String(+sg.value);
    $("vp").textContent = F.num(D.P[0], 3) + " ; " + F.num(D.P[1], 3);
    $("fp").textContent = t("fig.f.p", { f: F.num(nI / NMAX, 3), n: NMAX });
    $("ve").textContent = t("fig.v.e", { e: F.num(D.moyenne, 3) });
    $("fe").textContent = t("fig.f.e", { e: F.num(m, 3) });
    $("vm").textContent = t("fig.v.e", { e: F.num(s / NMAX, 3) });
    $("fm").textContent = t("fig.f.m", { n: NMAX, s: F.num(sig / Math.sqrt(NMAX), 2) });
  }
  sa.oninput = sd.oninput = sg.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["born", 1926, "idea"], ["maser", 1953, "experiment"], ["vqe", 2014, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["vqe"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["resultat", "b"], ["formule", "c"], ["propre", "a"], ["croise", "c"], ["precision", "b"], ["lz", "a"], ["normalisation", "d"], ["hermitien", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 202 });
})();
</script>
