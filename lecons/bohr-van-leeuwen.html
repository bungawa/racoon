<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes;

/* ---------- un gaz classique de charges dans une boîte ronde, dans un champ ---------- */
(() => {
  const svg = $("disque"), sr = $("sr"), sg = $("sg"), O = [165, 165], R = 150;
  const px = p => [O[0] + R * p[0], O[1] - R * p[1]];
  function draw() {
    const rc = Math.pow(10, +sr.value), graine = 3 + 7919 * +sg.value;
    const g = M.gazDisque({ N: 4000, rc, periodes: 20, traces: 40, duree: 2, graine });
    svg.innerHTML = "";
    Plot.el("circle", { cx: O[0], cy: O[1], r: R, class: "stroke rim" }, svg);
    for (const tr of g.traces.slice().sort((a, b) => a.bord - b.bord))
      Plot.el("path", { d: Plot.path(tr.points.map(px)), class: "stroke thin " + (tr.bord ? "c-warn" : "c-tint") }, svg);
    // the three sums as bars, in units of N kT/B
    const X0 = 360, X1 = 620, y0 = 165, H = 120, bar = (v, x, cls, key) => {
      const h = Math.max(-1, Math.min(1, v)) * H;
      Plot.el("rect", { x, y: h > 0 ? y0 - h : y0, width: 46, height: Math.abs(h), class: "fill " + cls }, svg);
      const e = Plot.el("text", { x: x + 23, y: y0 + H + 34, "text-anchor": "middle" }, svg); e.textContent = t(key);
    };
    Plot.el("line", { x1: X0, x2: X1, y1: y0, y2: y0, class: "stroke thin" }, svg);
    bar(g.interieur, 380, "c-tint", "fig.b.int"); bar(g.bord, 470, "c-warn", "fig.b.bord"); bar(g.total, 560, "c-label", "fig.b.total");
    const s = Plot.el("rect", { x: 556, y: y0 - 2 * g.sigma * H, width: 54, height: 4 * g.sigma * H, class: "stroke thin dash" }, svg);
    const u = Plot.el("text", { x: X0, y: 24 }, svg); u.textContent = t("fig.unite");
    $("srr").textContent = F.num(rc, 2);
    $("sgr").textContent = t("fig.n", { n: +sg.value });
    const z = v => F.num(v, 2);
    $("vi").textContent = z(g.interieur); $("fi").innerHTML = t("fig.f.int", { n: g.N - g.nBord, N: g.N });
    $("vb").textContent = z(g.bord); $("fb").innerHTML = t("fig.f.bord", { n: g.nBord });
    $("vt").textContent = z(g.total); $("ft").innerHTML = t("fig.f.total", { s: F.num(g.sigma, 2) });
  }
  sr.oninput = sg.oninput = draw; draw();
})();

/* ---------- le système décrit : les électrons du cuivre, traités en particules classiques ---------- */
(() => {
  const n = M.PORTEURS.cuivre, T = 300, B = 1, chi = -Cst.mu0 * n * Cst.k_B * T / (B * B);
  const rc = Math.sqrt(Cst.m_e * Cst.k_B * T) / (Cst.e * B);
  $("sys1").innerHTML = t("sys1.body", { n: F.sci(n, 3), T: F.kelvin(T), rc: F.si(rc, "m", { prefix: "n", sig: 2 }),
    chi: F.num(chi, 2), mes: F.sci(M.SUSCEPTIBILITES.cuivre.chi, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bohr", 1911, "idea"], ["leeuwen", 1919, "idea"], ["landau", 1930, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tokamak"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["travail", "b"], ["vitesses", "d"], ["bord", "a"], ["champ", "c"], ["cuivre", "b"], ["etoile", "a"], ["larmor", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 346 });
})();
