    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>R</mi><mo>=</mo><mi>A</mi><mo>[</mo><mi data-i18n="eq.cos"></mi><mi>ω</mi><mi>t</mi><mo>+</mo><mi data-i18n="eq.cos"></mi><mo>(</mo><mi>ω</mi><mi>t</mi><mo>+</mo><mi>φ</mi><mo>)</mo><mo>+</mo><mi data-i18n="eq.cos"></mi><mo>(</mo><mi>ω</mi><mi>t</mi><mo>+</mo><mn>2</mn><mi>φ</mi><mo>)</mo><mo>+</mo><mo>⋯</mo><mo>+</mo><mi data-i18n="eq.cos"></mi><mo>(</mo><mi>ω</mi><mi>t</mi><mo>+</mo><mo>(</mo><mi>n</mi><mo>−</mo><mn>1</mn><mo>)</mo><mi>φ</mi><mo>)</mo><mo>]</mo></math><span class="n">(30.1)</span></div>
    <p class="validite" data-i18n-html="val.30.1"></p>

    <div class="eq"><math display="block"><msub><mi>A</mi><mi>R</mi></msub><mo>=</mo><mi>A</mi><mfrac><mrow><mi data-i18n="eq.sin"></mi><mo>(</mo><mi>n</mi><mi>φ</mi><mo>/</mo><mn>2</mn><mo>)</mo></mrow><mrow><mi data-i18n="eq.sin"></mi><mo>(</mo><mi>φ</mi><mo>/</mo><mn>2</mn><mo>)</mo></mrow></mfrac></math><span class="n">(30.2)</span></div>

    <div class="eq"><math display="block"><mi>I</mi><mo>=</mo><msub><mi>I</mi><mn>0</mn></msub><mfrac><mrow><msup><mi data-i18n="eq.sin"></mi><mn>2</mn></msup><mo>(</mo><mi>n</mi><mi>φ</mi><mo>/</mo><mn>2</mn><mo>)</mo></mrow><mrow><msup><mi data-i18n="eq.sin"></mi><mn>2</mn></msup><mo>(</mo><mi>φ</mi><mo>/</mo><mn>2</mn><mo>)</mo></mrow></mfrac></math><span class="n">(30.3)</span></div>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>φ</mi><mo>=</mo><mi>α</mi><mo>+</mo><mfrac><mrow><mn>2</mn><mi>π</mi><mi>d</mi><mspace width="0.1em"/><mi data-i18n="eq.sin"></mi><mi>θ</mi></mrow><mi>λ</mi></mfrac><mo>=</mo><mi>α</mi><mo>+</mo><mi>k</mi><mi>d</mi><mspace width="0.1em"/><mi data-i18n="eq.sin"></mi><mi>θ</mi></math><span class="n">(30.4)</span></div>
    <p class="validite" data-i18n-html="val.30.4"></p>
    <figure class="chart">
      <svg class="fig" id="chaine" viewBox="0 0 640 260" role="img" data-i18n-attr="aria-label:fig.aria.chaine"></svg>
      <svg class="fig" id="diagramme" role="img" data-i18n-attr="aria-label:fig.aria.diagramme"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.fleches"></span><span class="c-warn" data-i18n="fig.legend.somme"></span><span class="c-label" data-i18n="fig.legend.ordres"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="sn" data-i18n-html="fig.n"></label><output id="snr" for="sn"></output></div>
            <input id="sn" type="range" min="1" max="20" step="1" value="6"></div>
          <div class="ctl"><div class="row"><label for="sd" data-i18n-html="fig.d"></label><output id="sdr" for="sd"></output></div>
            <input id="sd" type="range" min="0.1" max="3" step="0.05" value="2"></div>
          <div class="ctl"><div class="row"><label for="sa" data-i18n-html="fig.alpha"></label><output id="sar" for="sa"></output></div>
            <input id="sa" type="range" min="-180" max="180" step="5" value="0"></div>
          <div class="ctl"><div class="row"><label for="st" data-i18n-html="fig.theta"></label><output id="str" for="st"></output></div>
            <input id="st" type="range" min="-90" max="90" step="0.5" value="3"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.ar"></span><span class="v" id="var"></span><span class="f" id="far"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.zero"></span><span class="v" id="vze"></span><span class="f" id="fze"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.ordres"></span><span class="v" id="vor"></span><span class="f" id="for"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>

    <p class="validite" data-i18n-html="val.30.5"></p>

    <div class="eq"><math display="block"><mi>d</mi><mspace width="0.1em"/><mi data-i18n="eq.sin"></mi><mi>θ</mi><mo>=</mo><mi>m</mi><mi>λ</mi></math><span class="n">(30.6)</span></div>
    <p class="validite" data-i18n-html="val.30.6"></p>

<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const DEG = Math.PI / 180;
const deg = x => F.qty(F.num(x / DEG, 3), "°");

/* ---------- la chaîne de flèches dans la direction θ, et l'intensité dans toutes les directions ---------- */
(() => {
  const ch = $("chaine"), dg = $("diagramme"), sn = $("sn"), sd = $("sd"), sa = $("sa"), st = $("st");
  function draw() {
    const n = +sn.value, d = +sd.value, alpha = +sa.value * DEG, theta = +st.value * DEG;
    const r = OptOnd.reseau({ n, d, lambda: 1, alpha }), phi = r.phi(theta), g = OptOnd.polygone(n, phi);
    /* the chain, scaled to fit its bounding box (the circle included) in the drawing */
    ch.innerHTML = "";
    const xs = g.sommets.map(p => p[0]), ys = g.sommets.map(p => p[1]);
    if (g.centre && n > 1) { xs.push(g.centre[0] - g.rayon, g.centre[0] + g.rayon); ys.push(g.centre[1] - g.rayon, g.centre[1] + g.rayon); }
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const k = Math.min(600 / Math.max(1e-9, x1 - x0), 230 / Math.max(1e-9, y1 - y0), 120);
    const X = x => 320 + k * (x - (x0 + x1) / 2), Y = y => 130 - k * (y - (y0 + y1) / 2);
    if (g.centre && n > 1) Plot.el("circle", { cx: X(g.centre[0]), cy: Y(g.centre[1]), r: k * g.rayon, class: "stroke thin dash c-label" }, ch);
    for (let j = 0; j < n; j++) Plot.fleche(ch, [X(g.sommets[j][0]), Y(g.sommets[j][1])], [X(g.sommets[j + 1][0]), Y(g.sommets[j + 1][1])], { cls: "c-tint", tete: 7 });
    Plot.fleche(ch, [X(0), Y(0)], [X(g.resultante[0]), Y(g.resultante[1])], { cls: "c-warn", trait: "stroke bold", tete: 10, min: 2 });
    Plot.el("circle", { cx: X(0), cy: Y(0), r: 3, class: "dot" }, ch);
    /* I/(n² I₀) against θ, the beams of (30.6) marked */
    dg.innerHTML = "";
    const P = Plot.axes(dg, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 44 }, x: { domain: [-90, 90], label: t("fig.xaxis") }, y: { domain: [0, 1.05], label: t("fig.yaxis") } });
    const ang = Array.from({ length: 1801 }, (_, i) => -90 + i * 0.1);
    Plot.el("path", { d: Plot.path(ang.map(a => [P.x(a), P.y(r.I(a * DEG) / (n * n))])), class: "curve" }, P.g);
    for (const o of r.ordres) Plot.el("line", { x1: P.x(o.theta / DEG), x2: P.x(o.theta / DEG), y1: P.y(0), y2: P.y(1.05), class: "stroke thin dash c-label" }, P.g);
    Plot.el("circle", { cx: P.x(theta / DEG), cy: P.y(r.I(theta) / (n * n)), r: 5, class: "dot" }, P.g);
    $("snr").textContent = F.num(n, 2); $("sdr").textContent = F.qty(F.num(d, 3), "λ");
    $("sar").textContent = F.qty(F.num(+sa.value, 3), "°"); $("str").textContent = F.qty(F.num(+st.value, 3), "°");
    $("var").textContent = F.num(g.A_R < 1e-9 ? 0 : g.A_R, 3);
    $("far").textContent = t("fig.f.ar", { i: F.num(r.I(theta) < 1e-12 ? 0 : r.I(theta), 3), n2: F.num(n * n, 3), phi: deg(phi) });
    $("vze").textContent = r.premierZero === null ? t("fig.aucun") : deg(r.premierZero);
    $("fze").textContent = r.faisceau === null ? t("fig.f.pasfaisceau") : t("fig.f.faisceau", { th: deg(r.faisceau) });
    $("vor").textContent = F.num(r.ordres.length, 2);
    $("for").textContent = r.lobe ? t("fig.f.lobe", { p: F.num(100 * r.lobe.rapport, 2) }) : t("fig.f.pasdelobe");
  }
  sn.oninput = sd.oninput = sa.oninput = st.oninput = draw;
  draw();
})();

/* ---------- le système décrit : six antennes sur 10 λ, vues de plus en plus loin ---------- */
(() => {
  const o = { n: 6, d: 2, lambda: 1 }, r = OptOnd.reseau(o), th = r.premierZero / 2;
  const at = R => OptOnd.champExact(Object.assign({ R, theta: th }, o));
  const a = at(50), b = at(500), c = at(5000), pc = e => F.num(100 * Math.abs(e.ecart), 2);
  $("sys1").innerHTML = t("sys1.body", { th: deg(th), fa: F.num(a.fresnel, 2), fb: F.num(b.fresnel, 2), fc: F.num(c.fresnel, 2), ea: pc(a), eb: pc(b), ec: pc(c) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fraunhofer", 1821, "experiment"], ["rowland", 1882, "experiment"], ["radar", 1969, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["echographie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cent", "d"], ["tour", "a"], ["lobe", "c"], ["largeur", "b"], ["pas", "d"], ["deuxlambda", "a"], ["energie", "c"], ["orienter", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 301 });
})();
</script>
