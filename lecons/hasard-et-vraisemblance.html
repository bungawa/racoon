<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-outils" data-i18n="monde.outils"></a><span class="aux">›</span><a href="/racoon/etape?id=probabilites" data-i18n="etape.probabilites"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/incertitude-absolue-relative" data-i18n="tag.prereq"></a>
      <span class="chip plain" data-i18n="tag.duree"></span>
    </div>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="box def"><b data-i18n="s1.def.title"></b>
      <p data-i18n-html="s1.def.body"></p>
    </div>
    <div class="eq">
      <math display="block"><mi>P</mi><mo stretchy="false">(</mo><mi>A</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><msub><mi>N</mi><mi>A</mi></msub><mi>N</mi></mfrac></math>
      <span class="n">(6.1)</span>
    </div>
    <p class="validite" data-i18n-html="eq61.validite"></p>
    <p data-i18n="s1.p3"></p>
    <figure class="chart">
      <div class="panel">
        <label class="field"><span data-i18n="freq.choice"></span>
          <select id="ev">
            <option value="pile" data-i18n="freq.ev.pile"></option>
            <option value="six" data-i18n="freq.ev.six"></option>
            <option value="doubleUn" data-i18n="freq.ev.doubleUn"></option>
            <option value="carte" data-i18n="freq.ev.carte"></option>
          </select></label>
        <div class="controls">
          <button class="btn tinted" type="button" id="f10" data-i18n="freq.plus10"></button>
          <button class="btn tinted" type="button" id="f100" data-i18n="freq.plus100"></button>
          <button class="btn tinted" type="button" id="f1000" data-i18n="freq.plus1000"></button>
          <button class="btn tinted" type="button" id="f0" data-i18n="freq.clear"></button>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="freq.n"></span><span class="v" id="fn"></span></div>
          <div class="stat"><span class="k" data-i18n-html="freq.k"></span><span class="v" id="fk"></span></div>
          <div class="stat"><span class="k" data-i18n-html="freq.ratio"></span><span class="v" id="fr"></span><span class="f" id="fp"></span></div>
          <div class="stat"><span class="k" data-i18n="freq.ecart"></span><span class="v" id="fz"></span><span class="f" data-i18n="freq.ecart.f"></span></div>
        </div>
      </div>
      <svg id="fchart" role="img" data-i18n-attr="aria-label:freq.aria"></svg>
      <figcaption data-i18n-html="freq.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n="s2.p1"></p>
    <p data-i18n="s2.p2"></p>
    <div class="box rem"><b data-i18n="s2.rem.title"></b>
      <p data-i18n="s2.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq">
      <math display="block"><msub><mi>P</mi><mi>C</mi></msub><mo>=</mo><mfrac><mi>n</mi><mi>A</mi></mfrac><mspace width="0.1em"/><mi>σ</mi></math>
      <span class="n">(6.3)</span>
    </div>
    <p class="validite" data-i18n-html="eq63.validite"></p>

  <section class="card">

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>

<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>

<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/hasard-et-vraisemblance.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>

<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
const main = document.querySelector("main");
F.autoTypo(main);
document.title = t("title");
const $ = id => document.getElementById(id);
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };

/* ---------- fréquence N_A/N contre N ---------- */
(() => {
  const MAX = 100000, rand = Quiz.rng(6);
  let ev = "pile", st = { n: 0, k: 0 }, pts = [];
  const record = () => { const last = pts[pts.length - 1]; if (!last || st.n >= last[0] * 1.02 || st.n <= 100) pts.push([st.n, st.k / st.n]); };
  function add(N) { N = Math.min(N, MAX - st.n); for (let i = 0; i < N; i++) { Proba.trials(ev, st, 1, rand); record(); } show(); }
  function show() {
    const p = Proba.EVENTS[ev].p, sd = n => Math.sqrt(p * (1 - p) / n);
    $("fn").textContent = F.num(st.n, 6); $("fk").textContent = F.num(st.k, 6);
    $("fr").textContent = st.n ? F.fix(st.k / st.n, 4) : "–";
    $("fp").textContent = t("freq.p", { p: F.fix(p, 4) });
    $("fz").textContent = st.n ? F.fix((st.k / st.n - p) / sd(st.n), 1) : "–";
    ["f10", "f100", "f1000"].forEach(id => { $(id).disabled = st.n >= MAX; });
    const svg = $("fchart"), nmax = Math.max(1000, Math.pow(10, Math.ceil(Math.log10(Math.max(st.n, 1)))));
    const ymax = Math.min(1, Math.max(2 * p, p + 3 * sd(10)));
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44 },
      x: { domain: [1, nmax], scale: "log", label: t("freq.x") }, y: { domain: [0, ymax], label: t("freq.y") } });
    Plot.el("line", { x1: x(1), x2: x(nmax), y1: y(p), y2: y(p), class: "zero" }, g);
    [1, -1].forEach(sgn => { let d = ""; for (let i = 0; i <= 120; i++) { const n = Math.pow(nmax, i / 120), v = Math.min(ymax, Math.max(0, p + sgn * sd(n)));
      d += (i ? "L" : "M") + x(n).toFixed(1) + " " + y(v).toFixed(1); } Plot.el("path", { d, class: "ref" }, g); });
    if (pts.length) Plot.el("path", { d: pts.map(([n, f], i) => (i ? "L" : "M") + x(n).toFixed(1) + " " + y(Math.min(ymax, f)).toFixed(1)).join(""), class: "curve" }, g);
  }
  $("ev").onchange = e => { ev = e.target.value; st = { n: 0, k: 0 }; pts = []; add(10); };
  $("f10").onclick = () => add(10); $("f100").onclick = () => add(100); $("f1000").onclick = () => add(1000);
  $("f0").onclick = () => { st = { n: 0, k: 0 }; pts = []; show(); };
  add(10);
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["pascal", 1654, "idea"], ["huygens", 1657, "idea"], ["laplace", 1812, "idea"], ["kolmogorov", 1933, "idea"], ["transport", 1977, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["neutrons"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["sept", "a"], ["des", "b"], ["savoir", "c"], ["fantome", "d"], ["epaisseur", "a"], ["epaisse", "b"], ["combien", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => { const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) }; }), { t, seed: 61 });
})();
</script>

</html>
