<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux;

/* ---------- la marche des électrons libres : vols de durée exponentielle, champ de 1 MV·m⁻¹ ---------- */
(() => {
  const tau = 2.5e-14, E = 1e6, vth = 1e5, T = 40 * tau, svg = $("marche"), sn = $("sn");
  const NS = [10, 100, 1000, 10000];
  let graine = 1;
  function draw() {
    const n = NS[+sn.value - 1], r = M.marcheDrude({ tau, E, vth, n, T, graine, garder: 6, points: 200 });
    svg.innerHTML = "";
    const xs = r.x.flat(), ymax = 1e9 * Math.max(r.attendu * T * 1.6, ...xs.map(Math.abs)) * 1.1;
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, 1e15 * T], label: t("walk.xaxis") }, y: { domain: [-ymax, ymax], label: t("walk.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(1e15 * T), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    for (const x of r.x) Plot.el("path", { d: Plot.path(r.t.map((tt, i) => [P.x(1e15 * tt), P.y(1e9 * x[i])])), class: "stroke thin c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(r.t.map(tt => [P.x(1e15 * tt), P.y(1e9 * r.derive * tt)])), class: "stroke bold c-tint" }, P.g);
    Plot.el("path", { d: Plot.path(r.t.map(tt => [P.x(1e15 * tt), P.y(1e9 * r.attendu * tt)])), class: "stroke dash c-warn" }, P.g);
    $("snr").textContent = F.num(n, 6);
    $("vd").textContent = F.si(r.derive, "m·s⁻¹", { prefix: "k" });
    $("fd").textContent = t("walk.f.derive", { c: F.num(r.collisions, 3) });
    $("va").textContent = F.si(r.attendu, "m·s⁻¹", { prefix: "k" });
    $("fa").textContent = t("walk.f.att", { naive: F.si(r.naive, "m·s⁻¹", { prefix: "k" }) });
  }
  sn.oninput = draw; $("relance").onclick = () => { graine++; draw(); }; draw();
})();

/* ---------- l'indice d'un métal de 1 Hz aux rayons X ---------- */
(() => {
  const svg = $("indice"), sf = $("sf"), seg = $("metal"), C = Constantes.c;
  let metal = "cuivre";
  function draw() {
    const d = M.drude(metal), lf = +sf.value, f = 10 ** lf, w = 2 * Math.PI * f, x = M.indiceMetal(w, metal);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 }, x: { scale: "log", domain: [1, 1e17], label: t("fig.xaxis") }, y: { scale: "log", domain: [1e-6, 1e10], label: t("fig.yaxis") } });
    const ls = Array.from({ length: 341 }, (_, i) => i * 0.05), cl = v => Math.min(1e10, Math.max(1e-6, v));
    const pts = ls.map(l => { const y = M.indiceMetal(2 * Math.PI * 10 ** l, metal); return [10 ** l, y.nR, y.nI]; });
    Plot.el("path", { d: Plot.path(pts.map(([F0, r]) => [P.x(F0), P.y(cl(r))])), class: "stroke c-tint" }, P.g);
    Plot.el("path", { d: Plot.path(pts.map(([F0, , i]) => [P.x(F0), P.y(cl(i))])), class: "stroke c-warn" }, P.g);
    for (const fm of [d.ftau, d.fp]) Plot.el("line", { x1: P.x(fm), x2: P.x(fm), y1: P.y(1e-6), y2: P.y(1e10), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("line", { x1: P.x(f), x2: P.x(f), y1: P.y(1e-6), y2: P.y(1e10), class: "stroke thin c-label-2" }, P.g);
    Plot.el("circle", { cx: P.x(f), cy: P.y(cl(x.nR)), r: 4.5, class: "fill c-tint" }, P.g);
    Plot.el("circle", { cx: P.x(f), cy: P.y(cl(x.nI)), r: 4.5, class: "fill c-warn" }, P.g);
    $("sfr").textContent = F.si(f, "Hz");
    $("vtau").textContent = F.si(d.tau, "s", { prefix: "f" });
    $("ftau").textContent = t("fig.f.tau", { ft: F.si(d.ftau, "Hz"), fp: F.si(d.fp, "Hz"), wt: F.sci(x.wtau, 2) });
    $("vn").textContent = t("fig.v.n", { r: F.sci(x.nR, 3), i: F.sci(x.nI, 3) });
    $("fn").textContent = t("fig.f.n", { l0: F.si(C / f, "m") });
    $("vl").textContent = isFinite(x.attenuation) ? F.si(x.attenuation, "m") : "∞";
    $("fl").textContent = t("fig.f.l", { s: F.sci(x.wSurSigma, 2) });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === metal)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { metal = b.dataset.m; draw(); });
  sf.oninput = draw; draw();
})();

/* ---------- le système décrit : le cuivre à 293 K ---------- */
(() => {
  const d = M.drude("cuivre");
  $("sys1").innerHTML = t("sys1.body", { N: F.qty(F.sci(d.N, 3), "m⁻³"), s: F.qty(F.sci(d.sigma, 3), "S·m⁻¹"), tau: F.si(d.tau, "s", { prefix: "f" }),
    v: F.si(M.vitesseDerive(1, d.tau), "m·s⁻¹", { prefix: "m" }), ft: F.si(d.ftau, "Hz"), fs: F.si(d.fsigma, "Hz"), fp: F.si(d.fp, "Hz") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["drude", 1900, "idea"], ["hagen", 1903, "experiment"], ["sommerfeld", 1928, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["thz"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ressort", "b"], ["local", "d"], ["tau", "a"], ["moitie", "c"], ["sigma", "b"], ["regimes", "d"], ["lie", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 326 });
})();
</script>
