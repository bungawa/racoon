<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, Cst = Constantes, qe = Cst.e;
const FM = 1e-15, MPI = 139.57039e6 * qe;                                     // J, charged pion rest energy (Particle Data Group, 2024)

/* ---------- la portée choisie donne la masse du quantum ---------- */
(() => {
  const trace = $("trace"), sr = $("sr"), xs = Array.from({ length: 200 }, (_, i) => 0.1 + i * 0.025);
  function draw() {
    const R = FM * 10 ** +sr.value, q = M.masseYukawa(R);
    trace.innerHTML = "";
    const G = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 64, b: 44 }, x: { domain: [0, 5.1], label: t("fig.xaxis") }, y: { scale: "log", domain: [1e-4, 10], label: t("fig.yaxis") } });
    Plot.el("path", { d: Plot.path(xs.map(x => [G.x(x), G.y(1 / x)])), class: "stroke thin dash c-label-2" }, G.g);
    const yk = xs.map(x => [x, M.potentielYukawa(x * FM, R) * FM]).filter(p => p[1] >= 1e-4);
    if (yk.length > 1) Plot.el("path", { d: Plot.path(yk.map(([x, y]) => [G.x(x), G.y(y)])), class: "curve" }, G.g);
    $("srr").textContent = F.si(R, "m", { prefix: "f", sig: 3 });
    $("vm").textContent = F.si(q.eV, "eV");
    $("fm").textContent = t("fig.f.masse", { kg: F.qty(F.sci(q.kg, 3), "kg") });
    $("vp").textContent = F.num(q.J / MPI, 3);
    $("vr").textContent = F.sci(Math.exp(-2 * FM / R), 2);
  }
  sr.oninput = draw; draw();
})();

/* ---------- le système décrit : un nucléon, source du champ ---------- */
(() => {
  const R = M.porteeYukawa(MPI), rp = 0.84075e-15, mN = Cst.m_p * Cst.c ** 2;
  $("sys1").innerHTML = t("sys1.body", { R: F.si(R, "m", { prefix: "f" }), rp: F.si(rp, "m", { prefix: "f" }), x: F.num(rp / R, 2), n: F.num(mN / MPI, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["yukawa", 1935, "idea"], ["muon", 1937, "experiment"], ["pion", 1947, "experiment"], ["nobel", 1949, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["psi"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["portee", "c"], ["signe", "a"], ["masse", "d"], ["w", "b"], ["coulomb", "a"], ["source", "c"], ["muon", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 286 });
})();
</script>
