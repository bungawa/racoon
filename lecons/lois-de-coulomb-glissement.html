<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const DEG = Math.PI / 180, M = 20, MG = M * Forces.G0;
const deg = a => F.num(a / DEG, 3) + "°";

/* ---------- §2 : le cône de frottement, une caisse poussée par un manche ---------- */
(() => {
  const svg = $("cone"), P = Plot.el;
  const arrow = (x1, y1, x2, y2, cls) => Plot.fleche(svg, [x1, y1], [x2, y2], { cls, tete: 10, min: 2 });
  const ray = (C, a, L, cls) => P("line", { x1: C[0], y1: C[1], x2: C[0] + L * Math.sin(a), y2: C[1] - L * Math.cos(a), class: cls }, svg);
  function draw() {
    svg.innerHTML = "";
    const p = Forces.PAIRS[$("pair").value], al = +$("al").value * DEG, f = +$("ff").value;
    const r = Contact.poussee({ alpha: al, f, mus: p.mus, muk: p.muk });
    const C = [360, 250], ps = r.demiAngle, pd = Math.atan(p.muk);
    P("line", { x1: 40, y1: C[1], x2: 600, y2: C[1], class: "stroke c-label-2" }, svg);
    P("rect", { x: C[0] - 70, y: C[1] - 80, width: 140, height: 80, class: "stroke thin c-label-2" }, svg);
    /* the cones open upward around the normal, on both sides: the reaction may lean either way */
    [-1, 1].forEach(sg => { ray(C, sg * ps, 200, "stroke c-warn"); ray(C, sg * pd, 200, "stroke thin dash c-label-2"); });
    /* push: down and to the right, at α from the downward vertical, onto the top-left corner of the box */
    const E = [C[0] - 70, C[1] - 80], Lf = 30 + 22 * Math.min(f, 5);
    if (f > 0) arrow(E[0] - Lf * Math.sin(al), E[1] - Lf * Math.cos(al), E[0], E[1], "c-label");
    /* reaction of the floor: up, leaning back against the push; its angle to the normal is atan(T/N) */
    const ang = -r.angleReaction;
    arrow(C[0], C[1], C[0] + 150 * Math.sin(ang), C[1] - 150 * Math.cos(ang), "c-tint");
    const lab = P("text", { x: C[0] + 10 + 120 * Math.sin(ps), y: C[1] - 120 * Math.cos(ps) }, svg); lab.textContent = "φ"; P("tspan", { "baseline-shift": "sub", "font-size": "75%" }, lab).textContent = "s";   /* deux symboles, pas un mot */
    $("alv").textContent = deg(al);
    $("ffv").textContent = t("cone.fv", { f: F.num(f, 3), F: F.si(f * MG, "N", { sig: 3 }) });
    $("vang").textContent = deg(Math.atan2(r.Treq, r.N));
    $("fang").textContent = t("cone.f.angle", { p: deg(ps) });
    $("vseuil").textContent = r.arcBoute ? t("cone.jamais") : F.si(r.fSeuil * MG, "N", { sig: 3 });
    $("fseuil").textContent = r.arcBoute ? t("cone.f.arc") : t("cone.f.seuil", { f: F.num(r.fSeuil, 3) });
    $("vetat").textContent = t(r.adhere ? (r.arcBoute ? "cone.etat.arc" : "cone.etat.adhere") : "cone.etat.glisse");
    $("fetat").textContent = r.adhere ? t("cone.f.adhere", { T: F.si(r.Treq * MG, "N", { sig: 3 }), N: F.si(r.N * MG, "N", { sig: 3 }) })
      : t("cone.f.glisse", { a: F.si(r.a * Forces.G0, "m·s⁻²", { sig: 3 }) });
  }
  $("pair").onchange = draw; $("al").oninput = draw; $("ff").oninput = draw; draw();
})();

/* ---------- §3 : la méthode, en étapes ---------- */
(() => {
  const STEPS = ["supposer", "calculer", "verifier", "sinon"], txt = textOf("methode.items", STEPS);
  $("methode").innerHTML = STEPS.map((id, i) => `<div><span class="k">${i + 1}</span><span>${txt[id]}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["euler1750", 1750, "idea"], ["coulomb1785", 1785, "experiment"], ["painleve1895", 1895, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cale", "pendule"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["repos", "b"], ["demiangle", "a"], ["manche", "d"], ["seuil", "c"], ["direction", "d"], ["methode", "a"], ["aire", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 4201 });
})();
</script>
