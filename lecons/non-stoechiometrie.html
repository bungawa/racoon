<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, R = CristalReel;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- un plan (100) de Fe₁₋ₓO et les grandeurs qui suivent x ---------- */
(() => {
  const NX = 12, NY = 7, U = 46, ox = 320 - U * (NX - 1) / 2, oy = 27, svg = $("plan");
  const fer = []; for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) if ((i + j) % 2) fer.push([i, j]);
  /* a fixed shuffle of the Fe sites (linear congruential generator): the same drawing for the same x */
  const ordre = fer.map((_, k) => k); let g = 7;
  for (let k = ordre.length - 1; k > 0; k--) { g = (g * 1103515245 + 12345) % 2147483648; const r = g % (k + 1); [ordre[k], ordre[r]] = [ordre[r], ordre[k]]; }
  const rhoUpd = [];
  function upd() {
    const x = +$("px").value, w = R.wustite(Math.min(x, 1 / 3));
    $("pxv").textContent = F.num(x, 3);
    const nl = Math.round(x * fer.length), n3 = Math.min(fer.length - nl, 2 * nl);
    const etat = new Map(); ordre.forEach((k, r) => etat.set(k, r < nl ? "lac" : r < nl + n3 ? "fe3" : "fe2"));
    svg.innerHTML = "";
    for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
      const cx = ox + U * i, cy = oy + U * j;
      if (!((i + j) % 2)) { P("circle", { cx, cy, r: 17, class: "fill el-o" }, svg); continue; }
      const e = etat.get(fer.findIndex(([a, b]) => a === i && b === j));
      P("circle", e === "lac" ? { cx, cy, r: 11, class: "stroke dash c-warn" } : { cx, cy, r: e === "fe3" ? 9 : 11, class: "fill " + (e === "fe3" ? "c-tint" : "c-label-2") }, svg);
    }
    $("vform").innerHTML = t("pl.v.formule", { y: F.num(1 - x, 3) });
    $("fform").textContent = t("pl.f.formule", { w: F.qty(F.num(100 * R.teneurFer(x), 4), "%") });
    $("vfe3").textContent = F.qty(F.num(100 * w.partFe3, 3), "%");
    $("ffe3").textContent = t("pl.f.fe3", { n3, nl, n: fer.length });
    $("vno").textContent = "+" + F.num(w.nombreOxydation, 3);
    rhoUpd.forEach(f => f(x));
  }
  /* ---------- masse volumique : lacunes de fer ou oxygène en plus ---------- */
  const s2 = $("rho"), X1 = 0.25;
  rhoUpd.push(x => {
    s2.innerHTML = "";
    const { x: sx, y: sy, g } = Plot.axes(s2, { fmt: F, w: 640, h: 300, x: { domain: [0, X1], label: t("rh.x"), fmt: v => F.num(v, 2) }, y: { domain: [5000, 7000], label: t("rh.y") } });
    const x0 = R.xDepuisTeneur(R.JETTE_FOOTE.wMax), x1 = R.xDepuisTeneur(R.JETTE_FOOTE.wMin);
    P("rect", { x: sx(x0), y: sy(7000), width: sx(x1) - sx(x0), height: sy(5000) - sy(7000), class: "fill", opacity: 0.15 }, P("g", { class: "c-label-2" }, g));
    for (const [m, c] of [["lacunes", "c-tint"], ["interstitiels", "c-warn"]]) {
      const pts = []; for (let u = 0; u <= X1 + 1e-9; u += 0.005) pts.push([sx(u), sy(R.masseVolumiqueWustite(u, m))]);
      const gg = P("g", { class: c }, g);
      P("path", { d: Plot.path(pts), class: "stroke bold" }, gg);
      P("circle", { cx: sx(x), cy: sy(R.masseVolumiqueWustite(x, m)), r: 5, class: "fill" }, gg);
    }
    const rl = R.masseVolumiqueWustite(x, "lacunes"), ri = R.masseVolumiqueWustite(x, "interstitiels");
    $("va").textContent = F.si(R.parametreWustite(x), "m", { prefix: "p", sig: 4 });
    $("vrl").textContent = F.qty(F.num(rl, 4), "kg·m⁻³");
    $("vri").textContent = F.qty(F.num(ri, 4), "kg·m⁻³");
    $("fri").textContent = t("rh.f.int", { e: F.qty(F.num(100 * (ri - rl) / rl, 2), "%") });
  });
  $("px").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["berthollet", 1803, "idea"], ["chaudron", 1921, "experiment"], ["jette", 1933, "experiment"], ["roth", 1960, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["hautfourneau", "manteau"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["neutre", "b"], ["fe3", "d"], ["max", "a"], ["densite", "c"], ["teneur", "b"], ["pression", "a"], ["sous570", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
