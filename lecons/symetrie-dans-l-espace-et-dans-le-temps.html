<!doctype html>
<html lang="fr">
<head>

<title>Symétrie dans l'espace et dans le temps</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-principes" data-i18n="monde.principes"></a><span class="aux">›</span><a href="/racoon/etape?id=symetries-lois-conservation" data-i18n="etape.symetries-lois-conservation"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/operations-de-symetrie" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mi>g</mi><mo stretchy="false">(</mo><mi>h</mi><mo stretchy="false">)</mo><mo>≈</mo><msub><mi>g</mi><mn>0</mn></msub><mrow><mo>(</mo><mn>1</mn><mo>−</mo><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><msub><mi>R</mi><mi data-i18n="eq.T"></mi></msub></mfrac><mo>)</mo></mrow></math></div>
    <p class="validite" data-i18n-html="val.g"></p>
    <p id="s1p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><mi>ω</mi><mo>=</mo><mi mathvariant="normal">Ω</mi><mspace width="0.2em"/><mi data-i18n="eq.sin"></mi><mi>λ</mi></math></div>
    <p class="validite" data-i18n-html="val.foucault"></p>
    <p id="s2p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi>σ</mi><mo>=</mo><mi>γ</mi><mi>h</mi><mo>,</mo><mspace width="1em"/><mi>γ</mi><mo>=</mo><mi>ρ</mi><mi>g</mi></math></div>
    <p class="validite" data-i18n-html="val.sigma"></p>
    <figure class="chart">
      <svg class="fig" id="col" role="img" data-i18n-attr="aria-label:col.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="col.legend.sigma"></span><span class="c-warn ring" data-i18n="col.legend.f"></span></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="hsl" data-i18n="col.h"></label><output id="hread" for="hsl"></output></div>
          <input id="hsl" type="range" min="0" max="3.5" step="0.01" value="1.5"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="col.k.sigma"></span><span class="v" id="vsigma"></span><span class="f" data-i18n="col.f.sigma"></span></div>
          <div class="stat"><span class="k" data-i18n="col.k.ratio"></span><span class="v" id="vratio"></span><span class="f" data-i18n="col.f.ratio"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="col.caption"></figcaption>
    </figure>
    <p id="s3p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/symetrie-dans-l-espace-et-dans-le-temps.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/relativite.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/principes.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const $ = id => document.getElementById(id), P = Plot.el, C = Constantes;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);

/* ---------- nombres du texte, calculés ---------- */
(() => {
  const a0 = 4 * Math.PI * C.eps0 * C.hbar ** 2 / (C.m_e * C.e ** 2), pend = Relativite.foucault(C.Omega_E, Math.PI / 4);
  $("s1p3").innerHTML = fill(t("s1.p3"), { dg: F.sci(2 * 10 / C.R_E_mean, 2) });
  $("s2p3").innerHTML = fill(t("s2.p3"), { T: F.qty(F.num(pend.periode / 3600, 3), "h") });
  $("s3p2").innerHTML = fill(t("s3.p2"), { a0: F.qty(F.sci(a0, 3), "m") });
})();
F.autoTypo(document.querySelector("main"));

/* ---------- colonne de béton sous son poids ---------- */
(() => {
  const GAMMA = 25e3, FCK = 25e6;                          // EN 1991-1-1 annexe A ; C25/30 de EN 1992-1-1
  const { x, y, g } = Plot.axes($("col"), { fmt: F, w: 640, h: 300, pad: { b: 44 },
    x: { scale: "log", domain: [1, 1e4], label: t("col.x") }, y: { scale: "log", domain: [1e4, 1e8], label: t("col.y") } });
  Plot.el("path", { d: "M" + x(1) + " " + y(Principes.contraintePied(1, GAMMA)) + "L" + x(1e4) + " " + y(Principes.contraintePied(1e4, GAMMA)), class: "curve" }, g);
  Plot.el("line", { x1: x(1), x2: x(1e4), y1: y(FCK), y2: y(FCK), class: "ref" }, g);
  const hl = Principes.hauteurLimite(FCK, GAMMA);
  Plot.el("line", { x1: x(hl), x2: x(hl), y1: y(1e4), y2: y(1e8), class: "stroke thin c-label-2" }, g);
  const dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  const sl = $("hsl");
  const upd = () => {
    const h = Math.pow(10, +sl.value), s = Principes.contraintePied(h, GAMMA);
    dot.setAttribute("cx", x(h)); dot.setAttribute("cy", y(s));
    $("hread").textContent = F.qty(F.num(h, 3), "m");
    $("vsigma").textContent = F.si(s, "Pa");
    $("vratio").textContent = F.num(s / FCK, 3);
  };
  sl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["galilee", 1638, "idea"], ["foucault", 1851, "experiment"], ["einstein", 1905, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["bassin"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["boussole", "b"], ["tour", "c"], ["echelle", "a"], ["hauteur", "d"], ["foucault", "a"], ["voiture", "b"], ["oeuf", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 5202 });
})();
</script>
</body>
</html>
