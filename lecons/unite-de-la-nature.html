<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
/* ---------- des marcheurs au hasard résolvent l'équation de Laplace ---------- */
(() => {
  const svg = $("carre"), sn = $("sn"), sN = $("sN"), X0 = 190, Y0 = 310, L = 280, EX = ES.laplaceCarre(0.5, 0.25);
  let graine = 11;
  const alea = g => () => (g = (g * 16807) % 2147483647) / 2147483647;
  function draw() {
    const n = Math.pow(2, +sn.value), N = Math.round(Math.pow(10, +sN.value)), i = n / 2, j = n / 4;
    const m = ES.marcheCarre({ n, i, j, N, traces: 3 }, alea(graine)), res = ES.reseauCarre(n)[j][i], X = a => X0 + a * L / n, Y = b => Y0 - b * L / n;
    svg.innerHTML = "";
    if (n <= 32) for (let k = 1; k < n; k++) {
      Plot.el("line", { x1: X(k), x2: X(k), y1: Y(0), y2: Y(n), class: "stroke thin c-label", opacity: 0.25 }, svg);
      Plot.el("line", { x1: X(0), x2: X(n), y1: Y(k), y2: Y(k), class: "stroke thin c-label", opacity: 0.25 }, svg);
    }
    Plot.el("path", { d: Plot.path([[X(0), Y(n)], [X(0), Y(0)], [X(n), Y(0)], [X(n), Y(n)]]), class: "stroke c-label" }, svg);
    Plot.el("line", { x1: X(0), x2: X(n), y1: Y(n), y2: Y(n), class: "stroke bold c-warn" }, svg);
    Plot.el("text", { x: X(n / 2), y: Y(n) - 8, "text-anchor": "middle", class: "tick" }, svg).textContent = t("fig.un");
    Plot.el("text", { x: X(n / 2), y: Y(0) + 16, "text-anchor": "middle", class: "tick" }, svg).textContent = t("fig.zero");
    m.traces.forEach((tr, k) => Plot.el("path", { d: Plot.path(tr.map(([a, b]) => [X(a), Y(b)])), class: "stroke thin c-tint", opacity: 1 - 0.25 * k }, svg));
    Plot.el("circle", { cx: X(i), cy: Y(j), r: 5, class: "fill c-tint" }, svg);
    $("rn").textContent = t("n.val", { n, h: F.num(1 / n, 3) }); $("rN").textContent = F.num(N, 5);
    $("vm").textContent = F.num(m.phi, 3) + " ± " + F.num(m.err, 1);
    $("fm").textContent = t("f.marche", { p: F.num(m.pas, 3), z: F.num(Math.abs(m.phi - res) / Math.max(m.err, 1e-9), 2) });
    $("vr").textContent = F.num(res, 4);
    $("fr").textContent = t("f.reseau", { e: F.num(100 * Math.abs(res - EX) / EX, 2) });
    $("vc").textContent = F.num(EX, 4);
    $("fc").textContent = t("f.continu");
  }
  sn.oninput = sN.oninput = draw;
  $("relancer").onclick = () => { graine = (graine * 48271) % 2147483647; draw(); };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fourier", 1822, "idea"], ["fick", 1855, "idea"], ["einstein", 1905, "idea"], ["kakutani", 1944, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["puces"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["etoffe", "b"], ["lisse", "a"], ["gradient", "c"], ["maille", "d"], ["bruit", "b"], ["moyenne", "a"], ["xons", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1207 });
})();
</script>
