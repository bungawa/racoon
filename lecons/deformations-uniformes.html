    <div class="eq"><math display="block"><mfrac><mrow><mi mathvariant="normal">Δ</mi><mi>V</mi></mrow><mi>V</mi></mfrac><mo>=</mo><mo>−</mo><mn>3</mn><mfrac><mi>p</mi><mi>E</mi></mfrac><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mn>2</mn><mi>ν</mi><mo stretchy="false">)</mo></math><span class="n">(38.8)</span></div>
    <p class="validite" data-i18n-html="val.volume"></p>
    <div class="eq"><math display="block"><mi>K</mi><mo>=</mo><mfrac><mi>E</mi><mrow><mn>3</mn><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mn>2</mn><mi>ν</mi><mo stretchy="false">)</mo></mrow></mfrac></math><span class="n">(38.9)</span></div>
    <p class="validite" data-i18n-html="val.K"></p>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>

    <p data-i18n-html="s2.p2"></p>

    <p class="validite" data-i18n-html="val.tau"></p>
    <div class="eq"><math display="block"><mi>μ</mi><mo>=</mo><mfrac><mi>E</mi><mrow><mn>2</mn><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>ν</mi><mo stretchy="false">)</mo></mrow></mfrac></math><span class="n">(38.14)</span></div>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi>σ</mi><mo>=</mo><mi>M</mi><mspace width="0.2em"></mspace><mi>ε</mi><mo>,</mo><mspace width="1em"></mspace><mi>M</mi><mo>=</mo><mfrac><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>ν</mi><mo stretchy="false">)</mo></mrow><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>ν</mi><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mn>2</mn><mi>ν</mi><mo stretchy="false">)</mo></mrow></mfrac><mspace width="0.2em"></mspace><mi>E</mi></math><span class="n">(38.20)</span></div>
    <p class="validite" data-i18n-html="val.M"></p>
    <p data-i18n-html="s3.p2"></p>
    <figure>
      <div class="seg" role="group" data-i18n-attr="aria-label:cube.cas">
        <button type="button" id="c-pression" aria-pressed="true"></button>
        <button type="button" id="c-cisaillement" aria-pressed="false"></button>
        <button type="button" id="c-bloque" aria-pressed="false"></button>
      </div>
      <svg class="fig" id="cube" viewBox="0 0 640 220" role="img" data-i18n-attr="aria-label:cube.aria"></svg>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="nu" data-i18n="cube.nu"></label><output id="nuv" for="nu"></output></div>
            <input id="nu" type="range" min="-0.9" max="0.499" step="0.001" value="0.3"></div>
          <div class="ctl"><div class="row"><label for="s" data-i18n="cube.s"></label><output id="sv" for="s"></output></div>
            <input id="s" type="range" min="1" max="200" step="1" value="100"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="cube.k.K"></span><span class="v" id="vK"></span><span class="f" id="fK"></span></div>
          <div class="stat"><span class="k" data-i18n="cube.k.mu"></span><span class="v" id="vmu"></span><span class="f" id="fmu"></span></div>
          <div class="stat"><span class="k" data-i18n="cube.k.M"></span><span class="v" id="vM"></span><span class="f" id="fM"></span></div>
          <div class="stat"><span class="k" id="kres"></span><span class="v" id="vres"></span><span class="f" id="fres"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="cube.caption"></figcaption>
    </figure>
    <figure class="chart">
      <svg class="fig" id="mods" role="img" data-i18n-attr="aria-label:mods.aria"></svg>
      <figcaption data-i18n-html="mods.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="s3.sys.title"></b>
      <p data-i18n-html="s3.sys.body"></p>

  <section class="card">

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/deformations-uniformes.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/oscillateur.js"></script>
<script src="/racoon/lecons/elasticite.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- three uniform loadings of a cube of steel (E fixed), ν free ---------- */
(() => {
  const CAS = ["pression", "cisaillement", "bloque"], NAMES = textOf("cube.cass", CAS), E = Elasticite.MATERIAUX.acier.E, svg = $("cube");
  let cas = "pression";
  const NUS = Array.from({ length: 280 }, (_, i) => -0.9 + 1.399 * i / 279);
  const text = (x, y, s, anchor) => { P("text", { x, y, "text-anchor": anchor || "middle" }, svg).textContent = s; };
  const poly = (pts, cls) => P("polygon", { points: pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" "), class: cls }, svg);
  function upd() {
    const nu = +$("nu").value, s = +$("s").value * 1e6, c = Elasticite.constantesIsotropes(E, nu);
    CAS.forEach(id => $("c-" + id).setAttribute("aria-pressed", String(id === cas)));
    $("nuv").textContent = F.fix(nu, 3); $("sv").textContent = F.si(s, "Pa");
    $("vK").textContent = F.si(c.K, "Pa"); $("fK").textContent = t("cube.f.surE", { r: F.num(c.K / E, 3) });
    $("vmu").textContent = F.si(c.mu, "Pa"); $("fmu").textContent = t("cube.f.surE", { r: F.num(c.mu / E, 3) });
    $("vM").textContent = F.si(c.M, "Pa"); $("fM").textContent = t("cube.f.surE", { r: F.num(c.M / E, 3) });
    /* strain tensor of the case, then the square face z = const drawn deformed, magnified */
    let ex, ey, gxy;
    if (cas === "pression") { const h = Elasticite.hydrostatique(E, nu, s); ex = ey = h.eps; gxy = 0;
      $("kres").textContent = t("cube.k.dV"); $("vres").textContent = F.sci(h.dVsurV, 3); $("fres").textContent = t("cube.f.dV", { e: F.sci(h.eps, 2) }); }
    else if (cas === "cisaillement") { const g = Elasticite.cisaillementPur(E, nu, s); ex = ey = 0; gxy = g.gamma;
      $("kres").textContent = t("cube.k.theta"); $("vres").textContent = F.sci(g.gamma, 3); $("fres").textContent = t("cube.f.diag", { e: F.sci(g.diagonale, 2) }); }
    else { const b = Elasticite.bloque(E, nu, s); ex = b.eps; ey = 0; gxy = 0;
      $("kres").textContent = t("cube.k.eps"); $("vres").textContent = F.sci(b.eps, 3); $("fres").textContent = t("cube.f.lat", { s: F.si(b.sigLat, "Pa") }); }
    svg.innerHTML = "";
    const big = Math.max(Math.abs(ex), Math.abs(ey), Math.abs(gxy), 1e-12), k = Math.pow(10, Math.floor(Math.log10(0.15 / big)));
    const a = 140, cx = 320, cy = 110;
    const sq = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
    poly(sq.map(([x, y]) => [cx + x * a / 2, cy - y * a / 2]), "stroke thin dash c-label-2");
    poly(sq.map(([x, y]) => [cx + (x * (1 + k * ex) + y * k * gxy) * a / 2, cy - y * (1 + k * ey) * a / 2]), "stroke bold c-tint");
    if (cas === "bloque") { P("line", { x1: cx - a / 2 - 10, y1: cy - a / 2 - 14, x2: cx + a / 2 + 10, y2: cy - a / 2 - 14, class: "stroke bold c-label" }, svg);
      P("line", { x1: cx - a / 2 - 10, y1: cy + a / 2 + 14, x2: cx + a / 2 + 10, y2: cy + a / 2 + 14, class: "stroke bold c-label" }, svg); }
    text(cx, 214, t("cube.ampli", { k: F.num(k, 1) }));
  }
  /* K/E, μ/E and M/E against ν, log scale: K and M blow up at ν = 1/2, μ stays finite */
  function courbes() {
    const svgM = $("mods"); svgM.innerHTML = "";
    const nu = +$("nu").value;
    const o = Plot.axes(svgM, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 52 }, x: { domain: [-0.9, 0.5], label: t("mods.x") }, y: { scale: "log", domain: [0.1, 100], label: t("mods.y") } });
    const clip = v => Math.min(100, Math.max(0.1, v));
    [["K", "c-tint"], ["mu", "c-ok"], ["M", "c-warn"]].forEach(([q, cls]) => {
      P("path", { d: Plot.path(NUS.map(n => [o.x(n), o.y(clip(Elasticite.constantesIsotropes(1, n)[q]))])), class: "stroke " + cls }, o.g);
      const v = Elasticite.constantesIsotropes(1, nu)[q];
      P("circle", { cx: o.x(nu), cy: o.y(clip(v)), r: 5, class: "fill " + cls }, o.g);
    });
    [["K", 0.42, 30], ["mu", -0.6, 2.3], ["M", 0.2, 3.2]].forEach(([q, x, y]) => { P("text", { x: o.x(x), y: o.y(y), "text-anchor": "middle" }, o.g).textContent = t("mods.l." + q); });
  }
  const all = () => { upd(); courbes(); };
  ["nu", "s"].forEach(id => $(id).oninput = all);
  CAS.forEach(id => { $("c-" + id).textContent = NAMES[id]; $("c-" + id).onclick = () => { cas = id; all(); }; });
  all();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cauchy", 1822, "idea"], ["poisson", 1829, "idea"], ["lame", 1852, "idea"], ["oedometre", 2017, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["oedometre", "acier", "caoutchouc"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pression", "c"], ["borne", "a"], ["cisaillement", "d"], ["mu", "b"], ["bloque", "c"], ["caoutchouc", "a"], ["superposition", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
