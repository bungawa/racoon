<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique;

/* ---------- PV/U, des particules lentes aux photons ---------- */
(() => {
  const svg = $("pvu"), sl = $("ec"), XMIN = 1e-3, XMAX = 1e3;
  const x_ = s => XMIN * Math.pow(XMAX / XMIN, s / 100);
  const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
    x: { scale: "log", domain: [XMIN, XMAX], label: t("pvu.x") }, y: { domain: [0.3, 0.7], label: t("pvu.y"), fmt: v => F.fix(v, 1) } });
  const pts = []; for (let i = 0; i <= 200; i++) { const e = XMIN * Math.pow(XMAX / XMIN, i / 200); pts.push([o.x(e), o.y(S.pvSurU(1 + e))]); }
  Plot.el("path", { d: Plot.path(pts), class: "curve" }, o.g);
  for (const [v, k] of [[2 / 3, "pvu.lent"], [1 / 3, "pvu.photon"]]) {
    Plot.el("line", { x1: o.x(XMIN), x2: o.x(XMAX), y1: o.y(v), y2: o.y(v), class: "ref" }, o.g);
    Plot.el("text", { x: o.x(v > 0.5 ? XMAX : XMIN) + (v > 0.5 ? -6 : 6), y: o.y(v) + (v > 0.5 ? -8 : 16), "text-anchor": v > 0.5 ? "end" : "start", class: "note" }, o.g).textContent = t(k);
  }
  const dot = Plot.el("circle", { r: 6, class: "dot" }, o.g);
  function upd() {
    const e = x_(+sl.value), g = 1 + e, r = S.pvSurU(g);
    dot.setAttribute("cx", o.x(e)); dot.setAttribute("cy", o.y(r));
    $("ecv").textContent = F.num(e, 2);
    $("vv").textContent = F.fix(Math.sqrt(1 - 1 / (g * g)), 4);
    $("vr").textContent = F.fix(r, 3);
    $("vg").textContent = F.fix(1 + r, 3);
  }
  sl.oninput = upd; upd();
})();

/* ---------- au cœur d'une étoile : pression du gaz contre pression du rayonnement ---------- */
(() => {
  const st = $("te"), sr = $("rh"), MU = 0.62, TMIN = 1e4, TMAX = 1e9, RMIN = 1e-4, RMAX = 1e6;
  const T_ = s => TMIN * Math.pow(TMAX / TMIN, s / 100), R_ = s => RMIN * Math.pow(RMAX / RMIN, s / 100);
  const s_ = (v, a, b) => 100 * Math.log(v / a) / Math.log(b / a);
  function upd() {
    const T = T_(+st.value), rho = R_(+sr.value), e = S.etoile(rho, T, MU);
    $("tev").innerHTML = F.kelvin(T);
    $("rhv").textContent = F.qty(F.sci(rho, 2), "kg·m⁻³");
    $("vpg").textContent = F.qty(F.sci(e.Pgaz, 2), "Pa");
    $("vpr").textContent = F.qty(F.sci(e.Prad, 2), "Pa");
    $("vpart").textContent = F.qty(F.num(100 * (1 - e.beta), 2), "%");
    $("sys").innerHTML = t("sys.inner", { T: F.kelvin(T), rho: F.qty(F.sci(rho, 2), "kg·m⁻³"), mu: F.num(MU, 2),
      kt: F.num(Constantes.k_B * T / (Constantes.m_e * Constantes.c ** 2), 2), avis: t(e.beta > 0.99 ? "sys.gaz" : e.beta > 0.5 ? "sys.mixte" : "sys.rad") });
  }
  $("soleil").onclick = () => { st.value = s_(1.57e7, TMIN, TMAX); sr.value = s_(1.5e5, RMIN, RMAX); upd(); };
  $("chaud").onclick = () => { st.value = s_(3e8, TMIN, TMAX); sr.value = s_(1, RMIN, RMAX); upd(); };
  st.oninput = sr.oninput = upd; $("soleil").onclick();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["stefan", 1879, "experiment"], ["boltzmann", 1884, "idea"], ["lebedev", 1901, "experiment"], ["ikaros", 2010, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["voile", "etoiles"], uses = textOf("uses.items", USES);
  const p = F.si(1.12e-3 / 196, "Pa", { sig: 2 });
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace("{p}", p)}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pv", "b"], ["photon", "d"], ["gamma", "a"], ["detente", "c"], ["t4", "b"], ["soleil", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 393 });
})();
</script>
