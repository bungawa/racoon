<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp;

/* ---------- a finite counter: the factor 2 of (4.14) fades as the counter grows past λ/α ---------- */
(() => {
  const svg = $("courbe"), sD = $("sD"), sM = $("sM"), X1 = 3;
  const ratio = r => Q.coincidencesCompteur(r, 1, 1);           // D in units of λ/α
  function draw() {
    const r = +sD.value, M = +sM.value, u = Math.PI * r, cel = Q.coincidencesCellules(M, u), c = ratio(r);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { domain: [0, X1], label: t("fig.x") }, y: { domain: [0, 2.1], label: t("fig.y") } });
    const pb = [], pf = [], pc = [];
    for (let i = 0; i <= 300; i++) {
      const x = X1 * i / 300, k = ratio(x);
      pb.push([o.x(x), o.y(k.bosons)]); pf.push([o.x(x), o.y(k.fermions)]);
      pc.push([o.x(x), o.y(Q.coincidencesCellules(M, Math.PI * x).bosons)]);
    }
    Plot.el("path", { d: Plot.path(pb), class: "stroke bold c-ok" }, o.g);
    Plot.el("path", { d: Plot.path(pf), class: "stroke bold c-warn" }, o.g);
    Plot.el("path", { d: Plot.path(pc), class: "stroke dash c-tint" }, o.g);
    Plot.el("line", { x1: o.x(0), x2: o.x(X1), y1: o.y(1), y2: o.y(1), class: "stroke thin c-label-2" }, o.g);
    Plot.el("line", { x1: o.x(r), x2: o.x(r), y1: o.y(0), y2: o.y(2.1), class: "stroke thin dash c-label-2" }, o.g);
    Plot.el("circle", { cx: o.x(r), cy: o.y(c.bosons), r: 5, class: "fill c-ok" }, o.g);
    Plot.el("circle", { cx: o.x(r), cy: o.y(c.fermions), r: 5, class: "fill c-warn" }, o.g);
    Plot.el("circle", { cx: o.x(r), cy: o.y(cel.bosons), r: 4, class: "fill c-tint" }, o.g);
    $("sDr").textContent = F.fix(r, 2) + " λ/α";
    $("sMr").textContent = F.num(M, 3);
    $("vo").textContent = F.fix(cel.ordonnees, 3);
    $("fo").textContent = t("fig.f.ordonnees", { n: F.num(M * M, 4) });
    $("vp").textContent = F.fix(cel.paires, 3);
    $("fp").textContent = t("fig.f.paires", { c: F.fix(c.bosons, 3) });
    $("vf").textContent = F.fix(cel.fermions, 3);
    $("ff").textContent = t("fig.f.fermions", { c: F.fix(c.fermions, 3) });
  }
  sD.oninput = sM.oninput = draw; draw();
})();

/* ---------- the system described: two pinholes, a filter, a photodetector ---------- */
(() => {
  const lambda = 500e-9, sep = 1e-3, L = 1, alpha = sep / L, frange = lambda / alpha;
  const petit = Q.coincidencesCompteur(0.1e-3, lambda, alpha), grand = Q.coincidencesCompteur(1.2e-3, lambda, alpha);
  $("sys1").innerHTML = t("sys1.body", { a: F.sci(alpha, 2), f: F.si(frange, "m"), p: F.fix(petit.bosons, 2), g: F.fix(grand.bosons, 3) });
  const dl = 1e-9, tc = lambda * lambda / (Constantes.c * dl), T = 1e-9;
  $("sys2").innerHTML = t("sys2.body", { tc: F.si(tc, "s"), r: F.sci(tc / T, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hbt", 1956, "experiment"], ["gglp", 1960, "experiment"], ["hom", 1987, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["femto"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["double", "c"], ["compte", "a"], ["disc", "b"], ["grand", "d"], ["fermions", "a"], ["racine", "c"], ["temps", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 442 });
})();
</script>
