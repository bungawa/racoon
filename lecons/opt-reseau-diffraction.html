<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-optique-ondulatoire" data-i18n="monde.optique-ondulatoire"></a><span class="aux">›</span><a href="/racoon/etape?id=opt-reseau" data-i18n="etape.opt-reseau"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-optique" href="/racoon/atlas?piste=optique" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/etape?id=opt-interferences" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys1"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>φ</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi><mi>d</mi></mrow><mi>λ</mi></mfrac><mo>(</mo><mi data-i18n="eq.sin"></mi><mi>θ</mi><mo>−</mo><mi data-i18n="eq.sin"></mi><msub><mi>θ</mi><mi mathvariant="normal">i</mi></msub><mo>)</mo></math><span class="n">(30.7)</span></div>
    <p class="validite" data-i18n-html="val.30.7"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><mi>d</mi><mo>(</mo><mi data-i18n="eq.sin"></mi><mi>θ</mi><mo>−</mo><mi data-i18n="eq.sin"></mi><msub><mi>θ</mi><mi mathvariant="normal">i</mi></msub><mo>)</mo><mo>=</mo><mi>m</mi><mi>λ</mi><mo>,</mo><mspace width="1em"/><mi>m</mi><mo>∈</mo><mi>ℤ</mi></math><span class="n">(30.7a)</span></div>
    <p class="validite" data-i18n-html="val.30.7a"></p>
    <p data-i18n-html="s2.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure class="chart">
      <svg class="fig" id="trace" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.i"></span><span class="c-warn" data-i18n="fig.legend.motif"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" role="group" id="motif">
            <button type="button" data-m="fin" data-i18n="fig.fin"></button>
            <button type="button" data-m="echelette" data-i18n="fig.echelette"></button>
          </div>
          <div class="ctl"><div class="row"><label for="sl" data-i18n="fig.l"></label><output id="slr" for="sl"></output></div>
            <input id="sl" type="range" min="380" max="780" step="5" value="550"></div>
          <div class="ctl"><div class="row"><label for="sd" data-i18n="fig.d"></label><output id="sdr" for="sd"></output></div>
            <input id="sd" type="range" min="100" max="4000" step="50" value="600"></div>
          <div class="ctl"><div class="row"><label for="si" data-i18n="fig.i"></label><output id="sir" for="si"></output></div>
            <input id="si" type="range" min="-60" max="60" step="1" value="0"></div>
          <div class="ctl"><div class="row"><label for="sn" data-i18n="fig.n"></label><output id="snr" for="sn"></output></div>
            <input id="sn" type="range" min="2" max="30" step="1" value="8"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="fig.k.ordres"></span><span class="v" id="vordres"></span><span class="f" id="fordres"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.k.un"></span><span class="v" id="vun"></span><span class="f" id="fun"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.k.part"></span><span class="v" id="vpart"></span><span class="f" id="fpart"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <p data-i18n-html="s3.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <p data-i18n-html="s4.p2"></p>
    <div class="box rem"><b data-i18n="sys2.title"></b>
      <p id="sys2"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s5.sec"></span>
    <h2 data-i18n="s5.h2"></h2>
    <p data-i18n-html="s5.p1"></p>
    <div class="eq"><math display="block"><mi>I</mi><mo>=</mo><msub><mi>I</mi><mi>m</mi></msub><mfrac><mrow><mn>4</mn><msup><mi data-i18n="eq.sin"></mi><mn>2</mn></msup><mo>(</mo><mi>Φ</mi><mo>/</mo><mn>2</mn><mo>)</mo></mrow><msup><mi>Φ</mi><mn>2</mn></msup></mfrac></math><span class="n">(30.8)</span></div>
    <p class="validite" data-i18n-html="val.30.8"></p>
    <p data-i18n-html="s5.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/opt-reseau-diffraction.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/optique-ondulatoire.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, DEG = Math.PI / 180;
const deg = x => F.num(x / DEG, 3) + "°";

/* ---------- le système décrit : un réseau de spectroscope, et des atomes ---------- */
(() => {
  const N = 600, W = 0.025, lambda = 550e-9, f = 0.5, d = 1e-3 / N, n = Math.round(W / d), dist = W * W / lambda;
  $("sys1").innerHTML = t("sys1.body", { N: F.num(N, 3), W: F.si(W, "m", { prefix: "m" }), n: F.num(n, 3), d: F.si(d, "m", { prefix: "µ" }),
    l: F.si(lambda, "m", { prefix: "n" }), dl: F.num(d / lambda, 3), dist: F.si(dist, "m", { prefix: "k" }), f: F.si(f, "m", { prefix: "m" }) });
  const a = 0.3e-9;
  $("sys2").innerHTML = t("sys2.body", { a: F.si(a, "m", { prefix: "n" }), l: F.si(lambda, "m", { prefix: "n" }), r: F.sci(a / lambda, 2) });
})();

/* ---------- le réseau : intensité diffusée selon la direction ---------- */
(() => {
  const trace = $("trace"), seg = $("motif"), sl = $("sl"), sd = $("sd"), si = $("si"), sn = $("sn"), LB = 500e-9;
  let motif = "fin";
  function draw() {
    const lambda = +sl.value * 1e-9, d = 1e-3 / +sd.value, thIn = +si.value * DEG, n = +sn.value;
    const m = motif === "fin" ? { type: "fin" } : { type: "echelette", lambdaB: LB };
    const o = { n, d, lambda, thIn, motif: m };
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 52, b: 44 }, x: { domain: [-90, 90], label: t("fig.xaxis") }, y: { domain: [0, 1.1], label: t("fig.yaxis") } });
    const xs = Array.from({ length: 3601 }, (_, i) => -90 + i * 0.05);
    Plot.el("path", { d: Plot.path(xs.map(x => [P.x(x), P.y(O.intensiteReseau(x * DEG, o))])), class: "curve" }, P.g);
    if (motif !== "fin") Plot.el("path", { d: Plot.path(xs.map(x => [P.x(x), P.y(O.motif(O.phaseReseau(d, lambda, thIn, x * DEG) / (2 * Math.PI), { type: "echelette", lambdaB: LB, lambda }))])), class: "stroke dash c-warn" }, P.g);
    const ord = O.ordres(d, lambda, thIn);
    for (const x of ord) Plot.el("text", { x: P.x(x.theta / DEG), y: P.y(1.04), class: "note", "text-anchor": "middle" }, P.g).textContent = F.num(x.m, 2);
    Plot.el("line", { x1: P.x(thIn / DEG), x2: P.x(thIn / DEG), y1: P.y(0), y2: P.y(1), class: "stroke thin dash c-label-2" }, P.g);
    $("slr").textContent = F.si(lambda, "m", { prefix: "n" });
    $("sdr").textContent = t("fig.parmm", { v: F.num(+sd.value, 4) });
    $("sir").textContent = deg(thIn);
    $("snr").textContent = F.num(n, 2);
    $("vordres").textContent = F.num(ord.length, 2);
    $("fordres").textContent = t("fig.f.ordres", { v: ord.map(x => F.num(x.m, 2)).join(" ; "), p: F.si(d, "m", { prefix: "µ" }) });
    const un = ord.find(x => x.m === 1);
    $("vun").textContent = un ? deg(un.theta) : t("fig.absent");
    $("fun").textContent = un ? t("fig.f.un", { w: deg(O.largeurAngulaire(n, d, lambda, un.theta)) }) : t("fig.f.absent");
    const e = k => O.motif(k, Object.assign({ lambda }, m)), tot = ord.reduce((s, x) => s + e(x.m), 0);
    $("vpart").textContent = un ? F.qty(F.num(100 * e(1) / tot, 2), "%") : "–";
    $("fpart").textContent = t(motif === "fin" ? "fig.f.fin" : "fig.f.ech", { n: F.num(ord.length, 2), lb: F.si(LB, "m", { prefix: "n" }) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === motif)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { motif = x.dataset.m; draw(); });
  sl.oninput = sd.oninput = si.oninput = sn.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rittenhouse", 1785, "experiment"], ["fraunhofer", 1821, "experiment"], ["rowland", 1882, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["disque"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["phase", "b"], ["rouge", "c"], ["oblique", "a"], ["serre", "d"], ["miroir", "b"], ["echelette", "a"], ["fin", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 302 });
})();
</script>
</body>
</html>
