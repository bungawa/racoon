<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, nm = x => x * 1e-9;
const teinte = (x, y) => "rgb(" + O.couleurAffichable(x, y).join(" ") + ")", FOND = O.grilleCouleurs(0.01);

/* ---------- le diagramme : deux raies et leur mélange, (35.6a) ---------- */
(() => {
  const svg = $("diag"), W = 640, H = 560, P = Plot.el, D65 = O.SRGB.blanc, LOC = O.locus();
  const l1 = $("l1"), l2 = $("l2"), w = $("w");
  function draw() {
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: W, h: H, x: { domain: [0, 0.8], label: t("dg.ax.x") }, y: { domain: [0, 0.9], label: t("dg.ax.y") } });
    /* fond : cellules de 0,01, découpées par le bord du domaine */
    const bord = Plot.path(LOC.map(p => [ax.x(p.x), ax.y(p.y)])) + "Z", dx = ax.x(0.01) - ax.x(0), dy = ax.y(0) - ax.y(0.01);
    P("path", { d: bord }, P("clipPath", { id: "dom1" }, P("defs", {}, svg)));
    const g = P("g", { "clip-path": "url(#dom1)", opacity: 0.85 }, svg);
    FOND.forEach(([x, y, c]) => P("rect", { x: ax.x(x - 0.005) - 0.5, y: ax.y(y + 0.005) - 0.5, width: dx + 1, height: dy + 1, fill: "rgb(" + c.join(" ") + ")" }, g));
    P("path", { d: bord, class: "stroke c-label" }, svg);
    [[O.SRGB, "stroke thin c-label-2"], [O.BT2020, "stroke thin dash c-warn"]].forEach(([g, cls]) =>
      P("path", { d: Plot.path([g.r, g.g, g.b].map(p => [ax.x(p[0]), ax.y(p[1])])) + "Z", class: cls }, svg));
    [460, 480, 500, 520, 540, 560, 580, 600, 620].forEach(l => {
      const c = O.chromaticite(O.cmf(nm(l))), r = Math.hypot(c.x - D65[0], c.y - D65[1]), ux = (c.x - D65[0]) / r, uy = (c.y - D65[1]) / r;
      P("text", { x: ax.x(c.x + 0.035 * ux), y: ax.y(c.y + 0.035 * uy) + 4, "text-anchor": ux < -0.2 ? "end" : ux > 0.2 ? "start" : "middle", class: "tick" }, svg).textContent = F.num(l, 3);
    });
    P("circle", { cx: ax.x(D65[0]), cy: ax.y(D65[1]), r: 4, class: "stroke c-label" }, svg);
    P("text", { x: ax.x(D65[0]) + 8, y: ax.y(D65[1]) - 6, class: "tick" }, svg).textContent = t("dg.blanc");
    const a = O.chromaticite(O.cmf(nm(+l1.value))), b = O.chromaticite(O.cmf(nm(+l2.value))), k = +w.value;
    const m = O.melangeDeux({ x: a.x, y: a.y, Y: k }, { x: b.x, y: b.y, Y: 1 - k });
    P("line", { x1: ax.x(a.x), y1: ax.y(a.y), x2: ax.x(b.x), y2: ax.y(b.y), class: "stroke c-tint" }, svg);
    [a, b].forEach(p => P("circle", { cx: ax.x(p.x), cy: ax.y(p.y), r: 5, class: "fill c-tint" }, svg));
    P("circle", { cx: ax.x(m.x), cy: ax.y(m.y), r: 9, fill: teinte(m.x, m.y), class: "stroke c-label" }, svg);
    $("l1r").textContent = F.si(nm(+l1.value), "m", { prefix: "n", sig: 3 });
    $("l2r").textContent = F.si(nm(+l2.value), "m", { prefix: "n", sig: 3 });
    $("wr").textContent = F.qty(F.num(100 * k, 3), "%");
    $("vxy").textContent = F.num(m.x, 3) + " ; " + F.num(m.y, 3);
    $("fxy").textContent = t("dg.f.poids").replace("{p}", F.qty(F.num(100 * m.poids, 2), "%"));
    const d = O.dominante([m.x, m.y], D65);
    $("vdom").textContent = d.lambda === null ? t("dg.blanc") : F.si(d.lambda, "m", { prefix: "n", sig: 3 }) + (d.complementaire ? " " + t("dg.c") : "");
    $("fdom").textContent = d.purete < 0.01 ? t("dg.f.blanc") : t(d.complementaire ? "dg.f.pourpre" : "dg.f.teinte").replace("{p}", F.qty(F.num(100 * d.purete, 2), "%"));
    const dans = O.dansTriangle([m.x, m.y], [O.SRGB.r, O.SRGB.g, O.SRGB.b]);
    $("vgam").textContent = t(dans ? "dg.oui" : "dg.non");
    $("fgam").textContent = t(dans ? "dg.f.dans" : "dg.f.hors");
  }
  [l1, l2, w].forEach(s => s.oninput = draw);
  $("compl").onclick = () => {
    let c = O.complementaire(nm(+l1.value), O.SRGB.blanc);
    if (c === null || c < nm(400) || c > nm(700)) { l1.value = 580; c = O.complementaire(nm(580), O.SRGB.blanc); }
    l2.value = Math.round(c * 1e9);
    const k = O.proportionBlanc(nm(+l1.value), nm(+l2.value), O.SRGB.blanc);
    if (k !== null) w.value = k.toFixed(2);
    draw();
  };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1855, "experiment"], ["cie", 1931, "use"], ["macadam", 1942, "experiment"], ["srgb", 1999, "use"], ["bt2020", 2012, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ecrans", "lasers"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "c"], ["segment", "a"], ["poids", "d"], ["fer", "b"], ["primaires", "c"], ["vert", "a"], ["purete", "d"], ["distance", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 354 });
})();
</script>
