<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const vtxt = (v, d) => "(" + v.map(x => F.fix(Math.abs(x) < 5e-13 ? 0 : x, d)).join(" ; ") + ")";

/* ---------- le moment d'une force : tableau 3 × 3, et ce que fait un miroir ---------- */
(() => {
  const svg = $("torque"), R = 0.25, MIRROR = [[-1, 0, 0], [0, 1, 0], [0, 0, 1]];
  let miroir = false;
  const arrow = (x1, y1, x2, y2, cls) => Plot.fleche(svg, [x1, y1], [x2, y2], { cls, tete: 10, min: 2 });
  const text = (x, y, s, anchor) => { P("text", { x, y, "text-anchor": anchor || "middle" }, svg).textContent = s; };
  function upd() {
    const ar = +$("ar").value * Math.PI / 180, af = +$("af").value * Math.PI / 180, fz = +$("fz").value;
    $("arv").textContent = F.qty(F.num(+$("ar").value, 3), "°"); $("afv").textContent = F.qty(F.num(+$("af").value, 3), "°");
    $("fzv").textContent = F.qty(F.num(fz, 3), "N");
    $("miroir").setAttribute("aria-pressed", String(miroir));
    let r = [R * Math.cos(ar), R * Math.sin(ar), 0], f = [40 * Math.cos(af), 40 * Math.sin(af), fz];
    const tau0 = Tenseurs.exterieur(r, f);
    if (miroir) { r = Tenseurs.appliquer(MIRROR, r); f = Tenseurs.appliquer(MIRROR, f); }
    const tau = Tenseurs.exterieur(r, f), d = Tenseurs.dual(tau);
    const naif = Tenseurs.appliquer(MIRROR, Tenseurs.dual(tau0));
    /* top view: O at (150, 150), 1 m = 400 px for r, 1 N = 2,4 px for F */
    svg.innerHTML = "";
    const O = [150, 150], X = x => O[0] + x, Y = y => O[1] - y;
    P("line", { x1: 20, y1: 150, x2: 280, y2: 150, class: "stroke thin c-label-2" }, svg);
    P("line", { x1: 150, y1: 280, x2: 150, y2: 20, class: "stroke thin c-label-2" }, svg);
    text(284, 154, t("tq.x"), "start"); text(150, 14, t("tq.y"));
    if (miroir) P("line", { x1: 150, y1: 20, x2: 150, y2: 280, class: "stroke bold dash c-label-2" }, svg);
    const rx = X(400 * r[0]), ry = Y(400 * r[1]);
    arrow(X(0), Y(0), rx, ry, "c-tint");
    arrow(rx, ry, rx + 2.4 * f[0], ry - 2.4 * f[1], "c-warn");
    /* τ_xy as a turning arc about z; its sign gives the sense */
    const s = Math.sign(tau[0][1]) || 0, rad = 26;
    if (s) {
      const a0 = -0.6, a1 = a0 + s * 4.2, p0 = [O[0] + rad * Math.cos(a0), O[1] - rad * Math.sin(a0)], p1 = [O[0] + rad * Math.cos(a1), O[1] - rad * Math.sin(a1)];
      P("path", { d: `M${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A${rad} ${rad} 0 1 ${s > 0 ? 0 : 1} ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`, class: "stroke c-ok" }, svg);
      P("circle", { cx: p1[0], cy: p1[1], r: 4, class: "fill c-ok" }, svg);
    }
    /* the 3 × 3 table */
    const L0 = 330, T0 = 70, W = 96, H = 52, names = ["x", "y", "z"];
    text(L0 + 1.5 * W, 30, t("tq.table"));
    names.forEach((n, j) => { text(L0 + (j + 0.5) * W, T0 - 8, t("tq.col." + n)); text(L0 - 14, T0 + (j + 0.6) * H, t("tq.col." + n)); });
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      P("rect", { x: L0 + j * W + 2, y: T0 + i * H + 2, width: W - 4, height: H - 4, rx: 6, class: "stroke thin " + (i === j ? "c-label-2" : "c-ok") }, svg);
      text(L0 + (j + 0.5) * W, T0 + (i + 0.6) * H, F.fix(Math.abs(tau[i][j]) < 5e-13 ? 0 : tau[i][j], 2));
    }
    text(L0 + 1.5 * W, T0 + 3 * H + 26, t("tq.unite"));
    $("vdual").textContent = F.qty(vtxt(d, 2), "N·m");
    const direct = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
    $("vcross").textContent = F.qty(vtxt(miroir ? naif : direct, 2), "N·m");
    $("kcross").textContent = t(miroir ? "tq.k.naif" : "tq.k.cross");
    $("fcross").textContent = t(miroir ? "tq.f.miroir" : "tq.f.egal");
  }
  ["ar", "af", "fz"].forEach(id => $(id).oninput = upd);
  $("miroir").onclick = () => { miroir = !miroir; upd(); };
  upd();
})();

/* ---------- combien de termes indépendants ---------- */
(() => {
  const upd = () => {
    const n = +$("dim").value, c = Tenseurs.composantesIndependantes(n);
    $("dimv").textContent = String(n); $("dvec").textContent = String(c.vecteur); $("danti").textContent = String(c.antisymetrique);
    $("fanti").textContent = t(c.antisymetrique === c.vecteur ? "dim.f.egal" : "dim.f.diff");
  };
  $("dim").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lagrange", 1773, "idea"], ["hamilton", 1843, "idea"], ["grassmann", 1844, "idea"], ["gibbs", 1881, "idea"], ["ricci", 1901, "idea"], ["burali", 1908, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["robot", "champ"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["diag", "b"], ["trois", "a"], ["quatre", "c"], ["miroir", "d"], ["tenseur", "b"], ["sym", "a"], ["matrice", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
