      <div class="legend"><span class="c-tint" data-i18n="orb.legend.m1"></span><span class="c-warn" data-i18n="orb.legend.m2"></span><span class="c-label-2" data-i18n="orb.legend.rel"></span></div>
      <div class="panel">

          <div class="ctl"><div class="row"><label for="q" data-i18n="orb.q"></label><output id="qv" for="q"></output></div>

          <div class="ctl"><div class="row"><label for="ex" data-i18n="orb.e"></label><output id="exv" for="ex"></output></div>

          <div class="ctl"><div class="row"><label for="tt" data-i18n="orb.t"></label><output id="ttv" for="tt"></output></div>

        <div class="stats">

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);

/* ---------- les deux orbites autour de G ---------- */
(() => {
  const P = Plot.el, W = 640, CY = 190;
  function upd() {
    const q = Math.pow(10, +$("q").value), e = +$("ex").value, u = +$("tt").value, M = 1 + q;   // m1 = 1, m2 = q
    $("qv").textContent = F.num(q, 3); $("exv").textContent = F.num(e, 2); $("ttv").textContent = F.num(u, 2) + " T";
    const a = Math.min(165 / Math.sqrt(1 - e * e), 290), CX = W / 2 + a * e;      // the relative orbit fills the frame, centred
    const rel = Kepler.ellipse(a, e, 240), svg = $("orb"); svg.innerHTML = "";
    const path = (pts, k, cls) => P("path", { d: pts.map((p, i) => (i ? "L" : "M") + (CX + k * p[0]).toFixed(1) + " " + (CY - k * p[1]).toFixed(1)).join(""), class: cls }, svg);
    path(rel, 1, "stroke thin dash c-label-2");
    path(rel, 1 / M, "stroke c-warn");                                            // body 2: (m1/M) r
    path(rel, -q / M, "stroke c-tint");                                            // body 1: −(m2/M) r
    const E = Kepler.anomalie(2 * Math.PI * u, e), r = [a * (Math.cos(E) - e), a * Math.sqrt(1 - e * e) * Math.sin(E)];
    const p1 = [CX - q / M * r[0], CY + q / M * r[1]], p2 = [CX + r[0] / M, CY - r[1] / M];
    P("line", { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], class: "stroke thin c-label-2" }, svg);
    P("circle", { cx: CX + r[0], cy: CY - r[1], r: 4, class: "fill c-label-2" }, svg);
    P("circle", { cx: p1[0], cy: p1[1], r: 9, class: "fill c-tint" }, svg);
    P("circle", { cx: p2[0], cy: p2[1], r: 3 + 6 * Math.cbrt(q), class: "fill c-warn" }, svg);
    P("circle", { cx: CX, cy: CY, r: 2.5, class: "fill c-label" }, svg);
    P("text", { x: CX - 14, y: CY - 8 }, svg).textContent = "G";
    $("vmu").textContent = F.num(DeuxCorps.reduite(1, q) / q, 3);
    $("vg").textContent = F.num(q / M, 3);
    $("vt").textContent = F.num(DeuxCorps.periodeRelative(q), 3);
  }
  ["q", "ex", "tt"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- ordres de grandeur ---------- */
(() => {
  const J = DeuxCorps.jupiterSoleil(), L = Kepler.LUNE, Cst = Constantes;
  $("sjup").textContent = F.num(J.surRayon, 3);
  $("ssol").textContent = F.qty(F.num(J.vSoleil, 3), "m·s⁻¹");
  $("slune").textContent = F.qty(F.num(DeuxCorps.barycentre(1, L.masse, L.a) / 1e3, 4), "km");
  $("sh").textContent = F.sci(1 - DeuxCorps.reduite(Cst.m_e, Cst.m_p) / Cst.m_e, 3);
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["isole", "points", "newton"], items = textOf("sys.items", IDS), Cst = Constantes;
  const v = { maree: F.sci(FC.mareeSolaire().tangentielle, 1), lune: F.num(Constantes.R_E_mean / 1e3, 4),
    vc: F.sci((DeuxCorps.jupiterSoleil().vJupiter / Cst.c) ** 2, 1),
    dl: F.qty(F.num(DeuxCorps.decalageIsotopique(656.28e-9, Cst.m_p, 3.3435837768e-27) * 1e9, 3), "nm") };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["principia", 1687, "idea"], ["urey", 1931, "experiment"], ["pegase", 1995, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["vitesses", "isotopes"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["mu", "b"], ["g", "a"], ["lourd", "c"], ["periode", "d"], ["ec", "a"], ["soleil", "b"], ["isole", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 211 });
})();
</script>
