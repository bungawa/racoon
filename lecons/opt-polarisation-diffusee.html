    <div class="eq"><math display="block"><mfrac><msub><mi>I</mi><mo>∥</mo></msub><msub><mi>I</mi><mo>⊥</mo></msub></mfrac><mo>=</mo><msup><mi data-i18n="eq.cos"></mi><mn>2</mn></msup><mi>θ</mi></math></div>

  <section class="card">

    <figure class="chart">
      <svg class="fig" id="polaire" viewBox="0 0 640 300" role="img" data-i18n-attr="aria-label:fig.aria.polaire"></svg>
      <svg class="fig" id="courbe" role="img" data-i18n-attr="aria-label:fig.aria.courbe"></svg>

      <div class="panel">

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>

<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/opt-polarisation-diffusee.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/optique-ondulatoire.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptOnd, DEG = Math.PI / 180, RHO_AIR = 0.0279;
const pct = x => F.qty(F.num(100 * x, 3), "%");

/* ---------- diagramme de diffusion : les deux composantes, le degré de polarisation, ce que laisse passer un analyseur ---------- */
(() => {
  const polaire = $("polaire"), courbe = $("courbe"), sth = $("sth"), srho = $("srho"), sbeta = $("sbeta");
  const cx0 = 320, cy0 = 150, R = 110;                                        // the molecule at the centre; I = 1 drawn at R px
  function draw() {
    const th = +sth.value * DEG, rho = +srho.value, beta = +sbeta.value * DEG, d = O.diffusion(th, rho);
    /* polar diagram in the scattering plane: distance from the centre ∝ intensity sent in that direction */
    polaire.innerHTML = "";
    const angs = Array.from({ length: 361 }, (_, i) => i * DEG);
    const lobe = f => Plot.path(angs.map(a => { const r = R * f(a); return [cx0 + r * Math.cos(a), cy0 - r * Math.sin(a)]; }));
    Plot.fleche(polaire, [40, cy0], [cx0 - 18, cy0], { cls: "c-label-2" });
    Plot.el("text", { x: 40, y: cy0 - 10, class: "label" }, polaire).textContent = t("fig.incident");
    Plot.el("path", { d: lobe(() => 1), class: "stroke c-tint" }, polaire);
    Plot.el("path", { d: lobe(a => O.diffusion(a, rho).Ipar), class: "stroke c-warn" }, polaire);
    Plot.el("circle", { cx: cx0, cy: cy0, r: 4, class: "fill c-label" }, polaire);
    const ux = Math.cos(th), uy = -Math.sin(th);
    Plot.fleche(polaire, [cx0 + 10 * ux, cy0 + 10 * uy], [cx0 + (R + 36) * ux, cy0 + (R + 36) * uy], { cls: "c-label" });
    Plot.el("text", { x: cx0 + (R + 50) * ux, y: cy0 + (R + 50) * uy + 4, "text-anchor": "middle", class: "label" }, polaire).textContent = t("fig.observateur");
    /* P(θ) for this ρ, and for isotropic molecules as a dashed reference */
    courbe.innerHTML = "";
    const P = Plot.axes(courbe, { fmt: F, w: 640, h: 220, pad: { l: 56 }, x: { domain: [0, 180], label: t("fig.xaxis") }, y: { domain: [0, 100], label: t("fig.yaxis") } });
    const ths = Array.from({ length: 181 }, (_, i) => i);
    Plot.el("path", { d: Plot.path(ths.map(a => [P.x(a), P.y(100 * O.diffusion(a * DEG).P)])), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(ths.map(a => [P.x(a), P.y(100 * O.diffusion(a * DEG, rho).P)])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(th / DEG), cy: P.y(100 * d.P), r: 5, class: "dot" }, P.g);
    /* analyser: its axis at β from the normal to the scattering plane */
    const vu = (d.Iperp * Math.cos(beta) ** 2 + d.Ipar * Math.sin(beta) ** 2) / d.total;
    $("sthr").textContent = F.qty(F.num(th / DEG, 3), "°");
    $("srhor").textContent = F.num(rho, 3);
    $("sbetar").textContent = F.qty(F.num(beta / DEG, 3), "°");
    $("vP").textContent = pct(d.P);
    $("fP").textContent = t("fig.f.P", { v: pct(O.diffusion(th).P) });
    $("vrap").textContent = F.num(d.Ipar / d.Iperp, 3);
    $("frap").textContent = t("fig.f.rapport", { v: F.num(Math.cos(th) ** 2, 3) });
    $("van").textContent = pct(vu);
    $("fan").textContent = t("fig.f.analyseur", { min: pct(Math.min(d.Iperp, d.Ipar) / d.total), max: pct(Math.max(d.Iperp, d.Ipar) / d.total) });
  }
  sth.oninput = srho.oninput = sbeta.oninput = draw; draw();
})();

/* ---------- le système décrit : le ciel bleu vu à 90° du Soleil ---------- */
(() => {
  const z = O.cielPolarise({ h: 0, az: 90 * DEG }, { h: 90 * DEG, az: 0 }, RHO_AIR);
  $("sys1").innerHTML = t("sys1.body", { taille: F.sci(0.3e-9 / 500e-9, 1), rho: F.num(RHO_AIR, 3), Pz: pct(z.P), P30: pct(O.diffusion(30 * DEG, RHO_AIR).P) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["arago", 1809, "experiment"], ["tyndall", 1869, "experiment"], ["rayleigh", 1871, "idea"], ["frisch", 1949, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["photo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["axe", "c"], ["angle", "a"], ["avant", "d"], ["analyseur", "b"], ["anisotrope", "c"], ["ciel", "a"], ["incident", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 332 });
})();
</script>
