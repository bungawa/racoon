      <svg class="fig" id="champ" viewBox="0 0 640 400" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.haut"></span><span class="c-warn" data-i18n="fig.legend.bas"></span></div>
      <div class="panel">
        <div class="seg" role="group" id="champs" data-i18n-attr="aria-label:fig.choix">
          <button type="button" data-c="selle" data-i18n="champ.selle"></button>
          <button type="button" data-c="etirement" data-i18n="champ.etirement"></button>
          <button type="button" data-c="riviere" data-i18n="champ.riviere"></button>
          <button type="button" data-c="cellules" aria-pressed="true" data-i18n="champ.cellules"></button>
          <button type="button" data-c="source" data-i18n="champ.source"></button>
          <button type="button" data-c="tourbillon" data-i18n="champ.tourbillon"></button>
        </div>
        <div class="controls">
          <div class="ctl"><div class="row"><label for="cx" data-i18n="fig.cx"></label><output id="cxr" for="cx"></output></div>
            <input id="cx" type="range" min="-12" max="12" step="0.5" value="-3"></div>
          <div class="ctl"><div class="row"><label for="cy" data-i18n="fig.cy"></label><output id="cyr" for="cy"></output></div>
            <input id="cy" type="range" min="-8" max="8" step="0.5" value="1"></div>
          <div class="ctl"><div class="row"><label for="rr" data-i18n="fig.r"></label><output id="rrr" for="rr"></output></div>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const C2 = "m²·s⁻¹";

/* ---------- the operators, and the identities ---------- */
(() => {
  const list = (id, key, ids) => { const txt = textOf(key, ids);
    $(id).innerHTML = ids.map(k => `<div><span class="k">${txt[k].k}</span><span>${txt[k].text}</span></div>`).join(""); };
  list("ops", "ops.items", ["grad", "div", "rot", "lap"]);
  list("identites", "id.items", ["rotgrad", "divrot", "divgrad", "rotrot"]);
})();

/* ---------- three theorems, one disc ---------- */
(() => {
  const svg = $("champ"), S = 20, X = x => 320 + S * x, Y = y => 200 - S * y;
  const FIELDS = { selle: [0.1], etirement: [0.1], riviere: [1, 10], cellules: [1, Math.PI / 8], source: [20], tourbillon: [20] };
  const notes = textOf("fig.notes", Object.keys(FIELDS));
  const sl = { cx: $("cx"), cy: $("cy"), rr: $("rr") };
  let nom = "cellules";
  const arrow = (x, y, v) => {
    const n = Math.hypot(v[0], v[1]); if (!(n > 0)) return;
    const L = Math.min(1.4 * n, 1.8);
    Plot.fleche(svg, [X(x), Y(y)], [X(x + L * v[0] / n), Y(y + L * v[1] / n)], { cls: "c-label-2", tete: 6, trait: "stroke thin" });
  };
  const v2 = x => F.fix(x, 2), ok = (a, b, sc) => Math.abs(a - b) <= 1e-3 * sc;
  function draw() {
    let R = +sl.rr.value, cx = +sl.cx.value, cy = +sl.cy.value;
    cx = Math.max(-16 + R, Math.min(16 - R, cx)); cy = Math.max(-10 + R, Math.min(10 - R, cy));
    sl.cx.value = cx; sl.cy.value = cy;
    const f = Circ.CHAMPS[nom](...FIELDS[nom]), c = [cx, cy];
    svg.innerHTML = "";
    if (nom === "riviere") [-10, 10].forEach(y => P("line", { x1: 0, x2: 640, y1: Y(y), y2: Y(y), class: "stroke bold c-label-2" }, svg));
    for (let x = -15; x <= 15; x += 2) for (let y = -9; y <= 9; y += 2) arrow(x, y, f.F([x, y]));
    if (f.singulier) P("circle", { cx: X(0), cy: Y(0), r: 4, class: "fill c-warn" }, svg);
    const half = (a0, a1, cls) => { let d = ""; for (let k = 0; k <= 48; k++) { const a = a0 + (a1 - a0) * k / 48; d += (k ? "L" : "M") + X(cx + R * Math.cos(a)).toFixed(1) + " " + Y(cy + R * Math.sin(a)).toFixed(1); }
      P("path", { d, class: "stroke bold " + cls }, svg); };
    half(Math.PI, 0, "c-tint"); half(Math.PI, 2 * Math.PI, "c-warn");
    [[cx - R, "1"], [cx + R, "2"]].forEach(([x, k]) => { P("circle", { cx: X(x), cy: Y(cy), r: 5, class: "fill c-label" }, svg);
      P("text", { x: X(x) + (k === "1" ? -14 : 8), y: Y(cy) + 4 }, svg).textContent = k; });
    $("cxr").textContent = F.qty(F.fix(cx, 1), "m"); $("cyr").textContent = F.qty(F.fix(cy, 1), "m"); $("rrr").textContent = F.qty(F.fix(R, 1), "m");
    const passe = f.singulier && Math.abs(Math.hypot(cx, cy) - R) < 0.3;
    if (passe) { ["vgrad", "vgauss", "vstokes"].forEach(id => $(id).textContent = "–"); ["fgrad", "fgauss", "fstokes"].forEach(id => $(id).textContent = t("fig.passe")); }
    else {
      const b = Circ.bilan(f, c, R, 720), sc = AnaVec.norme(f.F([cx + R, cy])) * R + 1e-9;
      $("vgrad").textContent = t("fig.v.deux", { a: v2(b.haut), b: v2(b.bas) });
      $("fgrad").textContent = b.dphi === null ? t("fig.f.sanspot", { d: v2(b.bas - b.haut) }) : t("fig.f.grad", { p: v2(b.dphi) });
      $("vgauss").textContent = t("fig.v.deux", { a: v2(b.flux), b: v2(b.div) });
      $("fgauss").textContent = t(ok(b.flux, b.div, sc) ? "fig.f.egal" : "fig.f.faux");
      $("vstokes").textContent = t("fig.v.deux", { a: v2(b.circ), b: v2(b.rot) });
      $("fstokes").textContent = t(ok(b.circ, b.rot, sc) ? "fig.f.egal" : "fig.f.faux");
    }
    $("note").innerHTML = notes[nom];
  }
  document.querySelectorAll("#champs button").forEach(b => b.onclick = () => {
    nom = b.dataset.c; document.querySelectorAll("#champs button").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); });
  Object.values(sl).forEach(s => s.oninput = draw);
  const toWorld = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [(q.x - 320) / S, (200 - q.y) / S]; };
  let drag = null;
  svg.addEventListener("pointerdown", e => { const [x, y] = toWorld(e); if (Math.hypot(x - sl.cx.value, y - sl.cy.value) <= +sl.rr.value) { drag = [x - sl.cx.value, y - sl.cy.value]; svg.setPointerCapture(e.pointerId); } });
  svg.addEventListener("pointermove", e => { if (!drag) return; const [x, y] = toWorld(e); sl.cx.value = Math.round(2 * (x - drag[0])) / 2; sl.cy.value = Math.round(2 * (y - drag[1])) / 2; draw(); });
  svg.addEventListener("pointerup", () => drag = null);
  draw();
})();

/* ---------- history ---------- */
(() => {
  const EVENTS = [["cartan99", 1899, "idea"], ["derham", 1931, "idea"], ["cartan45", 1945, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["volumes", "aire"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["motif", "b"], ["gradient", "a"], ["gauss", "c"], ["stokes", "d"], ["chemins", "a"], ["source", "b"], ["identite", "c"], ["aire", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 338 });
})();
</script>
