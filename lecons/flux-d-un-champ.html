            <input id="dsl" type="range" min="0.1" max="2" step="0.05" value="1"></div>
          <div class="ctl"><div class="row"><label for="thsl" data-i18n="capteur.th"></label><output id="thread" for="thsl"></output></div>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- a point source of W, isotropic: h = W r⃗ / (4π r³) ---------- */
const W = 100, SOURCE = p => { const r = Math.hypot(...p); return p.map(x => W * x / (4 * Math.PI * r ** 3)); };
$("sys").innerHTML = t("sys.body", { W: F.num(W, 3), h1: F.fix(Diffusion.sourcePonctuelle(W, 1), 2), src: F.sci(0.01 / 1, 1) });
$("sphere").innerHTML = t("s3.sphere", { W: F.num(W, 3), h1: F.fix(Diffusion.sourcePonctuelle(W, 1), 2), h3: F.fix(Diffusion.sourcePonctuelle(W, 3), 3),
  s1: F.fix(4 * Math.PI, 1), s3: F.fix(4 * Math.PI * 9, 0) });

(() => {
  const svg = $("capteur"), P = Plot.el, K = 260, S = [60, 170];
  let signe = 1;
  const arrow = (A, B, cls, parent) => Plot.fleche(parent, A, B, { cls });
  const label = (p, text, parent) => { const e = P("text", { x: p[0], y: p[1], "text-anchor": "middle" }, parent); e.textContent = text; return e; };
  const S3 = ["dsl", "thsl", "asl"].map($);
  function draw() {
    svg.innerHTML = "";
    const d = +S3[0].value, th = +S3[1].value * Math.PI / 180, a = +S3[2].value;
    /* rays of the source */
    const rays = P("g", { class: "c-warn", opacity: 0.35 }, svg);
    for (let k = 0; k < 36; k++) { const f = 2 * Math.PI * k / 36; const c = Math.cos(f), s = -Math.sin(f), L = Math.min(c > 0 ? (640 - S[0]) / c : c < 0 ? -S[0] / c : 1e9, s > 0 ? (340 - S[1]) / s : s < 0 ? -S[1] / s : 1e9);
      P("line", { x1: S[0] + 10 * c, y1: S[1] + 10 * s, x2: S[0] + L * c, y2: S[1] + L * s, class: "stroke thin" }, rays); }
    P("circle", { cx: S[0], cy: S[1], r: 6, class: "fill c-warn" }, svg);
    label([S[0], S[1] + 24], t("capteur.source"), svg);
    /* the square, seen edge on: centre (d, 0), along (−sin θ, cos θ) */
    const C = [S[0] + K * d, S[1]], e = [-Math.sin(th), Math.cos(th)], A1 = [C[0] + K * a / 2 * e[0], C[1] - K * a / 2 * e[1]], A2 = [C[0] - K * a / 2 * e[0], C[1] + K * a / 2 * e[1]];
    [A1, A2].forEach(Q => P("line", { x1: S[0], y1: S[1], x2: Q[0], y2: Q[1], class: "stroke thin dash c-label-2" }, svg));
    P("line", { x1: A1[0], y1: A1[1], x2: A2[0], y2: A2[1], class: "stroke bold c-label" }, svg);
    const n = [signe * Math.cos(th), signe * Math.sin(th)];
    arrow(C, [C[0] + 50 * n[0], C[1] - 50 * n[1]], "c-tint", svg);
    label([C[0] + 64 * n[0], C[1] - 64 * n[1] + 4], t("capteur.nlabel"), svg);
    /* the flux, numerically and with the field at the centre */
    const u = [-Math.sin(th) * a, Math.cos(th) * a, 0], v = [0, 0, a];
    const phi = signe * AnaVec.fluxParallelogramme(SOURCE, [d, 0, 0], u, v, 60);
    const approx = signe * Diffusion.sourcePonctuelle(W, d) * a * a * Math.cos(th);
    $("dread").textContent = F.qty(F.fix(d, 2), "m");
    $("thread").textContent = F.qty(S3[1].value, "°");
    $("aread").textContent = F.qty(F.fix(a, 2), "m");
    $("vphi").textContent = F.qty(F.num(phi, 3), "W");
    $("vapprox").textContent = F.qty(F.num(approx, 3), "W");
    $("fapprox").textContent = Math.abs(phi) > 1e-9 ? t("capteur.f.approx", { e: F.num(100 * (approx / phi - 1), 2) }) : t("capteur.f.nul");
    $("vpart").textContent = F.qty(F.num(100 * phi / W, 3), "%");
  }
  S3.forEach(s => s.oninput = draw);
  $("inverse").onclick = () => { signe = -signe; draw(); };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fourier", 1807, "idea"], ["faraday", 1831, "experiment"], ["maxwell", 1855, "idea"], ["davies", 2010, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["geothermie", "solaire"], uses = textOf("uses.items", USES);
  const R = Constantes.R_E_mean, terre = { flux: F.num(47e12 / (4 * Math.PI * R * R) * 1e3, 2) };
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace("{flux}", terre.flux)}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["incline", "a"], ["normale", "b"], ["distance", "c"], ["sphere", "d"], ["electrique", "a"], ["uniforme", "b"], ["decoupe", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 302 });
})();
</script>
