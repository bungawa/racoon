        <div class="stats">

          <div class="stat"><span class="k" data-i18n="fit.k.neptune"></span><span class="v" id="vnep"></span><span class="f" data-i18n="fit.f.neptune"></span></div>
          <div class="stat"><span class="k" data-i18n="fit.k.lune"></span><span class="v" id="vlune"></span><span class="f" data-i18n="fit.f.lune"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>

<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/loi-de-la-gravitation.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/lecons/kepler.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
const MOON = Kepler.testLune(2);

/* ---------- de la troisième loi à 1/rⁿ, et la Lune avec le même n ---------- */
(() => {
  const rows = Kepler.troisiemeLoi(), AU = Constantes.au, P = Plot.el, svg = $("fit");
  const acc = r => 4 * Math.PI * Math.PI * r.a / (r.T * r.T), E = rows.find(r => r.id === "terre"), N = rows.find(r => r.id === "neptune");
  $("vpente").textContent = F.num(Kepler.pente().force, 5);
  $("fpente").textContent = t("fit.f.pente", { n: F.num(-Kepler.pente().force, 5) });
  function upd() {
    const n = +$("nx").value, law = a => acc(E) * Math.pow(a / (E.a / AU), -n);
    $("nxv").textContent = F.num(n, 3);
    svg.innerHTML = "";
    const { x: X, y: Y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { scale: "log", domain: [0.1, 100], label: t("fit.x") }, y: { scale: "log", domain: [1e-6, 1], label: t("fit.y") } });
    const clip = P("clipPath", { id: "fitarea" }, svg); P("rect", { x: X(0.1), y: Y(1), width: X(100) - X(0.1), height: Y(1e-6) - Y(1) }, clip);
    const inner = P("g", { "clip-path": "url(#fitarea)" }, g);
    P("path", { d: [0.1, 100].map((a, i) => (i ? "L" : "M") + X(a).toFixed(1) + " " + Y(law(a)).toFixed(1)).join(""), class: "ref" }, inner);
    rows.forEach(r => P("circle", { cx: X(r.a / AU), cy: Y(acc(r)), r: 5, class: "dot" }, inner));
    $("vnep").textContent = F.num(law(N.a / AU) / acc(N), 3);
    const m = Kepler.testLune(n);
    $("vlune").textContent = F.num(m.predite / m.mesure, 3);
    $("vchute").textContent = F.si(m.predite / 2, "m");
    $("fchute").textContent = t("fit.f.chute", { g: F.si(m.g0 / 2, "m") });
  }
  $("nx").oninput = upd; upd();
})();

/* ---------- décrire le système : le 1 % qui reste ---------- */
(() => {
  const IDS = ["masse", "soleil", "taille", "g"], items = textOf("neglect.items", IDS);
  const v = { masse: F.qty(F.num(MOON.masse / MOON.mesure * 100, 3), "%"), soleil: F.qty(F.num(-MOON.soleil / MOON.mesure * 100, 2), "%") };
  keyed($("neglect"), t("neglect.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
  $("bilanp").textContent = t("s4.p2", { ecart: F.sci(Math.abs(MOON.ecartCorrige), 1) });
  const brut = MOON.predite, avec = brut + MOON.masse, tout = avec + MOON.soleil;
  const L = [["bilan.brut", brut], ["bilan.masse", avec], ["bilan.soleil", tout], ["bilan.mesure", MOON.mesure]];
  $("bilan").innerHTML = L.map(([k, a]) => `<div role="row"><span role="cell">${t(k)}</span><span class="v" role="cell">${F.qty(F.sci(a, 5), "m·s⁻²")}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lune", 1666, "idea"], ["picard", 1670, "experiment"], ["hooke", 1680, "idea"], ["halley", 1684, "idea"], ["principia", 1687, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["laser", "geo"], items = textOf("uses.items", USES);
  const rgeo = Math.cbrt(Constantes.GM_E / (Constantes.Omega_E * Constantes.Omega_E));      // T = 2π/Ω: r³ = GM/Ω²
  items.geo = { name: items.geo.name, text: fill(items.geo.text, { r: F.qty(F.num(rgeo / 1e3, 5), "km") }) };
  keyed($("uses"), t("uses.tag"), USES, items);
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["aires", "a"], ["k3", "a"], ["soixante", "a"], ["tombe", "a"], ["exposant", "a"], ["masse", "a"], ["coincidence", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 74 });
})();
</script>
