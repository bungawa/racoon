<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptOnd, DEG = Math.PI / 180;
const deg = (x, n) => F.qty(F.num(x, n || 3), "°");

/* ---------- le polarimètre : un tube de sucre entre deux polariseurs ---------- */
(() => {
  const vue = $("vue"), trace = $("trace"), sc = $("sc"), sl = $("sl"), sb = $("sb"), seg = $("sucre");
  let sucre = "saccharose";
  function draw() {
    const c = +sc.value, l = +sl.value / 100, beta = +sb.value * DEG;            // c in kg·m⁻³ (g/L), ℓ in m (slider in cm)
    const p = O.polarimetre({ a: O.SUCRES[sucre], l, c, beta });
    /* the view of the observer who receives the light: the polariser vertical; α clockwise if positive */
    vue.innerHTML = "";
    const cx = 120, cy = 110, R = 90, dir = a => [Math.sin(a), -Math.cos(a)];     // a clockwise from the vertical
    Plot.el("circle", { cx, cy, r: R, class: "stroke thin c-label-2" }, vue);
    const ligne = (a, cls) => { const [ux, uy] = dir(a); Plot.el("line", { x1: cx - R * ux, y1: cy - R * uy, x2: cx + R * ux, y2: cy + R * uy, class: cls }, vue); };
    ligne(0, "stroke dash c-label-2"); ligne(beta, "stroke c-warn");
    const [ux, uy] = dir(p.alpha);
    Plot.fleche(vue, [cx - 0.8 * R * ux, cy - 0.8 * R * uy], [cx + 0.8 * R * ux, cy + 0.8 * R * uy], { cls: "c-tint", trait: "stroke bold" });
    Plot.fleche(vue, [cx + 0.8 * R * ux, cy + 0.8 * R * uy], [cx - 0.8 * R * ux, cy - 0.8 * R * uy], { cls: "c-tint", trait: "stroke bold" });
    /* the tube seen from the side, its length to scale, and the brightness behind the analyser */
    const x0 = 270, w = 8 * +sl.value;
    Plot.el("rect", { x: x0, y: 90, width: w, height: 40, class: "stroke c-tint" }, vue);
    Plot.el("line", { x1: x0 - 30, y1: 110, x2: x0 + w + 60, y2: 110, class: "stroke thin c-label-2" }, vue);
    Plot.el("rect", { x: x0 - 20, y: 80, width: 4, height: 60, class: "fill c-label-2" }, vue);
    Plot.el("rect", { x: x0 + w + 20, y: 80, width: 4, height: 60, class: "fill c-warn" }, vue);
    Plot.el("circle", { cx: x0 + w + 50, cy: 110, r: 4 + 14 * p.I, class: "fill c-warn" }, vue);
    /* I/I0 against the analyser angle */
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 44 }, x: { domain: [-90, 90], label: t("fig.xaxis") }, y: { domain: [0, 1], label: t("fig.yaxis") } });
    const bs = Array.from({ length: 361 }, (_, k) => -90 + k * 0.5);
    Plot.el("path", { d: Plot.path(bs.map(b => [P.x(b), P.y(Math.cos(b * DEG - p.alpha) ** 2)])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(+sb.value), cy: P.y(p.I), r: 5, class: "dot" }, P.g);
    const lu = ((p.alpha / DEG % 180) + 270) % 180 - 90;                            // what the analyser can show: α modulo 180°
    $("scr").textContent = F.si(c, "kg·m⁻³"); $("slr").textContent = F.qty(F.num(+sl.value, 3), "cm"); $("sbr").textContent = deg(+sb.value);
    $("valpha").textContent = deg(p.alpha / DEG);
    $("falpha").textContent = t(p.alpha > 0 ? "fig.f.dextro" : p.alpha < 0 ? "fig.f.levo" : "fig.f.rien", { v: deg(lu) });
    $("vi").textContent = F.num(p.I, 3);
    $("fi").textContent = t("fig.f.i", { v: deg(lu + 90 > 90 ? lu - 90 : lu + 90) });
    $("vdn").textContent = l > 0 && c > 0 ? F.sci(Math.abs(p.dn), 2) : "0";
    $("fdn").textContent = t("fig.f.dn", { v: F.sci(1.33 * l / 589e-9, 2) });                // wavelengths (in water) along the tube
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.s === sucre)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { sucre = x.dataset.s; draw(); });
  sc.oninput = sl.oninput = sb.oninput = draw; draw();
})();

/* ---------- le système décrit : une molécule, un tube ---------- */
(() => {
  const A = 1e-9, lam = 589e-9, h = O.helice(A, lam), l = 0.2, c = 100;
  const alpha = O.rotationSolution(O.specifiqueSI(O.SUCRES.saccharose), l, c), dn = O.ecartCirculaire(alpha, l, lam);
  $("sys1").innerHTML = t("sys1.body", { A: F.si(A, "m", { prefix: "n" }), lam: F.si(lam, "m", { prefix: "n" }), kA: F.sci(h.premierOrdre, 2),
    l: F.si(l, "m"), c: F.si(c, "kg·m⁻³"), alpha: deg(alpha / DEG), longueurs: F.sci(l / lam, 2), dn: F.sci(dn, 2), err: F.sci(h.premierOrdre ** 2 / 24, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["arago", 1811, "experiment"], ["biot", 1815, "experiment"], ["pasteur", 1848, "experiment"], ["vanthoff", 1874, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sucre", "pharma"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["helice", "c"], ["ordre", "a"], ["orientation", "d"], ["racemique", "b"], ["double", "c"], ["lecture", "a"], ["sens", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 335 });
})();
</script>
