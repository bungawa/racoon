<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, T = 300;

/* ---------- (43.42) contre les mesures, cinq gaz à 300 K ---------- */
(() => {
  const GAZ = ["He", "H2", "N2", "O2", "Ar"];
  $("gaz").innerHTML = GAZ.map(g => {
    const k = S.kappaGaz(g, T);
    return `<div><span class="k">${t("gaz." + g)}</span><span>${t("gaz.ligne", { k42: F.num(k.k42, 2), k3: F.num(k.k42 / 3, 2), mes: F.num(k.mes, 3), r: F.num(k.mes / k.k42, 2) })}</span></div>`;
  }).join("");
})();

/* ---------- entre deux plaques : conduction du gaz dense, puis molécules libres ---------- */
(() => {
  const svg = $("courbe"), sg = $("choix"), sL = $("lL"), P0 = 1e-3, P1 = 1e5;
  function draw() {
    const g = sg.value, L = Math.pow(10, +sL.value), at = P => S.conductionPlaques({ g, P, T, L });
    const hc = at(1).hc, pente = at(1).hfm, Pt = hc / pente;            // hfm = pente × P: the two lines cross at Pt
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { scale: "log", domain: [P0, P1], label: t("sim.x") }, y: { scale: "log", domain: [1e-3, 1e5], label: t("sim.y") } });
    const clip = y => Math.min(1e5, Math.max(1e-3, y));
    const pts = f => { const p = []; for (let k = 0; k <= 160; k++) { const P = P0 * Math.pow(P1 / P0, k / 160); p.push([ax.x(P), ax.y(clip(f(at(P))))]); } return p; };
    Plot.el("path", { d: Plot.path(pts(h => h.hc)), class: "stroke thin dash c-warn" }, ax.g);
    Plot.el("path", { d: Plot.path(pts(h => h.hfm)), class: "stroke thin dash c-label-2" }, ax.g);
    Plot.el("path", { d: Plot.path(pts(h => h.h)), class: "stroke bold c-tint" }, ax.g);
    const Pkn = at(1).l / L;                                             // l ∝ 1/P: Kn = 1 at this pressure (Pa)
    if (Pkn > P0 && Pkn < P1) Plot.el("line", { x1: ax.x(Pkn), x2: ax.x(Pkn), y1: ax.y(1e5), y2: ax.y(1e-3), class: "stroke thin dash c-label" }, ax.g);
    $("lLv").textContent = F.si(L, "m", { sig: 2 });
    $("vhc").textContent = F.num(hc, 3);
    $("vpt").textContent = F.si(Pt, "Pa", { sig: 2 });
    $("fpt").textContent = t("sim.f.pt", { kn: F.si(Pkn, "Pa", { sig: 2 }) });
    $("vgain").textContent = F.sci(at(101325).h / at(0.1).h, 2);
  }
  sg.onchange = draw; sL.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1860, "idea"], ["dewar", 1892, "experiment"], ["pirani", 1906, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pirani", "tcd"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["densite", "a"], ["helium", "b"], ["tiers", "c"], ["vide", "d"], ["temperature", "a"], ["pirani", "b"], ["tcd", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 436 });
})();
</script>
