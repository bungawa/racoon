    <div class="eq"><math display="block"><mi>V</mi><mo>(</mo><mi>r</mi><mo>)</mo><mo>=</mo><mi>D</mi><mrow><mo>[</mo><msup><mrow><mo>(</mo><mn>1</mn><mo>−</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>s</mi><mo>(</mo><mi>r</mi><mo>−</mo><mi>σ</mi><mo>)</mo><mo>/</mo><mi>σ</mi></mrow></msup><mo>)</mo></mrow><mn>2</mn></msup><mo>−</mo><mn>1</mn><mo>]</mo></mrow></math></div>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure>
      <svg class="fig" id="radeau" viewBox="0 0 640 300" role="img" data-i18n-attr="aria-label:rd.aria"></svg>
      <div class="legend"><span class="ring c-tint" data-i18n="rd.leg.bulle"></span><span class="el-o" data-i18n="rd.leg.defaut"></span><span class="ring c-label-2" data-i18n="rd.leg.tenue"></span></div>
      <div class="panel">

            <button type="button" data-m="parfait" data-i18n="rd.parfait"></button><button type="button" data-m="dislocation" data-i18n="rd.dislocation"></button><button type="button" data-m="grains" data-i18n="rd.grains"></button>
          </div>

          <div class="stat"><span class="k" data-i18n="rd.k.defauts"></span><span class="v" id="vdefauts"></span><span class="f" data-i18n="rd.f.defauts"></span></div>
          <div class="stat"><span class="k" data-i18n="rd.k.u"></span><span class="v" id="vu"></span><span class="f" data-i18n="rd.f.u"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/parcours.js"></script>

<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, X = Cristaux;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); return pick; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- radeau de bulles ---------- */
(() => {
  const NX = 24, NY = 12, svg = $("radeau"), svgF = $("force"), DU = 0.01;   // shear: DU bubble diameters per frame
  let mode = "parfait", s = 6, d = 1, st = null, haut = [], cis = false, u = 0, courbe = [], raf = 0;
  function depart() {
    d = X.radeauEquilibre(s);
    const L = (NX - 0.5) * d, H = (NY - 1) * d * Math.sqrt(3) / 2;
    let x = X.radeauTriangulaire(NX, NY, d);
    if (mode === "dislocation") x = X.radeauDislocation(x, L / 2 + 0.25 * d, H / 2 + d * Math.sqrt(3) / 4, d);
    if (mode === "grains") x = X.radeauPolycristal(L, H, d, [{ x: 0.2 * L, y: 0.5 * H, angle: 0 }, { x: 0.6 * L, y: 0.2 * H, angle: 0.35 }, { x: 0.75 * L, y: 0.8 * H, angle: -0.25 }]);
    const y0 = Math.min(...x.map(p => p[1])), y1 = Math.max(...x.map(p => p[1])), bande = 1.5 * d;
    haut = x.map(p => p[1] > y1 - bande);
    st = { x, fixe: x.map((p, i) => haut[i] || p[1] < y0 + bande) };
    st = X.radeauPas(st, s, mode === "parfait" ? 1 : 400);
    u = 0; courbe = [[0, 0]];
  }
  function dessin() {
    const xs = st.x.map(p => p[0]), ys = st.x.map(p => p[1]), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const U = Math.min(600 / (x1 - x0 + d), 280 / (y1 - y0 + d)), ox = 320 - U * (x0 + x1) / 2, oy = 150 + U * (y0 + y1) / 2;
    const def = new Set(X.defauts(st.x, 1.2 * d).map(q => q.i));
    svg.innerHTML = "";
    st.x.forEach((p, i) => P("circle", { cx: ox + U * p[0], cy: oy - U * p[1], r: 0.48 * U * d,
      class: def.has(i) ? "fill el-o" : "stroke thin " + (st.fixe[i] ? "c-label-2" : "c-tint") }, svg));
    $("vbulles").textContent = String(st.x.length);
    $("vdefauts").textContent = String(def.size);
    $("vu").textContent = F.fix(u / d, 2);
    svgF.innerHTML = "";
    const fs = courbe.map(c => c[1]), fmax = Math.max(10, ...fs), fmin = Math.min(-10, ...fs);
    const ax = Plot.axes(svgF, { fmt: F, w: 640, h: 220, x: { domain: [0, 4], label: t("rd.ax.u") }, y: { domain: [fmin * 1.1, fmax * 1.1], label: t("rd.ax.f") } });
    P("path", { d: Plot.path(courbe.filter(c => c[0] <= 4).map(([a, b]) => [ax.x(a), ax.y(b)])), class: "curve" }, svgF);
  }
  function pas() {
    if (cis && u < 4 * d) {
      st.x = st.x.map((p, i) => (haut[i] ? [p[0] + DU * d, p[1]] : p)); u += DU * d;
      st = X.radeauPas(st, s, 10);
      courbe.push([u / d, -st.forces.filter((_, i) => haut[i]).reduce((a, v) => a + v[0], 0)]);
    } else st = X.radeauPas(st, s, 4);
  }
  function boucle() { pas(); dessin(); raf = requestAnimationFrame(boucle); }
  function relance() {
    cancelAnimationFrame(raf); depart();
    if (reduce) { dessin(); return; }
    boucle();
  }
  $("cisaille").onclick = () => {
    cis = !cis; $("cisaille").setAttribute("aria-pressed", String(cis));
    if (reduce && cis) { while (u < 4 * d) pas(); dessin(); }
  };
  $("rs").oninput = () => { s = +$("rs").value; $("rsv").textContent = F.num(s, 3); relance(); };
  $("rsv").textContent = F.num(s, 3);
  seg($("depart"), "m", m => { mode = m; relance(); });
})();

/* ---------- ce que montrait le radeau ---------- */
(() => { const ids = ["largeur", "limite", "joints", "intrus"]; keyed($("obs"), t("obs.tag"), ids, textOf("obs.items", ids)); })();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bragg1942", 1942, "experiment"], ["braggnye", 1947, "experiment"], ["film", 1952, "experiment"], ["indentation", 2001, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["indentation", "simulation"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pourquoi", "c"], ["thermique", "a"], ["defaut", "d"], ["limite", "b"], ["taille", "c"], ["joint", "a"], ["diffusion", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
