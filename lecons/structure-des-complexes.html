<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), CS = ChimSolutions;
/* a formula is notation, the same in every language: it goes through the table only to be marked as such */
const fx = c => t("fx", { f: CS.ecrireComplexe(c) });

/* ---------- the complexes of the page: structure here, names and remarks in the table ---------- */
const P = [
  ["cr", "Cr", [["CO", 6]], 0, "oct"], ["fe5", "Fe", [["CO", 5]], 0, "bpt"], ["ni", "Ni", [["CO", 4]], 0, "tet"],
  ["v", "V", [["CO", 6]], 0, "oct"], ["co", "Co", [["NH3", 6]], 3, "oct"], ["coen", "Co", [["en", 3]], 3, "oct"],
  ["fe4", "Fe", [["CN", 6]], -4, "oct"], ["fe3", "Fe", [["CN", 6]], -3, "oct"], ["feaq", "Fe", [["H2O", 6]], 2, "oct", "haut"],
  ["ni2", "Ni", [["H2O", 6]], 2, "oct"], ["cu", "Cu", [["H2O", 6]], 2, "oct"], ["rh", "Rh", [["Cl", 1], ["PPh3", 3]], 0, "pc"],
  ["zeise", "Pt", [["Cl", 3], ["C2H4", 1]], -1, "pc"], ["cispt", "Pt", [["Cl", 2], ["NH3", 2]], 0, "pc"], ["fc", "Fe", [["C5H5", 2]], 0, "sandwich"],
].map(([id, m, L, z, geom, spin]) => ({ id, c: { m, L, z }, geom, spin: spin || "bas" }));
const NOMS = textOf("cx", P.map(p => p.id));

/* ---------- names ---------- */
$("noms").innerHTML = ["co", "fe4", "rh", "zeise", "cispt", "ni"].map(id => {
  const p = P.find(q => q.id === id);
  return `<div><span class="k">${fx(p.c)}</span><span>${NOMS[id].nom}</span><span class="v">${t("geom." + p.geom)}</span></div>`;
}).join("");

/* ---------- counter and orbital diagram, one state ---------- */
(() => {
  const sel = $("choix"), spin = $("spin"), svg = $("om");
  sel.innerHTML = P.map(p => `<option value="${p.id}">${fx(p.c)}</option>`).join("");
  sel.value = "co";
  /* electrons per orbital: one in each first, then the second (Hund) */
  const slots = (n, orb) => Array.from({ length: orb }, (_, i) => (n > i ? 1 : 0) + (n > orb + i ? 1 : 0));
  function diagram(p, r) {
    svg.innerHTML = "";
    if (p.geom !== "oct") {
      Plot.el("text", { x: 210, y: 150, "text-anchor": "middle" }, svg).textContent = t("om.hors", { g: t("geom." + p.geom) });
      $("omcap").innerHTML = t("om.caphors");
      return;
    }
    const haut = spin.checked, m = CS.ml6(r.d, !haut);
    const y = { li: 262, t2g: 168, eg: haut ? 128 : 78, anti: 30 }, w = 34, gap = 12;
    const row = (yy, n, x0, cls, fill, label) => {
      const s = slots(fill, n);
      for (let i = 0; i < n; i++) {
        const x = x0 + i * (w + gap);
        Plot.el("line", { x1: x, x2: x + w, y1: yy, y2: yy, class: "stroke bold " + cls }, svg);
        if (s[i] >= 1) Plot.el("text", { x: x + w / 2 - (s[i] === 2 ? 7 : 0), y: yy - 4, "text-anchor": "middle", class: "fill " + cls }, svg).textContent = "↑";
        if (s[i] === 2) Plot.el("text", { x: x + w / 2 + 7, y: yy - 4, "text-anchor": "middle", class: "fill " + cls }, svg).textContent = "↓";
      }
      Plot.el("text", { x: 300, y: yy + 4 }, svg).textContent = label;
    };
    row(y.anti, 4, 60, "c-label-2", 0, t("om.anti"));
    row(y.eg, 2, 106, m.eg ? "c-warn" : "c-label-2", m.eg, t("om.eg"));
    row(y.t2g, 3, 83, "c-tint", m.t2g, t("om.t2g"));
    row(y.li, 6, 14, "c-label-2", 12, t("om.li"));
    Plot.el("line", { x1: 40, x2: 40, y1: y.t2g, y2: y.eg, class: "stroke thin dash c-label-2" }, svg);
    Plot.el("text", { x: 46, y: (y.t2g + y.eg) / 2 + 4 }, svg).textContent = t("om.delta");
    $("omcap").innerHTML = t("om.cap", { li: 12, t: m.t2g, e: m.eg, n: m.celibataires, ne: r.Ne });
  }
  function upd() {
    const p = P.find(q => q.id === sel.value), r = CS.complexe(p.c);
    if (!spin.dataset.touched) spin.checked = p.spin === "haut";
    $("vx").textContent = r.x > 0 ? "+" + r.x : r.x < 0 ? "−" + -r.x : "0";
    $("vd").innerHTML = t("cpt.dn", { n: r.d });
    $("vne").textContent = r.Ne;
    $("fne").textContent = t(r.Ne === 18 ? "cpt.f.ne18" : r.Ne < 18 ? "cpt.f.neBas" : "cpt.f.neHaut", { e: Math.abs(18 - r.Ne) });
    $("vs").textContent = r.s;
    $("fs").textContent = t("geom." + p.geom);
    const lig = p.c.L.map(([id, k]) => { const l = CS.LIGANDS[id];
      return t("cpt.lig", { k, f: t("fx", { f: l.f }), type: t(l.q ? "cpt.X" : "cpt.L"), q: l.q ? F.num(k * l.q, 3) : "0", e: k * l.e }); }).join(" ; ");
    $("detail").innerHTML = `<div><span class="k">${t("cpt.ligands")}</span><span>${lig}</span></div>`
      + `<div><span class="k">${t("cpt.nom")}</span><span>${NOMS[p.id].nom}</span></div>`
      + `<div><span class="k">${t("cpt.note")}</span><span>${NOMS[p.id].note}</span></div>`;
    diagram(p, r);
  }
  sel.onchange = () => { delete spin.dataset.touched; upd(); };
  spin.onchange = () => { spin.dataset.touched = "1"; upd(); };
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["zeise", 1827, "experiment"], ["mond", 1890, "experiment"], ["werner", 1893, "idea"], ["king", 1911, "experiment"],
    ["langmuir", 1921, "idea"], ["ferrocene", 1951, "experiment"], ["dewar", 1953, "idea"], ["nobel1973", 1973, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["mond", "cisplatine", "hemoglobine"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["no", "c"], ["ne", "a"], ["seize", "d"], ["pourquoi", "b"], ["retro", "a"], ["alcene", "c"], ["spin", "b"], ["nom", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1827 });
})();
</script>
