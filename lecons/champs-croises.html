<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m);
const $ = id => document.getElementById(id);
const M = MagInd, P = Charge.PARTICULES, e = Constantes.e, C = Constantes.c, me = Constantes.m_e, mp = Constantes.m_p;
const E0 = 1e3, B0 = 1e-2, VD = E0 / B0;                      // the fields of the drawing: 1 kV/m up, 10 mT out of the screen

/* ---------- textes chiffrés : le système, les dérives de pesanteur, la coupure coaxiale ---------- */
(() => {
  const el = P.electron, h = M.hauteurCycloide(el.q, el.m, E0, B0), T = 2 * Math.PI * el.m / (e * B0);
  const pE = Charge.negligeables({ q: el.q, m: el.m, v: 0, E: E0 }).poidsE;
  $("sys").innerHTML = t("sys.body", { vd: F.si(VD, "m·s⁻¹"), h: F.si(h, "m"), T: F.si(T, "s"), rel: F.sci((2 * VD / C) ** 2, 1), pE: F.sci(pE, 1) });
  const g = [0, -9.81, 0], Bt = [0, 0, 3e-5];
  const vp = M.deriveForce(g.map(x => mp * x), e, Bt)[0], ve = M.deriveForce(g.map(x => me * x), -e, Bt)[0];
  $("s3p2").innerHTML = t("s3.p2", { vp: F.si(Math.abs(vp), "m·s⁻¹"), ve: F.si(Math.abs(ve), "m·s⁻¹") });
  $("val-hull").innerHTML = t("val.hull", { Bcyl: F.si(M.coupureHull({ m: me, q: -e, U: 4e3, ra: 0.01, rc: 0.003 }), "T") });
})();

/* ---------- cycloïde et trochoïdes ---------- */
(() => {
  const svg = $("cyc"), El = Plot.el, W = 640, H = 300, pad = { l: 64, r: 16, t: 12, b: 40 }, pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  let nom = "electron";
  function draw() {
    const p = P[nom], u = +$("cu").value, cr = Charge.croisees(p.q, p.m, E0, B0, [u * VD, 0, 0]), T = 2 * Math.PI / Math.abs(cr.w), N = 600;
    const pts = []; for (let i = 0; i <= N; i++) { const r = cr.pos(3 * T * i / N); pts.push([r[0], r[1]]); }
    const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const yc = ys.slice(0, 2 * N / 3).reduce((s, y) => s + y, 0) / (2 * N / 3);
    const s = Math.max((x1 - x0) / pw, (y1 - y0) / ph) * 1.08, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: W, h: H, pad, x: { domain: [cx - s * pw / 2, cx + s * pw / 2], label: t("fig.x") }, y: { domain: [cy - s * ph / 2, cy + s * ph / 2], label: t("fig.y") } });
    El("line", { x1: x(cx - s * pw / 2), x2: x(cx + s * pw / 2), y1: y(yc), y2: y(yc), class: "stroke thin c-label-2 dash" }, g);
    El("path", { d: Plot.path(pts.map(q => [x(q[0]), y(q[1])])), class: "stroke c-tint" }, g);
    const a = Math.abs(u - 1), forme = Math.abs(u - 1) < 1e-9 ? "droite" : Math.abs(a - 1) < 1e-9 ? "cycloide" : a > 1 ? "boucles" : "ondule";
    $("cuo").textContent = F.num(u, 3);
    $("vd").textContent = F.si(VD, "m·s⁻¹"); $("fforme").textContent = t("fig.forme." + forme);
    $("vmoy").textContent = F.si((cr.pos(3 * T)[0] - cr.pos(0)[0]) / (3 * T), "m·s⁻¹");
    $("vh").textContent = F.si(y1 - y0, "m");
    $("vT").textContent = F.si(T, "s");
  }
  document.querySelectorAll("[data-p]").forEach(btn => btn.onclick = () => {
    nom = btn.dataset.p; document.querySelectorAll("[data-p]").forEach(b => b.setAttribute("aria-pressed", String(b === btn))); draw();
  });
  $("cu").oninput = draw; draw();
})();
F.autoTypo(document.querySelector("main"));

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hull", 1921, "experiment"], ["randall", 1940, "experiment"], ["meteor", 1971, "use"]];
  const txt = textOf("hist.events", EVENTS.map(x => x[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const B = 0.02, re = me * Math.sqrt(2 * 10 * e / me) / (e * B), ri = 131.29 * Constantes.u * 15e3 / (e * B);
  const USES = ["four", "hall"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${fill(uses[id].text, { re: F.si(re, "m"), ri: F.si(ri, "m") })}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["memes", "a"], ["sens", "b"], ["vmax", "c"], ["wien", "d"], ["ecb", "a"], ["poids", "b"], ["hull", "c"], ["ions", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 298 });
})();
</script>
