<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polysubstitution, orientation et activation</title>
<link rel="stylesheet" href="/racoon/ds.css">
<style>
  .etapes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  .etapes svg { width: 180px; max-width: 30%; height: 190px; flex: none; }
  .etapes .mid { flex: none; }
  .duo { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .duo svg.mol { width: 220px; max-width: 100%; height: 220px; flex: none; }
  .duo .texte { flex: 1 1 260px; min-width: 0; }
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-organique" data-i18n="monde.chim-organique"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-aromatiques" data-i18n="etape.chim-aromatiques"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/substitution-electrophile-aromatique" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <figure>
      <div class="chart"><svg id="barres" role="img" data-i18n-attr="aria-label:fig.aria"></svg></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="groupe" data-i18n="fig.groupe"></label></div>
          <select id="groupe" class="no-sigle"></select></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="fig.effet"></span><span class="v" id="effet"></span><span class="f" id="effetf"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.krel"></span><span class="v" id="krel"></span><span class="f" id="krelf"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.facteurs"></span><span class="v" id="facteurs"></span><span class="f" id="facteursf"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><msub><mi>k</mi><mtext data-i18n="eq.rel"></mtext></msub><mo>=</mo><mfrac><mrow><mn>2</mn><msub><mi>f</mi><mi>o</mi></msub><mo>+</mo><mn>2</mn><msub><mi>f</mi><mi>m</mi></msub><mo>+</mo><msub><mi>f</mi><mi>p</mi></msub></mrow><mn>6</mn></mfrac></math></div>
    <p class="validite" data-i18n-html="s1.validite1"></p>
    <div class="eq"><math display="block"><msub><mi>x</mi><mi>p</mi></msub><mo>=</mo><mfrac><msub><mi>f</mi><mi>p</mi></msub><mrow><mn>2</mn><msub><mi>f</mi><mi>o</mi></msub><mo>+</mo><mn>2</mn><msub><mi>f</mi><mi>m</mi></msub><mo>+</mo><msub><mi>f</mi><mi>p</mi></msub></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="s1.validite2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure>
      <div class="etapes">
        <svg class="fig no-sigle" id="w0" role="img" data-i18n-attr="aria-label:w.aria"></svg>
        <span class="mid" data-i18n="w.fleche"></span>
        <svg class="fig no-sigle" id="w1" role="img" data-i18n-attr="aria-label:w.aria"></svg>
        <span class="mid" data-i18n="w.fleche"></span>
        <svg class="fig no-sigle" id="w2" role="img" data-i18n-attr="aria-label:w.aria"></svg>
      </div>
      <div class="panel">
        <div class="seg" role="group" id="attaque"><button type="button" data-a="1" aria-pressed="true" data-i18n="w.ortho"></button><button type="button" data-a="2" aria-pressed="false" data-i18n="w.meta"></button><button type="button" data-a="3" aria-pressed="false" data-i18n="w.para"></button></div>
        <p id="wlecture"></p>
      </div>
      <figcaption data-i18n-html="w.caption"></figcaption>
    </figure>
    <div class="list keyed" id="classes"></div>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure>
      <div class="duo">
        <svg class="fig no-sigle mol" id="poly" role="img" data-i18n-attr="aria-label:p.aria"></svg>
        <div class="texte"><p id="plecture"></p></div>
      </div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="g1" data-i18n="p.g1"></label></div><select id="g1" class="no-sigle"></select></div>
        <div class="ctl"><div class="row"><label for="g2" data-i18n="p.g2"></label></div><select id="g2" class="no-sigle"></select></div>
        <div class="seg" role="group" id="rel"><button type="button" data-p="1" aria-pressed="false" data-i18n="w.ortho"></button><button type="button" data-p="2" aria-pressed="false" data-i18n="w.meta"></button><button type="button" data-p="3" aria-pressed="true" data-i18n="w.para"></button></div>
      </div>
      <figcaption data-i18n-html="p.caption"></figcaption>
    </figure>
    <p data-i18n-html="s3.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/polysubstitution-aromatique.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/thermo.js"></script>
<script src="/racoon/statistique.js"></script>
<script src="/racoon/chim-organique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, G = O.GROUPES_AROMATIQUES, $ = id => document.getElementById(id), sym = s => t("chim.sym", { s });
const poser = (id, d) => { const svg = $(id); svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };
const pc = v => F.qty(F.num(v, 2), "%");

/* ---------- répartition mesurée contre statistique ---------- */
(() => {
  const ids = Object.keys(G).filter(id => G[id].nitration), sel = $("groupe");
  sel.innerHTML = ids.map(id => `<option value="${id}">${G[id].texte}</option>`).join(""); sel.value = "CH3";
  const svg = $("barres"), POS = ["o", "m", "p"], noms = textOf("fig.pos", POS), STAT = [40, 40, 20];
  function maj() {
    svg.innerHTML = "";
    const g0 = G[sel.value], rep = g0.nitration;
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 520, h: 260, pad: { b: 40, l: 56 }, x: { domain: [0, 3], ticks: 1, fmt: () => "" }, y: { domain: [0, 100], label: t("fig.y") } });
    POS.forEach((p, i) => {
      const x0 = x(i + 0.2), x1 = x(i + 0.8);
      Plot.el("rect", { x: x0, y: y(STAT[i]), width: x1 - x0, height: y(0) - y(STAT[i]), class: "ref" }, g);
      ["area", "curve"].forEach(c => Plot.el("rect", { x: x0 + 8, y: y(rep[i]), width: x1 - x0 - 16, height: Math.max(0, y(0) - y(rep[i])), class: c }, g));
      Plot.el("text", { x: (x0 + x1) / 2, y: y(0) + 18, "text-anchor": "middle", class: "tick" }, g).textContent = noms[p];
      Plot.el("text", { x: (x0 + x1) / 2, y: y(Math.max(rep[i], STAT[i])) - 6, "text-anchor": "middle", class: "note" }, g).textContent = pc(rep[i]);
    });
    $("effet").textContent = t("fig.effet." + g0.effet);
    $("effetf").textContent = t("fig.oriente." + g0.oriente);
    if (g0.krel) {
      const f = O.facteursPartiels(g0.krel, rep);
      $("krel").textContent = F.num(g0.krel, 2); $("krelf").textContent = t("fig.krelf");
      $("facteurs").textContent = t("fig.f", { o: F.num(f.o, 2), m: F.num(f.m, 2), p: F.num(f.p, 2) }); $("facteursf").textContent = t("fig.ff");
    } else { $("krel").textContent = "–"; $("krelf").textContent = t("fig.krel.non"); $("facteurs").textContent = "–"; $("facteursf").textContent = ""; }
  }
  sel.onchange = maj; maj();
})();

/* ---------- les formes mésomères selon la position d'attaque ---------- */
(() => {
  let a = 1;
  function maj() {
    const g0 = $("groupe").value, plus = O.positionsPlus(a);
    plus.forEach((p, k) => poser("w" + k, O.dessinArene({ subs: { 0: g0 }, wheland: { a, plus: p, E: "E", el: "Br" }, surligne: p === 0 ? [0] : [], texte: sym, echelle: 30 })));
    $("wlecture").textContent = t(plus.includes(0) ? "w.lecture.ipso" : "w.lecture.jamais", { g: G[g0].texte });
    document.querySelectorAll("#attaque button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.a === a)));
  }
  $("attaque").onclick = e => { const b = e.target.closest("button"); if (!b) return; a = +b.dataset.a; maj(); };
  $("groupe").addEventListener("change", maj); maj();
  const CL = ["mesomere", "alkyle", "halogene", "attracteur"], k = textOf("classes.k", CL), txt = textOf("classes.rows", CL);
  $("classes").innerHTML = CL.map(id => `<div><span class="k">${k[id]}</span><span>${txt[id]}</span></div>`).join("");
})();

/* ---------- deux groupes : où entre le troisième ---------- */
(() => {
  const ids = Object.keys(G), s1 = $("g1"), s2 = $("g2");
  [s1, s2].forEach(s => { s.innerHTML = ids.map(id => `<option value="${id}">${G[id].texte}</option>`).join(""); });
  s1.value = "CH3"; s2.value = "NO2";
  let p2 = 3;
  function maj() {
    const subs = { 0: s1.value }; subs[p2] = s2.value;
    const r = O.orienter(subs);
    poser("poly", O.dessinArene({ subs, surligne: r.positions, texte: sym, echelle: 32 }));
    const liste = r.positions.map(p => "C" + (p + 1)).join(", ");
    $("plecture").textContent = t(r.guide === null ? "p.lecture.accord" : "p.lecture.guide", { liste, g: G[subs[r.guide] || s1.value].texte });
    document.querySelectorAll("#rel button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.p === p2)));
  }
  $("rel").onclick = e => { const b = e.target.closest("button"); if (!b) return; p2 = +b.dataset.p; maj(); };
  s1.onchange = s2.onchange = maj; maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["haussermann", 1891, "experiment"], ["holleman", 1910, "idea"], ["wheland", 1935, "idea"], ["hammett", 1937, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tnt", "synthese"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["stat", "c"], ["toluene", "a"], ["oh", "d"], ["halogene", "b"], ["nitro", "a"], ["deux", "c"], ["coince", "b"], ["ordre", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1910 });
})();
</script>
</body>
</html>
