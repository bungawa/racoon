<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux, K = Constantes;

/* the system of the page: one electron, resonance at 100 nm (ultraviolet), lit by a beam of 1 kW·m⁻² */
const W0 = 2 * Math.PI * K.c / 100e-9, I0 = 1000, E0 = Math.sqrt(2 * I0 / (K.eps0 * K.c));

/* ---------- le système décrit ---------- */
(() => {
  const w = 2 * Math.PI * K.c / 500e-9, d = OM.deplacement(E0, w, { w0: W0, gamma: 0.01 * W0 });
  const Eat = K.e / (4 * Math.PI * K.eps0 * K.a0 ** 2);
  $("sys1").innerHTML = t("sys1.body", { I: F.si(I0, "W·m⁻²"), E: F.si(E0, "V·m⁻¹"), Eat: F.qty(F.sci(Eat, 2), "V·m⁻¹"), r: F.sci(E0 / Eat, 2),
    x: F.qty(F.sci(d.module, 2), "m"), xa: F.sci(d.module / K.a0, 2), w: F.sci(w / W0, 2), b: F.sci((w * d.module / K.c), 2) });
})();

/* ---------- α(ω) : partie réelle, partie imaginaire, retard ---------- */
(() => {
  const trace = $("trace"), sw = $("sw"), sg = $("sg");
  const a0 = OM.polarisabiliteAtome(0, [{ w0: W0 }]).re;                              // static polarizability, the unit of the plot
  function draw() {
    const r = +sw.value / 100, g = +sg.value / 100, mode = { w0: W0, gamma: g * W0 };
    const ys = 1.15 / g, xs = Array.from({ length: 601 }, (_, i) => i * 3 / 600);
    const al = xs.map(x => OM.polarisabiliteAtome(x * W0, [mode]));
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, 3], label: t("fig.xaxis") }, y: { domain: [-0.6 * ys, ys], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(3), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x), P.y(Math.max(-0.6 * ys, al[i].re / a0))])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x), P.y(Math.min(ys, -al[i].im / a0))])), class: "stroke c-warn" }, P.g);
    const a = OM.polarisabiliteAtome(r * W0, [mode]), d = OM.deplacement(E0, r * W0, mode);
    Plot.el("line", { x1: P.x(r), x2: P.x(r), y1: P.y(-0.6 * ys), y2: P.y(ys), class: "ref" }, P.g);
    Plot.el("circle", { cx: P.x(r), cy: P.y(Math.max(-0.6 * ys, a.re / a0)), r: 5, class: "dot" }, P.g);
    $("swr").textContent = F.num(r, 3);
    $("sgr").textContent = F.num(g, 2);
    $("vret").textContent = F.qty(F.num(d.retard * 180 / Math.PI, 3), "°");
    $("fret").textContent = t("fig.f.retard", { T: F.si(r > 0 ? d.retard / (r * W0) : 0, "s", { prefix: "f" }) });
    $("valpha").textContent = F.qty(F.sci(Math.hypot(a.re, a.im), 3), "m³");
    $("falpha").textContent = t("fig.f.alpha", { re: F.num(a.re / a0, 3), im: F.num(-a.im / a0, 3) });
    $("vx").textContent = F.qty(F.sci(d.module, 2), "m");
    $("fx").textContent = t("fig.f.x", { r: F.sci(d.module / K.a0, 2) });
  }
  sw.oninput = sg.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["sellmeier", 1872, "idea"], ["ladenburg", 1921, "idea"], ["kramers", 1924, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["verres"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ressort", "c"], ["retard", "a"], ["dessus", "d"], ["imag", "b"], ["lineaire", "a"], ["somme", "c"], ["statique", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 321 });
})();
</script>
