<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const C = ChimArchi;

/* ---------- A ⇌ I → P : solution, AEQS, pré-équilibre, raideur ---------- */
(() => {
  const svg = $("meca"), sr2 = $("r2"), srm = $("rm1"), sinv = $("inverse"), K1 = 0.01, PAS_MAX = 200000;
  const rat = v => F.num(Math.pow(10, v), 2);
  function draw() {
    const k2 = K1 * Math.pow(10, +sr2.value), km1 = sinv.checked ? K1 * Math.pow(10, +srm.value) : 0, o = { k1: K1, km1, k2, a0: 1 };
    srm.disabled = !sinv.checked;
    const lent = C.raideur(o, 1).lent, duree = 5 / lent, r = C.raideur(o, duree);
    svg.innerHTML = "";
    const g = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 },
      x: { domain: [0, duree], label: t("sim.x") }, y: { domain: [-0.1, 1], label: t("sim.y") } });
    const N = 240, ts = Array.from({ length: N + 1 }, (_, i) => duree * i / N);
    const courbe = (f, cls) => Plot.el("path", { d: Plot.path(ts.map(x => [g.x(x), g.y(Math.min(Math.max(f(x), -0.1), 1))])), class: cls }, g.g);
    const ex = ts.map(x => C.mecanismeExact(o, x)), at = x => ex[Math.round(x / duree * N)];
    courbe(x => at(x).A, "stroke bold c-tint"); courbe(x => at(x).I, "stroke bold c-warn"); courbe(x => at(x).P, "stroke bold c-ok");
    courbe(x => C.aeqs(o, x).P, "stroke dash c-label");
    if (km1 > 0) courbe(x => C.preEquilibre(o, x).P, "stroke dash c-ko");
    $("r2v").textContent = rat(+sr2.value); $("rm1v").textContent = sinv.checked ? rat(+srm.value) : "0";
    $("vaeqs").textContent = F.qty(F.num(100 * C.ecartApprox(o, C.aeqs, duree, 300), 2), "%");
    $("vpre").textContent = km1 > 0 ? F.qty(F.num(100 * C.ecartApprox(o, C.preEquilibre, duree, 300), 2), "%") : "—";
    $("vrapport").textContent = F.num(r.rapport, 3);
    if (r.pas * 10 <= PAS_MAX) {
      const pas = Math.ceil(r.pas * 10), m = C.mecanisme(Object.assign({ duree, pas }, o));
      const e = Math.max(...[0.25, 0.5, 1].map(f => { const i = Math.round(f * pas); return Math.abs(m.P[i] - C.mecanismeExact(o, m.t[i]).P); }));
      $("vrk").textContent = F.num(pas, 6); $("frk").textContent = t("sim.f.rk", { e: F.sci(e, 1) });
    } else { $("vrk").textContent = F.sci(r.pas, 2); $("frk").textContent = t("sim.f.rktrop"); }
  }
  sr2.oninput = draw; srm.oninput = draw; sinv.onchange = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bodenstein", 1913, "idea"], ["chp", 1919, "idea"], ["lindemann", 1921, "idea"], ["chapman", 1930, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ozone", "raideur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["molecularite", "d"], ["equilibre", "a"], ["aeqs", "c"], ["lente", "b"], ["pre", "a"], ["pression", "d"], ["induction", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 709 });
})();
</script>
