<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- ce que le modèle néglige ---------- */
(() => { const IDS = ["frottement", "masse", "lineaire", "point"]; keyed($("neglect"), t("neglect.tag"), IDS, textOf("neglect.items", IDS)); })();

/* ---------- le ressort : deux nombres de départ, une courbe ---------- */
(() => {
  const K = 10, EPS = 0.02, TMAX = 3, svg = $("lab"), x0s = $("x0"), v0s = $("v0"), ms = $("ms");
  const len = x => F.qty(F.num(x, 3), "m");
  function draw() {
    const m = +ms.value, w = Math.sqrt(K / m), S = Integ.spring(w), s0 = { t: 0, x: [x0s.value / 100], v: [v0s.value / 100] };
    const A = Math.hypot(s0.x[0], s0.v[0] / w), lim = Math.max(5, Math.ceil(A * 100 / 5) * 5) / 100;
    svg.innerHTML = "";
    const { x: X, y: Y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [0, TMAX], label: t("lab.xaxis") }, y: { domain: [-lim, lim], label: t("lab.yaxis") } });
    Plot.el("line", { x1: X(0), x2: X(TMAX), y1: Y(0), y2: Y(0), class: "zero" }, g);
    let d = ""; for (let i = 0; i <= 300; i++) { const tt = TMAX * i / 300; d += (i ? "L" : "M") + X(tt).toFixed(1) + " " + Y(S.exact(s0, tt).x[0]).toFixed(1); }
    Plot.el("path", { d, class: "curve" }, g);
    const r = Integ.run("euler", S.a, s0, EPS, 40);
    const clip = Plot.el("clipPath", { id: "labarea" }, svg); Plot.el("rect", { x: X(0), y: Y(lim), width: X(TMAX) - X(0), height: Y(-lim) - Y(lim) }, clip);
    Plot.el("path", { "clip-path": "url(#labarea)", d: r.t.map((tt, k) => (k ? "L" : "M") + X(tt).toFixed(1) + " " + Y(r.x[k][0]).toFixed(1)).join(""), class: "ref" }, g);
    $("x0read").textContent = len(s0.x[0]); $("v0read").textContent = F.qty(F.num(s0.v[0], 2), "m·s⁻¹"); $("mread").textContent = F.qty(F.num(m, 2), "kg");
    $("vw").textContent = F.qty(F.num(w, 3), "rad·s⁻¹"); $("vT").textContent = F.qty(F.num(2 * Math.PI / w, 3), "s");
    $("vA").textContent = len(A); $("vE").textContent = F.si((m * s0.v[0] ** 2 + K * s0.x[0] ** 2) / 2, "J", { sig: 3 });
    const row = (cells, role) => `<div role="row">${cells.map((c, i) => `<span class="${i ? "v" : ""}" role="${role}">${c}</span>`).join("")}</div>`;
    $("steps").innerHTML = row(["t", "x", "v", "a"].map(k => t("steps.head." + k)), "columnheader") +
      r.t.slice(0, 5).map((tt, k) => row([F.qty(F.fix(tt, 2), "s"), F.qty(F.fix(r.x[k][0], 4), "m"), F.qty(F.fix(r.v[k][0], 3), "m·s⁻¹"), F.qty(F.fix(S.a(tt, r.x[k])[0], 2), "m·s⁻²")], "cell")).join("");
  }
  x0s.oninput = v0s.oninput = ms.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hooke", 1678, "idea"], ["newton", 1687, "idea"], ["laplace", 1814, "idea"], ["poincare", 1899, "idea"], ["lorenz", 1963, "experiment"], ["ensemble", 1992, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["meteo", "accelero"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["locale", "a"], ["deux", "a"], ["croisement", "a"], ["periode", "a"], ["pas", "a"], ["ressort", "a"], ["meteo", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 95 });
})();
</script>
