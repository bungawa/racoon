<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd;
const NA_LAMBDA = 589e-9, NA_TAU = 16.2e-9;                    // sodium D line, measured lifetime of the 3p level

/* ---------- durée de vie classique en fonction de λ, puis la raie avec des collisions ---------- */
(() => {
  const sd = $("duree"), sr = $("raie"), sl = $("sl"), sg = $("sg");
  function draw() {
    const lambda = 10 ** +sl.value, gc = 10 ** +sg.value, A = O.amortissement(lambda), gt = A.gamma + gc;
    /* the classical lifetime τ = 1/γ ∝ λ² */
    sd.innerHTML = "";
    const P = Plot.axes(sd, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 40 }, x: { scale: "log", domain: [1e-8, 1e-5], label: t("fig.xaxis.l") }, y: { scale: "log", domain: [1e-12, 1e-5], label: t("fig.yaxis.tau") } });
    const ls = Array.from({ length: 61 }, (_, i) => 10 ** (-8 + i * 3 / 60));
    Plot.el("path", { d: Plot.path(ls.map(l => [P.x(l), P.y(O.amortissement(l).tau)])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(NA_LAMBDA), cy: P.y(NA_TAU), r: 6, class: "stroke c-warn" }, P.g);
    Plot.el("circle", { cx: P.x(lambda), cy: P.y(A.tau), r: 5, class: "dot" }, P.g);
    /* the line: radiation alone, then radiation + collisions, against the frequency offset */
    sr.innerHTML = "";
    const X = 4 * gt / (2 * Math.PI) / 1e6, xs = Array.from({ length: 401 }, (_, i) => -X + i * X / 200);
    const Q = Plot.axes(sr, { fmt: F, w: 640, h: 200, pad: { l: 56, b: 40 }, x: { domain: [-X, X], label: t("fig.xaxis.nu") }, y: { domain: [0, 1.05], label: t("fig.yaxis.raie") } });
    const prof = g => xs.map(u => [Q.x(u), Q.y(O.lorentz(2 * Math.PI * u * 1e6, g) * A.gamma / g)]);
    Plot.el("path", { d: Plot.path(prof(A.gamma)), class: "ref" }, Q.g);
    Plot.el("path", { d: Plot.path(prof(gt)), class: "curve" }, Q.g);
    $("slr").textContent = F.si(lambda, "m");
    $("sgr").textContent = F.qty(F.sci(gc, 2), "s⁻¹");
    $("vq").textContent = F.sci(A.Q, 3);
    $("fq").textContent = t("fig.f.q", { n: F.sci(A.oscillations, 2), qt: F.sci(A.w0 / gt, 2) });
    $("vtau").textContent = F.si(A.tau, "s");
    $("ftau").textContent = t("fig.f.tau", { d: F.si(A.dnu, "Hz"), r: F.num(gc / A.gamma, 2) });
    $("vdl").textContent = F.si(A.dlambda, "m");
    $("fdl").textContent = t("fig.f.dl", { t: F.si(lambda / (A.w0 / gt), "m"), x: F.sci(A.dlambda / lambda, 2) });
  }
  sl.oninput = sg.oninput = draw; draw();
})();

/* ---------- le système décrit : une vapeur de sodium ---------- */
(() => {
  const A = O.amortissement(NA_LAMBDA), T = 500, m = 22.98977 * Constantes.u, nu0 = O.c / NA_LAMBDA;
  const doppler = nu0 * Math.sqrt(8 * Constantes.k_B * T * Math.LN2 / (m * O.c * O.c));
  $("sys1").innerHTML = t("sys1.body", { q: F.sci(A.Q, 2), iq: F.sci(1 / A.Q, 2), tau: F.num(A.tau * 1e9, 3), ecart: F.num(100 * Math.abs(A.tau / NA_TAU - 1), 2),
    d: F.si(A.dnu, "Hz"), dop: F.si(doppler, "Hz"), rd: F.num(doppler / A.dnu, 2), T: F.kelvin(T) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lorentz", 1892, "idea"], ["planck", 1897, "idea"], ["weisskopf", 1930, "idea"], ["dirac", 1938, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["etoile", "largeur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["radians", "c"], ["double", "a"], ["largeur", "d"], ["rayon", "b"], ["oscillations", "c"], ["collisions", "a"], ["amplitude", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 323 });
})();
</script>
