<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, eR = Q.ER / Constantes.e, HE = -79.005;   // eV, measured ground state of helium (both electrons removed)
$("sys1").innerHTML = t("sys.body", { m: F.num(Constantes.m_e / (4 * Constantes.m_p), 2) });
(() => {
  const svg = $("var"), sq = $("sq");
  const MODES = {
    expo: { dom: [0.3, 3], y: [-16, 10], f: q => Q.energieEssaiExpo(q) * eR, exact: -eR, best: 1, nom: "b/a₀" },
    gauss: { dom: [0.05, 1.5], y: [-16, 10], f: q => Q.energieEssaiGauss(q) * eR, exact: -eR, best: 8 / (9 * Math.PI), nom: "a" },
    he: { dom: [1, 2.5], y: [-82, -60], f: q => Q.energieHeliumEssai(q) * eR, exact: HE, best: 27 / 16, nom: "Z" },
  };
  let mode = "expo";
  function draw() {
    const M = MODES[mode], q = M.dom[0] + (M.dom[1] - M.dom[0]) * +sq.value / 1000;
    svg.replaceChildren();
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: M.dom, label: t("fig.x." + mode) }, y: { domain: M.y, label: t("fig.y") } });
    const P = []; for (let i = 0; i <= 300; i++) { const u = M.dom[0] + (M.dom[1] - M.dom[0]) * i / 300; P.push([x(u), y(Math.min(M.y[1], Math.max(M.y[0], M.f(u))))]); }
    Plot.el("line", { x1: x(M.dom[0]), x2: x(M.dom[1]), y1: y(M.exact), y2: y(M.exact), class: "stroke thin dash c-warn" }, g);
    Plot.el("path", { d: Plot.path(P), class: "stroke c-tint" }, g);
    Plot.el("circle", { cx: x(q), cy: y(Math.min(M.y[1], Math.max(M.y[0], M.f(q)))), r: 5, class: "dot c-label-2" }, g);
    const E = M.f(q), Eb = M.f(M.best);
    $("sqr").textContent = M.nom + " = " + F.num(q, 3);
    $("ve").textContent = F.qty(F.num(E, 4), "eV");
    $("fe").textContent = t("fig.f.e", { d: F.qty(F.num(E - M.exact, 3), "eV") });
    $("vn").textContent = F.qty(F.num(Eb, 4), "eV");
    $("fn").textContent = t("fig.f.min." + mode, { q: F.num(M.best, 4) });
    $("vx").textContent = F.qty(F.num(100 * (Eb - M.exact) / Math.abs(M.exact), 2), "%");
    $("fx").textContent = t("fig.f.ecart." + mode);
    $("mode").querySelectorAll("button").forEach(e => e.setAttribute("aria-pressed", String(e.dataset.m === mode)));
  }
  $("mode").querySelectorAll("button").forEach(e => e.onclick = () => { mode = e.dataset.m; draw(); });
  sq.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rayleigh", 1877, "idea"], ["ritz", 1909, "idea"], ["hylleraas", 1929, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["chimie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["integrale", "b"], ["principe", "c"], ["second", "b"], ["gauss", "d"], ["zeff", "a"], ["he", "b"], ["norme", "c"], ["bexact", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 203 });
})();
</script>
