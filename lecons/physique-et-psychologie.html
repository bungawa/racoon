<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const $ = id => document.getElementById(id);
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));

/* ---------- §3-6 : durée de parcours d'un influx nerveux ---------- */
(() => {
  const V = Voisines, WIRE = 2e8;                                        // signal dans un câble, m·s⁻¹ (ordre de grandeur)
  const FIBRES = { fc: 1, fd: 15, fa: 60 };                              // vitesses typiques, m·s⁻¹
  let f = "fa";
  const sl = $("lsl");
  const upd = () => {
    const L = sl.value / 100, v = FIBRES[f], tau = V.conduction(L, v);
    $("lread").textContent = F.si(L, "m", { prefix: "" });
    $("vv").textContent = F.si(v, "m·s⁻¹", { prefix: "" });
    $("fv").textContent = t("nerf.f." + f);
    $("vtau").textContent = F.si(tau, "s");
    $("ftau").textContent = t(tau > 0.1 ? "stat.tau.lent" : "stat.tau.vif");
    $("vfil").textContent = F.si(V.conduction(L, WIRE), "s");
  };
  const pick = id => { f = id; Object.keys(FIBRES).forEach(k => $(k).setAttribute("aria-pressed", String(k === id))); upd(); };
  Object.keys(FIBRES).forEach(k => { $(k).onclick = () => pick(k); });
  sl.oninput = upd; upd();
})();

/* ---------- §3-6 : mesurer sa propre fraction de Weber sur des longueurs ---------- */
(() => {
  const V = Voisines, svg = $("pair");
  const la = Plot.el("line", { class: "stroke bold c-label" }, svg), lb = Plot.el("line", { class: "stroke bold c-label" }, svg);
  const mark = Plot.el("text", { x: 320, y: 132, "text-anchor": "middle" }, svg);
  let rand, s, cur, last = null;
  const draw = () => {
    cur = V.trial(rand, s.delta, 100, 160);
    const [j1, j2] = cur.jitter, ya = 50 + 40 * j2, yb = 90 - 40 * j1;
    const xa = 20 + 40 * j1, xb = 340 + 40 * j2;
    la.setAttribute("x1", xa); la.setAttribute("x2", xa + cur.gauche); la.setAttribute("y1", ya); la.setAttribute("y2", ya);
    lb.setAttribute("x1", xb); lb.setAttribute("x2", xb + cur.droite); lb.setAttribute("y1", yb); lb.setAttribute("y2", yb);
    mark.textContent = last == null ? t("weber.go") : t(last ? "weber.ok" : "weber.ko");
    $("vessais").textContent = F.num(s.trials, 3);
    $("fessais").textContent = t("stat.essais.f", { p: s.trials ? F.num(100 * s.correct / s.trials, 2) : "0" });
    $("vecart").textContent = F.qty(F.num(100 * s.delta, 2), "%");
    $("fecart").textContent = t("stat.ecart.f", { r: F.num(s.reversals.length, 2) });
    const k = V.estimate(s);
    $("vk").textContent = k == null ? t("stat.k.none") : F.qty(F.num(100 * k, 2), "%");
    $("fk").textContent = t(k == null ? "stat.k.wait" : "stat.k.f");
  };
  const reset = () => { rand = V.rng(Date.now() & 0x7fffffff); s = V.staircase({ start: 0.2, factor: 1.25, keep: 8 }); last = null; draw(); };
  const say = side => { last = side === cur.side; s = V.answer(s, last); draw(); };
  $("gauche").onclick = () => say("gauche"); $("droite").onclick = () => say("droite"); $("reset").onclick = reset;
  reset();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["galvani", 1791, "experiment"], ["weber", 1834, "experiment"], ["helmholtz", 1850, "experiment"], ["fechner", 1860, "idea"],
    ["hodgkin", 1952, "idea"], ["stevens", 1957, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["conduction", "audio"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["vitesse", "a"], ["myeline", "a"], ["weber", "a"], ["fechner", "a"], ["decibel", "a"], ["limite", "a"], ["escalier", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
