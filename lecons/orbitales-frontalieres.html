    <div class="eq"><math display="block"><mi>Δ</mi><mi>E</mi><mo>≈</mo><mfrac><mrow><mn>2</mn><msup><mi>β</mi><mn>2</mn></msup></mrow><mrow><msub><mi>E</mi><mi data-i18n="eq.bv"></mi></msub><mo>−</mo><msub><mi>E</mi><mi data-i18n="eq.ho"></mi></msub></mrow></mfrac><mo>,</mo><mspace width="1em"/><mi>β</mi><mo>∝</mo><mi>S</mi></math></div>

      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="eho" data-i18n="gst.ho"></label><output id="ehor" for="eho"></output></div>

          <div class="ctl"><div class="row"><label for="ebv" data-i18n="gst.bv"></label><output id="ebvr" for="ebv"></output></div>
            <input id="ebv" type="range" min="-4" max="2" step="0.1" value="0"></div>
          <div class="ctl"><div class="row"><label for="bb" data-i18n="gst.b"></label><output id="bbr" for="bb"></output></div>
            <input id="bb" type="range" min="0.2" max="3" step="0.05" value="1.5"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="gst.k.gap"></span><span class="v" id="vg"></span></div>
          <div class="stat"><span class="k" data-i18n="gst.k.pert"></span><span class="v" id="vp"></span></div>
          <div class="stat"><span class="k" data-i18n="gst.k.exact"></span><span class="v" id="vx"></span><span class="f" id="fx"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), CA = ChimArchi;

/* ---------- stabilisation HO–BV : second ordre contre calcul à deux orbitales ---------- */
(() => {
  const svg = $("gst"), eho = $("eho"), ebv = $("ebv"), bb = $("bb"), D0 = 2, D1 = 16;
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { domain: [D0, D1], label: t("gst.x") }, y: { domain: [0, 4], label: t("gst.y") } });
  const pert = Plot.el("path", { class: "curve" }, g), exact = Plot.el("path", { class: "ref" }, g), dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  function upd() {
    const H = +eho.value, B = +ebv.value, b = -(+bb.value), D = B - H, N = 120, xs = Array.from({ length: N + 1 }, (_, i) => D0 + (D1 - D0) * i / N);
    pert.setAttribute("d", Plot.path(xs.map(d => [x(d), y(Math.min(CA.stabilisationFrontiere(0, d, b), 4))])));
    exact.setAttribute("d", Plot.path(xs.map(d => [x(d), y(Math.min(CA.frontiereExacte(0, d, b), 4))])));
    const p = CA.stabilisationFrontiere(H, B, b), e = CA.frontiereExacte(H, B, b);
    dot.setAttribute("cx", x(Math.min(Math.max(D, D0), D1))); dot.setAttribute("cy", y(Math.min(p, 4)));
    $("ehor").textContent = F.si(H, "eV"); $("ebvr").textContent = F.si(B, "eV"); $("bbr").textContent = F.si(b, "eV");
    $("vg").textContent = F.si(D, "eV");
    $("vp").textContent = F.si(p, "eV", { sig: 3 });
    $("vx").textContent = F.si(e, "eV", { sig: 3 });
    $("fx").textContent = t("gst.f.ecart", { r: F.num(100 * (p / e - 1), 2) });
  }
  eho.oninput = ebv.oninput = bb.oninput = upd; upd();
})();

/* ---------- le groupe carbonyle : π et π* de C 2p + O 2p ---------- */
(() => {
  const aC = CA.ORBITALES_EV.C["2p"], aO = CA.ORBITALES_EV.O["2p"], svg = $("dia"), ss = $("ss");
  function upd() {
    const S = +ss.value, r = CA.interactionDeux(aC, aO, CA.wolfsbergHelmholz(aC, aO, S), S);
    svg.innerHTML = "";
    DiagOrb.rendre(DiagOrb.deuxNiveaux({ a1: aC, a2: aO, r, E: [-24, -2], fmt: e => F.si(e, "eV", { sig: 3 }),
      noms: [t("dia.c"), t("dia.o"), t("dia.pi"), t("dia.pis")] }), Plot.el, svg);
    $("ssr").textContent = F.fix(S, 2);
    $("vpi").textContent = t("dia.v.coef", { c: F.fix(r.liante.c[0], 2), o: F.fix(r.liante.c[1], 2) });
    $("vps").textContent = t("dia.v.coef", { c: F.fix(r.antiliante.c[0], 2), o: F.fix(r.antiliante.c[1], 2) });
    $("fps").textContent = t("dia.f.rapport", { r: F.num(Math.abs(r.antiliante.c[0] / r.antiliante.c[1]), 2) });
  }
  ss.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fukui", 1952, "idea"], ["woodward", 1965, "idea"], ["burgi", 1973, "experiment"], ["nobel", 1981, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["synthese", "electronique"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["paire", "a"], ["nucleophile", "c"], ["site", "b"], ["gap", "d"], ["sn2", "a"], ["electrophile", "b"], ["limite", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2104 });
})();
</script>
