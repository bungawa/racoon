<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes;
const deg = r => F.num(r * 180 / Math.PI, 3) + "°";

/* ---------- apply σ operators to a spin state: each one turns the spin by 180° about its axis ---------- */
(() => {
  const svg = $("vue"), sT = $("sT"), sP = $("sP"), ops = $("ops"), R = 110, C1 = [160, 150], C2 = [480, 150];
  let suite = [];
  const fleche = (c, a, b, cls) => {                       // a, b: the two components shown on this disc
    Plot.el("line", { x1: c[0], y1: c[1], x2: c[0] + R * a, y2: c[1] - R * b, class: cls }, svg);
    Plot.el("circle", { cx: c[0] + R * a, cy: c[1] - R * b, r: 5, class: "fill " + cls.split(" ").pop() }, svg);
  };
  function draw() {
    const th = +sT.value * Math.PI / 180, ph = +sP.value * Math.PI / 180, psi0 = Q.etatSpinDemi(th, ph);
    let psi = psi0;
    for (const k of suite) psi = Q.appliquer(Q.pauli[k], psi);
    const m0 = Q.moyenneSigma(psi0), m = Q.moyenneSigma(psi);
    svg.innerHTML = "";
    for (const c of [C1, C2]) {
      Plot.el("circle", { cx: c[0], cy: c[1], r: R, class: "stroke thin c-label-2" }, svg);
      Plot.el("line", { x1: c[0] - R, x2: c[0] + R, y1: c[1], y2: c[1], class: "stroke thin dash c-label-2" }, svg);
      Plot.el("line", { x1: c[0], x2: c[0], y1: c[1] - R, y2: c[1] + R, class: "stroke thin dash c-label-2" }, svg);
    }
    fleche(C1, m0[0], m0[1], "stroke dash c-label-2"); fleche(C2, m0[0], m0[2], "stroke dash c-label-2");
    fleche(C1, m[0], m[1], "stroke bold c-ok"); fleche(C2, m[0], m[2], "stroke bold c-ok");
    $("sTr").textContent = deg(th); $("sPr").textContent = deg(ph);
    $("vs").textContent = suite.length ? t("fig.v.suite", { n: F.num(suite.length, 2) }) : t("fig.v.aucune");
    $("fs").textContent = suite.length ? t("fig.f.suite", { s: suite.slice().reverse().map(k => t("fig.nom." + k)).join(" ") }) : "";
    $("va").textContent = F.fix(Cx.abs(psi[0]), 3) + " ; " + F.fix(Cx.abs(psi[1]), 3);
    const dphi = Cx.abs(psi[0]) > 1e-9 && Cx.abs(psi[1]) > 1e-9 ? Cx.wrap(Cx.arg(psi[1]) - Cx.arg(psi[0])) : 0;
    $("fa").textContent = t("fig.f.amp", { d: deg(dphi) });
    $("vg").textContent = "(" + m.map(x => F.fix(Math.abs(x) < 5e-13 ? 0 : x, 2)).join(" ; ") + ")";
    $("fg").textContent = t("fig.f.sigma", { n: F.fix(Math.hypot(...m), 3) });
  }
  ops.querySelectorAll("button").forEach(b => b.onclick = () => { if (b.dataset.op === "0") suite = []; else suite.push(b.dataset.op); draw(); });
  sT.oninput = sP.oninput = draw; draw();
})();

/* ---------- the system described: how long a field must act to do what σx does ---------- */
(() => {
  const B = 1e-3, w = 2 * K.mu_B * B / K.hbar, tpi = Math.PI / w;
  $("sys1").innerHTML = t("sys1.body", { B: F.si(B, "T"), w: F.si(w, "rad·s⁻¹"), t: F.si(tpi, "s") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["heis", 1925, "idea"], ["bj", 1925, "idea"], ["vn", 1932, "idea"], ["dirac", 1939, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["circuits", "impulsion"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ordre", "a"], ["moins", "c"], ["deux", "b"], ["direction", "d"], ["retour", "a"], ["base", "c"], ["ombre", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1102 });
})();
</script>
