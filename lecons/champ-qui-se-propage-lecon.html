  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><msub><mi>E</mi><mi>y</mi></msub><mo>(</mo><mi>x</mi><mo>,</mo><mi>t</mi><mo>)</mo><mo>=</mo><mo>−</mo><mfrac><mrow><mi>J</mi><mo>(</mo><mi>t</mi><mo>−</mo><mo>|</mo><mi>x</mi><mo>|</mo><mo>/</mo><mi>c</mi><mo>)</mo></mrow><mrow><mn>2</mn><msub><mi>ε</mi><mn>0</mn></msub><mi>c</mi></mrow></mfrac><mo>,</mo><mspace width="1em"/><msub><mi>B</mi><mi>z</mi></msub><mo>=</mo><mo>±</mo><mfrac><msub><mi>E</mi><mi>y</mi></msub><mi>c</mi></mfrac></math></div>

          <div class="ctl"><div class="row"><label for="sT" data-i18n="fig.T"></label><output id="sTr" for="sT"></output></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>

<script src="/racoon/ondes-milieux.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OndesMilieux, c = Constantes.c;
const J0 = 1, E0 = O.nappeChamps(J0).E, B0 = O.nappeChamps(J0).B;            // a sheet of 1 A·m⁻¹: 188 V·m⁻¹, 0,63 µT

/* ---------- une autre vitesse ? chaque loi exige son propre E ---------- */
(() => {
  const svg = $("vitesse"), sv = $("sv");
  const vs = Array.from({ length: 121 }, (_, i) => Math.pow(10, -0.6 + i * 0.01));
  function draw() {
    const r = Math.pow(10, +sv.value), f = O.conditionsFront(r * c, B0);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 64, b: 44 }, x: { scale: "log", domain: [0.25, 4], label: t("fv.xaxis"), fmt: v => F.num(v, 2) },
      y: { scale: "log", domain: [40, 1000], label: t("fv.yaxis"), fmt: v => F.num(v, 3) } });
    Plot.el("path", { d: Plot.path(vs.map(u => [P.x(u), P.y(O.conditionsFront(u * c, B0).faraday)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(vs.map(u => [P.x(u), P.y(O.conditionsFront(u * c, B0).ampere)])), class: "stroke c-warn" }, P.g);
    Plot.el("line", { x1: P.x(r), x2: P.x(r), y1: P.y(40), y2: P.y(1000), class: "ref" }, P.g);
    Plot.el("circle", { cx: P.x(r), cy: P.y(f.faraday), r: 5, class: "dot" }, P.g);
    Plot.el("circle", { cx: P.x(r), cy: P.y(f.ampere), r: 5, class: "fill c-warn" }, P.g);
    $("svr").textContent = t("fv.vval", { r: F.num(r, 3) });
    $("vfa").textContent = F.si(f.faraday, "V·m⁻¹");
    $("vam").textContent = F.si(f.ampere, "V·m⁻¹");
    $("vra").textContent = F.num(f.rapport, 3);
    $("fra").textContent = t(Math.abs(f.rapport - 1) < 0.01 ? "fv.f.accord" : "fv.f.desaccord");
  }
  sv.oninput = draw; draw();
})();

/* ---------- la nappe : un bloc de champ qui part, exact et pas à pas ---------- */
(() => {
  const svg = $("trace"), st = $("st"), sT = $("sT"), seg = $("mode"), tau = 1e-9;
  let mode = "impulsion";
  function draw() {
    const tt = +st.value * 1e-9, T = +sT.value * 1e-9;
    const src = O.courant({ J: J0, tau, T: mode === "etabli" ? Infinity : T });
    const y = O.yee1D({ J: src.J, L: 6, n: 600, duree: tt, S: 0.9 });
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 64, b: 44 }, x: { domain: [-6, 6], label: t("fig.xaxis") }, y: { domain: [-250, 250], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(-6), x2: P.x(6), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const xs = Array.from({ length: 1201 }, (_, i) => -6 + i * 0.01);
    Plot.el("path", { d: Plot.path(xs.map(x => [P.x(x), P.y(O.nappe(src.J, x, y.t).Ey)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map(x => [P.x(x), P.y(c * O.nappe(src.J, x, y.t).Bz)])), class: "stroke c-warn dash" }, P.g);
    y.x.forEach((x, i) => { if (i % 12 === 6) Plot.el("circle", { cx: P.x(x), cy: P.y(y.Ey[i]), r: 2.5, class: "fill c-label-2" }, P.g); });
    /* E/cB measured on the grid, in the middle of the field on the right */
    const xm = mode === "etabli" ? c * y.t / 2 : Math.max(0, c * (y.t - T / 2));
    const i = y.x.findIndex(x => x >= xm), j = y.xB.findIndex(x => x >= xm), plein = Math.abs(y.Ey[i]) > E0 / 2 && xm > 0.1;
    $("str").textContent = F.si(tt, "s", { prefix: "n" });
    $("sTr").textContent = F.si(T, "s", { prefix: "n" });
    sT.disabled = mode === "etabli";
    $("vfront").textContent = F.si(c * y.t, "m");
    $("vbloc").textContent = mode === "etabli" ? t("fig.sansfin") : F.si(c * T, "m");
    $("vyee").textContent = plein ? F.num(y.Ey[i] / (c * y.Bz[j]), 3) : t("fig.vide");
    $("fyee").textContent = plein ? t("fig.f.yee", { E: F.si(Math.abs(y.Ey[i]), "V·m⁻¹") }) : "";
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
  st.oninput = sT.oninput = draw; draw();
})();

/* ---------- le système décrit : une plaque de 10 m, vue à 1 m ---------- */
(() => {
  const L = 10, x = 1, tau = 1e-9, bord = Math.hypot(x, L / 2) / c, coin = Math.hypot(x, L / Math.SQRT2) / c;
  const statique = 1 - (2 / Math.PI) * Math.asin(L * L / (L * L + 4 * x * x));     // static field on the axis: μ0 J Ω/(4π), Ω the solid angle of the square
  $("sys1").innerHTML = t("sys1.body", { J: F.si(J0, "A·m⁻¹"), B: F.si(B0, "T", { prefix: "µ" }), E: F.si(E0, "V·m⁻¹"),
    L: F.si(L, "m"), x: F.si(x, "m"), arrivee: F.si(x / c, "s", { prefix: "n" }), bord: F.si(bord, "s", { prefix: "n" }), coin: F.si(coin, "s", { prefix: "n" }), statique: F.qty(F.num(100 * statique, 2), "%"),
    front: F.qty(F.num(100 * c * tau, 2), "cm"), tau: F.si(tau, "s", { prefix: "n" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1865, "idea"], ["hertz", 1888, "experiment"], ["yee", 1966, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["das"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["partout", "c"], ["moitie", "a"], ["valeur", "d"], ["bloc", "b"], ["directions", "c"], ["entretien", "a"], ["bord", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 184 });
})();
</script>
