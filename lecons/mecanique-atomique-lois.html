    <div class="eq"><math display="block"><mi>λ</mi><mo>=</mo><mfrac><mi>h</mi><mi>p</mi></mfrac><mo>,</mo><mspace width="1em"/><mi>p</mi><mi>c</mi><mo>=</mo><msqrt><msup><msub><mi>E</mi><mi data-i18n="eq.c"></mi></msub><mn>2</mn></msup><mo>+</mo><mn>2</mn><msub><mi>E</mi><mi data-i18n="eq.c"></mi></msub><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></msqrt></math></div>

  <section class="card">

      <svg class="fig" id="graphe" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.objet"></span><span class="c-label-2" data-i18n="fig.legend.autres"></span><span class="c-warn" data-i18n="fig.legend.ecart"></span><span class="c-label" data-i18n="fig.legend.atome"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" role="group" id="objet">
            <button type="button" data-o="electron" data-i18n="fig.o.electron"></button>
            <button type="button" data-o="neutron" data-i18n="fig.o.neutron"></button>
            <button type="button" data-o="c60" data-i18n="fig.o.c60"></button>
            <button type="button" data-o="balle" data-i18n="fig.o.balle"></button>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/mecanique-atomique-lois.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/quantique-amplitudes.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, Cst = Constantes;
const lambdaDe = (m, Ec) => Q.broglie(Q.impulsion(m, Ec));
const energieJ = Ec => F.si(Ec, "J") + ' <span class="aux">(' + F.si(Ec / Q.e, "eV") + ")</span>";

/* ---------- which object shows fringes: each one on the bench of its own experiment ---------- */
(() => {
  /* m (kg), kinetic energy range (J, log), default; d slit spacing, L screen distance, w detector width (m) */
  const OBJ = {
    electron: { m: Q.m_e, e0: 10 * Q.e, e1: 1e5 * Q.e, def: 0.75, d: 1e-6, L: 1, w: 1e-6 },
    neutron: { m: Cst.m_n, e0: 1e-5 * Q.e, e1: 0.1 * Q.e, def: 0.85, d: 1e-4, L: 5, w: 2e-5 },
    c60: { m: 720 * Cst.u, e0: 0.5 * 720 * Cst.u * 50 ** 2, e1: 0.5 * 720 * Cst.u * 500 ** 2, def: 0.6, d: 1e-7, L: 1, w: 1e-5 },
    balle: { m: 0.01, e0: 0.5 * 0.01 * 100 ** 2, e1: 0.5 * 0.01 * 1000 ** 2, def: 0.6, d: 0.1, L: 10, w: 0.01 },
  };
  let cle = "electron";
  const svg = $("graphe"), sE = $("sE"), seg = $("objet");
  const ec = o => o.e0 * Math.pow(o.e1 / o.e0, +sE.value);
  function draw() {
    const o = OBJ[cle], Ec = ec(o), lam = lambdaDe(o.m, Ec), i = Q.interfrangeFentes(lam, o.L, o.d), K = Q.contrasteDetecteur(o.w, i);
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 64, b: 44 },
      x: { scale: "log", domain: [1e-22, 1e4], label: t("fig.xaxis"), fmt: v => Math.round(Math.log10(v)) % 4 ? "" : "10" + F.sup(Math.round(Math.log10(v))) },
      y: { scale: "log", domain: [1e-36, 1e0], label: t("fig.yaxis"), fmt: v => Math.round(Math.log10(v)) % 4 ? "" : "10" + F.sup(Math.round(Math.log10(v))) } });
    for (const k in OBJ) {
      const p = OBJ[k], pts = Array.from({ length: 41 }, (_, j) => { const E = p.e0 * Math.pow(p.e1 / p.e0, j / 40); return [G.x(E), G.y(lambdaDe(p.m, E))]; });
      Plot.el("path", { d: Plot.path(pts), class: "stroke " + (k === cle ? "bold c-tint" : "thin c-label-2") }, G.g);
    }
    const hl = (v, cls) => Plot.el("line", { x1: G.x(1e-22), x2: G.x(1e4), y1: G.y(v), y2: G.y(v), class: cls }, G.g);
    hl(2 * Q.a0, "stroke thin dash c-label");
    hl(o.d, "stroke thin dash c-warn");
    Plot.el("circle", { cx: G.x(Ec), cy: G.y(lam), r: 5, class: "dot" }, G.g);
    $("sEr").innerHTML = energieJ(Ec);
    $("vl").textContent = F.si(lam, "m");
    $("fl").textContent = t("fig.f.lambda", { r: F.sci(lam / o.d, 2), d: F.si(o.d, "m") });
    $("vi").textContent = F.si(i, "m");
    $("fi").textContent = t("fig.f.frange", { L: F.si(o.L, "m"), w: F.si(o.w, "m") });
    $("vc").textContent = K < 1e-3 ? "0" : F.num(K, 2);
    $("fc").textContent = t(K > 0.5 ? "fig.f.visible" : K > 0.05 ? "fig.f.flou" : "fig.f.invisible", { n: F.sci(o.w / i, 2) });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.o === cle)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { cle = b.dataset.o; sE.value = OBJ[cle].def; draw(); });
  sE.oninput = draw; sE.value = OBJ[cle].def; draw();
})();

/* ---------- the system described: an electron of Davisson and Germer, a bullet ---------- */
(() => {
  const Ee = 54 * Q.e, le = lambdaDe(Q.m_e, Ee), pe = Q.impulsion(Q.m_e, Ee);
  $("sys1").innerHTML = t("sys1.body", { E: energieJ(Ee), v: F.si(pe / Q.m_e, "m·s⁻¹"), l: F.si(le, "m"), r: F.num(le / (2 * Q.a0), 2) });
  const mb = 0.01, vb = 400, lb = Q.broglie(mb * vb), ib = Q.interfrangeFentes(lb, 10, 0.1);
  $("sys2").innerHTML = t("sys2.body", { l: F.si(lb, "m"), i: F.si(ib, "m"), n: F.sci(0.01 / ib, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["planck", 1900, "idea"], ["einstein", 1905, "idea"], ["broglie", 1924, "idea"], ["heisenberg", 1925, "idea"], ["born", 1926, "idea"], ["davisson", 1927, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["microscope"], uses = textOf("uses.items", USES);
  const l200 = lambdaDe(Q.m_e, 200e3 * Q.e);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace("{l}", F.si(l200, "m"))}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pareil", "b"], ["bille", "c"], ["photon", "a"], ["energie", "d"], ["detecteur", "b"], ["c60", "c"], ["classique", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 371 });
})();
</script>
