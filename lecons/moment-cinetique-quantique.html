<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes;

/* ---------- les 2j + 1 orientations permises, vues de côté ---------- */
(() => {
  const svg = $("cones"), sj = $("sj"), O = [200, 170], S = 140;
  const frac = j => Number.isInteger(j) ? String(j) : (2 * j) + "/2";
  function draw() {
    const j = +sj.value, v = M.valeursJz(j), L = Math.sqrt(M.carreJ(j)), k = L > 0 ? S / L : 0;
    svg.innerHTML = "";
    Plot.fleche(svg, [O[0], O[1] + S + 12], [O[0], O[1] - S - 18], { cls: "c-label-2" });
    const ax = Plot.el("text", { x: O[0] + 8, y: O[1] - S - 8 }, svg); ax.textContent = t("fig.axe");
    if (L > 0) {
      const arc = []; for (let i = 0; i <= 90; i++) { const a = -Math.PI / 2 + Math.PI * i / 90; arc.push([O[0] + S * Math.cos(a), O[1] - S * Math.sin(a)]); }
      Plot.el("path", { d: Plot.path(arc), class: "stroke thin dash c-label-2" }, svg);
    }
    for (const m of v) {
      const y = O[1] - k * m, x = O[0] + k * Math.sqrt(Math.max(0, L * L - m * m));
      Plot.el("line", { x1: O[0] - 12, x2: O[0] + S + 20, y1: y, y2: y, class: "stroke thin c-label-2" }, svg);
      if (L > 0) Plot.fleche(svg, O, [x, y], { cls: "c-tint", trait: "stroke bold" });
      if (v.length <= 9) { const e = Plot.el("text", { x: O[0] + S + 28, y: y + 4 }, svg); e.textContent = t("fig.m", { m: (m < 0 ? "\u2212" : m > 0 ? "+" : "") + frac(Math.abs(m)) }); }
    }
    Plot.el("circle", { cx: O[0], cy: O[1], r: 3.5, class: "fill" }, svg);
    // right: |J|/ħ = √(j(j+1)) against j, the classical length
    const X0 = 450, X1 = 630, yb = 300, H = 240, mx = 8.6, py = u => yb - H * u / mx;
    Plot.el("line", { x1: X0, x2: X0, y1: yb, y2: yb - H, class: "stroke thin" }, svg);
    Plot.el("line", { x1: X0, x2: X1, y1: yb, y2: yb, class: "stroke thin" }, svg);
    const barre = (u, x, cls, key) => { Plot.el("rect", { x, y: py(u), width: 44, height: yb - py(u), class: "fill " + cls }, svg);
      const e = Plot.el("text", { x: x + 22, y: yb + 18, "text-anchor": "middle" }, svg); e.textContent = t(key); };
    barre(j, 475, "c-label-2", "fig.b.jmax"); barre(L, 555, "c-tint", "fig.b.norme");
    const tt = Plot.el("text", { x: X0, y: 22 }, svg); tt.textContent = t("fig.unite");
    $("sjr").textContent = frac(j);
    $("ve").textContent = String(v.length);
    $("fe").textContent = t("fig.f.etats");
    $("vm").textContent = F.num(M.moyenneJz2(j), 4);
    $("fm").innerHTML = t("fig.f.moy", { a: F.num(3 * M.moyenneJz2(j), 4), b: F.num(M.carreJ(j), 4), c: F.num(j * j, 4) });
    $("va").textContent = j > 0 ? t("fig.deg", { a: F.num(M.angleMin(j) * 180 / Math.PI, 3) }) : t("fig.sans");
    $("fa").textContent = j > 0 ? t("fig.f.angle", { r: F.num(j / L, 3) }) : t("fig.f.zero");
  }
  sj.oninput = draw; draw();
})();

/* ---------- le système décrit : la molécule de monoxyde de carbone et sa première raie de rotation ---------- */
(() => {
  const nu = 115.271e9, r = M.rotateurRigide(nu, 12 * Cst.u, 15.994914619 * Cst.u), E = Cst.h * nu;
  $("sys1").innerHTML = t("sys1.body", { nu: F.si(nu, "Hz", { sig: 6 }), I: F.sci(r.I, 3), r: F.si(r.r, "m", { prefix: "p", sig: 4 }),
    naif: F.si(r.rNaif, "m", { prefix: "p", sig: 3 }), kT: F.num(E / (Cst.k_B * 10), 2), lam: F.si(Cst.c / nu, "m", { prefix: "m", sig: 3 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bohr", 1913, "idea"], ["matrices", 1926, "idea"], ["pauli", 1927, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["radio"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["nombre", "c"], ["demi", "a"], ["lithium", "d"], ["aligne", "b"], ["tiers", "a"], ["rotation", "c"], ["grand", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 347 });
})();
</script>
