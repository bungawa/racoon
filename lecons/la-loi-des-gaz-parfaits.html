<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- un litre de gaz : même nombre de molécules, à l'écart Z − 1 près ---------- */
(() => {
  const S = Statistique, svg = $("zp"), st = $("tk"), sp = $("pk"), PMAX = 30e6, PMIN = 1e4, V = 1e-3;
  const GAZ = [["He", "c-tint", "vhe", "fhe"], ["Ar", "c-warn", "var", "far"], ["N2", "c-ok", "vn2", "fn2"]];
  const P_ = s => PMIN * Math.pow(PMAX / PMIN, s / 100);
  function draw() {
    const T = +st.value, P = P_(+sp.value);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { domain: [0, PMAX / 1e6], label: t("z.x") }, y: { domain: [0.8, 1.2], label: t("z.y"), fmt: v => F.fix(v, 2) } });
    Plot.el("line", { x1: o.x(0), x2: o.x(PMAX / 1e6), y1: o.y(1), y2: o.y(1), class: "ref" }, o.g);
    let worst = 0;
    for (const [g, cls, vid, fid] of GAZ) {
      const pts = []; for (let i = 1; i <= 120; i++) { const p = PMAX * i / 120, z = S.Z(g, p, T); if (z >= 0.8 && z <= 1.2) pts.push([o.x(p / 1e6), o.y(z)]); }
      Plot.el("path", { d: Plot.path(pts), class: "stroke " + cls }, o.g);
      const z = S.Z(g, P, T), nm = P * V / (z * Constantes.R * T);
      if (z >= 0.8 && z <= 1.2) Plot.el("circle", { cx: o.x(P / 1e6), cy: o.y(z), r: 5, class: "fill " + cls }, o.g);
      $(vid).textContent = F.fix(z, 4);
      $(fid).textContent = t("z.f.m", { m: F.si(nm * S.M[g], "g", { sig: 3 }) });
      worst = Math.max(worst, Math.abs(z - 1));
    }
    $("tkv").innerHTML = F.kelvin(T);
    $("pkv").textContent = F.si(P, "Pa", { sig: 2 });
    $("vn").textContent = F.sci(S.nombre(P, V, T), 3);
    $("sys").innerHTML = t("sys.inner", { T: F.kelvin(T), P: F.si(P, "Pa", { sig: 2 }), e: F.num(100 * worst, 2),
      avis: t(worst < 0.01 ? "sys.ok" : worst < 0.1 ? "sys.moyen" : "sys.ko") });
  }
  st.oninput = sp.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["boyle", 1662, "experiment"], ["mariotte", 1679, "experiment"], ["gaylussac", 1802, "experiment"], ["clapeyron", 1834, "idea"], ["cannizzaro", 1860, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["compteur", "mole"], uses = textOf("uses.items", USES);
  const vm = F.qty(F.num(Statistique.volumeMolaire(101325, 273.15) * 1e3, 5), "L·mol⁻¹");
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace("{vm}", vm).replace("{t}", F.kelvin(273.15))}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["avogadro", "d"], ["masse", "b"], ["r", "a"], ["diatomique", "c"], ["z", "d"], ["helium", "b"], ["interne", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 395 });
})();
</script>
