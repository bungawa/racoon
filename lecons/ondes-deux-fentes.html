<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, CM = 0.01;
/* the trough: holes 0,8 cm wide, beach 50 cm behind the wall; the source on the axis, at the same distance from both holes */
const A_TROU = 0.8 * CM, L = 0.5;

/* ---------- intensities along the beach: one hole, the other, both ---------- */
(() => {
  const svg = $("graphe"), seg = $("trous"), sl = $("sl"), sd = $("sd"), sa = $("sa"), sx = $("sx");
  let mode = "12";
  function draw() {
    const o = { lambda: +sl.value * CM, d: +sd.value * CM, a: A_TROU, L }, A2 = (+sa.value) ** 2, X = 0.3;
    const at = x => { const r = Q.amplitudesDeuxFentes(x, o); const I1 = mode === "2" ? 0 : A2 * r.P1, I2 = mode === "1" ? 0 : A2 * r.P2;
      return { I1, I2, I12: mode === "12" ? A2 * r.P12 : I1 + I2, delta: r.delta, r1: r }; };
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 }, x: { domain: [-30, 30], label: t("fig.xaxis") }, y: { domain: [0, 8.2], label: t("fig.yaxis") } });
    const xs = Array.from({ length: 601 }, (_, j) => -X + j * 2 * X / 600), pts = xs.map(at);
    const courbe = (f, cls) => Plot.el("path", { d: Plot.path(xs.map((x, j) => [G.x(x / CM), G.y(Math.min(8.2, f(pts[j])))])), class: cls }, G.g);
    if (mode !== "2") courbe(p => p.I1, "stroke thin c-tint");
    if (mode !== "1") courbe(p => p.I2, "stroke thin c-warn");
    if (mode === "12") { courbe(p => p.I1 + p.I2, "stroke thin dash c-label-2"); courbe(p => p.I12, "stroke bold c-label"); }
    const x = +sx.value * CM, p = at(x);
    Plot.el("line", { x1: G.x(x / CM), x2: G.x(x / CM), y1: G.y(0), y2: G.y(8.2), class: "stroke thin dash c-label" }, G.g);
    Plot.el("circle", { cx: G.x(x / CM), cy: G.y(Math.min(8.2, p.I12)), r: 5, class: "dot" }, G.g);
    $("slr").textContent = F.si(o.lambda, "m");
    $("sdr").textContent = F.si(o.d, "m");
    $("sar").textContent = F.num(+sa.value, 2);
    $("sxr").textContent = F.si(x, "m");
    $("vi12").textContent = F.num(p.I12, 3);
    $("fi12").textContent = t("fig.f.i12", { s: F.num(p.I1 + p.I2, 3) });
    const terme = p.I12 - p.I1 - p.I2;
    $("vterme").textContent = F.num(Math.abs(terme) < 5e-4 ? 0 : terme, 3);
    $("fterme").textContent = mode === "12" ? t(terme >= 0 ? "fig.f.construct" : "fig.f.destruct") : t("fig.f.seul");
    const tours = p.delta / (2 * Math.PI);
    $("vdelta").textContent = F.num(tours, 3);
    $("fdelta").textContent = t("fig.f.delta", { i: F.si(Q.interfrangeFentes(o.lambda, L, o.d), "m") });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
  sl.oninput = sd.oninput = sa.oninput = sx.oninput = draw; draw();
})();

/* ---------- the system described: the trough ---------- */
(() => {
  const lam = 1.5 * CM, d = 6 * CM, o = { lambda: lam, d, a: A_TROU, L }, x = 0.2;
  const exact = Q.amplitudesDeuxFentes(x, o).delta, approx = 2 * Math.PI * d * x / (lam * L);
  $("sys1").innerHTML = t("sys1.body", { al: F.num(A_TROU / lam, 2), dl: F.num(d / lam, 2), n: Math.floor(d / lam), f: F.num(L * lam / (d * d), 2) });
  $("sys2").innerHTML = t("sys2.body", { e: F.num(exact / (2 * Math.PI), 3), a: F.num(approx / (2 * Math.PI), 3), p: F.num(100 * (approx - exact) / exact, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["young1", 1803, "experiment"], ["young2", 1807, "experiment"], ["fresnel", 1819, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["antibruit"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["valeur", "b"], ["sombre", "a"], ["bornes", "c"], ["moyenne", "d"], ["ecart", "a"], ["complexe", "b"], ["larges", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 373 });
})();
</script>
