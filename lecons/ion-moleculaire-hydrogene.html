<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, PM = 1e-12, eV = K.e;
/* measured: equilibrium distance 2,00 a0; ground state −0,597 139 hartree (−16,249 eV) against H(1s) + p at −13,598 eV */
const R_MES = 2.0 * K.a0, LIAISON_MES = 0.597139 * K.hbar ** 2 / (K.m_e * K.a0 ** 2) / K.e - 13.598;
/* the model minimum, found once */
const MIN = (() => { let b = [0, Infinity]; for (let r = 1; r <= 6; r += 0.001) { const e = Q.ionH2LCAO(r * K.a0).EII; if (e < b[1]) b = [r * K.a0, e]; } return b; })();

/* ---------- the two levels as the protons approach ---------- */
(() => {
  const svg = $("fig"), sr = $("sr"), N = 240, X0 = 40, X1 = 500, Y0 = -2.5, Y1 = 3;
  function draw() {
    const R = +sr.value * PM, r = Q.ionH2LCAO(R);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 520, h: 320, x: { domain: [X0, X1], label: t("fig.x"), fmt: v => F.num(v, 0) },
      y: { domain: [Y0, Y1], label: t("fig.y"), fmt: v => F.num(v, 1) } });
    const clamp = v => Math.min(Y1, Math.max(Y0, v));
    for (const [k, cls, sty] of [["EII", "c-tint", "stroke bold"], ["EI", "c-warn", "stroke dash"]]) {
      const pts = Array.from({ length: N + 1 }, (_, i) => { const xr = X0 + (X1 - X0) * i / N; return [x(xr), y(clamp(Q.ionH2LCAO(xr * PM)[k] / eV))]; });
      Plot.el("path", { d: Plot.path(pts), class: sty }, Plot.el("g", { class: cls }, g));
    }
    const gl = Plot.el("g", { class: "c-label-2" }, g);
    Plot.el("line", { x1: x(X0), x2: x(X1), y1: y(0), y2: y(0), class: "stroke thin dash" }, gl);
    Plot.el("line", { x1: x(+sr.value), x2: x(+sr.value), y1: y(Y0), y2: y(Y1), class: "stroke thin" }, gl);
    Plot.el("circle", { cx: x(R_MES / PM), cy: y(-LIAISON_MES), r: 5, class: "stroke thin", fill: "none" }, gl);
    $("srr").textContent = F.si(R, "m", { prefix: "p" });
    $("vII").textContent = F.si(r.EII / eV, "eV");
    $("fII").textContent = t(r.EII < 0 ? "fig.f.lie" : "fig.f.nonlie");
    $("vI").textContent = F.si(r.EI / eV, "eV");
    $("fI").textContent = t("fig.f.I", { d: F.si((r.EI - r.EII) / eV, "eV") });
    $("vS").textContent = F.num(r.S, 3);
    $("fS").textContent = t("fig.f.S", { ra: F.num(R / K.a0, 2) });
  }
  sr.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  $("sys").innerHTML = t("sys.body", { mr: F.num(K.m_p / K.m_e, 0), Rm: F.si(MIN[0], "m", { prefix: "p" }), Em: F.si(-MIN[1] / eV, "eV"),
    Rx: F.si(R_MES, "m", { prefix: "p" }), Ex: F.si(LIAISON_MES, "eV"), a0: F.si(K.a0, "m", { prefix: "p" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["burrau", 1927, "idea"], ["pauling", 1928, "idea"], ["jaffe", 1934, "idea"], ["jefferts", 1969, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["masses"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["base", "b"], ["signe", "d"], ["cinetique", "a"], ["noeud", "c"], ["portee", "b"], ["dissymetrie", "a"], ["modele", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1001 });
})();
</script>
