<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux;

/* ---------- la même énergie, deux répartitions : ε0E²/2 dans le champ, ρφ/2 sur les charges ---------- */
(() => {
  const Q = 1e-6, R = 0.1;                                                     // 1 µC on a sphere of radius 10 cm
  const svg = $("trace"), sr = $("sr"), seg = $("forme");
  let forme = "boule";
  const pc = x => F.qty(F.num(100 * x, 3), "%");
  function draw() {
    const e = OM.energieRepartie({ Q, R, forme }), x = 10 ** (+sr.value / 100), r = x * R;   // r/R from 0,1 to 100
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { scale: "log", domain: [0.1, 100], label: t("fig.xaxis") }, y: { domain: [0, 100], label: t("fig.yaxis") } });
    const xs = Array.from({ length: 601 }, (_, i) => 10 ** (-1 + 3 * i / 600));
    const courbe = f => Plot.path(xs.map(v => [P.x(v), P.y(100 * f(v * R) / e.total)]));
    Plot.el("path", { d: courbe(e.charges), class: "ref" }, P.g);
    Plot.el("path", { d: courbe(e.champ), class: "curve" }, P.g);
    Plot.el("line", { x1: P.x(x), x2: P.x(x), y1: P.y(0), y2: P.y(100), class: "zero" }, P.g);
    Plot.el("circle", { cx: P.x(x), cy: P.y(100 * e.champ(r) / e.total), r: 5, class: "dot" }, P.g);
    $("srr").textContent = F.si(r, "m");
    $("vchamp").textContent = pc(e.champ(r) / e.total); $("fchamp").textContent = F.si(e.champ(r), "J", { prefix: "m" });
    $("vcharges").textContent = pc(e.charges(r) / e.total); $("fcharges").textContent = F.si(e.charges(r), "J", { prefix: "m" });
    $("vbord").textContent = pc(e.bord(r) / e.total);
    $("fbord").textContent = t("fig.f.bord", { v: F.si(e.charges(r) - e.champ(r), "J", { prefix: "m" }) });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === forme)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { forme = b.dataset.m; draw(); });
  sr.oninput = draw; draw();
})();

/* ---------- le système décrit : une sphère conductrice chargée, et ce que pèse son énergie ---------- */
(() => {
  const Q = 1e-6, R = 0.1, c = Constantes.c, G = Constantes.G, g = Constantes.g0;
  const e = OM.energieRepartie({ Q, R, forme: "coquille" }), m = e.total / (c * c), a = G * m / (R * R);
  $("sys1").innerHTML = t("sys1.body", { Q: F.si(Q, "C", { prefix: "µ" }), R: F.qty(F.num(100 * R, 3), "cm"), U: F.si(e.total, "J", { prefix: "m" }),
    m: F.qty(F.sci(m, 2), "kg"), a: F.qty(F.sci(a, 2), "m·s⁻²"), ag: F.sci(a / g, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["inertie", 1905, "idea"], ["gravitation", 1915, "idea"], ["eclipse", 1919, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["antenne"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["impose", "c"], ["rot", "a"], ["sphere", "d"], ["total", "b"], ["electrodynamique", "a"], ["gravite", "c"], ["pourquoi", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 274 });
})();
</script>
