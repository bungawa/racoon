<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd;

/* ---------- B d'une spire : directement, ou par les dérivées de A ; l'écart en fonction du pas ---------- */
(() => {
  const svg = $("err"), sh = $("sh"), sp = $("sp"), Ic = 10, R = 0.1, z = 0.03;              // A, m, m
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { b: 44 },
    x: { scale: "log", domain: [1e-11, 1e-1], label: t("fig.x") }, y: { scale: "log", domain: [1e-12, 1e-1], label: t("fig.y") } });
  const courbe = Plot.el("path", { class: "stroke c-tint" }, g), p2 = Plot.el("path", { class: "stroke thin dash c-label-2" }, g), p1 = Plot.el("path", { class: "stroke thin dash c-label-2" }, g);
  const dot = Plot.el("circle", { r: 5, class: "fill c-warn" }, g), clip = v => Math.min(1e-1, Math.max(1e-12, v));
  function draw() {
    const rho = +sp.value / 1000, hr = 10 ** +sh.value, ecart = u => M.rotationnelSpire(Ic, R, rho, z, u * R).ecart;
    let d = ""; for (let i = 0; i <= 200; i++) { const u = 10 ** (-11 + 10 * i / 200); if (u * R >= rho) break; d += (d ? "L" : "M") + x(u).toFixed(1) + " " + y(clip(ecart(u))).toFixed(1); }
    courbe.setAttribute("d", d);
    const e3 = ecart(1e-3), seg = (k, u0, u1) => "M" + x(u0).toFixed(1) + " " + y(clip(10 * e3 * (u0 / 1e-3) ** k)).toFixed(1) + "L" + x(u1).toFixed(1) + " " + y(clip(10 * e3 * (u1 / 1e-3) ** k)).toFixed(1);
    p2.setAttribute("d", seg(2, 1e-5, Math.min(1e-1, 0.9 * rho / R)));
    const e9 = ecart(1e-9); p1.setAttribute("d", "M" + x(1e-11).toFixed(1) + " " + y(clip(e9 * 100)).toFixed(1) + "L" + x(1e-7).toFixed(1) + " " + y(clip(e9 / 100)).toFixed(1));
    const r = hr * R < rho ? M.rotationnelSpire(Ic, R, rho, z, hr * R) : null;
    dot.setAttribute("cx", x(hr)); dot.setAttribute("cy", y(clip(r ? r.ecart : 1)));
    $("shr").textContent = t("fig.v.h", { h: F.sci(hr, 2) });
    $("spr").textContent = F.si(rho, "m", { prefix: "m" });
    const ex = M.rotationnelSpire(Ic, R, rho, z, 1e-5 * Math.min(R, rho)).Bexact;
    $("vd").textContent = F.si(Math.hypot(...ex), "T", { sig: 6 });
    $("fd").textContent = t("fig.f.direct");
    $("vr").textContent = r ? F.si(Math.hypot(...r.Bnum), "T", { sig: 6 }) : "–";
    $("fr").textContent = r ? t("fig.f.rot", { e: F.sci(r.ecart, 1) }) : t("fig.f.trop");
    $("vc").textContent = t("fig.v.cout");
    $("fc").textContent = t("fig.f.cout");
  }
  sh.oninput = sp.oninput = draw; draw();
})();

/* ---------- le système décrit : ce qu'une sonde mesure, ce qu'un calcul arrondit ---------- */
(() => {
  const eps = Number.EPSILON / 2, R = 0.1, best = Math.cbrt(eps);
  $("sys1").innerHTML = t("sys1.body", { eps: F.sci(eps, 2), h: F.sci(best, 1), hm: F.si(best * R, "m"), e: F.sci(eps ** (2 / 3), 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1865, "idea"], ["heaviside", 1884, "idea"], ["fock", 1926, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["femm"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["reel", "c"], ["jauge", "a"], ["phi", "d"], ["six", "b"], ["axe", "c"], ["plan", "a"], ["pas", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 154 });
})();
</script>
