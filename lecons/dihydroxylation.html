<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, A = O.Alcenes, sym = s => t("chim.sym", { s }), $ = id => document.getElementById(id);

/* ---------- mécanismes limites, acte par acte : flèches courbes et comptes d'électrons du module ---------- */
function mecanisme(id, o) {
  const vues = O.actesMecanisme(id, Object.assign({ texte: sym, echelle: 40 }, o));
  ActesMecanisme.monter({ vues, textes: textOf("meca.actes." + id, vues.map((_, k) => "a" + k)), svg: $("m-" + id), boutons: $("m-" + id + "-actes"), texte: $("m-" + id + "-texte") });
}
mecanisme("osmylation", { carbones: true, doublets: [4] });
mecanisme("periodate", { doublets: [6] });
const peindre = (svg, m, o) => { const d = O.dessin(m, Object.assign({ texte: sym }, o)); svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };

/* ---------- stéréospécificité : alcène Z ou E, addition syn ou anti ---------- */
(() => {
  /* [alcène, gabarit du diol, carbones de la double liaison] */
  const CAS = { but2eneZ: ["diolButane", 1, 2], but2eneE: ["diolButane", 1, 2], pent2eneZ: ["diolPentane", 1, 2], cyclohexene: ["diolCyclohexane", 0, 1] };
  const IDS = Object.keys(CAS), noms = textOf("st.alcenes", IDS), produits = textOf("st.produits", IDS), sel = $("alcene");
  sel.innerHTML = IDS.map(id => `<option value="${id}">${noms[id]}</option>`).join("");
  let mode = "syn";
  const desc = (f, a, b) => "(" + t("st.desc", { a: f[a], b: f[b], ia: a === 0 ? 1 : 2, ib: a === 0 ? 2 : 3 }) + ")";
  function maj() {
    const id = sel.value, [g, a, b] = CAS[id], m = A.molecule(id), r = A.addition(m, a, b, "O", mode);
    peindre($("depart"), m, { echelle: 40, surligne: [a, b] });
    $("departnom").textContent = noms[id];
    r.faces.forEach((f, k) => {
      peindre($("face" + (k + 1)), A.cram(A.MOLECULES[g], a, b, f), { echelle: 36, surligne: [a, b] });
      $("face" + (k + 1) + "nom").textContent = t("st.face" + (k + 1), { d: desc(f, a, b), n: produits[id] });
    });
    $("issue").textContent = t("st.issue." + r.issue);
    document.querySelectorAll("#mode button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  sel.onchange = maj;
  $("mode").onclick = e => { const x = e.target.closest("button"); if (!x) return; mode = x.dataset.m; maj(); };
  maj();
})();

/* ---------- coupure des diols ---------- */
(() => {
  const CAS = { diolButane: [1, 2], diolPentane: [1, 2], diolCyclohexane: [0, 1] }, fam = textOf("cp.familles", ["aldehyde", "cetone", "acide"]);
  let id = "diolButane";
  function maj() {
    const d = O.mol(A.MOLECULES[id]), [a, b] = CAS[id], frag = A.coupure(d, [[a, b]]);
    const cases = [d].concat(frag);
    $("coupe").innerHTML = cases.map((_, k) => `<div><svg class="fig no-sigle" role="img" aria-label="${k ? t("cp.ariaP") : t("cp.ariaD")}"></svg><p class="readout"></p></div>`).join("");
    [...$("coupe").children].forEach((div, k) => {
      const m = cases[k];
      peindre(div.querySelector("svg"), m, { echelle: 34, surligne: k ? [] : [a, b] });
      const f = O.ecrireFormule(O.formuleBrute(m));
      div.querySelector("p").textContent = k ? t("cp.produit", { f, g: O.groupes(m).map(x => fam[x]).join(", ") }) : t("cp.depart", { f });
    });
    document.querySelectorAll("#diols button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.d === id)));
  }
  $("diols").onclick = e => { const x = e.target.closest("button"); if (!x) return; id = x.dataset.d; maj(); };
  maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["malaprade", 1928, "experiment"], ["criegee", 1931, "experiment"], ["upjohn", 1976, "experiment"], ["sharpless", 1988, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["histologie", "osmium"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["face", "b"], ["meso", "a"], ["trans", "d"], ["anti", "c"], ["catalytique", "b"], ["coupure", "a"], ["equivalent", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
