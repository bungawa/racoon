<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const $ = id => document.getElementById(id);
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));

/* ---------- §3-4 : quelques raies du spectre solaire (longueurs d'onde dans l'air, nm) ---------- */
(() => {
  const LINES = [["halpha", 656.281], ["d1", 589.592], ["d2", 588.995], ["d3", 587.562]];
  const txt = textOf("lines.items", LINES.map(l => l[0]));
  $("lines").innerHTML = LINES.map(([id, nm]) => `<div><span class="k">${F.qty(F.fix(nm, 1), "nm")}</span><span><strong>${txt[id].name}.</strong> ${txt[id].text}</span></div>`).join("");
})();

/* ---------- §3-4 : durée de vie d'une étoile en fonction de sa masse ---------- */
(() => {
  const V = Voisines, M0 = 0.5, M1 = 30, mass = v => M0 * Math.pow(M1 / M0, v / 1000), slider = m => Math.round(1000 * Math.log(m / M0) / Math.log(M1 / M0));
  const yr = m => V.lifetime(m) / V.YEAR;
  const { x, y, g } = Plot.axes($("lchart"), { fmt: F, w: 640, h: 300,
    x: { scale: "log", domain: [0.1, 100], label: t("chart.x") }, y: { scale: "log", domain: [1e5, 1e12], label: t("chart.y") } });
  let d = ""; for (let i = 0; i <= 100; i++) { const m = M0 * Math.pow(M1 / M0, i / 100); d += (i ? "L" : "M") + x(m).toFixed(1) + " " + y(yr(m)).toFixed(1); }
  Plot.el("path", { d, class: "curve" }, g);
  const age = 4.567e9;                                    // âge du Soleil, années
  Plot.el("line", { x1: x(0.1), x2: x(100), y1: y(age), y2: y(age), class: "ref" }, g);
  Plot.el("text", { x: x(0.12), y: y(age) - 6, class: "note" }, g).textContent = t("chart.age");
  const dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  const sl = $("msl");
  const upd = () => {
    const m = mass(+sl.value), L = V.luminosity(m), tv = V.lifetime(m);
    $("mread").textContent = t("chart.msun", { m: F.num(m, 2) });
    dot.setAttribute("cx", x(m)); dot.setAttribute("cy", y(tv / V.YEAR));
    $("vlum").textContent = F.qty(F.sci(L, 2), "W");
    $("flum").textContent = t("stat.lum.f", { r: F.num(L / V.L_SUN, 2) });
    $("vvie").textContent = F.qty(F.sci(tv, 2), "s");
    $("fvie").textContent = t("stat.vie.f", { a: F.sci(tv / V.YEAR, 2) });
    $("vh").textContent = F.qty(F.sci(V.hydrogenRate(L), 2), "kg·s⁻¹");
    $("vperte").textContent = F.qty(F.sci(V.massLossRate(L), 2), "kg·s⁻¹");
  };
  $("soleil").onclick = () => { sl.value = slider(1); upd(); };
  sl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fraunhofer", 1814, "experiment"], ["kirchhoff", 1859, "experiment"], ["helium", 1868, "experiment"], ["payne", 1925, "idea"],
    ["bethe", 1938, "idea"], ["b2fh", 1957, "idea"], ["kilonova", 2017, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["neutrinos", "exoplanetes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["raies", "a"], ["helium", "a"], ["chimie", "a"], ["masse", "a"], ["lourde", "a"], ["fer", "a"], ["or", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
