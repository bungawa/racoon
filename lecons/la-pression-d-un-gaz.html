<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- la boîte : 300 atomes d'argon, un piston, des chocs ou pas ---------- */
(() => {
  const S = Statistique, { k_B, N_A } = Constantes, N = 300, L = 20e-9, m = S.M.Ar / N_A, T0 = 300, DT = 5e-13, PAS = 40;
  const XMIN = 6e-9, XMAX = 40e-9, rand = Quiz.rng(17);
  const canvas = $("boite"), ctx = canvas.getContext("2d"), svp = $("vp"), sch = $("chocs");
  const vit = () => Math.pow(400, +svp.value / 100);                 // 1 to 400 m·s⁻¹
  let b, ref, Pm = null, sens = 0, frame = 0;
  const pk = () => 2 * S.energieX(b) / (b.X * L * L);               // (39.5): the pressure the piston feels, on average
  function raz() { b = S.boite({ N, L, m, T: T0 }, rand); sens = 0; Pm = null; ref = { P: pk(), V: b.X * L * L }; montre(); }
  function montre() {
    const V = b.X * L * L, P = pk(), T = S.temperature(b), nkT = N * k_B * T / V;
    $("vpv").textContent = F.qty(F.num(vit(), 2), "m·s⁻¹");
    $("vpm").textContent = Pm === null ? "–" : F.si(Pm, "Pa", { sig: 3 });
    $("vt").innerHTML = F.kelvin(T);
    $("vg53").textContent = F.fix(P * Math.pow(V, 5 / 3) / (ref.P * Math.pow(ref.V, 5 / 3)), 2);
    $("vg3").textContent = F.fix(P * Math.pow(V, 3) / (ref.P * Math.pow(ref.V, 3)), 2);
    $("lecture").innerHTML = t("sim.lecture", { r: Pm === null ? "–" : F.fix(Pm / nkT, 2), V: F.si(V, "m³", { sig: 2 }) });
    const v = vit(), vq = S.vQuadratique(S.M.Ar, T);
    $("sys").innerHTML = t("sys.inner", { n: F.qty(F.sci(N / V, 2), "m⁻³"), T: F.kelvin(T), sd: F.num(S.diametre(Thermo.GAZ.Ar.b) * Math.cbrt(N / V), 2),
      uv: F.num(v / vq, 2), vq: F.qty(F.num(vq, 3), "m·s⁻¹"), avis: t(sch.value === "non" ? "sys.sans" : v / vq < 0.01 ? "sys.lent" : "sys.vite") });
  }
  svp.oninput = montre; sch.onchange = montre;
  $("comp").onclick = () => sens = -1; $("det").onclick = () => sens = 1; $("stop").onclick = () => sens = 0; $("raz").onclick = raz;
  raz();

  let ink = {};
  const theme = () => ink = { wall: css("--label-2"), piston: css("--tint"), gas: css("--el-o") };
  theme(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", theme);
  new MutationObserver(theme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  function size() { const r = canvas.getBoundingClientRect(), d = Math.min(devicePixelRatio, 2); canvas.width = r.width * d; canvas.height = r.height * d; }
  new ResizeObserver(size).observe(canvas); size();
  let visible = true; new IntersectionObserver(e => visible = e[0].isIntersecting).observe(canvas);

  function tick() {
    requestAnimationFrame(tick);
    if (!visible) return;
    const opt = { melange: sch.value === "oui" ? 0.01 : 0, rand };
    for (let s = 0; s < PAS; s++) {
      b.u = sens * vit();
      if ((sens < 0 && b.X + b.u * DT < XMIN) || (sens > 0 && b.X + b.u * DT > XMAX)) { sens = 0; b.u = 0; }
      S.avance(b, DT, opt);
    }
    if (++frame % 10 === 0) { const p = S.mesure(b); Pm = Pm === null ? p : 0.6 * Pm + 0.4 * p; }
    if (frame % 3 === 0) montre();
    const cw = canvas.width, ch = canvas.height, sc = Math.min((cw - 20) / XMAX, (ch - 20) / L), ox = 10, oy = (ch - L * sc) / 2;
    ctx.clearRect(0, 0, cw, ch);
    ctx.strokeStyle = ink.wall; ctx.lineWidth = 2; ctx.strokeRect(ox, oy, XMAX * sc, L * sc);
    ctx.fillStyle = ink.piston; ctx.fillRect(ox + b.X * sc, oy - 4, 6, L * sc + 8);
    ctx.fillStyle = ink.gas; const r = Math.max(1.5, ch / 160);
    for (let i = 0; i < b.N; i++) { ctx.beginPath(); ctx.arc(ox + b.x[i] * sc, oy + b.y[i] * sc, r, 0, 6.283); ctx.fill(); }
  }
  tick();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bernoulli", 1738, "idea"], ["joule", 1851, "idea"], ["kronig", 1856, "idea"], ["clausius", 1857, "idea"], ["diesel", 1893, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const r = 16, Tf = 293.15 * Math.pow(r, 0.4), USES = ["diesel", "md"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace("{r}", r).replace("{t0}", F.kelvin(293.15)).replace("{t}", F.kelvin(Tf))}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["moitie", "c"], ["vitesse", "a"], ["isotropie", "d"], ["double", "b"], ["gamma", "a"], ["sanschocs", "c"], ["rapide", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 392 });
})();
</script>
