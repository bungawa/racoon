<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, M = Minkowski, O = OndesMilieux, C = R.c;
const n3 = v => F.num(Math.abs(v) < 5e-4 ? 0 : v, 3);
const vec = A => t("vec", { a: n3(A[0]), b: n3(A[1]) });

/* ---------- la quadrivitesse et le candidat naïf (c, v), vus par deux observateurs ---------- */
(() => {
  const svg = $("diag"), sw = $("sw"), sb = $("sb");
  function draw() {
    const w = +sw.value / 100, b = +sb.value / 100, wp = R.composer(w * C, -b * C) / C;   // the particle's speed for R′
    const c = M.cadre(svg, { W: 480, H: 380, x0: -2.5, x1: 2.5, t0: -0.5, t1: 3.5, pad: 10 });
    M.fond(c, { x: t("fig.ax.x"), t: t("fig.ax.ct"), pas: 0.5 });
    M.repere(c, b, { x: t("fig.ax.xp"), t: t("fig.ax.ctp") });
    M.droite(c, [0, 0], [w, 1], "stroke thin dash", c.layer("c-label"));
    /* one arrow per definition, each drawn in R's axes: u from R and u from R′ coincide; (c, v) from R and from R′ do not */
    const u = R.quadriVitesse(w), up = R.quadriVitesse(wp), uBoost = R.boostQuadri(u, b);
    const naif = [1, w, 0, 0], naifP = [1, wp, 0, 0], naifBoost = R.boostQuadri(naif, b), naifRetour = R.boostQuadri(naifP, -b);
    /* all three lie on the world line: the green one first, the red ones over it, a dot at each red tip */
    M.fleche(c, [0, 0], [u[1], u[0]], "c-ok", { trait: "stroke bold" });
    M.fleche(c, [0, 0], [naif[1], naif[0]], "c-ko");
    M.fleche(c, [0, 0], [naifRetour[1], naifRetour[0]], "c-ko", { trait: "stroke dash" });
    for (const q of [naif, naifRetour]) M.point(c, [q[1], q[0]], 3, "c-ko");
    $("swr").textContent = t("fig.w.v", { w: F.num(w, 2) });
    $("sbr").textContent = t("fig.b.v", { b: F.num(b, 2), wp: F.num(wp, 3) });
    $("vu").textContent = vec(up);
    $("fu").textContent = t("fig.f.u", { v: vec(uBoost) });
    $("vn").textContent = vec(naifP);
    $("fn").textContent = t("fig.f.naif", { v: vec(naifBoost) });
    $("vc").textContent = t("fig.v.carre", { a: n3(R.carre(u)), b: n3(R.carre(up)) });
    $("fc").textContent = t("fig.f.carre", { a: n3(R.carre(naif)), b: n3(R.carre(naifP)) });
    /* a cloud of proper density ρ0 riding with the particle: (25.6a) */
    const J = O.quadriCourant(1, w), Jp = R.boostQuadri(J, b);
    $("vr").textContent = t("fig.v.rho", { a: n3(J[0] / C), b: n3(Jp[0] / C) });
    $("fr").textContent = t("fig.f.rho", { r: n3(Math.sqrt(R.carre(Jp)) / C) });
  }
  sw.oninput = sb.oninput = draw; draw();
})();

/* ---------- le système décrit : un faisceau d'électrons de 20 keV ---------- */
(() => {
  const K = 20e3, mc2 = Constantes.m_e * C * C / Constantes.e, g = 1 + K / mc2, b = Math.sqrt(1 - 1 / (g * g));
  $("sys1").innerHTML = t("sys1.body", { K: F.si(K, "eV", { prefix: "k" }), b: F.num(b, 3), b2: F.num(b * b, 2), g: F.num(g, 4),
    e: F.num(100 * (g - 1), 2), r: F.num(1 / g, 3) });
})();

/* ---------- inventaire ---------- */
(() => {
  const ITEMS = ["evenement", "impulsion", "vitesse", "courant", "potentiel", "onde", "naif", "champs"];
  const txt = textOf("inv.items", ITEMS);
  $("inventaire").innerHTML = ITEMS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["poincare", 1906, "idea"], ["minkowski", 1908, "idea"], ["sommerfeld", 1910, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["boost"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["regle", "b"], ["vitesse", "d"], ["dtau", "a"], ["carre", "c"], ["densite", "b"], ["somme", "a"], ["champs", "d"], ["faible", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2501 });
})();
</script>
