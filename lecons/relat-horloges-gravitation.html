<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, c = R.c, Cst = Constantes, JOUR = 86400;

/* ---------- la fusée accélérée : éclairs de la tête vers la queue, gH/c² exagéré ---------- */
(() => {
  const svg = $("fusee"), ss = $("ss"), H = c;                             // H: one light-second, so ct/H is a time in s
  function draw() {
    const s = Math.max(+ss.value / 100, 1e-4), g = s * c * c / H, n = 5;
    const f = R.fuseeRigide(g, H, H / c, n), N = R.fuseeNewton(g, H, H / c, 2);
    const ex = f.eclairs, last = ex[n - 1], etaMax = Math.asinh(c * last.ta / f.XB) * 1.08;
    const xs = x => (x - f.XB) / H, ts = tt => c * tt / H;
    const wl = X => Array.from({ length: 101 }, (_, i) => { const e = etaMax * i / 100; return [xs(X * Math.cosh(e)), ts(X * Math.sinh(e) / c)]; });
    const lA = wl(f.XA), lB = wl(f.XB), xmax = Math.max(...lA.map(p => p[0])), tmax = Math.max(...lB.map(p => p[1]));
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 56, b: 44 }, x: { domain: [-0.2, Math.max(1.5, xmax * 1.05)], label: t("fig.xaxis") }, y: { domain: [0, Math.max(1, tmax)], label: t("fig.taxis") } });
    for (const l of [lA, lB]) Plot.el("path", { d: Plot.path(l.map(([x, y]) => [P.x(x), P.y(y)])), class: "curve" }, P.g);
    for (const e of ex) {
      Plot.el("path", { d: Plot.path([[P.x(xs(e.xe)), P.y(ts(e.te))], [P.x(xs(e.xa)), P.y(ts(e.ta))]]), class: "ref" }, P.g);
      Plot.el("circle", { cx: P.x(xs(e.xa)), cy: P.y(ts(e.ta)), r: 4, class: "dot" }, P.g);
    }
    Plot.el("text", { x: P.x(xs(f.XA)) + 6, y: P.y(0) - 6, class: "note" }, P.g).textContent = t("fig.A");
    Plot.el("text", { x: P.x(0) + 6, y: P.y(0) - 6, class: "note" }, P.g).textContent = t("fig.B");
    $("ssr").textContent = F.num(s, 2);
    $("vrap").textContent = F.num(f.rapport, 4);
    $("frap").textContent = t("fig.f.rapport", { tb: F.num(f.tauB / (H / c), 4) });
    $("vnew").textContent = F.num((H / c) / N.intervalles[0], 4);
    $("fnew").textContent = t("fig.f.newton", { s: F.num(1 + s, 4) });
  }
  ss.oninput = draw; draw();
})();

/* ---------- du laboratoire au GPS : le décalage selon l'altitude ---------- */
(() => {
  const svg = $("altitude"), sh = $("sh"), segM = $("mode"), segC = $("cas");
  const GM = Cst.GM_E, RT = Cst.R_E_mean, g = GM / (RT * RT), U = 1e-18;   // U: relative uncertainty of an optical clock
  const CAS = { chou: ["sol", 0.33], pound: ["sol", 22.5], skytree: ["sol", 452.6], gps: ["orbite", 20184e3] };
  let mode = "sol", cas = "pound";
  const hOf = () => (cas ? CAS[cas][1] : 10 ** (+sh.value / 100));
  const sol = h => ({ exact: R.ecartPotentiel(GM, RT, RT + h), lin: R.decalageUniforme(g, h) });
  const orb = h => R.marcheOrbite(Cst.R_E_eq + h);
  function draw() {
    if (mode === "orbite" && +sh.value < 500) { sh.value = 500; if (cas && CAS[cas][1] < 1e5) cas = null; }   // circular orbits from 100 km up
    const h = hOf();
    svg.innerHTML = "";
    const lo = mode === "sol" ? -2 : 5, hi = 7.6, hs = Array.from({ length: 241 }, (_, i) => 10 ** (lo + (hi - lo) * i / 240));
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { scale: "log", domain: [10 ** lo, 10 ** hi], label: t("fig.haxis") },
      y: { scale: "log", domain: mode === "sol" ? [1e-19, 1e-9] : [1e-12, 1e-9], label: t("fig.yaxis") } });
    const line = (f, cls) => Plot.el("path", { fill: "none", d: Plot.path(hs.map(x => [P.x(x), P.y(Math.max(f(x), 1e-30))]).filter(p => p[1] <= P.y(mode === "sol" ? 1e-19 : 1e-12) + 1)), class: cls }, P.g);
    let k1, k2, v1, v2, tot;
    if (mode === "sol") {
      const s = sol(h); line(x => sol(x).exact, "curve"); line(x => sol(x).lin, "ref");
      Plot.el("line", { x1: P.x(10 ** lo), x2: P.x(10 ** hi), y1: P.y(U), y2: P.y(U), class: "zero" }, P.g);
      tot = s.exact; k1 = "fig.leg.exact"; k2 = "fig.leg.lin";
      $("vphi").textContent = F.sci(s.exact, 3);
      $("fphi").textContent = t("fig.f.lin", { v: F.sci(s.lin, 3), e: F.sci(s.lin / s.exact - 1, 2) });
    } else {
      const m = orb(h); line(x => orb(x).gravitation, "curve"); line(x => -orb(x).vitesse, "ref");
      line(x => Math.abs(orb(x).total), "zero");
      tot = m.total; k1 = "fig.leg.grav"; k2 = "fig.leg.vit";
      $("vphi").textContent = F.sci(m.total, 3);
      $("fphi").textContent = t("fig.f.orb", { g: F.sci(m.gravitation, 3), v: F.sci(m.vitesse, 3) });
    }
    Plot.el("circle", { cx: P.x(h), cy: P.y(Math.max(Math.abs(tot), mode === "sol" ? 1e-19 : 1e-12)), r: 5, class: "dot" }, P.g);
    $("leg1").textContent = t(k1); $("leg2").textContent = t(k2);
    $("shr").textContent = F.si(h, "m");
    const parJour = tot * JOUR;
    $("vjour").textContent = F.si(parJour, "s", { sig: 3 });
    $("fjour").textContent = t("fig.f.jour", { a: F.si(parJour * 365.25, "s", { sig: 3 }) });
    const z = Math.abs(tot) / U;
    $("vz").textContent = z < 1e4 ? F.num(z, 3) : F.sci(z, 3);
    $("fz").textContent = t("fig.f.z", { u: F.sci(U, 1) });
    segM.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
    segC.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.c === cas)));
  }
  segM.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; cas = null; draw(); });
  segC.querySelectorAll("button").forEach(x => x.onclick = () => { cas = x.dataset.c; mode = CAS[cas][0]; sh.value = Math.round(100 * Math.log10(CAS[cas][1])); draw(); });
  sh.oninput = () => { cas = null; draw(); };
  sh.value = Math.round(100 * Math.log10(CAS[cas][1])); draw();
})();

/* ---------- le système décrit : la tour de Pound et Rebka ---------- */
(() => {
  const H = 22.5, g = Cst.g_CPGE, phi = R.decalageUniforme(g, H), v = 1e-3, L = H;
  $("sys1").innerHTML = t("sys1.body", { H: F.si(H, "m"), phi: F.sci(phi, 2), ab: F.sci(2 * phi, 2), v: F.si(phi * c, "m·s⁻¹", { prefix: "µ", sig: 2 }),
    b2: F.sci((v / c) ** 2, 1), vv: F.si(v, "m·s⁻¹", { prefix: "m" }), lc: F.si(L / c, "s", { prefix: "n", sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["einstein", 1907, "idea"], ["pound", 1960, "experiment"], ["gpa", 1976, "experiment"], ["chou", 2010, "experiment"], ["bothwell", 2022, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gps", "geodesie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tete", "a"], ["sol", "c"], ["metre", "b"], ["energie", "d"], ["gps", "b"], ["bilan", "c"], ["deux", "a"], ["insensible", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 426 });
})();
</script>
