<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, R = Constantes.R;
const pc = (x, n = 2) => F.num(100 * x, n) + F.NB + "%";

/* ---------- trois planètes ---------- */
(() => {
  $("tab").innerHTML = ["Venus", "Terre", "Mars"].map(id => { const P = S.PLANETES[id], Te = S.temperatureEquilibre(P.S0, P.A);
    return `<div><span class="k">${t("pla." + id)}</span><span>${t("tab.ligne", { s: F.qty(F.num(P.S0, 4), "W·m⁻²"), a: F.fix(P.A, 2), te: F.kelvin(Te), ts: F.kelvin(P.Ts) })}</span></div>`; }).join("");
})();

/* ---------- une planète et sa couche d'atmosphère ---------- */
(() => {
  const svg = $("pl"), sp = $("pla"), sa = $("al"), se = $("ep");
  function draw() {
    const P = S.PLANETES[sp.value], A = +sa.value / 1000, eps = +se.value / 100, Te = S.temperatureEquilibre(P.S0, A), Ts = S.serreGrise(Te, eps);
    const lo = Math.floor((Te - 15) / 10) * 10, hi = Math.ceil((Math.max(P.Ts, S.serre(Te)) + 15) / 10) * 10;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 }, x: { domain: [0, 1], label: t("pl.x") }, y: { domain: [lo, hi], label: t("pl.y") } });
    Plot.el("line", { x1: o.x(0), x2: o.x(1), y1: o.y(Te), y2: o.y(Te), class: "stroke dash c-warn" }, o.g);
    Plot.el("line", { x1: o.x(0), x2: o.x(1), y1: o.y(P.Ts), y2: o.y(P.Ts), class: "stroke c-ok" }, o.g);
    const pts = []; for (let i = 0; i <= 100; i++) pts.push([o.x(i / 100), o.y(S.serreGrise(Te, i / 100))]);
    Plot.el("path", { d: Plot.path(pts), class: "stroke c-tint" }, o.g);
    Plot.el("circle", { cx: o.x(eps), cy: o.y(Ts), r: 5, class: "fill c-tint" }, o.g);
    const need = S.absorptionDe(P.Ts, Te);
    $("alv").textContent = F.fix(A, 3); $("epv").textContent = F.fix(eps, 2);
    $("vabs").textContent = F.qty(F.num(P.S0 * (1 - A) / 4, 3), "W·m⁻²");
    $("vte").innerHTML = F.kelvin(Te); $("vts").innerHTML = F.kelvin(Ts); $("fts").textContent = t("pl.f.ts", { d: F.qty(F.num(Ts - P.Ts, 2), "K") });
    $("vsol").textContent = F.qty(F.num(S.stefan(Ts), 3), "W·m⁻²"); $("vret").textContent = F.qty(F.num(eps * S.stefan(Ts) / 2, 3), "W·m⁻²");
    $("sys").innerHTML = t("sys.inner", { pla: t("pla." + sp.value), s: F.qty(F.num(P.S0, 4), "W·m⁻²"), ls: F.si(S.wien(S.T_SOLEIL), "m", { sig: 2 }), lt: F.si(S.wien(Ts), "m", { sig: 2 }),
      avis: need > 1 ? t("sys.couches", { n: F.num(Math.pow(P.Ts / Te, 4) - 1, 2) }) : need < 0 ? t("sys.froid") : t("sys.eps", { e: F.fix(need, 2) }) });
  }
  sp.onchange = () => { sa.value = Math.round(S.PLANETES[sp.value].A * 1000); draw(); };
  sa.oninput = se.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fourier", 1824, "idea"], ["tyndall", 1859, "experiment"], ["arrhenius", 1896, "idea"], ["ekholm", 1901, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["vitrage", "satellite"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["quart", "c"], ["albedo", "a"], ["couche", "b"], ["spectres", "d"], ["venus", "a"], ["lineaire", "c"], ["serre", "b"], ["nuit", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 9303 });
})();
</script>
