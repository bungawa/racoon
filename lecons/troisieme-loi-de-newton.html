<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹", MS2 = "m·s⁻²", PU = "kg·m·s⁻¹";

/* ---------- deux chariots sur un banc à coussin d'air, repoussés par un ressort ---------- */
(() => {
  const svg = $("carts"), P = Plot.el, TAU = 0.05, TMAX = 2, PX = 160, X0 = 320, Y0 = 110;
  const arrow = (x1, y1, x2, y2, cls, parent) => Plot.fleche(parent, [x1, y1], [x2, y2], { cls });
  const label = (x, y, text, parent, anchor) => { const e = P("text", { x, y, "text-anchor": anchor || "middle" }, parent); e.textContent = text; return e; };
  const m1sl = $("m1sl"), m2sl = $("m2sl"), esl = $("esl"), musl = $("musl"), tsl = $("tsl");
  let anim = 0;
  /* closed form with dry friction μ g after the push: the cart slows down and stops, never turns back */
  const motion = (v, a, t) => { const ts = a > 0 ? Math.abs(v) / a : Infinity, s = Math.min(t, ts), sg = Math.sign(v);
    return { x: v * s - sg * a * s * s / 2, v: v - sg * a * s }; };
  function draw() {
    svg.innerHTML = "";
    const m1 = +m1sl.value, m2 = +m2sl.value, E = +esl.value, mu = musl.value / 1000, tt = TMAX * tsl.value / 1000;
    const r = QteMvt.release(m1, m2, E), a = mu * QteMvt.G, c1 = motion(r.v1, a, tt), c2 = motion(r.v2, a, tt);
    const w = m => 34 + 22 * Math.sqrt(m), w1 = w(m1), w2 = w(m2);
    P("line", { x1: 10, x2: 630, y1: Y0 + 20, y2: Y0 + 20, class: "stroke thin c-label-2" }, svg);
    label(320, Y0 + 40, t("carts.track"), svg);
    const x1 = X0 - 20 + PX * c1.x, x2 = X0 + 20 + PX * c2.x;
    const cart = (xEdge, wd, side, key) => { const x = side < 0 ? xEdge - wd : xEdge;
      P("rect", { x, y: Y0 - 30, width: wd, height: 46, rx: 6, class: "fill c-label-2" }, svg);
      label(x + wd / 2, Y0 - 2, t(key), svg); return x + wd / 2; };
    const cx1 = cart(x1, w1, -1, "carts.c1"), cx2 = cart(x2, w2, 1, "carts.c2");
    if (tt === 0) {
      let d = "M" + x1 + " " + (Y0 - 7); for (let i = 1; i <= 8; i++) d += " L" + (x1 + 40 * i / 8) + " " + (Y0 - 7 + (i % 2 ? -8 : 8) * (i < 8 ? 1 : 0));
      P("path", { d, class: "stroke c-label-2" }, svg);
      /* equal and opposite forces, drawn with the same length whatever the masses */
      arrow(x1 - 4, Y0 - 50, x1 - 64, Y0 - 50, "c-warn bold", svg); arrow(x2 + 4, Y0 - 50, x2 + 64, Y0 - 50, "c-warn bold", svg);
      label(x1 - 34, Y0 - 60, t("carts.f21"), svg); label(x2 + 34, Y0 - 60, t("carts.f12"), svg);
    } else {
      const K = 140;
      arrow(cx1, Y0 - 50, cx1 + K * c1.v, Y0 - 50, "c-label", svg); arrow(cx2, Y0 - 50, cx2 + K * c2.v, Y0 - 50, "c-label", svg);
    }
    $("m1read").textContent = F.qty(F.num(m1, 2), "kg"); $("m2read").textContent = F.qty(F.num(m2, 2), "kg");
    $("eread").textContent = F.si(E, "J"); $("muread").textContent = F.num(mu, 3); $("tread").textContent = F.si(tt, "s", { prefix: "" });
    $("vv").textContent = t("carts.vpair", { v1: F.qty(F.num(r.v1, 3), MS), v2: F.qty(F.num(r.v2, 3), MS) });
    $("fv").textContent = t("carts.f.v", { r: F.num(-r.v1 / r.v2, 3), m: F.num(m2 / m1, 3) });
    $("va").textContent = F.num(m2 / m1, 3);
    const p = m1 * c1.v + m2 * c2.v;
    $("vp").textContent = F.qty(F.fix(Math.abs(p) < 5e-13 ? 0 : p, 3), PU);
    $("fp").textContent = t("carts.f.p", { p: F.qty(F.fix(r.p2, 3), PU) });
    $("vshare").textContent = F.qty(F.num(100 * QteMvt.externalShare(a, TAU, Math.min(-r.v1, r.v2)), 2), "%");
  }
  $("burn").onclick = () => { cancelAnimationFrame(anim); const t0 = performance.now(), dur = 2500;
    const step = now => { const u = Math.min(1, (now - t0) / dur); tsl.value = Math.round(1000 * u); draw(); if (u < 1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step); };
  m1sl.oninput = m2sl.oninput = esl.oninput = musl.oninput = tsl.oninput = () => { cancelAnimationFrame(anim); draw(); };
  draw();
})();

/* ---------- la pomme tire la Terre ---------- */
(() => {
  const ME = 5.972e24, sl = $("appsl");
  function upd() {
    const m = 0.1 * Math.pow(10, +sl.value), a = QteMvt.reactionAcceleration(m, ME), d = a * 0.45 * 0.45 / 2;   // chute de 1 m : 0,45 s
    $("appread").textContent = m < 1000 ? F.qty(F.num(m, 3), "kg") : F.qty(F.sci(m, 2), "kg");
    $("af").textContent = F.si(m * QteMvt.G, "N");
    $("aa").textContent = F.qty(F.sci(a, 2), MS2);
    $("ad").textContent = F.qty(F.sci(d, 2), "m");
  }
  sl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1687, "idea"], ["mach", 1883, "idea"], ["nyt", 1920, "idea"], ["goddard", 1926, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["recul", "ionique"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cheval", "a"], ["camion", "a"], ["livre", "a"], ["chariots", "a"], ["saut", "a"], ["patineurs", "a"], ["vide", "a"], ["frottement", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 101 });
})();
</script>
