<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- le système décrit, chiffré ---------- */
(() => {
  const s = Nabla.SYSTEMES.ecoulement, n = Nabla.negligeables();
  $("sys").innerHTML = t("sys.body", { v: F.num(s.v, 2), c: F.num(s.cSon, 4), mach: F.sci(n.mach2, 2), e: F.num(s.epaisseur * 100, 1), plan: F.num(n.plan, 2) });
})();

/* ---------- un champ choisi : flèches, divergence, rotationnel ---------- */
(() => {
  const svg = $("champ"), P = Plot.el, S = 100, O = 200, M = 1.95;           // 100 px per metre, origin at the centre
  const X = x => O + S * x, Y = y => O - S * y;
  const arrow = (x1, y1, x2, y2, cls, parent) => Plot.fleche(parent, [x1, y1], [x2, y2], { cls, tete: 6, trait: "stroke thin" });
  const pick = $("pick"), xs = $("xsl"), ys = $("ysl");
  const sgn = v => (Math.abs(v) < 5e-7 ? 0 : v);
  function draw() {
    svg.innerHTML = "";
    const id = pick.value, c = Nabla.CHAMPS[id];
    let p = [+xs.value, +ys.value];
    if (c.singulier && Math.hypot(p[0], p[1]) < 1e-9) p = [0.1, 0];
    /* axes and grid of arrows; length ∝ |v|, capped */
    P("line", { x1: X(-M), y1: Y(0), x2: X(M), y2: Y(0), class: "stroke thin dash c-label-2" }, svg);
    P("line", { x1: X(0), y1: Y(-M), x2: X(0), y2: Y(M), class: "stroke thin dash c-label-2" }, svg);
    const g = P("g", { class: "c-tint" }, svg), K = 0.16;
    for (let i = -7; i <= 7; i++) for (let j = -7; j <= 7; j++) {
      const q = [i * 0.25, j * 0.25];
      if (c.singulier && Math.hypot(...q) < 0.2) continue;
      const v = c.v(q), n = Math.hypot(...v), k = n > 0 ? Math.min(K * n, 0.22) / n : 0;
      arrow(X(q[0] - k * v[0] / 2), Y(q[1] - k * v[1] / 2), X(q[0] + k * v[0] / 2), Y(q[1] + k * v[1] / 2), "", g);
    }
    /* the chosen point, with a small square whose sides follow the flow for a short time */
    const m = Nabla.mesure(id, p), w = P("g", { class: "c-warn" }, svg);
    const a = 0.12, dt = 0.25, corners = [[-a, -a], [a, -a], [a, a], [-a, a]].map(d => { const q = [p[0] + d[0], p[1] + d[1]], v = c.v(q); return [q[0] + dt * v[0], q[1] + dt * v[1]]; });
    P("polygon", { points: [[-a, -a], [a, -a], [a, a], [-a, a]].map(d => X(p[0] + d[0]).toFixed(1) + "," + Y(p[1] + d[1]).toFixed(1)).join(" "), class: "stroke thin dash" }, w);
    P("polygon", { points: corners.map(q => X(q[0]).toFixed(1) + "," + Y(q[1]).toFixed(1)).join(" "), class: "stroke" }, w);
    P("circle", { cx: X(p[0]), cy: Y(p[1]), r: 4, class: "fill" }, w);
    $("xread").textContent = F.qty(F.fix(p[0], 1), "m");
    $("yread").textContent = F.qty(F.fix(p[1], 1), "m");
    $("vv").textContent = "(" + F.fix(m.v[0], 2) + " ; " + F.fix(m.v[1], 2) + ")";
    $("fv").textContent = t("champ.f.v");
    $("vdiv").textContent = F.qty(F.fix(sgn(m.div), 3), "s⁻¹");
    $("fdiv").textContent = t("champ.f.exact", { v: F.fix(m.divExact, 3) });
    $("vrot").textContent = F.qty(F.fix(sgn(m.rot), 3), "s⁻¹");
    $("frot").textContent = t("champ.f.exact", { v: F.fix(m.rotExact, 3) });
    $("lecture").innerHTML = t("lecture." + id);
  }
  [pick, xs, ys].forEach(e => { e.oninput = draw; e.onchange = draw; }); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["smith", 1870, "idea"], ["maxwell", 1871, "idea"], ["wilson", 1901, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["meteo", "ecoulements"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["scalaire", "a"], ["calcul", "b"], ["rotation", "c"], ["cisaillement", "d"], ["tourbillon", "a"], ["composante", "b"], ["maxwell", "c"], ["incompressible", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 205 });
})();
</script>
