<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, DEG = Math.PI / 180;
const LETTRES = ["s", "p", "d", "f"];

/* ---------- |Y_lm(θ)|² in a meridian plane, coloured by the sign of the real amplitude at φ = 0 (π on the left) ---------- */
(() => {
  const svg = $("polaire"), sm = $("sm"), seg = $("ls");
  let l = 1;
  function draw() {
    const m = Math.max(-l, Math.min(l, +sm.value)); sm.value = String(m);
    svg.innerHTML = "";
    const c0 = 180, R = 150, z = Plot.el("text", { x: c0 + 6, y: 16, class: "c-label-2" }, svg); z.textContent = t("fig.z");
    Plot.el("line", { x1: c0, x2: c0, y1: 20, y2: 340, class: "stroke thin c-label-2" }, svg);
    Plot.el("line", { x1: 20, x2: 340, y1: c0, y2: c0, class: "stroke thin c-label-2" }, svg);
    let top = 0; for (let i = 0; i <= 180; i++) top = Math.max(top, Q.harmoniqueSpherique(l, m, i * DEG, 0).P);
    /* right half: φ = 0, left half: φ = π ; one small segment per degree, coloured by the sign of Re Y */
    for (const [phi, s] of [[0, 1], [Math.PI, -1]]) for (let i = 0; i < 180; i++) {
      const a = i * DEG, b = (i + 1) * DEG, ya = Q.harmoniqueSpherique(l, m, a, phi), yb = Q.harmoniqueSpherique(l, m, b, phi);
      const ra = R * ya.P / top, rb = R * yb.P / top, signe = (ya.re + yb.re) >= 0;
      Plot.el("line", { x1: c0 + s * ra * Math.sin(a), y1: c0 - ra * Math.cos(a), x2: c0 + s * rb * Math.sin(b), y2: c0 - rb * Math.cos(b), class: "stroke bold " + (signe ? "c-tint" : "c-warn") }, svg);
    }
    const N = Q.simpson(th => Q.harmoniqueSpherique(l, m, th, 0).P * Math.sin(th), 0, Math.PI, 400) * 2 * Math.PI;
    $("smr").textContent = (m > 0 ? "+" : "") + F.num(m, 2);
    $("vn").textContent = F.num(2 * l + 1, 2);
    $("fn").textContent = t("fig.f.etats", { lettre: LETTRES[l], p: l % 2 ? "−1" : "+1" });
    $("vno").textContent = F.fix(N, 6);
    $("fno").textContent = t("fig.f.norme");
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.l === l)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { l = +b.dataset.l; draw(); });
  sm.oninput = draw; draw();
})();

/* ---------- the system described: the counting of states and the centrifugal barrier ---------- */
(() => {
  let s = 0; for (let m = -2; m <= 2; m++) s += Q.harmoniqueSpherique(2, m, 1.1, 0.7).P;
  $("sys1").innerHTML = t("sys1.body", { s: F.fix(s * 4 * Math.PI, 6) });
  $("sys2").innerHTML = t("sys2.body", { n: F.num(2 * 2 * 2, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["laplace", 1782, "idea"], ["kelvin", 1867, "idea"], ["gruppentheorie", 1931, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["fond"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["direction", "a"], ["seul", "c"], ["entier", "d"], ["compte", "b"], ["parite", "a"], ["nom", "c"], ["norme", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1903 });
})();
</script>
