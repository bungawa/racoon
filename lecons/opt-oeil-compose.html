<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, P = Plot.el, DEG = Math.PI / 180, MIN = DEG / 60;

/* ---------- la facette : flou géométrique (36.1) contre diffraction (36.2) ---------- */
(() => {
  const svg = $("facette"), W = 640, H = 320, sd = $("dd"), sr = $("rr"), sl = $("ll");
  const Ds = Array.from({ length: 201 }, (_, i) => Math.pow(10, 0.5 + i * 0.01) * 1e-6);    // 3,2 à 320 µm
  const deg = v => v / DEG;
  function draw() {
    const delta = Math.pow(10, +sd.value) * 1e-6, r = Math.pow(10, +sr.value) * 1e-3, lambda = +sl.value * 1e-9, o = { r, lambda };
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: W, h: H, x: { scale: "log", domain: [Ds[0] * 1e6, Ds[Ds.length - 1] * 1e6], label: t("fc.ax.x"), fmt: v => F.num(v, 3) },
      y: { scale: "log", domain: [0.1, 30], label: t("fc.ax.y"), fmt: v => F.num(v, 3) } });
    const clipY = v => ax.y(Math.min(30, Math.max(0.1, v)));
    /* les facettes mesurées de l'ouvrière, 20 à 25 µm */
    const [f0, f1] = O.ABEILLE.facette.map(v => v * 1e6);
    P("rect", { x: ax.x(f0), y: ax.y(30), width: ax.x(f1) - ax.x(f0), height: ax.y(0.1) - ax.y(30), class: "area" }, svg);
    ["geo", "diff"].forEach(k => P("path", { d: Plot.path(Ds.map(d => [ax.x(d * 1e6), clipY(deg(O.flouCompose(d, o)[k]))])), class: "stroke thin c-label-2" }, svg));
    P("path", { d: Plot.path(Ds.map(d => [ax.x(d * 1e6), clipY(deg(O.flouCompose(d, o).total))])), class: "stroke bold c-tint" }, svg);
    P("text", { x: ax.x(280), y: clipY(0.35 * deg(280e-6 / r)), class: "tick", "text-anchor": "end" }, svg).textContent = t("fc.lbl.geo");
    P("text", { x: ax.x(4), y: clipY(0.35 * deg(lambda / 4e-6)), class: "tick", "text-anchor": "start" }, svg).textContent = t("fc.lbl.diff");
    const opt = O.optimumCompose(o), f = O.flouCompose(delta, o);
    P("line", { x1: ax.x(opt.delta * 1e6), x2: ax.x(opt.delta * 1e6), y1: ax.y(30), y2: ax.y(0.1), class: "stroke thin dash c-tint" }, svg);
    P("circle", { cx: ax.x(delta * 1e6), cy: clipY(deg(f.total)), r: 5, class: "fill c-tint" }, svg);
    $("ddr").textContent = F.si(delta, "m"); $("rrr").textContent = F.si(r, "m"); $("llr").textContent = F.si(lambda, "m");
    $("vf").textContent = F.num(deg(f.total), 2) + "°";
    $("ff").textContent = t("fc.f.flou").replace("{x}", F.num(f.total / MIN, 2));
    $("vo").textContent = F.si(opt.delta, "m");
    $("fo").textContent = t("fc.f.opt").replace("{g}", F.num(deg(opt.geo), 2) + "°");
    $("vm").textContent = F.num(deg(opt.angle), 2) + "°";
    $("fm").textContent = t("fc.f.min").replace("{x}", F.num(opt.angle / MIN, 2));
  }
  sd.oninput = sr.oninput = sl.oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["exner", 1891, "idea"], ["frisch", 1914, "experiment"], ["kuhn", 1924, "experiment"], ["polar", 1949, "experiment"], ["barlow", 1952, "idea"], ["song", 2013, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["camera", "uv"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["blanc", "b"], ["rouge", "d"], ["compromis", "a"], ["optimum", "c"], ["facteur", "b"], ["barlow", "d"], ["humain", "a"], ["lentille", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 364 });
})();
</script>
