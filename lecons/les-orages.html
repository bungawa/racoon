<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
/* ---------- la température de l'air et celle de la parcelle qui monte ---------- */
(() => {
  const svg = $("prof"), S = { g: $("sg"), T: $("sT"), m: $("sm"), h: $("sh") }, ZM = 16, TM = [190, 310];
  const grad = v => F.qty(F.num(v * 1e3, 3), "K·km⁻¹");
  function draw() {
    const gamma = +S.g.value * 1e-3, T0 = +S.T.value, mu = +S.m.value * 1e-3, hr = +S.h.value / 100;
    const d = ES.ascension({ T0, gamma, mu, hr }), c = ES.ascension({ T0, gamma, hr }), b = ES.ascension({ T0, gamma, humide: false });
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 380, x: { domain: TM, label: t("fig.x") }, y: { domain: [0, ZM], ticks: 8, label: t("fig.y") } });
    const trace = (T, cls, top) => Plot.el("path", { d: Plot.path(d.z.map((z, i) => [T[i], z / 1e3]).filter(p => p[1] <= Math.min(ZM, top / 1e3) && p[0] >= TM[0] && p[0] <= TM[1]).map(p => [A.x(p[0]), A.y(p[1])])), class: "stroke " + cls }, A.g);
    trace(d.Te, "bold c-label", 1e9); trace(b.Tp, "dash c-label-2", 1e9); trace(c.Tp, "c-warn", c.sommet); trace(d.Tp, "bold c-tint", d.sommet);
    const k = Math.min(d.z.length - 1, Math.round(d.sommet / (d.z[1] - d.z[0])));
    if (d.sommet > 0 && d.sommet / 1e3 <= ZM) Plot.el("circle", { cx: A.x(d.Tp[k]), cy: A.y(d.sommet / 1e3), r: 4, class: "fill c-tint" }, A.g);
    $("rg").textContent = grad(gamma); $("rT").innerHTML = F.kelvin(T0); $("rm").textContent = F.qty(F.num(mu * 1e3, 2), "km⁻¹"); $("rh").textContent = F.qty(F.num(100 * hr, 3), "%");
    $("vb").textContent = d.base > d.sommet ? t("base.jamais") : F.si(d.base, "m", { sig: 2 });
    $("vs").textContent = F.si(d.sommet, "m", { prefix: "k", sig: 3 });
    $("fs").textContent = t("f.sommet", { z: F.si(c.sommet, "m", { prefix: "k", sig: 3 }) });
    $("vw").textContent = F.si(d.wmax, "m·s⁻¹", { sig: 2 });
    $("fw").textContent = t("f.w", { w: F.si(c.wmax, "m·s⁻¹", { sig: 2 }) });
    $("vd").textContent = t(gamma > d.gammaSec ? "sec.instable" : "sec.stable");
    $("fd").textContent = t("f.sec", { s: grad(d.gammaSec), h: grad(d.gammaHumide0) });
    $("sys1").innerHTML = t("sys1.body", { w: F.si(d.wmax, "m·s⁻¹", { sig: 2 }), ma: F.sci((d.wmax / 340) ** 2, 1),
      dur: F.num(d.wmax > 0 ? 2 * d.sommet / d.wmax / 60 : 0, 2) });
  }
  Object.values(S).forEach(s => { s.oninput = draw; }); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["projet", 1946, "experiment"], ["stommel", 1947, "idea"], ["rapport", 1949, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["mtg"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["stable", "b"], ["kilometre", "c"], ["humide", "a"], ["melange", "d"], ["descente", "b"], ["vitesse", "a"], ["adiabatique", "c"], ["fin", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 904 });
})();
</script>
