<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-ondes" data-i18n="monde.ondes"></a><span class="aux">›</span><a href="/racoon/etape?id=battements-paquets" data-i18n="etape.battements-paquets"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>

    <div class="tags">
      <a class="chip t-ondes" href="/racoon/atlas?piste=ondes" data-i18n="tag.piste"></a>

    </div>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>I</mi><mo>=</mo><msubsup><mi>A</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>A</mi><mn>2</mn><mn>2</mn></msubsup><mo>+</mo><mn>2</mn><msub><mi>A</mi><mn>1</mn></msub><msub><mi>A</mi><mn>2</mn></msub><mi data-i18n="eq.cos"></mi><mo stretchy="false">(</mo><msub><mi>ω</mi><mn>1</mn></msub><mo>−</mo><msub><mi>ω</mi><mn>2</mn></msub><mo stretchy="false">)</mo><mi>t</mi></math><span class="n">(48.8)</span></div>
    <p class="validite" data-i18n-html="val.48.8"></p>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure class="chart">
      <svg class="fig" id="vec" role="img" data-i18n-attr="aria-label:ve.aria"></svg>
      <div class="legend"><span class="c-label-2" data-i18n="ve.legend.a1"></span><span class="c-warn" data-i18n="ve.legend.a2"></span><span class="c-tint" data-i18n="ve.legend.s"></span></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="tb" data-i18n="ve.t"></label><output id="tbv" for="tb"></output></div>
          <input id="tb" type="range" min="0" max="1" step="0.005" value="0.1"></div>
        <div class="ctl"><div class="row"><label for="ra" data-i18n="ve.r"></label><output id="rav" for="ra"></output></div>
          <input id="ra" type="range" min="0" max="1" step="0.05" value="0.6"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="ve.k.i"></span><span class="v" id="vi"></span><span class="f" id="fi"></span></div>
          <div class="stat"><span class="k" data-i18n="ve.k.c"></span><span class="v" id="vc"></span><span class="f" id="fc"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="ve.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
    <div class="panel">
      <div class="ctl"><div class="row"><label for="df" data-i18n="au.df"></label><output id="dfv" for="df"></output></div>
        <input id="df" type="range" min="0" max="40" step="0.5" value="3"></div>
      <button type="button" class="btn tinted" id="play" data-i18n="au.play"></button>
      <p class="aux" id="aumsg" aria-live="polite"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure class="chart">
      <svg class="fig" id="am" role="img" data-i18n-attr="aria-label:am.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="am.legend.s"></span><span class="c-warn" data-i18n="am.legend.env"></span></div>
      <div class="panel">
        <div class="seg" role="group" id="rap">
          <button type="button" data-r="5" data-i18n="am.r5"></button>
          <button type="button" data-r="100" data-i18n="am.r100"></button>
        </div>
        <div class="ctl"><div class="row"><label for="bm" data-i18n="am.b"></label><output id="bmv" for="bm"></output></div>
          <input id="bm" type="range" min="0" max="1.5" step="0.05" value="0.5"></div>
      </div>

    </figure>
    <p data-i18n-html="s3.p2"></p>

  <section class="card">

    <div class="list keyed" id="uses"></div>
  </section>

    <span class="sec" data-i18n="quiz.sec"></span>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>

<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/constantes.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §48-2 : les vecteurs tournants (figures 48-2 et 48-3), dans le repère qui tourne avec le premier ---------- */
(() => {
  const O = self.Ondes, F1 = 442, F2 = 440, TB = 1 / (F1 - F2), N = 400;
  function upd() {
    const r = +$("ra").value, tb = +$("tb").value * TB, D = O.deuxSinus(1, 2 * Math.PI * F1, r, 2 * Math.PI * F2);
    const svg = $("vec"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 270, pad: { l: 330, b: 44, t: 14 }, x: { domain: [0, TB], label: t("ve.xaxis") }, y: { domain: [0, 4], label: "" } });
    Plot.el("text", { x: 300, y: 135, "text-anchor": "middle", class: "label", transform: "rotate(-90 300 135)" }, P.g).textContent = t("ve.yaxis");
    const TS = Array.from({ length: N + 1 }, (_, i) => TB * i / N);
    Plot.el("path", { d: Plot.path(TS.map(x => [P.x(x), P.y(D.intensite(x))])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(tb), cy: P.y(D.intensite(tb)), r: 6, class: "dot" }, P.g);
    /* le plan complexe, repère tournant à ω₁ : le premier vecteur est fixe, le second recule à ω₁ − ω₂ */
    const cx = 110, cy = 126, u = 72, ph = (2 * Math.PI * (F2 - F1)) * tb;
    const A = [cx, cy], B = [cx + u, cy], C = [B[0] + u * r * Math.cos(ph), B[1] - u * r * Math.sin(ph)];
    Plot.el("circle", { cx: B[0], cy: B[1], r: u * r, class: "stroke thin dash c-warn" }, P.g);
    Plot.el("line", { x1: cx - 1.4 * u, x2: cx + 2.3 * u, y1: cy, y2: cy, class: "zero" }, P.g);
    Plot.el("line", { x1: cx, x2: cx, y1: cy - 1.5 * u, y2: cy + 1.5 * u, class: "zero" }, P.g);
    Plot.fleche(P.g, A, B, { cls: "c-label-2" });
    Plot.fleche(P.g, B, C, { cls: "c-warn" });
    Plot.fleche(P.g, A, C, { cls: "c-tint", trait: "stroke bold" });
    $("tbv").textContent = F.si(tb, "s"); $("rav").textContent = F.num(r, 2);
    $("vi").textContent = F.num(D.intensite(tb), 3); $("fi").textContent = t("ve.f.i", { max: F.num(D.Imax, 3), min: F.num(D.Imin, 3) });
    $("vc").textContent = D.Imax ? F.num((D.Imax - D.Imin) / (D.Imax + D.Imin), 3) : "–"; $("fc").textContent = t("ve.f.c");
  }
  ["tb", "ra"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- écouter deux sons de 440 Hz et 440 Hz + δf ---------- */
(() => {
  const show = () => { $("dfv").textContent = F.si(+$("df").value, "Hz"); };
  $("df").oninput = show; show();
  $("play").onclick = () => {
    const df = +$("df").value, s = t => Math.sin(2 * Math.PI * 440 * t) + Math.sin(2 * Math.PI * (440 + df) * t);
    $("aumsg").textContent = self.Ondes.jouer([s], 4) ? t("au.playing", { f: F.si(440 + df, "Hz"), df: F.si(df, "Hz") }) : t("au.none");   // shared playback (Ondes.jouer)
  };
})();

/* ---------- §48-2 : la modulation d'amplitude (figure 48-4) ---------- */
(() => {
  const O = self.Ondes, N = 2000;
  let rap = 5;
  function upd() {
    const b = +$("bm").value, M = O.modulee(b, 2 * Math.PI * rap, 2 * Math.PI), TS = Array.from({ length: N + 1 }, (_, i) => 2 * i / N);
    const svg = $("am"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 52, b: 44 }, x: { domain: [0, 2], label: t("am.xaxis") }, y: { domain: [-2.6, 2.6], label: t("am.yaxis") } });
    Plot.el("path", { d: Plot.path(TS.map(x => [P.x(x), P.y(M.enveloppe(x))])), class: "stroke dash c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(TS.map(x => [P.x(x), P.y(-M.enveloppe(x))])), class: "stroke dash c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(TS.map(x => [P.x(x), P.y(M.s(x))])), class: rap > 50 ? "stroke thin c-tint" : "curve" }, P.g);
    $("bmv").textContent = F.num(b, 2) + (M.surmodulee ? " " + t("am.sur") : "");
    $("rap").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.r === rap)));
  }
  $("rap").querySelectorAll("button").forEach(x => x.onclick = () => { rap = +x.dataset.r; upd(); });
  $("bm").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fessenden", 1902, "idea"], ["brantrock", 1906, "experiment"], ["superhet", 1918, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["superhet", "detecteur"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["bornes", "c"], ["contraste", "a"], ["repere", "d"], ["oreille", "b"], ["moyenne", "a"], ["porteuse", "c"], ["compter", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 482 });
})();
</script>
