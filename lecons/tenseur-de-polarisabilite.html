<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const deg = Math.PI / 180;

/* ---------- §31-1 : un champ qu'on fait tourner dans le plan qui contient l'axe optique ---------- */
(() => {
  /* susceptibilities χ = n² − 1 at 590 nm: calcite n_o = 1,658 (⊥ axis), n_e = 1,486 (∥ axis); a glass n = 1,5; a fictitious 4:1 crystal */
  const chi = n => n * n - 1;
  const MEDIA = { calcite: [chi(1.486), chi(1.658)], verre: [chi(1.5), chi(1.5)], fictif: [0.5, 2] };   // [χ along x = optic axis, χ along y]
  let medium = "calcite";
  const svg = $("pol"), R = 120;
  const arrow = (x, y, cls) => Plot.fleche(svg, [0, 0], [x, -y], { cls, tete: 12, trait: "stroke bold", min: 1e-9 });
  function upd() {
    Object.keys(MEDIA).forEach(m => $("m-" + m).setAttribute("aria-pressed", String(m === medium)));
    const [cx, cy] = MEDIA[medium], th = +$("ang").value * deg;
    const alpha = Tenseurs.diag(cx, cy, cy);                 // α/ε₀ in the crystal axes: x along the optic axis
    const E = [Math.cos(th), Math.sin(th), 0], P = Tenseurs.appliquer(alpha, E);
    const big = Math.max(cx, cy);
    svg.innerHTML = "";
    Plot.el("circle", { cx: 0, cy: 0, r: R, class: "stroke thin dash c-label-2" }, svg);
    Plot.el("line", { x1: -150, y1: 0, x2: 150, y2: 0, class: "stroke thin c-label-2" }, svg);
    Plot.el("text", { x: 150, y: -6, "text-anchor": "end" }, svg).textContent = t("pol.fig.axe");
    arrow(E[0] * R, E[1] * R, "c-tint");
    arrow(P[0] / big * R, P[1] / big * R, "c-warn");
    Plot.el("text", { x: E[0] * (R + 16), y: -E[1] * (R + 16) + 4, "text-anchor": "middle" }, svg).textContent = t("pol.fig.E");
    /* P's label beside its tip, on the side away from E */
    const pn = Math.hypot(P[0], P[1]), side = Math.sign(E[0] * P[1] - E[1] * P[0]) || 1, nx = -P[1] / pn * side, ny = P[0] / pn * side;
    Plot.el("text", { x: P[0] / big * R * 0.8 + nx * 14, y: -(P[1] / big * R * 0.8 + ny * 14) + 4, "text-anchor": "middle" }, svg).textContent = t("pol.fig.P");
    const ecart = Tenseurs.angle(E, P), par = Tenseurs.scalaire(P, E), perp = Math.hypot(...Tenseurs.vectoriel(E, P));
    $("angv").textContent = F.num(+$("ang").value, 3) + "°";
    $("vecart").textContent = F.fix(ecart / deg, 1) + "°";
    const m = Math.atan(Math.sqrt(Math.max(cx, cy) / Math.min(cx, cy))) - Math.atan(Math.sqrt(Math.min(cx, cy) / Math.max(cx, cy)));
    $("fecart").textContent = t("pol.f.ecart", { max: F.fix(m / deg, 1) + "°" });
    $("vpar").textContent = F.fix(par, 3);
    $("vperp").textContent = F.fix(perp, 3);
  }
  Object.keys(MEDIA).forEach(m => $("m-" + m).onclick = () => { medium = m; upd(); });
  $("ang").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bartholin", 1669, "experiment"], ["huygens", 1690, "idea"], ["voigt", 1898, "idea"], ["freedericksz", 1927, "experiment"], ["schadt", 1971, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ecran", "lame"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["verre", "c"], ["biais", "a"], ["neuf", "d"], ["indice", "b"], ["double", "a"], ["couple", "c"], ["axes", "d"], ["principal", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 311 });
})();
