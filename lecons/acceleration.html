<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹", MS2 = "m·s⁻²";

/* ---------- loi des nombres impairs (Galilée) ---------- */
(() => {
  const d = Cine.oddRule(Cine.G, 1, 5);
  $("odd").innerHTML = d.map((x, i) => `<div role="row"><span role="cell">${t("odd.row", { n: i + 1 })}</span><span class="v" role="cell">${F.qty(F.fix(x, 1), "m")} · ${t("odd.ratio", { k: 2 * i + 1 })}</span></div>`).join("");
})();

/* ---------- virage : Δv/Δt tend vers v²/R, vers le centre ---------- */
(() => {
  const svg = $("turn"), P = Plot.el, C0 = [170, 168], RR = 108, H0 = [470, 160], VL = 112;
  const arrow = (x1, y1, x2, y2, cls, parent) => Plot.fleche(parent, [x1, y1], [x2, y2], { cls, tete: 10 });
  const label = (x, y, key, parent, anchor) => { const e = P("text", { x, y, "text-anchor": anchor || "middle" }, parent); e.textContent = t(key); return e; };
  const vsl = $("vsl"), rsl = $("rsl"), asl = $("asl");
  function draw() {
    svg.innerHTML = "";
    const v = vsl.value / 3.6, R = +rsl.value, phi = asl.value * Math.PI / 180;
    const r = Cine.turnAverage(R, v, phi * R / v), dt = phi * R / v;
    /* the circle, the two positions, symmetric about the top */
    P("circle", { cx: C0[0], cy: C0[1], r: RR, class: "stroke thin c-label-2" }, svg);
    P("circle", { cx: C0[0], cy: C0[1], r: 3, class: "fill c-label-2" }, svg);
    label(C0[0], C0[1] + 18, "turn.centre", svg);
    const th0 = Math.PI / 2 + phi / 2, th1 = Math.PI / 2 - phi / 2;          // clockwise on screen: M then M′
    const pt = th => [C0[0] + RR * Math.cos(th), C0[1] - RR * Math.sin(th)];
    const tg = th => [Math.sin(th), Math.cos(th)];                          // unit tangent, clockwise on screen
    const M0 = pt(th0), M1 = pt(th1);
    [[M0, th0, "turn.vt"], [M1, th1, "turn.vt2"]].forEach(([M, th, key]) => {
      const u = tg(th);
      P("circle", { cx: M[0], cy: M[1], r: 5, class: "fill c-label" }, svg);
      arrow(M[0], M[1], M[0] + 0.6 * VL * u[0], M[1] + 0.6 * VL * u[1], "c-label", svg);
      label(M[0] + 0.6 * VL * u[0] + 4 * u[0], M[1] + 0.6 * VL * u[1] - 10, key, svg);
    });
    /* acceleration at mid-arc, towards the centre */
    const Mm = pt(Math.PI / 2);
    arrow(Mm[0], Mm[1] + 4, Mm[0], Mm[1] + 70, "c-warn dash", svg);
    label(Mm[0] + 10, Mm[1] + 56, "turn.alabel", svg, "start");
    /* hodograph: both speeds from one origin, Δv joins their tips */
    const a0 = tg(th0), a1 = tg(th1), T0 = [H0[0] + VL * a0[0], H0[1] + VL * a0[1]], T1 = [H0[0] + VL * a1[0], H0[1] + VL * a1[1]];
    P("circle", { cx: H0[0], cy: H0[1], r: VL, class: "stroke thin dash c-label-2" }, svg);
    arrow(H0[0], H0[1], T0[0], T0[1], "c-label", svg); arrow(H0[0], H0[1], T1[0], T1[1], "c-label", svg);
    arrow(T0[0], T0[1], T1[0], T1[1], "c-tint bold", svg);
    label((T0[0] + T1[0]) / 2 + 10, (T0[1] + T1[1]) / 2 + 4, "turn.dvlabel", svg, "start");
    label(H0[0], 290, "turn.hodo", svg);
    label(C0[0], 290, "turn.path", svg);
    /* numbers */
    $("vread").textContent = t("turn.vread", { ms: F.qty(F.num(v, 3), MS), kmh: F.qty(vsl.value, "km·h⁻¹") });
    $("rread").textContent = F.si(R, "m", { prefix: "" });
    $("aread").textContent = asl.value + "°";
    $("vdt").textContent = F.si(dt, "s", { prefix: "" });
    $("vavg").textContent = F.qty(F.num(r.norm, 4), MS2);
    $("ferr").textContent = t("turn.f.err", { e: F.num((1 - r.norm / r.exact) * 100, 2) });
    $("vex").textContent = F.qty(F.num(r.exact, 4), MS2);
    $("fg").textContent = t("turn.f.g", { g: F.num(r.exact / Cine.G, 2) });
  }
  vsl.oninput = rsl.oninput = asl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["galilee", 1638, "experiment"], ["huygens", 1659, "idea"], ["horologium", 1673, "idea"], ["cgpm", 1901, "use"], ["apollo", 1971, "experiment"], ["mems", 1993, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["airbag", "unite"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["sommet", "a"], ["virage", "a"], ["double", "a"], ["impairs", "a"], ["poly", "a"], ["tir", "a"], ["unite", "a"], ["freinage", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 85 });
})();
</script>
