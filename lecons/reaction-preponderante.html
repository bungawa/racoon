          <div class="ctl"><div class="row"><label for="sc2" id="lc2"></label><output id="sc2v" for="sc2"></output></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>

<script src="/racoon/constantes.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions;
const esp = f => t("esp", { s: C.texte(f) });

/* ---------- le simulateur : une espèce à 0,1 mol·L⁻¹, une seconde dont on règle la concentration ---------- */
(() => {
  const CAS = {
    acNH3: { fixe: { id: "ethanoique", j: 0 }, var: { id: "ammonium", j: 1 } },
    acSoude: { fixe: { id: "ethanoique", j: 0 }, var: { id: "HO-" } },
    hclNH3: { fixe: { id: "H3O+" }, var: { id: "ammonium", j: 1 } },
    bicarb: { fixe: { id: "carbonique", j: 1 }, var: { id: "H3O+" } },
    phos: { fixe: { id: "phosphorique", j: 0 }, var: { id: "HO-" } },
  };
  const C1 = 0.1, st = { cas: "acNH3" }, sl = $("sc2"), seg = $("cas");
  const nom = a => a.id === "H3O+" ? "H3O^+" : a.id === "HO-" ? "HO^-" : C.ACIDES.find(x => x.id === a.id).formes[a.j || 0];
  const couplesDe = ap => {
    const out = [{ acide: "H3O^+", base: "H2O", pKa: 0 }, { acide: "H2O", base: "HO^-", pKa: C.PKE }];
    for (const a of ap) if (a.id !== "H3O+" && a.id !== "HO-") { const s = C.ACIDES.find(x => x.id === a.id);
      s.pKa.forEach((k, i) => out.push({ acide: s.formes[i], base: s.formes[i + 1], pKa: k })); }
    return out;
  };
  function draw() {
    const cas = CAS[st.cas], c2 = +sl.value;
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === st.cas)));
    $("lc2").textContent = t("sim.c2", { s: esp(nom(cas.var)) });
    $("sc2v").innerHTML = F.qty(F.fix(c2, 3), "mol·L⁻¹");
    const ap = [Object.assign({ c: C1 }, cas.fixe)].concat(c2 > 0 ? [Object.assign({ c: c2 }, cas.var)] : []);
    const r = C.reactionPreponderante(ap), exact = C.pH(ap);
    /* the pKa scale: acids on the left, bases on the right; what is present at the start in colour */
    const svg = $("echelle"); svg.innerHTML = "";
    const Y = Plot.linScale(-1, 15, 360, 16), present = new Set(ap.map(nom).concat(["H2O"]));
    Plot.el("line", { x1: 200, x2: 200, y1: Y(-1), y2: Y(15), class: "stroke c-label-2" }, svg);
    Plot.fleche(svg, [200, Y(-0.6)], [200, Y(15)], { cls: "c-label-2", tete: 8 });
    Plot.el("text", { x: 120, y: 12, "text-anchor": "middle" }, svg).textContent = t("sim.acides");
    Plot.el("text", { x: 280, y: 12, "text-anchor": "middle" }, svg).textContent = t("sim.bases");
    for (const c of couplesDe(ap)) {
      const y = Y(c.pKa);
      Plot.el("line", { x1: 194, x2: 206, y1: y, y2: y, class: "stroke c-label" }, svg);
      Plot.el("text", { x: 188, y: y + 4, "text-anchor": "end", class: present.has(c.acide) ? "fill c-tint" : "" }, svg).textContent = esp(c.acide);
      Plot.el("text", { x: 212, y: y + 4, class: present.has(c.base) ? "fill c-tint" : "" }, svg).textContent = esp(c.base);
      Plot.el("text", { x: 6, y: y + 4 }, svg).textContent = F.fix(c.pKa, 2);
    }
    const e0 = r.etapes[0];
    if (e0) {
      const ya = Y(couplesDe(ap).find(c => c.acide === e0.acide).pKa), yb = Y(couplesDe(ap).find(c => c.base === e0.base).pKa);
      Plot.fleche(svg, [150, ya - 8], [250, yb + 8], { cls: e0.totale ? "c-warn" : "c-ok", tete: 9 }); }
    /* the steps */
    const lignes = r.etapes.map((e, i) => `<div><span class="k">${t("sim.etape", { n: i + 1 })}</span><span>${t("sim.eq", { a: esp(e.acide), b: esp(e.base), c: esp(e.produits[0]), d: esp(e.produits[1]) })} ${t(e.totale ? "sim.totale" : "sim.equilibre")}</span><span class="v">${t("sim.K", { k: F.fix(e.lgK, 2) })}</span></div>`);
    lignes.push(`<div><span class="k">${t("sim.fin")}</span><span>${t("sim.final", { a: esp(r.couple.acide), b: esp(r.couple.base), pKa: F.fix(r.couple.pKa, 2) })}</span><span class="v"></span></div>`);
    $("etapes").innerHTML = lignes.join("");
    $("vrp").textContent = F.fix(r.pH, 2); $("frp").textContent = t("sim.f.rp", { n: r.etapes.length });
    $("vex").textContent = F.fix(exact, 2);
    $("vec").textContent = F.fix(Math.abs(r.pH - exact), 3);
    $("vctl").textContent = r.controle < 1e-3 ? F.sci(r.controle, 1) : F.num(r.controle, 2);
    $("fctl").textContent = t(r.controle < 0.1 ? "sim.f.ctl.ok" : "sim.f.ctl.ko");
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { st.cas = b.dataset.c; draw(); });
  sl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["arrhenius", 1887, "idea"], ["sorensen", 1909, "idea"], ["bronsted", 1923, "idea"], ["bandura", 2006, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ocean"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["choix", "c"], ["constante", "a"], ["seuil", "d"], ["tampon", "b"], ["ordre", "a"], ["controle", "c"], ["ampholyte", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1909 });
})();
</script>
