<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §48-3 : trois stations voisines, espacées de 9 kHz ---------- */
(() => {
  const O = self.Ondes, FC = [864e3, 873e3, 882e3], ESP = 9e3, NS = 8;
  let mode = "dbl";
  function upd() {
    const fm = 1e3 * +$("fm").value, b = +$("bb").value;
    /* un son fait de NS composantes de 300 Hz à fm, de taux décroissants ; la somme des taux vaut b (pas de surmodulation) */
    const w = Array.from({ length: NS }, (_, j) => 1 / (1 + j)), W = w.reduce((s, x) => s + x, 0);
    const sons = w.map((x, j) => ({ f: 300 + (fm - 300) * j / (NS - 1), b: b * x / W }));
    const svg = $("spe"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 250, pad: { l: 52, b: 44 }, x: { domain: [850, 896], label: t("sp.xaxis") }, y: { domain: [0, 1.1], label: t("sp.yaxis") } });
    const k = f => P.x(f / 1e3), blu = mode === "blu";
    FC.forEach(fc => {
      const S = O.spectreAM(fc, sons);
      const lo = blu ? fc : S.bas, hi = S.haut;
      Plot.el("rect", { x: k(lo), y: P.y(1.1), width: k(hi) - k(lo), height: P.y(0) - P.y(1.1), class: "area" }, P.g);
      S.raies.forEach(r => {
        if (blu && r.f <= fc) return;
        const y = r.f === fc ? 1 : 4 * r.a;                                      // bandes latérales agrandies 4 fois pour la lecture
        Plot.el("line", { x1: k(r.f), x2: k(r.f), y1: P.y(0), y2: P.y(y), class: r.f === fc ? "stroke bold c-label-2" : "stroke c-tint" }, P.g);
      });
    });
    /* chevauchement : la bande d'une station empiète sur celle de la voisine */
    const larg = blu ? fm : 2 * fm, chev = larg - ESP;
    if (chev > 0) FC.slice(0, -1).forEach(fc => { const a = blu ? fc + ESP : fc + ESP - fm, z = fc + fm;
      Plot.el("rect", { x: k(a), y: P.y(0.06), width: Math.max(0, k(z) - k(a)), height: P.y(0) - P.y(0.06), class: "fill c-warn" }, P.g); });
    /* puissance moyenne : porteuse 1/2, chaque raie latérale a²/2 */
    const R = O.spectreAM(FC[0], sons).raies, pb = R.reduce((p, r) => p + (r.f === FC[0] ? 0 : r.a * r.a / 2), 0), part = blu ? 1 : pb / (0.5 + pb);
    $("fmv").textContent = F.si(fm, "Hz"); $("bbv").textContent = F.num(b, 2);
    $("vl").textContent = F.si(larg, "Hz");
    $("fl").textContent = chev > 0 ? t("sp.f.chev", { d: F.si(chev, "Hz") }) : t("sp.f.ok", { d: F.si(-chev, "Hz") });
    $("vp").textContent = t("sp.pct", { p: F.num(100 * part, 2) });
    $("fp").textContent = t(blu ? "sp.f.blu" : "sp.f.dbl");
    $("mode").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  $("mode").querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; upd(); });
  ["fm", "bb"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["carson", 1915, "idea"], ["fm", 1922, "idea"], ["atlantique", 1927, "use"], ["geneve", 1978, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ondes-moyennes", "blu"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["raies", "b"], ["largeur", "d"], ["puissance", "a"], ["voisine", "c"], ["blu", "b"], ["tele", "a"], ["porteuse", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 483 });
})();
</script>
