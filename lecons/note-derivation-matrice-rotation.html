<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, DEG = Math.PI / 180;
const fracA = v => Number.isInteger(v) ? F.num(v, 2) : (v < 0 ? "−" : "") + Math.round(Math.abs(2 * v)) + "/2";
const fact = n => { let f = 1; for (let i = 2; i <= n; i++) f *= i; return f; };

/* ---------- the terms of (18.71), one bar per k, and their sum against (18.35) ---------- */
(() => {
  const svg = $("termes"), sr = $("sr"), ss = $("ss"), sr2 = $("sr2"), sth = $("sth");
  function draw() {
    const r = +sr.value, s = +ss.value; sr2.max = String(r + s); if (+sr2.value > r + s) sr2.value = String(r + s);
    const r2 = +sr2.value, s2 = r + s - r2, th = +sth.value * DEG, C = Math.cos(th / 2), S = -Math.sin(th / 2);
    const pre = Math.sqrt(fact(r2) * fact(s2) / (fact(r) * fact(s))), termes = [];
    for (let k = 0; k <= s; k++) { if (r - r2 + k < 0 || r2 - k < 0) continue;
      termes.push([k, pre * (k % 2 ? -1 : 1) * S ** (r - r2 + 2 * k) * C ** (s + r2 - 2 * k) * fact(r) / (fact(r - r2 + k) * fact(r2 - k)) * fact(s) / (fact(s - k) * fact(k))]); }
    const B = Q.coefBinome(r, s, r2, th), j = (r + s) / 2, m = (r - s) / 2, m2 = (r2 - s2) / 2;
    svg.innerHTML = "";
    const top = Math.max(1, ...termes.map(x => Math.abs(x[1]))), y0 = 125, H = 95 / top, n = termes.length + 1, w = 560 / Math.max(n, 2);
    Plot.el("line", { x1: 40, x2: 620, y1: y0, y2: y0, class: "stroke thin c-label-2" }, svg);
    termes.concat([["Σ", B]]).forEach(([k, v], i) => {
      const x = 50 + i * w;
      Plot.el("rect", { x: x + w * 0.2, y: v >= 0 ? y0 - H * v : y0, width: w * 0.6, height: Math.abs(H * v), class: "fill " + (k === "Σ" ? "c-ok" : "c-tint") }, svg);
      const l = Plot.el("text", { x: x + w / 2, y: 252, "text-anchor": "middle", class: "c-label-2" }, svg); l.textContent = k === "Σ" ? t("fig.somme") : t("fig.k", { k });
    });
    $("srr").textContent = F.num(r, 2); $("ssr").textContent = F.num(s, 2); $("sr2r").textContent = F.num(r2, 2);
    $("sthr").textContent = F.num(+sth.value, 3) + "°";
    $("vb").textContent = F.fix(B, 5);
    $("fb").textContent = r + s ? t("fig.f.b", { v: F.fix(Q.dRotation(j, m2, m, th), 5) }) : t("fig.f.zero");
    $("vjm").textContent = t("fig.v.jm", { j: fracA(j), m: fracA(m), m2: fracA(m2) });
    $("fjm").textContent = t("fig.f.jm", { n: F.num(fact(r + s) / (fact(r) * fact(s)), 4) });
  }
  sr.oninput = ss.oninput = sr2.oninput = sth.oninput = draw; draw();
})();

/* ---------- the system described: how many arrangements are summed ---------- */
(() => {
  const c = (n, k) => fact(n) / (fact(k) * fact(n - k));
  $("sys1").innerHTML = t("sys1.body", { a: F.num(c(6, 3), 3), b: F.num(2 ** 6, 3) });
  $("sys2").innerHTML = t("sys2.body", { n: F.num(2 * 3 + 1, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wigner", 1927, "idea"], ["gruppentheorie", 1931, "idea"], ["majorana", 1932, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["qubits"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["jm", "c"], ["perm", "a"], ["un", "d"], ["binome", "b"], ["k", "a"], ["sym", "c"], ["verif", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1807 });
})();
</script>
