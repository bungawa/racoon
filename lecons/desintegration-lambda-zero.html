<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = QuantSchro, K = Constantes, ALPHA = 0.75;                // measured: 0,752 ± 0,004 (BESIII 2022), proton angle from the Λ spin

/* ---------- a simulated experiment: N decays of Λ of polarization P, the histogram of cos θ, α estimated ---------- */
(() => {
  const svg = $("histo"), sN = $("sN"), sP = $("sP"), sG = $("sG"), NB = 20;
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
  function draw() {
    const N = Math.round(10 ** +sN.value), P = +sP.value, r = rng(+sG.value * 7919);
    const cs = Array.from({ length: N }, () => S.tirerCosLambda(r(), ALPHA, P)), e = S.estimerAlpha(cs);
    const h = new Array(NB).fill(0); for (const c of cs) h[Math.min(NB - 1, Math.floor((c + 1) / 2 * NB))]++;
    const dens = h.map(n => n / N / (2 / NB)), ymax = 1;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 }, x: { domain: [-1, 1], label: t("fig.x") }, y: { domain: [0, ymax], label: t("fig.y") } });
    dens.forEach((d, i) => { const x0 = -1 + 2 * i / NB, x1 = x0 + 2 / NB, y = Math.min(ymax, d);
      Plot.el("rect", { x: o.x(x0) + 1, y: o.y(y), width: o.x(x1) - o.x(x0) - 2, height: o.y(0) - o.y(y), class: "fill c-tint" }, o.g); });
    Plot.el("path", { d: Plot.path([[o.x(-1), o.y((1 - ALPHA * P) / 2)], [o.x(1), o.y((1 + ALPHA * P) / 2)]]), class: "stroke bold c-ok" }, o.g);
    $("sNr").textContent = F.num(N, 5); $("sPr").textContent = F.fix(P, 2); $("sGr").textContent = F.num(+sG.value, 2);
    $("va").textContent = F.fix(e.alpha / Math.max(P, 1e-9), 2) + " ± " + F.fix(e.ecart / Math.max(P, 1e-9), 2);
    $("fa").textContent = t("fig.f.a", { m: F.fix(e.alpha, 3) });
    const z = (e.alpha - ALPHA * P) / e.ecart;
    $("vz").textContent = F.fix(z, 2); $("fz").textContent = t("fig.f.z");
  }
  sN.oninput = sP.oninput = sG.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const tau = 2.631e-10, m = 1115.683, c = K.c;
  $("sys1").innerHTML = t("sys1.body", { tau: F.si(tau, "s"), l: F.si(c * tau, "m"), m: F.num(m, 7) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hopper", 1950, "experiment"], ["wu", 1957, "experiment"], ["star", 2017, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["polarimetre", "cp"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "c"], ["cos", "a"], ["spin", "b"], ["parite", "d"], ["ba", "c"], ["n", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1705 });
})();
</script>
