<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;

/* Convection rolls, in mm and mm·s⁻¹ on screen, SI in the calculation: rolls of width d = 1 cm, U = 1 mm·s⁻¹. */
const D = 0.01, U = 1e-3, K = Math.PI / D, CELL = Circ.CHAMPS.cellules(U, K), MM = 1e3;
const UM = "mm²·s⁻¹";
(() => {
  const rmax = 2 * U * K, a = D / 10;
  $("sys").innerHTML = t("sys.body", { d: F.num(D * MM, 1), U: F.num(U * MM, 1), rot: F.fix(rmax, 2), a: F.num(a * MM, 1), ka: F.fix(K * a, 2), err: F.sci(1 - Circ.rapportCellules(K, a), 1) });
})();

/* the field drawn in a 18 mm × 10 mm window, 32 px per mm, y up */
const S = 32, X = x => 32 + S * x, Y = y => 340 - S * y;
const arrows = svg => {
  for (let x = 0.5; x < 18.5; x += 1) for (let y = 0.5; y < 10; y += 1) {
    const v = CELL.F([x / MM, y / MM]), n = Math.hypot(v[0], v[1]); if (!(n > 0)) continue;
    const L = 0.45 * n / U, ux = v[0] / n, uy = v[1] / n;
    Plot.fleche(svg, [X(x - L * ux), Y(y - L * uy)], [X(x + L * ux), Y(y + L * uy)], { cls: "c-label-2", tete: 4, trait: "stroke thin" });
  }
};

/* ---------- one square, shrinking ---------- */
(() => {
  const svg = $("cell"), sx = $("sx"), sy = $("sy"), sa = $("sa");
  const side = () => Math.pow(10, -1 + 1.7 * sa.value / 100);            // 0,1 mm to 5 mm
  /* error plot: relative error of (3.36) against ka, log-log */
  const chart = $("err");
  const { x, y, g } = Plot.axes(chart, { fmt: F, w: 640, h: 260, pad: { b: 44 },
    x: { scale: "log", domain: [0.01, 3], label: t("err.x") }, y: { scale: "log", domain: [1e-6, 1], label: t("err.y") } });
  let d = "";
  for (let i = 0; i <= 200; i++) { const ka = Math.pow(10, -2 + i * Math.log10(300) / 200), e = 1 - Math.pow(Math.sin(ka / 2) / (ka / 2), 2);
    d += (i ? "L" : "M") + x(ka).toFixed(1) + " " + y(Math.max(e, 1e-6)).toFixed(1); }
  P("path", { d, class: "curve" }, g);
  let r = "";
  for (let i = 0; i <= 1; i++) { const ka = [0.01, 3][i]; r += (i ? "L" : "M") + x(ka).toFixed(1) + " " + y(Math.max(ka * ka / 12, 1e-6)).toFixed(1); }
  P("path", { d: r, class: "ref" }, g);
  const dot = P("circle", { r: 6, class: "dot" }, g);
  function draw() {
    const a = side(), c = [+sx.value / MM, +sy.value / MM], A = a / MM;
    svg.innerHTML = ""; arrows(svg);
    const s = Circ.carre(CELL.F, c, A, 200), rot = CELL.rot(c);
    /* the four sides, each coloured by the sign of its contribution, numbered as in (3.31) */
    const h = a / 2, [cx, cy] = [+sx.value, +sy.value];
    const Q = [[cx - h, cy - h], [cx + h, cy - h], [cx + h, cy + h], [cx - h, cy + h], [cx - h, cy - h]];
    for (let k = 0; k < 4; k++) {
      const cls = Math.abs(s.cotes[k]) < 1e-15 ? "c-label-2" : s.cotes[k] > 0 ? "c-tint" : "c-warn";
      P("line", { x1: X(Q[k][0]), y1: Y(Q[k][1]), x2: X(Q[k + 1][0]), y2: Y(Q[k + 1][1]), class: "stroke bold " + cls }, svg);
      const mx = (Q[k][0] + Q[k + 1][0]) / 2, my = (Q[k][1] + Q[k + 1][1]) / 2, off = [[0, -0.45], [0.45, 0], [0, 0.45], [-0.45, 0]][k];
      if (a > 0.6) P("text", { x: X(mx + off[0]), y: Y(my + off[1]) + 4, "text-anchor": "middle" }, svg).textContent = String(k + 1);
    }
    const e = s.parAire / rot - 1;
    $("sxr").textContent = F.qty(F.fix(cx, 1), "mm"); $("syr").textContent = F.qty(F.fix(cy, 1), "mm"); $("sar").textContent = F.qty(F.num(a, 2), "mm");
    $("vcotes").textContent = F.qty(F.num(s.total * 1e6, 3), UM);
    $("fcotes").textContent = t("sq.f.cotes", { c: s.cotes.map(v => F.num(v * 1e6, 2)).join(" ; ") });
    $("vrot").textContent = F.qty(F.num(rot * A * A * 1e6, 3), UM);
    $("frot").textContent = t("sq.f.rot", { r: F.fix(rot, 3) });
    const tiny = Math.abs(rot) < 1e-3 * 2 * U * K;
    $("vecart").textContent = tiny ? "–" : F.sci(Math.abs(e), 1);
    $("fecart").textContent = tiny ? t("sq.f.nul") : t("sq.f.ecart", { ka: F.fix(K * A, 3), th: F.sci(1 - Circ.rapportCellules(K, A), 1) });
    const ka = K * A, ee = 1 - Circ.rapportCellules(K, A);
    dot.setAttribute("cx", x(Math.min(Math.max(ka, 0.01), 3))); dot.setAttribute("cy", y(Math.max(ee, 1e-6)));
  }
  [sx, sy, sa].forEach(s => s.oninput = draw); draw();
})();

/* ---------- Stokes: a square cut into N × N squares ---------- */
(() => {
  const svg = $("grid"), gn = $("gn"), x0 = 2, y0 = 2, x1 = 14, y1 = 8;          // mm
  function draw() {
    const n = +gn.value, dx = (x1 - x0) / n, dy = (y1 - y0) / n;
    svg.innerHTML = ""; arrows(svg);
    let somme = 0, rotSum = 0;
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const cx = x0 + (i + 0.5) * dx, cy = y0 + (j + 0.5) * dy, c = [cx / MM, cy / MM];
      const g = AnaVec.circulation(CELL.F, AnaVec.rectangle((cx - dx / 2) / MM, (cy - dy / 2) / MM, (cx + dx / 2) / MM, (cy + dy / 2) / MM), 400);
      somme += g; rotSum += CELL.rot(c) * dx * dy / (MM * MM);
      P("rect", { x: X(cx - dx / 2), y: Y(cy + dy / 2), width: S * dx, height: S * dy, class: "fill " + (g >= 0 ? "c-tint" : "c-warn"), "fill-opacity": Math.min(0.45, 0.08 + 0.4 * Math.abs(g) / (2 * U * K * dx * dy / (MM * MM))).toFixed(2) }, svg);
      P("rect", { x: X(cx - dx / 2), y: Y(cy + dy / 2), width: S * dx, height: S * dy, class: "stroke thin c-label-2" }, svg);
    }
    P("rect", { x: X(x0), y: Y(y1), width: S * (x1 - x0), height: S * (y1 - y0), class: "stroke bold c-label" }, svg);
    const bord = AnaVec.circulation(CELL.F, AnaVec.rectangle(x0 / MM, y0 / MM, x1 / MM, y1 / MM), 4000);
    $("gnr").textContent = t("grid.nread", { n: n, nn: n * n });
    $("vbord").textContent = F.qty(F.num(bord * 1e6, 5), UM);
    $("vsomme").textContent = F.qty(F.num(somme * 1e6, 5), UM);
    $("vgrot").textContent = F.qty(F.num(rotSum * 1e6, 5), UM);
    $("fgrot").textContent = t("grid.f.rot", { e: F.sci(Math.abs(rotSum / bord - 1), 1) });
  }
  gn.oninput = draw; draw();
})();

/* ---------- history ---------- */
(() => {
  const EVENTS = [["lettre", 1850, "idea"], ["smith", 1854, "idea"], ["maxwell", 1871, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["faraday", "pince"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cotes", "b"], ["taylor", "a"], ["ordre", "c"], ["normale", "d"], ["surface", "a"], ["annule", "b"], ["bloc", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 336 });
})();
</script>
