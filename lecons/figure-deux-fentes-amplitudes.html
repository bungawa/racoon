<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/figure-deux-fentes-amplitudes.js"></script>

<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp;

/* ---------- electrons through two slits, light behind them (Fig. 3-3); lengths in electron wavelengths ---------- */
(() => {
  const O = { lambda: 1, d: 20, a: 4, L: 2000 }, I0 = Q.interfrangeFentes(O.lambda, O.L, O.d);
  const N = 641, XS = Array.from({ length: N }, (_, i) => -4 + 8 * i / (N - 1));   // x in fringe spacings
  const PHI = XS.map(u => Q.amplitudesDeuxFentes(u * I0, O));
  let vue = "total";
  const sb = $("sb"), seg = $("vue"), faux = $("faux");
  function draw() {
    const r = +sb.value, a = 1 / Math.sqrt(1 + r * r), b = r * a;           // a photon is surely seen: |a|² + |b|² = 1
    const R = PHI.map(f => Q.probaTemoinPhoton(f.phi1, f.phi2, a, b));
    const svg = $("courbe"), YM = faux.checked ? 8.4 : 4.2; svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-4, 4], label: t("fig.ax.x") }, y: { domain: [0, YM], label: t("fig.ax.p") } });
    const ligne = (ys, cls) => Plot.el("path", { d: Plot.path(XS.map((u, i) => [ax.x(u), ax.y(Math.min(ys[i], YM))])), class: cls, fill: "none" }, svg);
    ligne(PHI.map(f => f.P12), "stroke thin dash c-label-2");                // no light: |φ1 + φ2|²
    ligne(PHI.map(f => f.somme), "stroke thin c-label-2");                   // slits known: |φ1|² + |φ2|²
    ligne(R.map(q => q[vue]), "stroke bold c-label");
    if (faux.checked) ligne(R.map(q => q.faux), "stroke c-ko");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === vue)));
    $("sbr").textContent = F.num(r, 2);
    $("vV").textContent = F.num(Q.visibiliteTemoin(a, b), 2);
    $("fV").textContent = t("fig.f.V", { a: F.num(a * a, 2), b: F.num(b * b, 2) });
    $("verr").textContent = F.qty(F.num(100 * b * b, 2), "%");
    $("ferr").textContent = t("fig.f.erreur");
    /* the area under each curve over the central fringes, in units of the one without light: probability is not created */
    const aire = ys => ys.reduce((s, v) => s + v, 0);
    $("vaire").textContent = F.num(aire(R.map(q => q.total)) / aire(PHI.map(f => f.P12)), 3);
    $("faire").textContent = t("fig.f.aire", { v: F.num(aire(R.map(q => q.faux)) / aire(PHI.map(f => f.P12)), 3) });
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { vue = x.dataset.v; draw(); });
  sb.oninput = faux.onchange = draw; draw();
})();

/* ---------- the system described: 50 keV electrons, slits 1 µm apart, green light ---------- */
(() => {
  const Ec = 50e3 * Q.e, pe = Q.impulsion(Q.m_e, Ec), le = Q.broglie(pe), d = 1e-6, L = 1, lL = 500e-9;
  const i = Q.interfrangeFentes(le, L, d), recul = (Q.h / lL) / pe, frange = le / d;
  $("sys1").innerHTML = t("sys1.body", { E: F.si(Ec, "J"), le: F.si(le, "m"), i: F.si(i, "m"), lL: F.si(lL, "m"), r: F.num(d / lL, 2),
    recul: F.sci(recul, 2), frange: F.sci(frange, 2), n: F.num(recul / frange, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["tonomura", 1989, "experiment"], ["chapman", 1995, "experiment"], ["durr", 1998, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gravimetre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["bnul", "c"], ["bega", "a"], ["somme", "d"], ["regarder", "b"], ["contraste", "a"], ["longue", "c"], ["aire", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 332 });
})();
</script>
