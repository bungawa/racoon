    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="substrat" data-i18n="red.substrat"></label></div><select id="substrat"></select></div>
        <div class="seg" role="group" id="reactif"><button type="button" data-r="LiAlH4" aria-pressed="true" data-i18n="red.LiAlH4"></button><button type="button" data-r="NaBH4" aria-pressed="false" data-i18n="red.NaBH4"></button><button type="button" data-r="hydrolyse" aria-pressed="false" data-i18n="red.hydrolyse"></button></div>

      <div class="panel">
        <div class="ctl"><div class="row"><label for="masse" data-i18n="red.masse"></label><output id="massev" for="masse"></output></div>
          <input id="masse" type="range" min="1" max="20" step="0.5" value="10"></div>
        <div class="ctl"><div class="row"><label for="exces" data-i18n="red.exces"></label><output id="excesv" for="exces"></output></div>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>

<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>

<script src="/racoon/lecons/probabilites.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, sym = s => t("chim.sym", { s }), $ = id => document.getElementById(id);
const peindre = (svg, m, o) => { const d = O.dessin(m, Object.assign({ texte: sym }, o)); svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };
const svgVide = aria => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("class", "fig no-sigle"); s.setAttribute("role", "img"); s.setAttribute("aria-label", aria); return s; };
const signe = n => (n > 0 ? "+" : n < 0 ? "\u2212" : "") + Math.abs(n);

/* ---------- réduire ou hydrolyser : produits, hydrures, nombres d'oxydation, masses ---------- */
(() => {
  const IDS = Object.keys(O.TRANSFORMATIONS), PRODUITS = ["butan1ol", "butan2ol", "ethanol", "eau", "butanamine", "dimethylbutanamine", "acideButanoique", "ammoniac", "dimethylamine"];
  const noms = textOf("red.noms", IDS.concat(PRODUITS));
  $("substrat").innerHTML = IDS.map(id => `<option value="${id}">${noms[id]}</option>`).join("");
  let r = "LiAlH4";
  const no = m => O.nombreOxydation(m, O.carboneFonctionnel(m));
  function maj() {
    const id = $("substrat").value, s = O.molecule(id), p = O.TRANSFORMATIONS[id][r];
    $("bilan").innerHTML = "";
    const add = (m, nom) => { const v = svgVide(nom); $("bilan").appendChild(v); if (m.atomes.length > 1) peindre(v, m, { surligne: [O.carboneFonctionnel(m)], echelle: 28 });
      else { v.classList.add("seul"); peindre(v, m, { etiquettes: { 0: t("red.formule." + m.atomes[0].e) }, echelle: 28 }); } };
    const mot = k => { const e = document.createElement("span"); e.className = "aux"; e.textContent = t(k); $("bilan").appendChild(e); };
    add(s, noms[id]);
    mot("red.fleche");
    if (p) p.forEach((q, k) => { if (k) mot("red.plus"); add(O.molecule(q), noms[q]); });
    else mot("red.rien");
    const h = O.hydruresConsommes(s), n1 = no(s);
    if (!p) $("redlecture").textContent = t("red.lecture.rien." + r, { s: noms[id] });
    else if (r === "hydrolyse") $("redlecture").textContent = t("red.lecture.hyd", { s: noms[id], p: p.map(q => noms[q]).join(t("red.et")), n: signe(n1) });
    else $("redlecture").textContent = t("red.lecture.red", { s: noms[id], p: p.map(q => noms[q]).join(t("red.et")), h: h.carbone, hm: h.mobiles, n1: signe(n1), n2: signe(no(O.molecule(p[0]))) });
    document.querySelectorAll("#reactif button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.r === r)));
    /* masses : pour LiAlH₄ seulement */
    const m = +$("masse").value * 1e-3, ex = +$("exces").value / 100, M = O.masseMolaire(O.formuleBrute(s)), n = m / M;
    $("massev").textContent = t("red.g", { m: F.fix(m * 1e3, 1) }); $("excesv").textContent = t("red.pc", { x: F.fix(ex * 100, 0) });
    const mL = O.masseLiAlH4(m, M, h.total, ex), nLAH = mL / O.masseMolaire(O.LIALH4);
    $("mlah").textContent = t("red.g", { m: F.num(mL * 1e3, 3) });
    $("h2r").textContent = t("red.L", { v: F.num(O.dihydrogeneTrempe(n * h.mobiles / 4).V * 1e3, 3) });
    $("h2t").textContent = t("red.L", { v: F.num(O.dihydrogeneTrempe(nLAH * ex / (1 + ex)).V * 1e3, 3) });
  }
  $("substrat").onchange = maj;
  $("reactif").onclick = e => { const b = e.target.closest("button"); if (!b) return; r = b.dataset.r; maj(); };
  ["masse", "exces"].forEach(id => { $(id).oninput = maj; });
  $("substrat").value = "butanoateEthyle";
  maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["finholt", 1947, "experiment"], ["nystrom", 1947, "experiment"], ["borohydrure", 1953, "experiment"], ["nobel", 1979, "use"], ["acrylamide", 1985, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["fieser", "acrylamide"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ester", "b"], ["nabh4", "d"], ["acide", "c"], ["amide", "a"], ["nitrile", "b"], ["oxydation", "c"], ["hydrolyse", "d"], ["trempe", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
