<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, S = QuantSchro, K = Constantes, A = K.e;

/* ---------- the mean parity ⟨P⟩ = 2 Re(C₁* C₂): constant while P commutes with H ---------- */
(() => {
  const svg = $("courbe"), sM = $("sM"), sD = $("sD"), T = 2 * K.h / (2 * A);
  function draw() {
    const m = +sM.value, d = +sD.value, H = [[d * A / 2, -A], [-A, -d * A / 2]];
    const cI = Math.sqrt((1 + m) / 2), cII = Math.sqrt((1 - m) / 2), s2 = Math.SQRT1_2;   // ⟨P⟩ = cI² − cII² = m at t = 0
    const psi0 = [s2 * (cI + cII), s2 * (cI - cII)];                                       // in the base |1⟩, |2⟩
    const par = v => 2 * Cx.mul(Cx.conj(v[0]), v[1]).re, site = v => Cx.abs2(v[0]) - Cx.abs2(v[1]);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 }, x: { domain: [0, T * 1e15], label: t("fig.x") }, y: { domain: [-1, 1], label: t("fig.y") } });
    const pp = [], ps = []; let lo = 1, hi = -1;
    for (let k = 0; k <= 300; k++) {
      const tt = T * k / 300, v = Q.evolutionExacte(H, psi0, tt), p = par(v);
      pp.push([o.x(tt * 1e15), o.y(p)]); ps.push([o.x(tt * 1e15), o.y(site(v))]); lo = Math.min(lo, p); hi = Math.max(hi, p);
    }
    Plot.el("path", { d: Plot.path(ps), class: "stroke dash c-tint" }, o.g);
    Plot.el("path", { d: Plot.path(pp), class: "stroke bold c-ok" }, o.g);
    $("sMr").textContent = F.fix(m, 2); $("sDr").textContent = F.fix(d, 2);
    $("vp").textContent = F.fix(lo, 3) + " … " + F.fix(hi, 3); $("fp").textContent = t("fig.f.p");
    $("vc").textContent = F.si(S.normeCommutateur([[0, 1], [1, 0]], H), "J"); $("fc").textContent = t("fig.f.com");
  }
  sM.oninput = sD.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["leeyang", 1956, "idea"], ["wu", 1957, "experiment"], ["cp", 1964, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["spectro", "edm"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["phase", "c"], ["pm", "a"], ["definie", "d"], ["degen", "b"], ["un", "c"], ["brise", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1702 });
})();
</script>
