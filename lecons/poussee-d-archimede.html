    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mover accent="true"><mi mathvariant="normal">Π</mi><mo>→</mo></mover><mo>=</mo><mo>−</mo><msub><mi>ρ</mi><mi mathvariant="normal">f</mi></msub><mspace width="0.15em"></mspace><msub><mi>V</mi><mi data-i18n="eq.im"></mi></msub><mspace width="0.15em"></mspace><mover accent="true"><mi>g</mi><mo>→</mo></mover></math></div>
    <p class="validite" data-i18n-html="val.pi"></p>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mfrac><msub><mi>V</mi><mi data-i18n="eq.im"></mi></msub><mi>V</mi></mfrac><mo>=</mo><mfrac><msub><mi>ρ</mi><mi mathvariant="normal">c</mi></msub><msub><mi>ρ</mi><mi mathvariant="normal">f</mi></msub></mfrac></math></div>
    <p class="validite" data-i18n-html="val.flot"></p>
    <figure class="chart">
      <div class="seg" role="group" data-i18n-attr="aria-label:flot.fluide">
        <button type="button" id="f-eau" aria-pressed="false"></button>
        <button type="button" id="f-eauDeMer" aria-pressed="true"></button>
        <button type="button" id="f-mercure" aria-pressed="false"></button>
      </div>
      <svg class="fig" id="flot" viewBox="0 0 640 260" role="img" data-i18n-attr="aria-label:flot.aria"></svg>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="rc" data-i18n="flot.rc"></label><output id="rcv" for="rc"></output></div>
          <input id="rc" type="range" min="50" max="3000" step="0.1" value="916.7"></div>
        <div class="controls"><button class="btn tinted" type="button" id="glace" data-i18n="flot.glace"></button></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="flot.k.im"></span><span class="v" id="vim"></span><span class="f" id="fim"></span></div>
          <div class="stat"><span class="k" data-i18n="flot.k.r"></span><span class="v" id="vr"></span><span class="f" id="fr"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="flot.caption"></figcaption>
    </figure>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><msub><mi>V</mi><mi mathvariant="normal">a</mi></msub><mo>=</mo><msub><mi>V</mi><mrow><mi mathvariant="normal">a</mi><mn>0</mn></mrow></msub><mfrac><msub><mi>p</mi><mi data-i18n="eq.atm"></mi></msub><mrow><msub><mi>p</mi><mn>0</mn></msub><mo>+</mo><mi>ρ</mi><mi>g</mi><mi>h</mi></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.ludion"></p>
    <figure class="chart">
      <svg class="fig" id="lud" viewBox="0 0 640 300" role="img" data-i18n-attr="aria-label:lud.aria"></svg>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="dp" data-i18n="lud.dp"></label><output id="dpv" for="dp"></output></div>
          <input id="dp" type="range" min="0" max="20" step="0.1" value="0"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="lud.k.etat"></span><span class="v" id="vet"></span><span class="f" id="fet"></span></div>
          <div class="stat"><span class="k" data-i18n="lud.k.Va"></span><span class="v" id="vva"></span></div>
          <div class="stat"><span class="k" data-i18n="lud.k.F"></span><span class="v" id="vf"></span></div>
        </div>

    </figure>
    <div class="box rem"><b data-i18n="s3.sys.title"></b>
      <p data-i18n-html="s3.sys.body"></p>

  <section class="card">

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/poussee-d-archimede.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/fluides.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, Fl = Fluides, g = Constantes.g0;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const pct = x => F.qty(F.fix(100 * x, 1), "%");

/* ---------- un bloc qui flotte ---------- */
(() => {
  const FLUIDES = ["eau", "eauDeMer", "mercure"], NAMES = textOf("flot.fluides", FLUIDES), svg = $("flot");
  let fl = "eauDeMer";
  function upd() {
    const rc = +$("rc").value, rf = Fl.RHO[fl], f = Fl.fractionImmergee(rc, rf), coule = rc >= rf;
    FLUIDES.forEach(id => $("f-" + id).setAttribute("aria-pressed", String(id === fl)));
    $("rcv").textContent = F.qty(F.num(rc, 4), "kg·m⁻³");
    $("vim").textContent = pct(f); $("fim").textContent = coule ? t("flot.f.coule") : t("flot.f.emerge", { e: pct(1 - f) });
    $("vr").textContent = F.num(rf / rc, 3); $("fr").textContent = t(coule ? "flot.f.lourd" : "flot.f.leger");
    /* drawing: a liquid layer, a block of side 120 px floating with fraction f immersed, or resting on the bottom */
    svg.innerHTML = "";
    const ys = 90, yb = 240, x0 = 40, x1 = 600, s = 120, bx = 260;
    P("rect", { x: x0, y: ys, width: x1 - x0, height: yb - ys, class: "area" }, svg);
    P("line", { x1: x0, y1: ys, x2: x1, y2: ys, class: "stroke thin c-tint" }, svg);
    P("line", { x1: x0, y1: yb, x2: x1, y2: yb, class: "stroke c-label-2" }, svg);
    const top = coule ? yb - s : ys - (1 - f) * s;
    P("rect", { x: bx, y: top, width: s, height: s, class: "stroke bold c-label" }, svg);
    if (!coule) P("line", { x1: bx, y1: ys, x2: bx + s, y2: ys, class: "stroke dash c-warn" }, svg);
    const yc = coule ? top + s / 2 : ys + f * s / 2, ym = top + s / 2;     // centre of buoyancy, centre of mass
    const L = 60, piSurP = coule ? rf / rc : 1;                     // floating, the buoyancy equals the weight
    Plot.fleche(svg, [bx + s / 2 + 18, yc], [bx + s / 2 + 18, yc - L * piSurP], { cls: "c-tint" });
    Plot.fleche(svg, [bx + s / 2 - 18, ym], [bx + s / 2 - 18, ym + L], { cls: "c-warn" });
    P("text", { x: bx + s / 2 + 26, y: yc - 40, "text-anchor": "start" }, svg).textContent = t("flot.Pi");
    P("text", { x: bx + s / 2 - 26, y: ym + 50, "text-anchor": "end" }, svg).textContent = t("flot.P");
  }
  $("rc").oninput = upd;
  $("glace").onclick = () => { $("rc").value = Fl.RHO.glace; upd(); };
  FLUIDES.forEach(id => { $("f-" + id).textContent = NAMES[id]; $("f-" + id).onclick = () => { fl = id; upd(); }; });
  upd();
})();

/* ---------- le ludion ---------- */
(() => {
  const LUD = { m: 3e-3, Vs: 1.2e-6, Va0: 2e-6 }, HB = 0.3, svg = $("lud"), atm = Constantes.atm;
  let bas = false;                                                  // the diver keeps its place until the force changes sign
  function upd() {
    const dp = +$("dp").value * 1000, o = Object.assign({ p0: atm + dp }, LUD);
    if (!bas && Fl.ludion(o, 0).F < 0) bas = true;
    if (bas && Fl.ludion(o, HB).F > 0) bas = false;
    const h = bas ? HB : 0, d = Fl.ludion(o, h), c = Fl.ludionCritique(LUD);
    $("dpv").textContent = F.si(dp, "Pa");
    $("vet").textContent = t(bas ? "lud.bas" : "lud.haut");
    $("fet").textContent = t("lud.f.seuil", { c: F.si(c.dp, "Pa"), r: F.si(c.dp - Fl.pressionProfondeur(HB, { p0: 0 }), "Pa") });
    $("vva").textContent = F.qty(F.num(d.Va * 1e6, 3), "mL");
    $("vf").textContent = F.si(d.F, "N");
    /* drawing: a bottle, the diver as a tube, its air in the top part */
    svg.innerHTML = "";
    const bx = 240, bw = 160, top = 40, bot = 280, ys = 60;
    P("rect", { x: bx, y: top, width: bw, height: bot - top, rx: 14, class: "stroke c-label-2" }, svg);
    P("rect", { x: bx + 2, y: ys, width: bw - 4, height: bot - ys - 2, class: "area" }, svg);
    if (dp > 0) { Plot.fleche(svg, [bx - 60, 160], [bx - 4, 160], { cls: "c-warn" }); Plot.fleche(svg, [bx + bw + 60, 160], [bx + bw + 4, 160], { cls: "c-warn" }); }
    const tube = 90, tw = 28, tx = bx + bw / 2 - tw / 2, ty = bas ? bot - tube - 4 : ys - 6;
    const air = tube * d.Va / (LUD.Va0 + LUD.Vs);
    P("rect", { x: tx, y: ty, width: tw, height: tube, class: "stroke c-label" }, svg);
    P("rect", { x: tx + 2, y: ty + 2, width: tw - 4, height: Math.max(air - 2, 1), class: "fill c-label-2" }, svg);
    P("text", { x: bx + bw + 20, y: 290, "text-anchor": "start" }, svg).textContent = t("lud.hb");
  }
  $("dp").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["archimede", -250, "idea"], ["moerbeke", 1269, "idea"], ["stevin", 1586, "idea"], ["trieste", 1960, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["argo", "sousmarin", "densimetre"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["origine", "a"], ["profondeur", "c"], ["iceberg", "b"], ["fond", "d"], ["mer", "a"], ["ludion", "b"], ["air", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
