  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><msub><mi>r</mi><mi data-i18n="eq.pred"></mi></msub><mo>=</mo><mfrac><mi>C</mi><mrow><mn>2</mn><mi>π</mi></mrow></mfrac></math><span class="n">(42.1)</span></div>
    <p class="validite" data-i18n-html="val.42.1"></p>

    <p class="validite" data-i18n-html="val.42.2"></p>

    <div class="eq"><math display="block"><mi>α</mi><mo>+</mo><mi>β</mi><mo>+</mo><mi>γ</mi><mo>−</mo><mi>π</mi><mo>=</mo><mi>K</mi><mi>A</mi></math></div>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure class="chart">
      <svg id="trace" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.exact"></span><span class="c-warn" data-i18n="fig.legend.petit"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" role="group" id="mode">
            <button type="button" data-m="plan" data-i18n="fig.plan"></button>
            <button type="button" data-m="sphere" data-i18n="fig.sphere"></button>
            <button type="button" data-m="plaque" data-i18n="fig.plaque"></button>
            <button type="button" data-m="selle" data-i18n="fig.selle"></button>
            <button type="button" data-m="cylindre" data-i18n="fig.cylindre"></button>
          </div>
          <div class="ctl"><div class="row"><label for="sr" data-i18n="fig.r"></label><output id="srr" for="sr"></output></div>

        <div class="stats">

          <div class="stat"><span class="k" data-i18n-html="fig.k.angles"></span><span class="v" id="vang"></span><span class="f" id="fang"></span></div>

    <p data-i18n-html="s4.p3"></p>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/relat-courbes-2d.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/espaces-courbes.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const E = EspacesCourbes;

/* ---------- ce que mesure l'insecte : cercle, triangle, carré, sur cinq surfaces ---------- */
(() => {
  const R = 1;                                                     // m : rayon de la boule, et l'échelle de la selle
  const KS = { plan: 0, sphere: 1 / R ** 2, plaque: 1 / R ** 2, selle: -1 / R ** 2, cylindre: 0 };
  const trace = $("trace"), sr = $("sr"), seg = $("mode");
  let mode = "sphere";
  /* excès de rayon mesuré : sur la plaque, avec les règles dilatées ; ailleurs, par la géométrie de la surface */
  const exces = (r, m) => {
    if (m !== "plaque") return E.excesRayon(r, KS[m]);
    const c = E.plaqueCercle(E.plaqueRho(r, R), R);
    return c.rMes - E.rayonPredit(c.C);
  };
  function draw() {
    const r = +sr.value / 100, K = KS[mode];
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, 150], label: t("fig.xaxis") }, y: { domain: [-70, 70], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(150), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const rs = Array.from({ length: 146 }, (_, i) => 0.05 + i * 0.01);
    const clip = v => Math.max(-70, Math.min(70, v));
    Plot.el("path", { d: Plot.path(rs.map(x => [P.x(100 * x), P.y(clip(100 * E.excesRayonPetit(x, K)))])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(rs.map(x => [P.x(100 * x), P.y(100 * exces(x, mode))])), class: "curve" }, P.g);
    const ex = exces(r, mode);
    Plot.el("circle", { cx: P.x(100 * r), cy: P.y(100 * ex), r: 5, class: "dot" }, P.g);
    $("srr").textContent = F.qty(F.num(100 * r, 3), "cm");
    $("vex").textContent = F.si(ex, "m");
    $("fex").textContent = mode === "plaque"
      ? t("fig.f.plaque", { rho: F.si(E.plaqueRho(r, R), "m"), l: F.num(E.plaqueCercle(E.plaqueRho(r, R), R).lambda, 3) })
      : t("fig.f.exces", { p: F.si(E.excesRayonPetit(r, K), "m") });
    const somme = E.sommeAngles(r, K) * 180 / Math.PI;
    $("vang").textContent = F.num(somme, 4) + "\u00a0°";
    $("fang").textContent = t("fig.f.angles", { e: F.num(somme - 180, 3) });
    const gap = E.ecartCarre(r, K);
    $("vcar").textContent = gap === 0 ? t("fig.ferme") : F.si(gap, "m");
    $("fcar").textContent = t("fig.f.carre", { p: F.num(100 * gap / r, 3) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; draw(); });
  sr.oninput = draw; draw();
})();

/* ---------- le système décrit : un champ, un pays, sur la Terre ---------- */
(() => {
  const R = Constantes.R_E_mean, K = 1 / R ** 2, arcsec = Math.PI / 648000;
  const champ = 1e6, gauss = 2.929e9;                              // m² : 1 km² ; triangle de Gauss, 69, 85 et 107 km (Héron)
  $("sys1").innerHTML = t("sys1.body", { R: F.qty(F.num(R / 1000, 4), "km"), e1: F.sci(K * champ / arcsec, 2), a1: F.qty(F.num(arcsec / K / 1e6, 3), "km²"),
    e2: F.num(K * gauss / arcsec, 3), r: F.si(E.excesRayonPetit(1e4, K), "m") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["legendre", 1787, "idea"], ["gauss-mesure", 1821, "experiment"], ["egregium", 1827, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["routes", "cartes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["droite", "c"], ["cercle", "a"], ["cylindre", "d"], ["selle", "b"], ["plaque", "c"], ["petit", "a"], ["triangle", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 421 });
})();
</script>
