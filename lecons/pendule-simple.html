<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const DEG = Math.PI / 180, L = 1, M = 0.514, W = Pendule.pulsation(L), T0 = 2 * Math.PI / W, G = Pendule.G;
const deg = a => F.num(a / DEG, 3) + "°";
const pct = (r, sig) => (r < 0 ? F.MINUS : "") + F.qty(F.num(Math.abs(r) * 100, sig || 2), "%");

/* ---------- §1 : le schéma, la base polaire et le poids ---------- */
(() => {
  const svg = $("schema"), Wd = 640, H = 340, O = [320, 140], R = 110, K = 70;    // pivot in the middle: θ up to 180°
  const arrow = (g, A, B, cls) => Plot.fleche(g, A, B, { cls, tete: 7, ouverte: true });
  const label = (g, x, y, s) => { Plot.el("text", { x, y, "text-anchor": "middle" }, g).textContent = s; };
  function upd() {
    const th = +$("sth").value * DEG;
    svg.setAttribute("viewBox", "0 0 " + Wd + " " + H); svg.innerHTML = "";
    const g = Plot.el("g", {}, svg);
    /* screen: x right, y down; u_r points from the pivot to the bob */
    const ur = [Math.sin(th), Math.cos(th)], ut = [Math.cos(th), -Math.sin(th)], B = [O[0] + R * ur[0], O[1] + R * ur[1]];
    Plot.el("line", { x1: O[0], y1: O[1], x2: O[0], y2: O[1] + R + 20, class: "stroke thin dash c-label-2" }, g);
    Plot.el("path", { d: path(Array.from({ length: 31 }, (_, i) => { const a = th * i / 30; return [O[0] + 34 * Math.sin(a), O[1] + 34 * Math.cos(a)]; })), class: "stroke thin c-label-2" }, g);
    label(g, O[0] + 46 * Math.sin(th / 2), O[1] + 46 * Math.cos(th / 2) + 4, "θ");
    Plot.el("line", { x1: O[0], y1: O[1], x2: B[0], y2: B[1], class: "stroke c-label" }, g);
    Plot.el("circle", { cx: O[0], cy: O[1], r: 3, class: "fill c-label" }, g);
    arrow(g, B, [B[0] + 36 * ur[0], B[1] + 36 * ur[1]], "c-tint"); label(g, B[0] + 48 * ur[0], B[1] + 48 * ur[1] + 4, "r");
    arrow(g, B, [B[0] + 36 * ut[0], B[1] + 36 * ut[1]], "c-tint"); label(g, B[0] + 48 * ut[0], B[1] + 48 * ut[1] + 4, "θ");
    arrow(g, B, [B[0], B[1] + K], "c-warn"); label(g, B[0] + 10, B[1] + K + 4, "P");
    const cr = K * Math.cos(th), ct = -K * Math.sin(th);                               // components of the weight on u_r, u_θ
    if (Math.abs(cr) > 3) arrow(g, B, [B[0] + cr * ur[0], B[1] + cr * ur[1]], "c-label-2 dash");
    if (Math.abs(ct) > 3) arrow(g, B, [B[0] + ct * ut[0], B[1] + ct * ut[1]], "c-label-2 dash");
    Plot.el("circle", { cx: B[0], cy: B[1], r: 9, class: "fill c-label" }, g);
    $("sthv").textContent = deg(th);
    $("vtan").textContent = F.si(-M * G * Math.sin(th) + 0, "N", { sig: 3 });
    $("vlin").textContent = F.si(-M * G * th + 0, "N", { sig: 3 });
    $("vrad").textContent = F.si(M * G * Math.cos(th) + 0, "N", { sig: 3 });
  }
  $("sth").oninput = upd; upd();
})();

/* ---------- §4 : linéarisation, calcul pas à pas contre cos ω₀t ---------- */
(() => {
  const svg = $("lin");
  function upd() {
    const th0 = +$("lth").value * DEG, T = Pendule.periode(W, th0), TEND = 3 * T0;
    const run = Pendule.trajectoire(W, th0, 0, { h: T0 / 600, duree: TEND });
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 48 }, x: { domain: [0, TEND], label: t("lin.xaxis") }, y: { domain: [-1.1, 1.1], label: t("lin.yaxis") } });
    Plot.el("path", { d: path(run.t.map(tt => [o.x(tt), o.y(Math.cos(W * tt))])), class: "ref" }, o.g);
    Plot.el("path", { d: path(run.t.map((tt, k) => [o.x(tt), o.y(run.th[k] / th0)])), class: "curve" }, o.g);
    $("lthv").textContent = deg(th0);
    $("vforce").textContent = pct(Pendule.ecartForce(th0), 2);
    $("vT").textContent = F.si(T, "s", { sig: 4 });
    $("fT").textContent = t("lin.f.T", { T0: F.si(T0, "s", { sig: 4 }), e: pct(T / T0 - 1, 2) });
    $("vret").textContent = F.si(10 * (T - T0), "s", { sig: 2 });
  }
  $("lth").oninput = upd; upd();
})();

/* ---------- §5 : la tension du fil, lancé du bas à la vitesse v₀ ---------- */
(() => {
  const svg = $("fil");
  function upd() {
    const u = +$("fv").value / 100, v0 = u * Math.sqrt(G * L), r = Pendule.tension({ m: M, l: L, v0 });
    /* the angle a rigid rod reaches: the top if v₀² ≥ 4gℓ */
    const reach = u * u >= 4 ? Math.PI : Math.acos(1 - u * u / 2), N = 120;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 48 }, x: { domain: [0, 180], label: t("fil.xaxis") }, y: { domain: [-2, 10], label: t("fil.yaxis") } });
    Plot.el("line", { x1: o.x(0), x2: o.x(180), y1: o.y(0), y2: o.y(0), class: "ref" }, o.g);
    if (u > 0) Plot.el("path", { d: path(Array.from({ length: N + 1 }, (_, i) => { const th = reach * i / N; return [o.x(th / DEG), o.y(r.T(th) / (M * G))]; })), class: "curve" }, o.g);
    if (r.regime === "decroche") Plot.el("circle", { cx: o.x(r.angleDecroche / DEG), cy: o.y(0), r: 5, class: "dot" }, o.g);
    $("fvv").textContent = t("fil.v0v", { u: F.num(u, 3), v: F.si(v0, "m·s⁻¹", { sig: 3 }) });
    $("vreg").textContent = t("fil.regime." + r.regime);
    $("freg").textContent = r.regime === "decroche" ? t("fil.f.decroche", { a: deg(r.angleDecroche), v: F.si(r.vDecroche, "m·s⁻¹", { sig: 3 }) })
      : r.regime === "oscillation" ? t("fil.f.oscillation", { a: deg(r.angleMax) }) : t("fil.f.revolution", { T: F.si(r.T(Math.PI), "N", { sig: 3 }) });
    $("vbas").textContent = F.si(r.T(0), "N", { sig: 3 });
  }
  $("fv").oninput = upd; upd();
})();

/* ---------- §5 : bilan chiffré de ce que l'on néglige ---------- */
(() => {
  const B = Pendule.penduleReel({ l: L, r: 0.025, m: M }), Q = Pendule.qAir({ m: M, d: 0.05, l: L, theta0: 10 * DEG });
  const P = Pendule.foucault(48.846188 * DEG), C = Pendule.coriolis(L);
  const ITEMS = [["boule", F.sci(B.ecart, 2)], ["air", F.sci(2 * Math.PI / Q.Q, 2)], ["coriolis", F.sci(C, 2)], ["foucault", F.si(P.periode / 3600, "h", { sig: 3 })]];
  const txt = textOf("bilan.items", ITEMS.map(i => i[0]));
  $("bilan").innerHTML = ITEMS.map(([id, v]) => `<div><span class="k">${v}</span><span>${txt[id]}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["galilee1602", 1602, "experiment"], ["galilee1638", 1638, "idea"], ["huygens1656", 1656, "use"], ["richer1672", 1672, "experiment"], ["foucault1851", 1851, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pantheon", "gravimetrie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tension", "c"], ["energie", "b"], ["masse", "a"], ["lineaire", "d"], ["fil", "b"], ["lune", "c"], ["boule", "a"]];
