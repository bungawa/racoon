<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, P = Plot.el, DEG = Math.PI / 180, MIN = DEG / 60;

/* ---------- sténopé contre lentille : flou et lumière en fonction de l'ouverture ---------- */
(() => {
  const svg = $("stenope"), W = 640, H = 320, sd = $("dd"), sl = $("ll"), cb = $("lent"), LAMBDA = 550e-9;
  const Ds = Array.from({ length: 301 }, (_, i) => Math.pow(10, -2 + i * 0.01) * 1e-3);      // 10 µm à 10 mm
  const ang = v => v >= DEG ? F.num(v / DEG, 2) + "°" : F.num(v / MIN, 2) + "′";
  function draw() {
    const D = Math.pow(10, +sd.value) * 1e-3, L = Math.pow(10, +sl.value) * 1e-3, lent = cb.checked, o = { L, lambda: LAMBDA };
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: W, h: H, x: { scale: "log", domain: [0.01, 10], label: t("st.ax.x"), fmt: v => F.num(v, 3) },
      y: { scale: "log", domain: [0.001, 100], label: t("st.ax.y"), fmt: v => F.num(v, 3) } });
    const cy = v => ax.y(Math.min(100, Math.max(0.001, v / DEG)));
    /* la pupille du nautile, 0,4 à 2,8 mm */
    P("rect", { x: ax.x(0.4), y: ax.y(100), width: ax.x(2.8) - ax.x(0.4), height: ax.y(0.001) - ax.y(100), class: "area" }, svg);
    P("text", { x: ax.x(1.06), y: ax.y(100) + 14, class: "tick", "text-anchor": "middle" }, svg).textContent = t("st.lbl.nautile");
    P("path", { d: Plot.path(Ds.map(d => [ax.x(d * 1e3), cy(O.flouStenope(d, o).geo)])), class: "stroke thin c-label-2" }, svg);
    P("path", { d: Plot.path(Ds.map(d => [ax.x(d * 1e3), cy(O.flouStenope(d, Object.assign({ lentille: true }, o)).total)])), class: (lent ? "stroke bold" : "stroke thin") + " c-warn" }, svg);
    P("path", { d: Plot.path(Ds.map(d => [ax.x(d * 1e3), cy(O.flouStenope(d, o).total)])), class: (lent ? "stroke thin" : "stroke bold") + " c-tint" }, svg);
    const opt = O.optimumStenope(L, LAMBDA), f = O.flouStenope(D, Object.assign({ lentille: lent }, o));
    P("line", { x1: ax.x(opt.D * 1e3), x2: ax.x(opt.D * 1e3), y1: ax.y(100), y2: ax.y(0.001), class: "stroke thin dash c-tint" }, svg);
    P("circle", { cx: ax.x(D * 1e3), cy: cy(f.total), r: 5, class: "fill " + (lent ? "c-warn" : "c-tint") }, svg);
    $("ddr").textContent = F.si(D, "m"); $("llr").textContent = F.si(L, "m");
    $("vf").textContent = ang(f.total);
    $("ff").textContent = t(lent ? "st.f.lentille" : "st.f.trou");
    $("vl").textContent = f.eclairement >= 0.01 ? F.num(f.eclairement, 2) : t("st.v.frac").replace("{n}", F.num(1 / f.eclairement, 2));
    $("fl").textContent = t("st.f.lum");
    $("vo").textContent = F.si(opt.D, "m");
    $("fo").textContent = t("st.f.opt").replace("{a}", ang(opt.angle)).replace("{r}", F.si(opt.rayleigh, "m"));
  }
  sd.oninput = sl.oninput = cb.onchange = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["darwin", 1871, "idea"], ["rayleigh", 1891, "experiment"], ["pelger", 1994, "idea"], ["messenger", 1996, "experiment"], ["calmar", 2012, "experiment"], ["squille", 2014, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["eclipse", "photo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["paon", "c"], ["mammiferes", "a"], ["squille", "d"], ["nautile", "b"], ["lentille", "c"], ["optimum", "a"], ["pieuvre", "d"], ["calmar", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 365 });
})();
</script>
