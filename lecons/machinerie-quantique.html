<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- two apparatuses: A turns the spin by a about y, B by b about x; matrices in the base S, C = B·A (5.36);
   the atoms leaving are sorted by an apparatus T turned 90° about y ---------- */
(() => {
  const sa = $("sa"), sb = $("sb"); let dep = 0;
  /* a turn about x: about z by −90°, about y, back about z (the same composition rule (5.36)) */
  const autourX = b => Q.produitMatrices(Q.spin1Z(Math.PI / 2), Q.produitMatrices(Q.spin1Y(b), Q.spin1Z(-Math.PI / 2)));
  function probas(a, b) {
    const A = Q.spin1Y(a), B = autourX(b), v = Q.etatBase(3, dep), U = Q.spin1Y(Math.PI / 2);   // analysed by T, turned 90° about y
    return [Q.produitMatrices(B, A), Q.produitMatrices(A, B)].map(M => Q.appliquer(U, Q.appliquer(M, v)).map(Cx.abs2));
  }
  function draw() {
    const a = +sa.value * Math.PI / 180, b = +sb.value * Math.PI / 180, [ba, ab] = probas(a, b), svg = $("barres"); svg.innerHTML = "";
    const X = k => 120 + k * 200, Y = v => 180 - v * 150;
    Plot.el("line", { x1: 40, x2: 620, y1: Y(0), y2: Y(0), class: "axis" }, svg);
    for (let k = 0; k < 3; k++) {
      [[ba[k], "c-tint", -26], [ab[k], "c-warn", 26]].forEach(([v, cls, dx]) => {
        Plot.el("rect", { x: X(k) + dx - 22, width: 44, y: Y(v), height: Math.max(0, Y(0) - Y(v)), class: "fill " + cls }, svg);
        Plot.el("text", { x: X(k) + dx, y: Y(v) - 6, "text-anchor": "middle" }, svg).textContent = F.num(v, 2);
      });
      Plot.el("text", { x: X(k), y: Y(0) + 18, "text-anchor": "middle" }, svg).textContent = t("fig.t." + k);
    }
    $("dep").querySelectorAll("button").forEach(bt => bt.setAttribute("aria-pressed", String(+bt.dataset.i === dep)));
    $("sar").textContent = F.num(+sa.value, 3) + "\u00a0°"; $("sbr").textContent = F.num(+sb.value, 3) + "\u00a0°";
    $("vba").textContent = ba.map(x => F.num(x, 2)).join(" ; ");
    $("vab").textContent = ab.map(x => F.num(x, 2)).join(" ; ");
    $("vecart").textContent = F.num(Math.max(...ba.map((x, k) => Math.abs(x - ab[k]))), 2);
    $("fecart").textContent = t("fig.f.ecart");
  }
  $("dep").querySelectorAll("button").forEach(bt => bt.onclick = () => { dep = +bt.dataset.i; draw(); });
  sa.oninput = sb.oninput = draw; draw();
  const [ba, ab] = probas(Math.PI / 2, Math.PI / 2);
  $("sys1").innerHTML = t("sys1.body", { ba: ba.map(x => F.num(x, 2)).join(" ; "), ab: ab.map(x => F.num(x, 2)).join(" ; ") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["heisenberg", 1925, "idea"], ["born", 1925, "idea"], ["trois", 1926, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["portes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["neuf", "c"], ["ordre", "a"], ["lecture", "d"], ["filtre", "b"], ["ouvert", "c"], ["produit", "d"], ["etat", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 506 });
})();
</script>
