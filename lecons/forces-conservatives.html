<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- un profil Ep(x) : équilibres, stabilité, petites oscillations ---------- */
(() => {
  const AR = Forces.ARGON, sig = AR.sig;
  /* each profile: the model, the stable equilibrium the point starts near, the slider range (signed), the plot window and
     the display units (k: factor from SI to the displayed number) */
  const CASES = {
    puits: { P: Travail.profils.doublePuits(1, 1, 1), xe: 1, lo: 0.6, hi: 0.6, x: [-1.8, 1.8], y: [-0.2, 2.6], kx: 1, ky: 1, ux: "m", pre: "" },
    pendule: { P: Travail.profils.pendule(1, 1), xe: 0, lo: 3, hi: 3, x: [-Math.PI, Math.PI], y: [0, 21], kx: 1, ky: 1, ux: "m", pre: "" },
    argon: { P: Travail.profils.lennardJones(AR.eps, sig, AR.m / 2), xe: Forces.ljR0(sig), lo: 0.14 * sig, hi: 1.0 * sig, x: [0.3, 1.0], y: [-2, 2], kx: 1e9, ky: 1e21, ux: "m", pre: "n" },
  };
  let which = "puits";
  const asl = $("asl");
  function draw() {
    const c = CASES[which], P = c.P, s = asl.value / 100, A = s < 0 ? s * c.lo : s * c.hi, x0 = c.xe + A, E = P.ep(x0);
    const eqs = Travail.equilibres(P), w0 = Travail.omega0(P, c.xe), T0 = 2 * Math.PI / w0;
    const run = A === 0 ? null : Travail.oscillation(P, x0, { every: 10 });
    /* Ep(x) */
    let svg = $("profile"); svg.innerHTML = "";
    let ax = Plot.axes(svg, { fmt: F, w: 640, h: 240, x: { domain: c.x, label: t("pr.x." + which) }, y: { domain: c.y, label: t("pr.y." + which) } });
    const X = v => ax.x(v * c.kx), Y = v => ax.y(Math.max(c.y[0], Math.min(c.y[1], v * c.ky)));
    let d = "", pen = false;                                      // the curve leaves the window: lift the pen there
    for (let i = 0; i <= 300; i++) { const x = (c.x[0] + (c.x[1] - c.x[0]) * i / 300) / c.kx, e = P.ep(x) * c.ky, inside = e >= c.y[0] && e <= c.y[1];
      if (inside) { d += (pen ? "L" : "M") + X(x).toFixed(1) + " " + Y(P.ep(x)).toFixed(1); } pen = inside; }
    Plot.el("path", { d, class: "curve" }, ax.g);
    if (run) {
      const [l, r] = Travail.rebroussements(P, E, x0), L = isFinite(l) ? l : c.x[0] / c.kx, R = isFinite(r) ? r : c.x[1] / c.kx;
      Plot.el("line", { x1: X(Math.max(L, c.x[0] / c.kx)), x2: X(Math.min(R, c.x[1] / c.kx)), y1: Y(E), y2: Y(E), class: "ref" }, ax.g);
    }
    eqs.forEach(e => { if (e.x * c.kx >= c.x[0] && e.x * c.kx <= c.x[1]) Plot.el("circle", { cx: X(e.x), cy: Y(e.ep), r: 6, class: e.nature === "stable" ? "dot" : "stroke c-warn" }, ax.g); });
    Plot.el("circle", { cx: X(x0), cy: Y(E), r: 4, class: "fill c-label" }, ax.g);
    /* x(t) over one period, against the harmonic prediction */
    svg = $("xt"); svg.innerHTML = "";
    const tEnd = run ? (isFinite(run.periode) ? run.periode : run.t[run.t.length - 1]) : T0;
    const span = Math.max(Math.abs(A) * c.kx, 1e-3) * 1.6, xs = run ? run.x.map(v => v * c.kx) : [x0 * c.kx];
    const ylo = Math.min(c.xe * c.kx - span, ...xs), yhi = Math.max(c.xe * c.kx + span, ...xs);
    const tk = c.pre === "n" ? 1e12 : 1;
    ax = Plot.axes(svg, { fmt: F, w: 640, h: 200, x: { domain: [0, Math.max(tEnd, T0) * tk], label: t("pr.t." + which) }, y: { domain: [ylo, yhi], label: t("pr.x." + which) } });
    d = ""; for (let i = 0; i <= 200; i++) { const tt = Math.max(tEnd, T0) * i / 200; d += (i ? "L" : "M") + ax.x(tt * tk).toFixed(1) + " " + ax.y((c.xe + A * Math.cos(w0 * tt)) * c.kx).toFixed(1); }
    Plot.el("path", { d, class: "stroke dash c-warn" }, ax.g);
    if (run) Plot.el("path", { d: run.t.filter(tt => tt <= tEnd).map((tt, i) => (i ? "L" : "M") + ax.x(tt * tk).toFixed(1) + " " + ax.y(run.x[i] * c.kx).toFixed(1)).join(""), class: "curve" }, ax.g);
    /* readouts */
    $("pdesc").innerHTML = t("pr.desc." + which);
    $("aread").textContent = F.si(A, c.ux, { prefix: c.pre, sig: 2 });
    $("veq").textContent = eqs.map(e => t("pr.eq", { x: F.si(e.x, c.ux, { prefix: c.pre, sig: 3 }), n: t("pr.nature." + e.nature) })).join(" ; ");
    $("vt0").textContent = F.si(T0, "s", { sig: 3 });
    $("vt").textContent = run && isFinite(run.periode) ? F.si(run.periode, "s", { sig: 3 }) : "–";
    const r = run && isFinite(run.periode) ? run.periode / T0 - 1 : NaN;
    $("vdt").textContent = isFinite(r) ? F.qty(F.fix(100 * r, 1), "%") : "–";
    $("fdt").textContent = !run ? t("pr.f.repos") : run.sortie ? t("pr.f.sortie") : !isFinite(r) ? t("pr.f.lent") : t(Math.abs(r) < 0.01 ? "pr.f.harm" : "pr.f.anharm");
  }
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { which = b.dataset.p;
    document.querySelectorAll("[data-p]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  asl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lagrange", 1788, "idea"], ["dirichlet", 1846, "idea"], ["rankine", 1853, "idea"], ["ashkin", 1986, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pince", "infrarouge"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["orbite", "b"], ["equilibre", "c"], ["sommet", "a"], ["raideur", "d"], ["tourbillon", "b"], ["amplitude", "c"], ["origine", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 143 });
})();
</script>
