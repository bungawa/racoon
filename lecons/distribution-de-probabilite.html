<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
const main = document.querySelector("main");
F.autoTypo(main);
document.title = t("title");
const $ = id => document.getElementById(id);
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };

/* ---------- 5 000 marcheurs : histogramme de D_N contre la gaussienne ---------- */
(() => {
  const M = 5000; let seed = 1, xs = null, key = "";
  function draw() {
    const N = +$("dn").value, step = $("step").value, sig = Math.sqrt(N);
    let a = +$("x1").value, b = +$("x2").value; if (a > b) [a, b] = [b, a];
    if (key !== [N, step, seed].join()) { xs = Proba.finals(M, N, Quiz.rng(seed), step); key = [N, step, seed].join(); }
    $("dnv").textContent = F.num(N, 3); $("x1v").textContent = t("dist.xs", { z: F.fix(+$("x1").value, 1) }); $("x2v").textContent = t("dist.xs", { z: F.fix(+$("x2").value, 1) });
    $("dsig").textContent = F.num(sig, 3); $("dsigf").textContent = t("dist.sigma.f", { s: F.num(Math.sqrt(Proba.meanSquare(xs)), 3) });
    const lo = a * sig, hi = b * sig, inside = Array.prototype.filter.call(xs, v => v > lo && v < hi).length / M;
    $("dpth").textContent = F.qty(F.fix(100 * Proba.normalProb(lo, hi, sig), 1), "%");
    $("dpsim").textContent = F.qty(F.fix(100 * inside, 1), "%"); $("dpsimf").textContent = t("dist.psim.f", { M: F.num(M, 4) });
    const bins = step === "pm1" ? Proba.parityBins(N, 4.5) : { lo: -4.5 * sig, w: sig / 4, bins: 36 };
    const d = Proba.density(xs, bins.lo, bins.w, bins.bins), X = 4.6 * sig, peak = Proba.normalPdf(0, sig), ymax = Math.max(peak, ...d) * 1.1;
    const svg = $("dchart"); svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44 }, x: { domain: [-X, X], label: t("dist.x") }, y: { domain: [0, ymax], label: t("dist.y") } });
    d.forEach((v, i) => { const x0 = Math.max(-X, bins.lo + i * bins.w), x1 = Math.min(X, bins.lo + (i + 1) * bins.w);
      if (v > 0 && x1 > x0) Plot.el("rect", { x: x(x0) + 0.5, y: y(v), width: Math.max(0, x(x1) - x(x0) - 1), height: y(0) - y(v), class: "area" }, g); });
    let p = ""; for (let i = 0; i <= 200; i++) { const v = -X + 2 * X * i / 200; p += (i ? "L" : "M") + x(v).toFixed(1) + " " + y(Proba.normalPdf(v, sig)).toFixed(1); }
    Plot.el("path", { d: p, class: "curve" }, g);
    [lo, hi].forEach(v => Plot.el("line", { x1: x(v), x2: x(v), y1: y(0), y2: y(ymax), class: "ref" }, g));
  }
  ["dn", "x1", "x2"].forEach(id => { $(id).oninput = draw; });
  $("step").onchange = draw;
  $("dgo").onclick = () => { seed++; draw(); };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["moivre", 1733, "idea"], ["maxwell", 1860, "idea"], ["boltzmann", 1872, "idea"], ["galton", 1889, "experiment"], ["higgs", 2012, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sigma5"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["exacte", "a"], ["unite", "b"], ["pic", "c"], ["sigma", "d"], ["decouverte", "a"], ["gaz", "b"], ["norme", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => { const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) }; }), { t, seed: 64 });
})();
</script>
