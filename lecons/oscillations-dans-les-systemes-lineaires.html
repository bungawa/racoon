<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["bloc", "visqueux", "sec"]; keyed($("bancs"), t("bancs.tag"), IDS, textOf("bancs.items", IDS)); })();

/* ---------- §25-3 : frottement visqueux contre frottement sec, même ressort ---------- */
(() => {
  const M = 0.2, K = 20, W0 = Osc.pulsation(K, M), G = Constantes.g_CPGE, TMAX = 4;   // ω₀ = 10 rad·s⁻¹, T₀ = 0,63 s
  const TT = Array.from({ length: 801 }, (_, i) => TMAX * i / 800);
  function upd() {
    const x0 = +$("x0").value / 100, Q = +$("q").value, mu = +$("mu").value, d = mu * G / (W0 * W0);
    const V = Amort.libre(W0, Q, x0, 0), S = Ondes.frottementSec(W0, d, x0);
    const svg = $("trace"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, TMAX], label: t("os.xaxis") }, y: { domain: [-1.05, 1.05], label: t("os.yaxis") } });
    /* the band |x| ≤ d where the block can stay at rest, in units of x₀ */
    [d / x0, -d / x0].forEach(y => { if (y < 1.05) Plot.el("line", { x1: P.x(0), x2: P.x(TMAX), y1: P.y(y), y2: P.y(y), class: "stroke thin dash c-label-2" }, P.g); });
    Plot.el("path", { d: Plot.path(TT.map(tt => [P.x(tt), P.y(V.x(tt) / x0)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(TT.map(tt => [P.x(tt), P.y(S.x(tt) / x0)])), class: "stroke c-warn" }, P.g);
    S.sommets.forEach(s => { if (s.t <= TMAX) Plot.el("circle", { cx: P.x(s.t), cy: P.y(s.x / x0), r: 3, class: "fill c-warn" }, P.g); });
    /* readouts */
    const r = Math.exp(-Amort.parPeriode(Q).decrement), n = S.sommets.length - 1;
    $("x0v").textContent = F.si(x0, "m"); $("qv").textContent = F.num(Q, 2); $("muv").textContent = F.num(mu, 2);
    $("vr").textContent = F.num(r, 3); $("fr").textContent = t("os.f.rapport");
    $("vp").textContent = F.si(4 * d, "m"); $("fp").textContent = t("os.f.perte", { d: F.si(d, "m"), p: F.qty(F.num(400 * d / x0, 2), "%") });
    $("va").textContent = n ? F.si(S.tArret, "s") : t("os.v.immobile");
    $("fa").textContent = n ? t("os.f.arret", { n: n, x: F.si(Math.abs(S.xFinal), "m") }) : t("os.f.immobile");
  }
  ["x0", "q", "mu"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["coulomb", 1781, "experiment"], ["stokes", 1851, "idea"], ["rayleigh", 1877, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["decrement", "amortisseur"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["inertie", "d"], ["fraction", "a"], ["sec", "c"], ["arret", "b"], ["amplitude", "a"], ["resonance", "d"], ["mesure", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 253 });
})();
</script>
