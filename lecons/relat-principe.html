<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, C = Constantes.c, G = Constantes.g_CPGE;

/* ---------- une balle lancée dans un wagon : le quai et le wagon voient la même accélération ---------- */
(() => {
  const su = $("su"), svx = $("svx"), svy = $("svy");
  const etendue = pts => { const xs = pts.map(p => p.x); return [Math.min(0, ...xs), Math.max(0, ...xs)]; };
  /* both plots get the same span, so that the two shapes compare at the same scale */
  function trace(svg, pts, xl, span) {
    svg.innerHTML = "";
    const [lo, hi] = etendue(pts), mid = (lo + hi) / 2, ymax = Math.max(0.5, ...pts.map(p => p.y));
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 220, pad: { l: 52, b: 44 }, x: { domain: [mid - 0.55 * span, mid + 0.55 * span], label: xl }, y: { domain: [0, 1.15 * ymax], label: t("fig.yaxis") } });
    Plot.el("path", { d: Plot.path(pts.map(p => [P.x(p.x), P.y(p.y)])), class: "curve" }, P.g);
    pts.filter((p, i) => i % 8 === 0).forEach(p => Plot.el("circle", { cx: P.x(p.x), cy: P.y(p.y), r: 4, class: "dot" }, P.g));
  }
  function draw() {
    const u = +su.value, vx = +svx.value, vy = +svy.value, T = 2 * vy / G;
    const s = R.lancerWagon({ u, v0: [vx, vy], g: G, duree: T, n: 64 });
    const span = Math.max(2, ...[s.sol, s.wagon].map(q => { const [lo, hi] = etendue(q); return hi - lo; }));
    trace($("quai"), s.sol, t("fig.xaxis.quai"), span);
    trace($("wagon"), s.wagon, t("fig.xaxis.wagon"), span);
    const acc = a => t("fig.vec", { x: F.num(Math.abs(a[0]) < 1e-6 ? 0 : a[0], 3), y: F.num(a[1], 3) });
    $("sur").textContent = F.si(u, "m·s⁻¹");
    $("svxr").textContent = F.si(vx, "m·s⁻¹");
    $("svyr").textContent = F.si(vy, "m·s⁻¹");
    $("vacc").textContent = acc(s.accWagon);
    $("facc").textContent = t("fig.f.acc", { v: acc(s.accSol) });
    $("vvit").textContent = F.si(vx, "m·s⁻¹");
    $("fvit").textContent = t("fig.f.vit", { v: F.si(u + vx, "m·s⁻¹") });
    $("vlum").textContent = F.qty(F.num(R.vitesseVue(C, u, "galilee"), 9), "m·s⁻¹");
    $("flum").textContent = t("fig.f.lum", { c: F.qty(F.num(C, 9), "m·s⁻¹"), r: u ? F.sci(u / C, 2) : "0" });
  }
  su.oninput = svx.oninput = svy.oninput = draw; draw();
})();

/* ---------- le système décrit : la Terre sur son orbite ---------- */
(() => {
  const u = 2 * Math.PI * Constantes.au / (365.25 * 86400), L = 11;
  $("sys1").innerHTML = t("sys1.body", { u: F.si(u, "m·s⁻¹", { prefix: "k" }), r: F.sci(u / C, 2), b2: F.sci((u / C) ** 2, 2),
    cmu: F.qty(F.num(C - u, 9), "m·s⁻¹"), L: F.si(L, "m"), d1: F.si(L / (C - u) - L / (C + u), "s"), d2: F.si(2 * L / C * R.excesAllerRetour(0, u), "s") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["galilee", 1632, "idea"], ["newton", 1687, "idea"], ["maxwell", 1865, "idea"], ["einstein", 1905, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["inertielle"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cabine", "c"], ["acc", "a"], ["vitesse", "d"], ["lumiere", "b"], ["forces", "c"], ["ordre", "a"], ["non", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 151 });
})();
</script>
