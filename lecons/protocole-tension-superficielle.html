<body>

    <div class="eq"><math display="block"><mi>E</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>γ</mi><mi>i</mi></msub><msub><mi>A</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>+</mo><msub><mi>E</mi><mi mathvariant="normal">p</mi></msub><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>,</mo><mspace width="0.8em"/><mi>F</mi><mo>=</mo><mfrac><mrow><mi mathvariant="normal">d</mi><mi>E</mi></mrow><mrow><mi mathvariant="normal">d</mi><mi>x</mi></mrow></mfrac></math></div>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>E</mi><mo>=</mo><mn>2</mn><mi>γ</mi><mi>L</mi><mi>x</mi><mspace width="1em"/><mo>⇒</mo><mspace width="1em"/><mi>F</mi><mo>=</mo><mn>2</mn><mi>γ</mi><mi>L</mi></math></div>
    <p class="validite" data-i18n-html="val.2.2"></p>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><msub><mi>γ</mi><mi data-i18n="eq.sg"></mi></msub><mo>−</mo><msub><mi>γ</mi><mi data-i18n="eq.sl"></mi></msub><mo>=</mo><mi>γ</mi><mspace width="0.15em"/><mi data-i18n="eq.cos"></mi><mspace width="0.1em"/><mi>θ</mi></math></div>
    <p class="validite" data-i18n-html="val.2.3"></p>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="eq"><math display="block"><mi>E</mi><mo stretchy="false">(</mo><mi>h</mi><mo stretchy="false">)</mo><mo>=</mo><mo>−</mo><mn>2</mn><mi>π</mi><mi>r</mi><mi>h</mi><mspace width="0.15em"/><mi>γ</mi><mspace width="0.15em"/><mi data-i18n="eq.cos"></mi><mspace width="0.1em"/><mi>θ</mi><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>ρ</mi><mi>g</mi><mi>π</mi><msup><mi>r</mi><mn>2</mn></msup><msup><mi>h</mi><mn>2</mn></msup></math></div>
    <p class="validite" data-i18n-html="val.2.4"></p>
    <div class="eq"><math display="block"><mi>h</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>γ</mi><mspace width="0.15em"/><mi data-i18n="eq.cos"></mi><mspace width="0.1em"/><mi>θ</mi></mrow><mrow><mi>ρ</mi><mi>g</mi><mi>r</mi></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.2.5"></p>
    <figure class="chart">
      <svg class="fig" id="jur" role="img" data-i18n-attr="aria-label:jur.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="jur.legend.E"></span><span class="c-warn" data-i18n="jur.legend.surf"></span><span class="c-label-2" data-i18n="jur.legend.grav"></span></div>
      <div class="panel">
        <div class="seg" role="group" id="liq" data-i18n-attr="aria-label:jur.choix">
          <button type="button" data-l="eau" aria-pressed="true" data-i18n="liq.eau"></button>
          <button type="button" data-l="ethanol" data-i18n="liq.ethanol"></button>
          <button type="button" data-l="mercure" data-i18n="liq.mercure"></button>
        </div>
        <div class="ctl"><div class="row"><label for="jr" data-i18n="jur.r"></label><output id="jrv" for="jr"></output></div>
          <input id="jr" type="range" min="0.05" max="3" step="0.05" value="0.5"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="jur.k.h"></span><span class="v" id="vh"></span><span class="f" id="fh"></span></div>
          <div class="stat"><span class="k" data-i18n="jur.k.bilan"></span><span class="v" id="vw"></span><span class="f" id="fw"></span></div>
          <div class="stat"><span class="k" data-i18n="jur.k.bo"></span><span class="v" id="vbo"></span><span class="f" id="fbo"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="jur.caption"></figcaption>
    </figure>
    <p data-i18n-html="s4.p2"></p>
    <div class="eq"><math display="block"><mi>γ</mi><mo>=</mo><mfrac><mrow><mi>ρ</mi><mi>g</mi><mi>r</mi></mrow><mrow><mn>2</mn><mspace width="0.15em"/><mi data-i18n="eq.cos"></mi><mspace width="0.1em"/><mi>θ</mi></mrow></mfrac><mrow><mo>(</mo><msub><mi>h</mi><mn>0</mn></msub><mo>+</mo><mfrac><mi>r</mi><mn>3</mn></mfrac><mo>)</mo></mrow></math></div>
    <p class="validite" data-i18n-html="val.2.6"></p>
    <div class="box warn"><b data-i18n="s4.warn.title"></b>
      <p data-i18n-html="s4.warn.body"></p>
    </div>

  <section class="card">
    <span class="sec" data-i18n="s5.sec"></span>
    <h2 data-i18n="s5.h2"></h2>
    <p data-i18n-html="s5.p1"></p>
    <div class="eq"><math display="block"><mi>E</mi><mo stretchy="false">(</mo><mi>e</mi><mo stretchy="false">)</mo><mo>=</mo><mi>V</mi><mrow><mo>[</mo><mfrac><mrow><mi>γ</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi data-i18n="eq.cos"></mi><mspace width="0.1em"/><mi>θ</mi><mo stretchy="false">)</mo></mrow><mi>e</mi></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>ρ</mi><mi>g</mi><mi>e</mi><mo>]</mo></mrow><mspace width="1em"/><mo>⇒</mo><mspace width="1em"/><mi>e</mi><mo>=</mo><mn>2</mn><msub><mi>ℓ</mi><mi mathvariant="normal">c</mi></msub><mspace width="0.15em"/><mi data-i18n="eq.sin"></mi><mfrac><mi>θ</mi><mn>2</mn></mfrac></math></div>
    <p class="validite" data-i18n-html="val.2.7"></p>
    <h3 data-i18n="s5.tate.h3"></h3>
    <p data-i18n-html="s5.tate.p"></p>
    <div class="eq"><math display="block"><msub><mi>m</mi><mi data-i18n="eq.max"></mi></msub><mi>g</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>r</mi><mi>γ</mi></math></div>
    <p class="validite" data-i18n-html="val.2.8"></p>
    <div class="list keyed" id="protocoles"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/protocole-tension-superficielle.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/fluides.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const keyed = (el, ITEMS, txt) => { el.innerHTML = ITEMS.map(([id, k]) => `<div><span class="k">${k}</span><span>${txt[id]}</span></div>`).join(""); };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), path = Plot.path, L = Fluides.LIQUIDES, G = Constantes.g0;

/* ---------- §4 : Jurin, l'énergie du tube contre la hauteur ---------- */
(() => {
  const svg = $("jur"); let nom = "eau";
  function upd() {
    const l = L[nom], r = +$("jr").value * 1e-3, o = { gamma: l.gamma, theta: l.theta, rho: l.rho, r };
    const b = Fluides.bilanJurin(o), h = b.h, lc = Fluides.longueurCapillaire(l.gamma, l.rho), bo = Fluides.bond(r, l.gamma, l.rho);
    const hs = Array.from({ length: 121 }, (_, i) => 2.2 * h * i / 120), mm = x => x * 1e3, uJ = x => x * 1e6;
    const surf = x => -2 * Math.PI * r * x * l.gamma * Math.cos(l.theta), grav = x => 0.5 * l.rho * G * Math.PI * r * r * x * x;
    const Emax = 1.2 * Math.abs(uJ(surf(2.2 * h))), hx = [Math.min(0, mm(2.2 * h)), Math.max(0, mm(2.2 * h))];
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 }, x: { domain: hx, label: t("jur.xaxis") }, y: { domain: [-Emax, Emax], label: t("jur.yaxis") } });
    Plot.el("line", { x1: ax.x(hx[0]), x2: ax.x(hx[1]), y1: ax.y(0), y2: ax.y(0), class: "stroke thin c-label-2" }, ax.g);
    Plot.el("path", { d: path(hs.map(x => [ax.x(mm(x)), ax.y(uJ(surf(x)))])), class: "ref" }, ax.g);
    Plot.el("path", { d: path(hs.map(x => [ax.x(mm(x)), ax.y(uJ(grav(x)))])), class: "stroke dash c-label-2" }, ax.g);
    Plot.el("path", { d: path(hs.map(x => [ax.x(mm(x)), ax.y(uJ(Fluides.energieJurin(o, x)))])), class: "curve" }, ax.g);
    Plot.el("circle", { cx: ax.x(mm(h)), cy: ax.y(uJ(Fluides.energieJurin(o, h))), r: 5, class: "dot" }, ax.g);
    $("jrv").textContent = F.si(r, "m", { sig: 2 });
    $("vh").textContent = F.si(h, "m", { sig: 3 });
    $("fh").textContent = t(h > 0 ? "jur.f.monte" : "jur.f.descend", { m: F.si(h > 0 ? h - r / 3 : -h, "m", { sig: 3 }) });
    $("vw").textContent = F.si(b.travailSurface, "J", { sig: 3 });
    $("fw").textContent = t("jur.f.bilan", { ep: F.si(b.epGravite, "J", { sig: 3 }), q: F.si(b.dissipee, "J", { sig: 3 }) });
    $("vbo").textContent = bo < 0.01 ? F.sci(bo, 2) : F.num(bo, 2);
    $("fbo").textContent = t(bo < 0.1 ? "jur.f.spherique" : "jur.f.deforme", { lc: F.si(lc, "m", { sig: 3 }) });
  }
  document.querySelectorAll("#liq button").forEach(b => b.onclick = () => {
    nom = b.dataset.l; document.querySelectorAll("#liq button").forEach(x => x.setAttribute("aria-pressed", x === b)); upd(); });
  $("jr").oninput = upd; upd();
})();

/* ---------- §5 : trois protocoles, trois lectures chiffrées ---------- */
(() => {
  const E = L.eau, M = L.mercure, r = 0.5e-3, h0 = Fluides.jurin(E.gamma, 0, E.rho, r) - r / 3;
  const naif = E.rho * G * r * h0 / 2, corrige = E.rho * G * r * (h0 + r / 3) / 2;
  const ITEMS = [
    ["cadre", F.si(Fluides.cadre(0.03, 0.05), "N", { sig: 2 })],
    ["jurin", F.qty(F.num((1 - naif / corrige) * 100, 2), "%")],
    ["flaque", F.si(Fluides.epaisseurFlaque(M.gamma, M.rho, M.theta), "m", { sig: 2 })],
    ["tate", F.si(Fluides.tate(E.gamma, 1e-3) * 1e3, "g", { sig: 3 })],
  ];
  keyed($("protocoles"), ITEMS, textOf("protocoles.items", ITEMS.map(i => i[0])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["jurin1718", 1718, "experiment"], ["tate1864", 1864, "experiment"], ["harkins1919", 1919, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["bandelette"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cadre", "c"], ["jurin", "a"], ["moitie", "d"], ["mercure", "b"], ["menisque", "c"], ["flaque", "a"], ["tate", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 3102 });
})();
</script>
