<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/quantique-schrodinger.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = QuantSchro, K = Constantes;

/* ---------- the torque of a circularly polarized beam fully absorbed: P/ω ---------- */
(() => {
  const svg = $("courbe"), sP = $("sP"), sL = $("sL");
  function draw() {
    const P = 10 ** +sP.value, l = +sL.value * 1e-9, tau = S.coupleLumiere(P, l);
    svg.innerHTML = "";
    const ymax = S.coupleLumiere(P, 1600e-9) * 1.1;
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 70 }, x: { domain: [300, 1600], label: t("fig.x") }, y: { domain: [0, ymax], label: t("fig.y") } });
    const p = [];
    for (let k = 300; k <= 1600; k += 10) p.push([o.x(k), o.y(S.coupleLumiere(P, k * 1e-9))]);
    Plot.el("path", { d: Plot.path(p), class: "stroke bold c-ok" }, o.g);
    Plot.el("circle", { cx: o.x(+sL.value), cy: o.y(tau), r: 5, class: "fill c-ok" }, o.g);
    $("sPr").textContent = F.si(P, "W"); $("sLr").textContent = F.si(l, "m");
    $("vn").textContent = F.sci(S.photonsParSeconde(P, l), 2); $("fn").textContent = t("fig.f.n");
    $("vc").textContent = F.si(tau, "N·m"); $("fc").textContent = t("fig.f.c");
    $("vf").textContent = F.si(P / K.c, "N"); $("ff").textContent = t("fig.f.f", { r: F.si(tau / (P / K.c), "m") });
  }
  sP.oninput = sL.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["malus", 1809, "experiment"], ["beth", 1936, "experiment"], ["aspect", 1982, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pince", "cinema"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["rapport", "b"], ["lineaire", "c"], ["bras", "a"], ["un", "d"], ["double", "b"], ["classique", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1704 });
})();
</script>
