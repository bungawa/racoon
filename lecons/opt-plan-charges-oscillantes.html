<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptOnd, nm = 1e-9;

/* ---------- la somme des anneaux dans le plan complexe : cercle, spirale, (30.17) ---------- */
(() => {
  const svg = $("somme"), sr = $("sr"), sw = $("sw");
  const l = 500 * nm, z = 1, w = 2 * Math.PI * O.c / l, k = w / O.c;
  function draw() {
    const nR = +sr.value, nW = +sw.value, R = O.zoneFresnel(nR, l, z), larg = nW > 0 ? O.zoneFresnel(nR + nW, l, z) - R : 0;
    const s = O.sommeAnneaux({ omega: w, z, R, w: larg });
    /* in units of c/ω, turned by e^{ikz} so that the sum starts at 0 whatever z */
    const rot = ([x, y]) => { const c = Math.cos(k * z), si = Math.sin(k * z), a = x * c - y * si, b = x * si + y * c; return [a / s.rayon, b / s.rayon]; };
    const pts = s.points.map(rot), fin = rot([s.somme.re, s.somme.im]), A = rot([s.exacte.re, s.exacte.im]);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 360, pad: { l: 166, r: 166 }, x: { domain: [-1.5, 1.5], label: t("fig.re") }, y: { domain: [-2.5, 0.5], label: t("fig.im") } });
    const cercle = Array.from({ length: 181 }, (_, i) => [A[0] + Math.cos(i * Math.PI / 90), A[1] + Math.sin(i * Math.PI / 90)]);
    Plot.el("path", { d: Plot.path(cercle.map(([x, y]) => [P.x(x), P.y(y)])), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(pts.map(([x, y]) => [P.x(x), P.y(y)])), class: "curve" }, P.g);
    Plot.fleche(P.g, [P.x(0), P.y(0)], [P.x(A[0]), P.y(A[1])], { cls: "c-warn" });
    Plot.el("circle", { cx: P.x(fin[0]), cy: P.y(fin[1]), r: 5, class: "dot" }, P.g);
    const champ = Math.hypot(...fin), ecart = Math.hypot(fin[0] - A[0], fin[1] - A[1]);
    $("srr").textContent = t("fig.zones", { n: F.num(nR, 3) });
    $("swr").textContent = nW > 0 ? t("fig.zones", { n: F.num(nW, 3) }) : t("fig.net");
    $("vchamp").textContent = F.num(champ, 3);
    $("fchamp").textContent = t("fig.f.champ");
    $("vecart").textContent = F.qty(F.num(100 * ecart, 2), "%");
    $("fecart").textContent = t(ecart < 0.05 ? "fig.f.centre" : "fig.f.cercle");
    $("vrayon").textContent = F.si(R, "m", { prefix: "m", sig: 3 });
    $("frayon").textContent = t("fig.f.rayon", { r: F.si(O.zoneFresnel(1, l, z), "m", { prefix: "m", sig: 3 }) });
  }
  sr.oninput = sw.oninput = draw; draw();
})();

/* ---------- le système décrit : une nappe de courant ---------- */
(() => {
  const omega = 2 * Math.PI * 1e8, p = O.champPlan({ eta: 1, q: 1, x0: 1 / omega, omega, z: 3 }), l = 500 * nm;
  $("sys1").innerHTML = t("sys1.body", { K: F.si(p.K0, "A·m⁻¹"), E: F.si(p.E0, "V·m⁻¹", { sig: 4 }), Z: F.si(1 / (2 * O.eps0 * O.c), "Ω", { sig: 4 }),
    tau: F.si(p.retard, "s", { prefix: "n" }), r1: F.si(O.zoneFresnel(1, l, 1), "m", { prefix: "m", sig: 2 }), r100: F.si(O.zoneFresnel(100, l, 1), "m", { prefix: "m", sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["huygens", 1690, "idea"], ["fresnel", 1818, "idea"], ["soret", 1875, "experiment"], ["oseen", 1915, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lentille"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["retard", "a"], ["vitesse", "b"], ["infini", "c"], ["net", "d"], ["zone", "a"], ["courant", "c"], ["obliquite", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 307 });
})();
</script>
