<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const MPa = x => F.qty(F.num(Math.abs(x) < 0.05 ? 0 : x, 3), "MPa");
const FY = 355, GM0 = 1.0;                                      // S355, t ≤ 40 mm ; γM0 recommandé

/* ---------- facette orientable et cercle de Mohr (contraintes planes, en MPa) ---------- */
(() => {
  const svg = $("mohr"), CAS = { traction: [150, 0, 0], pression: [-100, -100, 0], cisaillement: [0, 0, 100] }, NAMES = textOf("mo.cas.noms", ["traction", "pression", "cisaillement", "libre"]);
  let cas = "libre";
  const arrow = (x1, y1, x2, y2, cls) => Plot.fleche(svg, [x1, y1], [x2, y2], { cls });
  const text = (x, y, s, anchor) => { P("text", { x, y, "text-anchor": anchor || "middle" }, svg).textContent = s; };
  function upd() {
    const sx = +$("sxx").value, sy = +$("syy").value, txy = +$("sxy").value, deg = +$("th").value, th = deg * Math.PI / 180;
    $("sxxv").textContent = MPa(sx); $("syyv").textContent = MPa(sy); $("sxyv").textContent = MPa(txy); $("thv").textContent = F.qty(F.num(deg, 3), "°");
    ["traction", "pression", "cisaillement", "libre"].forEach(id => $("c-" + id).setAttribute("aria-pressed", String(id === cas)));
    const f = Tenseurs.facette(sx, sy, txy, th), m = Tenseurs.mohr(sx, sy, txy);
    svg.innerHTML = "";
    /* left: the element, the facet through its centre, the force on the facet */
    const C = [150, 165], h = 70, k = 0.45;                                   // 1 MPa = 0,45 px
    P("rect", { x: C[0] - h, y: C[1] - h, width: 2 * h, height: 2 * h, class: "stroke thin c-label-2" }, svg);
    const n = [Math.cos(th), Math.sin(th)], u = [-n[1], n[0]], L = 1.45 * h;
    P("line", { x1: C[0] - L * u[0], y1: C[1] + L * u[1], x2: C[0] + L * u[0], y2: C[1] - L * u[1], class: "stroke bold c-label" }, svg);
    arrow(C[0], C[1], C[0] + 40 * n[0], C[1] - 40 * n[1], "c-label-2 dash");
    text(C[0] + 52 * n[0], C[1] - 52 * n[1] + 4, t("mo.n"));
    arrow(C[0], C[1], C[0] + k * f.t[0], C[1] - k * f.t[1], "c-tint");
    arrow(C[0], C[1], C[0] + k * f.sigma * n[0], C[1] - k * f.sigma * n[1], "c-warn");
    arrow(C[0] + k * f.sigma * n[0], C[1] - k * f.sigma * n[1], C[0] + k * f.t[0], C[1] - k * f.t[1], "c-ok");
    text(C[0], 22, t("mo.element"));
    /* right: Mohr's circle, σ to the right, τ up; same scale on both axes */
    const O = [470, 165], reach = Math.max(Math.abs(m.centre) + m.rayon, 50), s = 140 / reach;
    const X = v => O[0] + s * v, Y = v => O[1] - s * v;
    P("line", { x1: 320, y1: O[1], x2: 625, y2: O[1], class: "stroke thin c-label-2" }, svg);
    P("line", { x1: O[0], y1: 20, x2: O[0], y2: 310, class: "stroke thin c-label-2" }, svg);
    text(628, O[1] - 6, t("mo.ax.s"), "end"); text(O[0] + 6, 30, t("mo.ax.t"), "start");
    P("circle", { cx: X(m.centre), cy: O[1], r: Math.max(s * m.rayon, 0.5), class: "stroke c-tint" }, svg);
    P("line", { x1: X(m.centre), y1: O[1], x2: X(f.sigma), y2: Y(f.tau), class: "stroke thin dash c-label-2" }, svg);
    [[m.s1, "mo.s1"], [m.s2, "mo.s2"]].forEach(([v, key]) => { P("circle", { cx: X(v), cy: O[1], r: 4, class: "fill c-label-2" }, svg); text(X(v), O[1] + 18, t(key)); });
    P("circle", { cx: X(f.sigma), cy: Y(f.tau), r: 6, class: "fill c-warn" }, svg);
    text(X(f.sigma), Y(f.tau) + (f.tau >= 0 ? -12 : 20), t("mo.point"));
    /* readouts */
    $("vn").textContent = MPa(f.sigma); $("vtau").textContent = MPa(f.tau);
    let tp = m.thetaP * 180 / Math.PI; if (tp < 0) tp += 180;
    $("vp").textContent = t("mo.v.p", { s1: MPa(m.s1), s2: MPa(m.s2) });
    $("fp").textContent = m.rayon < 0.05 ? t("mo.f.iso") : t("mo.f.p", { a: F.qty(F.num(tp, 3), "°") });
    const vm = Tenseurs.vonMises(Tenseurs.plan(sx, sy, txy)), r = Tenseurs.critereEC3(sx, sy, txy, FY, GM0);
    $("vvm").textContent = MPa(vm);
    $("fvm").textContent = t(r <= 1 ? "mo.f.ok" : "mo.f.ko", { r: F.fix(r, 2) });
  }
  ["sxx", "syy", "sxy", "th"].forEach(id => $(id).oninput = () => { if (id !== "th") cas = "libre"; upd(); });
  ["traction", "pression", "cisaillement", "libre"].forEach(id => {
    $("c-" + id).textContent = NAMES[id];
    $("c-" + id).onclick = () => { cas = id; if (CAS[id]) [$("sxx").value, $("syy").value, $("sxy").value] = CAS[id]; upd(); };
  });
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cauchy", 1822, "idea"], ["tresca", 1864, "experiment"], ["mohr", 1882, "idea"], ["mises", 1913, "idea"], ["ec3", 2005, "use"], ["ec3b", 2022, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["acier", "calcul", "fluide"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["neuf", "c"], ["sym", "a"], ["facette", "d"], ["pression", "b"], ["mohr", "a"], ["cis", "c"], ["vm", "b"], ["ec3", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
