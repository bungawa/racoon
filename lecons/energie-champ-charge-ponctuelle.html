<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux, K = Constantes, EV = K.e;
const EL = OM.electronClassique();

/* ---------- le système décrit : un électron classique, puis une sphère de laboratoire ---------- */
(() => {
  $("sys1").innerHTML = t("sys1.body", { r0: F.qty(F.sci(EL.r0, 3), "m"), lc: F.qty(F.sci(EL.lambdaC, 3), "m"), al: F.num(1 / EL.alpha, 4) });
  const a = 0.01, V = 1e4, q = 4 * Math.PI * K.eps0 * a * V, ch = OM.chargeEtendue({ q, a });
  $("sys2").innerHTML = t("sys2.body", { q: F.qty(F.sci(q, 2), "C"), U: F.si(ch.U0, "J", { prefix: "µ" }), m: F.qty(F.sci(ch.mPrime, 2), "kg"), r: F.sci(ch.mPrime / 1e-3, 1) });
})();

/* ---------- U0 contre a : la droite de pente −1 ---------- */
(() => {
  const svg = $("trace"), sa = $("sa"), seg = $("forme"), A = [1e-18, 1e-9], Y = [1e-1, 1e10];
  const pow = v => { const e = Math.round(Math.log10(v)); return "10" + F.sup(e); };
  let forme = "coquille";
  function draw() {
    const a = 10 ** (+sa.value / 100), ch = OM.chargeEtendue({ q: EV, a, forme }), U = ch.U0 / EV;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 60, b: 44 },
      x: { scale: "log", domain: A, label: t("fig.xaxis"), fmt: v => (Math.round(Math.log10(v)) % 3 ? "" : pow(v)) },
      y: { scale: "log", domain: Y, label: t("fig.yaxis"), fmt: v => (Math.round(Math.log10(v)) % 2 ? "" : pow(v)) } });
    const xs = [A[0], A[1]], Uof = x => OM.chargeEtendue({ q: EV, a: x, forme }).U0 / EV;
    Plot.el("line", { x1: P.x(A[0]), x2: P.x(A[1]), y1: P.y(EL.mc2 / EV), y2: P.y(EL.mc2 / EV), class: "stroke dash c-warn" }, P.g);
    for (const [x, id] of [[EL.r0, "r0"], [EL.lambdaC, "lc"], [K.a0, "a0"]]) {
      Plot.el("line", { x1: P.x(x), x2: P.x(x), y1: P.y(Y[0]), y2: P.y(Y[1]), class: "stroke thin dash c-label-2" }, P.g);
      Plot.el("text", { x: P.x(x) + 4, y: P.y(Y[1]) + 14, class: "tick" }, P.g).textContent = t("fig.repere." + id);
    }
    Plot.el("path", { d: Plot.path(xs.map(x => [P.x(x), P.y(Uof(x))])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(a), cy: P.y(U), r: 5, class: "dot" }, P.g);
    $("sar").textContent = F.si(a, "m");
    $("vU").textContent = F.si(U, "eV"); $("fU").textContent = t("fig.f.U", { v: F.qty(F.sci(ch.U0, 3), "J") });
    $("vm").textContent = F.num(ch.mPrime / K.m_e, 3); $("fm").textContent = t("fig.f.m", { v: F.qty(F.sci(ch.mPrime, 3), "kg") });
    $("vr").textContent = F.si(ch.rayon(0.9), "m"); $("fr").textContent = t("fig.f.r", { v: F.num(ch.rayon(0.9) / a, 3) });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === forme)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { forme = b.dataset.m; draw(); });
  sa.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["thomson", 1897, "experiment"], ["millikan", 1913, "experiment"], ["born", 1920, "idea"], ["still", 1990, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["solvant"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["densite", "c"], ["integrale", "a"], ["pres", "d"], ["infini", "b"], ["forme", "c"], ["mc2", "a"], ["domaine", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 281 });
})();
</script>
