<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, FM = 1e-15, MEV = 1e6 * K.e / K.c ** 2;
/* rest masses, MeV/c²: charged and neutral pions (Particle Data Group) */
const PARTS = { photon: 0, pi0: 134.9768, pic: 139.57039, deux: 2 * 139.57039 };
const portee = m => (m === 0 ? Infinity : Q.porteeEchange(m * MEV));

/* ---------- e^(−R/r): what the exchange keeps of a 1/R law ---------- */
(() => {
  const svg = $("fig"), sr = $("sr"), seg = $("part"), N = 200, X0 = 0.2, X1 = 5;
  let part = "pic";
  function draw() {
    const R = +sr.value * FM, r = portee(PARTS[part]), f = Q.yukawa(R, PARTS[part] * MEV) * R;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 520, h: 320, x: { domain: [X0, X1], label: t("fig.x"), fmt: v => F.num(v, 0) },
      y: { domain: [0, 1], label: t("fig.y"), fmt: v => F.num(v, 1) } });
    for (const p of Object.keys(PARTS)) {
      const pts = Array.from({ length: N + 1 }, (_, i) => { const xr = X0 + (X1 - X0) * i / N; return [x(xr), y(Q.yukawa(xr * FM, PARTS[p] * MEV) * xr * FM)]; });
      Plot.el("path", { d: Plot.path(pts), class: p === part ? "stroke bold" : "stroke thin dash" }, Plot.el("g", { class: p === part ? "c-tint" : "c-label-2" }, g));
    }
    Plot.el("line", { x1: x(+sr.value), x2: x(+sr.value), y1: y(0), y2: y(1), class: "stroke thin" }, Plot.el("g", { class: "c-label-2" }, g));
    $("srr").textContent = F.si(R, "m", { prefix: "f" });
    $("vp").textContent = Number.isFinite(r) ? F.si(r, "m", { prefix: "f" }) : t("fig.infinie");
    $("fp").textContent = t("fig.f.portee", { m: F.num(PARTS[part], 1) });
    $("vr").textContent = F.num(f, 3);
    $("fr").textContent = t("fig.f.ratio", { n: Number.isFinite(r) ? F.num(R / r, 2) : "0" });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === part)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { part = b.dataset.p; draw(); });
  sr.oninput = draw; draw();
})();

/* ---------- the system described: two ranges, and the time a virtual pion lives ---------- */
(() => {
  const r = portee(PARTS.pic), WH = K.hbar ** 2 / (2 * K.m_e * K.a0 ** 2), ae = 1 / Q.alphaEchange(WH);
  $("sys").innerHTML = t("sys.body", { r: F.si(r, "m", { prefix: "f" }), ae: F.si(ae, "m", { prefix: "p" }), k: F.num(ae / r, 0),
    tau: F.si(K.hbar / (PARTS.pic * MEV * K.c ** 2), "s"), dm: F.num(PARTS.pic - PARTS.pi0, 2), rel: F.num(100 * (PARTS.pic - PARTS.pi0) / PARTS.pic, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["yukawa", 1935, "idea"], ["bristol", 1947, "experiment"], ["nobel", 1949, "idea"], ["pi0", 1950, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["potentiels"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["analogie", "c"], ["imaginaire", "a"], ["portee", "d"], ["photon", "b"], ["masses", "c"], ["lourd", "a"], ["echelle", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1002 });
})();
</script>
