<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, DEG = Math.PI / 180;

/* ---------- the exchange phase δ: |f(θ) + e^(iδ) f(π − θ)|² against the distinguishable sum ---------- */
(() => {
  const svg = $("courbe"), cer = $("cercle"), sd = $("sd"), sth = $("sth"), seta = $("seta"), seg = $("choix");
  function draw() {
    const delta = +sd.value * DEG, th = +sth.value * DEG, eta = +seta.value;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { domain: [0, 180], label: t("fig.x"), fmt: v => F.num(v, 3) + "°" }, y: { domain: [0, 2], label: t("fig.y") } });
    const courbe = (d, cls) => {
      const p = [];
      for (let i = 1; i < 360; i++) { const a = i / 2; p.push([o.x(a), o.y(Q.diffusionPhaseEchange(a * DEG, eta, d).rapport)]); }
      Plot.el("path", { d: Plot.path(p), class: cls }, o.g);
    };
    courbe(0, "stroke dash c-ok"); courbe(Math.PI, "stroke dash c-warn"); courbe(delta, "stroke bold c-tint");
    Plot.el("line", { x1: o.x(0), x2: o.x(180), y1: o.y(1), y2: o.y(1), class: "stroke thin c-label-2" }, o.g);
    const r = Q.diffusionPhaseEchange(th, eta, delta);
    Plot.el("circle", { cx: o.x(+sth.value), cy: o.y(r.rapport), r: 5, class: "fill c-tint" }, o.g);
    /* the unit circle: e^(iδ) and e^(2iδ) */
    cer.innerHTML = "";
    const c0 = 100, R = 70, pt = a => [c0 + R * Math.cos(a), c0 - R * Math.sin(a)];
    Plot.el("circle", { cx: c0, cy: c0, r: R, class: "stroke thin c-label-2" }, cer);
    Plot.el("line", { x1: c0 - R - 10, x2: c0 + R + 10, y1: c0, y2: c0, class: "stroke thin c-label-2" }, cer);
    Plot.fleche(cer, [c0, c0], pt(delta), { cls: "c-tint", tete: 9 });
    Plot.fleche(cer, [c0, c0], pt(2 * delta), { cls: "c-warn", tete: 9 });
    Plot.el("circle", { cx: c0 + R, cy: c0, r: 5, class: "stroke c-ok" }, cer);
    const tag = (x, y, txt, cls) => { const e = Plot.el("text", { x, y, "text-anchor": "middle", class: cls }, cer); e.textContent = txt; };
    const p1 = pt(delta), p2 = pt(2 * delta);
    tag(c0 + 1.25 * (p1[0] - c0), c0 + 1.25 * (p1[1] - c0) + 4, t("fig.c.un"), "c-tint");
    tag(c0 + 1.25 * (p2[0] - c0), c0 + 1.25 * (p2[1] - c0) + 4, t("fig.c.deux"), "c-warn");
    $("sdr").textContent = F.num(+sd.value, 3) + "°";
    $("sthr").textContent = F.num(+sth.value, 3) + "°";
    $("setar").textContent = F.fix(eta, 1);
    $("vr").textContent = F.fix(r.rapport, 3);
    $("fr").textContent = t("fig.f.rapport", { v: F.fix(1 + Math.cos(delta), 3) });
    const ok = Math.abs(r.double.re - 1) < 1e-9;
    $("vd").textContent = F.fix(r.double.re, 2) + (r.double.im < 0 ? " − " : " + ") + F.fix(Math.abs(r.double.im), 2) + " i";
    $("fd").textContent = t(ok ? "fig.f.retour" : "fig.f.pasRetour");
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.d === +sd.value)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { sd.value = b.dataset.d; draw(); });
  sd.oninput = sth.oninput = seta.oninput = draw; draw();
})();

/* ---------- composite objects: count the fermions inside ---------- */
(() => {
  const OBJETS = { electron: [0, 0, 1], proton: [1, 0, 0], alpha: [2, 2, 0], he3noyau: [2, 1, 0], he4: [2, 2, 2], he3: [2, 1, 2],
    li7: [3, 4, 0], hydrogene: [1, 0, 1], rb87: [37, 50, 37], k40: [19, 21, 19] };
  const boutons = document.querySelectorAll(".objets button"), NOMS = textOf("obj.noms", Object.keys(OBJETS));
  function show(id) {
    const [Z, N, ne] = OBJETS[id], r = Q.especeComposee(Z, N, ne);
    $("vc").textContent = F.num(r.fermions, 3);
    $("fc").textContent = t("obj.f.compte", { nom: NOMS[id], z: Z, n: N, e: ne });
    $("vs").textContent = r.signe > 0 ? "+1" : "−1";
    $("fs").textContent = t(r.espece === "bosons" ? "obj.f.boson" : "obj.f.fermion");
    boutons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.o === id)));
  }
  boutons.forEach(b => b.onclick = () => show(b.dataset.o));
  show("alpha");
})();

/* ---------- the system described: two α particles that stay whole ---------- */
(() => {
  const { e, u } = Constantes, mu = 2 * u;                       // reduced mass of two α particles, m_α ≈ 4 u
  const row = E => { const Ej = E * e, v = Math.sqrt(2 * Ej / mu); return { d: Q.approcheCoulomb(2, 2, Ej), eta: Q.sommerfeld(2, 2, v), v }; };
  const a = row(1e5), b = row(1e6), rayon = 1.68e-15;
  $("sys1").innerHTML = t("sys1.body", { ja: F.qty(F.sci(1e5 * e, 2), "J"), jb: F.qty(F.sci(1e6 * e, 2), "J"), da: F.si(a.d, "m"), ra: F.num(a.d / (2 * rayon), 2), db: F.si(b.d, "m"), rb: F.num(b.d / (2 * rayon), 2) });
  $("sys2").innerHTML = t("sys2.body", { va: F.qty(F.sci(a.v, 3), "m·s⁻¹"), ea: F.num(a.eta, 2), eb: F.num(b.eta, 2), c: F.num(a.v / Constantes.c, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bose", 1924, "idea"], ["fermidirac", 1926, "idea"], ["mott", 1930, "experiment"], ["pauli", 1940, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["dilution"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deuxfois", "b"], ["angle", "d"], ["alpha", "a"], ["he3", "c"], ["entier", "b"], ["phase", "c"], ["spin", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 441 });
})();
</script>
