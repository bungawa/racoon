<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, { k_B, N_A, c, g0 } = Constantes;

/* ---------- la distribution de Maxwell : gaz, température, seuil ---------- */
(() => {
  const GAZ = ["H2", "He", "N2", "O2", "Ar", "CO2"], noms = textOf("dist.gaz.noms", GAZ), svg = $("dist"), sg = $("gz"), st = $("td"), su = $("ud");
  sg.innerHTML = GAZ.map(k => `<option value="${k}">${noms[k]}</option>`).join(""); sg.value = "N2";
  let VMAX;
  const domaine = () => {                                         /* five times the most probable speed at 300 K, to 500 m·s⁻¹ */
    VMAX = 500 * Math.ceil(5 * S.vitesses(S.M[sg.value] / N_A, 300).vp / 500);
    su.max = VMAX; su.step = VMAX / 80; if (+su.value > VMAX) su.value = VMAX / 2;
  };
  function draw() {
    const gz = sg.value, T = +st.value, u = +su.value, m = S.M[gz] / N_A, v = S.vitesses(m, T);
    const ymax = 1.15 * S.maxwell(v.vp, m, T);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 64 },
      x: { domain: [0, VMAX], label: t("dist.x") }, y: { domain: [0, 1e3 * ymax], label: t("dist.y"), fmt: y => F.num(y, 3) } });
    const pts = [], tail = [[o.x(Math.min(u, VMAX)), o.y(0)]];
    for (let i = 0; i <= 400; i++) {
      const x = VMAX * i / 400, y = Math.min(S.maxwell(x, m, T), ymax);
      pts.push([o.x(x), o.y(1e3 * y)]); if (x >= u) tail.push([o.x(x), o.y(1e3 * y)]);
    }
    if (u < VMAX) { tail.push([o.x(VMAX), o.y(0)]); Plot.el("path", { d: Plot.path(tail) + "Z", class: "area" }, o.g); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold c-tint" }, o.g);
    for (const k of ["vp", "moy", "rms"]) if (v[k] < VMAX) Plot.el("line", { x1: o.x(v[k]), x2: o.x(v[k]), y1: o.y(0), y2: o.y(1e3 * S.maxwell(v[k], m, T)), class: "ref" }, o.g);
    $("tdv").innerHTML = F.kelvin(T); $("udv").textContent = F.si(u, "m·s⁻¹", { sig: 3 });
    $("vvp").textContent = F.si(v.vp, "m·s⁻¹", { sig: 3 });
    $("vmoy").textContent = F.si(v.moy, "m·s⁻¹", { sig: 3 });
    $("vrms").textContent = F.si(v.rms, "m·s⁻¹", { sig: 3 });
    const pa = S.auDela(u, m, T), pf = S.fluxAuDela(u, m, T), fmtP = p => p > 1e-3 ? F.qty(F.num(100 * p, 3), "%") : F.sci(p, 2);
    $("vau").textContent = fmtP(pa);
    $("vflux").textContent = fmtP(pf);
    $("fflux").textContent = t("dist.f.flux", { h: F.si(u * u / (2 * g0), "m", { sig: 3 }) });
    const d = S.distance(1e5, T);
    $("sys").innerHTML = t("sys.inner", { gaz: noms[gz], T: F.kelvin(T), d: F.si(d, "m", { sig: 2 }),
      ld: F.sci(S.lambdaTh(m, T) / d, 2), vc: F.sci((v.rms / c) ** 2, 2) });
  }
  sg.onchange = () => { domaine(); draw(); }; st.oninput = su.oninput = draw; domaine(); draw();
})();

/* ---------- des chocs, et Maxwell apparaît ---------- */
(() => {
  const N = 3000, V0 = 400, m = S.M.Ar / N_A, T = m * V0 * V0 / (3 * k_B), NB = 40, W = 30, svg = $("histo");
  let s, rand, n;
  const reset = () => { rand = Quiz.rng(41); s = S.isotrope({ N, m, v0: V0 }, rand); n = 0; draw(); };
  function draw() {
    const sp = S.normes(s), h = new Float64Array(NB);
    for (const x of sp) { const i = Math.floor(x / W); if (i < NB) h[i]++; }
    const p = Array.from({ length: NB }, (_, i) => S.auDela(i * W, m, T) - S.auDela((i + 1) * W, m, T));
    let ecart = 0; for (let i = 0; i < NB; i++) ecart += Math.abs(h[i] / N - p[i]); ecart /= 2;
    svg.innerHTML = "";
    const ymax = 0.12;
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { domain: [0, NB * W], label: t("sim.x") }, y: { domain: [0, 100 * ymax], label: t("sim.y"), fmt: y => F.num(y, 3) } });
    for (let i = 0; i < NB; i++) { const y = Math.min(h[i] / N, ymax);
      if (y > 0) Plot.el("rect", { x: o.x(i * W) + 0.5, y: o.y(100 * y), width: Math.max(0, o.x((i + 1) * W) - o.x(i * W) - 1), height: o.y(0) - o.y(100 * y), class: "fill c-tint" }, o.g); }
    const pts = []; for (let i = 0; i <= 200; i++) { const x = NB * W * i / 200; pts.push([o.x(x), o.y(100 * S.maxwell(x, m, T) * W)]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold c-warn" }, o.g);
    $("vn").textContent = F.num(n, 3);
    $("vt").innerHTML = F.kelvin(T);
    $("vd").textContent = F.qty(F.num(100 * ecart, 2), "%");
    $("vq").textContent = F.qty(F.num(100 * sp.filter(x => x > 600).length / N, 3), "%");
    $("fq").textContent = t("sim.f.q", { p: F.qty(F.num(100 * S.auDela(600, m, T), 3), "%") });
  }
  const run = k => { S.choc(s, k * N, rand); n += k; draw(); };
  $("c1").onclick = () => run(1); $("c10").onclick = () => run(10); $("raz").onclick = reset;
  reset();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1860, "idea"], ["stern", 1920, "experiment"], ["kusch", 1955, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["doppler"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["hauteur", "c"], ["chocs", "a"], ["poids", "d"], ["helium", "b"], ["zero", "c"], ["ordre", "a"], ["double", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 404 });
})();
</script>
