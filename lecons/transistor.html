<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/quantique-schrodinger.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes, L = 1e-4, I0 = 1e-14;

/* ---------- gain against the width of the base ---------- */
(() => {
  const svg = $("fig"), sw = $("sw"), sv = $("sv");
  function draw() {
    const r = Math.pow(10, +sw.value), V = +sv.value, tr = Q.transistorJonction({ W: r * L, L, VEB: V, I0, T: 300 });
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 64, b: 44 }, x: { scale: "log", domain: [1e-2, 1], label: t("fig.xaxis") }, y: { scale: "log", domain: [1, 1e5], label: t("fig.yaxis") } });
    const pts = [];
    for (let i = 0; i <= 200; i++) { const x = Math.pow(10, -2 + 2 * i / 200), b = Q.transistorJonction({ W: x * L, L, VEB: V, I0, T: 300 }).beta; pts.push([G.x(x), G.y(Math.min(1e5, Math.max(1, b)))]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke c-label" }, G.g);
    Plot.el("circle", { cx: G.x(r), cy: G.y(Math.min(1e5, Math.max(1, tr.beta))), r: 5, class: "fill c-warn" }, G.g);
    $("swr").textContent = F.num(r, 3);
    $("svr").textContent = F.si(V, "V");
    $("vb").textContent = F.num(tr.beta, 3);
    $("fb").textContent = t("fig.f.beta", { a: F.num(tr.alpha, 6) });
    $("vc").textContent = F.si(tr.IC, "A");
    $("fc").textContent = t("fig.f.ic", { ib: F.si(tr.IB, "A") });
  }
  sw.oninput = draw; sv.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const tr = Q.transistorJonction({ W: 1e-5, L, VEB: 0.6, I0, T: 300 });
  $("sys1").innerHTML = t("sys1.body", { b: F.num(tr.beta, 2) });
  const kT = K.k_B * 300 / K.e;
  $("sys2").innerHTML = t("sys2.body", { g: F.si(tr.IC / kT, "S"), ic: F.si(tr.IC, "A") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bardeen", 1947, "experiment"], ["shockley", 1948, "idea"], ["pierce", 1948, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["amplificateurs"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["base", "b"], ["mince", "d"], ["gain", "a"], ["dopage", "c"], ["npn", "b"], ["exponentielle", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1406 });
})();
</script>
