<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §47-4 : deux bosses, ou une bosse lâchée ---------- */
(() => {
  const O = self.Ondes, M = O.milieu("air", 293.15, Constantes.atm), c = M.c, A = 10e-6, W = 0.05, L = 0.75;
  const SC = {
    meme: O.progressives(c, O.bosse(A, W, -L), O.bosse(A, W, L)),
    opp: O.progressives(c, O.bosse(A, W, -L), O.bosse(-A, W, L)),
    lacher: O.depuisConditions(c, O.bosse(2 * A, W, 0), null),
  };
  const XS = Array.from({ length: 601 }, (_, i) => -1.5 + 3 * i / 600);
  let sc = "meme";
  function upd() {
    const s = SC[sc], tt = 1e-3 * +$("tm").value;
    const svg = $("dal"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 52, b: 44 }, x: { domain: [-1.5, 1.5], label: t("da.xaxis") }, y: { domain: [-25, 25], label: t("da.yaxis") } });
    const um = v => P.y(1e6 * v);
    Plot.el("path", { d: Plot.path(XS.map(x => [P.x(x), um(s.droite(x, tt))])), class: "stroke dash c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(XS.map(x => [P.x(x), um(s.gauche(x, tt))])), class: "stroke dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(XS.map(x => [P.x(x), um(s.chi(x, tt))])), class: "curve" }, P.g);
    const E = O.energies(s, M.rho, -3, 3, 3000, tt), E0 = O.energies(s, M.rho, -3, 3, 3000, 0).totale;
    $("tmv").textContent = t("da.t.v", { t: F.si(tt, "s"), d: F.si(c * tt, "m") });
    $("vec").textContent = F.si(E.cinetique, "J·m⁻²"); $("fec").textContent = t("da.f.part", { p: F.num(100 * E.cinetique / E.totale, 3) });
    $("vep").textContent = F.si(E.potentielle, "J·m⁻²"); $("fep").textContent = t("da.f.part", { p: F.num(100 * E.potentielle / E.totale, 3) });
    $("vtot").textContent = F.si(E.totale, "J·m⁻²"); $("ftot").textContent = t("da.f.tot", { r: F.sci(Math.abs(E.totale / E0 - 1), 1) });
    $("scen").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === sc)));
  }
  $("scen").querySelectorAll("button").forEach(b => b.onclick = () => { sc = b.dataset.s; upd(); });
  $("tm").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["alembert", 1747, "idea"], ["bernoulli", 1753, "idea"], ["fourier", 1822, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["echographie", "antibruit"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["vitesse", "c"], ["gauche", "a"], ["lacher", "d"], ["croise", "b"], ["energie", "c"], ["lumiere", "a"], ["echo", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 474 });
})();
</script>
