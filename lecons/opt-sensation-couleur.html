<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, nm = x => x * 1e-9, P = Plot.el;
const teinte = (x, y) => "rgb(" + O.couleurAffichable(x, y).join(" ") + ")";
/* affichage : le blanc d'égale énergie du modèle est montré comme le blanc de l'écran (D65), par la même règle de von Kries */
const GAIN = O.lms(O.versXYZ(0.3127, 0.329, 1)), teinteEE = xyz => {
  const v = O.lms(xyz).map((u, i) => u * GAIN[i]), c = O.chromaticite(O.CONES.Tinv.map(r => r[0] * v[0] + r[1] * v[1] + r[2] * v[2]));
  return teinte(c.x, c.y); };
const lamb = l => F.si(l, "m", { prefix: "n", sig: 3 });

/* ---------- l'ombre colorée : lampe blanche + lampe rouge à 620 nm, adaptation de von Kries ---------- */
(() => {
  const svg = $("ombre"), W = 480, H = 180, sk = $("k"), sd = $("dd");
  function draw() {
    const k = +sk.value, D = +sd.value, r = O.ombreColoree({ k, D });
    svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.innerHTML = "";
    /* trois carrés : le fond, l'ombre telle qu'un spectromètre la mesure, l'ombre telle que l'œil adapté la voit */
    const cases = [["fond", r.fond, r.xyFond], ["ombre", r.ombre, O.chromaticite(r.ombre)], ["vue", r.vue, r.xyVue]];
    cases.forEach(([id, xyz, c], i) => {
      const x0 = 12 + i * 158;
      P("rect", { x: x0, y: 8, width: 140, height: 118, rx: 6, fill: teinteEE(xyz) }, svg);
      P("rect", { x: x0, y: 8, width: 140, height: 118, rx: 6, class: "stroke thin c-label" }, svg);
      P("text", { x: x0 + 70, y: 148, "text-anchor": "middle", class: "label" }, svg).textContent = t("om.case." + id);
      P("text", { x: x0 + 70, y: 168, "text-anchor": "middle", class: "tick" }, svg).textContent = t("om.xy").replace("{x}", F.fix(c.x, 3)).replace("{y}", F.fix(c.y, 3));
    });
    $("kr").textContent = F.num(k, 2); $("ddr").textContent = F.num(D, 2);
    const df = O.dominante([r.xyFond.x, r.xyFond.y], [1 / 3, 1 / 3]);
    $("vf").textContent = df.lambda ? lamb(df.lambda) : "—";
    $("ff").textContent = t("om.f.pur").replace("{p}", F.qty(F.num(100 * df.purete, 2), "%"));
    if (r.horsDomaine) { $("vv").textContent = t("om.v.hors"); $("fv").textContent = t("om.f.hors"); }
    else if (!r.dominante.lambda) { $("vv").textContent = t("om.v.blanc"); $("fv").textContent = t("om.f.blanc"); }
    else { $("vv").textContent = lamb(r.dominante.lambda); $("fv").textContent = t("om.f.pur").replace("{p}", F.qty(F.num(100 * r.dominante.purete, 2), "%")); }
    const a = r.antagonistes, sgn = (v, p, m) => Math.abs(v) < 0.005 ? t("om.s.nul") : t(v > 0 ? p : m);
    $("vs").textContent = sgn(a.rv, "om.s.rouge", "om.s.vert") + ", " + sgn(a.jb, "om.s.jaune", "om.s.bleu");
    $("fs").textContent = t("om.f.sig").replace("{rv}", F.num(a.rv, 2)).replace("{jb}", F.num(a.jb, 2));
  }
  sk.oninput = sd.oninput = draw;
  draw();
})();

/* ---------- les deux signaux d'opposition le long du spectre ---------- */
(() => {
  const svg = $("canaux"), W = 640, H = 300, lam = Array.from({ length: 261 }, (_, i) => 420 + i);
  const s = lam.map(l => O.antagonistes(O.fondamentales(nm(l))));
  const ax = Plot.axes(svg, { fmt: F, w: W, h: H, x: { domain: [420, 680], label: t("ca.ax.x") }, y: { domain: [-1.8, 1.2], label: t("ca.ax.y") } });
  P("line", { x1: ax.x(420), x2: ax.x(680), y1: ax.y(0), y2: ax.y(0), class: "stroke thin c-label" }, svg);
  P("path", { d: Plot.path(lam.map((l, i) => [ax.x(l), ax.y(s[i].rv)])), class: "stroke bold c-ko" }, svg);
  P("path", { d: Plot.path(lam.map((l, i) => [ax.x(l), ax.y(Math.max(-1.8, s[i].jb))])), class: "stroke bold c-tint" }, svg);
  /* les zéros : là où un canal se tait, la teinte est « pure » pour l'autre */
  const zero = f => { for (let i = 1; i < lam.length; i++) if (Math.sign(f(s[i])) !== Math.sign(f(s[i - 1]))) return lam[i - 1] + f(s[i - 1]) / (f(s[i - 1]) - f(s[i])); return null; };
  [[zero(v => v.rv), "ca.z.jaune"], [zero(v => v.jb), "ca.z.vert"]].forEach(([l, key]) => {
    P("circle", { cx: ax.x(l), cy: ax.y(0), r: 6, fill: teinteEE(O.cmf(nm(l))) }, svg);
    P("circle", { cx: ax.x(l), cy: ax.y(0), r: 6, class: "stroke thin c-label" }, svg);
    P("text", { x: ax.x(l), y: ax.y(0) - 12, "text-anchor": "middle", class: "tick" }, svg).textContent = t(key).replace("{l}", F.num(l, 3));
  });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["goethe", 1810, "experiment"], ["hering", 1878, "idea"], ["benham", 1894, "experiment"], ["land", 1959, "experiment"], ["cie", 2002, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["balance", "gestion"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["objets", "b"], ["ombre", "c"], ["sansAdapt", "a"], ["complement", "d"], ["jaune", "b"], ["retine", "a"], ["toupie", "c"], ["land", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 361 });
})();
</script>
