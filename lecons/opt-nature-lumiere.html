<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique;

/* ---------- spectre : λ contre la taille D de l'appareil, hν contre kB T ---------- */
(() => {
  const svg = $("spectre"), P = Plot.el, L0 = -13, L1 = 3, X0 = 20, X1 = 620;
  const X = lg => X0 + (lg - L0) / (L1 - L0) * (X1 - X0);
  const ids = O.DOMAINES.map(d => d[0]), noms = textOf("sp.dom", ids);
  function draw() {
    svg.innerHTML = "";
    const lg = +$("lsl").value, dg = +$("dsl").value, lambda = Math.pow(10, lg), D = Math.pow(10, dg), r = O.lumiere(lambda, { D });
    O.DOMAINES.forEach(([id, b], i) => {
      const a = i ? Math.log10(b) : L0, e = i + 1 < O.DOMAINES.length ? Math.log10(O.DOMAINES[i + 1][1]) : L1;
      P("rect", { x: X(a), y: 30, width: X(e) - X(a), height: 34, class: "fill " + (id === "visible" ? "c-tint" : i % 2 ? "c-label-2" : "c-label"), "fill-opacity": id === r.domaine ? 0.55 : 0.18 }, svg);
      if (id !== "visible") P("text", { x: (X(a) + X(e)) / 2, y: 52, "text-anchor": "middle" }, svg).textContent = noms[id];
    });
    for (let k = -12; k <= 2; k += 2) {
      P("line", { x1: X(k), x2: X(k), y1: 64, y2: 70, class: "stroke thin c-label-2" }, svg);
      P("text", { x: X(k), y: 84, "text-anchor": "middle" }, svg).textContent = F.si(Math.pow(10, k), "m", { sig: 1 });
    }
    P("line", { x1: X(lg), x2: X(lg), y1: 18, y2: 76, class: "stroke bold c-tint" }, svg);
    P("line", { x1: X(dg), x2: X(dg), y1: 18, y2: 76, class: "stroke bold dash c-warn" }, svg);
    P("text", { x: X(lg), y: 12, "text-anchor": "middle" }, svg).textContent = "λ";
    P("text", { x: X(dg), y: 104, "text-anchor": "middle" }, svg).textContent = "D";
    $("lread").textContent = F.si(lambda, "m");
    $("dread").textContent = F.si(D, "m");
    $("vdom").textContent = noms[r.domaine];
    $("fnu").textContent = t("sp.f.nu", { nu: F.si(r.nu, "Hz"), e: F.qty(F.sci(r.eV, 3), "eV") });
    $("vld").textContent = F.sci(r.lD, 2);
    $("fld").textContent = r.lD < 1e-3 ? t("sp.f.geo", { th: F.si(r.theta, "rad", { sig: 2 }) })
      : r.theta !== null ? t("sp.f.diff", { th: F.num(r.theta * 180 / Math.PI, 2) }) : t("sp.f.onde");
    $("vkt").textContent = F.sci(r.kT, 2);
    $("fkt").textContent = t(r.kT > 30 ? "sp.f.photon" : r.kT < 1 ? "sp.f.classique" : "sp.f.entre");
  }
  $("lsl").oninput = $("dsl").oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["haytham", 1011, "idea"], ["romer", 1676, "experiment"], ["herschel", 1800, "experiment"], ["maxwell", 1865, "idea"], ["hertz", 1887, "experiment"], ["einstein", 1905, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["euv", "radio"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["regime", "b"], ["frequence", "a"], ["lambda", "c"], ["photon", "d"], ["croisement", "a"], ["radio", "c"], ["vision", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 261 });
})();
</script>
