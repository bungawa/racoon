<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const deg = Math.PI / 180;

/* ---------- composantes polaires : le laplacien et la divergence pris de travers ---------- */
(() => {
  const svg = $("polaire"), P = Plot.el, S = 100, O = 200, M = 1.95;
  const X = x => O + S * x, Y = y => O - S * y;
  const arrow = (x1, y1, x2, y2, cls, parent, w) => Plot.fleche(parent, [x1, y1], [x2, y2], { cls, tete: w || 6, trait: w ? "stroke" : "stroke thin" });
  const label = (x, y, text, parent) => { const e = P("text", { x, y, "text-anchor": "middle" }, parent); e.textContent = text; };
  const pick = $("pick"), rs = $("rsl"), ths = $("thsl");
  const z = v => (Math.abs(v) < 5e-6 ? 0 : v);
  function draw() {
    svg.innerHTML = "";
    const c = Nabla.CHAMPS[pick.value], r = +rs.value, th = +ths.value * deg, p = [r * Math.cos(th), r * Math.sin(th)];
    P("line", { x1: X(-M), y1: Y(0), x2: X(M), y2: Y(0), class: "stroke thin dash c-label-2" }, svg);
    P("line", { x1: X(0), y1: Y(-M), x2: X(0), y2: Y(M), class: "stroke thin dash c-label-2" }, svg);
    P("circle", { cx: X(0), cy: Y(0), r: S * r, class: "stroke thin dash c-label-2" }, svg);
    const g = P("g", { class: "c-tint" }, svg);
    for (let i = -7; i <= 7; i++) for (let j = -7; j <= 7; j++) {
      const q = [i * 0.25, j * 0.25], v = c.v(q), n = Math.hypot(...v), k = n > 0 ? Math.min(0.16 * n, 0.22) / n : 0;
      arrow(X(q[0] - k * v[0] / 2), Y(q[1] - k * v[1] / 2), X(q[0] + k * v[0] / 2), Y(q[1] + k * v[1] / 2), "", g);
    }
    /* the polar unit vectors at the point: they turn with θ */
    const w = P("g", { class: "c-warn" }, svg), U = 0.45, er = [Math.cos(th), Math.sin(th)], et = [-Math.sin(th), Math.cos(th)];
    arrow(X(p[0]), Y(p[1]), X(p[0] + U * er[0]), Y(p[1] + U * er[1]), "", w, 9);
    arrow(X(p[0]), Y(p[1]), X(p[0] + U * et[0]), Y(p[1] + U * et[1]), "", w, 9);
    label(X(p[0] + (U + 0.12) * er[0]), Y(p[1] + (U + 0.12) * er[1]) + 4, t("pol.er"), w);
    label(X(p[0] + (U + 0.12) * et[0]), Y(p[1] + (U + 0.12) * et[1]) + 4, t("pol.et"), w);
    P("circle", { cx: X(p[0]), cy: Y(p[1]), r: 4, class: "fill" }, w);
    const q = Nabla.piegePolaire(c.v, p), d = Nabla.divergencePolaire(c.v, p), hr = Nabla.polaires(c.v, p)[0];
    $("rread").textContent = F.qty(F.fix(r, 1), "m");
    $("thread").textContent = F.qty(ths.value, "°");
    $("vhr").textContent = F.qty(F.fix(z(hr), 3), "m·s⁻¹");
    $("vlapr").textContent = F.qty(F.fix(z(q.lapDeR), 3), "m⁻¹·s⁻¹");
    $("vrlap").textContent = F.qty(F.fix(z(q.rDeLap), 3), "m⁻¹·s⁻¹");
    $("vnaif").textContent = F.qty(F.fix(z(d.naive), 3), "s⁻¹");
    $("fnaif").textContent = t("pol.f.naif", { v: F.fix(z(d.juste), 3) });
  }
  [pick, rs, ths].forEach(e => { e.oninput = draw; e.onchange = draw; }); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lame", 1859, "idea"], ["christoffel", 1869, "idea"], ["ricci", 1900, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["conduites", "formulaires"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["gradients", "a"], ["meme", "b"], ["uniforme", "c"], ["source", "d"], ["cartesien", "a"], ["produit", "b"], ["ordre", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 208 });
})();
</script>
