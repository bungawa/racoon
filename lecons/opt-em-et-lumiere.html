<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, TAU = 2 * Math.PI;

/* ---------- the three terms of (28.3) for a neutral oscillating pair, against kr ---------- */
(() => {
  const SOURCES = { secteur: 50, radio: 100e6, wifi: 2.4e9, lumiere: 5e14 };   // Hz
  const trace = $("trace"), skr = $("skr"), seg = $("source");
  let src = "radio";
  /* (28.3) summed step by step: charge e oscillating with amplitude d along z, −e at rest at the origin, P in the equatorial
     plane at r; the largest value of each term over one period. */
  function pasAPas(f, r) {
    const q = Constantes.e, T = 1 / f, w = TAU * f, d = 1e-4 * Math.min(r, O.c / f), traj = s => [0, 0, d * Math.cos(w * s)];
    const m = [0, 0, 0], n = 64;
    for (let i = 0; i < n; i++) {
      const a = O.champCharge(q, traj, [r, 0, 0], i * T / n, T / 2000);
      a.coulomb[0] -= O.K * q / (r * r);
      m[0] = Math.max(m[0], Math.hypot(...a.coulomb)); m[1] = Math.max(m[1], Math.hypot(...a.correction)); m[2] = Math.max(m[2], Math.hypot(...a.rayonnement));
    }
    return { coulomb: m[0] / m[2], correction: m[1] / m[2] };
  }
  function draw() {
    const f = SOURCES[src], lambda = O.c / f, kr = 10 ** +skr.value, r = kr * lambda / TAU;
    const x = O.termesDipole(1, f, r, Math.PI / 2), num = pasAPas(f, r);
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { scale: "log", domain: [0.01, 100], label: t("fig.xaxis") },
      y: { scale: "log", domain: [1e-6, 1e6], label: t("fig.yaxis") } });
    const ks = Array.from({ length: 201 }, (_, i) => 10 ** (-2 + 4 * i / 200));
    /* amplitudes in units of the common value at kr = 1: (kr)⁻³, (kr)⁻², (kr)⁻¹ */
    [[3, "c-label-2"], [2, "c-warn"], [1, "c-tint"]].forEach(([p, cls]) =>
      Plot.el("path", { d: Plot.path(ks.map(k => [P.x(k), P.y(Math.max(1e-6, Math.min(1e6, k ** -p)))])), class: "stroke bold " + cls }, P.g));
    Plot.el("line", { x1: P.x(kr), x2: P.x(kr), y1: P.y(1e-6), y2: P.y(1e6), class: "zero" }, P.g);
    [[3, "c-label-2"], [2, "c-warn"], [1, "c-tint"]].forEach(([p, cls]) => {
      const y = kr ** -p; if (y >= 1e-6 && y <= 1e6) Plot.el("circle", { cx: P.x(kr), cy: P.y(y), r: 4, class: "fill " + cls }, P.g);
    });
    $("skrr").textContent = F.num(kr, 3);
    $("vr").textContent = F.si(r, "m");
    $("fr").textContent = t("fig.f.r", { l: F.si(lambda, "m"), f: F.si(f, "Hz") });
    const nb = v => (v >= 1e-2 && v < 1e3 ? F.num(v, 2) : F.sci(v, 2));
    $("vc").textContent = nb(x.coulomb / x.rayonnement);
    $("fc").textContent = t("fig.f.num", { v: nb(num.coulomb) });
    $("vk").textContent = nb(x.correction / x.rayonnement);
    $("fk").textContent = t("fig.f.num", { v: nb(num.correction) });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === src)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { src = b.dataset.s; draw(); });
  skr.oninput = draw; draw();
})();

/* ---------- the system described: four sources at a usual distance ---------- */
(() => {
  const kr = (f, r) => TAU * f * r / O.c;
  const ligne = kr(50, 100), radio = kr(100e6, 1e4), lampe = kr(5e14, 2);
  $("sys1").innerHTML = t("sys1.body", { l50: F.si(O.c / 50, "m", { prefix: "k" }), k50: F.sci(ligne, 1), kradio: F.sci(radio, 1),
    pradio: F.sci(1 / radio, 1), klampe: F.sci(lampe, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["oersted", 1820, "experiment"], ["maxwell", 1865, "idea"], ["hertz", 1888, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["galileo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["distance", "c"], ["termes", "a"], ["retard", "d"], ["zone", "b"], ["secteur", "c"], ["superposition", "a"], ["champB", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 281 });
})();
</script>
