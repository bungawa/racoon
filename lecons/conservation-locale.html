    <div class="eq"><math display="block"><msup><mi>ρ</mi><mo>′</mo></msup><mo>=</mo><mi>γ</mi><mo>(</mo><mi>ρ</mi><mo>−</mo><mfrac><mrow><mi>v</mi><msub><mi>j</mi><mi>x</mi></msub></mrow><msup><mi>c</mi><mn>2</mn></msup></mfrac><mo>)</mo><mo separator="true">,</mo><mspace width="1em"/><mi>t</mi><mo>=</mo><mfrac><msup><mi>t</mi><mo>′</mo></msup><mi>γ</mi></mfrac><mo>+</mo><mfrac><mrow><mi>v</mi><mi>x</mi></mrow><msup><mi>c</mi><mn>2</mn></msup></mfrac></math></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/ondes-milieux.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux;

/* ---------- une charge passe de 1 à 2 : comptée dans un référentiel qui défile ---------- */
(() => {
  const Q = 1e-9, L = 3, tau = 10e-9, w = 1e8;                               // 1 nC, 3 m apart, 10 ns to move, a wire at c/3
  const trace = $("trace"), sb = $("sb"), seg = $("mode");
  let mode = "saut";
  const ts = Array.from({ length: 321 }, (_, i) => (-80 + i * 0.5) * 1e-9);
  function draw() {
    const beta = +sb.value / 100, v = OM.chargeVue({ Q, L, tau, beta, w });
    const pts = ts.map(tp => (mode === "saut" ? v.saut(tp) : v.transit(tp)));
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [-80, 80], label: t("fig.xaxis") }, y: { domain: [-0.1, 1.5], label: t("fig.yaxis") } });
    const line = (k, cls) => Plot.el("path", { d: Plot.path(ts.map((tp, i) => [P.x(tp * 1e9), P.y(pts[i][k] / Q)])), class: cls }, P.g);
    Plot.el("line", { x1: P.x(-80), x2: P.x(80), y1: P.y(1), y2: P.y(1), class: "stroke thin dash c-label-2" }, P.g);
    line("q1", "stroke c-tint"); line("q2", "stroke c-warn");
    if (mode === "transit") line("fil", "stroke c-ok");
    line("total", "stroke bold c-label");
    const ecart = Math.max(...pts.map(p => Math.abs(p.total - Q)));
    $("sbr").textContent = F.num(beta, 2);
    $("vdec").textContent = F.si(v.decalage, "s", { prefix: "n" });
    $("fdec").textContent = t("fig.f.decalage", { tau: F.si(tau, "s", { prefix: "n" }) });
    $("vecart").textContent = F.si(ecart, "C", { prefix: "n", sig: 2 });
    $("fecart").textContent = t(mode === "saut" ? "fig.f.saut" : "fig.f.transit");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; draw(); });
  sb.oninput = draw; draw();
})();

/* ---------- le système décrit : deux points à 1 m, vus depuis la Terre qui tourne autour du Soleil ---------- */
(() => {
  const c = Constantes.c, L = 1, v = 3e4, d = v * L / (c * c);
  $("sys1").innerHTML = t("sys1.body", { L: F.si(L, "m"), v: F.si(v, "m·s⁻¹"), d: F.qty(F.sci(d, 2), "s"), lc: F.si(L / c, "s", { prefix: "n" }), b2: F.sci((v / c) ** 2, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["franklin", 1747, "idea"], ["faraday", 1843, "experiment"], ["einstein", 1905, "idea"], ["borexino", 2015, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["jauge"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["local", "c"], ["teleport", "a"], ["simult", "d"], ["fil", "b"], ["integrale", "a"], ["ordre", "c"], ["energie", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 271 });
})();
</script>
