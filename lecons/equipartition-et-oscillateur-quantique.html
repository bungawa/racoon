<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, { k_B, hbar, c } = Constantes;

/* ---------- le spectre de Planck et l'énergie d'un oscillateur ---------- */
(() => {
  const svg = $("spec"), em = $("emoy"), sT = $("qT"), sW = $("qW"), W0 = 1e9, W1 = 1e17;
  const lg = (s, a, b) => a * Math.pow(b / a, +s.value);
  function draw() {
    const T = lg(sT, 2.7, 6000), w = lg(sW, W0, W1), kT = k_B * T, x = hbar * w / kT, wp = S.xPic * kT / hbar;
    const ip = S.planck(wp, T), ylo = ip * 1e-8, yhi = ip * 30;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { domain: [W0, W1], scale: "log", label: t("sim.x") }, y: { domain: [ylo, yhi], scale: "log", label: t("sim.y") } });
    const dans = v => v >= ylo && v <= yhi, pl = [], ra = [];
    for (let i = 0; i <= 400; i++) { const wi = W0 * Math.pow(W1 / W0, i / 400), p = S.planck(wi, T), r = S.rayleigh(wi, T);
      if (dans(r)) ra.push([o.x(wi), o.y(r)]); if (dans(p)) pl.push([o.x(wi), o.y(p)]); }
    if (ra.length > 1) Plot.el("path", { d: Plot.path(ra), class: "stroke c-warn" }, o.g);
    if (pl.length > 1) Plot.el("path", { d: Plot.path(pl), class: "stroke bold c-tint" }, o.g);
    Plot.el("line", { x1: o.x(w), x2: o.x(w), y1: o.y(ylo), y2: o.y(yhi), class: "stroke thin dash c-label" }, o.g);
    /* ⟨E⟩/k_BT en fonction de ħω/k_BT */
    em.innerHTML = "";
    const X0 = 0.01, X1 = 30, q = Plot.axes(em, { fmt: F, w: 640, h: 200, pad: { b: 44, l: 56 },
      x: { domain: [X0, X1], scale: "log", label: t("emoy.x"), fmt: v => F.num(v, 2) }, y: { domain: [0, 1.05], label: t("emoy.y"), fmt: v => F.fix(v, 1) } });
    const pe = []; for (let i = 0; i <= 200; i++) { const xi = X0 * Math.pow(X1 / X0, i / 200); pe.push([q.x(xi), q.y(xi / Math.expm1(xi))]); }
    Plot.el("line", { x1: q.x(X0), x2: q.x(X1), y1: q.y(1), y2: q.y(1), class: "ref" }, q.g);
    Plot.el("path", { d: Plot.path(pe), class: "stroke bold c-tint" }, q.g);
    const xm = Math.max(X0, Math.min(X1, x));
    Plot.el("circle", { cx: q.x(xm), cy: q.y(S.eMoyenne(w, T) / kT), r: 5, class: "fill c-warn" }, q.g);
    $("qTv").innerHTML = F.kelvin(T);
    $("qWv").textContent = t("sim.wv", { w: F.qty(F.sci(w, 2), "rad·s⁻¹"), l: F.si(2 * Math.PI * c / w, "m", { sig: 2 }) });
    $("vx").textContent = x < 1e4 ? F.num(x, 3) : F.sci(x, 2);
    const e = S.eMoyenne(w, T) / kT, n = Math.exp(-x);
    $("ve").textContent = e > 1e-3 ? F.num(e, 3) : e > 0 ? F.sci(e, 2) : "0";
    $("vn").textContent = n > 1e-3 ? F.num(n, 3) : n > 0 ? F.sci(n, 2) : "0";
    $("vpic").textContent = F.qty(F.sci(wp, 3), "rad·s⁻¹");
    $("fpic").textContent = t("sim.f.pic", { l: F.si(2 * Math.PI * c / wp, "m", { sig: 3 }) });
    $("vtot").textContent = F.num(S.energieJusqua(1e3 * wp, T, "planck") / (S.A_RAD * T ** 4), 6);
    $("sys").innerHTML = t("sys.inner", { T: F.kelvin(T), w: F.qty(F.sci(w, 2), "rad·s⁻¹"),
      dE: F.si(hbar * w / Constantes.e, "eV", { sig: 2 }), kT: F.si(kT / Constantes.e, "eV", { sig: 2 }),
      avis: t(x < 0.1 ? "sys.cl" : x > 10 ? "sys.gel" : "sys.entre") });
  }
  sT.oninput = sW.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lummer", 1899, "experiment"], ["planck1", 1900, "idea"], ["planck2", 1900, "idea"], ["firas", 1994, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["its90"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["marches", "c"], ["limite", "a"], ["froid", "d"], ["uv", "b"], ["pic", "a"], ["bruit", "c"], ["serie", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 413 });
})();
</script>
