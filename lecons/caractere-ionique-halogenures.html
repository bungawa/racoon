          </div>
          <div class="ctl"><div class="row"><label for="bhn" data-i18n="bh.n"></label><output id="bhnv" for="bhn"></output></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, R = CristalReel, H = R.HALOGENURES;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); return pick; };
const kJ = v => F.qty(F.num(v / 1e3, 4), "kJ·mol⁻¹"), pm = v => F.si(v, "m", { prefix: "p", sig: 4 });
const IDS = ["NaCl", "CsCl", "AgCl"];

/* ---------- les trois sels, puis les distances : mesurées contre somme des rayons ---------- */
(() => {
  keyed($("sels"), t("sels.tag"), IDS, textOf("sels.items", IDS));
  const txt = textOf("dist.items", IDS), items = {};
  IDS.forEach(id => { const h = H[id], d = R.distanceMX(h), s = h.rM + h.rCl;
    items[id] = { name: txt[id].name, text: t("dist.text", { d: pm(d), s: pm(s), e: F.qty(F.num(100 * (d - s) / s, 2), "%"), z: h.coordinence }) + " " + txt[id].text }; });
  keyed($("distances"), t("dist.tag"), IDS, items);
})();

/* ---------- le cycle de Born-Haber, et le modèle ionique à côté ---------- */
(() => {
  const svg = $("cycle"), E0 = -500e3, E1 = 1200e3, Y0 = 400, Y1 = 14, M = t("bh.M"), NIV = t("bh.niveaux");
  const y = E => Y0 + (E - E0) * (Y1 - Y0) / (E1 - E0);
  let cle = "NaCl";
  function draw() {
    const h = H[cle], n = +$("bhn").value, c = R.cycleBornHaber(h), dH = Object.fromEntries(c.pas.map(p => [p.id, p.dH]));
    const L = [0, dH.sublimation, dH.sublimation + dH.atomisation, dH.sublimation + dH.atomisation + dH.ionisation];
    L.push(L[3] + dH.attachement, -dH.formation);
    const Um = R.modeleIonique(h, n), Uc = R.energieCoulomb(h);
    svg.innerHTML = "";
    /* labels at the right of each level, pushed apart when two levels are close (CsCl: 27 kJ·mol⁻¹ between two of them) */
    const lab = L.map((E, k) => ({ k, y: y(E) + 4 })).sort((a, b) => b.y - a.y);
    lab.forEach((o, i) => { if (i && lab[i - 1].y - o.y < 14) o.y = lab[i - 1].y - 14; });
    L.forEach(E => P("line", { x1: 40, x2: 470, y1: y(E), y2: y(E), class: "stroke thin c-label-2" }, svg));
    lab.forEach(o => { P("text", { x: 478, y: o.y }, svg).textContent = NIV[o.k].replace("{m}", M[cle]); });
    const marche = (x, a, b, cls, lab) => { const g = P("g", { class: cls }, svg);
      Plot.fleche(g, [x, y(a)], [x, y(b)], { trait: "stroke bold" });
      P("text", { x: x + 6, y: (y(a) + y(b)) / 2 + 4 }, svg).textContent = lab; };
    marche(52, L[0], L[1], "c-label-2", F.num(dH.sublimation / 1e3, 4));
    marche(112, L[1], L[2], "c-label-2", F.num(dH.atomisation / 1e3, 4));
    marche(172, L[2], L[3], "c-label-2", F.num(dH.ionisation / 1e3, 4));
    marche(232, L[3], L[4], "c-label-2", F.num(dH.attachement / 1e3, 4));
    marche(300, L[4], L[5], "c-tint", F.num(c.U / 1e3, 4));
    marche(360, L[4], L[4] - Um, "c-warn", F.num(Um / 1e3, 4));
    const gc = P("g", { class: "c-label-2" }, svg);
    P("line", { x1: 410, x2: 410, y1: y(L[4]), y2: y(L[4] - Uc), class: "stroke dash" }, gc);
    P("circle", { cx: 410, cy: y(L[4] - Uc), r: 4, class: "stroke" }, gc);
    $("bhnv").textContent = F.num(n, 3);
    $("vcy").textContent = kJ(c.U);
    $("vmo").textContent = kJ(Um);
    $("fmo").textContent = t("bh.f.modele", { e: F.qty(F.num(100 * R.ecart(h, n), 2), "%") });
    $("vco").textContent = kJ(Uc);
    const nn = R.nNecessaire(h);
    $("fco").textContent = isFinite(nn) ? t("bh.f.coulomb.n", { n: F.num(nn, 2) }) : t("bh.f.coulomb.inf", { e: F.qty(F.num((c.U - Uc) / 1e3, 2), "kJ·mol⁻¹") });
  }
  $("bhn").oninput = draw;
  seg($("bhmode"), "d", v => { cle = v; $("bhn").value = H[v].nBorn; draw(); });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bornhaber", 1919, "idea"], ["fajans", 1923, "idea"], ["pauling", 1932, "idea"], ["shannon", 1976, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["electrode"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cycle", "c"], ["hess", "a"], ["agcl", "d"], ["exposant", "b"], ["distance", "c"], ["cscl", "a"], ["solubilite", "d"], ["electroneg", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
