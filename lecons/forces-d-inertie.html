<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS2 = "m·s⁻²", G = Inertie.G, L = 0.5, deg = r => r * 180 / Math.PI;

/* ---------- le pendule, vu depuis le véhicule ---------- */
(() => {
  const svg = $("pend"), P = Plot.el, asl = $("asl"), PX = 220;          // 1 m = 220 px; pivot at (320, 50)
  const RANGE = { voiture: [-8, 5, 3], ascenseur: [-G, 5, 2] };
  let mode = "voiture", anim = 0, run = null, t0 = 0;
  const arrow = (x1, y1, x2, y2, cls) => Plot.fleche(svg, [x1, y1], [x2, y2], { cls, tete: 10, min: 2 });
  const label = (x, y, key, anchor) => { P("text", { x, y, "text-anchor": anchor || "middle" }, svg).textContent = t(key); };
  const ae = () => mode === "voiture" ? [+asl.value, 0] : [0, +asl.value];
  function draw(theta) {
    svg.innerHTML = "";
    const a = ae(), ap = Inertie.apparent(a), ox = 320, oy = 50, K = 12;                   // K px per m·s⁻²
    P("rect", { x: 120, y: 30, width: 400, height: 240, rx: mode === "voiture" ? 28 : 6, class: "stroke c-label-2" }, svg);
    if (mode === "voiture") { P("circle", { cx: 200, cy: 270, r: 22, class: "stroke c-label-2" }, svg); P("circle", { cx: 440, cy: 270, r: 22, class: "stroke c-label-2" }, svg); }
    P("line", { x1: ox, y1: oy, x2: ox, y2: oy + 200, class: "stroke thin dash c-label-2" }, svg);
    label(ox + 8, oy + 24, "pend.verticale", "start");
    if (ap.norme > 0) {
      const ex = ox + 200 * Math.sin(ap.angle), ey = oy + 200 * Math.cos(ap.angle);
      P("line", { x1: ox, y1: oy, x2: ex, y2: ey, class: "stroke thin dash c-warn" }, svg);
    }
    const th = theta == null ? (ap.norme > 0 ? ap.angle : 0) : theta, bx = ox + L * PX * Math.sin(th), by = oy + L * PX * Math.cos(th);
    P("line", { x1: ox - 30, y1: oy, x2: ox + 30, y2: oy, class: "stroke bold c-label" }, svg);
    P("line", { x1: ox, y1: oy, x2: bx, y2: by, class: "stroke c-label" }, svg);
    arrow(bx, by, bx, by + G * K, "c-label");
    arrow(bx, by, bx - a[0] * K, by + a[1] * K, "c-warn");
    P("circle", { cx: bx, cy: by, r: 12, class: "fill c-tint" }, svg);
    const ax0 = 560, ay0 = 150; arrow(ax0, ay0, ax0 + a[0] * K, ay0 - a[1] * K, "c-tint");
    label(ax0, 136, "pend.ae.label");
  }
  function stats() {
    const a = ae(), ap = Inertie.apparent(a), T = Inertie.periode(L, ap.norme);
    $("aread").textContent = F.qty(F.num(+asl.value, 3), MS2);
    $("vangle").textContent = F.qty(F.num(deg(Math.abs(ap.angle)), 3), "°");
    $("fangle").textContent = t(ap.angle < -1e-9 ? "pend.f.arriere" : ap.angle > 1e-9 ? "pend.f.avant" : "pend.f.droit");
    $("vg").textContent = F.qty(F.num(ap.norme, 3), MS2);
    $("fg").textContent = t("pend.f.g", { r: F.num(ap.norme / G, 3) });
    $("vT").textContent = isFinite(T) ? F.si(T, "s", { prefix: "" }) : t("pend.none");
    $("fT").textContent = t("pend.f.T", { T0: F.si(Inertie.periode(L, G), "s", { prefix: "" }) });
  }
  function still() { cancelAnimationFrame(anim); run = null; stats(); draw(); }
  function go() {
    cancelAnimationFrame(anim);
    const theta0 = mode === "voiture" ? 0 : 0.35;                     // the car starts with the bob hanging; in the lift it is released aside
    run = Inertie.pendule({ L, ae: ae(), theta0, duree: 8, h: 2e-3 }); t0 = performance.now();
    const step = now => {
      if (!run) return;
      const tt = (now - t0) / 1000, i = Math.min(run.t.length - 1, Math.round(tt / 2e-3));
      draw(run.theta[i]); if (i < run.t.length - 1) anim = requestAnimationFrame(step); else run = null;
    };
    stats(); anim = requestAnimationFrame(step);
  }
  document.querySelectorAll("[data-v]").forEach(btn => btn.onclick = () => {
    mode = btn.dataset.v; document.querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    const [lo, hi, v] = RANGE[mode]; asl.min = lo; asl.max = hi; asl.value = v; still();
  });
  asl.oninput = still; $("go").onclick = go; still();
})();

/* ---------- le système décrit, chiffré ---------- */
(() => {
  const n = Dyna.negligeables({ v: 30, a: 3, taille: 0.03, echelle: L, duree: 10, lat: 48.85 * Math.PI / 180 });
  const bob = { d: 0.03, m: 7850 * Math.PI * 0.03 ** 3 / 6 }, ap = Inertie.apparent([3, 0]), vmax = 2 * Math.sqrt(ap.norme * L) * Math.sin(Math.abs(ap.angle) / 2);
  $("sys").innerHTML = t("sys.body", { cor: F.sci(n.coriolis, 1), ent: F.num(n.entrainement * 100, 2), point: F.num(n.point, 2),
    m: F.num(bob.m * 1000, 3), vmax: F.num(vmax, 2), tr: F.sci(Dyna.trainee(bob.d, bob.m, vmax), 1) });
})();

/* ---------- référentiels tournants : trois ordres de grandeur ---------- */
(() => {
  const w = 2 * Math.PI / 6, m = Inertie.tournant(w, 2, 1);
  const terre = Dyna.negligeables({ v: 10, a: G, taille: 0, echelle: 1, duree: 0, lat: 48.85 * Math.PI / 180 });
  const ROWS = [["manege", { e: F.qty(F.num(m.entrainement, 3), MS2), c: F.qty(F.num(m.coriolis, 3), MS2) }],
    ["terre", { e: F.qty(F.num(terre.entrainement * G, 3), MS2), r: F.num(terre.entrainement * 100, 2), c: F.qty(F.sci(terre.coriolis * G, 2), MS2) }]];
  const txt = textOf("rot.items", ROWS.map(r => r[0]));
  $("rot").innerHTML = ROWS.map(([id, v]) => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text.replace(/\{(\w+)\}/g, (s, k) => v[k] != null ? v[k] : s)}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["coriolis", 1835, "idea"], ["foucault", 1851, "experiment"], ["einstein", 1907, "idea"], ["zerog", 1988, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["accelero", "parabole"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["auteur", "a"], ["pendule", "a"], ["ascenseur", "a"], ["chute", "a"], ["masse", "a"], ["galileen", "a"], ["coriolis", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 125 });
})();
</script>
