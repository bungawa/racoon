<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Principes, C = Constantes;

/* the experiment of the figure: wire along z through the origin, a charge 1 cm away; the mirror has its normal along x */
const FIL = { I: 10, u: [0, 0, 1], q: 1e-6, r: [0.01, 0, 0] }, N = [1, 0, 0], VITESSE = 1e5;

/* ---------- le fil, la charge et leur image ---------- */
(() => {
  const svg = $("vue"), segs = { main: $("main"), sens: $("sens") }, st = { main: 1, sens: 1 };
  const S = 6000, Y = 150, CX = [160, 480];                 // px per metre; the two scenes, real (left) and mirrored (right)
  const px = (cx, r) => [cx + S * r[0], Y - S * r[1]];
  const unit = v => { const l = Math.hypot(v[0], v[1]); return l ? [v[0] / l, -v[1] / l] : [0, 0]; };
  const fleche = (o, d, len, cls, trait) => Plot.fleche(svg, o, [o[0] + len * d[0], o[1] + len * d[1]], { cls, trait: trait || "stroke bold" });
  function scene(cx, o, sim, image) {
    const R = S * 0.01;
    Plot.el("circle", { cx, cy: Y, r: R, class: "stroke thin dash c-label-2" }, svg);
    const sens = o.main * Math.sign(o.u[2]);                  // +1: B turns counterclockwise as drawn (seen from +z)
    for (const a of [0.6, 2.2, 3.8, 5.4]) {                    // arrows on the field line, direction given by the hand
      const p = [cx + R * Math.cos(a), Y - R * Math.sin(a)], d = [-Math.sin(a) * sens, -Math.cos(a) * sens];
      fleche(p, d, 14, "c-label-2", "stroke");
    }
    Plot.el("circle", { cx, cy: Y, r: 9, class: "stroke c-label" }, svg);
    Plot.el("circle", { cx, cy: Y, r: 2.5, class: "fill c-label" }, svg);        // ⊙: current out of the page
    const q = px(cx, o.r);
    Plot.el("circle", { cx: q[0], cy: q[1], r: 7, class: "fill c-tint" }, svg);
    Plot.el(o.v[2] > 0 ? "circle" : "path", o.v[2] > 0 ? { cx: q[0], cy: q[1], r: 2, class: "fill c-label" }
      : { d: `M${q[0] - 3} ${q[1] - 3}L${q[0] + 3} ${q[1] + 3}M${q[0] - 3} ${q[1] + 3}L${q[0] + 3} ${q[1] - 3}`, class: "stroke c-label" }, svg);
    const depuis = d => [q[0] + 9 * d[0], q[1] + 9 * d[1]];             // arrows start on the rim of the charge
    fleche(depuis(unit(sim.B)), unit(sim.B), 46, "c-label-2");
    fleche(depuis(unit(sim.F)), unit(sim.F), 56, "c-tint");
    if (image) fleche(depuis(unit(image)), unit(image), 46, "c-warn", "stroke bold dash");
    Plot.el("text", { x: cx, y: 32, "text-anchor": "middle" }, svg).textContent = t(image ? "fig.t.miroir" : "fig.t.reel");
  }
  function draw() {
    const o = Object.assign({}, FIL, { main: st.main, v: [0, 0, st.sens * VITESSE] });
    const reel = P.forceFil(o), mo = P.miroirFil(o, N), vu = P.forceFil(mo);
    const naif = P.transformer(P.miroir(N), reel.B, "polaire");             // B carried like an ordinary arrow
    svg.innerHTML = "";
    Plot.el("line", { x1: 320, y1: 20, x2: 320, y2: 290, class: "stroke dash c-label-2" }, svg);
    Plot.el("text", { x: 326, y: 288 }, svg).textContent = t("fig.t.plan");
    scene(CX[0], o, reel, null); scene(CX[1], mo, vu, naif);
    const tourne = st.main > 0 ? "fig.f.trigo" : "fig.f.horaire", vers = reel.F[0] < 0 ? "fig.f.vers" : "fig.f.loin";
    $("vb").textContent = F.si(Math.hypot(...reel.B), "T"); $("fb").textContent = t(tourne);
    $("vf").textContent = F.si(Math.hypot(...reel.F), "N"); $("ff").textContent = t(vers);
    const accord = Math.hypot(...vu.F.map((x, i) => x - P.transformer(P.miroir(N), reel.F, "polaire")[i])) < 1e-12 * Math.hypot(...reel.F);
    $("vm").textContent = t(accord ? "fig.f.oui" : "fig.f.non"); $("fm").textContent = t("fig.f.miroir");
    for (const k in segs) segs[k].querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === st[k])));
  }
  for (const k in segs) segs[k].querySelectorAll("button").forEach(b => b.onclick = () => { st[k] = +b.dataset.v; draw(); });
  draw();
})();

/* ---------- le système décrit ---------- */
(() => {
  const L = 1, d = FIL.r[0], o = Object.assign({}, FIL, { v: [0, 0, VITESSE] }), r = P.forceFil(o);
  $("sys").innerHTML = t("sys.body", { I: F.si(FIL.I, "A"), d: F.qty(F.num(d * 100, 3), "cm"), L: F.si(L, "m"), dL: F.sci(2 * (d / L) ** 2, 1),
    q: F.si(FIL.q, "C", { prefix: "µ" }), v: F.si(VITESSE, "m·s⁻¹", { prefix: "" }), vc: F.sci((VITESSE / C.c) ** 2, 1), B: F.si(Math.hypot(...r.B), "T", { prefix: "m" }),
    F: F.si(Math.hypot(...r.F), "N", { prefix: "µ" }) });
  const taille = 1.75;
  $("s3p2").innerHTML = t("s3.p2", { h: F.si(taille, "m"), a0: F.si(C.a0, "m", { prefix: "p" }), n: F.sci(taille / C.a0, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kant", 1768, "idea"], ["pasteur", 1848, "experiment"], ["ozma", 1960, "experiment"], ["gardner", 1964, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["vie", "aimant"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "c"], ["gauche", "a"], ["miroir", "d"], ["pole", "b"], ["telephone", "a"], ["coeur", "c"], ["impair", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 526 });
})();
</script>
