    <div class="eq"><math display="block"><mfrac><msub><mi>N</mi><mn>2</mn></msub><msub><mi>N</mi><mn>1</mn></msub></mfrac><mo>≈</mo><mn>4</mn><msup><mi>e</mi><mrow><mo>−</mo><mi>Δ</mi><mi>E</mi><mo>/</mo><msub><mi>k</mi><mi mathvariant="normal">B</mi></msub><mi>T</mi></mrow></msup></math></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/quantique-deux-etats.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- hydrogen: share of atoms excited to n = 2 at temperature T (ΔE = (3/4) 13,6 eV, weight 4); and the count (M s)^n ---------- */
(() => {
  const sT = $("sT"), sn = $("sn"), sM = $("sM"), EV = Constantes.e, KB = Constantes.k_B, DE = 0.75 * 13.6057 * EV;
  const part = T => 4 * Math.exp(-DE / (KB * T));
  function draw() {
    const T = Math.pow(10, +sT.value), n = +sn.value, M = Math.pow(10, +sM.value), svg = $("boltz"); svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 250, x: { domain: [100, 100000], scale: "log", label: t("fig.ax.T") }, y: { domain: [1e-30, 1], scale: "log", label: t("fig.ax.f") } });
    const Ts = Array.from({ length: 301 }, (_, k) => Math.pow(10, 2 + k * 0.01));
    Plot.el("path", { d: Plot.path(Ts.filter(x => part(x) > 1e-30).map(x => [ax.x(x), ax.y(Math.min(1, part(x)))])), class: "stroke c-tint", fill: "none" }, svg);
    Plot.el("line", { x1: ax.x(T), x2: ax.x(T), y1: ax.y(1e-30), y2: ax.y(1), class: "stroke thin dash c-label" }, svg);
    $("sTr").innerHTML = F.kelvin(T);
    $("snr").textContent = String(n); $("sMr").textContent = F.sci(M, 1);
    $("vkt").textContent = F.si(KB * T / EV, "eV"); $("fkt").textContent = t("fig.f.kt");
    const p = part(T); $("vexc").textContent = p < 1e-300 ? "< 10⁻³⁰⁰" : F.sci(Math.min(p, 1), 2);
    const N = Q.nombreAmplitudes(n, Math.round(M), 2);
    $("vn").textContent = Number.isFinite(N) ? F.sci(N, 3) : t("fig.trop");
    $("fn").textContent = t("fig.f.n", { l: F.num(n * Math.log10(2 * Math.round(M)), 3) });
  }
  sT.oninput = sn.oninput = sM.oninput = draw; draw();
  $("sys1").innerHTML = t("sys1.body", { p: F.sci(part(300), 2), kt: F.si(KB * 300 / EV, "eV") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["slac", 1968, "experiment"], ["nobel", 1990, "idea"], ["c60", 1999, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["chimie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["unique", "b"], ["electron", "d"], ["deux", "a"], ["proton", "c"], ["dix", "b"], ["compte", "a"], ["approx", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 803 });
})();
</script>
