<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, R = Constantes.R;
const pc = (x, n = 2) => F.num(100 * x, n) + F.NB + "%";

const cLum = Constantes.c, hP = Constantes.h, kB = Constantes.k_B;
/* ---------- maxima de quelques corps ---------- */
(() => {
  const ROWS = [["fond", 2.725], ["peau", 305], ["filament", 2800], ["soleil", S.T_SOLEIL]];
  $("tab").innerHTML = ROWS.map(([id, T]) => `<div><span class="k">${t("tab." + id)}</span><span>${t("tab.ligne", {
    T: F.qty(F.num(T, 4), "K"), l: F.si(S.wien(T), "m", { sig: 3 }), m: F.si(S.stefan(T), "W·m⁻²", { sig: 3 }) })}</span></div>`).join("");
})();

/* ---------- spectre du corps noir ---------- */
(() => {
  const svg = $("sp"), st = $("tt"), L0 = 1e-7, L1 = 1e-1, V0 = 380e-9, V1 = 780e-9;
  function draw() {
    const T = 3 * Math.pow(10000 / 3, +st.value / 100), lm = S.wien(T), num = S.wienNu(T);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 }, x: { scale: "log", domain: [L0, L1], label: t("sp.x") }, y: { domain: [0, 1.05], label: t("sp.y") } });
    Plot.el("rect", { x: o.x(V0), y: o.y(1.05), width: o.x(V1) - o.x(V0), height: o.y(0) - o.y(1.05), class: "fill c-ok", opacity: 0.25 }, o.g);
    const a = [], b = [], pl = S.planckLambda(lm, T), pn = S.planckNu(num, T);
    for (let i = 0; i <= 400; i++) { const l = L0 * Math.pow(L1 / L0, i / 400); a.push([o.x(l), o.y(S.planckLambda(l, T) / pl)]); b.push([o.x(l), o.y(S.planckNu(cLum / l, T) / pn)]); }
    Plot.el("path", { d: Plot.path(b), class: "stroke dash c-warn" }, o.g); Plot.el("path", { d: Plot.path(a), class: "stroke c-tint" }, o.g);
    $("ttv").innerHTML = F.kelvin(T);
    $("vlmax").textContent = F.si(lm, "m", { sig: 3 });
    $("vnumax").textContent = F.si(num, "Hz", { sig: 3 }); $("fnumax").textContent = t("sp.f.numax", { l: F.si(cLum / num, "m", { sig: 3 }) });
    $("vm").textContent = F.si(S.stefan(T), "W·m⁻²", { sig: 3 });
    const vis = S.fractionBande(T, V0, V1), ir = S.fractionBande(T, V1, 1);
    $("vvis").textContent = vis < 1e-4 ? t("sp.zero") : pc(vis); $("vir").textContent = pc(ir, 3);
    $("sys").innerHTML = t("sys.inner", { T: F.kelvin(T), l: F.si(lm, "m", { sig: 2 }), e: F.qty(F.num(hP * cLum / (lm * 1.602176634e-19), 2), "eV"),
      avis: t(T < 500 ? "sys.froid" : T < 3000 ? "sys.rouge" : "sys.blanc") });
  }
  st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kirchhoff", 1860, "idea"], ["stefan", 1879, "experiment"], ["boltzmann", 1884, "idea"], ["wien", 1893, "idea"], ["planck", 1900, "idea"], ["firas", 1994, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["camera", "lampe"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["noir", "b"], ["wien", "c"], ["stefan", "a"], ["maxima", "d"], ["filament", "b"], ["soleil", "a"], ["gris", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 9302 });
})();
</script>
