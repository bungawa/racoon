<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, DEG = Math.PI / 180;

/* ---------- scattering by a spin-0 atom: intensity against θ for a chosen linear polarization, and unpolarized ---------- */
(() => {
  const svg = $("courbe"), schi = $("schi"), sth = $("sth");
  function draw() {
    const chi = +schi.value * DEG, th = +sth.value * DEG;
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { domain: [0, 180], label: t("fig.x"), fmt: v => F.num(v, 3) + "°" }, y: { domain: [0, 1.05], label: t("fig.y") } });
    const pol = [], np = [], dg = [];
    for (let i = 0; i <= 180; i++) { const r = Q.diffusionPolarisee(i * DEG, chi); pol.push([ax.x(i), ax.y(r.I)]); np.push([ax.x(i), ax.y(r.Inonpol)]); dg.push([ax.x(i), ax.y(r.degre)]); }
    Plot.el("path", { d: Plot.path(dg), class: "stroke dash c-warn" }, ax.g);
    Plot.el("path", { d: Plot.path(np), class: "stroke c-ok" }, ax.g);
    Plot.el("path", { d: Plot.path(pol), class: "stroke bold c-tint" }, ax.g);
    const r = Q.diffusionPolarisee(th, chi);
    Plot.el("circle", { cx: ax.x(+sth.value), cy: ax.y(r.I), r: 5, class: "fill c-tint" }, ax.g);
    $("schir").textContent = F.num(+schi.value, 3) + "°";
    $("sthr").textContent = F.num(+sth.value, 3) + "°";
    $("vi").textContent = F.fix(r.I, 3);
    $("fi").textContent = t("fig.f.i", { x: F.fix(r.ax, 3), y: F.fix(r.ay, 3) });
    $("vd").textContent = F.num(100 * r.degre, 3) + " %";
    $("fd").textContent = t("fig.f.degre", { v: F.fix(r.Inonpol, 3) });
  }
  schi.oninput = sth.oninput = draw; draw();
})();

/* ---------- the system described: why the sky is blue and not violet-white ---------- */
(() => {
  const r = (l1, l2) => (l2 / l1) ** 4;
  $("sys1").innerHTML = t("sys1.body", { r: F.num(r(450, 700), 2) });
  $("sys2").innerHTML = t("sys2.body", { ka: F.sci(2 * Math.PI * 0.3e-9 / 500e-9, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["tyndall", 1869, "experiment"], ["rayleigh", 1871, "idea"], ["raman", 1928, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ciel"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "c"], ["lineaire", "a"], ["quatrevingtdix", "d"], ["perp", "b"], ["ciel", "c"], ["classique", "a"], ["energie", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1802 });
})();
</script>
