    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><msub><mover accent="true"><mi mathvariant="script">M</mi><mo>→</mo></mover><mi>O</mi></msub><mo>(</mo><mover accent="true"><mi>F</mi><mo>→</mo></mover><mo>)</mo><mo>=</mo><mover accent="true"><mrow><mi>O</mi><mi>M</mi></mrow><mo>→</mo></mover><mo>∧</mo><mover accent="true"><mi>F</mi><mo>→</mo></mover></math></div>

    <div class="eq"><math display="block"><mfrac><mrow><mi mathvariant="normal">d</mi><msub><mover accent="true"><mi>L</mi><mo>→</mo></mover><mi>O</mi></msub></mrow><mrow><mi mathvariant="normal">d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mover accent="true"><mi mathvariant="script">M</mi><mo>→</mo></mover><mi>O</mi></msub><mo>(</mo><msub><mover accent="true"><mi>F</mi><mo>→</mo></mover><mi>i</mi></msub><mo>)</mo></math></div>

        <button type="button" id="f-ressort" aria-pressed="false"></button>
        <button type="button" id="f-uniforme" aria-pressed="false"></button>
        <button type="button" id="f-freinee" aria-pressed="false"></button>
      </div>
      <svg class="fig" id="traj" viewBox="0 0 640 340" role="img" data-i18n-attr="aria-label:sim.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="sim.legend.traj"></span><span class="c-warn" data-i18n="sim.legend.o"></span><span class="c-label-2 ring" data-i18n="sim.legend.m"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="v0" data-i18n="sim.v0"></label><output id="v0v" for="v0"></output></div>
            <input id="v0" type="range" min="0.5" max="1.4" step="0.05" value="0.8"></div>
          <div class="ctl"><div class="row"><label for="al" data-i18n="sim.alpha"></label><output id="alv" for="al"></output></div>
            <input id="al" type="range" min="45" max="135" step="5" value="90"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="sim.k.l0"></span><span class="v" id="vl0"></span></div>
          <div class="stat"><span class="k" data-i18n="sim.k.l1"></span><span class="v" id="vl1"></span><span class="f" id="fl1"></span></div>
          <div class="stat"><span class="k" data-i18n="sim.k.m"></span><span class="v" id="vm"></span></div>
          <div class="stat"><span class="k" data-i18n="sim.k.thm"></span><span class="v" id="vthm"></span><span class="f" data-i18n="sim.f.thm"></span></div>

      <figcaption data-i18n-html="sim.caption"></figcaption>

    <figure class="chart">

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
const sci = (x, n) => Math.abs(x) >= 1e-2 && Math.abs(x) < 1e4 ? F.num(x, n) : F.sci(x, n);
const UL = "kg·m²·s⁻¹";

/* ---------- un point de 1 kg, O fixe, quatre forces de même intensité au départ (1 N à 1 m) ---------- */
(() => {
  const IDS = ["newton", "ressort", "uniforme", "freinee"], NAMES = textOf("sim.forces", IDS), P = Plot.el;
  const O = { newton: { k: 1 }, ressort: { w: 1 }, uniforme: { g: [0, -1] }, freinee: { k: 1, alpha: 0.1 } };
  const H = 0.005, N = 2000;                                  // 10 s
  let f = "newton";
  function upd() {
    IDS.forEach(id => $("f-" + id).setAttribute("aria-pressed", String(id === f)));
    const v0 = +$("v0").value, al = +$("al").value * Math.PI / 180;
    $("v0v").textContent = F.qty(F.num(v0, 3), "m·s⁻¹"); $("alv").textContent = F.qty(F.num(+$("al").value, 3), "°");
    const r = FC.suivre(f, O[f], { t: 0, x: [1, 0], v: [v0 * Math.cos(al), v0 * Math.sin(al)] }, H, N, 1);
    /* trajectory, fitted to the frame, O kept in view */
    const svg = $("traj"), W = 640, HT = 340, xs = r.x.map(p => p[0]).concat(0), ys = r.x.map(p => p[1]).concat(0);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const k = Math.min((W - 40) / Math.max(x1 - x0, 1e-9), (HT - 40) / Math.max(y1 - y0, 1e-9));
    const X = x => W / 2 + k * (x - (x0 + x1) / 2), Y = y => HT / 2 - k * (y - (y0 + y1) / 2);
    svg.innerHTML = "";
    P("path", { d: r.x.filter((_, i) => i % 4 === 0 || i === N).map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(""), class: "stroke c-tint" }, svg);
    P("circle", { cx: X(0), cy: Y(0), r: 6, class: "fill c-warn" }, svg);
    P("circle", { cx: X(1), cy: Y(0), r: 5, class: "stroke thin c-label-2" }, svg);
    const last = r.x[N]; P("circle", { cx: X(last[0]), cy: Y(last[1]), r: 4, class: "fill c-label-2" }, svg);
    /* stats */
    const L0 = r.L[0], L1 = r.L[N], Mmax = Math.max(...r.M.map(Math.abs));
    $("vl0").textContent = F.qty(F.num(L0, 3), UL);
    $("vl1").textContent = F.qty(F.num(L1, 3), UL);
    $("fl1").textContent = t(Math.abs(L1 / L0 - 1) < 1e-9 ? "sim.f.conserve" : "sim.f.change", { x: F.num((L1 / L0 - 1) * 100, 3) });
    $("vm").textContent = Mmax < 1e-12 ? t("sim.nul") : F.qty(F.num(Mmax, 3), "N·m");
    $("vthm").textContent = sci(r.ecart, 2);
    /* L(t) and L(0) + ∫ M dt */
    const all = r.L.concat(r.integrale), lo = Math.min(...all), hi = Math.max(...all), pad = Math.max((hi - lo) * 0.1, Math.abs(hi) * 0.1, 0.05);
    const lp = $("lplot"); lp.innerHTML = "";
    const { x: Xp, y: Yp, g } = Plot.axes(lp, { fmt: F, w: 640, h: 260, pad: { b: 44 }, x: { domain: [0, N * H], label: t("lp.x") }, y: { domain: [lo - pad, hi + pad], label: t("lp.y") } });
    const line = (arr, cls) => P("path", { d: arr.map((v, i) => (i ? "L" : "M") + Xp(r.t[i]).toFixed(1) + " " + Yp(v).toFixed(1)).filter((_, i) => i % 5 === 0 || i === N).join(""), class: cls }, g);
    line(r.L, "curve"); line(r.integrale, "ref");
  }
  IDS.forEach(id => { $("f-" + id).textContent = NAMES[id]; $("f-" + id).onclick = () => { f = id; upd(); }; });
  $("v0").oninput = $("al").oninput = upd; upd();
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["point", "referentiel", "vitesse"], items = textOf("sys.items", IDS);
  const an = 365.25 * 86400, spin = 0.4 * (Constantes.R_E_mean / Constantes.au) ** 2 * (Constantes.Omega_E * an / (2 * Math.PI));
  const v = { spin: F.sci(spin, 1), spinReel: F.sci(FC.rotationPropre(0.3307), 2), cor: F.sci(2 * Constantes.Omega_E / Constantes.g0, 2), rel: F.sci((8e3 / Constantes.c) ** 2 / 2, 1) };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kepler", 1609, "idea"], ["newton", 1687, "idea"], ["rutherford", 1911, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cle", "diffusion"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["origine", "a"], ["rectiligne", "a"], ["radial", "a"], ["poids", "a"], ["theoreme", "a"], ["frein", "a"], ["bras", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 181 });
})();
</script>
