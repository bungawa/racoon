<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = Thermo.CAOUTCHOUC, SECTION = 1e-6;                    // a band of 1 mm × 1 mm cross-section

/* ---------- le système ---------- */
(() => {
  $("sys").innerHTML = t("sys.inner", { G: F.si(M.G0, "Pa", { sig: 1 }), T0: F.kelvin(M.T0), rho: F.qty(F.num(M.rho, 3), "kg·m⁻³"), c: F.qty(F.num(M.c, 3), "J·kg⁻¹·K⁻¹"),
    r: F.sci((Thermo.adiabatique(6) - M.T0) / M.T0, 1) });
})();

/* ---------- l'élastique : force, travail, chaleur, échauffement ---------- */
(() => {
  const svg = $("courbe"), sl = $("lam"), st = $("te");
  function draw() {
    const lam = +sl.value, T = +st.value, m = Object.assign({}, M, { G0: M.G0 * T / M.T0, T0: T });   // the same rubber, starting at T
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 }, x: { domain: [1, 6], label: t("el.x") }, y: { domain: [0, 5], label: t("el.y") } });
    const pts = TT => { const out = []; for (let i = 0; i <= 100; i++) { const l = 1 + 5 * i / 100; out.push([o.x(l), o.y(Thermo.contrainte(l, TT) / 1e6)]); } return out; };
    Plot.el("path", { d: Plot.path(pts(M.T0)), class: "ref" }, o.g);
    Plot.el("path", { d: Plot.path(pts(T)), class: "curve" }, o.g);
    const s = Thermo.contrainte(lam, T), w = Thermo.travail(lam, T);
    Plot.el("circle", { cx: o.x(lam), cy: o.y(s / 1e6), r: 6, class: "dot" }, o.g);
    $("lamv").textContent = F.fix(lam, 2);
    $("tev").innerHTML = F.kelvin(T);
    $("vf").textContent = F.si(s * SECTION, "N", { sig: 2 });
    $("vw").textContent = F.si(w, "J·m⁻³", { sig: 2 });
    $("vq").textContent = F.si(w, "J·m⁻³", { sig: 2 });
    $("vdt").textContent = F.qty("+" + F.fix(Thermo.adiabatique(lam, m) - T, 2), "K");
  }
  sl.oninput = st.oninput = draw; draw();
})();

/* ---------- règles de substitution, et Mayer pour un gaz réel ---------- */
(() => {
  const ROWS = ["gaz", "elastique", "pile", "enthalpie"], txt = textOf("regles.rows", ROWS);
  $("regles").innerHTML = ROWS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text}</span></div>`).join("");
  const R = Constantes.R, n2 = Thermo.vdw("N2");
  $("mayer").innerHTML = t("s5.mayer", { r1: F.fix(Thermo.cpMoinsCv(n2, 1, 0.0224, 300) / R, 3), r2: F.fix(Thermo.cpMoinsCv(n2, 1, 1e-3, 300) / R, 2), T: F.kelvin(300) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gough", 1805, "experiment"], ["kelvin", 1857, "idea"], ["joule", 1859, "experiment"], ["helmholtz", 1882, "idea"], ["guth", 1941, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["batterie", "chimie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["etirer", "b"], ["chauffer", "a"], ["isotherme", "d"], ["pile", "c"], ["courant", "b"], ["enthalpie", "a"], ["ordre", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 452 });
})();
</script>
