<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- ordres de grandeur : quelle masse de chaque « réservoir » pour une énergie donnée ---------- */
(() => {
  const FORMS = ["chute", "chauffe", "batterie", "tnt", "sucre", "graisse", "essence", "uranium", "masse"], txt = textOf("oom.rows", FORMS);
  const esl = $("esl"), LO = -18, HI = 6;                       // track: masses from 10⁻¹⁸ kg to 10⁶ kg
  const mass = m => m >= 1000 ? F.qty(F.num(m / 1000, 3), "t") : m >= 1e-15 ? F.si(m * 1000, "g") : F.qty(F.sci(m, 3), "kg");
  function upd() {
    const E = Math.pow(10, +esl.value);
    $("eread").textContent = F.si(E, "J");
    $("ehint").textContent = t("oom.kwh", { k: F.num(E / Energie.KWH, 3) });
    $("oom").innerHTML = FORMS.map(f => { const m = Energie.massFor(E, f), pos = Math.max(0, Math.min(1, (Math.log10(m) - LO) / (HI - LO)));
      return `<div role="row"><span role="cell">${txt[f]}</span><span class="track" aria-hidden="true"><i style="left:${(pos * 100).toFixed(1)}%"></i></span><span class="v" role="cell">${mass(m)}</span></div>`; }).join("");
  }
  document.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { esl.value = b.dataset.e; upd(); });
  esl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hooke", 1678, "idea"], ["rumford", 1798, "experiment"], ["joule", 1850, "experiment"], ["einstein", 1905, "idea"], ["cockcroft", 1932, "experiment"], ["fission", 1938, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tep", "centrale"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ressort", "a"], ["chaleur", "a"], ["frottement", "a"], ["chimie", "a"], ["noyau", "a"], ["masse", "a"], ["sucre", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 44 });
})();
</script>
