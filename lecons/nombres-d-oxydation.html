<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions;
const keyed = (id, k, ids) => { const txt = textOf(k, ids); $(id).innerHTML = ids.map(i => `<div><span class="k">${txt[i].k}</span><span>${txt[i].v}</span></div>`).join(""); };
keyed("ions", "s2.ions", ["thio", "tetra", "perm", "dichr", "hypo", "perox"]);
keyed("methode", "s3.methode", ["el", "o", "h", "e"]);
const no = x => (x > 0 ? "+" : "") + F.num(x, 3);                         // signed: +7, −1, 2,5
const ecrite = eq => t("eq.ecrite", { g: C.cote(eq.gauche), d: C.cote(eq.droite) });
const nomCouple = c => t("eq.nomcouple", { ox: C.texte(c.ox), red: C.texte(c.red) });

/* the couples of the page: the table of the world, plus hypochlorite (no E° needed to balance) */
const COUPLES = C.COUPLES.filter(c => C.phase(c.red) !== "solide" || ["zn", "cu", "fe2", "ag", "cu1"].includes(c.id))
  .concat([{ id: "clo", ox: "ClO^-", red: "Cl^-" }, { id: "clocl2", ox: "ClO^-", red: "Cl2" }]);
const elementRedox = c => { const fo = C.formule(c.ox), fr = C.formule(c.red);
  return Object.keys(fo.atomes).find(X => X !== "O" && X !== "H" && fr.atomes[X]) ||
    (fo.atomes.O && fr.atomes.O && C.nombreOxydation(c.ox, "O") !== C.nombreOxydation(c.red, "O") ? "O" : "H"); };
const fill = (sel, list, val) => { $(sel).innerHTML = list.map(c => `<option value="${c.id}">${nomCouple(c)}</option>`).join(""); $(sel).value = val; };

/* ---------- §3 : équilibrer une demi-équation, étape par étape ---------- */
(() => {
  fill("couple", COUPLES, "mn");
  let milieu = "acide";
  const ETAPES = ["el", "o", "h", "e", "b"], txt = textOf("eq.etapes", ETAPES);
  function draw() {
    const c = COUPLES.find(x => x.id === $("couple").value), X = elementRedox(c);
    const d = C.demiEquation(c.ox, c.red, "acide"), db = C.demiEquation(c.ox, c.red, "basique");
    const a = d.gauche[c.ox], noOx = C.nombreOxydation(c.ox, X), noRed = C.nombreOxydation(c.red, X);
    $("noox").textContent = no(noOx); $("fnoox").textContent = t("eq.f.no", { x: X, s: C.texte(c.ox) });
    $("nored").textContent = no(noRed); $("fnored").textContent = t("eq.f.no", { x: X, s: C.texte(c.red) });
    $("ne").textContent = d.n;
    $("fne").textContent = t("eq.f.n", { a: a * C.formule(c.ox).atomes[X], d: F.num(noOx - noRed, 3) });
    /* each step keeps the species balanced so far: element, then H₂O, then H⁺, then e⁻ */
    const garde = keys => ({ gauche: Object.fromEntries(Object.entries(d.gauche).filter(([s]) => keys.includes(s))),
      droite: Object.fromEntries(Object.entries(d.droite).filter(([s]) => keys.includes(s))) });
    const base = [c.ox, c.red];
    const lignes = [["el", garde(base)], ["o", garde([...base, "H2O"])], ["h", garde([...base, "H2O", "H^+"])], ["e", d]];
    if (milieu === "basique") lignes.push(["b", db]);
    $("etapes").innerHTML = lignes.map(([id, eq]) => `<div><span class="k">${txt[id]}</span><span>${ecrite(eq)}</span></div>`).join("");
    $("milieu").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === milieu)));
  }
  $("couple").onchange = draw;
  $("milieu").querySelectorAll("button").forEach(b => b.onclick = () => { milieu = b.dataset.m; draw(); });
  draw();
})();

/* ---------- §4 : combiner deux demi-équations ---------- */
(() => {
  fill("bilox", COUPLES, "mn"); fill("bilred", COUPLES, "fe32");
  let milieu = "acide";
  const ligne = v => `<div><span class="k">${t("bil.k.eq")}</span><span>${v}</span></div>`;
  function draw() {
    const c1 = COUPLES.find(x => x.id === $("bilox").value), c2 = COUPLES.find(x => x.id === $("bilred").value);
    $("bilmilieu").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === milieu)));
    if (c1 === c2) { $("bilan").innerHTML = ligne(t("bil.meme")); $("biln").textContent = "–"; $("fbiln").textContent = ""; $("biltype").textContent = "–"; return; }
    const e = C.bilan(c1, c2, milieu), n1 = C.demiEquation(c1.ox, c1.red, milieu).n, n2 = C.demiEquation(c2.ox, c2.red, milieu).n;
    $("bilan").innerHTML = ligne(ecrite(e));
    $("biln").textContent = e.n; $("fbiln").textContent = t("bil.f.n", { n1, n2, k1: e.n / n1, k2: e.n / n2 });
    const X1 = elementRedox(c1), X2 = elementRedox(c2);
    $("biltype").textContent = t(X1 !== X2 ? "bil.type.simple" : c1.ox === c2.red ? "bil.type.dismut" : c1.red === c2.ox ? "bil.type.medi" : "bil.type.meme");
  }
  $("bilox").onchange = $("bilred").onchange = draw;
  $("bilmilieu").querySelectorAll("button").forEach(b => b.onclick = () => { milieu = b.dataset.m; draw(); });
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lavoisier", 1777, "idea"], ["berthollet", 1789, "use"], ["stock", 1919, "idea"], ["borkenstein", 1954, "use"], ["iupac", 2016, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["javel", "fer", "dosage"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["mn", "c"], ["s4o6", "b"], ["h2o2", "d"], ["electrons", "a"], ["eau", "b"], ["basique", "c"], ["javel", "a"], ["dismut", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2611 });
})();
</script>
