<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const pressSeg = (seg, attr, val) => seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset[attr] === val)));

/* ---------- la vitesse de dérive dans un fil ---------- */
(() => {
  const seg = $("metal"), isl = $("isl"), ssl = $("ssl"), e = Constantes.e;
  let metal = "cuivre";
  seg.onclick = ev => { const b = ev.target.closest("button"); if (!b) return; metal = b.dataset.m; pressSeg(seg, "m", metal); draw(); };
  function draw() {
    const I = Math.pow(10, -3 + 5 * isl.value / 500), S = 1e-6 * Math.pow(10, -1 + 2 * ssl.value / 200), N = MagInd.PORTEURS[metal];
    const v = MagInd.vitesseDerive(I, S, N, -e), tm = 1 / v;
    $("iread").textContent = F.si(I, "A");
    $("sread").textContent = F.qty(F.num(S * 1e6, 2), "mm²");
    $("vj").textContent = F.si(I / S, "A·m⁻²");
    $("vv").textContent = F.si(v, "m·s⁻¹");
    $("vt").textContent = tm < 1e3 ? F.si(tm, "s") : F.qty(F.sci(tm, 3), "s");
    $("vrho").textContent = F.qty(F.sci(N * e, 3), "C·m⁻³");
  }
  isl.oninput = ssl.oninput = draw; pressSeg(seg, "m", metal); draw();
})();

/* ---------- un paquet de charge qui traverse une boîte ---------- */
(() => {
  const Q = 1e-9, v = 1, D = 0.1, s0 = 0.2, a = 0.5, b = 1.5, X = [-1, 4], P = MagInd.paquet1D(Q, v, D, s0);
  const svg = $("paquet"), tsl = $("tsl"), seg = $("courant");
  let mode = "complet";
  seg.onclick = ev => { const bt = ev.target.closest("button"); if (!bt) return; mode = bt.dataset.c; pressSeg(seg, "c", mode); draw(); };
  const nC = x => F.qty(F.num(x * 1e9, 3), "nC·m⁻²");
  function draw() {
    const tt = 3 * tsl.value / 300, rmax = P.rho(0, 0) * 1.1;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: X, label: t("pa.x") }, y: { domain: [0, rmax * 1e9], label: t("pa.y") } });
    const gb = Plot.el("g", { class: "c-label-2" }, g);
    [a, b].forEach(xb => Plot.el("line", { x1: x(xb), x2: x(xb), y1: y(0), y2: y(rmax * 1e9), class: "stroke dash" }, gb));
    const xs = Array.from({ length: 251 }, (_, i) => X[0] + (X[1] - X[0]) * i / 250);
    Plot.el("path", { d: Plot.path(xs.map(u => [x(u), y(P.rho(u, tt) * 1e9)])), class: "stroke" }, Plot.el("g", { class: "c-tint" }, g));
    const gain = P.charge(a, b, tt) - P.charge(a, b, 0), entre = tt > 0 ? P.apport(a, b, 0, tt, mode === "complet" ? P.j : P.advection) : 0;
    $("tread").textContent = F.qty(F.fix(tt, 2), "s");
    $("vgain").textContent = nC(gain);
    $("ventre").textContent = nC(entre);
    $("vecart").textContent = Math.abs(entre - gain) < 1e-6 * Q ? nC(0) : nC(entre - gain);   // below Simpson's error: zero
  }
  tsl.oninput = draw; pressSeg(seg, "c", mode); draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1843, "experiment"], ["kirchhoff", 1845, "idea"], ["drude", 1900, "idea"], ["tolman", 1916, "experiment"], ["borexino", 2015, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["circuits", "electrolyse"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["derive", "b"], ["ampoule", "c"], ["neutre", "a"], ["signe", "d"], ["boite", "b"], ["noeud", "a"], ["divergence", "c"], ["diffusion", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 132 });
})();
</script>
