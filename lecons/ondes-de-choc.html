<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §51-2 : le mascaret, h₁ = 2 m devant ---------- */
(() => {
  const O = self.Ondes, H1 = 2, RS = Array.from({ length: 201 }, (_, i) => 1 + 2 * i / 200);
  function upd() {
    const r = +$("hr").value, m = O.mascaret(H1, r * H1), svg = $("ms"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 250, pad: { l: 52, b: 44 }, x: { domain: [1, 3], label: t("ms.xaxis") }, y: { domain: [0, 2.5], label: t("ms.yaxis") } });
    Plot.el("line", { x1: P.x(1), x2: P.x(3), y1: P.y(1), y2: P.y(1), class: "stroke thin dash c-label-2" }, P.g);
    const M = RS.map(q => O.mascaret(H1, q * H1));
    Plot.el("path", { d: Plot.path(RS.map((q, i) => [P.x(q), P.y(M[i].froude1)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(RS.map((q, i) => [P.x(q), P.y(M[i].froude2)])), class: "stroke c-warn" }, P.g);
    Plot.el("line", { x1: P.x(r), x2: P.x(r), y1: P.y(0), y2: P.y(2.5), class: "ref" }, P.g);
    $("hrv").textContent = F.num(r, 3) + " (" + F.si(r * H1, "m") + ")";
    $("vmu").textContent = F.si(m.u, "m·s⁻¹"); $("fmu").textContent = t("ms.f.u", { c: F.si(m.c1, "m·s⁻¹"), f: F.num(m.froude1, 3) });
    $("vmv").textContent = F.si(m.v, "m·s⁻¹"); $("fmv").textContent = t("ms.f.v", { c: F.si(m.c2, "m·s⁻¹"), f: F.num(m.froude2, 3) });
    $("vmp").textContent = F.si(m.puissance, "W·m⁻¹"); $("fmp").textContent = t("ms.f.p", { d: F.si(m.dH, "m") });
  }
  $("hr").oninput = upd; upd();
})();

/* ---------- §51-2 : choc droit dans l'air au repos à 293 K ---------- */
(() => {
  const O = self.Ondes, T1 = 293.15, C1 = O.milieu("air", T1, Constantes.atm).c, LS = Array.from({ length: 251 }, (_, i) => -3 + 5 * i / 250);
  function upd() {
    const l = +$("dp").value, r = 1 + 10 ** l, s = O.chocNormal(O.machDeSurpression(r)), svg = $("rh"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 250, pad: { l: 52, b: 44 }, x: { domain: [-3, 2], label: t("rh.xaxis"), fmt: v => "10" + F.sup(Math.round(v)) }, y: { domain: [0.8, 12], scale: "log", label: t("rh.yaxis") } });
    const S = LS.map(q => O.chocNormal(O.machDeSurpression(1 + 10 ** q)));
    Plot.el("line", { x1: P.x(-3), x2: P.x(2), y1: P.y(1), y2: P.y(1), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(LS.map((q, i) => [P.x(q), P.y(S[i].M)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(LS.map((q, i) => [P.x(q), P.y(S[i].arriere)])), class: "stroke c-warn" }, P.g);
    Plot.el("line", { x1: P.x(l), x2: P.x(l), y1: P.y(0.8), y2: P.y(12), class: "ref" }, P.g);
    $("dpv").textContent = F.num(10 ** l, 3) + " (" + F.si(10 ** l * Constantes.atm, "Pa") + ")";
    $("vrw").textContent = F.si(s.M * C1, "m·s⁻¹"); $("frw").textContent = t("rh.f.w", { m: F.num(s.M, 4), a: F.si(s.arriere * C1, "m·s⁻¹") });
    $("vrt").innerHTML = F.kelvin(s.T * T1); $("frt").textContent = t("rh.f.t", { v: F.si(s.v * C1, "m·s⁻¹"), r: F.num(s.rho, 3) });
    $("vrs").textContent = F.sci(s.entropie, 2); $("frs").textContent = t("rh.f.s", { m: F.num(s.M2, 3) });
  }
  $("dp").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rankine", 1870, "idea"], ["hugoniot", 1887, "idea"], ["taylor", 1950, "idea"], ["lithotripsie", 1980, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lithotripsie", "mascaret"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["raidir", "c"], ["parole", "a"], ["masse", "d"], ["vitesse", "b"], ["inverse", "a"], ["devant", "c"], ["chaleur", "d"], ["faible", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 512 });
})();
</script>
