<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- trois chemins de A à B, quatre forces ---------- */
(() => {
  const C = Potentiel.CHAMPS, H = Potentiel.CHEMINS, A = [0.5, 0], B = [2, 1], svg = $("paths"), P = Plot.el, bsl = $("bsl");
  const FIELDS = { poids: C.poids(1), ressort: C.ressort(10), tourbillon: C.tourbillon(2), frottement: C.frottement(2) };
  let field = "poids";
  const X = Plot.linScale(-0.3, 2.9, 40, 600), Y = Plot.linScale(-0.6, 1.9, 290, 20);
  const arrow = (x1, y1, x2, y2, cls) => Plot.fleche(svg, [x1, y1], [x2, y2], { cls, tete: 7, trait: "stroke thin", min: 2 });
  const line = (c, cls) => { let d = ""; for (let i = 0; i <= 100; i++) { const p = c(i / 100); d += (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1); } P("path", { d, class: cls }, svg); };
  function draw() {
    const b = bsl.value / 100, Fd = FIELDS[field], seg = H.segment(A, B), equ = H.equerre(A, B), arc = H.arc(A, B, b);
    svg.innerHTML = "";
    if (field !== "frottement") {
      const pts = []; for (let i = 0; i <= 8; i++) for (let j = 0; j <= 6; j++) pts.push([-0.2 + i * 0.375, -0.5 + j * 0.375]);
      const mx = Math.max(...pts.map(p => Math.hypot(...Fd(p, [1, 0]))));
      pts.forEach(p => { const f = Fd(p, [1, 0]), k = 26 / mx; arrow(X(p[0]), Y(p[1]), X(p[0]) + k * f[0], Y(p[1]) - k * f[1], "c-label-2"); });
    } else [seg, equ, arc].forEach(c => [0.25, 0.75].forEach(s => { const p = c(s), q = c(s + 0.01), L = Math.hypot(q[0] - p[0], q[1] - p[1]);
      arrow(X(p[0]), Y(p[1]), X(p[0]) - 26 * (q[0] - p[0]) / L, Y(p[1]) + 26 * (q[1] - p[1]) / L, "c-label-2"); }));
    line(equ, "stroke c-warn"); line(arc, "stroke c-ok"); line(seg, "stroke bold c-tint");
    [[A, "A"], [B, "B"]].forEach(([p, n]) => { P("circle", { cx: X(p[0]), cy: Y(p[1]), r: 5, class: "fill c-label" }, svg);
      const tx = P("text", { x: X(p[0]) + 9, y: Y(p[1]) + 16 }, svg); tx.textContent = n; });
    const w = c => Potentiel.travail(Fd, c, 2000), wb = w(H.boucle(seg, arc));
    $("fread").innerHTML = t("ch.law." + field);
    $("bread").textContent = F.si(b, "m", { prefix: "" });
    $("wseg").textContent = F.qty(F.fix(w(seg), 2), "J");
    $("wequ").textContent = F.qty(F.fix(w(equ), 2), "J");
    $("warc").textContent = F.qty(F.fix(w(arc), 2), "J");
    $("wbou").textContent = F.qty(F.fix(wb, 2), "J");
    $("fbou").textContent = t(Math.abs(wb) < 5e-3 ? "ch.f.cons" : "ch.f.noncons");
  }
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { field = b.dataset.f;
    document.querySelectorAll("[data-f]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  bsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["coriolis", 1829, "idea"], ["relatif", 1835, "idea"], ["rankine", 1853, "idea"], ["si", 1960, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["velo", "compteur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["porter", "a"], ["perp", "a"], ["chemin", "a"], ["boucle", "a"], ["saut", "a"], ["freinage", "a"], ["puissance", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 141 });
})();
</script>
