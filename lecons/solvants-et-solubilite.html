<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimArchi, K = Constantes;
const pct = x => F.qty(x < 0.01 ? F.num(100 * x, 2) : F.fix(100 * x, 1), "%");

/* ---------- carte des solvants : μ, εr, proticité ; une paire Na⁺ Cl⁻ dans chacun ---------- */
(() => {
  const S = C.SOLVANTS, nom = textOf("sv.e", S.map(s => s.id)), seg = $("sseg"), svg = $("gsolv"), R_NACL = 282e-12;   // Na–Cl dans le cristal : a/2, a = 564,0 pm
  seg.innerHTML = S.map(s => `<button type="button" class="no-sigle" data-s="${s.id}">${nom[s.id]}</button>`).join("");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, 4.2], label: t("sv.x") }, y: { domain: [0, 85], label: t("sv.y") } });
  const dots = {};
  S.forEach(s => { dots[s.id] = Plot.el("circle", { cx: x(s.mu), cy: y(s.epsr), r: 5, class: s.protique ? "fill c-tint" : "stroke c-label-2" }, g); });
  const ring = Plot.el("circle", { r: 10, class: "stroke bold c-warn" }, g), lab = Plot.el("text", { class: "note" }, g);
  let id = "eau";
  function draw() {
    const s = S.find(z => z.id === id), lb = C.longueurBjerrum(s.epsr, s.T), E = -C.energiePaire(1, -1, R_NACL, s.epsr);
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === id)));
    ring.setAttribute("cx", x(s.mu)); ring.setAttribute("cy", y(s.epsr));
    lab.setAttribute("x", x(s.mu) + (s.mu > 3 ? -14 : 14)); lab.setAttribute("y", y(s.epsr) - 12); lab.setAttribute("text-anchor", s.mu > 3 ? "end" : "start");
    lab.textContent = nom[s.id];
    $("vsolv").innerHTML = t("sv.val", { mu: F.qty(F.fix(s.mu, 2), "D"), e: F.num(s.epsr, 3), T: F.kelvin(s.T), p: t(s.protique ? "sv.p" : "sv.a") });
    $("vlb").textContent = F.si(lb, "m", { prefix: "n", sig: 2 });
    $("vpaire").innerHTML = t("sv.paire", { e: F.qty(F.num(E * K.N_A / 1000, 3), "kJ·mol⁻¹"), r: F.num(E / (K.k_B * s.T), 2) });
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { id = b.dataset.s; draw(); });
  draw();
})();

/* ---------- miscibilité : trois couples avec l'eau ---------- */
(() => {
  const ROWS = ["ethanol", "butanol", "cyclohexane", "diiode"], txt = textOf("mis.rows", ROWS), k = t("mis.k");
  $("miscibles").innerHTML = ROWS.map(r => `<div><span class="k">${k[r]}</span><span>${txt[r]}</span></div>`).join("");
})();

/* ---------- log P mesurés ---------- */
(() => {
  const ROWS = [["ethanol", -0.31], ["cafeine", -0.07], ["paracetamol", 0.46], ["benzene", 2.13], ["ibuprofene", 3.97]], txt = textOf("logp.rows", ROWS.map(r => r[0]));
  $("logp").innerHTML = ROWS.map(([id, v]) => `<div><span class="k">${F.fix(v, 2)}</span><span>${txt[id]}</span></div>`).join("");
})();

/* ---------- extraction fractionnée ---------- */
(() => {
  const VAQ = 0.1, lk = $("lk"), vo = $("vo"), nn = $("nn"), svg = $("gex");
  function draw() {
    const Kp = Math.pow(10, +lk.value), V = +vo.value * 1e-3, n = +nn.value;
    $("lkv").textContent = F.num(Kp, 2); $("vov").textContent = F.si(V, "L", { prefix: "m" }); $("nnv").textContent = t("ex.nval", { n, v: F.si(V / n, "L", { prefix: "m", sig: 2 }) });
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 240, x: { domain: [-0.5, 6.5], label: t("ex.x") }, y: { scale: "log", domain: [1e-3, 100], label: t("ex.y") } });
    const Y = p => y(Math.max(p, 1e-3));                                   // échelle logarithmique : 0,001 % en bas
    for (let k = 0; k <= n; k++) {
      const fk = k ? C.fractionRestante(Kp, V * k / n, VAQ, k) : 1;     // après k portions de V/n
      Plot.el("rect", { x: x(k) - 14, y: Y(100 * fk), width: 28, height: Y(0) - Y(100 * fk), class: "fill c-tint" }, g);
    }
    const f1 = C.fractionRestante(Kp, V, VAQ, 1), fn = C.fractionRestante(Kp, V, VAQ, n);
    Plot.el("line", { x1: x(-0.5), x2: x(6.5), y1: Y(100 * f1), y2: Y(100 * f1), class: "ref" }, g);
    $("vfn").textContent = t("ex.reste", { f: pct(fn), e: pct(1 - fn) });
    $("vf1").textContent = t("ex.reste", { f: pct(f1), e: pct(1 - f1) });
  }
  lk.oninput = vo.oninput = nn.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["arrhenius", 1887, "idea"], ["nobel", 1903, "idea"], ["born", 1920, "idea"], ["debyehuckel", 1923, "idea"], ["bjerrum", 1926, "idea"],
    ["zosel", 1970, "use"], ["guide", 2016, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cafe", "pharma"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["nacl", "b"], ["dmso", "c"], ["protique", "a"], ["butanol", "d"], ["fraction", "b"], ["logp", "a"], ["lavage", "d"], ["iode", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
