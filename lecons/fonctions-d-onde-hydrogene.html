<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, eV = Constantes.e, Lde = { s: 0, pz: 1, px: 1, dz2: 2, dxz: 2, dx2y2: 2 };
(() => {
  const carte = $("carte"), rad = $("radiale"), sn = $("sn"), K = 64;
  let orb = "pz";
  const cells = [];
  const fond = Plot.el("g", {}, carte);
  for (let i = 0; i < K; i++) for (let j = 0; j < K; j++)
    cells.push(Plot.el("rect", { x: (j * 360 / K).toFixed(2), y: (i * 360 / K).toFixed(2), width: (360 / K + 0.3).toFixed(2), height: (360 / K + 0.3).toFixed(2), class: "fill c-warn", "fill-opacity": 0 }, fond));
  Plot.el("line", { x1: 180, x2: 180, y1: 0, y2: 360, class: "axis" }, carte); Plot.el("line", { x1: 0, x2: 360, y1: 180, y2: 180, class: "axis" }, carte);
  const lx = Plot.el("text", { x: 352, y: 172, "text-anchor": "end", class: "label" }, carte), lz = Plot.el("text", { x: 188, y: 16, class: "label" }, carte);
  const ech = Plot.el("text", { x: 8, y: 352, class: "tick" }, carte);
  lx.textContent = "x"; lz.textContent = "z";
  function draw() {
    const l = Lde[orb]; if (+sn.value < l + 1) sn.value = l + 1;
    const n = +sn.value, L = Math.max(5, 2.6 * n * n + 2), vals = [];
    for (let i = 0; i < K; i++) for (let j = 0; j < K; j++) {
      const xx = -L + 2 * L * (j + 0.5) / K, zz = L - 2 * L * (i + 0.5) / K;
      vals.push(Q.ondeOrbitale(n, orb, xx, 0, zz));   // ψ in the plane y = 0
    }
    const top = Math.max(...vals.map(Math.abs)) || 1;
    vals.forEach((v, k) => { cells[k].setAttribute("class", "fill " + (v >= 0 ? "c-warn" : "c-tint")); cells[k].setAttribute("fill-opacity", Math.pow(Math.abs(v) / top, 0.7).toFixed(3)); });
    ech.textContent = t("fig.ech", { L: F.num(L, 3) });
    /* radial probability density, nodes marked */
    rad.replaceChildren();
    const RM = Math.max(8, 4 * n * n + 6), P = [];
    for (let i = 0; i <= 400; i++) { const r = RM * i / 400; P.push([r, Q.densiteRadiale(n, l, r)]); }
    const ymax = 1.1 * Math.max(...P.map(q => q[1]));
    const { x, y, g } = Plot.axes(rad, { fmt: F, w: 360, h: 360, pad: { l: 48, b: 44 }, x: { domain: [0, RM], label: t("fig.x"), ticks: 4 }, y: { domain: [0, ymax], label: t("fig.y"), ticks: 4 } });
    Plot.el("path", { d: Plot.path(P.map(([r, v]) => [x(r), y(v)])), class: "stroke c-tint" }, g);
    for (const r of Q.noeudsRadiaux(n, l)) Plot.el("line", { x1: x(r), x2: x(r), y1: y(0), y2: y(ymax), class: "stroke thin dash c-warn" }, g);
    const rm = Q.rayonMoyen(n, l);
    Plot.el("line", { x1: x(rm), x2: x(rm), y1: y(0), y2: y(ymax * 0.9), class: "stroke thin c-label-2" }, g);
    const lettre = "spd"[l];
    $("snr").textContent = String(n);
    $("vs").textContent = n + lettre + " (" + t("fig.o." + orb) + ")";
    $("fs").textContent = t("fig.f.etat", { E: F.qty(F.num(Q.energieHydrogene(n) / eV, 4), "eV"), l, g: 2 * l + 1 });
    $("vn").textContent = t("fig.v.noeuds", { r: n - l - 1, a: l });
    $("fn").textContent = Q.noeudsRadiaux(n, l).length ? t("fig.f.noeuds", { r: Q.noeudsRadiaux(n, l).map(v => F.num(v, 3)).join(" ; ") }) : t("fig.f.sans");
    $("vr").textContent = F.num(rm, 4) + " a₀";
    $("fr").textContent = t("fig.f.r", { r: F.si(rm * Q.a0, "m") });
    $("orb").querySelectorAll("button").forEach(e => e.setAttribute("aria-pressed", String(e.dataset.o === orb)));
  }
  $("orb").querySelectorAll("button").forEach(e => e.onclick = () => { orb = e.dataset.o; draw(); });
  sn.oninput = draw; draw();
  $("sys1").innerHTML = t("sys.body", { r1: F.si(1.5 * Q.a0, "m"), r5: F.si(Q.rayonMoyen(5, 0) * Q.a0, "m") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["schrodinger", 1926, "idea"], ["mulliken", 1932, "idea"], ["stodolna", 2013, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["liaisons"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["noeuds3d", "b"], ["noyau", "a"], ["px", "c"], ["rmoy", "d"], ["signe", "b"], ["cone", "d"], ["taille", "b"], ["orbite", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 195 });
})();
</script>
