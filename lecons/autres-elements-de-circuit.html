<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux;
const cplx = z => F.qty(F.num(z.re, 3) + (z.im < 0 ? " " + F.MINUS + " " : " + ") + F.num(Math.abs(z.im), 3) + " i", "Ω");

/* ---------- le système décrit : deux bobines couplées, le secondaire sur 100 Ω ---------- */
(() => {
  const o = { L1: 10e-3, L2: 10e-3, M: 8e-3, w: 2 * Math.PI * 1000, R1: 0, zc: 100, E: 1 }, m = OM.mutuelle(o);
  $("sys1").innerHTML = t("sys1.body", { L: F.si(o.L1, "H"), M: F.si(o.M, "H"), k: F.num(m.k, 2), f: F.si(1000, "Hz"), zc: F.qty("100", "Ω"),
    zr: cplx(m.zReflechie), zin: cplx(m.zin), lw: F.qty(F.num(o.w * o.L1, 3), "Ω") });
})();

/* ---------- résistance négative : le circuit oscille, et s'arrête de croître s'il sature ---------- */
(() => {
  const base = { L: 10e-3, C: 100e-9, R: 10, i0: 0.5e-3, duree: 0.02, n: 4000 }, B = 1.3e5;
  const sr = $("sr"), seg = $("mode"), svg = $("trace");
  let mode = "sature";
  function draw() {
    const r = +sr.value, b = mode === "sature" ? B : 0, s = AutresElements.oscillateurNegatif(Object.assign({ r, b }, base));
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
    $("srv").textContent = F.qty(F.num(r, 3), "Ω");
    const ma = 1000 * Math.max(...s.i.map(Math.abs)), ym = 1.15 * Math.max(0.6, ma);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 64, b: 44 }, x: { domain: [0, 20], label: t("fig.xaxis") }, y: { domain: [-ym, ym], ticks: 6, label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(20), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("path", { d: Plot.path(s.t.map((x, j) => [P.x(1000 * x), P.y(1000 * s.i[j])])), class: "stroke thin c-tint" }, P.g);
    const env = s.t.map(x => 1000 * base.i0 * Math.exp(-s.sigma * x));
    const dans = s.t.map((x, j) => [x, env[j]]).filter(([, e]) => e <= ym);           // the envelope stops at the frame
    if (dans.length > 1) [1, -1].forEach(k => Plot.el("path", { d: Plot.path(dans.map(([x, e]) => [P.x(1000 * x), P.y(k * e)])), class: "stroke thin dash c-label-2" }, P.g));
    $("vnet").textContent = F.qty(F.num(base.R - r, 3), "Ω");
    $("fnet").textContent = t(r < base.R ? "fig.f.amorti" : r === base.R ? "fig.f.entretenu" : "fig.f.croit");
    $("vsig").textContent = F.si(-s.sigma, "s⁻¹");
    $("fsig").textContent = t("fig.f.sigma", { f0: F.si(s.f0, "Hz") });
    const fin = 1000 * Math.max(...s.i.slice(-200).map(Math.abs));
    $("vamp").textContent = F.si(fin / 1000, "A", { prefix: "m" });
    $("famp").textContent = b > 0 && r > base.R ? t("fig.f.vdp", { a: F.si(s.amplitude, "A", { prefix: "m" }), mu: F.num(s.mu, 2) }) : t("fig.f.lin");
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; draw(); });
  sr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["deforest", 1906, "idea"], ["meissner", 1913, "idea"], ["esaki", 1958, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["quartz"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["generateur", "b"], ["reflechie", "c"], ["capa", "a"], ["lineaire", "d"], ["negatif", "b"], ["somme", "c"], ["sature", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 228 });
})();
</script>
