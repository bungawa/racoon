<body>
<main class="page">
  <header class="head">

    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>

    <p data-i18n-html="s1.p2"></p>
    <p data-i18n-html="s1.p3"></p>
    <div class="box rem"><b data-i18n="s1.rem.title"></b>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <div class="box def"><b data-i18n="s2.def.title"></b>
      <p data-i18n-html="s2.def.body"></p>
    </div>
    <p data-i18n-html="s2.p1"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq">
      <math display="block"><mi>Δ</mi><mi>t</mi><mo>=</mo><mi>y</mi><mo>·</mo><mi>t</mi></math>
      
    </div>
    <p class="validite" data-i18n="eq1.validite"></p>
    <figure class="chart">
      <svg id="dchart" role="img" data-i18n-attr="aria-label:drift.aria"></svg>
      <div class="panel">
        <div class="seg" role="group" data-i18n-attr="aria-label:drift.presets"><button type="button" id="p-quartz" aria-pressed="false" data-i18n="drift.p.quartz"></button><button type="button" id="p-essen" aria-pressed="false" data-i18n="drift.p.essen"></button><button type="button" id="p-fontaine" aria-pressed="true" data-i18n="drift.p.fontaine"></button><button type="button" id="p-optique" aria-pressed="false" data-i18n="drift.p.optique"></button></div>
        <div class="controls">
          <div class="ctl"><div class="row"><label for="ysl" data-i18n="drift.y"></label><output id="yread" for="ysl"></output></div>
            <input id="ysl" type="range" min="-190" max="-40" step="1" value="-160"></div>
          <div class="ctl"><div class="row"><label for="tsl" data-i18n="drift.t"></label><output id="tread" for="tsl"></output></div>
            <input id="tsl" type="range" min="0" max="1000" step="1" value="425"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="drift.d"></span><span class="v" id="vd"></span></div>
          <div class="stat"><span class="k" data-i18n="drift.one"></span><span class="v" id="vone"></span></div>
          <div class="stat"><span class="k" data-i18n="drift.cs"></span><span class="v" id="vcs"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="drift.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="eq">
      <math display="block"><mi>X</mi><mo>(</mo><mi>Y</mi><mo>)</mo><mo>=</mo><mi>J</mi><mrow><mo>(</mo><msub><mi>e</mi><mn>0</mn></msub><mi>Y</mi><mo>+</mo><mfrac><mrow><mi>a</mi><msup><mi>Y</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>)</mo></mrow></math>
      
    </div>
    <p class="validite" data-i18n="eq2.validite"></p>
    <p data-i18n-html="s3.p3"></p>
    <figure>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="esl" data-i18n-html="lod.e0"></label><output id="eread" for="esl"></output></div>
            <input id="esl" type="range" min="-15" max="30" step="1" value="0"></div>
          <div class="ctl"><div class="row"><label for="asl" data-i18n-html="lod.a"></label><output id="aread" for="asl"></output></div>
            <input id="asl" type="range" min="0" max="30" step="1" value="18"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="lod.leap"></span><span class="v" id="vleap"></span><span class="f" data-i18n="lod.leap.f"></span></div>
          <div class="stat"><span class="k" data-i18n="lod.hour"></span><span class="v" id="vhour"></span><span class="f" data-i18n="lod.hour.f"></span></div>
          <div class="stat"><span class="k" data-i18n="lod.century"></span><span class="v" id="vcent"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="lod.caption"></figcaption>
    </figure>
    <div class="box warn"><b data-i18n="s3.warn.title"></b>
      <p data-i18n-html="s3.warn.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="eq">
      <math display="block"><mfrac><mrow><mi>Δ</mi><mi>f</mi></mrow><mi>f</mi></mfrac><mo>=</mo><mfrac><mrow><mi>g</mi><mi>h</mi></mrow><msup><mi>c</mi><mn>2</mn></msup></mfrac></math>
      
    </div>
    <p class="validite" data-i18n="eq3.validite"></p>
    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="hsl" data-i18n="grav.h"></label><output id="hread" for="hsl"></output></div>
          <input id="hsl" type="range" min="0" max="1000" step="1" value="333"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="grav.shift"></span><span class="v" id="vshift"></span></div>
          <div class="stat"><span class="k" data-i18n="grav.year"></span><span class="v" id="vgyear"></span></div>
          <div class="stat"><span class="k" data-i18n="grav.seen"></span><span class="v" id="vseen"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="grav.caption"></figcaption>
    </figure>
    <p data-i18n-html="s4.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/unites-etalons-temps.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/unites-etalons-temps.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const $ = id => document.getElementById(id);
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const E = Etalons;
/* une durée lisible : secondes SI jusqu'au jour, puis jours, puis années */
const dur = s => !isFinite(s) ? t("dur.never")
  : s < 1e-12 ? F.qty(F.sci(s, 3), "s")
  : s < 1e5 ? F.si(s, "s", { sig: 3 })
  : s < E.YEAR ? t("dur.j", { v: F.num(s / E.DAY, 3) })
  : s < 1e6 * E.YEAR ? t("dur.a", { v: F.num(s / E.YEAR, 3) })
  : s < 1e9 * E.YEAR ? t("dur.ma", { v: F.num(s / E.YEAR / 1e6, 3) })
  : t("dur.ga", { v: F.num(s / E.YEAR / 1e9, 3) });
const years = Y => !isFinite(Y) ? t("dur.never") : dur(Y * E.YEAR);

/* ---------- §5-5 : dérive d'une horloge ---------- */
(() => {
  const PRESETS = { quartz: 6e-6, essen: 1 / (300 * E.YEAR), fontaine: 1e-16, optique: 5.5e-19 };
  const TMAX = Math.log10(13.8e9 * E.YEAR), YLO = 1e-12, YHI = 1e12;
  const every = n => v => { const e = Math.round(Math.log10(v)); return e % n ? "" : "10" + F.sup(e); };
  const { x, y, g } = Plot.axes($("dchart"), { fmt: F, w: 640, h: 300,
    x: { scale: "log", domain: [1, 1e18], label: t("drift.x"), fmt: every(3) },
    y: { scale: "log", domain: [YLO, YHI], label: t("drift.yaxis"), fmt: every(4) } });
  Plot.el("line", { x1: x(1), x2: x(1e18), y1: y(1), y2: y(1), class: "ref" }, g);
  Plot.el("text", { x: x(3), y: y(1) - 6, class: "note" }, g).textContent = F.qty("1", "s");
  const line = Plot.el("path", { class: "curve" }, g), dot = Plot.el("circle", { r: 6, class: "dot" }, g);
  const ysl = $("ysl"), tsl = $("tsl");
  const upd = () => {
    const yy = exact ?? Math.pow(10, ysl.value / 10), tt = Math.pow(10, tsl.value / 1000 * TMAX), d = E.drift(yy, tt);
    $("yread").textContent = F.sci(yy, 2);
    $("tread").textContent = dur(tt);
    $("vd").textContent = dur(d);
    $("vone").textContent = dur(E.timeToDrift(yy, 1));
    $("vcs").textContent = F.sci(E.cesiumCycles(tt), 3);
    const t0 = Math.max(1, YLO / yy), t1 = Math.min(1e18, YHI / yy);
    line.setAttribute("d", t0 < t1 ? `M${x(t0).toFixed(1)} ${y(yy * t0).toFixed(1)}L${x(t1).toFixed(1)} ${y(yy * t1).toFixed(1)}` : "");
    const dc = Math.min(Math.max(d, YLO), YHI);
    dot.setAttribute("cx", x(tt)); dot.setAttribute("cy", y(dc));
  };
  const press = k => Object.keys(PRESETS).forEach(id => $("p-" + id).setAttribute("aria-pressed", String(id === k)));
  let exact = null;                                   // a preset shows its published value, not the slider step
  Object.keys(PRESETS).forEach(k => $("p-" + k).onclick = () => { ysl.value = Math.round(10 * Math.log10(PRESETS[k])); exact = PRESETS[k]; press(k); upd(); });
  ysl.oninput = () => { exact = null; press(null); upd(); }; tsl.oninput = upd; upd();
})();

/* ---------- §5-5 : écart entre la Terre et le temps atomique ---------- */
(() => {
  const esl = $("esl"), asl = $("asl");
  const upd = () => {
    const e0 = esl.value / 10 * 1e-3, a = asl.value / 10 * 1e-3 / 100;          // s par jour ; s par jour et par an
    $("eread").textContent = F.si(e0, "s", { prefix: "m", sig: 2 });
    $("aread").textContent = t("lod.a.read", { v: F.si(a * 100, "s", { prefix: "m", sig: 2 }) });
    $("vleap").textContent = years(E.yearsToOffset(e0, a, 0.9));
    $("vhour").textContent = years(E.yearsToOffset(e0, a, 3600));
    $("vcent").textContent = F.si(E.offset(e0, a, 100), "s", { sig: 3 });
  };
  esl.oninput = asl.oninput = upd; upd();
})();

/* ---------- §5-5 : la pesanteur change la marche des horloges ---------- */
(() => {
  const hsl = $("hsl");
  const upd = () => {
    const h = Math.pow(10, -3 + hsl.value / 1000 * 9), s = E.gravShift(h);       // de 1 mm à 10⁶ m
    $("hread").textContent = F.si(h, "m", { sig: 3 });
    $("vshift").textContent = F.sci(s, 3);
    $("vgyear").textContent = dur(E.drift(s, E.YEAR));
    $("vseen").textContent = t(s > 5.5e-19 ? "grav.yes" : "grav.no");
  };
  hsl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["essen", 1955, "experiment"], ["ephemeride", 1960, "idea"], ["maser", 1960, "experiment"], ["cgpm1967", 1967, "idea"],
    ["utc", 1972, "use"], ["derniere", 2016, "use"], ["si2019", 2018, "idea"], ["cgpm2022", 2022, "idea"], ["jila", 2024, "experiment"], ["nist", 2025, "experiment"], ["cgpm2026", 2026, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tai", "gnss", "norme"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["jour", "a"], ["fontaine", "a"], ["intercalaire", "a"], ["redef", "a"], ["tai", "a"], ["optique", "a"], ["hauteur", "a"], ["apres", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
</html>
