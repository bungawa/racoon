<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- deux sons purs de même amplitude A dans x ↦ x + ε₂x² + ε₃x³ (K = 1) : les raies de la sortie et sa forme ---------- */
(() => {
  const O = self.Ondes, FMAX = 4600, YMIN = 1e-4, TMAX = 0.01, M = 1200, TS = Array.from({ length: M + 1 }, (_, i) => TMAX * i / M);
  const IDX = ["₁", "₂"], MOINS = "−";
  /* (p₁, p₂) → « 2f₁ − f₂ » : des symboles, pas des mots ; le vecteur nul est la composante continue */
  const nomRaie = v => { if (v.every(p => p === 0)) return "0";
    return v.map((p, i) => [p, i]).filter(([p]) => p).sort((x, y) => (y[0] > 0) - (x[0] > 0)).map(([p, i], j) => (p < 0 ? (j ? " " + MOINS + " " : MOINS) : j ? " + " : "") + (Math.abs(p) > 1 ? Math.abs(p) : "") + "f" + IDX[i]).join(""); };
  function upd() {
    const f1 = +$("f1").value, f2 = +$("f2").value, A = +$("aa").value, e2 = +$("e2").value, e3 = +$("e3").value;
    const S = sons();
    const svg = $("sp"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 44, t: 28 }, x: { domain: [0, FMAX], label: t("sp.xaxis") }, y: { domain: [YMIN, 3], scale: "log", label: t("sp.yaxis") } });
    S.raies.forEach((r, i) => {
      /* l'ordre du terme qui crée la raie ; la composante continue ne vient que de x² (un terme impair ne redresse pas) */
      const ordre = Math.max(2 * (r.f === 0), ...r.origines.map(v => v.reduce((s, p) => s + Math.abs(p), 0))), v = Math.max(YMIN, Math.abs(r.A) / A);
      const c = ordre === 1 ? "c-label-2" : ordre === 2 ? "c-tint" : "c-warn", x = P.x(r.f);
      Plot.el("line", { x1: x, x2: x, y1: P.y(YMIN), y2: P.y(v), class: "stroke " + c }, P.g);
      Plot.el("circle", { cx: x, cy: P.y(v), r: 3, class: "fill " + c }, P.g);
      Plot.el("text", { x, y: P.y(v) - 6 - (i % 2) * 12, "text-anchor": "middle", class: "tick" }, P.g).textContent = r.origines.map(nomRaie).join(", ");
    });
    const fo = $("fo"); fo.innerHTML = "";
    const ym = Math.max(...TS.map(x => Math.abs(S.sortie(x))), 2 * A) * 1.1;
    const Q = Plot.axes(fo, { fmt: F, w: 640, h: 200, pad: { l: 56, b: 44 }, x: { domain: [0, 1000 * TMAX], label: t("fo.xaxis") }, y: { domain: [-ym, ym], label: t("fo.yaxis") } });
    Plot.el("path", { d: Plot.path(TS.map(x => [Q.x(1000 * x), Q.y(S.entree(x))])), class: "stroke thin c-label-2" }, Q.g);
    Plot.el("path", { d: Plot.path(TS.map(x => [Q.x(1000 * x), Q.y(S.sortie(x))])), class: "stroke c-tint" }, Q.g);
    const d = O.distorsion(1, e2, e3, A), fd = Math.abs(f2 - f1), fc = Math.abs(2 * f1 - f2);
    $("f1v").textContent = F.si(f1, "Hz"); $("f2v").textContent = F.si(f2, "Hz"); $("aav").textContent = F.num(A, 2);
    $("e2v").textContent = F.num(e2, 2); $("e3v").textContent = F.num(e3, 2);
    $("vt").textContent = F.qty(F.num(100 * d.thd, 2), "%"); $("ft").textContent = t("nl.f.thd", { f: F.si(f1, "Hz") });
    $("vd").textContent = F.num(fd ? Math.abs(S.raie(fd)) / A : 0, 2); $("fd").textContent = t("nl.f.diff", { f: F.si(fd, "Hz") });
    $("vc").textContent = F.num(fc && f1 !== f2 ? Math.abs(S.raie(fc)) / A : 0, 2); $("fc").textContent = t("nl.f.cub", { f: F.si(fc, "Hz") });
  }
  /* les mêmes tons que le graphe (deux sons de même fréquence n'en font qu'un, d'amplitude double) */
  const sons = () => { const f1 = +$("f1").value, f2 = +$("f2").value, A = +$("aa").value;
    return O.sortieNonLineaire(1, +$("e2").value, +$("e3").value, f1 === f2 ? [{ A: 2 * A, f: f1 }] : [{ A, f: f1 }, { A, f: f2 }]); };
  ["f1", "f2", "aa", "e2", "e3"].forEach(id => $(id).oninput = upd); upd();
  /* écouter : 1,5 s de l'entrée, puis 1,5 s de la sortie déformée x + ε₂x² + ε₃x³, chacune normée (Ondes.jouer) */
  $("play").onclick = () => { const S = sons();
    $("aumsg").textContent = O.jouer([S.entree, S.sortie], 1.5) ? t("au.playing") : t("au.none"); };
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["tartini", 1754, "experiment"], ["helmholtz", 1856, "idea"], ["armstrong", 1918, "experiment"], ["franken", 1961, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["otoacoustique", "laser", "recepteur"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["lineaire", "c"], ["thd", "a"], ["redressement", "b"], ["difference", "d"], ["impaire", "a"], ["cubique", "c"], ["laser", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 506 });
})();
</script>
