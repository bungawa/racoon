    <div class="eq"><math display="block"><mi>Δ</mi><mi>T</mi><mo>=</mo><mo>(</mo><msub><mi>m</mi><mi>u</mi></msub><mo>−</mo><mi>m</mi><mo>)</mo><msup><mi>c</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></mrow><msqrt><mn>1</mn><mo>−</mo><msup><mi>u</mi><mn>2</mn></msup><mo>/</mo><msup><mi>c</mi><mn>2</mn></msup></msqrt></mfrac><mo>−</mo><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></math><span class="n">(16.12)</span></div>

    <figure class="chart">

      <div class="legend"><span class="c-tint" data-i18n="fig.legend.rel"></span><span class="c-warn" data-i18n="fig.legend.newton"></span></div>
      <div class="panel">
        <div class="controls">

          <div class="ctl"><div class="row"><label for="sT" data-i18n="fig.T"></label><output id="sTr" for="sT"></output></div>

          <div class="stat"><span class="k" data-i18n-html="fig.k.n"></span><span class="v" id="vn"></span><span class="f" id="fn"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.E"></span><span class="v" id="vE"></span><span class="f" id="fE"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.p"></span><span class="v" id="vp"></span><span class="f" id="fp"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/relat-energie.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/relativite.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, K = Constantes, c = K.c, eV = K.e, MeV = 1e6 * K.e;
/* an energy in eV with the right prefix */
const en = x => F.si(x / eV, "eV");

/* ---------- énergie cinétique : (16.12) contre ½mv² ---------- */
(() => {
  const trace = $("trace"), sT = $("sT"), seg = $("part"), M = { e: K.m_e, p: K.m_p };
  let part = "e";
  function draw() {
    const m = M[part], mc2 = m * c * c, T = Math.pow(10, +sT.value) * eV, S = R.depuisCinetique(m, T), b = S.beta;
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 300, pad: { l: 56, b: 44 }, x: { domain: [0, 1.2], label: t("fig.xaxis") },
      y: { scale: "log", domain: [1e-9, 1e8], label: t("fig.yaxis"), fmt: v => { const k = Math.round(Math.log10(v)); return k % 3 ? "" : "10" + F.sup(k); } } });
    Plot.el("line", { x1: P.x(1), x2: P.x(1), y1: P.y(1e-9), y2: P.y(1e8), class: "zero" }, P.g);
    const bs = Array.from({ length: 400 }, (_, i) => 1e-5 + i * (0.999 - 1e-5) / 399).concat(Array.from({ length: 60 }, (_, i) => 1 - Math.pow(10, -3 - i * 9 / 59)));
    const ok = y => y >= 1e-9 && y <= 1e8;
    Plot.el("path", { d: Plot.path(bs.map(x => [x, R.cinetique(1, x * c) / (c * c)]).filter(([, y]) => ok(y)).map(([x, y]) => [P.x(x), P.y(y)])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(Array.from({ length: 241 }, (_, i) => 1e-5 + i * 1.2 / 240).map(x => [x, x * x / 2]).filter(([, y]) => ok(y)).map(([x, y]) => [P.x(x), P.y(y)])), class: "ref" }, P.g);
    if (ok(T / mc2)) Plot.el("circle", { cx: P.x(b), cy: P.y(T / mc2), r: 5, class: "dot" }, P.g);
    const vN = Math.sqrt(2 * T / m);                                            // the speed Newton gives to the same T
    $("sTr").textContent = en(T);
    $("vv").textContent = F.num(b, b > 0.999 ? 7 : 4);
    $("fv").textContent = t("fig.f.v", { d: F.sci(S.unMoinsBeta, 2), g: F.num(S.gamma, 4) });
    $("vn").textContent = F.num(vN / c, 4);
    $("fn").textContent = t("fig.f.n", { e: F.num(100 * (1 - 0.5 * m * S.v * S.v / T), 2) });
    $("vE").textContent = en(S.E);
    $("fE").textContent = t("fig.f.E", { m: en(R.masseDepuis(S.E, S.p) * c * c) });
    $("vp").textContent = F.si(S.p * c / eV, "eV/c");
    $("fp").textContent = t("fig.f.p", { r: F.num(R.vitesseDepuis(S.E, S.p) / c, b > 0.999 ? 7 : 4) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.p === part)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { part = x.dataset.p; draw(); });
  sT.oninput = draw; draw();
})();

/* ---------- le système décrit : un électron accéléré sous 1 kV et 100 kV ---------- */
(() => {
  const err = V => { const S = R.depuisCinetique(K.m_e, V * eV); return 1 - 0.5 * K.m_e * S.v * S.v / S.T; };
  const S1 = R.depuisCinetique(K.m_e, 1e3 * eV);
  $("sys1").innerHTML = t("sys1.body", { b2: F.sci(S1.beta ** 2, 2), e1: F.num(100 * err(1e3), 2), e2: F.num(100 * err(1e5), 2), e3: F.num(100 * err(1e6), 2) });
})();

/* ---------- énergie de liaison du deutéron ---------- */
(() => {
  const B = 2.224 * MeV, m2 = (K.m_p + K.m_n) * c * c;
  $("deuton").innerHTML = t("s2.deuton", { B: F.qty("2,224", "MeV"), m2: en(m2), f: F.sci(B / m2, 2) });
})();

/* ---------- le kaon : deux ou trois pions ---------- */
(() => {
  const mK = 493.677, mpi = 139.570;                                           // MeV/c², Particle Data Group 2024
  $("kaon").innerHTML = t("s3.kaon", { mK: F.qty(F.num(mK, 6), "MeV/c²"), mpi: F.qty(F.num(mpi, 6), "MeV/c²"), Q: F.qty(F.num(mK - 3 * mpi, 3), "MeV") });
})();

/* ---------- E ≈ pc au LHC ---------- */
(() => {
  const S = R.depuisCinetique(K.m_p, 6.8e12 * eV - K.m_p * c * c);             // 6,8 TeV: the total energy of a beam proton
  $("lhc").innerHTML = t("s4.lhc", { E: en(S.E), ecart: F.sci(1 - S.p * c / S.E, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["meitner", 1939, "idea"], ["trinity", 1945, "experiment"], ["rochester", 1947, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["neutron"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cinetique", "a"], ["mou", "c"], ["fission", "b"], ["kaon", "d"], ["relation", "a"], ["photon", "b"], ["liaison", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 165 });
})();
</script>
