<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/sigles.js"></script>

<script src="/racoon/navigation.js"></script>

<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>

<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/optique-ondulatoire.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, c = Constantes.c;

/* the emitter of the page: a short dipole at 100 MHz radiating 1 kW on average, in free space */
const W = 2 * Math.PI * 1e8, P0 = Math.sqrt(1000 * 12 * Math.PI * Constantes.eps0 * c ** 3 / W ** 4), SRC = O.dipoleRayonnant(P0, W);

/* ---------- the same power through the cone at every distance ---------- */
(() => {
  const cone = $("cone"), trace = $("trace"), sr = $("sr"), sa = $("sa"), TH = Math.PI / 2;
  function draw() {
    const r = 10 ** +sr.value, a = +sa.value * Math.PI / 180, s = O.puissanceCone(SRC, r, TH, a);
    const E0 = SRC.E0(r, TH), Ir = SRC.I(r, TH);
    /* schematic: the source at left, the cone at its true half-angle, the cap where the slider puts it (log scale of r) */
    cone.innerHTML = "";
    const x0 = 40, y0 = 110, R = 80 + 130 * (+sr.value - 1);
    for (const sgn of [1, -1]) Plot.el("line", { x1: x0, y1: y0, x2: x0 + 600 * Math.cos(a), y2: y0 - sgn * 600 * Math.sin(a), class: "stroke thin c-label-2" }, cone);
    const arc = Array.from({ length: 41 }, (_, i) => { const b = -a + 2 * a * i / 40; return [x0 + R * Math.cos(b), y0 - R * Math.sin(b)]; });
    Plot.el("path", { d: Plot.path(arc), class: "stroke bold c-warn" }, cone);
    Plot.el("circle", { cx: x0, cy: y0, r: 5, class: "dot" }, cone);
    /* the mean intensity against r, log-log: 1/r² */
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 240, pad: { l: 64, b: 44 }, x: { scale: "log", domain: [10, 1e5], label: t("fig.xaxis") }, y: { scale: "log", domain: [1e-9, 10], label: t("fig.yaxis") } });
    const rs = Array.from({ length: 81 }, (_, i) => 10 ** (1 + i / 20));
    Plot.el("path", { d: Plot.path(rs.map(u => [P.x(u), P.y(SRC.I(u, TH))])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(r), cy: P.y(Ir), r: 5, class: "dot" }, P.g);
    $("srr").textContent = F.si(r, "m");
    $("sar").textContent = F.qty(F.num(+sa.value, 3), "°");
    $("ve").textContent = F.si(E0, "V·m⁻¹");
    $("fe").innerHTML = t("fig.f.e", { rl: F.num(r / SRC.lambda, 3) });
    $("vi").textContent = F.si(Ir, "W·m⁻²");
    $("fi").innerHTML = t("fig.f.i", { A: F.si(s.aire, "m²") });
    $("vp").textContent = F.si(s.P, "W");
    $("fp").innerHTML = t("fig.f.p", { f: F.num(100 * s.P / SRC.P, 3), u: F.num(100 * (1 - s.P / (Ir * s.aire)), 2) });
  }
  sr.oninput = sa.oninput = draw; draw();
})();

/* ---------- the system described: the Sun, seen from the Earth ---------- */
(() => {
  const S = 1361, au = Constantes.au, L = 4 * Math.PI * au * au * S, Eeff = Math.sqrt(S / (Constantes.eps0 * c));
  $("sys1").innerHTML = t("sys1.body", { S: F.qty(F.num(S, 4), "W·m⁻²"), au: F.qty(F.sci(au, 4), "m"), L: F.sci(L, 4), E: F.si(Eeff, "V·m⁻¹"),
    S5: F.qty(F.num(S / 25, 2), "W·m⁻²"), t: F.qty(F.num(au / c, 3), "s") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kepler", 1604, "idea"], ["poynting", 1884, "idea"], ["friis", 1946, "use"], ["uai", 2015, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["liaison"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["carre", "b"], ["double", "c"], ["cone", "a"], ["intensite", "d"], ["champ", "b"], ["perdue", "c"], ["frequence", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 292 });
})();
</script>
