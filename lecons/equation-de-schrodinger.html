<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, NM = 1e-9, HB = Q.hbar, EV = Constantes.e, M = Q.m_e;

/* ---------- a packet against a barrier, (16.53) by Crank–Nicolson: 51 frames computed once per barrier ---------- */
(() => {
  const svg = $("barriere"), st = $("st"), sv = $("sv"), sa = $("sa");
  const N = 2000, X0 = -20 * NM, DX = 0.02 * NM, EC = 0.2 * EV, K0 = Math.sqrt(2 * M * EC) / HB, DT = 0.2e-15, PAS = 6;
  const xs = Array.from({ length: N }, (_, j) => X0 + j * DX);
  let images = [], cle = "";
  function calcul() {
    const V0 = +sv.value * EV, a = +sa.value * NM, k = sv.value + "/" + sa.value;
    if (k === cle) return; cle = k;
    const V = xs.map(x => x >= 0 && x <= a ? V0 : 0);
    const psi0 = () => xs.map(x => Q.paquetGaussien(x, { sigma: 3 * NM, x0: -8 * NM, p0: HB * K0 }));
    let psi = xs.map(x => Q.paquetGaussien(x, { sigma: 3 * NM, x0: -8 * NM, p0: HB * K0 }));
    images = [psi];
    for (let f = 1; f <= 50; f++) { psi = Q.crankNicolson(psi, { m: M, dx: DX, dt: DT, V }, PAS); images.push(psi); }
    images.n0 = Q.grilleStats(psi0(), DX, X0).norme;
  }
  function draw() {
    calcul();
    const f = +st.value, psi = images[f], V0 = +sv.value, a = +sa.value;
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { domain: [-20, 20], label: t("fig.x"), fmt: v => F.num(v, 2) }, y: { domain: [0, 0.5], label: t("fig.y") } });
    /* the barrier, drawn on the same axis: 1 eV ↔ 1 */
    Plot.el("path", { d: Plot.path([[ax.x(-20), ax.y(0)], [ax.x(0), ax.y(0)], [ax.x(0), ax.y(Math.min(V0, 0.5))], [ax.x(a), ax.y(Math.min(V0, 0.5))], [ax.x(a), ax.y(0)], [ax.x(20), ax.y(0)]]), class: "stroke c-warn" }, ax.g);
    Plot.el("line", { x1: ax.x(-20), x2: ax.x(20), y1: ax.y(0.2), y2: ax.y(0.2), class: "stroke thin dash c-label-2" }, ax.g);
    Plot.el("path", { d: Plot.path(psi.map((z, j) => [ax.x(xs[j] / NM), ax.y(Math.min(0.5, z.P * 1e-9))])), class: "stroke bold c-tint" }, ax.g);
    const s = Q.grilleStats(psi, DX, X0);
    let T = 0; psi.forEach((z, j) => { if (xs[j] > a * NM) T += z.P * DX; });
    $("str").textContent = F.qty(F.num(f * PAS * DT * 1e15, 3), "fs");
    $("svr").textContent = F.qty(F.fix(V0, 2), "eV");
    $("sar").textContent = F.qty(F.fix(a, 2), "nm");
    $("vtr").textContent = F.num(100 * T, 3) + " %";
    $("ftr").textContent = t(V0 < 0.2 ? "fig.f.classiquePasse" : "fig.f.classiqueBloque");
    $("vno").textContent = F.fix(s.norme / images.n0, 6);
    $("fno").textContent = t("fig.f.norme");
  }
  st.oninput = sv.oninput = sa.oninput = draw; draw();
})();

/* ---------- the system described: when the non-relativistic, spinless equation is enough ---------- */
(() => {
  const alpha = EV * EV / (4 * Math.PI * Constantes.eps0 * HB * Constantes.c);
  const v = Math.sqrt(2 * 0.2 * EV / M);
  $("sys1").innerHTML = t("sys1.body", { v: F.qty(F.sci(v, 2), "m·s⁻¹"), b: F.sci((v / Constantes.c) ** 2, 2) });
  $("sys2").innerHTML = t("sys2.body", { a: F.num(1 / alpha, 4), a2: F.sci(alpha * alpha, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["schrodinger", 1926, "idea"], ["hund", 1927, "idea"], ["gamow", 1928, "idea"], ["stm", 1981, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["flash"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["base", "b"], ["local", "d"], ["complexe", "a"], ["norme", "c"], ["tunnel", "b"], ["deux", "a"], ["coulomb", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1605 });
})();
</script>
