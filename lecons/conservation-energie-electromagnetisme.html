<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux;

/* ---------- une impulsion plane traverse une plaque conductrice : le bilan (27.4) d'une boîte ---------- */
(() => {
  const L = 2, PLAQUE = [1, 1.6], IMP = { xc: 0.4, a: 0.03, E0: 1000 };     // 2 m of line, a 60 cm slab, a 1 kV·m⁻¹ pulse
  const champ = $("champ"), bilan = $("bilan"), st = $("st"), ss = $("ss"), sa = $("sa"), sb = $("sbx");
  let sim = null, cle = "";
  const NJ = 1e9;                                                            // energies per m², shown in nJ·m⁻²
  function draw() {
    let a = +sa.value / 100, b = +sb.value / 100;
    if (b <= a + 0.05) { b = Math.min(2, a + 0.1); sb.value = String(Math.round(b * 100)); }
    const sigma = +ss.value / 1000, k = sigma + "|" + a + "|" + b;
    if (k !== cle) { sim = OM.ligneConductrice({ L, n: 400, plaque: PLAQUE, sigma, impulsion: IMP, boite: [a, b], pas: 480, tous: 6 }); cle = k; }
    const im = sim.images[+st.value], i = Math.round(im.t / sim.dt);
    /* the field along the line, the slab and the box */
    champ.innerHTML = "";
    const P = Plot.axes(champ, { fmt: F, w: 640, h: 200, pad: { l: 56, b: 40 }, x: { domain: [0, L], label: t("fig.x") }, y: { domain: [-1100, 1100], label: t("fig.ey") } });
    Plot.el("rect", { x: P.x(PLAQUE[0]), y: P.y(1100), width: P.x(PLAQUE[1]) - P.x(PLAQUE[0]), height: P.y(-1100) - P.y(1100), class: "area" }, P.g);
    [a, b].forEach(xb => Plot.el("line", { x1: P.x(xb), x2: P.x(xb), y1: P.y(-1100), y2: P.y(1100), class: "stroke dash c-warn" }, P.g));
    Plot.el("line", { x1: P.x(0), x2: P.x(L), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    Plot.el("path", { d: Plot.path(sim.x.map((x, j) => [P.x(x), P.y(im.E[j])])), class: "curve" }, P.g);
    /* the balance of the box against time */
    bilan.innerHTML = "";
    const all = [].concat(sim.U, sim.sorti, sim.joule).map(v => v * NJ), lo = Math.min(0, ...all), hi = Math.max(1, ...all);
    const tn = sim.t.map(s => s * 1e9), T = tn[tn.length - 1];
    const Q = Plot.axes(bilan, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 40 }, x: { domain: [0, T], label: t("fig.temps") }, y: { domain: [lo - 0.05 * (hi - lo), hi + 0.05 * (hi - lo)], label: t("fig.energie") } });
    const line = (arr, cls) => Plot.el("path", { d: Plot.path(arr.map((v, j) => [Q.x(tn[j]), Q.y(v * NJ)])), class: cls }, Q.g);
    Plot.el("line", { x1: Q.x(0), x2: Q.x(T), y1: Q.y(0), y2: Q.y(0), class: "zero" }, Q.g);
    line(sim.U, "stroke c-tint"); line(sim.sorti, "stroke c-warn"); line(sim.joule, "stroke c-ok");
    line(sim.U.map((u, j) => u + sim.sorti[j] + sim.joule[j]), "stroke bold dash c-label");
    Plot.el("line", { x1: Q.x(tn[i]), x2: Q.x(tn[i]), y1: Q.y(lo), y2: Q.y(hi), class: "stroke thin c-label-2" }, Q.g);
    $("str").textContent = F.si(im.t, "s", { prefix: "n", sig: 3 });
    $("ssr").textContent = F.qty(F.num(sigma * 1000, 3), "mS·m⁻¹");
    $("sar").textContent = F.qty(F.num(a, 3), "m"); $("sbr").textContent = F.qty(F.num(b, 3), "m");
    const nj = v => F.qty(F.num(v * NJ, 3), "nJ·m⁻²");
    $("vu").textContent = nj(sim.U[i]); $("fu").textContent = t("fig.f.u", { u0: nj(sim.U0) });
    $("vs").textContent = nj(sim.sorti[i]); $("fs").textContent = t("fig.f.sorti");
    $("vj").textContent = nj(sim.joule[i]); $("fj").textContent = t("fig.f.joule", { r: nj(sim.residu[i]) });
  }
  [st, ss, sa, sb].forEach(x => x.oninput = draw); draw();
})();

/* ---------- le système décrit : une impulsion de 3 cm dans un conducteur faible ---------- */
(() => {
  const c = Constantes.c, eps0 = Constantes.eps0, Z0 = 1 / (eps0 * c), a = 0.03, d = 0.6, sigma = 0.004;
  $("sys1").innerHTML = t("sys1.body", { a: F.qty(F.num(100 * a, 2), "cm"), duree: F.si(a / c, "s", { prefix: "p" }), sigma: F.qty(F.num(sigma * 1000, 2), "mS·m⁻¹"),
    rapport: F.num(sigma * Z0 * a, 2), long: F.si(1 / (sigma * Z0), "m", { sig: 2 }), d: F.si(d, "m", { sig: 2 }), trans: F.num(Math.exp(-sigma * Z0 * d), 2),
    relax: F.si(eps0 / sigma, "s", { prefix: "n", sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["joule", 1841, "experiment"], ["helmholtz", 1847, "idea"], ["umov", 1874, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["das"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["noir", "b"], ["magnetique", "d"], ["pile", "a"], ["cuivre", "c"], ["vide", "b"], ["integrales", "a"], ["das", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 272 });
})();
</script>
