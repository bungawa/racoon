<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const DEG = 180 / Math.PI, DAY = 86400;

/* ---------- ce que l'on néglige ---------- */
(() => { const IDS = ["taille", "etoiles", "inclinaison", "galilee", "modele"]; keyed($("neglect"), t("neglect.tag"), IDS, textOf("neglect.items", IDS)); })();

/* ---------- la planète vue depuis le Soleil et depuis la Terre ---------- */
(() => {
  const PL = ["mars", "jupiter", "saturne", "venus"], names = textOf("sky.p", PL), mois = t("mois");
  const J0 = Kepler.jd(Date.UTC(2024, 0, 1)), N = 1460, P = Plot.el, WD = 640, HT = 420;
  let pl = "mars", vue = "helio", cache = {};
  PL.forEach(id => { $("p-" + id).textContent = names[id]; $("p-" + id).onclick = () => { pl = id; upd(); }; });
  ["helio", "geo"].forEach(v => $("v-" + v).onclick = () => { vue = v; upd(); });
  const date = j => { const d = new Date(Kepler.ms(j)); return t("date", { j: d.getUTCDate(), m: mois[d.getUTCMonth()], a: d.getUTCFullYear() }); };
  const deg = x => F.num(x, 3) + "°";
  /* one pass per planet: positions of each day, unwrapped longitudes, loops (from a margin before and after the window) */
  function data(id) {
    if (cache[id]) return cache[id];
    const days = Array.from({ length: N + 1 }, (_, k) => J0 + k), lam = [];
    const helio = days.map(j => Kepler.position(id, j)), terre = days.map(j => Kepler.position("terre", j));
    days.forEach(j => { let l = Kepler.vue(id, j).lambda * DEG; if (lam.length) l += 360 * Math.round((lam[lam.length - 1] - l) / 360); lam.push(l); });
    const loops = Kepler.retrogradations(id, J0 - 200, J0 + N + 200, 1);
    const orbit = Array.from({ length: 241 }, (_, k) => Kepler.position(id, J0 + Kepler.periode(id) / DAY * k / 240));
    const orbitT = Array.from({ length: 241 }, (_, k) => Kepler.position("terre", J0 + Kepler.periode("terre") / DAY * k / 240));
    return (cache[id] = { days, lam, helio, terre, loops, orbit, orbitT });
  }
  function drawSky(D, k) {
    const svg = $("sky"); svg.innerHTML = "";
    const geo = vue === "geo", rel = (p, i) => geo ? [p[0] - D.terre[i][0], p[1] - D.terre[i][1]] : [p[0], p[1]];
    const pts = geo ? D.helio.map(rel) : D.orbit.map(p => [p[0], p[1]]);
    const sun = geo ? D.terre.map(p => [-p[0], -p[1]]) : [[0, 0]];
    const earth = geo ? [[0, 0]] : D.orbitT.map(p => [p[0], p[1]]);
    const all = pts.concat(sun, earth), R = Math.max(...all.map(p => Math.hypot(p[0], p[1]))) * 1.08;
    const s = Math.min(WD, HT) / 2 / R, X = x => WD / 2 + s * x, Y = y => HT / 2 - s * y;
    const clip = P("clipPath", { id: "skyarea" }, svg); P("rect", { x: 0, y: 0, width: WD, height: HT }, clip);
    const root = P("g", { "clip-path": "url(#skyarea)" }, svg);
    const path = a => a.map(([x, y], i) => (i ? "L" : "M") + X(x).toFixed(1) + " " + Y(y).toFixed(1)).join("");
    if (geo) { P("path", { d: path(sun), class: "stroke thin c-warn" }, root); P("path", { d: path(pts), class: "stroke c-ko" }, root); }
    else { P("path", { d: path(earth), class: "stroke thin c-tint" }, root); P("path", { d: path(pts), class: "stroke thin c-ko" }, root); }
    /* lines of sight, every 15 days over the last four months: they turn backwards during the loop */
    const pe = geo ? [0, 0] : D.terre[k], pp = rel(D.helio[k], k), sight = (a, b, op) => {
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, far = 3 * R;
      P("line", { x1: X(a[0]), y1: Y(a[1]), x2: X(a[0] + dx / L * far), y2: Y(a[1] + dy / L * far), class: "stroke thin dash c-label-2", opacity: op }, root); };
    for (let i = 8; i >= 1; i--) { const kk = k - 15 * i; if (kk >= 0) sight(geo ? [0, 0] : D.terre[kk], rel(D.helio[kk], kk), (0.15 + 0.05 * (8 - i)).toFixed(2)); }
    sight(pe, pp, "1");
    const sk = geo ? sun[k] : [0, 0];
    P("circle", { cx: X(sk[0]), cy: Y(sk[1]), r: 8, class: "fill c-warn" }, root);
    P("circle", { cx: X(pe[0]), cy: Y(pe[1]), r: 5, class: "fill c-tint" }, root);
    P("circle", { cx: X(pp[0]), cy: Y(pp[1]), r: 5, class: "fill c-ko" }, root);
  }
  function drawLam(D, k) {
    const svg = $("lam"); svg.innerHTML = "";
    /* λ between 0 and 360°: the curve is cut where it wraps around */
    const yr = j => 2024 + (j - J0) / 365.25, w = l => ((l % 360) + 360) % 360;
    const { x: X, y: Y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44 },
      x: { domain: [2024, 2028], label: t("lam.x"), ticks: 4, fmt: v => String(Math.round(v)) },
      y: { domain: [0, 360], label: t("lam.y"), ticks: 4 } });
    D.loops.forEach(b => { const x0 = X(Math.max(2024, yr(b.debut))), x1 = X(Math.min(2028, yr(b.fin))); if (x1 > x0) P("rect", { x: x0, y: Y(360), width: x1 - x0, height: Y(0) - Y(360), class: "fill c-ko", opacity: "0.18" }, g); });
    P("path", { d: D.lam.map((l, i) => (i && Math.abs(w(l) - w(D.lam[i - 1])) < 180 ? "L" : "M") + X(yr(D.days[i])).toFixed(1) + " " + Y(w(l)).toFixed(1)).join(""), class: "curve" }, g);
    P("line", { x1: X(yr(D.days[k])), x2: X(yr(D.days[k])), y1: Y(360), y2: Y(0), class: "ref" }, g);
  }
  function upd() {
    const D = data(pl), k = +$("jour").value, j = D.days[k];
    PL.forEach(id => $("p-" + id).setAttribute("aria-pressed", String(id === pl)));
    ["helio", "geo"].forEach(v => $("v-" + v).setAttribute("aria-pressed", String(v === vue)));
    drawSky(D, k); drawLam(D, k);
    $("jread").textContent = date(j);
    $("vlam").textContent = deg(((D.lam[k] % 360) + 360) % 360);
    const rate = (D.lam[Math.min(N, k + 1)] - D.lam[Math.max(0, k - 1)]) / (Math.min(N, k + 1) - Math.max(0, k - 1));
    $("vsens").textContent = t(rate < 0 ? "sky.f.retro" : "sky.f.direct");
    $("fsens").textContent = t("sky.taux", { v: deg(rate) });
    const near = D.loops.slice().sort((a, b) => Math.abs((a.debut + a.fin) / 2 - j) - Math.abs((b.debut + b.fin) / 2 - j))[0];
    $("vboucle").textContent = t("sky.du", { a: date(near.debut), b: date(near.fin) });
    $("fboucle").textContent = t("sky.f.boucle", { d: F.num(near.duree, 2), arc: deg(near.arc * DEG) });
    $("vsyn").textContent = t("sky.ans", { n: F.num(Kepler.synodique(pl) / DAY / 365.25, 3) });
    $("fsyn").textContent = t("sky.f.syn", { n: F.num(Kepler.synodique(pl) / DAY, 3) });
  }
  $("jour").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ptolemee", 150, "idea"], ["copernic", 1543, "idea"], ["tycho", 1576, "experiment"], ["galilee", 1610, "experiment"], ["kepler", 1609, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pointage", "opposition"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["quand", "a"], ["demi", "a"], ["syn", "a"], ["saturne", "a"], ["equiv", "a"], ["venus", "a"], ["precision", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 71 });
})();
</script>
