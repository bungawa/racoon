      <div class="panel">

<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9;

/* ---------- le système décrit : une sphère de laiton de 10 cm ---------- */
(() => {
  const R = 0.05, couche = 1e-10, tau = 1e-6, T = 1;
  $("sys1").innerHTML = t("sys1.body", { e: F.sci(couche / R, 1), t: F.sci(tau / T, 1) });
})();

/* ---------- deux charges, une équipotentielle, du métal (positions en m) ---------- */
(() => {
  const svg = $("carte"), ksl = $("ksl"), vsl = $("vsl"), bm = $("metal"), d = 0.02, U = ES.K * NC / d;
  const O = { W: 640, H: 360, x0: -0.1, x1: 0.06, y0: -0.045, y1: 0.045 }, OPT = { r0: 1e-3, ds: 6e-4, n: 900, loin: 0.5 };
  let metal = false;
  function draw() {
    const k = +ksl.value, V0 = -(+vsl.value) * U, ch = [{ q: NC, x: d, y: 0 }, { q: -k * NC, x: -d, y: 0 }];
    const phi = p => ES.potentiel(ch, p), dedans = p => phi(p) < V0 || Math.hypot(p[0] + d, p[1]) < 1e-3;
    const c = CarteChamp.carte(svg, O);
    if (metal) {
      const g = c.layer("c-label-2"), nx = 160, ny = 90, cw = O.W / nx, chh = O.H / ny;
      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
        const p = [O.x0 + (O.x1 - O.x0) * (i + 0.5) / nx, O.y0 + (O.y1 - O.y0) * (j + 0.5) / ny];
        if (dedans(p)) Plot.el("rect", { x: (i * cw).toFixed(1), y: (O.H - (j + 1) * chh).toFixed(1), width: (cw + 0.3).toFixed(1), height: (chh + 0.3).toFixed(1), class: "fill", opacity: "0.3", "shape-rendering": "crispEdges" }, g);
      }
    }
    const niv = [-2, -1, -0.5, -0.25, 0.25, 0.5, 1, 2].map(x => x * U).filter(v => Math.abs(v - V0) > 0.05 * U);
    const gn = c.layer("c-label");      /* level lines, cut where the metal is */
    niv.forEach(v => AnaVec.isolignes(phi, O.x0, O.x1, 128, O.y0, O.y1, 72, v).forEach(([a, b]) => {
      if (metal && dedans([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2])) return;
      Plot.el("line", { x1: c.sx(a[0]).toFixed(1), y1: c.sy(a[1]).toFixed(1), x2: c.sx(b[0]).toFixed(1), y2: c.sy(b[1]).toFixed(1), class: "stroke thin" }, gn);
    }));
    CarteChamp.niveaux(c, phi, [V0], { epais: 0, cls: "c-label-2", n: [160, 90] });
    const lg = c.layer("c-tint");
    ES.anglesEgalFlux(9).forEach(al => [1, -1].forEach(sg => {
      const pts = ES.suivreLigne(ch, 0, sg * al, Object.assign({ u: [-1, 0] }, OPT)).points, out = [];
      for (const p of pts) { if (p[0] < O.x0 - 0.01 || p[0] > O.x1 + 0.01 || p[1] < O.y0 - 0.01 || p[1] > O.y1 + 0.01) break; out.push(p); if (metal && dedans(p)) break; }
      if (out.length > 1) Plot.el("polyline", { points: out.map(p => c.sx(p[0]).toFixed(1) + "," + c.sy(p[1]).toFixed(1)).join(" "), class: "stroke thin" }, lg);
    }));
    CarteChamp.point(c, [d, 0], 4, "c-warn", t("fig.nom.q"));
    if (!metal) CarteChamp.point(c, [-d, 0], 4, "c-tint", t("fig.nom.qp"));
    /* what the chosen surface is */
    let forme, fdet;
    if (+vsl.value === 0 && k === 1) { forme = t("fig.v.plan"); fdet = t("fig.f.plan"); }
    else if (+vsl.value === 0) { const a = ES.apollonius(NC, d, -k * NC, -d); forme = t("fig.v.sphere", { R: F.si(a.rayon, "m", { prefix: "m" }) }); fdet = t("fig.f.sphere", { c: F.si(Math.abs(a.centre + d), "m", { prefix: "m" }) }); }
    else { forme = t("fig.v.fermee"); fdet = t("fig.f.fermee"); }
    $("kread").textContent = t("fig.kv", { k: F.num(k, 2) });
    $("vread").textContent = F.si(V0, "V");
    $("vf").textContent = forme; $("ff").textContent = fdet;
    $("vc").textContent = F.si(-k * NC, "C", { prefix: "n" });
    $("fc").textContent = t("fig.f.charge");
    $("vl").textContent = t("fig.pct", { x: F.num(100 * k, 3) });
    $("fl").textContent = t("fig.f.lignes");
    bm.setAttribute("aria-pressed", metal);
    bm.textContent = t(metal ? "fig.metal.off" : "fig.metal");
  }
  bm.onclick = () => { metal = !metal; draw(); };
  ksl.oninput = vsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lettre", 1845, "idea"], ["green", 1845, "idea"], ["maxwell", 1873, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["antenne", "ligne"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["principe", "b"], ["dedans", "d"], ["unicite", "a"], ["charge", "c"], ["choix", "b"], ["fermee", "a"], ["lignes", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 67 });
})();
</script>
