    <div class="eq">
      <math display="block"><mi>E</mi><mo>(</mo><mi>r</mi><mo>)</mo><mo>≈</mo><mfrac><msup><mi>ħ</mi><mn>2</mn></msup><mrow><mn>2</mn><msub><mi>m</mi><mi>e</mi></msub><msup><mi>r</mi><mn>2</mn></msup></mrow></mfrac><mo>−</mo><mfrac><msup><mi>e</mi><mn>2</mn></msup><mrow><mn>4</mn><mi>π</mi><msub><mi>ε</mi><mn>0</mn></msub><mi>r</mi></mrow></mfrac></math>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>

<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/physique-quantique.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/physique-fondamentale.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const $ = id => document.getElementById(id);
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const P = Fondamentale;
const eV = J => F.si(J / P.E, "eV");

/* ---------- §2-3 : le prix du confinement ---------- */
(() => {
  const M = { e: P.ME, p: P.MP }, xsl = $("xsl");
  let who = "e";
  /* échelles de liaison auxquelles comparer : atome ~ 10 eV, noyau ~ 8 MeV par nucléon */
  const SCALES = [["atome", 10 * P.E], ["noyau", 8 * P.MEV]];
  const upd = () => {
    const dx = 10 ** +xsl.value, m = M[who], dp = P.deltaPMin(dx), Ek = P.kinetic(dp, m), Et = Ek + m * P.C * P.C;
    const v = dp * P.C * P.C / Et;                                  // v = pc²/E, toujours < c
    $("xread").textContent = F.si(dx, "m");
    $("vdp").textContent = F.qty(F.sci(dp, 3), "kg·m·s⁻¹");
    $("vv").textContent = F.si(v, "m·s⁻¹");
    $("vvf").textContent = t("conf.vc", { r: F.num(v / P.C, 3) });
    $("vek").textContent = eV(Ek);
    $("vekj").textContent = t("conf.joule", { e: F.si(Ek, "J") });
    const [scale, Eb] = SCALES.find(s => Ek < 10 * s[1]) || SCALES[1];
    $("vcmp").textContent = t(Ek > 10 * SCALES[1][1] ? "conf.cmp.trop" : "conf.cmp." + scale, { r: F.num(Ek / Eb, 2) });
  };
  const pick = k => { who = k; ["e", "p"].forEach(id => $("p-" + id).setAttribute("aria-pressed", String(id === k))); upd(); };
  $("p-e").onclick = () => pick("e"); $("p-p").onclick = () => pick("p");
  $("c-atome").onclick = () => { xsl.value = -10; upd(); };
  $("c-noyau").onclick = () => { xsl.value = -15; upd(); };
  xsl.oninput = upd; upd();
})();

/* ---------- §2-3 : l'énergie de l'atome d'hydrogène en fonction de sa taille ---------- */
(() => {
  const RMIN = 10 ** -11.5, RMAX = 1e-9, YMIN = -40, YMAX = 40, a0 = P.atomRadius();
  const { x, y, g } = Plot.axes($("echart"), { fmt: F, w: 640, h: 320, pad: { l: 52 },
    x: { scale: "log", domain: [RMIN, RMAX], label: t("atom.x"), fmt: v => F.si(v, "m", { sig: 1 }) },
    y: { domain: [YMIN, YMAX], label: t("atom.y") } });
  const clip = v => Math.min(Math.max(v, YMIN - 5), YMAX + 5);
  /* only the part inside the frame: a point out of range ends the stroke, the next one inside starts a new one */
  const path = f => { let d = "", pen = false; for (let k = 0; k <= 600; k++) { const r = RMIN * (RMAX / RMIN) ** (k / 600), v = f(r) / P.E;
    if (v < YMIN || v > YMAX) { pen = false; continue; } d += (pen ? "L" : "M") + x(r).toFixed(1) + " " + y(v).toFixed(1); pen = true; } return d; };
  Plot.el("line", { x1: x(RMIN), x2: x(RMAX), y1: y(0), y2: y(0), class: "zero" }, g);
  Plot.el("path", { d: path(r => P.atomKinetic(r)), class: "ref" }, g);
  Plot.el("path", { d: path(r => P.atomPotential(r)), class: "ref" }, g);
  Plot.el("path", { d: path(r => P.atomEnergy(r)), class: "curve" }, g);
  const tk = Plot.el("text", { class: "note", x: x(2.2e-11), y: y(34) }, g), tp = Plot.el("text", { class: "note", x: x(2.2e-11), y: y(-34) }, g);
  tk.textContent = t("atom.lab.ec"); tp.textContent = t("atom.lab.ep");
  const dot = Plot.el("circle", { r: 6, class: "dot" }, g), rsl = $("rsl");
  $("va0").textContent = F.si(a0, "m");
  $("va0f").textContent = t("atom.a0f", { e: eV(P.atomGround()) });
  const upd = () => {
    const r = 10 ** +rsl.value;
    $("rread").textContent = F.si(r, "m");
    dot.setAttribute("cx", x(r)); dot.setAttribute("cy", y(clip(P.atomEnergy(r) / P.E)));
    $("vec").textContent = eV(P.atomKinetic(r));
    $("vep").textContent = eV(P.atomPotential(r));
    $("vet").textContent = eV(P.atomEnergy(r));
  };
  $("amin").onclick = () => { rsl.value = Math.log10(a0).toFixed(2); upd(); };
  rsl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["planck", 1900, "idea"], ["einstein", 1905, "idea"], ["bohr", 1913, "idea"], ["debroglie", 1924, "idea"],
    ["davisson", 1927, "experiment"], ["heisenberg", 1927, "idea"], ["anderson", 1932, "experiment"], ["qed", 1948, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["microscope", "tep"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dx", "b"], ["noyau", "d"], ["effondre", "a"], ["zero", "c"], ["masse", "b"], ["hasard", "a"], ["electron", "c"], ["antiparticule", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 23 });
})();
</script>
