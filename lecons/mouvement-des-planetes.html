<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const small = (x, sig) => x === 0 ? "0" : Math.abs(x) >= 1e-2 && Math.abs(x) < 1e4 ? F.num(x, sig) : F.sci(x, sig);
const signed = (x, sig) => (x > 0 ? "+" : x < 0 ? F.MINUS : "") + small(Math.abs(x), sig);

/* ---------- ce que l'on néglige ---------- */
(() => { const IDS = ["soleil", "planetes", "relativite", "taille", "plan"]; keyed($("neglect"), t("neglect.tag"), IDS, textOf("neglect.items", IDS)); })();

/* ---------- l'orbite de Feynman : GM = 1, départ au périhélie ou à l'aphélie, six révolutions ---------- */
(() => {
  const K = Integ.kepler(1), ORBITS = 6, MERCURE = 5.0e-7, svg = $("orb"), P = Plot.el, hs = $("hs"), vs = $("vs");
  const WD = 640, HT = 400;
  let method = "leapfrog";
  function upd() {
    const h = Math.pow(10, +hs.value), vy = +vs.value, s0 = { t: 0, x: [0.5, 0], v: [0, vy] }, el = K.elements(s0);
    const T = 2 * Math.PI * Math.pow(el.a, 1.5), n = Math.round(ORBITS * T / h), r = Integ.run(method, K.a, s0, h, n);
    Integ.METHODS.forEach(m => $("m-" + m).setAttribute("aria-pressed", String(m === method)));
    /* the exact ellipse fixes the frame: same scale on both axes, Sun at the origin */
    const ell = Array.from({ length: 241 }, (_, i) => { const th = 2 * Math.PI * i / 240, rr = el.a * (1 - el.e * el.e) / (1 + el.e * Math.cos(th - el.varpi)); return [rr * Math.cos(th), rr * Math.sin(th)]; });
    const xs = ell.map(p => p[0]), ys = ell.map(p => p[1]), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const k = Math.min((WD - 40) / (x1 - x0), (HT - 40) / (y1 - y0)) / 1.25, cx = WD / 2 - k * (x0 + x1) / 2, cy = HT / 2 + k * (y0 + y1) / 2;
    const X = x => cx + k * x, Y = y => cy - k * y, pth = pts => pts.map(([px, py], i) => (i ? "L" : "M") + X(px).toFixed(1) + " " + Y(py).toFixed(1)).join("");
    svg.innerHTML = "";
    const clip = P("clipPath", { id: "orbarea" }, svg); P("rect", { x: 0, y: 0, width: WD, height: HT }, clip);
    const g = P("g", { "clip-path": "url(#orbarea)" }, svg);
    P("path", { d: pth(ell), class: "stroke thin dash c-label-2" }, g);
    const every = Math.max(1, Math.floor(n / 6000)), far = 50 * el.a;
    const pts = r.x.filter((p, i) => (i % every === 0 || i === n) && isFinite(p[0]) && isFinite(p[1])).map(p => [Math.max(-far, Math.min(far, p[0])), Math.max(-far, Math.min(far, p[1]))]);
    P("path", { d: pth(pts), class: "stroke c-tint" }, g);
    P("circle", { cx: X(0), cy: Y(0), r: 7, class: "fill c-warn" }, g);
    P("circle", { cx: X(0.5), cy: Y(0), r: 4, class: "fill c-label" }, g);
    /* half period: first crossing of the x axis downward, as Feynman reads it off his table */
    let half = NaN;
    for (let i = 1; i < r.t.length; i++) if (r.x[i - 1][1] > 0 && r.x[i][1] <= 0) { half = r.t[i - 1] + h * r.x[i - 1][1] / (r.x[i - 1][1] - r.x[i][1]); break; }
    const E0 = el.E, Es = r.t.map((_, i) => K.energy({ x: r.x[i], v: r.v[i] })), dEnd = (Es[n] - E0) / -E0;
    const dMax = Math.max(...Es.map(E => Math.abs(E - E0) / -E0)), escaped = !(Es[n] < 0);
    const peri = escaped ? [] : K.perihelia(r), prec = peri.length >= 2 ? (peri[peri.length - 1].angle - peri[0].angle) / (peri.length - 1) : NaN;
    $("hread").textContent = small(h, 2); $("vread").textContent = F.num(vy, 3);
    $("vhalf").textContent = isFinite(half) ? F.num(half, 4) : "–";
    $("fhalf").textContent = isFinite(half) ? t("orb.f.half", { k: F.num(T / 2, 4), e: signed((2 * half / T - 1) * 100, 2) }) : t("orb.f.escape");
    $("vE").textContent = isFinite(dEnd) ? F.qty(signed(dEnd * 100, 2), "%") : "–";
    $("fE").textContent = escaped ? t("orb.f.escape") : t("orb.f.E", { m: small(dMax * 100, 2) });
    $("vprec").textContent = isFinite(prec) ? F.qty(signed(prec, 2), "rad") : "–";
    /* the step for a spurious advance ten times below Mercury's: errors go as h for Euler, h² for the other two */
    const p = method === "euler" ? 1 : 2, need = isFinite(prec) && prec !== 0 ? h * Math.pow(MERCURE / 10 / Math.abs(prec), 1 / p) : NaN;
    $("vneed").textContent = isFinite(need) ? small(need, 1) : "–";
    $("fneed").textContent = isFinite(need) ? t("orb.f.need", { n: small(T / need, 1) }) : t(escaped ? "orb.f.escape" : "orb.f.none");
  }
  Integ.METHODS.forEach(m => $("m-" + m).onclick = () => { method = m; upd(); });
  hs.oninput = vs.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kepler", 1609, "idea"], ["newton", 1687, "idea"], ["neptune", 1846, "experiment"], ["mercure", 1859, "experiment"], ["cowell", 1909, "experiment"], ["einstein", 1915, "idea"], ["laskar", 1989, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["inpop", "jpl"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["spirale", "a"], ["juge", "a"], ["pas2", "a"], ["mercure", "a"], ["perturb", "a"], ["kepler3", "a"], ["feynman", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 97 });
})();
</script>
