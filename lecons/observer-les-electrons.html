<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp;

/* the system: 50 keV electrons, two slits 1 µm apart and 0,2 µm wide, a screen 1 m away */
const P_E = Q.impulsion(Q.m_e, 50e3 * Q.e), LAMBDA_E = Q.broglie(P_E), FENTES = { lambda: LAMBDA_E, d: 1e-6, a: 0.2e-6, L: 1 };

/* ---------- light the electrons: wavelength against the hole spacing, number of photons ---------- */
(() => {
  const svg = $("ecran"), slam = $("slam"), sn = $("sn");
  const X = 16e-6, xs = Array.from({ length: 641 }, (_, i) => -X + i * 2 * X / 640);
  function draw() {
    const rap = Math.pow(10, +slam.value), lambda = rap * FENTES.d, n = +sn.value;
    const g = Q.recouvrementPhoton(FENTES.d, lambda), V = Q.contrasteEclaire(g, n), D = Q.distinguabiliteEclaire(g, n);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 40 }, x: { domain: [-16, 16], label: t("fig.xaxis") }, y: { domain: [0, 4.2], label: t("fig.yaxis") } });
    const pts = xs.map(x => Q.probaAvecTemoin(x, FENTES, V));
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x * 1e6), P.y(pts[i].somme)])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(xs.map((x, i) => [P.x(x * 1e6), P.y(pts[i].P)])), class: "curve" }, P.g);
    $("slamr").textContent = t("fig.f.lambda", { l: F.si(lambda, "m"), r: F.num(rap, 2) });
    $("snr").textContent = F.num(n, 3);
    $("vv").textContent = F.num(V, 2);
    $("fv").textContent = t("fig.f.v", { g: F.num(Math.round(g * 100) / 100, 2), vus: F.num(100 * (1 - Math.exp(-n)), 2) });
    $("vd").textContent = F.num(D, 2);
    $("fd").textContent = t("fig.f.d", { p: F.num(100 * (1 + D) / 2, 3) });
    $("vr").textContent = F.num(1 / rap, 2);
    $("fr").textContent = t(rap < 0.5 ? "fig.f.net" : rap < 2 ? "fig.f.flou" : "fig.f.rien");
  }
  slam.oninput = sn.oninput = draw; draw();
})();

/* ---------- the system described: what Feynman's lamp would have to be ---------- */
(() => {
  const v = Q.vitessesOnde(Q.m_e, P_E).groupe, duree = FENTES.d / v, lambda = 500e-9;
  const I1 = 1 / Q.photonsThomson(1, lambda, duree);
  $("sys1").innerHTML = t("sys1.body", { le: F.si(LAMBDA_E, "m"), v: F.num(v / Q.c, 2), i: F.si(Q.interfrangeFentes(LAMBDA_E, FENTES.L, FENTES.d), "m"),
    pr: F.sci(Q.h / lambda / P_E, 2), tf: F.sci(LAMBDA_E / FENTES.d, 2) });
  $("sys2").innerHTML = t("sys2.body", { tau: F.si(duree, "s"), I: F.qty(F.sci(I1, 2), "W·m⁻²") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["solvay", 1927, "idea"], ["chapman", 1995, "experiment"], ["rempe", 1998, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cle"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["eclair", "b"], ["colonnes", "d"], ["faible", "a"], ["rouge", "c"], ["seuil", "b"], ["recul", "a"], ["balles", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 376 });
})();
</script>
