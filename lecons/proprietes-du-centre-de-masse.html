<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Solide, g = Constantes.g_CPGE;

/* ---------- §19-1 : le marteau posé sur un doigt — composition (19.2) et moment du poids (19.3) ---------- */
(() => {
  const LM = 0.30, MM = 0.10, XT = 0.30, LT = 0.04;                 // manche 30 cm, 100 g ; tête centrée à 30 cm, 4 cm de large
  const X = x => 14 + x * 900, Y0 = 70, svg = $("marteau");
  svg.setAttribute("viewBox", "0 0 340 140");
  function upd() {
    const mt = 0.02 + +$("mt").value / 100, xo = +$("xo").value / 1000;
    const corps = [{ m: MM, r: [LM / 2, 0] }, { m: mt, r: [XT, 0] }];          // chaque partie réduite à son centre de masse
    const xg = S.centreDeMasse(corps)[0], tau = S.momentPoids(corps, [xo, 0], g);
    svg.innerHTML = "";
    const tilt = Math.abs(xg - xo) < 0.002 ? 0 : (tau < 0 ? 6 : -6);
    const grp = Plot.el("g", { transform: `rotate(${tilt} ${X(xo)} ${Y0 + 6})` }, svg);
    Plot.el("rect", { x: X(0), y: Y0, width: X(LM - LT / 2) - X(0), height: 8, class: "fill c-label-2" }, grp);
    const h = 18 + 40 * Math.sqrt(mt);
    Plot.el("rect", { x: X(XT - LT / 2), y: Y0 + 4 - h / 2, width: X(LT) - X(0), height: h, class: "fill c-label" }, grp);
    Plot.el("circle", { cx: X(xg), cy: Y0 + 4, r: 6, class: "fill c-tint" }, grp);  // G, au-dessus de la tête si elle le cache
    Plot.el("text", { x: X(xg), y: Y0 - 8, "text-anchor": "middle" }, grp).textContent = t("m.G");
    Plot.el("path", { d: `M${X(xo)} ${Y0 + 9}L${X(xo) - 9} ${Y0 + 30}L${X(xo) + 9} ${Y0 + 30}Z`, class: "fill c-warn" }, svg);
    Plot.el("text", { x: X(xo), y: Y0 + 46, "text-anchor": "middle" }, svg).textContent = t("m.O");
    const cm = x => F.qty(F.num(x * 1000, 3), "mm");
    $("mtv").textContent = F.qty(F.num(mt * 1000, 3), "g");
    $("xov").textContent = cm(xo);
    $("vG").textContent = cm(xg);
    $("vtau").textContent = Math.abs(xg - xo) < 0.002 ? "0" : F.qty(F.num(tau, 2), "N·m");
    $("ftau").textContent = t(Math.abs(xg - xo) < 0.002 ? "m.f.eq" : tau < 0 ? "m.f.tete" : "m.f.manche");
  }
  $("mt").oninput = upd; $("xo").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["archimede", -250, "idea"], ["commandino", 1565, "idea"], ["newton", 1687, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["avion"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["anneau", "c"], ["symetrie", "a"], ["compose", "d"], ["equilibre", "b"], ["poids", "c"], ["voiture", "a"], ["tour", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 191 });
})();
</script>
