<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd;

/* ---------- deux raies voisines vues dans l'ordre m ---------- */
(() => {
  const trace = $("trace"), seg = $("ordre"), sn = $("sn"), sdl = $("sdl"), L0 = 589.2935e-9, d = 1e-3 / 300;   // 300 traits per mm
  let m = 1;
  function draw() {
    const n = +sn.value, dl = +sdl.value * 1e-12, l1 = L0 - dl / 2, l2 = L0 + dl / 2;
    const r = O.deuxRaies({ n, d, lambda1: l1, lambda2: l2, m, N: 401 });
    const mid = (r.t1 + r.t2) / 2, X = th => 1e3 * (th - mid);                 // milliradians from the middle of the pair
    const span = X(r.theta[r.theta.length - 1]);
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 240, pad: { l: 52, b: 44 }, x: { domain: [-span, span], label: t("fig.xaxis") }, y: { domain: [0, 2.1], label: t("fig.yaxis") } });
    const one = l => r.theta.map(th => [P.x(X(th)), P.y(O.intensiteReseau(th, { n, d, lambda: l }))]);
    Plot.el("path", { d: Plot.path(one(l1)), class: "stroke thin c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(one(l2)), class: "stroke thin c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(r.theta.map((th, i) => [P.x(X(th)), P.y(r.I[i])])), class: "curve" }, P.g);
    $("snr").textContent = F.num(n, 4);
    $("sdlr").textContent = F.si(dl, "m", { prefix: "p" });
    $("vdem").textContent = F.num(r.R, 3);
    $("fdem").textContent = t("fig.f.demande", { l: F.si(L0, "m", { prefix: "n" }) });
    $("vres").textContent = F.num(r.Rreseau, 4);
    $("fres").textContent = t(r.Rreseau >= r.R ? "fig.f.oui" : "fig.f.non");
    $("vcreux").textContent = r.creux > 0.995 ? t("fig.aucun") : F.qty(F.num(100 * r.creux, 2), "%");
    $("fcreux").textContent = t("fig.f.creux");
    const tt = O.retard(n, d, L0, 0, Math.asin(m * L0 / d));
    $("vt").textContent = F.si(tt.T, "s", { prefix: "p" });
    $("ft").textContent = t("fig.f.t", { dnu: F.si(tt.dnu, "Hz", { prefix: "G" }), dnul: F.si(tt.nu * dl / L0, "Hz", { prefix: "G" }) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.m === m)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { m = +x.dataset.m; draw(); });
  sn.oninput = sdl.oninput = draw; draw();
})();

/* ---------- les systèmes décrits : le retard d'un réseau, la largeur propre d'une raie ---------- */
(() => {
  const n = 1000, lambda = 589.2935e-9, c = O.c, T = n * lambda / c;
  $("sys1").innerHTML = t("sys1.body", { n: F.num(n, 4), l: F.si(lambda, "m", { prefix: "n" }), T: F.si(T, "s", { prefix: "p" }),
    dnu: F.si(1 / T, "Hz", { prefix: "G" }), nu: F.si(c / lambda, "Hz", { prefix: "T" }) });
  const kB = Constantes.k_B, Temp = 500, M = 23 * Constantes.u;   // a sodium lamp, temperature assumed
  const rel = Math.sqrt(8 * kB * Temp * Math.LN2 / (M * c * c));
  $("sys2").innerHTML = t("sys2.body", { T: F.kelvin(Temp), rel: F.sci(rel, 2), R: F.sci(1 / rel, 2), dl: F.si(rel * lambda, "m", { prefix: "p" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rayleigh", 1879, "idea"], ["harrison", 1949, "experiment"], ["harps", 2003, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["harps"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["critere", "c"], ["sodium", "a"], ["ordre", "d"], ["pas", "b"], ["retard", "a"], ["largeur", "c"], ["borne", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 303 });
})();
</script>
