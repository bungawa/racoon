<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique;

/* ---------- la table 40-1 contre le compte classique ---------- */
(() => {
  const G = S.GAMMA_MES, IDS = Object.keys(G), noms = textOf("tab.noms", IDS), verdicts = textOf("tab.verdicts", IDS);
  const svg = $("table"), sg = $("gz"), seg = $("vseg");
  sg.innerHTML = IDS.map(k => `<option value="${k}">${noms[k]}</option>`).join(""); sg.value = "O2";
  let vib = true;
  function draw() {
    const gz = sg.value, g = G[gz];
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44, l: 56 },
      x: { domain: [0, 45], label: t("tab.x") }, y: { domain: [1, 1.7], label: t("tab.y"), fmt: y => F.fix(y, 1) } });
    const pts = []; for (let i = 0; i <= 200; i++) { const f = 2.6 + (45 - 2.6) * i / 200; pts.push([o.x(f), o.y(S.gammaDe(f))]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke thin" }, o.g);
    const fs = S.fDe(g.gamma);
    Plot.el("line", { x1: o.x(0), x2: o.x(45), y1: o.y(g.gamma), y2: o.y(g.gamma), class: "ref" }, o.g);
    Plot.el("line", { x1: o.x(fs), x2: o.x(fs), y1: o.y(g.gamma), y2: o.y(1), class: "ref" }, o.g);
    for (const k of IDS) {
      const h = G[k], f = S.degres(h.r, h.lin, vib), sel = k === gz, x = o.x(f);
      Plot.el("line", { x1: x, x2: x, y1: o.y(S.gammaDe(f)), y2: o.y(h.gamma), class: "stroke thin dash c-label" }, o.g);
      Plot.el("circle", { cx: x, cy: o.y(S.gammaDe(f)), r: sel ? 6 : 4, class: "fill c-warn" }, o.g);
      Plot.el("circle", { cx: x, cy: o.y(h.gamma), r: sel ? 7 : 4.5, class: "dot" }, o.g);
    }
    const f = S.degres(g.r, g.lin, vib), gc = S.gammaDe(f);
    $("vmes").textContent = F.fix(g.gamma, 3);
    $("fmes").innerHTML = t("tab.f.mes", { T: F.kelvin(g.T) });
    $("vcl").textContent = F.fix(gc, 3);
    $("fcl").textContent = t("tab.f.cl", { f: F.num(f, 3) });
    $("vf").textContent = F.num(fs, 3);
    $("vcv").textContent = F.si(S.cvMassique(g.gamma, g.M), "J·kg⁻¹·K⁻¹", { sig: 3 });
    $("fcv").textContent = t("tab.f.cv", { c: F.si(S.cvMolaire(g.gamma), "J·mol⁻¹·K⁻¹", { sig: 3 }), M: F.si(1e3 * g.M, "g·mol⁻¹", { sig: 4 }) });
    $("verdict").innerHTML = verdicts[gz];
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === (vib ? "1" : "0"))));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { vib = b.dataset.v === "1"; draw(); });
  sg.onchange = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["laplace", 1816, "idea"], ["kundt", 1876, "experiment"], ["argon", 1895, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["acoustique", "oxygene"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["mono", "b"], ["massique", "d"], ["rigide", "a"], ["raideur", "c"], ["ethane", "b"], ["iode", "d"], ["son", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 405 });
})();
</script>
