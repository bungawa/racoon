<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const g = Constantes.g_CPGE, EAU = Fluides.DYN.eau;
const VEN = { D1: 0.05, H1: 1.2 };                              // pipe diameter (m), water column over the axis at section 1 (m)

/* ---------- the system, in numbers ---------- */
(() => {
  const v = FluidesParfait.venturi(1e-3, VEN.D1, 0.6 * VEN.D1, EAU.rho);
  $("sys").innerHTML = t("sys.body", { D: F.num(100 * VEN.D1, 2), v1: F.fix(v.v1, 2), v2: F.fix(v.v2, 2),
    re: F.sci(Fluides.reynolds(v.v2, 0.6 * VEN.D1, EAU.nu), 1), ma: F.sci(Fluides.compressibilite(v.v2, Fluides.CSON_EAU), 1) });
})();

/* ---------- the Venturi tube ---------- */
(() => {
  const svg = $("venturi"), P = Plot.el, notes = textOf("ven.notes", ["normal", "vide"]);
  const AX = 250, X = [60, 180, 290, 350, 460, 580], cols = [120, 320, 520];   // axis y (px), profile x, manometer x
  const PX = 110 / VEN.H1;                                       // px per metre of water column
  function draw() {
    const Q = +$("q").value * 1e-3, r = +$("d").value, D2 = r * VEN.D1, v = FluidesParfait.venturi(Q, VEN.D1, D2, EAU.rho);
    const R1 = 34, R2 = R1 * r, h1 = VEN.H1, h2 = h1 - v.dp / (EAU.rho * g);
    svg.innerHTML = "";
    const prof = s => [[X[0], AX - s * R1], [X[1], AX - s * R1], [X[2], AX - s * R2], [X[3], AX - s * R2], [X[4], AX - s * R1], [X[5], AX - s * R1]];
    const gw = P("g", { class: "c-tint" }, svg);
    P("polygon", { points: prof(1).concat(prof(-1).reverse()).map(q => q.join(",")).join(" "), class: "fill", opacity: 0.25 }, gw);
    const gl = P("g", { class: "c-label" }, svg);
    [1, -1].forEach(s => P("polyline", { points: prof(s).map(q => q.join(",")).join(" "), class: "stroke bold" }, gl));
    /* streamlines: the area between two of them is constant, so they squeeze in the throat */
    const gs = P("g", { class: "c-label-2" }, svg);
    [-0.6, -0.2, 0.2, 0.6].forEach(f => P("polyline", { points: prof(1).map(q => [q[0], AX - f * (AX - q[1])].join(",")).join(" "), class: "stroke thin dash" }, gs));
    /* manometers: open tubes on the pipe, water rises to p/(ρg) above the axis */
    const radius = [R1, R2, R1], heads = [h1, h2, h1], gm = P("g", { class: "c-label" }, svg), gh = P("g", { class: "c-tint" }, svg);
    cols.forEach((x, i) => {
      const top = AX - radius[i];
      P("polyline", { points: [[x - 6, 10], [x - 6, top], [x + 6, top], [x + 6, 10]].map(q => q.join(",")).join(" "), class: "stroke thin" }, gm);
      const level = AX - Math.max(heads[i], 0) * PX, y = Math.max(Math.min(level, top), 10);
      if (heads[i] * PX > radius[i]) P("rect", { x: x - 5, y, width: 10, height: top - y, class: "fill" }, gh);
      P("text", { x: x + 12, y: Math.max(y, 22) + 4, class: "note" }, gm).textContent = heads[i] > 0 ? F.qty(F.fix(heads[i], 2), "m") : t("ven.vide");
    });
    P("line", { x1: 20, x2: 620, y1: AX, y2: AX, class: "stroke thin dash" }, gm);
    $("qr").textContent = F.qty(F.fix(Q * 1000, 2), "L·s⁻¹"); $("dr").textContent = F.fix(r, 2);
    $("vv").textContent = F.qty(F.fix(v.v2, 2), "m·s⁻¹"); $("fv").innerHTML = t("ven.f.v", { v1: F.fix(v.v1, 2), k: F.fix(1 / (r * r), 2) });
    $("vdp").textContent = F.si(v.dp, "Pa"); $("fdp").innerHTML = t("ven.f.dp", { h: F.fix(v.dp / (EAU.rho * g), 3) });
    $("vnote").innerHTML = h2 > 0 ? notes.normal : notes.vide;
  }
  $("q").oninput = $("d").oninput = draw; draw();
})();

/* ---------- Torricelli: a draining tank ---------- */
(() => {
  const svg = $("cuve"), P = Plot.el, A = 0.1, h0 = 0.5, zt = 0.3;   // tank section (m²), level at start, height of the hole over the floor (m)
  let Cc = 0.62, run = null, start = 0;
  let x, y, curves, dot, tmax = 600;
  const axes = T => {
    tmax = Math.ceil(T / 100) * 100;
    $("niveau").innerHTML = "";
    const ax = Plot.axes($("niveau"), { fmt: F, w: 320, h: 300, pad: { l: 52, b: 44 },
      x: { domain: [0, tmax], label: t("tor.x") }, y: { domain: [0, 0.55], label: t("tor.y") } });
    x = ax.x; y = ax.y; curves = P("g", {}, ax.g); dot = P("circle", { r: 5, class: "dot" }, ax.g);
  };
  const S = 300 / 1.1, Y = z => 290 - S * z, Xc = 10, Wc = 80;
  function state() {
    const d = +$("dt").value * 1e-3, a = Math.PI * d * d / 4, T = FluidesParfait.tempsVidange(A, a, h0, Cc, g), run = FluidesParfait.vidange(A, a, h0, Cc, g, 1);
    return { d, a, T, run };
  }
  function tank(h, s) {
    svg.innerHTML = "";
    const gl = P("g", { class: "c-label" }, svg), gw = P("g", { class: "c-tint" }, svg);
    P("rect", { x: Xc, y: Y(zt + h), width: Wc, height: S * h, class: "fill", opacity: 0.35 }, gw);
    P("polyline", { points: [[Xc, Y(zt + 0.6)], [Xc, Y(zt)], [Xc + Wc, Y(zt)], [Xc + Wc, Y(zt + 0.6)]].map(q => q.join(",")).join(" "), class: "stroke bold" }, gl);
    P("line", { x1: Xc + Wc, x2: 320, y1: Y(0), y2: Y(0), class: "stroke thin" }, gl);
    P("line", { x1: Xc + Wc - 10, x2: Xc + Wc + 4, y1: Y(zt + 0.01), y2: Y(zt + 0.01), class: "stroke thin" }, gl);
    if (h > 0) {   // the jet: launched horizontally at v, it falls zt: range 2√(h zt) with Cc changing nothing in v
      const v = FluidesParfait.torricelli(h, g, Cc * s.a / A), pts = [];
      for (let i = 0; i <= 30; i++) { const tt = Math.sqrt(2 * zt / g) * i / 30; pts.push([Xc + Wc + S * v * tt, Y(zt + 0.01 - g * tt * tt / 2)]); }
      P("polyline", { points: pts.map(q => q.map(n => n.toFixed(1)).join(",")).join(" "), class: "stroke bold" }, gw);
      P("text", { x: Xc + 4, y: Y(zt + h) - 6, class: "note" }, gl).textContent = "h = " + F.qty(F.fix(h, 3), "m");
    }
  }
  function curvesDraw(s) {
    curves.innerHTML = "";
    let d = ""; s.run.t.forEach((tt, i) => { if (tt <= tmax) d += (d ? "L" : "M") + x(tt).toFixed(1) + " " + y(s.run.h[i]).toFixed(1); });
    Plot.el("path", { d, class: "curve" }, curves);
    let e = ""; for (let i = 0; i <= 100; i++) { const tt = s.T * i / 100; e += (i ? "L" : "M") + x(tt).toFixed(1) + " " + y(h0 * (1 - tt / s.T) ** 2).toFixed(1); }
    Plot.el("path", { d: e, class: "ref" }, curves);
  }
  function at(s, tt) {
    const i = s.run.t.findIndex(u => u >= tt); return i < 0 ? 0 : s.run.h[i];
  }
  function show(tt) {
    const s = state(), h = Math.max(at(s, tt), 0);
    tank(h, s); dot.setAttribute("cx", x(Math.min(tt, tmax))); dot.setAttribute("cy", y(h));
    $("tv").textContent = F.qty(F.fix(FluidesParfait.torricelli(h, g, Cc * s.a / A), 2), "m·s⁻¹");
    $("tf").innerHTML = t("tor.f.v", { q: F.fix(1000 * Cc * s.a * FluidesParfait.torricelli(h, g, Cc * s.a / A), 3) });
    $("tT").textContent = F.si(s.T, "s"); $("tTf").innerHTML = t("tor.f.T", { m: F.fix(s.T / 60, 1), r: F.sci(Cc * s.a / A, 1) });
  }
  function reset() { cancelAnimationFrame(run); run = null; const s = state(); axes(s.T); curvesDraw(s); $("dtr").textContent = F.qty(F.fix(+$("dt").value, 0), "mm"); show(0); }
  $("dt").oninput = reset;
  document.querySelectorAll("#orifice button").forEach(b => b.onclick = () => {
    Cc = +b.dataset.c; document.querySelectorAll("#orifice button").forEach(q => q.setAttribute("aria-pressed", q === b)); reset(); });
  $("go").onclick = () => {   // the whole draining in 8 s of animation
    cancelAnimationFrame(run); start = performance.now();
    const T = state().T;
    const loop = now => { const tt = T * (now - start) / 8000; show(Math.min(tt, T)); if (tt < T) run = requestAnimationFrame(loop); };
    run = requestAnimationFrame(loop);
  };
  reset();
})();

/* ---------- history ---------- */
(() => {
  const EVENTS = [["torricelli", 1644, "idea"], ["pitot", 1732, "experiment"], ["bernoulli", 1738, "idea"], ["venturi", 1797, "experiment"], ["herschel", 1888, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["debit", "pitot"], uses = textOf("uses.items", USES);
  const rhoAir = 1.225, dp = 0.5 * rhoAir * 70 * 70;             // a light aircraft at 70 m·s⁻¹, sea level (ISO 2533 density)
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace("{dp}", F.num(dp, 2))}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ligne", "b"], ["venturi", "a"], ["torricelli", "d"], ["vidange", "c"], ["feuilles", "b"], ["irrot", "a"], ["jet", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 403 });
})();
</script>
