<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-fluides" data-i18n="monde.fluides"></a><span class="aux">›</span><a href="/racoon/etape?id=sillages" data-i18n="etape.sillages"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fluides" href="/racoon/atlas?piste=fluides" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/nombre-de-reynolds" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="box def"><b data-i18n="s1.sys.title"></b>
      <p data-i18n-html="s1.sys.body"></p>
    </div>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><msub><mi>C</mi><mi>x</mi></msub><mo>=</mo><mfrac><mi>F</mi><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>ρ</mi><msup><mi>U</mi><mn>2</mn></msup><mi>D</mi><mi>ℓ</mi></mrow></mfrac><mo>,</mo><mspace width="1em"/><mi data-i18n="eq.re"></mi><mo>=</mo><mfrac><mrow><mi>U</mi><mi>D</mi></mrow><mi>ν</mi></mfrac></math><span class="n">(41.22a)</span></div>
    <p class="validite" data-i18n-html="val.41.25a"></p>
    <figure>
      <svg class="fig" id="sillage" viewBox="0 0 640 300" role="img" data-i18n-attr="aria-label:sil.aria"></svg>
      <div class="legend"><span class="c-label" data-i18n="sil.legend.lignes"></span><span class="c-warn" data-i18n="sil.legend.horaire"></span><span class="c-tint" data-i18n="sil.legend.direct"></span></div>
      <div class="panel">
        <div class="seg" role="group" data-i18n-attr="aria-label:sil.fluide">
          <button type="button" data-f="air" aria-pressed="true" data-i18n="fluide.air"></button>
          <button type="button" data-f="eau" aria-pressed="false" data-i18n="fluide.eau"></button>
        </div>
        <div class="controls">
          <div class="ctl"><div class="row"><label for="dsl" data-i18n="sil.d"></label><output id="dread" for="dsl"></output></div>
            <input id="dsl" type="range" min="-4" max="0" step="0.02" value="-2"></div>
          <div class="ctl"><div class="row"><label for="usl" data-i18n="sil.u"></label><output id="uread" for="usl"></output></div>
            <input id="usl" type="range" min="-3" max="1.7" step="0.02" value="-1.3"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="sil.k.re"></span><span class="v" id="vre"></span><span class="f" id="fre"></span></div>
          <div class="stat"><span class="k" data-i18n-html="sil.k.cx"></span><span class="v" id="vcx"></span><span class="f" id="fcx"></span></div>
          <div class="stat"><span class="k" data-i18n="sil.k.f"></span><span class="v" id="vf"></span><span class="f" id="fst"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="sil.caption"></figcaption>
    </figure>
    <figure class="chart">
      <svg class="fig" id="cxchart" role="img" data-i18n-attr="aria-label:cx.aria"></svg>
      <div class="legend"><span class="c-warn" data-i18n="cx.legend.lamb"></span><span class="c-tint" data-i18n="cx.legend.white"></span><span class="c-label-2" data-i18n="cx.legend.roshko"></span></div>
      <figcaption data-i18n-html="cx.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><msub><mi>C</mi><mi>x</mi></msub><mo>≈</mo><mfrac><mrow><mn>8</mn><mi>π</mi></mrow><mrow><mi data-i18n="eq.re"></mi><mspace width="0.1em"/><mo stretchy="false">(</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>−</mo><mi>γ</mi><mo>+</mo><mi data-i18n="fn.ln"></mi><mfrac><mn>8</mn><mi data-i18n="eq.re"></mi></mfrac><mo stretchy="false">)</mo></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.41.25b"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><msub><mi>C</mi><mi>x</mi></msub><mo>≈</mo><mn>1</mn><mo>+</mo><mn>10</mn><mspace width="0.1em"/><msup><mi data-i18n="eq.re"></mi><mrow><mo>−</mo><mn>2</mn><mo>/</mo><mn>3</mn></mrow></msup></math></div>
    <p class="validite" data-i18n-html="val.41.25c"></p>
    <div class="box warn"><b data-i18n="s2.warn.title"></b>
      <p data-i18n-html="s2.warn.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi data-i18n="eq.st"></mi><mo>=</mo><mfrac><mrow><mi>f</mi><mi>D</mi></mrow><mi>U</mi></mfrac><mo>≈</mo><mn>0,2</mn></math></div>
    <p class="validite" data-i18n-html="val.41.25d"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="box prop"><b data-i18n="s3.ex.title"></b>
      <p data-i18n-html="s3.ex.body"></p>
    </div>
    <p data-i18n-html="s3.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/ecoulement-autour-d-un-cylindre.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>
<script src="/racoon/carte-champ.js"></script>
<script src="/racoon/fluides.js"></script>
<script src="/racoon/carte-sillage.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹";
const FLUIDE = { air: Fluides.air(293.15, Constantes.atm), eau: Fluides.eau(293.15) };

/* ---------- le sillage selon Re : carte des lignes de courant, Cx et fréquence ---------- */
(() => {
  let fluide = "air";
  const svg = $("sillage"), chart = $("cxchart"), dsl = $("dsl"), usl = $("usl");
  function draw() {
    const D = Math.pow(10, +dsl.value), U = Math.pow(10, +usl.value), f = FLUIDE[fluide];
    const re = Fluides.reynolds(U, D, f.nu), reg = Fluides.regimeCylindre(re), cx = Fluides.cxCylindre(re), dt = Fluides.detachement(U, D, f.nu);
    CarteSillage.carte(svg, re);
    CarteSillage.cx(chart, F, t, re);
    $("dread").textContent = F.si(D, "m"); $("uread").textContent = F.si(U, MS);
    $("vre").textContent = F.num(re, 3); $("fre").textContent = t("regime." + reg);
    $("vcx").textContent = isFinite(cx) ? F.num(cx, 3) : "–";
    $("fcx").textContent = t(re <= Fluides.CYL.lambMax ? "sil.f.lamb" : re <= Fluides.CYL.whiteMax ? "sil.f.white" : isFinite(cx) ? "sil.f.roshko" : "sil.f.crise");
    $("vf").textContent = isFinite(dt.f) ? F.si(dt.f, "Hz") : "–";
    $("fst").textContent = isFinite(dt.st) ? t("sil.f.st", { st: F.num(dt.st, 2) }) : t(re < Fluides.CYL.allee ? "sil.f.pas" : "sil.f.irreg");
  }
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { fluide = b.dataset.f;
    document.querySelectorAll("[data-f]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  dsl.oninput = draw; usl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["strouhal", 1878, "experiment"], ["benard", 1908, "experiment"], ["karman", 1911, "idea"], ["roshko", 1961, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cheminee", "debitmetre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["paradoxe", "b"], ["seuil", "c"], ["similitude", "a"], ["frequence", "d"], ["cx", "b"], ["crise", "a"], ["diffusion", "c"], ["systeme", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 414 });
})();
</script>
</body>
</html>
