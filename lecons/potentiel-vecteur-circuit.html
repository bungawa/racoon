<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, MU0 = Constantes.mu0;

/* ---------- fil épais contre ligne : A_φ le long du rayon qui traverse le fil ; écarts au point sonde ---------- */
(() => {
  const svg = $("courbes"), sa = $("sa"), sd = $("sd"), Ic = 10, R = 0.05;                 // A, m
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 },
    x: { domain: [0.5, 1.5], label: t("fig.x") }, y: { domain: [0, 7], label: t("fig.y") } });
  const red = MU0 * Ic / (2 * Math.PI);                                                    // A_φ in units of μ0 I/(2π)
  const gm = Plot.el("g", {}, g), ge = Plot.el("g", {}, g);
  /* the thin line: spireExacte, NaN on the wire; the curve is cut where it leaves the frame */
  let d = "";
  for (let i = 0, up = true; i <= 400; i++) {
    const u = 0.5 + i / 400, v = M.spireExacte(Ic, R, u * R, 0).Aphi / red;
    if (!(v <= 7)) { up = true; continue; }
    d += (up ? "M" : "L") + x(u).toFixed(1) + " " + y(v).toFixed(1); up = false;
  }
  Plot.el("path", { d, class: "stroke c-label-2 dash" }, gm);
  const band = Plot.el("rect", { class: "fill c-tint", opacity: 0.12 }, g);
  const dot = Plot.el("circle", { r: 5, class: "fill c-warn" }, g);
  const aOf = () => R * 0.005 * Math.pow(60, sa.value / 1000);                             // a/R from 0,005 to 0,3
  function draw() {
    const a = aOf(), dmax = Math.min(20 * a, 0.5 * R), dd = 1.2 * a + (dmax - 1.2 * a) * sd.value / 1000, rho = R + dd;   // outside the wire, 1,2 a to min(20 a, R/2)
    ge.innerHTML = "";
    let p = "";
    for (let i = 0; i <= 160; i++) { const u = 0.5 + i / 160, v = M.anneauEpais(Ic, R, a, u * R, 0, 12).Aphi / red; p += (i ? "L" : "M") + x(u).toFixed(1) + " " + y(Math.min(v, 7)).toFixed(1); }
    Plot.el("path", { d: p, class: "stroke c-tint" }, ge);
    band.setAttribute("x", x(1 - a / R)); band.setAttribute("width", x(1 + a / R) - x(1 - a / R)); band.setAttribute("y", y(7)); band.setAttribute("height", y(0) - y(7));
    const th = M.spireExacte(Ic, R, rho, 0), tk = M.anneauEpais(Ic, R, a, rho, 0, 40);
    dot.setAttribute("cx", x(rho / R)); dot.setAttribute("cy", y(Math.min(tk.Aphi / red, 7)));
    const far = M.spireExacte(Ic, R, 0, 10 * R).Bz, farK = M.anneauEpais(Ic, R, a, 0, 10 * R, 24).Bz;
    $("sar").textContent = t("fig.v.a", { a: F.si(a, "m", { prefix: "m" }), r: F.num(a / R, 2) });
    $("sdr").textContent = t("fig.v.d", { d: F.si(dd, "m", { prefix: "m" }), k: F.num(dd / a, 2) });
    $("va").textContent = F.si(tk.Aphi, "T·m");
    $("fa").textContent = t("fig.f.a", { v: F.si(th.Aphi, "T·m"), e: F.sci(tk.Aphi / th.Aphi - 1, 2) });
    $("vb").textContent = F.sci(Math.hypot(tk.Brho - th.Brho, tk.Bz - th.Bz) / Math.hypot(th.Brho, th.Bz), 2);
    $("fb").textContent = t("fig.f.b", { e: F.sci(a * a / (8 * R * dd), 2) });
    $("vl").textContent = F.sci(farK / far - 1, 2);
    $("fl").textContent = t("fig.f.loin", { e: F.sci(a * a / (4 * R * R), 2) });
  }
  sa.oninput = sd.oninput = draw; draw();
})();

/* ---------- le système décrit : une spire de fil de cuivre de 1 mm ---------- */
(() => {
  const Ic = 10, R = 0.05, a = 0.5e-3, dd = 2 * a, th = M.spireExacte(Ic, R, R + dd, 0), tk = M.anneauEpais(Ic, R, a, R + dd, 0, 40);
  const ecart = Math.hypot(tk.Brho - th.Brho, tk.Bz - th.Bz) / Math.hypot(th.Brho, th.Bz);
  $("sys1").innerHTML = t("sys1.body", { R: F.si(R, "m", { prefix: "m" }), a: F.si(a, "m", { prefix: "m" }), I: F.si(Ic, "A"), ar: F.num(a / R, 2),
    d: F.si(dd, "m", { prefix: "m" }), e: F.sci(ecart, 1), loin: F.sci(a * a / (4 * R * R), 1), B: F.si(Math.hypot(th.Brho, th.Bz), "T") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1873, "idea"], ["grover", 1946, "use"], ["fasthenry", 1994, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["boitiers"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["section", "b"], ["noeud", "d"], ["branche", "a"], ["droit", "c"], ["loin", "b"], ["dedans", "a"], ["mailles", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 146 });
})();
</script>
