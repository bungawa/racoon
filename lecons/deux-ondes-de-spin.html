    <div class="eq"><math display="block"><mi>E</mi><mo>=</mo><mn>4</mn><mi>A</mi><mo>−</mo><mn>2</mn><mi>A</mi><mi data-i18n="eq.cos"></mi><msub><mi>k</mi><mn>1</mn></msub><mi>b</mi><mo>−</mo><mn>2</mn><mi>A</mi><mi data-i18n="eq.cos"></mi><msub><mi>k</mi><mn>2</mn></msub><mi>b</mi></math><span class="n">(15.19)</span></div>

<script src="/racoon/i18n.js"></script>

<script src="/racoon/quiz.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, U = { A: 1, b: 1 }, PI = Math.PI, M = 24;

/* ---------- two spin waves: energies, and the amplitude over the positions of the two flipped spins ---------- */
(() => {
  const svg = $("fig"), svg2 = $("fig2"), s1 = $("s1"), s2 = $("s2");
  function draw() {
    const k1 = +s1.value, k2 = +s2.value, d = Q.deuxMagnons(k1, k2, U);
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 220, pad: { l: 56, b: 40 }, x: { domain: [-PI, PI], label: t("fig.xaxis"), ticks: 6 }, y: { domain: [0, 4], label: t("fig.yaxis"), ticks: 4 } });
    const pts = [];
    for (let i = 0; i <= 200; i++) { const u = -PI + 2 * PI * i / 200; pts.push([G.x(u), G.y(Q.bandeMagnon(u, U))]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke c-label" }, G.g);
    Plot.el("circle", { cx: G.x(k1), cy: G.y(d.E1), r: 5, class: "fill c-warn" }, G.g);
    Plot.el("circle", { cx: G.x(k2), cy: G.y(d.E2), r: 5, class: "fill c-tint" }, G.g);
    /* Re a(m, n) = cos(k1 m + k2 n) on a grid of positions; the diagonal m = n is not a state */
    svg2.innerHTML = "";
    const H = Plot.axes(svg2, { fmt: F, w: 640, h: 300, pad: { l: 176, r: 176, b: 40 }, x: { domain: [0, M], label: t("fig2.xaxis"), ticks: 4 }, y: { domain: [0, M], label: t("fig2.yaxis"), ticks: 4 } });
    const c = (H.x(1) - H.x(0)), gp = Plot.el("g", { class: "c-label" }, H.g), gn = Plot.el("g", { class: "c-warn" }, H.g);
    for (let m = 0; m < M; m++) for (let n = 0; n < M; n++) {
      if (m === n) continue;
      const v = Math.cos(k1 * m + k2 * n);
      Plot.el("rect", { x: H.x(m), y: H.y(n + 1), width: c, height: H.y(n) - H.y(n + 1), class: "fill", "fill-opacity": (0.85 * Math.abs(v)).toFixed(3) }, v >= 0 ? gp : gn);
    }
    $("s1r").textContent = F.num(k1, 3);
    $("s2r").textContent = F.num(k2, 3);
    $("ve").textContent = t("fig.v.e", { e: F.num(d.E, 3) });
    $("fe").textContent = t("fig.f.e", { e1: F.num(d.E1, 3), e2: F.num(d.E2, 3) });
  }
  s1.oninput = draw; s2.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const N = 1000;
  $("sys1").innerHTML = t("sys1.body", { f: F.num(100 * 2 / (N - 1), 2) });
  $("sys2").innerHTML = t("sys2.body");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bloch", 1930, "idea"], ["dyson", 1956, "idea"], ["brockhouse", 1957, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["interactions"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["etats", "b"], ["somme", "a"], ["voisins", "d"], ["exacte", "c"], ["dilue", "a"], ["k", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1502 });
})();
</script>
