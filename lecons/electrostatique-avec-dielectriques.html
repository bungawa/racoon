<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;

/* ---------- un condensateur à diélectrique non uniforme ---------- */
(() => {
  const d = 1, s = 1, n = 400, sc = $("champs"), sr = $("rho"), k1 = $("k1"), k2 = $("k2");
  let prof = "couches";
  const kappa = (a, b) => (prof === "couches" ? x => (x < d / 2 ? a : b) : x => a + (b - a) * x / d);
  function draw() {
    const a = +k1.value, b = +k2.value, p = ES.profilDielectrique(s, kappa(a, b), d, n), e0 = ES.EPS0;
    sc.innerHTML = "";
    const A = Plot.axes(sc, { fmt: F, w: 640, h: 260, x: { domain: [0, 1], label: t("fig.x") }, y: { domain: [0, 1.1], label: t("fig.y") } });
    const ligne = (ys, cls) => Plot.el("path", { d: Plot.path(p.x.map((x, i) => [A.x(x), A.y(ys[i])])), class: "stroke " + cls }, A.g);
    ligne(p.x.map(() => 1), "c-label");
    ligne(p.E.map(E => e0 * E / s), "c-warn");
    ligne(p.P.map(P => P / s), "c-tint");
    sr.innerHTML = "";
    /* graded: ρ d/σ on each slice; layers: the interface is a sheet, drawn as one bar of its charge σ_pol/σ */
    const h = d / n, vol = p.rho.reduce((S, r) => S + r * h, 0);
    const barres = prof === "gradue" ? p.rho.map((r, i) => [p.x[i], h, r * d / s]) : [[0.5 - 0.004, 0.008, vol / s]];
    const vs = barres.map(b => b[2]), lo = Math.min(-0.05, 1.15 * Math.min(...vs)), hi = Math.max(0.05, 1.15 * Math.max(...vs));
    const B = Plot.axes(sr, { fmt: F, w: 640, h: 170, x: { domain: [0, 1], label: t("fig.x") }, y: { domain: [lo, hi], ticks: 3, label: t("fig.yrho") } });
    const g = Plot.el("g", { class: "c-tint" }, B.g);
    barres.forEach(([x, w, v]) => Plot.el("rect", { x: B.x(x).toFixed(1), width: (B.x(w) - B.x(0) + 0.3).toFixed(2),
      y: B.y(Math.max(0, v)).toFixed(1), height: Math.abs(B.y(v) - B.y(0)).toFixed(1), class: "fill", opacity: 0.6 }, g));
    $("k1r").textContent = F.num(a, 3); $("k2r").textContent = F.num(b, 3);
    $("vC").textContent = F.num(p.capacite / p.vide, 3);
    $("fC").textContent = t("f.C");
    $("vV").textContent = F.num(vol / s, 3);
    $("fV").textContent = t(prof === "couches" ? "f.vol.couches" : "f.vol.gradue", { v: F.num(1 / b - 1 / a, 3) });
    $("vF").textContent = F.num(p.gauche / s, 3) + " ; " + F.num(p.droite / s, 3);
    $("fF").textContent = t("f.faces");
  }
  document.querySelectorAll("#profs button").forEach(bt => bt.onclick = () => {
    prof = bt.dataset.p; document.querySelectorAll("#profs button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  k1.oninput = draw; k2.oninput = draw; draw();
})();

/* ---------- le système décrit : Na⁺ et Cl⁻ au contact, dans le vide et dans l'eau ---------- */
(() => {
  const r = 0.282e-9, k = 80.4, T = 293.15, c = ES.chargeDielectrique(ES.E, k, 1);
  const Uv = ES.K * ES.E * ES.E / r, Ue = Uv / k, kT = Constantes.k_B * T, eV = ES.E;
  $("sys1").innerHTML = t("sys1.body", { Uv: F.num(Uv / eV, 2), Ue: F.num(Ue / eV, 2), kT: F.num(kT / eV, 2), T: F.kelvin(T),
    rv: F.num(Uv / kT, 2), re: F.num(Ue / kT, 2), q: F.num(c.apparente / ES.E, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell1861", 1861, "idea"], ["traite", 1873, "idea"], ["heaviside", 1884, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["solvant"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["libres", "c"], ["continuite", "a"], ["saut", "d"], ["gradue", "b"], ["sortir", "c"], ["fondamental", "a"], ["ions", "d"], ["rotationnel", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1004 });
})();
</script>
