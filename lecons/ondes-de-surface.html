        <div class="stats">

  <section class="card">

      <svg class="fig" id="ob" role="img" data-i18n-attr="aria-label:ob.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="ob.legend.vp"></span><span class="c-warn" data-i18n="ob.legend.u"></span><span class="c-label-2" data-i18n="ob.legend.sol"></span></div>

          <div class="stat"><span class="k" data-i18n="ob.k.c"></span><span class="v" id="voc"></span><span class="f" id="foc"></span></div>

    <figure class="chart">
      <svg class="fig" id="kv" role="img" data-i18n-attr="aria-label:kv.aria"></svg>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const SIGMA = Fluides.gammaEau(293.15);
const pow10 = v => "10" + F.sup(Math.round(v));

/* ---------- §51-4 : vitesses de phase et de groupe, de la ride au tsunami ---------- */
(() => {
  const O = self.Ondes, LS = Array.from({ length: 333 }, (_, i) => -3 + 8.3 * i / 332);
  let h = "inf";
  function upd() {
    const S = O.surface({ sigma: SIGMA, h: h === "inf" ? Infinity : +h }), l = +$("ll").value, k = 2 * Math.PI / 10 ** l, svg = $("ds"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 52, b: 44 }, x: { domain: [-3, 5.3], label: t("ds.xaxis"), fmt: pow10 }, y: { domain: [0.1, 1000], scale: "log", label: t("ds.yaxis") } });
    const K = LS.map(q => 2 * Math.PI / 10 ** q);
    Plot.el("path", { d: Plot.path(LS.map((q, i) => [P.x(q), P.y(S.vp(K[i]))])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(LS.map((q, i) => [P.x(q), P.y(S.vg(K[i]))])), class: "stroke c-warn" }, P.g);
    Plot.el("line", { x1: P.x(l), x2: P.x(l), y1: P.y(0.1), y2: P.y(1000), class: "ref" }, P.g);
    $("llv").textContent = F.si(10 ** l, "m");
    $("vdp").textContent = F.si(S.vp(k), "m·s⁻¹"); $("fdp").textContent = t("ds.f.vp", { T: F.si(10 ** l / S.vp(k), "s") });
    $("vdg").textContent = F.si(S.vg(k), "m·s⁻¹"); $("fdg").textContent = t("ds.f.vg", { r: F.num(S.vg(k) / S.vp(k), 3) });
    $("prof").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.h === h)));
  }
  $("prof").querySelectorAll("button").forEach(x => x.onclick = () => { h = x.dataset.h; upd(); });
  $("ll").oninput = upd; upd();
})();

/* ---------- §51-4 : un obstacle dans un courant, les deux ondes immobiles ---------- */
(() => {
  const O = self.Ondes, S = O.surface({ sigma: SIGMA }), LS = Array.from({ length: 241 }, (_, i) => -3.5 + 3.5 * i / 240);
  function upd() {
    const U = +$("uu").value, r = O.stationnaires(U, S), svg = $("ob"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 52, b: 44 }, x: { domain: [-3.5, 0], label: t("ob.xaxis"), fmt: pow10 }, y: { domain: [0, 1.2], label: t("ob.yaxis") } });
    Plot.el("path", { d: Plot.path(LS.map(q => [P.x(q), P.y(Math.min(1.2, S.vp(2 * Math.PI / 10 ** q)))])), class: "curve" }, P.g);
    Plot.el("line", { x1: P.x(-3.5), x2: P.x(0), y1: P.y(U), y2: P.y(U), class: "stroke c-warn" }, P.g);
    for (const s of [r.court, r.long]) if (s && s.lambda > 10 ** -3.5 && s.lambda < 1) Plot.el("circle", { cx: P.x(Math.log10(s.lambda)), cy: P.y(U), r: 6, class: "fill c-label-2" }, P.g);
    $("uuv").textContent = F.si(U, "m·s⁻¹");
    if (r.court) {
      $("voc").textContent = F.si(r.court.lambda, "m"); $("foc").textContent = t("ob.f.c", { r: F.num(r.court.vg / r.court.vp, 3) });
      $("vol").textContent = F.si(r.long.lambda, "m"); $("fol").textContent = t("ob.f.l", { r: F.num(r.long.vg / r.long.vp, 3) });
    } else {
      $("voc").textContent = t("ob.aucune"); $("foc").textContent = t("ob.f.min", { v: F.si(r.vMin, "m·s⁻¹") });
      $("vol").textContent = t("ob.aucune"); $("fol").textContent = t("ob.f.min", { v: F.si(r.vMin, "m·s⁻¹") });
    }
  }
  $("uu").oninput = upd; upd();
})();

/* ---------- §51-4 : les crêtes du sillage de Kelvin ---------- */
(() => {
  const O = self.Ondes, g = Constantes.g0, W = 640, H = 420, PAD = { l: 52, r: 16, t: 12, b: 44 }, X0 = -100, X1 = 8;
  const ys = (X1 - X0) * (H - PAD.t - PAD.b) / (W - PAD.l - PAD.r) / 2, PSI = O.angleSillage(0.5);
  function upd() {
    const v = +$("vb").value, svg = $("kv"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: W, h: H, pad: PAD, x: { domain: [X0, X1], label: t("kv.xaxis") }, y: { domain: [-ys, ys], label: t("kv.yaxis") } });
    const xe = Math.max(X0, -ys / Math.tan(PSI));
    for (const s of [1, -1]) Plot.el("line", { x1: P.x(0), y1: P.y(0), x2: P.x(xe), y2: P.y(s * Math.tan(PSI) * -xe), class: "stroke thin dash c-warn" }, P.g);
    for (let n = 1; n < 60; n++) {
      const K = O.kelvin(v, g, n, 181);
      if (1.09 * K.a > -X0 || 0.385 * K.a > ys) break;
      Plot.el("path", { d: Plot.path(K.points.map(([x, y]) => [P.x(x), P.y(y)])), class: "stroke thin c-tint" }, P.g);
    }
    Plot.el("line", { x1: P.x(-3), x2: P.x(3), y1: P.y(0), y2: P.y(0), class: "stroke bold c-label-2" }, P.g);
    const L0 = 2 * Math.PI * v * v / g;
    $("vbv").textContent = F.si(v, "m·s⁻¹");
    $("vkl").textContent = F.si(L0, "m"); $("fkl").textContent = t("kv.f.l", { T: F.si(2 * Math.PI * v / g, "s") });
    $("vka").textContent = F.num(PSI * 180 / Math.PI, 4) + "°"; $("fka").textContent = t("kv.f.a");
  }
  $("vb").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["airy", 1841, "idea"], ["rides", 1871, "experiment"], ["sillage", 1887, "idea"], ["mach", 2013, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tsunami", "houle"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dimension", "a"], ["houle", "c"], ["groupe", "b"], ["rides", "d"], ["minimum", "a"], ["courant", "c"], ["kelvin", "d"], ["tsunami", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 514 });
})();
</script>
