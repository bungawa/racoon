  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>

    <div class="eq"><math display="block"><msub><mi>E</mi><mi>j</mi></msub><mo>(</mo><mi>k</mi><mo>)</mo><mo>=</mo><msub><mi>E</mi><mrow><mn>0</mn><mi>j</mi></mrow></msub><mo>−</mo><mn>2</mn><msub><mi>A</mi><mi>j</mi></msub><mi data-i18n="eq.cos"></mi><mi>k</mi><mi>b</mi></math><span class="n">(13.13a)</span></div>

    <figure class="chart">
      <svg class="fig" id="fig" viewBox="0 0 640 300" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-label" data-i18n="fig.legend.bas"></span><span class="c-tint" data-i18n="fig.legend.haut"></span><span class="c-warn" data-i18n="fig.legend.gap"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="sd" data-i18n="fig.d"></label><output id="sdr" for="sd"></output></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/quantique-schrodinger.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes, B = 3e-10, PI = Math.PI;

/* ---------- two atomic levels, two bands ---------- */
(() => {
  const svg = $("fig"), sd = $("sd"), s0 = $("s0"), s1 = $("s1");
  function draw() {
    const o = { E0: 0, A0: +s0.value, E1: +sd.value, A1: +s1.value, b: 1 };
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 56, b: 44 }, x: { domain: [-PI, PI], label: t("fig.xaxis"), ticks: 6 }, y: { domain: [-4, 10], label: t("fig.yaxis") } });
    const bas = [], haut = [];
    for (let i = 0; i <= 200; i++) { const u = -PI + 2 * PI * i / 200, d = Q.deuxBandes(u, o); bas.push([G.x(u), G.y(d.bas)]); haut.push([G.x(u), G.y(d.haut)]); }
    Plot.el("path", { d: Plot.path(bas), class: "stroke c-label" }, G.g);
    Plot.el("path", { d: Plot.path(haut), class: "stroke c-tint" }, G.g);
    const g = Q.deuxBandes(0, o).gap, top0 = o.E0 + 2 * o.A0, bot1 = o.E1 - 2 * o.A1;
    if (g > 0) Plot.el("rect", { x: G.x(-PI), y: G.y(bot1), width: G.x(PI) - G.x(-PI), height: G.y(top0) - G.y(bot1), class: "fill c-warn", "fill-opacity": 0.18 }, G.g);
    $("sdr").textContent = F.si(o.E1, "eV"); $("s0r").textContent = F.si(o.A0, "eV"); $("s1r").textContent = F.si(o.A1, "eV");
    $("vg").textContent = F.si(Math.abs(g), "eV");
    $("fg").textContent = t(g > 0 ? "fig.f.gap" : "fig.f.recouvre");
    $("vl").textContent = t("fig.v.largeurs", { a: F.si(4 * o.A0, "eV"), b: F.si(4 * o.A1, "eV") });
    $("fl").textContent = t("fig.f.largeurs");
  }
  sd.oninput = draw; s0.oninput = draw; s1.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  $("sys1").innerHTML = t("sys1.body", { T: F.kelvin(300), kT: F.si(K.k_B * 300 / K.e, "eV") });
  $("sys2").innerHTML = t("sys2.body", { f: F.sci(Math.exp(-1.1 * K.e / (2 * K.k_B * 300)), 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wilson", 1931, "idea"], ["frenkel", 1931, "idea"], ["wannier", 1937, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lumiere", "regle"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["bandes", "a"], ["trou", "c"], ["exciton", "b"], ["gap", "d"], ["mesure", "a"], ["isolant", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1305 });
})();
</script>
</body>
</html>
