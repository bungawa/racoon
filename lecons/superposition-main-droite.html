<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MI = MagInd, MU0 = Constantes.mu0;

/* ---------- trois fils, leur champ, les forces, et le monde du miroir (positions en m, courants en A) ---------- */
(() => {
  const svg = $("fils"), O = { W: 640, H: 400, x0: -0.06, x1: 0.06, y0: -0.0375, y1: 0.0375 }, N = [1, 0, 0];
  const POS = [[-0.028, 0.006], [0.01, 0.018], [0.022, -0.016]];
  let monde = "reel", p = [0.003, -0.012], c;
  const reels = () => [10, +$("i2").value, +$("i3").value].map((I, k) => ({ I, x: POS[k][0], y: POS[k][1] }));
  const norme = v => Math.hypot(v[0], v[1], v[2]);
  const cosinus = (a, b) => (a[0] * b[0] + a[1] * b[1] + a[2] * b[2]) / (norme(a) * norme(b));
  function draw() {
    const base = reels(), fils = monde === "miroir" ? MI.filsMiroir(base, N) : base;
    const B = q => MI.champFils(fils, [q[0], q[1], 0]);
    c = CarteChamp.carte(svg, O);
    CarteChamp.fond(c, q => Math.log10(norme(B(q))), 64, 40, { cls: "c-tint", lo: -5, hi: -3.3 });
    CarteChamp.fleches(c, q => B(q).slice(0, 2), 20, 12, { cls: "c-label", unitaire: true });
    const Fs = MI.forcesFils(fils), fmax = Math.max(...Fs.map(norme));
    fils.forEach((w, k) => {
      if (w.I !== 0) CarteChamp.point(c, [w.x, w.y], 7, "c-label", (k + 1) + " " + (w.I > 0 ? "⊙" : "⊗"), -12);
      else CarteChamp.point(c, [w.x, w.y], 4, "c-label", String(k + 1), -10);
      if (fmax > 0) CarteChamp.fleche(c, [w.x, w.y], Fs[k], 60 * norme(Fs[k]) / fmax, "c-warn");
    });
    const b = B(p);
    CarteChamp.point(c, p, 4, "c-label", "P", -10);
    if (norme(b) > 0) CarteChamp.fleche(c, p, b, 46, "c-label");
    if (monde === "miroir") {
      const q = MI.reflexion([p[0], p[1], 0], N), image = MI.reflexion(MI.champFils(base, q), N);
      if (norme(image) > 0) CarteChamp.fleche(c, p, image, 46, "c-ok");
    }
    $("i2v").textContent = F.si(+$("i2").value, "A"); $("i3v").textContent = F.si(+$("i3").value, "A");
    $("vb").textContent = F.si(norme(b), "T");
    $("fb").textContent = t("fi.f.b", { x: F.si(b[0], "T"), y: F.si(b[1], "T") });
    $("vf").textContent = F.si(norme(Fs[0]), "N·m⁻¹");
    $("ff").textContent = t(monde === "miroir" ? "fi.f.f.miroir" : "fi.f.f");
    if (monde === "miroir") {
      const q = MI.reflexion([p[0], p[1], 0], N), image = MI.reflexion(MI.champFils(base, q), N);
      const Fr = MI.forcesFils(base).map(f => MI.reflexion(f, N));
      $("vcos").textContent = F.fix(cosinus(b, image), 3);
      $("fcos").textContent = t("fi.f.cos.miroir", { f: F.fix(cosinus(Fs[0], Fr[0]), 3) });
    } else { $("vcos").textContent = "—"; $("fcos").textContent = t("fi.f.cos"); }
    $("firead").innerHTML = t("fi.read." + monde);
  }
  document.querySelectorAll("[data-m]").forEach(x => x.onclick = () => { monde = x.dataset.m;
    document.querySelectorAll("[data-m]").forEach(o => o.setAttribute("aria-pressed", String(o === x))); draw(); });
  $("i2").oninput = $("i3").oninput = draw;
  CarteChamp.survol(svg, () => c, q => {
    const fils = monde === "miroir" ? MI.filsMiroir(reels(), N) : reels();
    if (fils.every(w => Math.hypot(q[0] - w.x, q[1] - w.y) > 0.003)) { p = [Math.max(O.x0, Math.min(O.x1, q[0])), Math.max(O.y0, Math.min(O.y1, q[1]))]; draw(); } });
  draw();
})();

/* ---------- ordres de grandeur ---------- */
(() => {
  const f = MI.forcesFils([{ I: 10, x: 0, y: 0 }, { I: 10, x: 0.01, y: 0 }])[0][0];
  const b = MI.champFils([{ I: 10, x: 0, y: 0 }], [0.01, 0, 0])[1];
  const paire = MI.champFils([{ I: 1, x: 0, y: 0 }, { I: -1, x: 0.001, y: 0 }], [0.1, 0, 0])[1], seul = MI.champFils([{ I: 1, x: 0, y: 0 }], [0.1, 0, 0])[1];
  $("ordres").innerHTML = t("ordres.body", { b: F.si(b, "T"), f: F.si(f, "N·m⁻¹"), paire: F.fix(Math.abs(paire / seul) * 100, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["oersted", 1820, "experiment"], ["ampere", 1820, "experiment"], ["bell", 1881, "use"], ["leeyang", 1956, "idea"], ["wu", 1957, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["paires"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["somme", "c"], ["lineaire", "a"], ["axial", "d"], ["miroir", "b"], ["deuxfois", "a"], ["gauche", "c"], ["paire", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 138 });
})();
</script>
