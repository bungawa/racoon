<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- centrifugeuse : la loi de Boltzmann dans le référentiel tournant ---------- */
(() => {
  const S = Statistique, { R, k_B, N_A, g0 } = Constantes, svg = $("cf"), sv = $("vk"), st = $("tk");
  const RC = 0.1, M5 = 0.349, M8 = 0.352;                          // rotor radius (m); 235UF6 and 238UF6 (kg·mol⁻¹), to 0,1 %
  function draw() {
    const v = +sv.value, T = +st.value;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { domain: [0, 100 * RC], label: t("cf.x") }, y: { domain: [1, 1.6], label: t("cf.y"), fmt: y => F.fix(y, 1) } });
    const ex = [], ap = [];
    for (let i = 0; i <= 100; i++) {
      const r = RC * i / 100, x = (M8 - M5) * (v * r / RC) ** 2 / (2 * R * T);
      ex.push([o.x(100 * r), o.y(S.centrifugeuse(r, M8, v, RC, T) / S.centrifugeuse(r, M5, v, RC, T))]);
      ap.push([o.x(100 * r), o.y(1 + x)]);
    }
    Plot.el("path", { d: Plot.path(ap), class: "ref" }, o.g);
    Plot.el("path", { d: Plot.path(ex), class: "stroke c-tint" }, o.g);
    const U = 0.5 * (M8 / N_A) * v * v, a = S.separationCentrifuge(M5, M8, v, T);
    $("vkv").textContent = F.si(v, "m·s⁻¹", { sig: 3 });
    $("tkv").innerHTML = F.kelvin(T);
    $("vu").textContent = F.num(U / (k_B * T), 3);
    $("vn").textContent = F.sci(S.centrifugeuse(RC, M8, v, RC, T), 2);
    $("va").textContent = F.fix(a, 3);
    $("fa").textContent = t("cf.f.a", { a: F.fix(1 + (M8 - M5) * v * v / (2 * R * T), 3) });
    $("vf").textContent = F.sci(v * v / RC / g0, 2);
    $("sys").innerHTML = t("sys.inner", { v: F.si(v, "m·s⁻¹", { sig: 3 }), T: F.kelvin(T), g: F.sci(g0 * RC / (v * v), 2),
      u: F.num(U / (k_B * T), 3), avis: t(U / (k_B * T) > 10 ? "sys.dense" : "sys.dilue") });
  }
  sv.oninput = st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["boltzmann", 1868, "idea"], ["perrin", 1909, "experiment"], ["debye", 1923, "idea"], ["svedberg", 1926, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["auc", "debye"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["exposant", "b"], ["force", "d"], ["rotationnel", "a"], ["paroi", "c"], ["vitesse", "a"], ["coriolis", "b"], ["ions", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 402 });
})();
</script>
