<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9, Vm = x => F.si(x, "V·m⁻¹");
const vec = v => "(" + v.map(x => F.num(x, 3)).join(" ; ") + ")";

/* ---------- le champ, pente du potentiel : différences finies contre (4.14) (positions en m) ---------- */
(() => {
  const svg = $("grad"), O = { W: 640, H: 400, x0: -0.08, x1: 0.08, y0: -0.05, y1: 0.05 }, hsl = $("hsl");
  const Q = [{ q: 2 * NC, x: -0.035, y: -0.005 }, { q: -1 * NC, x: 0.025, y: 0.015 }, { q: 1 * NC, x: 0.015, y: -0.025 }];
  const phi = p => ES.potentiel(Q, p);
  let probe = [-0.01, 0.02], c;
  function draw() {
    const h = Math.pow(10, +hsl.value), p = probe;
    const d = [-(phi([p[0] + h, p[1]]) - phi([p[0] - h, p[1]])) / (2 * h), -(phi([p[0], p[1] + h]) - phi([p[0], p[1] - h])) / (2 * h)];
    const e = ES.champ(Q, p), gap = Math.hypot(d[0] - e[0], d[1] - e[1]) / Math.hypot(...e);
    c = CarteChamp.carte(svg, O);
    CarteChamp.fond(c, phi, 64, 40, { cls: "c-warn", lo: -300, hi: 900 });
    CarteChamp.niveaux(c, phi, [phi(p), -200, -100, 0, 100, 200, 400, 800], { epais: 0 });
    Q.forEach(s => CarteChamp.point(c, [s.x, s.y], 6, s.q > 0 ? "c-warn" : "c-label", s.q > 0 ? "+" : "−", -12));
    const big = Math.max(Math.hypot(...e), Math.hypot(...d)), L = v => 110 * Math.hypot(...v) / big;
    CarteChamp.fleche(c, p, e, L(e), "c-ok");
    CarteChamp.fleche(c, p, d, L(d), "c-tint");
    const g = c.layer("c-tint");
    [[h, 0], [0, h]].forEach(([dx, dy]) => Plot.el("line", { x1: c.sx(p[0] - dx), x2: c.sx(p[0] + dx), y1: c.sy(p[1] - dy), y2: c.sy(p[1] + dy), class: "stroke bold" }, g));
    CarteChamp.point(c, p, 3.5, "c-ok");
    $("hread").textContent = F.si(h, "m");
    $("vphi").textContent = F.si(phi(p), "V");
    $("vdiff").textContent = vec(d);
    $("ve").textContent = vec(e);
    $("fe").textContent = t("gr.f.e", { e: gap < 1e-3 ? F.sci(gap, 1) : F.qty(F.num(100 * gap, 2), "%") });
  }
  CarteChamp.survol(svg, () => c, q => { if (Q.every(s => Math.hypot(q[0] - s.x, q[1] - s.y) > 0.008)) { probe = [Math.max(O.x0, Math.min(O.x1, q[0])), Math.max(O.y0, Math.min(O.y1, q[1]))]; draw(); } });
  hsl.oninput = draw; draw();
})();

/* ---------- une loi en 1/rⁿ : rotationnel toujours nul, flux = Q_int/ε0 seulement pour n = 2 ---------- */
(() => {
  const svg = $("puis"), nsl = $("nsl"), Rsl = $("Rsl"), R0 = 0.02, CEN = [0, 0, 0];
  const Q = [{ q: 2 * NC, x: 0.004, y: 0.002 }, { q: -1 * NC, x: 0.025, y: 0 }, { q: 1 * NC, x: -0.03, y: -0.03 }];
  const RS = Array.from({ length: 41 }, (_, i) => 0.005 + i * 0.05 / 40);
  const qint = R => Q.reduce((s, q) => s + (Math.hypot(q.x, q.y) < R ? q.q : 0), 0);
  function draw() {
    const n = +nsl.value, R = Rsl.value / 1000, F3 = p => ES.champPuissance(Q, p, n, R0), F2 = p => ES.champPuissance(Q, p, n, R0);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [0, 0.056], label: t("pu.x"), fmt: v => F.num(100 * v, 2) }, y: { domain: [-1, 5], label: t("pu.y") } });
    const flux = RS.map(r => [r, ES.fluxSphere(F3, CEN, r, 24) * ES.EPS0 / NC]);
    let ref = ""; RS.forEach((r, i) => { ref += (i ? "L" : "M") + x(r).toFixed(1) + " " + y(qint(r) / NC).toFixed(1); });
    Plot.el("path", { d: ref, class: "ref" }, g);
    Plot.el("path", { d: Plot.path(flux.filter(a => Number.isFinite(a[1])).map(([r, f]) => [x(r), y(Math.max(-1, Math.min(5, f)))])), class: "curve" }, g);
    Plot.el("line", { x1: x(R), x2: x(R), y1: y(-1), y2: y(5), class: "stroke thin c-ok" }, g);
    const circ = AnaVec.circulation(F2, AnaVec.cercle([0, 0], R), 4000);
    let abs = 0; for (let i = 0; i < 720; i++) { const a = 2 * Math.PI * (i + 0.5) / 720, v = F2([R * Math.cos(a), R * Math.sin(a)]); abs += Math.hypot(v[0], v[1]) * 2 * Math.PI * R / 720; }
    const fl = ES.fluxSphere(F3, CEN, R, 60) * ES.EPS0;
    $("nread").textContent = F.num(n, 3);
    $("Rread").textContent = F.si(R, "m");
    $("vcirc").textContent = Number.isFinite(circ) ? F.sci(Math.abs(circ) / abs, 1) : "–";
    $("vflux").textContent = Number.isFinite(fl) ? F.si(fl, "C", { prefix: "n" }) : "–";
    $("vqint").textContent = F.si(qint(R), "C", { prefix: "n" });
  }
  nsl.oninput = Rsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lagrange", 1773, "idea"], ["poisson", 1813, "idea"], ["green", 1828, "idea"], ["gibbs", 1881, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["moulins", "canon"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pente", "c"], ["perpendiculaire", "a"], ["descente", "b"], ["uniforme", "d"], ["rotationnel", "b"], ["exposant", "c"], ["constante", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 44 });
})();
</script>
