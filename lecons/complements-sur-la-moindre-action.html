<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Principes;

/* ---------- partage d'un courant de 1 A entre deux branches ---------- */
(() => {
  const I = 1, LOIS = { ohm: [{ R: 10 }, { R: 20 }], non: [{ R: 10 }, { R: 20, beta: 20 }] };
  let loi = "ohm";
  const seg = $("loi"), isl = $("isl");
  const W = x => F.si(x, "W", { sig: 4 }), A = x => F.si(x, "A", { sig: 3 }), V = x => F.si(x, "V", { sig: 3 });
  function draw() {
    const b = P.branches(I, LOIS[loi]), i1 = +isl.value, Ik = [i1, I - i1];
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.l === loi)));
    $("iread").textContent = A(i1);
    const xs = Array.from({ length: 101 }, (_, k) => k / 100), ps = xs.map(u => b.puissance([u, I - u]));
    const svg = $("pc"); svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 240, x: { domain: [0, 1], label: t("ch.x") }, y: { domain: [0, Math.max(...ps) * 1.05], label: t("ch.y") } });
    Plot.el("path", { d: Plot.path(xs.map((u, k) => [G.x(u), G.y(ps[k])])), class: "curve" }, G.g);
    Plot.el("line", { x1: G.x(b.reel.I[0]), x2: G.x(b.reel.I[0]), y1: G.y(0), y2: G.y(Math.max(...ps) * 1.05), class: "ref" }, G.g);
    Plot.el("circle", { cx: G.x(i1), cy: G.y(b.puissance(Ik)), r: 5, class: "dot" }, G.g);
    $("vp").textContent = W(b.puissance(Ik));
    $("fp").textContent = t("ch.f.p", { u: V(b.tension(0, Ik[0]) - b.tension(1, Ik[1])) });
    $("vre").textContent = A(b.reel.I[0]); $("fre").textContent = t("ch.f.reel", { p: W(b.reel.P), u: V(b.reel.U) });
    $("vmi").textContent = A(b.minimum.I[0]); $("fmi").textContent = t("ch.f.min", { p: W(b.minimum.P) });
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { loi = x.dataset.l; draw(); });
  isl.oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kirchhoff", 1848, "idea"], ["onsager", 1931, "idea"], ["prigogine", 1945, "idea"], ["feynman", 1955, "idea"], ["fhip", 1962, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["polaron"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["partage", "a"], ["tension", "c"], ["non", "b"], ["entropie", "d"], ["prigogine", "b"], ["volume", "a"], ["pourquoi", "d"], ["origine", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 192 });
})();
</script>
