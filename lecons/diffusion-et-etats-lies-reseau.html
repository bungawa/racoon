<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/quantique-schrodinger.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes, B = 3e-10;

/* ---------- |β| continued to every energy ---------- */
(() => {
  const svg = $("fig"), sf = $("sf");
  function draw() {
    let Fe = +sf.value; if (Math.abs(Fe) < 0.05) Fe = Fe < 0 ? -0.05 : 0.05;
    const o = { E0: 0, A: K.e, F: Fe * K.e, b: B }, l = Q.etatLie(o);
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 56, b: 44 }, x: { domain: [-5, 5], label: t("fig.xaxis") }, y: { scale: "log", domain: [1e-2, 1e2], label: t("fig.yaxis") } });
    Plot.el("rect", { x: G.x(-2), y: G.y(1e2), width: G.x(2) - G.x(-2), height: G.y(1e-2) - G.y(1e2), class: "fill c-tint", "fill-opacity": 0.12 }, G.g);
    let seg = []; const segs = [];
    for (let i = 0; i <= 1000; i++) {
      const E = -5 + 10 * i / 1000, m = Q.betaEnergie(E * K.e, o).module, y = Math.min(1e2, Math.max(1e-2, m));
      seg.push([G.x(E), G.y(y)]);
      if (m >= 1e2 && seg.length > 1) { segs.push(seg); seg = [[G.x(E), G.y(y)]]; }
    }
    segs.push(seg);
    segs.forEach(s => Plot.el("path", { d: Plot.path(s), class: "stroke c-label" }, G.g));
    const Ep = l.E / K.e;
    Plot.el("line", { x1: G.x(Ep), x2: G.x(Ep), y1: G.y(1e-2), y2: G.y(1e2), class: "stroke thin dash c-warn" }, G.g);
    $("sfr").textContent = F.si(Fe, "eV");
    $("vp").textContent = F.si(Ep, "eV");
    $("fp").textContent = t(Fe < 0 ? "fig.f.pole.sous" : "fig.f.pole.sur");
    $("vl").textContent = F.si(Ep, "eV");
    $("fl").textContent = t("fig.f.lie");
  }
  sf.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const o = { E0: 0, A: K.e, F: -1 * K.e, b: B }, l = Q.etatLie(o);
  $("sys1").innerHTML = t("sys1.body", { E: F.si(l.E / K.e, "eV"), m: F.sci(Q.betaEnergie(l.E * (1 + 1e-6), o).module, 1) });
  $("sys2").innerHTML = t("sys2.body", { m: F.num(Q.betaEnergie(Math.sqrt(5) * K.e, o).module, 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dirac", 1927, "idea"], ["breit", 1936, "idea"], ["wheeler", 1937, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["resonances"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pole", "a"], ["prolonge", "d"], ["signe", "b"], ["haut", "c"], ["mesure", "a"], ["methode", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1308 });
})();
</script>
