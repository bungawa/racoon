<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, c = Constantes.c, K = 1 / (4 * Math.PI * Constantes.eps0), q = Constantes.e;

/* ---------- le potentiel aplati : équipotentielles, position retardée, deux calculs de φ ---------- */
(() => {
  const R = 0.5, svg = $("carte"), sb = $("sb"), sp = $("sp");
  const S = 100, X = x => 320 + x * S, Y = y => 160 - y * S;                   // 1 m = 100 px, present position at the centre
  function draw() {
    const beta = +sb.value, v = beta * c, U = M.chargeUniforme(q, v), psi = +sp.value * Math.PI / 180;
    const P = [R * Math.cos(psi), R * Math.sin(psi), 0];
    svg.innerHTML = "";
    /* equipotentials of transverse size 0,5, 1 and 1,5 m (21.39c), and the circles Coulomb would give */
    [0.5, 1, 1.5].forEach(ay => {
      const e = U.equipotentielle(U.gamma * K * q / ay);
      Plot.el("ellipse", { cx: X(0), cy: Y(0), rx: e.ax * S, ry: e.ay * S, class: "stroke c-tint" }, svg);
      Plot.el("circle", { cx: X(0), cy: Y(0), r: ay * S, class: "stroke thin dash c-label-2" }, svg);
    });
    /* the retarded position, and the light that left it for P */
    const tr = U.tRet(P, 0), xr = v * tr;
    Plot.el("line", { x1: X(xr), y1: Y(0), x2: X(P[0]), y2: Y(P[1]), class: "stroke dash c-warn" }, svg);
    Plot.el("line", { x1: X(0), y1: Y(0), x2: X(P[0]), y2: Y(P[1]), class: "stroke thin c-label" }, svg);
    Plot.el("circle", { cx: X(xr), cy: Y(0), r: 6, class: "stroke bold c-warn" }, svg);
    Plot.el("circle", { cx: X(0), cy: Y(0), r: 5, class: "fill c-label" }, svg);
    Plot.el("circle", { cx: X(P[0]), cy: Y(P[1]), r: 5, class: "fill c-tint" }, svg);
    Plot.el("text", { x: X(P[0]) + 9, y: Y(P[1]) - 8 }, svg).textContent = "P";
    if (beta > 0) Plot.fleche(svg, [X(0), Y(0) + 22], [X(0) + 30 + 60 * beta, Y(0) + 22], { cls: "c-label" });
    /* φ by (21.39), and by Liénard and Wiechert with the numerical retarded time */
    const phi = U.phi(P, 0), coul = K * q / R;
    const lw = M.lienardWiechert(q, t => [v * t, 0, 0], () => [v, 0, 0], P, 0).phi;
    $("sbr").textContent = F.num(beta, 2);
    $("spr").textContent = F.qty(F.num(+sp.value, 3), "°");
    $("vret").textContent = F.si(tr, "s");
    $("fret").textContent = t("fig.f.ret", { x: F.si(xr, "m"), r: F.si(U.rRet(P, 0), "m") });
    $("vphi").textContent = F.num(phi / coul, 4);
    $("fphi").textContent = t("fig.f.phi", { v: F.num(lw / coul, 4) });
    $("vg").textContent = F.num(U.gamma, 4);
    $("fg").textContent = t("fig.f.gamma", { a: F.num(U.phi([0, R, 0], 0) / coul, 4), b: F.num(U.phi([R, 0, 0], 0) / coul, 4) });
  }
  sb.oninput = sp.oninput = draw; draw();
})();

/* ---------- le système décrit : un proton du LHC ---------- */
(() => {
  const E = 6.8e12 * Constantes.e, g = E / (Constantes.m_p * c * c), rho = 0.02;
  $("sys1").innerHTML = t("sys1.body", { g: F.num(g, 3), d: F.si(rho / g, "m"), rho: F.si(rho, "m") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["heaviside", 1889, "idea"], ["lorentz", 1904, "idea"], ["einstein", 1905, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lhc"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["present", "a"], ["axe", "b"], ["travers", "c"], ["racine", "d"], ["gamma", "a"], ["forme", "b"], ["frein", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 216 });
})();
</script>
