    <p class="validite" data-i18n-html="val.trois"></p>

    <div class="eq"><math display="block"><mi>I</mi><mo>=</mo><mfrac><msub><mi>I</mi><mi data-i18n="eq.nat"></mi></msub><mn>2</mn></mfrac><msup><mi data-i18n="eq.cos"></mi><mrow><mn>2</mn><mi>N</mi></mrow></msup><mfrac><mi>π</mi><mrow><mn>2</mn><mi>N</mi></mrow></mfrac></math></div>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure class="chart">
      <svg class="fig" id="barres" role="img" data-i18n-attr="aria-label:fig.aria.barres"></svg>
      <svg class="fig" id="final" role="img" data-i18n-attr="aria-label:fig.aria.final"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.ideal"></span><span class="c-warn" data-i18n="fig.legend.reel"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="sn" data-i18n="fig.n"></label><output id="snr" for="sn"></output></div>
            <input id="sn" type="range" min="0" max="40" step="1" value="1"></div>
          <div class="ctl"><div class="row"><label for="sk1" data-i18n="fig.k1"></label><output id="sk1r" for="sk1"></output></div>
            <input id="sk1" type="range" min="0.7" max="1" step="0.005" value="0.9"></div>
          <div class="ctl"><div class="row"><label for="sk2" data-i18n="fig.k2"></label><output id="sk2r" for="sk2"></output></div>
            <input id="sk2" type="range" min="-5" max="-1" step="0.1" value="-3"></div>
        </div>
        <div class="stats">

          <div class="stat"><span class="k" data-i18n-html="fig.k.reel"></span><span class="v" id="vre"></span><span class="f" id="fre"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>

<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/opt-polariseurs.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/optique-ondulatoire.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptOnd, DEG = Math.PI / 180, NMAX = 40;
const pct = x => F.qty(F.num(100 * x, 3), "%");

/* ---------- l'escalier de polariseurs : idéaux contre réels ---------- */
(() => {
  const barres = $("barres"), fin = $("final"), sn = $("sn"), sk1 = $("sk1"), sk2 = $("sk2");
  function draw() {
    const m = +sn.value, n = m + 1, k1 = +sk1.value, k2 = k1 * 10 ** +sk2.value;     // m polarisers added between two crossed ones
    const id = O.escalier(n), re = O.escalier(n, Math.PI / 2, { k1, k2 });
    /* intensity after each polariser, natural light = 1 */
    barres.innerHTML = "";
    const P = Plot.axes(barres, { fmt: F, w: 640, h: 220, pad: { l: 56 }, x: { domain: [0.5, n + 1.5], label: t("fig.xaxis.barres"), ticks: Math.min(n + 1, 10), fmt: v => Number.isInteger(v) ? F.num(v, 3) : "" }, y: { domain: [0, 50], label: t("fig.yaxis") } });
    const w = Math.min(14, 220 / (n + 1));
    id.apres.forEach((v, k) => Plot.el("rect", { x: P.x(k + 1) - w, y: P.y(100 * v), width: w, height: P.y(0) - P.y(100 * v), class: "fill c-tint" }, P.g));
    re.apres.forEach((v, k) => Plot.el("rect", { x: P.x(k + 1), y: P.y(100 * v), width: w, height: P.y(0) - P.y(100 * v), class: "fill c-warn" }, P.g));
    /* final intensity against the number of polarisers added */
    fin.innerHTML = "";
    const Q = Plot.axes(fin, { fmt: F, w: 640, h: 220, pad: { l: 56 }, x: { domain: [0, NMAX], label: t("fig.xaxis.final") }, y: { domain: [0, 50], label: t("fig.yaxis") } });
    const ms = Array.from({ length: NMAX + 1 }, (_, i) => i);
    const If = ms.map(i => O.escalier(i + 1).I), Rf = ms.map(i => O.escalier(i + 1, Math.PI / 2, { k1, k2 }).I);
    Plot.el("path", { d: Plot.path(ms.map(i => [Q.x(i), Q.y(100 * If[i])])), class: "stroke c-tint" }, Q.g);
    Plot.el("path", { d: Plot.path(ms.map(i => [Q.x(i), Q.y(100 * Rf[i])])), class: "stroke c-warn" }, Q.g);
    Plot.el("circle", { cx: Q.x(m), cy: Q.y(100 * Rf[m]), r: 5, class: "dot" }, Q.g);
    const best = Rf.indexOf(Math.max(...Rf));
    $("snr").textContent = F.num(m, 3);
    $("sk1r").textContent = pct(k1);
    $("sk2r").textContent = F.sci(10 ** +sk2.value, 2);
    $("vid").textContent = pct(id.I);
    $("fid").textContent = t("fig.f.ideal", { pas: F.qty(F.num(id.pas / DEG, 3), "°") });
    $("vre").textContent = pct(re.I);
    $("fre").textContent = t("fig.f.reel", { r: F.num(re.I / Math.max(id.I, 1e-300), 3) });
    $("vop").textContent = F.num(best, 3);
    $("fop").textContent = t("fig.f.opt", { v: pct(Rf[best]) });
  }
  sn.oninput = sk1.oninput = sk2.oninput = draw; draw();
})();

/* ---------- le système décrit : un polariseur réel, une vitre à l'angle de Brewster ---------- */
(() => {
  const n = 1.5, tb = O.brewster(1, n), tr = Math.asin(Math.sin(tb) / n), rs = O.fresnelFace(1, n, Math.cos(tb), Math.cos(tr), "s");
  const k1 = 0.9, Rf = Array.from({ length: NMAX + 1 }, (_, i) => O.escalier(i + 1, Math.PI / 2, { k1 }).I), best = Rf.indexOf(Math.max(...Rf));
  $("sys1").innerHTML = t("sys1.body", { tb: F.qty(F.num(tb / DEG, 3), "°"), tw: F.qty(F.num(O.brewster(1, 1.333) / DEG, 3), "°"), Rs: pct(rs * rs),
    best: F.num(best, 3), Ib: pct(Rf[best]), Iid: pct(O.escalier(best + 1).I), malus: pct(Math.cos(30 * DEG) ** 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["malus", 1809, "idea"], ["brewster", 1815, "experiment"], ["nicol", 1828, "experiment"], ["herapath", 1852, "experiment"], ["land", 1929, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lunettes", "ecrans"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["malus", "b"], ["naturelle", "d"], ["trois", "a"], ["infini", "c"], ["reel", "b"], ["brewster", "d"], ["lunettes", "a"], ["absorbe", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 334 });
})();
</script>
