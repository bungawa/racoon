<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), CS = ChimSolutions, PC = PolyCoord;
/* formulas are notation, the same in every language: the table only marks them */
const fx = f => t("fx", { f });
const signe = v => v > 0 ? "+" + v : v < 0 ? "−" + -v : "0";
const brute = b => ChimOrga.ecrireFormule(b);
let monomere = "propene";
const listeners = [];

/* ---------- monomer and repeat unit ---------- */
(() => {
  const sel = $("mono");
  sel.value = monomere;
  const upd = () => {
    monomere = sel.value;
    const m = PC.motif(monomere), R = PC.MONOMERES[monomere].texte;
    $("motif").innerHTML = `<div><span class="k">${t("mono.k.alcene")}</span><span>${fx(R === "H" ? "CH₂=CH₂" : "CH₂=CH–" + R)}</span><span class="v">${fx(brute(m.brute))}</span></div>`
      + `<div><span class="k">${t("mono.k.motif")}</span><span>${t("mono.motif", { m: fx(m.texte) })}</span><span class="v">${F.qty(F.num(m.M * 1000, 4), "g·mol⁻¹")}</span></div>`
      + `<div><span class="k">${t("mono.k.stereo")}</span><span>${t(R === "H" ? "mono.sansStereo" : "mono.stereo", { r: fx(R) })}</span></div>`;
    listeners.forEach(f => f());
  };
  sel.onchange = upd; upd();
})();

/* ---------- Cossee–Arlman steps on a zirconocene, typed by chim-solutions ---------- */
(() => {
  const K = CS.CYCLES.coordination, rows = [];
  let cur = K.depart;
  /* species shown as their ligand formula when there is one: CH₂=CHR rather than CH₂CHR */
  const espece = v => fx(CS.LIGANDS[v] ? CS.LIGANDS[v].f : CS.texte(v));
  [["croissance", K.croissance], ["transfert", K.transfert]].forEach(([nom, steps]) => steps.forEach((s, j) => {
    const phase = nom === "transfert" && j >= 2 ? "amorcage" : nom;
    const r = CS.etape(cur, s.vers, s.entre || [], s.sort || []), c = CS.complexe(s.vers);
    rows.push(`<div><span class="k">${t("phase." + phase)}</span><span>${t("cossee.ligne", { de: fx(CS.ecrireComplexe(cur)), vers: fx(CS.ecrireComplexe(s.vers)),
      p: t("proc." + r.type), plus: (s.entre || []).map(espece).join(" + ") || "—", moins: (s.sort || []).map(espece).join(" + ") || "—" })}</span>`
      + `<span class="v">${t("cossee.compte", { ne: c.Ne, dne: signe(r.dNe) })}</span></div>`);
    cur = s.vers;
  }));
  const d = CS.complexe(K.depart);
  $("cossee").innerHTML = `<div><span class="k">${t("phase.depart")}</span><span>${t("cossee.depart", { c: fx(CS.ecrireComplexe(K.depart)), x: d.x, d: d.d, ne: d.Ne })}</span><span class="v">${t("cossee.compte", { ne: d.Ne, dne: "—" })}</span></div>` + rows.join("");
})();

/* ---------- chain lengths: Schulz–Flory ---------- */
(() => {
  const svg = $("distrib"), sl = $("lr");
  function draw() {
    const r = Math.pow(10, +sl.value), p = PC.probabilite(r), s = PC.schulzFlory(p), M0 = PC.motif(monomere).M;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 },
      x: { scale: "log", domain: [1, 1e7], label: t("sf.x") }, y: { domain: [0, 1.1], label: t("sf.y") } });
    /* mass per interval of ln n: n · masse(n), relative to its maximum at n ≈ −2/ln p */
    const g = n => n * s.masse(n), nmax = Math.max(1, -2 / Math.log(p)), top = g(Math.round(nmax)) || g(1);
    const pts = [];
    for (let i = 0; i <= 400; i++) { const n = Math.pow(10, 7 * i / 400); pts.push([o.x(n), o.y(Math.min(g(Math.max(1, n)) / top, 1.1))]); }
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold c-tint" }, o.g);
    [[s.Xn, "sf.n"], [s.Xw, "sf.w"]].forEach(([v, k]) => {
      Plot.el("line", { x1: o.x(v), x2: o.x(v), y1: o.y(0), y2: o.y(1.1), class: "stroke thin dash c-label-2" }, o.g);
      const n = k === "sf.n";
      Plot.el("text", { x: o.x(v) + (n ? -4 : 4), y: o.y(1.04), "text-anchor": n ? "end" : "start", class: "note" }, o.g).textContent = t(k);
    });
    $("lrv").textContent = F.sci(r, 2);
    $("vp").textContent = p > 0.9999 ? "1 − " + F.sci(1 - p, 2) : F.num(p, 4);
    $("vxn").textContent = F.num(s.Xn, 3);
    const mn = s.Xn * M0;
    $("vmn").textContent = F.qty(mn < 1000 ? F.num(mn, 3) : F.sci(mn, 3), "kg·mol⁻¹");
    $("fmn").textContent = t("sf.f.mn", { m: t("mono." + monomere) });
    $("vd").textContent = F.num(s.D, 4);
  }
  sl.oninput = draw; listeners.push(draw); draw();
})();

/* ---------- tacticity ---------- */
(() => {
  const seg = $("tseg"), svg = $("chaine"), rand = Quiz.rng(1954);
  let mode = "iso", conf;
  function draw() {
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
    const R = PC.MONOMERES[monomere].R;
    if (!R) { svg.innerHTML = ""; Plot.el("text", { x: 200, y: 60, "text-anchor": "middle" }, svg).textContent = t("tac.ethene"); $("tacread").textContent = ""; return; }
    const d = ChimOrga.dessin(ChimOrga.mol(PC.dessinChaine(conf, R)), { texte: fx, echelle: 30 });
    svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html;
    $("tacread").innerHTML = t("tac.lu", { m: F.num(100 * PC.meso(conf), 3), n: conf.length - 1 });
  }
  const tirer = () => { conf = PC.chaine(8, mode, rand); draw(); };
  seg.onclick = ev => { const b = ev.target.closest("button"); if (b) { mode = b.dataset.m; tirer(); } };
  $("tirer").onclick = tirer;
  listeners.push(draw); tirer();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ziegler", 1953, "experiment"], ["natta", 1954, "experiment"], ["nobel", 1963, "idea"], ["cossee", 1964, "idea"], ["kaminsky", 1980, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  /* PlasticsEurope, « Plastics – the fast Facts 2024 »: world production in 2023 and the shares of each family */
  const TOTAL = 413.8e9, PART = { pp: 0.190, pehd: 0.122, pebd: 0.140 };
  const USES = ["volumes", "metallocenes", "lineaire"], uses = textOf("uses.items", USES);
  const kg = m => F.qty(F.sci(m, 2), "kg");
  const v = { tot: kg(TOTAL), pp: kg(TOTAL * PART.pp), pehd: kg(TOTAL * PART.pehd), pebd: kg(TOTAL * PART.pebd) };
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${id === "volumes" ? t("uses.volumes", v) : uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["motif", "a"], ["inverse", "c"], ["vacance", "b"], ["d0", "d"], ["xn", "a"], ["dispersite", "c"], ["tacticite", "b"], ["transfert", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1953 });
})();
</script>
