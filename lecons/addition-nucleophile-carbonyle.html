<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Addition nucléophile sur les aldéhydes, les cétones et le dioxyde de carbone</title>
<link rel="stylesheet" href="/racoon/ds.css">
<style>

  .deux svg { width: 100%; height: 160px; }

</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-organique" data-i18n="monde.chim-organique"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-halogenoalcanes" data-i18n="etape.chim-halogenoalcanes"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/organomagnesiens" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <figure class="meca">
      <svg class="fig no-sigle" id="meca" role="img" data-i18n-attr="aria-label:meca.aria"></svg>
      <figcaption data-i18n-html="meca.caption"></figcaption>
    </figure>
    <p data-i18n-html="s1.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure>
      <div class="deux">
        <div><svg class="fig no-sigle" id="reactif" role="img" data-i18n-attr="aria-label:ad.ariaE"></svg></div>
        <div id="produits"></div>
      </div>
      <div class="panel">
        <div class="seg no-sigle" role="group" id="rmg"></div>
        <div class="ctl"><div class="row"><label for="elec" data-i18n="ad.electrophile"></label></div><select id="elec"></select></div>
        <div class="ctl"><div class="row"><label for="n" data-i18n="ad.n"></label><output id="nRead" for="n"></output></div>
          <input id="n" type="range" min="1" max="100" step="1" value="20"></div>
        <p class="readout" id="adVerdict" aria-live="polite"></p>
      </div>
      <figcaption data-i18n-html="ad.caption"></figcaption>
    </figure>
    <div class="eq"><math display="block"><msub><mi>m</mi><mtext data-i18n="eq.max"></mtext></msub><mo>=</mo><mi>n</mi><mspace width="0.1em"/><msub><mi>M</mi><mtext data-i18n="eq.produit"></mtext></msub></math></div>
    <p class="validite" data-i18n-html="s2.validite"></p>
    <div class="box prop"><b data-i18n="s2.prop.titre"></b>
      <p data-i18n-html="s2.prop.corps"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <p data-i18n-html="s3.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <figure class="meca">
      <svg class="fig no-sigle" id="mecaCO2" role="img" data-i18n-attr="aria-label:co2.aria"></svg>
      <figcaption data-i18n-html="co2.caption"></figcaption>
    </figure>
    <p data-i18n-html="s4.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>

  <p class="foot" data-i18n-html="foot"></p>

<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/addition-nucleophile-carbonyle.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/thermo.js"></script>
<script src="/racoon/statistique.js"></script>
<script src="/racoon/chim-organique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, sym = s => t("chim.sym", { s }), $ = id => document.getElementById(id);
const peindre = (svg, d) => { svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };

/* ---------- mécanismes : addition sur l'éthanal, sur le dioxyde de carbone ---------- */
(() => {
  const m = O.mol("C 0 0; O 0 1; C -0.866 -0.5; C 1.6 -1.1; Mg 2.6 -1.1; Br 3.6 -1.1; C 1.6 -2.1 | 0=1 0-2 3-4 4-5 3-6");
  peindre($("meca"), O.schema(m, { texte: sym, echelle: 36, fleches: [{ de: [3, 4], vers: [3, 0] }, { de: [0, 1], vers: 1 }], doublets: [1] }));
  const c = O.mol("C 0 0; O 0 1; O 0 -1; C 1.6 -1.1; Mg 2.6 -1.1; Br 3.6 -1.1 | 0=1 0=2 3-4 4-5");
  peindre($("mecaCO2"), O.schema(c, { texte: sym, echelle: 36, fleches: [{ de: [3, 4], vers: [3, 0] }, { de: [0, 1], vers: 1 }], doublets: [1, 2] }));
})();

/* ---------- construire le produit ---------- */
(() => {
  const RMG = { CH3MgBr: "bromomethane", C2H5MgBr: "bromoethane", C6H5MgBr: "bromobenzene" };
  const RIDS = Object.keys(RMG), rnoms = textOf("ad.magnesiens", RIDS);
  const EL = ["methanal", "ethanal", "propanone", "butanone", "benzaldehyde", "dioxydeCarbone"], enoms = textOf("ad.electrophiles", EL);
  $("rmg").innerHTML = RIDS.map((id, k) => `<button type="button" data-v="${id}" aria-pressed="${k === 1}">${rnoms[id]}</button>`).join("");
  $("elec").innerHTML = EL.map(id => `<option value="${id}">${enoms[id]}</option>`).join("");
  $("elec").value = "ethanal";
  let r = "C2H5MgBr";
  function maj() {
    const rmg = O.organomagnesien(O.molecule(RMG[r]), 0), el = $("elec").value, carb = O.molecule(el), ps = O.additionMagnesien(rmg, carb);
    peindre($("reactif"), O.dessin(carb, { texte: sym, echelle: 40 }));
    $("produits").innerHTML = ps.map(() => `<div><svg class="fig no-sigle" role="img" aria-label="${t("ad.ariaP")}"></svg></div>`).join("");
    [...$("produits").children].forEach((div, k) => peindre(div.querySelector("svg"), O.dessin(ps[k].m, { texte: sym, echelle: 40, surligne: [ps[k].c] })));
    const p = ps[0], f = O.formuleBrute(p.m), M = O.masseMolaire(f), n = +$("n").value * 1e-3;
    const acide = O.groupes(p.m).includes("acide"), cl = O.classeCarbone(p.m, p.c);
    const rel = ps.length === 2 ? O.relationStereo(ps[0].m, ps[1].m) : "identiques";
    let v = t(acide ? "ad.acide" : "ad.alcool." + cl, { f: O.ecrireFormule(f) });
    v += " " + t(rel === "enantiomeres" ? "ad.racemique" : "ad.achiral");
    v += " " + t("ad.masse", { M: F.qty(F.fix(M * 1e3, 1), "g·mol⁻¹"), m: F.qty(F.num(n * M * 1e3, 3), "g") });
    $("adVerdict").textContent = v;
    $("nRead").textContent = F.qty(F.fix(+$("n").value, 0), "mmol");
    document.querySelectorAll("#rmg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === r)));
  }
  $("rmg").onclick = e => { const b = e.target.closest("button"); if (b) { r = b.dataset.v; maj(); } };
  $("elec").onchange = maj; $("n").oninput = maj;
  maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["grignard", 1900, "experiment"], ["nobel", 1912, "idea"], ["cram", 1952, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["acetate"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["site", "b"], ["classe", "d"], ["methanal", "a"], ["co2", "c"], ["racemique", "b"], ["choix", "a"], ["hydrolyse", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
</html>
