<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, { e } = Constantes;

/* ---------- courant d'une chambre d'ionisation : de la loi d'Ohm à la saturation ---------- */
(() => {
  const svg = $("courbe"), sq = $("lq"), sb = $("lb");
  const BASE = { alpha: 1.6e-12, kp: 1.4e-4, kn: 1.9e-4, A: 1 }, V0 = 1e-6, V1 = 1e4;
  function draw() {
    const q = Math.pow(10, +sq.value), b = Math.pow(10, +sb.value), o = Object.assign({ q, b }, BASE);
    const at = V => S.chambre(Object.assign({ V }, o)), Vs = b * b * Math.sqrt(q * BASE.alpha) / (BASE.kp + BASE.kn);
    const sat = at(1).sat, ymin = Math.pow(10, Math.floor(Math.log10(sat * 1e-5))), ymax = Math.pow(10, Math.ceil(Math.log10(sat * 30)));
    svg.innerHTML = "";
    const g = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { scale: "log", domain: [V0, V1], label: t("sim.x") }, y: { scale: "log", domain: [ymin, ymax], label: t("sim.y") } });
    const clip = y => Math.min(ymax, Math.max(ymin, y));
    const pts = f => { const p = []; for (let k = 0; k <= 200; k++) { const V = V0 * Math.pow(V1 / V0, k / 200); p.push([g.x(V), g.y(clip(f(V)))]); } return p; };
    Plot.el("path", { d: Plot.path(pts(V => at(V).ohm)), class: "stroke thin dash c-warn" }, g.g);
    Plot.el("path", { d: Plot.path(pts(() => sat)), class: "stroke thin dash c-label-2" }, g.g);
    Plot.el("path", { d: Plot.path(pts(V => at(V).I)), class: "stroke bold c-tint" }, g.g);
    const c = at(1), sigma = e * c.n0 * (BASE.kp + BASE.kn);
    $("lqv").textContent = t("sim.qv", { q: F.sci(q, 2) });
    $("lbv").textContent = F.si(b, "m", { sig: 2 });
    $("vn0").textContent = t("sim.v.n0", { n: F.sci(c.n0, 2) });
    $("vr").textContent = t("sim.v.r", { r: F.sci(b / (sigma * BASE.A), 2) });   // Ω through the table: the leak check misses Ω
    $("vvs").textContent = F.si(Vs, "V", { sig: 2 });
    $("vtrec").textContent = F.si(1 / (BASE.alpha * c.n0), "s", { sig: 2 });
  }
  sq.oninput = draw; sb.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["coulomb", 1785, "experiment"], ["wulf", 1910, "experiment"], ["hess", 1912, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["fumee", "circuit"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ohm", "a"], ["double", "b"], ["mesure", "c"], ["sature", "d"], ["air", "a"], ["mobilite", "b"], ["fumee", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 434 });
})();
</script>
