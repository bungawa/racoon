<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes, Si = Q.SEMI.Si;

/* ---------- carriers of doped silicon against temperature ---------- */
(() => {
  const svg = $("fig"), sd = $("sd"), sa = $("sa"), st = $("st");
  function draw() {
    const ND = Math.pow(10, +sd.value), NA = Math.pow(10, +sa.value), T = +st.value;
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 64, b: 44 }, x: { domain: [200, 800], label: t("fig.xaxis") }, y: { scale: "log", domain: [1e8, 1e26], label: t("fig.yaxis") } });
    const cn = [], cp = [], ci = [], clip = v => Math.min(1e26, Math.max(1e8, v));
    for (let TT = 200; TT <= 800; TT += 5) {
      const ni = Q.densiteIntrinseque(Si, TT), r = Q.porteursDopes(ND, NA, ni);
      cn.push([G.x(TT), G.y(clip(r.n))]); cp.push([G.x(TT), G.y(clip(r.p))]); ci.push([G.x(TT), G.y(clip(ni))]);
    }
    Plot.el("path", { d: Plot.path(ci), class: "stroke thin dash c-label-2" }, G.g);
    Plot.el("path", { d: Plot.path(cn), class: "stroke c-label" }, G.g);
    Plot.el("path", { d: Plot.path(cp), class: "stroke c-warn" }, G.g);
    Plot.el("line", { x1: G.x(T), x2: G.x(T), y1: G.y(1e8), y2: G.y(1e26), class: "stroke thin dash c-tint" }, G.g);
    const ni = Q.densiteIntrinseque(Si, T), r = Q.porteursDopes(ND, NA, ni), s = Q.conductivite(r.n, r.p, Si.mun, Si.mup);
    $("sdr").textContent = F.qty(F.sci(ND, 2), "m⁻³");
    $("sar").textContent = F.qty(F.sci(NA, 2), "m⁻³");
    $("str").innerHTML = F.kelvin(T);
    $("vn").textContent = t("fig.v.np", { n: F.sci(r.n, 2), p: F.sci(r.p, 2) });
    $("fn").textContent = t(r.n > 10 * r.p ? "fig.f.typen" : r.p > 10 * r.n ? "fig.f.typep" : "fig.f.intr");
    $("vs").textContent = F.si(s, "S·m⁻¹");
    $("fs").textContent = t("fig.f.sigma", { rho: F.si(1 / s, "Ω·m") });
  }
  sd.oninput = draw; sa.oninput = draw; st.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const ni = Q.densiteIntrinseque(Si, 300);
  $("sys1").innerHTML = t("sys1.body", { kT: F.si(K.k_B * 300 / K.e, "eV") });
  const tau = 0.15 * 0.26 * K.m_e / K.e, v = Q.vitesseDerive(K.e, 1e3, tau, 0.26 * K.m_e);
  $("sys2").innerHTML = t("sys2.body", { tau: F.si(tau, "s"), v: F.si(v, "m·s⁻¹") });
  $("sys3").innerHTML = t("sys3.body", { s0: F.si(Q.conductivite(ni, ni, Si.mun, Si.mup), "S·m⁻¹"), s1: F.si(Q.conductivite(1e22, 0, Si.mun, Si.mup), "S·m⁻¹") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bidwell", 1885, "experiment"], ["gudden", 1930, "idea"], ["woodyard", 1950, "use"], ["pfann", 1951, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["dopage"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["donneur", "c"], ["accepteur", "a"], ["minoritaires", "d"], ["temperature", "b"], ["derive", "a"], ["compense", "c"], ["masse", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1402 });
})();
</script>
