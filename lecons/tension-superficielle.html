    <div class="eq"><math display="block"><mi>γ</mi><mo>≈</mo><mfrac><msub><mi>L</mi><mi data-i18n="eq.vap"></mi></msub><mrow><mn>6</mn><msub><mi>N</mi><mi mathvariant="normal">A</mi></msub><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac><mo>,</mo><mspace width="0.8em"/><msup><mi>a</mi><mn>3</mn></msup><mo>=</mo><mfrac><mi>M</mi><mrow><mi>ρ</mi><msub><mi>N</mi><mi mathvariant="normal">A</mi></msub></mrow></mfrac></math></div>

    <div class="eq"><math display="block"><mi>γ</mi><mo>=</mo><mi>B</mi><msup><mi>τ</mi><mi>μ</mi></msup><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>b</mi><mi>τ</mi><mo stretchy="false">)</mo><mo>,</mo><mspace width="0.8em"/><mi>τ</mi><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><mi>T</mi><msub><mi>T</mi><mi mathvariant="normal">c</mi></msub></mfrac></math></div>
    <p class="validite" data-i18n-html="val.1.4"></p>
    <figure class="chart">
      <svg id="gT" role="img" data-i18n-attr="aria-label:gT.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="gT.legend.gamma"></span><span class="c-warn" data-i18n="gT.legend.u"></span></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="tT" data-i18n="gT.T"></label><output id="tTv" for="tT"></output></div>
          <input id="tT" type="range" min="274" max="640" step="1" value="293"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="gT.k.gamma"></span><span class="v" id="vg"></span><span class="f" data-i18n="gT.f.gamma"></span></div>
          <div class="stat"><span class="k" data-i18n="gT.k.pente"></span><span class="v" id="vdg"></span><span class="f" id="fdg"></span></div>
          <div class="stat"><span class="k" data-i18n="gT.k.u"></span><span class="v" id="vu"></span><span class="f" data-i18n="gT.f.u"></span></div>
        </div>
      </div>

    </figure>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="eq"><math display="block"><mo stretchy="false">(</mo><msub><mi>p</mi><mi data-i18n="eq.int"></mi></msub><mo>−</mo><msub><mi>p</mi><mi data-i18n="eq.ext"></mi></msub><mo stretchy="false">)</mo><mspace width="0.15em"/><mi mathvariant="normal">d</mi><mi>V</mi><mo>=</mo><mi>γ</mi><mspace width="0.15em"/><mi mathvariant="normal">d</mi><mi>A</mi><mspace width="1em"/><mo>⇒</mo><mspace width="1em"/><mi>Δ</mi><mi>p</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>γ</mi></mrow><mi>R</mi></mfrac></math></div>
    <p class="validite" data-i18n-html="val.1.5"></p>
    <p data-i18n-html="s4.p2"></p>
    <div class="eq"><math display="block"><mi>Δ</mi><mi>p</mi><mo>=</mo><mfrac><mrow><mn>4</mn><mi>γ</mi></mrow><mi>R</mi></mfrac></math></div>
    <p class="validite" data-i18n-html="val.1.6"></p>
    <figure class="chart">
      <svg class="fig" id="lap" role="img" data-i18n-attr="aria-label:lap.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="lap.legend.dp"></span><span class="c-warn" data-i18n="lap.legend.p0"></span><span class="c-label-2" data-i18n="lap.legend.lc"></span></div>
      <div class="panel">
        <div class="seg" role="group" id="liq" data-i18n-attr="aria-label:lap.choix">
          <button type="button" data-l="eau" aria-pressed="true" data-i18n="liq.eau"></button>
          <button type="button" data-l="ethanol" data-i18n="liq.ethanol"></button>
          <button type="button" data-l="mercure" data-i18n="liq.mercure"></button>
        </div>
        <div class="ctl"><div class="row"><label for="lR" data-i18n="lap.R"></label><output id="lRv" for="lR"></output></div>
          <input id="lR" type="range" min="-7" max="-1" step="0.05" value="-6"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="lap.k.dp"></span><span class="v" id="vdp"></span><span class="f" id="fdp"></span></div>
          <div class="stat"><span class="k" data-i18n="lap.k.bo"></span><span class="v" id="vbo"></span><span class="f" id="fbo"></span></div>
        </div>

  <section class="card">
    <span class="sec" data-i18n="s5.sec"></span>
    <h2 data-i18n="s5.h2"></h2>

    <div class="eq"><math display="block"><msub><mi>ℓ</mi><mi mathvariant="normal">c</mi></msub><mo>=</mo><msqrt><mfrac><mi>γ</mi><mrow><mi>ρ</mi><mi>g</mi></mrow></mfrac></msqrt><mo>,</mo><mspace width="0.8em"/><mi data-i18n="eq.bo"></mi><mo>=</mo><mfrac><mrow><mi>ρ</mi><mi>g</mi><msup><mi>L</mi><mn>2</mn></msup></mrow><mi>γ</mi></mfrac><mo>=</mo><msup><mrow><mo>(</mo><mfrac><mi>L</mi><msub><mi>ℓ</mi><mi mathvariant="normal">c</mi></msub></mfrac><mo>)</mo></mrow><mn>2</mn></msup></math></div>
    <p class="validite" data-i18n-html="val.1.7"></p>
    <div class="list keyed" id="echelles"></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/tension-superficielle.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/fluides.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const keyed = (el, ITEMS, txt) => { el.innerHTML = ITEMS.map(([id, k]) => `<div><span class="k">${k}</span><span>${txt[id]}</span></div>`).join(""); };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), path = Plot.path, L = Fluides.LIQUIDES, P0 = Constantes.atm;
const mN = x => F.si(x * 1e3, "mN·m⁻¹", { sig: 4, prefix: "" });

/* ---------- §3 : γ(T) de l'IAPWS, et l'énergie de surface u = γ − T dγ/dT ---------- */
(() => {
  const svg = $("gT"), S = Fluides.IAPWS_SIGMA, N = 160, Ts = Array.from({ length: N + 1 }, (_, i) => S.Tt + (S.Tc - S.Tt) * i / N);
  function upd() {
    const T = +$("tT").value, g = Fluides.gammaEau(T), dg = Fluides.dGammaEau(T);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 52 }, x: { domain: [250, 660], label: t("gT.xaxis") }, y: { domain: [0, 140], label: t("gT.yaxis") } });
    Plot.el("path", { d: path(Ts.map(x => [o.x(x), o.y(Fluides.gammaEau(x) * 1e3)])), class: "curve" }, o.g);
    Plot.el("path", { d: path(Ts.slice(0, N).map(x => [o.x(x), o.y(Fluides.enthalpieSurface(x) * 1e3)])), class: "ref" }, o.g);
    Plot.el("circle", { cx: o.x(T), cy: o.y(g * 1e3), r: 5, class: "dot" }, o.g);
    $("tTv").innerHTML = F.kelvin(T);
    $("vg").textContent = mN(g);
    $("vdg").textContent = F.si(dg * 1e3, "mN·m⁻¹·K⁻¹", { sig: 3, prefix: "" });
    $("fdg").textContent = t("gT.f.pente", { r: F.qty(F.num(-dg / g * 100, 2), "%") });
    $("vu").textContent = mN(Fluides.enthalpieSurface(T));
  }
  $("tT").oninput = upd; upd();
})();

/* ---------- §4 : surpression de Laplace contre le rayon ---------- */
(() => {
  const svg = $("lap"); let nom = "eau";
  function upd() {
    const l = L[nom], R = Math.pow(10, +$("lR").value), dp = Fluides.laplace(l.gamma, R), lc = Fluides.longueurCapillaire(l.gamma, l.rho), bo = Fluides.bond(R, l.gamma, l.rho);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 52 }, x: { scale: "log", domain: [1e-7, 1e-1], label: t("lap.xaxis") }, y: { scale: "log", domain: [1e-2, 1e8], label: t("lap.yaxis") } });
    Plot.el("path", { d: path([1e-7, 1e-1].map(r => [o.x(r), o.y(Fluides.laplace(l.gamma, r))])), class: "curve" }, o.g);
    Plot.el("line", { x1: o.x(1e-7), x2: o.x(1e-1), y1: o.y(P0), y2: o.y(P0), class: "ref" }, o.g);
    Plot.el("line", { x1: o.x(lc), x2: o.x(lc), y1: o.y(1e-2), y2: o.y(1e8), class: "stroke thin dash c-label-2" }, o.g);
    Plot.el("circle", { cx: o.x(R), cy: o.y(dp), r: 5, class: "dot" }, o.g);
    $("lRv").textContent = F.si(R, "m", { sig: 2 });
    $("vdp").textContent = F.si(dp, "Pa", { sig: 3 });
    $("fdp").textContent = t("lap.f.dp", { r: dp > 0.01 * P0 ? F.num(dp / P0, 2) : F.sci(dp / P0, 2) });
    $("vbo").textContent = bo < 0.01 ? F.sci(bo, 2) : F.num(bo, 2);
    $("fbo").textContent = t(bo < 0.1 ? "lap.f.rond" : bo < 10 ? "lap.f.entre" : "lap.f.plat", { lc: F.si(lc, "m", { sig: 3 }) });
  }
  document.querySelectorAll("#liq button").forEach(b => b.onclick = () => {
    nom = b.dataset.l; document.querySelectorAll("#liq button").forEach(x => x.setAttribute("aria-pressed", x === b)); upd(); });
  $("lR").oninput = upd; upd();
})();

/* ---------- §5 : les échelles, chiffrées ---------- */
(() => {
  const lc = n => F.si(Fluides.longueurCapillaire(L[n].gamma, L[n].rho), "m", { sig: 3 });
  const s = Fluides.gammaEstime({ Lvap: 44.2e3, M: 0.018015, rho: L.eau.rho });
  const ITEMS = [["eau", lc("eau")], ["ethanol", lc("ethanol")], ["mercure", lc("mercure")], ["estimation", F.si(s.gamma, "J·m⁻²", { sig: 2, prefix: "" })]];
  keyed($("echelles"), ITEMS, textOf("echelles.items", ITEMS.map(i => i[0])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["young1805", 1805, "idea"], ["pockels1891", 1891, "experiment"], ["avery1959", 1959, "experiment"], ["iapws1976", 1976, "use"], ["fujiwara1980", 1980, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["surfactant", "reference"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["unite", "b"], ["bulle", "d"], ["goutte", "a"], ["estimation", "c"], ["temperature", "b"], ["bond", "a"], ["deuxbulles", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 3101 });
})();
</script>
</body>
