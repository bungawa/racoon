    <div class="tags">

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>l</mi><mo>=</mo><mi>τ</mi><mi>v</mi></math><span class="n">(43.9)</span></div>
    <p class="validite" data-i18n-html="val.43.9"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mi>d</mi><mi>𝒫</mi><mo>=</mo><msub><mi>σ</mi><mi>c</mi></msub><msub><mi>n</mi><mn>0</mn></msub><mspace width="0.17em"/><mi>d</mi><mi>x</mi></math><span class="n">(43.10)</span></div>
    <p class="validite" data-i18n-html="val.43.10"></p>
    <p data-i18n-html="s1.p3"></p>
    <div class="eq"><math display="block"><mfrac><mn>1</mn><mi>l</mi></mfrac><mo>=</mo><msub><mi>σ</mi><mi>c</mi></msub><msub><mi>n</mi><mn>0</mn></msub></math><span class="n">(43.11)</span></div>
    <p class="validite" data-i18n-html="val.43.11"></p>
    <p data-i18n-html="s1.p4"></p>
    <div class="eq"><math display="block"><mi>l</mi><mo>=</mo><mfrac><mn>1</mn><mrow><msqrt><mn>2</mn></msqrt><mspace width="0.17em"/><msub><mi>n</mi><mn>0</mn></msub><msub><mi>σ</mi><mi>c</mi></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>k</mi><mi>B</mi></msub><mi>T</mi></mrow><mrow><msqrt><mn>2</mn></msqrt><mspace width="0.17em"/><msub><mi>σ</mi><mi>c</mi></msub><mi>P</mi></mrow></mfrac></math></div>

  <section class="card">
    <span class="sec" data-i18n="sim.sec"></span>
    <h2 data-i18n="sim.h2"></h2>
    <p data-i18n-html="sim.p"></p>
    <figure class="chart">
      <svg class="fig" id="courbe" role="img" data-i18n-attr="aria-label:sim.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="sim.legend.l"></span><span class="c-label-2" data-i18n="sim.legend.esp"></span><span class="c-label" data-i18n="sim.legend.d"></span><span class="c-warn" data-i18n="sim.legend.L"></span></div>
      <div class="panel">
        <label class="field"><span data-i18n="sim.gaz"></span>
          <select id="gaz">
            <option value="H2" data-i18n="gaz.H2"></option>
            <option value="He" data-i18n="gaz.He"></option>
            <option value="N2" data-i18n="gaz.N2" selected></option>
            <option value="O2" data-i18n="gaz.O2"></option>
            <option value="Ar" data-i18n="gaz.Ar"></option>
            <option value="CO2" data-i18n="gaz.CO2"></option>
          </select></label>
        <div class="controls">
          <div class="ctl"><div class="row"><label for="lp" data-i18n="sim.p.label"></label><output id="lpv" for="lp"></output></div>
            <input id="lp" type="range" min="-6" max="7" step="0.05" value="5.0057"></div>
          <div class="ctl"><div class="row"><label for="t" data-i18n="sim.t"></label><output id="tv" for="t"></output></div>
            <input id="t" type="range" min="200" max="600" step="1" value="293.15"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="sim.k.n"></span><span class="v" id="vn"></span><span class="f" data-i18n="sim.f.n"></span></div>
          <div class="stat"><span class="k" data-i18n-html="sim.k.l"></span><span class="v" id="vl"></span><span class="f" id="fl"></span></div>
          <div class="stat"><span class="k" data-i18n-html="sim.k.tau"></span><span class="v" id="vtau"></span><span class="f" id="ftau"></span></div>
          <div class="stat"><span class="k" data-i18n-html="sim.k.esp"></span><span class="v" id="vesp"></span><span class="f" id="fesp"></span></div>
          <div class="stat"><span class="k" data-i18n-html="sim.k.kn"></span><span class="v" id="vkn"></span><span class="f" id="fkn"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="sim.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>

    <p data-i18n-html="s3.p2"></p>

  <section class="card">

    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/le-libre-parcours-moyen.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/thermo.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/statistique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique;

/* ---------- le libre parcours contre la pression ---------- */
(() => {
  const svg = $("courbe"), sg = $("gaz"), slp = $("lp"), st = $("t"), L = 0.1, P0 = 1e-6, P1 = 1e7;   // L: a 10 cm vessel
  function draw() {
    const g = sg.value, P = Math.pow(10, +slp.value), T = +st.value, r = S.parcours(g, P, T);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 60 },
      x: { scale: "log", domain: [P0, P1], label: t("sim.x") }, y: { scale: "log", domain: [1e-10, 1e4], label: t("sim.y") } });
    const ligne = (f, cls) => { const p = []; for (let e = -6; e <= 7.001; e += 0.25) { const v = f(Math.pow(10, e)); if (v >= 1e-10 && v <= 1e4) p.push([o.x(Math.pow(10, e)), o.y(v)]); }
      Plot.el("path", { d: Plot.path(p), class: cls }, o.g); };
    ligne(Pi => S.parcours(g, Pi, T).l, "stroke bold c-tint");
    ligne(Pi => S.parcours(g, Pi, T).espacement, "stroke dash c-label-2");
    ligne(() => r.d, "stroke thin c-label");
    ligne(() => L, "stroke thin dash c-warn");
    if (r.l >= 1e-10 && r.l <= 1e4) Plot.el("circle", { cx: o.x(P), cy: o.y(r.l), r: 5, class: "fill c-warn" }, o.g);
    $("lpv").textContent = F.si(P, "Pa");
    $("tv").innerHTML = F.kelvin(T);
    $("vn").textContent = F.qty(F.sci(r.n, 2), "m⁻³");
    $("vl").textContent = F.si(r.l, "m");
    $("fl").textContent = t("sim.f.l", { c: F.si(r.lCible, "m") });
    $("vtau").textContent = F.si(r.tau, "s");
    $("ftau").textContent = t("sim.f.tau", { v: F.qty(F.num(r.vmoy, 3), "m·s⁻¹") });
    $("vesp").textContent = F.num(r.l / r.espacement, 3);
    $("fesp").textContent = t("sim.f.esp", { e: F.si(r.espacement, "m"), nd: F.sci(r.nd3, 2) });
    $("vkn").textContent = r.l / L >= 0.01 && r.l / L < 1000 ? F.num(r.l / L, 3) : F.sci(r.l / L, 2);
    $("fkn").textContent = t(r.l < 0.01 * L ? "sim.f.kn.continu" : r.l > L ? "sim.f.kn.parois" : "sim.f.kn.entre");
  }
  sg.onchange = draw; slp.oninput = draw; st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["clausius", 1858, "idea"], ["maxwell", 1860, "idea"], ["loschmidt", 1865, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["vide"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pression", "a"], ["racine", "b"], ["cylindre", "c"], ["temps", "d"], ["taille", "a"], ["dilue", "b"], ["cache", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 432 });
})();
</script>
</body>
</html>
