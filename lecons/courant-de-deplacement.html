      <svg class="fig" id="schema" viewBox="0 0 640 230" role="img" data-i18n-attr="aria-label:fig.aria.schema"></svg>
      <svg class="fig" id="trace" role="img" data-i18n-attr="aria-label:fig.aria.trace"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.fil"></span><span class="c-warn" data-i18n="fig.legend.entre"></span><span class="c-ok" data-i18n="fig.legend.surface"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" role="group" id="boucle">
            <button type="button" data-m="fil" data-i18n="fig.fil"></button>
            <button type="button" data-m="entre" data-i18n="fig.entre"></button>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>

<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/courant-de-deplacement.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>

<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/ondes-milieux.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux;

/* ---------- la sphère qui fuit : chiffres au rayon r, à l'instant t ---------- */
(() => {
  const Q0 = 1e-9, tau = 10, u = 0.01, r = 0.05, tt = 10;                       // 1 nC leaking in 10 s, charges at 1 cm·s⁻¹; seen at 5 cm, 10 s
  const S = OM.sphereQuiFuit({ Q0, tau, u }), j = S.j(r, tt), d = S.deplacement(r, tt);
  $("sys1").innerHTML = t("sys1.body", { Q0: F.si(Q0, "C", { prefix: "n" }), tau: F.si(tau, "s"), u: F.qty(F.num(100 * u, 3), "cm·s⁻¹"), r: F.qty(F.num(100 * r, 3), "cm"),
    t: F.si(tt, "s"), Q: F.si(S.Q(r, tt), "C", { prefix: "n" }), j: F.si(j, "A·m⁻²", { prefix: "n" }), d: F.si(d, "A·m⁻²", { prefix: "n" }),
    s: F.sci(Math.abs(j + d) / j, 1), b2: F.sci((u / Constantes.c) ** 2, 1) });
})();

/* ---------- le condensateur qui se charge : même circulation de B par deux surfaces ---------- */
const CO = { I: 1, R: 0.05 };                                                   // 1 A, plates of radius 5 cm
(() => {
  const schema = $("schema"), trace = $("trace"), sr = $("sr"), segB = $("boucle"), segS = $("surface");
  let boucle = "fil", surface = "disque";
  const X = x => 320 + 1200 * x, YH = 104, YB = 128, YF = 50, YE = 116;          // 1 cm = 12 px; plates at YH and YB
  function draw() {
    const r = +sr.value / 100, c = OM.condensateur({ I: CO.I, R: CO.R, r, boucle, surface });
    schema.innerHTML = "";
    Plot.el("line", { x1: 320, x2: 320, y1: 8, y2: YH, class: "stroke bold c-label" }, schema);
    Plot.el("line", { x1: 320, x2: 320, y1: YB, y2: 222, class: "stroke bold c-label" }, schema);
    Plot.el("line", { x1: X(-CO.R), x2: X(CO.R), y1: YH, y2: YH, class: "stroke bold c-label" }, schema);
    Plot.el("line", { x1: X(-CO.R), x2: X(CO.R), y1: YB, y2: YB, class: "stroke bold c-label" }, schema);
    Plot.fleche(schema, [334, 64], [334, 96], { cls: "c-label" });
    for (let k = 0; k < 5; k++) Plot.fleche(schema, [X(-0.04 + 0.02 * k), YH + 4], [X(-0.04 + 0.02 * k), YB - 4], { cls: "c-label-2" });
    const y0 = boucle === "fil" ? YF : YE, y1 = boucle === "fil" ? YE : YF - 26;  // the bag closes in the gap, or above the plate
    if (surface === "disque") Plot.el("ellipse", { cx: 320, cy: y0, rx: 1200 * r, ry: 7, class: "area" }, schema);
    else {
      Plot.el("path", { d: `M${X(-r)},${y0} L${X(-r)},${y1} A${1200 * r},7 0 0,0 ${X(r)},${y1} L${X(r)},${y0} Z`, class: "area" }, schema);
      Plot.el("ellipse", { cx: 320, cy: y1, rx: 1200 * r, ry: 7, class: "stroke dash c-ok" }, schema);
      Plot.el("line", { x1: X(-r), x2: X(-r), y1: y0, y2: y1, class: "stroke dash c-ok" }, schema);
      Plot.el("line", { x1: X(r), x2: X(r), y1: y0, y2: y1, class: "stroke dash c-ok" }, schema);
      if (r < CO.R) for (const s of [-1, 1]) Plot.el("circle", { cx: X(s * r), cy: YH, r: 4, class: "fill c-ko" }, schema);
    }
    Plot.el("ellipse", { cx: 320, cy: y0, rx: 1200 * r, ry: 7, class: "stroke bold " + (boucle === "fil" ? "c-tint" : "c-warn") }, schema);
    /* B on the loop against its radius, for the two positions */
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 220, pad: { l: 64, b: 44 }, x: { domain: [0, 12], label: t("fig.xaxis") }, y: { domain: [0, 45], label: t("fig.yaxis") } });
    const rs = Array.from({ length: 116 }, (_, i) => 0.5 + i * 0.1);
    const B = (b, x) => 1e6 * OM.condensateur({ I: CO.I, R: CO.R, r: x / 100, boucle: b }).B;
    Plot.el("path", { d: Plot.path(rs.map(x => [P.x(x), P.y(Math.min(45, B("fil", x)))])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(rs.map(x => [P.x(x), P.y(B("entre", x))])), class: "stroke c-warn" }, P.g);
    Plot.el("circle", { cx: P.x(100 * r), cy: P.y(Math.min(45, 1e6 * c.B)), r: 5, class: "dot" }, P.g);
    $("srr").textContent = F.qty(F.num(100 * r, 3), "cm");
    $("vc").textContent = F.si(c.conduction, "A", { sig: 3 });
    const fil = boucle === "entre" ? CO.I : 0, arm = boucle === "fil" ? c.plaque : -c.plaque;   // the bag: wire crossed from the gap only
    $("fc").textContent = surface === "sac" && r < CO.R ? t("fig.f.plaque", { f: F.si(fil, "A", { sig: 3 }), a: F.si(arm, "A", { sig: 3 }) }) : t("fig.f.cond");
    $("vd").textContent = F.si(c.deplacement, "A", { sig: 3 });
    $("fd").textContent = t("fig.f.dep", { v: F.si(c.dEdt, "V·m⁻¹·s⁻¹", { prefix: "T" }) });
    $("vb").textContent = F.si(c.B, "T", { prefix: "µ" });
    $("fb").textContent = t("fig.f.b", { v: F.si(c.ampereSeul, "T", { prefix: "µ" }) });
    segB.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === boucle)));
    segS.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === surface)));
  }
  segB.querySelectorAll("button").forEach(x => x.onclick = () => { boucle = x.dataset.m; draw(); });
  segS.querySelectorAll("button").forEach(x => x.onclick = () => { surface = x.dataset.m; draw(); });
  sr.oninput = draw; draw();
})();

/* ---------- le système décrit : le condensateur, ses tailles, sa fréquence ---------- */
(() => {
  const c = Constantes.c, d = 0.002, f = 1e6, sigma = 1 / 1.68e-8;             // gap 2 mm, 1 MHz, copper wire (ρ = 1,68 × 10⁻⁸ Ω·m)
  const B = OM.condensateur({ I: CO.I, R: CO.R, r: CO.R, boucle: "entre" }).B;
  $("sys2").innerHTML = t("sys2.body", { R: F.qty(F.num(100 * CO.R, 3), "cm"), I: F.si(CO.I, "A"), d: F.si(d, "m", { prefix: "m" }), dR: F.num(d / CO.R, 2),
    f: F.si(f, "Hz", { prefix: "M" }), kR2: F.sci((2 * Math.PI * f * CO.R / c) ** 2, 1), fil: F.sci(Constantes.eps0 * 2 * Math.PI * f / sigma, 1),
    B: F.si(B, "T", { prefix: "µ" }), jD: F.si(CO.I / (Math.PI * CO.R ** 2), "A·m⁻²") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1862, "idea"], ["hertz", 1887, "experiment"], ["bartlett", 1985, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tactile"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["sphere", "b"], ["sac", "d"], ["moitie", "a"], ["calcul", "c"], ["sansterme", "b"], ["densite", "d"], ["nouveau", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 182 });
})();
</script>
