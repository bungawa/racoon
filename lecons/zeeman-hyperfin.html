<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, A = Q.aHyperfinH, MUP = -(Q.muElectron - Q.muProton);

/* ---------- the four levels against the field, in units of A (Breit-Rabi diagram) ---------- */
(() => {
  const svg = $("courbe"), sB = $("sB"), X1 = 0.15, NIV = [["I", "c-ok"], ["II", "c-warn"], ["III", "c-tint"], ["IV", "c-label"]];
  function draw() {
    const B = +sB.value, n = Q.niveauxZeemanH(B);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 }, x: { domain: [0, X1], label: t("fig.x") }, y: { domain: [-8, 8], label: t("fig.y") } });
    for (const [k, cls] of NIV) {
      const p = [];
      for (let i = 0; i <= 200; i++) { const b = X1 * i / 200; p.push([o.x(b), o.y(Math.max(-8, Math.min(8, Q.niveauxZeemanH(b)[k] / A)))]); }
      Plot.el("path", { d: Plot.path(p), class: "stroke bold " + cls }, o.g);
      Plot.el("circle", { cx: o.x(B), cy: o.y(Math.max(-8, Math.min(8, n[k] / A))), r: 4, class: "fill " + cls }, o.g);
    }
    const b0 = 2 * A / MUP;
    Plot.el("line", { x1: o.x(b0), x2: o.x(b0), y1: o.y(-8), y2: o.y(8), class: "stroke thin dash c-label-2" }, o.g);
    $("sBr").textContent = F.si(B, "T");
    $("ve").textContent = ["I", "II", "III", "IV"].map(k => F.fix(n[k] / A, 2)).join(" ; "); $("fe").textContent = t("fig.f.e");
    $("v1").textContent = F.si((n.III - n.IV) / K.h, "Hz"); $("f1").textContent = t("fig.f.f1");
    $("v2").textContent = F.si((n.I - n.IV) / K.h, "Hz"); $("f2").textContent = t("fig.f.f2");
  }
  sB.oninput = draw; draw();
})();

/* ---------- the system described: when the field beats the hyperfine coupling ---------- */
(() => {
  $("sys1").innerHTML = t("sys1.body", { me: F.si(-Q.muElectron, "J·T⁻¹"), mp: F.si(Q.muProton, "J·T⁻¹"), r: F.num(-Q.muElectron / Q.muProton, 3), b0: F.si(2 * A / MUP, "T"), ba: F.sci(5e-5 / (2 * A / MUP), 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["zeeman", 1896, "experiment"], ["breit", 1931, "idea"], ["rabi", 1937, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["maser", "magneto"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["lineaire", "b"], ["quadra", "c"], ["fort", "a"], ["b0", "d"], ["electron", "b"], ["horloge", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1204 });
})();
</script>
