<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §49-3 : membrane de b = 20 cm de large, c = 107 m·s⁻¹ ; a = b … 3b ---------- */
(() => {
  const O = self.Ondes, B = 0.2, C = 107, CELL = 6, SABLE = 0.07, NS = 12;
  function upd() {
    const r = +$("rap").value, a = r * B, M = O.membrane(a, B, C), n = +$("nx").value, m = +$("my").value, th = +$("mix").value * Math.PI / 180;
    /* le partenaire du mélange : (m, n) — le même mode échangé ; il n'a la même fréquence que si a/b le permet */
    const P = M.forme(n, m), Q = M.forme(m, n), w1 = M.omega(n, m), w2 = M.omega(m, n), deg = Math.abs(w1 - w2) < 1e-9 * w1;
    const phi = (x, y) => Math.cos(th) * P(x, y) + Math.sin(th) * Q(x, y);
    const svg = $("mb"); svg.innerHTML = "";
    const W = 600, H = W * B / a, nx = Math.round(W / CELL), ny = Math.round(H / CELL), ox = 20, oy = 10;
    svg.setAttribute("viewBox", "0 0 640 " + (H + 20));
    for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
      const x = (i + 0.5) / nx * a, y = (j + 0.5) / ny * B, v = phi(x, y), px = ox + i * W / nx, py = oy + H - (j + 1) * H / ny;
      if (Math.abs(v) < SABLE) Plot.el("circle", { cx: px + W / nx / 2, cy: py + H / ny / 2, r: 1.6, class: "fill c-label" }, svg);
      else Plot.el("rect", { x: px, y: py, width: W / nx + 0.3, height: H / ny + 0.3, class: "fill " + (v > 0 ? "c-tint" : "c-warn"), opacity: (0.15 + 0.75 * Math.abs(v)).toFixed(2) }, svg);
    }
    Plot.el("rect", { x: ox, y: oy, width: W, height: H, class: "stroke thin c-label" }, svg);
    /* le spectre : les douze premiers modes, en multiples du plus bas ; les traits pointillés marquent les entiers */
    const L = M.liste(NS), w11 = L[0].omega, sp = $("sp"); sp.innerHTML = "";
    const A = Plot.axes(sp, { fmt: F, w: 640, h: 150, pad: { l: 20, b: 44, t: 40 }, x: { domain: [0.8, 5.2], label: t("sp.xaxis") }, y: { domain: [0, 1.2], ticks: 1, fmt: () => "" } });
    for (let k = 1; k <= 5; k++) Plot.el("line", { x1: A.x(k), x2: A.x(k), y1: A.y(0), y2: A.y(1.2), class: "ref" }, A.g);
    L.forEach((e, i) => { const v = e.omega / w11; if (v > 5.2) return;
      const on = e.n === n && e.m === m;
      Plot.el("line", { x1: A.x(v), x2: A.x(v), y1: A.y(0), y2: A.y(on ? 1.1 : 0.8), class: "stroke " + (on ? "bold c-tint" : "c-label-2") }, A.g);
      if (i < 8 || on) Plot.el("text", { x: A.x(v), y: A.y(on ? 1.1 : 0.8) - 4 - 12 * (i % 3), "text-anchor": "middle" }, A.g).textContent = e.n + "," + e.m; });
    const rang = L.findIndex(e => e.n === n && e.m === m);
    $("rapv").textContent = F.num(r, 3); $("nxv").textContent = String(n); $("myv").textContent = String(m); $("mixv").textContent = F.num(th * 180 / Math.PI, 2) + "°";
    $("vf").textContent = F.si(w1 / (2 * Math.PI), "Hz", { prefix: "" }); $("ff").textContent = t("mb.f.rapport", { r: F.num(w1 / w11, 3) });
    $("vrg").textContent = rang >= 0 ? String(rang + 1) : "> " + NS; $("frg").textContent = t("mb.f.lignes", { x: n - 1, y: m - 1 });
    $("vmx").textContent = th === 0 || n === m ? t("mb.f.pur") : deg ? t("mb.f.mode") : t("mb.f.pasmode");
    $("fmx").textContent = n === m ? t("mb.f.meme") : t("mb.f.deux", { a: F.si(w1 / (2 * Math.PI), "Hz", { prefix: "" }), b: F.si(w2 / (2 * Math.PI), "Hz", { prefix: "" }) });
  }
  ["rap", "nx", "my", "mix"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["chladni", 1787, "experiment"], ["germain", 1816, "idea"], ["kac", 1966, "idea"], ["gww", 1992, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["salle", "helium"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["harmonique", "c"], ["lignes", "a"], ["table", "d"], ["degenere", "b"], ["carre", "c"], ["salle", "a"], ["helium", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 493 });
})();
</script>
