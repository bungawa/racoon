    <h1 data-i18n="h1"></h1>

    <div class="tags">
      <a class="chip t-ondes" href="/racoon/atlas?piste=ondes" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/la-pression-d-un-gaz" data-i18n="tag.prereq"></a>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>

    <div class="list keyed" id="variables"></div>
    <div class="eq"><math display="block"><mi>P</mi><mo>=</mo><msub><mi>P</mi><mn>0</mn></msub><mo>+</mo><msub><mi>P</mi><mi>e</mi></msub><mo>,</mo><mspace width="1em"/><mi>ρ</mi><mo>=</mo><msub><mi>ρ</mi><mn>0</mn></msub><mo>+</mo><msub><mi>ρ</mi><mi>e</mi></msub></math><span class="n">(47.2)</span></div>
    <p class="validite" data-i18n-html="val.47.2"></p>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>L</mi><mo>=</mo><mn>20</mn><msub><mi data-i18n="eq.log"></mi><mn>10</mn></msub><mfrac><msub><mi>p</mi><mi data-i18n="eq.eff"></mi></msub><msub><mi>p</mi><mi data-i18n="eq.ref"></mi></msub></mfrac><mspace width="0.4em"/><mtext data-i18n="eq.db"></mtext><mo>,</mo><mspace width="1em"/><msub><mi>p</mi><mi data-i18n="eq.ref"></mi></msub><mo>=</mo><mn>2</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>5</mn></mrow></msup><mspace width="0.2em"/><mtext data-i18n="eq.pa"></mtext></math><span class="n">(47.1)</span></div>
    <p class="validite" data-i18n-html="val.47.1"></p>
    <p data-i18n-html="s2.p2"></p>
    <figure class="chart">
      <svg class="fig" id="echelle" role="img" data-i18n-attr="aria-label:ec.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="ec.legend.chi"></span><span class="c-warn" data-i18n="ec.legend.l"></span><span class="c-label-2" data-i18n="ec.legend.lam"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="niv" data-i18n="ec.L"></label><output id="nivv" for="niv"></output></div>
            <input id="niv" type="range" min="0" max="140" step="1" value="60"></div>
          <div class="ctl"><div class="row"><label for="fr" data-i18n="ec.f"></label><output id="frv" for="fr"></output></div>
            <input id="fr" type="range" min="0" max="1" step="0.0001" value="0.5663"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="ec.k.p"></span><span class="v" id="vp"></span><span class="f" id="fp"></span></div>
          <div class="stat"><span class="k" data-i18n="ec.k.chi"></span><span class="v" id="vchi"></span><span class="f" id="fchi"></span></div>
          <div class="stat"><span class="k" data-i18n="ec.k.u"></span><span class="v" id="vu"></span><span class="f" id="fu"></span></div>
          <div class="stat"><span class="k" data-i18n="ec.k.eps"></span><span class="v" id="veps"></span><span class="f" id="feps"></span></div>
          <div class="stat"><span class="k" data-i18n="ec.k.dT"></span><span class="v" id="vdT"></span><span class="f" id="fdT"></span></div>
          <div class="stat"><span class="k" data-i18n="ec.k.lam"></span><span class="v" id="vlam"></span><span class="f" id="flam"></span></div>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/propagation-du-son.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>

<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/thermo.js"></script>
<script src="/racoon/ondes.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["chi", "rho", "P"]; keyed($("variables"), t("variables.tag"), IDS, textOf("variables.items", IDS)); })();
(() => { const IDS = ["continu", "amplitude", "chaleur", "plane"]; keyed($("nombres"), t("nombres.tag"), IDS, textOf("nombres.items", IDS)); })();

/* ---------- §47-2 : les échelles d'une onde sonore ---------- */
(() => {
  const O = self.Ondes, T0 = 293.15, P0 = Constantes.atm, M = O.milieu("air", T0, P0), ELL = O.libreParcours(T0, P0);
  const freq = () => 20 * Math.pow(1000, +$("fr").value);                     // 20 Hz … 20 kHz, logarithmic
  function upd() {
    const L = +$("niv").value, f = freq(), a = O.amplitudes(L, f, M), del = O.epaisseurThermique(f);
    const svg = $("echelle"); svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 200, pad: { l: 16, r: 16, t: 16, b: 44 }, x: { scale: "log", domain: [1e-12, 100], label: t("ec.xaxis") }, y: { domain: [0, 5], fmt: () => "" } });
    const mark = (v, row, cls, key) => {
      Plot.el("line", { x1: A.x(v), x2: A.x(v), y1: A.y(0), y2: A.y(row), class: "stroke thin " + cls }, A.g);
      Plot.el("circle", { cx: A.x(v), cy: A.y(row), r: 5, class: "fill " + cls }, A.g);
      const right = A.x(v) > 480;
      Plot.el("text", { x: A.x(v) + (right ? -9 : 9), y: A.y(row) + 4, "text-anchor": right ? "end" : "start", class: "label" }, A.g).textContent = t(key);
    };
    mark(O.D_AIR, 1, "c-label-2", "ec.m.d");
    mark(ELL, 2, "c-warn", "ec.m.l");
    mark(a.chi0, 3, "c-tint", "ec.m.chi");
    mark(del, 2, "c-label-2", "ec.m.delta");
    mark(a.lambda, 4, "c-label-2", "ec.m.lam");
    $("nivv").textContent = F.qty(F.num(L, 3), t("eq.db")); $("frv").textContent = F.si(f, "Hz");
    $("vp").textContent = F.si(a.pEff, "Pa"); $("fp").textContent = t("ec.f.p", { p0: F.si(a.p0, "Pa"), r: F.sci(a.p0 / P0, 2) });
    $("vchi").textContent = F.si(a.chi0, "m"); $("fchi").textContent = t("ec.f.chi", { r: F.sci(a.chi0 / ELL, 2) });
    $("vu").textContent = F.si(a.u0, "m·s⁻¹"); $("fu").textContent = t("ec.f.u", { c: F.si(M.c, "m·s⁻¹") });
    $("veps").textContent = F.sci(a.eps, 2); $("feps").textContent = t("ec.f.eps");
    $("vdT").textContent = F.si(a.dT, "K"); $("fdT").textContent = t("ec.f.dT", { T: F.qty(F.num(T0, 5), "K") });
    $("vlam").textContent = F.si(a.lambda, "m"); $("flam").textContent = t("ec.f.lam", { r: F.sci(a.lambda / ELL, 2), d: F.sci(del / a.lambda, 2) });
  }
  $("niv").oninput = upd; $("fr").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["boyle", 1660, "experiment"], ["newton", 1687, "idea"], ["rayleigh", 1877, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sonometre", "travail"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["vide", "c"], ["db", "a"], ["vingt", "d"], ["chi", "b"], ["continu", "c"], ["chaleur", "a"], ["lineaire", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 472 });
})();
</script>
