    <figure>
      <div class="panel">
        <div class="ctls">
          <div class="ctl"><div class="row"><label for="msal" data-i18n="fig.msal"></label><output id="msalread" for="msal"></output></div>
            <input id="msal" type="range" min="1" max="10" step="0.1" value="5"></div>
          <div class="ctl"><div class="row"><label for="vanh" data-i18n="fig.vanh"></label><output id="vanhread" for="vanh"></output></div>
            <input id="vanh" type="range" min="2" max="15" step="0.5" value="7"></div>
          <div class="ctl"><div class="row"><label for="mbrut" data-i18n="fig.mbrut"></label><output id="mbrutread" for="mbrut"></output></div>
            <input id="mbrut" type="range" min="0" max="12" step="0.05" value="5.6"></div>
          <div class="ctl"><div class="row"><label for="recri" data-i18n="fig.recri"></label><output id="recriread" for="recri"></output></div>
            <input id="recri" type="range" min="50" max="100" step="1" value="80"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="fig.n"></span><span class="v" id="n"></span><span class="f" id="nf"></span></div>

          <div class="stat"><span class="k" data-i18n="fig.brut"></span><span class="v" id="brut"></span><span class="f" id="brutf"></span></div>
          <div class="stat"><span class="k" data-i18n="fig.final"></span><span class="v" id="final"></span><span class="f" id="finalf"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mi>η</mi><mo>=</mo><mfrac><msub><mi>n</mi><mi data-i18n="eq.obtenu"></mi></msub><msub><mi>n</mi><mi data-i18n="eq.max"></mi></msub></mfrac><mo>=</mo><mfrac><msub><mi>m</mi><mi data-i18n="eq.obtenu"></mi></msub><mrow><mi>ν</mi><mspace width="0.1em"/><msub><mi>ξ</mi><mi data-i18n="eq.max"></mi></msub><mspace width="0.1em"/><mi>M</mi></mrow></mfrac></math></div>

    <p data-i18n-html="s3.p2"></p>
    <div class="eq"><math display="block"><msub><mi>η</mi><mi data-i18n="eq.global"></mi></msub><mo>=</mo><munder><mo>∏</mo><mi>i</mi></munder><msub><mi>η</mi><mi>i</mi></msub></math></div>
    <p class="validite" data-i18n-html="s3.validite2"></p>
    <p data-i18n-html="s3.p3"></p>
    <div class="eq"><math display="block"><mi data-i18n="eq.ea"></mi><mo>=</mo><mfrac><mrow><mi>M</mi><mo stretchy="false">(</mo><mi data-i18n="eq.produit"></mi><mo stretchy="false">)</mo></mrow><mrow><mo>∑</mo><mi>M</mi><mo stretchy="false">(</mo><mi data-i18n="eq.reactifs"></mi><mo stretchy="false">)</mo></mrow></mfrac></math></div>

    <div class="eq"><math display="block"><msub><mi>R</mi><mi mathvariant="normal">f</mi></msub><mo>=</mo><mfrac><msub><mi>d</mi><mi data-i18n="eq.tache"></mi></msub><msub><mi>d</mi><mi data-i18n="eq.front"></mi></msub></mfrac></math></div>
    <p class="validite" data-i18n-html="s4.validite"></p>
    <p data-i18n-html="s4.p2"></p>

  <section class="card">

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));

/* ---------- les quatre temps d'une synthèse ---------- */
(() => {
  const ET = ["transformer", "separer", "purifier", "caracteriser"], txt = textOf("etapes", ET);
  document.getElementById("etapes").innerHTML = ET.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text}</span><span class="v"></span></div>`).join("");
})();

/* ---------- l'aspirine : réactif limitant, rendement ---------- */
(() => {
  const O = ChimOrga, $ = id => document.getElementById(id);
  const M_SAL = O.masseMolaire({ C: 7, H: 6, O: 3 }), M_ANH = O.masseMolaire({ C: 4, H: 6, O: 3 }), M_ASP = O.masseMolaire({ C: 9, H: 8, O: 4 });
  const RHO_ANH = 1082;                                    // kg·m⁻³
  const g = x => F.qty(F.fix(x * 1000, 2), "g"), mmol = x => F.qty(F.fix(x * 1000, 1), "mmol");
  function maj() {
    const ms = +$("msal").value * 1e-3, va = +$("vanh").value * 1e-6, mb = +$("mbrut").value * 1e-3, eta = +$("recri").value / 100;
    const nS = Synthese.quantiteSolide(ms, M_SAL), nA = Synthese.quantiteLiquide(va, RHO_ANH, M_ANH);
    const b = Synthese.bilan([{ n: nS, nu: -1 }, { n: nA, nu: -1 }], 1, M_ASP, mb);
    $("msalread").textContent = F.qty(F.fix(ms * 1000, 1), "g");
    $("vanhread").textContent = F.qty(F.fix(va * 1e6, 1), "mL");
    $("mbrutread").textContent = F.qty(F.fix(mb * 1000, 2), "g");
    $("recriread").textContent = F.qty(F.fix(eta * 100, 0), "%");
    $("n").textContent = mmol(nS) + " / " + mmol(nA);
    $("nf").textContent = t("fig.nf");
    $("lim").textContent = b.limitants.length > 1 ? t("fig.les2") : t(b.limitants[0] === 0 ? "fig.sal" : "fig.anh");
    $("limf").textContent = t("fig.mmax", { m: g(b.mMax) });
    $("brut").textContent = F.qty(F.fix(100 * b.rendement, 0), "%");
    $("brutf").textContent = t(b.rendement > 1 ? "fig.trop" : "fig.brutf");
    const mp = Math.min(mb, b.mMax) * eta, eg = Synthese.rendementGlobal([Math.min(b.rendement, 1), eta]);
    $("final").textContent = F.qty(F.fix(100 * eg, 0), "%");
    $("finalf").textContent = t("fig.finalf", { m: g(mp) });
  }
  ["msal", "vanh", "mbrut", "recri"].forEach(id => $(id).oninput = maj);
  maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wohler", 1828, "experiment"], ["hoffmann", 1897, "experiment"], ["marque", 1899, "use"], ["tswett", 1906, "experiment"], ["deanstark", 1920, "experiment"], ["kofler", 1949, "experiment"], ["trost", 1991, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount(document.getElementById("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["suivi", "industrie"], uses = textOf("uses.items", USES);
  document.getElementById("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["limitant", "b"], ["trop", "d"], ["global", "a"], ["recristallisation", "c"], ["fusion", "b"], ["rf", "a"], ["economie", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount(document.getElementById("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
