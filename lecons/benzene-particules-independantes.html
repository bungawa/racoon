<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes, O = { E0: 0, A: 1 };
/* ---------- a level diagram: levels as lines, electrons as dots ---------- */
function diagramme(svg, niv, ne, o) {
  svg.innerHTML = "";
  const lo = Math.min(...niv), hi = Math.max(...niv), y = Plot.linScale(-2.2, 2.2, 290, 20), x0 = 160, w = 90;
  const groupes = [];
  niv.forEach(E => { const g = groupes.find(g => Math.abs(g.E - E) < 1e-9); if (g) g.n++; else groupes.push({ E, n: 1 }); });
  let reste = ne;
  for (const g of groupes) {
    for (let i = 0; i < g.n; i++) {
      const x = x0 + (i - (g.n - 1) / 2) * (w + 20) + 120, yy = y(g.E);
      Plot.el("line", { x1: x - w / 2, x2: x + w / 2, y1: yy, y2: yy, class: "stroke bold" }, Plot.el("g", { class: "c-label" }, svg));
      for (let k = 0; k < 2 && reste > 0; k++, reste--) Plot.el("circle", { cx: x - 12 + 24 * k, cy: yy - 8, r: 5, class: "fill" }, Plot.el("g", { class: "c-warn" }, svg));
    }
    const e = Plot.el("text", { x: 70, y: y(g.E) + 4, "text-anchor": "end", class: "c-label-2" }, svg); e.textContent = o.fmt(g.E);
  }
  Plot.el("line", { x1: 80, x2: 600, y1: y(0), y2: y(0), class: "stroke thin dash" }, Plot.el("g", { class: "c-label-2" }, svg));
}

/* ---------- a ring of N carbons, ne electrons ---------- */
(() => {
  const svg = $("fig"), sn = $("sn"), se = $("se");
  function draw() {
    const N = +sn.value; se.max = 2 * N; if (+se.value > 2 * N) se.value = 2 * N;
    const ne = +se.value, niv = Q.niveauxAnneau(N, O), r = Q.remplir(niv, ne);
    diagramme(svg, niv, ne, { fmt: E => t("fig.niv", { e: F.num(E, 3) }) });
    $("snr").textContent = F.num(N, 2);
    $("ser").textContent = F.num(ne, 2);
    $("vt").textContent = t("fig.v.tot", { n: F.num(ne, 2), e: F.num(r.total, 4) });
    $("ft").textContent = t("fig.f.tot", { d: F.num(r.total + ne, 4) });
    $("vg").textContent = r.gap === null ? "–" : t("fig.v.gap", { g: F.num(r.gap, 3) });
    $("fg").textContent = t(r.gap === null ? "fig.f.gap.aucun" : r.gap < 1e-9 ? "fig.f.gap.nul" : "fig.f.gap");
  }
  sn.oninput = draw; se.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const NA = 6.02214076e23, A = 0.8 * K.e;
  $("sys1").innerHTML = t("sys1.body", { kj: F.num(2 * A * NA / 1000, 3) });
  $("sys2").innerHTML = t("sys2.body", { l0: F.si(K.h * K.c / (2 * 0.8 * K.e), "m") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1825, "experiment"], ["kekule", 1865, "idea"], ["lonsdale", 1929, "experiment"], ["huckel", 1931, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["estimation"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["anneau", "b"], ["niveaux", "d"], ["delocalise", "a"], ["absorption", "c"], ["desaccord", "b"], ["six", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1504 });
})();
</script>
