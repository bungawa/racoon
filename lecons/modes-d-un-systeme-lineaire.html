<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* fil de 1 m tendu à 50 N, masse linéique moyenne 20 g·m⁻¹ : N perles de m = μa, a = L/(N + 1) ; corde continue c = 50 m·s⁻¹ */
const L = 1, TENS = 50, MU = 0.02;
const collier = N => self.Ondes.perles(N, TENS, MU * L / (N + 1), L);
const dessin = (svg, xs, ys, cls, ymax, h, ylab) => {
  const A = Plot.axes(svg, { fmt: F, w: 640, h, pad: { l: 52, b: 44 }, x: { domain: [0, L], label: t("pm.xaxis") }, y: { domain: [-ymax, ymax], label: ylab } });
  const pts = [[0, 0], ...xs.map((x, i) => [x, ys[i]]), [L, 0]];
  Plot.el("path", { d: Plot.path(pts.map(([x, y]) => [A.x(x), A.y(y)])), class: "stroke thin c-label-2" }, A.g);
  xs.forEach((x, i) => Plot.el("circle", { cx: A.x(x), cy: A.y(ys[i]), r: 5, class: "fill " + cls }, A.g));
  return A;
};

/* ---------- (49.18b) : les modes du collier, comparés à ceux de la corde continue de même masse linéique ---------- */
(() => {
  function upd() {
    const N = +$("nb").value; $("nm").max = String(N); const n = Math.min(+$("nm").value, N); $("nm").value = String(n);
    const P = collier(N), u = P.formes[n - 1], k = Math.max(...u.map(Math.abs)), svg = $("pm"); svg.innerHTML = "";
    const A = dessin(svg, P.x, u.map(v => v / k), "c-tint", 1.2, 200, t("pm.yaxis"));
    const XS = Array.from({ length: 401 }, (_, i) => L * i / 400), s = Math.sign(u[0] / Math.sin(n * Math.PI / (N + 1))) || 1;
    Plot.el("path", { d: Plot.path(XS.map(x => [A.x(x), A.y(s * Math.sin(n * Math.PI * x / L))])), class: "stroke thin dash c-warn" }, A.g);
    /* ωₙ des N modes, en unités du fondamental de la corde continue */
    const w = $("pw"), w1 = P.continu(1); w.innerHTML = "";
    const B = Plot.axes(w, { fmt: F, w: 640, h: 200, pad: { l: 52, b: 44 }, x: { domain: [0, 25], label: t("pw.xaxis") }, y: { domain: [0, 25], label: t("pw.yaxis") } });
    Plot.el("path", { d: Plot.path([[0, 0], [25, 25]].map(([a, b]) => [B.x(a), B.y(b)])), class: "stroke thin dash c-warn" }, B.g);
    P.omega.forEach((om, i) => Plot.el("circle", { cx: B.x(i + 1), cy: B.y(om / w1), r: i + 1 === n ? 6 : 3.5, class: "fill c-tint" }, B.g));
    Plot.el("line", { x1: B.x(0), x2: B.x(25), y1: B.y(2 * Math.sqrt(TENS / (P.m[0] * P.a)) / w1), y2: B.y(2 * Math.sqrt(TENS / (P.m[0] * P.a)) / w1), class: "ref" }, B.g);
    const fp = P.omega[n - 1] / (2 * Math.PI), fc = P.continu(n) / (2 * Math.PI);
    $("nbv").textContent = String(N); $("nmv").textContent = String(n);
    $("vp").textContent = F.si(fp, "Hz", { prefix: "" }); $("fp").textContent = t("pm.f.perle", { m: F.si(1000 * P.m[0], "g") });
    $("vc").textContent = F.si(fc, "Hz", { prefix: "" }); $("fc").textContent = t("pm.f.ecart", { e: F.num(100 * (1 - fp / fc), 2) + " %" });
  }
  ["nb", "nm"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- (49.13a) : cinq perles, l'une tirée de 1 cm et lâchée ---------- */
(() => {
  const N = 5, P = collier(N), TMAX = 2;
  function upd() {
    const j = +$("pj").value, x0 = P.x.map((_, i) => (i === j - 1 ? 0.01 : 0)), Mv = P.lacher(x0), tt = +$("tl").value * TMAX;
    const svg = $("lm"); svg.innerHTML = "";
    dessin(svg, P.x, Mv.position(tt).map(v => 100 * v), "c-tint", 1.2, 180, t("lm.yaxis"));
    const Em = Mv.energiesModes, E = Em.reduce((s, v) => s + v, 0), Ec = Mv.cinetiques(tt);
    const e = $("le"); e.innerHTML = "";
    const B = Plot.axes(e, { fmt: F, w: 640, h: 170, pad: { l: 52, b: 44 }, x: { domain: [0.3, 2 * N + 1.7], label: t("le.xaxis"), ticks: 1, fmt: () => "" }, y: { domain: [0, 100], label: t("le.yaxis") } });
    const bar = (x, v, cls, lab) => { const w = (B.x(1) - B.x(0)) * 0.7;
      Plot.el("rect", { x: B.x(x) - w / 2, y: B.y(v), width: w, height: Math.max(0, B.y(0) - B.y(v)), class: "fill " + cls }, B.g);
      Plot.el("text", { x: B.x(x), y: B.y(0) + 16, "text-anchor": "middle" }, B.g).textContent = lab; };
    Em.forEach((v, i) => bar(i + 1, 100 * v / E, "c-tint", String(i + 1)));
    Ec.forEach((v, i) => bar(N + 2 + i, 100 * v / E, "c-warn", String(i + 1)));
    $("pjv").textContent = String(j); $("tlv").textContent = F.si(tt, "s");
    $("vm").textContent = Em.map(v => F.num(100 * v / E, 3)).join(" · "); $("fm").textContent = t("lm.f.modes");
    $("ve").textContent = F.si(Mv.energie(tt), "J"); $("fe").textContent = t("lm.f.E");
  }
  ["pj", "tl"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rayleigh", 1877, "idea"], ["schrodinger", 1926, "idea"], ["millennium", 2000, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["seisme"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["combien", "b"], ["determinant", "d"], ["limite", "a"], ["court", "c"], ["independants", "b"], ["energie", "a"], ["niveaux", "d"], ["norme", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 495 });
})();
</script>
