<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, MU0 = Constantes.mu0;

/* ---------- B_z sur l'axe : polygones sommés par (14.43), cercle (14.43a), une spire ou une paire coaxiale ---------- */
(() => {
  const svg = $("axe"), sn = $("sn"), sz = $("sz"), sd = $("sd"), Ic = 10, R = 0.05;      // A, m
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 },
    x: { domain: [-2.5, 2.5], label: t("fig.x") }, y: { domain: [0, 1.6], label: t("fig.y") } });
  const B0 = MU0 * Ic / (2 * R), gc = Plot.el("g", {}, g);
  const pc = Plot.el("path", { class: "stroke c-label-2 dash" }, g), pp = Plot.el("path", { class: "stroke c-tint" }, g);
  const dot = Plot.el("circle", { r: 5, class: "fill c-warn" }, g);
  let mode = 1;
  const centres = D => mode === 1 ? [0] : [-D / 2, D / 2];
  const poly = (n, D) => centres(D).map(z0 => M.polygoneRegulier(R, n, z0));
  const Bpoly = (n, D, z) => poly(n, D).reduce((s, sp) => s + M.circuitB(Ic, sp, [0, 0, z])[2], 0);
  const Bcercle = (D, z) => centres(D).reduce((s, z0) => s + M.spireAxe(Ic, R, z - z0), 0);
  const courbe = f => { let d = ""; for (let i = 0; i <= 200; i++) { const u = -2.5 + 5 * i / 200; d += (i ? "L" : "M") + x(u).toFixed(1) + " " + y(Math.min(f(u * R) / B0, 1.6)).toFixed(1); } return d; };
  function draw() {
    const n = +sn.value, z = +sz.value / 100 * R, D = +sd.value / 100 * R;
    pc.setAttribute("d", courbe(u => Bcercle(D, u)));
    pp.setAttribute("d", courbe(u => Bpoly(n, D, u)));
    gc.innerHTML = "";
    centres(D).forEach(z0 => Plot.el("line", { x1: x(z0 / R), x2: x(z0 / R), y1: y(0), y2: y(1.6), class: "stroke thin" }, gc));
    const b = Bpoly(n, D, z), rot = AnaVec.rotationnel(p => poly(n, D).reduce((s, sp) => s.map((v, i) => v + M.circuitA(Ic, sp, p)[i]), [0, 0, 0]), [0, 0, z], 1e-6 * R)[2];
    const bc = Bcercle(D, z), plat = Bcercle(D, R / 5) / Bcercle(D, 0) - 1;
    dot.setAttribute("cx", x(z / R)); dot.setAttribute("cy", y(Math.min(b / B0, 1.6)));
    $("snr").textContent = F.num(n, 3); $("szr").textContent = t("fig.v.z", { z: F.si(z, "m", { prefix: "m" }), u: F.num(z / R, 2) });
    $("sdr").textContent = mode === 1 ? t("fig.v.sans") : t("fig.v.d", { d: F.si(D, "m", { prefix: "m" }), u: F.num(D / R, 2) });
    sd.disabled = mode === 1;
    $("vbs").textContent = F.si(b, "T");
    $("fbs").textContent = t("fig.f.rot", { v: F.si(rot, "T") });
    $("vc").textContent = F.si(bc, "T");
    $("fc").textContent = t("fig.f.cercle", { e: F.sci(b / bc - 1, 2) });
    $("vp").textContent = t("fig.v.plat", { e: F.sci(plat, 2) });
    $("fp").textContent = mode === 1 ? t("fig.f.une") : t("fig.f.deux");
    $("mode").querySelectorAll("button").forEach(e => e.setAttribute("aria-pressed", String(+e.dataset.m === mode)));
  }
  $("mode").querySelectorAll("button").forEach(e => e.onclick = () => { mode = +e.dataset.m; draw(); });
  sn.oninput = sz.oninput = sd.oninput = draw; draw();
})();

/* ---------- le système décrit : une spire de laboratoire, alimentée en continu puis à 50 Hz ---------- */
(() => {
  const Ic = 10, R = 0.05, f = 50, mT = 8.22e22, RT = Constantes.R_E_mean;
  const Bc = M.spireAxe(Ic, R, 0), Bt = Math.abs(M.composantesDipoleB(mT, RT, Math.PI / 2).Bz);
  $("sys1").innerHTML = t("sys1.body", { R: F.si(R, "m", { prefix: "m" }), I: F.si(Ic, "A"), Bc: F.si(Bc, "T"), Bt: F.si(Bt, "T"), rap: F.num(Bc / Bt, 2),
    f: F.si(f, "Hz"), q: F.sci(R * f / Constantes.c, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["biot", 1820, "experiment"], ["ampere", 1826, "idea"], ["grassmann", 1845, "idea"], ["w7x", 2015, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["helmholtz"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["direction", "c"], ["distance", "a"], ["centre", "b"], ["carre", "d"], ["loin", "a"], ["element", "c"], ["routes", "b"], ["helmholtz", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 147 });
})();
</script>
