<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const AN = { G: 0.05, R: 0.05, a: 0.006 };                       // a smoke ring: circulation (m²·s⁻¹), radius and core (m)

/* ---------- the system, in numbers ---------- */
(() => {
  const nuAir = Fluides.DYN.air.nu, v = FluidesParfait.vitesseAnneau(AN.G, AN.R, AN.a);
  $("sys").innerHTML = t("sys.body", { R: F.num(100 * AN.R, 2), a: F.num(1000 * AN.a, 2), G: F.fix(AN.G, 2), v: F.fix(v, 2),
    re: F.num(AN.G / nuAir, 2), diff: F.fix(1000 * Math.sqrt(nuAir * 1), 1), Ra: F.num(AN.R / AN.a, 2) });
})();

/* ---------- a vortex ring, in cross-section ---------- */
(() => {
  const svg = $("anneau"), P = Plot.el, notes = textOf("fig.notes", ["un", "deux"]), rng = Quiz.rng(58);
  const W = 640, H = 360, S = 1800, dt = 0.004, D = AN.a;          // px per metre; time step (s); core smoothing (m)
  let mode = "un", st, time, paused = false, gen = 0, hist = [], C0;
  function init() {
    const h = AN.R, G = AN.G;
    const vs = mode === "un" ? [[0, h, G], [0, -h, -G]] : [[0, h, G], [0, -h, -G], [-h, h, G], [-h, -h, -G]];
    const smoke = [];
    vs.forEach(([x, y]) => { for (let k = 0; k < 70; k++) { const r = 0.022 * Math.sqrt(rng()), a = 6.2832 * rng(); smoke.push([x + r * Math.cos(a), y + r * Math.sin(a)]); } });
    const loop = [];   // a material loop around the upper core; with two rings it would be torn apart and left behind
    if (mode === "un") for (let k = 0; k < 48; k++) loop.push([0.026 * Math.cos(6.2832 * k / 48), h + 0.026 * Math.sin(6.2832 * k / 48)]);
    st = { vs, smoke, loop }; time = 0; hist = []; C0 = loop.length ? FluidesParfait.circulationBoucle(vs, loop, D) : NaN;
    $("note").innerHTML = notes[mode];
  }
  function step() {
    const n = st.smoke.length, r = FluidesParfait.evolueTourbillons(st.vs, st.smoke.concat(st.loop), dt, D);
    st.vs = r.vs; st.smoke = r.pts.slice(0, n); st.loop = st.loop.length ? FluidesParfait.raffineBoucle(r.pts.slice(n), 0.004) : []; time += dt;
  }
  function draw() {
    const cx = st.vs.reduce((s, v) => s + v[0], 0) / st.vs.length;   // the view follows the rings
    const X = x => W / 2 + S * (x - cx), Y = y => H / 2 - S * y;
    svg.innerHTML = "";
    const ga = P("g", { class: "c-label-2" }, svg);
    P("line", { x1: 0, x2: W, y1: Y(0), y2: Y(0), class: "stroke thin dash" }, ga);
    for (let k = Math.ceil((cx - 0.2) / 0.05); k * 0.05 < cx + 0.2; k++) P("line", { x1: X(k * 0.05), x2: X(k * 0.05), y1: Y(0) - 4, y2: Y(0) + 4, class: "stroke thin" }, ga);
    st.smoke.forEach(p => P("circle", { cx: X(p[0]).toFixed(1), cy: Y(p[1]).toFixed(1), r: 1.6, class: "fill" }, ga));
    if (st.loop.length) P("polygon", { points: st.loop.map(p => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" "), class: "stroke c-ok" }, svg);
    const gk = P("g", { class: "c-ko" }, svg);
    st.vs.forEach(([x, y, G]) => { P("circle", { cx: X(x), cy: Y(y), r: 5, class: "fill" }, gk);
      P("text", { x: X(x) + 8, y: Y(y) - 8, class: "note" }, gk).textContent = G > 0 ? "↺" : "↻"; });
    const C = st.loop.length ? FluidesParfait.circulationBoucle(st.vs, st.loop, D) : NaN;
    hist.push([time, cx]); while (hist.length > 2 && hist[0][0] < time - 0.5) hist.shift();
    const v = hist.length > 1 ? (hist[hist.length - 1][1] - hist[0][1]) / (hist[hist.length - 1][0] - hist[0][0]) : NaN;
    $("vc").textContent = isFinite(C) ? F.qty(F.fix(C, 4), "m²·s⁻¹") : "–";
    $("fc").innerHTML = isFinite(C) ? t("fig.f.circ", { c0: F.fix(C0, 4), n: st.loop.length }) : t("fig.f.sansboucle");
    $("vv").textContent = isFinite(v) ? F.qty(F.fix(v, 3), "m·s⁻¹") : "–";
    $("fv").innerHTML = t("fig.f.v", { p: F.fix(FluidesParfait.vitessePaire(AN.G, 2 * AN.R), 3), k: F.fix(FluidesParfait.vitesseAnneau(AN.G, AN.R, AN.a), 2) });
    $("vt").textContent = F.qty(F.fix(time, 2), "s"); $("ft").innerHTML = t("fig.f.t", { x: F.fix(100 * cx, 1) });
  }
  function run() {
    const my = ++gen; let last = null;
    const loop = now => {
      if (my !== gen) return;
      if (!paused && last !== null) { const k = Math.min(10, Math.round((now - last) / 1000 * 0.5 / dt)); for (let i = 0; i < k; i++) step(); }
      last = now; draw();
      if (time < 30) requestAnimationFrame(loop);
    };
    if (reduce) { for (let i = 0; i < 250; i++) step(); draw(); } else requestAnimationFrame(loop);
  }
  document.querySelectorAll("#modes button").forEach(b => b.onclick = () => {
    mode = b.dataset.m; document.querySelectorAll("#modes button").forEach(x => x.setAttribute("aria-pressed", x === b)); init(); draw(); run(); });
  $("pause").onclick = () => { paused = !paused; $("pause").textContent = t(paused ? "fig.play" : "fig.pause"); };
  $("reset").onclick = () => { init(); draw(); run(); };
  init(); draw(); run();
})();

/* ---------- history ---------- */
(() => {
  const EVENTS = [["helmholtz", 1858, "idea"], ["tait", 1867, "experiment"], ["kelvin", 1867, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sillage"], uses = textOf("uses.items", USES);
  /* an airliner of 300 000 kg at 80 m·s⁻¹, wingspan 60 m: elliptic loading puts the two vortices π b/4 apart */
  const m = 3e5, U = 80, b = 60, rho = 1.225, b0 = Math.PI * b / 4, G = m * Constantes.g_CPGE / (rho * U * b0);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace("{G}", F.num(G, 2)).replace("{b0}", F.num(b0, 2)).replace("{w}", F.fix(FluidesParfait.vitessePaire(G, b0), 1)).replace("{m}", F.fix(60 * FluidesParfait.vitessePaire(G, b0), 0))}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["helmholtz", "a"], ["etirement", "c"], ["fin", "b"], ["anneau", "d"], ["kelvin", "a"], ["creer", "c"], ["saute", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 405 });
})();
</script>
