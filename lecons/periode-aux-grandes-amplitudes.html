<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const DEG = Math.PI / 180, W = Pendule.pulsation(1), T0 = 2 * Math.PI / W;
const pct = (r, sig) => (r < 0 ? F.MINUS : "+") + F.qty(F.num(Math.abs(r) * 100, sig || 2), "%");

/* ---------- §2 : période exacte, Borda, et l'erreur de Borda ---------- */
(() => {
  const A = Array.from({ length: 179 }, (_, i) => i + 1);                       // degrees
  const EX = A.map(a => Pendule.periode(W, a * DEG) / T0), BO = A.map(a => Pendule.borda(W, a * DEG) / T0);
  const ER = A.map(a => Math.abs(Pendule.ecartBorda(a * DEG)));
  function upd() {
    const a = +$("th0").value, th = a * DEG, T = Pendule.periode(W, th), B = Pendule.borda(W, th);
    let svg = $("per"); svg.innerHTML = "";
    let o = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 48 }, x: { domain: [0, 180], label: t("per.xaxis") }, y: { domain: [0.8, 4], label: t("per.yaxis") } });
    Plot.el("path", { d: path(A.map((x, i) => [o.x(x), o.y(BO[i])])), class: "ref" }, o.g);
    Plot.el("path", { d: path(A.map((x, i) => [o.x(x), o.y(Math.min(4, EX[i]))])), class: "curve" }, o.g);
    Plot.el("circle", { cx: o.x(a), cy: o.y(Math.min(4, T / T0)), r: 5, class: "dot" }, o.g);
    /* |Borda − exact| / exact on log axes, and its first term 11θ₀⁴/3072: a straight line of slope 4 */
    svg = $("err"); svg.innerHTML = "";
    o = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 48 }, x: { scale: "log", domain: [1, 180], label: t("err.xaxis"), fmt: v => F.num(v, 3) }, y: { scale: "log", domain: [1e-10, 1], label: t("err.yaxis") } });
    const XS = A.filter(x => x <= 179);
    Plot.el("path", { d: path([1, 179].map(x => [o.x(x), o.y(11 * (x * DEG) ** 4 / 3072)])), class: "ref" }, o.g);
    Plot.el("path", { d: path(XS.map((x, i) => [o.x(x), o.y(ER[i])])), class: "curve" }, o.g);
    Plot.el("circle", { cx: o.x(a), cy: o.y(ER[a - 1]), r: 5, class: "dot" }, o.g);
    /* readouts; the step-by-step period from Osc (leapfrog, crossing of θ = 0) */
    const N = Osc.periodeNum(Osc.pendule(W), th);
    $("th0v").textContent = F.num(a, 3) + "°";
    $("vT").textContent = F.si(T, "s", { sig: 5 });
    $("fT").textContent = t("per.f.T", { r: F.num(T / T0, 5), e: pct(T / T0 - 1, 3) });
    $("vB").textContent = F.si(B, "s", { sig: 5 });
    $("fB").textContent = t("per.f.borda", { e: pct(B / T - 1, 2) });
    $("vN").textContent = F.si(N, "s", { sig: 5 });
    $("fN").textContent = t("per.f.num", { e: F.sci(Math.abs(N / T - 1), 1) });
  }
  $("th0").oninput = upd; upd();
})();

/* ---------- §4 : la cycloïde de Huygens contre l'arc de cercle ---------- */
(() => {
  const L = 1, a = L / 4, C = Pendule.cycloide(a), quarter = C.periode / 4, svg = $("cyc");
  function upd() {
    const h0 = +$("ch").value / 100 * 2 * a, tc = Pendule.descenteCycloide(a, h0), tr = Pendule.descenteCercle(L, h0);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { b: 44, l: 48 }, x: { domain: [-1, 1], label: t("cyc.xaxis") }, y: { domain: [0, 0.55], label: t("cyc.yaxis") } });
    const cyc = Array.from({ length: 201 }, (_, i) => C.point(2 * Math.PI * i / 200)).map(([x, z]) => [x - Math.PI * a, z]);
    const lim = Math.acos(1 - 0.55 / L), circ = Array.from({ length: 201 }, (_, i) => { const th = -lim + 2 * lim * i / 200; return [L * Math.sin(th), L * (1 - Math.cos(th))]; });
    Plot.el("path", { d: path(circ.map(([x, z]) => [o.x(x), o.y(z)])), class: "ref" }, o.g);
    Plot.el("path", { d: path(cyc.map(([x, z]) => [o.x(x), o.y(z)])), class: "curve" }, o.g);
    /* the two starting points, at the same height on the left */
    const pc = Math.acos(Math.min(1, h0 / a - 1)), xc = C.point(pc)[0] - Math.PI * a, xr = -L * Math.sin(Math.acos(1 - h0 / L));
    Plot.el("circle", { cx: o.x(xc), cy: o.y(h0), r: 5, class: "dot" }, o.g);
    Plot.el("circle", { cx: o.x(xr), cy: o.y(h0), r: 4, class: "dot" }, o.g);
    $("chv").textContent = F.si(h0, "m", { sig: 3 });
    $("vcyc").textContent = F.si(tc, "s", { sig: 4 });
    $("fcyc").textContent = t("cyc.f.cyc", { e: pct(tc / quarter - 1, 1) });
    $("vcer").textContent = F.si(tr, "s", { sig: 4 });
    $("fcer").textContent = t("cyc.f.cercle", { a: F.num(Math.acos(1 - h0 / L) / DEG, 3) + "°", e: pct(tr / quarter - 1, 2) });
  }
  $("ch").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["huygens1659", 1659, "idea"], ["huygens1673", 1673, "idea"], ["borda1792", 1792, "experiment"], ["gauss1799", 1799, "idea"], ["shortt1921", 1921, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["horloge", "calcul"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "a"], ["borda", "b"], ["double", "c"], ["sommet", "a"], ["horloge", "d"], ["cycloide", "b"], ["fil", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1103 });
})();
</script>
