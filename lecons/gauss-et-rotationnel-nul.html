<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9;
const Vm = x => F.si(x, "V·m⁻¹");

/* trois charges de quelques nC sur 16 cm, des billes de 1 mm, observées une seconde (positions en m) */
const CHARGES = [{ q: 2 * NC, x: -0.02, y: 0.005 }, { q: -1 * NC, x: 0.015, y: -0.01 }, { q: 1 * NC, x: 0.05, y: 0.02 }];
const R = 0.035;

/* ---------- le système décrit, chiffré ---------- */
(() => {
  const L = 0.16, T = 1, b = 1e-3, d = 0.035;
  $("sys").innerHTML = t("sys.body", { ret: F.sci(ES.regime(L, T, 0).retard, 1), ba: F.num(b / d, 2) });
})();

/* ---------- Gauss seul, rotationnel seul : ajouter un tourbillon, un champ uniforme ---------- */
(() => {
  const svg = $("carte"), O = { W: 640, H: 400, x0: -0.08, x1: 0.08, y0: -0.05, y1: 0.05 }, omsl = $("omsl"), e0sl = $("e0sl");
  const qint = CHARGES.reduce((s, c) => s + (Math.hypot(c.x, c.y) < R ? c.q : 0), 0);
  function draw() {
    const om = +omsl.value * 1e5, e0 = +e0sl.value * 1e4, T = ES.tourbillon(om, [0, 0]);
    const E = p => { const a = ES.champ(CHARGES, p), b = T(p); return a.map((x, i) => x + b[i] + (i === 0 ? e0 : 0)); };
    const c = CarteChamp.carte(svg, O);
    CarteChamp.fleches(c, p => (CHARGES.some(s => Math.hypot(p[0] - s.x, p[1] - s.y) < 0.006) ? [NaN, NaN] : E(p)), 20, 12, { cls: "c-label-2", unitaire: true, lmax: 11 });
    Plot.el("circle", { cx: c.sx(0), cy: c.sy(0), r: c.sx(R) - c.sx(0), class: "stroke dash" }, c.layer("c-ok"));
    CHARGES.forEach((s, i) => CarteChamp.point(c, [s.x, s.y], 4 + 2.5 * Math.abs(s.q) / NC, s.q > 0 ? "c-warn" : "c-label", t("ca.nom", { i: i + 1 }), -14));
    const flux = ES.fluxSphere(E, [0, 0, 0], R, 60) * ES.EPS0, circ = AnaVec.circulation(E, AnaVec.cercle([0, 0], R), 2000);
    const loin = Math.hypot(...E([1, 0])), coul = Math.hypot(...ES.champ(CHARGES, [1, 0]));
    $("omread").textContent = F.si(om, "V·m⁻²");
    $("e0read").textContent = Vm(e0);
    $("vflux").textContent = F.si(flux, "C", { prefix: "n" });
    $("fflux").textContent = t("ca.f.flux", { q: F.si(qint, "C", { prefix: "n" }) });
    $("vcirc").textContent = F.si(Math.abs(circ) < 1e-6 ? 0 : circ, "V");
    $("vloin").textContent = Vm(loin);
    $("floin").textContent = t("ca.f.loin", { e: Vm(coul) });
  }
  omsl.oninput = e0sl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gauss", 1813, "idea"], ["ostrogradski", 1826, "idea"], ["stokes", 1849, "idea"], ["helmholtz", 1858, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["optique"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "b"], ["tourbillon", "d"], ["uniforme", "a"], ["symetrie", "c"], ["poisson", "b"], ["induction", "a"], ["unicite", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 51 });
})();
</script>
