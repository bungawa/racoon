<html lang="fr">
<head>

</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-mecanique" data-i18n="monde.mecanique"></a><span class="aux">›</span><a href="/racoon/etape?id=decrire-mouvement" data-i18n="etape.decrire-mouvement"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>

    <div class="tags">
      <a class="chip t-meca" href="/racoon/atlas?piste=meca" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/vitesse" data-i18n="tag.prereq"></a>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="box def"><b data-i18n="s1.def.title"></b>
      <p data-i18n-html="s1.def.body"></p>
    </div>
    <div class="eq"><math display="block"><mi>v</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mover accent="true"><mi>x</mi><mo>˙</mo></mover><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi mathvariant="normal">d</mi><mi>x</mi></mrow><mrow><mi mathvariant="normal">d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><munder><mo movablelimits="true" data-i18n="eq.lim"></mo><mrow><mi mathvariant="normal">Δ</mi><mi>t</mi><mo>→</mo><mn>0</mn></mrow></munder><mfrac><mrow><mi>x</mi><mo stretchy="false">(</mo><mi>t</mi><mo>+</mo><mi mathvariant="normal">Δ</mi><mi>t</mi><mo stretchy="false">)</mo><mo>−</mo><mi>x</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><mrow><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow></mfrac></math><span class="n">(8.5)</span></div>
    <p class="validite" data-i18n="eq1.validite"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block" data-i18n-html="s1.eq.taylor"></math><span class="n">(8.5a)</span></div>
    <p class="validite" data-i18n="eq2.validite"></p>
    <p data-i18n-html="s1.p3"></p>
    <div class="eq"><math display="block" data-i18n-html="s1.eq.vec"></math><span class="n">(8.11–8.13)</span></div>
    <p class="validite" data-i18n="eq3.validite"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="box prop"><b data-i18n="s2.ex.title"></b>
      <p data-i18n-html="s2.ex.body"></p>
    </div>
    <h3 data-i18n="rules.h3"></h3>
    <div class="list" id="rules" role="table" data-i18n-attr="aria-label:rules.aria"></div>
    <div class="box warn"><b data-i18n="s2.warn.title"></b>
      <p data-i18n-html="s2.warn.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure class="chart">
      <div class="seg" role="group" data-i18n-attr="aria-label:lab.choice">
        <button type="button" data-m="chute" aria-pressed="false" data-i18n="lab.chute"></button>
        <button type="button" data-m="cubique" aria-pressed="true" data-i18n="lab.cubique"></button>
        <button type="button" data-m="oscillation" aria-pressed="false" data-i18n="lab.oscillation"></button>
      </div>
      <p class="caption" id="lawread"></p>
      <svg id="err" role="img" data-i18n-attr="aria-label:lab.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="lab.legend.fwd"></span><span class="c-warn" data-i18n="lab.legend.ctr"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="t0sl" data-i18n="lab.t0"></label><output id="t0read" for="t0sl"></output></div>
            <input id="t0sl" type="range" min="0" max="200" step="5" value="80"></div>
          <div class="ctl"><div class="row"><label for="hsl" data-i18n="lab.h"></label><output id="hread" for="hsl"></output></div>
            <input id="hsl" type="range" min="-12" max="0" step="0.25" value="-2"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="lab.k.exact"></span><span class="v" id="vex"></span><span class="f" data-i18n="lab.f.exact"></span></div>
          <div class="stat"><span class="k" data-i18n-html="lab.k.fwd"></span><span class="v" id="vfwd"></span><span class="f" id="efwd"></span></div>
          <div class="stat"><span class="k" data-i18n-html="lab.k.ctr"></span><span class="v" id="vctr"></span><span class="f" id="ectr"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="lab.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="s3.why.title"></b>
      <p data-i18n-html="s3.why.body"></p>
    </div>
    <div class="box warn"><b data-i18n="s3.round.title"></b>
      <p data-i18n-html="s3.round.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>

    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>

  <p class="foot" data-i18n-html="foot"></p>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/vitesse-derivee.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/cinematique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹";

/* ---------- règles de dérivation ---------- */
(() => {
  const RULES = ["puissance", "constante", "facteur", "somme", "produit", "cos"], txt = textOf("rules.rows", RULES);
  $("rules").innerHTML = RULES.map(id => `<div role="row"><span role="cell">${txt[id].f}</span><span class="v" role="cell">${txt[id].d}</span></div>`).join("");
})();

/* ---------- laboratoire : dérivée numérique contre dérivée exacte ---------- */
(() => {
  const svg = $("err"), t0sl = $("t0sl"), hsl = $("hsl"), FLOOR = 1e-15;
  const { x: X, y: Y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44 },
    x: { scale: "log", domain: [1e-12, 1], label: t("lab.x"), fmt: v => { const e = Math.round(Math.log10(v)); return e % 2 ? "" : "10" + F.sup(e); } }, y: { scale: "log", domain: [FLOOR, 10], label: t("lab.y"), fmt: v => { const e = Math.round(Math.log10(v)); return e % 2 ? "" : "10" + F.sup(e); } } });
  const fwdPath = Plot.el("path", { class: "curve" }, g), ctrPath = Plot.el("path", { class: "ref" }, g);
  const cur = Plot.el("line", { y1: Y(FLOOR), y2: Y(10), class: "zero" }, g);
  const dF = Plot.el("circle", { r: 6, class: "dot" }, g), dC = Plot.el("circle", { r: 6, class: "dot" }, g);
  const n1 = Plot.el("text", { class: "note" }, g), n2 = Plot.el("text", { class: "note" }, g);
  let key = "cubique";
  const err = (m, f, t0, h) => Math.min(10, Math.max(FLOOR, Math.abs(f(m.x, t0, h) - m.v(t0))));
  const fmtE = e => e <= FLOOR ? "0" : F.sci(e, 2);
  function curves() {
    const m = Cine.MOTIONS[key], t0 = t0sl.value / 100;
    let a = "", b = "";
    for (let i = 0; i <= 240; i++) { const h = Math.pow(10, -12 + 12 * i / 240);
      a += (i ? "L" : "M") + X(h).toFixed(1) + " " + Y(err(m, Cine.forward, t0, h)).toFixed(1);
      b += (i ? "L" : "M") + X(h).toFixed(1) + " " + Y(err(m, Cine.central, t0, h)).toFixed(1); }
    fwdPath.setAttribute("d", a); ctrPath.setAttribute("d", b);
    n1.setAttribute("x", X(3e-2)); n1.setAttribute("y", Y(err(m, Cine.forward, t0, 1e-2)) - 10); n1.textContent = t("lab.slope1");
    n2.setAttribute("x", X(3e-3)); n2.setAttribute("y", Y(Math.max(err(m, Cine.central, t0, 1e-3), 1e-15)) + 18); n2.textContent = t("lab.slope2");
  }
  function upd() {
    const m = Cine.MOTIONS[key], t0 = t0sl.value / 100, h = Math.pow(10, +hsl.value);
    const ve = m.v(t0), vf = Cine.forward(m.x, t0, h), vc = Cine.central(m.x, t0, h);
    cur.setAttribute("x1", X(h)); cur.setAttribute("x2", X(h));
    dF.setAttribute("cx", X(h)); dF.setAttribute("cy", Y(err(m, Cine.forward, t0, h)));
    dC.setAttribute("cx", X(h)); dC.setAttribute("cy", Y(err(m, Cine.central, t0, h)));
    $("t0read").textContent = F.qty(F.fix(t0, 2), "s");
    $("hread").textContent = F.qty(h >= 1e-3 ? F.num(h, 3) : F.sci(h, 1), "s");
    $("vex").textContent = F.qty(F.fix(ve, 6), MS);
    $("vfwd").textContent = F.qty(F.fix(vf, 6), MS);
    $("vctr").textContent = F.qty(F.fix(vc, 6), MS);
    $("efwd").textContent = t("lab.f.err", { e: fmtE(Math.abs(vf - ve)) });
    $("ectr").textContent = t("lab.f.err", { e: fmtE(Math.abs(vc - ve)) });
  }
  const all = () => { curves(); upd(); };
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { key = b.dataset.m;
    document.querySelectorAll("[data-m]").forEach(o => o.setAttribute("aria-pressed", o === b));
    $("lawread").innerHTML = t("lab.law." + key); all(); });
  $("lawread").innerHTML = t("lab.law." + key);
  t0sl.oninput = all; hsl.oninput = upd; all();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1665, "idea"], ["leibniz", 1684, "idea"], ["taylor", 1715, "idea"], ["lagrange", 1772, "idea"], ["ieee", 1985, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gnss", "calcul"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["poly", "a"], ["ordre1", "a"], ["ordre2", "a"], ["parabole", "a"], ["arrondi", "a"], ["taylor", "a"], ["produit", "a"], ["oscill", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 83 });
})();
</script>
</body>
</html>
