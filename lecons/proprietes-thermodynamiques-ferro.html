<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, C = Constantes;
const MU_NI = 0.606 * C.mu_B, TC = M.NICKEL.Tc;

/* ---------- énergie, chaleur massique, entropie en champ moyen ---------- */
(() => {
  const st = $("st"), ts = Array.from({ length: 400 }, (_, i) => 0.01 + 1.29 * i / 399), th = ts.map(x => [x, M.thermoSpin(x)]);
  const b = M.bilanChampMoyen(C.N_A, TC);
  function draw() {
    const tt = +st.value, r = M.thermoSpin(tt), svg = $("thermo"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, 1.3], label: t("fig.ax.x") }, y: { domain: [0, 1.6], label: t("fig.ax.y") } });
    /* the jump is drawn as it is: the curve drops vertically at Tc */
    Plot.el("path", { d: Plot.path(th.map(([x, q]) => [P.x(x), P.y(-q.u)])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(th.map(([x, q]) => [P.x(x), P.y(q.s)])), class: "stroke thin c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(th.map(([x, q]) => [P.x(x), P.y(q.c)])), class: "curve" }, P.g);
    Plot.el("line", { x1: P.x(0), x2: P.x(1.3), y1: P.y(Math.LN2), y2: P.y(Math.LN2), class: "stroke thin dash c-label" }, P.g);
    Plot.el("circle", { cx: P.x(tt), cy: P.y(r.c), r: 5, class: "dot" }, P.g);
    $("str").textContent = F.num(tt, 3);
    $("vc").textContent = F.num(r.c, 3);
    $("fc").innerHTML = t(tt < 1 ? "fig.f.c" : "fig.f.c0");
    $("vs").textContent = F.num(r.s, 3);
    $("fs").innerHTML = t("fig.f.s", { p: F.num(100 * r.s / Math.LN2, 2) });
    $("vni").innerHTML = F.si(r.c * C.R, "J·mol⁻¹·K⁻¹", { sig: 2 });
    $("fni").innerHTML = t("fig.f.ni", { T: F.kelvin(tt * TC), lat: F.si(3 * C.R, "J·mol⁻¹·K⁻¹", { sig: 3 }) });
  }
  st.oninput = draw; draw();
  $("bilan").innerHTML = t("bilan.body", { S: F.si(b.entropie, "J·mol⁻¹·K⁻¹", { sig: 3 }), U: F.si(b.energie, "J·mol⁻¹", { sig: 2 }),
    C: F.si(b.saut, "J·mol⁻¹·K⁻¹", { sig: 3 }), Tc: F.kelvin(TC) });
})();

/* ---------- l'effet magnétocalorique du modèle, pour le nickel ---------- */
(() => {
  const sb = $("sb"), sm = $("sm");
  function draw() {
    const B = +sb.value, tt = +sm.value, r = M.magnetocalorique(tt * TC, TC, MU_NI, B / C.mu0);
    $("sbr").innerHTML = F.si(B, "T", { sig: 2 });
    $("smr").textContent = F.num(tt, 3);
    $("vmm").textContent = F.num(r.m1, 3);
    $("fmm").innerHTML = t("mc.f.m", { m0: F.num(r.m0, 3) });
    $("vdt").innerHTML = F.si(r.dT, "K", { sig: 2 });
    $("fdt").innerHTML = t("mc.f.dt", { T: F.kelvin(tt * TC) });
  }
  sb.oninput = sm.oninput = draw; draw();
})();

/* ---------- l'aimantation à saturation du fer ---------- */
(() => {
  const rho = 7874, Mmol = 0.055845, N = rho * C.N_A / Mmol, J2 = C.mu0 * 2 * C.mu_B * N;
  $("fer").innerHTML = t("fer.body", { N: F.sci(N, 3), J2: F.si(J2, "T", { sig: 3 }), Jm: F.si(M.FER_JSAT, "T", { sig: 3 }),
    e: F.num(100 * (M.FER_JSAT - J2) / J2, 2), n: F.num(M.momentParAtome(M.FER_JSAT, rho, Mmol), 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["weisspiccard", 1917, "experiment"], ["onsager", 1944, "idea"], ["wilson", 1971, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["hamr"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["paires", "b"], ["carre", "d"], ["saut", "a"], ["entropie", "c"], ["queue", "b"], ["fer", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 372 });
})();
</script>
