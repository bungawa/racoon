    <p class="validite" data-i18n-html="val.colonne"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><msub><mi>V</mi><mi>I</mi></msub><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mi>∞</mi></msubsup><mi>E</mi><mspace width="0.2em"/><mi>d</mi><mi>z</mi><mo>=</mo><mi>j</mi><msub><mi>R</mi><mi>c</mi></msub><mo>,</mo><mspace width="1em"/><msub><mi>R</mi><mi>c</mi></msub><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mi>∞</mi></msubsup><mfrac><mrow><mi>d</mi><mi>z</mi></mrow><mrow><mi>σ</mi><mo>(</mo><mi>z</mi><mo>)</mo></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.rc"></p>
    <figure>
      <svg class="fig" id="col" viewBox="0 0 640 340" role="img" data-i18n-attr="aria-label:col.aria"></svg>
      <div class="legend"><span class="c-warn" data-i18n="col.legend.E"></span><span class="c-label-2" data-i18n="col.legend.sigma"></span><span class="c-label" data-i18n="col.legend.exp"></span></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="Hsl" data-i18n="col.H"></label><output id="Hread" for="Hsl"></output></div>
          <input id="Hsl" type="range" min="3" max="8" step="0.1" value="5.5"></div>
        <div class="ctl"><div class="row"><label for="hsl" data-i18n="col.h"></label><output id="hread" for="hsl"></output></div>
          <input id="hsl" type="range" min="0" max="3" step="0.05" value="1"></div>
        <div class="ctl"><div class="row"><label for="fsl" data-i18n="col.f"></label><output id="fread" for="fsl"></output></div>

        <div class="stats">

          <div class="stat"><span class="k" data-i18n="col.k.j"></span><span class="v" id="vj"></span><span class="f" id="fj"></span></div>

    <div class="eq"><math display="block"><mi>τ</mi><mo>=</mo><mfrac><mrow><mo>|</mo><mi>Q</mi><mo>|</mo></mrow><mi>I</mi></mfrac><mo>=</mo><mfrac><mrow><msub><mi>ε</mi><mn>0</mn></msub><msub><mi>E</mi><mn>0</mn></msub></mrow><mi>j</mi></mfrac><mo>=</mo><mfrac><msub><mi>ε</mi><mn>0</mn></msub><msub><mi>σ</mi><mn>0</mn></msub></mfrac></math></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/courants-atmospheriques.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>

<script src="/racoon/thermo.js"></script>

<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/statistique.js"></script>
<script src="/racoon/lecons/integration.js"></script>

<script src="/racoon/lecons/physique-fondamentale.js"></script>
<script src="/racoon/lecons/champs-em.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/electrostatique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, e = Constantes.e, R = Constantes.R_E_mean;
/* Small ions near the ground (Handbook of Geophysics, 1985, chap. 20): densities m⁻³, mobilities m²·V⁻¹·s⁻¹; ion pairs made per m³ per s */
const ION = { np: 6e8, nm: 5e8, kp: 1.3e-4, km: 1.6e-4, q: 9.1e6 }, VI = 275e3, E0 = 130;

/* ---------- le système décrit : les petits ions de l'air près du sol ---------- */
const SIGMA0 = Statistique.conductiviteIonique(ION.np, e, ION.kp / e) + Statistique.conductiviteIonique(ION.nm, e, ION.km / e);
(() => {
  const k = (ION.kp + ION.km) / 2, v = k * E0, vie = (ION.np + ION.nm) / 2 / ION.q;
  $("sys1").innerHTML = t("sys1.body", { s: F.sci(SIGMA0, 2), v: F.si(v, "m·s⁻¹", { prefix: "m" }), vie: F.si(vie, "s", { sig: 2 }),
    d: F.si(v * vie, "m", { sig: 2 }), r: F.sci(v * vie / 5500, 1), j: F.si(SIGMA0 * E0, "A·m⁻²", { prefix: "p", sig: 2 }) });
})();

/* ---------- la colonne d'air entre le sol et la haute atmosphère ---------- */
(() => {
  const svg = $("col"), Hs = $("Hsl"), hs = $("hsl"), fs = $("fsl"), zs = Array.from({ length: 401 }, (_, i) => 25e3 * i / 400);
  function draw() {
    const H = 1e3 * Hs.value, h = 1e3 * hs.value, f = +fs.value;
    const c = ES.colonne({ sigmaSol: SIGMA0, H, VI, h, f }), x0 = ES.colonne({ sigmaSol: SIGMA0, H, VI });
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, x: { scale: "log", domain: [0.1, 1e4], label: t("col.x") }, y: { domain: [0, 25], label: t("col.y") } });
    const courbe = (fn, cls) => Plot.el("path", { d: Plot.path(zs.map(z => [x(Math.min(1e4, Math.max(0.1, fn(z)))), y(z / 1e3)])), class: cls }, g);
    courbe(z => x0.champ(z), "stroke thin dash c-label");
    courbe(z => 1e15 * c.sigma(z), "stroke c-label-2");
    courbe(z => c.champ(z), "stroke c-warn");
    if (h > 0) Plot.el("line", { x1: x(0.1), x2: x(1e4), y1: y(h / 1e3), y2: y(h / 1e3), class: "stroke thin dash c-label-2" }, g);
    $("Hread").textContent = F.si(H, "m", { prefix: "k" });
    $("hread").textContent = F.si(h, "m", { prefix: "k" });
    $("fread").textContent = F.num(f, 2);
    $("vE").textContent = F.si(c.Esol, "V·m⁻¹");
    $("fE").textContent = t("col.f.E", { E: F.si(x0.Esol, "V·m⁻¹") });
    $("vj").textContent = F.si(c.j, "A·m⁻²", { prefix: "p" });
    $("fj").textContent = t("col.f.j", { I: F.si(4 * Math.PI * R * R * c.j, "A", { prefix: "k" }) });
    $("vrc").textContent = t("col.rc", { r: F.sci(c.Rc, 2) });
    $("frc").textContent = t("col.f.rc", { p: F.num(100 * c.part(2000), 2) });
  }
  Hs.oninput = hs.oninput = fs.oninput = draw; draw();
})();

/* ---------- la décharge de la Terre ---------- */
(() => {
  const tau = ES.tempsRelaxation(SIGMA0), Q = -ES.chargeTerre(E0).Q;
  $("bilan").innerHTML = t("bilan.body", { tau: F.si(tau, "s", { sig: 2 }), min: F.num(tau / 60, 2), Q: F.sci(Q, 2), tF: F.num(4.5e5 / 1800 / 60, 1),
    P: F.si(VI * 1800, "W", { prefix: "M", sig: 2 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["coulomb", 1785, "experiment"], ["elster", 1899, "experiment"], ["wulf", 1910, "experiment"], ["hess", 1912, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["equipages"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ions", "c"], ["vitesse", "a"], ["meme", "d"], ["altitude", "b"], ["resistance", "c"], ["pollution", "a"], ["decharge", "d"], ["ohm", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 902 });
})();
</script>
