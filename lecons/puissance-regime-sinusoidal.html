<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux;
const U_EFF = 230, F_RESEAU = 50, W = 2 * Math.PI * F_RESEAU;

/* ---------- une charge sur le réseau : u, i, p sur deux périodes ---------- */
(() => {
  const CHARGES = { radiateur: [26.5, 0], moteur: [20, 15], bobine: [2, 40], condensateur: [0.5, -40] };   // R, X in Ω at 50 Hz
  const sr = $("sr"), sx = $("sx"), seg = $("charge");
  let choisi = "moteur";
  function draw() {
    const R = +sr.value, X = +sx.value, Z = Math.hypot(R, X);
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === choisi)));
    $("srv").textContent = F.qty(F.num(R, 3), "Ω"); $("sxv").textContent = F.qty(F.num(X, 3), "Ω");
    const sig = $("signaux"), pw = $("puissance"); sig.innerHTML = ""; pw.innerHTML = "";
    if (!(Z > 0)) { ["vp", "vcos", "vrendue", "fp", "fcos", "frendue"].forEach(id => { $(id).textContent = "–"; }); return; }
    const s = OM.regimeSinusoidal(Cx.c(R, X), U_EFF * Math.SQRT2 / Z, W), T = s.T;
    const ts = Array.from({ length: 401 }, (_, j) => 2 * T * j / 400);
    const A = Plot.axes(sig, { fmt: F, w: 640, h: 180, pad: { l: 56, b: 40 }, x: { domain: [0, 2000 * T], label: t("fig.xaxis") }, y: { domain: [-1.15, 1.15], ticks: 4, label: t("fig.yaxis.n") } });
    Plot.el("line", { x1: A.x(0), x2: A.x(2000 * T), y1: A.y(0), y2: A.y(0), class: "zero" }, A.g);
    Plot.el("path", { d: Plot.path(ts.map(x => [A.x(1000 * x), A.y(s.u(x) / s.U0)])), class: "stroke c-tint" }, A.g);
    Plot.el("path", { d: Plot.path(ts.map(x => [A.x(1000 * x), A.y(s.i(x) / s.I0)])), class: "stroke c-warn" }, A.g);
    const pmax = 1.1 * Math.max(500, s.P + s.S) / 1000, pmin = Math.min(-0.2, 1.1 * (s.P - s.S) / 1000);
    const B = Plot.axes(pw, { fmt: F, w: 640, h: 200, pad: { l: 56, b: 40 }, x: { domain: [0, 2000 * T], label: t("fig.xaxis") }, y: { domain: [pmin, pmax], ticks: 4, label: t("fig.yaxis.p") } });
    Plot.el("line", { x1: B.x(0), x2: B.x(2000 * T), y1: B.y(0), y2: B.y(0), class: "zero" }, B.g);
    Plot.el("line", { x1: B.x(0), x2: B.x(2000 * T), y1: B.y(s.P / 1000), y2: B.y(s.P / 1000), class: "stroke thin dash c-label-2" }, B.g);
    Plot.el("path", { d: Plot.path(ts.map(x => [B.x(1000 * x), B.y(s.p(x) / 1000)])), class: "stroke bold c-ok" }, B.g);
    $("vp").textContent = F.si(s.P, "W");
    $("fp").textContent = t("fig.f.p", { i: F.si(s.Ieff, "A"), s: F.si(s.Ueff * s.Ieff, "V·A") });
    $("vcos").textContent = F.num(s.facteur, 3);
    $("fcos").textContent = t("fig.f.cos", { phi: F.qty(F.num(s.phi * 180 / Math.PI, 3), "°") });
    $("vrendue").textContent = F.si(s.rendue, "J");
    $("frendue").textContent = t("fig.f.rendue", { e: F.si(s.rendue * F_RESEAU, "W") });
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { choisi = b.dataset.c; [sr.value, sx.value] = CHARGES[choisi]; draw(); });
  sr.oninput = sx.oninput = () => { choisi = null; draw(); };
  [sr.value, sx.value] = CHARGES[choisi]; draw();
})();

/* ---------- le système décrit : un radiateur de 2 kW et un moteur de même puissance, sur une ligne de 0,2 Ω ---------- */
(() => {
  const P = 2000, cosphi = 0.8, rLigne = 0.2, c = Constantes.c;    // the supply line, out and back: 0,2 Ω, a round figure for a house
  const R = U_EFF * U_EFF / P, Ieff = P / U_EFF, Im = P / (U_EFF * cosphi);
  const zm = Cx.polar(U_EFF / Im, Math.acos(cosphi)), m = OM.regimeSinusoidal(zm, Im * Math.SQRT2, W);
  $("sys1").innerHTML = t("sys1.body", { P: F.si(P, "W"), U: F.si(U_EFF, "V"), f: F.si(F_RESEAU, "Hz"), R: F.qty(F.num(R, 3), "Ω"), I: F.si(Ieff, "A"),
    lambda: F.si(c / F_RESEAU, "m"), taille: F.sci(30 / (c / F_RESEAU), 1) });
  $("sys2").innerHTML = t("sys2.body", { cos: F.num(cosphi, 2), I: F.si(Im, "A"), R: F.qty(F.num(m.R, 3), "Ω"), X: F.qty(F.num(m.X, 3), "Ω"), Pm: F.si(m.P, "W"),
    r: F.qty(F.num(rLigne, 2), "Ω"), pr: F.si(rLigne * Ieff * Ieff, "W"), pm: F.si(rLigne * Im * Im, "W"), rapport: F.num(1 / (cosphi * cosphi), 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["joule", 1841, "experiment"], ["heaviside", 1886, "idea"], ["steinmetz", 1893, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["reseau", "compteur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["bobine", "c"], ["moyenne", "a"], ["reel", "d"], ["efficace", "b"], ["reactance", "a"], ["cable", "c"], ["negatif", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 225 });
})();
</script>
