<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, DEG = Math.PI / 180;
const MU = { e: Q.muElectron, p: Q.muProton };

/* ---------- the spin, started up along z, precessing about a field tilted by θ in the xz plane ---------- */
(() => {
  const svg = $("fig"), sth = $("sth"), sB = $("sB"), st = $("st"), seg = $("part"), R = 120, c = [180, 165];
  /* oblique view: x toward the reader, y to the right, z up */
  const P = v => [c[0] + R * (v[1] - 0.42 * v[0]), c[1] - R * (v[2] - 0.28 * v[0])];
  let part = "e";
  function draw() {
    const mu = MU[part], b = +sB.value, th = +sth.value * DEG, B = [b * Math.sin(th), 0, b * Math.cos(th)];
    const w = Q.frequencePrecession(mu, b), T = 2 * Math.PI / w, tt = +st.value * T, s = Q.precessionSpin(mu, B, [0, 0, 1], tt);
    svg.innerHTML = "";
    const gl = Plot.el("g", { class: "c-label-2" }, svg);
    Plot.el("circle", { cx: c[0], cy: c[1], r: R, class: "stroke thin", fill: "none" }, gl);
    for (const [v, k] of [[[1.15, 0, 0], "x"], [[0, 1.15, 0], "y"], [[0, 0, 1.15], "z"]]) {
      const [x2, y2] = P(v); Plot.el("line", { x1: c[0], y1: c[1], x2, y2, class: "stroke thin dash" }, gl);
      const e = Plot.el("text", { x: x2 + 4, y: y2 - 4 }, gl); e.textContent = t("fig.ax." + k);
    }
    /* the cone: one full period of the spin's tip */
    const pts = Array.from({ length: 121 }, (_, i) => P(Q.precessionSpin(mu, B, [0, 0, 1], T * i / 120)));
    Plot.el("path", { d: Plot.path(pts), class: "stroke thin" }, gl);
    const u = B.map(x => x / b), [bx, by] = P(u.map(x => 1.1 * x));
    Plot.el("line", { x1: c[0], y1: c[1], x2: bx, y2: by, class: "stroke bold" }, Plot.el("g", { class: "c-warn" }, svg));
    const [sx, sy] = P(s);
    const gs = Plot.el("g", { class: "c-tint" }, svg);
    Plot.el("line", { x1: c[0], y1: c[1], x2: sx, y2: sy, class: "stroke bold" }, gs);
    Plot.el("circle", { cx: sx, cy: sy, r: 5, class: "fill" }, gs);
    $("sthr").textContent = F.num(+sth.value, 0) + " °";
    $("sBr").textContent = F.si(b, "T");
    $("str").textContent = F.si(tt, "s");
    $("vf").textContent = F.si(w / (2 * Math.PI), "Hz");
    $("ff").textContent = t("fig.f.f", { T: F.si(T, "s") });
    $("vs").textContent = "(" + s.map(v => F.num(v, 2)).join(" ; ") + ")";
    $("fs").textContent = t("fig.f.s", { a: F.num(Math.acos(Math.max(-1, Math.min(1, s[0] * u[0] + s[1] * u[1] + s[2] * u[2]))) / DEG, 0) });
    $("vz").textContent = F.num((1 + s[2]) / 2, 3);
    $("fz").textContent = t("fig.f.Pz");
    seg.querySelectorAll("button").forEach(bt => bt.setAttribute("aria-pressed", String(bt.dataset.p === part)));
  }
  seg.querySelectorAll("button").forEach(bt => bt.onclick = () => { part = bt.dataset.p; draw(); });
  sth.oninput = draw; sB.oninput = draw; st.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  const fe = Q.frequencePrecession(Q.muElectron, 1) / (2 * Math.PI), fp = Q.frequencePrecession(Q.muProton, 1) / (2 * Math.PI);
  $("sys").innerHTML = t("sys.body", { fe: F.si(fe, "Hz"), fp: F.si(fp, "Hz"), f15: F.si(1.5 * fp, "Hz"), f3: F.si(3 * fp, "Hz"),
    l: F.si(K.c / (1.5 * fp), "m") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rabi", 1938, "experiment"], ["zavoisky", 1944, "experiment"], ["bloch", 1946, "experiment"], ["lauterbur", 1973, "experiment"], ["nobel", 2003, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["aligne", "a"], ["Bdisparait", "c"], ["precession", "b"], ["angle", "d"], ["irm", "a"], ["ammoniac", "c"], ["signe", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1007 });
})();
</script>
