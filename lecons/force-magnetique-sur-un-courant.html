<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const pressSeg = (seg, attr, val) => seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset[attr] === val)));

/* ---------- un fil de forme quelconque entre A et B, dans un champ normal au plan ---------- */
(() => {
  const svg = $("fil"), P = Plot.el, A = [0, 0], Bp = [0.2, 0], G = 0.2;   // m; gradient: B doubles 0,2 m above the axis
  const sx = Plot.linScale(-0.06, 0.26, 40, 600), sy = Plot.linScale(-0.15, 0.15, 380, 20);
  let forme = "droit", champ = "uniforme";
  const segF = $("forme"), segC = $("champ");
  segF.onclick = e => { const b = e.target.closest("button"); if (!b) return; forme = b.dataset.f; pressSeg(segF, "f", forme); draw(); };
  segC.onclick = e => { const b = e.target.closest("button"); if (!b) return; champ = b.dataset.c; pressSeg(segC, "c", champ); draw(); };
  const isl = $("isl"), bsl = $("bsl");
  function draw() {
    const I = 10 * isl.value / 100, B0 = bsl.value / 100;
    const Bf = champ === "uniforme" ? () => [0, 0, B0] : p => [0, 0, B0 * (1 + p[1] / G)];
    const pts = MagInd.filPlan(forme, A, Bp, 240), r = MagInd.forceFil(I, pts, Bf), ref = MagInd.forceFil(I, MagInd.filPlan("droit", A, Bp, 240), Bf).F;
    svg.innerHTML = "";
    // the field: ⊙ out of the page, denser where B is stronger
    const gc = P("g", { class: "c-label-2" }, svg);
    for (let i = 0; i < 9; i++) for (let j = 0; j < 7; j++) {
      const x = -0.05 + i * 0.038, y = -0.135 + j * 0.045, b = Bf([x, y, 0])[2] / Math.max(B0, 1e-9);
      P("circle", { cx: sx(x), cy: sy(y), r: (2 + 3 * Math.min(b, 2)).toFixed(1), class: "stroke thin" }, gc);
      P("circle", { cx: sx(x), cy: sy(y), r: 1.5, class: "fill" }, gc);
    }
    P("path", { d: Plot.path(pts.map(p => [sx(p[0]), sy(p[1])])), class: "stroke bold" }, P("g", { class: "c-tint" }, svg));
    const gl = P("g", { class: "c-tint" }, svg);
    [[A, "P"], [Bp, "Q"]].forEach(([p, n]) => { P("circle", { cx: sx(p[0]), cy: sy(p[1]), r: 5, class: "fill" }, gl); P("text", { x: sx(p[0]) - 6, y: sy(p[1]) + 22, class: "label" }, gl).textContent = n; });
    const nf = Math.hypot(r.F[0], r.F[1]), nref = Math.hypot(ref[0], ref[1]) || 1, L = 110 * Math.min(nf / nref, 2.5);
    const M = [sx(0.1), sy(0)];
    if (L > 2) Plot.fleche(svg, M, [M[0] + L * r.F[0] / nf, M[1] - L * r.F[1] / nf], { cls: "c-warn" });
    $("iread").textContent = F.si(I, "A"); $("bread").textContent = F.si(B0, "T");
    $("vf").textContent = I > 0 ? F.si(nf, "N") : F.si(0, "N");
    $("vr").textContent = I > 0 && nref > 1e-12 ? F.fix(nf / nref, 3) : "–";
    $("vc").textContent = F.si(Math.abs(r.couple[2]) < 1e-12 ? 0 : r.couple[2], "N·m");
  }
  isl.oninput = bsl.oninput = draw; pressSeg(segF, "f", forme); pressSeg(segC, "c", champ); draw();
})();

/* ---------- le système décrit : soulever un fil de cuivre ---------- */
(() => {
  const S = 1e-6, rhoCu = 8960, B = 0.1, Bt = 5e-5, lam = rhoCu * S * Constantes.g0, Ilev = lam / B;
  const v = MagInd.vitesseDerive(Ilev, S, MagInd.PORTEURS.cuivre, Constantes.e);
  $("sys").innerHTML = t("sys.body", { lam: F.si(lam, "N·m⁻¹"), I: F.si(Ilev, "A"), terre: F.sci(Bt / B, 2), v: F.si(v, "m·s⁻¹"), vB: F.si(v * B, "V·m⁻¹") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["oersted", 1820, "experiment"], ["ampere", 1820, "experiment"], ["faraday", 1821, "experiment"], ["hall", 1879, "experiment"], ["cgpm", 1948, "idea"], ["kibble", 1975, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["kibble", "moteurs"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["norme", "a"], ["porteurs", "c"], ["forme", "b"], ["boucle", "d"], ["leviter", "a"], ["parallele", "b"], ["ampere", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 133 });
})();
</script>
