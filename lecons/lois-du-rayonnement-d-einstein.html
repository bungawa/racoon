<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, { c } = Constantes, sl = $("l");
const omega = () => 2 * Math.PI * c / 10 ** +sl.value;          // the slider holds log10 of the wavelength in metres

/* ---------- émission induite contre émission spontanée ---------- */
(() => {
  const svg = $("courbe"), st = $("t"), L0 = 1e-7, L1 = 1e-1;
  function draw() {
    const T = +st.value, lam = 10 ** +sl.value, E = S.einstein(omega(), T);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { scale: "log", domain: [L0, L1], label: t("sim.x") }, y: { scale: "log", domain: [1e-12, 1e8], label: t("sim.y") } });
    const p = [];
    for (let i = 0; i <= 240; i++) { const l = L0 * (L1 / L0) ** (i / 240), nb = S.einstein(2 * Math.PI * c / l, T).nbar; if (nb >= 1e-12) p.push([o.x(l), o.y(Math.min(nb, 1e8))]); }
    Plot.el("path", { d: Plot.path(p), class: "stroke bold c-tint" }, o.g);
    Plot.el("line", { x1: o.x(L0), x2: o.x(L1), y1: o.y(1), y2: o.y(1), class: "stroke dash c-label-2" }, o.g);
    if (E.nbar >= 1e-12) Plot.el("circle", { cx: o.x(lam), cy: o.y(Math.min(E.nbar, 1e8)), r: 5, class: "fill c-warn" }, o.g);
    $("lv").textContent = F.si(lam, "m");
    $("tv").innerHTML = F.kelvin(T);
    $("vx").textContent = F.num(E.x, 3);
    $("vpop").textContent = E.pop < 1e-3 ? F.sci(E.pop, 2) : F.num(E.pop, 3);
    $("vn").textContent = E.nbar < 1e-3 || E.nbar > 1e4 ? F.sci(E.nbar, 2) : F.num(E.nbar, 3);
    $("fn").textContent = t(E.nbar < 1 ? "sim.f.n.spont" : "sim.f.n.induit");
    inversion();
  }
  st.oninput = draw; sl.oninput = draw; draw();
})();

/* ---------- l'inversion de population ---------- */
function inversion() {
  const r = +$("r").value, Te = S.temperatureDe(r, omega());
  $("rv").textContent = F.fix(r, 2);
  $("vg").textContent = F.fix(r - 1, 2);
  $("fg").textContent = t(r > 1 ? "inv.f.g.ampli" : r < 1 ? "inv.f.g.abs" : "inv.f.g.zero");
  $("vt").textContent = !isFinite(Te) ? "∞" : F.qty(Math.abs(Te) < 1e5 ? F.num(Te, 3) : F.sci(Te, 2), "K");
}
$("r").oninput = inversion;

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["einstein", 1917, "idea"], ["ladenburg", 1928, "experiment"], ["maser", 1954, "experiment"], ["maiman", 1960, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["laser", "horloge"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["trois", "d"], ["egaux", "a"], ["lampe", "c"], ["radio", "b"], ["inversion", "a"], ["cube", "c"], ["deux", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 425 });
})();
</script>
