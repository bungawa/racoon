<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, R = Constantes.R;
const pc = (x, n = 2) => F.num(100 * x, n) + F.NB + "%";

const kB = Constantes.k_B;
/* ---------- températures d'inversion : mesure, états correspondants ---------- */
(() => {
  $("tab").innerHTML = ["N2", "Ar", "H2", "He"].map(g => { const Ti = S.inversion0(g), C = S.CRITIQUE[g] || S.CRITIQUE_LEGERS[g];
    return `<div><span class="k">${t("gaz." + g)}</span><span>${t("tab.ligne", { ti: F.kelvin(Ti), r: F.fix(Ti / C.Tc, 2), tv: F.qty(F.num(6.75 * C.Tc, 3), "K") })}</span></div>`; }).join("");
  $("linde").innerHTML = [[300, 14], [300, 19], [200, 19]].map(([T, i]) =>
    `<div><span class="k">${F.kelvin(T)}</span><span>${t("linde.ligne", { p: F.si(S.ISO_P[i] * 1e6, "Pa", { sig: 2 }), y: pc(S.linde(T, i)) })}</span></div>`).join("");
})();

/* ---------- μ_JT(T) sous 0,1 MPa : mesure, B mesuré, Van der Waals ---------- */
(() => {
  const svg = $("mu"), sg = $("gaz"), st = $("tk"), memo = {};
  function courbes(g) {                                              // once per gas: the Lennard-Jones fit on B, then both curves
    if (memo[g]) return memo[g];
    const tab = S.JT0[g], T0 = tab[0][0], T1 = tab[tab.length - 1][0], f = S.ajusteLJ(g), p = { eps: f.eps, sigma: f.sigma }, G = S.vdwCritique(g), lj = [], vw = [];
    for (let i = 0; i <= 100; i++) { const x = T0 * Math.pow(T1 / T0, i / 100), cp = S.jt0(g, x).Cp;
      lj.push([x, S.muViriel(S.bLJ(x, p), S.tdbLJ(x, p), cp) * 1e6]); vw.push([x, S.muVdw0(G, x, cp) * 1e6]); }
    return memo[g] = { tab, T0, T1, p, G, lj, vw, tiLJ: S.inversionLJ(p) };
  }
  function draw() {
    const g = sg.value, c = courbes(g), T = c.T0 * Math.pow(c.T1 / c.T0, +st.value / 100), lo = -2, hi = 1.1 * c.tab[0][1];
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44, l: 56 },
      x: { domain: [0, 1.05 * c.T1], label: t("mu.x") }, y: { domain: [lo, hi], label: t("mu.y") } });
    Plot.el("line", { x1: o.x(0), x2: o.x(1.05 * c.T1), y1: o.y(0), y2: o.y(0), class: "stroke thin c-label-2" }, o.g);
    const px = a => a.filter(q => q[1] >= lo && q[1] <= hi).map(q => [o.x(q[0]), o.y(q[1])]);
    Plot.el("path", { d: Plot.path(px(c.vw)), class: "stroke dash c-warn" }, o.g);
    Plot.el("path", { d: Plot.path(px(c.lj)), class: "stroke c-tint" }, o.g);
    c.tab.forEach(r => Plot.el("circle", { cx: o.x(r[0]), cy: o.y(r[1]), r: 4, class: "fill c-ok" }, o.g));
    Plot.el("line", { x1: o.x(T), x2: o.x(T), y1: o.y(lo), y2: o.y(hi), class: "stroke thin c-label" }, o.g);
    const j = S.jt0(g, T), tdb = S.tdbLJ(T, c.p), b = S.bLJ(T, c.p), ml = S.muViriel(b, tdb, j.Cp), mv = S.muVdw0(c.G, T, j.Cp), u = x => F.qty(F.num(x * 1e6, 3), "K·MPa⁻¹");
    const ec = x => Math.abs(j.mu) > 2e-8 ? t("mu.f.ecart", { e: pc(x / j.mu - 1) }) : t("mu.f.inv");
    $("tkv").innerHTML = F.kelvin(T);
    $("vmes").textContent = u(j.mu); $("vlj").textContent = u(ml); $("flj").textContent = ec(ml);
    $("vvdw").textContent = u(mv); $("fvdw").textContent = ec(mv);
    $("vti").innerHTML = S.INVERSION_0[g] ? F.kelvin(S.INVERSION_0[g]) : t("mu.ti.hors");
    $("fti").textContent = t("mu.f.ti", { lj: F.qty(F.num(c.tiLJ, 3), "K"), vdw: F.qty(F.num(S.inversionVdw(c.G), 3), "K") });
    $("vaeff").textContent = F.qty(F.num(R * T * tdb, 3), "Pa·m⁶·mol⁻²"); $("faeff").textContent = t("mu.f.aeff", { a: F.num(c.G.a, 3) });
    $("sys").innerHTML = t("sys.inner", { gaz: t("gaz." + g), T: F.kelvin(T), ekt: F.fix(c.p.eps / (kB * T), 2), bp: F.sci(Math.abs(b) * 1e5 / (R * T), 2),
      avis: t(T < c.tiLJ ? "sys.attraction" : "sys.repulsion") });
  }
  sg.onchange = st.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["vdw", 1873, "idea"], ["linde", 1895, "use"], ["onnes", 1901, "idea"], ["helium", 1908, "experiment"], ["jones", 1924, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["air", "tables"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "b"], ["signe", "c"], ["inversion", "a"], ["rapport", "d"], ["co2", "b"], ["linde", "a"], ["helium", "c"], ["pression", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 9103 });
})();
</script>
