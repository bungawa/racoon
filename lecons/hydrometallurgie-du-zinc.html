<main class="page">
  <header class="head">

    <h1 data-i18n="h1"></h1>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>

    <div class="list keyed" id="etapes"></div>
    <div class="eq" data-i18n-html="eq.grillage"></div>
    <p class="validite" data-i18n-html="val.grillage"></p>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq" data-i18n-html="eq.cementation"></div>
    <p class="validite" data-i18n-html="val.cementation"></p>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="eq" data-i18n-html="eq.electrolyse"></div>

    <figure class="chart">
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="u" data-i18n="fig.u"></label><output id="uv" for="u"></output></div>
            <input id="u" type="range" min="2.0" max="4.5" step="0.05" value="3.4"></div>
          <div class="ctl"><div class="row"><label for="eta" data-i18n="fig.eta"></label><output id="etav" for="eta"></output></div>
            <input id="eta" type="range" min="50" max="100" step="1" value="90"></div>
          <div class="ctl"><div class="row"><label for="j" data-i18n="fig.j"></label><output id="jv" for="j"></output></div>
            <input id="j" type="range" min="100" max="800" step="10" value="500"></div>
        </div>
      </div>
      <svg class="fig" id="bilan" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-ok" data-i18n="fig.leg.thermo"></span><span class="c-warn" data-i18n="fig.leg.pertes"></span><span class="c-ko" data-i18n="fig.leg.h2"></span></div>
      <div class="stats">
        <div class="stat"><span class="k" data-i18n="fig.k.w"></span><span class="v" id="vw"></span><span class="f" id="fw"></span></div>
        <div class="stat"><span class="k" data-i18n="fig.k.r"></span><span class="v" id="vr"></span><span class="f" data-i18n="fig.f.r"></span></div>
        <div class="stat"><span class="k" data-i18n="fig.k.m"></span><span class="v" id="vm"></span><span class="f" data-i18n="fig.f.m"></span></div>

    <div class="box rem"><b data-i18n="s4.rem.title"></b>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/hydrometallurgie-du-zinc.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/chim-solutions.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions;
const keyed = (id, k, ids) => { const txt = textOf(k, ids); $(id).innerHTML = ids.map(i => `<div><span class="k">${txt[i].k}</span><span>${txt[i].v}</span></div>`).join(""); };
keyed("etapes", "s2.etapes", ["grillage", "lixiviation", "fer", "cementation", "electrolyse"]);

/* ---------- §4 : bilan d'une cuve d'électrolyse ---------- */
(() => {
  const M = 65.38e-3;                                       // kg·mol⁻¹, zinc (CIAAW, standard atomic weight 65,38)
  const E0 = c => C.COUPLES.find(x => x.id === c).E0, U0 = E0("o2") - E0("zn");   // 1,99 V: O₂/H₂O minus Zn²⁺/Zn
  function draw() {
    const U = +$("u").value, eta = +$("eta").value / 100, j = +$("j").value, svg = $("bilan");
    $("uv").textContent = F.qty(F.fix(U, 2), "V"); $("etav").textContent = F.qty(F.fix(100 * eta, 0), "%");
    $("jv").textContent = F.qty(F.fix(j, 0), "A·m⁻²");
    /* one square metre of cathode during one hour: charge j·3 600 C */
    const q = j * 3600, m = C.masseFaraday(j, 3600, M, 2, eta), w = U * q / m;      // J·kg⁻¹
    $("vw").textContent = F.qty(F.fix(w / 1e6, 1), "MJ·kg⁻¹");
    $("fw").textContent = t("fig.f.w", { kwh: F.fix(w / 3.6e6, 1) });
    $("vr").textContent = F.qty(F.fix(100 * U0 * eta / U, 0), "%");
    $("vm").textContent = F.qty(F.fix(m, 2), "kg·m⁻²·h⁻¹");
    /* the energy of one kilogram, split: thermodynamic minimum, losses (overpotentials, resistance), hydrogen */
    svg.innerHTML = "";
    const wMin = U0 * 2 * C.F / M, wFar = U * 2 * C.F / M, top = 30;
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 150, pad: { l: 16, b: 40, t: 10 }, x: { domain: [0, top], label: t("fig.ax.x") },
      y: { domain: [0, 1], ticks: 1, fmt: () => "" } });
    const bande = (a, b, cls) => Plot.el("rect", { x: x(a / 1e6), y: y(0.8), width: Math.max(0, x(b / 1e6) - x(a / 1e6)), height: y(0.2) - y(0.8), class: cls }, g);
    bande(0, wMin, "fill c-ok"); bande(wMin, wFar, "fill c-warn"); bande(wFar, Math.min(w, top * 1e6), "fill c-ko");
  }
  $("u").oninput = $("eta").oninput = $("j").oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["champion", 1738, "use"], ["trail", 1916, "use"], ["risdon", 1917, "use"], ["mines", 2024, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["galva", "acide", "cadmium"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["vapeur", "b"], ["grillage", "a"], ["fer", "d"], ["cementation", "c"], ["ordre", "a"], ["tension", "b"], ["surtension", "c"], ["energie", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1916 });
})();
</script>
