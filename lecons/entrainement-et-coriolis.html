<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, Rf = Referentiel;
const path = Plot.path;
const MS = "m·s⁻¹", MS2 = "m·s⁻²", RAYON = 2, R0 = 0.5;          // turntable of radius 2 m; the puck starts 0,5 m from the axis

/* ---------- le système décrit, chiffré ---------- */
(() => {
  const w = 2 * Math.PI / 6, v = 1, m = 0.1, a = Rf.inertie(m, [0, 0, w], [1, 0, 0], [v, 0, 0]);
  const air = Dyna.coussin({ m, S: Math.PI * 0.035 * 0.035, e: 1e-4, v, a: 2 * w * v, duree: 3 });
  const terre = Rf.coriolisCompte({ v, a: 2 * w * v, duree: 0, lat: Math.PI / 2 });
  $("sys").innerHTML = t("sys.body", { w: F.num(w, 3), fie: F.si(Math.hypot(...a.fie), "N", { sig: 3 }), fic: F.si(Math.hypot(...a.fic), "N", { sig: 3 }),
    poids: F.si(m * Dyna.G, "N", { sig: 3 }), cor: F.sci(terre.rapport, 1), frot: F.sci(air.rapport, 1) });
})();

/* ---------- prédire la trajectoire dans le référentiel tournant ---------- */
(() => {
  const svg = $("pred"), K = 70, C = [320, 170], wsl = $("wsl"), vsl = $("vsl"), cent = $("cent"), cor = $("cor");
  const scr = p => [C[0] + K * p[0], C[1] - K * p[1]];
  const arrow = (g, A, B, cls) => Plot.fleche(g, A, B, { cls, tete: 7, ouverte: true, min: 3 });
  function draw() {
    const w = +wsl.value, v = +vsl.value, r0 = [R0, 0], v0 = [v, 0];
    /* the truth: straight line in R, turned into R′; stop when it leaves the disc */
    const va = [v, w * R0], A = va[0] ** 2 + va[1] ** 2, B = 2 * R0 * va[0], tEnd = Math.min((-B + Math.sqrt(B * B - 4 * A * (R0 * R0 - RAYON * RAYON))) / (2 * A), 8);
    const vrai = Rf.lancer({ omega: w, r0, v0, relative: true, duree: tEnd, n: 300 }).tournant;
    const mod = Rf.tournant({ omega: w, r0, v0, duree: tEnd, h: tEnd / 3000, entrainement: cent.checked, coriolis: cor.checked });
    const pts = mod.x.filter((_, i) => i % 10 === 0 || i === mod.x.length - 1), clip = pts.filter(p => Math.hypot(p[0], p[1]) <= 2.4 * RAYON);
    svg.innerHTML = "";
    const g = P("g", {}, svg);
    P("circle", { cx: C[0], cy: C[1], r: K * RAYON, class: "stroke c-label-2" }, g);
    P("circle", { cx: C[0], cy: C[1], r: 3, class: "fill c-label-2" }, g);
    P("path", { d: path(vrai.map(scr)), class: "stroke dash c-label-2" }, g);
    P("path", { d: path(clip.map(scr)), class: "stroke c-tint" }, g);
    /* the inertial forces per unit mass at three moments of the true motion */
    [0, 0.3, 0.6].forEach(f => {
      const i = Math.round(f * (mod.x.length - 1)), x = mod.x[i], vv = mod.v[i]; if (Math.hypot(x[0], x[1]) > RAYON) return;
      const at = scr(x), S = 0.35;
      if (cent.checked) arrow(g, at, scr([x[0] + S * w * w * x[0], x[1] + S * w * w * x[1]]), "c-warn");
      if (cor.checked) arrow(g, at, scr([x[0] + S * 2 * w * vv[1], x[1] - S * 2 * w * vv[0]]), "c-warn");
      P("circle", { cx: at[0], cy: at[1], r: 5, class: "fill c-tint" }, g);
    });
    const end = mod.x[mod.x.length - 1], want = vrai[vrai.length - 1], e = Math.hypot(end[0] - want[0], end[1] - want[1]);
    $("wread").textContent = t("pred.w.v", { w: F.qty(F.num(w, 3), "rad·s⁻¹"), T: F.si(2 * Math.PI / w, "s", { sig: 3, prefix: "" }) });
    $("vread").textContent = F.qty(F.num(v, 3), MS);
    $("vecart").textContent = F.si(e, "m", { sig: 2, prefix: e < 0.01 ? "m" : "" });
    $("fecart").textContent = t(e < 0.01 ? "pred.f.juste" : "pred.f.faux", { t: F.si(tEnd, "s", { sig: 2, prefix: "" }) });
    $("vrap").textContent = F.num(Rf.rapport(w, R0, v), 2);
  }
  [wsl, vsl].forEach(s => s.oninput = draw); [cent, cor].forEach(c => c.onchange = draw);
  draw();
})();

/* ---------- le seau qui tourne : équilibre relatif ---------- */
(() => {
  const svg = $("seau"), sl = $("ssl"), RS = 0.15, HMAX = 0.3;
  function draw() {
    const n = +sl.value, w = 2 * Math.PI * n, h = Rf.surfaceLibre(w, RS);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { b: 44, l: 52 }, x: { domain: [-RS, RS], label: t("seau.x") }, y: { domain: [0, HMAX], label: t("seau.y") } });
    /* same volume as a still surface 10 cm high: the centre sinks by h/2 */
    const z0 = 0.10 - h / 2, pts = Array.from({ length: 61 }, (_, i) => { const r = -RS + 2 * RS * i / 60; return [o.x(r), o.y(Math.max(0, z0 + Rf.surfaceLibre(w, r)))]; });
    P("path", { d: path(pts), class: "curve" }, o.g);
    P("line", { x1: o.x(-RS), x2: o.x(RS), y1: o.y(0.10), y2: o.y(0.10), class: "ref" }, o.g);
    $("sread").textContent = t("seau.n.v", { n: F.num(n, 3), w: F.qty(F.num(w, 3), "rad·s⁻¹") });
    $("vh").textContent = F.si(h, "m", { sig: 3, prefix: "m" });
  }
  sl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["huygens", 1659, "idea"], ["coriolis", 1835, "idea"], ["foucault", 1851, "experiment"], ["debitmetre", 1977, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["debitmetre", "gyrometre", "centrifugeuse"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["auteur", "c"], ["travail", "a"], ["sens", "b"], ["sol", "d"], ["pose", "a"], ["seau", "c"], ["choix", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2202 });
})();
</script>
