<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, c = Constantes.c;

/* ---------- un laboratoire fermé : un palet lancé sur une table, vu de la table ---------- */
(() => {
  const svg = $("table"), sp = $("sp"), seg = $("mode"), r0 = [-0.9, -0.3], w0 = [1, 0.3], T = 1.8;   // 2 m table, 1 m·s⁻¹ launch
  let mode = "translation";
  /* the slider's meaning in each mode: V/c from 0 to 0,99 ; A from 0 to 1 m·s⁻² ; Ω from 0 to 1 rad·s⁻¹ */
  const param = () => { const s = +sp.value / 100;
    return mode === "translation" ? { V: 0.99 * s * c } : mode === "acceleration" ? { A: s } : mode === "rotation" ? { Omega: s } : {}; };
  function draw() {
    const p = Object.assign({ mode, r0, w0 }, param());
    /* the path until T, or until the puck leaves the table (2 m wide, from y = \u22120,65 to 0,75 m) */
    const sur = q => Math.abs(q.x) <= 1 && q.y >= -0.65 && q.y <= 0.75, pts = [];
    for (let i = 0; i <= 180; i++) { const q = R.palet(p, i * T / 180); if (!sur(q)) break; pts.push(Object.assign(q, { t: i * T / 180 })); }
    const ref = pts.map(q => R.palet({ mode: "repos", r0, w0 }, q.t)), end = pts[pts.length - 1], endRef = ref[ref.length - 1];
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 420, pad: { l: 52, b: 44 }, x: { domain: [-1.2, 1.2], label: t("fig.xaxis") }, y: { domain: [-0.75, 0.85], label: t("fig.yaxis") } });
    Plot.el("rect", { x: P.x(-1), y: P.y(0.75), width: P.x(1) - P.x(-1), height: P.y(-0.65) - P.y(0.75), class: "stroke thin c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(ref.map(q => [P.x(q.x), P.y(q.y)])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(pts.map(q => [P.x(q.x), P.y(q.y)])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(r0[0]), cy: P.y(r0[1]), r: 4, class: "dot" }, P.g);
    Plot.el("circle", { cx: P.x(end.x), cy: P.y(end.y), r: 6, class: "dot" }, P.g);
    /* what an observer on the table measures: the deviation, the inertial force per kg at launch, a pendulum's plane */
    /* below 1 µm the deviation is the rounding of the computation: (V + 1 m·s⁻¹) is stored to ~10⁻⁸ m·s⁻¹ at V ≈ c */
    const e = Math.hypot(end.x - endRef.x, end.y - endRef.y), ecart = e < 1e-6 ? 0 : e;
    const W = p.Omega || 0, force = mode === "acceleration" ? p.A : mode === "rotation" ? Math.hypot(W * W * r0[0] + 2 * W * w0[1], W * W * r0[1] - 2 * W * w0[0]) : 0;   // Ω² r0 − 2 Ω ∧ w0, Ω along +z
    $("vecart").textContent = F.si(ecart, "m", ecart > 1e-9 ? {} : { prefix: "" });
    $("fecart").textContent = t(e > 0 && ecart === 0 ? "fig.f.arrondi" : "fig.f.ecart", { t: F.si(end.t, "s"), e: F.si(e, "m") });
    $("vforce").textContent = F.si(force, "N·kg⁻¹", force > 1e-9 ? {} : { prefix: "" });
    $("fforce").textContent = t(mode === "rotation" ? "fig.f.coriolis" : "fig.f.force");
    $("vpend").textContent = F.qty(F.num(W * end.t * 180 / Math.PI, 3), "°");
    $("fpend").textContent = t("fig.f.pendule", { t: F.si(end.t, "s") });
    $("spl").textContent = t("fig.p." + mode);
    $("spr").textContent = mode === "translation" ? F.num(p.V / c, 3) + "\u00a0c" : mode === "acceleration" ? F.si(p.A, "m·s⁻²", { prefix: "" })
      : mode === "rotation" ? F.si(p.Omega, "rad·s⁻¹", { prefix: "" }) : "–";
    sp.disabled = mode === "repos";
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; draw(); });
  sp.oninput = draw; draw();
})();

/* ---------- le système décrit : un laboratoire posé sur la Terre ---------- */
(() => {
  const an = 365.25 * 86400, v = 2 * Math.PI * Constantes.au / an, W = Constantes.Omega_E, lat = 48.85 * Math.PI / 180;
  const f = R.foucault(W, lat), dev = W * Math.sin(lat) * 1 * 2 * 2;                  // Coriolis: Ω sin λ v t², 1 m·s⁻¹ for 2 s
  $("sys1").innerHTML = t("sys1.body", { v: F.si(v, "m·s⁻¹"), b2: F.sci((v / c) ** 2, 2), W: F.sci(W, 3) + "\u00a0rad·s⁻¹",
    P: F.qty(F.num(f.periode / 3600, 3), "h"), d: F.si(dev, "m") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["newton", 1687, "idea"], ["foucault", 1851, "experiment"], ["mach", 1883, "idea"], ["poincare", 1904, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gyrolaser"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["enonce", "c"], ["relatif", "a"], ["experience", "d"], ["rotation", "b"], ["foucault", "c"], ["mach", "a"], ["faux", "d"], ["symetrie", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 161 });
})();
</script>
