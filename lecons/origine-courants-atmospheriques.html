      <div class="legend"><span class="c-warn" data-i18n="diu.legend.modele"></span><span class="c-label" data-i18n="diu.legend.mesure"></span></div>

        <div class="ctl"><div class="row"><label for="waf" data-i18n="diu.afrique"></label><output id="raf" for="waf"></output></div>

        <div class="ctl"><div class="row"><label for="was" data-i18n="diu.asie"></label><output id="ras" for="was"></output></div>

        <div class="ctl"><div class="row"><label for="woc" data-i18n="diu.ocean"></label><output id="roc" for="woc"></output></div>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
const heure = h => { const m = Math.round(((h % 24) + 24) % 24 * 60) % 1440; return t("diu.heure", { h: Math.floor(m / 60), m: String(m % 60).padStart(2, "0") }); };

/* ---------- l'activité orageuse en temps universel ---------- */
(() => {
  const svg = $("diu"), S = { am: $("wam"), af: $("waf"), as: $("was"), oc: $("woc") };
  function draw() {
    const w = [+S.am.value, +S.af.value, +S.as.value], oc = +S.oc.value;
    if (!(w[0] + w[1] + w[2] > 0)) w[0] = 0.05;
    const d = ES.diurne({ regions: ES.CHEMINEES.map((c, i) => ({ lon: c.lon, poids: w[i] })), ocean: oc, largeur: 3.5 });
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, 24], ticks: 8, label: t("diu.x") }, y: { domain: [0.4, 1.8], label: t("diu.y") } });
    [0.85, 1.15].forEach(v => Plot.el("line", { x1: x(0), x2: x(24), y1: y(v), y2: y(v), class: "stroke thin dash c-label" }, g));
    [4, 19].forEach(h => Plot.el("line", { x1: x(h), x2: x(h), y1: y(0.4), y2: y(1.8), class: "stroke thin dash c-label" }, g));
    Plot.el("path", { d: Plot.path(d.heures.map((h, i) => [x(h), y(Math.min(1.8, Math.max(0.4, d.valeurs[i])))])), class: "stroke c-warn" }, g);
    Plot.el("circle", { cx: x(d.max.tu), cy: y(Math.min(1.8, d.max.v)), r: 4, class: "fill c-warn" }, g);
    $("ram").textContent = F.num(w[0], 3); $("raf").textContent = F.num(w[1], 3); $("ras").textContent = F.num(w[2], 3);
    $("roc").textContent = F.qty(F.num(100 * oc, 2), "%");
    $("vmax").textContent = heure(d.max.tu);
    $("vmin").textContent = heure(d.min.tu);
    $("vec").textContent = "±" + F.qty(F.num(100 * d.ecart, 2), "%");
  }
  Object.values(S).forEach(s => { s.oninput = draw; }); draw();
})();

/* ---------- le bilan : les orages et les nuages électrisés, d'après des survols (Mach, Blakeslee et Bateman, 2010) ---------- */
(() => {
  const B = [[1100, 1.0], [390, 1.6], [330, 0.13], [530, 0.39]];
  const Itot = B.reduce((s, [n, i]) => s + n * i, 0), N = B.reduce((s, [n]) => s + n, 0), orages = B[0][1] * B[0][0] + B[1][1] * B[1][0];
  $("bilan").innerHTML = t("bilan.body", { N: F.num(N, 4), I: F.si(Itot, "A", { prefix: "k", sig: 2 }), p: F.num(100 * orages / Itot, 2) });
  const duree = 1, parJour = 4e4, eclairs = 44;   /* Feynman: about 40 000 thunderstorms a day, a cell lives half an hour to an hour; OTD: 44 flashes per second */
  $("sys1").innerHTML = t("sys1.body", { n: F.num(parJour * duree / 24, 2), f: F.num(60 * eclairs / (B[0][0] + B[1][0]), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wilson", 1920, "idea"], ["mauchly", 1921, "experiment"], ["whipple", 1929, "idea"], ["otd", 2003, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["vostok"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tu", "b"], ["couche", "d"], ["eclair", "a"], ["pointes", "c"], ["bilan", "b"], ["simultanes", "a"], ["modele", "d"], ["delai", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 903 });
})();
</script>
