<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, A = 22.86e-3, B = 10.16e-3, FC = M.guideRect(A, B, 1e9).fc;   // the guide of « Le guide d'onde rectangulaire »

/* ---------- le système décrit : le même guide à 3 GHz ---------- */
(() => {
  const g = M.guideRect(A, B, 3e9);
  $("sys1").innerHTML = t("sys1.body", { a: F.si(A, "m", { prefix: "m" }), fc: F.si(FC, "Hz", { sig: 4 }), l0: F.qty(F.num(100 * g.lambda0, 3), "cm"),
    k: F.qty(F.num(g.kPrime, 3), "m⁻¹"), p: F.si(g.profondeur, "m", { prefix: "m" }), db: F.qty(F.num(g.dBparMetre / 100, 3), "dB·cm⁻¹") });
})();

/* ---------- E_y le long du guide, au-dessus et au-dessous de la coupure ---------- */
(() => {
  const trace = $("trace"), sr = $("sr"), L = 0.1, NT = 6;
  function draw() {
    const r = +sr.value, g = M.guideRect(A, B, r * FC), T = 1 / g.f;
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 250, pad: { l: 56, b: 44 }, x: { domain: [0, 100 * L], label: t("fig.xaxis") }, y: { domain: [-1.1, 1.1], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(100 * L), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const zs = Array.from({ length: 401 }, (_, i) => i * L / 400);
    for (let j = 1; j < NT; j++) Plot.el("path", { d: Plot.path(zs.map(z => [P.x(100 * z), P.y(g.champ(A / 2, z, j * T / (2 * NT)).Ey)])), class: "stroke thin c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(zs.map(z => [P.x(100 * z), P.y(g.champ(A / 2, z, 0).Ey)])), class: "curve" }, P.g);
    const env = z => g.propage ? 1 : Math.exp(-g.kPrime * z);
    [1, -1].forEach(s => Plot.el("path", { d: Plot.path(zs.map(z => [P.x(100 * z), P.y(s * env(z))])), class: "stroke dash c-warn" }, P.g));
    $("srr").textContent = F.num(r, 3) + " · " + F.si(g.f, "Hz");
    if (g.propage) {
      $("vk").textContent = F.qty(F.num(g.kz, 3), "m⁻¹"); $("fk").textContent = t("fig.f.kz");
      $("vl").textContent = F.si(g.lambdaG, "m", { prefix: "m" }); $("fl").textContent = t("fig.f.lg");
      $("vdb").textContent = t("fig.v.db", { v: F.num(0, 1) }); $("fdb").textContent = t("fig.f.dbp");
    } else {
      $("vk").textContent = F.qty(F.num(g.kPrime, 3), "m⁻¹"); $("fk").textContent = t("fig.f.kp");
      $("vl").textContent = F.si(g.profondeur, "m", { prefix: "m" }); $("fl").textContent = t("fig.f.p", { v: F.num(g.profondeur * Math.PI / A, 3) });
      $("vdb").textContent = t("fig.v.db", { v: F.num(g.dBparMetre / 100, 3) }); $("fdb").textContent = t("fig.f.dbe");
    }
  }
  sr.oninput = draw; draw();
})();

/* ---------- un seul champ dans le guide ; une grille de ventilation ---------- */
(() => {
  const m = M.modesRect(A, B, 20e9), w = 3e-3, h = M.guideRect(w, w, 1e9), ep = 12e-3;
  $("sys2").innerHTML = t("sys2.body", { f1: F.si(m[0].fc, "Hz", { sig: 3 }), f2: F.si(m[1].fc, "Hz", { sig: 3 }), f3: F.si(m[2].fc, "Hz", { sig: 3 }),
    w: F.si(w, "m", { prefix: "m" }), fc: F.si(h.fc, "Hz"), dbw: F.qty(F.num(h.dBparMetre * w, 3), "dB"), ep: F.si(ep, "m", { prefix: "m" }),
    db: F.qty(F.num(h.dBparMetre * ep, 3), "dB") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rayleigh", 1897, "idea"], ["eau", 1932, "experiment"], ["annonce", 1936, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["grille"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dessous", "c"], ["valeur", "a"], ["loin", "d"], ["signe", "b"], ["epaisseur", "a"], ["pres", "c"], ["eau", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 243 });
})();
</script>
