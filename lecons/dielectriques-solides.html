<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-electrostatique" data-i18n="monde.electrostatique"></a><span class="aux">›</span><a href="/racoon/etape?id=dielectriques-reels" data-i18n="etape.dielectriques-reels"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-em" href="/racoon/atlas?piste=em" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/clausius-mossotti" data-i18n="tag.prereq"></a>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><msub><mi>σ</mi><mi data-i18n="eq.nette"></mi></msub><mo>(</mo><mi>t</mi><mo>)</mo><mo>=</mo><mi>P</mi><mspace width="0.2em"/><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi><mo>/</mo><mi>τ</mi></mrow></msup></math></div>
    <p class="validite" data-i18n-html="val.neutre"></p>
    <figure>
      <svg class="fig" id="elec" viewBox="0 0 640 300" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.E"></span><span class="c-warn" data-i18n="fig.legend.claq"></span></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="sP" data-i18n="ctl.P"></label><output id="rP" for="sP"></output></div>
          <input id="sP" type="range" min="-7" max="-1" step="0.05" value="-2"></div>
        <div class="ctl"><div class="row"><label for="sd" data-i18n="ctl.d"></label><output id="rd" for="sd"></output></div>
          <input id="sd" type="range" min="-1" max="1" step="0.02" value="0"></div>
        <div class="ctl"><div class="row"><label for="st" data-i18n="ctl.t"></label><output id="rt" for="st"></output></div>
          <input id="st" type="range" min="0" max="25" step="0.1" value="0"></div>
        <div class="ctl"><div class="row"><label for="sv" data-i18n="ctl.v"></label><output id="rv" for="sv"></output></div>
          <input id="sv" type="range" min="-1" max="1" step="0.01" value="0"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="k.sigma"></span><span class="v" id="vs"></span><span class="f" id="fs"></span></div>
          <div class="stat"><span class="k" data-i18n="k.E"></span><span class="v" id="vE"></span><span class="f" id="fE"></span></div>
          <div class="stat"><span class="k" data-i18n="k.int"></span><span class="v" id="vi"></span><span class="f" data-i18n="f.int"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys1"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq"><math display="block"><mi mathvariant="normal">Δ</mi><mi>Q</mi><mo>=</mo><mi>A</mi><mspace width="0.2em"/><mi mathvariant="normal">Δ</mi><mi>P</mi></math></div>
    <p class="validite" data-i18n-html="val.dq"></p>
    <p data-i18n-html="s2.p3"></p>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>

    <p data-i18n-html="s3.p2"></p>
  </section>
  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>

  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>

    <div id="quiz"></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/dielectriques-solides.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/physique-fondamentale.js"></script>
<script src="/racoon/lecons/champs-em.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/electrostatique.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
/* ---------- un électret en forme de disque : son champ, sa neutralisation, son réveil ---------- */
(() => {
  const svg = $("elec"), S = { P: $("sP"), d: $("sd"), t: $("st"), v: $("sv") }, a = 0.01, CLAQ = 3e6;     /* m, V·m⁻¹ */
  const champ = (s, d, z) => ES.disquesAxe([{ sigma: s, a, z: d / 2 }, { sigma: -s, a, z: -d / 2 }], d / 2 + z);
  function draw() {
    const P = Math.pow(10, +S.P.value), d = Math.pow(10, +S.d.value) * 1e-3, tt = +S.t.value, v = +S.v.value / 100;
    const s = P * (Math.exp(-tt) + v), E1 = champ(s, d, 1e-3);
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, 40], label: t("fig.x") }, y: { domain: [1e-2, 1e10], scale: "log", label: t("fig.y") } });
    Plot.el("line", { x1: A.x(0), x2: A.x(40), y1: A.y(CLAQ), y2: A.y(CLAQ), class: "stroke dash c-warn" }, A.g);
    const pts = Array.from({ length: 200 }, (_, i) => 0.2 + i * 0.2).map(z => [z, Math.abs(champ(s, d, z * 1e-3))]).filter(p => p[1] >= 1e-2 && p[1] <= 1e10);
    if (pts.length > 1) Plot.el("path", { d: Plot.path(pts.map(p => [A.x(p[0]), A.y(p[1])])), class: "stroke bold c-tint" }, A.g);
    $("rP").textContent = F.qty(F.sci(P, 2), "C·m⁻²"); $("rd").textContent = F.si(d, "m", { sig: 2 });
    $("rt").textContent = F.num(tt, 3) + " τ"; $("rv").textContent = F.qty((v > 0 ? "+" : "") + F.num(v * 100, 2), "%");
    $("vs").textContent = F.qty(F.sci(s, 2), "C·m⁻²");
    $("fs").textContent = t("f.sigma", { p: F.sci(Math.abs(s) / P, 1) });
    $("vE").textContent = F.qty(F.sci(Math.abs(E1), 2), "V·m⁻¹");
    $("fE").textContent = t(Math.abs(E1) > CLAQ ? "f.E.claque" : Math.abs(E1) > 100 ? "f.E.mesurable" : "f.E.noye");
    $("vi").textContent = F.qty(F.sci(P / ES.EPS0, 2), "V·m⁻¹");
  }
  Object.values(S).forEach(z => { z.oninput = draw; }); draw();
  const P0 = Constantes.e * 1e-11 / Math.pow(4e-10, 3);
  $("sys1").innerHTML = t("sys1.body", { P: F.num(P0, 2), E: F.sci(P0 / ES.EPS0, 2), r: F.sci(P0 / ES.EPS0 / CLAQ, 1), s: F.sci(ES.EPS0 * CLAQ, 2), f: F.sci(ES.EPS0 * CLAQ / P0, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["curie", 1880, "experiment"], ["langevin", 1917, "use"], ["eguchi", 1919, "experiment"], ["sessler", 1962, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["micro", "presence"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["aimant", "b"], ["cache", "a"], ["champ", "c"], ["pyro", "d"], ["charge", "a"], ["piezo", "b"], ["ionique", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1106 });
})();
</script>
