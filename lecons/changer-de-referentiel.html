<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, Rf = Referentiel;
const path = Plot.path;
const MS = "m·s⁻¹", MS2 = "m·s⁻²", RAYON = 2;                     // turntable of radius 2 m

/* ---------- le système décrit, chiffré ---------- */
(() => {
  const w = 2 * Math.PI / 6, v = 1, a = 2 * w * v, terre = Rf.coriolisCompte({ v, a, duree: 0, lat: Math.PI / 2 });
  const air = Dyna.coussin({ m: 0.1, S: Math.PI * 0.035 * 0.035, e: 1e-4, v, a, duree: 3 });
  $("sys").innerHTML = t("sys.body", { w: F.num(w, 3), cor: F.sci(terre.rapport, 1), ac: F.num(a, 3), ent: F.num(w * w * RAYON, 3),
    frot: F.sci(air.rapport, 1), perte: F.num(air.perte * 100, 2) });
})();

/* ---------- le manège vu des deux référentiels ---------- */
(() => {
  const svg = $("manege"), wsl = $("wsl"), vsl = $("vsl"), tsl = $("tsl"), K = 62, C = [[165, 170], [475, 170]];
  let mode = "centre", anim = 0;
  const arrow = (g, A, B, cls) => Plot.fleche(g, A, B, { cls, tete: 7, ouverte: true, min: 3 });
  const scr = (c, p) => [c[0] + K * p[0], c[1] - K * p[1]];       // metres → screen, y up
  const launch = () => {
    const w = +wsl.value, v = +vsl.value;
    /* from the centre: thrown along x at v relative to the turntable; « lâché » : at rest on it at (R/2, 0), then let go */
    const o = mode === "centre" ? { r0: [0, 0], v0: [v, 0] } : { r0: [RAYON / 2, 0], v0: [0, 0] };
    const va = Rf.lancer(Object.assign({ omega: w, relative: true, duree: 1, n: 1 }, o)).v0;
    /* leaves the disc when |r0 + va t| = R */
    const A = va[0] ** 2 + va[1] ** 2, B = 2 * (o.r0[0] * va[0] + o.r0[1] * va[1]), Cc = o.r0[0] ** 2 + o.r0[1] ** 2 - RAYON * RAYON;
    const tEnd = A > 0 ? (-B + Math.sqrt(B * B - 4 * A * Cc)) / (2 * A) : 10;
    return { w, o, va, tEnd: Math.min(Math.max(tEnd, 0.05), 10) };
  };
  function draw() {
    const L = launch(), tt = +tsl.value * L.tEnd, run = Rf.lancer({ omega: L.w, r0: L.o.r0, v0: L.va, duree: L.tEnd, n: 300 });
    svg.innerHTML = "";
    ["man.sol", "man.tournant"].forEach((key, k) => {
      const g = P("g", {}, svg), c = C[k], ang = k === 0 ? L.w * tt : 0;
      P("circle", { cx: c[0], cy: c[1], r: K * RAYON, class: "stroke c-label-2" }, g);
      for (let j = 0; j < 4; j++) {                                   // spokes painted on the turntable
        const a = ang + j * Math.PI / 2; P("line", { x1: c[0], y1: c[1], x2: c[0] + K * RAYON * Math.cos(a), y2: c[1] - K * RAYON * Math.sin(a), class: "stroke thin dash c-label-2" }, g);
      }
      P("text", { x: c[0], y: 18, "text-anchor": "middle" }, g).textContent = t(key);
      const pts = (k === 0 ? run.sol : run.tournant).map(p => scr(c, p));
      P("path", { d: path(pts), class: "stroke c-tint" }, g);
      const p = [L.o.r0[0] + L.va[0] * tt, L.o.r0[1] + L.va[1] * tt], q = k === 0 ? p : Rf.versTournant(p, L.w, tt);
      /* velocities at t, in the components of this frame: ground va; vr = va − ω ez × p, turned into R′ for the right panel */
      const vr = [L.va[0] + L.w * p[1], L.va[1] - L.w * p[0]], ve = [-L.w * p[1], L.w * p[0]];
      const show = v => k === 0 ? v : Rf.versTournant(v, L.w, tt), S = 0.5;
      const at = scr(c, q);
      arrow(g, at, scr(c, [q[0] + S * show(vr)[0], q[1] + S * show(vr)[1]]), "c-warn");
      arrow(g, at, scr(c, [q[0] + S * show(ve)[0], q[1] + S * show(ve)[1]]), "c-label-2");
      P("circle", { cx: at[0], cy: at[1], r: 7, class: "fill c-tint" }, g);
    });
    const p = [L.o.r0[0] + L.va[0] * tt, L.o.r0[1] + L.va[1] * tt], vr = [L.va[0] + L.w * p[1], L.va[1] - L.w * p[0]];
    const c = Rf.composition([0, 0, L.w], [p[0], p[1], 0], [vr[0], vr[1], 0]), n = v => Math.hypot(...v);
    wread(L.w); $("vread").textContent = mode === "centre" ? F.qty(F.num(+vsl.value, 3), MS) : t("man.v.lache");
    $("tread").textContent = F.si(tt, "s", { sig: 3, prefix: "" });
    $("vvr").textContent = F.qty(F.num(n(vr), 3), MS); $("vve").textContent = F.qty(F.num(n(c.ve), 3), MS);
    $("vae").textContent = F.qty(F.num(n(c.ae), 3), MS2); $("vac").textContent = F.qty(F.num(n(c.ac), 3), MS2);
    $("fae").textContent = t("man.f.ae", { r: F.num(Math.hypot(...p), 3) });
    $("fac").textContent = n(c.ae) > 1e-9 ? t("man.f.ac", { r: F.num(n(c.ac) / n(c.ae), 2) }) : t("man.f.ac0");
  }
  const wread = w => { $("wread").textContent = w > 0 ? t("man.w.v", { w: F.qty(F.num(w, 3), "rad·s⁻¹"), T: F.si(2 * Math.PI / w, "s", { sig: 3, prefix: "" }) }) : t("man.w.zero"); };
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    mode = b.dataset.v; document.querySelectorAll("[data-v]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    vsl.disabled = mode === "bord"; draw();
  });
  [wsl, vsl, tsl].forEach(s => s.oninput = () => { cancelAnimationFrame(anim); draw(); });
  $("go").onclick = () => {
    cancelAnimationFrame(anim); const t0 = performance.now(), D = Math.min(launch().tEnd, 6) * 1000;
    const step = now => { const f = Math.min(1, (now - t0) / D); tsl.value = f; draw(); if (f < 1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step);
  };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["copernic", 1543, "idea"], ["galilee", 1632, "idea"], ["coriolis", 1832, "idea"], ["itrf", 2022, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gnss", "plateforme"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["referentiel", "b"], ["translation", "c"], ["coincident", "a"], ["lache", "d"], ["coriolisZero", "b"], ["deux", "a"], ["rapport", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2101 });
})();
</script>
