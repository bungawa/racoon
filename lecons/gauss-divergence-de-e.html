<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9;
const nC = x => F.si(x, "C", { prefix: "n" });

/* ---------- Gauss pour trois charges : un cube que l'on promène (charges dans le plan z = 0, cube centré dans ce plan) ---------- */
(() => {
  const svg = $("gauss"), asl = $("asl"), O = { W: 640, H: 400, x0: -0.08, x1: 0.08, y0: -0.05, y1: 0.05 };
  const Q = [{ q: 2 * NC, x: -0.04, y: 0.01 }, { q: -1 * NC, x: 0.03, y: 0.02 }, { q: 1 * NC, x: 0.01, y: -0.025 }];
  let cen = [-0.02, 0.0], c;
  function draw() {
    const a = asl.value / 1000, h = a / 2, C3 = [cen[0], cen[1], 0];
    const flux = Q.reduce((s, q) => s + ES.fluxCubeExact(q.q, [q.x, q.y, 0], C3, a).total, 0);
    const dedans = Q.filter(q => Math.abs(q.x - cen[0]) < h && Math.abs(q.y - cen[1]) < h), qint = dedans.reduce((s, q) => s + q.q, 0);
    c = CarteChamp.carte(svg, O);
    CarteChamp.fleches(c, p => (Q.some(s => Math.hypot(p[0] - s.x, p[1] - s.y) < 0.006) ? [NaN, NaN] : ES.champ(Q, p)), 20, 12, { cls: "c-label-2", unitaire: true, lmax: 11 });
    const g = c.layer("c-tint");
    Plot.el("rect", { x: c.sx(cen[0] - h), y: c.sy(cen[1] + h), width: c.sx(cen[0] + h) - c.sx(cen[0] - h), height: c.sy(cen[1] - h) - c.sy(cen[1] + h), class: "stroke bold" }, g);
    Q.forEach((s, i) => CarteChamp.point(c, [s.x, s.y], 4 + 2.5 * Math.abs(s.q) / NC, s.q > 0 ? "c-warn" : "c-label", t("ga.nom", { i: i + 1 }), -14));
    $("aread").textContent = F.si(a, "m");
    $("vflux").textContent = Number.isFinite(flux) ? F.si(flux, "V·m") : "–";
    $("veps").textContent = Number.isFinite(flux) ? nC(flux * ES.EPS0) : "–";
    $("vqint").textContent = nC(qint);
    $("fqint").textContent = Number.isFinite(flux) ? t("ga.f.qint", { n: dedans.length }) : t("ga.f.sur");
  }
  CarteChamp.survol(svg, () => c, p => { cen = [Math.max(O.x0, Math.min(O.x1, p[0])), Math.max(O.y0, Math.min(O.y1, p[1]))]; draw(); });
  asl.oninput = draw; draw();
})();

/* ---------- divergence : flux d'un petit cube sur son volume, dans une boule de densité ρ0 (1 − r²/R²) ---------- */
(() => {
  const svg = $("div"), rsl = $("rsl"), lsl = $("lsl"), Qb = NC, R = 0.05, B = ES.BOULES.parabolique(Qb, R);
  const E = p => ES.champRadial(B.charge, p), U = 1e5, YMAX = 7, RS = Array.from({ length: 49 }, (_, i) => 0.08 * i / 48);
  function draw() {
    const r = rsl.value / 1000, a = Math.pow(10, +lsl.value), p = [r, 0, 0];
    const cube = ES.fluxSurVolume(E, p, a), rho = B.rho(r) / ES.EPS0, der = AnaVec.divergence(E, [r, 1e-4, 0]);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [0, 0.08], label: t("dv.x"), fmt: v => F.num(100 * v, 2) }, y: { domain: [-1, YMAX], label: t("dv.y"), fmt: v => F.num(v, 1) } });
    const fine = Array.from({ length: 161 }, (_, i) => 0.08 * i / 160);
    Plot.el("path", { d: Plot.path(fine.map(u => [x(u), y(B.rho(u) / ES.EPS0 / U)])), class: "stroke dash" }, Plot.el("g", { class: "c-label-2" }, g));
    const pts = RS.map(u => [x(u), y(Math.max(-1, Math.min(YMAX, ES.fluxSurVolume(E, [u, 0, 0], a) / U)))]);
    const gc = Plot.el("g", { class: "c-tint" }, g);
    Plot.el("path", { d: Plot.path(pts), class: "stroke" }, gc);
    Plot.el("line", { x1: x(R), x2: x(R), y1: y(-1), y2: y(YMAX), class: "stroke thin dash c-label-2" }, g);
    const gp = Plot.el("g", { class: "c-ok" }, g);
    Plot.el("circle", { cx: x(r), cy: y(Math.max(-1, Math.min(YMAX, cube / U))), r: 5, class: "fill" }, gp);
    const gap = rho > 0 ? Math.abs(cube / rho - 1) : NaN;
    $("rread").textContent = F.si(r, "m");
    $("lread").textContent = F.si(a, "m");
    $("vcube").textContent = F.si(cube, "V·m⁻²");
    $("fcube").textContent = rho > 0 ? t("dv.f.cube", { e: gap < 1e-3 ? F.sci(gap, 1) : F.qty(F.num(100 * gap, 2), "%") }) : t("dv.f.dehors");
    $("vrho").textContent = F.si(rho, "V·m⁻²");
    $("vder").textContent = F.si(der, "V·m⁻²");
  }
  rsl.oninput = lsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ostrogradski", 1826, "idea"], ["green", 1828, "idea"], ["gauss", 1839, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["semi", "mesure"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["somme", "c"], ["cube", "a"], ["neutre", "d"], ["mesure", "b"], ["vide", "b"], ["unite", "a"], ["petit", "c"], ["exposant", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 46 });
})();
</script>
