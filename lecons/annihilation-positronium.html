<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, DEG = Math.PI / 180;

/* ---------- two linear polarizers on the two photons: P = sin²(φ1 − φ2)/2, and 2 000 pairs drawn at random ---------- */
(() => {
  const svg = $("courbe"), s1 = $("s1"), s2 = $("s2");
  let graine = 1803, tirage = null;
  const alea = () => { graine = (graine * 1664525 + 1013904223) % 4294967296; return graine / 4294967296; };
  function tirer() {
    const N = 2000, d = (+s1.value - +s2.value) * DEG;
    let c = 0, un = 0;
    for (let i = 0; i < N; i++) { const p1 = alea() < 0.5; if (p1) { un++; if (alea() < Math.sin(d) ** 2) c++; } }
    tirage = { d: +s1.value - +s2.value, N, c, un };
  }
  function draw() {
    const d = +s1.value - +s2.value, r = Q.positroniumPolariseurs(+s1.value * DEG, +s2.value * DEG);
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 56 },
      x: { domain: [-180, 180], label: t("fig.x"), fmt: v => F.num(v, 3) + "°" }, y: { domain: [0, 0.55], label: t("fig.y") } });
    const c = [];
    for (let i = -180; i <= 180; i++) c.push([ax.x(i), ax.y(Q.positroniumPolariseurs(i * DEG, 0).coincidence)]);
    Plot.el("path", { d: Plot.path(c), class: "stroke bold c-tint" }, ax.g);
    Plot.el("circle", { cx: ax.x(d), cy: ax.y(r.coincidence), r: 5, class: "fill c-tint" }, ax.g);
    if (tirage && tirage.d === d) Plot.el("rect", { x: ax.x(d) - 5, y: ax.y(tirage.c / tirage.N) - 5, width: 10, height: 10, class: "fill c-warn" }, ax.g);
    $("s1r").textContent = F.num(+s1.value, 3) + "°";
    $("s2r").textContent = F.num(+s2.value, 3) + "°";
    $("vc").textContent = F.fix(r.coincidence, 3);
    $("fc").textContent = tirage && tirage.d === d ? t("fig.f.tirage", { c: tirage.c, n: F.num(tirage.N, 4) }) : t("fig.f.pasTirage");
    $("vk").textContent = F.fix(r.conditionnelle, 3);
    $("fk").textContent = t("fig.f.cond");
  }
  $("tirer").onclick = () => { tirer(); draw(); };
  s1.oninput = s2.oninput = draw; draw();
})();

/* ---------- the system described: two lifetimes, one selection rule ---------- */
(() => {
  const tp = 0.12e-9, to = 142.05e-9, mc2 = Constantes.m_e * Constantes.c ** 2 / Constantes.e / 1e3;
  $("sys1").innerHTML = t("sys1.body", { tp: F.si(tp, "s"), to: F.si(to, "s"), r: F.num(to / tp, 2) });
  $("sys2").innerHTML = t("sys2.body", { e: F.qty(F.num(mc2, 3), "keV"), b: F.sci(6.8e-3 / mc2, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mohorovicic", 1934, "idea"], ["wheeler", 1946, "idea"], ["wu", 1950, "experiment"], ["deutsch", 1951, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tep"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "b"], ["trois", "d"], ["parite", "a"], ["croises", "c"], ["paralleles", "b"], ["un", "a"], ["vie", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1803 });
})();
</script>
