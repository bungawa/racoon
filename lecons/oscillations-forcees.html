<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §21-5 : réponse forcée — amplitude contre ω/ω₀, et mouvement depuis le repos ---------- */
(() => {
  const K = 20, M = 0.2, W0 = Osc.pulsation(K, M), F0 = 0.05, f = F0 / M, XS = F0 / K, Q = 30;   // ω₀ = 10 rad·s⁻¹, F₀/k = 2,5 mm (spring taut up to Q = 39)
  const T0 = 2 * Math.PI / W0, TEND = 8 * T0, N = 4000, H = TEND / N;
  const damped = r => f / Math.sqrt((W0 * W0 * (1 - r * r)) ** 2 + (W0 * W0 * r / Q) ** 2);   // amplitude with a fluid friction of quality factor Q
  const RS = Array.from({ length: 581 }, (_, i) => 0.1 + 2.9 * i / 580).filter(r => Math.abs(r - 1) > 1e-9);
  function clip(svg, id, o, x0, x1, y0, y1) { const c = Plot.el("clipPath", { id }, svg); Plot.el("rect", { x: o.x(x0), y: o.y(y1), width: o.x(x1) - o.x(x0), height: o.y(y0) - o.y(y1) }, c); return Plot.el("g", { "clip-path": `url(#${id})` }, o.g); }
  function upd() {
    const r = +$("r").value, w = r * W0, res = Math.abs(r - 1) < 1e-9;
    /* amplitude of the steady response against ω/ω₀ */
    let svg = $("rep"); svg.innerHTML = "";
    let o = Plot.axes(svg, { fmt: F, w: 320, h: 280, pad: { b: 44, l: 52 }, x: { domain: [0, 3], label: t("rep.xaxis") }, y: { scale: "log", domain: [1e-4, 1], label: t("rep.yaxis") } });
    let g = clip(svg, "repclip", o, 0, 3, 1e-4, 1);
    const cap = v => Math.min(Math.max(v, 1e-5), 10);
    Plot.el("path", { d: path(RS.filter(q => q < 1).map(q => [o.x(q), o.y(cap(Math.abs(f / (W0 * W0 * (1 - q * q)))))])), class: "curve" }, g);
    Plot.el("path", { d: path(RS.filter(q => q > 1).map(q => [o.x(q), o.y(cap(Math.abs(f / (W0 * W0 * (1 - q * q)))))])), class: "curve" }, g);
    Plot.el("path", { d: path(RS.map(q => [o.x(q), o.y(damped(q))])), class: "ref" }, g);
    Plot.el("line", { x1: o.x(1), x2: o.x(1), y1: o.y(1e-4), y2: o.y(1), class: "stroke thin dash c-label-2" }, g);
    Plot.el("circle", { cx: o.x(r), cy: o.y(res ? 1 : cap(Math.abs(f / (W0 * W0 - w * w)))), r: 5, class: "dot" }, g);
    /* motion from rest, step by step, with the steady response or the resonance envelope, and the force (arbitrary scale) */
    const run = Integ.run("leapfrog", Osc.force(W0, w, f).a, { t: 0, x: [0], v: [0] }, H, N, { every: 4 });
    const big = Math.max(...run.x.map(x => Math.abs(x[0]))) * 100 * 1.15;
    svg = $("trace"); svg.innerHTML = "";
    o = Plot.axes(svg, { fmt: F, w: 320, h: 280, pad: { b: 44, l: 52 }, x: { domain: [0, TEND], label: t("trace.xaxis") }, y: { domain: [-big, big], label: t("trace.yaxis") } });
    g = clip(svg, "traceclip", o, 0, TEND, -big, big);
    Plot.el("path", { d: path(run.t.map(tt => [o.x(tt), o.y(0.9 * big * Math.cos(w * tt))])), class: "stroke thin c-label-2" }, g);
    if (res) [1, -1].forEach(s => Plot.el("path", { d: path(run.t.map(tt => [o.x(tt), o.y(s * 100 * f * tt / (2 * W0))])), class: "ref" }, g));
    else { const R = Osc.reponse(W0, w, f); Plot.el("path", { d: path(run.t.map(tt => [o.x(tt), o.y(100 * R.x(tt))])), class: "ref" }, g); }
    Plot.el("path", { d: path(run.t.map((tt, k) => [o.x(tt), o.y(100 * run.x[k][0])])), class: "curve" }, g);
    /* readouts */
    $("rv").textContent = t("fo.rv", { r: F.fix(r, 2), w: F.qty(F.num(w, 3), "rad·s⁻¹") });
    if (res) {
      $("vC").textContent = "∞"; $("fC").textContent = t("fo.f.Cres", { v: F.si(f / (2 * W0), "m·s⁻¹") });
      $("vph").textContent = F.qty("π/2", "rad"); $("fph").textContent = t("fo.f.ph.res");
    } else {
      const R = Osc.reponse(W0, w, f);
      $("vC").textContent = F.si(R.amplitude, "m"); $("fC").textContent = t("fo.f.C", { n: F.num(R.amplitude / XS, 3) });
      $("vph").textContent = R.retard === 0 ? "0" : F.qty("π", "rad"); $("fph").textContent = t(R.retard === 0 ? "fo.f.ph.0" : "fo.f.ph.pi");
    }
    $("vmax").textContent = F.si(Math.max(...run.x.map(x => Math.abs(x[0]))), "m");
  }
  $("r").oninput = upd; upd();
})();

/* ---------- ce qui limite l'amplitude ---------- */
(() => { const IDS = ["frottement", "lineaire", "air"]; keyed($("limites"), t("limites.tag"), IDS, textOf("limites.items", IDS)); })();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["galilee", 1638, "idea"], ["broughton", 1831, "experiment"], ["millennium", 2000, "experiment"], ["reouverture", 2002, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["isolation", "amortisseur"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["lent", "c"], ["rapide", "a"], ["frequence", "b"], ["double", "d"], ["resonance", "a"], ["limite", "c"], ["isolation", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 215 });
})();
</script>
