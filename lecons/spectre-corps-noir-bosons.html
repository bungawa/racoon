<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, K = Constantes;
const nb = v => (v >= 1e4 || (v > 0 && v < 1e-3) ? F.sci(v, 2) : F.num(v, 3));

/* ---------- one photon state and its atoms: n(τ) from an empty and from a crowded box ---------- */
(() => {
  const svg = $("relax"), sx = $("sx"), seg = $("emission");
  let stim = true;
  const xDe = () => 0.05 * Math.pow(200, +sx.value);                   // x = ħω/k_BT from 0,05 to 10
  function draw() {
    const x = xDe(), nbar = Q.occupationPhotons(x, stim), r = Q.tauxPhotons(0, x, stim);
    const g = stim ? r.Ng - r.Ne : r.Ng, T1 = 5 / g;                      // five relaxation times
    const plein = Math.max(2 * nbar, 1), ymax = 1.15 * plein;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 56 },
      x: { domain: [0, T1], label: t("fig.ax.tau") }, y: { domain: [0, ymax], label: t("fig.ax.n") } });
    const courbe = (n0, cls) => { const pts = [];
      for (let i = 0; i <= 200; i++) { const tau = T1 * i / 200; pts.push([o.x(tau), o.y(Q.relaxationPhotons(n0, x, tau, stim))]); }
      Plot.el("path", { d: Plot.path(pts), class: "stroke bold " + cls }, o.g); };
    Plot.el("line", { x1: o.x(0), x2: o.x(T1), y1: o.y(nbar), y2: o.y(nbar), class: "stroke thin dash c-label-2" }, o.g);
    courbe(0, "c-tint"); courbe(plein, "c-warn");
    $("sxv").textContent = F.num(x, 3);
    $("vpop").textContent = nb(Math.exp(-x));
    $("vnbar").textContent = nb(nbar);
    $("fnbar").textContent = t(stim ? "fig.f.bose" : "fig.f.wien", { b: nb(Q.occupationPhotons(x, true)), w: nb(Q.occupationPhotons(x, false)) });
    $("vstim").textContent = stim ? nb(nbar) : "0";
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.s === "1") === stim)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { stim = b.dataset.s === "1"; draw(); });
  sx.oninput = draw; draw();
})();

/* ---------- counting the standing waves of a cube, one by one, against (4.42) ---------- */
(() => {
  const KL = [10, 30, 100, 300];
  $("modes").innerHTML = KL.map(kL => { const a = Q.modesCube(kL), b = Q.modesContinu(kL);
    return `<div><span class="k">${t("modes.k", { kL: F.num(kL, 3) })}</span><span>${t("modes.v", { a: F.num(a, 9), b: F.num(Math.round(b), 9), r: F.num(100 * (1 - a / b), 2) })}</span></div>`; }).join("");
})();

/* ---------- the reduced spectrum: bosons, spontaneous emission only, classical ---------- */
(() => {
  const svg = $("spectre"), X1 = 12, Y1 = 2.5;
  const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 56 },
    x: { domain: [0, X1], label: t("spec.ax.x") }, y: { domain: [0, Y1], label: t("spec.ax.f"), fmt: v => F.fix(v, 1) } });
  const courbe = (loi, cls) => { const pts = [];
    for (let i = 1; i <= 400; i++) { const x = X1 * i / 400, f = Q.spectreReduit(x, loi); if (f <= Y1) pts.push([o.x(x), o.y(f)]); }
    Plot.el("path", { d: Plot.path(pts), class: cls }, o.g); };
  courbe("rayleigh", "stroke c-warn"); courbe("wien", "stroke dash c-label-2"); courbe("planck", "stroke bold c-tint");
})();

/* ---------- the system described: how many photons per state, here and there ---------- */
(() => {
  const CAS = [["soleil", 500e-9, 5772], ["piece", 10e-6, 300], ["fond", 1e-3, 2.725], ["lampe", 500e-9, 300]];
  const txt = textOf("sys.items", CAS.map(c => c[0]));
  $("sys").innerHTML = CAS.map(([id, l, T]) => { const x = K.h * K.c / (l * K.k_B * T), n = Q.occupationPhotons(x);
    return `<div><span class="k">${txt[id].k}</span><span>${t("sys.v", { l: F.si(l, "m", { sig: 2 }), T: F.qty(F.num(T, 4), "K"), x: x > 50 ? F.num(x, 2) : F.num(x, 3), n: nb(n) })} ${txt[id].v}</span></div>`; }).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["planck1", 1900, "idea"], ["planck2", 1900, "idea"], ["bose", 1924, "idea"], ["cobe", 1990, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["laser"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["equilibre", "b"], ["plusun", "d"], ["wien", "a"], ["oscillateur", "c"], ["polar", "b"], ["boite", "a"], ["soleil", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 445 });
})();
</script>
