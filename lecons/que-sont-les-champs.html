<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Que sont les champs ?</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-mecanique" data-i18n="monde.mecanique"></a><span class="aux">›</span><a href="/racoon/etape?id=champs-em" data-i18n="etape.champs-em"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-em" href="/racoon/atlas?piste=em" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/lois-de-l-electromagnetisme" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mi>Δ</mi><mi>t</mi><mo>=</mo><mfrac><mi>L</mi><mi>c</mi></mfrac></math></div>
    <p class="validite" data-i18n-html="val.retard"></p>
    <figure>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="Lsl" data-i18n="re.L"></label><output id="Lread" for="Lsl"></output></div>
            <input id="Lsl" type="range" min="-2" max="12" step="0.5" value="0"></div>
          <div class="ctl"><div class="row"><label for="tsl" data-i18n="re.t"></label><output id="tread" for="tsl"></output></div>
            <input id="tsl" type="range" min="-12" max="2" step="0.5" value="-3"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="re.k.retard"></span><span class="v" id="vret"></span><span class="f" data-i18n="re.f.retard"></span></div>
          <div class="stat"><span class="k" data-i18n-html="re.k.nombre"></span><span class="v" id="vnb"></span><span class="f" id="fnb"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="re.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="s1.rem.title"></b>
      <p data-i18n-html="s1.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <p data-i18n-html="s2.p2"></p>
    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="Isl" data-i18n="fi.I"></label><output id="Iread" for="Isl"></output></div>
          <input id="Isl" type="range" min="-1" max="2" step="0.25" value="0"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fi.k.v"></span><span class="v" id="vv"></span><span class="f" id="fv"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fi.k.fm"></span><span class="v" id="vfm"></span><span class="f" data-i18n="fi.f.fm"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fi.k.fe"></span><span class="v" id="vfe"></span><span class="f" data-i18n="fi.f.fe"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fi.k.r"></span><span class="v" id="vr"></span><span class="f" id="fr"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fi.caption"></figcaption>
    </figure>
    <div class="eq"><math display="block"><mfrac><msub><mi>F</mi><mi>m</mi></msub><msub><mi>F</mi><mi>e</mi></msub></mfrac><mo>=</mo><mfrac><msup><mi>v</mi><mn>2</mn></msup><msup><mi>c</mi><mn>2</mn></msup></mfrac></math></div>
    <p class="validite" data-i18n-html="val.rapport"></p>
    <p data-i18n-html="s2.p3"></p>
    <div class="box prop"><b data-i18n="s2.prop.title"></b>
      <p data-i18n-html="s2.prop.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/que-sont-les-champs.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/physique-fondamentale.js"></script>
<script src="/racoon/lecons/champs-em.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const len = x => x < 1e3 ? F.si(x, "m") : x < 1e9 ? F.si(x / 1e3, "km", { prefix: "" }) : F.qty(F.sci(x, 2), "m");
const dur = s => s < 1 ? F.si(s, "s") : F.si(s, "s", { prefix: "" });

/* ---------- délai de propagation et nombre L/(c Δt) ---------- */
(() => {
  const Lsl = $("Lsl"), tsl = $("tsl");
  function upd() {
    const L = 10 ** +Lsl.value, dt = 10 ** +tsl.value, n = ChampsEM.instantaneite(L, dt);
    $("Lread").textContent = len(L);
    $("tread").textContent = dur(dt);
    $("vret").textContent = dur(ChampsEM.retard(L));
    $("vnb").textContent = n < 1e-3 || n >= 1e4 ? F.sci(n, 2) : F.num(n, 2);
    $("fnb").textContent = t(n < 0.01 ? "re.f.inst" : n < 1 ? "re.f.limite" : "re.f.retarde");
  }
  Lsl.oninput = tsl.oninput = upd; upd();
})();

/* ---------- deux fils de cuivre : force magnétique, force électrique non compensée, (v/c)² ---------- */
(() => {
  const Isl = $("Isl"), S = 1e-6, D = 0.01;
  function upd() {
    const I = 10 ** +Isl.value, w = ChampsEM.filsParalleles(I, S, D);
    $("Iread").textContent = F.si(I, "A");
    $("vv").textContent = F.si(w.v, "m·s⁻¹");
    $("fv").textContent = t("fi.f.v", { h: dur(1 / w.v) });
    $("vfm").textContent = F.si(w.Fm, "N·m⁻¹");
    $("vfe").textContent = F.qty(F.sci(w.Fe, 2), "N·m⁻¹");
    $("vr").textContent = F.sci(w.rapport, 2);
    $("fr").textContent = t("fi.f.r", { b: F.sci(w.beta2, 2) });
  }
  Isl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["romer", 1676, "idea"], ["maccullagh", 1839, "idea"], ["einstein", 1905, "idea"], ["lune", 1969, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["laser", "moteur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["contact", "b"], ["retard", "a"], ["instant", "d"], ["superposer", "c"], ["referentiel", "a"], ["petit", "b"], ["mccullagh", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 15 });
})();
</script>
</body>
</html>
