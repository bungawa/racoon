<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux;

/* ---------- la boîte d'Einstein : le recul que demande un centre de masse immobile ---------- */
(() => {
  const svg = $("boite"), sU = $("sU"), sM = $("sM"), sL = $("sL");
  const wagon = (x, y, eclair) => {
    Plot.el("rect", { x, y, width: 360, height: 60, class: "stroke bold c-label-2" }, svg);
    for (const wx of [x + 50, x + 310]) Plot.el("circle", { cx: wx, cy: y + 70, r: 10, class: "stroke c-label-2" }, svg);
    Plot.el("circle", { cx: x + (eclair ? 345 : 15), cy: y + 30, r: 7, class: "fill c-warn" }, svg);
  };
  function draw() {
    const U = 10 ** (+sU.value / 10), M = 10 ** (+sM.value / 10), L = +sL.value;
    const b = OM.boiteEinstein({ M, L, U });
    svg.innerHTML = "";
    Plot.el("line", { x1: 20, x2: 620, y1: 90, y2: 90, class: "stroke thin c-label-2" }, svg);
    Plot.el("line", { x1: 20, x2: 620, y1: 200, y2: 200, class: "stroke thin c-label-2" }, svg);
    wagon(160, 10, false);
    Plot.fleche(svg, [190, 40], [480, 40], { cls: "c-warn", trait: "stroke dash" });
    wagon(120, 120, true);                                                     // after: moved back, drawn 40 px for any real x
    Plot.fleche(svg, [160, 210], [120, 210], { cls: "c-label" });
    Plot.el("line", { x1: 160, x2: 160, y1: 110, y2: 200, class: "stroke dash c-label" }, svg);
    $("sUr").textContent = F.si(U, "J");
    $("sMr").textContent = M < 1e3 ? F.si(M, "kg", { prefix: "" }) : F.qty(F.sci(M, 2), "kg");
    $("sLr").textContent = F.si(L, "m", { prefix: "" });
    $("vx").textContent = F.qty(F.sci(b.x, 3), "m");
    $("fx").textContent = t("fig.f.x", { v: F.qty(F.sci(b.xExact, 3), "m"), e: F.sci(U / (M * Constantes.c ** 2), 1) });
    $("vp").textContent = F.qty(F.sci(b.p, 3), "kg·m·s⁻¹");
    $("fp").textContent = t("fig.f.p", { v: F.qty(F.sci(b.v, 2), "m·s⁻¹"), t: F.si(b.t, "s") });
    $("vm").textContent = F.qty(F.sci(b.m, 3), "kg");
    $("fm").textContent = t("fig.f.m", { v: F.sci(b.m / M, 1) });
  }
  sU.oninput = sM.oninput = sL.oninput = draw; draw();
})();

/* ---------- le système décrit : le disque du paradoxe, chiffré ---------- */
(() => {
  const q = 1e-7, d = 0.05, m = 1, J = 0.5 * 0.01 * d * d;                    // 0,1 µC on a ring of 5 cm, magnet of 1 A·m², disc of 10 g
  const L = OM.chargeAimant({ q, d, m }).Lz, w = L / J, an = 365.25 * 86400;
  $("sys1").innerHTML = t("sys1.body", { q: F.si(q, "C", { prefix: "µ" }), d: F.qty(F.num(100 * d, 2), "cm"), m: F.qty(F.num(m, 2), "A·m²"),
    L: F.qty(F.sci(L, 2), "kg·m²·s⁻¹"), J: F.qty(F.sci(J, 2), "kg·m²"), w: F.qty(F.sci(w, 2), "rad·s⁻¹"), n: F.num(2 * Math.PI / w / an, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lebedev", 1901, "experiment"], ["einstein", 1906, "idea"], ["beth", 1936, "experiment"], ["graham", 1980, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["voile"], uses = textOf("uses.items", USES);
  const p = OM.pressionLumiere(1361, 1).pression;                              // a perfect mirror facing the Sun at 1 au
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text.replace("{p}", F.si(p, "Pa", { prefix: "µ", sig: 2 }))}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["g", "b"], ["particules", "c"], ["boite", "a"], ["pourquoi", "d"], ["action", "c"], ["disque", "a"], ["voile", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 276 });
})();
</script>
