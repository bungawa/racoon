<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const C = ChimSolutions, P = Plot.el;

/* ---------- §2 : température de flamme adiabatique ---------- */
(() => {
  /* Equilibrium flame temperatures, stoichiometric, reactants at 298,15 K, 1 atm: NASA CEA and Cantera (Marzouk, arXiv:2503.11826) */
  const EQUILIBRE = { CH4: { air: 2224.25, O2: 3050.12 }, H2: { air: 2378.62, O2: 3074.51 } };
  let comb = "CH4", ox = "air";
  function draw() {
    const e = +$("exces").value / 100, o = { combustible: comb, comburant: ox, exces: e };
    const a = C.flamme(o), b = C.flamme(Object.assign({ modele: "cp0" }, o)), T0 = C.T0;
    const Tmax = Math.min(6000, Math.max(a.Tf || 6000, b.Tf) * 1.12), kJ = x => x / 1000;
    const svg = $("flamme"); svg.innerHTML = "";
    const g = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44, l: 64 }, x: { domain: [T0, Tmax], label: t("fl.x") }, y: { domain: [0, kJ(Math.max(a.h(Tmax), a.Q)) * 1.05], label: t("fl.y") } });
    const courbe = (h, cls) => { const pts = []; for (let i = 0; i <= 150; i++) { const T = T0 + (Tmax - T0) * i / 150; pts.push([g.x(T), g.y(kJ(h(T)))]); } P("path", { d: Plot.path(pts), class: cls }, g.g); };
    courbe(a.h, "curve"); courbe(b.h, "stroke thin dash c-label-2");
    P("line", { x1: g.x(T0), x2: g.x(Tmax), y1: g.y(kJ(a.Q)), y2: g.y(kJ(a.Q)), class: "stroke c-warn" }, g.g);
    P("text", { x: g.x(T0) + 8, y: g.y(kJ(a.Q)) - 8, class: "note" }, g.g).textContent = t("fl.q", { q: F.si(a.Q, "J", { sig: 3 }) });
    if (a.Tf) P("circle", { cx: g.x(a.Tf), cy: g.y(kJ(a.Q)), r: 5, class: "dot" }, g.g);
    if (b.Tf <= Tmax) P("circle", { cx: g.x(b.Tf), cy: g.y(kJ(b.Q)), r: 4, class: "dot" }, g.g);
    $("excesv").textContent = F.qty(F.num(100 * e, 3), "%");
    $("vtf").innerHTML = a.Tf ? F.kelvin(a.Tf) : t("fl.hors");
    $("vtf0").innerHTML = F.kelvin(b.Tf);
    $("ftf0").textContent = a.Tf ? t("fl.f.tf0", { d: F.qty(F.num(100 * (b.Tf - a.Tf) / (a.Tf - T0), 2), "%") }) : "";
    const ref = e === 0 && EQUILIBRE[comb] && EQUILIBRE[comb][ox];
    $("veq").innerHTML = ref ? F.kelvin(ref) : "–";
    $("feq").textContent = ref ? t("fl.f.eq", { d: F.qty(F.num(100 * (a.Tf - ref) / (ref - T0), 2), "%") }) : t("fl.f.sanseq");
    const n = Object.values(a.produits).reduce((s, v) => s + v, 0);
    $("vn").textContent = F.qty(F.num(n, 3), "mol");
    $("fn").textContent = a.produits.N2 ? t("fl.f.n", { p: F.qty(F.num(100 * a.produits.N2 / n, 2), "%") }) : t("fl.f.nsans");
    $("cseg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.c === comb)));
    $("oseg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.o === ox)));
  }
  $("cseg").querySelectorAll("button").forEach(x => x.onclick = () => { comb = x.dataset.c; draw(); });
  $("oseg").querySelectorAll("button").forEach(x => x.onclick = () => { ox = x.dataset.o; draw(); });
  $("exces").oninput = draw;
  draw();
})();

/* ---------- §3 : réacteur fermé refroidi, ou emballement ---------- */
(() => {
  /* Model reaction (not a real one): ΔTad = 150 K, Ea = 100 kJ·mol⁻¹, k = 10⁻⁴ s⁻¹ at 350 K; jacket at the initial temperature */
  const M = { dTad: 150, Ea: 1e5, kRef: 1e-4, TRef: 350, tmax: 7200, n: 360 };
  function draw() {
    const T0 = +$("tc").value, tau = Math.pow(10, +$("tau").value), o = Object.assign({ T0, tau }, M);
    const r = C.emballement(o), ad = C.emballement(Object.assign({}, o, { tau: Infinity })), psi = C.semenov(o);
    const svg = $("emb"); svg.innerHTML = "";
    const g = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 64 }, x: { domain: [0, M.tmax], label: t("em.x") }, y: { domain: [T0 - 5, T0 + M.dTad + 10], label: t("em.y") } });
    const courbe = (s, cls) => P("path", { d: Plot.path(s.t.map((ti, i) => [g.x(ti), g.y(Math.min(s.T[i], T0 + M.dTad + 10))])), class: cls }, g.g);
    courbe(ad, "stroke thin dash c-label-2"); courbe(r, "curve");
    const Tm = Math.max(...r.T), ia = ad.T.findIndex(T => T > T0 + M.dTad / 2);
    $("tcv").innerHTML = F.kelvin(T0); $("tauv").textContent = F.qty(F.num(tau, 2), "s");
    $("vpsi").textContent = F.num(psi, 2);
    $("fpsi").textContent = t(psi > 1 / Math.E ? "em.f.psi.haut" : "em.f.psi.bas");
    $("vmax").innerHTML = F.kelvin(Tm);
    $("fmax").textContent = t("em.f.max", { d: F.si(Tm - T0, "K", { sig: 2 }) });
    $("vad").textContent = ia > 0 ? F.qty(F.num(ad.t[ia], 2), "s") : "–";
    $("fad").textContent = t("em.f.ad");
  }
  ["tc", "tau"].forEach(id => $(id).oninput = draw);
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mallard1883", 1883, "experiment"], ["goldschmidt1895", 1895, "use"], ["fouche1903", 1903, "use"], ["semenov1928", 1928, "idea"], ["seveso1976", 1976, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["seveso", "codes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["chemin", "a"], ["neutralisation", "c"], ["cp", "b"], ["azote", "d"], ["exces", "a"], ["oxygene", "c"], ["semenov", "d"], ["isotherme", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 8103 });
})();
</script>
