<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimArchi;
const signe = q => q > 0 ? (q > 1 ? q : "") + "+" : q < 0 ? (q < -1 ? -q : "") + F.MINUS : "0";

/* ---------- atelier : schéma de Lewis d'une entité, ses formes mésomères ---------- */
(() => {
  const IDS = ["h2o", "nh3", "ch4", "co2", "hcn", "co", "nh4", "h3o", "bf3", "o3", "co3", "ethanoate", "benzene"], nom = textOf("at.e", IDS);
  const seg = $("eseg"), svg = $("lewis"), S = 56;
  seg.innerHTML = IDS.map(id => `<button type="button" data-e="${id}">${nom[id]}</button>`).join("");
  let id = "h2o", k = 0;
  function draw() {
    const E = C.LEWIS[id], s = C.formeLewis(id, k), b = C.bilanLewis(s);
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.e === id)));
    const xs = s.atomes.map(a => a.x), ys = s.atomes.map(a => a.y), m = 1.1;
    const x0 = Math.min(...xs) - m, x1 = Math.max(...xs) + m, y0 = Math.min(...ys) - m, y1 = Math.max(...ys) + m;
    svg.setAttribute("viewBox", [x0 * S, y0 * S, (x1 - x0) * S, (y1 - y0) * S].join(" "));
    svg.innerHTML = "";
    const P = a => [a.x * S, a.y * S], R = 14;
    for (const [i, j, o] of s.liaisons) {           // traits : simple, double, triple, raccourcis autour des symboles
      const [ax, ay] = P(s.atomes[i]), [bx, by] = P(s.atomes[j]), d = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / d, uy = (by - ay) / d;
      for (let n = 0; n < o; n++) {
        const off = (n - (o - 1) / 2) * 6;
        Plot.el("line", { x1: ax + ux * R - uy * off, y1: ay + uy * R + ux * off, x2: bx - ux * R - uy * off, y2: by - uy * R + ux * off, class: "stroke c-label" }, svg);
      }
    }
    s.atomes.forEach((a, i) => {
      const [x, y] = P(a);
      Plot.el("text", { x, y: y + 8, "text-anchor": "middle", class: "c-label" }, svg).textContent = a.el;
      const dirs = s.liaisons.filter(l => l[0] === i || l[1] === i).map(l => { const o = s.atomes[l[0] === i ? l[1] : l[0]]; return Math.atan2(o.y - a.y, o.x - a.x); });
      const lp = C.anglesLibres(dirs, a.libres + b.atomes[i].lacunes);
      lp.forEach((th, n) => {                        // doublet : un trait ; lacune : un petit rectangle
        const cx = x + 19 * Math.cos(th), cy = y + 19 * Math.sin(th), px = -Math.sin(th), py = Math.cos(th);
        if (n < a.libres) Plot.el("line", { x1: cx - 7 * px, y1: cy - 7 * py, x2: cx + 7 * px, y2: cy + 7 * py, class: "stroke bold c-tint" }, svg);
        else Plot.el("rect", { x: cx - 6, y: cy - 4, width: 12, height: 8, transform: `rotate(${th * 180 / Math.PI + 90} ${cx} ${cy})`, class: "stroke c-warn" }, svg);
      });
      const q = b.atomes[i].charge;
      if (q) {
        const free = C.anglesLibres(dirs.concat(lp), 1)[0], qx = x + 31 * Math.cos(free), qy = y + 31 * Math.sin(free);
        Plot.el("circle", { cx: qx, cy: qy, r: 8, class: "stroke thin c-warn" }, svg);
        Plot.el("text", { x: qx, y: qy + 4.5, "text-anchor": "middle", class: "qf c-warn" }, svg).textContent = q > 0 ? "+" : F.MINUS;
      }
    });
    $("vne").textContent = F.num(b.attendus, 3);
    const nl = s.liaisons.reduce((t, l) => t + l[2], 0);
    $("vnd").textContent = t("at.nd", { n: F.num(b.attendus / 2, 3), l: F.num(nl, 3), nl: F.num(b.attendus / 2 - nl, 3) });
    const qs = b.atomes.map((a, i) => a.charge ? a.el + signe(a.charge) : null).filter(Boolean);
    $("vq").textContent = qs.length ? qs.join(", ") : t("at.aucune");
    const ord = C.ordresMoyens(E.formes), vals = [...new Set(Object.values(ord).map(o => +o.toFixed(6)))].filter(o => !Number.isInteger(o));
    $("vo").textContent = E.formes.length > 1 ? vals.map(o => F.fix(o, 2)).join(" ; ") : t("at.localise");
    $("suivante").disabled = E.formes.length < 2;
    $("suivante").textContent = E.formes.length > 1 ? t("at.suivante", { k: k + 1, n: E.formes.length }) : t("at.une");
    $("bilan").innerHTML = t("at.bilan." + id);
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { id = x.dataset.e; k = 0; draw(); });
  $("suivante").onclick = () => { k = (k + 1) % C.LEWIS[id].formes.length; draw(); };
  draw();
})();

/* ---------- longueurs mesurées : la mésomérie se voit ---------- */
(() => {
  const L = C.LONGUEURS, ROWS = ["ethane", "benzene", "ethene", "peroxyde", "ozone", "dioxygene"], txt = textOf("long.rows", ROWS);
  $("longueurs").innerHTML = ROWS.map(r => `<div><span class="k">${F.qty(F.fix(L[r], r === "dioxygene" ? 2 : 1), "pm")}</span><span>${txt[r]}</span></div>`).join("");
})();

/* ---------- énergies de liaison contre RT ---------- */
(() => {
  const E = [["hh", 436], ["ch", 412], ["cc", 348], ["ccd", 612], ["oh", 463], ["co", 743]], txt = textOf("en.rows", E.map(e => e[0]));
  const RT = Constantes.R * 298.15 / 1000;
  $("energies").innerHTML = E.map(([id, e]) => `<div><span class="k">${F.qty(F.num(e, 3), "kJ·mol⁻¹")}</span><span>${txt[id]}</span><span class="v">${t("en.rt", { r: F.num(e / RT, 3) })}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kekule", 1865, "idea"], ["lewis", 1916, "idea"], ["langmuir", 1919, "idea"], ["pauling", 1931, "idea"], ["nobel", 1954, "idea"], ["smiles", 1988, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["bases", "reactivite"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["compte", "b"], ["charge", "d"], ["octet", "a"], ["meso", "c"], ["longueur", "b"], ["fausse", "a"], ["co", "d"], ["energie", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
