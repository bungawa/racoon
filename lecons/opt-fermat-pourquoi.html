<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique;

/* ---------- les flèches d'un miroir plan, bande par bande ---------- */
(() => {
  const A = 1, H = 1, X = 1, N = 600, L0 = 2 * Math.hypot(A, H), L2 = O.miroirCourbe({ a: A, h: H, R: Infinity }).L2;
  const L = x => Math.hypot(x + A, H) + Math.hypot(A - x, H);
  const ls = $("lsl"), seg = $("masques"), bandes = $("bandes"), chaine = $("chaine");
  let mode = "tout";
  const GARDE = {
    tout: () => () => true,
    bords: z => x => Math.abs(x) < 3 * z,
    centre: z => x => Math.abs(x) > z,
    premiere: z => x => Math.abs(x) < z,
    zones: (z, lambda) => x => Math.cos(2 * Math.PI * (L(x) - L0) / lambda) > 0,
  };
  function draw() {
    const lambda = +ls.value / 100, z = Math.sqrt(lambda / L2);
    const p = O.phaseurs({ a: A, h: H, lambda, X, N, garde: GARDE[mode](z, lambda) }), ref = O.phaseurs({ a: A, h: H, lambda, X, N });
    bandes.innerHTML = "";
    const tours = p.x.map(x => (L(x) - L0) / lambda), top = Math.ceil(Math.max(...tours));
    const { x, y, g } = Plot.axes(bandes, { fmt: F, w: 640, h: 220, x: { domain: [-X * 100, X * 100], label: t("ph.x") }, y: { domain: [-0.08 * top, top], label: t("ph.y") } });
    p.x.forEach((xv, k) => Plot.el("rect", { x: x((xv - p.dx / 2) * 100), y: y(0) - 0.6, width: Math.max(0.5, x(p.dx * 100) - x(0)), height: y(-0.08 * top) - y(0), class: "fill " + (p.garde[k] ? "c-tint" : "c-label-2") }, g));
    Plot.el("path", { d: Plot.path(p.x.map((xv, k) => [x(xv * 100), y(tours[k])])), class: "curve" }, g);
    chaine.innerHTML = "";
    const pts = p.somme, all = pts.concat(ref.somme);
    const xs = all.map(q => q[0]), ys = all.map(q => q[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), span = Math.max(x1 - x0, y1 - y0) || 1;
    const W = 640, HT = 300, sc = 0.9 * Math.min(W, HT) / span, cx = W / 2 - sc * (x0 + x1) / 2, cy = HT / 2 + sc * (y0 + y1) / 2;
    const px = q => [cx + sc * q[0], cy - sc * q[1]];
    chaine.setAttribute("viewBox", `0 0 ${W} ${HT}`);
    Plot.el("path", { d: Plot.path(pts.map(px)), class: "stroke thin c-tint" }, chaine);
    Plot.fleche(chaine, px([0, 0]), px(p.total), { cls: "c-warn" });
    ls.value = lambda * 100;
    $("lread").textContent = F.si(lambda, "m", { prefix: "m", sig: 2 });
    const r = p.norme2 / ref.norme2;
    $("vi").textContent = F.num(r, 3); $("fi").textContent = t("ph.f.i", { amp: F.num(Math.sqrt(r), 3) });
    $("vz").textContent = F.si(z, "m", { prefix: "m", sig: 2 });
    $("fz").textContent = t("ph.f.zone", { n: F.num(2 * (L(X) - L0) / lambda, 2) });
  }
  ls.oninput = draw;
  seg.querySelectorAll("button").forEach(b => b.onclick = () => {
    mode = b.dataset.m; seg.querySelectorAll("button").forEach(c => c.setAttribute("aria-pressed", String(c === b))); draw();
  });
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["huygens", 1690, "idea"], ["fresnel", 1819, "idea"], ["taylor", 1909, "experiment"], ["dirac", 1933, "idea"], ["feynman", 1948, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["zones"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["demi", "b"], ["centre", "a"], ["bords", "c"], ["zones", "d"], ["premiere", "a"], ["lambda", "b"], ["photon", "c"], ["taylor", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 266 });
})();
