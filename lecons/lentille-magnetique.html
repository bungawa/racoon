          <div class="ctl"><div class="row"><label for="cu" data-i18n="fig.u"></label><output id="cuo" for="cu"></output></div>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m);
const $ = id => document.getElementById(id);
const M = MagInd, e = Constantes.e, me = Constantes.m_e, mp = Constantes.m_p, C = Constantes.c;
const A = 0.005, Z0 = -0.3, Z1 = 0.3, ZMAX = 0.3;          // Glaser field of half-width 5 mm; negligible beyond ±30 cm
const deg = x => F.num(x * 180 / Math.PI, 3) + "°";

/* ---------- textes chiffrés ---------- */
(() => {
  const p = M.impulsionU(-e, me, 1e5), G = M.glaser(0.1, A, -e, p);
  $("sys").innerHTML = t("sys.body", { f: F.si(G.f, "m"), rot: deg(Math.abs(G.rotation)), k2: F.num(G.k2, 2), ra: F.num(0.2, 1) });
  const Gw = M.glaser(0.03, A, -e, p), Bw = M.busch(Gw.champ, -e, p, -40, 40, 400000);
  $("val-busch").innerHTML = t("val.busch", { e1: F.num(100 * Math.abs(1 / Bw.inverseF - Gw.f) / Gw.f, 2), k2: F.num(Gw.k2, 2) });
  // a proton at the same voltage, same lens: the field needed for the same focal length
  $("s3p2").innerHTML = t("s3.p2", { r: F.num(M.impulsionU(e, mp, 1e5) / p, 3) });
})();

/* ---------- le rayon, vu de côté et vu dans l'axe ---------- */
(() => {
  const svg = $("ray"), sb = $("bout"), El = Plot.el, W = 640;
  function draw() {
    const B0 = +$("cb").value / 1000, U = +$("cu").value * 1000, p = M.impulsionU(-e, me, U), G = M.glaser(B0, A, -e, p);
    const L = M.lentilleB(G.champ, -e, p, Z0, Z1, 6000), Bu = M.busch(G.champ, -e, p, -40, 40, 40000);
    svg.innerHTML = ""; sb.innerHTML = "";
    const zl = [-3, 30], { x, y, g } = Plot.axes(svg, { fmt: F, w: W, h: 280, pad: { l: 56, r: 16, t: 12, b: 40 }, x: { domain: zl, label: t("fig.z") }, y: { domain: [-1.2, 1.2], label: t("fig.r") } });
    // the field B(z)/B0, drawn to the scale of 1 mm
    const bz = []; for (let i = 0; i <= 300; i++) { const z = zl[0] + (zl[1] - zl[0]) * i / 300; bz.push([x(z), y(G.champ(z / 100) / B0)]); }
    El("path", { d: Plot.path(bz), class: "stroke thin c-label-2" }, g);
    El("line", { x1: x(zl[0]), x2: x(zl[1]), y1: y(0), y2: y(0), class: "stroke thin c-label-2 dash" }, g);
    // in the turning frame the ray stays in its plane: r(z) of a ray at 1 mm (the trace starts at 1 mm)
    const pts = L.trace.filter(s => s.z * 100 >= zl[0] && s.z * 100 <= zl[1] && Math.abs(s.r) <= 1.2e-3).filter((_, i) => i % 4 === 0).map(s => [x(s.z * 100), y(s.r * 1000)]);
    El("path", { d: Plot.path(pts), class: "stroke c-tint" }, g);
    if (L.zF > zl[0] / 100 && L.zF < zl[1] / 100) El("line", { x1: x(L.zF * 100), x2: x(L.zF * 100), y1: y(-1.1), y2: y(1.1), class: "stroke thin c-warn dash" }, g);
    // seen along the axis: x = r cos θ, y = r sin θ, from the entry to the focus
    const q = Plot.axes(sb, { fmt: F, w: W, h: 300, pad: { l: 216, r: 176, t: 12, b: 40 }, x: { domain: [-1.2, 1.2], label: t("fig.x") }, y: { domain: [-1.2, 1.2], label: t("fig.y") } });
    const bp = L.trace.filter(s => s.z <= Math.min(L.zF, Z1)).filter((_, i) => i % 4 === 0).map(s => [q.x(s.r * 1000 * Math.cos(s.theta)), q.y(s.r * 1000 * Math.sin(s.theta))]);
    El("path", { d: Plot.path(bp), class: "stroke c-tint" }, q.g);
    El("circle", { cx: q.x(1), cy: q.y(0), r: 4, class: "fill c-tint" }, q.g);
    $("cbo").textContent = F.si(B0, "T"); $("cuo").textContent = F.si(U, "V");
    $("vf").textContent = F.si(L.fImage, "m"); $("vg").textContent = F.si(G.f, "m"); $("vb").textContent = F.si(1 / Bu.inverseF, "m");
    $("vrot").textContent = deg(Math.abs(G.rotation));
  }
  $("cb").oninput = draw; $("cu").oninput = draw; draw();
})();
F.autoTypo(document.querySelector("main"));

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["busch", 1926, "idea"], ["images", 1929, "experiment"], ["polaire", 1932, "idea"], ["these", 1933, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(x => x[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  // an objective at 200 kV, Glaser model with a = 2 mm: f = −ωa/sin(ωπ) has a minimum, about 1,47 a (tan ωπ = ωπ); the peak
  // field there, by a scan of B0 below k² = 3
  const p = M.impulsionU(-e, me, 2e5); let lo = 0.1, fmin = Infinity;
  for (let b = 0.1; b < 2.8; b += 0.001) { const f = M.glaser(b, 0.002, -e, p).f; if (f > 0 && f < fmin) { fmin = f; lo = b; } }
  const USES = ["objectif"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${fill(uses[id].text, { B: F.si(lo, "T", { sig: 2 }), f: F.si(fmin, "m", { sig: 2 }) })}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tourne", "b"], ["courant", "d"], ["tension", "a"], ["proton", "c"], ["diverge", "b"], ["vitesse", "a"], ["entree", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 294 });
})();
</script>
