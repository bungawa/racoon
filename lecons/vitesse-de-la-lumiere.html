<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OndesMilieux, c = Constantes.c, e = Constantes.e;
/* the two weighings of the page: 100 nC on two small spheres 20 cm apart; 10 A in two wires 1 cm apart */
const q = 1e-7, r = 0.2, I0 = 10, d = 0.01;

/* ---------- deux pesées, dans l'unité de charge qu'on veut ---------- */
(() => {
  const svg = $("biais"), sk = $("sk"), sl = $("sl");
  const lds = Array.from({ length: 136 }, (_, i) => Math.pow(10, 0.3 + i * 0.02));
  const biais = ld => O.mesurerC({ q, r, Fe: O.forceCharges(q, q, r), I: I0, d, l: ld * d, Fm: O.forceFilsFinis(I0, I0, d, ld * d) }).c / c - 1;
  function draw() {
    const k = Math.pow(10, +sk.value), ld = Math.pow(10, +sl.value), l = ld * d, u = O.changerUnite(k);
    /* the same forces, read in the chosen unit: charge q/k units, current I/k units per second */
    const Fe = O.forceCharges(q, q, r), Fm = O.forceFilsFinis(I0, I0, d, l);
    const m = O.mesurerC({ q: q / k, r, Fe, I: I0 / k, d, l, Fm });
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 64, b: 44 }, x: { scale: "log", domain: [2, 1000], label: t("fig.xaxis") },
      y: { scale: "log", domain: [1e-4, 1], label: t("fig.yaxis") } });
    Plot.el("path", { d: Plot.path(lds.map(x => [P.x(x), P.y(biais(x))])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(lds.map(x => [P.x(x), P.y(Math.min(1, 1 / (2 * x)))])), class: "ref" }, P.g);
    Plot.el("circle", { cx: P.x(ld), cy: P.y(biais(ld)), r: 5, class: "dot" }, P.g);
    $("skr").textContent = Math.abs(k / e - 1) < 0.02 ? t("fig.unite.e") : t("fig.unite", { k: F.si(k, "C") });
    $("slr").textContent = t("fig.lval", { ld: F.num(ld, 3), l: F.si(l, "m") });
    $("veps").textContent = t("fig.u.eps", { v: F.sci(m.eps0, 4) });
    $("feps").textContent = t("fig.f.eps", { v: F.sci(u.eps0, 4) });
    $("vepsc2").textContent = t("fig.u.eps", { v: F.sci(m.eps0c2, 4) });
    $("fepsc2").textContent = t("fig.f.eps", { v: F.sci(u.eps0c2, 4) });
    $("vc").textContent = F.si(m.c, "m·s⁻¹");
    $("fc").textContent = t("fig.f.c", { p: F.num(100 * (m.c / c - 1), 2) });
  }
  sk.oninput = sl.oninput = draw; draw();
})();

/* ---------- le système décrit : les deux pesées en chiffres ---------- */
(() => {
  const a = 0.01, l = 1, Fe = O.forceCharges(q, q, r), Fm = O.forceFils(I0, I0, d, l), Fmf = O.forceFilsFinis(I0, I0, d, l);
  $("sys1").innerHTML = t("sys1.body", { q: F.si(q, "C", { prefix: "n" }), r: F.qty(F.num(100 * r, 3), "cm"), a: F.qty(F.num(100 * a, 3), "cm"),
    Fe: F.si(Fe, "N", { prefix: "m" }), coul: F.num(100 * 4 * Math.pow(a / r, 3), 2),          // image charges: each sphere polarised by the other, −4(a/r)³ at leading order
    I: F.si(I0, "A"), d: F.qty(F.num(100 * d, 3), "cm"), l: F.si(l, "m"), Fm: F.si(Fm, "N", { prefix: "m" }),
    fils: F.num(100 * (1 - Fmf / Fm), 2), cb: F.num(100 * (O.mesurerC({ q, r, Fe, I: I0, d, l, Fm: Fmf }).c / c - 1), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fizeau", 1849, "experiment"], ["weber", 1856, "experiment"], ["maxwell", 1862, "idea"], ["cgpm", 1983, "use"]];
  const txt = textOf("hist.events", EVENTS.map(x => x[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["si"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "b"], ["unite", "d"], ["calcul", "a"], ["fils", "c"], ["onde", "b"], ["metre", "d"], ["weber", "a"]];
  const txt = textOf("quiz.items", QS.map(x => x[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const x = txt[id];
    return { id, correct, prompt: x.prompt, why: x.why, hint: x.hint, options: Object.entries(x.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 185 });
})();
</script>
