<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, R = Constantes.R;
const pc = (x, n = 2) => F.num(100 * x, n) + F.NB + "%";

/* ---------- μ_JT de cinq gaz à 300 K sous 0,1 MPa ---------- */
(() => {
  $("tab").innerHTML = ["CO2", "Ar", "N2", "H2", "He"].map(g => { const j = S.jt0(g, 300);
    return `<div><span class="k">${t("gaz." + g)}</span><span>${t("tab.ligne", { mu: F.qty(F.num(j.mu * 1e6, 3), "K·MPa⁻¹"), avis: t(j.mu > 0 ? "tab.froid" : "tab.chaud") })}</span></div>`; }).join("");
})();

/* ---------- isenthalpes du diazote et courbe d'inversion ---------- */
(() => {
  const svg = $("jt"), sk = $("ck"), s1 = $("p1"), s2 = $("p2"), E = S.ISENTHALPES_N2, PMAX = 40, TMIN = 60, TMAX = 640;
  function draw() {
    const k = +sk.value, i = +s1.value; let j = +s2.value; if (j >= i) { j = i - 1; s2.value = j; }
    const c = E.courbes[k], P1 = E.P[i], P2 = E.P[j], T1 = c.T[i], T2 = c.T[j];
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 360, pad: { b: 44, l: 56 },
      x: { domain: [0, PMAX], label: t("jt.x") }, y: { domain: [TMIN, TMAX], label: t("jt.y") } });
    const inv = S.INVERSION_N2, bas = inv.filter(r => r[1] !== null).map(r => [o.x(r[0]), o.y(r[1])]), haut = inv.map(r => [o.x(r[0]), o.y(r[2])]).reverse();
    Plot.el("path", { d: Plot.path(bas.concat(haut)), class: "stroke dash c-warn" }, o.g);
    E.courbes.forEach((q, n) => Plot.el("path", { d: Plot.path(q.T.map((T, m) => [o.x(E.P[m]), o.y(T)])), class: n === k ? "stroke c-tint" : "stroke thin c-label" }, o.g));
    Plot.el("circle", { cx: o.x(P1), cy: o.y(T1), r: 5, class: "fill c-tint" }, o.g);
    Plot.el("circle", { cx: o.x(P2), cy: o.y(T2), r: 5, class: "fill c-ok" }, o.g);
    const dT = T2 - T1, sat = P2 < 3.3 && Math.abs(T2 - S.SAT_N2.T) < 0.1 && j === 0, y = (S.SAT_N2.hv - c.H * 1e3) / (S.SAT_N2.hv - S.SAT_N2.hl);
    $("ckv").innerHTML = F.kelvin(c.T20);
    $("p1v").textContent = F.si(P1 * 1e6, "Pa", { sig: 3 }); $("p2v").textContent = F.si(P2 * 1e6, "Pa", { sig: 3 });
    $("vt1").innerHTML = F.kelvin(T1); $("vt2").innerHTML = F.kelvin(T2);
    $("ft2").textContent = sat ? t("jt.f.liq", { y: pc(y) }) : "";
    $("vdt").textContent = F.qty(F.num(dT, 3), "K"); $("fdt").textContent = t(dT < -0.05 ? "jt.f.froid" : dT > 0.05 ? "jt.f.chaud" : "jt.f.nul");
    $("vmu").textContent = F.qty(F.num(dT / (P2 - P1), 3), "K·MPa⁻¹");
    $("vds").textContent = F.qty(F.num(R * Math.log(P1 / P2), 3), "J·K⁻¹·mol⁻¹");
    const dedans = T => { const lo = S.INVERSION_N2.filter(r => r[1] !== null), a = (P, col) => { const r = S.INVERSION_N2; let m = 1; while (m < r.length - 1 && r[m][0] < P) m++; const u = r[m - 1], v = r[m];
      const f = (P - u[0]) / (v[0] - u[0]); return (u[col] === null ? v[col] : u[col]) + f * (v[col] - (u[col] === null ? v[col] : u[col])); }; return P => P <= 39 && T > a(P, 1) && T < a(P, 2); };
    const in1 = dedans(T1)(P1), in2 = dedans(T2)(P2);
    $("sys").innerHTML = t("sys.inner", { T1: F.kelvin(T1), p1: F.si(P1 * 1e6, "Pa", { sig: 3 }), p2: F.si(P2 * 1e6, "Pa", { sig: 3 }),
      r: F.num(P1 / P2, 3), e: pc(Math.abs(dT) / T1), avis: t(sat ? "sys.liq" : in1 && in2 ? "sys.dedans" : !in1 && !in2 ? "sys.dehors" : "sys.traverse") });
  }
  sk.oninput = s1.oninput = s2.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["poreux", 1852, "experiment"], ["linde", 1895, "use"], ["dewar", 1898, "experiment"], ["onnes", 1908, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["frigo", "gaz", "hydrogene"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["enthalpie", "c"], ["parfait", "a"], ["signe", "d"], ["chiffre", "b"], ["inversion", "a"], ["hydrogene", "c"], ["entropie", "b"], ["difference", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 9102 });
})();
</script>
