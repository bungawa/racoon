<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, Cst = Constantes, Ag = M.ARGENT;
/* the 1922 apparatus, as reported: oven at 1000 °C, magnet 3,5 cm long, 0,1 T, gradient 10 T/cm; plate at the magnet's end */
const SG = { T: 1273, L: 0.035, D: 0, B: 0.1, gradB: 1000, fente: 3e-5 };

/* ---------- le système décrit : temps de vol, précession, échelle des déviations ---------- */
(() => {
  const vp = Math.sqrt(2 * Cst.k_B * SG.T / Ag.m), tau = SG.L / vp, wp = M.frequencePrecession("electron", SG.B).omega;
  const e = M.echelleSG({ muz: Ag.g / 2 * Cst.mu_B, gradB: SG.gradB, T: SG.T, L: SG.L, D: SG.D });
  $("sys1").innerHTML = t("sys1.body", { T: F.kelvin(SG.T), vp: F.si(vp, "m·s⁻¹", { sig: 2 }), tau: F.si(tau, "s", { sig: 2 }),
    n: F.sci(wp * tau, 1), F: F.si(Ag.g / 2 * Cst.mu_B * SG.gradB, "N", { sig: 2 }), P: F.si(Ag.m * Cst.g0, "N", { sig: 2 }),
    r: F.sci(Ag.g / 2 * Cst.mu_B * SG.gradB / (Ag.m * Cst.g0), 1), z: F.si(e.z0, "m", { sig: 2, prefix: "m" }) });
  $("chiffres").innerHTML = t("chiffres.body", { pic: F.si(2 * e.zPic, "m", { sig: 2, prefix: "m" }), moy: F.si(2 * e.zMoy, "m", { sig: 2, prefix: "m" }),
    fente: F.si(SG.fente, "m", { sig: 2, prefix: "m" }) });
})();

/* ---------- la plaque : taches quantiques contre tache classique ---------- */
(() => {
  const svg = $("plaque"), sg = $("sg"), st = $("st"), sf = $("sf");
  const ATOMES = { argent: { j: 0.5, g: Ag.g }, un: { j: 1, g: 1 }, troisdemis: { j: 1.5, g: 4 / 3 } };
  let atome = "argent";
  function draw() {
    const a = ATOMES[atome], gradB = Math.pow(10, +sg.value), T = +st.value, fente = +sf.value * 1e-6;
    const o = M.orientations(a.j), z1 = M.echelleSG({ muz: Cst.mu_B, gradB, T, L: SG.L, D: SG.D }).z0;
    const X = Math.max(1.6 * a.g * o.a * z1, 2 * fente), n = 401, x = [];
    for (let k = 0; k < n; k++) x.push(-X + 2 * X * k / (n - 1));
    const base = { j: a.j, g: a.g, T, gradB, L: SG.L, D: SG.D, fente, x };
    const q = M.profilSG(base), c = M.profilSG(Object.assign({ mode: "classique", nc: 300 }, base));
    const ymax = 1.1 * Math.max(...q.I, ...c.I) * 1e-3;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-X * 1e3, X * 1e3], label: t("fig.ax.x") },
      y: { domain: [0, ymax], label: t("fig.ax.y") } });
    const trace = (I, cls) => Plot.el("path", { d: Plot.path(x.map((xx, k) => [P.x(xx * 1e3), P.y(I[k] * 1e-3)])), class: cls }, svg);
    trace(c.I, "stroke bold dash c-warn"); trace(q.I, "stroke bold c-tint");
    const zp = a.g * o.max.quantique * z1 / 3, zm = a.g * o.max.quantique * z1;
    $("sgr").textContent = F.si(gradB, "T·m⁻¹", { sig: 2, prefix: "" });
    $("str").innerHTML = F.kelvin(T);
    $("sfr").textContent = F.si(fente, "m", { sig: 2, prefix: "m" });
    $("vp").textContent = F.si(2 * zp, "m", { sig: 2, prefix: "m" });
    $("fp").textContent = t("fig.f.pic");
    $("vm").textContent = F.si(2 * zm, "m", { sig: 2, prefix: "m" });
    $("fm").textContent = t("fig.f.moy");
    const r = zp / a.j / fente;   // distance between neighbouring spots (g z1/3) over the slit width
    $("vv").textContent = F.num(r, 2);
    $("fv").textContent = t(r > 1.5 ? "fig.f.separees" : r > 0.7 ? "fig.f.limite" : "fig.f.confondues");
  }
  document.querySelectorAll("#atomes button").forEach(bt => bt.onclick = () => {
    atome = bt.dataset.a; document.querySelectorAll("#atomes button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  sg.oninput = st.oninput = sf.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["sg", 1922, "experiment"], ["hydrogene", 1927, "experiment"], ["nobel", 1944, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["maser"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "b"], ["classique", "c"], ["gradient", "a"], ["masse", "d"], ["queue", "b"], ["spin1", "c"], ["chaud", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 352 });
})();
</script>
