<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, P = 1, DELTA = 0.1;

/* ---------- two particles in a box: |ψ(x1, x2)|² on the square, and along the diagonal ---------- */
(() => {
  const carte = $("carte"), diag = $("diag"), segS = $("stat"), segQ = $("etatq"), N = 40, X0 = 30, W = 270;
  let stat = "fermions", q = 2;
  function draw() {
    carte.innerHTML = ""; diag.innerHTML = "";
    /* the map: one cell per (x1, x2), its opacity the probability density, scaled to the largest of the three statistics */
    const dens = (a, b) => Q.amplitudeDeuxBoite(P, q, a, b, stat) ** 2, cell = W / N;
    let pmax = 0;                                                        // one scale for the three statistics
    for (const st of ["fermions", "bosons", "discernables"]) for (let i = 0; i <= 60; i++) for (let j = 0; j <= 60; j++)
      pmax = Math.max(pmax, Q.amplitudeDeuxBoite(P, q, i / 60, j / 60, st) ** 2);
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      const v = dens((i + 0.5) / N, (j + 0.5) / N);
      if (v > 1e-6) Plot.el("rect", { x: X0 + i * cell, y: 10 + (N - 1 - j) * cell, width: cell + 0.3, height: cell + 0.3, class: "fill c-tint", "fill-opacity": Math.min(1, v / pmax).toFixed(3) }, carte);
    }
    Plot.el("rect", { x: X0, y: 10, width: W, height: W, class: "stroke thin c-label-2", fill: "none" }, carte);
    Plot.el("line", { x1: X0, y1: 10 + W, x2: X0 + W, y2: 10, class: "stroke thin dash c-label-2" }, carte);
    const lab = (x, y, s, anc) => { const e = Plot.el("text", { x, y, "text-anchor": anc || "middle" }, carte); e.textContent = s; };
    lab(X0 + W / 2, 316, t("fig.x1")); lab(14, 10 + W / 2, t("fig.x2"));
    /* the diagonal x1 = x2 against the antidiagonal: the probability of being at the same place */
    const o = Plot.axes(diag, { fmt: F, w: 320, h: 320, pad: { l: 40, r: 10, t: 12, b: 40 },
      x: { domain: [0, 1], label: t("fig.ax.x"), fmt: v => F.num(v, 2) }, y: { domain: [0, 1.05 * pmax], label: t("fig.ax.p"), fmt: v => F.num(v, 2) } });
    const pts = []; for (let k = 0; k <= 200; k++) { const x = k / 200; pts.push([o.x(x), o.y(dens(x, x))]); }
    const ref = []; for (let k = 0; k <= 200; k++) { const x = k / 200; ref.push([o.x(x), o.y(Q.amplitudeDeuxBoite(P, q, x, x, "discernables") ** 2)]); }
    Plot.el("path", { d: Plot.path(ref), class: "stroke thin dash c-label-2" }, o.g);
    Plot.el("path", { d: Plot.path(pts), class: "stroke bold c-tint" }, o.g);
    /* the numbers */
    const total = Q.probaProches(P, q, stat, 2, 120), proche = Q.probaProches(P, q, stat, DELTA, 120), ref0 = Q.probaProches(P, q, "discernables", DELTA, 120);
    $("vproche").textContent = F.num(100 * proche, 2) + " %";
    $("fproche").textContent = t("fig.f.proche", { d: F.num(100 * ref0, 2) });
    $("vnorme").textContent = F.num(total, 3);
    $("fnorme").textContent = t(total < 1e-9 ? "fig.f.vide" : "fig.f.norme");
    segS.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === stat)));
    segQ.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.q === q)));
  }
  segS.querySelectorAll("button").forEach(b => b.onclick = () => { stat = b.dataset.s; draw(); });
  segQ.querySelectorAll("button").forEach(b => b.onclick = () => { q = +b.dataset.q; draw(); });
  draw();
})();

/* ---------- the subshells of an atom of Z electrons, filled by the real rule or by imaginary boson electrons ---------- */
(() => {
  const svg = $("couches"), sZ = $("sZ"), seg = $("regle"), L = "spdf";
  let regle = "fermions";
  const nom = s => s.n + L[s.l];
  function draw() {
    const Z = +sZ.value, cs = Q.couchesElectrons(Z, regle);
    svg.innerHTML = "";
    const tout = regle === "fermions" ? Q.couchesElectrons(36) : cs, rangs = tout.map(nom);
    const h = 300 / Math.max(rangs.length, 3), BOX = 34;
    tout.forEach((s, r) => {
      const y = 300 - (r + 0.5) * h, occ = (cs.find(c => nom(c) === nom(s)) || { occ: 0 }).occ;
      const lab = Plot.el("text", { x: 34, y: y + 5, "text-anchor": "end" }, svg); lab.textContent = nom(s);
      if (regle === "bosons") {
        Plot.el("rect", { x: 46, y: y - 13, width: 580, height: 26, class: "stroke thin c-label-2", fill: "none" }, svg);
        for (let k = 0; k < occ; k++) Plot.el("circle", { cx: 60 + k * 15.5, cy: y, r: 5, class: "fill c-tint" }, svg);
        return;
      }
      const orb = 2 * s.l + 1;
      for (let k = 0; k < orb; k++) {
        const x = 46 + k * (BOX + 4);
        Plot.el("rect", { x, y: y - 13, width: BOX, height: 26, class: "stroke thin c-label-2", fill: "none" }, svg);
        /* Hund: one electron per box first, then pairs */
        const haut = occ > k, bas = occ > orb + k;
        if (haut) Plot.el("text", { x: x + 11, y: y + 6, "text-anchor": "middle", class: "c-tint" }, svg).textContent = "↑";
        if (bas) Plot.el("text", { x: x + 23, y: y + 6, "text-anchor": "middle", class: "c-warn" }, svg).textContent = "↓";
      }
    });
    $("sZv").textContent = String(Z);
    $("vconf").textContent = cs.map(s => nom(s) + F.sup(s.occ)).join(" ");
    const nmax = Math.max(...cs.map(s => s.n)), ext = cs.filter(s => s.n === nmax).reduce((a, s) => a + s.occ, 0);
    const pleine = regle === "fermions" && cs.at(-1).occ === cs.at(-1).places && (cs.at(-1).l === 1 || Z === 2);
    $("fconf").textContent = t(regle === "bosons" ? "at.f.bosons" : pleine ? "at.f.rare" : "at.f.conf");
    $("vext").textContent = t("at.v.ext", { n: nmax, k: ext });
    $("fext").textContent = t(regle === "bosons" ? "at.f.ext.b" : "at.f.ext", { n: nmax });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.r === regle)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { regle = b.dataset.r; draw(); });
  sZ.oninput = draw; draw();
})();

/* ---------- the system described: how close two electrons of the same spin can come ---------- */
(() => {
  const f = Q.probaProches(1, 2, "fermions", DELTA), d = Q.probaProches(1, 2, "discernables", DELTA), b = Q.probaProches(1, 2, "bosons", DELTA);
  $("sys").innerHTML = t("sys.body", { f: F.num(100 * f, 2), d: F.num(100 * d, 2), b: F.num(100 * b, 2), r: F.num(d / f, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["pauli", 1925, "idea"], ["fermi", 1926, "idea"], ["dirac", 1926, "idea"], ["fowler", 1926, "idea"], ["nobel", 1945, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["bandes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["meme", "b"], ["spins", "d"], ["lithium", "a"], ["bosons", "c"], ["boite", "b"], ["stabilite", "a"], ["deuteron", "d"], ["potassium", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 447 });
})();
</script>
