<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, Cs = Constantes, e = Cs.e, a0 = Cs.a0, A03 = 4 * Math.PI * a0 ** 3;
const N0 = Cs.atm / (Cs.k_B * 273.15);                       // m⁻³: an ideal gas at 273,15 K and 101 325 Pa
const modele = a => ES.oscillateurAtome(a.Ei * e);

/* ---------- un électron sur un ressort, six atomes ---------- */
(() => {
  const sa = $("atomes"), sd = $("disp"), ids = ES.ATOMES.map(a => a.id);
  let gaz = "He";
  function barres() {
    sa.innerHTML = "";
    const A = Plot.axes(sa, { fmt: F, w: 640, h: 260, x: { domain: [0, ids.length], ticks: ids.length, fmt: () => "" },
      y: { domain: [0, 30], label: t("fig.y") } });
    const w = (A.x(1) - A.x(0)) * 0.32;
    ES.ATOMES.forEach((a, i) => {
      const xc = A.x(i + 0.5), sel = a.id === gaz ? 0.95 : 0.45;
      [[modele(a).alpha / A03, "c-tint", -1], [a.alphaA0, "c-warn", 1]].forEach(([v, cls, s]) => {
        const g = Plot.el("g", { class: cls }, A.g);
        Plot.el("rect", { x: (xc + (s < 0 ? -w - 2 : 2)).toFixed(1), y: A.y(v).toFixed(1), width: w.toFixed(1), height: (A.y(0) - A.y(v)).toFixed(1), class: "fill", opacity: sel }, g);
      });
      Plot.el("text", { x: xc, y: A.y(0) + 16, "text-anchor": "middle", class: "label" }, A.g).textContent = t("gaz." + a.id);
    });
  }
  function dispersion(a) {
    sd.innerHTML = "";
    const o = modele(a), lmin = 30e-9, lmax = 3e-6;
    const A = Plot.axes(sd, { fmt: F, w: 640, h: 220, x: { scale: "log", domain: [lmin * 1e9, lmax * 1e9], label: t("fig.disp.x") }, y: { domain: [0, 3], label: t("fig.disp.y") } });
    const vis = Plot.el("g", { class: "c-label" }, A.g);
    Plot.el("rect", { x: A.x(400), y: A.y(3), width: A.x(700) - A.x(400), height: A.y(0) - A.y(3), class: "fill", opacity: 0.08 }, vis);
    Plot.el("text", { x: A.x(530), y: A.y(2.7), "text-anchor": "middle", class: "label" }, vis).textContent = t("fig.visible");
    const pts = [], seg = [];
    for (let i = 0; i <= 400; i++) {
      const lam = lmin * Math.pow(lmax / lmin, i / 400), w = 2 * Math.PI * Cs.c / lam, r = 1 / (1 - (w / o.omega0) ** 2);
      if (r > 0 && r <= 3) seg.push([A.x(lam * 1e9), A.y(r)]); else if (seg.length) { pts.push(seg.splice(0)); }
    }
    if (seg.length) pts.push(seg);
    const g = Plot.el("g", { class: "c-tint" }, A.g);
    pts.forEach(s => Plot.el("path", { d: Plot.path(s), class: "stroke" }, g));
    Plot.el("line", { x1: A.x(o.lambda0 * 1e9), x2: A.x(o.lambda0 * 1e9), y1: A.y(0), y2: A.y(3), class: "stroke dash" }, g);
    Plot.el("text", { x: A.x(o.lambda0 * 1e9) + 6, y: A.y(0.3), class: "label" }, g).textContent = t("fig.l0", { l: F.num(o.lambda0 * 1e9, 3) });
  }
  function draw() {
    const a = ES.ATOMES.find(z => z.id === gaz), o = modele(a), am = o.alpha / A03;
    barres(); dispersion(a);
    $("vw").textContent = F.si(a.Ei, "eV");
    $("fw").textContent = t("f.w0", { w: F.sci(o.omega0, 3), l: F.num(o.lambda0 * 1e9, 3) });
    $("va").textContent = F.num(am, 3) + " / " + F.num(a.alphaA0, 4);
    $("fa").textContent = t("f.alpha", { r: F.num(a.alphaA0 / am, 2) });
    $("vk").textContent = F.sci(N0 * a.alpha, 3);
    $("fk").textContent = t("f.kappa", { m: F.sci(N0 * o.alpha, 3) });
  }
  document.querySelectorAll("#gaz button").forEach(bt => bt.onclick = () => {
    gaz = bt.dataset.g; document.querySelectorAll("#gaz button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  draw();
})();

/* ---------- le système décrit : de l'hélium à 273 K sous 10⁶ V/m ---------- */
(() => {
  const He = ES.ATOMES.find(a => a.id === "He"), o = modele(He), E0 = 1e6, T = 273.15;
  const p = He.alpha * ES.EPS0 * E0, x = p / e, w50 = 2 * Math.PI * 50, wv = 2 * Math.PI * Cs.c / 589e-9;
  $("sys1").innerHTML = t("sys1.body", { T: F.kelvin(T), x: F.sci(x, 2), xa: F.sci(x / a0, 2), r50: F.sci(w50 / o.omega0, 1),
    rv: F.num(wv / o.omega0, 2), cv: F.num(100 * (1 / (1 - (wv / o.omega0) ** 2) - 1), 2), Na: F.sci(N0 * He.alpha, 2), lf: F.sci(N0 * He.alpha / 3, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["stark", 1913, "experiment"], ["quantique", 1926, "idea"], ["pascal", 2018, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pression"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["statique", "b"], ["frequence", "d"], ["densite", "a"], ["hydrogene", "c"], ["xenon", "a"], ["lumiere", "d"], ["lineaire", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1102 });
})();
</script>
