<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, El = Elasticite;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- the elastica (38.47) of a pinned column of unit length, beyond Fcr ---------- */
(() => {
  const svg = $("ela");
  function upd() {
    const r = +$("r").value, e = El.elastica(r, 300);
    $("rv").textContent = F.fix(r, 3);
    /* near Fcr, the first term of the expansion: δ/L ≈ (2√2/π)√(F/Fcr − 1) */
    $("vd").textContent = F.fix(e.fleche, 3);
    $("fd").textContent = r < 1.05 ? t("ela.f.d", { s: F.fix(2 * Math.SQRT2 / Math.PI * Math.sqrt(r - 1), 3) }) : t("ela.f.loin");
    $("vc").textContent = F.fix(e.corde, 3); $("vt").textContent = F.qty(F.num(e.theta0 * 180 / Math.PI, 3), "°");
    svg.innerHTML = "";
    /* column drawn horizontal: its lower end pinned at the left, the force pushing from the right end towards it */
    const k = 400, x0 = 160, y0 = 200;
    P("line", { x1: x0 - 130, y1: y0, x2: x0 + k + 40, y2: y0, class: "stroke thin dash c-label-2" }, svg);
    P("path", { d: Plot.path(e.points.map(([x, y]) => [x0 + k * x, y0 - k * y])), class: "stroke bold c-tint" }, svg);
    P("circle", { cx: x0, cy: y0, r: 5, class: "fill c-label" }, svg);
    const xe = x0 + k * e.corde;
    P("circle", { cx: xe, cy: y0, r: 5, class: "fill c-label" }, svg);
    Plot.fleche(svg, [xe + 70, y0], [xe + 8, y0], { cls: "c-warn" });
    P("text", { x: xe + 40, y: y0 + 22, "text-anchor": "middle" }, svg).textContent = t("ela.F");
  }
  $("r").oninput = upd; upd();
})();

/* ---------- a real steel column: Euler, then EN 1993-1-1 §6.3.1 ---------- */
(() => {
  const ACIER = El.MATERIAUX.acier, IDS = ["tube", "I"], AP = ["articulee", "encastreeArticulee", "encastree", "console"];
  const NS = textOf("col.secs", IDS), NA = textOf("col.aps", AP), NC = textOf("col.courbes", Object.keys(El.COURBES));
  /* tube 168,3 × 5 hot-finished (Table 6.2: curve a); I 200 × 100 × 5,6 × 8,5, rolled, h/b = 2 > 1,2, tf ≤ 40 mm:
     it buckles about its weak axis z–z, curve b. The weak-axis I of the I: two flanges and the web. */
  const tube = Poutre.tube(0.1683, 0.005), Ip = Poutre.profilI(0.2, 0.1, 0.0056, 0.0085);
  const SECS = { tube: { A: tube.A, I: tube.I, courbe: "a" }, I: { A: Ip.A, I: 2 * 0.0085 * 0.1 ** 3 / 12 + (0.2 - 2 * 0.0085) * 0.0056 ** 3 / 12, courbe: "b" } };
  let sec = "tube", ap = "articulee";
  const LB = Array.from({ length: 301 }, (_, i) => 3 * i / 300);
  function upd() {
    const s = SECS[sec], L = +$("L").value, Lf = El.LONGUEURS[ap] * L;
    const r = El.flambementEC3({ E: ACIER.E, fy: ACIER.lim, A: s.A, I: s.I, Lf, courbe: s.courbe });
    IDS.forEach(id => $("s-" + id).setAttribute("aria-pressed", String(id === sec)));
    AP.forEach(id => $("a-" + id).setAttribute("aria-pressed", String(id === ap)));
    $("Lv").textContent = F.qty(F.num(L, 3), "m");
    $("vNcr").textContent = F.si(r.Ncr, "N"); $("fNcr").textContent = t("col.f.Ncr", { Lf: F.qty(F.num(Lf, 3), "m"), s: F.si(r.Ncr / s.A, "Pa") });
    $("vlbar").textContent = F.fix(r.lbar, 3); $("flbar").textContent = t("col.f.lbar", { l: F.num(r.lambda, 3), l1: F.num(r.lambda1, 3) });
    $("vchi").textContent = F.fix(r.chi, 3); $("fchi").textContent = t("col.f.chi", { c: NC[s.courbe] });
    $("vNb").textContent = F.si(r.NbRd, "N"); $("fNb").textContent = t(r.negligeable ? "col.f.negl" : "col.f.Nb", { p: F.si(s.A * ACIER.lim, "N"), e: F.si(Math.min(r.Ncr, s.A * ACIER.lim), "N") });
    /* χ(λ̄) for the five curves, the plateau-then-Euler ideal, and the column */
    const svg = $("chi"); svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 52 }, x: { domain: [0, 3], label: t("col.x") }, y: { domain: [0, 1.1], label: t("col.y") } });
    P("path", { d: Plot.path(LB.map(l => [o.x(l), o.y(Math.min(1, l > 0 ? 1 / (l * l) : 1))])), class: "stroke thin dash c-warn" }, o.g);
    Object.keys(El.COURBES).forEach(c => P("path", { d: Plot.path(LB.map(l => [o.x(l), o.y(El.chi(l, c))])), class: c === s.courbe ? "stroke bold c-tint" : "stroke thin c-label-2" }, o.g));
    if (r.lbar <= 3) P("circle", { cx: o.x(r.lbar), cy: o.y(r.chi), r: 6, class: "fill c-tint" }, o.g);
    P("text", { x: o.x(1.25), y: o.y(0.78), "text-anchor": "start" }, o.g).textContent = t("col.l.euler");
  }
  $("L").oninput = upd;
  IDS.forEach(id => { $("s-" + id).textContent = NS[id]; $("s-" + id).onclick = () => { sec = id; upd(); }; });
  AP.forEach(id => { $("a-" + id).textContent = NA[id]; $("a-" + id).onclick = () => { ap = id; upd(); }; });
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["methodus", 1744, "idea"], ["colonnes", 1757, "idea"], ["quebec", 1907, "experiment"], ["ec3", 2005, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["poteaux", "contreventement", "legeres"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["seuil", "b"], ["longueur", "a"], ["axe", "d"], ["console", "c"], ["court", "b"], ["reel", "a"], ["elastica", "c"], ["contreventement", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
