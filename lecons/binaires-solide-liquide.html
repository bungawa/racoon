<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, B = ChimSolutions.Binaires;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- diagramme solide-liquide : modèle idéal et mesures ---------- */
(() => {
  const svg = $("sl"), sx = $("slx"), sT = $("slT");
  /* measured points, x = fraction of the second metal: pure bodies, eutectic, ends of the eutectic line */
  const SYS = {
    BiCd: { a: "Bi", b: "Cd", T: [340, 620], E: [0.553, 419.15], fin: [0, 1] },
    PbSn: { a: "Pb", b: "Sn", T: [300, 620], E: [0.741, 455.35], fin: [0.289, 0.980] },
  };
  const DOM = textOf("sl.dom", ["L", "L+a", "L+b", "a+b", "a", "b"]);
  let cur = "BiCd", ax;
  const xOf = () => +sx.value / 1000, TOf = () => SYS[cur].T[0] + (SYS[cur].T[1] - SYS[cur].T[0]) * +sT.value / 1000;
  function dessiner() {
    const S = SYS[cur];
    svg.textContent = "";
    ax = Plot.axes(svg, { fmt: F, w: 640, h: 380, pad: { b: 44, l: 60 },
      x: { domain: [0, 1], label: t("sl.xlab." + cur), fmt: v => F.num(v, 2) }, y: { domain: S.T, label: t("sl.ylab") } });
    const { x, y, g } = ax, c = B.courbesSL(S.a, S.b, 120);
    P("path", { d: Plot.path(c.a.concat(c.b).map(([xa, T]) => [x(1 - xa), y(T)])), class: "stroke c-tint" }, g);
    P("path", { d: Plot.path([[x(0), y(c.E.T)], [x(1), y(c.E.T)]]), class: "stroke thin c-tint" }, g);
    const TA = B.CORPS[S.a].Tf, TB = B.CORPS[S.b].Tf, [xE, TE] = S.E;
    P("path", { d: Plot.path([[x(0), y(TA)], [x(xE), y(TE)], [x(1), y(TB)]]), class: "stroke thin dash c-warn" }, g);
    P("path", { d: Plot.path([[x(S.fin[0]), y(TE)], [x(S.fin[1]), y(TE)]]), class: "stroke thin dash c-warn" }, g);
    [[0, TA], [xE, TE], [1, TB]].forEach(([u, T]) => P("circle", { cx: x(u), cy: y(T), r: 4, class: "fill c-warn" }, g));
    ax.dot = P("circle", { r: 6, class: "dot" }, g);
    ax.conode = P("path", { class: "stroke thin dash c-label-2" }, g);
  }
  function upd() {
    const S = SYS[cur], xb = xOf(), T = TOf(), { x, y } = ax, e = B.etatSL(S.a, S.b, 1 - xb, T);
    $("slxv").textContent = F.fix(xb, 3); $("slTv").innerHTML = F.kelvin(T);
    ax.dot.setAttribute("cx", x(xb)); ax.dot.setAttribute("cy", y(T));
    const d = DOM[e.domaine], nom = { a: S.a, b: S.b };
    $("sldom").textContent = d.name.replace("{a}", nom.a).replace("{b}", nom.b); $("sldomf").textContent = d.text.replace("{a}", nom.a).replace("{b}", nom.b);
    if (e.domaine === "L+a" || e.domaine === "L+b") {
      const xl = 1 - e.xL, xs = e.domaine === "L+a" ? 0 : 1;
      ax.conode.setAttribute("d", Plot.path([[x(xs), y(T)], [x(xl), y(T)]]));
      $("slliq").textContent = F.fix(xl, 3); $("slliqf").textContent = t("sl.f.frac", { f: F.num(100 * e.fL, 3) });
    } else {
      ax.conode.setAttribute("d", "");
      $("slliq").textContent = e.domaine === "L" ? F.fix(xb, 3) : "–"; $("slliqf").textContent = t(e.domaine === "L" ? "sl.f.tout" : "sl.f.rien");
    }
    const phi = { L: 1, "L+a": 2, "L+b": 2, "a+b": 2, a: 1, b: 1 }[e.domaine], c = e.domaine === "a" || e.domaine === "b" ? 1 : 2;
    $("slv").textContent = String(c + 1 - phi); $("slvf").textContent = t("sl.f.v", { c, phi });
  }
  const segs = $("sys").querySelectorAll("button");
  const choisir = m => { cur = m; segs.forEach(bt => bt.setAttribute("aria-pressed", String(bt.dataset.m === m))); dessiner(); upd(); };
  segs.forEach(bt => bt.onclick = () => choisir(bt.dataset.m));
  sx.oninput = sT.oninput = upd;
  choisir(cur);
})();

/* ---------- allure d'un diagramme à composé défini à fusion congruente ---------- */
(() => {
  const svg = $("cd"), l = 60, r = 620, h = 250, top = 20, X = u => l + (r - l) * u, Y = v => h - (h - top) * v;
  P("path", { d: Plot.path([[l, top], [l, h], [r, h], [r, top]]), class: "stroke thin c-label-2" }, svg);
  const liq = [[0, 0.62], [0.06, 0.5], [0.11, 0.36], [0.2, 0.62], [1 / 3, 0.9], [0.45, 0.68], [0.55, 0.45], [0.7, 0.58], [1, 0.8]].map(([u, v]) => [X(u), Y(v)]);
  P("path", { d: "M" + liq.map(p => p.map(n => n.toFixed(1)).join(" ")).join("L"), class: "stroke c-tint" }, svg);
  P("path", { d: Plot.path([[X(0), Y(0.36)], [X(1 / 3), Y(0.36)]]), class: "stroke thin c-tint" }, svg);
  P("path", { d: Plot.path([[X(1 / 3), Y(0.45)], [X(1), Y(0.45)]]), class: "stroke thin c-tint" }, svg);
  P("path", { d: Plot.path([[X(1 / 3), Y(0.9)], [X(1 / 3), h]]), class: "stroke c-warn" }, svg);
  const L = textOf("cd.labels", ["A", "B", "AB", "liq", "E1", "E2", "fus", "s1", "s2"]);
  [["A", 0, -0.08, "middle"], ["B", 1, -0.08, "middle"], ["AB", 1 / 3, -0.08, "middle"], ["liq", 0.62, 0.86, "middle"], ["E1", 0.11, 0.3, "middle"],
   ["E2", 0.55, 0.39, "middle"], ["fus", 1 / 3, 0.95, "middle"], ["s1", 0.16, 0.18, "middle"], ["s2", 0.68, 0.22, "middle"]]
    .forEach(([k, u, v, a]) => { P("text", { x: X(u), y: Y(v) + (v < 0 ? 4 : 0), "text-anchor": a }, svg).textContent = L[k]; });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gibbs", 1876, "idea"], ["guthrie", 1884, "experiment"], ["schroder", 1893, "idea"], ["roozeboom", 1900, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sel", "melange", "soudure"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["liquidus", "b"], ["eutectique", "d"], ["variance", "a"], ["modele", "c"], ["pbsn", "b"], ["congruent", "a"], ["sel", "c"], ["solide", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
