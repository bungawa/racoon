<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, EV = Constantes.e, NM = 1e-9;

/* ---------- the band of the chain against its parabola, and the amplitudes on the atoms ---------- */
(() => {
  const svg = $("bande"), ch = $("chaine"), skb = $("skb"), sa = $("sa"), sb = $("sb");
  function draw() {
    const kb = +skb.value, A = +sa.value * EV, b = +sb.value * NM, o = { E0: 0, A, b };
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { domain: [0, Math.PI], label: t("fig.x"), fmt: v => F.num(v, 3) }, y: { domain: [0, 6], label: t("fig.y") } });
    const cos = [], par = [];
    for (let i = 0; i <= 200; i++) { const x = Math.PI * i / 200, k = x / b;
      cos.push([ax.x(x), ax.y((Q.bandeChaine(k, o) + 2 * A) / A)]);
      const y = (Q.dispersionParabolique(k, o) + 2 * A) / A; if (y <= 6) par.push([ax.x(x), ax.y(y)]); }
    Plot.el("path", { d: Plot.path(cos), class: "stroke bold c-tint" }, ax.g);
    Plot.el("path", { d: Plot.path(par), class: "stroke dash c-warn" }, ax.g);
    Plot.el("circle", { cx: ax.x(kb), cy: ax.y((Q.bandeChaine(kb / b, o) + 2 * A) / A), r: 5, class: "fill c-tint" }, ax.g);
    /* Re C(x_n) on 24 atoms, and the continuous wave it samples */
    ch.innerHTML = "";
    const N = 24, x0 = 20, dx = 600 / (N - 1), y0 = 60, R = 40, onde = [];
    Plot.el("line", { x1: 10, x2: 630, y1: y0, y2: y0, class: "stroke thin c-label-2" }, ch);
    for (let i = 0; i <= 600; i++) onde.push([x0 + i, y0 - R * Math.cos(kb * i / dx)]);
    Plot.el("path", { d: Plot.path(onde), class: "stroke thin c-label-2" }, ch);
    for (let n = 0; n < N; n++) { const X = x0 + n * dx, Y = y0 - R * Math.cos(kb * n);
      Plot.el("line", { x1: X, x2: X, y1: y0, y2: Y, class: "stroke c-tint" }, ch);
      Plot.el("circle", { cx: X, cy: Y, r: 3.5, class: "fill c-tint" }, ch); }
    const m = Q.masseEffectiveChaine(0, o), lam = 2 * Math.PI * b / Math.max(kb, 1e-9);
    $("skbr").textContent = F.fix(kb, 2);
    $("sar").textContent = F.qty(F.fix(+sa.value, 2), "eV");
    $("sbr").textContent = F.qty(F.fix(+sb.value, 2), "nm");
    $("vm").textContent = t("fig.v.masse", { v: F.num(m / Q.m_e, 3) });
    $("fm").textContent = t("fig.f.masse", { v: F.si(m, "kg") });
    $("ve").textContent = kb > 0 ? F.num(100 * Q.ecartParabolique(kb), 2) + "\u00a0%" : "0\u00a0%";
    $("fe").textContent = t("fig.f.ecart", { v: F.num(100 * kb * kb / 12, 2) + "\u00a0%" });
    $("vl").textContent = kb > 0 ? t("fig.v.lambda", { v: F.num(lam / b, 3) }) : t("fig.v.infini");
    $("fl").textContent = kb > 0 ? t("fig.f.lambda", { v: F.si(lam, "m") }) : t("fig.f.uniforme");
  }
  skb.oninput = sa.oninput = sb.oninput = draw; draw();
})();

/* ---------- the system described: when can the chain be read as a continuous line? ---------- */
(() => {
  const m = Q.m_e, h = Constantes.h, b = 0.2 * NM;
  const lam = E => h / Math.sqrt(2 * m * E * EV), kb = E => 2 * Math.PI * b / lam(E);
  const Alibre = Q.hbar ** 2 / (2 * m * b * b) / EV;
  $("sys1").innerHTML = t("sys1.body", { a: F.qty(F.num(Alibre, 3), "eV"), b: F.qty(F.fix(0.2, 1), "nm") });
  $("sys2").innerHTML = t("sys2.body", { l1: F.si(lam(0.025), "m"), k1: F.num(kb(0.025), 2), e1: F.num(100 * Q.ecartParabolique(kb(0.025)), 2),
    l2: F.si(lam(1), "m"), k2: F.num(kb(1), 2), e2: F.num(100 * Q.ecartParabolique(kb(1)), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["floquet", 1883, "idea"], ["broglie", 1925, "idea"], ["schrodinger", 1926, "idea"], ["bloch", 1929, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["semi"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["base", "c"], ["onde", "a"], ["courbure", "d"], ["limite", "b"], ["masse", "c"], ["ecart", "a"], ["libre", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1601 });
})();
</script>
