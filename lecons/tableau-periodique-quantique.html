<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const T = TableauQ, Q = QuantSchro, eV = Constantes.e, SYM = [null, ...t("fig.sym")];
const lie = T.IONISATION_EV[2] + 4 * Q.ER / eV, sans = 8 * Q.ER / eV;
$("sys1").innerHTML = t("sys.body", { he: F.qty(F.num(lie, 3), "eV"), sans: F.qty(F.num(sans, 4), "eV"), rep: F.qty(F.num(sans - lie, 3), "eV") });
(() => {
  const svg = $("ion"), sz = $("sz");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [0, 37], label: t("fig.x") }, y: { domain: [0, 26], label: t("fig.y") } });
  const BLOC = ["c-tint", "c-ok", "c-label-2"], bars = [];
  for (let Z = 1; Z <= T.ZMAX; Z++) {
    const l = T.configuration(Z).slice(-1)[0].l, W = T.IONISATION_EV[Z];
    bars.push(Plot.el("rect", { x: (x(Z - 0.4)).toFixed(1), width: (x(0.8) - x(0)).toFixed(1), y: y(W).toFixed(1), height: (y(0) - y(W)).toFixed(1), class: "fill " + BLOC[l] }, g));
    const s = Plot.el("text", { x: x(Z).toFixed(1), y: (y(W) - 4).toFixed(1), "text-anchor": "middle", class: "tick" }, g); s.textContent = [2, 10, 18, 36, 3, 11, 19, 24, 29].includes(Z) ? SYM[Z] : "";
  }
  const zh = Plot.el("g", {}, g);
  function draw() {
    const Z = +sz.value, c = T.configuration(Z), W = T.IONISATION_EV[Z], e = T.externe(Z);
    zh.replaceChildren();
    Plot.el("rect", { x: (x(Z - 0.5)).toFixed(1), width: (x(1) - x(0)).toFixed(1), y: y(26), height: (y(0) - y(26)).toFixed(1), class: "fill c-warn", "fill-opacity": 0.18 }, zh);
    bars.forEach((b, i) => b.setAttribute("fill-opacity", i + 1 === Z ? 1 : 0.55));
    $("szr").textContent = Z + " · " + SYM[Z];
    $("vc").innerHTML = c.map(s => s.n + "spdf"[s.l] + "<sup>" + s.occ + "</sup>").join(" ");
    $("fc").textContent = [24, 29].includes(Z) ? t("fig.f.exception") : t("fig.f.conf", { n: e.n, c: "spdf"[e.l] });
    $("vw").textContent = F.qty(F.num(W, 4), "eV");
    $("fw").textContent = Z > 1 ? t("fig.f.w", { d: (W >= T.IONISATION_EV[Z - 1] ? "+" : "−") + F.qty(F.num(Math.abs(W - T.IONISATION_EV[Z - 1]), 3), "eV"), p: SYM[Z - 1] }) : t("fig.f.h");
    $("vz").textContent = F.num(T.zEffectif(Z), 3);
    $("fz").textContent = t("fig.f.zeff", { Z, n: e.n });
  }
  sz.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mendeleiev", 1869, "idea"], ["stoner", 1924, "idea"], ["pauli", 1925, "idea"], ["hartree", 1928, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["calcul"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["helium", "b"], ["pauli", "d"], ["s2p", "a"], ["na", "c"], ["oxygene", "a"], ["cuivre", "b"], ["eau", "d"], ["zeff", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 196 });
})();
</script>
