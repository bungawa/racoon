<!doctype html>
<html lang="fr">
<head>

<title>Microscope électronique</title>

<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-magnetisme-induction" data-i18n="monde.magnetisme-induction"></a><span class="aux">›</span><a href="/racoon/etape?id=focalisation" data-i18n="etape.focalisation"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-em" href="/racoon/atlas?piste=em" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/lentille-magnetique" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><mi>δ</mi><mo>≈</mo><mfrac><mi>λ</mi><mrow><mi data-i18n="eq.sin"></mi><mo>⁡</mo><mi>θ</mi></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.delta"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><mi>λ</mi><mo>=</mo><mfrac><mi>h</mi><mi>p</mi></mfrac><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><msqrt><mrow><mi>e</mi><mi>U</mi><mo>(</mo><mi>e</mi><mi>U</mi><mo>+</mo><mn>2</mn><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup><mo>)</mo></mrow></msqrt></mfrac></math></div>
    <p class="validite" id="val-lambda" data-i18n-html="val.lambda"></p>
    <p id="s1p3" data-i18n-html="s1.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>δ</mi><mo>(</mo><mi>α</mi><mo>)</mo><mo>≈</mo><msqrt><msup><mrow><mo>(</mo><mfrac><mrow><mn>0,61</mn><mi>λ</mi></mrow><mi>α</mi></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mo>+</mo><msup><mrow><mo>(</mo><msub><mi>C</mi><mi mathvariant="normal">s</mi></msub><msup><mi>α</mi><mn>3</mn></msup><mo>)</mo></mrow><mn>2</mn></msup></msqrt><mo>,</mo><mspace width="1em"/><msup><mi>α</mi><mo>*</mo></msup><mo>=</mo><msup><mrow><mo>(</mo><mfrac><mrow><mn>0,61</mn><mi>λ</mi></mrow><mrow><msqrt><mn>3</mn></msqrt><msub><mi>C</mi><mi mathvariant="normal">s</mi></msub></mrow></mfrac><mo>)</mo></mrow><mrow><mn>1</mn><mo>/</mo><mn>4</mn></mrow></msup></math></div>
    <p class="validite" data-i18n-html="val.compromis"></p>
    <p data-i18n-html="s2.p2"></p>
    <figure>
      <svg class="fig" id="res" viewBox="0 0 640 320" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.total"></span><span class="c-label-2" data-i18n="fig.legend.diff"></span><span class="c-warn" data-i18n="fig.legend.aber"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="cu" data-i18n="fig.u"></label><output id="cuo" for="cu"></output></div>
            <input id="cu" type="range" min="20" max="300" step="10" value="200"></div>
          <div class="ctl"><div class="row"><label for="cc" data-i18n="fig.cs"></label><output id="cco" for="cc"></output></div>
            <input id="cc" type="range" min="-2" max="0.7" step="0.01" value="0.08"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.lambda"></span><span class="v" id="vl"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.alpha"></span><span class="v" id="va"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.delta"></span><span class="v" id="vd"></span><span class="f" id="vdl"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.scherzer"></span><span class="v" id="vs"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><msub><mi>d</mi><mi mathvariant="normal">S</mi></msub><mo>≈</mo><mn>0,65</mn><msup><mrow><mo>(</mo><msub><mi>C</mi><mi mathvariant="normal">s</mi></msub><msup><mi>λ</mi><mn>3</mn></msup><mo>)</mo></mrow><mrow><mn>1</mn><mo>/</mo><mn>4</mn></mrow></msup><mo>,</mo><mspace width="1em"/><mi>Δ</mi><mi>f</mi><mo>=</mo><mo>−</mo><mn>1,2</mn><msqrt><mrow><msub><mi>C</mi><mi mathvariant="normal">s</mi></msub><mi>λ</mi></mrow></msqrt></math></div>
    <p class="validite" data-i18n-html="val.scherzer"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="box prop"><b data-i18n="s3.prop.title"></b>
      <p data-i18n-html="s3.prop.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/microscope-electronique.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/physique-fondamentale.js"></script>
<script src="/racoon/lecons/champs-em.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/magnetisme-induction.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m);
const $ = id => document.getElementById(id);
const M = MagInd, e = Constantes.e, me = Constantes.m_e, C = Constantes.c, H = Constantes.h;

/* ---------- textes chiffrés ---------- */
(() => {
  const l50 = M.resolutionMicroscope(5e4, 1e-3).lambda, newton = H / Math.sqrt(2 * me * e * 5e4);
  $("val-lambda").innerHTML = t("val.lambda", { l: F.si(l50, "m"), ecart: F.num(100 * (newton - l50) / l50, 2) });
  $("s1p3").innerHTML = t("s1.p3", { d: F.si(l50 / Math.sin(Math.PI / 6), "m"), lv: F.si(550e-9, "m") });
  const R = M.resolutionMicroscope(2e5, 1.2e-3);
  $("sys").innerHTML = t("sys.body", { l: F.si(R.lambda, "m"), a: F.si(R.alphaOpt, "rad"), d: F.si(R.deltaOpt, "m"), n: F.num(R.deltaOpt / R.lambda, 2),
    s: F.si(R.scherzer.d, "m"), rel: F.num(e * 2e5 / (me * C * C), 2) });
})();

/* ---------- le compromis : diffraction contre aberration ---------- */
(() => {
  const svg = $("res"), El = Plot.el;
  function draw() {
    const U = +$("cu").value * 1000, Cs = Math.pow(10, +$("cc").value) * 1e-3, R = M.resolutionMicroscope(U, Cs);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { l: 60, r: 16, t: 12, b: 40 }, x: { scale: "log", domain: [0.1, 100], label: t("fig.alpha") }, y: { scale: "log", domain: [0.01, 100], label: t("fig.delta") } });
    const curve = (f, cls) => { const pts = []; for (let i = 0; i <= 200; i++) { const a = 1e-4 * Math.pow(1000, i / 200), d = f(a) * 1e9;
      if (d >= 0.01 && d <= 100) pts.push([x(a * 1000), y(d)]); } if (pts.length > 1) El("path", { d: Plot.path(pts), class: cls }, g); };
    curve(R.diffraction, "stroke thin c-label-2 dash"); curve(R.aberration, "stroke thin c-warn dash"); curve(R.total, "stroke c-tint");
    if (R.alphaOpt > 1e-4 && R.alphaOpt < 0.1) El("circle", { cx: x(R.alphaOpt * 1000), cy: y(R.deltaOpt * 1e9), r: 5, class: "fill c-tint" }, g);
    $("cuo").textContent = F.si(U, "V"); $("cco").textContent = F.si(Cs, "m");
    $("vl").textContent = F.si(R.lambda, "m"); $("va").textContent = F.si(R.alphaOpt, "rad");
    $("vd").textContent = F.si(R.deltaOpt, "m"); $("vdl").textContent = t("fig.k.ratio", { n: F.num(R.deltaOpt / R.lambda, 3) });
    $("vs").textContent = F.si(R.scherzer.d, "m");
  }
  $("cu").oninput = draw; $("cc").oninput = draw; draw();
})();
F.autoTypo(document.querySelector("main"));

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["deux", 1931, "experiment"], ["optique", 1933, "experiment"], ["scherzer", 1936, "idea"], ["serie", 1939, "use"],
    ["nobel", 1986, "idea"], ["correcteur", 1998, "experiment"], ["ptycho", 2021, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(x => x[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["materiaux"], uses = textOf("uses.items", USES), r = M.resolutionMicroscope(3e5, 1e-3).lambda;
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${fill(uses[id].text, { l: F.si(r, "m") })}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pourquoi", "a"], ["limite", "c"], ["compromis", "b"], ["quart", "d"], ["tension", "a"], ["scherzer", "b"], ["correcteur", "c"], ["relativite", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 295 });
})();
</script>
</body>
</html>
