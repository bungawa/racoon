<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I.fallback : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, sym = s => t("chim.sym", { s }), $ = id => document.getElementById(id);
const peindre = (svg, m, o) => { const d = O.dessin(m, Object.assign({ texte: sym }, o)); svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; };
const svgVide = aria => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("class", "fig no-sigle"); s.setAttribute("role", "img"); s.setAttribute("aria-label", aria); return s; };

/* ---------- mécanisme : propanone + Ph₃P=CH₂ ---------- */
(() => {
  const PAS = [["acetone", null], ["plus"], ["ylureMethylene", { 1: "grp.pph3" }], ["fleche"], ["oxaphosphetane", { 2: "grp.pph3" }], ["fleche"], ["methylpropene", null], ["plus"], ["oxydePhosphine", { 0: "grp.ph3p" }]];
  const noms = textOf("meca.noms", ["acetone", "ylureMethylene", "oxaphosphetane", "methylpropene", "oxydePhosphine"]);
  PAS.forEach(([id, et]) => {
    if (id === "plus" || id === "fleche") { const s = document.createElement("span"); s.className = "aux"; s.textContent = t("meca." + id); $("meca").appendChild(s); return; }
    const svg = svgVide(noms[id]), etiquettes = {};
    Object.entries(et || {}).forEach(([i, k]) => { etiquettes[i] = t(k); });
    $("meca").appendChild(svg); peindre(svg, O.molecule(id), { etiquettes, echelle: 30 });
  });
})();

/* ---------- rétrosynthèse : deux voies par alcène ---------- */
(() => {
  const IDS = ["methylenecyclohexane", "pent2eneZ", "pent2eneE", "cinnamateEthyleE"], noms = textOf("ret.noms", IDS);
  const sel = $("cible");
  sel.innerHTML = IDS.map(id => `<option value="${id}">${noms[id].cible}</option>`).join("");
  function maj() {
    const id = sel.value, m = O.molecule(id), voies = O.voiesWittig(m), n = noms[id];
    peindre($("svgcible"), m, { echelle: 34 });
    $("voies").innerHTML = "";
    voies.forEach((v, k) => {
      const div = document.createElement("div"), mols = document.createElement("div"), p = document.createElement("p"), h = document.createElement("h3");
      div.className = "voie"; mols.className = "mols"; p.className = "readout";
      h.textContent = t("ret.voie", { k: k + 1 });
      const s1 = svgVide(n["c" + k]), s2 = svgVide(t("ret.ylure")), s3 = svgVide(n["h" + k]);
      mols.append(s1, s2, s3); div.append(h, mols, p); $("voies").appendChild(div);
      peindre(s1, v.carbonyle, { echelle: 26 }); peindre(s2, v.ylure, { echelle: 26, etiquettes: { [v.phosphore]: t("grp.pph3") } }); peindre(s3, v.halogenure, { echelle: 26 });
      const iso = v.majoritaire === null ? t("ret.iso.aucun") : v.majoritaire === "melange" ? t("ret.iso.melange")
        : t(v.majoritaire === v.cible ? "ret.iso.bon" : "ret.iso.autre", { d: v.majoritaire });
      p.textContent = t("ret.lecture", { c: n["c" + k], h: n["h" + k], classe: t("ret.classe." + v.classe), type: t("ret.type." + v.type), iso });
    });
    $("eco").textContent = t("ret.eco", { e: F.num(100 * voies[0].economie, 2) });
  }
  sel.onchange = maj;
  maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wittig", 1954, "experiment"], ["horner", 1958, "idea"], ["hwe", 1961, "experiment"], ["schlosser", 1966, "idea"], ["nobel", 1979, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["vitamineA", "phosphonates"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ylure", "c"], ["force", "a"], ["retro", "d"], ["stabilise", "b"], ["nonstab", "a"], ["secondaire", "c"], ["economie", "d"], ["regio", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
