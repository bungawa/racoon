<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9, A = 0.05;
const OPTIONS = { terre: { mode: "terre" }, neutre: { mode: "isolee" }, chargee: { mode: "isolee", Q: NC } };

/* ---------- le système décrit : une perle chargée devant une boule de 10 cm ---------- */
(() => {
  const r = 1e-3, b = 0.1, D = 1;
  $("sys1").innerHTML = t("sys1.body", { r1: F.num(r / (b - A), 2), r2: F.num(A / D, 2), b0: F.si(ES.equilibreSphere(NC, A, NC) - A, "m", { prefix: "m" }) });
})();

/* ---------- la charge, la sphère, ses images (q = 1 nC, a = 5 cm) ---------- */
(() => {
  const svg = $("carte"), fsvg = $("force"), bsl = $("bsl"), O = { W: 640, H: 320, x0: -0.08, x1: 0.22, y0: -0.075, y1: 0.075 };
  const OPT = { r0: 1.2e-3, ds: 8e-4, n: 900, loin: 0.6 };
  let mode = "terre";
  const plan = ch => ch.map(s => ({ q: s.q, x: s.x, y: 0 }));
  function carte(b) {
    const s = ES.imagesSphere(NC, b, A, OPTIONS[mode]), ch = plan(s.charges).filter(c => c.q !== 0);
    const c = CarteChamp.carte(svg, O), m = c.layer("c-label-2"), R = c.sx(A) - c.sx(0);
    Plot.el("circle", { cx: c.sx(0).toFixed(1), cy: c.sy(0).toFixed(1), r: R.toFixed(1), class: "fill", opacity: "0.3" }, m);
    const lg = c.layer("c-tint"), dans = p => Math.hypot(p[0], p[1]) <= A;
    const tracer = (i, n, u) => ES.anglesEgalFlux(n).forEach(al => [1, -1].forEach(sg => {
      const out = [];
      for (const p of ES.suivreLigne(ch, i, sg * al, Object.assign({ u }, OPT)).points) { out.push(p); if (dans(p) || p[0] < O.x0 - 0.02 || p[0] > O.x1 + 0.02 || Math.abs(p[1]) > O.y1 + 0.02) break; }
      if (out.length > 1) Plot.el("polyline", { points: out.map(p => c.sx(p[0]).toFixed(1) + "," + c.sy(p[1]).toFixed(1)).join(" "), class: "stroke thin" }, lg);
    }));
    tracer(0, 10, [-1, 0]);
    CarteChamp.point(c, [b, 0], 4, "c-warn", t("fig.nom.q"));
    ch.slice(1).forEach((k, j) => CarteChamp.point(c, [k.x, 0], 3, k.q < 0 ? "c-tint" : "c-warn", t(k.x === 0 ? "fig.nom.qs" : "fig.nom.qp"), j ? 16 : -10));
    return s;
  }
  function courbes(b) {
    fsvg.innerHTML = "";
    const { x, y, g } = Plot.axes(fsvg, { fmt: F, w: 640, h: 260, x: { domain: [1, 5], label: t("force.x") }, y: { scale: "log", domain: [1e-4, 1e3], label: t("force.y") } });
    const U = ES.K * NC * NC / (A * A), bs = Array.from({ length: 300 }, (_, i) => A * (1.02 + 3.98 * i / 299));
    [["terre", "c-tint"], ["neutre", "c-ok"], ["chargee", "c-warn"]].forEach(([m, cls]) => {
      const pts = bs.map(B => [B, ES.forceSphere(NC, B, A, OPTIONS[m]) / U]);
      const seg = sgn => Plot.el("path", { d: Plot.path(pts.filter(p => Math.sign(p[1]) === sgn && Math.abs(p[1]) > 1e-4).map(p => [x(p[0] / A), y(Math.min(1e3, Math.abs(p[1])))])), class: "stroke " + cls + (sgn > 0 ? " dash" : "") + (m === mode ? "" : " thin") }, g);
      seg(-1); seg(1);
    });
    Plot.el("line", { x1: x(b / A), x2: x(b / A), y1: y(1e-4), y2: y(1e3), class: "stroke thin dash c-label" }, g);
  }
  function draw() {
    const b = +bsl.value * A, s = carte(b), Fq = ES.forceSphere(NC, b, A, OPTIONS[mode]);
    courbes(b);
    const sg = th => ES.sigmaSphere(NC, b, A, OPTIONS[mode], th);
    $("bread").textContent = t("fig.bv", { r: F.num(+bsl.value, 3), b: F.si(b, "m", { prefix: "m" }) });
    $("vi").textContent = t("fig.v.images", { q: F.si(s.qImage, "C", { prefix: "n" }), x: F.si(s.xImage, "m", { prefix: "m" }) });
    $("fi").textContent = t("fig.f.images", { q: F.si(s.qCentre, "C", { prefix: "n" }), V: F.si(s.V, "V") });
    $("vF").textContent = F.si(Math.abs(Fq), "N", { prefix: "µ" });
    $("fF").textContent = t(Fq < 0 ? "fig.f.attire" : "fig.f.repousse");
    $("vs").textContent = F.si(sg(0), "C·m⁻²", { prefix: "n" });
    $("fs").textContent = t("fig.f.sigma", { s: F.si(sg(Math.PI), "C·m⁻²", { prefix: "n" }) });
  }
  document.querySelectorAll("#modes button").forEach(bt => bt.onclick = () => {
    mode = bt.dataset.m; document.querySelectorAll("#modes button").forEach(z => z.setAttribute("aria-pressed", z === bt)); draw(); });
  bsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["points", 1845, "idea"], ["deux", 1853, "idea"], ["lekner", 2012, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["eclateur", "poussieres"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["image", "a"], ["rapport", "c"], ["neutre", "b"], ["potentiel", "d"], ["loin", "a"], ["pres", "c"], ["memes", "d"], ["terre", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 69 });
})();
</script>
