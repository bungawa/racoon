<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OndesMilieux, c = Constantes.c;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- une, deux ou trois ondes planes de 2,4 GHz (λ ≈ 12,5 cm) dans le plan xy, E selon z : la carte de E_z ---------- */
(() => {
  const f = 2.4e9, lam = c / f, W = 1.0, H = 0.6, NX = 80, NY = 48, PX = 640 / NX, PY = 384 / NY;
  const svg = $("carte"), cells = [];
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++)
    cells.push(Plot.el("rect", { x: (i * PX).toFixed(1), y: (j * PY).toFixed(1), width: (PX + 0.3).toFixed(1), height: (PY + 0.3).toFixed(1), class: "fill c-tint", opacity: "0" }, svg));
  const fleches = Plot.el("g", {}, svg);
  Plot.el("line", { x1: 0, x2: 640 * 0.125 / W, y1: 394, y2: 394, class: "stroke c-label-2" }, svg);
  const echelle = Plot.el("text", { x: 640 * 0.125 / W + 8, y: 398 }, svg);
  let n = 2;
  function draw() {
    const a = +$("ca").value * Math.PI / 180, ph = +$("ct").value;
    const dirs = [0, a, -a].slice(0, n), S = O.ondesPlanes(dirs.map(th => ({ A: 1, theta: th })), lam), tt = ph / f;
    let mx = 0; const v = [];
    for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) { const p = S.psi((i + 0.5) * W / NX, H - (j + 0.5) * H / NY, tt); v.push(p); mx = Math.max(mx, Math.abs(p)); }
    v.forEach((p, k) => { cells[k].setAttribute("class", "fill " + (p >= 0 ? "c-tint" : "c-warn")); cells[k].setAttribute("opacity", (Math.abs(p) / n).toFixed(3)); });
    fleches.innerHTML = "";
    dirs.forEach((th, k) => { const x0 = 50 + 70 * k, y0 = 340; Plot.fleche(fleches, [x0, y0], [x0 + 36 * Math.cos(th), y0 - 36 * Math.sin(th)], { cls: "c-label", trait: "stroke bold" }); });
    echelle.textContent = t("carte.echelle", { l: F.si(lam, "m", { prefix: "m" }) });
    $("cav").textContent = F.num(+$("ca").value, 3) + " °"; $("ctv").textContent = t("carte.f.t", { p: F.num(ph, 2) });
    const fr = n === 1 ? Infinity : O.interfrange(lam, a);
    $("vi").textContent = isFinite(fr) ? F.si(fr, "m", { prefix: "m" }) : t("carte.sans");
    $("fi").textContent = n === 1 ? t("carte.f.une") : t("carte.f.i", { l: F.si(lam, "m", { prefix: "m" }) });
    $("vmax").textContent = F.num(mx, 3); $("fmax").textContent = t("carte.f.max", { n });
    const r = O.residuOnde((x, y, z, u) => S.psi(x, y, u), [0.43, 0.27, 0], tt, 1e-4);
    $("vres").textContent = F.sci(Math.abs(r.relatif), 1); $("fres").textContent = t("carte.f.res");
    $("nb").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.n === n)));
  }
  $("nb").querySelectorAll("button").forEach(b => b.onclick = () => { n = +b.dataset.n; draw(); });
  $("ca").oninput = $("ct").oninput = draw; draw();
})();

/* ---------- le système décrit : ce qui traverse une pièce de 5 m, source par source ---------- */
(() => {
  const L = 5, T = 310;
  const SOURCES = [["terre", 0], ["reseau", 50], ["fm", 100e6], ["wifi", 2.4e9], ["front", c / O.wien(T)], ["lumiere", c / 550e-9]];
  const txt = textOf("piece.items", SOURCES.map(s => s[0]));
  $("piece").innerHTML = SOURCES.map(([id, f]) => {
    const r = O.regime(L, f), x = txt[id];
    const chiffres = f === 0 ? t("piece.statique") : t("piece.chiffres", { f: F.si(f, "Hz"), l: F.si(r.lambda, "m"), r: r.rapport < 1e-2 || r.rapport > 1e3 ? F.sci(r.rapport, 1) : F.num(r.rapport, 2) });
    return `<div><span class="k">${x.name}</span><span>${chiffres} ${x.text}</span></div>`;
  }).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fourier", 1822, "idea"], ["jansky", 1933, "experiment"], ["mariner", 1962, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["wifi"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["div", "c"], ["generale", "a"], ["interfrange", "d"], ["creux", "b"], ["reseau", "a"], ["b", "c"], ["transverse", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 202 });
})();
</script>
