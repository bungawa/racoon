    <p data-i18n-html="s4.p1"></p>
    <div class="eq"><math display="block"><mi>s</mi><mo>(</mo><mi>t</mi><mo>)</mo><mo>×</mo><mn>2</mn><mi data-i18n="eq.cos"></mi><mo>(</mo><mo>(</mo><msub><mi>ω</mi><mi>c</mi></msub><mo>+</mo><mi>δ</mi><mi>ω</mi><mo>)</mo><mi>t</mi><mo>+</mo><mi>φ</mi><mo>)</mo><mo>=</mo><munder><mrow><mi>m</mi><mo>(</mo><mi>t</mi><mo>)</mo><mi data-i18n="eq.cos"></mi><mo>(</mo><mi>δ</mi><mi>ω</mi><mspace width="0.1em"/><mi>t</mi><mo>+</mo><mi>φ</mi><mo>)</mo></mrow><mtext data-i18n="eq.garde"></mtext></munder><mo>+</mo><munder><mrow><mi>m</mi><mo>(</mo><mi>t</mi><mo>)</mo><mi data-i18n="eq.cos"></mi><mo>(</mo><mo>(</mo><mn>2</mn><msub><mi>ω</mi><mi>c</mi></msub><mo>+</mo><mi>δ</mi><mi>ω</mi><mo>)</mo><mi>t</mi><mo>+</mo><mi>φ</mi><mo>)</mo></mrow><mtext data-i18n="eq.coupe"></mtext></munder></math></div>

    <figure class="chart">
      <svg class="fig" id="temps" role="img" data-i18n-attr="aria-label:dm.aria"></svg>
      <div class="legend"><span class="c-label-2" data-i18n="dm.legend.signal"></span><span class="c-warn" data-i18n="dm.legend.message"></span><span class="c-tint" data-i18n="dm.legend.sortie"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><span data-i18n="dm.mode"></span></div>
            <div class="seg" role="group" id="mode" data-i18n-attr="aria-label:dm.mode"></div></div>
          <div class="ctl"><div class="row"><label for="cm" data-i18n="dm.m"></label><output id="cmv" for="cm"></output></div>
            <input id="cm" type="range" min="0.1" max="1.5" step="0.05" value="0.5"></div>
          <div class="ctl"><div class="row"><label for="crc" data-i18n="dm.rc"></label><output id="crcv" for="crc"></output></div>
            <input id="crc" type="range" min="-1.7" max="1.3" step="0.02" value="0"></div>
          <div class="ctl"><div class="row"><label for="cphi" data-i18n="dm.phi"></label><output id="cphiv" for="cphi"></output></div>
            <input id="cphi" type="range" min="0" max="180" step="5" value="0"></div>
          <div class="ctl"><div class="row"><label for="cdf" data-i18n="dm.df"></label><output id="cdfv" for="cdf"></output></div>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["emetteur", "message", "recepteur", "echelle"]; keyed($("systeme"), t("systeme.tag"), IDS, textOf("systeme.items", IDS)); })();

/* ---------- deux démodulateurs sur le même signal modulé, (4.2) et (4.3) ---------- */
(() => {
  const O = self.Ondes, FC = 20e3, FM = 100, WC = 2 * Math.PI * FC, WM = 2 * Math.PI * FM;
  const DT = 1 / (FC * 20), AVANT = 10e-3, FEN = 30e-3, N = Math.round((AVANT + FEN) / DT), K0 = Math.round(AVANT / DT), TAU = 1e-4;
  const MODES = ["enveloppe", "synchrone"], noms = textOf("dm.modes", MODES); let mode = 0;
  $("mode").innerHTML = MODES.map((id, i) => `<button type="button" data-i="${i}" aria-pressed="${i === 0}">${noms[id]}</button>`).join("");
  function upd() {
    [...$("mode").children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === mode)));
    const m = +$("cm").value, RC = 1e-3 * Math.pow(10, +$("crc").value), phi = +$("cphi").value * Math.PI / 180, df = +$("cdf").value, env = mode === 0;
    $("crc").disabled = !env; $("cphi").disabled = env; $("cdf").disabled = env;
    $("cmv").textContent = F.num(m, 2); $("crcv").textContent = env ? F.si(RC, "s") : "–";
    $("cphiv").textContent = env ? "–" : F.num(+$("cphi").value, 3) + "°"; $("cdfv").textContent = env ? "–" : F.si(df, "Hz");
    const S = O.modulee(m, WC, WM);
    let y;
    if (env) y = O.detecteurEnveloppe(S.s, DT, N, RC).v;
    else {  /* produit, puis deux passe-bas du premier ordre de τ = 0,1 ms en cascade : le terme à 2fc est réduit d'un facteur 1,6 × 10⁻³ */
      y = O.passeBasNumerique(O.demodulationSynchrone(S.s, WC, phi, 2 * Math.PI * df, DT, N, TAU).y, DT, TAU); }
    const svg = $("temps"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 }, x: { domain: [0, FEN * 1e3], label: t("dm.taxis") }, y: { domain: [-2.7, 2.7], label: t("dm.yaxis") } });
    const X = j => P.x((j - K0) * DT * 1e3), Yc = v => P.y(Math.max(-2.7, Math.min(2.7, v)));
    const pts = (f, step) => { const r = []; for (let j = K0; j < N; j += step) r.push([X(j), Yc(f(j))]); return r; };
    Plot.el("path", { d: Plot.path(pts(j => S.s(j * DT), 1)), class: "stroke thin c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(pts(j => S.enveloppe(j * DT), 20)), class: "stroke dash c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(pts(j => y[j], 4)), class: "curve" }, P.g);
    /* écart quadratique moyen à ce que le démodulateur devrait rendre : le message 1 + m cos ω_m t */
    const msg = Array.from({ length: N }, (_, j) => S.enveloppe(j * DT)), e = O.ecartRms(y, msg, K0);
    $("ve").textContent = F.qty(F.num(100 * e, 2), "%"); $("fe").textContent = t("dm.f.ecart");
    if (env) {
      const lim = Math.sqrt(Math.max(0, 1 - m * m)) / (m * WM);
      $("vc").textContent = t(m > 1 ? "dm.v.surmod" : RC < 5 / FC ? "dm.v.ondule" : RC > lim ? "dm.v.decroche" : "dm.v.ok");
      $("fc").textContent = t("dm.f.env", { a: F.si(1 / FC, "s"), b: m < 1 ? F.si(lim, "s") : "–" });
    } else {
      $("vc").textContent = t("dm.v.gain", { g: F.num(Math.cos(phi), 2) });
      $("fc").textContent = df ? t("dm.f.bat", { p: F.si(1 / (2 * df), "s") }) : t("dm.f.phase");
    }
  }
  $("mode").onclick = e => { const b = e.target.closest("button"); if (b) { mode = +b.dataset.i; upd(); } };
  ["cm", "crc", "cphi", "cdf"].forEach(id => $(id).oninput = upd);
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["fleming", 1904, "use"], ["bellescize", 1932, "idea"], ["armstrong", 1936, "idea"], ["costas", 1956, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["poste", "detection"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["produit", "b"], ["creer", "d"], ["rc", "a"], ["surmod", "c"], ["quadrature", "b"], ["decalage", "a"], ["supprimee", "d"], ["filtre", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1932 });
})();
</script>
