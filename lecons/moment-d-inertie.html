    <div class="eq"><math display="block"><mi>I</mi><mo>=</mo><msub><mi>I</mi><mi>G</mi></msub><mo>+</mo><mi>M</mi><msup><mi>d</mi><mn>2</mn></msup></math><span class="n">(19.7)</span></div>

      </div>
      <div class="legend"><span class="c-tint" data-i18n="hu.legend.huygens"></span><span class="c-warn" data-i18n="hu.legend.somme"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><span data-i18n="hu.corps"></span></div>
            <div class="seg" role="group" data-i18n-attr="aria-label:hu.corps">
              <button type="button" id="c-tige" aria-pressed="true" data-i18n="hu.c.tige"></button>
              <button type="button" id="c-plaque" aria-pressed="false" data-i18n="hu.c.plaque"></button>
            </div></div>
          <div class="ctl"><div class="row"><label for="dhu" data-i18n="hu.d"></label><output id="dhuv" for="dhu"></output></div>
            <input id="dhu" type="range" min="0" max="60" step="1" value="50"></div>
          <div class="ctl"><div class="row"><label for="nhu" data-i18n="hu.n"></label><output id="nhuv" for="nhu"></output></div>
            <input id="nhu" type="range" min="1" max="30" step="1" value="4"></div>
        </div>
        <div class="stats">

          <div class="stat"><span class="k" data-i18n="hu.k.huygens"></span><span class="v" id="vhuy"></span><span class="f" id="fhuy"></span></div>
          <div class="stat"><span class="k" data-i18n="hu.k.ecart"></span><span class="v" id="vec"></span><span class="f" data-i18n="hu.f.ecart"></span></div>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>

<script src="/racoon/fmt.js"></script>

<script src="/racoon/constantes.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Solide, g = Constantes.g_CPGE;

/* ---------- §19-3 : tableau des moments d'inertie ---------- */
(() => {
  const ITEMS = ["tige", "tigeBout", "plaque", "disque", "anneau", "cerceau", "sphere", "sphereCreuse", "cylindreTransverse"], txt = textOf("tab.items", ITEMS);
  $("tableau").innerHTML = ITEMS.map(id => `<div><span class="k">${txt[id].formule}</span><span>${txt[id].corps}</span></div>`).join("");
})();

/* ---------- §19-3 : Huygens contre une somme de points ---------- */
(() => {
  const M = 1, L = 1, A = 0.6, B = 0.4, CORPS = ["tige", "plaque"]; let corps = "tige";
  const pts = n => corps === "tige" ? S.tigePoints(M, L, n) : S.plaquePoints(M, A, B, n);
  const IG = () => corps === "tige" ? S.inertie("tige", M, L) : S.inertie("plaque", M, A, B);
  const path = Plot.path;
  function upd() {
    CORPS.forEach(c => $("c-" + c).setAttribute("aria-pressed", String(c === corps)));
    const d = +$("dhu").value / 100, n = +$("nhu").value, c = pts(n);
    const som = S.momentInertie(c, { point: [d, 0, 0] }), huy = S.huygens(IG(), M, d);
    /* the body, its points and the axis */
    let svg = $("corps"); svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 320 160");
    const K = 200, X = x => 120 + x * K, Y = y => 80 - y * K;
    if (corps === "tige") Plot.el("rect", { x: X(-L / 2), y: Y(0) - 3, width: L * K, height: 6, class: "fill c-label-2" }, svg);
    else Plot.el("rect", { x: X(-A / 2), y: Y(B / 2), width: A * K, height: B * K, class: "fill c-label-2" }, svg);
    const rr = Math.max(1.5, Math.min(5, 40 / (corps === "tige" ? n : n * 1.5)));
    c.forEach(p => Plot.el("circle", { cx: X(p.r[0]), cy: Y(p.r[1]), r: rr, class: "fill c-warn" }, svg));
    Plot.el("line", { x1: X(0), y1: Y(0), x2: X(d), y2: Y(0), class: "stroke thin dash c-label" }, svg);
    Plot.el("circle", { cx: X(0), cy: Y(0), r: 4, class: "fill c-label" }, svg);
    Plot.el("circle", { cx: X(d), cy: Y(0), r: 8, class: "stroke c-tint" }, svg);
    Plot.el("circle", { cx: X(d), cy: Y(0), r: 2.5, class: "fill c-tint" }, svg);
    Plot.el("text", { x: X(0) - 4, y: Y(0) + 22, "text-anchor": "middle" }, svg).textContent = t("hu.G");
    Plot.el("text", { x: X(d) + 4, y: Y(0) - 14, "text-anchor": "middle" }, svg).textContent = t("hu.axe");
    /* I(d): Huygens, and the sum over the n points */
    svg = $("courbe"); svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 52 }, x: { domain: [0, 0.6], label: t("hu.xaxis") }, y: { domain: [0, 0.5], label: t("hu.yaxis") } });
    const D = Array.from({ length: 61 }, (_, i) => i / 100);
    Plot.el("path", { d: path(D.map(x => [o.x(x), o.y(S.momentInertie(c, { point: [x, 0, 0] }))])), class: "ref" }, o.g);
    Plot.el("path", { d: path(D.map(x => [o.x(x), o.y(S.huygens(IG(), M, x))])), class: "curve" }, o.g);
    Plot.el("circle", { cx: o.x(d), cy: o.y(som), r: 5, class: "dot" }, o.g);
    const kgm2 = v => F.qty(F.num(v, 4), "kg·m²");
    $("dhuv").textContent = F.qty(F.num(d, 2), "m");
    $("nhuv").textContent = corps === "tige" ? String(n) : t("hu.nn", { n, nn: n * n });
    $("vsom").textContent = kgm2(som);
    $("fsom").textContent = t("hu.f.somme", { N: corps === "tige" ? n : n * n });
    $("vhuy").textContent = kgm2(huy);
    $("fhuy").textContent = t("hu.f.huygens." + corps, { IG: kgm2(IG()) });
    const e = som / huy - 1;
    $("vec").textContent = Math.abs(e) < 5e-13 ? "0" : (e < 0 ? F.MINUS : "+") + F.sci(Math.abs(e), 2);
  }
  CORPS.forEach(c => $("c-" + c).onclick = () => { corps = c; upd(); });
  $("dhu").oninput = upd; $("nhu").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["huygens", 1673, "idea"], ["euler", 1765, "idea"], ["kater", 1817, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["satellite", "cao"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["axe", "c"], ["carre", "b"], ["bout", "a"], ["minimum", "d"], ["piege", "b"], ["perp", "c"], ["cerceau", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 193 });
})();
</script>
