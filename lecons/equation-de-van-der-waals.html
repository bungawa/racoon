<script src="/racoon/lecons/probabilites.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, R = Constantes.R, GAZ = ["N2", "Ar", "CO2"];

/* ---------- a, b et point critique : Van der Waals contre la mesure ---------- */
(() => {
  $("tab").innerHTML = GAZ.map(g => {
    const C = S.CRITIQUE[g], G = S.vdwCritique(g), k = S.critiqueVdw(G);
    return `<div><span class="k">${t("gaz." + g)}</span><span>${t("tab.ligne", {
      a: F.qty(F.num(G.a, 3), "Pa·m⁶·mol⁻²"), b: F.qty(F.sci(G.b, 3), "m³·mol⁻¹"),
      zc: F.fix(C.Pc / (C.rhoc * R * C.Tc), 3), vc: F.num(100 * (k.Vc * C.rhoc - 1), 2) })}</span></div>`;
  }).join("");
})();

/* ---------- isothermes : Van der Waals, gaz parfait, mesure ---------- */
(() => {
  const svg = $("iso"), sg = $("gaz"), st = $("ti"), sv = $("vk"), VMIN = 2e-5, VMAX = 0.1, PMIN = 5e4, PMAX = 2e8;
  const temps = g => Object.keys(S.ISO[g]).map(Number).sort((a, b) => a - b);
  const pc = x => F.num(100 * x, 2) + F.NB + "%";
  function draw() {
    const g = sg.value, T = temps(g)[+st.value], G = S.vdwCritique(g), Iso = S.isotherme(g, T);
    const v0 = Math.min(...Iso.Vm), v1 = Math.max(...Iso.Vm), V = v0 * Math.pow(v1 / v0, +sv.value / 100);
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { b: 44, l: 56 },
      x: { scale: "log", domain: [VMIN, VMAX], label: t("iso.x") }, y: { scale: "log", domain: [PMIN, PMAX], label: t("iso.y") } });
    const clip = p => Math.max(PMIN, Math.min(PMAX, p)), dans = p => p >= PMIN && p <= PMAX, vdw = [], gp = [];
    for (let i = 0; i <= 400; i++) {
      const v = VMIN * Math.pow(VMAX / VMIN, i / 400);
      if (v > G.b * 1.0001) { const p = R * T / (v - G.b) - G.a / (v * v); if (dans(p)) vdw.push([o.x(v), o.y(p)]); }
      if (dans(R * T / v)) gp.push([o.x(v), o.y(R * T / v)]);
    }
    Plot.el("path", { d: Plot.path(gp), class: "stroke dash c-warn" }, o.g);
    Plot.el("path", { d: Plot.path(vdw), class: "stroke c-tint" }, o.g);
    Iso.Vm.forEach((v, i) => Plot.el("circle", { cx: o.x(v), cy: o.y(Iso.P[i]), r: 3.5, class: "fill c-ok" }, o.g));
    Plot.el("line", { x1: o.x(G.b), x2: o.x(G.b), y1: o.y(PMIN), y2: o.y(PMAX), class: "stroke thin c-label-2" }, o.g);
    Plot.el("text", { x: o.x(G.b) + 4, y: o.y(PMAX) + 14, class: "tick" }, o.g).textContent = "b";
    const pm = S.pMesure(g, T, V), c = S.coeffsVdw(G, V, T), pg = R * T / V;
    Plot.el("line", { x1: o.x(V), x2: o.x(V), y1: o.y(PMIN), y2: o.y(PMAX), class: "stroke thin c-label" }, o.g);
    Plot.el("circle", { cx: o.x(V), cy: o.y(clip(c.P)), r: 5, class: "fill c-tint" }, o.g);
    $("tiv").innerHTML = F.kelvin(T);
    $("vkv").textContent = F.qty(F.sci(V, 3), "m³·mol⁻¹");
    $("vmes").textContent = F.si(pm, "Pa", { sig: 3 });
    $("vvdw").textContent = F.si(c.P, "Pa", { sig: 3 }); $("fvdw").textContent = t("iso.f.ecart", { e: pc(c.P / pm - 1) });
    $("vgp").textContent = F.si(pg, "Pa", { sig: 3 }); $("fgp").textContent = t("iso.f.ecart", { e: pc(pg / pm - 1) });
    $("vcin").textContent = F.si(c.cinetique, "Pa", { sig: 3 });
    $("vint").textContent = F.si(c.interne, "Pa", { sig: 3 });
    const C = S.CRITIQUE[g], ev = Math.abs(c.P / pm - 1);
    $("sys").innerHTML = t("sys.inner", { gaz: t("gaz." + g), T: F.kelvin(T), tr: F.fix(T / C.Tc, 2), bv: F.fix(G.b / V, 3),
      av: F.fix(G.a / (R * T * V), 3), e: pc(ev), avis: t(ev < 0.01 ? "sys.ok" : ev < 0.1 ? "sys.moyen" : "sys.ko") });
  }
  sg.onchange = st.oninput = sv.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["these", 1873, "idea"], ["etats", 1880, "idea"], ["helium", 1908, "experiment"], ["nobel", 1910, "idea"], ["peng", 1976, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["procedes", "cubique"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["covolume", "b"], ["interne", "d"], ["carre", "a"], ["critique", "c"], ["zc", "b"], ["ab", "a"], ["co2", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 4102 });
})();
</script>
