<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, nm = x => x * 1e-9;

/* couleur affichable d'une raie : sRGB linéaire de cmf(λ), négatifs ramenés à 0, maximum à 1 */
const teinte = l => { const c = O.versSRGB(O.cmf(nm(l))).map(v => Math.max(0, v)), M = Math.max(...c); return c.map(v => v / M); };
const rgb = c => "rgb(" + c.map(v => Math.round(255 * O.gammaSRGB(v))).join(" ") + ")";

/* ---------- V, V′ et Vmes ; deux raies de même radiance ---------- */
(() => {
  const svg = $("courbes"), ls = $("lsl"), W = 640, H = 300, P = Plot.el, RAIES = [470, 620], XP = 450;
  function draw() {
    svg.innerHTML = "";
    const L = Math.pow(10, +ls.value), r = O.mesopique(L), m = r.m;
    const ax = Plot.axes(svg, { fmt: F, w: W, h: H, pad: { r: W - XP }, x: { domain: [380, 780], label: t("ci.ax.x") }, y: { domain: [0, 1.05], label: t("ci.ax.y") } });
    const lam = Array.from({ length: 81 }, (_, k) => 380 + 5 * k);
    const curve = (f, cls) => P("path", { d: Plot.path(lam.map(l => [ax.x(l), ax.y(f(nm(l)))])), class: cls }, svg);
    curve(O.V, "stroke thin c-label"); curve(O.Vp, "stroke thin dash c-label-2"); curve(l => O.Vmes(l, m), "stroke c-tint");
    RAIES.forEach(l => P("line", { x1: ax.x(l), x2: ax.x(l), y1: ax.y(0), y2: ax.y(1.05), class: "stroke thin dash c-warn" }, svg));
    /* deux taches de même radiance : luminosité relative Vmes, couleur d'autant plus lavée de gris que m est petit */
    /* luminance affichée ∝ Vmes ; l'échelle commune est la plus haute que les deux couleurs puissent atteindre sur l'écran */
    const v = RAIES.map(l => O.Vmes(nm(l), m)), vmax = Math.max(...v);
    const mixes = RAIES.map(l => { const c = teinte(l), Y = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; return { Y, mix: c.map(x => m * x + (1 - m) * Y) }; });
    const Ymax = Math.min(...mixes.map(o => o.Y / Math.max(...o.mix)));
    RAIES.forEach((l, i) => {
      const { Y, mix } = mixes[i], k = Ymax * (v[i] / vmax) / Y;
      P("rect", { x: XP + 30 + i * 85, y: 60, width: 70, height: 70, rx: 6, fill: rgb(mix.map(x => x * k)) }, svg);
      P("rect", { x: XP + 30 + i * 85, y: 60, width: 70, height: 70, rx: 6, class: "stroke thin c-label-2" }, svg);
      P("text", { x: XP + 65 + i * 85, y: 150, "text-anchor": "middle", class: "tick" }, svg).textContent = F.si(nm(l), "m", { prefix: "n", sig: 3 });
      P("text", { x: XP + 65 + i * 85, y: 168, "text-anchor": "middle", class: "tick" }, svg).textContent = F.num(v[i] / vmax, 2);
    });
    P("text", { x: XP + 107, y: 40, "text-anchor": "middle", class: "label" }, svg).textContent = t("ci.taches");
    let best = 380, bv = 0; for (let l = 380; l <= 780; l++) { const y = O.Vmes(nm(l), m); if (y > bv) { bv = y; best = l; } }
    $("lread").textContent = F.qty(F.sci(L, 2), "cd·m⁻²");
    $("vr").textContent = t("ci.regime." + r.regime);
    $("fr").textContent = t("ci.f.regime", { m: F.num(m, 2) });
    $("vq").textContent = F.num(v[0] / v[1], 3);
    $("fq").textContent = t(v[0] > v[1] ? "ci.f.bleu" : "ci.f.rouge");
    $("vk").textContent = F.si(nm(best), "m", { prefix: "n", sig: 3 });
    $("fk").textContent = t(m > 0.999 ? "ci.f.pic.cones" : m < 0.001 ? "ci.f.pic.batonnets" : "ci.f.pic.mixte");
  }
  ls.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["purkinje", 1825, "experiment"], ["boll", 1876, "experiment"], ["v1924", 1924, "use"], ["v1951", 1951, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rouge", "rues"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["gris", "c"], ["rouge", "a"], ["cote", "d"], ["lampe", "b"], ["rapport", "c"], ["mesopique", "a"], ["attente", "b"], ["km", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 352 });
})();
</script>
