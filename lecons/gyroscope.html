<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/cinematique.js"></script>
<script src="/racoon/lecons/forces.js"></script>
<script src="/racoon/lecons/dynamique.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/integration.js"></script>
<script src="/racoon/analyse-vectorielle.js"></script>
<script src="/racoon/lecons/travail.js"></script>
<script src="/racoon/lecons/algebre-vectorielle.js"></script>

<script src="/racoon/lecons/rotation-espace.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const onTheme = f => { f(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", f); new MutationObserver(f).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] }); };
const DEG = 180 / Math.PI, RS = "rad·s⁻¹";

/* the toy gyroscope: a 100 g steel disc of radius 3 cm, its centre 4 cm from the pivot; frame neglected */
const m = 0.1, Rr = 0.03, d = 0.04;
const TOY = { M: m, g: Constantes.g_CPGE, d, I1: m * Rr * Rr / 4 + m * d * d, I3: m * Rr * Rr / 2 };
const H = 5e-4, DUREE = 3;                                          // s: step and length of the measured run
let state = null, released = 0;                                     // the live state, shown in 3D

/* ---------- mesure : une toupie lâchée, axe immobile ---------- */
function lacher() {
  const w = +$("om").value, th0 = +$("th").value / DEG;
  $("omv").textContent = F.qty(F.num(w, 3), RS); $("thv").textContent = F.qty(F.num(+$("th").value, 3), "°");
  const pr = RotEsp.nutationRapide(TOY, th0, w), res = RotEsp.toupie(TOY, RotEsp.lancer(TOY, th0, w), H, Math.round(DUREE / H)), me = RotEsp.mesure(res);
  $("vformule").textContent = F.qty(F.num(pr.Omega, 3), RS);
  $("fformule").textContent = t("sim.f.periode", { T: F.qty(F.num(2 * Math.PI / pr.Omega, 2), "s") });
  $("vmesure").textContent = F.qty(F.num(me.Omega, 3), RS);
  $("fmesure").textContent = t("sim.f.ecart", { x: F.num((me.Omega / pr.Omega - 1) * 100, 2) });
  $("veps").textContent = F.num(pr.eps, 2);
  const st = RotEsp.stationnaire(TOY, th0, w);
  $("feps").textContent = st === null ? t("sim.f.aucune") : t("sim.f.stat", { O: F.qty(F.num(st, 3), RS) });
  $("vnut").textContent = F.qty(F.num(me.amplitude * DEG, 2), "°");
  $("fnut").textContent = t("sim.f.nut", { a: F.qty(F.num(pr.amplitude * DEG, 2), "°"), x: F.num(Math.max(...res.theta) * DEG, 3) });
  /* φ(t) over the whole run, θ(t) over its first second */
  const P = Plot.el, n1 = Math.round(1 / H);
  const pp = $("phiplot"); pp.innerHTML = "";
  const phiMax = Math.max(res.phi[res.phi.length - 1], pr.Omega * DUREE) * DEG;
  const a = Plot.axes(pp, { fmt: F, w: 640, h: 240, pad: { b: 44 }, x: { domain: [0, DUREE], label: t("phi.x") }, y: { domain: [0, phiMax * 1.05], label: t("phi.y") } });
  const path = (xs, ys, ax, cls, every) => P("path", { d: xs.map((x, i) => (i ? "L" : "M") + ax.x(x).toFixed(1) + " " + ax.y(ys[i]).toFixed(1)).filter((_, i) => i % every === 0 || i === xs.length - 1).join(""), class: cls }, ax.g);
  path(res.t, res.phi.map(q => q * DEG), a, "curve", 2);
  path([0, DUREE], [0, pr.Omega * DUREE * DEG], a, "ref", 1);
  const tp = $("thplot"); tp.innerHTML = "";
  const ths = res.theta.slice(0, n1 + 1).map(q => q * DEG), lo = Math.min(...ths, th0 * DEG), hi = Math.max(...ths), pad = Math.max((hi - lo) * 0.1, 0.05);
  const b = Plot.axes(tp, { fmt: F, w: 640, h: 220, pad: { b: 44 }, x: { domain: [0, 1], label: t("theta.x") }, y: { domain: [lo - pad, hi + pad], label: t("theta.y") } });
  path(res.t.slice(0, n1 + 1), ths, b, "curve", 1);
  path([0, 1], [th0 * DEG, th0 * DEG], b, "ref", 1);
  state = RotEsp.lancer(TOY, th0, w); released++;
}
$("om").oninput = $("th").oninput = $("lacher").onclick = lacher;
lacher();

/* ---------- vue 3D (three.js) : la toupie suit la même intégration, ralentie 4 fois ---------- */
(() => {
  const canvas = $("vue"), read = $("vueread");
  if (!self.THREE) { read.textContent = t("v3d.offline"); return; }
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, 4 / 3, 0.005, 5);
  cam.up.set(0, 0, 1); cam.position.set(0.17, -0.2, 0.11);
  const ctl = new THREE.OrbitControls(cam, canvas); ctl.target.set(0, 0, 0.01); ctl.enableDamping = true;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.0));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(0.3, -0.2, 0.5); scene.add(sun);
  const mat = () => new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.2 });
  const mRotor = mat(), mFrame = mat(), mMark = mat();
  /* support: a post under the pivot */
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.006, 0.08, 16), mFrame);
  post.rotation.x = Math.PI / 2; post.position.z = -0.04; scene.add(post);
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.004, 16, 12), mFrame));
  /* the top: its local z axis is the symmetry axis e */
  const top = new THREE.Group(), spin = new THREE.Group(); top.add(spin); scene.add(top);
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.0015, 0.0015, d + 0.012, 10), mFrame);
  rod.rotation.x = Math.PI / 2; rod.position.z = (d + 0.012) / 2; spin.add(rod);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(Rr, Rr, 0.0045, 48), mRotor);
  disc.rotation.x = Math.PI / 2; disc.position.z = d; spin.add(disc);
  const mark = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.004, 0.0055), mMark);
  mark.position.set(Rr - 0.004, 0, d); spin.add(mark);
  /* arrows: L (spin part shown at scale) and the moment of the weight */
  const arrL = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 0.08, 0, 0.012, 0.007);
  const arrM = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 0.05, 0, 0.01, 0.006);
  scene.add(arrL, arrM);
  /* trace of the tip of the axis */
  const NT = 1500, tr = new Float32Array(3 * NT), trGeo = new THREE.BufferGeometry();
  trGeo.setAttribute("position", new THREE.BufferAttribute(tr, 3)); trGeo.setDrawRange(0, 0);
  const trace = new THREE.Line(trGeo, new THREE.LineBasicMaterial()); scene.add(trace);
  onTheme(() => {
    mRotor.color.set(css("--label-2")); mFrame.color.set(css("--label-3") || css("--label-2")); mMark.color.set(css("--tint"));
    arrL.setColor(new THREE.Color(css("--tint"))); arrM.setColor(new THREE.Color(css("--warn"))); trace.material.color.set(css("--label-2"));
  });
  function resize() { const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); cam.aspect = r.width / r.height; cam.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(canvas); resize();
  let visible = true, seen = -1, psi = 0, nTr = 0, frame = 0, last = performance.now();
  new IntersectionObserver(e => visible = e[0].isIntersecting).observe(canvas);
  const Z = new THREE.Vector3(0, 0, 1), q = new THREE.Quaternion(), qs = new THREE.Quaternion(), ev = new THREE.Vector3();
  function tick(now) {
    requestAnimationFrame(tick);
    const dtReal = Math.min((now - last) / 1000, 0.05); last = now;
    if (!visible) return;
    if (seen !== released) { seen = released; psi = 0; nTr = 0; }
    const steps = reduce ? 0 : Math.max(1, Math.round(dtReal / 4 / H));        // slowed down 4 times
    for (let k = 0; k < steps; k++) state = RotEsp.pas(TOY, state, H);
    const e = state.e, w3 = (state.L[0] * e[0] + state.L[1] * e[1] + state.L[2] * e[2]) / TOY.I3;
    psi = (psi + w3 * steps * H) % (2 * Math.PI);
    ev.set(e[0], e[1], e[2]); q.setFromUnitVectors(Z, ev); qs.setFromAxisAngle(Z, psi);
    top.quaternion.copy(q); spin.quaternion.copy(qs);
    const tipR = d + 0.012;
    if (nTr < NT) { tr.set([e[0] * tipR, e[1] * tipR, e[2] * tipR], 3 * nTr); nTr++; }
    else { tr.copyWithin(0, 3); tr.set([e[0] * tipR, e[1] * tipR, e[2] * tipR], 3 * (NT - 1)); }
    trGeo.setDrawRange(0, nTr); trGeo.attributes.position.needsUpdate = true;
    arrL.position.set(e[0] * tipR, e[1] * tipR, e[2] * tipR); arrL.setDirection(new THREE.Vector3(state.L[0], state.L[1], state.L[2]).normalize());
    const Mv = new THREE.Vector3(-e[1], e[0], 0);                                // ẑ ∧ e, the direction of the moment of the weight
    if (Mv.length() > 1e-6) arrM.setDirection(Mv.normalize());
    if (++frame % 15 === 0) read.textContent = t("v3d.read", { th: F.num(Math.acos(Math.max(-1, Math.min(1, e[2]))) * DEG, 3) });
    ctl.update(); renderer.render(scene, cam);
  }
  requestAnimationFrame(tick);
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["rapide", "frottement", "air"], items = textOf("sys.items", IDS);
  const v = { e200: F.num(RotEsp.parametre(TOY, 200), 2), w1: F.num(Math.sqrt(TOY.I1 * TOY.M * TOY.g * TOY.d / 0.01) / TOY.I3, 2),
    I1: F.sci(TOY.I1, 2), I3: F.sci(TOY.I3, 2) };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["bohnenberger", 1817, "experiment"], ["foucault", 1852, "experiment"], ["anschutz", 1906, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["station"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["sens", "b"], ["double", "a"], ["angle", "c"], ["lent", "d"], ["chaise", "a"], ["energie", "b"], ["chiffre", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2003 });
})();
</script>
