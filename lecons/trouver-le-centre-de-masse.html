<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Solide, g = Constantes.g_CPGE;

/* ---------- §19-2 : second théorème de Guldin, contre des coquilles cylindriques ---------- */
(() => {
  const DIMS = { triangle: [0.10, 0.15], demiDisque: [0.08], disque: [0.05], rectangle: [0.06, 0.12] }, NOMS = Object.keys(DIMS);
  let nom = "triangle"; const svg = $("guldin"), K = 520, AX = 170, CY = 95;          // 520 px par mètre, axe en x = 170
  svg.setAttribute("viewBox", "0 0 340 190");
  /* contour (u, v) : u distance au bord tourné vers l'axe, v le long de l'axe ; vG hauteur du centre de masse */
  function contour(p) {
    const n = 48, D = DIMS[nom];
    if (nom === "triangle") return { pts: [[0, -D[1] / 2], [0, D[1] / 2], [D[0], -D[1] / 2]], vG: -D[1] / 6 };
    if (nom === "rectangle") return { pts: [[0, -D[1] / 2], [0, D[1] / 2], [D[0], D[1] / 2], [D[0], -D[1] / 2]], vG: 0 };
    if (nom === "demiDisque") return { pts: Array.from({ length: n + 1 }, (_, i) => { const a = -Math.PI / 2 + Math.PI * i / n; return [D[0] * Math.cos(a), D[0] * Math.sin(a)]; }), vG: 0 };
    return { pts: Array.from({ length: n }, (_, i) => { const a = 2 * Math.PI * i / n; return [D[0] + D[0] * Math.cos(a), D[0] * Math.sin(a)]; }), vG: 0 };
  }
  const poly = (pts, d, sgn) => pts.map(([u, v], i) => (i ? "L" : "M") + (AX + sgn * (d + u) * K).toFixed(1) + " " + (CY - v * K).toFixed(1)).join("") + "Z";
  function upd() {
    NOMS.forEach(n => $("p-" + n).setAttribute("aria-pressed", String(n === nom)));
    const d = +$("dax").value / 100, p = S.profil(nom, ...DIMS[nom]), c = contour(p), xg = d + p.uG;
    const V = S.volumeGuldin(p, d), Vt = S.volumeCoquilles(p, d, 200);
    svg.innerHTML = "";
    Plot.el("line", { x1: AX, x2: AX, y1: 4, y2: 186, class: "stroke thin dash c-label-2" }, svg);
    Plot.el("ellipse", { cx: AX, cy: CY - c.vG * K, rx: xg * K, ry: 6 + xg * K * 0.12, class: "stroke thin c-tint" }, svg);
    Plot.el("path", { d: poly(c.pts, d, -1), class: "stroke thin dash c-label-2" }, svg);
    Plot.el("path", { d: poly(c.pts, d, 1), class: "fill c-label-2" }, svg);
    Plot.el("circle", { cx: AX + xg * K, cy: CY - c.vG * K, r: 5, class: "fill c-tint" }, svg);
    Plot.el("text", { x: AX + 6, y: 14 }, svg).textContent = t("gu.axe");
    const cm = x => F.qty(F.num(x * 1000, 3), "mm"), cm3 = v => F.qty(F.num(v * 1e3, 4), "L");
    $("daxv").textContent = cm(d);
    $("vxg").textContent = cm(xg);
    $("fxg").textContent = t("gu.f.xg." + nom, { uG: cm(p.uG) });
    $("vV").textContent = cm3(V);
    $("fV").textContent = t((d === 0 ? "gu.f.V0." : "gu.f.V.") + nom, { xg: cm(xg), A: F.qty(F.num(p.aire * 1e6, 4), "mm²") });
    $("vVt").textContent = cm3(Vt);
    $("fVt").textContent = t("gu.f.Vt", { e: F.sci(Math.abs(Vt / V - 1), 2) });
  }
  NOMS.forEach(n => $("p-" + n).onclick = () => { nom = n; upd(); });
  $("dax").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["pappus", 320, "idea"], ["guidobaldo", 1588, "idea"], ["kepler", 1615, "idea"], ["guldin", 1640, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["cao"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cone", "b"], ["demi", "d"], ["fil", "a"], ["trou", "c"], ["axe", "a"], ["tore", "c"], ["suspendre", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 192 });
})();
</script>
