<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>

<script src="/racoon/sigles.js"></script>

<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/relativite.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, K = Constantes, c = K.c, u = K.u, MeV = 1e6 * K.e, TNT = 4.184e6;   // J per kilogram of TNT (convention)
/* a mass of TNT: grams up to 1 000 kg, then kilograms in scientific notation */
const tnt = E => { const kg = E / TNT; return kg >= 1000 ? F.qty(F.sci(kg, 2), "kg") : F.si(kg * 1000, "g"); };

/* ---------- l'énergie au repos d'un kilogramme ---------- */
$("repos").innerHTML = t("s1.repos", { E: F.qty(F.sci(c * c, 3), "J"), tnt: tnt(c * c) });

/* ---------- quelle fraction de la masse devient énergie ---------- */
(() => {
  /* id, energy released (J), mass of the reactants (kg): data checked in the footer's sources */
  const PROCS = [
    ["chauffe", 4180 * 80, 1],                                                   // 1 kg of water, 20 → 100 °C, c = 4,18 kJ/(kg·K)
    ["combustion", 393.5e3, 44.01e-3],                                           // C + O2 → CO2, 393,5 kJ/mol
    ["fission", 200 * MeV, 236 * u],                                             // ²³⁵U + n, about 200 MeV
    ["lithium", R.energieLiberee((7.016004 + 1.007825) * u, [4.002603 * u, 4.002603 * u]), (7.016004 + 1.007825) * u],
    ["fusion", 17.6 * MeV, 5 * u],                                               // D + T → ⁴He + n, 17,6 MeV, 5 u to 1 %
    ["annihilation", 2 * K.m_e * c * c, 2 * K.m_e],                              // e⁺ + e⁻ at rest
  ];
  const txt = textOf("proc.items", PROCS.map(p => p[0]));
  const svg = $("barres"), seg = $("proc"), sm = $("sm");
  let sel = "combustion";
  seg.innerHTML = PROCS.map(([id]) => `<button type="button" data-p="${id}">${txt[id].name}</button>`).join("");
  function draw() {
    svg.innerHTML = "";
    const n = PROCS.length, P = Plot.axes(svg, { fmt: F, w: 640, h: 70 + 44 * n, pad: { l: 16, b: 44, t: 8 },
      x: { scale: "log", domain: [1e-12, 1], label: t("fig.xaxis") }, y: { domain: [0, n], ticks: 1, fmt: () => "" } });
    PROCS.forEach(([id, Q, m], i) => {
      const f = Q / (m * c * c), y = P.y(n - i - 0.35), on = id === sel;
      Plot.el("rect", { x: P.x(1e-12), y: y - 7, width: Math.max(1, P.x(f) - P.x(1e-12)), height: 14, class: "fill " + (on ? "c-tint" : "c-label-2") }, P.g);
      Plot.el("text", { x: P.x(1e-12) + 4, y: y - 12 }, P.g).textContent = txt[id].name + " : " + F.sci(f, 2);
    });
    const [, Q, m] = PROCS.find(p => p[0] === sel), f = Q / (m * c * c), M = Math.pow(10, +sm.value), E = f * M * c * c;
    $("smr").textContent = M >= 1 ? F.si(M, "kg", { prefix: "" }) : F.si(M * 1000, "g");
    $("ptxt").innerHTML = txt[sel].text;
    $("vfrac").textContent = F.sci(f, 3);
    $("vE").textContent = F.si(E, "J");
    $("fE").textContent = t("fig.f.E", { tnt: tnt(E) });
    $("vdm").textContent = F.si(f * M * 1000, "g");
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === sel)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { sel = b.dataset.p; draw(); });
  sm.oninput = draw; draw();
})();

/* ---------- la bombe de 20 kt ---------- */
$("bombe").innerHTML = t("s3.bombe", { M: F.qty(F.sci(2e7, 1), "kg"), E: F.si(2e7 * TNT, "J"), dm: F.si(2e7 * TNT / (c * c) * 1000, "g") });

/* ---------- l'annihilation ---------- */
$("annih").innerHTML = t("s4.annih", { E: F.qty(F.num(K.m_e * c * c / (1e3 * K.e), 6), "keV") });

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["einstein", 1905, "idea"], ["cockcroft", 1932, "experiment"], ["rainville", 2005, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tep"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["gramme", "c"], ["hypothese", "a"], ["constante", "d"], ["chimie", "b"], ["annihilation", "c"], ["bombe", "a"], ["lithium", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 159 });
})();
</script>
