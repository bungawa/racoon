    <figure>
      <svg class="fig" id="modules" viewBox="0 0 640 300" role="img" data-i18n-attr="aria-label:mo.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="mo.legend.m"></span><span class="c-label-2" data-i18n="mo.legend.k"></span><span class="c-warn" data-i18n="mo.legend.mu"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><label for="mat" data-i18n="mo.mat"></label></div>
            <select id="mat"><option value="acier" data-i18n="mo.mat.acier"></option><option value="aluminium" data-i18n="mo.mat.aluminium"></option><option value="beton" data-i18n="mo.mat.beton"></option></select></div>
          <div class="ctl"><div class="row"><label for="bord" data-i18n="mo.bord"></label></div>
            <select id="bord"><option value="libres" data-i18n="mo.bord.libres"></option><option value="tenues" data-i18n="mo.bord.tenues"></option></select></div>

          <div class="ctl"><div class="row"><label for="eps" data-i18n="mo.eps"></label><output id="epsv" for="eps"></output></div>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const El = Elasticite, T = Tenseurs;
const MPa = x => F.qty(F.num(x / 1e6, 3), "MPa");

/* ---------- un bloc tiré : faces libres ou tenues ---------- */
(() => {
  const svg = $("modules"), NUMAX = 0.49, YMAX = 5;
  function courbes(nu) {
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, 0.5], label: t("mo.xlabel") }, y: { domain: [0, YMAX], label: t("mo.ylabel") } });
    const f = { m: n => El.constantesIsotropes(1, n).C11, k: n => El.constantesIsotropes(1, n).K, mu: n => El.constantesIsotropes(1, n).mu };
    [["m", "c-tint"], ["k", "c-label-2"], ["mu", "c-warn"]].forEach(([id, cls]) => {
      const pts = []; for (let n = 0; n <= NUMAX + 1e-9; n += 0.005) { const y = f[id](n); if (y <= YMAX) pts.push([ax.x(n), ax.y(y)]); }
      P("path", { d: Plot.path(pts), class: "stroke " + cls }, svg);
    });
    P("line", { x1: ax.x(nu), x2: ax.x(nu), y1: ax.y(0), y2: ax.y(YMAX), class: "stroke thin dash c-label-2" }, svg);
    P("line", { x1: ax.x(0), x2: ax.x(0.5), y1: ax.y(1), y2: ax.y(1), class: "stroke thin c-label-2" }, svg);
    P("text", { x: ax.x(0.01), y: ax.y(1) - 6 }, svg).textContent = t("mo.e1");
  }
  function upd(fromMat) {
    const m = El.MATERIAUX[$("mat").value];
    if (fromMat) $("nu").value = m.nu;
    const nu = +$("nu").value, e = +$("eps").value / 1000, E = m.E, c = El.constantesIsotropes(E, nu), C = T.isotrope4(c.lambda, c.mu);
    $("nuv").textContent = F.fix(nu, 2); $("epsv").textContent = F.qty(F.fix(+$("eps").value, 2), "‰");
    const strain = $("bord").value === "libres" ? El.deformationUniaxiale(E, nu, E * e) : T.diag(e, 0, 0);
    const S = T.contracter(C, strain), w = T.energieElastique(C, strain);
    $("vsxx").textContent = MPa(S[0][0]);
    $("fsxx").textContent = t("mo.f.sxx", { r: F.fix(e ? S[0][0] / (E * e) : $("bord").value === "libres" ? 1 : c.C11 / E, 2) });
    $("vslat").textContent = MPa(S[1][1]);
    $("velat").textContent = t("mo.v.elat", { v: F.fix(strain[1][1] * 1000, 3) });
    $("vw").textContent = F.qty(F.num(w / 1e3, 3), "kJ·m⁻³");
    if (m.lim == null) { $("vlim").textContent = t("mo.v.alliage"); $("flim").textContent = t("mo.f.alliage"); }
    else {
      $("vlim").textContent = t(m.limNom === "fy" ? "mo.v.fy" : "mo.v.fctm", { v: MPa(m.lim) });
      $("flim").textContent = t(Math.abs(S[0][0]) > m.lim ? "mo.f.depasse" : "mo.f.reste");
    }
    courbes(nu);
  }
  $("mat").onchange = () => upd(true); $("bord").onchange = () => upd(false);
  $("nu").oninput = $("eps").oninput = () => upd(false);
  upd(true);
})();

const EVENTS = [["navier", 1821, "idea"], ["cauchy", 1822, "idea"], ["poisson", 1828, "idea"], ["lame", 1831, "idea"], ["lame2", 1852, "idea"]];
const USES = ["eurocode", "mef", "sols"];
const QS = [["rang", "c"], ["energie", "a"], ["deux", "d"], ["tenu", "b"], ["iso", "c"], ["caout", "a"], ["beton", "d"]];

/* ---------- histoire ---------- */
(() => {
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
