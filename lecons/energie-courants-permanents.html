<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd;

/* ---------- le système décrit : un câble coaxial, ½∫j·A contre ∫B²/(2μ0) ---------- */
(() => {
  const Ic = 10, a = 1e-3, b = 3.5e-3, c = M.coaxJA(Ic, a, b);
  $("sys1").innerHTML = t("sys1.body", { I: F.si(Ic, "A"), a: F.si(a, "m", { prefix: "m" }), b: F.si(b, "m", { prefix: "m" }),
    ja: F.si(c.jA, "J·m⁻¹", { sig: 6 }), ch: F.si(c.champ, "J·m⁻¹", { sig: 6 }), L: F.si(2 * c.exact / (Ic * Ic), "H·m⁻¹", { sig: 3 }) });
})();

/* ---------- deux spires coaxiales : quatre façons d'obtenir M, donc U = I1 I2 M ---------- */
(() => {
  const svg = $("spires"), sr = $("sr"), sz = $("sz"), R1 = 0.05, I1 = 10, I2 = 10;   // m, A, A
  const S = 1500, cx = 320, cy = 252, px = (rho, z) => [cx + S * rho, cy - S * z];      // side view: rho across, z up
  Plot.el("line", { x1: cx, x2: cx, y1: 10, y2: 270, class: "stroke thin dash" }, svg);
  const dyn = Plot.el("g", {}, svg);
  const spire = (R, z, cls) => {
    const [x1, y] = px(-R, z), [x2] = px(R, z);
    Plot.el("ellipse", { cx, cy: y, rx: S * R, ry: Math.max(4, S * R * 0.18), class: "stroke " + cls }, dyn);
    Plot.el("circle", { cx: x1, cy: y, r: 3.5, class: "fill " + cls }, dyn); Plot.el("circle", { cx: x2, cy: y, r: 3.5, class: "fill " + cls }, dyn);
  };
  function draw() {
    const R2 = +sr.value / 1000, z = +sz.value / 1000, e = M.energieDeuxSpires(I1, I2, R1, R2, z);
    dyn.innerHTML = ""; spire(R1, 0, "c-tint"); spire(R2, z, "c-warn");
    $("srr").textContent = F.si(R2, "m", { prefix: "m" }); $("szr").textContent = F.si(z, "m", { prefix: "m" });
    $("vc").textContent = F.si(e.circulation, "H");
    $("fc").innerHTML = t("fig.f.circ", { u: F.si(e.U, "J"), n: F.si(e.neumann, "H", { sig: 6 }) });
    $("vf").textContent = F.si(e.flux, "H");
    $("ff").textContent = t("fig.f.flux", { e: F.sci(Math.abs(e.flux / e.circulation - 1), 1) });
    $("vd").textContent = F.si(e.dipole, "H");
    $("fd").textContent = t("fig.f.dip", { e: F.num(100 * (e.dipole / e.circulation - 1), 2) });
  }
  sr.oninput = sz.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["neumann", 1845, "idea"], ["ampere", 1948, "use"], ["lhc", 2008, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["aimants"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["signe", "b"], ["surface", "c"], ["demi", "a"], ["jauge", "d"], ["fin", "b"], ["deux", "c"], ["dipole", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 153 });
})();
</script>
