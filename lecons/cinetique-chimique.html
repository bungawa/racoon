<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const S = Statistique, CAT = 30;                 // kJ·mol⁻¹: how much the catalyst lowers the barrier, at most

/* ---------- le profil d'énergie : barrière, catalyseur, température ---------- */
(() => {
  const svg = $("profil"), sea = $("ea"), sde = $("de"), st = $("t"), sc = $("cat");
  /* energy along the reaction coordinate s ∈ [0, 1]: flat ends, a smooth barrier of height ea at s = 1/2 */
  const E = (s, ea, de) => s <= 0.15 ? 0 : s >= 0.85 ? de : s <= 0.5 ? ea * Math.sin(Math.PI * (s - 0.15) / 0.7) ** 2
    : de + (ea - de) * Math.sin(Math.PI * (s - 0.15) / 0.7) ** 2;
  function draw() {
    const ea = +sea.value, de = +sde.value, T = +st.value, cat = sc.checked ? Math.min(CAT, ea - Math.max(de, 0)) : 0;
    const r = S.reaction({ Ea: ea * 1e3, dE: de * 1e3, T, cat: cat * 1e3 });
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 },
      x: { domain: [0, 1], label: t("sim.x"), fmt: () => "" }, y: { domain: [-100, 160], label: t("sim.y") } });
    const line = h => { const p = []; for (let i = 0; i <= 200; i++) { const s = i / 200; p.push([o.x(s), o.y(E(s, h, de))]); } return Plot.path(p); };
    Plot.el("path", { d: line(ea), class: "stroke bold c-tint" }, o.g);
    if (cat > 0) Plot.el("path", { d: line(ea - cat), class: "stroke dash c-warn" }, o.g);
    Plot.el("line", { x1: o.x(0), x2: o.x(1), y1: o.y(0), y2: o.y(0), class: "stroke thin dash c-label" }, o.g);
    $("eav").textContent = F.qty(F.num(ea, 3), "kJ·mol⁻¹");
    $("dev").textContent = F.qty(F.num(de, 3), "kJ·mol⁻¹");
    $("tv").innerHTML = F.kelvin(T);
    $("vkf").textContent = F.sci(r.kf, 2);
    $("vkr").textContent = F.sci(r.kr, 2);
    $("vk").textContent = F.sci(r.K, 2);
    $("vdix").textContent = "× " + F.num(S.facteurDix((ea - cat) * 1e3, T), 3);
  }
  sea.oninput = draw; sde.oninput = draw; st.oninput = draw; sc.onchange = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["vanthoff", 1884, "idea"], ["arrhenius", 1889, "idea"], ["eyring", 1935, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pot", "vieillissement"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dix", "c"], ["catalyseur", "a"], ["equilibre", "d"], ["inverse", "b"], ["tiers", "c"], ["pente", "a"], ["diamant", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 424 });
})();
</script>
