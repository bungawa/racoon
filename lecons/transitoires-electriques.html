<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

(() => { const IDS = ["generateur", "bobine", "condensateur", "resistance", "oscilloscope"]; keyed($("composants"), t("composants.tag"), IDS, textOf("composants.items", IDS)); })();

/* ---------- §24-3 : le créneau sur le circuit RLC série ---------- */
(() => {
  const L = 0.10, C = 1.0e-7, R0 = 75, E5 = 5, HALF = 0.025;           // R₀ = 50 Ω (générateur) + 20 Ω (bobine) + 5 Ω (condensateur)
  const T0 = 2 * Math.PI * Math.sqrt(L * C);                            // 0,63 ms
  const FRONTS = [["montant", E5, 0], ["descendant", 0, E5]], names = textOf("te.fronts", FRONTS.map(f => f[0]));
  $("fronts").innerHTML = FRONTS.map(([id], i) => `<button type="button" data-i="${i}" aria-pressed="${i === 0}">${names[id]}</button>`).join("");
  let front = 0;
  function upd() {
    [...$("fronts").children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === front)));
    const Rv = +$("rv").value < 0.005 ? 0 : 10 ** (+$("rv").value), R = R0 + Rv, [, E, u0] = FRONTS[front];
    const S = Amort.echelon(R, L, C, E, u0), B = Amort.bilanEchelon(C, E, u0);
    const back = Amort.retour(S.w0, S.Q, 1, 0, 0.01), tend = Math.min(HALF, Math.max(3 * T0, 1.2 * back));
    const N = 600, ts = Array.from({ length: N + 1 }, (_, i) => tend * i / N), ms = s => 1e3 * s;
    /* u_C and u_L, in V, against t in ms */
    let svg = $("tensions"); svg.innerHTML = "";
    let o = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 48 }, x: { domain: [0, ms(tend)], label: t("te.xaxis") }, y: { domain: [-1.2 * E5, 2.2 * E5], label: t("tensions.yaxis") } });
    [0, E].forEach(v => Plot.el("line", { x1: o.x(0), x2: o.x(ms(tend)), y1: o.y(v), y2: o.y(v), class: "stroke thin dash c-label-2" }, o.g));
    Plot.el("path", { d: path(ts.map(s => [o.x(ms(s)), o.y(S.uL(s))])), class: "stroke c-warn" }, o.g);
    Plot.el("path", { d: path(ts.map(s => [o.x(ms(s)), o.y(S.uC(s))])), class: "curve" }, o.g);
    /* energies in µJ: stored (capacitor + coil), dissipated = supplied − change of stored, exactly */
    const st = s => 0.5 * C * S.uC(s) ** 2 + 0.5 * L * S.i(s) ** 2, st0 = 0.5 * C * u0 * u0;
    const diss = s => E * C * (S.uC(s) - u0) - (st(s) - st0), top = 1.1e6 * Math.max(...ts.map(st), B.dissipee);
    svg = $("energies"); svg.innerHTML = "";
    o = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 48 }, x: { domain: [0, ms(tend)], label: t("te.xaxis") }, y: { domain: [0, top], label: t("energies.yaxis") } });
    Plot.el("line", { x1: o.x(0), x2: o.x(ms(tend)), y1: o.y(1e6 * B.dissipee), y2: o.y(1e6 * B.dissipee), class: "stroke thin dash c-label-2" }, o.g);
    Plot.el("path", { d: path(ts.map(s => [o.x(ms(s)), o.y(1e6 * diss(s))])), class: "stroke c-warn" }, o.g);
    Plot.el("path", { d: path(ts.map(s => [o.x(ms(s)), o.y(1e6 * st(s))])), class: "curve" }, o.g);
    /* readouts */
    $("rvv").textContent = t("te.rvv", { r: F.si(Rv, "Ω"), tot: F.si(R, "Ω") });
    $("vr").textContent = t("te.v." + S.regime); $("fr").textContent = t("te.f.regime", { q: F.num(S.Q, 3), rc: F.si(S.Rc, "Ω") });
    if (S.regime === "pseudo") { $("vd").textContent = F.si(2 * Math.PI / S.pseudoPulsation, "s"); $("fd").textContent = t("te.f.pseudo", { tau: F.si(2 / S.gamma, "s") }); }
    else { $("vd").textContent = F.si(1 / S.lent, "s"); $("fd").textContent = t("te.f.lent"); }
    let ext = u0; ts.forEach(s => { const v = S.uC(s); if (Math.abs(v - u0) > Math.abs(ext - u0)) ext = v; });
    $("vm").textContent = F.si(ext, "V"); $("fm").textContent = t("te.f.max", { d: F.qty(F.num(Math.max(0, 100 * (Math.abs(ext - u0) / Math.abs(E - u0) - 1)), 3), "%") });
    $("vj").textContent = F.si(diss(tend), "J"); $("fj").textContent = t("te.f.joule", { w: F.si(B.dissipee, "J"), f: F.si(B.fournie, "J") });
  }
  $("rv").oninput = upd; $("fronts").onclick = e => { const b = e.target.closest("button"); if (b) { front = +b.dataset.i; upd(); } };
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["thomson", 1853, "idea"], ["braun", 1897, "experiment"], ["tektronix", 1947, "use"], ["lown", 1962, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["defibrillateur", "declenchement"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["critique", "b"], ["bobine", "a"], ["moitie", "d"], ["final", "c"], ["mecanique", "b"], ["temps", "a"], ["depassement", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 243 });
})();
</script>
