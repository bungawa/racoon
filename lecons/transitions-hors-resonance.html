<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, F0 = 23.87e9;

/* ---------- the resonance curve against the detuning, for a transit time and a field ---------- */
(() => {
  const svg = $("fig"), st = $("st"), sk = $("sk"), N = 400;
  function draw() {
    const T = +st.value * 1e-3, kk = +sk.value, s = kk / T, DMAX = 3 / T;      // detuning in Hz, ±3/T
    svg.innerHTML = "";
    const ymax = Math.max(1.05 * kk * kk, 0.05), top = Math.min(1.2, Math.max(ymax, Math.sin(kk) ** 2 * 1.05));
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-DMAX / 1e3, DMAX / 1e3], label: t("fig.x"), fmt: v => F.num(v, 1) },
      y: { domain: [0, top], label: t("fig.y"), fmt: v => F.num(v, 2) } });
    for (const [f, cls, sty] of [[d => Q.probaRabi(s, 2 * Math.PI * d, T), "c-tint", "stroke bold"], [d => Q.probaHorsResonance(s, 2 * Math.PI * d, T), "c-warn", "stroke dash"]]) {
      const pts = Array.from({ length: N + 1 }, (_, k) => { const d = -DMAX + 2 * DMAX * k / N; return [x(d / 1e3), y(Math.min(top, f(d)))]; });
      Plot.el("path", { d: Plot.path(pts), class: sty }, Plot.el("g", { class: cls }, g));
    }
    const ex = Q.probaRabi(s, 0, T), pe = Q.probaHorsResonance(s, 0, T);
    $("str").textContent = F.si(T, "s", { prefix: "m" });
    $("skr").textContent = F.num(kk, 2);
    $("vzero").textContent = F.si(1 / T, "Hz", { prefix: "k" });
    $("fzero").textContent = t("fig.f.zero", { r: F.sci(1 / (F0 * T), 1) });
    $("vcentre").textContent = t("fig.v.centre", { e: F.num(ex, 3), p: F.num(pe, 3) });
    $("fcentre").textContent = t(Math.abs(pe - ex) < 0.02 * ex ? "fig.f.bon" : "fig.f.mauvais", { r: F.num(100 * (pe - ex) / ex, 0) });
  }
  st.oninput = sk.oninput = draw; draw();
})();

/* ---------- the system described: the transit time sets the width ---------- */
(() => {
  const T = 1e-3;
  $("sys").innerHTML = t("sys.body", { d: F.si(1 / T, "Hz", { prefix: "k" }), r: F.sci(1 / (F0 * T), 1), n: F.sci(F0 * T, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ramsey", 1949, "idea"], ["essen", 1955, "experiment"], ["nobel", 1989, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["horloges"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["petit", "b"], ["largeur", "d"], ["aire", "a"], ["long", "c"], ["fort", "b"], ["zero", "a"], ["horloge", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 955 });
})();
</script>
