<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, A = Q.aHyperfinH, MUP = -(Q.muElectron - Q.muProton);
/* ⟨σez⟩ of each state: I +1, II −1, III and IV from (12.39) */
const sez = B => { const u = Q.etatZeemanH(B, "III"), v = Q.etatZeemanH(B, "IV"); return { I: 1, II: -1, III: u[0] ** 2 - u[1] ** 2, IV: v[0] ** 2 - v[1] ** 2 }; };

/* ---------- how polarized the electron is in each state, from weak to strong field (log scale) ---------- */
(() => {
  const svg = $("courbe"), sB = $("sB"), NIV = [["I", "c-ok"], ["II", "c-warn"], ["III", "c-tint"], ["IV", "c-label"]];
  function draw() {
    const lb = +sB.value, B = 10 ** lb, s = sez(B), u = Q.etatZeemanH(B, "III");
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 }, x: { domain: [-3, 0], label: t("fig.x") }, y: { domain: [-1.1, 1.1], label: t("fig.y") } });
    for (const [k, cls] of NIV) {
      const p = [];
      for (let i = 0; i <= 200; i++) { const x = -3 + 3 * i / 200; p.push([o.x(x), o.y(sez(10 ** x)[k] * (k === "I" || k === "II" ? 0.98 : 1))]); }
      Plot.el("path", { d: Plot.path(p), class: "stroke bold " + cls }, o.g);
    }
    Plot.el("line", { x1: o.x(Math.log10(2 * A / MUP)), x2: o.x(Math.log10(2 * A / MUP)), y1: o.y(-1.1), y2: o.y(1.1), class: "stroke thin dash c-label-2" }, o.g);
    Plot.el("line", { x1: o.x(lb), x2: o.x(lb), y1: o.y(-1.1), y2: o.y(1.1), class: "stroke thin c-label-2" }, o.g);
    $("sBr").textContent = F.si(B, "T");
    $("vc").textContent = F.fix(u[0], 3) + " ; " + F.fix(u[1], 3); $("fc").textContent = t("fig.f.c", { r: F.fix(u[0] / u[1], 2) });
    $("vs").textContent = ["I", "II", "III", "IV"].map(k => F.fix(s[k], 2)).join(" ; "); $("fs").textContent = t("fig.f.se");
    const h = B * 1e-4, d = k => (Q.niveauxZeemanH(B + h)[k] - Q.niveauxZeemanH(B - h)[k]) / (2 * h);
    $("vp").textContent = ["I", "II", "III", "IV"].map(k => F.fix(d(k) / K.mu_B, 2)).join(" ; "); $("fp").textContent = t("fig.f.pente");
  }
  sB.oninput = draw; draw();
})();

/* ---------- the system described: a beam through a field gradient ---------- */
(() => {
  const g = 100, F0 = K.mu_B * g, m = K.m_p + K.m_e;
  $("sys1").innerHTML = t("sys1.body", { g: F.si(g, "T·m⁻¹"), F: F.si(F0, "N"), a: F.si(F0 / m, "m·s⁻²"), b0: F.si(2 * A / MUP, "T") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["sg", 1922, "experiment"], ["pt", 1927, "experiment"], ["maser", 1960, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["tri", "polar"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["faible", "c"], ["fort", "b"], ["m", "a"], ["sg", "d"], ["zero", "c"], ["force", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1205 });
})();
</script>
