<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantAmp, DEG = Math.PI / 180, Cst = Constantes;

/* ---------- Table 3-1: the four spin cases of unpolarised spin-1/2 particles ---------- */
(() => {
  const ROWS = [["haut", "haut", "haut", "haut", "moins"], ["bas", "bas", "bas", "bas", "moins"],
    ["haut", "bas", "haut", "bas", "direct"], ["haut", "bas", "bas", "haut", "echange"],
    ["bas", "haut", "haut", "bas", "echange"], ["bas", "haut", "bas", "haut", "direct"]];
  const head = ["p1", "p2", "d1", "d2", "proba"].map(k => `<th>${t("tab.h." + k)}</th>`).join("");
  $("spins").innerHTML = `<thead><tr><th>${t("tab.h.part")}</th>${head}</tr></thead><tbody>` +
    ROWS.map((r, i) => `<tr><td>${i % 2 === 0 || i < 2 ? t("tab.quart") : ""}</td>${r.slice(0, 4).map(s => `<td>${t("tab.s." + s)}</td>`).join("")}<td>${t("tab.p." + r[4])}</td></tr>`).join("") + "</tbody>";
})();

/* ---------- the angular distribution, ratio to (3.14), in the centre-of-mass frame ---------- */
(() => {
  const M_ALPHA = 4.001506179129 * Cst.u;                              // CODATA 2022
  const PAIRES = {
    alpha: { Z: 2, m: M_ALPHA, E0: 0.05e6 * Q.e, E1: 3e6 * Q.e },       // α on helium-4, laboratory energy of the projectile
    e: { Z: 1, m: Q.m_e, E0: 10 * Q.e, E1: 10e3 * Q.e },                 // electron on electron
  };
  const TH = Array.from({ length: 341 }, (_, i) => 5 + i * 0.5);
  let paire = "alpha";
  const sE = $("sE"), seg = $("paire"), reel = $("reel");
  const systeme = (P, E) => {
    const p = Q.impulsion(P.m, E), En = Math.hypot(p * Q.c, P.m * Q.c * Q.c), v = p * Q.c * Q.c / En;   // projectile speed = relative speed
    return { v, eta: Q.sommerfeld(P.Z, P.Z, v), b2: (v / Q.c) ** 2, rmin: Q.approcheCoulomb(P.Z, P.Z, E / 2) };
  };
  function draw() {
    const P = PAIRES[paire], E = P.E0 * Math.pow(P.E1 / P.E0, +sE.value), S = systeme(P, E), eta = reel.checked ? 0 : S.eta;
    const R = TH.map(th => { const r = Q.diffusionIdentiques(th * DEG, eta); return { b: r.bosons / r.discernables, f: r.fermions / r.discernables, n: r.nonPolarises / r.discernables }; });
    const svg = $("courbe"); svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, 180], label: t("fig.ax.x") }, y: { domain: [0, 2.2], label: t("fig.ax.p") } });
    const ligne = (ys, cls) => Plot.el("path", { d: Plot.path(TH.map((u, i) => [ax.x(u), ax.y(ys[i])])), class: cls, fill: "none" }, svg);
    ligne(TH.map(() => 1), "stroke thin dash c-label-2");
    const fort = k => (paire === "alpha" ? k === "b" : k !== "b") ? "stroke bold " : "stroke thin ";
    ligne(R.map(r => r.b), fort("b") + "c-tint");
    ligne(R.map(r => r.f), fort("f") + "c-warn");
    ligne(R.map(r => r.n), fort("n") + "c-label");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.p === paire)));
    $("sEr").textContent = F.si(E, "J") + " (" + F.si(E / Q.e, "eV") + ")";
    $("veta").textContent = F.num(eta, 3);
    $("feta").textContent = reel.checked ? t("fig.f.reel") : t("fig.f.eta");
    const r90 = Q.diffusionIdentiques(90 * DEG, eta), k90 = paire === "alpha" ? r90.bosons : r90.nonPolarises;
    $("vr90").textContent = F.num(k90 / r90.discernables, 3);
    $("fr90").textContent = t(paire === "alpha" ? "fig.f.r90.alpha" : "fig.f.r90.e");
    if (paire === "alpha") { $("vsys").textContent = F.num(S.rmin / (2 * 1.68e-15), 2); $("fsys").textContent = t("fig.f.sys.alpha", { r: F.si(S.rmin, "m") }); }
    else { $("vsys").textContent = F.sci(S.b2, 2); $("fsys").textContent = t("fig.f.sys.e"); }
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { paire = x.dataset.p; draw(); });
  sE.oninput = reel.onchange = draw; draw();

  /* the system box: an α of 1 MeV on helium, electrons of 1 keV */
  const A = systeme(PAIRES.alpha, 1e6 * Q.e), B = systeme(PAIRES.e, 1e3 * Q.e);
  $("sys1").innerHTML = t("sys1.body", { Ea: F.si(1e6 * Q.e, "J"), etaA: F.num(A.eta, 2), rA: F.si(A.rmin, "m"), nA: F.num(A.rmin / (2 * 1.68e-15), 2),
    Ee: F.si(1e3 * Q.e, "J"), etaE: F.num(B.eta, 2), bE: F.sci(B.b2, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["mott", 1930, "idea"], ["chadwick", 1930, "experiment"], ["hom", 1987, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["photons"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["oxygene", "a"], ["helium3", "c"], ["quatre", "b"], ["electrons", "d"], ["opposes", "a"], ["moitie", "c"], ["echange", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 334 });
})();
</script>
