<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions;
const acide = id => C.ACIDES.find(a => a.id === id), esp = f => t("esp", { s: C.texte(f) });
const CLS = ["c-tint", "c-warn", "c-ok", "c-ko"];

/* ---------- échelle des pKa : la structure (ids, pKa) vient du module, les noms de la table ---------- */
(() => {
  const FORTS = [["fortAcide", "&lt; 0"], ["fortBase", "&gt; 14"]], IDS = ["hydrogenosulfate", "phosphorique", "benzoique", "ethanoique", "carbonique", "ammonium"];
  const noms = textOf("echelle.items", IDS.concat(FORTS.map(f => f[0])));
  const lignes = [];
  for (const id of IDS) acide(id).pKa.forEach((k, i) => lignes.push([k, `<span><strong>${noms[id]}.</strong> ${t("echelle.couple", { a: esp(acide(id).formes[i]), b: esp(acide(id).formes[i + 1]) })}</span>`]));
  lignes.sort((a, b) => a[0] - b[0]);
  $("echelle").innerHTML = `<div><span class="k">${t("echelle.k", { v: FORTS[0][1] })}</span><span>${noms.fortAcide}</span><span class="v"></span></div>`
    + lignes.map(([k, s]) => `<div><span class="k">${t("echelle.k", { v: F.fix(k, 2) })}</span>${s}<span class="v"></span></div>`).join("")
    + `<div><span class="k">${t("echelle.k", { v: FORTS[1][1] })}</span><span>${noms.fortBase}</span><span class="v"></span></div>`;
})();

/* ---------- diagramme de distribution et de prédominance ---------- */
(() => {
  const st = { s: "ethanoique" }, sl = $("sph"), seg = $("sys");
  function draw() {
    const a = acide(st.s), p = +sl.value, n = a.formes.length;
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === st.s)));
    const svg = $("dist"); svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 40, l: 52 }, x: { domain: [0, 14], label: t("dist.x"), ticks: 7 }, y: { domain: [0, 1], label: t("dist.y") } });
    for (let j = 0; j < n; j++) {
      const pts = []; for (let k = 0; k <= 280; k++) { const x = k * 14 / 280; pts.push([o.x(x), o.y(C.fractions(a.pKa, x)[j])]); }
      Plot.el("path", { d: Plot.path(pts), class: "stroke bold " + CLS[j] }, o.g);
    }
    a.pKa.forEach(k => Plot.el("line", { x1: o.x(k), x2: o.x(k), y1: o.y(0), y2: o.y(1), class: "stroke thin dash c-label-2" }, o.g));
    Plot.el("line", { x1: o.x(p), x2: o.x(p), y1: o.y(0), y2: o.y(1), class: "stroke c-label" }, o.g);
    const f = C.fractions(a.pKa, p);
    f.forEach((v, j) => Plot.el("circle", { cx: o.x(p), cy: o.y(v), r: 5, class: "fill " + CLS[j] }, o.g));
    /* predominance: one band per form, the boundaries at the pKa */
    const pr = $("pred"); pr.innerHTML = ""; pr.setAttribute("viewBox", "0 0 640 64");
    const X = Plot.linScale(0, 14, 52, 624), bords = [0, ...a.pKa, 14];
    for (let j = 0; j < n; j++) {
      Plot.el("line", { x1: X(bords[j]) + 2, x2: X(bords[j + 1]) - 2, y1: 34, y2: 34, class: "stroke bold " + CLS[j] }, pr);
      Plot.el("text", { x: (X(bords[j]) + X(bords[j + 1])) / 2, y: 24, "text-anchor": "middle" }, pr).textContent = esp(a.formes[j]);
    }
    a.pKa.forEach(k => { Plot.el("line", { x1: X(k), x2: X(k), y1: 28, y2: 40, class: "stroke c-label" }, pr);
      Plot.el("text", { x: X(k), y: 56, "text-anchor": "middle" }, pr).textContent = F.fix(k, 2); });
    Plot.el("text", { x: 40, y: 38, "text-anchor": "end" }, pr).textContent = t("pred.label");
    Plot.el("circle", { cx: X(p), cy: 34, r: 5, class: "fill c-label" }, pr);
    $("legende").innerHTML = a.formes.map((s, j) => `<span class="${CLS[j]}">${esp(s)}</span>`).join("");
    $("sphv").textContent = F.fix(p, 2);
    const jmax = f.indexOf(Math.max(...f));
    $("stats").innerHTML = a.formes.map((s, j) => `<div class="stat"><span class="k">${esp(s)}</span><span class="v">${F.qty(F.num(100 * f[j], 3), "%")}</span><span class="f">${t(j === jmax ? "dist.f.pred" : "dist.f.min")}</span></div>`).join("");
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { st.s = b.dataset.s; draw(); });
  sl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["boyle", 1664, "experiment"], ["arrhenius", 1887, "idea"], ["nobel", 1903, "idea"], ["bronsted", 1923, "idea"], ["lewis", 1923, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["indicateurs", "sang"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["couple", "b"], ["fort", "d"], ["unite", "a"], ["predomine", "c"], ["ampholyte", "b"], ["neutre", "d"], ["activite", "a"], ["incompatibles", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1923 });
})();
</script>
