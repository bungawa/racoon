<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, f0 = Q.frequenceHyperfineH, mH = K.m_p + K.m_e;

/* ---------- the 21 cm line of a hydrogen cloud: Doppler shift by its velocity, width by its temperature ---------- */
(() => {
  const svg = $("raie"), sV = $("sV"), sT = $("sT"), X = 2000;            // kHz either side of f0
  function draw() {
    const v = +sV.value * 1e3, T = 10 ** +sT.value, df = -f0 * v / K.c, sv = Math.sqrt(K.k_B * T / mH), sf = f0 * sv / K.c;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 }, x: { domain: [-X, X], label: t("fig.x") }, y: { domain: [0, 1.05], label: t("fig.y") } });
    const p = [];
    for (let k = 0; k <= 400; k++) { const x = -X + 2 * X * k / 400, u = (x * 1e3 - df) / sf; p.push([o.x(x), o.y(Math.exp(-u * u / 2))]); }
    Plot.el("line", { x1: o.x(0), x2: o.x(0), y1: o.y(0), y2: o.y(1.05), class: "stroke thin dash c-label-2" }, o.g);
    Plot.el("path", { d: Plot.path(p), class: "stroke bold c-ok" }, o.g);
    $("sVr").textContent = F.si(v, "m·s⁻¹"); $("sTr").innerHTML = F.kelvin(T);
    $("vd").textContent = F.si(df, "Hz"); $("fd").textContent = t("fig.f.df", { l: F.si(K.c / (f0 + df), "m") });
    $("vw").textContent = F.si(2.3548 * sf, "Hz"); $("fw").textContent = t("fig.f.w", { s: F.si(sv, "m·s⁻¹") });
    $("vp").textContent = F.fix(3 * Math.exp(-K.h * f0 / (K.k_B * T)), 4); $("fp").textContent = t("fig.f.pop");
  }
  sV.oninput = sT.oninput = draw; draw();
})();

/* ---------- the system described: the temperature of the line, and how rarely an atom emits ---------- */
(() => {
  const Tl = K.h * f0 / (K.k_B), rate = 2.9e-15, an = 365.25 * 86400;
  $("sys1").innerHTML = t("sys1.body", { E: F.si(K.h * f0, "J"), T: F.kelvin(Tl), l: F.si(K.c / f0, "m") });
  $("sys2").innerHTML = t("sys2.body", { r: F.si(rate, "s⁻¹"), tau: F.sci(1 / rate / an, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hulst", 1944, "idea"], ["ewen", 1951, "experiment"], ["maser", 1960, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rotation", "galileo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["trois", "a"], ["singulet", "c"], ["ecart", "b"], ["doppler", "d"], ["pop", "a"], ["moyenne", "c"], ["rare", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1203 });
})();
</script>
