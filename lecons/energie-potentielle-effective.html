<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
const sci = (x, n) => Math.abs(x) >= 1e-2 && Math.abs(x) < 1e4 ? F.num(x, n) : F.sci(x, n);
const DEG = Math.PI / 180, JOUR = 86400, GM = Constantes.GM_E, R = Constantes.R_E_mean;
const km = r => F.qty(F.num(r / 1e3, 4), "km");

/* ---------- Ep,eff d'un satellite terrestre, par kilogramme ---------- */
(() => {
  const P = Plot.el, R0 = 2e6, R1 = 6e7, Y0 = -70, Y1 = 30, ETATS = textOf("pl.etats", ["impossible", "circulaire", "lie", "diffusion"]);
  function upd() {
    const C = +$("cc").value * 1e10, Em = +$("em").value * 1e6, N = FC.newtonien(GM, 1, C);
    $("ccv").textContent = F.qty(F.sci(C, 3), "m²·s⁻¹"); $("emv").textContent = F.qty(F.sci(Em, 3), "J·kg⁻¹");
    const svg = $("plot"); svg.innerHTML = "";
    const { x: X, y: Y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44 }, x: { domain: [R0 / 1e6, R1 / 1e6], label: t("pl.x") }, y: { domain: [Y0, Y1], label: t("pl.y") } });
    const clip = v => Math.max(Y0, Math.min(Y1, v / 1e6));
    const rs = Array.from({ length: 400 }, (_, i) => R0 + (R1 - R0) * i / 399);
    const path = (f, cls) => P("path", { d: rs.map((r, i) => (i ? "L" : "M") + X(r / 1e6).toFixed(1) + " " + Y(clip(f(r))).toFixed(1)).join(""), class: cls }, g);
    const tp = N.tournants(Em), etat = N.etat(Em);
    if (tp.length) {                                                   // accessible region: Ep,eff ≤ Em
      const a = tp[0], b = tp.length > 1 ? Math.min(tp[1], R1) : R1, zr = rs.filter(r => r >= a && r <= b);
      if (zr.length) P("path", { d: "M" + X(a / 1e6) + " " + Y(clip(Em)) + zr.map(r => "L" + X(r / 1e6).toFixed(1) + " " + Y(clip(N.eff(r))).toFixed(1)).join("") + "L" + X(b / 1e6) + " " + Y(clip(Em)) + "Z", class: "area" }, g);
    }
    path(N.ep, "axis"); path(N.centrifuge, "axis"); path(N.eff, "curve");
    P("path", { d: "M" + X(R0 / 1e6) + " " + Y(clip(Em)) + "L" + X(R1 / 1e6) + " " + Y(clip(Em)), class: "ref" }, g);
    P("path", { d: "M" + X(R / 1e6) + " " + Y(Y0) + "L" + X(R / 1e6) + " " + Y(Y1), class: "axis" }, g);
    P("text", { x: X(R / 1e6) + 4, y: Y(Y1) + 14, class: "note" }, g).textContent = t("pl.terre");
    tp.filter(r => r <= R1).forEach(r => P("circle", { cx: X(r / 1e6), cy: Y(clip(Em)), r: 5, class: "dot" }, g));
    $("vetat").textContent = ETATS[etat];
    const touche = tp.length && tp[0] < R;
    $("fetat").textContent = t(touche ? "pl.f.touche" : "pl.f.etat." + etat);
    $("vrmin").textContent = tp.length ? km(tp[0]) : "–";
    $("frmin").textContent = tp.length ? t("pl.f.alt", { h: km(tp[0] - R) }) : "";
    $("vrmax").textContent = etat === "lie" || etat === "circulaire" ? km(tp[tp.length - 1]) : etat === "diffusion" ? t("pl.infini") : "–";
    $("frmax").textContent = etat === "lie" ? t("pl.f.alt", { h: km(tp[1] - R) }) : "";
    $("vrc").textContent = km(N.rc);
    $("frc").textContent = t("pl.f.min", { e: F.qty(F.sci(N.min, 3), "J·kg⁻¹") });
  }
  $("cc").oninput = $("em").oninput = upd; upd();
})();

/* ---------- stabilité : orbite circulaire poussée de 10⁻³ ---------- */
(() => {
  const pc = x => F.qty(F.num(x * 100, 2), "%");
  $("st2").textContent = pc(FC.perturbe(1, 2, 1, 1e-3, 5).ecart);
  $("st3").textContent = pc(FC.perturbe(1, 3, 1, 1e-3, 5).ecart);
  $("st3m").textContent = pc(1 - FC.perturbe(1, 3, 1, -1e-3, 3).rmin);
})();

/* ---------- décrire le système ---------- */
(() => {
  const IDS = ["centre", "forme", "relativite"], items = textOf("sys.items", IDS);
  const J = FC.precessionJ2(Constantes.R_E_eq + 400e3, 0, 51.6 * DEG), Me = FC.relativite("mercure");
  const v = { sat: F.sci(1000 * Constantes.G / GM, 1), j2: F.sci(J.relatif, 1), peri: F.num(J.perigee * JOUR / DEG, 2),
    rel: F.sci(2 * Me.rapport * (1 + Me.e) / (1 - Me.e * Me.e) , 1), merc: F.num(Me.parSiecle, 3) };
  keyed($("sys"), t("sys.tag"), IDS, Object.fromEntries(IDS.map(id => [id, { name: items[id].name, text: fill(items[id].text, v) }])));
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["leverrier", 1859, "experiment"], ["bertrand", 1873, "idea"], ["rutherford", 1911, "experiment"], ["einstein", 1915, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["transfert"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["barriere", "a"], ["tournant", "a"], ["signe", "a"], ["min", "a"], ["cube", "a"], ["choc", "a"], ["unedim", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 183 });
})();
</script>
