<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MS = "m·s⁻¹";
const speed = (v, d) => F.qty(F.fix(v, d), MS);
const dur = h => F.qty(h >= 1e-4 ? F.num(h, 3) : F.sci(h, 2), "s");
const small = v => Math.abs(v) >= 0.01 ? F.num(v, 3) : F.sci(v, 2);

/* ---------- §8-2 : la sécante tend vers la tangente ---------- */
(() => {
  const svg = $("sec"), x = Cine.fall, v = t => Cine.G * t, TMAX = 4;
  const { x: X, y: Y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44 }, x: { domain: [0, TMAX], label: t("sec.x") }, y: { domain: [0, 80], label: t("sec.y") } });
  let d = ""; for (let i = 0; i <= 200; i++) { const s = TMAX * i / 200; d += (i ? "L" : "M") + X(s).toFixed(1) + " " + Y(x(s)).toFixed(1); }
  Plot.el("path", { d, class: "curve" }, g);
  const clip = Plot.el("clipPath", { id: "plotarea" }, svg); Plot.el("rect", { x: X(0), y: Y(80), width: X(TMAX) - X(0), height: Y(0) - Y(80) }, clip);
  const lines = Plot.el("g", { "clip-path": "url(#plotarea)" }, g);
  const tan = Plot.el("line", { class: "ref" }, lines), secl = Plot.el("line", { class: "zero" }, lines);
  const p0 = Plot.el("circle", { r: 6, class: "dot" }, g), p1 = Plot.el("circle", { r: 5, class: "dot" }, g);
  const line = (el, t0, slope) => { const a = -1, b = TMAX + 1;
    el.setAttribute("x1", X(a)); el.setAttribute("y1", Y(x(t0) + slope * (a - t0))); el.setAttribute("x2", X(b)); el.setAttribute("y2", Y(x(t0) + slope * (b - t0))); };
  const t0sl = $("t0sl"), dtsl = $("dtsl");
  function upd() {
    const t0 = t0sl.value / 100, h = Math.pow(10, +dtsl.value), vm = Cine.forward(x, t0, h), ve = v(t0);
    line(tan, t0, ve); line(secl, t0, vm);
    p0.setAttribute("cx", X(t0)); p0.setAttribute("cy", Y(x(t0)));
    p1.setAttribute("cx", X(t0 + h)); p1.setAttribute("cy", Y(x(t0 + h)));
    $("t0read").textContent = F.qty(F.fix(t0, 2), "s"); $("dtread").textContent = dur(h);
    $("vmread").textContent = speed(vm, 4);
    $("dxread").textContent = t("sec.f.dx", { dx: F.qty(F.num(x(t0 + h) - x(t0), 4), "m"), dt: dur(h) });
    $("vread").textContent = speed(ve, 4);
    $("errread").textContent = F.qty(small(vm - ve), MS);
    /* Feynman's table: the same question at ever shorter durations */
    $("shrink").innerHTML = `<div role="row"><span role="columnheader">${t("shrink.dt")}</span><span class="v" role="columnheader">${t("shrink.vm")}</span></div>` +
      [1, 0.1, 0.01, 0.001, 0.0001].map(k => `<div role="row"><span role="cell">${dur(k)}</span><span class="v" role="cell">${speed(Cine.forward(x, t0, k), 6)}</span></div>`).join("");
  }
  t0sl.oninput = dtsl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["heytesbury", 1335, "idea"], ["galilee", 1638, "experiment"], ["newton", 1665, "idea"], ["leibniz", 1684, "idea"], ["troncon", 2012, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["troncon", "compteur", "gnss"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["secante", "a"], ["zero", "a"], ["dix", "a"], ["troncon", "a"], ["mieux", "a"], ["signe", "a"], ["sens", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 82 });
})();
</script>
