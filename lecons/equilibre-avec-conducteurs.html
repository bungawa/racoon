<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, NC = 1e-9;
const H = 0.05, QS = -10 * NC, RB = 0.002, PLAQUE = 1;            // boule de −10 nC, rayon 2 mm, à 5 cm d'une plaque de 1 m reliée à la terre
const SRC = [{ q: QS, x: 0, y: 0, z: H }];
const Nm = x => F.si(x, "N·m⁻¹");

/* ---------- le système décrit, chiffré, pour q = 1 nC ---------- */
(() => {
  const q = NC, z0 = ES.equilibrePlan(QS, H, q), f = ES.K * q * q / (4 * z0 * z0);
  $("sys").innerHTML = t("sys.body", { z0: F.si(z0, "m", { prefix: "m" }), f: F.si(f, "N"), m: F.si(f / 9.81 * 1e3, "g"),
    plaque: F.num(PLAQUE / z0, 2), boule: F.num(RB / (H - z0), 2), tau: F.sci(ES.EPS0 / 5.96e7, 2) });
})();

/* ---------- charges figées ou libres : l'énergie le long d'une direction ---------- */
(() => {
  const svg = $("pot"), dir = $("dir"), qsl = $("qsl"), N = 121;
  function draw() {
    const q = +qsl.value * NC, z0 = ES.equilibrePlan(QS, H, q), e = ES.energiesPlan(SRC, q, [0, 0, z0]), S = 0.8 * z0;
    const at = s => (dir.value === "z" ? [0, 0, z0 + s] : [s, 0, z0]);
    const pts = f => Array.from({ length: N }, (_, i) => { const s = -S + 2 * S * i / (N - 1); return [s, f(at(s)) / 1e-9]; });
    const fig = pts(e.figee), lib = pts(e.libre), all = fig.concat(lib).map(p => p[1]);
    const lo = Math.min(...all), hi = Math.max(...all, 1e-6);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [-S, S], label: t("pot.x"), fmt: v => F.num(1000 * v, 2) }, y: { domain: [lo, hi], label: t("pot.y") } });
    Plot.el("line", { x1: x(-S), x2: x(S), y1: y(0), y2: y(0), class: "zero" }, g);
    Plot.el("path", { d: Plot.path(fig.map(([s, u]) => [x(s), y(u)])), class: "stroke dash" }, Plot.el("g", { class: "c-label-2" }, g));
    Plot.el("path", { d: Plot.path(lib.map(([s, u]) => [x(s), y(u)])), class: "stroke" }, Plot.el("g", { class: "c-tint" }, g));
    const kf = e.raideursFigees.valeurs, kl = e.raideursLibres.valeurs;   // [vertical, horizontal, horizontal]
    $("qread").textContent = F.si(q, "C", { prefix: "n" });
    $("vz0").textContent = F.si(z0, "m", { prefix: "m" });
    $("vkz").textContent = Nm(kl[0]);
    $("fkz").textContent = t("pot.f.figee", { k: Nm(kf[0]) });
    $("vkx").textContent = Nm(kl[1]);
    $("fkx").textContent = t("pot.f.figee", { k: Nm(kf[1]) });
    $("vsomme").textContent = Nm(e.raideursLibres.trace);
  }
  dir.onchange = qsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["thomson", 1847, "idea"], ["rhim", 1993, "experiment"], ["iss", 2015, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["levitation"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["energie", "b"], ["attire", "d"], ["image", "a"], ["raideurs", "c"], ["demi", "b"], ["verticale", "a"], ["actif", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 53 });
})();
</script>
