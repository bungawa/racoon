<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OndesMilieux, C = Constantes.c, e = Constantes.e;

/* ---------- les lignes de champ contractées et le profil angulaire ---------- */
(() => {
  const lignes = $("lignes"), profil = $("profil"), sg = $("sg"), b = 0.01;   // the pulse is read 1 cm from the line of motion
  function draw() {
    const g = Math.pow(10, +sg.value), beta = Math.sqrt(1 - 1 / (g * g));
    /* field lines: 24 lines of the charge at rest, x squashed by γ; length ∝ nothing, the density is the field */
    lignes.innerHTML = "";
    const cx = 320, cy = 150;
    Plot.el("circle", { cx, cy, r: 120, class: "stroke thin dash c-warn" }, lignes);
    O.lignesHeaviside(beta, 24).forEach(psi => {
      Plot.el("line", { x1: cx + 10 * Math.cos(psi), y1: cy - 10 * Math.sin(psi), x2: cx + 140 * Math.cos(psi), y2: cy - 140 * Math.sin(psi), class: "stroke c-tint" }, lignes);
    });
    Plot.fleche(lignes, [cx - 40, 285], [cx + 40, 285], { cls: "c-label" });
    Plot.el("text", { x: cx + 50, y: 289 }, lignes).textContent = t("fig.v");
    Plot.el("circle", { cx, cy, r: 6, class: "fill c-label" }, lignes);
    /* E/E_Coulomb against the angle ψ with v, log scale */
    profil.innerHTML = "";
    const ymin = 1e-8, ymax = 2e4;
    const A = Plot.axes(profil, { fmt: F, w: 640, h: 240, pad: { l: 56, b: 44 }, x: { domain: [0, 180], label: t("fig.xaxis") }, y: { scale: "log", domain: [ymin, ymax], label: t("fig.yaxis") } });
    const ps = Array.from({ length: 721 }, (_, i) => i / 4);
    Plot.el("line", { x1: A.x(0), x2: A.x(180), y1: A.y(1), y2: A.y(1), class: "ref" }, A.g);
    Plot.el("path", { d: Plot.path(ps.map(d => [A.x(d), A.y(Math.max(ymin, O.profilHeaviside(beta, d * Math.PI / 180)))])), class: "curve" }, A.g);
    /* readouts */
    const a = O.largeurAngulaire(beta), p = beta > 0 ? O.impulsionTransverse(e, beta * C, b) : null;   // at rest: no pulse
    $("sgr").textContent = t("fig.gammaval", { g: F.num(g, 3), b: F.num(beta, beta > 0.999 ? 7 : 3) });
    $("vcote").textContent = F.num(g, 3);
    $("fcote").textContent = t("fig.f.cote", { v: F.sci(1 / (g * g), 2) });
    $("vangle").textContent = a === null ? t("fig.aucune") : F.qty(F.num(a * 180 / Math.PI, 3), "°");
    $("fangle").textContent = a === null ? t("fig.f.aucune") : t("fig.f.angle", { v: F.num(0.766 / g * 180 / Math.PI, 3) });
    $("vduree").textContent = p ? F.si(p.duree, "s") : t("fig.aucune");
    $("fduree").textContent = p ? t("fig.f.duree", { E: F.si(p.crete, "V·m⁻¹"), I: F.sci(p.integrale, 3) }) : t("fig.f.repos");
  }
  sg.oninput = draw; draw();
})();

/* ---------- le système décrit : un proton du LHC et un ion de plomb ---------- */
(() => {
  const gp = 6.8e12 / 938.272e6, pp = O.impulsionTransverse(e, C * Math.sqrt(1 - 1 / (gp * gp)), 0.01);
  const gPb = 2.51e12 / 931.494e6, bPb = 20e-15, pPb = O.impulsionTransverse(82 * e, C * Math.sqrt(1 - 1 / (gPb * gPb)), bPb);
  const schwinger = Constantes.m_e ** 2 * C ** 3 / (e * Constantes.hbar);
  $("sys1").innerHTML = t("sys1.body", { gp: F.num(gp, 3), dp: F.si(pp.duree, "s"), Ep: F.si(pp.crete, "V·m⁻¹"),
    gPb: F.num(gPb, 3), EPb: F.sci(pPb.crete, 2), dPb: F.si(pPb.duree, "s"), S: F.sci(schwinger, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["thomson", 1881, "idea"], ["heaviside", 1889, "idea"], ["fermi", 1924, "idea"], ["ww", 1934, "idea"], ["atlas", 2017, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["upc"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["radial", "b"], ["cote", "d"], ["devant", "a"], ["lignes", "c"], ["b", "b"], ["impulsion", "a"], ["action", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 262 });
})();
</script>
