          <div class="ctl"><div class="row"><label for="ctau" data-i18n="sp.tau"></label><output id="ctauv" for="ctau"></output></div>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
(() => { const IDS = ["source", "mesure", "fenetre", "fronts"]; keyed($("systeme"), t("systeme.tag"), IDS, textOf("systeme.items", IDS)); })();
(() => { const IDS = ["impulsion", "note", "radar"]; keyed($("exemples"), t("exemples.tag"), IDS, textOf("exemples.items", IDS)); })();

/* ---------- le train d'impulsions : raies (1.1) sous l'enveloppe |U(f)| de (1.3) ---------- */
(() => {
  const O = self.Ondes, A = 1, FMAX = 5e3, MODES = ["amplitude", "densite"], noms = textOf("sp.modes", MODES); let mode = 0;
  $("mode").innerHTML = MODES.map((id, i) => `<button type="button" data-i="${i}" aria-pressed="${i === 0}">${noms[id]}</button>`).join("");
  /* curseur 0…1 → T de 1,25τ à 50τ, en échelle logarithmique */
  const periode = (v, tau) => tau * 1.25 * Math.pow(40, v);
  function upd() {
    [...$("mode").children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === mode)));
    const tau = 1e-3 * +$("ctau").value, T = periode(+$("cT").value, tau), S = O.trainImpulsions(A, tau, T), dens = mode === 1;
    $("cTv").textContent = F.si(T, "s"); $("ctauv").textContent = F.si(tau, "s");
    /* le signal : de −10 ms à 40 ms */
    let svg = $("temps"); svg.innerHTML = "";
    let P = Plot.axes(svg, { fmt: F, w: 640, h: 150, pad: { l: 56, b: 40 }, x: { domain: [-10, 40], label: t("tp.xaxis") }, y: { domain: [-0.1, 1.2], label: t("tp.yaxis") } });
    const pts = []; for (let j = 0; j <= 2000; j++) { const tt = -10e-3 + 50e-3 * j / 2000; pts.push([P.x(tt * 1e3), P.y(S.u(tt))]); }
    Plot.el("path", { d: Plot.path(pts), class: "curve" }, P.g);
    /* le spectre : raies, et en mode densité l'enveloppe continue |U(f)| (en mV·s) */
    svg = $("raies"); svg.innerHTML = "";
    const k = dens ? T * 1e3 / 2 : 1, top = dens ? tau * 1e3 * 1.15 : Math.max(2 * S.q, 0.05) * 1.15;
    P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, FMAX / 1e3], label: t("sp.xaxis") }, y: { domain: [0, top], label: t(dens ? "sp.yaxis.d" : "sp.yaxis.a") } });
    Plot.el("rect", { x: P.x(0), y: P.y(top), width: P.x(1 / tau / 1e3) - P.x(0), height: P.y(0) - P.y(top), class: "area" }, P.g);
    if (dens) { const e = []; for (let j = 0; j <= 600; j++) { const f = FMAX * j / 600; e.push([P.x(f / 1e3), P.y(Math.abs(S.U(f)) * 1e3)]); }
      Plot.el("path", { d: Plot.path(e), class: "stroke dash c-label-2" }, P.g); }
    else { const e = []; for (let j = 0; j <= 600; j++) { const f = FMAX * j / 600; e.push([P.x(f / 1e3), P.y(S.enveloppe(f))]); }
      Plot.el("path", { d: Plot.path(e), class: "stroke dash c-label-2" }, P.g); }
    const raie = (f, a) => Plot.el("line", { x1: P.x(f / 1e3), x2: P.x(f / 1e3), y1: P.y(0), y2: P.y(Math.min(a, top)), class: "stroke bold c-tint" }, P.g);
    raie(0, dens ? T * S.moyenne * 1e3 : S.moyenne);
    for (let n = 1; n / T <= FMAX; n++) raie(n / T, Math.abs(S.raie(n)) * k);
    const lobe = Math.ceil(T / tau - 1e-9) - 1;
    $("vf").textContent = F.si(1 / T, "Hz"); $("ff").textContent = t("sp.f.f0");
    $("vl").textContent = F.num(lobe, 3); $("fl").textContent = t("sp.f.lobe", { l: F.si(2 / tau, "Hz") });
    $("vm").textContent = F.si(S.moyenne, "V"); $("fm").textContent = t("sp.f.moy", { q: F.num(S.q, 2) });
  }
  $("mode").onclick = e => { const b = e.target.closest("button"); if (b) { mode = +b.dataset.i; upd(); } };
  ["cT", "ctau"].forEach(id => $(id).oninput = upd);
  upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["gauss", 1805, "idea"], ["gabor", 1946, "idea"], ["cooley", 1965, "idea"], ["heideman", 1984, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["analyseur", "cem"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["raies", "b"], ["espacement", "d"], ["zero", "a"], ["densite", "c"], ["bref", "b"], ["fenetre", "a"], ["phases", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1946 });
})();
</script>
