<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- lignes de champ et équipotentielles de 1 à 3 masses (unités réduites : G = 1, masses en M, longueurs en d) ---------- */
(() => {
  const svg = $("champ"), qsl = $("qsl"), P = Plot.el, BOX = [-4, 4, -2.5, 2.5];
  const X = Plot.linScale(BOX[0], BOX[1], 0, 640), Y = Plot.linScale(BOX[2], BOX[3], 400, 0);
  const LEVELS = [-0.5, -0.7, -0.9, -1.2, -1.6, -2.2, -3];
  let n = 2, probe = [0.6, 1.4];
  const layout = q => ({ 1: [{ m: 1, r: [0, 0] }], 2: [{ m: 1, r: [-1.5, 0] }, { m: q, r: [1.5, 0] }],
    3: [{ m: 1, r: [-1.6, -0.7] }, { m: q, r: [1.6, -0.7] }, { m: 0.6, r: [0, 1.3] }] })[n];
  const path = (pts, cls) => P("path", { d: pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(""), class: cls }, svg);
  function draw() {
    const q = qsl.value / 10, list = layout(q), S = Travail.masses(list, { G: 1 }), sinks = list.map(o => o.r);
    svg.innerHTML = "";
    LEVELS.forEach(L => Travail.isolignes(S.phi, BOX, 90, L).forEach(s => path(s, "stroke thin c-label-2")));
    list.forEach(o => {                                          // field lines: as many as the mass is large (Gauss)
      const k = Math.max(4, Math.round(12 * o.m));
      for (let j = 0; j < k; j++) {
        const a = 2 * Math.PI * (j + 0.5) / k, start = [o.r[0] + 0.08 * Math.cos(a), o.r[1] + 0.08 * Math.sin(a)];
        path(Travail.ligneDeChamp(S.champ, start, { pas: 0.02, n: 700, sens: -1, boite: BOX, puits: sinks, rayon: 0.05 }), "stroke c-tint");
      }
    });
    list.forEach(o => P("circle", { cx: X(o.r[0]), cy: Y(o.r[1]), r: 5 + 5 * Math.sqrt(o.m), class: "fill c-label" }, svg));
    /* the probe: φ, g, the numerical gradient and the angle between g and the equipotential through it */
    if (sinks.some(r => Math.hypot(probe[0] - r[0], probe[1] - r[1]) < 0.15)) probe = [probe[0] + 0.3, probe[1] + 0.3];
    const phi = S.phi(probe), g = S.champ(probe), gr = Travail.champGradient(S.phi)(probe), gn = Math.hypot(...g);
    const segs = Travail.isolignes(S.phi, [probe[0] - 0.1, probe[0] + 0.1, probe[1] - 0.1, probe[1] + 0.1], 21, phi);
    let best = null, bd = Infinity;
    segs.forEach(s => { const m = [(s[0][0] + s[1][0]) / 2, (s[0][1] + s[1][1]) / 2], d = Math.hypot(m[0] - probe[0], m[1] - probe[1]); if (d < bd) { bd = d; best = s; } });
    Travail.isolignes(S.phi, BOX, 120, phi).forEach(s => path(s, "stroke c-warn"));
    P("line", { x1: X(probe[0]), y1: Y(probe[1]), x2: X(probe[0]) + 40 * g[0] / gn, y2: Y(probe[1]) - 40 * g[1] / gn, class: "stroke bold c-warn" }, svg);
    P("circle", { cx: X(probe[0]), cy: Y(probe[1]), r: 5, class: "fill c-warn" }, svg);
    $("qread").textContent = t("pc.v.m", { v: F.num(q, 2) });
    $("vphi").textContent = t("pc.v.phi", { v: F.num(phi, 3) });
    $("vg").textContent = t("pc.v.g", { v: F.num(gn, 3) });
    $("vgrad").textContent = F.sci(Math.hypot(...gr.map((c, i) => c - g[i])) / gn, 1);
    if (best) { const tx = best[1][0] - best[0][0], ty = best[1][1] - best[0][1];
      $("vangle").textContent = F.fix(Math.acos(Math.min(1, Math.abs(tx * g[0] + ty * g[1]) / (Math.hypot(tx, ty) * gn))) * 180 / Math.PI, 1) + "°"; }
    else $("vangle").textContent = "–";
  }
  document.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { n = +b.dataset.n;
    document.querySelectorAll("[data-n]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); qsl.disabled = n === 1; draw(); });
  svg.addEventListener("pointerdown", e => { const r = svg.getBoundingClientRect();
    probe = [X.inv((e.clientX - r.left) * 640 / r.width), Y.inv((e.clientY - r.top) * 400 / r.height)]; draw(); });
  qsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["lagrange", 1773, "idea"], ["green", 1828, "idea"], ["gauss", 1840, "idea"], ["goce", 2009, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["geoide", "condensateur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["coquille", "b"], ["milieu", "c"], ["serrees", "a"], ["equi", "d"], ["scalaire", "a"], ["hauteur", "b"], ["croisent", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 145 });
})();
</script>
