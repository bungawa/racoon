<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes;

/* ---------- N states in a ring or a chain, energies in units of A: (11.62) and its roots ---------- */
(() => {
  const svg = $("courbe"), sN = $("sN"), sD = $("sD"), forme = $("forme"), X0 = -4, X1 = 4;
  let f = "anneau";
  function draw() {
    const n = +sN.value, d = +sD.value, H = Q.matriceAnneau(n, 0, 1, f === "anneau");
    H[0][0] = d;                                                    // one state shifted by δ (in units of A)
    const { valeurs: E, vecteurs: V } = Q.propresSymetrique(H), ex = Q.energiesAnneau(n, 0, 1, f === "anneau");
    const det = e => Q.determinant(H.map((l, i) => l.map((x, j) => x - (i === j ? e : 0))));
    const sg = x => Math.sign(x) * Math.log10(1 + Math.abs(x));      // signed log: the zeros stay zeros
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 56 }, x: { domain: [X0, X1], label: t("fig.x") }, y: { domain: [-3, 3], label: t("fig.y") } });
    const p = [];
    for (let k = 0; k <= 400; k++) { const e = X0 + (X1 - X0) * k / 400; p.push([o.x(e), o.y(Math.max(-3, Math.min(3, sg(det(e)))))]); }
    Plot.el("line", { x1: o.x(X0), x2: o.x(X1), y1: o.y(0), y2: o.y(0), class: "stroke thin c-label-2" }, o.g);
    Plot.el("path", { d: Plot.path(p), class: "stroke bold c-ok" }, o.g);
    if (d === 0) for (const e of ex) Plot.el("line", { x1: o.x(e), x2: o.x(e), y1: o.y(-3), y2: o.y(3), class: "stroke thin dash c-tint" }, o.g);
    for (const e of E) Plot.el("circle", { cx: o.x(e), cy: o.y(0), r: 5, class: "fill c-warn" }, o.g);
    let orth = 0;
    V.forEach((v, i) => V.forEach((w, j) => { if (i !== j) orth = Math.max(orth, Math.abs(v.reduce((s, x, k) => s + x * w[k], 0))); }));
    const tr = H.reduce((s, l, i) => s + l[i], 0), se = E.reduce((s, x) => s + x, 0);
    $("sNr").textContent = F.num(n, 2); $("sDr").textContent = F.fix(d, 2);
    $("vn").textContent = E.map(x => F.fix(Math.abs(x) < 5e-13 ? 0 : x, 2)).join(" ; ");
    $("fn").textContent = t("fig.f.niveaux");
    $("vt").textContent = F.fix(se, 6); $("ft").textContent = t("fig.f.trace", { tr: F.fix(tr, 6) });
    $("vo").textContent = F.sci(Math.max(orth, 1e-17), 1); $("fo").textContent = t("fig.f.ortho");
    forme.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.f === f)));
  }
  forme.querySelectorAll("button").forEach(x => x.onclick = () => { f = x.dataset.f; draw(); });
  sN.oninput = sD.oninput = draw; draw();
})();

/* ---------- the system described: how many states a real problem keeps ---------- */
(() => {
  const N = 1000, ops = N ** 3;
  $("sys1").innerHTML = t("sys1.body", { N: F.num(N, 4), ops: F.sci(ops, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hermite", 1855, "idea"], ["hilbert", 1904, "idea"], ["mises", 1929, "idea"], ["qr", 1961, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["chimie", "bandes"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["combien", "a"], ["reel", "c"], ["ortho", "b"], ["degen", "d"], ["trace", "c"], ["stationnaire", "a"], ["benzene", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1106 });
})();
</script>
