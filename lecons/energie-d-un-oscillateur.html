<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

(() => { const IDS = ["oscillateur", "frein", "air", "amplitude"]; keyed($("systeme"), t("systeme.tag"), IDS, textOf("systeme.items", IDS)); })();

/* ---------- §24-1 : énergie stockée, énergie perdue ---------- */
(() => {
  const M = 0.2, K = 20, W0 = Osc.pulsation(K, M), F0 = 0.05;                    // ω₀ = 10 rad·s⁻¹, F₀/k = 2,5 mm
  const RS = Array.from({ length: 301 }, (_, i) => 10 ** (Math.log10(0.3) + Math.log10(2.5 / 0.3) * i / 300));
  function upd() {
    const Q = 10 ** +$("q").value, r = +$("r").value, w = r * W0, E = Amort.energieEtablie(M, W0, Q, w, F0), T = 2 * Math.PI / w;
    /* energies over two periods of the steady state, in mJ */
    const ts = Array.from({ length: 201 }, (_, i) => 2 * T * i / 200), emax = 1.1e3 * E.max;
    let svg = $("energies"); svg.innerHTML = "";
    let o = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 56 }, x: { domain: [0, 2], label: t("energies.xaxis") }, y: { domain: [0, emax], label: t("energies.yaxis") } });
    Plot.el("line", { x1: o.x(0), x2: o.x(2), y1: o.y(1e3 * E.moy), y2: o.y(1e3 * E.moy), class: "stroke thin dash c-label-2" }, o.g);
    Plot.el("path", { d: path(ts.map(s => [o.x(s / T), o.y(1e3 * E.ep(s))])), class: "stroke c-label-2" }, o.g);
    Plot.el("path", { d: path(ts.map(s => [o.x(s / T), o.y(1e3 * E.ec(s))])), class: "stroke c-warn" }, o.g);
    Plot.el("path", { d: path(ts.map(s => [o.x(s / T), o.y(1e3 * (E.ec(s) + E.ep(s)))])), class: "curve" }, o.g);
    /* mean stored energy against ω/ω₀ (log-log), with the current point */
    const em = q => Amort.energieEtablie(M, W0, Q, q * W0, F0).moy * 1e3, top = 10 ** Math.ceil(Math.log10(em(1) * 1.5)), bot = top / 1e4;
    svg = $("moyenne"); svg.innerHTML = "";
    o = Plot.axes(svg, { fmt: F, w: 320, h: 260, pad: { b: 44, l: 56 }, x: { scale: "log", domain: [0.3, 2.5], label: t("moyenne.xaxis"), fmt: v => F.num(v, 2) }, y: { scale: "log", domain: [bot, top], label: t("moyenne.yaxis") } });
    [0.5, 2].forEach(v => { Plot.el("line", { x1: o.x(v), x2: o.x(v), y1: o.y(bot), y2: o.y(top), class: "grid" }, o.g);
      Plot.el("text", { x: o.x(v), y: o.y(bot) + 16, "text-anchor": "middle", class: "tick" }, o.g).textContent = F.num(v, 2); });
    Plot.el("line", { x1: o.x(1), x2: o.x(1), y1: o.y(bot), y2: o.y(top), class: "stroke thin dash c-label-2" }, o.g);
    Plot.el("path", { d: path(RS.map(q => [o.x(q), o.y(Math.max(bot, em(q)))])), class: "curve" }, o.g);
    Plot.el("circle", { cx: o.x(r), cy: o.y(Math.max(bot, em(r))), r: 5, class: "dot" }, o.g);
    /* readouts */
    $("qv").textContent = F.num(Q, 3); $("rv").textContent = t("eo.rv", { r: F.num(r, 3), w: F.si(w, "rad·s⁻¹") });
    $("ve").textContent = F.si(E.moy, "J"); $("fe").textContent = t("eo.f.e", { x: F.si(E.X, "m") });
    $("vw").textContent = F.si(E.travail, "J"); $("fw").textContent = t("eo.f.w", { p: F.si(E.puissance, "W") });
    $("vq").textContent = F.num(E.Q, 3); $("fq").textContent = t("eo.f.q", { q: F.num(Q, 3) });
    const ond = (E.max - E.min) / (E.max + E.min);
    $("vo").textContent = F.qty(F.num(100 * ond, 2), "%"); $("fo").textContent = t(Math.abs(r - 1) < 0.005 ? "eo.f.ond0" : r < 1 ? "eo.f.ondbas" : "eo.f.ondhaut");
  }
  $("q").oninput = $("r").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["huygens", 1656, "experiment"], ["joule", 1841, "experiment"], ["shortt", 1921, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["condensateur", "horloge"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["carre", "b"], ["moyenne", "d"], ["q", "a"], ["resonance", "c"], ["hors", "b"], ["circuit", "d"], ["shortt", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 241 });
})();
</script>
