<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions, P = Plot.el;
const keyed = (id, k, ids) => { const txt = textOf(k, ids); $(id).innerHTML = ids.map(i => `<div><span class="k">${txt[i].k}</span><span>${txt[i].v}</span></div>`).join(""); };
keyed("refs", "s2.refs", ["esh", "ecs", "agcl"]);
keyed("exemples", "s3.exemples", ["cu", "fe", "mn", "cl"]);
const volt = v => F.qty(F.fix(v, 3), "V");

/* ---------- schéma de la pile Daniell ---------- */
(() => {
  const svg = $("schema"), L = textOf("fig.labels", ["zn", "cu", "znso4", "cuso4", "pont", "v", "moins", "plus", "elec", "anode", "cathode"]);
  const lab = (x, y, s, anchor) => { P("text", { x, y, "text-anchor": anchor || "middle", class: "note" }, svg).textContent = s; };
  for (const [x0, met, sol, sign, role] of [[40, L.zn, L.znso4, L.moins, L.anode], [340, L.cu, L.cuso4, L.plus, L.cathode]]) {
    P("path", { d: `M${x0} 110 L${x0} 240 L${x0 + 180} 240 L${x0 + 180} 110`, class: "stroke c-label-2" }, svg);          // bécher
    P("rect", { x: x0 + 20, y: 150, width: 140, height: 88, class: "fill c-tint", "fill-opacity": 0.15 }, svg);
    P("rect", { x: x0 + 70, y: 70, width: 14, height: 140, class: "fill c-label-2" }, svg);                                  // lame
    lab(x0 + 77, 62, met + " (" + sign + ")"); lab(x0 + 90, 232, sol); lab(x0 + 90, 256, role);
  }
  P("path", { d: "M180 200 L180 120 L380 120 L380 200", class: "stroke bold c-tint" }, svg);                                // pont salin
  lab(280, 112, L.pont);
  P("path", { d: "M117 70 L117 30 L245 30 M315 30 L417 30 L417 70", class: "stroke c-label" }, svg);
  P("circle", { cx: 280, cy: 30, r: 26, class: "stroke c-label" }, svg); lab(280, 36, L.v);
  Plot.fleche(svg, [175, 18], [130, 18], { cls: "c-warn" }); lab(152, 12, L.elec);
})();

/* ---------- §4 : une pile qui se décharge ---------- */
(() => {
  const EL = C.COUPLES.filter(c => ["zn", "fe2", "ni", "pb", "cu", "ag"].includes(c.id));
  const opt = c => `<option value="${c.id}">${t("pile.opt", { ox: C.texte(c.ox), red: C.texte(c.red), e: F.fix(c.E0, 2) })}</option>`;
  $("ela").innerHTML = $("elb").innerHTML = EL.map(opt).join(""); $("ela").value = "zn"; $("elb").value = "cu";
  let ref = "esh";
  const E_ECS = 0.24;                                                     // V vs ESH, calomel saturated in KCl, 298 K
  const electrode = (id, lc) => { const c = EL.find(x => x.id === id); return { E0: c.E0, z: C.formule(c.ox).charge, c: Math.pow(10, lc), V: 0.1, nom: C.texte(c.red) }; };
  function draw() {
    const A = electrode($("ela").value, +$("ca").value), B = electrode($("elb").value, +$("cb").value), f = +$("deb").value;
    $("cav").textContent = F.qty(F.num(A.c, 2), "mol·L⁻¹"); $("cbv").textContent = F.qty(F.num(B.c, 2), "mol·L⁻¹");
    $("debv").textContent = F.qty(F.num(100 * f, 3), "%");
    const svg = $("decharge"); svg.innerHTML = "";
    if ($("ela").value === $("elb").value && A.c === B.c) {
      ["vplus", "vmoins", "ve", "vq", "fplus", "fmoins", "fq"].forEach(id => $(id).textContent = "–");
      Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44 }, x: { domain: [0, 1], label: t("pile.x") }, y: { domain: [0, 1], label: t("pile.y") } });
      return;
    }
    const p = C.pile(A, B), plus = p.plus === "A" ? A : B, moins = p.plus === "A" ? B : A;
    const pts = [], N = 200;
    for (let i = 0; i <= N; i++) { const x = 0.999 * i / N; pts.push([x * p.Q, p.etat(x * p.xiMax).e]); }
    const ys = pts.map(q => q[1]), lo = Math.min(...ys), hi = Math.max(...ys);
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 60 }, x: { domain: [0, p.Q], label: t("pile.x") }, y: { domain: [Math.max(0, lo - 0.05), hi + 0.05], label: t("pile.y") } });
    P("path", { d: Plot.path(pts.map(([q, e]) => [o.x(q), o.y(e)])), class: "curve" }, o.g);
    const s = p.etat(f * p.xiMax);
    P("circle", { cx: o.x(f * p.Q), cy: o.y(s.e), r: 6, class: "dot" }, o.g);
    const shift = ref === "ecs" ? E_ECS : 0;
    $("vplus").textContent = volt(s.Eplus - shift); $("fplus").textContent = t("pile.f.pole", { m: plus.nom, c: F.qty(F.sci(s.cplus, 2), "mol·L⁻¹") });
    $("vmoins").textContent = volt(s.Emoins - shift); $("fmoins").textContent = t("pile.f.pole", { m: moins.nom, c: F.qty(F.sci(s.cmoins, 2), "mol·L⁻¹") });
    $("ve").textContent = volt(s.e);
    $("vq").textContent = F.si(p.Q, "C", { sig: 3 }); $("fq").textContent = t("pile.f.q", { ah: F.qty(F.num(p.Q / 3600, 3), "A·h"), n: p.n });
    $("ref").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.r === ref)));
  }
  ["ela", "elb"].forEach(id => $(id).onchange = draw);
  ["ca", "cb", "deb"].forEach(id => $(id).oninput = draw);
  $("ref").querySelectorAll("button").forEach(b => b.onclick = () => { ref = b.dataset.r; draw(); });
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["volta", 1800, "experiment"], ["daniell", 1836, "experiment"], ["leclanche", 1866, "use"], ["nernst", 1889, "idea"],
    ["haber", 1909, "experiment"], ["stockholm", 1953, "idea"], ["sony", 1991, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["phmetre", "reference", "pile"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pole", "b"], ["courant", "d"], ["dilution", "a"], ["ph", "c"], ["reference", "a"], ["capacite", "b"], ["activite", "d"], ["usee", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2612 });
})();
</script>
