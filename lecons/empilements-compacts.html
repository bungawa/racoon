<body>
<main class="page">

    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/reseau-motif-maille" data-i18n="tag.prereq"></a>
    </div>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure>
      <svg class="fig dessus" id="dessus" role="img" data-i18n-attr="aria-label:d2.aria"></svg>
      <div class="panel">
        <div class="controls">
          <div class="seg" id="couches" role="group" data-i18n-attr="aria-label:d2.couches">
            <button type="button" data-c="A" data-i18n="d2.c.A"></button><button type="button" data-c="AB" data-i18n="d2.c.AB"></button><button type="button" data-c="ABC" data-i18n="d2.c.ABC"></button><button type="button" data-c="ABA" data-i18n="d2.c.ABA"></button>
          </div>
          <div class="seg" id="sites" role="group" data-i18n-attr="aria-label:d2.sites">
            <button type="button" data-s="aucun" data-i18n="d2.s.aucun"></button><button type="button" data-s="T" data-i18n="d2.s.T"></button><button type="button" data-s="O" data-i18n="d2.s.O"></button>
          </div>
        </div>
        <p class="caption" id="d2lecture"></p>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="d2.k.T"></span><span class="v" id="vT"></span><span class="f" id="fT"></span></div>
          <div class="stat"><span class="k" data-i18n="d2.k.O"></span><span class="v" id="vO"></span><span class="f" id="fO"></span></div>
        </div>
      </div>
      <div class="legend" id="legende2"></div>
      <figcaption data-i18n-html="d2.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure>
      <div class="stage"><canvas id="vue"></canvas><div class="overlay" id="vueinfo"></div></div>
      <div class="panel">
        <div class="controls">
          <button class="btn tinted" type="button" id="diag" data-i18n="v3.diag"></button>
          <button class="btn tinted" type="button" id="biais" data-i18n="v3.biais"></button>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="v3.k.dans"></span><span class="v" id="vdans"></span><span class="f" data-i18n="v3.f.dans"></span></div>
          <div class="stat"><span class="k" data-i18n="v3.k.dessus"></span><span class="v" id="vdessus"></span><span class="f" data-i18n="v3.f.dessus"></span></div>
          <div class="stat"><span class="k" data-i18n="v3.k.dessous"></span><span class="v" id="vdessous"></span><span class="f" data-i18n="v3.f.dessous"></span></div>
        </div>
      </div>
      <div class="legend"><span class="c-tint" data-i18n="v3.e.A"></span><span class="el-o" data-i18n="v3.e.B"></span><span class="t-solide" data-i18n="v3.e.C"></span></div>
      <figcaption data-i18n-html="v3.caption"></figcaption>
    </figure>
    <p data-i18n-html="s3.p2"></p>
    <div class="eq"><math display="block"><mi>a</mi><msqrt><mn>2</mn></msqrt><mo>=</mo><mn>4</mn><mi>r</mi><mspace width="1em"></mspace><mo>⟺</mo><mspace width="1em"></mspace><mi>a</mi><mo>=</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mspace width="0.2em"></mspace><mi>r</mi></math></div>
    <p class="validite" data-i18n-html="val.contact"></p>
    <p data-i18n-html="s3.p3"></p>
    <div class="eq"><math display="block"><msub><mi>d</mi><mtext data-i18n="eq.plans"></mtext></msub><mo>=</mo><mfrac><mi>a</mi><msqrt><mn>3</mn></msqrt></mfrac><mo>=</mo><mn>2</mn><mi>r</mi><msqrt><mfrac><mn>2</mn><mn>3</mn></mfrac></msqrt></math></div>
    <p class="validite" data-i18n-html="val.plans"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <p data-i18n-html="s4.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>

    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>

  <section class="card">

    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/empilements-compacts.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/tenseurs.js"></script>
<script src="/racoon/lecons/cristaux.js"></script>
<script src="/racoon/lecons/reseau-motif-maille.js"></script>
<script src="/racoon/vue-cristal.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), X = Cristaux, P = CristalParfait;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const seg = (el, attr, cb) => { const bs = [...el.querySelectorAll("button")];
  const pick = b => { bs.forEach(x => x.setAttribute("aria-pressed", String(x === b))); cb(b.dataset[attr]); };
  bs.forEach(b => b.onclick = () => pick(b)); pick(bs[0]); };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CLS = { A: "c-tint", B: "el-o", C: "t-solide" };

/* ---------- vue de dessus : couches et sites ---------- */
(() => {
  const svg = $("dessus"), D = 40, N = 12, H = D * Math.sqrt(2 / 3);
  const W = 6 * D, HT = 4.5 * D, x0 = 4.2 * D, y0 = 1.6 * D;                  // a window inside the rhombus of each layer
  svg.setAttribute("viewBox", `${x0} ${y0} ${W} ${HT}`);
  const R = [0.5, 0.4, 0.31];                                                  // drawn radius of layers 1, 2, 3 (× d): each smaller, to see the one below
  let seq = "A", montre = "aucun";
  function dessiner() {
    svg.innerHTML = "";
    [...seq].forEach((l, k) => X.couche(l, N, D).forEach(p => {
      const deja = seq.indexOf(l) < k;                                        // a layer back over an earlier one: a ring, to see both
      Plot.el("circle", { cx: p[0], cy: p[1], r: R[k] * D, class: (deja ? "stroke bold " : "fill rim ") + CLS[l] }, svg);
    }));
    if (seq.length >= 2 && montre !== "aucun") {
      const s = P.sitesEntreCouches(seq[0], seq[1], N, D);
      s[montre].forEach(p => {
        if (montre === "O") Plot.el("circle", { cx: p[0], cy: p[1], r: P.habitabilite("O", D / 2), class: "fill rim c-ok" }, svg);
        else Plot.el("circle", { cx: p[0], cy: p[1], r: P.habitabilite("T", D / 2), class: "fill rim " + (p[2] < H / 2 ? "c-warn" : "c-label") }, svg);
      });
    }
    $("d2lecture").textContent = t("d2.lecture." + seq + (seq.length >= 2 && montre !== "aucun" ? "-" + montre : ""));
    const s = P.sitesEntreCouches("A", "B", N, D);
    $("vT").textContent = F.num(s.T.length / (N * N)); $("vO").textContent = F.num(s.O.length / (N * N));
    $("fT").textContent = t("d2.f.place", { r: F.fix(P.habitabilite("T", 1), 3) });
    $("fO").textContent = t("d2.f.place", { r: F.fix(P.habitabilite("O", 1), 3) });
    const leg = [...new Set(seq)].map(l => `<span class="${CLS[l]}">${t("d2.e." + l)}</span>`);
    if (seq.length >= 2 && montre === "T") leg.push(`<span class="c-warn">${t("d2.e.Tbas")}</span>`, `<span class="c-label">${t("d2.e.Thaut")}</span>`);
    if (seq.length >= 2 && montre === "O") leg.push(`<span class="c-ok">${t("d2.e.O")}</span>`);
    $("legende2").innerHTML = leg.join("");
  }
  seg($("couches"), "c", c => { seq = c; dessiner(); });
  seg($("sites"), "s", s => { montre = s; dessiner(); });
})();

/* ---------- la maille CFC, colorée par couche compacte ---------- */
(() => {
  const a = P.METAUX_CFC.Cu.a, d = a / Math.SQRT2, s = X.cubique("cfc", a, "X");
  const COUL = { A: "--tint", B: "--el-o", C: "--t-solide" };
  const vue = VueCristal.monter($("vue"), $("vueinfo"), { hors: t("v3.hors"), reduit: reduce });
  const at = X.atomes(s, 1).map(o => ({ e: P.coucheCFC(o.r.map(x => x / a)), r: o.r }));
  if (vue) vue.montrer(at, { dLiaison: d, maille: a, rayons: { A: 0.22, B: 0.22, C: 0.22 }, couleurs: COUL });
  // the 12 neighbours of a node, sorted by the compact plane they lie in (x + y + z = n − 1, n, n + 1)
  const noeuds = X.atomes(s, 2).map(o => o.r.map(x => x / a)), c = [1, 1, 1].map(x => x), n0 = 3;
  const voisins = noeuds.filter(p => Math.abs(Math.hypot(p[0] - c[0], p[1] - c[1], p[2] - c[2]) - Math.SQRT1_2) < 1e-9);
  const dans = k => voisins.filter(p => Math.round(p[0] + p[1] + p[2]) === n0 + k).length;
  $("vdans").textContent = String(dans(0)); $("vdessus").textContent = String(dans(1)); $("vdessous").textContent = String(dans(-1));
  $("diag").onclick = () => { if (vue) vue.regarder([1, 1, 1]); };
  $("biais").onclick = () => { if (vue) vue.regarder([1.2, 0.8, 1.6]); };
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["kepler", 1611, "idea"], ["barlow", 1883, "idea"], ["bragg", 1914, "experiment"], ["sanders", 1964, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["opale", "formage"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["creux", "b"], ["abc", "c"], ["compacite", "a"], ["contact", "d"], ["voisins", "b"], ["sites", "a"], ["familles", "d"], ["octa", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
</html>
