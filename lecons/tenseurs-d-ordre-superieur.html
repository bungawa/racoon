<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, T = Tenseurs;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const GPa = x => F.qty(F.num(x / 1e9, 3), "GPa");

/* ---------- compter les constantes : symétries d'indices, symétrie du cristal ---------- */
(() => {
  const PERM = { "p-ij": [1, 0, 2, 3], "p-kl": [0, 1, 3, 2], "p-paires": [2, 3, 0, 1] };
  const SYM = { aucune: [], cubique: [T.rotation([0, 0, 1], Math.PI / 2), T.rotation([1, 0, 0], Math.PI / 2)],
    isotrope: [T.rotation([1, 2, 3], 1), T.rotation([3, -1, 2], 2.3)] };          // two generic rotations: invariant under both = under all
  const INV = [[-1, 0, 0], [0, -1, 0], [0, 0, -1]];
  function upd() {
    const perms = Object.keys(PERM).filter(id => $(id).checked).map(id => PERM[id]), cr = $("cristal").value;
    const n = T.constantesLibres(4, { permutations: perms, symetries: SYM[cr] });
    $("velas").textContent = String(n);
    const key = cr === "aucune" ? { 81: "ct.f.81", 54: "ct.f.54", 45: "ct.f.45", 36: "ct.f.36", 21: "ct.f.21" }[n] : perms.length === 3 ? "ct.f." + cr : "ct.f.autre";
    $("felas").textContent = t(key);
    const inv = $("inversion").checked, np = T.constantesLibres(3, { permutations: [[0, 2, 1]], symetries: inv ? [INV] : [] });
    $("vpiezo").textContent = String(np);
    $("fpiezo").textContent = t(inv ? "ct.f.inv" : "ct.f.18");
  }
  ["p-ij", "p-kl", "p-paires", "inversion"].forEach(id => $(id).onchange = upd);
  $("cristal").onchange = upd; upd();
})();

/* ---------- module d'Young du silicium selon la direction ---------- */
(() => {
  const C = T.cubique4(166.0e9, 64.0e9, 79.6e9), steel = T.lame(210e9, 0.3), CA = T.isotrope4(steel.lambda, steel.mu);
  const svg = $("polar"), O = [320, 172], K = 140 / 215e9;                    // 215 GPa → 140 px
  const dirOf = (plan, a) => plan === "001" ? [Math.cos(a), Math.sin(a), 0] : [Math.sin(a) / Math.SQRT2, Math.sin(a) / Math.SQRT2, Math.cos(a)];
  const NAMED = [[[1, 0, 0], "[100]"], [[0, 1, 0], "[010]"], [[1, 1, 0], "[110]"], [[-1, 1, 0], "[1̄10]"], [[0, 0, 1], "[001]"], [[1, 1, 1], "[111]"], [[-1, -1, 1], "[1̄1̄1]"]];
  function upd() {
    const plan = $("plan").value, phi = +$("phi").value, a = phi * Math.PI / 180;
    $("phiv").textContent = F.qty(F.num(phi, 3), "°");
    svg.innerHTML = "";
    P("line", { x1: O[0] - 150, y1: O[1], x2: O[0] + 150, y2: O[1], class: "stroke thin c-label-2" }, svg);
    P("line", { x1: O[0], y1: O[1] - 150, x2: O[0], y2: O[1] + 150, class: "stroke thin c-label-2" }, svg);
    P("circle", { cx: O[0], cy: O[1], r: K * T.youngDirection(CA, [1, 0, 0]), class: "stroke thin dash c-label-2" }, svg);
    let d = "";
    for (let k = 0; k <= 360; k += 2) {
      const b = k * Math.PI / 180, E = T.youngDirection(C, dirOf(plan, b));
      d += (k ? "L" : "M") + (O[0] + K * E * Math.cos(b)).toFixed(1) + " " + (O[1] - K * E * Math.sin(b)).toFixed(1);
    }
    P("path", { d: d + "Z", class: "stroke c-tint" }, svg);
    const n = dirOf(plan, a), E = T.youngDirection(C, n);
    P("line", { x1: O[0], y1: O[1], x2: O[0] + K * E * Math.cos(a), y2: O[1] - K * E * Math.sin(a), class: "stroke c-warn" }, svg);
    P("circle", { cx: O[0] + K * E * Math.cos(a), cy: O[1] - K * E * Math.sin(a), r: 5, class: "fill c-warn" }, svg);
    const ax = plan === "001" ? ["[100]", "[010]"] : ["[001]", "[110]"];
    [[O[0] + 156, O[1] + 4, ax[0], "start"], [O[0] + 6, O[1] - 152, ax[1], "start"]].forEach(([x, y, s, an]) => { P("text", { x, y, "text-anchor": an }, svg).textContent = s; });
    const named = NAMED.find(([v]) => { const l = Math.hypot(...v); return Math.abs(Math.abs(v[0] * n[0] + v[1] * n[1] + v[2] * n[2]) / l - 1) < 1e-4; });
    $("vdir").textContent = named ? named[1] : t("po.dir", { a: F.fix(n[0], 2), b: F.fix(n[1], 2), c: F.fix(n[2], 2) });
    $("ve").textContent = GPa(E);
    $("fe").textContent = t("po.f.e", { r: F.fix(E / T.youngDirection(C, [1, 0, 0]), 2) });
  }
  $("plan").onchange = $("phi").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["green", 1837, "idea"], ["curie", 1880, "experiment"], ["lippmann", 1881, "idea"], ["voigt", 1898, "idea"], ["voigt2", 1910, "idea"], ["langevin", 1917, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["acier", "mems", "quartz"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["q81", "a"], ["q36", "c"], ["q21", "b"], ["iso", "d"], ["piezo", "a"], ["si", "c"], ["rang", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
