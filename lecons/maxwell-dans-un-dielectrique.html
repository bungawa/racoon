<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const OM = OndesMilieux, K = Constantes;

/* the medium of the page: electrons resonating at 100 nm, damping γ = 0,1 ω0, static susceptibility χ0 = Nα(0) = 1,25 */
const W0 = 2 * Math.PI * K.c / 100e-9, MODE = { w0: W0, gamma: 0.1 * W0 }, CHI0 = 1.25;
const N = CHI0 * K.eps0 * K.m_e * W0 * W0 / (K.e * K.e), T0 = 2 * Math.PI / W0;

/* ---------- le système décrit : un faisceau dans ce verre ---------- */
(() => {
  const w = 2 * Math.PI * K.c / 500e-9, E0 = Math.sqrt(2 * 1000 / (K.eps0 * K.c));
  const a = OM.polarisabiliteAtome(w, [MODE]), chi = Math.hypot(N * a.re, N * a.im), P0 = K.eps0 * chi * E0;
  const pas = Math.cbrt(1 / N), cote = 500e-9 / 10;
  $("sys1").innerHTML = t("sys1.body", { N: F.qty(F.sci(N, 2), "m⁻³"), pas: F.si(pas, "m", { prefix: "n" }), cote: F.si(cote, "m", { prefix: "n" }),
    n: F.sci((cote / pas) ** 3, 1), P: F.qty(F.sci(P0, 2), "C·m⁻²"), j: F.qty(F.sci(w * P0, 2), "A·m⁻²"), jv: F.qty(F.sci(w * K.eps0 * E0, 2), "A·m⁻²"), chi: F.num(chi, 3) });
})();

/* ---------- D = εE ? un sinus qu'on allume, un échelon ---------- */
(() => {
  const trace = $("trace"), sw = $("sw"), seg = $("signal");
  let signal = "sinus";
  const duree = 30 * T0, n = 3000;
  function draw() {
    const r = +sw.value / 100, w = r * W0;
    const E = signal === "sinus" ? (s => Math.cos(w * s)) : (() => 1);
    const s = MaxwellDielectrique.reponseTemporelle({ N, mode: MODE, E, duree, n });
    const a = OM.polarisabiliteAtome(signal === "sinus" ? w : 0, [MODE]), eps = { re: 1 + N * a.re, im: N * a.im };   // ε/ε0 of the steady state
    /* εE in time: Re(ε E0 e^(iωt)) for the sinusoid, ε(0) E0 for the step */
    const epsE = s.t.map(tt => signal === "sinus" ? eps.re * Math.cos(w * tt) - eps.im * Math.sin(w * tt) : eps.re);
    const d = s.D.map(x => x / K.eps0), fs = s.t.map(x => x * 1e15);
    const ymax = 1.15 * Math.max(...d.map(Math.abs), ...epsE.map(Math.abs), 1);
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, fs[fs.length - 1]], label: t("fig.xaxis") }, y: { domain: [-ymax, ymax], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(fs[fs.length - 1]), y1: P.y(0), y2: P.y(0), class: "zero" }, P.g);
    const line = (ys, cls) => Plot.el("path", { d: Plot.path(fs.map((x, i) => [P.x(x), P.y(ys[i])])), class: cls }, P.g);
    line(s.E, "stroke thin c-label-2"); line(epsE, "stroke dash c-warn"); line(d, "curve");
    /* the last period of ω0 or of ω: amplitude and lag of D against E */
    const per = signal === "sinus" ? 2 * Math.PI / w : T0, j0 = s.t.findIndex(x => x >= duree - per);
    let worst = 0, early = 0;
    s.t.forEach((x, i) => { const e = Math.abs(d[i] - epsE[i]); worst = Math.max(worst, e); if (i >= j0) early = Math.max(early, e); });
    const scale = Math.hypot(eps.re, eps.im);
    $("swr").textContent = F.num(r, 3);
    sw.disabled = signal !== "sinus";
    $("veps").textContent = F.num(scale, 3);
    $("feps").innerHTML = t("fig.f.eps", { re: F.num(eps.re, 3), im: F.num(-eps.im, 3), phi: F.qty(F.num(Math.atan2(-eps.im, eps.re) * 180 / Math.PI, 3), "°") });
    $("vfin").textContent = F.num(early / scale * 100, 2) + " %";
    $("ffin").textContent = t("fig.f.fin", { T: F.si(per, "s", { prefix: "f" }) });
    $("vecart").textContent = F.num(worst / scale * 100, 3) + " %";
    $("fecart").textContent = t("fig.f.ecart", { T: F.si(2 / MODE.gamma, "s", { prefix: "f" }) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === signal)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { signal = x.dataset.m; draw(); });
  sw.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1837, "experiment"], ["maxwell", 1865, "idea"], ["heaviside", 1885, "idea"], ["lorentz", 1895, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["permittivite"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["transverse", "b"], ["courant", "d"], ["autres", "a"], ["force", "c"], ["sinus", "b"], ["echelon", "a"], ["rapport", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 322 });
})();
</script>
