<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique;
const metres = v => F.si(v, "m", { prefix: "" }), pct = v => F.qty(F.num(100 * v, 2), "%");

/* Graphite, thermal neutrons (0,0253 eV): D = 0,916 cm in the flux convention, so λtr = 3D = 2,75 cm (nuclear-power.com table);
   measured diffusion length 50,9 cm in reactor-grade graphite (Mirfayzi, arXiv:1301.1699). Speed 2 200 m·s⁻¹. */
const LTR = 0.0275, LD = 0.509, V = 2200, DN = Statistique.dLibre(LTR, V);

/* ---------- le système décrit ---------- */
(() => {
  const a = 0.2;
  $("sys1").innerHTML = t("sys1.body", { v: F.si(V, "m·s⁻¹"), ltr: metres(LTR), D: F.si(DN, "m²·s⁻¹"), ld: metres(LD), a: metres(a),
    al: F.num(a / LTR, 2), abs: F.num((a / LD) ** 2, 2), tau: F.si(LD * LD / DN, "s") });
})();

/* ---------- des marches au hasard contre la diffusion ---------- */
(() => {
  const svg = $("profil"), asl = $("asl");
  let graine = 12;
  function draw() {
    const a = +asl.value, Rb = 3 * a, nc = 12, NN = 4000;
    const s = ES.neutronsSphere({ a, Rb, N: NN, couches: nc }, Quiz.rng(graine));
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, pad: { b: 44 }, x: { domain: [0, 3], label: t("fig.x"), fmt: v => F.num(v, 2) },
      y: { domain: [0, 0.6], label: t("fig.y"), fmt: v => F.num(v, 2) } });
    const xs = Array.from({ length: 151 }, (_, i) => 3 * i / 150);
    Plot.el("path", { d: Plot.path(xs.map(u => [x(u), y(ES.sourceSphere(1, 1, 1, u))])), class: "stroke dash" }, Plot.el("g", { class: "c-label-2" }, g));
    Plot.el("path", { d: Plot.path(xs.map(u => [x(u), y(s.theorie(u * a))])), class: "stroke bold" }, Plot.el("g", { class: "c-tint" }, g));
    const gm = Plot.el("g", { class: "c-warn" }, g);
    s.r.forEach((r, i) => {
      const u = r / a, v = s.N[i], e = 2 * s.err[i];
      Plot.el("line", { x1: x(u), x2: x(u), y1: y(Math.max(0, v - e)), y2: y(Math.min(0.6, v + e)), class: "stroke thin" }, gm);
      Plot.el("circle", { cx: x(u), cy: y(Math.min(0.6, v)), r: 3.5, class: "fill" }, gm);
    });
    const i0 = 0, ia = nc / 3 - 1;                                    // the first shell, and the last shell inside the source
    const W = [1, 7], somme = f => W.reduce((acc, w, i) => acc + w * f(i), 0);   // r < a/2: the two inner shells, by volume
    const ecart = somme(i => s.N[i]) / somme(i => s.theorie(s.r[i])) - 1, bruit = Math.sqrt(W.reduce((acc, w, i) => acc + (w * s.err[i]) ** 2, 0)) / somme(i => s.theorie(s.r[i]));
    $("aread").textContent = F.num(a, 2);
    $("vcentre").textContent = pct(ecart);
    $("fcentre").textContent = t("fig.f.centre", { e: pct(2 * bruit) });
    $("vrapport").textContent = F.num(s.N[i0] / s.N[ia], 3);
    $("frapport").textContent = t("fig.f.rapport", { d: F.num(s.theorie(s.r[i0]) / s.theorie(s.r[ia]), 3), i: F.num(ES.sourceSphere(1, 1, 1, s.r[i0] / a) / ES.sourceSphere(1, 1, 1, s.r[ia] / a), 3) });
    $("vchocs").textContent = F.num(s.chocs / NN, 3);
    $("fchocs").innerHTML = t("fig.f.chocs", { n: F.num((Rb / 1) ** 2 / 2, 2) });
  }
  asl.oninput = draw;
  $("relance").onclick = () => { graine++; draw(); };
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["chadwick", 1932, "experiment"], ["bothe", 1941, "experiment"], ["cp1", 1942, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["coeur"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dico", "a"], ["rapport", "c"], ["uniforme", "b"], ["exterieur", "d"], ["libre", "a"], ["absorption", "c"], ["bord", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 124 });
})();
</script>
