    <span class="sec" data-i18n="s1.sec"></span>

    <div class="eq"><math display="block"><msub><mi>v</mi><mi>P</mi></msub><mo>=</mo><msqrt><mfrac><mrow><mi>λ</mi><mo>+</mo><mn>2</mn><mi>μ</mi></mrow><mi>ρ</mi></mfrac></msqrt><mo>,</mo><mspace width="1em"></mspace><msub><mi>v</mi><mi>S</mi></msub><mo>=</mo><msqrt><mfrac><mi>μ</mi><mi>ρ</mi></mfrac></msqrt></math></div>

          <button type="button" data-m="acier" data-i18n="so.acier"></button>
          <button type="button" data-m="aluminium" data-i18n="so.aluminium"></button>
          <button type="button" data-m="beton" data-i18n="so.beton"></button>
        </div>
        <div class="ctl"><div class="row"><label for="nu" data-i18n="so.nu"></label><output id="nuv" for="nu"></output></div>
          <input id="nu" type="range" min="0" max="0.49" step="0.01" value="0.3"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="so.k.p"></span><span class="v" id="vsp"></span><span class="f" id="fsp"></span></div>
          <div class="stat"><span class="k" data-i18n="so.k.s"></span><span class="v" id="vss"></span><span class="f" id="fss"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="so.caption"></figcaption>
    </figure>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>ω</mi><mo>=</mo><mn>2</mn><msqrt><mfrac><mi>K</mi><mi>m</mi></mfrac></msqrt><mrow><mo>|</mo><mi data-i18n="eq.sin"></mi><mfrac><mrow><mi>k</mi><mi>a</mi></mrow><mn>2</mn></mfrac><mo>|</mo></mrow></math></div>
    <p class="validite" data-i18n-html="val.chaine"></p>
    <figure class="chart">
      <svg class="fig" id="ch" role="img" data-i18n-attr="aria-label:ch.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="ch.legend.w"></span><span class="c-label-2" data-i18n="ch.legend.c"></span><span class="c-warn" data-i18n="ch.legend.k"></span></div>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="kk" data-i18n="ch.k"></label><output id="kkv" for="kk"></output></div>
          <input id="kk" type="range" min="0.02" max="1" step="0.01" value="0.5"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="ch.k.l"></span><span class="v" id="vcl"></span><span class="f" id="fcl"></span></div>
          <div class="stat"><span class="k" data-i18n="ch.k.v"></span><span class="v" id="vcv"></span><span class="f" id="fcv"></span></div>

  <section class="card">

    <div class="eq"><math display="block"><mi>d</mi><mo>=</mo><mfrac><mrow><mi>Δ</mi><mi>t</mi></mrow><mrow><mn>1</mn><mo>/</mo><msub><mi>v</mi><mi>S</mi></msub><mo>−</mo><mn>1</mn><mo>/</mo><msub><mi>v</mi><mi>P</mi></msub></mrow></mfrac></math></div>

      <svg class="fig" id="sp" role="img" data-i18n-attr="aria-label:sp.aria"></svg>

      <div class="panel">
        <div class="ctl"><div class="row"><label for="dt" data-i18n="sp.dt"></label><output id="dtv" for="dt"></output></div>
          <input id="dt" type="range" min="1" max="90" step="0.5" value="20"></div>

    <p data-i18n-html="s3.p2"></p>

<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- §51-3 : deux vitesses, et leur rapport qui ne dépend que de ν ---------- */
(() => {
  const El = self.Elasticite, MAT = El.MATERIAUX, NS = Array.from({ length: 99 }, (_, i) => 0.49 * i / 98);
  let mat = "acier";
  function upd() {
    const m = MAT[mat], nu = +$("nu").value, V = El.vitessesIsotropes(m.E, nu, m.rho), svg = $("so"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 52, b: 44 }, x: { domain: [0, 0.5], label: t("so.xaxis") }, y: { domain: [1, 7.5], label: t("so.yaxis") } });
    Plot.el("path", { d: Plot.path(NS.map(n => [P.x(n), P.y(El.vitessesIsotropes(1, n, 1).rapport)])), class: "curve" }, P.g);
    for (const k of Object.keys(MAT)) Plot.el("circle", { cx: P.x(MAT[k].nu), cy: P.y(El.vitessesIsotropes(1, MAT[k].nu, 1).rapport), r: 5, class: "fill c-warn" }, P.g);
    Plot.el("line", { x1: P.x(nu), x2: P.x(nu), y1: P.y(1), y2: P.y(7.5), class: "ref" }, P.g);
    $("nuv").textContent = F.num(nu, 2);
    $("vsp").textContent = F.si(V.vP, "m·s⁻¹"); $("fsp").textContent = t("so.f.p", { r: F.num(V.rapport, 3) });
    $("vss").textContent = F.si(V.vS, "m·s⁻¹"); $("fss").textContent = t("so.f.s", { b: F.si(V.vBarre, "m·s⁻¹") });
    $("mat").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === mat)));
  }
  $("mat").querySelectorAll("button").forEach(x => x.onclick = () => { mat = x.dataset.m; $("nu").value = MAT[mat].nu; upd(); });
  $("nu").oninput = upd; upd();
})();

/* ---------- §51-3 : la file d'atomes, a = 0,25 nm, m = 56 u, c₀ = 5 000 m·s⁻¹ ---------- */
(() => {
  const O = self.Ondes, a = 2.5e-10, m = 56 * Constantes.u, c0 = 5000, Ch = O.chaine(m * (c0 / a) ** 2, m, a), KS = Array.from({ length: 201 }, (_, i) => 0.005 + 0.995 * i / 200);
  function upd() {
    const q = +$("kk").value, k = q * Ch.kmax, svg = $("ch"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 52, b: 44 }, x: { domain: [0, 1], label: t("ch.xaxis") }, y: { domain: [0, 1.6], label: t("ch.yaxis") } });
    Plot.el("path", { d: Plot.path([[P.x(0), P.y(0)], [P.x(1), P.y(Math.PI / 2)]]), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(KS.map(x => [P.x(x), P.y(Ch.omega(x * Ch.kmax) / Ch.wmax)])), class: "curve" }, P.g);
    Plot.el("circle", { cx: P.x(q), cy: P.y(Ch.omega(k) / Ch.wmax), r: 6, class: "fill c-warn" }, P.g);
    $("kkv").textContent = F.num(q, 2);
    $("vcl").textContent = F.si(2 * Math.PI / k, "m"); $("fcl").textContent = t("ch.f.l", { n: F.num(2 * Math.PI / k / a, 3), f: F.si(Ch.omega(k) / (2 * Math.PI), "Hz") });
    $("vcv").textContent = F.si(Ch.vg(k), "m·s⁻¹"); $("fcv").textContent = t("ch.f.v", { p: F.si(Ch.vp(k), "m·s⁻¹") });
  }
  $("kk").oninput = upd; upd();
})();

/* ---------- §51-3 : la distance d'un séisme par le retard de l'onde S ---------- */
(() => {
  const El = self.Elasticite, VP = 6000, VS = 3500, DMAX = 8e5;
  function upd() {
    const dt = +$("dt").value, d = El.distanceSeisme(dt, VP, VS), svg = $("sp"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 52, b: 44 }, x: { domain: [0, 800], label: t("sp.xaxis") }, y: { domain: [0, 240], label: t("sp.yaxis") } });
    Plot.el("path", { d: Plot.path([[P.x(0), P.y(0)], [P.x(800), P.y(DMAX / VP)]]), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path([[P.x(0), P.y(0)], [P.x(800), P.y(DMAX / VS)]]), class: "stroke c-warn" }, P.g);
    if (d <= DMAX) Plot.el("line", { x1: P.x(d / 1e3), x2: P.x(d / 1e3), y1: P.y(d / VP), y2: P.y(d / VS), class: "stroke bold c-label-2" }, P.g);
    $("dtv").textContent = F.si(dt, "s");
    $("vsd").textContent = F.si(d, "m"); $("fsd").textContent = t("sp.f.d", { p: F.si(d / VP, "s"), s: F.si(d / VS, "s") });
  }
  $("dt").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["poisson", 1830, "idea"], ["oldham", 1906, "experiment"], ["lehmann", 1936, "experiment"], ["chili", 1960, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["seismes", "ultrasons"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["liquide", "b"], ["ordre", "a"], ["rapport", "d"], ["court", "c"], ["vg", "a"], ["distance", "b"], ["noyau", "c"], ["modes", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 513 });
})();
</script>
