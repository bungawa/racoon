<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, A = 22.86e-3, B = 10.16e-3;

/* ---------- la rangée d'images : le champ d'une source entre deux murs ---------- */
(() => {
  const sl = $("sl"), sp = $("sp"), seg = $("vue"), NX = 96, NY = 72, X0 = -1.5 * A, X1 = 2.5 * A, Y1 = 3 * A, N = 20;
  let vue = "images", champ = null, cle = "";
  /* the complex field on the grid, kept while λ0 and the view do not change; the phase only turns it */
  function calculer(l0) {
    const S = M.sourceEntreParois({ a: A, lambda0: l0 }), k = S.k, out = [];
    for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
      const x = X0 + (X1 - X0) * (i + 0.5) / NX, z = Y1 * (j + 0.5) / NY;
      if (vue === "images") out.push(S.images(x, z, N));
      else { const h = M.hankel2(k * Math.hypot(x - A / 2, z)); out.push({ re: h.im / 4, im: -h.re / 4 }); }
    }
    let m = 0; out.forEach((g, n) => { if (Math.floor(n / NX) * Y1 / NY > 0.6 * A) m = Math.max(m, Math.hypot(g.re, g.im)); });
    return { g: out, max: m || 1 };
  }
  function draw() {
    const l0 = 2 * A * +sl.value, ph = +sp.value * Math.PI / 180;
    if (cle !== vue + l0) { champ = calculer(l0); cle = vue + l0; }
    const W = 640, H = Math.round(W * Y1 / (X1 - X0)), c = CarteChamp.carte($("carte"), { W, H, x0: X0, x1: X1, y0: 0, y1: Y1 });
    const val = (p, s) => { const i = Math.min(NX - 1, Math.floor((p[0] - X0) / (X1 - X0) * NX)), j = Math.min(NY - 1, Math.floor(p[1] / Y1 * NY));
      const g = champ.g[j * NX + i]; return Math.max(0, s * (g.re * Math.cos(ph) - g.im * Math.sin(ph))) / champ.max; };
    CarteChamp.fond(c, p => val(p, 1), NX, NY, { lo: 0, hi: 1, cls: "c-tint" });
    CarteChamp.fond(c, p => val(p, -1), NX, NY, { lo: 0, hi: 1, cls: "c-warn" });
    const mur = c.layer("c-label");
    for (const x of [0, A]) Plot.el("line", { x1: c.sx(x), x2: c.sx(x), y1: 0, y2: H, class: vue === "images" ? "stroke bold" : "stroke thin" }, mur);
    /* the source and, in the image view, its images: alternating signs, a apart */
    for (let n = -2; n <= 2; n++) if (vue === "images" || n === 0) CarteChamp.point(c, [A / 2 + n * A, 0.04 * A], 5, n % 2 ? "c-warn" : "c-tint");
    const dirs = M.anglesImages(l0, A);
    if (vue === "images") dirs.forEach(d => [1, -1].forEach(s => CarteChamp.fleche(c, [A / 2, 0.3 * A], [s * Math.sin(d.theta), Math.cos(d.theta)], 90, "c-label")));
    $("slr").textContent = t("fig.v.l", { r: F.num(+sl.value, 2), l0: F.qty(F.num(100 * l0, 3), "cm") });
    $("spr").textContent = t("fig.v.deg", { v: F.num(+sp.value, 3) });
    if (dirs.length) {
      $("vth").textContent = t("fig.v.deg", { v: F.num(dirs[0].theta * 180 / Math.PI, 3) });
      $("fth").textContent = t("fig.f.theta", { s: F.num(dirs[0].sinTheta, 3) });
      $("vlg").textContent = F.qty(F.num(100 * dirs[0].lambdaG, 3), "cm");
      $("flg").textContent = t("fig.f.lg");
    } else {
      $("vth").textContent = "–"; $("fth").textContent = t("fig.f.aucun");
      $("vlg").textContent = "–"; $("flg").textContent = t("fig.f.evanescent", { v: F.qty(F.num(M.guideRect(A, B, Constantes.c / l0).dBparMetre / 100, 3), "dB·cm⁻¹") });
    }
    $("vord").textContent = F.num(dirs.length, 2);
    $("ford").textContent = dirs.length > 1 ? t("fig.f.ordres", { m: dirs.map(d => d.m).join(", ") }) : t("fig.f.un");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === vue)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { vue = x.dataset.m; draw(); });
  sl.oninput = sp.oninput = draw; draw();
})();

/* ---------- le système décrit : le guide de 22,86 mm à 10 GHz, vu en ondes planes ---------- */
(() => {
  const f = 10e9, l0 = Constantes.c / f, d = M.anglesImages(l0, A)[0], kp = Math.PI / A;
  $("sys1").innerHTML = t("sys1.body", { f: F.si(f, "Hz", { prefix: "G" }), l0: F.qty(F.num(100 * l0, 3), "cm"), a2: F.qty(F.num(200 * A, 3), "cm"),
    th: t("fig.v.deg", { v: F.num(d.theta * 180 / Math.PI, 2) }), lg: F.qty(F.num(100 * d.lambdaG, 3), "cm"), e: F.num(Math.exp(kp * A), 2),
    l3: F.qty(F.num(100 * 2 * A / 3, 3), "cm") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["colladon", 1842, "experiment"], ["fabry", 1899, "experiment"], ["kao", 1966, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["fibre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["alterne", "a"], ["statique", "c"], ["angle", "b"], ["coupure", "d"], ["vitesse", "a"], ["ordre", "c"], ["miroirs", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 248 });
})();
</script>
