  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq"><math display="block"><munder><mo>∑</mo><mi>i</mi></munder><mo>⟨</mo><mn>0</mn><mi>S</mi><mo>|</mo><mi>i</mi><mo>⟩</mo><mo>⟨</mo><mi>i</mi><mo>|</mo><mo>+</mo><mi>S</mi><mo>⟩</mo><mo>=</mo><mn>0</mn></math><span class="n">(5.20)</span></div>
    <p class="validite" data-i18n-html="val.5.20"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><munder><mo>∑</mo><mi>i</mi></munder><mo>⟨</mo><mo>+</mo><mi>S</mi><mo>|</mo><mi>i</mi><mo>⟩</mo><mo>⟨</mo><mi>i</mi><mo>|</mo><mo>+</mo><mi>S</mi><mo>⟩</mo><mo>=</mo><mn>1</mn></math><span class="n">(5.21)</span></div>

  <section class="card">

    <p data-i18n-html="s2.p1"></p>
    <figure class="chart">
      <svg class="fig" id="fleches" viewBox="0 0 640 280" role="img" data-i18n-attr="aria-label:fig.aria.fleches"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.plus"></span><span class="c-label-2" data-i18n="fig.legend.zero"></span><span class="c-warn" data-i18n="fig.legend.moins"></span><span class="c-label" data-i18n="fig.legend.somme"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="ctl"><div class="row"><span data-i18n="fig.fin"></span></div>
            <div class="seg" role="group" id="fin" data-i18n-attr="aria-label:fig.fin">
              <button type="button" data-i="0" data-i18n="fig.b.plus"></button><button type="button" data-i="1" data-i18n="fig.b.zero"></button><button type="button" data-i="2" data-i18n="fig.b.moins"></button>
            </div></div>
          <div class="ctl"><div class="row"><span data-i18n="fig.voies"></span></div>
            <div class="seg" role="group" id="voies" data-i18n-attr="aria-label:fig.voies">
              <button type="button" data-i="0" data-i18n="fig.v.plus"></button><button type="button" data-i="1" data-i18n="fig.v.zero"></button><button type="button" data-i="2" data-i18n="fig.v.moins"></button>
            </div></div>
          <div class="ctl"><div class="row"><label for="sa" data-i18n="fig.alpha"></label><output id="sar" for="sa"></output></div>
            <input id="sa" type="range" min="0" max="180" step="1" value="50"></div>
          <div class="ctl"><div class="row"><label for="sb" data-i18n="fig.beta"></label><output id="sbr" for="sb"></output></div>
            <input id="sb" type="range" min="-180" max="180" step="1" value="40"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.somme"></span><span class="v" id="vsomme"></span><span class="f" id="fsomme"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.proba"></span><span class="v" id="vproba"></span><span class="f" id="fproba"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq"><math display="block"><mo>⟨</mo><mi>χ</mi><mo>|</mo><mi>φ</mi><mo>⟩</mo><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><mo>⟨</mo><mi>χ</mi><mo>|</mo><mi>i</mi><mo>⟩</mo><mo>⟨</mo><mi>i</mi><mo>|</mo><mi>φ</mi><mo>⟩</mo></math><span class="n">(5.24)</span></div>
    <p class="validite" data-i18n-html="val.5.24"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="eq"><math display="block"><mo>⟨</mo><mi>j</mi><mo>|</mo><mi>i</mi><mo>⟩</mo><mo>=</mo><msub><mi>δ</mi><mrow><mi>j</mi><mi>i</mi></mrow></msub></math><span class="n">(5.25)</span></div>
    <p class="validite" data-i18n-html="val.5.25"></p>
    <p data-i18n-html="s3.p3"></p>
    <div class="eq"><math display="block"><mo>⟨</mo><mi>φ</mi><mo>|</mo><mi>χ</mi><mo>⟩</mo><mo>=</mo><msup><mrow><mo>⟨</mo><mi>χ</mi><mo>|</mo><mi>φ</mi><mo>⟩</mo></mrow><mo>*</mo></msup></math><span class="n">(5.26)</span></div>
    <p class="validite" data-i18n-html="val.5.26"></p>
    <p data-i18n-html="s3.p4"></p>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys1"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/amplitudes-qui-interferent-spin1.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/quantique-deux-etats.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- the three products ⟨χ|iT⟩⟨iT|+S⟩ in the complex plane; T turned by α about y, then by β about z ---------- */
(() => {
  const sa = $("sa"), sb = $("sb"), ouv = [true, true, true]; let fin = 1;
  const p = Q.etatBase(3, 0), CLS = ["c-tint", "c-label-2", "c-warn"];
  function draw() {
    const a = +sa.value * Math.PI / 180, b = +sb.value * Math.PI / 180, R = Q.produitMatrices(Q.spin1Z(b), Q.spin1Y(a));
    const chi = Q.etatBase(3, fin), aT = Q.appliquer(R, p), cT = Q.appliquer(R, chi);
    const termes = [0, 1, 2].map(i => Cx.mul(Cx.conj(cT[i]), aT[i]));        // ⟨χ|iT⟩ = ⟨iT|χ⟩*, (5.26)
    const svg = $("fleches"); svg.innerHTML = "";
    const cx0 = 320, cy0 = 140, s = 110;
    Plot.el("line", { x1: cx0 - 300, x2: cx0 + 300, y1: cy0, y2: cy0, class: "stroke thin c-label-2" }, svg);
    Plot.el("line", { x1: cx0, x2: cx0, y1: cy0 - 130, y2: cy0 + 130, class: "stroke thin c-label-2" }, svg);
    Plot.el("circle", { cx: cx0 + s, cy: cy0, r: 4, class: "fill c-label" }, svg);
    let z = Cx.c(0, 0);
    termes.forEach((w, i) => {
      if (!ouv[i]) return;
      const n = Cx.add(z, w);
      Plot.fleche(svg, [cx0 + s * z.re, cy0 - s * z.im], [cx0 + s * n.re, cy0 - s * n.im], { cls: CLS[i], tete: 7, min: 2 });
      z = n;
    });
    Plot.fleche(svg, [cx0, cy0], [cx0 + s * z.re, cy0 - s * z.im], { cls: "c-label", tete: 10, min: 2, trait: "stroke bold" });
    $("fin").querySelectorAll("button").forEach(bt => bt.setAttribute("aria-pressed", String(+bt.dataset.i === fin)));
    $("voies").querySelectorAll("button").forEach(bt => bt.setAttribute("aria-pressed", String(ouv[+bt.dataset.i])));
    $("sar").textContent = F.num(+sa.value, 3) + "\u00a0°"; $("sbr").textContent = F.num(+sb.value, 3) + "\u00a0°";
    $("vsomme").textContent = Cx.text(z, x => F.num(Math.abs(x) < 5e-13 ? 0 : x, 3));
    $("fsomme").textContent = t("fig.f.somme");
    $("vproba").textContent = F.num(Cx.abs2(z), 3);
    $("fproba").textContent = t(ouv.every(Boolean) ? "fig.f.ouvert" : "fig.f.ferme");
  }
  $("fin").querySelectorAll("button").forEach(bt => bt.onclick = () => { fin = +bt.dataset.i; draw(); });
  $("voies").querySelectorAll("button").forEach(bt => bt.onclick = () => { ouv[+bt.dataset.i] = !ouv[+bt.dataset.i]; draw(); });
  sa.oninput = sb.oninput = draw; draw();
  const R = Q.spin1Y(Math.PI / 3), t3 = [0, 1, 2].map(i => R[i][1].re * R[i][0].re);
  $("sys1").innerHTML = t("sys1.body", { a: F.num(t3[0], 3), b: F.num(t3[1], 3), c: F.num(t3[2], 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["dirac", 1930, "idea"], ["cow", 1975, "experiment"], ["atomes", 1991, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["alpha"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["zero", "b"], ["un", "d"], ["loi", "a"], ["conj", "c"], ["fermer", "b"], ["temoin", "a"], ["ortho", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 505 });
})();
</script>
</body>
</html>
