<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, NU = 23.87e9, A = Q.aDepuisFrequence(NU), T = Q.periodeAmmoniac(A), PS = 1e-12;

/* ---------- step by step: (8.38) repeated, against the exact evolution, for two coupled states ---------- */
(() => {
  const svg = $("fig"), sn = $("sn"), se = $("se"), DUREE = 2 * T, N = 300;
  function draw() {
    const n = +sn.value, e0 = +se.value, H = [[e0 * A, -A], [-A, e0 * A]], pas = Math.round(n * DUREE / T), dt = DUREE / pas;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [0, DUREE / PS], label: t("fig.x"), fmt: v => F.num(v, 0) },
      y: { domain: [0, 1.6], label: t("fig.y"), fmt: v => F.num(v, 1) } });
    const ex = Array.from({ length: N + 1 }, (_, k) => { const s = DUREE * k / N; return [x(s / PS), y(Q.ammoniac(e0 * A, A, s).P2)]; });
    Plot.el("path", { d: Plot.path(ex), class: "stroke bold" }, Plot.el("g", { class: "c-tint" }, g));
    const ge = Plot.el("g", { class: "c-warn" }, g), pts = [];
    let v = [1, 0], ecart = 0;
    for (let k = 0; k <= pas; k++) {
      if (k) v = Q.evolutionEuler(H, v, dt, 1);
      const p2 = Q.cx(v[1]).re ** 2 + Q.cx(v[1]).im ** 2;
      ecart = Math.max(ecart, Math.abs(p2 - Q.ammoniac(e0 * A, A, k * dt).P2));
      pts.push([x(k * dt / PS), y(Math.min(1.6, p2))]);
      if (pas <= 80) Plot.el("circle", { cx: pts[k][0], cy: pts[k][1], r: 3, class: "fill" }, ge);
    }
    Plot.el("path", { d: Plot.path(pts), class: "stroke dash" }, ge);
    const a = A * dt / K.hbar, eps = (e0 + 1) * a, th = ((1 + ((e0 - 1) * a) ** 2) ** pas + (1 + eps * eps) ** pas) / 2;
    $("snr").textContent = F.num(n, 0);
    $("ser").textContent = F.num(e0, 1);
    $("vpas").textContent = F.si(dt, "s", { prefix: "p" });
    $("fpas").textContent = t("fig.f.pas", { eps: F.num(eps, 3) });
    $("vnorme").textContent = F.num(Q.norme2(v), 3);
    $("fnorme").textContent = t("fig.f.norme", { th: F.num(th, 3) });
    $("vecart").textContent = F.num(ecart, 3);
    $("fecart").textContent = t(ecart < 0.02 ? "fig.f.bon" : "fig.f.mauvais");
  }
  sn.oninput = se.oninput = draw; draw();
})();

/* ---------- the system described: the time scales of ammonia ---------- */
(() => {
  const tau = K.hbar / A, mc2 = 17 * K.u * K.c ** 2, tauM = K.hbar / mc2;
  $("sys").innerHTML = t("sys.body", { A: F.si(A / K.e, "eV", { prefix: "µ" }), tau: F.si(tau, "s", { prefix: "p" }), T: F.si(T, "s", { prefix: "p" }),
    mc2: F.si(mc2 / K.e, "eV", { prefix: "G" }), tauM: F.qty(F.sci(tauM, 1), "s"), r: F.sci(mc2 / A, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["heisenberg", 1925, "idea"], ["bornjordan", 1925, "idea"], ["dirac", 1925, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["qubits"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["attente", "b"], ["produit", "d"], ["delta", "a"], ["i", "c"], ["euler", "b"], ["base", "d"], ["phase", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 884 });
})();
</script>
