        <div class="ctl"><div class="row"><label for="m2" data-i18n-html="mel.m2"></label><output id="m2v" for="m2"></output></div>

        <div class="ctl"><div class="row"><label for="w1" data-i18n-html="mel.w1"></label><output id="w1v" for="w1"></output></div>

          <div class="stat"><span class="k" data-i18n="mel.k.d"></span><span class="v" id="vd"></span><span class="f" data-i18n="mel.f.d"></span></div>
          <div class="stat"><span class="k" data-i18n-html="mel.k.xn"></span><span class="v" id="vxn"></span><span class="f" id="fxn"></span></div>

  <section class="card">

    <div class="eq"><math display="block"><mi>L</mi><mo>=</mo><mi>N</mi><mi>b</mi><mspace width="2em"></mspace><msqrt><mrow><mo>⟨</mo><msup><mi>R</mi><mn>2</mn></msup><mo>⟩</mo></mrow></msqrt><mo>=</mo><mi>b</mi><msqrt><mi>N</mi></msqrt></math></div>

    <figure>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = ChimOrga.Polymeres;
const masse = M => M < 1 ? F.qty(F.num(M * 1000, 3), "g·mol⁻¹") : F.qty(F.num(M, 3), "kg·mol⁻¹");
const MONOS = ["ethene", "propene", "chlorureVinyle", "styrene", "mam", "acrylonitrile"];

/* ---------- monomers and repeat units ---------- */
(() => {
  const txt = textOf("motifs", MONOS);
  $("motifs").innerHTML = MONOS.map(id => { const m = P.motif(id);
    return `<div><span class="k">${t("mono." + id)}</span><span>${t("motif.ligne", { a: txt[id].alcene, m: txt[id].motif })}</span><span class="v">${masse(m.M0)}</span></div>`; }).join("");
})();

/* ---------- a sample made of two fractions ---------- */
(() => {
  const svg = $("distrib"), sel = $("mono"), s1 = $("m1"), s2 = $("m2"), sw = $("w1");
  sel.value = "styrene";
  function draw() {
    const M1 = Math.pow(10, +s1.value), M2 = Math.pow(10, +s2.value), w = +sw.value;   // kg·mol⁻¹, mass fraction of fraction 1
    const pop = P.depuisMasses([{ m: w, M: M1 }, { m: 1 - w, M: M2 }]).filter(p => p.n > 0), m = P.moyennes(pop), M0 = P.motif(sel.value).M0;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { b: 44, l: 56 },
      x: { scale: "log", domain: [0.5, 2000], label: t("mel.x") }, y: { domain: [0, 1.1], label: t("mel.y") } });
    /* each fraction: a narrow peak of its mass fraction, drawn as a bar */
    [[M1, w], [M2, 1 - w]].forEach(([M, f]) => { if (f > 0) Plot.el("line", { x1: o.x(M), x2: o.x(M), y1: o.y(0), y2: o.y(f), class: "stroke bold c-tint" }, o.g); });
    [[m.Mn, "mel.n"], [m.Mw, "mel.w"]].forEach(([v, k]) => {
      Plot.el("line", { x1: o.x(v), x2: o.x(v), y1: o.y(0), y2: o.y(1.1), class: "stroke thin dash c-label-2" }, o.g);
      const n = k === "mel.n";
      Plot.el("text", { x: o.x(v) + (n ? -4 : 4), y: o.y(1.04), "text-anchor": n ? "end" : "start", class: "note" }, o.g).textContent = t(k);
    });
    $("m1v").textContent = masse(M1); $("m2v").textContent = masse(M2);
    $("w1v").textContent = F.qty(F.num(100 * w, 3), "%");
    $("vmn").textContent = masse(m.Mn); $("vmw").textContent = masse(m.Mw);
    $("vd").textContent = F.num(m.D, 3);
    $("vxn").textContent = F.num(m.Mn / M0, 3);
    $("fxn").textContent = t("mel.f.xn", { m: t("mono." + sel.value) });
  }
  [s1, s2, sw].forEach(s => s.oninput = draw); sel.onchange = draw; draw();
})();

/* ---------- a freely jointed chain ---------- */
(() => {
  const svg = $("pelote"), sl = $("nseg"), rand = Quiz.rng(1934), b = 0.154e-9;
  let pts;
  function draw() {
    const N = pts.length - 1, c = P.pelote(N, b), [xe, ye] = pts[N];
    const ext = Math.max(...pts.map(([x, y]) => Math.max(Math.abs(x), Math.abs(y)))), k = 55 / Math.max(ext, 1);
    svg.innerHTML = "";
    Plot.el("path", { d: Plot.path(pts.map(([x, y]) => [k * x, -k * y])), class: "stroke c-tint" }, svg);
    Plot.el("line", { x1: 0, y1: 0, x2: k * xe, y2: -k * ye, class: "stroke thin dash c-label-2" }, svg);
    [[0, 0], [xe, ye]].forEach(([x, y]) => Plot.el("circle", { cx: k * x, cy: -k * y, r: 2, class: "fill c-label" }, svg));
    $("nsegv").textContent = F.num(N, 4);
    $("vl").textContent = F.si(c.L, "m"); $("vr").textContent = F.si(c.R, "m");
    $("vt").textContent = F.si(b * Math.hypot(xe, ye), "m");
  }
  const tirer = () => { pts = P.marche(Math.round(Math.pow(10, +sl.value)), rand); draw(); };
  sl.oninput = tirer; $("tirer").onclick = tirer; tirer();
})();

/* ---------- architectures ---------- */
(() => {
  const IDS = ["lineaire", "ramifie", "reticule", "copolymere"], txt = textOf("archis", IDS);
  $("archis").innerHTML = IDS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["staudinger", 1920, "idea"], ["carothers", 1929, "experiment"], ["kuhn", 1934, "idea"], ["nobel", 1953, "idea"], ["dispersite", 2009, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["sec", "viscosite", "osmometrie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["motif", "b"], ["degre", "d"], ["mn", "a"], ["mw", "c"], ["dispersite", "b"], ["pelote", "a"], ["reticule", "d"], ["osmometrie", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1920 });
})();
</script>
