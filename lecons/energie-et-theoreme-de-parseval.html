<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };

/* ---------- la part de ⟨f²⟩ de chaque harmonique ; l'écart efficace et le dépassement de Gibbs en fonction de N ---------- */
(() => {
  const O = self.Ondes, NB = 20, NMAX = 40, U = 10, R = 8;          // la tension d'essai : crête 10 V, dans 8 Ω
  let nom = "creneau", cache = null;
  function courbes(Fo, cle) {                                       // ne dépend que de la forme : calculée une fois par forme
    if (cache && cache.cle === cle) return cache;
    const ns = Array.from({ length: NMAX }, (_, i) => i + 1);
    cache = { cle, eff: ns.map(N => O.energieHarmoniques(Fo, N).ecartEfficace), gibbs: ns.map(N => Math.max(0, O.ecartForme(Fo, N, 1500).depassement)) };
    return cache;
  }
  function upd() {
    const N = +$("nn").value, q = +$("qq").value, Fo = O.signal(nom, q), E = O.energieHarmoniques(Fo, Math.max(N, NB));
    const svg = $("pa"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 190, pad: { l: 52, b: 44 }, x: { domain: [0.4, NB + 0.6], label: t("pa.xaxis"), ticks: 10 }, y: { domain: [0, 100], label: t("pa.yaxis") } });
    for (let n = 1; n <= NB; n++) { const v = 100 * E.parts[n - 1], w = (P.x(1) - P.x(0)) * 0.6;
      Plot.el("rect", { x: P.x(n) - w / 2, y: P.y(v), width: w, height: Math.max(0, P.y(0) - P.y(v)), class: "fill " + (n <= N ? "c-tint" : "c-label-2") }, P.g); }
    const C = courbes(Fo, nom + (nom === "impulsions" ? q : "")), cv = $("cv"); cv.innerHTML = "";
    const ym = Math.max(...C.eff, ...C.gibbs) * 1.1;
    const Q = Plot.axes(cv, { fmt: F, w: 640, h: 190, pad: { l: 52, b: 44 }, x: { domain: [1, NMAX], label: t("cv.xaxis") }, y: { domain: [0, ym], label: t("cv.yaxis") } });
    Plot.el("path", { d: Plot.path(C.eff.map((v, i) => [Q.x(i + 1), Q.y(v)])), class: "stroke c-tint" }, Q.g);
    if (Fo.saut) Plot.el("path", { d: Plot.path(C.gibbs.map((v, i) => [Q.x(i + 1), Q.y(v)])), class: "stroke c-warn" }, Q.g);
    Plot.el("circle", { cx: Q.x(N), cy: Q.y(C.eff[N - 1]), r: 4, class: "fill c-tint" }, Q.g);
    const part = N <= E.parts.length ? E.parts.slice(0, N).reduce((s, x) => s + x, 0) : E.cumul, Pw = U * U * E.total / R;
    $("nnv").textContent = String(N); $("qqv").textContent = F.num(q, 2);
    $("fo").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.f === nom)));
    $("vp").textContent = F.qty(F.num(100 * part, 3), "%"); $("fp").textContent = t("pa.f.part", { n: N });
    $("ve").textContent = F.num(C.eff[N - 1], 3); $("fe").textContent = t("pa.f.ecart");
    $("vw").textContent = F.si(Pw, "W"); $("fw").textContent = t("pa.f.puissance", { p1: F.si(Pw * E.parts[0], "W") });
  }
  $("fo").querySelectorAll("button").forEach(x => x.onclick = () => { nom = x.dataset.f; upd(); });
  ["nn", "qq"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["euler", 1735, "idea"], ["parseval", 1799, "idea"], ["bessel", 1828, "idea"], ["plancherel", 1910, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["efficace", "jpeg"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["phases", "b"], ["croises", "d"], ["fondamental", "a"], ["efficace", "c"], ["ecart", "b"], ["meilleure", "d"], ["triangle", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 505 });
})();
</script>
