<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const PL = Champs.PLAQUE, CM = 1e-2, deg = Math.PI / 180, A = 0.3, DS = 1e-3;   // asymmetry of the heating; step of 1 mm

/* ---------- le système décrit, chiffré ---------- */
(() => {
  const T = p => Champs.temperature(p, A), p = [0.03, 0.06], g = AnaVec.gradient(T, p);
  const ell = Math.abs(T(p) - PL.T0) / AnaVec.norme(g);   // distance over which T changes by its own size
  $("sys").innerHTML = t("sys.body", { L: F.num(PL.L / CM, 2), ell: F.num(ell / CM, 2), r: F.num(DS / ell, 1) });
})();

/* ---------- la plaque : le gradient au point survolé, les axes tournés, un petit pas ---------- */
(() => {
  const svg = $("plaque"), O = { W: 440, H: 440, x0: 0, x1: PL.L, y0: 0, y1: PL.L }, phs = $("phisl"), als = $("alsl"), P = Plot.el;
  const T = p => Champs.temperature(p, A);
  let hover = [0.03, 0.06], c;
  function draw() {
    const phi = +phs.value * deg, al = +als.value * deg, g = AnaVec.gradient(T, hover), gn = AnaVec.norme(g);
    c = CarteChamp.carte(svg, O);
    CarteChamp.fond(c, T, 44, 44, { cls: "c-warn", lo: PL.T0, hi: PL.T0 + PL.dT });
    CarteChamp.niveaux(c, T, [T(hover), 300, 310, 320, 330, 340], { epais: 0, n: [81, 81] });
    /* turned axes x′, y′ at the point */
    const ax = c.layer("c-label-2");
    [[[Math.cos(phi), Math.sin(phi)], "plaque.xp"], [[-Math.sin(phi), Math.cos(phi)], "plaque.yp"]].forEach(([u, k]) => {
      CarteChamp.fleche(c, hover, u, 60, "", ax);
      const e = P("text", { x: (c.sx(hover[0]) + 72 * u[0]).toFixed(1), y: (c.sy(hover[1]) - 72 * u[1] + 4).toFixed(1), "text-anchor": "middle" }, ax); e.textContent = t(k);
    });
    /* the gradient, scaled: 100 px for 1 000 K·m⁻¹ */
    CarteChamp.fleche(c, hover, g, Math.min(150, 0.1 * gn), "c-ok");
    /* the step ΔR, drawn 30 times longer than 1 mm × scale */
    CarteChamp.fleche(c, hover, [Math.cos(al), Math.sin(al)], 40, "c-tint");
    CarteChamp.point(c, hover, 3, "c-ok");
    const gp = Champs.tourne(g, phi), dR = [DS * Math.cos(al), DS * Math.sin(al)];
    const exact = T([hover[0] + dR[0], hover[1] + dR[1]]) - T(hover), lin = AnaVec.scalaire(g, dR);
    $("phiread").textContent = F.qty(phs.value, "°");
    $("alread").textContent = F.qty(als.value, "°");
    $("vcomp").textContent = "(" + F.num(gp[0], 3) + " ; " + F.num(gp[1], 3) + ")";
    $("vnorme").textContent = F.qty(F.num(gn, 3), "K·m⁻¹");
    $("vdt").textContent = F.qty(F.fix(exact, 3), "K");
    $("vdot").textContent = F.qty(F.fix(lin, 3), "K");
    $("fdot").textContent = t("plaque.f.dot", { e: F.num(Math.abs(exact - lin), 1) });
  }
  CarteChamp.survol(svg, () => c, p => { hover = [Math.min(0.98 * PL.L, Math.max(0.02 * PL.L, p[0])), Math.min(0.98 * PL.L, Math.max(0.02 * PL.L, p[1]))]; draw(); });
  phs.oninput = draw; als.oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["cauchy", 1847, "idea"], ["maxwell", 1873, "idea"], ["weber", 1900, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["geothermie", "apprentissage"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["vecteur", "a"], ["direction", "c"], ["perpendiculaire", "b"], ["pas", "d"], ["axes", "a"], ["geotherme", "c"], ["descente", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 223 });
})();
</script>
