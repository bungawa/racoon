<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagramme d'orbitales moléculaires</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-architecture" data-i18n="monde.chim-architecture"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-orbitales-moleculaires" data-i18n="etape.chim-orbitales-moleculaires"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/interaction-deux-orbitales" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="list keyed" id="regles"></div>
    <div class="eq"><math display="block"><mi>i</mi><mo>=</mo><mfrac><mrow><msub><mi>n</mi><mi data-i18n="eq.l"></mi></msub><mo>−</mo><msub><mi>n</mi><mi data-i18n="eq.a"></mi></msub></mrow><mn>2</mn></mfrac></math></div>
    <p class="validite" data-i18n-html="val.indice"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <figure class="chart">
      <svg class="fig" id="dia" viewBox="0 0 640 380" role="img" data-i18n-attr="aria-label:dia.aria"></svg>
      <div class="legend"><span class="c-label" data-i18n="dia.legend.niv"></span><span class="c-warn" data-i18n="dia.legend.el"></span></div>
      <div class="panel">
        <div class="seg" role="group" id="mol">
          <button type="button" data-m="Li" data-i18n="dia.m.Li"></button>
          <button type="button" data-m="Be" data-i18n="dia.m.Be"></button>
          <button type="button" data-m="B" data-i18n="dia.m.B"></button>
          <button type="button" data-m="C" data-i18n="dia.m.C"></button>
          <button type="button" data-m="N" data-i18n="dia.m.N"></button>
          <button type="button" data-m="O" data-i18n="dia.m.O"></button>
          <button type="button" data-m="F" data-i18n="dia.m.F"></button>
          <button type="button" data-m="Ne" data-i18n="dia.m.Ne"></button>
        </div>
        <div class="seg" role="group" id="charge">
          <button type="button" data-q="-2" data-i18n="dia.q.m2"></button>
          <button type="button" data-q="-1" data-i18n="dia.q.m1"></button>
          <button type="button" data-q="0" data-i18n="dia.q.0"></button>
          <button type="button" data-q="1" data-i18n="dia.q.p1"></button>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="dia.k.indice"></span><span class="v" id="vi"></span><span class="f" id="fi"></span></div>
          <div class="stat"><span class="k" data-i18n="dia.k.spin"></span><span class="v" id="vm"></span><span class="f" id="fm"></span></div>
          <div class="stat"><span class="k" data-i18n="dia.k.front"></span><span class="v" id="vf"></span></div>
          <div class="stat"><span class="k" data-i18n="dia.k.r"></span><span class="v" id="vr"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="dia.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p data-i18n-html="sys.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <p id="hf"></p>
    <p data-i18n-html="s4.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/diagramme-orbitales-moleculaires.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/quantique-amplitudes.js"></script>
<script src="/racoon/quantique-schrodinger.js"></script>
<script src="/racoon/lecons/tableau-periodique-quantique.js"></script>
<script src="/racoon/lecons/incertitude-absolue-relative.js"></script>
<script src="/racoon/lecons/probabilites.js"></script>
<script src="/racoon/chim-architecture.js"></script>
<script src="/racoon/lecons/diagramme-orbitales-moleculaires.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), CA = ChimArchi;

/* ---------- règles de construction ---------- */
(() => {
  const ROWS = ["nombre", "symetrie", "axial", "remplir"], txt = textOf("regles.rows", ROWS);
  $("regles").innerHTML = ROWS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text}</span></div>`).join("");
})();

/* ---------- diagramme des molécules A₂ ---------- */
(() => {
  /* equilibrium bond lengths of the ground states, NIST Chemistry WebBook (Huber and Herzberg): N₂ 1,097 685 Å, O₂ 1,207 52 Å,
     F₂ 1,411 93 Å */
  const RE = { N: 109.7685e-12, O: 120.752e-12, F: 141.193e-12 };
  const IDS = ["1sg", "1su", "2sg", "1pu", "1pg", "2su"], noms = textOf("dia.noms", IDS);
  const svg = $("dia"), segM = $("mol"), segQ = $("charge");
  let sym = "O", q = 0;
  function draw() {
    let d;
    try { d = CA.diatomique(sym, q); } catch (e) { q = 0; d = CA.diatomique(sym, 0); }
    svg.innerHTML = "";
    DiagOrb.rendre(DiagOrb.niveauxA2(d, { noms, ao: [t("dia.ao.2s"), t("dia.ao.2p")] }), Plot.el, svg);
    segM.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === sym)));
    segQ.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.q === q)));
    $("vi").textContent = F.num(d.ordre, 2);
    $("fi").textContent = t("dia.f.indice", { l: d.nl, a: d.na });
    $("vm").textContent = t("dia.v.spin", { n: d.celibataires });
    $("fm").textContent = t(d.celibataires ? "dia.para" : "dia.dia");
    $("vf").textContent = t("dia.v.front", { ho: d.HO ? noms[d.HO] : t("dia.aucune"), bv: d.BV ? noms[d.BV] : t("dia.aucune") });
    $("vr").textContent = q === 0 && RE[sym] ? F.si(RE[sym], "m", { prefix: "p", sig: 4 }) : t("dia.r.sans");
  }
  segM.querySelectorAll("button").forEach(x => x.onclick = () => { sym = x.dataset.m; draw(); });
  segQ.querySelectorAll("button").forEach(x => x.onclick = () => { q = +x.dataset.q; draw(); });
  draw();
})();

/* ---------- H–F : deux orbitales d'énergies différentes ---------- */
(() => {
  const aH = CA.ORBITALES_EV.H["1s"], aF = CA.ORBITALES_EV.F["2p"], S = 0.25, r = CA.interactionDeux(aH, aF, CA.wolfsbergHelmholz(aH, aF, S), S);
  const pF = r.liante.c[1] ** 2 + S * r.liante.c[0] * r.liante.c[1];                  // Mulliken share of F in the bonding orbital
  $("hf").innerHTML = t("hf.body", { h: F.si(aH, "eV"), f: F.si(aF, "eV"), s: F.fix(S, 2), ch: F.fix(r.liante.c[0], 2), cf: F.fix(r.liante.c[1], 2),
    p: F.num(100 * pF, 2), e: F.si(r.liante.E, "eV", { sig: 3 }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1847, "experiment"], ["lennardjones", 1929, "idea"], ["mulliken", 1966, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pes", "aimant"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["o2", "b"], ["indice", "c"], ["longueur", "a"], ["melange", "d"], ["ions", "b"], ["hf", "c"], ["sigmapi", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 2103 });
})();
</script>
</body>
</html>
