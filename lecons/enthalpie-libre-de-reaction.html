<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), P = Plot.el, C = ChimSolutions, R = Constantes.R;
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const kJ = v => F.qty(F.num(v / 1e3, 4), "kJ·mol⁻¹"), JK = v => F.qty(F.num(v, 4), "J·K⁻¹·mol⁻¹");
const K0 = k => k > 1e4 || k < 1e-3 ? F.sci(k, 3) : F.num(k, 3);

/* ---------- G(ξ) de N2O4 = 2 NO2 ---------- */
(() => {
  const DIM = { N2O4: -1, NO2: 2 }, svg = $("gx"), sT = $("gxT"), sp = $("gxp"), sx = $("gxx");
  function upd() {
    const T = +sT.value, p = Math.pow(10, +sp.value), xi = +sx.value;
    const m = C.melangeGaz(DIM, { N2O4: 1 }, T, p), g0 = m.G(0), e = m.equilibre;
    const sans = z => m.G(z) - R * T * Object.entries(m.n(z)).reduce((s, [id, n]) => s + (n > 0 ? n * Math.log(m.x(z)[id]) : 0), 0);
    const N = 200, G = [], S = [];
    for (let i = 0; i <= N; i++) { const z = i / N; G.push((m.G(z) - g0) / 1e3); S.push((sans(z) - g0) / 1e3); }
    const lo = Math.floor(Math.min(...G, ...S)) - 0.5, hi = Math.ceil(Math.max(...G, ...S)) + 0.5;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44, l: 56 },
      x: { domain: [0, 1], label: t("gx.x") }, y: { domain: [lo, hi], label: t("gx.y") } });
    P("path", { d: Plot.path(S.map((v, i) => [x(i / N), y(v)])), class: "ref" }, g);
    P("path", { d: Plot.path(G.map((v, i) => [x(i / N), y(v)])), class: "curve" }, g);
    const gy = (m.G(xi) - g0) / 1e3, slope = m.drG(xi) / 1e3, dx = 0.12;   // the tangent: ΔrG is the slope
    P("line", { x1: x(Math.max(0, xi - dx)), x2: x(Math.min(1, xi + dx)), y1: y(gy - slope * (xi - Math.max(0, xi - dx))), y2: y(gy + slope * (Math.min(1, xi + dx) - xi)), class: "zero" }, g);
    P("circle", { cx: x(e.xi), cy: y((m.G(e.xi) - g0) / 1e3), r: 5, class: "dot" }, g);
    P("circle", { cx: x(xi), cy: y(gy), r: 6, class: "dot" }, g);
    $("gxTv").innerHTML = F.kelvin(T); $("gxpv").textContent = F.si(p, "Pa"); $("gxxv").textContent = F.qty(F.fix(xi, 2), "mol");
    const d = m.drG(xi);
    $("gxg").textContent = kJ(d); $("gxgf").textContent = t(Math.abs(d) < 20 ? "gx.f.eq" : d < 0 ? "gx.f.avant" : "gx.f.arriere", { q: K0(Math.exp(m.lnQ(xi))) });
    $("gxe").textContent = F.qty(F.fix(e.xi, 3), "mol"); $("gxef").textContent = t("gx.f.x", { x: F.num(100 * e.x.NO2, 3) });
    $("gxk").textContent = K0(Math.exp(m.lnK)); $("gxkf").textContent = t("gx.f.K", { g: kJ(-R * T * m.lnK) });
  }
  sT.oninput = sp.oninput = sx.oninput = upd; upd();
})();

/* ---------- quelques réactions ---------- */
(() => {
  const RX = { haber: { N2: -1, H2: -3, NH3: 2 }, dim: { N2O4: -1, NO2: 2 }, vap: { "H2O(l)": -1, "H2O(g)": 1 }, eau: { H2: -1, O2: -0.5, "H2O(l)": 1 } };
  const IDS = Object.keys(RX), txt = textOf("rx.items", IDS);
  $("reactions").innerHTML = IDS.map(id => { const nu = RX[id];
    return `<div><span class="k">${txt[id].eq}</span><span>${t("rx.ligne", { h: kJ(C.drH(nu)), s: JK(C.drS(nu)), g: kJ(C.drG(nu)) })} ${txt[id].text}</span><span class="v">${t("rx.K", { k: K0(Math.exp(C.lnK(nu))) })}</span></div>`; }).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["guldberg", 1864, "idea"], ["vanthoff", 1884, "idea"], ["nernst", 1906, "idea"], ["janaf", 1998, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["voie", "minimum"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["pente", "b"], ["positif", "d"], ["K", "a"], ["minimum", "c"], ["ordre", "b"], ["solide", "a"], ["ellingham", "c"], ["ecrire", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
