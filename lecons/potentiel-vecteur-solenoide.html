<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, MU0 = Constantes.mu0;

/* ---------- coupe du solénoïde : A le long d'un cercle, sa circulation, B ---------- */
(() => {
  const svg = $("coupe"), sn = $("sn"), si = $("si"), sa = $("sa"), sr = $("sr");
  const O = [320, 200], S = 2000;                                       // px, px per m (view ±16 cm × ±10 cm)
  const px = p => [O[0] + S * p[0], O[1] - S * p[1]];
  function draw() {
    const n = +sn.value, Ic = +si.value, a = +sa.value / 1000, r = +sr.value / 1000, A = M.solenoideChampA(n, Ic, a);
    svg.innerHTML = "";
    const gs = Plot.el("g", { class: "c-tint" }, svg);
    Plot.el("circle", { cx: O[0], cy: O[1], r: S * a, class: "stroke bold" }, gs);
    for (let k = 0; k < 8; k++) {                                       // the winding, counterclockwise: small arrows on the sheet
      const th = 2 * Math.PI * k / 8, p = [a * Math.cos(th), a * Math.sin(th)], u = [-Math.sin(th), Math.cos(th)], A0 = px(p);
      Plot.fleche(gs, A0, [A0[0] + 14 * u[0], A0[1] - 14 * u[1]], { cls: "c-tint" });
    }
    const gw = Plot.el("g", { class: "c-warn" }, svg);
    Plot.el("circle", { cx: O[0], cy: O[1], r: S * r, class: "stroke thin dash" }, gw);
    const Aa = M.solenoideA(n, Ic, a, a), L = 50;                       // arrow length 50 px for A(a), the largest value
    for (let k = 0; k < 12; k++) {
      const th = 2 * Math.PI * k / 12, p = [r * Math.cos(th), r * Math.sin(th)], v = A(p), A0 = px(p), l = L / Aa;
      Plot.fleche(gw, A0, [A0[0] + l * v[0], A0[1] - l * v[1]], { cls: "c-warn" });
    }
    const circ = AnaVec.circulation(A, AnaVec.cercle([0, 0], r), 2000), rr = Math.min(r, a);
    const B = AnaVec.rotationnel(A, [r * 0.6, r * 0.8], 1e-6 * r)[2];
    $("snr").textContent = t("fig.nval", { n: F.num(n, 4) }); $("sir").textContent = F.si(Ic, "A");
    $("sar").textContent = F.si(a, "m", { prefix: "m" }); $("srr").textContent = F.si(r, "m", { prefix: "m" });
    $("va").textContent = F.si(M.solenoideA(n, Ic, a, r), "T·m");
    $("fa").textContent = t(r > a ? "fig.f.dehors" : "fig.f.dedans");
    $("vc").textContent = F.si(circ, "Wb");
    $("fc").textContent = t("fig.f.flux", { v: F.si(MU0 * n * Ic * Math.PI * rr * rr, "Wb") });
    $("vb").textContent = Math.abs(B) < 1e-6 * MU0 * n * Ic ? t("fig.v.zero") : F.si(B, "T");
    $("fb").textContent = t("fig.f.b0", { v: F.si(MU0 * n * Ic, "T") });
  }
  sn.oninput = si.oninput = sa.oninput = sr.oninput = draw; draw();
})();

/* ---------- le système décrit : un cylindre chargé qui tourne ---------- */
(() => {
  const Emax = 3e6, sigma = Constantes.eps0 * Emax, a = 0.1, w = 2 * Math.PI * 50, c = M.cylindreTournant(sigma, a, w);
  const BT = 3e-5, UT = w * BT * a * a / 2;                            // order of the Earth's field along the axis, T
  $("sys1").innerHTML = t("sys1.body", { E: F.si(Emax, "V·m⁻¹"), sigma: F.si(sigma, "C·m⁻²", { prefix: "µ" }), a: F.si(a, "m"),
    w: F.si(w, "rad·s⁻¹"), v: F.si(c.v, "m·s⁻¹"), vc: F.sci(c.v / Constantes.c, 1), J: F.si(c.J, "A·m⁻¹", { prefix: "m" }), B: F.si(c.B, "T"), U: F.si(c.U, "V"),
    BT: F.si(BT, "T"), UT: F.si(UT, "V"), rap: F.sci(UT / c.U, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["ab", 1959, "idea"], ["chambers", 1960, "experiment"], ["tonomura", 1986, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dehors", "b"], ["circulation", "d"], ["dedans", "a"], ["rotationnel", "c"], ["sens", "b"], ["omega", "d"], ["analogie", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 144 });
})();
</script>
