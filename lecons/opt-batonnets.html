<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), O = OptiqueGeometrique, P = Plot.el;

/* ---------- la fréquence de voir : Poisson, seuil de k photons absorbés ---------- */
(() => {
  const svg = $("voir"), W = 640, H = 320, sk = $("kk"), sq = $("qq");
  const Ns = Array.from({ length: 241 }, (_, i) => Math.pow(10, 0.5 + i * 0.0125));      // 3 à 3 000 photons à la cornée
  function draw() {
    const k = +sk.value, q = +sq.value;
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: W, h: H, x: { scale: "log", domain: [Ns[0], Ns[Ns.length - 1]], label: t("fv.ax.x"), fmt: v => F.num(v, 3) },
      y: { domain: [0, 1], label: t("fv.ax.y") } });
    /* la plage de Hecht, Shlaer et Pirenne au seuil */
    P("rect", { x: ax.x(O.HSP.cornee[0]), y: ax.y(1), width: ax.x(O.HSP.cornee[1]) - ax.x(O.HSP.cornee[0]), height: ax.y(0) - ax.y(1), class: "area" }, svg);
    [1, 2, 12].filter(j => j !== k).forEach(j =>
      P("path", { d: Plot.path(Ns.map(N => [ax.x(N), ax.y(O.frequenceVoir(N, { q, k: j }))])), class: "stroke thin c-label-2" }, svg));
    P("path", { d: Plot.path(Ns.map(N => [ax.x(N), ax.y(O.frequenceVoir(N, { q, k }))])), class: "stroke bold c-tint" }, svg);
    [1, 2, 12].filter(j => j !== k).forEach(j => {
      const N = O.seuilPhotons(0.5, { q, k: j });
      if (N > Ns[0] && N < Ns[Ns.length - 1]) P("text", { x: ax.x(N) + 4, y: ax.y(0.5) - 4, class: "tick" }, svg).textContent = t("fv.lbl").replace("{k}", j);
    });
    const N60 = O.seuilPhotons(0.6, { q, k });
    P("circle", { cx: ax.x(N60), cy: ax.y(0.6), r: 5, class: "fill c-tint" }, svg);
    $("kkr").textContent = F.num(k, 2); $("qqr").textContent = F.qty(F.num(100 * q, 2), "%");
    $("vs").textContent = t("fv.v.seuil").replace("{n}", F.num(N60, 2));
    $("fs").textContent = t("fv.f.seuil").replace("{a}", F.num(q * N60, 2));
    const r = O.seuilPhotons(0.9, { q, k }) / O.seuilPhotons(0.1, { q, k });
    $("vp").textContent = F.num(r, 2);
    $("fp").textContent = t("fv.f.pente");
    const nAbs = Math.max(1, Math.round(q * N60)), p2 = O.memeBatonnet(nAbs, O.HSP.batonnets);
    $("vd").textContent = F.qty(F.num(100 * p2, 2), "%");
    $("fd").textContent = t("fv.f.double").replace("{n}", nAbs).replace("{b}", O.HSP.batonnets);
  }
  sk.oninput = sq.oninput = draw;
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wald", 1933, "experiment"], ["hsp", 1942, "experiment"], ["nobel", 1967, "idea"], ["baylor", 1979, "experiment"], ["tinsley", 2016, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["rouge", "carence"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["disques", "a"], ["vitamine", "c"], ["perte", "b"], ["poisson", "d"], ["pente", "a"], ["unSeul", "c"], ["bruit", "b"], ["tinsley", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 363 });
})();
</script>
