<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, c = Constantes.c;

/* ---------- ρ' and j'x against the speed u of the observer, for a neutral wire or a beam of electrons ---------- */
(() => {
  let cas = "fil";
  const btns = [...$("cas").querySelectorAll("button")];
  btns.forEach(b => b.onclick = () => { cas = b.dataset.cas; draw(); });
  /* unit densities: ions ρ0 = 1 at rest; electrons of proper density −1/γ(v), so that in S they cancel the ions (wire) */
  const etat = v => {
    const e = M.quadricourant(-1 / M.gammaLorentz(v), [v, 0, 0]);
    return cas === "fil" ? M.sommeCourants([{ rho: 1, j: [0, 0, 0] }, e]) : e;
  };
  function draw() {
    const v = +$("vsl").value / 100 * c, u = +$("usl").value / 100 * c, k = etat(v);
    btns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cas === cas)));
    const svg = $("graphe"); svg.innerHTML = "";
    const lim = cas === "fil" ? 4 : 8;
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [-1, 1], label: t("tr.x") }, y: { domain: [-lim, lim], label: t("tr.y") } });
    const us = Array.from({ length: 381 }, (_, i) => -0.95 + 1.9 * i / 380);
    const clip = w => Math.max(-lim, Math.min(lim, w));
    Plot.el("line", { x1: x(-1), x2: x(1), y1: y(0), y2: y(0), class: "zero" }, g);
    const courbe = (f, cls) => Plot.el("path", { d: Plot.path(us.map(s => [x(s), y(clip(f(M.boostCourant(k, s * c))))])), class: cls }, g);
    courbe(b => b.rho, "curve");
    courbe(b => b.j[0] / c, "ref");
    const here = M.boostCourant(k, u);
    Plot.el("circle", { cx: x(u / c), cy: y(clip(here.rho)), r: 5, class: "dot" }, g);
    Plot.el("circle", { cx: x(u / c), cy: y(clip(here.j[0] / c)), r: 5, class: "ref" }, g);
    $("vread").textContent = F.qty(F.num(v / c, 2), "c");
    $("uread").textContent = F.qty(F.num(u / c, 2), "c");
    $("vrho").textContent = F.num(here.rho, 3);
    $("vj").textContent = F.num(here.j[0] / c, 3);
    const inv = M.invariantCourant(here) / (c * c);
    $("vinv").textContent = F.num(inv, 4);
    $("finv").textContent = t(inv > 0 ? "tr.f.inv.temps" : "tr.f.inv.espace");
  }
  $("vsl").oninput = draw; $("usl").oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["poincare", 1905, "idea"], ["einstein", 1905, "idea"], ["minkowski", 1908, "idea"], ["vay", 2007, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["boost"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["propre", "a"], ["quadri", "c"], ["fil", "b"], ["repos", "d"], ["invariant", "a"], ["perp", "c"], ["choix", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 137 });
})();
</script>
