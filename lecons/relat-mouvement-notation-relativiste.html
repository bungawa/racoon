<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, C = Constantes.c, me = Constantes.m_e, qe = -Constantes.e;

/* ---------- un électron lâché au repos dans des champs croisés : (26.39) contre Newton ---------- */
(() => {
  const B0 = 1e-3, W = Math.abs(qe) * B0 / me, svg = $("trajet"), sk = $("sk");   // B along z, E along y
  function draw() {
    const k = +sk.value, E0 = k * C * B0, gd = k < 1 ? 1 / Math.sqrt(1 - k * k) : null;
    /* three proper periods 2π m γd/(|q|B) when bound; one cyclotron period 2π m/(|q|B) otherwise (the runaway is exponential) */
    const S = gd ? 3 * 2 * Math.PI * gd / W : 2 * Math.PI / W;
    const o = R.mouvementPropre({ q: qe, m: me, E: [0, E0, 0], B: [0, 0, B0], s: S, n: 3000 });
    const pts = o.x.map(x => [x[1], x[2]]), T = o.x.at(-1)[0] / C;
    /* Newton, from rest, Ω = qB/m signed: x = (E/B)(t − sin Ωt/Ω), y = (E/B)(1 − cos Ωt)/Ω, over the same lab time */
    const Om = qe * B0 / me, vd = E0 / B0;
    const nw = Array.from({ length: 1201 }, (_, i) => { const tt = T * i / 1200; return [vd * (tt - Math.sin(Om * tt) / Om), vd * (1 - Math.cos(Om * tt)) / Om]; });
    const all = pts.concat(nw.filter(p => p[0] <= Math.max(...pts.map(q => q[0])) * 1.05));
    const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
    const x0 = Math.min(0, ...xs), x1 = Math.max(...xs) * 1.02, ylo = Math.min(0, ...ys), yhi = Math.max(0, ...ys), dy = (yhi - ylo) || 1;
    const y0 = ylo - 0.08 * dy, y1 = yhi + 0.08 * dy;
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { l: 56, b: 44 }, x: { domain: [x0, x1], label: t("fig.xaxis") }, y: { domain: [y0, y1], label: t("fig.yaxis") } });
    const clip = p => [A.x(p[0]), A.y(Math.max(y0, Math.min(y1, p[1])))];
    Plot.el("path", { d: Plot.path(nw.filter(p => p[0] <= x1).map(clip)), class: "ref" }, A.g);
    Plot.el("path", { d: Plot.path(pts.map(clip)), class: "curve" }, A.g);
    /* readouts */
    const gmax = Math.max(...o.u.map(u => u[0]));
    $("skr").textContent = t("fig.kappaval", { k: F.num(k, 3), E: F.si(E0, "V·m⁻¹") });
    $("vg").textContent = F.num(gmax, 4);
    $("fg").textContent = k < 1 ? t("fig.f.gamma", { v: F.num((1 + k * k) / (1 - k * k), 4) }) : t("fig.f.fuite");
    if (k < 1) {
      const ip = o.s.findIndex(s => s >= S / 3 * (1 - 1e-12)), xp = o.x[ip];
      $("vd").textContent = t("fig.betaval", { b: F.num(xp[1] / xp[0], 3) });
    } else $("vd").textContent = t("fig.aucune");
    $("fd").textContent = t(k < 1 ? "fig.f.derive" : "fig.f.deriveFaux", { v: F.num(k, 3) });
    $("vs").textContent = F.num(T / S, 4);
    $("fs").textContent = t("fig.f.propre", { s: F.si(S, "s"), n: F.sci(o.ecartNorme, 1) });
  }
  sk.oninput = draw; draw();
})();

/* ---------- le système décrit : quand Newton suffit-il dans des champs croisés ? ---------- */
(() => {
  const E = 1e5, B = 0.1, k = E / (C * B);
  $("sys1").innerHTML = t("sys1.body", { E: F.si(E, "V·m⁻¹"), B: F.si(B, "T"), v: F.si(E / B, "m·s⁻¹"), k: F.sci(k, 2), b2: F.sci(4 * k * k, 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["planck", 1906, "idea"], ["minkowski", 1908, "idea"], ["boris", 1970, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pic"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["ddt", "b"], ["propre", "a"], ["force", "d"], ["norme", "c"], ["temps", "b"], ["derive", "a"], ["newton", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 264 });
})();
</script>
