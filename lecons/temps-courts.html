<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les temps courts</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-mesurer" data-i18n="monde.mesurer"></a><span class="aux">›</span><a href="/racoon/etape?id=le-temps" data-i18n="etape.le-temps"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="tags">
      <a class="chip t-fond" href="/racoon/atlas?piste=fond" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/le-temps" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n="s1.p1"></p>
    <p data-i18n="s1.p2"></p>
    <div class="box def"><b data-i18n="s1.def.title"></b>
      <p data-i18n-html="s1.def.body"></p>
    </div>
    <p data-i18n-html="s1.p3"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq">
      <math display="block"><mi>t</mi><mo>=</mo><mfrac><mi>d</mi><mi>v</mi></mfrac></math>
      
    </div>
    <p class="validite" data-i18n="eq1.validite"></p>
    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="dsl" data-i18n="tof.d"></label><output id="dread" for="dsl"></output></div>
          <input id="dsl" type="range" min="0" max="1000" step="1" value="645"></div>
        <div class="seg" role="group" data-i18n-attr="aria-label:tof.medium"><button type="button" id="m-vide" aria-pressed="true" data-i18n="tof.m.vide"></button><button type="button" id="m-fibre" aria-pressed="false" data-i18n="tof.m.fibre"></button><button type="button" id="m-son" aria-pressed="false" data-i18n="tof.m.son"></button></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="tof.t"></span><span class="v" id="vt"></span><span class="f" id="vspeed"></span></div>
          <div class="stat"><span class="k" data-i18n="tof.quartz"></span><span class="v" id="vq"></span></div>
          <div class="stat"><span class="k" data-i18n="tof.cs"></span><span class="v" id="vcs"></span></div>
        </div>
      </div>
      <div class="list scale" id="ladder" role="table" data-i18n-attr="aria-label:ladder.aria"></div>
      <figcaption data-i18n-html="tof.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq">
      <math display="block"><mi>ℓ</mi><mo>=</mo><mi>v</mi><mo>·</mo><mi>γ</mi><mi>τ</mi><mo>=</mo><mi>β</mi><mi>γ</mi><mi>c</mi><mi>τ</mi></math>
      
    </div>
    <p class="validite" data-i18n="eq2.validite"></p>
    <p data-i18n-html="s3.p2"></p>
    <figure>
      <div class="panel">
        <div class="ctl"><div class="row"><label for="bsl" data-i18n="pion.bg"></label><output id="bread" for="bsl"></output></div>
          <input id="bsl" type="range" min="0" max="1000" step="1" value="520"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="pion.beta"></span><span class="v" id="vbeta"></span></div>
          <div class="stat"><span class="k" data-i18n-html="pion.lab"></span><span class="v" id="vlab"></span></div>
          <div class="stat"><span class="k" data-i18n-html="pion.len"></span><span class="v" id="vlen"></span></div>
          <div class="stat"><span class="k" data-i18n="pion.surv"></span><span class="v" id="vsurv"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="pion.caption"></figcaption>
    </figure>
    <div class="box rem"><b data-i18n="s3.rem.title"></b>
      <p data-i18n-html="s3.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/temps-courts.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/temps-courts.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const $ = id => document.getElementById(id);
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const P = TempsCourts;
/* préfixes jusqu'à p ; au-dessous, notation scientifique (le préfixe f se lit mal à côté des puissances de dix) */
const si = (x, u) => Math.abs(x) < 1e-12 ? F.qty(F.sci(x, 3), u) : F.si(x, u, { sig: 3 });
const time = s => si(s, "s");
const oom = s => F.qty("10" + F.sup(Math.round(Math.log10(s))), "s");

/* ---------- §5-3 : chronométrer par une vitesse connue, et l'échelle des temps courts ---------- */
(() => {
  const LO = -24, HI = 0, pos = s => Math.min(100, Math.max(0, (Math.log10(s) - LO) / (HI - LO) * 100));
  const ROWS = [["seconde", 1], ["quartz", 1 / 32768], ["ns", P.flightTime(0.3, P.C)], ["cs", 1 / 9192631770], ["visible", 5e-7 / P.C],
    ["record", 4.3e-17], ["pion", P.TAU_PI0], ["resonance", 1e-24]];
  const names = textOf("ladder.rows", ["mesure"].concat(ROWS.map(r => r[0])));
  const row = (name, s, id) => `<div role="row"${id ? ` id="${id}"` : ""}><span role="cell">${name}</span><span class="track" aria-hidden="true"><i style="left:${pos(s)}%"></i></span><span class="v" role="cell">${oom(s)}</span></div>`;
  $("ladder").innerHTML = row("<strong>" + names.mesure + "</strong>", 1, "lmesure") + ROWS.map(([id, s]) => row(names[id], s)).join("");
  const V = { vide: P.C, fibre: P.C / 1.47, son: 343 };
  let medium = "vide";
  const dsl = $("dsl");
  const upd = () => {
    const d = Math.pow(10, -15 + dsl.value / 1000 * 24), tt = P.flightTime(d, V[medium]);
    $("dread").textContent = si(d, "m");
    $("vt").textContent = time(tt);
    $("vspeed").textContent = t("tof.speed", { v: F.qty(F.sci(V[medium], 3), "m·s⁻¹") });
    $("vq").textContent = F.num(P.periodsIn(tt, 32768), 3);
    $("vcs").textContent = F.num(P.periodsIn(tt, 9192631770), 3);
    const r = $("lmesure"); r.querySelector("i").style.left = pos(tt) + "%"; r.querySelector(".v").textContent = oom(tt);
  };
  const pick = k => { medium = k; Object.keys(V).forEach(id => $("m-" + id).setAttribute("aria-pressed", String(id === k))); upd(); };
  Object.keys(V).forEach(k => $("m-" + k).onclick = () => pick(k));
  dsl.oninput = upd; upd();
})();

/* ---------- §5-3 : la trace du pion neutre ---------- */
(() => {
  const bsl = $("bsl");
  const upd = () => {
    const bg = Math.pow(10, -2 + bsl.value / 1000 * 5), len = P.decayLength(P.TAU_PI0, bg);
    $("bread").textContent = F.num(bg, 3);
    $("vbeta").textContent = F.num(P.beta(bg), 4);
    $("vlab").textContent = time(P.labLifetime(P.TAU_PI0, bg));
    $("vlen").textContent = si(len, "m");
    const s = P.survival(1e-6, len);
    $("vsurv").textContent = s < 1e-4 ? F.sci(s, 2) : F.qty(F.num(s * 100, 3), "%");
  };
  bsl.oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["romer", 1676, "experiment"], ["fizeau", 1849, "experiment"], ["braun", 1897, "experiment"], ["zewail", 1999, "use"],
    ["peigne", 2005, "idea"], ["record", 2017, "experiment"], ["atto", 2023, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["lune", "gnss"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["labo", "a"], ["tonnerre", "a"], ["pourquoi", "a"], ["impulsion", "a"], ["dilatation", "a"], ["ecran", "a"], ["cascade", "a"], ["plancher", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t });
})();
</script>
</body>
</html>
