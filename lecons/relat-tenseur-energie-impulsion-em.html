<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, C = Constantes.c;

/* ---------- le tenseur de quatre champs, vu d'un référentiel qui avance selon x ---------- */
(() => {
  const E0 = 1e6;                                          // V·m⁻¹; the magnetic case has the same energy density
  const CAS = { ex: { E: [E0, 0, 0], B: [0, 0, 0] }, ey: { E: [0, E0, 0], B: [0, 0, 0] }, bz: { E: [0, 0, 0], B: [0, 0, E0 / C] },
    onde: { E: [0, E0, 0], B: [0, 0, E0 / C] } };
  const svg = $("matrice"), sb = $("sb"), seg = $("cas"), IDX = ["t", "x", "y", "z"]; let cas = "ey";
  function draw() {
    const beta = +sb.value, { E, B } = CAS[cas], S = R.tenseurEnergieImpulsion(E, B), u0 = S[0][0];
    const Sp = R.boostTenseur(S, beta), vu = R.champsVus(E, B, beta), Sf = R.tenseurEnergieImpulsion(vu.E, vu.B);
    const big = Math.max(...Sp.flat().map(Math.abs));
    svg.innerHTML = "";
    const x0 = 170, y0 = 40, w = 100, h = 60;
    IDX.forEach((n, i) => {
      Plot.el("text", { x: x0 + w * i + w / 2, y: y0 - 12, "text-anchor": "middle" }, svg).textContent = n;
      Plot.el("text", { x: x0 - 14, y: y0 + h * i + h / 2 + 4, "text-anchor": "end" }, svg).textContent = n;
    });
    Sp.forEach((row, i) => row.forEach((v, j) => {
      const r = Math.abs(v) / big, cls = v >= 0 ? "c-tint" : "c-warn";
      Plot.el("rect", { x: x0 + w * j + 2, y: y0 + h * i + 2, width: w - 4, height: h - 4, class: "stroke thin c-label-2" }, svg);
      if (r > 1e-9) Plot.el("rect", { x: x0 + w * j + w / 2 - (w - 8) * Math.sqrt(r) / 2, y: y0 + h * i + h / 2 - (h - 8) * Math.sqrt(r) / 2,
        width: (w - 8) * Math.sqrt(r), height: (h - 8) * Math.sqrt(r), class: "stroke bold " + cls }, svg);
      Plot.el("text", { x: x0 + w * j + w / 2, y: y0 + h * i + h / 2 + 4, "text-anchor": "middle" }, svg).textContent = F.num(Math.abs(v) < 1e-12 * big ? 0 : v / u0, 3);
    }));
    Plot.el("text", { x: 20, y: y0 + 2 * h + 4 }, svg).textContent = t("fig.unite");
    $("sbr").textContent = t("fig.betaval", { b: F.num(beta, 2), g: F.num(1 / Math.sqrt(1 - beta * beta), 3) });
    $("vu").textContent = F.num(Sp[0][0] / u0, 4);
    $("fu").textContent = t("fig.f.u", { v: F.si(u0, "J·m⁻³") });
    $("vtr").textContent = F.num(R.traceTenseur(Sp) / u0 + 0, 2);
    const ecart = Math.max(...Sp.flat().map((v, k) => Math.abs(v - Sf.flat()[k]))) / u0;
    $("vdeux").textContent = F.sci(ecart || 0, 1);
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.c === cas)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { cas = x.dataset.c; draw(); });
  sb.oninput = draw; draw();
})();

/* ---------- le système décrit : un condensateur, la lumière du Soleil, une voile ---------- */
(() => {
  const E = 1e6, p = Constantes.eps0 * E * E / 2;
  const I0 = Constantes.L_sun / (4 * Math.PI * Constantes.au ** 2), pr = I0 / C;
  $("sys1").innerHTML = t("sys1.body", { E: F.si(E, "V·m⁻¹"), p: F.si(p, "Pa"), I: F.si(I0, "W·m⁻²", { sig: 4 }), pr: F.si(pr, "Pa"),
    Fmax: F.si(2 * pr * 200, "N", { prefix: "m" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["maxwell", 1873, "idea"], ["poynting", 1884, "idea"], ["minkowski", 1908, "idea"], ["einstein", 1915, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["voile"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["tt", "a"], ["tx", "c"], ["sym", "b"], ["tension", "d"], ["trace", "a"], ["onde", "b"], ["pression", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 318 });
})();
</script>
