<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, e = Constantes.e, me = Constantes.m_e, c = Constantes.c, MeV = 1e6 * e;

/* ---------- la condition 2:1 à l'épreuve : un électron suivi pas à pas (lorentzRel) ---------- */
(() => {
  const r0 = 0.1, b0 = 0.02, T = 40e-9, n = -0.5, duree = 2 * T;                 // field on the orbit from 20 to 60 mT in 80 ns
  const b = t => b0 * (1 + t / T), db = () => b0 / T, p0 = e * r0 * b0, svg = $("trace"), sk = $("sk");
  function draw() {
    const k = +sk.value / 100, ch = M.champBetatron({ r0, n, k, b, db });
    const out = M.lorentzRel({ q: -e, m: me, E: ch.E, B: ch.B, x0: [r0, 0, 0], p0: [0, p0, 0], duree, n: 10000, every: 25 });
    /* turns: the azimuth unwrapped */
    let tour = 0, a0 = 0; const pts = out.map(s => { const a = Math.atan2(s.x[1], s.x[0]); let d = a - a0; if (d < -Math.PI) d += 2 * Math.PI; if (d > Math.PI) d -= 2 * Math.PI; tour += d; a0 = a;
      return [tour / (2 * Math.PI), Math.hypot(s.x[0], s.x[1]) / r0]; });
    const ad = M.rayonAdiabatique({ r0, n, k }, b0, b(duree), 100), tours = pts[pts.length - 1][0];
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 60, b: 44 }, x: { domain: [0, Math.ceil(tours / 5) * 5], label: t("fig.xaxis") }, y: { domain: [0.85, 1.15], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(0), x2: P.x(Math.ceil(tours / 5) * 5), y1: P.y(1), y2: P.y(1), class: "zero" }, P.g);
    /* the adiabatic radius is a function of b; b is linear in t, and the turns are nearly linear in t too (v ≈ c): map b to turns through t */
    const turnsAt = tt => { const i = Math.min(out.length - 1, Math.round(tt / duree * (out.length - 1))); return pts[i][0]; };
    Plot.el("path", { d: Plot.path(pts.map(([x, y]) => [P.x(x), P.y(Math.max(0.85, Math.min(1.15, y)))])), class: "curve" }, P.g);
    Plot.el("path", { d: Plot.path(ad.map(x => [P.x(turnsAt((x.b / b0 - 1) * T)), P.y(x.r / r0)])), class: "ref" }, P.g);
    const last = out[out.length - 1], rf = Math.hypot(last.x[0], last.x[1]), pf = Math.hypot(...last.p);
    $("skr").textContent = F.num(k, 3);
    $("vr").textContent = F.qty(F.num(100 * rf, 4), "cm");
    $("fr").textContent = t("fig.f.r", { a: F.qty(F.num(100 * ad[ad.length - 1].r, 4), "cm") });
    $("vp").textContent = F.qty(F.num(pf * c / MeV, 3), "MeV/c");
    $("fp").textContent = t("fig.f.p", { p: F.qty(F.num((p0 + e * r0 / 2 * k * (b(duree) - b0)) * c / MeV, 3), "MeV/c"), o: F.qty(F.num(e * r0 * b(duree) * c / MeV, 3), "MeV/c") });
    $("vt").textContent = F.num(tours, 3);
    $("ft").textContent = t("fig.f.tours", { g: F.num(last.gamma, 3) });
  }
  sk.oninput = draw; draw();
})();

/* ---------- les limites : gain par tour contre perte par rayonnement, 1 T à 50 Hz ---------- */
(() => {
  const sr = $("sr"), Bmax = 1, f = 50;
  function draw() {
    const r0 = +sr.value / 100, B = M.betatron({ r0, Bmax, f });
    $("srr").textContent = F.si(r0, "m");
    $("vec").textContent = F.si(B.ec / e, "eV");
    $("fec").textContent = t("lim.f.ec", { n: F.num(B.tours, 2) });
    $("vg").textContent = F.si(B.gainMoyen / e, "eV");
    $("fg").textContent = t("lim.f.gain", { v: F.si(B.gainMax / e, "eV") });
    $("vl").textContent = F.si(B.perte / e, "eV");
    $("fl").textContent = t("lim.f.perte", { x: F.num(100 * B.perte / B.gainMoyen, 2) });
  }
  sr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["wideroe", 1928, "idea"], ["kerst", 1940, "experiment"], ["lumiere", 1947, "experiment"], ["illinois", 1950, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["radiographie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["champE", "a"], ["noyau", "c"], ["deux", "b"], ["ecart", "d"], ["rapide", "a"], ["relat", "c"], ["limite", "d"], ["gain", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 173 });
})();
</script>
