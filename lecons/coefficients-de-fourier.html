<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (el, tag, ids, items) => { el.innerHTML = ids.map(id => `<div><span class="k">${tag}</span><span><strong>${items[id].name}.</strong> ${items[id].text}</span></div>`).join(""); };
const nul = v => (Math.abs(v) < 5e-4 ? 0 : v);

/* ---------- la forme retardée de τ, le cosinus ou le sinus de rang n, leur produit ; sa moyenne sur une fenêtre Δ ---------- */
(() => {
  const O = self.Ondes, D = 4, M = 1600, US = Array.from({ length: M + 1 }, (_, i) => D * i / M);
  let nom = "creneau", type = "sin";
  function upd() {
    const n = +$("nn").value, tau = +$("tau").value, del = +$("del").value;
    const Fo = O.signal(nom, 0.25), g = u => Fo.f(u - tau), trig = type === "cos" ? Math.cos : Math.sin;
    const ref = u => trig(2 * Math.PI * n * u), p = u => g(u) * ref(u);
    const svg = $("pr"); svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 240, pad: { l: 52, b: 44 }, x: { domain: [0, D], label: t("pr.xaxis") }, y: { domain: [-1.4, 1.4], label: t("pr.yaxis") } });
    const k = Math.round(M * del / D);
    Plot.el("path", { d: Plot.path([[P.x(0), P.y(0)], ...US.slice(0, k + 1).map(u => [P.x(u), P.y(p(u))]), [P.x(US[k]), P.y(0)]]) + "Z", class: "area" }, P.g);
    Plot.el("path", { d: Plot.path(US.map(u => [P.x(u), P.y(ref(u))])), class: "stroke thin dash c-label-2" }, P.g);
    Plot.el("path", { d: Plot.path(US.map(u => [P.x(u), P.y(g(u))])), class: "stroke thin c-warn" }, P.g);
    Plot.el("path", { d: Plot.path(US.map(u => [P.x(u), P.y(p(u))])), class: "stroke c-tint" }, P.g);
    const est = 2 * O.moyenneProduit(g, ref, 0, del, 4000), C = O.coefficients(g, 1, n);
    const exact = type === "cos" ? C.a[n - 1] : C.b[n - 1];
    $("nnv").textContent = String(n); $("tauv").textContent = F.num(tau, 2); $("delv").textContent = F.num(del, 3);
    $("fo").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.f === nom)));
    $("ty").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.t === type)));
    $("vw").textContent = F.num(nul(est), 3); $("fw").textContent = t("pr.f.fenetre", { d: F.num(del, 3) });
    $("ve").textContent = F.num(nul(exact), 3); $("fe").textContent = t(type === "cos" ? "pr.f.a" : "pr.f.b", { n });
    $("va").textContent = F.num(nul(C.A[n - 1]), 3); $("fa").textContent = t("pr.f.ampl", { n });
  }
  $("fo").querySelectorAll("button").forEach(x => x.onclick = () => { nom = x.dataset.f; upd(); });
  $("ty").querySelectorAll("button").forEach(x => x.onclick = () => { type = x.dataset.t; upd(); });
  ["nn", "tau", "del"].forEach(id => $(id).oninput = upd); upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["euler", 1777, "idea"], ["kelvin", 1878, "experiment"], ["fft", 1965, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["synchrone", "afm"]; keyed($("uses"), t("uses.tag"), USES, textOf("uses.items", USES));
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["moyenne", "c"], ["astuce", "a"], ["fenetre", "d"], ["retard", "b"], ["pair", "a"], ["points", "c"], ["synchrone", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 504 });
})();
</script>
