<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, C = Constantes.c;

/* ---------- diagramme d'espace-temps : les axes de Moe vus par Joe, un événement lu par les deux ---------- */
(() => {
  const svg = $("diag"), sb = $("sb"), sx = $("sx"), st = $("st"), seg = $("mode");
  let mode = "lorentz";
  const D = 5, W = 600, H = 600, pad = { l: 52, r: 16, t: 12, b: 44 };
  const DY = D * (H - pad.t - pad.b) / (W - pad.l - pad.r);            // same metres per pixel on both axes: light at 45°
  /* an event of Moe (x', ct') back in Joe's coordinates, by the chosen transformation */
  const versJoe = (xp, ctp, b) => {
    if (mode === "galilee") return [xp + b * ctp, ctp];
    const e = R.lorentz({ t: ctp / C, x: xp }, -b * C); return [e.x, C * e.t];
  };
  const versMoe = (x, ct, b) => {
    const e = mode === "galilee" ? R.galileeEvt({ t: ct / C, x }, b * C) : R.lorentz({ t: ct / C, x }, b * C);
    return [e.x, C * e.t];
  };
  function draw() {
    const b = +sb.value, x = +sx.value, ct = +st.value;
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: W, h: H, pad, x: { domain: [-D, D], label: t("fig.xaxis") }, y: { domain: [-DY, DY], label: t("fig.yaxis") } });
    const line = (a, z, cls) => Plot.el("line", { x1: P.x(a[0]), y1: P.y(a[1]), x2: P.x(z[0]), y2: P.y(z[1]), class: cls }, P.g);
    line([-D, 0], [D, 0], "zero"); line([0, -DY], [0, DY], "zero");
    line([-DY, -DY], [DY, DY], "stroke dash c-warn"); line([DY, -DY], [-DY, DY], "stroke dash c-warn");
    /* Moe's axes: x' = 0 and ct' = 0, drawn far in both directions, then clipped by the plot */
    const far = 40;
    Plot.el("clipPath", { id: "cadre" }, P.g).appendChild(Plot.el("rect", { x: pad.l, y: pad.t, width: W - pad.l - pad.r, height: H - pad.t - pad.b }));
    const g = Plot.el("g", { "clip-path": "url(#cadre)" }, P.g);
    const lineIn = (a, z, cls) => Plot.el("line", { x1: P.x(a[0]), y1: P.y(a[1]), x2: P.x(z[0]), y2: P.y(z[1]), class: cls }, g);
    lineIn(versJoe(0, -far, b), versJoe(0, far, b), "stroke bold c-tint");
    lineIn(versJoe(-far, 0, b), versJoe(far, 0, b), "stroke bold c-tint");
    /* Moe's unit marks: x' = k, ct' = k (metres) */
    for (let k = -6; k <= 6; k++) if (k) for (const p of [versJoe(k, 0, b), versJoe(0, k, b)])
      if (Math.abs(p[0]) < D && Math.abs(p[1]) < DY) Plot.el("circle", { cx: P.x(p[0]), cy: P.y(p[1]), r: 2.5, class: "fill c-tint" }, g);
    /* the event, Joe's projections, Moe's projections (parallel to his axes) */
    const [xp, ctp] = versMoe(x, ct, b);
    lineIn([x, ct], [x, 0], "stroke thin dash c-label-2"); lineIn([x, ct], [0, ct], "stroke thin dash c-label-2");
    lineIn([x, ct], versJoe(xp, 0, b), "stroke thin dash c-tint"); lineIn([x, ct], versJoe(0, ctp, b), "stroke thin dash c-tint");
    Plot.el("circle", { cx: P.x(x), cy: P.y(ct), r: 6, class: "dot" }, P.g);
    /* numbers */
    const m = mode; mode = "lorentz"; const Lz = versMoe(x, ct, b); mode = "galilee"; const Gz = versMoe(x, ct, b); mode = m;
    const pt = (a, c) => t("fig.pt", { x: F.num(a, 3), ct: F.num(c, 3) });
    $("sbr").textContent = F.num(b, 2) + " c";
    $("sxr").textContent = F.si(x, "m"); $("str").textContent = F.si(ct, "m");
    $("vmoe").textContent = pt(Lz[0], Lz[1]);
    $("fmoe").textContent = t("fig.f.moe", { v: pt(Gz[0], Gz[1]), g: F.num(R.gamma(b * C), 4) });
    $("vlum").textContent = F.num(R.vitesseVue(C, b * C, "lorentz") / C, 6) + " c";
    $("flum").textContent = t("fig.f.lum", { v: F.num(R.vitesseVue(C, b * C, "galilee") / C, 3) + " c" });
    const s2 = (a, c) => F.qty(F.num(c * c - a * a, 4), "m²");
    $("vinv").textContent = s2(x, ct);
    $("finv").textContent = t("fig.f.inv", { l: s2(Lz[0], Lz[1]), g: s2(Gz[0], Gz[1]) });
    seg.querySelectorAll("button").forEach(z => z.setAttribute("aria-pressed", String(z.dataset.m === mode)));
  }
  seg.querySelectorAll("button").forEach(z => z.onclick = () => { mode = z.dataset.m; draw(); });
  sb.oninput = sx.oninput = st.oninput = draw; draw();
})();

/* ---------- le système décrit : deux événements simultanés à 1000 km, vus d'un référentiel à 29,8 km/s ---------- */
(() => {
  const u = 2 * Math.PI * Constantes.au / (365.25 * 86400), x = 1e6, d = R.ecartGalilee({ t: 0, x }, u);
  $("sys1").innerHTML = t("sys1.body", { u: F.si(u, "m·s⁻¹", { prefix: "k" }), x: F.si(x, "m", { prefix: "k" }), b2: F.sci((u / C) ** 2, 2),
    g1: F.sci(R.gammaMoinsUn(u), 2), dx: F.si(d.dx, "m", { prefix: "m" }), dt: F.si(Math.abs(d.dt), "s", { prefix: "µ" }), tl: F.si(x / C, "s", { prefix: "m" }) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["voigt", 1887, "idea"], ["lorentz", 1904, "idea"], ["poincare", 1905, "idea"], ["einstein", 1905, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  /* LHC Run 3: 6,8 TeV per proton beam; γ = E/(m_p c²) */
  const E = 6.8e12 * Constantes.e, g = E / (Constantes.m_p * C * C), b1 = 1 / (g * g * (1 + Math.sqrt(1 - 1 / (g * g))));
  const USES = ["lhc"], uses = textOf("uses.items", USES);
  const vals = { g: F.num(g, 3), b: F.sci(b1, 2) }, fill = s => s.replace(/\{(\w+)\}/g, (_, k) => vals[k]);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${fill(uses[id].text)}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["maxwell", "b"], ["petit", "d"], ["simult", "a"], ["lumiere", "c"], ["inverse", "b"], ["gamma", "a"], ["axes", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 152 });
})();
</script>
