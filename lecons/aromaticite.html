<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const O = ChimOrga, $ = id => document.getElementById(id), sym = s => t("chim.sym", { s });
const kJ = x => F.qty(F.num(x, 3), "kJ·mol⁻¹");

/* ---------- les deux formes de Kekulé ---------- */
[0, 1].forEach(k => { const d = O.dessinArene({ kekule: k, texte: sym, echelle: 42 }), svg = $("kekule" + k); svg.setAttribute("viewBox", d.viewBox); svg.innerHTML = d.html; });

/* ---------- enthalpies d'hydrogénation (kJ·mol⁻¹, valeurs absolues) ---------- */
const HYDRO = { cyclohexene: 118, diene: 230, benzene: 206 };
const BETA = (3 * HYDRO.cyclohexene - HYDRO.benzene) / 2;          // |β| calé sur la stabilisation du benzène : 2|β| = E_stab
(() => {
  const ROWS = [["cyclohexene", 1, HYDRO.cyclohexene], ["diene", 2, HYDRO.diene], ["benzene", 3, HYDRO.benzene]];
  const noms = textOf("s2.noms", ROWS.map(r => r[0]));
  const { x, y, g } = Plot.axes($("hydro"), { fmt: F, w: 520, h: 280, pad: { b: 56, l: 60 },
    x: { domain: [0, 3], ticks: 1, fmt: () => "" }, y: { domain: [0, 400], label: t("s2.y") } });
  ROWS.forEach(([id, n, mes], i) => {
    const x0 = x(i + 0.2), x1 = x(i + 0.8), prevu = n * HYDRO.cyclohexene;
    Plot.el("rect", { x: x0, y: y(prevu), width: x1 - x0, height: y(0) - y(prevu), class: "ref" }, g);
    ["area", "curve"].forEach(c => Plot.el("rect", { x: x0 + 8, y: y(mes), width: x1 - x0 - 16, height: y(0) - y(mes), class: c }, g));
    Plot.el("text", { x: (x0 + x1) / 2, y: y(0) + 18, "text-anchor": "middle", class: "tick" }, g).textContent = noms[id];
    Plot.el("text", { x: (x0 + x1) / 2, y: y(Math.max(prevu, mes)) - 6, "text-anchor": "middle", class: "tick" }, g).textContent = t("s2.barre", { m: F.num(mes, 3), p: F.num(prevu, 3) });
  });
})();

/* ---------- critères et cercle de Frost ---------- */
(() => {
  const MOLS = [
    ["benzene", 6, 0, true, true], ["cyclobutadiene", 4, 0, true, true], ["cot", 8, 0, false, true], ["cot2", 8, -2, true, true],
    ["tropylium", 7, 1, true, true], ["cp", 5, -1, true, true], ["cpH", 5, 0, true, false], ["cyclopropenyle", 3, 1, true, true],
  ];
  const noms = textOf("fig.mols", MOLS.map(m => m[0])), sel = $("molecule"), svg = $("frost");
  sel.innerHTML = MOLS.map(([id]) => `<option value="${id}">${noms[id]}</option>`).join("");
  const CRIT = ["cycle", "plan", "conjugue", "huckel"], crit = textOf("fig.crit", CRIT);
  function frost(r, actif) {
    svg.innerHTML = "";
    const cx = 160, cy = 140, R = 105, N = r.N, cls = actif ? "c-label" : "c-label-2";
    const pts = Array.from({ length: N }, (_, k) => { const th = 2 * Math.PI * k / N; return { k, x: cx + R * Math.sin(th), y: cy + R * Math.cos(th), e: -2 * Math.cos(th) }; });
    Plot.el("circle", { cx, cy, r: R, class: "stroke thin dash" }, Plot.el("g", { class: "c-label-2" }, svg));
    Plot.el("polygon", { points: pts.map(p => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" "), class: "stroke" }, Plot.el("g", { class: cls }, svg));
    Plot.el("line", { x1: 30, x2: 290, y1: cy, y2: cy, class: "stroke thin dash" }, Plot.el("g", { class: "c-label-2" }, svg));
    Plot.el("text", { x: 26, y: cy + 4, "text-anchor": "end", class: "tick" }, svg).textContent = t("fig.alpha");
    const ordre = pts.slice().sort((a, b) => a.e - b.e);
    ordre.forEach((p, i) => {
      const n = r.orbitales[i].n, g = Plot.el("g", { class: actif ? "c-warn" : "c-label-2" }, svg);
      Plot.el("line", { x1: p.x - 14, x2: p.x + 14, y1: p.y, y2: p.y, class: "stroke bold" }, Plot.el("g", { class: cls }, svg));
      for (let j = 0; j < Math.round(n); j++) Plot.el("circle", { cx: p.x - 5 + 10 * j, cy: p.y - 7, r: 4, class: "fill" }, g);
    });
    Plot.el("text", { x: 300, y: cy + R + 4, "text-anchor": "end", class: "tick" }, svg).textContent = t("fig.bas");
    Plot.el("text", { x: 300, y: cy - R + 4, "text-anchor": "end", class: "tick" }, svg).textContent = t("fig.haut");
  }
  function maj() {
    const [id, N, q, plan, conj] = MOLS.find(m => m[0] === sel.value), r = O.cycle(N, q);
    frost(r, plan && conj);
    const ok = { cycle: true, plan, conjugue: conj, huckel: r.regle };
    $("criteres").innerHTML = CRIT.map(c => `<div><span class="k">${t(ok[c] ? "fig.oui" : "fig.non")}</span><span>${crit[c]}</span></div>`).join("");
    $("ne").textContent = F.num(r.ne, 2);
    $("nef").textContent = t(r.regle ? "fig.ne.huckel" : r.ne % 2 ? "fig.ne.impair" : "fig.ne.quatre", { n: F.num(r.regle ? (r.ne - 2) / 4 : r.ne / 4, 2) });
    $("couche").textContent = t(r.couchePleine ? "fig.pleine" : "fig.ouverte");
    $("deloc").textContent = t("fig.deloc.v", { d: F.num(r.delocalisation, 3) });
    $("delocf").textContent = t("fig.deloc.f", { e: kJ(r.delocalisation * BETA) });
    const v = !conj ? "interrompu" : !plan ? "nonplan" : r.couchePleine ? "aromatique" : r.ne % 2 ? "radical" : "anti";
    $("verdict").textContent = t("fig.v." + v);
  }
  sel.onchange = maj; maj();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1825, "experiment"], ["mitscherlich", 1834, "experiment"], ["kekule", 1865, "idea"], ["willstatter", 1911, "experiment"], ["lonsdale", 1929, "experiment"], ["huckel", 1931, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["styrene"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["longueurs", "c"], ["brome", "a"], ["stab", "d"], ["cot", "b"], ["cp", "c"], ["cyclobutadiene", "a"], ["critere", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 6061 });
})();
</script>
