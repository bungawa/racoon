<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);

/* ---------- Gauss et Ampère vérifiés par le calcul : trois charges, ou trois fils, aux mêmes places (positions en m) ---------- */
(() => {
  const svg = $("loi"), P = Plot.el, Rsl = $("Rsl"), BOX = [-0.08, 0.08, -0.05, 0.05], S = 4000;           // 4 000 px per metre
  const X = Plot.linScale(BOX[0], BOX[1], 0, 640), Y = Plot.linScale(BOX[2], BOX[3], 400, 0);
  const PLACES = [[-0.03, 0], [0.02, 0.01], [0.01, -0.02]];
  const CHARGES = PLACES.map((p, i) => ({ q: [2e-9, -1e-9, 1e-9][i], x: p[0], y: p[1] }));
  const FILS = PLACES.map((p, i) => ({ I: [3, -1, 2][i], x: p[0], y: p[1] }));
  let loi = "gauss", centre = [-0.01, 0];
  function draw() {
    const R = Rsl.value / 1000, gauss = loi === "gauss";
    svg.innerHTML = "";
    const field = r => { if (gauss) { const e = ChampsEM.champE(CHARGES, r[0], r[1]); return [e.ex, e.ey]; } const b = ChampsEM.champB(FILS, r[0], r[1]); return [b.bx, b.by]; };
    const pts = []; for (let i = 0; i < 17; i++) for (let j = 0; j < 11; j++) pts.push([-0.075 + i * 0.0094, -0.046 + j * 0.0092]);
    const mags = pts.map(p => Math.hypot(...field(p))).filter(Number.isFinite).sort((a, b) => a - b), ref = mags[mags.length >> 1];
    pts.forEach(p => {
      const v = field(p), m = Math.hypot(v[0], v[1]); if (!(m > 0) || PLACES.some(q => Math.hypot(p[0] - q[0], p[1] - q[1]) < 0.006)) return;
      const L = 22 * m / (m + ref), x0 = X(p[0]), y0 = Y(p[1]), x1 = x0 + L * v[0] / m, y1 = y0 - L * v[1] / m;
      P("line", { x1: x0, y1: y0, x2: x1, y2: y1, class: "stroke thin c-label-2" }, svg);
      P("circle", { cx: x1, cy: y1, r: 1.8, class: "fill c-label-2" }, svg);
    });
    PLACES.forEach((p, i) => {
      const pos = gauss ? CHARGES[i].q > 0 : FILS[i].I > 0, cls = pos ? "c-warn" : "c-label", r = gauss ? 4 + 3 * Math.abs(CHARGES[i].q) * 1e9 : 9;
      if (gauss) P("circle", { cx: X(p[0]), cy: Y(p[1]), r, class: "fill " + cls }, svg);
      else {
        P("circle", { cx: X(p[0]), cy: Y(p[1]), r, class: "stroke " + cls }, svg);
        if (pos) P("circle", { cx: X(p[0]), cy: Y(p[1]), r: 3, class: "fill " + cls }, svg);
        else [[1, 1], [1, -1]].forEach(([a, b]) => P("line", { x1: X(p[0]) - 6 * a, y1: Y(p[1]) - 6 * b, x2: X(p[0]) + 6 * a, y2: Y(p[1]) + 6 * b, class: "stroke " + cls }, svg));
      }
    });
    P("circle", { cx: X(centre[0]), cy: Y(centre[1]), r: R * S, class: "stroke bold c-tint" }, svg);
    P("circle", { cx: X(centre[0]), cy: Y(centre[1]), r: 3, class: "fill c-tint" }, svg);
    const onEdge = PLACES.some(p => Math.abs(Math.hypot(p[0] - centre[0], p[1] - centre[1]) - R) < 0.0015);
    let num, theo;
    if (gauss) {
      num = ChampsEM.fluxSphere(CHARGES, [centre[0], centre[1], 0], R, 120);
      const q = ChampsEM.chargeInterieure(CHARGES, centre, R); theo = q / ChampsEM.EPS0;
      $("vnum").textContent = F.si(num, "V·m", { prefix: "" });
      $("vloi").textContent = F.si(theo, "V·m", { prefix: "" });
      $("floi").textContent = t("lo.f.gauss", { q: F.si(q, "C") });
    } else {
      num = ChampsEM.circulationB(FILS, centre, R);
      const I = ChampsEM.courantEnlace(FILS, centre, R); theo = ChampsEM.MU0 * I;
      $("vnum").textContent = F.si(num, "T·m");
      $("vloi").textContent = F.si(theo, "T·m");
      $("floi").textContent = t("lo.f.ampere", { i: F.si(I, "A") });
    }
    const scale = gauss ? 1e-9 / ChampsEM.EPS0 : ChampsEM.MU0;               // one source unit, to judge the gap
    $("vecart").textContent = onEdge ? "–" : F.sci(Math.abs(num - theo) / scale, 1);
    $("loread").innerHTML = t(onEdge ? "lo.read.bord" : "lo.read." + loi);
    $("knum").innerHTML = t(gauss ? "lo.k.flux" : "lo.k.circ");
    $("kloi").innerHTML = t(gauss ? "lo.k.gauss" : "lo.k.ampere");
  }
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { loi = b.dataset.l;
    document.querySelectorAll("[data-l]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); draw(); });
  svg.addEventListener("pointerdown", e => { const r = svg.getBoundingClientRect();
    centre = [X.inv((e.clientX - r.left) * 640 / r.width), Y.inv((e.clientY - r.top) * 400 / r.height)]; draw(); });
  Rsl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["faraday", 1831, "idea"], ["maxwell", 1864, "idea"], ["hertz", 1887, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["transfo", "induction"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["dehors", "a"], ["coulomb", "c"], ["monopole", "b"], ["fil", "d"], ["condensateur", "a"], ["aimant", "c"], ["paralleles", "b"], ["onde", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 14 });
})();
</script>
