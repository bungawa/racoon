<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, eV = Constantes.e, m = Constantes.m_e, N = 1000, L = 8e-9, dx = L / N, X0 = -L / 2, DT = 2e-18, NF = 101, KF = 25, P0 = 1e-24;
const E = P0 * P0 / (2 * m);
$("sys1").innerHTML = t("sys.body", { E: F.qty(F.num(E / eV, 3), "eV"), v: F.si(P0 / m, "m·s⁻¹"), b: F.sci((P0 / m / Constantes.c) ** 2, 1), l: F.si(Constantes.h / P0, "m") });
(() => {
  const svg = $("tunnel"), sv = $("sv"), sw = $("sw"), st = $("st");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 }, x: { domain: [-4, 4], label: t("fig.x") }, y: { domain: [-0.6, 1.1], label: t("fig.y") } });
  const bar = Plot.el("rect", { y: y(1.1), height: y(-0.6) - y(1.1), class: "fill c-label-2", "fill-opacity": 0.25 }, g);
  const pp = Plot.el("path", { class: "stroke c-tint" }, g), pj = Plot.el("path", { class: "stroke thin c-warn" }, g);
  let frames = [], key = "", timer = 0, jR = 0;
  function calc() {
    const V0 = +sv.value / 10 * eV, w = +sw.value * 1e-11, i0 = Math.round((0 - X0) / dx), i1 = Math.round((w - X0) / dx);
    jR = i1;
    const V = Array.from({ length: N }, (_, i) => (i >= i0 && i < i1 ? V0 : 0));
    let psi = []; for (let i = 0; i < N; i++) { const z = Q.paquetGaussien(X0 + i * dx, { sigma: 4e-10, x0: -2e-9, p0: P0 }); psi.push({ re: z.re, im: z.im }); }
    const o = { m, dx, dt: DT, V }; frames = []; let flux = 0, Jprev = Q.courantProbabilite(psi, o)[i1];
    for (let f = 0; f < NF; f++) {
      if (f) for (let s = 0; s < KF; s++) { psi = Q.crankNicolson(psi, o, 1); const Jn = Q.courantProbabilite(psi, o)[i1]; flux += (Jprev + Jn) / 2 * DT; Jprev = Jn; }
      frames.push({ P: psi.map(z => z.re * z.re + z.im * z.im), J: Q.courantProbabilite(psi, o), droite: Q.probaDroite(psi, dx, i1), flux, norme: Q.probaDroite(psi, dx, 0) + (Q.probaDroite(psi, dx, -1) - Q.probaDroite(psi, dx, 0)) });
    }
    bar.setAttribute("x", x(0)); bar.setAttribute("width", x(w * 1e9) - x(0)); bar.setAttribute("fill-opacity", (0.08 + 0.3 * V0 / (8 * eV)).toFixed(3));
    $("svr").textContent = F.qty(F.num(V0 / eV, 3), "eV"); $("swr").textContent = F.si(w, "m");
    show();
  }
  function show() {
    const fr = frames[+st.value], Pm = Math.max(...frames[0].P), Jm = P0 / m * Pm;
    pp.setAttribute("d", Plot.path(fr.P.map((v, i) => [x((X0 + i * dx) * 1e9), y(v / Pm)])));
    pj.setAttribute("d", Plot.path(fr.J.map((v, i) => [x((X0 + i * dx) * 1e9), y(Math.max(-0.6, Math.min(1.1, v / Jm)))])));
    $("str").textContent = F.si(+st.value * KF * DT, "s");
    $("vp").textContent = F.num(fr.droite, 4);
    $("fp").textContent = t("fig.f.p");
    $("vj").textContent = F.num(fr.flux, 4);
    $("fj").textContent = t("fig.f.j", { d: F.sci(Math.abs(fr.droite - fr.flux) + 1e-16, 1) });
    $("vn").textContent = F.num(fr.norme, 6);
    $("fn").textContent = t("fig.f.n");
  }
  const go = () => { clearTimeout(timer); timer = setTimeout(calc, 40); };
  sv.oninput = sw.oninput = go; st.oninput = show; calc();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["madelung", 1926, "idea"], ["gamow", 1928, "idea"], ["stm", 1981, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["stm"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["local", "c"], ["reelle", "b"], ["plane", "a"], ["potentiel", "d"], ["tunnel", "b"], ["jauge", "c"], ["exponentiel", "d"], ["stm", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 212 });
})();
</script>
