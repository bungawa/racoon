<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const ES = Electrostatique, A0 = Constantes.a0, QE = Constantes.e;
const eV = x => F.si(x / QE, "eV");

/* ---------- l'atome de Thomson : une boule positive de 0,1 nm, un électron au repos dedans ---------- */
(() => {
  const R = 1e-10, th = ES.thomson(QE, R);
  $("sys").innerHTML = t("sys.body", { k: F.si(th.k, "N·m⁻¹"), f: F.si(th.omega / (2 * Math.PI), "Hz"), l: F.si(th.lambda, "m", { prefix: "n" }) });
})();

/* ---------- l'orbite classique qui rayonne : r(t) ---------- */
(() => {
  const svg = $("chute"), r0sl = $("r0sl"), N = 200, TMAX = ES.dureeEffondrement(2 * A0);
  function draw() {
    const r0 = +r0sl.value * A0, T = ES.dureeEffondrement(r0);
    const pts = Array.from({ length: N + 1 }, (_, i) => { const tt = T * i / N; return [tt, ES.rayonOrbite(r0, tt) / A0]; });
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { domain: [0, TMAX], label: t("ch.x"), fmt: v => F.num(v * 1e12, 3) }, y: { domain: [0, 2], label: t("ch.y") } });
    Plot.el("path", { d: Plot.path(pts.map(([tt, r]) => [x(tt), y(r)])), class: "curve" }, g);
    $("r0read").textContent = F.si(r0, "m", { prefix: "p" });
    $("vduree").textContent = F.si(T, "s", { prefix: "p" });
    $("vtours").textContent = F.sci(ES.toursAvantEffondrement(r0), 2);
  }
  r0sl.oninput = draw; draw();
})();

/* ---------- le principe d'incertitude : énergie en fonction de la taille ---------- */
(() => {
  const svg = $("en"), asl = $("asl"), N = 200, LO = 0.3, HI = 4, YLO = -30, YHI = 30;
  function draw() {
    const a = +asl.value * A0, e = ES.energieAtome(a);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [LO, HI], label: t("en.x") }, y: { domain: [YLO, YHI], label: t("en.y") } });
    Plot.el("line", { x1: x(LO), x2: x(HI), y1: y(0), y2: y(0), class: "zero" }, g);
    const clip = v => Math.max(YLO, Math.min(YHI, v));
    [["cinetique", "c-warn", "stroke dash"], ["potentielle", "c-label-2", "stroke dash"], ["totale", "c-tint", "stroke bold"]].forEach(([k, cls, st]) => {
      const pts = Array.from({ length: N + 1 }, (_, i) => { const u = LO + (HI - LO) * i / N; return [x(u), y(clip(ES.energieAtome(u * A0)[k] / QE))]; });
      Plot.el("path", { d: Plot.path(pts), class: st }, Plot.el("g", { class: cls }, g));
    });
    Plot.el("circle", { cx: x(a / A0), cy: y(clip(e.totale / QE)), r: 5, class: "dot" }, g);
    $("aread").textContent = F.si(a, "m", { prefix: "p" });
    $("vc").textContent = eV(e.cinetique);
    $("vp").textContent = eV(e.potentielle);
    $("ve").textContent = eV(e.totale);
    $("fe").textContent = t("en.f.e", { a: F.si(ES.rayonOptimal(), "m", { prefix: "p" }), e: eV(ES.energieAtome(ES.rayonOptimal()).totale) });
  }
  asl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["thomson", 1904, "idea"], ["rutherford", 1911, "experiment"], ["bohr", 1913, "idea"], ["heisenberg", 1927, "idea"], ["dyson", 1967, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["unites"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["earnshaw", "a"], ["thomson", "c"], ["rayonne", "b"], ["duree", "d"], ["compromis", "a"], ["leger", "c"], ["facteur", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 54 });
})();
</script>
