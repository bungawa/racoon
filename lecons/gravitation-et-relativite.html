<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), Gr = Gravitation, Cst = Constantes;
const sec = rad => (rad / Gr.ARCSEC >= 1e-3 ? F.num(rad / Gr.ARCSEC, 3) : F.sci(rad / Gr.ARCSEC, 2)) + "″";

/* ---------- déviation de la lumière ---------- */
(() => {
  const svg = $("dev"), ms = $("msl"), bs = $("bsl");
  /* 1919: Sobral 4-inch 1,98 ± 0,12″, Príncipe 1,61 ± 0,30″, probable errors, starlight grazing the Sun (b ≈ R_sun)
     (Dyson, Eddington and Davidson 1920, as re-read by Gilmore and Tausch-Pebody 2020). The Sobral astrograph (0,93″) is not drawn. */
  const ECLIPSE = [[1.98, 0.12], [1.61, 0.30]];
  function draw() {
    const M = Math.pow(10, +ms.value), GM = Cst.GM_sun * M, k = Math.pow(10, +bs.value), b = k * Cst.R_sun, d = Gr.deflection(GM, b);
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, x: { scale: "log", domain: [1, 1000], label: t("dev.x") }, y: { scale: "log", domain: [1e-3, 10], label: t("dev.y") } });
    const curve = (f, cls) => { let p = ""; for (let i = 0; i <= 60; i++) { const kk = Math.pow(10, 3 * i / 60); p += (i ? "L" : "M") + x(kk).toFixed(1) + " " + y(Math.max(1e-3, f(kk))).toFixed(1); } Plot.el("path", { d: p, class: cls }, g); };
    curve(kk => Gr.deflection(Cst.GM_sun, kk * Cst.R_sun).einstein / Gr.ARCSEC, "curve");
    curve(kk => Gr.deflection(Cst.GM_sun, kk * Cst.R_sun).newton / Gr.ARCSEC, "ref");
    ECLIPSE.forEach(([v, u], i) => {
      const xe = x(1.12 + 0.12 * i);
      Plot.el("line", { x1: xe, x2: xe, y1: y(v - u), y2: y(v + u), class: "axis" }, g);
      Plot.el("circle", { cx: xe, cy: y(v), r: 3, class: "zero" }, g);
    });
    Plot.el("text", { x: x(1.5), y: y(2.6), class: "note" }, g).textContent = t("dev.note.1919");
    if (Math.abs(+ms.value) < 0.05) Plot.el("circle", { cx: x(k), cy: y(Math.max(1e-3, d.einstein / Gr.ARCSEC)), r: 6, class: "dot" }, g);
    $("mread").textContent = t("dev.mread", { kg: F.qty(F.sci(M * Gr.M_SUN, 2), "kg"), m: M >= 0.01 ? F.num(M, 2) : F.sci(M, 2) });
    $("bread").textContent = t("dev.bread", { k: F.num(k, 3), b: F.si(b, "m") });
    $("vphi").textContent = F.sci(Gr.phi(GM, b), 2);
    $("vn").textContent = sec(d.newton);
    $("ve").textContent = sec(d.einstein);
    $("fe").textContent = t("dev.f.cm", { L: F.si(0.01 / d.einstein, "m") });
  }
  ms.oninput = bs.oninput = draw; draw();
})();

/* ---------- ce que Newton néglige, chiffré ---------- */
(() => {
  const E = Gr.echelles(), ROWS = ["sol", "soleil", "trajet", "eau"], txt = textOf("nb.rows", ROWS);
  const V = {
    sol: F.sci(E.pomme.phi, 2),
    soleil: F.sci(Gr.phi(Cst.GM_sun, Cst.R_sun), 2),
    trajet: F.qty(F.num(Gr.delay(Cst.au), 3), "s"),
    eau: F.sci(Gr.massOf(4180 * 10), 2),
  };
  $("nombres").innerHTML = ROWS.map(id => `<div><span class="k">${txt[id].k}</span><span>${txt[id].text.replace("{v}", V[id])}</span></div>`).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["einstein1907", 1907, "idea"], ["einstein1915", 1915, "idea"], ["eclipse", 1919, "experiment"], ["pound", 1960, "experiment"], ["ondes", 2017, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gps", "lentilles"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["instant", "a"], ["lumiere", "a"], ["facteur", "a"], ["eau", "a"], ["vitesse", "a"], ["newton", "a"], ["quantique", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 78 });
})();
</script>
