<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, K = Constantes, S = Q.SEMI;

/* ---------- intrinsic densities of three semiconductors ---------- */
(() => {
  const svg = $("fig"), st = $("st");
  const mats = [["Ge", "c-warn", "g"], ["Si", "c-label", "s"], ["GaAs", "c-tint", "a"]];
  function draw() {
    const T = +st.value;
    svg.innerHTML = "";
    const G = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { l: 64, b: 44 }, x: { domain: [150, 700], label: t("fig.xaxis") }, y: { scale: "log", domain: [1e4, 1e24], label: t("fig.yaxis") } });
    for (const [id, cls, k] of mats) {
      const pts = [];
      for (let TT = 150; TT <= 700; TT += 5) { const n = Q.densiteIntrinseque(S[id], TT); if (n >= 1e4 && n <= 1e24) pts.push([G.x(TT), G.y(n)]); }
      Plot.el("path", { d: Plot.path(pts), class: "stroke " + cls }, G.g);
      const n = Q.densiteIntrinseque(S[id], T);
      if (n >= 1e4 && n <= 1e24) Plot.el("circle", { cx: G.x(T), cy: G.y(n), r: 4, class: "fill " + cls }, G.g);
      $("v" + k).textContent = F.qty(F.sci(n, 2), "m⁻³");
      $("f" + k).textContent = t("fig.f.n", { eg: F.si(S[id].Eg / K.e, "eV"), r: F.sci(S[id].atomes / n, 1) });
    }
    $("str").innerHTML = F.kelvin(T);
  }
  st.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  $("sys1").innerHTML = t("sys1.body", { kT: F.si(K.k_B * 300 / K.e, "eV"), r: F.num(S.Si.Eg / (K.k_B * 300), 2) });
  $("sys2").innerHTML = t("sys2.body", { n: F.sci(Q.densiteIntrinseque(S.Si, 30), 1) });
  $("sys3").innerHTML = t("sys3.body", { n: F.sci(Q.densiteIntrinseque(S.Si, 300), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["halbleiter", 1911, "idea"], ["wilson", 1931, "idea"], ["dresselhaus", 1955, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["silicium"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["trou", "b"], ["paire", "d"], ["produit", "a"], ["gap", "c"], ["froid", "b"], ["equilibre", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1401 });
})();
</script>
