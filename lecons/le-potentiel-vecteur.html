<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const MI = MagInd, AV = AnaVec;

/* ---------- une famille de potentiels du même champ uniforme B0 = 1 T selon z (positions en m) ---------- */
(() => {
  const svg = $("jauge"), O = { W: 640, H: 400, x0: -0.16, x1: 0.16, y0: -0.1, y1: 0.1 }, B0 = 1;
  let c, centre = [0.04, 0.02];
  function draw() {
    const lam = +$("lam").value, nu = +$("nu").value, R = +$("rr").value, A = MI.potentielUniforme(B0, lam, nu);
    c = CarteChamp.carte(svg, O);
    CarteChamp.fleches(c, A, 20, 12, { cls: "c-label" });
    const cercle = AV.cercle(centre, R), pts = Array.from({ length: 121 }, (_, i) => cercle(i / 120));
    Plot.el("polyline", { points: pts.map(p => c.sx(p[0]).toFixed(1) + "," + c.sy(p[1]).toFixed(1)).join(" "), class: "stroke bold" }, c.layer("c-ok"));
    CarteChamp.point(c, centre, 3, "c-ok", "");
    CarteChamp.point(c, [0, 0], 3, "c-label", "z", -8);
    const circ = AV.circulation(A, cercle, 2000), flux = Math.PI * R * R * B0;
    $("lamv").textContent = F.fix(lam, 2); $("nuv").textContent = F.fix(nu, 2); $("rrv").textContent = F.si(R, "m");
    $("vcirc").textContent = F.si(circ, "T·m²");
    $("fcirc").textContent = t("ja.f.circ", { flux: F.si(flux, "T·m²") });
    $("vrot").textContent = F.si(AV.rotationnel(p => A(p), [centre[0], centre[1], 0], 1e-4)[2], "T");
    $("vdiv").textContent = F.si(AV.divergence(A, centre, 1e-4) + 0, "T");
    $("fdiv").textContent = t(Math.abs(nu) < 1e-9 ? "ja.f.div.coulomb" : "ja.f.div.autre");
    $("jaread").innerHTML = t(Math.abs(nu) > 1e-9 ? "ja.read.nu" : Math.abs(lam + 1) < 1e-9 ? "ja.read.moins" : Math.abs(lam - 1) < 1e-9 ? "ja.read.plus" : Math.abs(lam) < 1e-9 ? "ja.read.sym" : "ja.read.mix");
  }
  ["lam", "nu", "rr"].forEach(id => $(id).oninput = draw);
  CarteChamp.survol(svg, () => c, p => { centre = [Math.max(O.x0, Math.min(O.x1, p[0])), Math.max(O.y0, Math.min(O.y1, p[1]))]; draw(); });
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["neumann", 1845, "idea"], ["maxwell", 1855, "idea"], ["ab", 1959, "idea"], ["tonomura", 1986, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["elements"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["div", "c"], ["gradient", "a"], ["constant", "b"], ["circulation", "d"], ["norme", "a"], ["coulomb", "c"], ["nul", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 141 });
})();
</script>
