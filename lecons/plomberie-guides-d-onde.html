<script src="/racoon/i18n.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = OndesMilieux, A = 22.86e-3, B = 10.16e-3, F0 = 10e9;               // the R100 guide, holes designed for 10 GHz

/* ---------- le système décrit : un guide et un câble à 10 GHz, même champ de claquage ---------- */
(() => {
  const Emax = 3e6, sigma = 5.8e7, g = M.guideRect(A, B, F0), coax = M.ligneCoaxiale(1.52e-3, 3.5e-3);
  const Pg = g.puissance(Emax), Pc = M.puissanceCoaxiale(coax, Emax).P;
  const ag = M.attenuationTE10(g, sigma), ac = M.pertesCoaxiale(coax, F0, sigma);
  $("sys1").innerHTML = t("sys1.body", { E: F.si(Emax, "V·m⁻¹", { prefix: "M" }), f: F.si(F0, "Hz", { prefix: "G" }),
    Pg: F.si(Pg, "W", { sig: 2 }), Pc: F.si(Pc, "W", { sig: 2 }), r: F.num(Pg / Pc, 2), z0: F.si(coax.z0, "Ω", { sig: 2 }),
    fc11: F.si(coax.fcTE11, "Hz", { prefix: "G", sig: 2 }), ag: F.qty(F.num(ag.dB, 2), "dB·m⁻¹"), ac: F.qty(F.num(ac.dBparMetre, 2), "dB·m⁻¹"),
    delta: F.si(ag.delta, "m", { prefix: "µ", sig: 2 }) });
})();

/* ---------- le coupleur directif ---------- */
(() => {
  const trace = $("trace"), sn = $("sn"), sf = $("sf"), seg = $("poids"), d = M.guideRect(A, B, F0).lambdaG / 4, YMAX = 60;
  let poids = "uniforme";
  const dir = (f, N) => M.coupleurTrous({ guide: M.guideRect(A, B, f), d, N, poids }).directivite;
  function draw() {
    const N = +sn.value, f = +sf.value * 1e9;
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [8.2, 12.4], label: t("fig.xaxis") }, y: { domain: [0, YMAX], label: t("fig.yaxis") } });
    const fs = Array.from({ length: 421 }, (_, i) => 8.2 + i * 0.01);
    Plot.el("path", { d: Plot.path(fs.map(x => [P.x(x), P.y(Math.min(YMAX, dir(x * 1e9, N)))])), class: "curve" }, P.g);
    Plot.el("line", { x1: P.x(f / 1e9), x2: P.x(f / 1e9), y1: P.y(0), y2: P.y(YMAX), class: "stroke c-warn" }, P.g);
    const D = dir(f, N), c = M.coupleurTrous({ guide: M.guideRect(A, B, f), d, N, poids });
    let n = 0; fs.forEach(x => { if (dir(x * 1e9, N) >= 20) n++; });
    $("snr").textContent = F.num(N, 1);
    $("sfr").textContent = F.si(f, "Hz", { prefix: "G" });
    $("vdir").textContent = Number.isFinite(D) ? t("fig.v.dir", { v: F.num(D, 3) }) : "∞";
    $("fdir").textContent = t("fig.f.dir", { v: F.num(c.arriere / c.avant, 2) });
    $("vd").textContent = F.qty(F.num(1000 * d, 3), "mm");
    $("fd").textContent = t("fig.f.d", { f: F.si(F0, "Hz", { prefix: "G" }) });
    $("vb").textContent = F.si(n === 0 ? 0 : (n - 1) * 0.01e9, "Hz", { prefix: "G", sig: 2 });
    $("fb").textContent = t("fig.f.bande");
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === poids)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { poids = x.dataset.m; draw(); });
  sn.oninput = sf.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["magnetron", 1940, "experiment"], ["bethe", 1944, "idea"], ["spencer", 1945, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["four"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["claquage", "b"], ["pertes", "d"], ["bride", "a"], ["charge", "c"], ["deux", "b"], ["frequence", "a"], ["sens", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 246 });
})();
</script>
