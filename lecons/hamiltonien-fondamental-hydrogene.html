<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes;
const A = Q.aHyperfinH, H = Q.hamiltonienHyperfin(A).map(l => l.map(z => z.re)), T = K.h / (4 * A);

/* ---------- the spins flip-flop: probabilities of the four base states in time ---------- */
(() => {
  const svg = $("courbe"), dep = $("dep"), sT = $("sT"), X1 = 1.5;
  const DEPARTS = { "1": [0, 1, 0, 0], "0": [1, 0, 0, 0], x: Q.etatProduit(Q.etatSpinDemi(Math.PI / 2, 0), Q.etatSpinDemi(0, 0)).map(z => z.re) };
  let d = "1";
  function draw() {
    const psi0 = DEPARTS[d], f = +sT.value;
    svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44, l: 56 }, x: { domain: [0, X1 * T * 1e9], label: t("fig.x") }, y: { domain: [0, 1], label: t("fig.y") } });
    const c = [[], [], []];
    for (let k = 0; k <= 300; k++) {
      const tt = X1 * T * k / 300, v = Q.evolutionPropre(H, psi0, tt).map(Cx.abs2), x = o.x(tt * 1e9);
      c[0].push([x, o.y(v[1])]); c[1].push([x, o.y(v[2])]); c[2].push([x, o.y(v[0] + v[3])]);
    }
    Plot.el("path", { d: Plot.path(c[2]), class: "stroke dash c-tint" }, o.g);
    Plot.el("path", { d: Plot.path(c[0]), class: "stroke bold c-ok" }, o.g);
    Plot.el("path", { d: Plot.path(c[1]), class: "stroke bold c-warn" }, o.g);
    const v = Q.evolutionPropre(H, psi0, f * T), P = v.map(Cx.abs2);
    Plot.el("line", { x1: o.x(f * T * 1e9), x2: o.x(f * T * 1e9), y1: o.y(0), y2: o.y(1), class: "stroke thin dash c-label-2" }, o.g);
    $("sTr").textContent = F.si(f * T, "s");
    $("vp").textContent = P.map(p => F.fix(p, 3)).join(" ; "); $("fp").textContent = t("fig.f.p");
    const sz = Q.appliquer(Q.sigmaElectron("z"), v), m = v.reduce((a, z, i) => a + Cx.mul(Cx.conj(z), sz[i]).re, 0);
    $("vs").textContent = F.fix(m, 3); $("fs").textContent = t("fig.f.sz");
    $("vT").textContent = F.si(T, "s"); $("fT").textContent = t("fig.f.T", { f: F.si(Q.frequenceHyperfineH, "Hz") });
    dep.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.d === d)));
  }
  dep.querySelectorAll("button").forEach(x => x.onclick = () => { d = x.dataset.d; draw(); });
  sT.oninput = draw; draw();
})();

/* ---------- the system described: the size of A against the atom ---------- */
(() => {
  $("sys1").innerHTML = t("sys1.body", { A: F.si(A, "J"), r: F.sci(A / (13.6 * K.e), 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rabi34", 1934, "experiment"], ["rmn", 1937, "experiment"], ["nobel", 1944, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["maser", "chimie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["symetrie", "c"], ["pp", "a"], ["pm", "b"], ["dirac", "d"], ["echange", "a"], ["periode", "c"], ["moyenne", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1202 });
})();
</script>
