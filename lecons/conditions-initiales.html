<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;
const signed = (s, v) => (v < 0 ? F.MINUS : "") + s(Math.abs(v));

/* ---------- §21-4 : du lancer (x₀, v₀) à l'amplitude, la phase, l'énergie, le portrait de phase ---------- */
(() => {
  const K = 20, M = 0.2, W = Osc.pulsation(K, M), T0 = 2 * Math.PI / W, Q = 10;     // ω₀ = 10 rad·s⁻¹ ; frottement fluide de facteur Q = 10
  const FR = ["non", "oui"]; let frott = "non";
  function upd() {
    FR.forEach(f => $("f-" + f).setAttribute("aria-pressed", String(f === frott)));
    const x0 = +$("x0").value / 100, v0 = +$("v0").value / 100, mv = Osc.mouvement(W, x0, v0), E = Osc.energie(K, M, x0, v0);
    const TEND = 2 * T0, N = 400, ts = Array.from({ length: N + 1 }, (_, i) => TEND * i / N);
    /* the damped motion from the same launch: ẍ = −ω₀²x − (ω₀/Q)ẋ, step by step */
    const damped = Integ.run("leapfrog", (tt, x, v) => [-W * W * x[0] - W / Q * v[0]], { t: 0, x: [x0], v: [v0] }, T0 / 400, 2400, { vdep: true });
    /* x(t) and its two parts */
    let svg = $("xt"); svg.innerHTML = "";
    let o = Plot.axes(svg, { fmt: F, w: 320, h: 280, pad: { b: 44, l: 48 }, x: { domain: [0, TEND], label: t("xt.xaxis") }, y: { domain: [-8, 8], label: t("xt.yaxis") } });
    Plot.el("path", { d: path(ts.map(tt => [o.x(tt), o.y(100 * mv.A * Math.cos(W * tt))])), class: "stroke thin dash c-label-2" }, o.g);
    Plot.el("path", { d: path(ts.map(tt => [o.x(tt), o.y(100 * mv.B * Math.sin(W * tt))])), class: "stroke thin c-ok" }, o.g);
    if (frott === "oui") Plot.el("path", { d: path(damped.t.filter(tt => tt <= TEND).map((tt, k) => [o.x(tt), o.y(100 * damped.x[k][0])])), class: "ref" }, o.g);
    Plot.el("path", { d: path(ts.map(tt => [o.x(tt), o.y(100 * mv.x(tt))])), class: "curve" }, o.g);
    Plot.el("circle", { cx: o.x(0), cy: o.y(100 * x0), r: 5, class: "dot" }, o.g);
    /* phase portrait (x, v) */
    svg = $("phase"); svg.innerHTML = "";
    o = Plot.axes(svg, { fmt: F, w: 320, h: 280, pad: { b: 44, l: 48 }, x: { domain: [-8, 8], label: t("phase.xaxis") }, y: { domain: [-80, 80], label: t("phase.yaxis") } });
    const ring = Array.from({ length: 201 }, (_, i) => { const tt = T0 * i / 200; return [o.x(100 * mv.x(tt)), o.y(100 * mv.v(tt))]; });
    if (frott === "oui") Plot.el("path", { d: path(damped.t.map((tt, k) => [o.x(100 * damped.x[k][0]), o.y(100 * damped.v[k][0])])), class: "ref" }, o.g);
    Plot.el("path", { d: path(ring), class: "curve" }, o.g);
    Plot.el("circle", { cx: o.x(100 * x0), cy: o.y(100 * v0), r: 5, class: "dot" }, o.g);
    /* readouts */
    $("x0v").textContent = signed(v => F.si(v, "m"), x0);
    $("v0v").textContent = signed(v => F.si(v, "m·s⁻¹", { prefix: "" }), v0);
    $("va").textContent = F.si(mv.a, "m");
    $("fa").textContent = t("ci.f.a", { A: signed(v => F.si(v, "m"), mv.A), B: signed(v => F.si(v, "m"), mv.B) });
    $("vphi").textContent = mv.a === 0 ? "–" : signed(v => F.qty(F.num(v, 3), "rad"), mv.phi);
    $("fphi").textContent = mv.a === 0 ? t("ci.f.phi0") : t("ci.f.phi", { d: signed(v => F.num(v, 3) + "°", mv.phi * 180 / Math.PI) });
    $("vE").textContent = F.si(E, "J");
    $("vEc").textContent = E === 0 ? "–" : F.qty(F.num(0.5 * M * v0 * v0 / E * 100, 3), "%");
  }
  FR.forEach(f => $("f-" + f).onclick = () => { frott = f; upd(); });
  $("x0").oninput = $("v0").oninput = upd; upd();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["leibniz", 1686, "idea"], ["laplace", 1814, "idea"], ["poincare", 1881, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["marteau", "meteo"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["repos", "b"], ["lance", "d"], ["mixte", "a"], ["double", "c"], ["moitie", "b"], ["spirale", "a"], ["memeE", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 214 });
})();
</script>
