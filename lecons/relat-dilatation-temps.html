<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, c = Constantes.c;
const TAU_MU = 2.1969811e-6, MC2_MU = 105.6583755;                      // s, mean proper life (PDG 2025); MeV, rest energy (PDG)
/* val.15.5b: 1,815 MeV per g·cm⁻² at minimum ionisation in air (PDG) times the air column atm/g0 = 1,03 × 10⁴ kg·m⁻² gives 1,9 GeV, γ ≈ 18 */
const gammaTxt = v => { const d = R.retard(v) / (1 - R.retard(v)); return d < 1e-4 ? t("fig.gpetit", { d: F.sci(d, 2) }) : F.num(R.gamma(v), 5); };  // γ − 1 = (1 − 1/γ)·γ

/* ---------- l'horloge de lumière vue du sol ---------- */
(() => {
  const svg = $("horloge"), sp = $("sp"), seg = $("presets"), L = 1;
  const PRESETS = { voiture: 30, avion: 250, gps: 3874, muon: 0.995 * c, cern: R.deCelerite(Math.sqrt(29.33 ** 2 - 1)) };
  const toP = v => Math.log10(R.gamma(v) * v / c);
  let actif = null;
  function draw() {
    const p = Math.pow(10, +sp.value), v = R.deCelerite(p), h = R.horlogeLumiere(L, v);
    /* one tick seen from the ground: up to the far mirror, back down; the drawing keeps L at 140 px unless the tick is too wide */
    const bg = h.demi.dx / L, s = Math.min(140, 520 / Math.max(1e-9, 2 * bg)), x0 = 60, yb = 190, yt = yb - s * L, dx = s * h.demi.dx;
    svg.innerHTML = "";
    [0, 1, 2].forEach(k => {
      const x = x0 + k * dx;
      Plot.el("line", { x1: x, x2: x, y1: yb, y2: yt, class: "stroke thin dash c-label-2" }, svg);
      [yb, yt].forEach(y => Plot.el("line", { x1: x - 18, x2: x + 18, y1: y, y2: y, class: "stroke bold c-label-2" }, svg));
    });
    Plot.el("path", { d: Plot.path([[x0, yb], [x0 + dx, yt], [x0 + 2 * dx, yb]]), class: "stroke bold c-tint" }, svg);
    Plot.fleche(svg, [x0, 208], [x0 + Math.max(24, Math.min(120, 2 * dx)), 208], { cls: "c-label-2" });
    $("spr").textContent = v < 0.01 * c ? F.si(v, "m·s⁻¹") : t("fig.vbeta", { b: F.num(v / c, v > 0.999 * c ? 6 : 4) });
    $("vg").textContent = gammaTxt(v);
    $("fg").textContent = t("fig.f.gamma", { b2: F.sci((v / c) ** 2, 2) });
    $("vtic").textContent = F.si(h.vue, "s", { prefix: "n", sig: v < 0.01 * c ? 4 : 3 });
    $("ftic").textContent = t("fig.f.tic", { v: F.si(h.propre, "s", { prefix: "n", sig: 4 }) });
    const r = R.retard(v);
    $("vjour").textContent = 86400 * r < 3600 ? F.si(86400 * r, "s") : F.qty(F.num(24 * r, 3), "h");
    $("fjour").textContent = t("fig.f.jour", { r: F.sci(r, 2) });
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.p === actif)));
  }
  seg.querySelectorAll("button").forEach(x => x.onclick = () => { actif = x.dataset.p; sp.value = toP(PRESETS[actif]).toFixed(2); draw(); });
  sp.oninput = () => { actif = null; draw(); };
  draw();
})();

/* ---------- le système décrit : une horloge de satellite GPS ---------- */
(() => {
  const a = 26561750, v = Math.sqrt(Constantes.GM_E / a), r = R.retard(v);     // GPS semi-major axis (Ashby 2003), circular orbit
  const grav = Constantes.GM_E * (1 / Constantes.R_E_mean - 1 / a) / (c * c);
  $("sys1").innerHTML = t("sys1.body", { a: F.si(a, "m", { prefix: "k", sig: 5 }), v: F.si(v, "m·s⁻¹", { prefix: "k" }), b2: F.sci((v / c) ** 2, 2),
    j: F.si(86400 * r, "s", { prefix: "µ", sig: 2 }), phi: F.sci(grav, 2), g: F.si(86400 * grav, "s", { prefix: "µ", sig: 3 }) });
})();

/* ---------- les muons : survivre à la traversée ---------- */
(() => {
  const svg = $("muons"), sg = $("sg"), D = 1e4;
  function draw() {
    const g = Math.pow(10, +sg.value), v = R.deCelerite(Math.sqrt(g * g - 1)), m = R.survie(D, v, TAU_MU);
    svg.innerHTML = "";
    const P = Plot.axes(svg, { fmt: F, w: 640, h: 260, pad: { l: 64, b: 44 }, x: { domain: [0, 15], label: t("fig2.xaxis") }, y: { scale: "log", domain: [1e-12, 1], label: t("fig2.yaxis") } });
    const ds = Array.from({ length: 151 }, (_, i) => i * 0.1), clip = y => P.y(Math.max(1e-12, y));
    Plot.el("path", { d: Plot.path(ds.map(d => [P.x(d), clip(R.survie(1000 * d, v, TAU_MU).relativiste)])), class: "stroke bold c-tint" }, P.g);
    Plot.el("path", { d: Plot.path(ds.map(d => [P.x(d), clip(R.survie(1000 * d, v, TAU_MU).galilee)])), class: "stroke bold c-warn" }, P.g);
    Plot.el("line", { x1: P.x(10), x2: P.x(10), y1: P.y(1e-12), y2: P.y(1), class: "zero" }, P.g);
    $("sgr").textContent = t("fig2.gv", { g: F.num(g, 3), b: F.num(v / c, 6) });
    $("vlibre").textContent = F.si(m.libre, "m");
    $("flibre").textContent = t("fig2.f.libre", { e: F.qty(F.num(g * MC2_MU / 1000, 2), "GeV"), l0: F.si(v * TAU_MU, "m") });
    $("vrel").textContent = m.relativiste > 0.01 ? F.num(100 * m.relativiste, 3) + " %" : F.sci(m.relativiste, 2);
    $("vgal").textContent = F.sci(m.galilee, 2);
  }
  sg.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["einstein", 1905, "idea"], ["ives", 1938, "experiment"], ["rossi", 1941, "experiment"], ["frisch", 1963, "experiment"], ["cern", 1977, "experiment"], ["chou", 2010, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gps", "g2"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["transverse", "c"], ["vaisseau", "a"], ["reciproque", "d"], ["ressort", "b"], ["muons", "c"], ["propre", "a"], ["avion", "d"], ["gps", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 154 });
})();
</script>
