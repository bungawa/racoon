<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const keyed = (id, k, ids) => { const txt = textOf(k, ids); $(id).innerHTML = ids.map(i => `<div><span class="k">${txt[i].k}</span><span>${txt[i].v}</span></div>`).join(""); };

keyed("organes", "s2.organes", ["comp", "ech", "det", "tuy"]);

/* ---------- §3 : un organe de l'air dans le diagramme (T, s) ---------- */
(() => {
  const A = Thermo.AIR, T0 = 300, P = Plot.el, path = Plot.path;
  const DEF = { compresseur: { T1: 300, r: 10, eta: 0.85 }, turbine: { T1: 1400, r: 10, eta: 0.9 }, detendeur: { T1: 300, r: 10, eta: 1 } };
  let mode = "compresseur";
  const set = m => { mode = m; $("t1").value = DEF[m].T1; $("rp").value = DEF[m].r; $("eta").value = DEF[m].eta; $("eta").disabled = m === "detendeur"; draw(); };
  function draw() {
    const T1 = +$("t1").value, r = +$("rp").value, eta = +$("eta").value;
    const [p1, p2] = mode === "compresseur" ? [1e5, r * 1e5] : [r * 1e5, 1e5];
    const c = Thermo.composant({ type: mode, T1, p1, p2, eta: mode === "detendeur" ? undefined : eta });
    if (Math.abs(c.sc) < 1e-6) c.sc = 0;                 // isentropic: rounding noise, not entropy
    const Ts = [T1, c.T2, c.T2s], lo = Math.max(50, 0.8 * Math.min(...Ts)), hi = 1.12 * Math.max(...Ts);
    const s0 = -150, s1 = Math.max(250, c.sc + 200);
    const svg = $("ts"); svg.innerHTML = "";
    const o = Plot.axes(svg, { fmt: F, w: 640, h: 320, pad: { b: 44, l: 56 }, x: { domain: [s0, s1], label: t("ts.x") }, y: { domain: [lo, hi], label: t("ts.y") } });
    const iso = (p, lab) => {                          // s(T) = cp ln(T/T1) − r ln(p/p1), clipped to the frame
      const pts = [];
      for (let i = 0; i <= 120; i++) { const T = lo + (hi - lo) * i / 120, s = A.cp * Math.log(T / T1) - A.r * Math.log(p / p1);
        if (s >= s0 && s <= s1) pts.push([o.x(s), o.y(T)]); }
      if (pts.length > 1) { P("path", { d: path(pts), class: "curve" }, o.g); const e = pts[pts.length - 1];
        P("text", { x: e[0] - 6, y: e[1] + 16, "text-anchor": "end", class: "note" }, o.g).textContent = lab; }
    };
    iso(p1, t("ts.p1")); iso(p2, t("ts.p2"));
    const pt = (s, T, lab) => { P("circle", { cx: o.x(s), cy: o.y(T), r: 5, class: "dot" }, o.g);
      P("text", { x: o.x(s) + 8, y: o.y(T) - 8, class: "note" }, o.g).textContent = lab; };
    if (mode !== "detendeur") { P("line", { x1: o.x(0), x2: o.x(0), y1: o.y(T1), y2: o.y(c.T2s), class: "stroke thin dash c-label-2" }, o.g); pt(0, c.T2s, "2s"); }
    Plot.fleche(o.g, [o.x(0), o.y(T1)], [o.x(c.sc), o.y(c.T2)], { cls: "c-warn", min: 4 });
    pt(0, T1, "1"); pt(c.sc, c.T2, "2");
    $("t1v").innerHTML = F.kelvin(T1); $("rpv").textContent = F.num(r, 3); $("etav").textContent = mode === "detendeur" ? "–" : F.fix(eta, 2);
    $("vT2").innerHTML = F.kelvin(c.T2); $("fT2").innerHTML = mode === "detendeur" ? "" : t("ts.f.T2", { t: F.kelvin(c.T2s) });
    $("vw").textContent = F.si(c.w, "J·kg⁻¹", { sig: 3 }); $("fw").textContent = t("ts.f.w", { d: F.si(c.w - c.ws, "J·kg⁻¹", { sig: 3 }) });
    $("vsc").textContent = F.si(c.sc, "J·kg⁻¹·K⁻¹", { sig: 3 }); $("vperdu").textContent = F.si(T0 * c.sc, "J·kg⁻¹", { sig: 3 });
    $("orgseg").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
  }
  $("orgseg").querySelectorAll("button").forEach(b => b.onclick = () => set(b.dataset.m));
  ["t1", "rp", "eta"].forEach(id => $(id).oninput = draw);
  set("compresseur");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["parsons1884", 1884, "experiment"], ["gouy1889", 1889, "idea"], ["stodola1905", 1905, "idea"], ["whittle1937", 1937, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["turbine", "air", "audit"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["enthalpie", "b"], ["detendeur", "c"], ["sc", "b"], ["compresseur", "d"], ["turbine", "a"], ["tuyere", "d"], ["perdu", "a"], ["stationnaire", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 7101 });
})();
