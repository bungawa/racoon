<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, R = 0.02, SQ = 5e-18;                    // a sphere of radius 2 cm, ping-pong ball size; SQUID floor after days of averaging (T)
$("sys1").innerHTML = t("sys.body", { k: F.sci(Q.momentLondon(1), 4), R: F.si(R, "m") });
(() => {
  const svg = $("london"), sw = $("sw");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 64 }, x: { domain: [0.1, 1e4], scale: "log", label: t("fig.x") }, y: { domain: [1e-18, 1e-6], scale: "log", label: t("fig.y") } });
  Plot.el("path", { d: Plot.path([0.1, 1e4].map(w => [x(w), y(Q.momentLondon(w))])), class: "stroke c-tint" }, g);
  for (const [k, B] of [["sq", SQ], ["terre", 5e-5 > 1e-6 ? 1e-6 : 5e-5]]) if (k === "sq") { Plot.el("line", { x1: x(0.1), x2: x(1e4), y1: y(B), y2: y(B), class: "stroke thin dash c-label-2" }, g);
    const tx = Plot.el("text", { x: x(0.15), y: y(B) - 4, class: "tick" }, g); tx.textContent = t("fig.ref." + k); }
  const dot = Plot.el("circle", { r: 6, class: "dot c-warn" }, g);
  function draw() {
    const w = 10 ** +sw.value, B = Q.momentLondon(w);
    dot.setAttribute("cx", x(w)); dot.setAttribute("cy", y(B));
    $("swr").textContent = F.si(w, "rad·s⁻¹");
    $("vb").textContent = F.si(B, "T");
    $("fb").textContent = t("fig.f.b", { r: F.sci(B / 5e-5, 2) });
    $("vf").textContent = F.si(B * Math.PI * R * R, "Wb");
    $("ff").textContent = t("fig.f.f", { n: F.sci(B * Math.PI * R * R / Q.quantumFlux(), 2) });
    $("vt").textContent = F.si(w * R, "m·s⁻¹");
    $("ft").textContent = t("fig.f.t");
  }
  sw.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["madelung", 1926, "idea"], ["london", 1935, "idea"], ["gpb", 2004, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gyro"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["continuite", "b"], ["newton", "a"], ["quantique", "c"], ["rot", "d"], ["moment", "a"], ["materiau", "b"], ["visqueux", "a"], ["phase", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 218 });
})();
</script>
