<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-quantique-deux-etats" data-i18n="monde.quantique-deux-etats"></a><span class="aux">›</span><a href="/racoon/etape?id=colorants-et-spin-champ" data-i18n="etape.colorants-et-spin-champ"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>

    <div class="tags">
      <a class="chip t-quant" href="/racoon/atlas?piste=quant" data-i18n="tag.piste"></a>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <p data-i18n-html="s1.p2"></p>
    <div class="eq"><math display="block"><msub><mi>ω</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>A</mi></mrow><mi>ℏ</mi></mfrac><mo>,</mo><mspace width="1em"/><mi>λ</mi><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mn>2</mn><mi>A</mi></mrow></mfrac></math></div>
    <p class="validite" data-i18n-html="val.omega"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq"><math display="block"><mi>μ</mi><mo>=</mo><mo>⟨</mo><mi mathvariant="normal">I</mi><mo>|</mo><mi>q</mi><mi>x</mi><mo>|</mo><mrow><mi mathvariant="normal">I</mi><mi mathvariant="normal">I</mi></mrow><mo>⟩</mo><mo>=</mo><mfrac><mrow><mi>q</mi><mi>d</mi></mrow><mn>2</mn></mfrac></math></div>
    <p class="validite" data-i18n-html="val.mu"></p>
    <p data-i18n-html="s2.p2"></p>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <figure class="chart">
      <svg class="fig" id="fig" viewBox="0 0 520 300" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.legend.raie"></span><span class="c-label-2" data-i18n="fig.legend.bandes"></span></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" role="group" id="mol">
            <button type="button" data-m="magenta" data-i18n="fig.m.magenta"></button>
            <button type="button" data-m="malachite" data-i18n="fig.m.malachite"></button>
            <button type="button" data-m="benzene" data-i18n="fig.m.benzene"></button>
          </div>
          <div class="ctl"><div class="row"><label for="sA" data-i18n="fig.A"></label><output id="sAr" for="sA"></output></div>
            <input id="sA" type="range" min="0.8" max="1.65" step="0.005" value="1.14"></div>
          <div class="ctl"><div class="row"><label for="sd" data-i18n="fig.d"></label><output id="sdr" for="sd"></output></div>
            <input id="sd" type="range" min="0" max="1000" step="10" value="500"></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n-html="fig.k.l"></span><span class="v" id="vL"></span><span class="f" id="fL"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.vu"></span><span class="v" id="vC"></span><span class="f" id="fC"></span></div>
          <div class="stat"><span class="k" data-i18n-html="fig.k.mu"></span><span class="v" id="vM"></span><span class="f" id="fM"></span></div>
        </div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <p data-i18n-html="s4.p2"></p>
    <div class="box rem"><b data-i18n="sys.title"></b>
      <p id="sys"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/colorants-deux-etats.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/lecons/complexes.js"></script>
<script src="/racoon/quantique-deux-etats.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux, K = Constantes, eV = K.e, NM = 1e-9, PM = 1e-12;
/* measured absorption maxima, m: pararosaniline (magenta) 545 nm, malachite green 621 nm; benzene: A of the two-state model, 1,58 eV */
const A_DE = l => Q.aDepuisFrequence(K.c / l);
const PRESETS = { magenta: A_DE(545 * NM), malachite: A_DE(621 * NM), benzene: 152e3 / K.N_A };
/* absorbed band → colour seen, nm (rough guide) */
const BANDES = [[400, 424, "violet", "jaune"], [424, 491, "bleu", "orange"], [491, 570, "vert", "rouge"], [570, 585, "jaune", "violet"], [585, 647, "orange", "bleu"], [647, 700, "rouge", "vert"]];
const D_REF = 1000 * PM;

/* ---------- where the line falls, and how strong it is ---------- */
(() => {
  const svg = $("fig"), sA = $("sA"), sd = $("sd"), seg = $("mol"), X0 = 380, X1 = 780;
  let mol = "magenta";
  function draw() {
    const A = +sA.value * eV, d = +sd.value * PM, l = Q.longueurOndeTransition(2 * A), mu = Q.dipoleTransitionDeux(K.e, d), rel = (d / D_REF) ** 2;
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 520, h: 300, x: { domain: [X0, X1], label: t("fig.x"), fmt: v => F.num(v, 0) },
      y: { domain: [0, 1], label: t("fig.y"), fmt: v => F.num(v, 1) } });
    const gb = Plot.el("g", { class: "c-label-2" }, g);
    BANDES.forEach(([a, b, ab], i) => {
      Plot.el("line", { x1: x(a), x2: x(a), y1: y(0), y2: y(1), class: "stroke thin dash" }, gb);
      const e = Plot.el("text", { x: x((a + b) / 2), y: y(i % 2 ? 0.9 : 0.97), "text-anchor": "middle" }, gb); e.textContent = t("couleur." + ab);
    });
    const ln = l / NM;
    if (ln >= X0 && ln <= X1) Plot.el("line", { x1: x(ln), x2: x(ln), y1: y(0), y2: y(Math.min(1, rel)), class: "stroke bold" }, Plot.el("g", { class: "c-tint" }, g));
    const bande = BANDES.find(([a, b]) => ln >= a && ln < b);
    $("sAr").textContent = F.si(A / eV, "eV");
    $("sdr").textContent = F.si(d, "m", { prefix: "p" });
    $("vL").textContent = F.si(l, "m", { prefix: "n" });
    $("fL").textContent = t("fig.f.l", { deuxA: F.si(2 * A / eV, "eV") });
    $("vC").textContent = bande ? t("couleur." + bande[3]) : t(ln < 400 ? "fig.uv" : "fig.ir");
    $("fC").textContent = bande ? t("fig.f.vu", { ab: t("couleur." + bande[2]) }) : t("fig.f.invisible");
    $("vM").textContent = F.num(rel, 2);
    $("fM").textContent = t("fig.f.mu", { mu: F.qty(F.sci(mu, 2), "C·m") });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mol)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { mol = b.dataset.m; sA.value = (PRESETS[mol] / eV).toFixed(3); if (mol === "benzene") sd.value = "0"; draw(); });
  sA.oninput = () => { mol = ""; draw(); }; sd.oninput = draw; draw();
})();

/* ---------- the system described ---------- */
(() => {
  $("sys").innerHTML = t("sys.body", { Am: F.si(PRESETS.magenta / eV, "eV"), Av: F.si(PRESETS.malachite / eV, "eV"), Ab: F.si(PRESETS.benzene / eV, "eV"),
    kT: F.si(K.k_B * 300 / eV, "eV", { prefix: "m" }), nu: F.si(K.c / (545 * NM), "Hz") });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["perkin", 1856, "experiment"], ["fuchsine", 1858, "experiment"], ["fischer", 1877, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["ziehl", "aquariums"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["deux", "c"], ["petitA", "a"], ["couleur", "d"], ["dipole", "b"], ["benzene", "c"], ["vert", "a"], ["structure", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1005 });
})();
</script>
</body>
</html>
