<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const R = Relativite, K = Constantes, eV = K.e, c = K.c;
const MC2 = { e: K.m_e * c * c / eV, p: K.m_p * c * c / eV };          // rest energies, eV
const ev = x => F.si(x, "eV");

/* ---------- la flèche énergie-impulsion vue de deux référentiels ---------- */
(() => {
  const svg = $("plan"), sv = $("sv"), su = $("su"), seg = $("part");
  let part = "e";
  function draw() {
    const m = MC2[part], v = +sv.value / 100, u = +su.value / 100;
    const P = R.quadriImpulsion(m, v), Q = R.boostQuadri(P, u);                 // [E, pc, 0, 0] in R, then (17.12)
    const vp = R.composer(-u * c, v * c) / c, D = R.quadriImpulsion(m, vp);     // (17.8) then (17.6)
    /* the plot in units of mc²: the mass hyperbola, the light lines, the two arrows */
    const top = Math.max(4, 1.15 * Math.max(P[0], Q[0]) / m);
    svg.innerHTML = "";
    const A = Plot.axes(svg, { fmt: F, w: 640, h: 380, pad: { l: 52, b: 42 }, x: { domain: [-top, top], label: t("fig.xaxis") }, y: { domain: [0, top], label: t("fig.yaxis") } });
    const g = A.g, n = 241;
    Plot.el("line", { x1: A.x(0), x2: A.x(0), y1: A.y(0), y2: A.y(top), class: "zero" }, g);
    Plot.el("path", { d: Plot.path([[A.x(-top), A.y(top)], [A.x(0), A.y(0)], [A.x(top), A.y(top)]]), class: "stroke thin dash" }, Plot.el("g", { class: "c-label-2" }, g));
    const hyp = Array.from({ length: n }, (_, i) => { const w = -top + 2 * top * i / (n - 1); return [w, Math.sqrt(1 + w * w)]; }).filter(([, y]) => y <= top);
    Plot.el("path", { d: Plot.path(hyp.map(([x, y]) => [A.x(x), A.y(y)])), class: "curve" }, g);
    Plot.fleche(g, [A.x(0), A.y(0)], [A.x(P[1] / m), A.y(P[0] / m)], { cls: "c-tint" });
    Plot.fleche(g, [A.x(0), A.y(0)], [A.x(Q[1] / m), A.y(Q[0] / m)], { cls: "c-warn" });
    /* readouts */
    $("svr").textContent = F.num(v, 2); $("sur").textContent = F.num(u, 2);
    $("vR").textContent = t("fig.Ep", { E: ev(P[0]), p: ev(P[1]) });
    $("fR").textContent = t("fig.f.v", { v: F.num(v, 3) });
    $("vT").textContent = t("fig.Ep", { E: ev(Q[0]), p: ev(Q[1]) });
    $("fT").textContent = t("fig.f.T");
    $("vV").textContent = t("fig.Ep", { E: ev(D[0]), p: ev(D[1]) });
    $("fV").textContent = t("fig.f.v", { v: F.num(vp, 3) });
    const inv = A2 => Math.sqrt(Math.max(0, (A2[0] - A2[1]) * (A2[0] + A2[1])));
    $("vI").textContent = ev(inv(Q));
    $("fI").textContent = t("fig.f.inv", { v: ev(inv(P)) });
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === part)));
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { part = b.dataset.p; draw(); });
  sv.oninput = su.oninput = draw; draw();
})();

/* ---------- le système décrit : un proton du LHC, vu de l'anneau puis d'un proton de l'autre faisceau ---------- */
(() => {
  const m = MC2.p, E = 6.8e12, g = E / m, omb = 1 / (g * g * (1 + Math.sqrt(1 - 1 / (g * g))));   // 1 − β without cancellation
  const dE = E * omb;                                                            // E − pc = E(1 − β)
  const Ep = (2 * g * g - 1) * m;                                                // energy seen from the other beam
  $("sys1").innerHTML = t("sys1.body", { E: ev(E), m: ev(m), g: F.num(g, 4), omb: F.sci(omb, 2), dE: ev(dE), Ep: F.sci(Ep, 3) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["planck", 1906, "idea"], ["bucherer", 1908, "experiment"], ["bertozzi", 1964, "experiment"], ["lhc", 2022, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["aimants"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["hyp", "b"], ["axes", "c"], ["temps", "d"], ["vitesse", "a"], ["repos", "b"], ["photon", "c"], ["bertozzi", "d"], ["lhc", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 174 });
})();
</script>
