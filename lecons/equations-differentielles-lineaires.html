<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>

<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const path = Plot.path;

/* ---------- §21-1 : superposition — x₁ lâché sans vitesse, x₂ lancé de l'équilibre, et le mouvement lancé avec les deux ---------- */
(() => {
  const W = 2 * Math.PI, BETA = 100, H = 1e-3, N = 3000, EVERY = 5;          // période 1 s, β = 100 m⁻², 3 s
  const MODELS = ["lin", "cub"]; let model = "lin";
  const sys = () => model === "lin" ? Osc.lineaire(W) : Osc.cubique(W, BETA);
  function upd() {
    MODELS.forEach(m => $("m-" + m).setAttribute("aria-pressed", String(m === model)));
    const A = +$("amp").value / 100, S = sys();
    const s1 = { t: 0, x: [A], v: [0] }, s2 = { t: 0, x: [0], v: [W * A] }, s12 = { t: 0, x: [A], v: [W * A] };
    const [r1, r2, r12] = [s1, s2, s12].map(s => Integ.run("leapfrog", S.a, s, H, N, { every: EVERY }));
    const cm = v => v * 100, YL = Math.max(...r12.x.map(x => Math.abs(cm(x[0]))), ...r1.x.map((x, k) => Math.abs(cm(x[0] + r2.x[k][0])))) * 1.1;
    const svg = $("sup"); svg.innerHTML = "";
    const { x: X, y: Y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 280, pad: { b: 44 }, x: { domain: [0, N * H], label: t("sup.xaxis") }, y: { domain: [-YL, YL], label: t("sup.yaxis") } });
    const line = (ys, cls) => Plot.el("path", { d: path(r12.t.map((tt, k) => [X(tt), Y(ys(k))])), class: cls }, g);
    line(k => cm(r1.x[k][0]), "stroke thin c-label-2");
    line(k => cm(r2.x[k][0]), "stroke thin c-ok");
    line(k => cm(r12.x[k][0]), "curve");
    line(k => cm(r1.x[k][0] + r2.x[k][0]), "ref");
    $("ampv").textContent = F.si(A, "m");
    const gap = Osc.ecartSuperposition(S, s1, s2, H, N) * 100;                 // in %; rounding level (10⁻¹²) in scientific notation
    $("vgap").textContent = F.qty(gap < 0.01 ? F.sci(gap, 2) : F.num(gap, 2), "%");
    $("vba").textContent = model === "lin" ? "0" : F.num(BETA * A * A, 2);
    $("fba").textContent = t(model === "lin" ? "sup.f.lin" : "sup.f.cub");
  }
  MODELS.forEach(m => $("m-" + m).onclick = () => { model = m; upd(); });
  $("amp").oninput = upd; upd();
})();

/* ---------- §21-1 : correspondances mécanique ↔ électricité ---------- */
(() => {
  const ROWS = ["masse", "raideur", "position", "vitesse", "potentielle", "cinetique", "pulsation"];
  const txt = textOf("analog.rows", ROWS);
  const row = (cells, role) => `<div role="row">${cells.map((c, i) => `<span class="${i ? "v" : ""}" role="${role}">${c}</span>`).join("")}</div>`;
  $("analog").innerHTML = row([t("analog.head.role"), t("analog.head.meca"), t("analog.head.elec")], "columnheader") +
    ROWS.map(id => row([txt[id].role, txt[id].meca, txt[id].elec], "cell")).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hooke", 1678, "idea"], ["thomson", 1853, "idea"], ["feddersen", 1859, "experiment"], ["steinmetz", 1893, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["radio", "circuits"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["lineaire", "c"], ["combinaison", "a"], ["forces", "b"], ["double", "d"], ["inertie", "a"], ["raideur", "c"], ["pourquoi", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 211 });
})();
</script>
