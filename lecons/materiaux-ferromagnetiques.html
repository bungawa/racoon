<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, C = Constantes;
const AL = M.ALNICO5, KN = M.cycleModele(AL.Br, AL.Hc, M.largeurDepuisBHmax(AL.Br, AL.Hc, AL.BHmax));

/* ---------- le tableau, en SI, avec l'énergie perdue par cycle ---------- */
(() => {
  const ids = Object.keys(M.MATERIAUX), noms = textOf("mat.noms", ids);
  $("tableau").innerHTML = ids.map(id => { const m = M.MATERIAUX[id], W = 4 * m.Hc * m.Br;
    return `<div><span>${noms[id]}</span><span class="v">${t("mat.ligne", { Br: F.si(m.Br, "T", { sig: 2 }), Hc: F.si(m.Hc, "A·m⁻¹", { sig: 2 }),
      W: F.si(W, "J·m⁻³", { sig: 2 }), P: F.si(50 * W, "W·m⁻³", { sig: 2 }) })}</span></div>`; }).join("");
})();

/* ---------- l'aimant d'alnico sur un entrefer ---------- */
(() => {
  const sr = $("sr"), Hs = Array.from({ length: 300 }, (_, i) => -AL.Hc * i / 299);
  function draw() {
    const r = Math.pow(10, +sr.value), p = M.aimantEntrefer(KN.descendante, 1, r, AL.Hc), svg = $("aimant"); svg.innerHTML = "";
    const x0 = -1.1 * AL.Hc, P = Plot.axes(svg, { fmt: F, w: 640, h: 300, x: { domain: [x0, 0], label: t("fig.ax.x"), fmt: v => F.num(v / 1000, 3) },
      y: { domain: [0, 1.5], label: t("fig.ax.y") } });
    Plot.el("path", { d: Plot.path(Hs.map(H => [P.x(H), P.y(KN.descendante(H))])), class: "curve" }, P.g);
    const hyp = Hs.filter(H => H < -AL.BHmax / 1.5).map(H => [H, -AL.BHmax / H]).filter(q => q[1] <= 1.5);
    Plot.el("path", { d: Plot.path(hyp.map(q => [P.x(q[0]), P.y(q[1])])), class: "stroke thin dash c-label-2" }, P.g);
    const Hend = Math.max(x0, -1.5 * r / C.mu0);
    Plot.el("line", { x1: P.x(0), y1: P.y(0), x2: P.x(Hend), y2: P.y(-C.mu0 * Hend / r), class: "ref" }, P.g);
    Plot.el("circle", { cx: P.x(p.H), cy: P.y(p.B), r: 6, class: "dot" }, P.g);
    $("srr").textContent = F.num(r, 2);
    $("vb").innerHTML = F.si(p.B, "T", { sig: 3 });
    $("fb").innerHTML = t("fig.f.b", { H: F.si(-p.H, "A·m⁻¹", { sig: 2 }) });
    $("vbh").innerHTML = F.si(p.BH, "J·m⁻³", { sig: 3 });
    $("fbh").innerHTML = t("fig.f.bh", { p: F.num(100 * p.BH / AL.BHmax, 2) });
    $("vvol").innerHTML = F.si(p.BH / 2, "J·m⁻³", { sig: 2 });
    $("fvol").innerHTML = t("fig.f.vol");
  }
  sr.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["elmen", 1914, "experiment"], ["honda", 1917, "experiment"], ["mishima", 1931, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["micros"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["fer", "b"], ["inox", "d"], ["permalloy", "a"], ["pertes", "c"], ["entrefer", "b"], ["choix", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 374 });
})();
</script>
