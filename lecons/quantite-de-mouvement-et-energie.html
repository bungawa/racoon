<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const DEG = 180 / Math.PI;

/* ---------- choc élastique frontal : part de l'énergie transmise à une cible au repos ---------- */
(() => {
  const svg = $("tchart"), sl = $("trsl");
  const NUCLEI = [["tr.n.h", 1], ["tr.n.d", 2], ["tr.n.c", 12], ["tr.n.u", 238]];             // masse de la cible / masse du neutron, arrondie
  const frac = r => QteMvt.collide(1, r, 1, 0, 1).v2 ** 2 * r;                                // Ec de la cible / Ec du projectile
  function draw() {
    svg.innerHTML = "";
    const r = Math.pow(10, +sl.value), c = QteMvt.collide(1, r, 1, 0, 1);
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 260, x: { scale: "log", domain: [0.01, 300], label: t("tr.x") }, y: { domain: [0, 1.05], label: t("tr.y") } });
    let d = ""; for (let i = 0; i <= 200; i++) { const q = Math.pow(10, -2 + Math.log10(30000) * i / 200); d += (i ? "L" : "M") + x(q).toFixed(1) + " " + y(frac(q)).toFixed(1); }
    Plot.el("path", { d, class: "curve" }, g);
    NUCLEI.forEach(([k, A]) => { Plot.el("circle", { cx: x(A), cy: y(frac(A)), r: 4, class: "dot" }, g);
      const tx = Plot.el("text", { x: x(A), y: y(frac(A)) - 9, "text-anchor": "middle", class: "note" }, g); tx.textContent = t(k); });
    Plot.el("line", { x1: x(r), x2: x(r), y1: y(0), y2: y(1.05), class: "zero" }, g);
    Plot.el("circle", { cx: x(r), cy: y(frac(r)), r: 6, class: "dot" }, g);
    $("trread").textContent = F.num(r, 3);
    $("tf").textContent = F.qty(F.num(100 * frac(r), 3), "%");
    $("tv1").textContent = F.fix(c.v1, 3); $("tv2").textContent = F.fix(c.v2, 3);
  }
  sl.oninput = draw; draw();
})();

/* ---------- choc dans le plan : laboratoire ou centre de masse ---------- */
(() => {
  const svg = $("plane"), P = Plot.el, C = [370, 190], R1 = 22, msl = $("pmsl"), bsl = $("pbsl"), esl = $("pesl");
  let cm = false;
  const arrow = (a, b, cls, parent) => Plot.fleche(parent, a, b, { cls, tete: 10, min: 2 });
  const at = (p, v, k) => [p[0] + k * v[0], p[1] - k * v[1]];                    // y vers le haut à l'écran
  function draw() {
    svg.innerHTML = "";
    const m2 = +msl.value, b = +bsl.value, e = +esl.value, u1 = [1, 0], u2 = [0, 0];
    const r = QteMvt.collide2D(1, m2, u1, u2, b, e), V = cm ? r.vG : [0, 0];
    const R2 = R1 * Math.cbrt(m2), D = R1 + R2;
    const c2 = C, c1 = [C[0] - D * r.n[0], C[1] + D * r.n[1]];                   // au contact, 1 est à −n R de 2
    const f = v => QteMvt.inFrame(v, V), N = QteMvt.vec.norm;
    const K = 120 / Math.max(N(f(u1)), N(f(u2)), N(f(r.v1)), N(f(r.v2)));          // la plus longue flèche fait 120 px
    /* each arrow starts (after) or ends (before) on the rim of its disc, length proportional to the speed */
    const rim = (c, v, R, k) => { const n = N(v) || 1; return [c[0] + k * R * v[0] / n, c[1] - k * R * v[1] / n]; };
    const before = (c, v, R) => { if (N(v) < 1e-9) return; const e0 = rim(c, v, R + 4, -1);
      P("line", { x1: e0[0] - K * 1.6 * v[0], y1: e0[1] + K * 1.6 * v[1], x2: e0[0], y2: e0[1], class: "stroke thin dash c-label-2" }, svg);
      arrow(at(e0, v, -K), e0, "c-label-2", svg); };
    const after = (c, v, R, cls) => { if (N(v) < 1e-9) return; const s0 = rim(c, v, R + 2, 1); arrow(s0, at(s0, v, K), cls, svg); };
    before(c1, f(u1), R1); before(c2, f(u2), R2);
    P("circle", { cx: c1[0], cy: c1[1], r: R1, class: "fill c-tint" }, svg);
    P("circle", { cx: c2[0], cy: c2[1], r: R2, class: "fill c-warn" }, svg);
    P("line", { x1: c1[0], y1: c1[1], x2: c2[0], y2: c2[1], class: "stroke thin dash c-label" }, svg);
    after(c1, f(r.v1), R1, "c-tint bold"); after(c2, f(r.v2), R2, "c-warn bold");
    if (cm) { P("circle", { cx: (c1[0] + m2 * c2[0]) / (1 + m2), cy: (c1[1] + m2 * c2[1]) / (1 + m2), r: 4, class: "fill c-label" }, svg);
      const tx = P("text", { x: (c1[0] + m2 * c2[0]) / (1 + m2) + 8, y: (c1[1] + m2 * c2[1]) / (1 + m2) - 8 }, svg); tx.textContent = t("pl.glabel"); }
    const lab = P("text", { x: 16, y: 24 }, svg); lab.textContent = t(cm ? "pl.cm.title" : "pl.lab.title");
    $("pmread").textContent = F.num(m2, 2); $("pbread").textContent = F.fix(b, 2); $("peread").textContent = F.fix(e, 2);
    const ang = QteMvt.angleBetween(f(r.v1), f(r.v2)), defl = QteMvt.angleBetween(f(u1), f(r.v1));
    $("pang").textContent = isNaN(ang) ? "–" : F.fix(ang * DEG, 1) + "°";
    $("pdefl").textContent = isNaN(defl) ? "–" : F.fix(defl * DEG, 1) + "°";
    $("plost").textContent = F.qty(F.num(100 * r.lost / r.ec0, 3), "%");
    $("plostf").textContent = t("pl.f.lost", { s: F.num(100 * (1 - 1 / (1 + m2)), 3) });
    const pm = Math.hypot(...QteMvt.inFrame(r.p1, QteMvt.vec.scale(V, 1 + m2)));        // P vue du référentiel choisi : M v_G au labo, 0 au centre de masse
    $("pp").textContent = F.qty(F.fix(pm, 3), "kg·m·s⁻¹");
  }
  const setFrame = v => { cm = v; $("flab").setAttribute("aria-pressed", String(!v)); $("fcm").setAttribute("aria-pressed", String(v)); draw(); };
  $("flab").onclick = () => setFrame(false); $("fcm").onclick = () => setFrame(true);
  msl.oninput = bsl.oninput = esl.oninput = draw; draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["leibniz", 1686, "idea"], ["chadwick", 1932, "experiment"], ["fermi", 1934, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["moderateur", "fronde"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["mou", "a"], ["echange", "a"], ["pingpong", "a"], ["bowling", "a"], ["moderateur", "a"], ["billard", "a"], ["cm", "a"], ["minimum", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 104 });
})();
</script>
