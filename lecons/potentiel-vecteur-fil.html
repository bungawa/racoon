<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const M = MagInd, MU0 = Constantes.mu0;

/* ---------- A_z et B en unités réduites ; valeurs au point sonde ; fil de longueur finie ---------- */
(() => {
  const svg = $("courbes"), si = $("si"), sa = $("sa"), sr = $("sr"), sl = $("sl");
  const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44 },
    x: { domain: [0, 8], label: t("fig.x") }, y: { domain: [-2.2, 1.2], label: t("fig.y") } });
  /* reduced units: A_z/(μ0 I/2π) and B/B(a), independent of I and a */
  const red = { A: u => M.filA(1, 1, u) * 2 * Math.PI / MU0, B: u => M.filEpais(1, 1, u) / M.filEpais(1, 1, 1) };
  const curve = (f, cls) => { let d = ""; for (let i = 0; i <= 320; i++) { const u = 8 * i / 320; d += (i ? "L" : "M") + x(u).toFixed(1) + " " + y(f(u)).toFixed(1); }
    Plot.el("path", { d, class: "stroke " + cls }, g); };
  curve(red.A, "c-tint"); curve(red.B, "c-warn");
  Plot.el("line", { x1: x(1), x2: x(1), y1: y(-2.2), y2: y(1.2), class: "ref" }, g);
  Plot.el("text", { x: x(1) + 6, y: y(1.05), class: "note" }, g).textContent = t("fig.surface");
  const dA = Plot.el("circle", { r: 5, class: "fill c-tint" }, g), dB = Plot.el("circle", { r: 5, class: "fill c-warn" }, g);
  const rOf = () => 1e-4 * Math.pow(10, 3 * sr.value / 1000), lOf = () => 0.05 * Math.pow(10, 2 * sl.value / 1000);   // 0,1 mm – 10 cm ; 5 cm – 5 m
  function draw() {
    const Ia = +si.value, a = +sa.value / 1000, r = rOf(), L = lOf(), u = Math.min(r / a, 8);
    dA.setAttribute("cx", x(u)); dA.setAttribute("cy", y(red.A(u)));
    dB.setAttribute("cx", x(u)); dB.setAttribute("cy", y(red.B(u)));
    const p = [r, 0, 0], B = M.filEpais(Ia, a, r), rot = AnaVec.rotationnel(M.filChampA(Ia, a), p, 1e-6 * Math.max(r, a));
    const Bfini = Math.hypot(...M.segmentB(Ia, [0, 0, -L / 2], [0, 0, L / 2], p));
    $("sir").textContent = F.si(Ia, "A"); $("sar").textContent = F.si(a, "m", { prefix: "m" });
    $("srr").textContent = F.si(r, "m", { prefix: "m" }); $("slr").textContent = F.si(L, "m");
    $("vaz").textContent = F.si(M.filA(Ia, a, r), "T·m");
    $("faz").textContent = t("fig.f.ra", { x: F.num(r / a, 3) });
    $("vb").textContent = F.si(B, "T");
    $("fb").textContent = t("fig.f.rot", { v: F.si(rot[1], "T") });
    $("vf").textContent = F.si(Bfini, "T");
    $("ff").textContent = t("fig.f.ecart", { e: F.sci(1 - Bfini / B, 2), x: F.sci(2 * (r / L) ** 2, 2) });
  }
  si.oninput = sa.oninput = sr.oninput = sl.oninput = draw; draw();
})();

/* ---------- le système décrit : un fil de cuivre, puis un câble à deux conducteurs ---------- */
(() => {
  const Ia = 10, a = 1e-3, d = 5e-3, r = 1, seuil = 100e-6;
  const paire = M.champFils([{ I: Ia, x: -d / 2, y: 0 }, { I: -Ia, x: d / 2, y: 0 }], [0, r, 0]);
  $("sys1").innerHTML = t("sys1.body", { a: F.si(a, "m", { prefix: "m" }), I: F.si(Ia, "A"), bs: F.si(M.filEpais(Ia, a, a), "T"),
    b1: F.si(M.filEpais(Ia, a, r), "T"), seuil: F.si(seuil, "T"), rs: F.si(MU0 * Ia / (2 * Math.PI * seuil), "m", { prefix: "m" }),
    d: F.si(d, "m", { prefix: "m" }), bp: F.si(Math.hypot(...paire), "T"), rap: F.sci(Math.hypot(...paire) / M.filEpais(Ia, a, r), 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["biot", 1820, "experiment"], ["cgpm1948", 1948, "idea"], ["cgpm2018", 2018, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pince", "exposition"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["direction", "c"], ["constante", "a"], ["decade", "d"], ["dedans", "b"], ["fini", "a"], ["analogie", "c"], ["paire", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 143 });
})();
</script>
