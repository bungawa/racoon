<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantDeux;

/* ---------- T tilted by α about y: the nine probabilities |⟨iT|jS⟩|² of the module (formulas of « Le changement de base ») ---------- */
(() => {
  const sa = $("sa"), seg = $("dep"); let j = 0;
  const P = (a, i, jj) => Cx.abs2(Q.spin1Y(a)[i][jj]);
  const CLS = ["c-tint", "c-label", "c-warn"], IDS = ["vplus", "vzero", "vmoins"];
  function draw() {
    const a = +sa.value * Math.PI / 180, svg = $("courbes"); svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 260, x: { domain: [0, 180], label: t("fig.ax.alpha") }, y: { domain: [0, 1], label: t("fig.ax.p") } });
    const as = Array.from({ length: 181 }, (_, k) => k);
    for (let i = 0; i < 3; i++)
      Plot.el("path", { d: Plot.path(as.map(d => [ax.x(d), ax.y(P(d * Math.PI / 180, i, j))])), class: "stroke " + CLS[i], fill: "none" }, svg);
    Plot.el("line", { x1: ax.x(+sa.value), x2: ax.x(+sa.value), y1: ax.y(0), y2: ax.y(1), class: "stroke thin dash c-label" }, svg);
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.i === j)));
    $("sar").textContent = F.num(+sa.value, 3) + "\u00a0°";
    let s = 0;
    IDS.forEach((id, i) => { const p = P(a, i, j); s += p; $(id).textContent = F.num(p, 3); });
    $("vsomme").textContent = F.num(s, 4);
    $("fsomme").textContent = t("fig.f.somme", { m: F.num(P(a, 0, j) - P(a, 2, j), 3) });
  }
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { j = +b.dataset.i; draw(); });
  sa.oninput = draw; draw();
  const p1 = Cx.abs2(Q.spin1Y(Math.PI / 180)[1][0]), p5 = Cx.abs2(Q.spin1Y(5 * Math.PI / 180)[1][0]);
  $("sys1").innerHTML = t("sys1.body", { p1: F.sci(p1, 2), p5: F.sci(p5, 2), N: F.num(Math.round(1 / p1), 2) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["rabi", 1938, "experiment"], ["deuton", 1939, "experiment"], ["nobel", 1944, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["irm"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["neuf", "b"], ["somme", "d"], ["inverse", "a"], ["zero90", "c"], ["classique", "b"], ["choix", "a"], ["neuf2", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 502 });
})();
</script>
