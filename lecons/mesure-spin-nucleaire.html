<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const Q = QuantSchro, DEG = Math.PI / 180;
const SPIN = { 580: 1, 563: 3 };                        // the assignments of the source for the two states of ²⁰Ne*
const ANGLES = Array.from({ length: 19 }, (_, i) => i * 5 * DEG);

/* ---------- a simulated angular correlation: counts against [P_j(cos θ)]², for each hypothesis j ---------- */
(() => {
  const svg = $("comptages"), sn = $("sn"), segE = $("etats"), segJ = $("hyp");
  let etat = 563, j = 1, graine = 1805, n = null;
  const alea = () => { graine = (graine * 1664525 + 1013904223) % 4294967296; return graine / 4294967296; };
  const tirer = () => { n = Q.comptagesSimules(SPIN[etat], ANGLES, Math.round(10 ** +sn.value), alea); };
  function draw() {
    if (!n) tirer();
    const top = 1.15 * Math.max(...n.map(v => v + Math.sqrt(v))) || 1;
    svg.innerHTML = "";
    const ax = Plot.axes(svg, { fmt: F, w: 640, h: 300, pad: { b: 44, l: 64 },
      x: { domain: [0, 90], label: t("fig.x"), fmt: v => F.num(v, 3) + "°" }, y: { domain: [0, top], label: t("fig.y") } });
    const fit = Q.chi2Spin(n, ANGLES, j), c = [];
    for (let i = 0; i <= 180; i++) { const th = i / 2 * DEG; c.push([ax.x(i / 2), ax.y(Math.min(top, fit.a * Q.correlationSpin(j, th) + fit.b))]); }
    Plot.el("path", { d: Plot.path(c), class: "stroke bold c-tint" }, ax.g);
    n.forEach((v, i) => { const x = ax.x(i * 5), e = Math.sqrt(Math.max(v, 1));
      Plot.el("line", { x1: x, x2: x, y1: ax.y(Math.max(0, v - e)), y2: ax.y(Math.min(top, v + e)), class: "stroke c-warn" }, ax.g);
      Plot.el("circle", { cx: x, cy: ax.y(v), r: 3.5, class: "fill c-warn" }, ax.g); });
    const chis = [0, 1, 2, 3, 4].map(k => Q.chi2Spin(n, ANGLES, k).chi2 / Q.chi2Spin(n, ANGLES, k).ddl), best = chis.indexOf(Math.min(...chis));
    $("snr").textContent = F.num(Math.round(10 ** +sn.value), 3);
    $("vchi").textContent = F.num(fit.chi2 / fit.ddl, 3);
    $("fchi").textContent = t(fit.chi2 / fit.ddl < 2 ? "fig.f.accord" : "fig.f.rejet");
    $("vbest").textContent = t("fig.v.best", { j: best });
    $("fbest").textContent = t("fig.f.best", { v: F.num(chis[best], 3) });
    segE.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.e === etat)));
    segJ.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.j === j)));
  }
  segE.querySelectorAll("button").forEach(b => b.onclick = () => { etat = +b.dataset.e; tirer(); draw(); });
  segJ.querySelectorAll("button").forEach(b => b.onclick = () => { j = +b.dataset.j; draw(); });
  $("tirer").onclick = () => { tirer(); draw(); };
  sn.oninput = () => { tirer(); draw(); }; draw();
})();

/* ---------- the system described: where the zeros of P_j fall ---------- */
(() => {
  const zero = k => { let lo = 0, hi = 80 * DEG; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (Math.sign(Q.legendre(k, Math.cos(m))) === Math.sign(Q.legendre(k, Math.cos(lo)))) lo = m; else hi = m; } return lo / DEG; };
  $("sys1").innerHTML = t("sys1.body", { z1: F.num(90, 2), z2: F.num(zero(2), 3), z3: F.num(zero(3), 3) });
  $("sys2").innerHTML = t("sys2.body");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["hamilton", 1940, "idea"], ["brady", 1947, "experiment"], ["aeppli", 1951, "experiment"], ["abragam", 1953, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["pac"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["zero", "b"], ["axe", "d"], ["un", "a"], ["trois", "c"], ["pourquoi", "b"], ["statistique", "a"], ["noeud", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1805 });
})();
</script>
