<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Électrolyse du chlorure de sodium</title>
<link rel="stylesheet" href="/racoon/ds.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="crumb"><a href="/racoon/" data-i18n="crumb.parcours"></a><span class="aux">›</span><a href="/racoon/#monde-chim-solutions" data-i18n="monde.chim-solutions"></a><span class="aux">›</span><a href="/racoon/etape?id=chim-industrie-minerale" data-i18n="etape.chim-industrie-minerale"></a><span class="aux">›</span><span data-i18n="crumb.jour"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n-html="lede"></p>
    <div class="tags">
      <a class="chip t-chim" href="/racoon/atlas?piste=chim" data-i18n="tag.piste"></a>
      <a class="chip plain" href="/racoon/lecons/courbes-intensite-potentiel" data-i18n="tag.prereq"></a>
    </div>
  </header>

  <section class="card">
    <span class="sec" data-i18n="s1.sec"></span>
    <h2 data-i18n="s1.h2"></h2>
    <p data-i18n-html="s1.p1"></p>
    <div class="eq" data-i18n-html="eq.bilan"></div>
    <p class="validite" data-i18n-html="val.bilan"></p>
    <div class="list keyed" id="cellule"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s2.sec"></span>
    <h2 data-i18n="s2.h2"></h2>
    <p data-i18n-html="s2.p1"></p>
    <div class="eq" data-i18n-html="eq.anode"></div>
    <p class="validite" data-i18n-html="val.anode"></p>
    <p data-i18n-html="s2.p2"></p>
    <div class="eq" data-i18n-html="eq.cathode"></div>
    <p class="validite" data-i18n-html="val.cathode"></p>
    <p data-i18n-html="s2.p3"></p>
    <div class="list keyed" id="techniques"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s3.sec"></span>
    <h2 data-i18n="s3.h2"></h2>
    <p data-i18n-html="s3.p1"></p>
    <div class="eq" data-i18n-html="eq.urev"></div>
    <p class="validite" data-i18n-html="val.urev"></p>
    <p data-i18n-html="s3.p2"></p>
    <div class="eq" data-i18n-html="eq.tension"></div>
    <p class="validite" data-i18n-html="val.tension"></p>
    <div class="eq" data-i18n-html="eq.energie"></div>
    <p class="validite" data-i18n-html="val.energie"></p>
    <figure class="chart">
      <div class="panel">
        <div class="seg" role="group" id="tech" data-i18n-attr="aria-label:fig.tech">
          <button type="button" data-t="membrane" data-i18n="fig.t.membrane"></button>
          <button type="button" data-t="diaphragme" data-i18n="fig.t.diaphragme"></button>
          <button type="button" data-t="mercure" data-i18n="fig.t.mercure"></button>
        </div>
        <div class="controls">
          <div class="ctl"><div class="row"><label for="dens" data-i18n="fig.j"></label><output id="densv" for="dens"></output></div>
            <input id="dens" type="range" min="500" max="15000" step="100" value="5000"></div>
        </div>
      </div>
      <svg class="fig" id="ucell" role="img" data-i18n-attr="aria-label:fig.aria"></svg>
      <div class="legend"><span class="c-tint" data-i18n="fig.leg.choisie"></span><span class="c-label-2" data-i18n="fig.leg.autres"></span><span class="c-label" data-i18n="fig.leg.rev"></span></div>
      <div class="stats">
        <div class="stat"><span class="k" data-i18n="fig.k.U"></span><span class="v" id="vU"></span><span class="f" id="fU"></span></div>
        <div class="stat"><span class="k" data-i18n="fig.k.w"></span><span class="v" id="vw"></span><span class="f" data-i18n="fig.f.w"></span></div>
        <div class="stat"><span class="k" data-i18n="fig.k.m"></span><span class="v" id="vm"></span><span class="f" data-i18n="fig.f.m"></span></div>
      </div>
      <figcaption data-i18n-html="fig.caption"></figcaption>
    </figure>
  </section>

  <section class="card">
    <span class="sec" data-i18n="s4.sec"></span>
    <h2 data-i18n="s4.h2"></h2>
    <p data-i18n-html="s4.p1"></p>
    <div class="box rem"><b data-i18n="s4.rem.title"></b>
      <p data-i18n-html="s4.rem.body"></p>
    </div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="hist.sec"></span>
    <h2 data-i18n="hist.h2"></h2>
    <p data-i18n-html="hist.intro"></p>
    <div id="history"></div>
    <h3 data-i18n="uses.h3"></h3>
    <div class="list keyed" id="uses"></div>
  </section>

  <section class="card">
    <span class="sec" data-i18n="quiz.sec"></span>
    <h2 data-i18n="quiz.h2"></h2>
    <div id="quiz"></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</main>

<script src="/racoon/i18n.js"></script>
<script src="/racoon/locales/fr/kit.js"></script>
<script src="/racoon/locales/fr/parcours.js"></script>
<script src="/racoon/locales/fr/sigles.js"></script>
<script src="/racoon/sigles.js"></script>
<script src="/racoon/liens.js"></script>
<script src="/racoon/parcours.js"></script>
<script src="/racoon/navigation.js"></script>
<script src="/racoon/locales/fr/lecons/electrolyse-chlorure-de-sodium.js"></script>
<script src="/racoon/fmt.js"></script>
<script src="/racoon/plot.js"></script>
<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/chim-solutions.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id), C = ChimSolutions, H = C.Industrie;
const keyed = (id, k, ids) => { const txt = textOf(k, ids); $(id).innerHTML = ids.map(i => `<div><span class="k">${txt[i].k}</span><span>${txt[i].v}</span></div>`).join(""); };
keyed("cellule", "s1.cellule", ["saumure", "anode", "cathode", "membrane"]);
keyed("techniques", "s2.techniques", ["membrane", "diaphragme", "mercure"]);

/* ---------- §3 : tension de cellule et énergie ---------- */
(() => {
  const J = [0, 15000], Y = [2, 5.5], RENDEMENT = 0.95, TECH = Object.keys(H.CELLULES);
  let tech = "membrane";
  function draw() {
    const j = +$("dens").value, c = H.CELLULES[tech], svg = $("ucell");
    $("densv").textContent = F.qty(F.fix(j / 1000, 1), "kA·m⁻²");
    $("tech").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === tech)));
    svg.innerHTML = "";
    const { x, y, g } = Plot.axes(svg, { fmt: F, w: 640, h: 340, x: { domain: J, label: t("fig.ax.x"), fmt: v => F.num(v / 1000, 3) },
      y: { domain: Y, label: t("fig.ax.y"), fmt: v => F.fix(v, 1) } });
    const ur = H.uRev(14);
    Plot.el("path", { d: Plot.path(J.map(v => [x(v), y(ur)])), class: "stroke dash c-label" }, g);
    for (const k of TECH) {
      const r = H.CELLULES[k].j, pts = r.map(v => [x(v), y(H.tensionCellule(k, v))]);
      Plot.el("path", { d: Plot.path(pts), class: k === tech ? "stroke bold c-tint" : "stroke thin c-label-2" }, g);
      if (k === tech) Plot.el("text", { x: pts[1][0] - 4, y: pts[1][1] + 18, "text-anchor": "end", class: "fill c-tint" }, g).textContent = t("fig.t." + k);
    }
    const U = H.tensionCellule(tech, j), dans = j >= c.j[0] && j <= c.j[1];
    Plot.el("circle", { cx: x(j), cy: y(U), r: 5, class: "fill c-tint" }, g);
    $("vU").textContent = F.qty(F.fix(U, 2), "V");
    $("fU").textContent = t(!dans ? "fig.f.hors" : tech === "mercure" ? "fig.f.Uhg" : "fig.f.U", { r: F.fix(ur, 2), s: F.fix(U - ur, 2) });   // the 2,19 V of H₂ does not apply to the amalgam cathode
    $("vw").textContent = F.qty(F.fix(H.energieChlore(U, RENDEMENT) / 1e6, 1), "MJ·kg⁻¹");
    $("vm").textContent = F.qty(F.fix(C.masseFaraday(j, 86400, H.masse("Cl2"), 2, RENDEMENT), 0), "kg");
  }
  $("dens").oninput = draw;
  $("tech").querySelectorAll("button").forEach(b => b.onclick = () => { tech = b.dataset.t; draw(); });
  draw();
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["scheele", 1774, "experiment"], ["davy", 1810, "idea"], ["castner", 1892, "use"], ["membrane", 1975, "use"], ["mercure", 2017, "use"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["parts", "capacite", "javel"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["anode", "c"], ["cathode", "a"], ["mercure", "d"], ["membrane", "b"], ["tension", "a"], ["energie", "c"], ["soude", "d"], ["densite", "b"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 1892 });
})();
</script>
</body>
</html>
