<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const O = OptOnd, K = Constantes;

/* ---------- le système décrit : l'air au-dessus d'un lieu au niveau de la mer, et l'électron dans la lumière du Soleil ---------- */
(() => {
  const r = O.epaisseurRayleigh(550e-9), a = O.epaisseurRayleigh(450e-9).tau, b = O.epaisseurRayleigh(650e-9).tau;
  $("sys1").innerHTML = t("sys1.body", { N: F.sci(r.N, 3), nm1: F.sci(O.indiceAir(550e-9), 3), sig: F.sci(r.sigma, 2), col: F.sci(r.colonne, 2),
    tau: F.num(r.tau, 2), a: F.num(a, 2), b: F.num(b, 2), ratio: F.num(a / b, 2), d: F.si(Math.cbrt(1 / r.N), "m") });
  const S = K.L_sun / (4 * Math.PI * K.au ** 2), E0 = Math.sqrt(2 * S / (K.eps0 * K.c)), w0 = 2 * Math.PI * K.c / 100e-9, w = 2 * Math.PI * K.c / 550e-9;
  const x0 = K.e * E0 / (K.m_e * (w0 * w0 - w * w));
  $("sys2").innerHTML = t("sys2.body", { S: F.si(S, "W·m⁻²", { sig: 4 }), E0: F.si(E0, "V·m⁻¹"), x: F.sci(x0, 1), v: F.sci(w * x0, 1), vc: F.sci(w * x0 / K.c, 1) });
})();

/* ---------- ciel et Soleil selon la hauteur du Soleil ---------- */
(() => {
  const sh = $("sh"), sw = $("teintes"), sp = $("spectre");
  const L = Array.from({ length: 81 }, (_, i) => 380e-9 + 5e-9 * i);
  const rgb = c => "rgb(" + c.rgb.join(" ") + ")";
  function draw() {
    const h = +sh.value, s = CielRayleigh.ciel(h * Math.PI / 180);
    const Bv = L.map(s.B), Sv = L.map(s.soleil), Zv = L.map(s.zenith), mx = a => Math.max(...a);
    const cs = CouleursOptiques.couleurSpectre(s.soleil), cz = CouleursOptiques.couleurSpectre(s.zenith);
    sw.innerHTML = "";
    Plot.el("rect", { x: 56, y: 8, width: 260, height: 54, rx: 6, fill: rgb(cz) }, sw);
    Plot.el("rect", { x: 340, y: 8, width: 260, height: 54, rx: 6, fill: rgb(cs) }, sw);
    Plot.el("text", { x: 186, y: 40, "text-anchor": "middle", class: "tick" }, sw).textContent = t("fig.sw.ciel");
    Plot.el("text", { x: 470, y: 40, "text-anchor": "middle", class: "tick" }, sw).textContent = t("fig.sw.soleil");
    sp.innerHTML = "";
    const P = Plot.axes(sp, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [380, 780], label: t("fig.xaxis") }, y: { domain: [0, 1.1], label: t("fig.yaxis") } });
    const courbe = (v, cls) => { const m = mx(v); Plot.el("path", { d: Plot.path(L.map((l, i) => [P.x(l * 1e9), P.y(v[i] / m)])), class: cls }, P.g); };
    courbe(Bv, "stroke thin c-label-2"); courbe(Sv, "stroke bold c-warn"); courbe(Zv, "stroke bold c-tint");
    $("shr").textContent = F.qty(F.num(h, 3), "°");
    $("vm").textContent = F.num(s.m, 3);
    $("fm").textContent = t("fig.f.m");
    const T = l => Math.exp(-s.tau(l) * s.m);
    $("vt").textContent = F.num(100 * T(450e-9), 2) + " %";
    $("ft").textContent = t("fig.f.t", { r: F.num(100 * T(650e-9), 2) + " %" });
    const bleu = s.zenith(450e-9) / s.B(450e-9), rouge = s.zenith(650e-9) / s.B(650e-9);
    $("vc").textContent = F.num(bleu / rouge, 2);
    $("fc").textContent = t("fig.f.c", { q: F.num((650 / 450) ** 4, 3) });
  }
  sh.oninput = draw; draw();
})();

/* ---------- une goutte qui grossit ---------- */
(() => {
  const nEau = 1000 / (18.015e-3 / K.N_A), a = 10e-9, N = nEau * 4 / 3 * Math.PI * a ** 3, l = 550e-9;
  $("sys3").innerHTML = t("sys3.body", { n: F.sci(nEau, 2), a: F.si(a, "m"), N: F.sci(N, 2), ka: F.num(2 * Math.PI * a / l, 2), amax: F.si(l / (2 * Math.PI), "m"), Nmax: F.sci(nEau * 4 / 3 * Math.PI * (l / (2 * Math.PI)) ** 3, 1) });
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["arago", 1809, "experiment"], ["tyndall", 1869, "experiment"], ["rayleigh", 1871, "idea"], ["mie", 1908, "idea"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["photometre"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["cote", "b"], ["section", "d"], ["seize", "a"], ["thomson", "c"], ["indice", "b"], ["couchant", "d"], ["nuage", "a"], ["blanc", "c"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 325 });
})();
</script>
