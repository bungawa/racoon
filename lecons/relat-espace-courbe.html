<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
document.title = t("title");
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
F.autoTypo(document.querySelector("main"));
const $ = id => document.getElementById(id);
const E = EspacesCourbes, Cst = Constantes;
const R_T = Cst.R_E_mean, M_T = Cst.GM_E / Cst.G;

/* ---------- une sphère centrée sur la Terre, de rayon prédit r : son excès de rayon ---------- */
(() => {
  const NOYAU = 3.48e6, FRAC = 0.325;                              // m, rayon du noyau (PREM) ; part de la masse dans le noyau
  const m2 = E.masseDeuxCouches(M_T, R_T, FRAC * M_T, NOYAU);
  const mC = r => r < R_T ? m2(r) : M_T, mH = r => r < R_T ? M_T * (r / R_T) ** 3 : M_T;
  const loi = r => E.excesEinstein(Cst.G * mH(r));                 // (42.3) appliquée avec la masse intérieure
  const trace = $("trace"), sr = $("sr");
  const ks = Array.from({ length: 121 }, (_, i) => 0.025 * i + 1e-6);
  const cC = ks.map(k => E.excesProfil(mC, k * R_T, 600)), cH = ks.map(k => E.excesProfil(mH, k * R_T, 600));
  function draw() {
    const k = +sr.value, r = k * R_T;
    trace.innerHTML = "";
    const P = Plot.axes(trace, { fmt: F, w: 640, h: 260, pad: { l: 56, b: 44 }, x: { domain: [0, 3], label: t("fig.xaxis") }, y: { domain: [0, 8], label: t("fig.yaxis") } });
    Plot.el("line", { x1: P.x(1), x2: P.x(1), y1: P.y(0), y2: P.y(8), class: "zero" }, P.g);
    Plot.el("path", { d: Plot.path(ks.map(x => [P.x(x), P.y(1000 * loi(x * R_T))])), class: "stroke dash c-ok" }, P.g);
    Plot.el("path", { d: Plot.path(ks.map((x, i) => [P.x(x), P.y(1000 * cH[i])])), class: "ref" }, P.g);
    Plot.el("path", { d: Plot.path(ks.map((x, i) => [P.x(x), P.y(1000 * cC[i])])), class: "curve" }, P.g);
    const vC = E.excesProfil(mC, r, 2000), vH = E.excesProfil(mH, r, 2000), vL = loi(r);
    Plot.el("circle", { cx: P.x(k), cy: P.y(1000 * vC), r: 5, class: "dot" }, P.g);
    $("srr").textContent = t("fig.rv", { k: F.num(k, 3), r: F.qty(F.num(r / 1000, 4), "km") });
    $("vc").textContent = F.si(vC, "m", { prefix: "m" });
    $("fc").textContent = t("fig.f.masse", { m: F.num(100 * mC(r) / M_T, 3) });
    $("vh").textContent = F.si(vH, "m", { prefix: "m" });
    $("fh").textContent = t("fig.f.masse", { m: F.num(100 * mH(r) / M_T, 3) });
    $("vl").textContent = F.si(vL, "m", { prefix: "m" });
    const ecart = 100 * (vL / vH - 1);
    $("fl").textContent = t("fig.f.loi", { p: F.num(Math.abs(ecart) < 0.05 ? 0 : ecart, 2) });
  }
  sr.oninput = draw; draw();
})();

/* ---------- le système décrit : quatre astres, du linéaire au compact ---------- */
(() => {
  const S = Cst.GM_sun;
  /* Terre et Soleil : valeurs nominales ; Sirius B : 1,02 masse solaire, 0,0084 rayon solaire ; PSR J0030+0451 : 1,34 masse solaire, 12,71 km */
  const ASTRES = [["terre", Cst.GM_E, R_T], ["soleil", S, Cst.R_sun], ["sirius", 1.02 * S, 0.0084 * Cst.R_sun], ["pulsar", 1.34 * S, 12710]];
  const txt = textOf("astres", ASTRES.map(a => a[0]));
  $("astres").innerHTML = ASTRES.map(([id, GM, R]) => {
    const lin = E.excesEinstein(GM), ex = E.excesHomogene(GM, R);
    return `<div><span class="k">${txt[id]}</span><span>${t("astre.ligne", { phi: F.sci(GM / (Cst.c ** 2 * R), 2), lin: F.si(lin, "m"), ex: F.si(ex, "m"), d: F.sci(ex / lin - 1, 2) })}</span></div>`;
  }).join("");
})();

/* ---------- histoire ---------- */
(() => {
  const EVENTS = [["eclipse", 1919, "experiment"], ["cassini", 2003, "experiment"], ["planck", 2018, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["euclid"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["terre", "c"], ["masse", "a"], ["dehors", "d"], ["soleil", "b"], ["grande", "c"], ["lumiere", "b"], ["univers", "d"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 423 });
})();
</script>
