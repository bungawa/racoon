<script src="/racoon/i18n.js"></script>

<script src="/racoon/locales/fr/questions/quand-oublier-la-relativite.js"></script>
<script src="/racoon/fmt.js"></script>

<script src="/racoon/quiz.js"></script>
<script src="/racoon/timeline.js"></script>
<script src="/racoon/constantes.js"></script>
<script src="/racoon/questions/quand-oublier-la-relativite.js"></script>
<script>
const I = I18n.boot(self.LOCALES), t = I.t;
const F = Fmt.forLang(I.lang === I18n.PSEUDO ? I18n.FALLBACK : I.lang);
F.autoTypo(document.querySelector("main"));
/* Structure lives here, text in the table: both must name the same ids. */
const textOf = (k, ids) => { const all = t(k), extra = Object.keys(all).filter(id => !ids.includes(id)), lost = ids.filter(id => !all[id]);
  if (extra.length || lost.length) throw new Error(k + ": no text for [" + lost + "], unused text [" + extra + "]"); return all; };
const $ = id => document.getElementById(id);
const R = OubliRelat, C = R.C;
const sci = (x, n) => x === 0 ? "0" : F.sci(x, n || 2);
const zf = z => z < 0.01 ? sci(z) : F.num(z, 2);
const signed = (s, x) => (x > 0 ? "+" : x < 0 ? F.MINUS : "") + s;
const dur = x => signed(F.si(Math.abs(x), "s", { sig: 3 }), x);            // durée signée, préfixe SI automatique
const speed = v => v >= 1 && v < 1e6 ? F.si(v, "m·s⁻¹", { sig: 3 }) : F.qty(sci(v, 3), "m·s⁻¹");
const len = x => x >= 1e3 ? F.si(x, "m", { prefix: "k", sig: 3 }) : F.si(x, "m", { sig: 2 });
const betaTxt = o => o.beta < 0.999 ? (o.beta < 1e-3 ? sci(o.beta, 2) : F.num(o.beta, 3)) : "1 " + F.MINUS + " " + sci(o.oneMinusBeta, 2);

/* ---------- 1. les trois nombres, pour le GPS ---------- */
(() => {
  const g = R.gps(), d = R.describe({ v: g.v, dh: R.GPS_A - R.R_E, L: R.GPS_A - R.R_E, dt: R.DAY });
  const ROWS = [["b2", d.beta2], ["phi", d.phi], ["prop", d.prop]], txt = textOf("nombres.rows", ROWS.map(r => r[0]));
  $("nombres").innerHTML = ROWS.map(([id, v]) => `<div><span class="k">${txt[id].name}</span><span>${txt[id].text}</span><span class="v">${sci(v)}</span></div>`).join("");
})();

/* ---------- 2. β sur dix-huit ordres de grandeur ---------- */
(() => {
  const OBJ = R.objets(), txt = textOf("objets.rows", OBJ.map(o => o.id));
  $("objets").innerHTML = OBJ.map(o => `<div><span class="k">${txt[o.id].name}</span><span>${txt[o.id].text}</span><span class="v">${betaTxt(o)}</span></div>`).join("");
  const sl = $("bsl");
  const upd = () => {
    const o = R.fromProper(Math.pow(10, +sl.value)), b = o.beta < 1 ? o.beta : 1 - o.oneMinusBeta;
    $("bread").textContent = speed(o.beta * C);
    $("bbeta").textContent = betaTxt(o);
    $("bb2").textContent = sci(o.beta * o.beta);
    $("bec").textContent = o.beta < 0.999 ? sci(R.kineticNewtonError(b)) : F.num(R.kineticNewtonError(Math.min(b, 1 - 1e-15)), 4);
    const dist = x => Math.abs(Math.log10(x.beta * (x.gamma || 1)) - +sl.value), near = OBJ.reduce((a, x) => dist(x) < dist(a) ? x : a);
    $("bnear").textContent = t("beta.near", { name: txt[near.id].name });
  };
  sl.oninput = upd; upd();
})();

/* ---------- 3. bilan des corrections : erreur relative et erreur absolue, cas concrets ---------- */
(() => {
  const car = 30 / C, m = 1500, iss = R.orbitSpeed(R.R_E + R.ISS_H) / C, w = R.addVelocities(1.5, 300 / 3.6);
  const ROWS = [
    ["ec", R.kineticNewtonError(car), F.si(0.5 * m * 900 * R.kineticNewtonError(car), "J", { sig: 2 })],
    ["p", R.momentumNewtonError(car), F.qty(sci(m * 30 * R.momentumNewtonError(car)), "kg·m·s⁻¹")],
    ["w", w.rel, F.qty(sci(w.abs, 2), "m·s⁻¹")],
    ["t", R.oneMinusInvGamma(iss), F.si(R.oneMinusInvGamma(iss) * R.DAY, "s", { sig: 3 })],
    ["t2", R.dilationFirstOrderRest(iss), F.si(R.dilationFirstOrderRest(iss) * R.DAY, "s", { sig: 2 })],
  ];
  const txt = textOf("corrections.rows", ROWS.map(r => r[0]));
  $("corrections").innerHTML = ROWS.map(([id, rel, abs]) => `<div><span class="k">${txt[id].name}</span><span>${t("corrections.line", { what: txt[id].text, rel: sci(rel) })}</span><span class="v">${abs}</span></div>`).join("");
})();

/* ---------- 4. instruments ---------- */
(() => {
  const IDS = Object.keys(R.INSTRUMENTS), txt = textOf("instruments.rows", IDS);
  const val = i => { const x = R.INSTRUMENTS[i]; return x.ua ? F.si(x.ua, "s", { sig: 1 }) : sci(x.ur, 2); };
  $("instruments").innerHTML = IDS.map(i => `<div><span class="k">${txt[i].name}</span><span>${txt[i].text}</span><span class="v">${val(i)}</span></div>`).join("");
})();

/* ---------- 5. votre système ---------- */
(() => {
  const sl = { v: $("vsl"), dh: $("hsl"), L: $("lsl"), dt: $("tsl") }, pre = $("preset"), ins = $("instr");
  const PW = 640, PH = 320, XD = [1e-8, 1], YD = [1e-32, 1];
  const yfmt = v => { const e = Math.round(Math.log10(v)); return e % 8 === 0 ? "10" + F.sup(e) : ""; };
  const { x, y, g } = Plot.axes($("echart"), { fmt: F, w: PW, h: PH, pad: { b: 44 },
    x: { scale: "log", domain: XD, label: t("chart.x") }, y: { scale: "log", domain: YD, label: t("chart.y"), fmt: yfmt } });
  const path = f => { let d = ""; for (let i = 0; i <= 240; i++) { const b = Math.min(Math.pow(10, -8 + 8 * i / 240), 0.999), e = Math.max(f(b), YD[0]);
    d += (i ? "L" : "M") + x(b).toFixed(1) + " " + y(e).toFixed(1); } return d; };
  Plot.el("path", { d: path(R.kineticNewtonError), class: "curve" }, g);
  Plot.el("path", { d: path(R.kineticSecondError), class: "curve" }, g);
  Plot.el("path", { d: path(R.kineticNewtonLead), class: "ref" }, g);
  Plot.el("path", { d: path(R.kineticSecondLead), class: "ref" }, g);
  const NOTES = [["newton", 1e-5, R.kineticNewtonError(1e-5)], ["second", 1e-4, R.kineticSecondError(1e-4)]], notes = textOf("chart.notes", NOTES.map(n => n[0]));
  NOTES.forEach(([id, b, e]) => { Plot.el("text", { x: x(b) + 6, y: y(e) - 8, class: "note" }, g).textContent = notes[id]; });
  const hline = Plot.el("line", { x1: x(XD[0]), x2: x(XD[1]), class: "zero" }, g), hlab = Plot.el("text", { x: x(XD[0]) + 6, class: "note" }, g);
  const dot1 = Plot.el("circle", { r: 5, class: "dot" }, g), dot2 = Plot.el("circle", { r: 5, class: "dot" }, g);
  const clampY = e => y(Math.min(Math.max(e, YD[0]), YD[1]));

  const upd = () => {
    const o = {}; for (const k in sl) o[k] = exact && k in exact ? exact[k] : Math.pow(10, +sl[k].value);   // valeurs exactes du système type tant qu'on n'a pas bougé le curseur
    const I0 = R.INSTRUMENTS[ins.value], b = R.budget(Object.assign({}, o, I0));
    $("vread").textContent = speed(o.v); $("hread").textContent = len(o.dh); $("lread").textContent = len(o.L);
    $("tread").textContent = o.dt < 1e6 ? F.qty(F.num(o.dt, 3), "s") : t("calc.days", { n: F.num(o.dt / R.DAY, 3) });
    $("ob2").textContent = sci(b.beta2); $("ophi").textContent = sci(b.phi); $("oprop").textContent = sci(b.prop);
    $("opropf").textContent = t(b.zProp > R.Z_SEUIL ? "calc.prop.see" : "calc.prop.no", { d: F.si(b.delay, "s", { sig: 2 }) });
    $("okin").textContent = signed(sci(Math.abs(b.kin)), b.kin); $("okinf").textContent = t("calc.over", { d: dur(b.offsetKin), z: zf(b.zKin) });
    $("ograv").textContent = signed(sci(Math.abs(b.grav)), b.grav); $("ogravf").textContent = t("calc.over", { d: dur(b.offsetGrav), z: zf(b.zGrav) });
    $("onet").textContent = signed(sci(Math.abs(b.net)), b.net); $("onetf").textContent = t("calc.over.net", { d: dur(b.offset) });
    $("oec").textContent = sci(b.kinetic);
    $("ou").textContent = F.si(b.u, "s", { sig: 2 }); $("ouf").textContent = t("calc.u.f", { r: sci(b.urEff) });
    $("oz").textContent = zf(b.z);
    $("verdict").textContent = t("calc.verdict." + b.verdict, { z: zf(b.z) });
    const beta = Math.min(Math.max(b.beta, XD[0]), 0.999);
    [dot1, dot2].forEach(d => d.setAttribute("cx", x(beta)));
    dot1.setAttribute("cy", clampY(R.kineticNewtonError(beta))); dot2.setAttribute("cy", clampY(R.kineticSecondError(beta)));
    const ur = Math.min(Math.max(b.urEff, YD[0]), YD[1]);
    hline.setAttribute("y1", y(ur)); hline.setAttribute("y2", y(ur)); hlab.setAttribute("y", y(ur) - 6); hlab.textContent = t("chart.instr");
  };
  let exact = null;
  const apply = () => { const p = R.PRESETS[pre.value]; exact = Object.assign({}, p); sl.v.value = Math.log10(p.v); sl.dh.value = Math.log10(p.dh); sl.L.value = Math.log10(p.L); sl.dt.value = Math.log10(p.dt); ins.value = p.instr; upd(); };
  Object.entries(sl).forEach(([k, s]) => { s.oninput = () => { if (exact) delete exact[k]; upd(); }; }); ins.onchange = upd; pre.onchange = apply; apply();
})();

  const NOTIONS = ["relat_restreinte", "relat_energie", "mesure", "cinematique"], txt = textOf("liens.items", NOTIONS);

(() => {
  const EVENTS = [["einstein", 1905, "idea"], ["bucherer", 1908, "experiment"], ["hafele", 1971, "experiment"], ["nts2", 1977, "use"], ["chou", 2010, "experiment"], ["brewer", 2019, "experiment"]];
  const txt = textOf("hist.events", EVENTS.map(e => e[0]));
  Timeline.mount($("history"), EVENTS.map(([id, year, kind]) => Object.assign({ year, kind }, txt[id])), { t });
  const USES = ["gps", "lhc", "ingenierie"], uses = textOf("uses.items", USES);
  $("uses").innerHTML = USES.map(id => `<div><span class="k">${t("uses.tag")}</span><span><strong>${uses[id].name}.</strong> ${uses[id].text}</span></div>`).join("");
})();

/* ---------- quiz ---------- */
(() => {
  const QS = [["absolue", "a"], ["relative", "a"], ["ordre", "a"], ["critere", "a"], ["duree", "a"], ["compense", "a"], ["chiffres", "a"]];
  const txt = textOf("quiz.items", QS.map(q => q[0]));
  Quiz.mount($("quiz"), QS.map(([id, correct]) => {
    const q = txt[id];
    return { id, correct, prompt: q.prompt, why: q.why, hint: q.hint, options: Object.entries(q.options).map(([oid, text]) => ({ id: oid, text })) };
  }), { t, seed: 17 });
})();
